，珠簾旁一張梳妝台畔坐著一人，身穿粉紅衣衫，左手拿著一個繡花綳架，右手持著一枚繡花針，抬起頭來，臉有詫異之色。</p>\n\t\t\t<p>但這人臉上的驚訝神態，卻又遠不如任我行等人之甚。除了令狐冲之外，眾人都認得這人明明便是奪取了日月神教教主之位、十餘年來號稱武功天下第一的東方不敗。可是此刻他剃光了鬍鬚，臉上竟然施了脂粉，身上那件衣衫式樣男不男、女不女，顏色之妖，便穿在盈盈身上，也顯得太嬌艷、太刺眼了些。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這個東方不敗的聲音是男人的，可是說話的音調口氣卻是女人的；他的身材體型看起來是男人，可是他的動作卻是女人的。金庸這樣寫，就讓讀者對於東方不敗這個人，以及奉他為精神領袖的這個組織，立刻感覺到一股邪惡、一種厭惡。</p>\n\t\t\t<p>不管是《葵花寶典》還是《辟邪劍譜》，兩者的共同之處，在於讓讀者感到武功本身是邪惡的。在當時的時代環境下，金庸選擇了一個相對方便的方法，找到在讀者心裡最不舒服的一種形象。透過這種方式，金庸為讀者建立起這樣的認知：《葵花寶典》是邪惡的，練《葵花寶典》的人是邪惡的，所以這個人所建立的這套系統也是邪惡的。</p>\n\t\t\t<p>《笑傲江湖》中環繞著東方不敗的敘事，我們應該要看到、體會到，金庸在時局的刺激下，如何認真地描繪那樣一種權力猙獰的荒謬感。</p>\n\t\t</div>"},{"title":"08　對權力免疫的人","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-32\"><span><span><span>0</span><span>8</span></span></span>　<span>對權力免疫的人</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在《倚天屠龍記》裡，張無忌當上了明教教主，明教也是魔教，和日月神教一樣。但是張無忌不是一個邪惡的人，好人成為了教主，這個教派連帶地也被改變了。只是到了《笑傲江湖》，金庸不能再寫同樣的情節。</p>\n\t\t\t<p>那麼，接下來該如何解決變得如此可怕的組織呢？在這方面，金庸處理的方式有點不那麼漂亮，仍然運用了「天外救星」、「機械降神」──他讓任我行突然身亡，讓他的野心戛然而止。而在任我行死後，是誰成為黑木崖的新主人呢？他的女兒任盈盈。</p>\n\t\t\t<p>金庸讓任盈盈成為了日月神教教主，用以解決這個魔化的系統，因為她在小說裡的基本作用，和令狐冲是一樣的──她是另一個對權力免疫的人。</p>\n\t\t\t<p>《笑傲江湖》的〈後記〉裡，金庸是這樣說的：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>盈盈也是「隱士」，她對江湖豪士有生殺大權，卻寧可在洛陽隱居陋巷，琴簫自娛。她生命中只重視個人的自由，個性的舒展。惟一重要的只是愛情。這個姑娘非常怕羞靦腆，但在愛情中，她是主動者。令狐冲當情意緊纏在岳靈珊身上之時，是不得自由的。只有到了青紗帳外的大路上，他和盈盈同處大車之中，對岳靈珊的癡情終於消失了，他才得到心靈上的解脫。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>是愛人比較重要、比較幸福？還是被愛比較幸福、比較重要？金庸顯然給了一個很特別的答案。當令狐冲那樣愛著岳靈珊的時候，他是不自由的，他沒有辦法在她面前任意做自己。但是倒過來，如果他是被愛的，在這種狀態下反而自由了。任盈盈自己就是一個熱愛自由的人，令狐冲不會被她拘束；她的這份愛，在小說裡才會那麼動人。</p>\n\t\t\t<p>我很看重金庸為每部小說寫的後記，但不會照單全收，有的時候還是要比對一下小說裡是怎麼寫的。這裡就有一點不太對勁。</p>\n\t\t\t<p>在「青紗帳外的大路上」，令狐冲和任盈盈感受到了從所未有的寧靜與美好，的的確確是兩人感情升溫的重要轉折。但那時的令狐冲並沒有「對岳靈珊的癡情終於消失」。如果在大車裡，他已經擺脫了自己的心結，坦白說，小說後面也就不必讓岳靈珊死了。</p>\n\t\t\t<p>金庸讓岳靈珊死在林平之的劍下，還讓岳靈珊在將死之時對令狐冲說，要他來照顧林平之。金庸為什麼要這麼寫？因為他將令狐冲對岳靈珊的癡情寫到了那樣深的程度，那就不會有任何世俗的力量，可以改變他對岳靈珊的感情。</p>\n\t\t\t<p>即使岳靈珊嫁人了，對令狐冲來說都不能讓他放棄。所以岳靈珊必須死，否則令狐冲的感情會一直放在她身上。還不只如此，如果岳靈珊以別的方式死了，也許她在令狐冲心裡會永遠被供成神主牌，任盈盈更不可能和死了的岳靈珊競爭。</p>\n\t\t\t<p>因此，我們看到的情節是這樣的：即使被丈夫所害，岳靈珊在臨死前都不後悔她對林平之的愛，到她死的那一刻，她心裡惦記的仍然是林平之。這就再也沒有挽回的機會了，令狐冲才真正死了心。</p>\n\t\t\t<p>所以，金庸在小說裡寫的，比他在後記裡說的，其實更加絕對、更加極端。不過，金庸說任盈盈和令狐冲是同一類人，這是非常重要、準確的表述。</p>\n\t\t\t<p>舉世滔滔中，幾乎所有人都不免被權力迷惑。什麼樣的人才能對權力免疫呢？令狐冲可以，任盈盈也可以。任盈盈雖然接掌了日月神教，但她不喜歡權力而想要個人自由，也看重別人的個人自由。這樣的人才能夠消解被東方不敗打造出來、接著又被她父親任我行運用過的那套可怕的權力機器。這是金庸找到的一條出路。將任盈盈和令狐冲兩個人放在一起，對於權力鬥爭的反省，有著重要的意義。</p>\n\t\t\t<p>金庸說任盈盈「對江湖豪士有生殺大權，卻寧可在洛陽隱居陋巷，琴簫自娛。」這裡有我們不能忽略的另一個重點──琴簫自娛。回到小說的書名「笑傲江湖」，指的是什麼呢？就是劉正風和曲洋二人一簫一琴，合力創制的一首音樂作品。</p>\n\t\t\t<p>任盈盈第一次出現的時候，被令狐冲誤認為是一個老婆婆，有著比綠竹翁更高超的音樂造詣。為什麼要特別凸顯「琴簫自娛」？因為這關乎到任盈盈憑什麼可以抗拒權力，成為不被權力所誘惑的隱士。</p>\n\t\t\t<p>在這件事情上，金庸的想法是進步的。他並沒有把任盈盈為什麼不喜歡權力，簡單歸結到因為她是個女人，女人沒有權力的欲望。金庸反而將任盈盈描寫成一個能夠抗拒權力的隱士，並且在她身上尋得了線索──她是音樂和藝術的愛好者。</p>\n\t\t\t<p>換句話說，什麼是權力的解藥？如果你有一種內在自足的心靈追求、心靈享受，你就可以無視權力。對任盈盈來說，我有音樂自娛，權力對我有什麼好處？我擁有愛情，權力對我有什麼好處？</p>\n\t\t\t<p>用這種方式，我們可以進一步提問：金庸在《笑傲江湖》中所提出的政治主張是什麼？人為什麼如此貪戀、追求權勢？答案就是：要藉由權勢來滿足自己。在追求權勢的過程中無所不用其極，對人格來說是消耗的，它會不斷地掏空你。於是，就算追求到了權力，仍然無法帶來心靈的飽足感。</p>\n\t\t\t<p>什麼東西可以讓心靈飽足呢？愛情可以，藝術也可以。所以在這部小說中，藝術非常重要。藝術可以讓人癡狂，藝術可以讓人不只是忘卻權力，還會選擇遠離權力。</p>\n\t\t\t<p>《笑傲江湖》裡有一組人物，叫做「江南四友」，那是四個分別對琴棋書畫癡迷的人。他們原本是日月神教的高手，卻選擇到西湖梅莊看守地牢，為什麼？因為他們對藝術的愛好，使得他們對教中的權力鬥爭與鉤心鬥角都沒有興趣，只要教主願意給他們追求藝術的自由，他們就滿足了。</p>\n\t\t\t<p>江南四友選擇自願離開了這套權力系統，就像任盈盈一樣，因為藝術可以讓人飽足。</p>\n\t\t\t<p>令狐冲為什麼可以抗拒權力？因為他的內在也非常富有。他內心的自給自足不完全是愛情，也不是藝術，那是什麼？是他忠於自我的原則。在這樣的精神富足下，一個人連性命都可以不顧，何況權力？</p>\n\t\t</div>"},{"title":"09　無法笑傲的江湖","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-33\"><span><span><span>0</span><span>9</span></span></span>　<span>無法笑傲的江湖</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>《笑傲江湖》這個書名，源自劉正風和曲洋二人合力創作的曲子。在〈後記〉中，金庸寫下這樣一段充滿感慨的話：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>人生在世，充分圓滿的自由根本是不能的。解脫一切欲望而得以大徹大悟，不是常人之所能。那些熱中於政治和權力的人，受到心中權力欲的驅策，身不由己，去做許許多多違背自己良心的事，其實都是很可憐的。</p>\n\t\t\t<p>在中國的傳統藝術中，不論詩詞、散文、戲曲、繪畫，追求個性解放向來是最突出的主題。時代越動亂，人民生活越痛苦，這主題越是突出。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「解脫一切欲望而得以大徹大悟」，這是佛法上的解脫，也是金庸在《天龍八部》裡所要探索、指引的方向。到了寫《笑傲江湖》又不一樣了，小說帶出的另外一層意義，就是──人在江湖，身不由己。</p>\n\t\t\t<p>就像劉正風，連要退隱都不是一件容易的事。劉正風追求藝術上的自由，重視莫逆於心的友誼，想要金盆洗手；梅莊四友盼望在孤山隱姓埋名，享受琴棋書畫的樂趣，但他們都無法做到，因為在權力鬥爭的漩渦中不允許。</p>\n\t\t\t<p>什麼叫做「笑傲江湖」？江湖原來是不允許誰能夠笑傲的，這是相當悲涼的反諷。「江湖」就意味著沒有自由。想要笑傲江湖，想要在江湖中得到自由，哪有那麼容易？</p>\n\t\t\t<p>這又是另一種現實面，背後仍然有時局的影響。</p>\n\t\t\t<p>金庸從一九六七年開始寫《笑傲江湖》，同時每天都在為《明報》寫社評。他看到了什麼？或者更進一步說，他想要透過小說探討什麼？他看到政治權力用這種方式扭曲了多少人，因此他期望能有一種力量、一種希望，讓人可以不要在權力之海中悉數被扭曲。</p>\n\t\t\t<p>一方面他找到了，那可以是藝術，但是時局變化又逼著他對於這樣一種理想，不得不抱持著懷疑的態度。他希望藉由文化、藝術，讓人可以保持冷靜、保持清醒、保持清高，藝術帶來心靈飽足，繼而產生了自尊心。但不幸的是，在當時的殘酷鬥爭現況下，這幾乎是癡人說夢。中國傳統下的隱士可以擁有自身內在巨大的生命力量，可以不用管這個世界，可以不受這個世界的權力誘惑，可是金庸所處的現實世界權力運作卻不放過你。</p>\n\t\t\t<p>從劉正風和曲洋的故事，連繫到任盈盈，再連繫到梅莊四友，金庸為什麼這樣寫？我們知道他在感嘆那個時代。或許有很多人忘掉了，可是那個時代，金庸每天都在讀新聞，都在寫社評，他知道有多少文人在「文革」那段時間中失去了他們的生命。</p>\n\t\t\t<p>這些人有權力欲望嗎？不，他們是最不可能有權力欲望的一羣人，可是權力不放過他們。當權力不放過你的時候，文化和藝術可以幫助你離開權力，但卻沒有辦法幫助你對抗權力。</p>\n\t\t\t<p>這是金庸在〈後記〉裡所提到的、隱含著時代悲傷的巨大課題。這個巨大課題在小說裡不可能解決，甚至在金庸自己的生涯裡，也沒辦法真正解決這個問題。</p>\n\t\t\t<p>金庸寫《笑傲江湖》的那段時間，「文革」的奪權鬥爭正如火如荼，因此他要寫一部和現實相關聯的小說，但這不是一部影射小說，而是藉由現象去探索權力的一部小說。為此，金庸將小說的歷史背景拿掉了，《笑傲江湖》可以屬於任何時代。</p>\n\t\t\t<p>如果一部小說是跟著時局而創作的，那麼它必然要付出代價：時局隨時在變動，小說也要跟著變動，就一定被現實牽著走。換句話說，小說可能會照顧不到結構。</p>\n\t\t\t<p>如果《笑傲江湖》寫出來像是《天龍八部》，甚至比《天龍八部》更加結構混亂，說老實話，我反而比較能夠理解。但驚人的是，《笑傲江湖》完全不像《天龍八部》，其結構非常嚴謹。我的解讀是，這是金庸自己的反省，他不願放任自己再寫一部結構散漫的小說，所以他將《笑傲江湖》的故事架構抓得非常緊密。</p>\n\t\t\t<p>和《倚天屠龍記》一樣，《笑傲江湖》也明顯分成前後兩部分。</p>\n\t\t\t<p>前半部寫的是令狐冲一路飽受病痛與冤屈的折磨，最後習得了「吸星大法」的這個過程。他以華山派大弟子的身分，陰錯陽差見疑於師門，自己則是死不掉又活不下去，繼而和日月神教的重要人物產生了牽扯。因此，雖然令狐冲登場時已經是個具備江湖身分的成年人，但是在小說的前半部，我們仍然可以將它視作特別的成長小說。他一直打輸、一直受傷、一直從挫折中重新站起，這樣的令狐冲，靠著「吸星大法」化解異種真氣，讓他暫且獲得了新生。</p>\n\t\t\t<p>那《笑傲江湖》的後半部在講什麼呢？《倚天屠龍記》的後半段是張無忌的情感教育（可參《流轉江湖》一書）；相對的，令狐冲所要經歷、學習的，是政治教育或權力教育。他必須見識到什麼是政治權謀，而且這份政治教育是雙重的。</p>\n\t\t\t<p>因為與任盈盈、任我行的關係，令狐冲取得了一個特別的位子，像張無忌一樣，他也介於正派和邪派之間。可是以他的身分和角色，需要學的不一樣。他學到的是，不論身在名門正派、或邪魔外道，政治操弄無所不在、權力關係無所不在，通通都是利害的算計。而唯有具備隱士性格、對權力絕緣的人，才能夠處身其中，最終解決了正、邪之間的政治問題。</p>\n\t\t\t<p>透過令狐冲這個角色，金庸帶著我們經歷了一趟權力教育，教我們認清楚、看明白什麼是無所不在的政治角力。不過這不是現實的教育，因為我們除了看到什麼是權力的思考、權力的算計外，金庸也試圖讓我們看到，他在努力地尋找權力的解藥。雖然不容易，卻仍然描繪了一點淨土存在的可能。</p>\n\t\t</div>"},{"title":"．｜第四章｜　《鹿鼎記》　超越民族主義的小人良知","content":"<div>\n\t\t\t<h1 id=\"_idParaDest-34\"><span>第四章</span><br/>《鹿鼎記》<br/><span>超越民族主義的小人良知</span></h1>\n\t\t\t\n\t\t</div>"},{"title":"01　逃避現實與道德朝聖","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-35\"><span><span><span>0</span><span>1</span></span></span>　<span>逃避現實與道德朝聖</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>我們接受武俠小說是虛構的。在武俠小說裡，有人可以施展輕功，就飛上了絕壁，有人可以隔空一掌，就取了別人的性命。</p>\n\t\t\t<p>可是容我這樣問：如果金庸在武俠小說中寫了南宋的郭靖，提起一口真氣，狂奔在一條平坦的高速公路上，你能接受這樣的內容和情節嗎？你大概會說，郭靖明明活在宋代，那個時候怎麼可能有高速公路？但是等等，難道宋朝會有隔空一掌就把樹打斷的降龍十八掌嗎？</p>\n\t\t\t<p>很有意思的是，即使對於明知道是虛構的內容，讀者也有一套自己的標準，決定什麼是他要接受的，什麼是他不願意接受的。我們從來都不是那麼寬容的讀者，因為讀者保留了最後、最大的權力，那就是要不要讀下去。</p>\n\t\t\t<p>並不是作者高興怎麼寫就怎麼寫，讀者內在有一種機制在提防著：你要對我說什麼，必須要符合我認定的、可以接受的標準，如果讀不下去，我就不讀了。讀得下去或讀不下去，是有一個標準的。如果你捉摸不到這部小說的潛在規則，你就覺得讀不下去。當然，每個人的內在標準不太一樣。</p>\n\t\t\t<p>此外，對於不同的小說，讀者願意容忍和接受的程度也不一樣。越是不以現實為標準的，越需要一種內在的紀律去說服讀者，或者讓讀者安心。讀者必須知道，我在這部小說裡會讀到什麼，更重要的是，我不會讀到什麼。</p>\n\t\t\t<p>武俠小說可不可以瞎扯？這就看所謂的「瞎扯」是什麼意思。如果從寫實、現實的角度看，武俠小說裡幾乎沒有一件事情不是瞎扯的。那麼，你怎麼畫這條界線、這道標準呢？</p>\n\t\t\t<p>提一口真氣，飛上絕壁，我們說這不是瞎扯；提一口真氣，跑在高速公路上，我們說這叫做瞎扯。不要小看這樣的判斷，這種判斷在相當程度上，幫助我們決定有哪些武俠小說是比較好看、比較紮實、比較嚴謹的，又有哪些武俠小說就是讓你看不下去。</p>\n\t\t\t<p>武俠小說憑藉整個文類中各個不同作品的彼此呼應、相互加強，產生了這套規矩。如果要瞭解這套規矩，就應該回頭去看武俠小說文類誕生的時代，因為這個文類的閱讀標準，對應了那個時代的讀者要求。</p>\n\t\t\t<p>讀者要求什麼呢？非常簡單卻也非常重要的，是逃避。武俠小說的基本讀者，是對現實有著強烈無力感、焦慮感的人。這種無力和焦慮來自於那個時代。</p>\n\t\t\t<p>那是一個大時代的背景。什麼叫做「大時代」？就是時代凌駕於人之上，在時代面前，人們不太知道自己能做什麼。歷史與環境難以捉摸的激烈變動，人們沒有把握下一步該怎麼做，不知道做了之後會得到什麼樣的結果。</p>\n\t\t\t<p>再往更遠一點說，在中國社會集體價值的底層，一直都有一種以人為核心的觀念，認為要解釋任何的事情，都要追溯到有一個什麼樣的人，做了什麼樣的事，造成了什麼樣的影響。</p>\n\t\t\t<p>就像中國的文字。想要瞭解中國文字的發明，在這樣的價值觀念下，人們就會說，那是因為有一個了不起的人叫做倉頡，是這個人創造了文字。一定要找到這樣一個人，在傳統的文化觀念裡才覺得是對的，或是才能夠安心接受的解釋，以至於包括史學的核心、主流的形式是紀傳體，也是以人為中心的。</p>\n\t\t\t<p>然而在大時代的變化中，中國社會為什麼產生了那麼強烈的無力感？有一部分的原因是，人們對這個世界的認知必須進行巨大的調整。一直到今天，我們都還在調整當中。</p>\n\t\t\t<p>比如什麼叫做「社會」？「社會」一詞已經變成我們日常生活的語言中經常用到的詞彙，可是回到清末之前，在當時大中華的傳統裡，沒有「社會」這樣的詞、這樣的觀念。</p>\n\t\t\t<p>這兩個字是從日文的「社會」（しゃかい）翻譯過來的，而日文的「社會」又是翻譯自英文的society。「社會」不是中國固有的概念，但是當這個概念變得如此重要時，就逼著中國人要去體會、認識：原來我怎麼過日子，我能夠獲得什麼，背後有一個超越於個人，甚至反過來可以控制個人、擺佈個人的巨大力量，那就是社會。</p>\n\t\t\t<p>剛開始的時候，人們經常是以負面的方式感知「社會」。活在這個世界上，覺得能夠做主的事情越來越有限：國家不是你能做主的，政治不是你能做主的；接下來收入、財富也不是你能做主的；到了私人領域裡，又進一步發現，婚姻不是你能做主的，甚至連兒子都不是你能做主管教的。</p>\n\t\t\t<p>這種狀況下，很容易產生強烈的無力感。尤其面對公共領域時，無力感就更深切了。比如面對戰爭，你能做什麼？從鴉片戰爭以降，外國勢力湧入，只能割地又賠款。接著中日戰爭爆發，不只是跟日本人打仗，後來還跟自己人打仗，面對內戰與流離之苦，你能做什麼？作為一個人，飄蕩、搖擺在各種不同的勢力中間，人們不只安定不下來，而且什麼事都不能主動地決定、行動。</p>\n\t\t\t<p>這樣的背景下，武俠小說帶來非常重要的安慰，幫助那個時代的讀者得以逃避現實。因為在武俠小說中，仍然保留了十分強大的個人性，這個「個人」就是江湖世界裡的英雄（hero）。</p>\n\t\t\t<p>Hero這個英文字有雙重的意思，既是英雄，同時也是主角。這也是為什麼西方大眾小說的這些基本格式與寫法，後來到了臺灣、香港，會廣泛流行起來。</p>\n\t\t\t<p>大眾小說有一個重要的標準，就是讀了小說之後，讀者會著迷於其中一個角色，或是對某幾個角色明確認同，覺得自己好像變成了他（們），跟著他（們）進入到小說的情境裡。</p>\n\t\t\t<p>絕大部分暢銷、受歡迎的大眾小說，都具備這樣的特質。武俠小說也一樣，一定要有能讓讀者明確認同的對象，而且這對象具有高度的可辨識性，他一定是個英雄。</p>\n\t\t\t<p>作為英雄，這個角色有兩項重要的成分。第一是武與俠。因為英雄必須運用高超的武藝來解決許多的紛爭。武藝好還是不好，是一個人在江湖上能夠發揮多少影響力最重要的因素。</p>\n\t\t\t<p>武俠人物一定要在武藝上比個高下，武功越高的人地位越重要，武俠小說讀者都接受這個基本標準。在武俠小說的流派變化中，最早的如平江不肖生作品中，主角出現時已經身懷武功，寫的是一群有武藝的人彼此之間發生的事。</p>\n\t\t\t<p>這個過程中，臥龍生有一個特別的貢獻，他開始寫一種特殊的小說，後來在臺、港有很多武俠小說作者跟著寫，於是產生了一種新的模式。這個模式就是，一個年輕人（通常是少年）經過了一連串的遭遇，武功越變越強。中間一定要中過一次毒，功力就多加一成；一定要掉到山崖一次，功夫又多進步一層；一定要拿到秘笈，修練之後，功夫再長進一級。武俠小說被改寫成initiation story（成長故事），也就是一個大俠的完成。</p>\n\t\t\t<p>武俠小說越寫越長，因為小說中有很大的部分，可能佔了其中的百分之六十到八十，都在寫這個故事主角如何變成了大俠。這樣的寫法有遞進性，小說中越早出現的人物，武功越差；越早出現的武功層級越低、越不高明；用這種方式一層一層地堆疊上去，到最後，故事主角得以身懷絕技。讀小說很大的樂趣，就在跟隨著這個人一步一步成為一代大俠。</p>\n\t\t\t<p>再者，作為一個英雄，大俠要能成其「大」，不只是武功要好，而且一定要涉入重要的大事件。這也是來自讀者逃避心理的需求，回頭相信、持續這樣的想像──一個人只要夠厲害，他是可以改變世界的。</p>\n\t\t\t<p>不只是讓鄉下人不要再互相打架，也不只是解決幫派之間的仇恨，如果只做這些，怎麼能夠稱為大俠呢？讀者也不會想要繼續看下去。</p>\n\t\t\t<p>什麼樣的事件才夠重要呢？武俠小說通常有個重要的主題，就是爭奪武功秘笈。那就至少牽涉到兩邊人，一般就是好人一邊，壞人一邊。如果秘笈落到了壞人手裡，那不得了，擁有秘笈的壞人如虎添翼，江湖可能會釀成大災禍。因此，武功秘笈一定要想辦法讓大俠得到，成為天下無敵以捍衛武林。而這件大事一部分就是隨著他的成長而來，也解釋了大俠如何在武功上達致巔峯。在這個過程中，讀者認同這個主角，也將自己想像成這個主角。</p>\n\t\t\t<p>另外，武俠小說裡一定要製造出大事件的氛圍，需要大俠挺身而出，絕對不會是個人之間的小事。大致可以歸納為幾種：</p>\n\t\t\t<p>一種是血海深仇，關於復仇的故事。《基度山恩仇記》是一個重要的原型，彰顯了復仇這件事有多麼吸引人。大家很容易相信、接受復仇的過程中可以無所不用其極，也就發生了許多光怪陸離的事。</p>\n\t\t\t<p>再者，和復仇主題連繫在一起，有時不只是個人之仇，而是一幫一派之仇，甚至一家一國之仇。如果小說中有明確一點的歷史背景，通常也會將之放在種族衝突之中。例如清朝是武俠小說常取用的背景，關懷的就是民族大義的復仇。對當年讀武俠小說的讀者來說，他們遭受長期的民族挫折，民族主義是他們生命中很重要的基調。</p>\n\t\t\t<p>還有一種，就是武林的存亡。有一個夠壞、夠邪惡的人，如果讓他奪得武林盟主的位子，就會毀掉所有的人。這讓讀者覺得有一件再重要不過的事情正在發生，讀者化身成為大俠，一路過關斬將，感覺到自己解決了惡人，讓這個世界回歸正常。</p>\n\t\t\t<p>照這樣看，武俠小說的根本邏輯，其實是很小孩子氣的。最簡單的原型和表現形式，其實就是超人。超人平時窩在報社裡當記者，一旦遇到了大事發生，他就進入電話亭換裝，轉變成超人的形象。</p>\n\t\t\t<p>如果隨便找一個看超人漫畫長大的美國小孩，問他：你將來最大的志願是什麼？他會告訴你說：To save the world（解救世界）。</p>\n\t\t\t<p>這是他八歲時的想法，但不要以為他長大了，就跟這件事無關了。到了他六十歲的時候，他可能騎著腳踏車，日常吃素，問他：你在做什麼？他還是會告訴你說：我做這些事情是為了save the world（解救這個世界）。他的人生邏輯就是這樣的，必須覺得自己在拯救這個世界，生活才有意義。</p>\n\t\t\t<p>武俠小說也在這樣的一套邏輯裡。必須有鬥爭、有奮鬥、有善惡衝突等戲劇性，讓大事件能夠立得住。所以接下來，按照武俠小說內在的規矩，最後的善惡之爭，一定是善有善報、惡有惡報，維持住道德的信心。</p>\n\t\t\t<p>從這個角度看，我們可以說武俠小說必定有一種moral pilgrimage，它是一段道德的天路歷程。武俠小說一開始就是黑白分明的，讀者所認同的、跟隨著他的生命一路走過去的這個人，就是個好人。而且這個好人在他成長的經歷中，也就是小說裡展開的各種情節中，會不斷地被考驗、受挫折、被折磨，所以說是pilgrimage（朝聖）。</p>\n\t\t\t<p>讀者跟隨著他，經歷這麼多的危險、這麼多的失敗，但是到了最後，我們會得到那個聖杯，完成心目中必須由他、也只能由他完成的大事。</p>\n\t\t\t<p>這是一個天路歷程，這個歷程和原來武功上的進境，從臥龍生之後，就被捲在一起。這是武俠小說最好看的地方，代表善的主角，惡的勢力不斷攻擊他、挑戰他；他克服了這個惡，變得強大，再克服了那個惡，又變得更強大，最後成為解救武林、解救世界的大俠。</p>\n\t\t\t<p>簡單地整理一下，包括金庸所承襲的武俠傳統，基本上就是這三大元素，由此形成了規矩：</p>\n\t\t\t<p>第一，一定要有武功。主角沒有武功，就不是武俠小說。</p>\n\t\t\t<p>第二，一定要有大俠，而且還是個英雄。小說裡的大俠要能夠讓讀者在閱讀的過程中投射、認同他，不但武功要越練越高，同時還要具備善的品格。</p>\n\t\t\t<p>第三，一定要有大事發生。</p>\n\t\t\t<p>只有瞭解了這樣一套規矩，在這套規矩之下讀金庸的最後一部小說《鹿鼎記》，才會知道它有多了不起。</p>\n\t\t</div>"},{"title":"02　反英雄小說","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-36\"><span><span><span>0</span><span>2</span></span></span>　<span>反英雄小說</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>當我們用武俠小說的三大元素──武功、英雄、大事──來檢視金庸所寫的《鹿鼎記》，便會對《鹿鼎記》的成就有全新的認識。</p>\n\t\t\t<p>我想不會有人否認，《鹿鼎記》裡所描寫的「大事」，被金庸推到了最極端，因為他用了過去武俠小說不曾用過的重手法──歷史現場報導。這意味著《鹿鼎記》裡所牽涉的事件，不是只在這部小說中重要，而是一般講清朝歷史時，都一定會提到的大事。</p>\n\t\t\t<p>小說最先上場的是誰呢？有呂留良、顧炎武、黃梨洲，接著康熙皇帝登場了，再來有鰲拜，有陳近南，有吳三桂，有鄭克塽。這些都是歷史人物。只有大事件才會記載在史書裡，只有關鍵的人物才會在史書留下名字，所以《鹿鼎記》裡寫的當然是大事。在「大事」這一點上，金庸不只繼承了武俠小說脈絡，甚至將它推到了極致。</p>\n\t\t\t<p>在《鹿鼎記》這部小說的舞臺上所發生的，是傳統武俠小說前所未見的真正大事。它幫我們記述了清代康熙一朝重要的史事，就像是帶著讀者來到了歷史現場，擒拿權臣鰲拜、平定三藩之亂、收服明鄭、簽訂尼布楚條約……，隨著這些故事，歷史人物在小說裡一一登場。</p>\n\t\t\t<p>也正因為這樣，這部小說難寫。最難的地方就在於真實歷史的結果是不能改變的。你不能讓康熙當不成皇帝；康熙在位六十一年，讓它多一年、少一年都不行；你也不能改變鰲拜的結局……。把歷史帶進來，絕對不是一個便宜手法，而是非常大膽的做法。而金庸大膽的程度，我只能一貫地以魔術大師哈利．胡迪尼（Harry Houdini）來形容。</p>\n\t\t\t<p>胡迪尼是個很不一樣的魔術師，他最厲害的魔術並不是變出任何東西，而是將自己綁起來，比如用手銬將雙手反銬，再用繩子綑住身體，然後進入一個外面用鐵鍊鎖住的箱子裡，再把這個箱子放到一個巨大的水族缸中，裡面灌滿了水。在被淹死之前，胡迪尼只有非常有限的時間。在這麼短的時間內，他得解開這層層束縛，讓觀眾看到他活著從水箱裡逃脫出來。</p>\n\t\t\t<p>在腦袋裡放著胡迪尼這種魔術師的形象，然後再讀《鹿鼎記》，就會發現，我們也在看著金庸如何一層一層地將自己綁起來，並且竟然在如此高度的限制下，還能寫出這麼精彩、活潑的一部小說。</p>\n\t\t\t<p>他把自己綁起來的第一層是──寫出歷史上康熙一朝的重大事件。如上述擒拿鰲拜、平定三藩之亂……，這些大事完全依照原來的歷史結果，也成為小說裡的主要情節。</p>\n\t\t\t<p>接著金庸還要給自己另一層限制──他選擇了韋小寶作為主角。只要讀了小說開頭，韋小寶的形象就跳出來了：從任何角度、任何標準來說，他都不是一個大俠，甚至不具備成為大俠的資質和條件。</p>\n\t\t\t<p>韋小寶出生在揚州的妓院（麗春院），他只知道媽媽是誰，所以他經常拿韋小寶這個名字來賭誓：如果我如何如何，我就不姓韋。可是他心裡想的是：我本來就不姓韋，我又不知道我爸爸是誰。</p>\n\t\t\t<p>韋小寶如果喊人家媽媽，其實在心裡就是在罵人家婊子。而且他不識字，武功秘笈擺在他面前也沒有用。他也不像石破天，有那種天生的領悟能力，看到字會想到形狀，從而破解神功奧秘。</p>\n\t\t\t<p>韋小寶上場的時候還是個小孩，十三、四歲，完全沒半點規矩，身上具備的本事，一個是逃跑，另一個是罵人。除了罵人和用下三濫的打架手法外，他沒有任何能力。小說一開始，韋小寶遇到江洋大盜茅十八，就是用了下三濫的手法（撒石灰傷敵）救了他。</p>\n\t\t\t<p>韋小寶在妓院裡學到的最大本領就是說謊，也就是見人說人話、見鬼說鬼話。所以不要說他不是君子，這太抬舉他了。韋小寶習慣滿口胡言，他甚至不覺得人應該要說真話。</p>\n\t\t\t<p>我們一般認為一個人身上最可怕的缺點，通通都集合在韋小寶身上。這真的已經很驚人了。這樣的主角一站出來，跟其他的武俠小說，包括金庸自己所寫的武俠小說的主角，完全都不一樣。想像一下，將郭靖和韋小寶擺在一起，不然，將張無忌和韋小寶擺在一起，那算怎麼回事？</p>\n\t\t\t<p>金庸喜歡寫武林中的怪誕人物，這是武俠小說的另一個傳統，只不過過去武俠小說中這些人物都是配角。他們可以是重要的角色，但就只是配角。例如執著瘋魔的歐陽鋒、孤僻彆扭的黃藥師，金庸也寫得很精彩，可是很清楚那就是配角。</p>\n\t\t\t<p>在這之前，主角的怪誕性格頂多就寫到令狐冲這樣。雖然令狐冲不是一個規規矩矩的大俠，但和韋小寶放在一起根本不值一提。最有可能和韋小寶放在一起的主角，大概只有楊過。他們都不喜歡受到禮法約束，剛出場的時候也都沒有江湖認知，因此不會屈從江湖的原則。</p>\n\t\t\t<p>但是韋小寶和楊過仍然不一樣。楊過到後來脫胎換骨，成為「神鵰大俠」，不只是他的武功，還有他的俠風、膽識，都和初上場時的那個小乞丐、小癟三形象不可同日而語。而金庸卻讓韋小寶從頭到尾都是一個樣子。</p>\n\t\t\t<p>從舊派武俠裡翻出新派武俠的金庸，當然知道自己在做什麼。這意味著他斷絕了、不讓自己再去寫前面提過的武俠小說的其中一項元素：大俠成長的故事。</p>\n\t\t\t<p>楊過、張無忌，甚至石破天等，小說中都有成長的經歷，他們都遭遇了不少稀奇古怪的事，在武藝精進的同時，逐步成為值得人家崇拜的大俠，那樣的故事好看，也容易吸引讀者。可是寫《鹿鼎記》的時候，金庸把這個也拿掉了，那就等於胡迪尼又給自己多綁了一道繩子。</p>\n\t\t\t<p>韋小寶一開始出場時是個小孩，從此基本上只有年歲增加，作為一個無賴的個性部分，是沒有變化、沒有進展的。韋小寶沒有汲取到（或者說他沒有意願）成為一位大俠最基本的素質、成分；他學習到（或者說他有興趣）的是另一種生存本事，就是如何在各種勢力之間左右逢源、在隨時可能殺頭的危機下明哲保身。</p>\n\t\t\t<p>最奇特的是，韋小寶一直維持著低劣的功夫，也憊懶不想學功夫。武功只是他的幌子，他的武功只有兩種功能，一個是逃命（還好有九難教他「神行百變」），一個是拿來騙女孩子。</p>\n\t\t\t<p>照理講，一個不會武功的人，在武俠小說裡只能夠被分配到無足輕重的角色。但是金庸不但讓不會武功的韋小寶在《鹿鼎記》裡當主角，而且他這個主角的分量讓讀者完全無法懷疑。</p>\n\t\t\t<p>金庸其實挑戰的是武俠小說的首要元素──不能沒有武功。</p>\n\t\t\t<p>《鹿鼎記》裡當然有很多武學高手：韋小寶的第一個師父陳近南不但武功高強，他領導的天地會裡每一個人都身懷絕技；甚至連住在皇宮裡的老太監海大富和皇太后（假冒的）都武功一流；更不用說韋小寶的第二個師父白衣尼九難、神龍教教主洪安通，還有他的少林寺師兄師姪們……</p>\n\t\t\t<p>可是很抱歉，這些武學高手的設定基本上和主角無關，但所有這些人物又都必須圍繞著韋小寶，才能夠發展各自的敘事。此外，《鹿鼎記》裡發生的諸多大事件，主導、完成這些大事的關鍵因素，也不是靠武功。</p>\n\t\t\t<p>用這種方式分析，你就知道《鹿鼎記》有多難寫。讓那些會打的人去打，會耍計謀的人去搞計謀，只是剛好那些人打打殺殺的時候、費盡心計的時候，韋小寶都不小心在場，就看到了，還被迫參與其中。</p>\n\t\t\t<p>這讓我聯想到福爾摩斯小說裡的華生醫生。華生醫生就是這樣，他通常沒什麼用，通常給的建議都是錯的，可他一直都在。他的用途就是讓福爾摩斯對他說「華生，不是這樣的」，或是「不要急，你的猜想是錯的」。華生是一個錯誤示範，他一直跟著福爾摩斯，可是我們不會將華生誤以為是主角。在讀小說的時候，雖然知道這是華生的記錄，可是讀者認同的、緊張的、跟隨著的都是福爾摩斯。</p>\n\t\t\t<p>金庸沒有寫成這樣，他不只是讓小說中最重要的成就都不是靠武功達致，而且都要和韋小寶有關。韋小寶經歷了一件又一件的大事，因為他在，使得事情有所轉變；但是反過來，韋小寶自己卻沒有被這些事情改變，他一直維持著原來的樣子。</p>\n\t\t\t<p>武俠小說另一個重要的元素，就是善惡的壁壘，因此往往被寫成了道德的天路歷程：善與惡不斷地鬥爭，有時候雖然惡一時蓋過了善，惡不斷折磨善，最後善一定能夠戰勝惡。可是《鹿鼎記》裡沒有這些，或者說，這種「道德的天路歷程」不能運用在《鹿鼎記》上。韋小寶從來不是一位純潔的白衣大俠，他永遠都是過度破爛，或者過度華麗，而且華麗的時候比破爛的時候要多得多。</p>\n\t\t\t<p>所以這是一個什麼樣的故事？這是一個以武俠小說為外殼，實質上在寫讀者很少看到、且非常經典的「反英雄」的小說。「反英雄」是anti-hero，並不是說小說裡沒有英雄。沒有英雄的小說很多，大部分的小說，尤其是純文學小說，裡面不會有英雄，可是那頂多是non-hero，是「非英雄」的小說。</p>\n\t\t\t<p>Anti-hero novel（反英雄小說）必須要來自英雄小說，它採用了英雄小說的外表，實際上卻是去嘲弄、或者去挑戰英雄的概念。反英雄小說是站在英雄小說的基礎上才能產生的；反英雄小說是要寫給熟讀英雄小說的人看，因而也只有徹底瞭解英雄小說的人，才有本事和條件去寫一部反英雄小說。</p>\n\t\t\t<p>反英雄小說最大的作用，就是借用英雄小說的模式，但是將它扭曲、嘲諷、翻轉、顛覆，最後逼著讀者重新去想：到底什麼是英雄？我們原本以為的英雄是怎麼來的？</p>\n\t\t\t<p>《鹿鼎記》是一部不折不扣的反英雄小說，而且是反英雄小說中的經典。想像金庸每天晚上坐在書桌前，竭力去挑戰這個巨大傳統的用意，我們才能進一步思考，究竟在小說裡讀到了什麼。</p>\n\t\t\t<p>例如一個很簡單的問題：武俠小說的閱讀過程中，最大的樂趣是什麼？相信大多數的讀者會將「代入與認同」作為答案之一。我們喜歡這個角色，將他／她當作自己的典範；有的時候甚至覺得和他們有非常親密的關係，是代表著我們去征服極限，去解救世界。</p>\n\t\t\t<p>可是讀《鹿鼎記》，讀者的趣味又在哪裡？如果你喜歡讀《鹿鼎記》，那是在樂什麼？這是必須認真問的問題。</p>\n\t\t</div>"},{"title":"03　語言表演與白日幻想","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-37\"><span><span><span>0</span><span>3</span></span></span>　<span>語言表演與白日幻想</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>武俠小說的敘事核心是主角，以及裡面各種不同的角色，圍繞著他們發生了什麼事，他們又做了什麼事。比如讀者會記得《笑傲江湖》裡令狐冲遭遇了什麼，做了些什麼；提到《倚天屠龍記》，會想起倚天劍、屠龍刀，想起謝遜、張無忌，以及他們做了些什麼事……</p>\n\t\t\t<p>但《鹿鼎記》的寫法，也是讀者可能從中得到的非常特殊的閱讀樂趣是──小說很大一部分的情節推進是用「說」的，而不是「做」的。</p>\n\t\t\t<p>本來武俠小說裡的「說」，經常只是補充用的，比如不知道角色做這件事的理由是什麼，需要另外解釋。可是在《鹿鼎記》裡，卻是將發生了什麼事作為材料，為了讓讀者看到韋小寶到時候會怎麼「說」。「說」和「做」的重要性被翻轉了。而小說最精彩之處，往往都是韋小寶「說」了什麼之後，徹底改變了事情的走向。</p>\n\t\t\t<p>《鹿鼎記》一開場，韋小寶跟著茅十八來到了北京，誤打誤撞被帶進了皇宮，展開了真正的故事主軸。這裡有一件關鍵的事，就是韋小寶殺了太監小桂子，又不小心將海大富的眼睛給毒瞎了。為什麼要這麼設定？因為海大富從此看不見他，就只能聽韋小寶胡說。</p>\n\t\t\t<p>韋小寶假裝自己是小桂子，海大富便佯裝不知，也在利用他，叫他去跟打掃上書房的小太監賭錢，回來再告訴海大富發生了什麼事。</p>\n\t\t\t<p>韋小寶無意中又撞見了康熙皇帝，跟他成了打架的好朋友，他對康熙也是滿口胡言。海大富本意就是要這個冒牌的小桂子（比真的小桂子機靈得多）接近皇帝，好探查他想知道的事。當然，他也只能夠依賴韋小寶每日「說」給他聽的情況。</p>\n\t\t\t<p>基本上，小說裡只要有事發生，就一定會有相應的韋小寶的說法，而且韋小寶的說法比真實發生了什麼事，都要來得重要。有些事如果照著真實的狀況被揭露出來，這部小說就寫不下去了。</p>\n\t\t\t<p>所有的事件轉折都是依賴韋小寶的話術，這就帶來了讀者在讀《鹿鼎記》時特別的樂趣──我們其實是在讀被韋小寶的語言所帶動的特殊表演。這在古今中外的小說中，不敢說絕後，但絕對是空前的。</p>\n\t\t\t<p>韋小寶的語言表演大致分成幾個方向：第一是看他怎麼罵人，怎麼發洩；第二是看他如何說謊；前兩點又牽涉到第三點，那就是看他如何運用說話的技巧，來控制其他人的情緒。</p>\n\t\t\t<p>韋小寶示範給我們看他最大的本事，就是如何在一次又一次極端不利的情況下藉說話逃出生天（talk it through、talk it out）。</p>\n\t\t\t<p>越是困難的處境，就越是彰顯了韋小寶更沒有別的本事。他沒有武功，金庸就安排了兩樣東西給他，讓他隨時可以自救，就是從鰲拜家中抄出的一件寶衣、一把匕首。</p>\n\t\t\t<p>當然，有的時候這刀槍不入的寶衣和削鐵如泥的匕首，也會寫到不太合理的地步。他的寶衣不只是刀槍不入，就連如海老公、洪安通的神功「啪」的一掌打在他身上，他吐了一口血後又爬了起來。這就像卡通頑皮豹，被整得壓扁了，還是一下子就回復正常。</p>\n\t\t\t<p>在這方面，韋小寶有一定的卡通性。但關鍵的重點是，金庸有時也會設計對韋小寶不利到就連寶衣和匕首都救不了他的程度，比如面對假太后，這個時候要如何脫困？就只能靠「說」的。</p>\n\t\t\t<p>他怎麼說、說什麼，很大一部分是依照當時究竟是誰在聽他說話，是要高一點的姿態、低一點的姿態、圓滑一點的姿態、正氣凜然的姿態，要有什麼樣的表情、什麼樣的反應，真話佔幾成、假話佔幾成，決定了他如何將話說得讓人相信。他雖然滿口謊言，但是一路都有人相信他。他的謊話一再地接受各方人馬的各式考驗，在不同的困境下幫助他找到脫困、解圍的方法。</p>\n\t\t\t<p>在這部小說中，韋小寶的語言表演，比任何武功的打鬥、武俠的成就都要來得重要，讀小說的許多樂趣都是從這裡來的。這又產生了另外一個在閱讀上不得不思考的問題：在《鹿鼎記》中，為什麼韋小寶的一張嘴比任何武功還要厲害，甚至比所有人的武功加起來都還要厲害？</p>\n\t\t\t<p>次等人物以下就不要講了，像是天地會的陳近南，明朝落難公主九難師太，神龍教洪教主、洪夫人，哪一個不是武功頂尖的人物？這些武功頂尖的人，哪一個沒有被韋小寶騙得團團轉？更進一步地評估，在小說裡，所有這些人有哪一個做的事情比他更多？又有哪一個的成就比他更高？</p>\n\t\t\t<p>這是江湖、「武」的這一面，還有另外一面，是看金庸在《鹿鼎記》裡如何描寫康熙皇帝。</p>\n\t\t\t<p>康熙可以說是《鹿鼎記》「文」的世界裡最聰明的一個人，可是相對的，遇到了韋小寶，平時那樣睿智、精明的人──八歲的時候見到鰲拜，立刻察覺鰲拜有問題；十四歲的時候親政，朝中大臣都已對他感到敬畏──如果仔細看，就會發現他是小說裡一個矛盾的角色。</p>\n\t\t\t<p>面對其他的人，康熙是最聰明的，但是面對韋小寶，康熙又是最笨的，連懷疑都沒懷疑過。他派韋小寶去做無法交託給其他臣子的機密任務，比如擒拿鰲拜、到五台山保護順治，他喜歡聽韋小寶粗魯說話，對他的得力辦事讚譽有加，不斷地給他升官，讓他擁有更大的權力去做更多左右逢源的事。</p>\n\t\t\t<p>康熙經常羨慕韋小寶，聽他述說冒險過程，然後得到一種空虛的滿足：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>康熙學了武功之後，躍躍欲試，一直想幹幾件危險之事，但身為皇帝，畢竟不便涉險，派韋小寶去幹，就拿他當作自己替身，就算這件事由侍衛去辦可能更好，他也寧可差韋小寶去。他想小桂子年紀和我相若，武功不及我，聰明不及我，他辦得成，我自然也辦得成，差他去辦，和自己親手去幹，也已差不了多少，雖然不能親歷其境，但也可想像得之。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>整部小說那些具有成就的人，不管在謀略才智上，還是武功能力上，沒有一個人能夠比得上韋小寶的一張嘴。這就將閱讀的樂趣移轉了。</p>\n\t\t\t<p>回到上一篇最後的問題：讀者到底在樂什麼？是因為我們認同韋小寶的作風與成就嗎？靠著將所有的事情說得天花亂墜，就可以達到很高的成就嗎？還是說，有人讀韋小寶這個人，完全感覺不到認同的樂趣，卻可以持續讀下去，這不也很奇怪嗎？如果不認同韋小寶、不喜歡韋小寶，怎麼能夠讀得下去呢？</p>\n\t\t\t<p>誠實地說，我在讀金庸小說的時候，偶爾也會遇到讀了不是那麼舒服的段落。舉個例子，《鹿鼎記》裡有一段我不太喜歡，第一次讀過後，後來每一次重看，如果不需要很認真讀的話，我就會跳過去。那是阿珂那一段。</p>\n\t\t\t<p>我覺得金庸犯規了。他明明將韋小寶寫成了這麼皮、這麼油，又這麼使壞的一個人，要怎麼讓讀者去感受：因為突然之間遇到了阿珂，韋小寶竟然變得如此癡情？所以這一段我一直不太喜歡。</p>\n\t\t\t<p>但為了分析金庸為什麼這樣寫，這時候不得不讀，也確實有了不同的領會。現在我會將阿珂這一段和她的生母陳圓圓連結在一起。為什麼要寫阿珂這一段？金庸想要藉由韋小寶的言行來說明、示範，歷史上記載的陳圓圓為何有這麼大的魅力，不但吳三桂迷戀她，李自成迷戀她，甚至江湖成名人物「百勝刀王」胡逸之只因見了陳圓圓一面，從此甘為奴僕，在她身旁做園丁、伙夫二十幾年。</p>\n\t\t\t<p>金庸用韋小寶遇到阿珂一事，再次告訴讀者，我們不能理解這樣的魅力，那是因為我們沒有看過真正的美色。那樣的美色會讓你完全無法抗拒，是超越善惡的。當陳圓圓美到那種地步，她做什麼你都拿她沒辦法，就連韋小寶遇到了阿珂，如此無賴憊懶的人，對阿珂也一點辦法都沒有。</p>\n\t\t\t<p>回頭再問，我們讀《鹿鼎記》，認同的對象究竟是什麼？閱讀的樂趣到底從哪裡來？讓我試著這樣假定：</p>\n\t\t\t<p>我們並不是認同韋小寶的行為，他不具備大俠風範，也不可能認同他從妓院出身的那套價值觀。那我們還能認同什麼？那是背後更深刻的一種情境：一個手無寸鐵、真正處於絕對劣勢的弱者（underdog），他如何一路通關（put it through），在條件最惡劣的情況下，一而再、再而三地化解危難。</p>\n\t\t\t<p>雖然有一部分來自運氣，但更大的部分是靠他的機智。讀者在讀韋小寶這些經歷的時候，一部分的樂趣很有可能就來自我們的想像──或許我也會碰上如此過癮的事。</p>\n\t\t\t<p>比如你被老闆叫到辦公室，責問說：三天了，這個貨早該到了，為什麼沒有到？你把時間花到哪裡了？你忘了這件事嗎？然後設想一下，你眼睛一轉，講出一番說詞來。講到後來，本來怒氣沖沖的老闆流下眼淚抱著你說：這家公司幸好有你，有你在多幸運……</p>\n\t\t\t<p>其實我們心裡多多少少都閃過這種白日幻想（everyday drama）吧。我們認同的是，韋小寶其實有著跟我們類似的一種特質。</p>\n\t\t\t<p>比如在少林寺裡，韋小寶和澄觀和尚之間的對比。澄觀永遠想的是：練個十年可以練好一項武功，練完了再練下一個，這樣三十年就可以練到哪一項。這像是我們慣常思考的方式嗎？難道遇到了問題，可以一天到晚回頭想：如果三十年前我就開始這樣做，如果十年前我不要把時間花在這裡的話……。不可能的，這樣太空泛了。</p>\n\t\t\t<p>一般人比較可能的想法不就是韋小寶式的嗎？可不可以現在、當下，讓我一天之內就可以逆轉這個局面？當人們處於這種不利的狀態下，我們會有幻想。幻想是切身的，那就是我身上突然多了一項本事，讓我在這樣劣勢的情況下不用害怕、不用緊張，可以戰勝所有一切困難。</p>\n\t\t</div>"},{"title":"04　油滑與天真並存","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-38\"><span><span><span>0</span><span>4</span></span></span>　<span>油滑與天真並存</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>我們認同韋小寶，是認同他作為一個無能的底層小人物，但是他有這樣奇特的本事，以及這樣「幸運」的遭遇。不過也不完全是幸運，有一些情況是個人可以控制的，或是韋小寶自己創造出來的。</p>\n\t\t\t<p>這一部分至少說明了，我們和《鹿鼎記》之間的閱讀關係。</p>\n\t\t\t<p>再換另一個角度看，我們更要佩服金庸，因為還有一部分的閱讀樂趣是金庸特別設計的。雖然韋小寶是這樣一個猥瑣、愛錢、好賭，身上擠滿了各種缺點的人，然而金庸知道，要讓讀者能夠讀下去，韋小寶身上還是要有一些特質，能夠在特殊的情況下，依舊呼應了原來武俠小說的根本價值。</p>\n\t\t\t<p>韋小寶身上有這麼多的缺點，可是從一開始遇到了茅十八，他就非救茅十八不可。這是他所有的缺點裡最根本的缺點，一次又一次將他帶到幾乎沒有路可以走的困境當中，逼著他只能夠用無賴暗算、語言表演來想辦法脫困──那叫做自不量力。</p>\n\t\t\t<p>可是他的自不量力常常不是為了自己，而是為了一種非常素樸、天真到很傻的義氣。他心裡有很多的算計，可是他的算計會在關鍵的情況下突然之間通通消失了，以至於把他自己丟進一個最糟糕的環境下。金庸將韋小寶這樣一個有很多缺點的人作為主角，完成了這麼多的事，而在這個過程中，讀者不會感覺到被他得罪了。</p>\n\t\t\t<p>一方面，是因為韋小寶夠聰明。看他騙人，我們私下會一直偷偷地點頭，最後被他說服了，韋小寶憑藉著各種說謊技巧（可以出一本話術大全了），真的就騙過了所有的人。於是讀者隨著韋小寶，得到了一種勝利、過癮的感覺。</p>\n\t\t\t<p>另一方面，韋小寶身上有一種天真，從來沒有消失，而且會在特殊的時候跑出來。</p>\n\t\t\t<p>例如他很愛錢，愛得不得了，衣袋裡動不動就帶著幾十萬兩的銀票；同時他又慷慨得不得了，隨時錢一撒，借此買到自己脫身的機會。如果不認真追究，讀者可能不會發現，韋小寶並不像我們以為的那樣單純。</p>\n\t\t\t<p>韋小寶有著兩面，一面是違背、挑釁了我們的基本道德觀念，作為一個讀者會和這樣的角色有距離，有時甚至會讓讀者討厭。如此一來，主角變成了反面人物，武俠迷也會看不下去，所以必須有另外一面，帶出韋小寶可愛的性格，讓讀者們安心，覺得不需要將他看作壞人──他不壞，或者說他沒有那麼壞。</p>\n\t\t\t<p>這兩面必須結合在一起，也正因為金庸將這兩面結合得太好了，以至於一路讀下去，我們往往忘記了韋小寶其實有這樣的兩面。接下來的問題就是，金庸是怎麼寫的？</p>\n\t\t\t<p>首先是出身。金庸讓韋小寶生於妓院，這個背景對韋小寶的個性有著充分的解釋力。另外，這種環境也養成了韋小寶好賭的特性，而韋小寶的好賭，更是將他身上的光明與黑暗結合在一起的一個最重要技法。</p>\n\t\t\t<p>韋小寶好勝，所以賭博的時候會作弊，這讓我們看到他壞的這一面。可是另一方面，正因為他賭性堅強，以至於常常將遭遇的這一切都視為賭局。既然是賭局，就有不可控制的一面，所以韋小寶經常是豁出去賭的。</p>\n\t\t\t<p>例如第二十六回，韋小寶和負傷的九難、阿珂被桑結喇嘛一行人追殺，他其實沒有任何贏的機會，可是他就想賭一下。賭什麼呢？韋小寶謊稱自己練成了「金頂門」的護頭神功，要對方在他頭頂砍一刀，而他就是要賭桑結他們不會把刀砍到他腦袋上。只要不砍他腦袋，他身上穿著寶衣自然沒事，還能產生嚇阻的作用而趁機反擊；反之，他不只腦袋沒了，命也就沒了。</p>\n\t\t\t<p>即使面對生死關頭，韋小寶仍然有這樣的賭性。當有辦法的時候，他就拚命作弊；可是真的到沒辦法了，他也會有一種豁達：算了，就賭吧，願賭服輸。</p>\n\t\t\t<p>從中產生了韋小寶的迷人之處，那是讓讀者不太容易討厭他的兩種特質。一種特質是，韋小寶在看待事情的時候永遠抱有一種樂觀：只要能夠賭，不管機率是多少，賭贏的機會總是有的。所以即使狀況再怎麼糟糕，韋小寶從來不曾絕望。</p>\n\t\t\t<p>另外一種特質，就是韋小寶有他不算計的那一面。到了一定的程度，就將身家押上去，看看會發生什麼事。這是一種瀟灑、一種豁達。雖然這兩個形容詞感覺似乎跟韋小寶搭不上，但是金庸的確是這樣寫韋小寶的個性的。而且韋小寶的這種豁達、瀟灑，很多時候也不是為了自己，只是到了某個狀況，別無其他方法可想時，那就算了，賭上去吧。</p>\n\t\t\t<p>在韋小寶如此無賴、憊懶的個性背後，金庸其實給他暗藏了一根骨幹，那就是「知其不可而為之」。在這方面，韋小寶其實延續著與令狐冲類似的個性，有的時候傻乎乎的，一部分出自無知，一部分出自衝動。當他展現這樣的瀟灑、豁達，我們就會認同他，雖然過一陣子他又開始說謊、演戲。</p>\n\t\t\t<p>但是有的時候他說謊、演戲，是因為真正不得已，因為他像令狐冲一樣，為了義氣而把自己弄到極端狼狽的狀況下，我們就能夠原諒他、同情他，進而認同他。就算後來他又做了些什麼壞事，我們冷眼地看著他還能夠搞出什麼，可是又不會把注意力挪開，而是會一直關心他。擔心他接下來會遭遇什麼，以及他又如何在完全沒有武功的情況下，從下一個困境中脫逃出來。</p>\n\t\t\t<p>這就是金庸的功力。</p>\n\t\t</div>"},{"title":"05　純熟的小說技藝示範","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-39\"><span><span><span>0</span><span>5</span></span></span>　<span>純熟的小說技藝示範</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>《鹿鼎記》有一個清楚的結構，是完全按照清史中的歷史事件建構起來的。</p>\n\t\t\t<p>從康熙帝親政開始，接著殺鰲拜；然後穿插一段跟順治帝有關，同時也是清初的重要疑案──那時有傳言說順治其實並沒有死，而是上了五台山，因為傷心董鄂妃之死而退位當了和尚。金庸就將這樁疑案寫了進去。接著是兩個對清廷造成極大威脅的勢力，其中天地會的運作與臺灣明鄭相關，以及吳三桂準備發起的三藩之亂，平行變化發展中。接下來牽涉到了俄羅斯，康熙朝要和歐洲國家的政府開始打交道，那是一六四八年歐洲《西發里亞和約》（Peace of Westphalia）所制定的新國際秩序，而中國和新國際秩序中的東歐大國俄羅斯簽訂了第一份正式的外交和約《尼布楚條約》。</p>\n\t\t\t<p>《鹿鼎記》基本上按照這個結構展開。不過在大結構之外，可以再稍微細膩一點去探討《鹿鼎記》的節奏。</p>\n\t\t\t<p>這部小說的節奏十分巧妙，這當然不是金庸到這個時候才學會的，只不過之前的作品從未達到《鹿鼎記》這樣的程度。</p>\n\t\t\t<p>從小說技法上來看，節奏有兩種，一種是鬆緊，一種是快慢。</p>\n\t\t\t<p>如果有人試著向其他人轉述《鹿鼎記》的情節，很可能他的經驗會是，說著說著，就覺得這情節的變化簡直太荒唐了。可是倒過來，在讀《鹿鼎記》的時候卻不會有這種荒唐感。這是因為金庸佈局的節奏感。一旦遇到了較突兀的變化，金庸就用慢的節奏來寫，讓讀者有足夠的時間去接受這件事情；慢的節奏寫多了，讀者就會失去對整件事的整體感受，這個時候金庸就會加快節奏。這是快慢的差別。</p>\n\t\t\t<p>還有鬆緊的變化。和後面情節的變化有關的部分，金庸會寫得很緊，讓事件不斷地發生；等到讀者看得眼花繚亂，金庸就又放鬆下來，安排一些沒什麼大不了的事。即使沒什麼大不了，金庸卻能在裡面填入一些好玩的「跑野馬」內容。這是金庸另外的本事。</p>\n\t\t\t<p>在金庸所有的作品中，沒有任何一部小說能像《鹿鼎記》這樣，經得起用這種方式做節奏上的解釋與分析。</p>\n\t\t\t<p>例如小說開篇，先是讓三位明末清初最重要的文人呂留良、黃梨洲、顧亭林上場，接著寫明史案、文字獄。除了有人物對話外，我們甚至不覺得金庸在寫歷史小說，更不用說和武俠小說有什麼關係了，看起來就是在講一個真實的歷史事件。</p>\n\t\t\t<p>當讀者帶著這樣一種疑惑的心情進入小說第二回，金庸就開始讓讀者安心，武俠小說的寫法回來了。</p>\n\t\t\t<p>揚州麗春院闖入了一群鹽梟，要找天地會的人來尋仇鬧事，然後就出現了茅十八為天地會出頭。茅十八先在麗春院和鹽梟打了一架，原來他到麗春院之前就因為逃獄而受傷了。即使如此，他還要去跟人家決鬥，跑到了城西的得勝山去赴生死之約。</p>\n\t\t\t<p>這些都是傳統武俠小說的寫法，一直不斷地有事件，而且事件跟打鬥、決鬥有關。不過和傳統的武俠小說寫法有個不一樣的地方，那就是多了個小孩。這個平日混在麗春院裡的十二、三歲小孩，不但將茅十八帶了出來，還一路跟在茅十八旁邊，甚至就是靠著他那種市井無賴的、不入流的撒石灰手法，殺了鷹犬高手，救下了茅十八。</p>\n\t\t\t<p>這部分就是用快節奏來寫的。可是寫到這裡，金庸又慢了下來，故事要從揚州拉到北京。這一段寫得又鬆又慢，先是放了一段小插曲，讓他們在客店碰到了雲南沐王府姓白的人，替大罵吳三桂而和官兵起衝突的茅十八解圍。接著上路的茅十八和韋小寶兩人就大聊起來：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶問道：「他在你耳朵邊說了句甚麼話？」茅十八道：「他說：『在下是雲南沐王府的，姓白。』」韋小寶道：「嗯，姓白，原來是個吃白食的。」……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>茅十八斥責韋小寶不是武林中人，竟不識沐王府，再講到韋小寶撒石灰的下三濫行徑，便跟他約法三章，話題又繞回來：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>茅十八道：「姓白管姓白，怎麼姓白的就吃白食？他們姓白的，在雲南沐王府中可大大的了不起哪。劉、白、方、蘇，是雲南沐王府的四大家將。」韋小寶道：「甚麼三大家將、四大家將？沐王府又是甚麼鬼東西？」茅十八道：「你口裏乾淨些成不成？江湖之上，提起沐王府，無不佩服得五體投地，甚麼鬼不鬼的？」……</p>\n\t\t\t<p>茅十八道：「當年明太祖起兵反元，沐王爺沐英有大功，平服雲南，太祖封他沐家永鎮雲南，死後封為甚麼王，子孫代代，世襲甚麼國公。」韋小寶一拍馬鞍，大聲道：「原來雲南沐王府甚麼的，是沐英沐王爺家裏。你老說雲南沐王府，說得不清不楚，要是早說沐英沐王爺，我哪還有不知道的？沐王爺早死了幾千年啦，你也不用這麼害怕。」</p>\n\t\t\t<p>茅十八道：「甚麼幾千年？胡說八道。……」韋小寶道：「啊，這位沐天波老爺，原來就是『英烈傳』中沐英的子孫。沐王爺勇不可當，是太祖皇帝的愛將，這個我知道得不想再知道啦。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶為什麼知道？因為他聽說書人講過。接下來的對照很好玩，金庸說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>茅十八是草莽豪傑，於明朝開國的史實一竅不通，徐達、常遇春的名字當然聽見過，卻不知他們是甚麼六王，也不知此外還有四個甚麼王。韋小寶卻在揚州茶坊之中將這部「英烈傳」聽得滾瓜爛熟。其時明亡未久，人心思舊，卻又不敢公然談論反清復明之事，茶坊中說書先生講述各朝故事，聽客最愛聽的便是這部敷演明朝開國、驅逐韃子的「英烈傳」。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶既然熟，就開始模仿說書先生，講起沐王爺沐英如何助明太祖打天下。幹嘛講沐英的故事給茅十八聽？一方面也是讓讀者知道沐王府的來歷。可是韋小寶足足講了小說八頁篇幅之多，遠超過單純交代沐王府背景的功能，讀者看了卻不會膩，這是鬆有鬆的樂趣。</p>\n\t\t\t<p>比如說，他講一支箭連穿十名將軍：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他（韋小寶）繼續說道：「沐王爺眼見得達里麻張開血盆大口，又要大叫，於是彎弓搭箭，颼的一箭，便向達里麻口中射去。沐王爺的箭法百步穿楊，千步穿口，這一箭呼呼風響，橫過了江面，直向達里麻的大嘴射到。那達里麻也是個英雄好漢，眼見這箭來得勢道好凶，急忙低頭，避了開去。只聽得後軍齊聲呐喊：『不好了！』達里麻回頭一看，……這一箭連穿十名將軍，從第一名將軍胸口射進，背後出來，又射入了第二名將軍胸口，一共穿了十人。」……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>故事講到這裡，韋小寶還要再加這一段：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶道：「也算達里麻命不該絕，第一箭射中他的左眼，仰後便倒，第二箭、第三箭又接連射死了韃子八名大將。韃子身上多毛，明軍叫他們毛兵毛將。沐王爺連射三箭，射死了一十八員毛將，這叫做『沐王爺隔江大戰，三箭射死毛十八！』」</p>\n\t\t\t<p>茅十八一怔，道：「甚麼？」韋小寶道：「沐王爺隔江射死毛十八！」說到這裏，忍不住格格格笑了出來。茅十八這才明白，他果然是繞著彎兒在罵自己……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這就是鬆的寫法，沒有發生任何事情，可是我們讀著覺得好有趣。韋小寶竟然能夠拐彎抹角地自己加入這一段故事，來開茅十八的玩笑。</p>\n\t\t\t<p>還沒完，韋小寶又講了一些沐王爺過江的故事，然後說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶道：「……這一仗韃子兵大敗，溺死在江中的不計其數。江中的王八吃了不少長毛韃子的屍首，從此身上有毛，這種王八叫做毛王八，那是別處沒有的。」</p>\n\t\t\t<p>茅十八覺得韋小寶又在罵自己了，哼了一聲，卻也不敢確定，或許雲南江中真有毛王八亦未可知。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這就是鬆，鬆就帶來了另外一種樂趣。</p>\n\t\t\t<p>兩人到了北京城，剛在一家小酒店落腳，就被海老公抓到了皇宮裡，敘事節奏立刻開始變快。海老公審完茅十八，要他自廢雙手一眼，情況緊張得不得了，誰知韋小寶趁著海老公和小桂子沒留意，逮到了機會，挑了過量的藥粉將海公公給弄瞎，又把小桂子給殺了。自此他就只好開始冒充小桂子。</p>\n\t\t\t<p>劇情的轉折非常快，留在皇宮裡的韋小寶遇見了康熙皇帝。康熙剛上場的時候，對韋小寶自稱小玄子。至此，前頭的快節奏、多事件剛過，金庸又要鬆一下，讓讀者休息一會兒。</p>\n\t\t\t<p>金庸順理成章地用到他對韋小寶的角色設定，揚州妓院出生的他，從小就會跟人家擲骰子賭錢。海老公叫他練習擲骰子，韋小寶還得假裝擲不好。金庸甚至還補了一段知識，骰子有灌鉛的，有灌水銀的，這兩種有不同的作弊手法。海老公讓韋小寶去跟宮裡其他的太監擲骰子賭錢，尤其要贏了溫家兄弟，換得偷偷入上書房的機會。這是鬆的部分。</p>\n\t\t\t<p>對宮規一竅不通的韋小寶為了偷吃點心，遇到了小玄子，又跟小玄子打了起來。這一段金庸仍然很有耐心，慢慢地寫。兩個人約好隔天再打，然後各自回去找師父。</p>\n\t\t\t<p>不過節奏雖然慢，卻有它的緊張感，因為有好幾條線的懸念一直拉住我們。</p>\n\t\t\t<p>第一條線是海老公和韋小寶之間的關係。海老公教韋小寶武功，讓他去跟皇帝打架，可是這個過程中，讀者隱隱約約感覺到，海老公雖然瞎了，不應該那麼好騙，他不可能不知道韋小寶不是小桂子吧？</p>\n\t\t\t<p>第二條線是小玄子的師父與海老公的目的。皇帝怎麼會在皇宮裡練武功？誰教他的？海老公又為什麼願意教韋小寶武功，去跟小玄子鬥，還想盡辦法要套出小玄子師父的武功來歷？</p>\n\t\t\t<p>接下來關鍵的一場戲，韋小寶終於進到上書房，本來是要偷書的──海大富讓他賭錢贏錢再借別人錢，為的就是要去偷上書房裡的《四十二章經》。《四十二章經》在這部小說裡當然非常關鍵，然而，趣味就來了。</p>\n\t\t\t<p>讓韋小寶去偷書，無疑是瞎子摸象。他假裝小桂子的身分，所以不敢說他不識字。幸好《四十二章經》五個字裡有三個字「四十二」他是認得的，要不然就一定穿幫了。</p>\n\t\t\t<p>於是他就想，我到上書房一看到《四十二章經》，把它拿出來就好了。沒想到一去，完了，書房裡全都是書，從何找起？他總共就只認得「四十二」這幾個字，要在這麼多書裡把「四十二」找到，太困難了。</p>\n\t\t\t<p>就在這時候，金庸的筆法又從鬆到緊，從慢再轉快──韋小寶發現了跟他打架的小玄子原來就是皇帝。康熙回到上書房，接著鰲拜也進來稟報，卻被康熙戳破他陷害蘇克薩哈的私心，就要上前跟康熙理論。誤打誤撞下，韋小寶必須現身，擋在康熙與鰲拜中間。於是敘事又變快了，康熙想要對付囂張已久的鰲拜，就聯合韋小寶，找了些小太監假裝練摔跤，趁機擒住了鰲拜。</p>\n\t\t\t<p>這一大段都是快節奏，一直有驚險的事件發生，直到韋小寶到康親王府的監牢殺了鰲拜。中間有一個小插曲，將這個快的節奏稍微緩和一下，那就是鰲拜被抓之後，皇帝命索額圖和韋小寶去抄鰲拜的家。</p>\n\t\t\t<p>抄家的過程，敘述又變鬆了。這段情節表面上看起來，與正在快速進行中的事件是無關的、是插寫的，其實卻是一大伏筆：韋小寶在鰲拜家中得到了寶衣和匕首，憑著這兩件神器，後來才能夠多次大難不死。</p>\n\t\t\t<p>此外，這裡很重要的作用是，表明了金庸對官場、對政治的觀察，呈現了《鹿鼎記》歷史小說的這一面。</p>\n\t\t\t<p>在這裡，索額圖的每一個想法都是做官的思維。他首先想：皇帝為什麼要派這個人跟我一起去抄家？目的何在？他想到的答案是：這個人是來監視我的。這是官場上必須要有的警覺。表面上皇帝叫他來幫你，不可能真的這麼單純，一定是要來監督你的。</p>\n\t\t\t<p>還有，這個人有功於皇帝，所以我該怎麼對付他呢？不能夠打壓他，因為不知道他跟皇帝之間的關係到底有多親近。怎麼辦呢？那就收買他、賄賂他。怎麼收買？這是有手法的。</p>\n\t\t\t<p>這個手法就是「有錢一起貪」。把抄家清單上的二百多萬兩，其中的一百萬兩給抹下來，報上去的只剩下一百多萬兩。這拿走的一百萬兩，二一添作五，你一半我一半，於是韋小寶突然之間就分到五十萬兩的橫財。</p>\n\t\t\t<p>這樣還不夠，還要再細膩一點：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>索額圖……哈哈大笑，道：「……這樣罷，這裏所有辦事的人，大家都得些好處，做哥哥的五十萬兩銀子之中，拿五萬兩出來，給底下人大家分分。兄弟也拿五萬兩出來，宮裏的妃子、管事太監他們面上，每個人都有點甜頭。這樣一來，就誰也沒閒話說了。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是見者有份，免得人家去告密。金庸對中國官場可說是觀察入微。</p>\n\t\t\t<p>前面是政治面的快節奏，然後又轉回武俠面的快節奏。之前鋪陳的懸念有了答案，原來海大富早就知道韋小寶不是小桂子，他利用完韋小寶就要收拾他，而且早就在韋小寶的飲食裡偷偷下毒。</p>\n\t\t\t<p>接著在慈寧宮的花園，發生了驚天動地的夜間戲。原來海大富是順治皇帝身邊的人，他奉了順治的密令，回到紫禁城，為了查明董鄂妃的真正死因。海大富查知孝康皇后、董鄂妃、貞妃和榮親王四人都是死於蛇島的「化骨綿掌」，而兇手正是小玄子的師父、當今的皇太后。這是不得了的大事，但它還需要一個牽連，韋小寶必須在場。</p>\n\t\t\t<p>韋小寶怎麼會跑到慈寧宮呢？於是又牽出另外一條線，金庸寫了這部小說中韋小寶遇到的第一個女孩子，那是宮女蕊初。韋小寶得太后賞賜蜜餞果子，叫蕊初帶他去取，他就多拿了些想要給蕊初吃，才和她約在慈寧宮的花園，因而撞見了海大富和皇太后的對決。</p>\n\t\t\t<p>兩人鬥到後來以內力相拚，看起來很重要的角色海大富竟然死了，連帶又產生了一大疑惑：怎麼會有武功這麼高的太后？但金庸不急著揭曉，而是一步一步吊著讀者胃口，慢慢地發現，太后不但武功高強，而且她也在找《四十二章經》，宮裡還有她的師兄、師妹──原來這人是神龍教的人，是假太后。</p>\n\t\t\t<p>光是安排假太后這一條線，金庸拖了多長？從第六回到第二十五回，這樣一路變化，期間韋小寶又誤打誤撞地成了神龍教的白龍使，搖身一變成為太后的頂頭上司，形勢立刻翻轉，讓讀者看得大呼過癮。</p>\n\t\t\t<p>以上只是開頭的前幾回，金庸書寫的節奏變化就已經如此有鬆有緊、有快有慢，而且彼此交互作用。這樣的敘事節奏，一方面讓讀者更容易進入到故事的情節和情緒中，一方面說服我們、勾引我們、誘惑我們接受很多難以相信的劇情。在這部小說裡，金庸創造了閱讀的巨大樂趣，同時示範了一位小說家在小說技法上可以何等純熟。</p>\n\t\t</div>"},{"title":"06　《鹿鼎》與《書劍》的同與不同","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-40\"><span><span><span>0</span><span>6</span></span></span>　<span>《鹿鼎》與《書劍》的同與不同</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸的小說創作歷程很奇特：有明確的開端，也有明確的結尾。絕大部分的作者不是這樣的。大部分的作者，開頭往往要經過很多的模仿、練習、被退稿，然後一點一點地突破，才開始有了像樣的作品。對這樣的作者，很難指明他寫作的開端在哪裡。金庸不是，他的創作開端非常明確就是《書劍恩仇錄》，一起筆就是非常成熟的連載武俠作品。</p>\n\t\t\t<p>此外，絕大部分的作家寫著寫著，創造力會慢慢衰退，越寫越沒辦法突破，可能偶爾靈光一現，又回到原來的狀態。這樣的寫作生涯是拖長的，甚至有的人去世之後還有遺稿發表，所以也很難說究竟什麼時候是他的創作終點。金庸在這方面也很特別，他有一個非常明確的封筆收尾，就是《鹿鼎記》。</p>\n\t\t\t<p>《鹿鼎記》不只是金庸的最後一部武俠小說，更特別的是，在寫《鹿鼎記》的時候，金庸大概就已經意識到，這是他的最後一部作品。金庸創作生涯的開頭雖然有點無心插柳，結尾卻是自己的選擇與決定。他選擇封筆，不可能是意外之舉。</p>\n\t\t\t<p>如何開始，便如何結束。</p>\n\t\t\t<p>作為金庸小說起點的《書劍恩仇錄》，寫的是陳家洛、乾隆皇帝與紅花會之間的故事。小說中最重要的懸念就是乾隆的真實身分。根據傳說，在血緣上他是一個漢人，於是陳家洛和紅花會想了各種方法，試圖要策反乾隆，讓他變成漢人皇帝，藉此將韃子趕出去。</p>\n\t\t\t<p>到了金庸的最後一部小說，似乎重新回到這個設定上，只是《鹿鼎記》中的皇帝換成了康熙，紅花會換成了天地會，主角韋小寶和康熙變成了拜把子的兄弟。</p>\n\t\t\t<p>金庸的史學根基深厚，紅花會和天地會其實是一回事。這中間有一個明確的連繫。《鹿鼎記》第八回中，寫陳近南收了韋小寶當徒弟，同時告訴他天地會的聯絡暗號：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>陳近南拉了韋小寶的手，回到廂房之中，說道：「北京天橋有一個賣膏藥的老頭兒，姓徐。別人賣膏藥的旗子上，膏藥都是黑色的，這徐老兒的膏藥卻是一半紅，一半青。你有要事跟我聯絡，到天橋去找徐老兒便是。你問他：『有沒有清惡毒、使盲眼復明的清毒復明膏藥？』他說：『有是有，價錢太貴，要三兩黃金、三兩白銀。』你說：『五兩黃金、五兩白銀賣不賣？』他便知道你是誰了。」</p>\n\t\t\t<p>韋小寶大感有趣，笑道：「人家貨價三兩，你卻還價五兩，天下那有這樣的事？」</p>\n\t\t\t<p>陳近南微笑道：「這是唯恐誤打誤撞，真有人向他去買『清毒復明膏藥』。他一聽你還價黃金五兩、白銀五兩，便問：『為甚麼價錢這樣貴？』你說：『不貴，不貴，只要當真復得了明，便給你做牛做馬，也是不貴。』他便說：『地振高岡，一派溪山千古秀。』你說：『門朝大海，三河合水萬年流。』他又問：『紅花亭畔那一堂？』你說：『青木堂。』他問：『堂上燒幾炷香？』你說：『五炷香！』燒五炷香的便是香主。他是本會青木堂的兄弟，屬你該管。你有甚麼事，可以交他辦。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>關鍵就在這一句「紅花亭畔那一堂」，這裡特別將「紅花」標誌出來。「紅花」一詞早就有了，那是來自明朝開國洪武皇帝的「洪（紅）」字，留在了天地會裡，作為興復明朝的象徵。</p>\n\t\t\t<p>《書劍恩仇錄》寫紅花會和乾隆之間的關係，《鹿鼎記》寫天地會和康熙之間的關係，可以說有頭有尾。這一頭一尾其實只隔了十五年的時間，我們卻能清楚看到金庸思想上的變化。</p>\n\t\t\t<p>在《書劍恩仇錄》裡，一邊是乾隆皇帝，一邊是紅花會，領袖是陳家洛；到了《鹿鼎記》，一邊是康熙皇帝，另一邊天地會的領袖是陳近南。不過，陳家洛是《書劍恩仇錄》的主角，陳近南卻不是《鹿鼎記》的主角，關鍵就在於金庸的寫法大幅改變了。《鹿鼎記》的主角韋小寶，是翻遍了《書劍恩仇錄》都找不到對應的一個角色。</p>\n\t\t\t<p>金庸創作的小說中，有很多「不像主角的主角」，甚至可以說是「不應該當主角的主角」，後期尤甚。金庸正是靠著這樣的設定，寫出了其他人都寫不出的角色故事。</p>\n\t\t\t<p>不應該當主角的主角，例如《神鵰俠侶》的楊過。對照《射鵰英雄傳》的主角郭靖，他是個苦命的孩子，但一生下來就有一種素樸的正義感，本來就是當大俠的材料。到了《神鵰俠侶》，金庸寫了一個本來並不具備大俠素質的楊過，他身上還背負著原罪，父親楊康是一個壞人。楊過上場的時候是個小乞丐，但關鍵不在於乞丐這個身分，而是他的心態、他的個性，明顯脫胎自魯迅的《阿<span>Q</span>正傳》。</p>\n\t\t\t<p>雖然金庸讓楊過以這種方式出場，卻藉此寫了一段感人的故事，也是這部小說最迷人的地方，可以稱之為「愛情萬能論」。即使有這樣的遺傳，即使以孤兒乞丐的窘況開始他的歷險，楊過後來還是成了一代大俠。因為他和小龍女之間的愛情，「為情執著」的信念，改變了一切。</p>\n\t\t\t<p>還有《連城訣》的狄雲，這是另一個不像主角的主角。他就是個鄉巴佬，土得不得了，武功也差得不得了，因為他的師父根本就沒有打算認真教他。之後，像是《基度山恩仇記》的情節，狄雲雖然遭陷害而被打入大牢，卻認識了丁典，學到了「神照經」神功，在一路受冤的過程中，解開了劍訣之謎，讓所有貪婪的人受到懲罰。</p>\n\t\t\t<p>另一個非常突出的角色，是《俠客行》的石破天，他也是一個小乞丐。小乞丐肚子餓了，去搶燒餅吃，咬到了玄鐵令，便開始了傳奇的故事。石破天從頭到尾都不識字，也不通世故，沒有身為俠客應該具備的涵養。不過，他卻破解了所有武林高手都參透不了的「俠客行」神功，就在於他不識字。這是他最不像大俠的缺失條件，反而讓他的武學造詣超越了所有的大俠。</p>\n\t\t\t<p>接下來，到了《天龍八部》的段譽。從某個角度來看，書獃子形象的段譽，好像跟石破天是截然相反的，但其實形成一體兩面。段譽和石破天初涉江湖，一樣都不懂武功。段譽為什麼不學武？和石破天剛好相反，因為他讀書讀得太多了。不只讀書，而且入迷；不只入迷，而且相信書中所說的道理，以至於他跟不識字的石破天一樣，都是傻小子。</p>\n\t\t\t<p>這些都是「不應該」作為主角的主角，因為他們不具備可以闖蕩江湖的基本條件。也就是說，和過去的武俠小說相比，讀者立即就能夠辨識出，他們都沒有作為「俠」的性格和條件。</p>\n\t\t\t<p>金庸剛開始寫武俠小說的時候，其實也依循過去的傳統，像是陳家洛，一上場就已經具備了所有身為大俠應該要有的條件。到了《碧血劍》的袁承志，身世鋪陳得就更仔細了，小說完整地交代了他如何開發自己成為俠的這種好的遺傳，因為他是遼東將軍袁崇煥的兒子，經過努力，加上特別的際遇，順理成章地成為匡扶義軍的江湖領袖。</p>\n\t\t\t<p>到了寫郭靖時，金庸明顯對這樣的寫法感到煩膩了。對於這種順向的故事，金庸沒有太多耐心。於是從楊過開始，他轉而寫逆向的故事，不是because of，而是in spite of──並不是因為這樣或那樣就變成了俠，而是即使這樣或那樣，竟然還是成為了俠。這是不一樣的逆向故事的說法。</p>\n\t\t\t<p>《笑傲江湖》的令狐冲，也不是我們想像中的俠。身為大俠，比武的時候一般都會贏的，頂多就是贏得困難一點、驚險一點。但初時功夫不濟、後來內功全失的令狐冲，卻是一路輸，還一路受傷。這樣的人竟然能夠當主角，讓讀者們如此傾倒，正是因為金庸從楊過開始，主角的寫法都變成了「竟然」。</p>\n\t\t\t<p>但金庸還不滿足，他從楊過、狄雲、石破天、段譽、令狐冲一路寫下來，寫到了最極致，最後蹦出來一個「無以復加」的韋小寶。</p>\n\t\t\t<p>作為一個主角，金庸在韋小寶身上發明、堆砌了各種既不像、也不應該當主角的素質。更驚人的是，金庸不只要把這樣的韋小寶寫進江湖中當主角，還要將他寫到歷史裡去當主角。這兩者很不一樣。</p>\n\t\t\t<p>為什麼說金庸「怎麼開始，就怎麼結束」？因為在作為句點的《鹿鼎記》中，金庸明確地回到了歷史小說，或者說，是用寫歷史小說的方式來寫武俠小說。</p>\n\t\t\t<p>於是韋小寶這個不像主角的主角，要承擔著雙重主角的考驗：他不但要做一個在武林、江湖裡闖蕩的主角，還要做一個在重大的歷史事件中發揮重要作用的主角。這就遠遠超越了從楊過到令狐冲的角色設定和寫作挑戰。</p>\n\t\t\t<p>陳家洛、袁承志雖然也是歷史情境中的主角，但是一來，他們本來就具備主角的身分和特質；二來，作為主角，他們在小說裡發揮的作用，仍然與韋小寶不一樣。</p>\n\t\t\t<p>在兩部小說中，陳家洛、袁承志最後都成了悲劇式的英雄。最悲哀的地方在於，即使經過這麼多的努力，他們最終無法扭轉歷史。《鹿鼎記》裡，韋小寶在所有歷史的關鍵時刻都發揮了作用，扮演了舉足輕重的當事人。</p>\n\t\t\t<p>這真的是金庸非常驚人且不可思議的筆法，也讓《鹿鼎記》成為和《書劍恩仇錄》、《碧血劍》截然不同的逆向寫法的極致。</p>\n\t\t</div>"},{"title":"07　「顛覆」明明白白的歷史","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-41\"><span><span><span>0</span><span>7</span></span></span>　<span>「顛覆」明明白白的歷史</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸對歷史非常感興趣，所以他從一開始就將武俠與歷史寫在一起。第一本《書劍恩仇錄》這樣寫，第二本《碧血劍》也這樣寫，然而到了《射鵰英雄傳》，他必須要改變，因為歷史小說讓他遇到了瓶頸。</p>\n\t\t\t<p>《書劍恩仇錄》裡，主角陳家洛千辛萬苦地尋找身世證據，只為了拉攏乾隆。但讀著讀著，坦白說，讀者心裡已經開始感到無奈，感到不舒服，因為我們知道結果是什麼。紅花會羣雄成功綁架了皇帝，將皇帝關在六和塔裡，那又怎麼樣？乾隆並沒有變成漢人皇帝，我們明明白白知道這段歷史。</p>\n\t\t\t<p>因此，這種小說寫下去只有兩種結果，兩種結果都讓人不舒服。一種結果是，如果乾隆被他們說服了，他和他的兄弟陳家洛聯手推翻了大清，成立一個漢人王朝，你會有什麼感受？大概很難接受吧。金庸也知道讀者不能接受，所以小說走向了另一種結果，那就是紅花會註定失敗，這部小說必定是個悵惘的結局。</p>\n\t\t\t<p>讀《碧血劍》也是這樣。袁崇煥被崇禎下旨凌遲，死得如此悲慘，其子袁承志因此投靠了闖王，助闖軍攻入北京。可是寫到這裡就麻煩了，因為所有人都知道，大順政權必然要失敗。</p>\n\t\t\t<p>可以想見，金庸寫了兩部不得不無奈結束的歷史武俠小說，他自己或許也覺得很灰心。到了《射鵰英雄傳》，他就不這樣寫小說了。</p>\n\t\t\t<p>可是經過了十五年，金庸不斷累積寫作功力，所謂「藝高人膽大」，他決定回到自己起始的地方，回到《書劍恩仇錄》的設定，他要寫真實的歷史人物、真實的歷史事件。但之前沒辦法解決的問題，現在不也還在嗎？歷史的結果讀者早就知道了。</p>\n\t\t\t<p>我們彷彿看見，這個重新回來的、「藝高人膽大」的金庸，帶著微笑對讀者說：你們知道又怎樣？我不在意。我不在乎你們早就知道結局，我仍然有本事寫得讓你們目瞪口呆，想要一直看下去。</p>\n\t\t\t<p>這一次，金庸不僅要將虛構的韋小寶寫進歷史裡，更藉由韋小寶這個角色，挑戰一般人對歷史的概念。一般人的概念是什麼？不就是某些人在特定的時間做了些什麼事嘛！換句話說，歷史是由歷史人物和歷史事件所構成的。</p>\n\t\t\t<p>將韋小寶這樣的角色寫進歷史裡，要受到多大的限制？而且金庸不只要寫歷史情境，還要寫出確切的歷史人物和歷史事件；他沒有要改寫康熙，也沒有要改寫康熙朝發生的重大事件，而是要把韋小寶寫進這幾個重大事件中。</p>\n\t\t\t<p>康熙朝發生過的重大事件，又有一部分的性質和《書劍恩仇錄》裡是不一樣的。《書劍恩仇錄》所寫乾隆的漢人身分，是野史傳言。《鹿鼎記》裡也有類似的事件，例如傳言順治帝在五台山出家，所以韋小寶奉了康熙的密令去尋找並保護順治。又如董鄂妃遭謀殺的疑案，這也是野史傳聞。</p>\n\t\t\t<p>但在《鹿鼎記》中，更重要的是幾件正史裡清楚記載的事件，如康熙擒拿鰲拜、鎮壓平西王、中俄簽訂尼布楚條約等。這三件大事的結果，是任何一位小說家都不能輕易改變的。</p>\n\t\t\t<p>為什麼金庸這個時候不怕讀者知道歷史的結果？因為結果不重要。他現在告訴你，雖然你知道這些事件的結果，卻不知道這些事件是怎麼來的。金庸不是要改寫歷史的結果，而是要改變因果過程。這不是簡單的因，而是至關重要的因──康熙如何擒了鰲拜？因為有韋小寶；康熙如何知曉吳三桂的謀畫？因為有韋小寶；清朝如何跟俄羅斯簽訂了有利的條約？因為有韋小寶。</p>\n\t\t\t<p>在歷史裡面加進一個元素，看起來簡單，其實非常困難。</p>\n\t\t\t<p>舉例來說，好萊塢的科幻電影《回到未來》（Back to the Future）是一九八五年上演的，但故事的開場背景是二<span>○</span>一五年，然後當時的人被送回到一九八五年。為什麼？因為三十年前如果某件事情被改變了，後面的現實就會如蝴蝶效應般不斷地放大，一切通通會變得不一樣。</p>\n\t\t\t<p>如果在那個節骨眼上，這個男孩沒有看到那個女孩，那就麻煩了。他沒有愛上這女孩，接下來就不會跟這女孩結婚，原本會生下來的兒子就不見了。歷史是這樣環環相扣的，不是簡單地在過程中稍微改變一下，最後還能夠得到同樣的結果。</p>\n\t\t\t<p>前面我曾用美國魔術師胡迪尼來比喻金庸寫《鹿鼎記》的狀態，他給自己戴上了歷史現實的手銬，接著又鎖上了不能改變歷史結果的鐵鍊。再來，他把自己放進一個箱子裡，那是他打算要改變歷史原因，而這個歷史原因全部扣著同一個人。這還不夠，他還要把自己丟到大水箱裡，因為他要寫的這個最關鍵的人，從任何角度來看都不像一個大人物：沒有身分，沒有武功，沒有地位，沒有知識，沒有我們認可的政治本事。</p>\n\t\t\t<p>這樣一個人，將他放進歷史裡，最後還要靠著他來左右所有的歷史事件，這夠難寫的吧？都已經把箱子丟到水裡了，還沒完，我們甚至不知道這個「胡迪尼」還要給自己添加什麼樣的考驗──好吧，外面再圍一層火圈還是什麼的──他還硬要再多那麼一點點，他要挑戰、或者說要挑釁歷史學者。</p>\n\t\t\t<p>這是金庸版的歷史。當讀者讀了這部小說，讀了這樣的歷史解釋，如果之後遇到了一位歷史學家，你對他說，鰲拜是韋小寶殺的，《尼布楚條約》也是韋小寶簽的……，你猜歷史學家會有什麼反應？</p>\n\t\t\t<p>既然對方是歷史學家，他很可能會拿出一堆證據，告訴你史料上是怎麼寫的，清史漢文檔有些什麼材料、滿文檔又有哪些材料，誰有什麼樣的記載，誰又說了什麼，一路排開來……。這是他們的專業本事，是他們的權威。</p>\n\t\t\t<p>金庸怎麼挑戰歷史學家？他在小說裡明明白白告訴你：為什麼韋小寶幹了這麼多事，史料裡卻沒有記錄他這個人。</p>\n\t\t\t<p>例如擒殺鰲拜，這件事不可能記到他頭上。那個時候韋小寶只是一名小太監，使了暗算的手段好不容易拿下鰲拜，史料記載「健童悉起擒之」，韋小寶當然也算是「健童」之一；待得後來鰲拜被拘禁，他又偷偷地奉了康熙之命去暗殺鰲拜。如果被人知道了細節，這是多麼毀損名譽的事。所以，這件事情能夠被揭露嗎？而且誰控制史料？不都是皇帝嗎？史籍沒有出現韋小寶之名，毋寧是理所當然的。</p>\n\t\t\t<p>至於《尼布楚條約》的史料文獻上，為什麼沒有韋小寶的名字？金庸這樣說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>條約上韋小寶之簽字怪不可辨，後世史書只識得索額圖和費要多羅，而考古學家如郭沫若之流僅識甲骨文字，不識尼布楚條約上所簽之「小」字，致令韋小寶大名湮沒。後世史籍皆稱簽尼布楚條約者為索額圖及費要多羅。古往今來，知世上曾有韋小寶其人者，惟「鹿鼎記」之讀者而已。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>讀《鹿鼎記》有什麼樂趣？樂趣之一大概就是可以讓你去跟歷史學家抬槓用。</p>\n\t\t\t<p>可是要知道，為了做到這樣，這部小說有多難寫。金庸必須花多少腦筋，動用多少構想，中間有多少設計轉折，才能夠寫到這種程度。這是《鹿鼎記》了不起的地方。如此一層一層的，看似已經將寫作條件全部綁死了，但是最後，金庸將自己設定的所有限制一一掙脫開來，寫成了這樣一部小說。</p>\n\t\t</div>"},{"title":"08　歷史上真的沒有韋小寶嗎？","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-42\"><span><span><span>0</span><span>8</span></span></span>　<span>歷史上真的沒有韋小寶嗎？</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>閱讀《鹿鼎記》的一大樂趣，就是看金庸如何「顛覆」明明白白的歷史，將韋小寶這樣一個人物穿插到康熙一朝的各項大事中，並且發揮了關鍵作用。如果有人質疑，為什麼這麼重要的人物沒有在史籍留下記錄，金庸也在小說裡給出難以反駁的理由。</p>\n\t\t\t<p>《鹿鼎記》有多難寫呢？舉一個簡單的例子，看看小說的開場。</p>\n\t\t\t<p>開場的時候，韋小寶是揚州妓院裡一個十二、三歲的小孩。不要小看這個角色設定，它和後來發生的許多事情都有關係。</p>\n\t\t\t<p>一個疑問是，韋小寶來自揚州，但後面所有發生的事情明明都在北京──進入了皇宮，認識了康熙，跟皇家朝政、甚至反清勢力牽扯在一起。那為什麼不把韋小寶寫在北京出生？金庸有他的道理，後面情節上他需要韋小寶是一個揚州人。</p>\n\t\t\t<p>可是要讓十二、三歲的小孩從揚州跑到北京，這中間需要適當的理由和解釋。反過來想，那是不是就不要讓韋小寶是十二、三歲，他可以是十八歲？一個青年，要從揚州去北京，有很多理由可以找。</p>\n\t\t\t<p>因為不是十八歲，才要有茅十八這一段，讓茅十八帶他上北京。但如果茅十八是拐騙、綁架小孩，後面的情節通通也都不一樣了。金庸必須讓韋小寶自願跟著茅十八，而且家人還不會找他。在妓院長大的韋小寶，經常在外面胡混，這是一項條件。同時，愛聽說書的韋小寶最羨慕英雄好漢，茅十八為天地會的人撐腰，又扯到了要去北京找鰲拜比武。聽到這裡，韋小寶興奮得不得了，當然想要跟去瞧瞧。</p>\n\t\t\t<p>問題又來了，為什麼要將韋小寶的年紀設在十二、三歲？因為這是一個大人不太會在意他、仍將他當作小孩的年齡。如果他不是十二、三歲，怎麼能夠假冒小太監？聲音和外表很容易就暴露了。而如果他沒混進宮裡成為小太監，就不會遇到小玄子。光是一個開場，每件事都是一環扣一環的仔細設計。到後來你會發現，韋小寶非得是十二、三歲不可，不然這一段情節也寫不了。一個揚州來的小混混、假冒的小太監，完全不懂宮裡規矩，看到小玄子的服色也認不出來。他就是跑到練武房偷吃點心的，看到一個人走進來，跟他年紀差不多，很自然依照自己的想法，認為這個人也是來偷吃的。</p>\n\t\t\t<p>他不認識皇帝，憑什麼能夠和皇帝結交？因為打架。皇帝從來沒有機會能好好打架，誰敢跟皇帝打架啊？可是這個時候，十四、五歲，正在學功夫的皇帝，恨不得有人可以跟他打架。必須具備這樣的前情安排，韋小寶必須具備這樣的身分，才能夠將他和康熙的關係解釋得合理。</p>\n\t\t\t<p>還不只如此，這個十二、三歲的身分，在殺鰲拜時也發揮了重要的作用。要把鰲拜幹掉，有各種方法。韋小寶原來想的，就是將海老公藥箱裡的藥粉，不管有毒無毒，隨便混一些，倒在鰲拜的食物裡，應該就能毒死他。可偏偏就在這時候，天地會青木堂的人來劫獄了。</p>\n\t\t\t<p>在那樣混亂的局面中，金庸是怎麼寫的？韋小寶以為這些人是來救鰲拜的，怕得不得了。這群人看到他是個太監，也不可能放過他。要怎麼逃呢？</p>\n\t\t\t<p>這群人撬不開關押鰲拜牢房的鐵門，就改撬窗戶的欄杆，剜開了一個洞。韋小寶因為身材瘦小，就從大人鑽不進去的洞，「咚」的一聲鑽進去了，接著用匕首刺死了牢房裡發瘋的鰲拜。</p>\n\t\t\t<p>青木堂的人在外頭目睹了，就把他抓走。小說裡的兩個陣營，終於透過韋小寶連繫了起來：一邊是和朝廷、和康熙皇帝的關係；另一邊是和天地會、和陳近南的關係。在宮裡，這麼巧，韋小寶認識了皇帝；到外面，也那麼巧，韋小寶認識了天地會總舵主陳近南。</p>\n\t\t\t<p>這也是一個縝密的安排。青木堂的人為了賭一口氣，為尹香主復仇，大家一起在他靈前發誓：誰殺了鰲拜，就奉他為香主。這下糟了，韋小寶不只和天地會扯上關係，還和他們堂內的糾紛也扯上了關係。</p>\n\t\t\t<p>青木堂出現了兩位香主候選人，兩方擁立者爭執起來，已經到了快要兄弟反目的地步，非得要總舵主陳近南出面不可。所以他做了為難的決定，讓韋小寶當香主以弭平紛爭。韋小寶沒有身分、沒有功績，沒辦法，陳近南只能收他當徒弟，別人才不能多說什麼。</p>\n\t\t\t<p>一個十二、三歲的小孩，從揚州麗春院來到了北京紫禁城，沒有武功，隨時扯謊，擅長表演，有著狡猾的個性，同時又有著堅強的賭性，要將所有這一切放在韋小寶身上，才能讓他在朝廷和武林兩個世界裡無往不利，而且扮演著重要的角色。他是康熙皇帝的親信，也是天地會總舵主的弟子。一切環扣得如此緊密，而這不過是金庸對韋小寶這個角色的初步設定而已。</p>\n\t\t\t<p>更進一步，金庸要在《鹿鼎記》中，藉由韋小寶來挑戰、衝擊我們的歷史常識，用不可思議又在情理之中的情節演變，拋出有趣的思考：我們究竟是如何認識歷史的？史冊記錄的並非是全部的歷史？對於你所知道的歷史又有多少把握？</p>\n\t\t\t<p>金庸雖然沒有明講，不過在閱讀過程中，讀者可以感受到這部小說完全可以有另一個書名：《康熙秘史》。《鹿鼎記》基本上就是用秘史的形式，向讀者揭露、甚至還原清朝初期究竟發生了哪些事。</p>\n\t\t\t<p>金庸的基本態度和「秘史」是一樣的，他用看似「顛覆」歷史的方式對你說：你被騙了，那些歷史記錄並不準確，事實上康熙朝的許多大事都有韋小寶在，但因為種種不為人知的原因，這個人在正史記載中被排除掉了，只有我金庸偷偷告訴你們，事實是這樣的。</p>\n\t\t\t<p>讓讀者去懷疑歷史，其實是一件令人不安的事。只不過金庸把韋小寶寫得滑稽又荒誕，所以讀者不會覺得這些事是真實發生的。我們會自然地告訴自己：這是武俠小說嘛，這就是虛構嘛！</p>\n\t\t\t<p>然而「秘史」那樣的調性、那樣的趣味，在閱讀過程中從頭到尾存在著。</p>\n\t\t\t<p>例如，你知道臺灣為什麼會被施琅打下來嗎？史籍看到的，都說施琅和鄭家有恩怨而降清，施琅又很會打海仗，康熙才派他出兵。這個時候，金庸藉由小說悄悄地告訴你：不完全是這樣，施琅也許重要，可是有一些你沒看到的，你知道鄭克塽對陳永華（即陳近南）的忌憚嗎？不瞭解這些，講什麼臺灣歷史呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>韋小寶說道：「施大人，你運氣也真好，倘若陳軍師沒有被害，在台灣保護鄭克，董國太、鄭克塽他們就不篡位了。陳軍師統率軍民把守，台灣上下一心，你未必就能成功。」</p>\n\t\t\t<p>施琅默然，心想自己才能確是遠不如陳近南，此人倘若不死，局面自然大不相同。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>我們被金庸的這種口氣、這種方式吸引到秘史領域中，突然感覺到，真的有一些歷史沒有告訴我們的事。這是閱讀《鹿鼎記》特有的一種樂趣──「原來如此」。</p>\n\t\t\t<p>而且，這個「原來如此」是很吊詭、奇怪的一種樂趣。我們大部分人都有這種本能，看到表面的東西，會猜想後面應該還有別的，要不然就不會對所謂的「八卦」有這麼高的興趣。什麼樣的八卦讓我們討論最久呢？自然是所牽涉的人事物與表面的差距越遠，我們就越有興趣。比如越是那種正經八百的人，卻被揭露他背後做的都是跟身分不符合的狗屁倒灶的事，這個時候我們就越感興致。</p>\n\t\t\t<p>這也是《鹿鼎記》提供的一種興致，表面上，康熙一朝完成了許多偉業功績，最後揭曉，原來是那個不識字、不老實、不正經的小鬼韋小寶搞出來的，於是越荒誕離奇，我們就越覺得有趣。</p>\n\t\t\t<p>《鹿鼎記》是一部歷史小說，可是這部歷史小說的寫法背後，有這樣一套歷史概念的轉移。</p>\n\t\t\t<p>作為對照，有一段情節最能夠清楚傳達，這個趣味是怎麼來的。</p>\n\t\t\t<p>《鹿鼎記》第四十六回，韋小寶在「通吃島」上和施琅重逢。此時施琅已經平定了臺灣，他奉康熙之命前來宣旨，將韋小寶封為「二等通吃侯」──這個奇怪的頭銜是康熙的有意取笑。席上兩人和幾名武官聊天，韋小寶不想讓施琅太得意，就問他當年國姓爺鄭成功是怎麼打敗荷蘭人的，旁邊有一名部將林興珠便述說了水淹鹿耳門的故事。</p>\n\t\t\t<p>《鹿鼎記》整部小說寫的都是歷史，可是這個時候小說裡加插了一段林興珠講述水淹鹿耳門、圍攻熱來遮城的歷史，你就會覺得這中間很不一樣。為什麼？因為這段描述格外無趣。這就是歷史，是用我們平時在歷史書裡會讀到的方式所寫的歷史，裡面沒有韋小寶，沒有任何其他人介入。</p>\n\t\t\t<p>我們明顯地感覺到無趣，因為在其他地方，金庸不是這樣寫歷史的。金庸總是在讀者認為事情是這樣的情況下，將它攤開來，然後給我們一看，看到韋小寶在那裡惡搞。</p>\n\t\t\t<p>安全、正規的歷史解釋，讓我們覺得不夠有趣，反而讓我們無法完全接受。於是金庸在這樣的歷史解釋之外，給一些加入了韋小寶之後不一樣的歷史解釋，讓我們看得興味盎然。</p>\n\t\t\t<p>但我們不應該那麼理所當然地、輕鬆地接受金庸投下的這麼多煙幕，而看不到他要提醒我們的地方。讀《鹿鼎記》，非得看到這一部分不可。</p>\n\t\t\t<p>這是個大問題、真問題，但是我也沒有答案，那就是：歷史到底是什麼？歷史的真與假，到底如何分辨？如果歷史記錄裡的東西有可能是假的，而真的、重要的可能沒被寫進歷史裡，那麼我們今天靠著這些史料所建立的歷史知識、對歷史的理解和歷史解釋又算什麼？我們應該用什麼態度來對待？</p>\n\t\t\t<p>在這裡，金庸運用了史學方法裡所說的「反證」。反證是一件困難的事，有資料就代表發生過這樣的事，但沒有資料不代表沒有發生過這樣的事。</p>\n\t\t\t<p>你能夠說，我們在所有史料裡都沒有發現宮廷陰謀，就能證明沒有宮廷陰謀嗎？同樣的道理，即使查遍所有史料，你就能自信滿滿地說：沒有韋小寶這個人嗎？你怎麼證明真的從來沒出現過韋小寶這個人呢？我們只能說韋小寶沒有被寫在歷史記錄裡，而且小說中還給了這麼多的理由。所以你證明不了的。</p>\n\t\t\t<p>我們憑什麼對自己所理解的歷史知識那麼有信心、那麼有把握？你或許會說，這是歷史學家講的。歷史學家我認識很多，而且還認識很多頭腦不是很清楚的歷史學家。拜託，你不能給我這個答案。</p>\n\t\t\t<p>更進一步說，千年之後，也許有人看到了《鹿鼎記》，它可能是斷簡殘篇，說不定書名都沒有了，或者中間哪一部分永遠消失了。千年之後讀這本書的人，他不會知道這是一部怎麼被寫下來的書，不知道這是武俠小說，也許認為這就是史料，人們要建立歷史，就得靠這份資料。那個時候就會有人說，千年之前有一個叫金庸的人，寫了這麼一段歷史記錄，藉由金庸的記錄，可以還原清朝康熙時代發生的這些事。</p>\n\t\t\t<p>如果你覺得這很荒唐，那不妨對應一下，我們現在讀到的一千年前所寫的古籍，它記錄的可能是一千三百年前的事情，我們憑什麼認為這就是於史有據？這不就和一千年後的人讀《鹿鼎記》，靠著《鹿鼎記》來還原康熙朝發生的事件一樣嗎？</p>\n\t\t\t<p>雖然我沒有答案，但這是一個極有趣、也極重要的問題。在特殊思想變動的時代裡，這種問題被凸顯了。</p>\n\t\t\t<p>金庸活在思想激烈變動的時代，他親歷歷史記錄被推翻、被建立，更重要的，他看到各式各樣的歷史解釋在他這一代人中此起彼落。同樣的事件可以有很多不同的解釋，當然就產生了這樣的疑問：歷史到底是什麼？我們到底如何來解釋歷史？</p>\n\t\t\t<p>在史學探究、史學方法論的討論中，的確有不少人提過這樣的問題。但卻很少有人像金庸一樣，用這麼精彩的方式，放在一部歷史武俠小說中，向所有人拋出巨大的問題與提醒。</p>\n\t\t</div>"},{"title":"09　滿洲人憑什麼留下來？","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-43\"><span><span><span>0</span><span>9</span></span></span>　<span>滿洲人憑什麼留下來？</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>和其他武俠小說不一樣，《鹿鼎記》被金庸刻意劃分出了兩個世界，即使這兩個世界都以韋小寶作為主角。</p>\n\t\t\t<p>一個是朝廷、官場的世界。一開始，韋小寶誤打誤撞地被帶進了皇宮，以小桂子的身分一步一步往上爬；而後韋小寶被天地會青木堂的人綁走，於是另一個世界出現了，那就是天地會、甚至後來的神龍教所代表的草莽、江湖。</p>\n\t\t\t<p>兩個不同的世界，一方面藉由韋小寶結合在一起，另一方面也讓韋小寶穿梭其間，一下到這個世界去找那個世界的解決方案，一下又到那個世界去找這個世界的線索。</p>\n\t\t\t<p>回到《書劍恩仇錄》，同樣是兩個世界，或許因為曾經經歷過抗日戰爭，還帶著那樣深刻的記憶，所以金庸一開始寫《書劍恩仇錄》時，有著非常強烈的種族意識。滿人和漢人涇渭分明，理所當然他是站在漢人的立場上。陳家洛自然是好人，紅花會這些反清復明的志士都是好人。乾隆是中間角色，血統上明明是漢人，卻成了滿洲皇帝，所以紅花會才要想方設法將他爭取回來，讓他回到原來對的、好的身分，變成一個漢人皇帝。</p>\n\t\t\t<p>這是《書劍恩仇錄》的基本設定。這個設定裡最核心的，就是不會、也不能去質疑滿人和漢人之間的好壞評斷。但是到了《天龍八部》，這樣的立場變了，金庸變了，他覺得這個基本設定並不是那麼有道理。於是他刻意寫了喬峯到蕭峯的故事，「不再以契丹人為恥，也不以大宋為榮」，等於改寫了、也重新交代了自己對於民族主義的立場。</p>\n\t\t\t<p>再到了《鹿鼎記》，看上去怎麼好像回到了初始的立場上？小說一開始寫「莊廷鑨明史案」、寫文字獄，又寫黃梨洲、顧亭林這些文人懷念前明、悲憤鬱積。而韋小寶出身揚州，也聽過「揚州十日」的大屠殺慘事。這些都是漢人痛恨滿人的理由。</p>\n\t\t\t<p>表面上看，金庸似乎回到了一開頭的種族態度和立場，怎麼開頭就怎麼結尾。但是細看下去，卻不是這麼回事。這是金庸了不起的地方，他設計了韋小寶這樣一個憊懶、滑頭的角色，作為《鹿鼎記》的主角，跟在康熙的身邊。</p>\n\t\t\t<p>韋小寶剛開始是宮裡最不堪、地位低下的太監，後來他向康熙懺悔告白，說自己是個假冒的太監，還揭發了太后一事，康熙馬上為他正名，封他為御前侍衛副總管，讓他赴五台山辦事。韋小寶頻頻立下功勞，皇帝寵他、喜歡他、信任他，再任命他為驍騎營正黃旗副都統，賜為滿洲人。本來是個漢人，現在變成滿洲人，這是他的一重身分。</p>\n\t\t\t<p>此外，韋小寶加入了顛覆朝廷最重要的組織天地會，成為陳近南親手收的徒弟。這是他的另一重身分。</p>\n\t\t\t<p>這兩種身分是極端對立的，只要是正常的主角，應該都不會在知情的情況下接受這樣的安排，那就一定只能寫在像韋小寶這樣，一個從妓院出身、連親爹是誰都不知道的人身上。他沒有這個包袱，沒有來自父系宗族系統的血統和身分，所以他可以當滿洲人。</p>\n\t\t\t<p>這已經是很曖昧的立場了，更進一步，金庸讓《鹿鼎記》裡滿、漢之間的衝突也變得曖昧，甚至對反了。到了這部小說中，金庸並沒有說漢人想要反清復明，將滿洲人趕出去就一定是對的。同時也暗示了，漢人根本就沒有反清復明的本事，還沒等到朝廷來鎮壓，你們自己內部就先打起來了。</p>\n\t\t\t<p>金庸為了彰顯漢人之間內訌的本質，刻意設計了沐王府白家和天地會徐老三之間的衝突，這是非常嚴重也非常不堪的衝突。嚴重到什麼程度？即使韋小寶救了沐王府的人，總舵主陳近南親自出面，都沒辦法解決。問題的癥結點，就是各自認定、各自選擇到底要支持誰來當皇帝。這是不能動搖、不可妥協的。</p>\n\t\t\t<p>看看這些人所支持的南明皇嗣，我們遠遠地從歷史角度看，會覺得可笑、愚蠢。是的，金庸在這方面，真的是在嘲笑這些角色，包括陳近南在內。</p>\n\t\t\t<p>因為他們如此愚忠，一定要選擇唐王或是桂王，一定堅持只有我認定、支持的對象才是正統，才可以當皇帝。這樣看來，反對滿人當皇帝，和反對別人支持的漢人當皇帝，這中間真的有多大差別嗎？</p>\n\t\t\t<p>再看小說裡特別重要的《四十二章經》，也牽涉作為「歷史學家」的金庸的史觀，他要表現的是，滿洲人究竟如何在中原站穩腳跟。</p>\n\t\t\t<p>歷史上的大哉問就是：滿洲人憑什麼留下來？如果他們真的這麼壞，像是「嘉定三屠」、「揚州十日」，那麼漢人人口比滿洲人多了多少倍，為什麼趕不走滿洲人？</p>\n\t\t\t<p>在這件事情上，金庸有他的史觀、他的解釋。</p>\n\t\t\t<p>首先，《四十二章經》之所以重要，因為那代表了滿洲人特殊的自我保護意識。行痴和尚（順治帝）在五台山上見到韋小寶，將那本正黃旗封皮的《四十二章經》交給他的時候，說了這句話：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>行痴探手入懷，取了一個小小包裹出來，說道：「這一部經書，去交給你的主子。跟他說：天下事須當順其自然，不可強求。能給中原蒼生造福，那是最好。倘若天下百姓都要咱們走，那麼咱們從那裏來，就回那裏去。」說著在小包上輕輕拍了一拍。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>滿洲人從入關一直到清朝滅亡，一路都有著強烈的危機感，一定要保有自己所來的根據地，那是不能動的。尤其是鑒於歷史，滿洲人稱自己為「後金」，他們看到歷史上與宋人對峙、後來被蒙古人滅掉的「前金」朝，就是因為忘掉了要保護原來的「龍興之地」。因此，號為「後金」的滿洲人隨時都保持這個心態：如果待不下去了，我就走。正因為這樣的警醒之心，他們反而能夠留了下來。</p>\n\t\t\t<p>其次，小說裡行痴和尚要韋小寶轉告康熙的，還有這四字箴言──「永不加賦」。這也是歷史事實。康熙立下了大清絕對不能動搖的祖宗家法，就是「永不加賦」。</p>\n\t\t\t<p>因為太瞭解漢人不喜歡他們，就更不能欺騙自己，說漢人其實已經服服帖帖，十分擁戴我們，感激我們幫忙解決了闖賊的問題。對外當宣傳可以，但滿洲人沒有真的愚蠢到、天真到去相信這種說法。他們總是保持著高度的危機意識。</p>\n\t\t\t<p>來到了不受歡迎的地方，就要努力地做到兩件事：第一，爭取能夠扭轉局勢，讓漢人接受、臣服；第二，永遠留有退路，如果真的統治不了就走，不要硬撐在這裡，不能將一切都押在這裡。</p>\n\t\t\t<p>正因為如此，滿洲皇帝都不壞，至少比起明朝的漢人皇帝，從各種角度、各項標準來看，那是好太多了。「永不加賦」的祖宗家法，給了人民相當的經濟富足基礎。在這樣的原則下，創造了康雍乾三朝的太平盛世和生產上的繁榮。</p>\n\t\t\t<p>金庸用這種方式寫出了一個對照──關於政治、關於統治，有比種族更重要的因素。其一，就是讓老百姓可以生活得更好，這太重要了。其二，上位者必須戰戰兢兢、勤勤懇懇，不能將手上的權力視為理所當然，要假設權力隨時可能被取消。</p>\n\t\t\t<p>反過來看另外一邊，漢人一心一意要把滿洲人趕出去，可是憑著什麼條件、什麼方式？光是在擁立誰這件事上，就可以搞得七葷八素，持續內鬥、內耗。</p>\n\t\t\t<p>回頭再看，金庸一開始寫《書劍恩仇錄》的設定實在簡單得多，他可以避開這個問題，仍然還是乾隆當皇帝，不用爭不用搶，只要變成漢人江山就好。</p>\n\t\t\t<p>我相信到了寫《鹿鼎記》的時候，金庸回頭想起這件事，可能會笑自己：這也太幼稚、太便宜行事了。如果世上有這麼容易的事，就沒有政治這回事了。</p>\n\t\t\t<p>十幾年下來，金庸對於政治，尤其是政權和人民之間的關係思考了很多，價值觀念也改變了很多，所以他不可能繼續用《書劍恩仇錄》中那種簡單到有點幼稚的種族主義概念，來看待歷史的教訓。</p>\n\t\t</div>"},{"title":"10　中國社會畸形的權力來源","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-44\"><span><span><span>1</span><span>0</span></span></span>　<span>中國社會畸形的權力來源</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>一邊辦報寫社評，一邊寫武俠小說，所以金庸的每一部武俠小說，多多少少都反映了當時的政治或社會現象，《鹿鼎記》也不例外。</p>\n\t\t\t<p>《天龍八部》裡有星宿派，《笑傲江湖》裡有日月神教，到了《鹿鼎記》，金庸又創造了神龍教，而且比日月神教還要更誇張。韋小寶第一次上神龍島，也就是神龍教的大本營，他看到的是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>過了一條長廊，眼前突然出現一座大廳。這廳碩大無朋，足可容得千人之眾。韋小寶在北京皇宮中住得久了，再巨大的廳堂也不在眼中。可是這一座大廳卻實在巨大，一見之下，不由得肅然生敬。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>神龍教的大廳不是中國式的宮殿，而是一個非常廣大的空間。在舊宮殿旁邊，但又跟宮殿不一樣，可以容納非常多人的建築，那是「人民大會堂」吧！再看裡面：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>但見一羣羣少年男女衣分五色，分站五個方位。青、白、黑、黃四色的都是少年，穿紅的則是少女，背上各負長劍，每一隊約有百人。大廳彼端居中並排放著兩張竹椅，鋪了錦緞墊子。兩旁站著數十人，有男有女，年紀輕的三十來歲，老的已有六七十歲，身上均不帶兵刃。大廳中聚集著五六百人，竟無半點聲息，連咳嗽也沒一聲。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>此處描寫教中舊人有男有女數十人，還有這些少年隊新血，可以想像，這個畫面其實折射出文革時期金庸所看到、觀察到的時代特徵。</p>\n\t\t\t<p>從這裡我們也進一步瞭解到，金庸要在《鹿鼎記》中將主角韋小寶寫成十二、三歲少年的原因。即使過了一兩年，韋小寶畢竟還是個不折不扣的少年。這個時候，金庸深受時局刺激，或許就刻意用小說中韋小寶的形象，來反映、甚至諷刺當時中國大陸文革期間的意識形態。</p>\n\t\t\t<p>所以讀《鹿鼎記》，有一種特別的讀法，就是去對讀二十世紀經典的英國小說《蒼蠅王》（<span>Lord of the Flies</span>）。它的創作時代和《鹿鼎記》相差不遠，作者是曾經得過諾貝爾文學獎的威廉．高汀（William Golding）。</p>\n\t\t\t<p>《蒼蠅王》寫什麼？它寫一群少年流落到荒島上，因為沒有大人在，失去了原有的社會秩序。在這種情況下，少年們會幹出什麼事來？在威廉．高汀筆下，這些沒有完成社會化的青少年，暴露了他們內在可怕的邪惡。</p>\n\t\t\t<p>金庸當然沒有寫到這麼極端，可是面對文革時期所產生的一種非常奇特的青少年的血腥暴力形象，他將自己痛心的反省，寫進到小說裡。此外，如同《笑傲江湖》一樣，金庸不是要寫時事小說，而是要寫出另一種更恆長的政治小說。</p>\n\t\t\t<p>歷數金庸小說中出現過的幾個大「邪教」，有《倚天屠龍記》的明教、《笑傲江湖》的日月神教，和《鹿鼎記》的神龍教，這三個組織其實一脈相承。如果串連起來，就彷彿看到一個經過奪權的組織，在三個不同的階段、不同的發展下，產生了不同的性格。</p>\n\t\t\t<p>日月神教的「日」、「月」，加在一起不就是「明」嗎？雖然神龍教不像明教和日月神教有這種字面上的連結，可是如果仔細看，就會發現日月神教裡批鬥老部屬的情節，在神龍教同樣也有。很明顯，這是金庸在情節上刻意安排的一種關連，可以視為一個團體在三個不同發展階段的隱喻。</p>\n\t\t\t<p>這樣的演化隱喻可不是金庸的創想，毋寧是因為金庸一邊在寫社評，在悲傷又心驚膽跳地體察時局，以及在他敏銳的政治分析與強烈的感觸下，忍不住將這樣的觀察寫進了武俠小說中。</p>\n\t\t\t<p>除此之外，金庸還描述了中國式的政治基底、社會型態。在《鹿鼎記》裡，我們看到了一個什麼樣的社會？或者，逆向追問這個問題會更清楚：一個什麼樣的社會，才會讓一個從妓院裡出來的孩子，可以不斷取得越來越大的權力，而且橫行無阻？他憑藉的是什麼？</p>\n\t\t\t<p>相當程度上，韋小寶憑藉的永遠都是四個字──「狐假虎威」。他有什麼好怕的？無論他走到哪裡，他都明白自己背後有康熙和陳近南在撐腰，以及更可怕的，因為他知道別人的秘密，這給他帶來了絕對的優勢。</p>\n\t\t\t<p>韋小寶最厲害、最壞的一招，就是東聽一個，西聽一個。從那裡聽了什麼，他就到這裡賣給這個人，再從這個人身上換來另一個秘密，去賣給另外一個人。</p>\n\t\t\t<p>例如，他偷聽到了海大富和假太后所講的關於順治帝的秘密，於是就拿著這個秘密去跟康熙講；等到康熙跟他交代了什麼事，他再把這個秘密變形了之後，拿去嚇唬太后。他就是這樣來來去去地利用各種秘密，換取自己所需要的。</p>\n\t\t\t<p>金庸為什麼要這麼麻煩，設計這麼複雜對於秘密的運用？其中一個目的，就是他要讓韋小寶來象徵、代表中國社會最畸形的權力來源。</p>\n\t\t\t<p>畸形到什麼程度？這種權力的獲得，並非來自你有多大的能力，而是來自你裝出來有什麼靠山，同時找到了什麼靠山。靠山就是關係。更重要的，不只是擁有關係，還要懂得適時適地、在對的條件下去炫耀你的關係，然後藉由炫耀你的關係去取得更多的關係、更大的權力。這是使得中國傳統政治如此黑暗的社會基底。</p>\n\t\t\t<p>在這樣的社會基底下，人沒有自己真正的位置，也沒有了自尊心，因為什麼都是靠著拉攏誰、依靠誰、拿誰來威脅誰的手段，最後再用這種方式，來決定自己是什麼人。你沒有獨立的人格，你是什麼人是由你的關係來決定的。</p>\n\t\t\t<p>對中國社會相對黑暗的這種描述，也就必然牽涉到國民性。可以這樣說，金庸在這方面並沒有真正離開《阿<span>Q</span>正傳》，沒有離開魯迅。他寫《神鵰俠侶》的時候，藉由楊過碰觸到了阿<span>Q</span>形象和阿<span>Q</span>精神。後來他用別的方式，主要是透過對小龍女的愛情，讓楊過得以擺脫身上的那一份阿<span>Q</span>性格。</p>\n\t\t\t<p>到了韋小寶，他其實也有很多阿<span>Q</span>的部分，只是他沒有讓我們那麼討厭。金庸沒有用像魯迅那麼尖刻、那麼嘲諷的方式來寫韋小寶，而是給了韋小寶一些正面的性質。可是，這並不表示金庸會遺忘、放掉魯迅所看到的民族性中的這些黑暗面，以及反映在他筆下阿<span>Q</span>身上的這些特質。</p>\n\t\t\t<p>在《鹿鼎記》裡，韋小寶如何招搖撞騙，如何在江湖與官場上抓住他的權力，得到這麼多的利益，那個環境本身就是一個擴大了的阿<span>Q</span>性格，或者說阿<span>Q</span>精神。韋小寶的本事，正是來自於中國國民性中最黑暗、最卑微、最鄙劣、最猥瑣的一面。</p>\n\t\t\t<p>從這個角度看，金庸的《鹿鼎記》寫了一個反武俠的故事。反武俠的意義，不只是說韋小寶不是一個武俠人物、英雄人物，更重要的，小說裡寫出來的環境，剛好也與武俠、武林相反。</p>\n\t\t\t<p>金庸用一種相對黑暗的方法，寫出了武俠對面的這個社會，讓武俠世界幾乎所有的正面素質，都在《鹿鼎記》中改頭換面。比如陳近南，本來是武俠小說中應有的大俠設定，可是在小說裡，就連陳近南都是玩權謀的──他必須利用權謀去處理青木堂香主由誰繼任所引發的嚴重內訌；他和馮錫範、鄭克塽之間的猜忌也是權力關係。在小說中，只要牽涉權力，特別是宮廷的最高權力，沒有人要做什麼英雄人物，沒有人要講義氣。每一個英雄人物在《鹿鼎記》裡都不會有好下場，沒有好結果。</p>\n\t\t\t<p>《鹿鼎記》所揭露的中國國民性其實相當黑暗，可是我們在讀的時候不會感到那麼沉重，這又要感謝金庸，因為他把韋小寶寫成一個這麼有趣的角色。當然，正因為金庸要寫的是最底層的國民性，而在這底層之上，這個社會所支援、所形成的政治層，亦即它的最上層同樣也是黑暗的。於是就出現了如神龍教這樣的民間組織，也出現了暗藏各種貪汙腐敗的官場文化。</p>\n\t\t</div>"},{"title":"11　武俠小說的結束在《鹿鼎記》","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-45\"><span><span><span>1</span><span>1</span></span></span>　<span>武俠小說的結束在《鹿鼎記》</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸要寫的是這樣巨大的結構，所以《鹿鼎記》必須有趣──如果寫得既龐大，又黑暗沉重，讀者不會想要看；或者說，龐大、黑暗又沉重的小說，這個社會上百分之九十的讀者不會想看。於是金庸就故意選擇了一種笑鬧、輕鬆的方式，寫出了韋小寶這樣的角色，以此來呈現這個故事。但其實很多時候，韋小寶的個性和做法，是應該讓我們覺得不安的。</p>\n\t\t\t<p>故事寫完了，金庸清楚知道這部小說已經離開傳統武俠很遠很遠了。他在〈後記〉裡就提到，有許多讀者說這不像是金庸寫的，所以他解釋：「『鹿鼎記』已經不太像武俠小說，毋寧說是歷史小說。」接下來還有一段，是金庸低調地宣告《鹿鼎記》的地位，他說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>有些讀者不滿「鹿鼎記」，為了主角韋小寶的品德，與一般的價值觀念太過違反。武俠小說的讀者習慣於將自己代入書中的英雄，然而韋小寶是不能代入的。在這方面，剝奪了某些讀者的若干樂趣，我感到抱歉。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>話雖然這樣說，但我們知道金庸沒有真的抱歉，他清楚這中間的關鍵差別在哪裡。也許他不會用我的這種理論性語言來說，但我願意把它挑明來講：這就是類型小說或娛樂小說，和嚴肅小說或純文學小說之間的差距。</p>\n\t\t\t<p>絕大部分的娛樂小說、類型小說建立的主角，就是hero（英雄），意味著在閱讀過程中，讀者會把自己投射在這個英雄身上。這個英雄所經歷的一切事情，就像是我們自己經歷的一樣，我們因而讀著感到很過癮。</p>\n\t\t\t<p>但在《鹿鼎記》裡，金庸也諷刺了這樣一種關係。寫在哪裡呢？寫在康熙身上。康熙每一次聽到韋小寶講述他的冒險經歷，就很像作為類型小說的讀者，讀著讀著、聽著聽著，就覺得說，如果讓我去，我也可以做到這件事，這好像是我可以去做的、是我要做的、是我在做的事。康熙將自己投射在韋小寶身上，就如同讀者在讀類型小說、武俠小說時，將自己投射在主角身上一樣。</p>\n\t\t\t<p>而什麼叫做嚴肅小說？為什麼嚴肅小說的地位比較高？因為嚴肅小說不必然用這種方式寫。這是金庸的用意，他明白地告訴我們，他自己認為《鹿鼎記》是該和什麼樣的小說放在一起的。</p>\n\t\t\t<p>同樣在這篇〈後記〉裡，他說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>但小說的主角不一定是「好人」。小說的主要任務之一是創造人物；好人、壞人、有缺點的好人、有優點的壞人等等，都可以寫。在康熙時代的中國，有韋小寶那樣的人物並不是不可能的事。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸指的就是中國社會的一種必然性，將韋小寶寫在那樣的社會裡，不是不可能的。當然，換個方向看，也沒辦法將韋小寶寫到別的社會裡。接著他又說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>作者寫一個人物，用意並不一定是肯定這樣的典型。哈姆萊特優柔寡斷，羅亭能說不能行，「紅字」中的牧師與人通姦，安娜卡列尼娜背叛丈夫，作者只是描寫有那樣的人物，並不是鼓勵讀者模仿他們的行為。……魯迅寫阿<span>Q</span>，並不是鼓吹精神勝利。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是金庸的自我認同，說他寫的和莎士比亞、屠格涅夫寫的是類似的東西，腦袋裡也想到了霍桑、托爾斯泰。接著他提到了《水滸傳》、《紅樓夢》，並以與魯迅的文學關係作結。</p>\n\t\t\t<p>金庸非常明白他的《鹿鼎記》在寫什麼。他用武俠小說的表面形式，用輕鬆笑鬧的口氣，寫一部嚴肅的小說。他用嬉鬧、搗蛋的韋小寶形象，背後寫的是對黑暗的中國國民性的檢討，以及對中國社會的批判。這是《鹿鼎記》達致了不起的地位與成就的原因，是我們絕對不能忽略的。</p>\n\t\t\t<p>到這裡就明白了，《鹿鼎記》以武俠寫反武俠的真正意涵。但是作為武俠小說的名家，金庸為什麼要這樣做？</p>\n\t\t\t<p>第一個理由，那個寫社評的金庸，他從新聞時事中所看到的現實中國發生的所有事情，以及他所關切的、在意的，不可能進入他的武俠小說中。如果要寫那樣一個中國人社會，他就不可能再去寫過去的那種武俠小說。</p>\n\t\t\t<p>第二個理由，那個同時一直在寫武俠小說的金庸，這個時候也有一種動力。他將武俠小說寫到如此程度，任何的規律、規範都被他打破了，為了挑戰自己所開發出來的每一個面向，於是到了《鹿鼎記》，都一併推到了最極端：完全不應該當主角的人成為主角，武俠和歷史直接寫在一起，武俠的好壞善惡價值觀徹底混同了……。寫出來就變成了一部反武俠之作。</p>\n\t\t\t<p>這本來就是他過去寫武俠小說的重要動力，他要找到別人不會寫、沒有寫過的寫法，一部一部不斷地嘗試，一部一部不斷地突破自己。到這個時候，基本上能夠走的路都被他走絕了，他就寫不下去了。他不只把自己的路給寫絕了，他也寫盡了這個脈絡系統下的武俠小說的其他可能性。</p>\n\t\t\t<p>金庸明白地說，「這是我最後的一部武俠小說」。他知道自己不可能繼續寫武俠題材，再繼續寫也不會是武俠小說了。他的企圖、他的見識、他的關懷，這個時候都已經遠遠超過武俠小說所能容納的範圍。</p>\n\t\t\t<p>讀傳統武俠小說的樂趣，相當程度上是因為這些小說提供給我們的，是讀者與作者之間非常堅固牢靠的默契。作者知道讀者想要讀到什麼東西，就把那預期要的東西寫到小說裡，讀者可以一路讀下去。讀得很快、很輕鬆。讀武俠小說原來的樂趣，是一種低度滿足，會看到很多熟悉的東西。</p>\n\t\t\t<p>可是讀一般的小說，尤其是嚴肅小說，帶給你的是高度滿足。高度滿足的意思是挑逗你的好奇心：會發生什麼事？為什麼會這樣發生？對讀者來講是完全陌生的，逼著我們去想怎麼會這樣，怎麼可能這樣，為什麼發生這樣的事。這個時候，我們閱讀的滿足感更高了。</p>\n\t\t\t<p>讀金庸小說，其實是不斷地破壞我們讀其他武俠小說的樂趣，因為一直在追求更高度的滿足。於是讀金庸到了一定程度後，讀者自然沒有辦法回頭接受以往的那種低度滿足了。</p>\n\t\t\t<p>《鹿鼎記》不只是金庸自己將武俠小說寫完了，還斷絕了讀者能夠繼續享受閱讀其他作者的武俠小說的機會。除非你不讀金庸，如果你都讀完了，就回不去曾經的武俠世界了。</p>\n\t\t\t<p>此外，我們也再難找到像金庸這樣的作者──他個人高度的天分、生活的閱歷，加上時局帶來的各種不同條件，湊在一起，才出現了金庸。金庸小說的寫作技法，放在任何時代、任何社會，都經得起考驗，尤其是《鹿鼎記》。他把《鹿鼎記》寫完了，於是停筆了，我們應該高興，至少這是一個完美的結局。</p>\n\t\t\t<p>不管怎麼追溯武俠小說的起源，我只能說，至少到目前為止，武俠小說的結尾在金庸的《鹿鼎記》。</p>\n\t\t\t<p>我知道這句話說得很滿，可能也得罪了很多後來寫武俠小說的人。但我只能如此誠實地向大家報告，在金庸修訂完十五部小說這幾十年來，我沒有找到任何可以挑戰、改變到目前為止我所認定的這一句斷言──《鹿鼎記》寫完了，武俠、武林的傳統也就隨之結束了。</p>\n\t\t</div>"},{"title":"版權頁","content":"<div id=\"_idParaDest-46\">\n\t\t\t<h6>金庸的武林<span>3</span></h6>\n\t\t\t<h4>再會江湖</h4>\n\t\t\t<h5>金庸小說的眾生相</h5>\n\t\t\t<p>　</p>\n\t\t\t<p>作者／楊照</p>\n\t\t\t<p>封面繪圖／李志清</p>\n\t\t\t<p>　</p>\n\t\t\t<p>副總編輯／鄭祥琳</p>\n\t\t\t<p>美術設計／張巖</p>\n\t\t\t<p>排版／連紫吟、曹任華</p>\n\t\t\t<p>行銷企劃／廖宏霖</p>\n\t\t\t<p>出版一部總編輯暨總監／王明雪</p>\n\t\t\t<p>　</p>\n\t\t\t<p>發行人／王榮文</p>\n\t\t\t<p>出版發行／遠流出版事業股份有限公司</p>\n\t\t\t<p>地址／104005 臺北市中山北路一段11號13樓</p>\n\t\t\t<p>電話／(02)2571-0297　傳真／(02)2571-0197　郵撥／0189456-1</p>\n\t\t\t<p>著作權顧問／蕭雄淋律師</p>\n\t\t\t<p>　</p>\n\t\t\t<p>2024年5月10日 初版一刷</p>\n\t\t\t<p>電子書出版日期：2024年6月</p>\n\t\t\t<p>電子書格式：ePub</p>\n\t\t\t<p>有著作權．侵害必究</p>\n\t\t\t<p>ISBN：978-626-361-742-1 (EPUB)_V1</p>\n\t\t\t<p>　</p>\n\t\t\t<p><a href=\"http://www.ylib.com\"></a> <a href=\"http://www.ylib.com\">http://www.ylib.com</a> E-mail: <a>ylib@ylib.com</a></p>\n\t\t\t<p>金庸茶館粉絲團 <a href=\"https://www.facebook.com/jinyongteahouse\">https://www.facebook.com/jinyongteahouse</a></p>\n\t\t</div>"}];
const isHeader = [true, true, false, true, false, false, false, false, false, false, false, false, false, false, true, false, false, false, false, false, false, true, false, false, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, false, false, false, false, true];
let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  chapters.forEach(function(ch, i) {
    var btn = document.createElement('button');
    btn.className = 'chapter-btn' + (isHeader[i] ? ' is-header' : '');
    btn.textContent = ch.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});

initChapterList();
showChapter(0);

</script>
