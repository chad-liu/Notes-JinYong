泰山，或輕於鴻毛。」〈太史公自序〉則言自己的先祖是「周室之太史也」。這兩篇文章都強調史家的職責，以「究天人之際，通古今之變，成一家之言」的史家精神，「網羅天下放失舊聞，略考其行事，綜其終始，稽其成敗興壞之紀」，搜集散佚的歷史傳聞，考訂其真實性，並綜述事情的本末，考證、推究成敗盛衰的道理。</p>\n\t\t\t<p>史家最重要的職責之一，是記載可能遭人遺忘的史跡，唯有透過史家的春秋筆法，才能讓那些不該被遺忘的人事物留傳於後世，這正是司馬遷《史記》的價值所在。例如，《史記》有一篇〈日者列傳〉，藉由卜筮者（即「日者」）與賈誼、宋忠的對話，譏諷那些貪圖高官厚祿之士。單從篇名來看，〈日者列傳〉像是群傳，但深究這篇文章，從頭至尾只出現一個卜筮者司馬季主，篇中還有兩個配角來陪襯。名氣響亮的賈誼是其中一名配角，他在《史記．秦始皇本紀》中地位很高，司馬遷在篇末說「善哉乎賈生推言之也」，接著大段引述〈過秦論〉，以賈誼評秦朝治國的過失，作為評斷秦朝滅亡的依據。</p>\n\t\t\t<p>但到了〈日者列傳〉，賈誼和宋忠同車前往街市，兩人在街上卜肆中遊覽，司馬季主和三四位弟子講解天地的起源與終止、日月運轉法則，以及陰陽吉凶的本源，講得十分順理成章。賈誼他們聽了這段話後，驚異萬分，從中有所領悟，於是整理冠帶，正襟危坐，稱讚司馬季主言談不俗，卻又反問：「為什麼先生地位這麼卑微，職業如此汙濁？」司馬季主捧腹大笑之際，不疾不徐，反唇相譏，說了一番大道理。賈誼兩人聽後，悵然若失，神情茫然，閉口說不出話來。他們起身道別司馬季主，恍惚上車後，趴在車前橫木上垂頭喪氣。</p>\n\t\t\t<p>司馬遷有意向《春秋》看齊，撥亂世反之正，並且揚善貶惡，〈日者列傳〉、〈扁鵲倉公列傳〉、〈龜策列傳〉等都是如此。由於世人無法分辨賢者與不肖者，除了那些寄居官位、世人所認為的賢者外，像是卜筮者能解答人們的疑惑，但古代史籍未記載卜筮者，他們的事蹟也就不見於歷史文獻，司馬遷雖未明言，實則隱諷史家失職。於是他秉持史家書寫原則，將司馬季主的事蹟記錄下來。</p>\n\t\t\t<p>所謂能人志士，不僅是在朝為官者，也有不願與不肖者為伍的賢者，而君子常離群索居，處在卑下地位，尤其是卜士。司馬遷書寫卜筮者行跡，有其家世來歷之故。據〈太史公自序〉，司馬氏世代掌理周朝歷史，父親司馬談做了太史公，向唐都學習天文，向楊何學習《易經》，將死之際對司馬遷說司馬家先祖是周朝太史，在上古虞夏時便名聲顯揚，職掌天文之事。因此，司馬遷特別熟知觀察天文星相、卜算卦文的卜士。</p>\n\t\t\t<p>江湖、街市裡，不乏專精醫藥及卜算之士，這類人才不在廟堂，但他們天賦異稟。作為史家，必須忠於史家職責，將之記錄於史冊上。司馬遷父親司馬談臨死前就叮囑：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「今漢興，海內一統，明主賢君忠臣死義之士，余為太史而弗論載，廢天下之史文，余甚懼焉，汝其念哉！」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>意思是說，「漢朝興起後，一統海內外，對於明主、賢臣、忠臣、死義之士，我作為太史，都未能予以評斷記載，斷絕天下修史的傳統，讓我甚感惶恐，你可要念茲在茲啊！」司馬遷承襲的史家精神，在於記錄世人無法詳知又值得被留傳下來的人物事蹟。舉例來說，他寫〈李將軍列傳〉，並未用史家標準為李廣立傳，全篇不在彰顯李廣的戰功有多麼厲害，因為對司馬遷而言，李廣的名字不會消失在史冊上，但是他如何帶領軍隊、對抗匈奴，以及他以何種方式看待生命關鍵時刻的抉擇，卻容易被人遺忘。</p>\n\t\t\t<p>另外，在〈吳太伯世家〉這一篇中，從吳世家的系譜來看，延陵季子（即季札）始終沒有繼承吳國君王之位，其為人賢能、高風亮節，舉國推崇，雖然出使各諸侯國，但在國政上沒有重大事蹟，司馬遷為何要長篇記錄延陵季子的言行？首先，在於讓國之舉。一般史家不會特別記載讓位之人，只會書寫繼位為君王者。司馬遷卻特別推崇讓國之德，評斷季札三度讓天下，是至德之人。</p>\n\t\t\t<p>其次，延陵季子是一位君子，仁心慕義，以「季札掛劍」事蹟傳於後世。司馬遷突顯延陵季子，在於他重然諾。當他北行出使時，造訪了徐國國君，徐君暗自欣賞季札的寶劍，嘴上卻沒透露半句，季札雖然心裡明白，但礙於還要出使中原各國，所以沒能將寶劍獻給徐君。等到他回途中經過徐國，才得知徐君已逝的噩耗，於是季札解下寶劍，掛在徐君墳旁的樹上。隨從說徐君已死，還要將寶劍獻給徐君嗎？季札回答：「當初我在心裡已經允諾要將寶劍獻給他，豈能因為徐君已死，就背棄我的心願？」</p>\n\t\t\t<p>「季札掛劍」算是重大的歷史事件嗎？不是。但如果沒有史家記載下來，此事彰顯的高貴情操就會遭到埋沒。司馬遷身為史家，為了讚揚季札讓位與重諾的美德，將〈吳太伯世家〉作為世家第一篇。</p>\n\t\t\t<p>以司馬遷的史家精神及標準觀之，才能夠理解撰寫《史記．游俠列傳》的真正用意。〈游俠列傳〉也是以這種標準立傳。一般史家不會因為游俠救人於危難、濟人於貧困，而為他們立傳。只因游俠擁有仁者美德，守信用，不違背承諾，這些游俠可謂「義者」，有其可取之處，因而獲得司馬遷的青睞。</p>\n\t\t</div>"},{"title":"03　〈游俠列傳〉的理想型生命情調","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-36\"><span><span><span>0</span><span>3</span></span></span>　<span>〈游俠列傳〉的理想型生命情調</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>該如何定義「游俠」？簡單地說，游俠具備令人畏懼的武勇暴力，他們的行為雖不合乎法律原則，卻從不運用在私人利益上，「言必信，行必果」，寧願犧牲自身性命，也要拯救那些陷於危難的人。以此為對照，對國家治理而言，這群游俠就如同韓非所說的「以武犯禁」，而且「其行不軌於正義」，凡事不依照法令，破壞國家法令所規範的社會秩序。</p>\n\t\t\t<p>游俠禁得起生死存亡的考驗，而不誇耀自身的本領與功績，遭遇亂世時，這群游俠雖只是布衣平民，卻能為道義而赴死。司馬遷認為游俠對社會有貢獻，又因為他們能為大義捨命，普天之下，沒有人不稱頌這些布衣俠客的賢德品行，因而產生了一群游俠的跟隨者。例如朱家、劇孟、郭解等匹夫俠客，與一般暴虐豪強之輩不同，有許多人依附他們，但也使得公共秩序的維持者對他們更加側目。</p>\n\t\t\t<p>司馬遷以「游俠」形容這一群布衣俠客，他們救濟貧賤，家無餘財。如果從國家角度來看，他們是一群擁有暴力武勇的私人勢力；從民間角度來看，這些布衣俠客不為一己私利，救人於危難的大義更甚於自身，這是他們行俠仗義的原則。</p>\n\t\t\t<p>〈游俠列傳〉所記載最關鍵的俠士原則，首先是「言必信」。從季札掛劍故事到「俠客之義」，司馬遷看重的都是「重然諾」。游俠義氣傳頌千里，讓窮困士人甘於交託命運，他們不只是「其言必信」，對於別人請託之事，一定「其行必果」、「已諾必誠」，已經承諾的事一定使之實現。</p>\n\t\t\t<p>俠士的另一個關鍵原則是「義」。游俠是「義者」，不恥那些貪圖自身享樂之徒，也不屑與豪強勾結去欺凌弱者。凡有士人處於困厄，這些「閭巷之俠」必定前去救濟，即使犧牲性命也在所不辭。如同魯國朱家所藏匿、救活的豪傑有幾百人，曾救濟過的百姓也不可勝數，更暗中幫助季布將軍免於殺身之禍。這也是為什麼游俠必然與公共秩序或國家法律相衝突的原因。這意味著，倘若有人受到公權力不公平的對待，這些游俠會不惜一切代價，違背國家法律、違抗社會秩序，也要幫助這些人逃脫危難處境。</p>\n\t\t\t<p>司馬遷要告訴世人「何謂游俠」。他之所以為這些「閭巷之俠」立傳，彰顯這種「俠客之義」，就因為以往儒家、墨家都摒棄他們。秦朝以前的俠客事蹟早已湮滅不見，司馬遷深以為憾。</p>\n\t\t\t<p>漢帝國建立之後，作為新興法令國家，對於「正義」有統一標準，也就是《韓非子．五蠹》尊崇的國家法令與君主權力，認為法令應由國家壟斷，治國者才有制定權及法律解釋權，同時也就制定是非對錯的絕對標準。在國家體制之下，道德正義的標準都由國家來衡量，一般人沒有論斷政策、法令的權利。帝國權力的代表高踞於法令背後，不論是皇帝或官僚，他們永遠都能合法取得政權，以照拂人民、社會安全而維護法令秩序為藉口。</p>\n\t\t\t<p>基於帝國本身利益的考慮，任何統治權發展到後來都會產生變化。一方面，它會違背更加素樸的正義觀；另一方面，這種統治權必然有雙重標準，法令主要是規範平民，有權勢者卻可以逃離法令制裁。在這樣的國家體制下，「俠客之義」變得不可或缺，因為平民無權無勢，他們不免會質疑：國家是否能提供公平與正義？</p>\n\t\t\t<p>當法令明顯站在不公平、不正義的那一方，弱勢百姓如何措其手足？他們會惶惑於是否有人能導正或實踐真正的公平正義。因此，少數一群擁有正義信念、能夠逞暴力武勇的俠士應運而生。他們必然有武勇，否則無法衝撞龐大的國家體制，他們必須「以武犯禁」，才能抗擊原來集體社會的力量，進而實踐他們所相信的正義。</p>\n\t\t\t<p>游俠的另外一項特質，是必須願意付出代價，置生死於度外。司馬遷之所以將這群「閭巷俠客」稱作「游俠」，來自所謂「文武合一」的武士傳統。這群「游俠」寧願捨命，也要實踐內在的信仰，依循自己的信念而非法規的標準去實踐正義。因此，他們勢必會付出代價，比如他們無法納入「編戶齊民」的制度中，也難以在既定的宗族體系裡取得穩固的地位。他們無法像一般人那樣安身立命，反而從社會體制中游離出來。游俠被賦予一股特殊力量，自成一派。</p>\n\t\t\t<p>游俠既不依靠宗族組織，也不倚恃國家力量，他們憑什麼興起？這群俠客藉由「設取予然諾」、「千里誦義」的名聲，使得天下人稱頌並慕名而來，聚攏一群追隨者，形成一種游俠式的社會組織，一種既非國家亦非宗族的新組織。這股民間齊聚而成的力量，必然會一而再、再而三地遭到宗族或朝廷的側目，甚至試圖迫害、消除這些游俠徒眾。</p>\n\t\t\t<p>司馬遷寫〈游俠列傳〉時，提及先秦俠士因為遭受儒、墨兩家排斥，沒有留下相關史料，而漢朝之後聞名於世的俠客，一為朱家，一為郭解。</p>\n\t\t\t<p>在司馬遷筆下，郭解短小精悍，年少時殺過很多人，不惜以身犯險，也要為朋友報仇。他犯法無數，又私鑄錢幣、盜掘墳墓，但每當陷入危急之時，都能遇到天下大赦，因此倖免於難。郭解年長之後，才檢點行為，以德報怨，愈加喜愛行俠仗義，在鄉里間產生巨大的影響力，就連少年人都仰慕郭解俠義，常常暗自替他報仇。及至漢武帝下令各郡縣富豪必須遷往茂陵居住，家貧、不符合資格的郭解竟也名列其中，官吏不敢違逆法令，只好將他押解到咸陽就近看管。當時衛青曾向漢武帝進言，說郭解家貧，不符合遷徙條件，漢武帝卻認為區區一名布衣竟能請得將軍替他說情，可見郭家不貧。</p>\n\t\t\t<p>當郭解遷徙到關中時，當地賢者、豪傑都爭相與之結交，在地方上又造成巨大騷動。先前，軹縣人楊季主的兒子擔任縣掾，提名郭解列入遷徙名單，郭解哥哥的兒子殺死楊縣掾，郭楊兩家因此結下仇恨。郭解遷徙至咸陽後，又親手殺死楊季主，楊家人憤而上書告狀，沒想到有人在宮門下殺死了告狀之人。漢武帝聽聞這則消息，下令逮捕郭解。郭解逃亡到臨晉，請求籍少公助他出關，輾轉逃到太原。官吏循跡找到籍少公，未料籍少公自殺，斷絕了官吏追查線索的口供。</p>\n\t\t\t<p>許久之後，官府才將郭解緝拿歸案。軹縣有個儒生陪同前來查案的使者，聽到郭解門客讚譽郭解，便罵道：「郭解怎麼會是賢人，他專務作奸犯科之事。」郭解門客一聽到這句話，就殺死該儒生，並割下他的舌頭。官吏因此責問郭解，要他說出殺人者來歷，郭解不知兇手身分，官吏始終沒查出兇手是誰，只好向上奏報郭解無罪。</p>\n\t\t\t<p>然而，御史大夫公孫弘告訴漢武帝：「郭解以一介布衣的身分，以俠義自任，沒有任何官職、頭銜，就能行使權術，為人驕橫，為了區區一點小事就殺人，郭解本人雖然不知道這件案子的殺人兇手是誰，但這件案子的罪過比郭解自己殺人還要重大，應當判處郭解大逆不道的罪名。」漢武帝一聽，立即就懂了公孫弘這段話的弦外之音。公孫弘從國家皇權的角度，評斷郭解僅僅是一名布衣，只因行俠的名聲遠播，竟能發揮如此大的影響力，他的存在勢必不利於國家。這番話說服了漢武帝，於是下令誅殺郭解家族。</p>\n\t\t\t<p>司馬遷記錄的是一種理想型人物，這群人伸張正義，在這個世界上不可或缺。為什麼「正義」需要由游俠來行使？因為朝廷不能保證正義不受侵害，皇帝權力越大，帝王的統治就離正義越遠；司馬遷曾遭逢李陵之禍，囚於獄中，慘受宮刑，所以他深知這個道理。</p>\n\t\t\t<p>〈游俠列傳〉記載至郭解滅族之後，社會上出現了一批為數不少的行俠者，但他們大部分都十分倨慢，不值得一提，換言之，有真的游俠，也有假的游俠。假的游俠簡直就是民間盜跖，為從前朱家所不齒的盜賊之人。真的游俠有謙讓的君子之風，他們秉持正義，凡事以實踐公義為原則；假的游俠只是假借正義之名，純粹以暴力武勇謀取一己私利，貪圖逸樂。</p>\n\t\t\t<p>司馬遷為游俠立傳的意義在於：藉由朱家與郭解的事蹟，表達正義的價值及信念。不論在哪個朝代，居於弱勢者都得仰賴民間正義。行使正義的這群游俠來自民間，願意為了堅守正義原則而付出生命代價，他們象徵著司馬遷心目中理想型的生命情調，老百姓需要這種人存於世。套用司馬遷的話，就是「有國士之風」。他在〈報任安書〉中，從李陵平時的待人接物，特別評斷李陵為人「常思奮不顧身，以殉國家之急」，有「國士之風」。</p>\n\t\t\t<p>何謂「國士」？如司馬遷所說，既能事親至孝，以誠信對待士人，又能處世廉潔，取財合乎禮義之道。簡言之，「國士」是有才德的人。從這個角度看，游俠亦是「國士」，只不過游俠並非「殉國家之急」，而是不顧自身安危，拯救民間陷於水火之中的苦難者。</p>\n\t\t</div>"},{"title":"04　俠的曖昧性和唐傳奇的「劍俠」","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-37\"><span><span><span>0</span><span>4</span></span></span>　<span>俠的曖昧性和唐傳奇的「劍俠」</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在歷史上，「俠」這個概念非常悠久，從《韓非子》追索「文武分途」之後的「儒」和「俠」，一直到太史公〈游俠列傳〉，有兩個事實是顯而易見的：</p>\n\t\t\t<p>第一個事實，在中國現實社會中，「俠」不存在，意即司馬遷寫〈游俠列傳〉之時，真正的「游俠」已經消失了。秦以前的春秋戰國時代，當時的封建武士本就喪失立足於社會的基礎，所以為「游俠」立傳是一種理想的建構，「俠」在中國文化裡具有高度理想性。</p>\n\t\t\t<p>第二個事實，「俠」一出現，就具有曖昧性質，意味著當統治權壟斷正義時，俠如果不去挑戰國家秩序，也就不成其為「俠」。從這個角度看，這正是少有捕快成為「俠」的緣故。</p>\n\t\t\t<p>捕快代表傳統的執法者，但為何他們從未被當成「俠」來看待？執法者不就是以保護正義及人民為職責嗎？可是在俠義小說甚至武俠小說中，讀者一點都不覺得「六扇門」（衙門的別稱）或官場裡的這些人能夠擔任「俠」。「六扇門」其實是一種駡名，俗諺說：「衙門六扇開，有理無錢莫進來。」六扇門不是為了維持社會公義而存在。這個特殊的捕快系統，其權力伸及朝廷和江湖內外。</p>\n\t\t\t<p>如同我在《曾經江湖》中所言，武俠小說被金庸寫死了，後繼作者很難再延續武俠小說的傳統，也很難像金庸一樣，能夠吸引大批書迷對武俠小說滋生巨大向心力。金庸之後，溫瑞安可說是傑出的武俠小說家，成名作《四大名捕》曾被翻拍電影，也許溫瑞安自己都沒有意識到，他以四名捕快刻畫「俠」，已經突破了武俠小說不以執法者為俠的傳統。</p>\n\t\t\t<p>如前所說，「俠」一出現，就是高度理想性的象徵，但為什麼又同時具有曖昧性？「俠」有這兩種面目，他們破壞社會秩序，擁有危及社會治安的武勇暴力，但他們也正是憑藉這股力量掀起潮流、發揮影響力的。在此情況下，他們雖是破壞者，而當他們行俠仗義時，就成為至高的正義看守者，一切行事都被正當化了。這兩種面目必然隨時抵觸，俠在展現高度理想性時，一不小心就會顯露出曖昧性。</p>\n\t\t\t<p>司馬遷為游俠寫傳之後，很長一段時間，俠其實並未受到重視，直至唐代傳奇出現「劍俠」這個角色，「俠」和「劍俠」才重歸文學作品，並與後來的武俠小說發生緊密連結。唐傳奇的創作高峯期是在中唐，也就是西元七五五年安史之亂後，此時距離唐朝建立已有一百多年，大唐盛世也即將結束，自此步入藩鎮割據的局面。</p>\n\t\t\t<p>由於藩鎮各擁勢力，便出現了刺客，史家卻沒有認真看待、記錄他們的事蹟，於是被世人遺忘。當時刺殺之風盛行，也就衍生許多關於刺客的故事，如袁郊〈紅線傳〉、杜光庭〈虯髯客傳〉、孫光憲〈荊十三娘〉等。這群武藝高超的刺客忠於任務，自成一派，而一般人較為熟知的，就是唐傳奇中的聶隱娘。</p>\n\t\t\t<p>侯孝賢電影《刺客聶隱娘》改編自唐裴鉶的〈聶隱娘〉，從傳奇到電影，聶隱娘都是唐德宗年間貨真價實的職業殺手。電影用絕美畫面高度還原中唐時代氛圍，在雍容深沉的蒼茫山水下，刻畫聶隱娘這個人物，她自幼接受白衣道姑的武藝訓練，專殺禍國殃民、殘暴無道的獨夫，信奉「殺一獨夫可救千百人則殺之」的刺客教條，成為殺人於無形的頂尖殺手。這部電影跳脫唐傳奇框架，改寫「各親其主」的原型故事，在渾噩亂世中更細緻地描寫刺客大義：一個身負異能的殺手，如何一次又一次背叛刺客教條，違抗師命，刀下留命（如不殺田季安）。</p>\n\t\t\t<p>武俠小說的幽微世界，曾經深刻影響同一代電影人，譬如導演李安無論如何都要完成《臥虎藏龍》，呈現「每個人心中都有一把青冥劍」的武俠世界；王家衛則耐心耗費十年工夫，拍攝出《一代宗師》裡有勝負、也有人情世故的亂世武林。這兩部武俠電影之後，侯孝賢找到他心目中的《刺客聶隱娘》，以迷人的唐朝為背景，演繹一個既別致又極具寫實性的劍客世界。這三位導演的風格迥異，但彼此之間卻有一個共同點──他們都懷有武俠夢。</p>\n\t\t\t<p>從《飲食男女》到《綠巨人浩克》，李安擅長呈現出現代形式下的電影敘事；至於王家衛的代表作《重慶森林》，巧妙詮釋了香港城市的夢幻與愛情寓言。這三位導演慣用的電影語彙，一直以來都與「武林」無涉，可是這三位電影大師都實現了他們從年輕時就開始追逐的武俠夢。</p>\n\t\t\t<p>李安、王家衛及侯孝賢那一代的電影人，走在電影藝術這條路上，一生之中終究還是要拍出一部武俠電影。這樣的武俠夢來自他們年輕時就累積的龐大武俠小說閱讀量，讀多了，自然想要勾勒出自己心目中的江湖。因此，當武俠小說與武俠電影兩者合鳴後，迸發出巨大的魅力。侯孝賢的選擇比較特殊，他忠於史料，以寫實風格為善於隱匿的刺客塑形還原中唐面貌。</p>\n\t\t\t<p>唐傳奇中的劍俠世界，是繼《史記．游俠列傳》之後，另一片輝煌的武林，只是它煜煜的光芒讓人產生錯覺，忘了劍俠身處於中唐亂世。這種狀況一直延續至五代末年，才由宋太祖收拾混亂局面，進入到近世史。</p>\n\t\t\t<p>俠出於亂世；唯有亂世，俠才有存在空間。游俠之後，出現了劍俠，這是「俠」的第二次轉折。到了近世社會，又發生了第三次轉折，百姓生活在朝廷高壓的鉗制力量之下，自主型社會組織的存在空間越來越小，游俠出現的可能性也就微乎其微。游俠的社會性及現實性到了宋朝之後，就在近世社會消失無蹤了。</p>\n\t\t</div>"},{"title":"05　「儒俠」與「武士道」","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-38\"><span><span><span>0</span><span>5</span></span></span>　<span>「儒俠」與「武士道」</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>到了十九世紀末，「江湖」及「俠客」為什麼會在武俠小說中重新嶄露頭角？</p>\n\t\t\t<p>一部分原因是，武俠小說仍然延續《水滸傳》這類俠義小說的傳統。明朝一直到滅亡前，都飽受流寇等外患的隱憂。外患引起的動亂頻仍，促使明朝社會尚武成風，也讓那些在科舉考場上失志的士人轉向習武，就連「心學」宗師王陽明也擅長騎射兵法，年少時即有任俠習氣。只是這種「武」是要為朝廷所用的，現實上在朝廷管束下，沒有豪俠恣意存在的空間。直到清朝末年，發生了「俠」的第四次關鍵轉折，「俠」的概念快速地重新組構，影響到後來武俠小說的創作。</p>\n\t\t\t<p>清末章太炎寫《訄書．儒俠第六》，這篇文章講述了「俠」的概念如何演變，只是當他提及儒俠時，其實是重回到封建時代「儒」與「俠」文武合一的歷史脈絡。章太炎認為，「儒者之義」莫過於「殺身成仁」，「儒者之用」莫過於「除國之大害，捍國之大患」，因此「世有大儒，固舉俠士而並包之」，俠士可謂大儒。至於「刺客」，「當亂世則輔民，當治世則輔法」，如果沒有刺客以非常手段殺人，則「巨奸不息」。</p>\n\t\t\t<p>章太炎不只是國學大師，還是一位激進派學者，他寫〈五無論〉，主張「五無」──無政府、無聚落、無人類、無眾生、無世界。「五無」觀一部分來自佛家思想，或說源自印度佛教、印度哲學的概念。「五無者，超越民族主義者也」，章太炎不從國家、政府的狹隘眼界來立論，因為「夫於恆沙世界之中而有地球，無過太倉之有稊米」，一旦分割國家疆域，則民族主義相應而生。「五無」其一是「無政府」，章太炎主張無政府主義，在他看來，政府是導致種族隔閡與相爭之源。而他之所以特別談論「儒俠」，正因為他處於「有為鴟梟於百姓者」的亂世。</p>\n\t\t\t<p>如果想在亂世秉持「儒心」，即貫徹經世濟民的憂國憂民之心，非得成為一名「俠」不可。如同錢穆先生所說：「俠即儒之一派。文謂議禮，武是尚勇。」本身若無「俠」這種特質，不足以完成「儒」的使命──以解民倒懸為念，欲解救人民於水火之中。也就是說，想要實踐救民使命，必須訴諸「俠」的手段，而這種俠骨，可回溯到唐代的刺客傳奇。</p>\n\t\t\t<p>十九世紀時，以暗殺遂行政治目的，一般而言被視為理所當然。那麼由誰來執行暗殺行動？正是「俠」。章炳麟重申歷史上的刺客傳統，打破當時一般人以為刺客是從俄羅斯傳過來的認知；並不是只有刺殺沙皇的人民意志黨，中國自古以來就有「士為知己者死」的刺客如豫讓、聶政。《訄書．儒俠第六》中說：「漆雕氏之儒廢，而閭里有游俠。」「俠」原來都是「儒」，「俠」者捨生取義，與儒者嚮往的「義」等同。這個時候，僅僅是讀書人不足以成為「儒」，還必須擁有「俠」的尚勇特質，才是大儒。</p>\n\t\t\t<p>除了章炳麟論〈儒俠〉，梁啟超的《中國之武士道》一書也相當具有代表性。一看書名，「武士道」三字顯然受到日本影響。清光緒戊戌變法失敗之後，梁啟超流亡日本，先是創辦《清議報》，停刊後再籌辦《新民叢報》，「取《大學》新民之意」，發表一系列「新民說」政論，旨在「維新吾民」，創造中國的新國民。《中國之武士道》可說是「新民說」當中極為激烈的主張，與梁啟超逃亡日本的經驗有關。時值日本明治維新，日本軍部徵召居無定所的浪人武士入伍，或是派遣他們去其他國家執行諜報、偵察工作，成為日本侵略擴張的利器。</p>\n\t\t\t<p>梁啟超的《中國之武士道》極有意思，在相當程度上，等於呼應了章炳麟的「儒俠」說。《中國之武士道》是以紀傳體寫成，採集、評注春秋戰國時代以迄漢初的武士們。契合「儒」、「俠」合一的概念，梁啟超編纂中國武士道傳記，開篇第一人就從孔子寫起，然後以《史記》〈刺客列傳〉、〈游俠列傳〉為綱目，曹沫、豫讓、荊軻、高漸離、朱家、劇孟、郭解等等人物，都被列在這本小書裡。</p>\n\t\t\t<p>梁啟超的用意在於寫一本可以啟蒙、影響中國年輕人的教科書，希望當代中國人能夠覺悟。而他之所以「取日本輸入通行名詞」，將書名命為「中國之武士道」，是為了「補精神教育之一缺點」。他大聲疾呼恢復「祖宗之神力」，重新評點名留青史的中國刺客、游俠。他認知到日本快速強國的原因，正在於他們保留了武士道精神，倘若中國力圖強盛，其中一條重要的道路，就是重新認識、瞭解中國的武士道。尋回了武士道精神，中國就有機會像日本一樣迅速翻轉國運，擺脫長期以來的虛弱形象和災難性命運。</p>\n\t\t\t<p>這種概念影響所及，也顯現在平江不肖生的武俠作品上。</p>\n\t\t\t<p>近代武俠小說史上，平江不肖生有兩部重要經典作品：《江湖奇俠傳》和《近代俠義英雄傳》。其中《近代俠義英雄傳》以清末武術家霍元甲為中心，敘述霍元甲「三打外國大力士」的傳奇。平江不肖生創作霍元甲及其他奇俠故事，出發點不盡然是為了給讀者消遣閱讀，他的寫作用意與後起的武俠小說家截然不同。以霍元甲作為俠的榜樣，是為了鼓吹強身、強國、強種意識。</p>\n\t\t\t<p>平江不肖生為什麼特意寫霍元甲傳奇，而且戰鬥的對手都是英國人、俄國人？顯然當時西方列強向中國伸出掠奪、侵略的鷹爪，已經深深烙印在那一代人的心上。西方人批評衰落、頹弱的大清帝國為「東亞病夫」，梁啟超在《新民說》中也提到：「夫中國一東方病夫也，其麻木不仁久矣。」同樣意識到西方人眼中的中國形象。</p>\n\t\t\t<p>在西方人眼裡，中國人是無可救藥的「東亞病夫」。清末的禁煙運動，一部分是為了解決鴉片造成清廷白銀外流的財務困境，另一部分則是知識分子的憂國憂民。梁啟超等人從拯救民生、脫離鴉片毒害社會的角度，企圖恢復失傳已久的中國武士道精神。這股輿論感染了小說家平江不肖生，他藉由武俠小說，鼓勵人人以霍元甲為榜樣練武強身，獲得強健體魄，進而強國、強種。</p>\n\t\t\t<p>一九三<span>○</span>年代，中國掀起波瀾壯闊的歷史研究及辯論，當時的知識分子針對中國社會的問題和性質，展開為期十年的「社會史論戰」。所謂「社會史論戰」，討論主軸是中國的社會面貌在歷史各個階段如何轉變。這波浪潮相當程度上受到馬克思主義和唯物主義的影響，激烈爭論如：中國是否存在奴隸社會制度、中國的奴隸制社會如何進入封建制社會，以及封建制社會與封建制度是否能夠等而論之等議題。這次的論戰雖然難有結論，卻刺激了那個時代的史學家重新檢討、看待中國社會的轉變。中國社會不是憑空成形的，而是經過不同時期積累而成。</p>\n\t\t\t<p>在社會史論戰思潮席捲之下，至為關鍵的一件事，就是讓人們重新認識了春秋戰國時代。歷史學者陶希聖著有《辯士與游俠》，認為春秋戰國時代游離於國家體制之外的「遊閒分子」有兩類：「辯士」即是縱橫家，屬於知識分子；「游俠」則是遊民無產者。這類遊民的活動也有兩種：一種屬於個人，例如司馬遷〈刺客列傳〉裡的聶政與荊軻，是「英雄的個人行為」；另一種屬於集團，例如信陵君食客偵趙、救趙的事蹟。陶希聖認為，辯士和游俠正是從封建制度下的貴族、農奴階級轉變而來的。</p>\n\t\t\t<p>自秦漢以降，「俠士」或「游俠」這種特殊人格，漸漸在歷史上消失，淡出世人的記憶。所以，不論是梁啟超《中國之武士道》，還是陶希聖《辯士與游俠》，都極盡所能去挖掘秦漢以前的游俠史事。</p>\n\t\t\t<p>錢穆先生講得更精彩。錢先生在〈釋俠〉一文中指出，司馬遷在〈游俠列傳〉論俠，有「布衣之俠」、「閭巷之俠」、「匹夫之俠」，可說是平民之俠，而與平民之俠相對照的是戰國四公子。不似貴族之俠，匹夫之俠已湮滅於史籍中。錢先生由此分辨孟嘗君、春申君、平原君、信陵君可謂是「卿相之俠」，朱家、郭解之輩則是「閭巷布衣之俠」，「俠」必須贍養武勇之士，也就是《淮南子》所說的「任俠者」<a href=\"A-39.xhtml#foot-39-1\" id=\"back-39-1\">【注】</a>，成為戰國、秦漢之際一股不容小覷的社會勢力，自然形成社會集團的性格。</p>\n\t\t\t<p>此外，在〈論春秋時代人之道德精神〉一文中，錢先生分析春秋戰國時代人的人格，特別強調生死一貫的道德精神：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>所謂道德即教人以不違其內心之所安，於是有種種之德目。而外界之利害禍福，可以一切不顧。即他人之是非評論，亦可以棄之不問。唯此即為道德之完成。道德完成即是其人人格之完成，即是其人生命之完成也。蓋人生必達於是，乃始為完成其生命之大意義，乃始為善盡其生命之大責任。死生一以貫之，人之死即所以成其生。即於完成道德，完成人生之一大觀念下，實無生死之可辯也。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>中國曾經擁有過一個「重生輕死」的時代，人輕易就能自殺，拋棄生命。這種現象極為奇特。例如《史記．趙世家》就記載了「下宮之難」，也就是程嬰、公孫杵臼救趙氏孤兒的事蹟。春秋時代的晉國世族趙氏，被屠岸賈陷害滅門，趙朔妻生下遺腹子被追殺，公孫杵臼和程嬰商量，讓程嬰假意向屠岸賈告發，殺掉公孫杵臼和已掉包的嬰兒，以換得遺腹子趙武的安全。等到趙武長大報了仇，程嬰便自殺以謝公孫杵臼。</p>\n\t\t\t<p>從秦漢以後，我們再也看不到春秋戰國時代這樣的人格典型；秦漢以後，人們普遍認為生命中最重要的意念，就是「好死不如賴活」。然而有那麼一個時代，出現過一群人，他們深信與其賴活著無用，不如死得其所，否則雖生猶死。對春秋戰國人來說，有許多的原則及信念，都比苟活來得更加重要。</p>\n\t\t\t<p>為了原則、信念而活下去，才是人的艱難，與之相比，死不足懼。這種生命意趣，在一九三<span>○</span>年代得到了張揚，展現出另一種刺激和熱情。</p>\n\t\t</div>\n\t\t<div>\n\t\t<hr/>\n\t\t\t<p><a href=\"A-39.xhtml#back-39-1\" id=\"foot-39-1\">【注】《淮南子．泛論訓》云：「北楚有任俠者，其子孫數諫而止之，不聽也。縣有賊，大搜其廬，事果發覺。夜驚而走，追，道及之。其所施德者皆為之戰，得免而遂反。語其子曰：『汝數止吾為俠。今有難，果賴而免身，而諫我，不可用也。』」</a></p>\n\t\t</div>"},{"title":"06　身懷武功者，才能成為俠？","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-39\"><span><span><span>0</span><span>6</span></span></span>　<span>身懷武功者，才能成為俠？</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「死無所懼」並非從此讓中國人對生命的態度改弦易轍，這樣的生命意趣，秦漢之前確實曾轟轟烈烈存在過，而這種人格特質別具一格，與「俠」相關。發展到後來，此一內涵便充分反映在武俠小說的內容上。武俠小說沿著這一部分的傳統興起，「俠」的概念自此風起雲湧。</p>\n\t\t\t<p>何謂「俠」？武俠小說必然包含兩個部分，其一是「武」，其二為「俠」。為什麼俠必然具備「武」？因為唯有「武」能賦予俠超越平凡人的特異本事。《曾經江湖》書中講過，武俠世界與平凡世界是平行存在的，只有少數的倒楣鬼穿梭其中，像「店小二」就是衰運當頭的代表性人物。店小二為何老是遭殃？因為他身上沒有半點武功，只能任憑擺佈。</p>\n\t\t\t<p>我們也可以回想一下《射鵰英雄傳》。全真教王處一被藏僧靈智上人打了一記毒沙掌，為救王處一，郭靖和黃蓉潛入完顏王府尋藥。在偌大王府突然遇見府裡的簡管家，黃蓉便威脅他老實交代完顏康差人買來的幾味藥放在何處：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉左手在他手腕上一捏，右手微微向前一送，蛾眉鋼刺嵌入了他咽喉幾分。那簡管家只覺手腕上奇痛徹骨，可是又不敢叫出聲來。……黃蓉右手扯下他帽子，按在他口上，跟著左手一拉一扭，喀喇一聲，登時將他右臂臂骨扭斷了。那簡管家大叫一聲，立時昏暈，但嘴巴被帽子按住了，這一聲叫喊慘厲之中夾著窒悶，傳不出去。……簡管家痛得眼淚直流，屈膝跪倒，道：「小的真是不知道，姑娘殺了小的也沒用。」黃蓉這才信他不是裝假……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>身懷武功者，才能成為俠，才能闖蕩江湖。當路見不平時，想要拔刀相助，你得先握有刀，還要懂得運用手中的刀，否則任何濟世豪語都只是一番空話。俠處於江湖，必須身懷「武」這項利器，唯有如此，才能證明俠為何能自外於庸碌平凡的世界，去執行正義的使命。這正是「武」與「俠」並存的根據。</p>\n\t\t\t<p>武俠小說所描述的世界，相當程度上也反映了中國沒有神話傳統。神話有何重要性？其作用就在於，人們可以將他們對於世間的種種不滿或疑惑，全都發洩在神明身上。將一切推託給神明，就是因為世間凡人無力解決、承擔所有的罪過與災難。那麼，為何神可以解決一切難題？因為神擁有神力，神與人最大的差別就在於此。神話也建立在這個基礎上：人不是神，神擁有凡人無法企及的神力，毋須受到人間的限制，所以人在無力與掙扎之中得到了安慰，因為相信有神，相信神會發揮力量幫助他們解決問題。</p>\n\t\t\t<p>但千萬別忘了，在士人的大傳統中，「子不語怪力亂神」，對於神話是不屑一顧的，神話只存在於民間信仰，難登廟堂。在此情勢下，人們胸中那一股義憤，極難有出路。所以在相當程度上，「武功」旨在創造某種神話，意味著你我閱讀武俠小說時，都放下了現實感。如果再仔細推敲一番，武俠小說裡的這些江湖人物，其實都似神而非人，他們擁有一身超凡武功，驅使他們超脫現實，遁入另一個空間。</p>\n\t\t\t<p>除了「武」這項能力，俠還必須具備另一種特質。俠不能空有一身武功，還得懷抱春秋時代「死生一以貫之」、「善盡生命之大責任」的信念及原則。換言之，俠必須具備公共性。哪一類人可以成為「俠」呢？並不是單憑武藝就行，身懷武功之人，也有可能是暴徒，或是魚肉鄉民者。武俠小說承載的是〈游俠列傳〉所傳留的內涵，因此，「俠」必須抱持著正直信仰，維護正義、保護弱小，是他們一以貫之的守則。</p>\n\t\t\t<p>當我們談到金庸寫作的基本脈絡時，也必須對照著看「俠」的這些特質及傳統。</p>\n\t\t\t<p>一九五五年金庸動筆寫第一部武俠小說《書劍恩仇錄》，緊接著一九五六年發表《碧血劍》，等到金庸完成「射鵰三部曲」，這兩部作品難免就被金迷所忽略。陳家洛與袁承志淡出了讀者心中，這兩位俠令人愛戴的程度，遠不及郭靖、楊過、張無忌。再回頭細想，陳家洛和袁承志的形象其實完全符合武俠小說傳統，他們都身懷絕世武功，差別只在陳家洛一上場就武藝驚人，袁承志則是經過一番歷練，武技與日俱增。事實上，他們都是神人而非平凡人，而且他們都是俠，身上具有再清楚不過的公共性──愛國愛民。</p>\n\t\t\t<p>「愛國愛民」這四個字對陳家洛來說十分重要，《書劍恩仇錄》最關鍵的情節就在於陳家洛如何替漢人尋找出路。他立志推翻清廷，想要借他親兄長乾隆皇帝的手顛覆朝廷，一舉實現漢人江山。陳家洛對於「救世濟民」、「漢人天下」念茲在茲，這也是小說最扣人心弦的書寫核心。</p>\n\t\t\t<p>袁崇煥之子袁承志也是如此，因為身世的緣故，他在《碧血劍》裡始終背負著任務，報父仇就是他存在的意義。他有兩個公共性的報仇對象，一個是崇禎皇帝。袁崇煥曾經主張議和、擅殺毛文龍，又頻上奏摺「催餉」，提出「發內帑以犒將士」，這些前因策動了皇太極使出反間計，生性多疑的崇禎皇帝最終以「魚鱗刮」凌遲處死了袁崇煥。袁崇煥一生保衛大明江山，卻換來三千五百四十三刀的報償。而滿洲人陷害父親、侵略中原，則是袁承志的第二個大仇人。</p>\n\t\t\t<p>袁承志將復仇大業依託在「闖王」李自成身上，只是當這名強者攻入北京城後，便開始貪婪腐敗。在這裡也顯現出「俠」存在的必要，一旦統治權力變質，就必須倚賴「俠」來收拾。然而，《碧血劍》的結尾宣告了「俠」的失敗，在「闖王」背離百姓之後，袁承志未能真正解救黎民於水火，落寞遠走南方小島。</p>\n\t\t\t<p>陳家洛、袁承志這兩位俠，都以國家大義為己任；而在下一部《射鵰英雄傳》中，雖然主角郭靖被塑造為「俠之大者，為國為民」的典範，但我們不得不承認，和郭靖相比，道德性沒那麼完美的黃蓉，以及那些極具個人魅力的配角人物，更吸引住讀者的目光。這時候，我們固有對於「俠」的概念其實已經鬆動了。到了《神鵰俠侶》，主角楊過又突破了讀者想像中「俠」的形象（可參《曾經江湖》）。自此，在金庸筆下，「俠」的面貌變得越來越多元。</p>\n\t\t\t<p>武功原本是「俠」存在的正當性之一，此外，如果只是徒有武功，而缺少濟弱鋤強之心，仍不成其為「俠」。只是這句斷言，是先將《鹿鼎記》排除在外。《鹿鼎記》主角韋小寶的出現，無疑挑戰了「武」與「俠」的雙重定義，逼著我們重新爬梳「武」與「俠」的關連──韋小寶算是「俠」嗎？這裡暫且埋下伏筆，留待《再會江湖》詳細探索。</p>\n\t\t</div>"},{"title":"07　武林：為新秩序而生","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-40\"><span><span><span>0</span><span>7</span></span></span>　<span>武林：為新秩序而生</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>平江不肖生的《江湖奇俠傳》，在武俠文學史上的巨大貢獻，就是形塑了武林。何謂「武林」？「江湖」又是什麼？</p>\n\t\t\t<p>武林、江湖就是這一群奇異之士所組成的人際關係。武俠小說敘述的不是俠在凡人世界的遭遇，而是這些俠以非凡武功創造的奇觀。它的敘事架構不在平凡人與俠之間的關係，而是圍繞在俠與俠之間的情仇糾葛。武俠的空間獨立存在於凡人世界之外，自成一脈，彼此有特定的人際關係。</p>\n\t\t\t<p>俠的人際關係有基本的套路或模式，俠並非單獨存在，而是依附在幫派之中。也就是說，任何一個角色進入到武俠空間裡，來自於何門何派，就是他的首要身分。在武俠小說中，角色的出身與頭銜極為重要，比如《射鵰英雄傳》裡，柯鎮惡是「江南七怪」之首，洪七公是「丐幫」第十八代幫主，幫派、頭銜明確標示出這些「俠」在武林人際關係中的地位。</p>\n\t\t\t<p>從這點來看，平江不肖生以來的武俠小說，之所以足可開創新時代的新局面，關鍵就在其「系譜」，以及「系譜」所打造出的異類世界。江湖或武林，從平江不肖生的小說透顯出來，成為一個藏在日常生活中，一般人卻看不見、聽不到、摸不著的隱形世界。江湖、武林與現實不即不離，亦即亦離。</p>\n\t\t\t<p>從此之後，江湖、武林成了底層的另類中國。事實上，平江不肖生的小說會流行起來，以及作為一種文類，武俠小說會有那麼旺盛且長久的生命力，吸引一代一代的作者與讀者，其中一項歷史緣由，或許就來自中國主流的大傳統在歷經挫折、崩潰之後，人們只能藉由「武俠」的仲介，想像一個充滿義氣與英雄的「底層中國」、「小傳統中國」。</p>\n\t\t\t<p>十九世紀以降，中國迭遭打擊，終至使得一切舊有秩序都失去了合法性，當然也失去了效力。科舉瓦解了，朝廷瓦解了，鄉約宗祠瓦解了，進而連政府官家的權威也瓦解了。在這種惡劣悲觀的現實下，人們還能依賴什麼？</p>\n\t\t\t<p>人們可能會依賴像杜月笙那樣的仲裁者。杜月笙及上海青幫的傳說在民國初年廣泛流傳，甚至被誇大為傳奇，正反映了那個時代的「秩序渴望」。除了「秩序渴望」之外，還有「尊嚴渴望」，渴望面對被西方勢力不斷挫敗的中國，還能夠有些值得肯定、值得驕傲的地方。</p>\n\t\t\t<p>在武俠小說的類型規範裡，武林、江湖就是不斷處於尋求秩序的狀態。武俠小說的開頭，幾乎都是原有的武林秩序瓦解了，必須藉由一位英雄或一群英雄，在一連串奇遇及武鬥之後，最後創造出新的秩序。</p>\n\t\t\t<p>武俠小說逃不掉的宿命，是不斷在瓦解後的舊秩序當中尋求新秩序。如果不是如此，就違背了武俠小說的傳統，甚至不被視為好的武俠小說。基於以上背景，即能解釋金庸的小說為何能臻至武俠文學的巔峯。</p>\n\t\t\t<p>在一般讀者心目中，「華山論劍」是金庸小說令人印象深刻的情節設定。為什麼會發生「華山論劍」？在《射鵰英雄傳》這部小說裡，有金庸因應武俠敘事傳統的基本架構，當然也有金庸的獨特創新。</p>\n\t\t\t<p>小說裡第一次提到「華山論劍」時，事件已經過去很久了，可是書中人物仍反反覆覆回溯、描述這件事，因為那是整部小說最核心的重大事件。東邪、西毒、南帝、北丐、中神通，他們論武七天七夜，最後由中神通王重陽技壓其他四人，奪得武林奇書《九陰真經》。王重陽出家做了道士，創立全真派，他之所以爭取《九陰真經》，目的是為了藏起來，讓武林從此遠離腥風血雨。情節進展到此，新秩序形成了。</p>\n\t\t\t<p>但之後，一連串的陰差陽錯及轉折，讓武林再生波瀾，才剛建立好的秩序又遭破壞。銅屍陳玄風、鐵屍梅超風這對夫妻檔，他們原是東邪黃藥師的徒弟，盜走了黃藥師略施小計得來的半部《九陰真經》，練成陰毒武技後，以「黑風雙煞」之名在江湖中闖蕩。江湖再起風波，不少英豪的性命折損在他們手裡。</p>\n\t\t\t<p>如此開啟一個漫長的故事，但無論這個故事走得多漫長，它還是依循著武俠傳統的基本模式，意味著憑藉王重陽的修為建立起的秩序遭到毀壞，此時必須藉由第二次華山論劍，重新收拾混亂的武林秩序。《九陰真經》重現江湖後，西毒歐陽鋒即不擇手段地搶奪，郭靖和黃蓉也介入其中，而他們最重要的作用，就是按照類型小說的慣例，分隔出正派與反派陣營。</p>\n\t\t\t<p>然而金庸最傑出的成就，在於不破壞武俠類型規範，卻寫出了正派與反派人物之間更為複雜的關係。《射鵰英雄傳》可說是金庸創作的一次分水嶺，意味著自《射鵰英雄傳》之後，金庸衡量正、邪的標準已有了變化。</p>\n\t\t\t<p>在《書劍恩仇錄》和《碧血劍》中，反派就是不折不扣的反派，換言之，反派之所以成為反派，完全來自一個人的心術不正，或是邪魔般的個性。但是到了《射鵰英雄傳》、《神鵰俠侶》，金庸筆下的大反派如歐陽鋒、李莫愁，可恨之餘也讓人看到可憐之處，《倚天屠龍記》的人物刻畫也變得更加複雜，形象最突出的莫過於滅絕師太。她是出身峨嵋的正派人物，絕非壞人，但她的頑固導致是非不分；她也是最刻薄、自以為是的人，像是懲戒徒弟紀曉芙的手段就頗為駭人。到了《笑傲江湖》，金庸更是將這個主題發揮到淋漓盡致，就看左冷禪、岳不羣、余滄海等名門掌門的作為，正、反派人物出現了混淆，其界線也不再非黑即白。</p>\n\t\t\t<p>讀者預期從閱讀武俠小說得到安慰，從不堪的現實逃入想像世界，這是平江不肖生開啟的武俠世界。當時的中國人渴望秩序、渴望尊嚴，但凡維護秩序的人物就屬於正派這一方；反之，破壞秩序的就是反派角色，讀者不必去深究他們是如何誤入歧途的。金庸從這個傳統裡來，卻走出了自己的一片新境界。</p>\n\t\t</div>"},{"title":"08　英雄的想像","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-41\"><span><span><span>0</span><span>8</span></span></span>　<span>英雄的想像</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>對照平江不肖生在《近代俠義英雄傳》中，著力書寫霍元甲「三打外國大力士」，最清楚反映了武俠小說在提供「尊嚴渴望」上的重大功效。這是正義尊嚴之外，不容忽視的民族尊嚴。</p>\n\t\t\t<p>在西方，歷史小說家華特．史考特，也很擅長寫這類俠義小說，之所以提到史考特爵士，是因為出版英文版《射鵰英雄傳》的麥克萊霍斯出版社（Maclehose Press）總編輯保羅．恩格爾（Paul Engles）是不折不扣的史考特迷，他決定出版《射鵰英雄傳》，想必與這個背景有關。</p>\n\t\t\t<p>我曾經與這位總編輯在談話的時候，提到史考特與金庸的作品之間存在的絕大差異，那就是史考特的歷史小說中沒有民族主義成分，書中英雄的血統和民族身分都不重要。反觀金庸的武俠小說，承襲自兩項背景：首先，是平江不肖生所建立的武俠小說類型，「武俠」存在的作用是為了讓中國人揚眉吐氣；其次，金庸在對日抗戰時期當過流亡學生，日本侵華在他心中留下痛苦記憶，反映在外族與漢人之間的衝突描寫，始終都是他小說中的主軸。</p>\n\t\t\t<p>金庸選擇小說的歷史背景，大致上是以宋代、明末清初、清朝為主，民族衝突有來自宋遼金之間的關係這一系列，另一系列則是漢人與滿人之間的關係。金庸擅長寫民族間的對立與衝突，從民族主義的角度看，這也是我認為《鹿鼎記》必須單獨評說的原因。</p>\n\t\t\t<p>武俠小說創造的武林、江湖，藏著各式各樣的英雄，他們神武、雋朗、智慧，而且充滿美德。中國社會得以戰勝西洋的，不在朝堂、士大夫的那個「顯世界」，而是在武林、江湖所形成的「隱世界」。「顯世界」已被證明不堪一擊、破敗狼狽，沒關係，還有「隱世界」的存在。無論江湖、武林再怎麼險惡，充滿了鉤心鬥角，或在敗破中尋求新秩序，武俠世界絕對比現實美好，比現實更值得我們嚮往。</p>\n\t\t\t<p>這種依靠想像來維持尊嚴的路數，不是很像相信靠著神符咒語就能「扶清滅洋」的義和團嗎？平江不肖生必然也自覺到霍元甲拳打洋人力士的故事精神裡，有太多「義和團成分」在，才刻意在書中安排霍元甲不只反義和團，還解救被迫害的教民，誅殺義和團首領。</p>\n\t\t\t<p>不過，霍元甲殺了義和團首領，卻殺不斷武俠小說在社會意識功能上與義和團的相近關係。武俠小說是那個悲苦年代的心理逃避，同時也是安慰。從不堪的現實逃入一個想像世界，因為有著完整的系譜，看起來如此具體、立體。</p>\n\t\t\t<p>平江不肖生之後，武俠小說在閱讀上提供的最大安慰，就在於似真地告訴讀者，在我們周圍，幽微隱藏著沒被我們識破的另一個中國，一個保留了俠義精神高貴特質的中國，一個具有足以擊倒外國勢力能量的中國。這個有英雄的江湖，不是任何人為了寫小說而捏造出來的，平江不肖生能寫出這樣的小說，是因為他得了機緣之助，是得以識破那個世界一小角的偷窺者，將那個世界的樣貌轉述給我們知道。</p>\n\t\t\t<p>虛構故事的小說作者，想方設法地排除附著其上的虛構性，假裝那敘事聲音來自一個記錄者。請看《江湖奇俠傳》裡向樂山的故事，是怎麼開頭的？平江不肖生寫道：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>清虛道人收向樂山的一回故事，凡是年紀在七十以上的平江人，十有八九能知道這事的。在下且趁這當兒，交代一番，再寫以下爭水路碼頭的事，方有著落。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是平江不肖生重要的寫作策略，也是他開創「武俠」的主要貢獻之一。他用這種方式開啟了讀者及後繼的作者心中那種虛實互動、現實與江湖兩個世界彼此穿梭互通的無窮可能性。</p>\n\t\t</div>"},{"title":"09　「俠」內在的道德矛盾","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-42\"><span><span><span>0</span><span>9</span></span></span>　<span>「俠」內在的道德矛盾</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在平江不肖生之後的武俠世界中，有兩個特殊的組織（或說門派）經常出現，那就是佛寺跟道觀，這種組織不同於宗族，它之所以存在，其實恰巧反映了宋代以降中國社會的最大特色：中央朝廷的勢力不斷上升，壟斷了所有政治及組織的權力。</p>\n\t\t\t<p>在中古時期，尤其是魏晉南北朝到隋唐時代，佛寺一直是非常龐大的組織。僧侶及土地都是佛寺的資產，等於寺院財產私有化，這些宗教組織有其經濟系統，簡直就是國中之國。但是到了近世的宋朝，開始嚴加控管僧眾的數量，再也看不到如此規模的佛寺了。</p>\n\t\t\t<p>不過武俠世界既然平行於現實社會，不存在於現實，因此「俠」經常與寺院、道觀有關連，最知名的莫過於少林與武當。但佛寺、道觀組織的存在，又顯示了武俠小說的內在矛盾，因為它們與江湖格格不入。佛門本應不問塵世，道家也應講求清淨無為，如何與好勇鬥狠扯上關係？</p>\n\t\t\t<p>道教講究吐納養生，後來與氣功、武術產生關連；而佛門亦有「武」的特質，其實在中古時代，佛寺可以擁有僧兵，作為護衛寺廟的武力。像是日本奈良朝、平安朝的東大寺、興福寺、藥師寺等七大寺，以及京都比叡山的延曆寺，這些大佛寺都備有僧兵。又如北魏、五代十國時期，僧侶也曾經參與農民起義、抵禦外族等壯烈事蹟。因著這樣的淵源，佛寺僧兵與道觀武術遂成為一種社會的隱性記憶，在武俠小說中傳留下來，並與江湖、武林結合。</p>\n\t\t\t<p>宗教本應悲天憫人、慈悲為懷，尤其不殺生，但行走武林，必然會使用武功、動用兵器。對照《射鵰英雄傳》，鐵掌幫幫主裘千仞在華山之上提出一個大哉問：「哪一位生平沒殺過人、沒犯過惡行的，就請上來動手。」幾位高手給裘千仞這句話當場就堵住了。身在江湖，你能不殺人嗎？可是武俠小說裡的僧人、道士，不在佛門、道觀清淨地，卻出入江湖打打殺殺，成何體統？</p>\n\t\t\t<p>對於西方譯者來說，金庸小說實難翻譯。譯者首先就會遇到價值上的衝突。東方的「俠」其實存在著內在矛盾，「俠」既追求正義，如司馬遷筆下的游俠「赴士之厄困」，但「俠」本身又是破壞社會秩序的源頭。譬如《書劍恩仇錄》中，前半部情節主要圍繞在「救文泰來」這件事上，但為了救這位四當家，紅花會殺了多少人？那些人的性命真的不值一顧嗎？當「俠」行俠仗義時，如何確定他伸張的正義是絕對的正義？</p>\n\t\t\t<p>當譯者試圖詮釋這個正義矛盾時，西方讀者可能缺乏這種默契情境，進而產生疑問。正如北丐洪七公面對裘千仞的脫罪之詞，曾義正詞嚴地說，自己「生平從來沒殺過一個好人」。這極有可能是個「套套邏輯」（tautology）。怎麼確定自己從未錯殺過一個人？究竟是用何種標準，去證明自己殺的每一個人都是「貪官汙吏、土豪惡霸、大奸巨惡、負義薄倖之輩」？大俠殺的就都是壞人？死於奸徒刀下的都是好人嗎？</p>\n\t\t\t<p>金庸意識到這個問題與矛盾，才會描寫郭靖對於學武、殺人的反思：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「我一生苦練武藝，練到現在，又怎樣呢？連母親和蓉兒都不能保，練了武藝又有何用？……完顏洪烈、摩訶末他們自然是壞人。但成吉思汗呢？他殺了完顏洪烈，該說是好人了，卻又命令我去攻打大宋；他養我母子二十年，到頭來卻又逼死我的母親。……拖雷安答和我情投意合，但若他領軍南攻，我是否要在戰場上與他兵戎相見，殺個你死我活？不，不，每個人都有母親，都是母親十月懷胎、辛辛苦苦的撫育長大，我怎能殺了別人的兒子，叫他母親傷心痛哭？他不忍心殺我，我也不忍心殺他。然而，難道就任由他來殺我大宋百姓？學武是為了打人殺人，看來我過去二十年全都錯了，我勤勤懇懇的苦學苦練，到頭來只有害人。早知如此，我一點武藝不會反而更好。……」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸藉由郭靖的「武功害人論」，試圖釐清這道難題，使金庸小說的文學成就遠超過其他武俠小說家。古龍也認真處理過這個問題，《多情劍客無情劍》裡的主角李尋歡擁有神乎其技的絕世武功，江湖上人人皆知「小李飛刀，例不虛發」，但罹患肺癆的李尋歡最突出的特質就是不殺人。由於他堅持不殺人，便經常讓自己陷入艱難的處境。另外還有楚留香，也是一個不殺人的俠。</p>\n\t\t\t<p>古龍要著墨的是，人在生死一念之間，如果不殺人，會付出什麼代價？會讓自己陷入怎樣的困境？這是古龍獨到之處。殺人與救人，小說家必須維持生命邏輯的連貫性、一致性；如果「俠」的精神是救人至上，但為了救一個人，可能會殺害其他人，這中間的合理性究竟為何？單就這一點，其中的思考脈絡在武俠小說中往往囫圇處理過去，經不起翻譯細究。</p>\n\t\t</div>"},{"title":"10　俠傳統：集體高過個人","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-43\"><span><span><span>1</span><span>0</span></span></span>　<span>俠傳統：集體高過個人</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>對西方讀者來說，他們抱持著啟蒙主義所揭示的自由主義與個人主義，很難理解東方武俠中的集體或組織性。在江湖、武林中，作為一個「俠」，他不是獨立存在的個人，而為了自己的民族身分或江湖身分，願意隨時獻出性命。</p>\n\t\t\t<p>「俠」必須歸屬在門派關係之下，這其中也產生了衝突與矛盾。武俠世界不是為了從傳統宗族關係游離出來而存在的嗎？可是一旦「俠」依附於江湖組織，仍然必須蹈行如尊師重道的守則，現實社會的宗族枷鎖透過武俠世界的師徒關係復活了，有時甚至比「君臣父子」的人倫制度更加嚴格。在江湖上，師徒關係無比重要，試想當小龍女和楊過打破師徒之道想要結為夫妻時，引來了多少鄙夷唾罵，生出了多少阻礙波折？</p>\n\t\t\t<p>金庸常常在小說中提及「門派之別」，那是什麼？例如《神鵰俠侶》〈武林盟主〉那一回，楊過和金輪法王的弟子霍都過招，一開始使出洪七公的「打狗棒法」，就被霍都怒嗆不用本門武功：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過接口道：「你這次說的倒算是人話，這棒法果然非我師父所授，縱然勝得你，諒你也不服。你要見識見識我師父的功夫，絲毫不難。我剛才借用別派功夫，就怕本門功夫用將出來，你輸得太慘。……幸虧這番王提醒了我。若是我用打夠棒法勝他，怎能顯出我姑姑的本事？姑姑豈不怪我忘了她傳授武功的恩德？」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>比武論輸贏，最忌諱使用非本門武功。此外，另投師門也「不合武林規矩」。當郭靖想撮合楊過與郭芙的婚事，黃蓉卻看出楊、龍二人的關係不尋常，追問楊過是否對小龍女「磕過頭、行過拜師的大禮」。郭靖一時不能明白黃蓉話中的意思：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖……心想：「他早說過是龍姑娘的弟子，二人武功果是一路同派，那還有甚麼假的？我跟他提女兒的親事，怎麼蓉兒又問他們師承門派？嗯，他先入全真派，後來改投別師，雖然不合武林規矩，卻也不難化解。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>又如《碧血劍》袁承志的武功養成過程中，其實有兩個師父，除了華山本門師父穆人清外，還有一位木桑道人，但木桑道人堅決不讓袁承志拜他為師，也不直接教他武功。為什麼？因為武林規矩是，徒弟只能拜一個師父，一日為師，終生為師；如果向其他師父學武，那就是欺師叛門。</p>\n\t\t\t<p>然而，郭靖、楊過等人後來得以臻至武學的化境，是在因緣際會下習得了其他門派的武功，然後加以融會貫通。這裡有矛盾。金庸大膽地探索這項矛盾，看袁承志、郭靖、楊過、令狐冲之所以能夠脫穎而出，就是因為其他人都遵守門派之別，所以丘處機教出來的徒弟，不可能比丘處機武功來得高強。</p>\n\t\t\t<p>對照古龍小說，古龍完全不寫門派之別，也不在意著墨大俠們的武功來歷。可是讀金庸的小說，有個非常過癮的地方，就是看金庸如何巧妙地設計大俠們的武功奇遇；原本依照武林規矩，一個人一生只能有一個家派，卻有少數人可以迭逢機緣，可以打破江湖規矩，傳承不同門派、不同師父的武功。</p>\n\t\t\t<p>正因為突破了武俠小說傳統，讀者在金庸小說中得到了閱讀上不同的趣味。回想一下，看《射鵰英雄傳》郭靖闖蕩江湖的故事，哪一段情節讓你欲罷不能？應該是他學武的奇遇吧。例如在黃蓉的美食引誘下，九指神丐洪七公破例教了郭靖「降龍十八缺三掌」，或是郭靖在桃花島上巧遇老頑童周伯通，學會了左右互搏之術，類似的小說情節會吸引你一直讀下去。</p>\n\t\t\t<p>西方讀者可能無法深刻理解這種敘事邏輯：為何在比武相爭之際，只能使用本門武功？集體性原則為什麼高過一切，壓過了個人的個性，甚至超越個人的生死？這是武俠小說的精髓，正因為武俠小說有其曲折來歷，俠有其理想性與曖昧性，外在於這個社會或文化，就不容易讀得透徹。</p>\n\t\t\t<p>武俠小說是由整個時代打造出來的，當讀者進入了武俠世界，意味著讀者本身也是這種歷史力量的產物。</p>\n\t\t</div>"},{"title":"11　俠的現實難題：逼上梁山之後呢？","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-44\"><span><span><span>1</span><span>1</span></span></span>　<span>俠的現實難題：逼上梁山之後呢？</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>長期以來，中國的傳統秩序有兩股堅不可摧的力量。歷史最悠久的一股力量來自宗族（親族），是從周代封建制度建立起來的。親族系統是中國社會組織最重要的核心，意味著以君臣、父子、夫婦、兄弟、朋友這「五倫」作為人際規範，人與人之間的對待，諸如尊卑及規矩，都是由親族擴張出去，「君君，臣臣，父父，子子」，而皇帝就是萬民的父親形象。宗族之外，另一股傳統秩序的力量，就是來自國家（朝廷）。</p>\n\t\t\t<p>所謂「俠以武犯禁」，「俠」之所以存在，正在於社會以親族為核心。例如《論語．子路》中說：「父為子隱，子為父隱，直在其中矣。」親族關係就凌駕道德及法律之上，父親犯罪兒子會為父親隱瞞，兒子犯罪父親會為兒子隱瞞，孔子認為「父子相隱」不僅保全了親情，也是公正合理之事。於是，當法令與親情相衝突時，人們常常陷入兩難，掙扎於不孝或者不義之間，致使社會上無法落實普遍正義。所有的正義原則在五倫綱常的道德觀下，只能做各式各樣的調整與妥協。</p>\n\t\t\t<p>只是，被迫妥協的人心裡，必然抱有不滿情緒，甚至比親族系統更巨大的妥協壓力，來自於政治力量。所以「俠」為何會存在？因為在中國傳統秩序下，現實中不存在普遍正義。但是「俠」沒有現實基礎，變成了高度理想性的存在，也是一種高度曖昧性的概念。及至近代，為何武俠小說會蓬勃發展？相當程度上在於社會現代化後，宗族系統及國家體制不斷遭受打擊，維持表面正義的傳統秩序瓦解、崩潰了，這個時候人們該如何應對？那就唯有逃避，或是想像一個有正義和新秩序存在的特殊世界。</p>\n\t\t\t<p>如此正義凜然的世界，為何那麼迷人？因為它與現實之間有距離，或者說，因為它非現實。太史公〈游俠列傳〉、〈刺客列傳〉筆下，郭解、朱家、荊軻之輩仍然是現實裡的人；及至後來，到了唐代，這些俠客、劍客走進了傳奇裡，幾乎是魔幻寫實的存在；再至晚清，出現章回小說《三俠五義》，成了極為特殊的分水嶺。</p>\n\t\t\t<p>《三俠五義》的故事主軸環繞在宋朝開封府，一群以展昭為首的俠客，輔佐開封府尹包拯懲奸除惡，對抗各種邪惡力量。《三俠五義》之前，明代《包公案》是專講斷案情節的公案小說，包公秉公執法、為民除害的形象透過民間說書深植人心；《三俠五義》之後，傳統小說漸漸分出另一條路線，俠義與公案的主題開始分流。</p>\n\t\t\t<p>被金聖歎評為六才子書之一的《水滸傳》，或許可以讓我們追本溯源，分析《三俠五義》成為武俠小說濫觴之因。</p>\n\t\t\t<p>《水滸傳》描述的是宋江等一百零八條好漢被「逼上梁山」，小說圍繞著官逼民反、朝廷招安等故事線索，絕非一部純粹的武俠小說。許多人將武俠小說的源頭推前至《水滸傳》，但《水滸傳》與武俠小說之間仍然存在巨大的差距。梁山泊故事最精彩之處，在於奸邪陷害忠良，致使好漢命運乖舛，只有上梁山一途能安身立命。「逼上梁山」才是《水滸傳》的敘事主軸。</p>\n\t\t\t<p>「官逼民反」顯露出當時的社會現實，意味著小說家刻意諷刺時政，這些好漢之所以落草為寇，完全是受權貴陷害之故。這一百零八人名為盜賊，實際上是起義造反，他們是不公義社會及制度下的產物。貪官汙吏始終在旁虎視眈眈，只有上梁山才能保全性命，至少能在朝廷以外的世界做豪傑，成為盜賊並不是他們的過錯。</p>\n\t\t\t<p>不過，等到這群豪傑全都聚集起來，原寨主晁蓋中箭而亡，宋江繼為山寨之主，把議事的聚義廳改為「忠義堂」，一百零八個梁山泊英雄也按照「天罡地煞」排了名次，故事發展至此，就遇到一個棘手難題：然後呢？接下來這些英雄該當如何？他們在梁山上聚義，斬殺地方惡霸與無良官僚，已然走到了情節高潮，似乎只要繼續待在梁山，就能一路完成劫富濟貧、懲奸除惡的使命。</p>\n\t\t\t<p>然而，《水滸傳》這部小說存在著「道德危機」（moral crisis）。這些豪傑身上都背負著仇恨，如武松、林沖、宋江、魯智深等人，在落草為寇之前都經歷了一段悲慘遭遇，他們奔上梁山有著正義性和正當性的理由。但等到他們成為一方霸主（或說盜匪），之後的故事又該怎麼鋪陳？施耐庵只能另闢蹊徑，而且只能往兩條路走。一條就是打官軍，朝廷派重兵收剿梁山泊草寇，宋江十面埋伏團團圍困天子重兵，五次打敗官家軍隊。仗打贏了，這些綠林好漢不可能取朝廷而代之，最後只剩下另外一條路，就是被招安，實現宋江等人「替天行道」、「忠義雙全」，返回正道重新效忠朝廷。</p>\n\t\t\t<p>作者一反原先套路，小說敘事變成著重在「招安」主軸。朝廷招撫之後就一切太平了嗎？梁山泊豪傑就成為良民了嗎？作者便安排眾義士去做一番轟轟烈烈之事，他們四處征戰，討伐遼國、平定方臘等等，然後勝利歸來。但小說最後的結局並不圓滿，大部分梁山好漢在征途折損，倖存回京的，如宋江被奸臣高俅設毒計害死。於是誕生了清初陳忱的《水滸後傳》，讓倖存的好漢及他們的後代順著「官逼民反」這條路數再度起義，奮勇抗金。</p>\n\t\t\t<p>從《水滸傳》的敘事主軸，可以看出近世中國的問題，也就是宋代以降，即使是想像、虛構的作品，都不存在抵抗國家勢力的空間，亦即民間組織永遠不可能挑戰朝廷權威。《水滸傳》諷刺時政，因為朝廷與官場太過腐敗，於是想像出一群英雄去對抗極權，但是小說最後終究不能順著「反抗朝廷」的思路發展下去。這是無法違逆的社會現實，所謂「忠義雙全」，必須建構在效忠天子的觀念下，不可能逃離國家體制。</p>\n\t\t\t<p>在傳統社會的約束下，小說家想像「官逼民反」的世界，其實是基於對素樸正義的需要。發展到後來，為了在虛構世界中發洩對素樸正義的需求，《三俠五義》於是集合了兩種路數。第一個路數是包青天所代表的力量，官府衙門可以替天行道，為民除害，對抗貪官汙吏。開封府衙最懾人的那三口鍘刀──龍頭鍘、虎頭鍘及狗頭鍘，其中龍頭鍘專鍘皇親國戚，象徵最素樸的正義感。皇親國戚正是阻礙社會普遍正義存在的關鍵，而包拯傳奇在這點上彰顯出最大的意義。</p>\n\t\t\t<p>在《三俠五義》中，除了包拯之外，幾位俠客的存在是第二條路數。俠客在虛構世界中天賦異稟，才能幫助包拯辦案，這種敘事方式同樣反映出近世社會的基本結構。自《包公案》之後，公案小說從俠義故事中分途而出，清朝陸續出現《施公案》、《彭公案》，小說主軸都是以官府力量來主持正義。但是清朝公案小說每況愈下，因為小說的虛構世界很難抵抗社會現實，地方官府打擊皇親貴胄的現實性越來越難以維持下去。</p>\n\t\t\t<p>公案小說有難以跨越的現實性門檻，反觀俠義小說一路發展至近代，成為武俠小說的起源。兩者之間的差距何在？公案小說的無以為繼，就因為它涉及現實中朝廷的權力，小說的虛構空間就受到局限。公案小說無法突破社會現實，俠義小說因而晉升為主流。「俠」要進入現實世界，那就必須如太史公所記載的那種「游俠」，必然要游離於國家體制之外，游離於宗族組織之外。從這個角度看，俠具備了雙重的游離性。</p>\n\t\t\t<p>近代武俠小說崛起於混亂世局之中，舊有的社會結構及正義秩序瓦解，武俠小說才能舉起正義大旗，迎合讀者需要。只是當小說家將「俠」描述到無所不能時，「俠」就非得與現實脫節；一旦在虛構世界融入現實性，「俠」就會失去可信度。武俠小說之所以吸引讀者目光，就在於小說家所設下的誘餌──江湖、武林──自成一獨立世界，這個虛構世界與真實社會不再交錯，兩者之間幾乎形成絕然的壁壘。</p>\n\t\t\t<p>換言之，在現實社會結構中，朝廷權勢如此強大，宗族系統如此不可違逆，而「游俠」既不在國家體制之下，也不屬於親族系統，他們活在一個特殊空間，自有另外一套秩序。但他們也隨時準備為義捨生，或是不斷逃亡，這是他們必須付出的代價。</p>\n\t\t</div>"},{"title":"12　俠與自由","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-45\"><span><span><span>1</span><span>2</span></span></span>　<span>俠與自由</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>從西方思維來看，人為何想要從國家或親族系統游離出來，不難理解；譬如黃藥師支持楊過反禮教，西方人會認為理所當然，人不一定非要受到傳統社會的規範所約束，脫離國家、宗族系統，是為了追求自由，成為一個自由人。從這點可以反思一個問題：在金庸小說中，自由重要嗎？</p>\n\t\t\t<p>金庸小說其實很少探討自由，金庸筆下的俠士不以追求自由為人生目的，相對地，這些「俠」最突出之處非但不是追求自由，反而是如何選擇「拋卻自由」。舉例來說，郭靖為何成為大英雄？因為他有機會選擇自由，卻拘束在國家大義的道理之下，無論是黃蓉或華箏，都無法撼動他的抉擇。在攻破撒馬爾罕城、活捉完顏洪烈後，縱使郭靖想藉此退婚，跟黃蓉雙宿雙棲，但面對成吉思汗的屠城令，他還是以百姓安危為上，公眾之事仍是他的優先考慮。他最後選擇的都不是自由，有更重要的事凌駕在個人自由之上。這就是「俠」。</p>\n\t\t\t<p>俠士精神不崇尚自由，他們心中永遠都有公義，所以太史公筆下的游俠如郭解、朱家，他們的存在有其矛盾。他們雖然從國家、宗族系統中游離出來，但他們毫無自由。他們為了追求正義捨棄個人身分，而轉變為「俠」，成為亡命之徒。以正義為名，他們仍必須吸引一批追隨者；以正義為師，他們組織、凝聚起一股力量。</p>\n\t\t\t<p>換言之，離開了國家、宗族，「俠」進入到非國家、非宗族的另類組織裡。也就是說，「俠」從一個集體空間游離出去，活在另一個平行的集體空間。</p>\n\t\t\t<p>江湖幫派極其重要，幾乎每一個「俠」都有其師承來歷。即使像張無忌後來成為明教教主，金庸鋪陳他的身世時，仍然強調他源自武當派一脈。不過，金庸筆下仍有少數幾個俠以獨特方式闖蕩武林，譬如楊過，他重私情甚於公義，與郭靖迥異。此外，我為什麼特別強調《鹿鼎記》的文學成就？因為金庸終於寫出了一個追求自由的俠，韋小寶完全置身於國家大義之外。《笑傲江湖》的令狐冲則是另一個典型。</p>\n\t\t\t<p>楊過還不算是個自由人，他仍然有古墓派、小龍女等羈絆。武林是以集體邏輯為架構，俠客行走於江湖，基本上是被劃入集體範疇裡，是被制約的。從最上一層來看，譬如漢人與外族之分，如金輪法王、尼摩星等都是非我族類，不可能得到中原人的認同；又如紅花會與天地會的使命，與漢人集體的認同密切相關。往下一個層次，就是不同的武林派別，每一個門派都以自身的集體性為理所當然，門下子弟各自遵循著自家法度。門派有所謂「陣法」，例如全真教的「天罡北斗陣」、恆山派的「恆山劍陣」，要以集體力量保護自家門派。</p>\n\t\t\t<p>綜上所述，武俠小說一直存在著一個大主題，一旦意識到這個大主題，讀者自然而然就會進入到武俠情境中，那就是滅幫或滅派的危機。例如《神鵰俠侶》〈內憂外患〉那一回，寫到全真五子一起閉關，就是為了防範古墓派來尋仇：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>原來那日大勝關英雄大會，小龍女與楊過出手氣走金輪法王師徒，武功精絕，郝大通、孫不二和尹趙二道都親眼得見。何況楊過在郭靖書房之中，手不動、足不抬，便制得趙志敬狼狽不堪，後來小龍女只一招之間，便將趙志敬震得重傷。他二人使何手法，孫不二雖在近旁，竟然便看不明白，倒似全真派的武功在古墓派手下全然不堪一擊，思之實足心驚。後來又聽說小龍女和楊過雙劍合璧，將金輪法王殺得大敗虧輸，全真派上下更是大為震動。全真諸子想起郝大通失手傷了孫婆婆的性命，李莫愁、小龍女、楊過等人總有一日會來終南山尋仇。……古墓派上山尋仇之時，倘若全真五子尚在人間，還可抵擋得一陣，但如小龍女等十年後再來，那時號稱天下武學正宗的全真派非一敗塗地不可。因此五人決定閉關靜修，要鑽研一門厲害武功出來和古墓派相抗，是以趕召尹志平回山接任掌教。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這段小說情節合情合理，全真派一定要保全自身團體的利益及存續，這是江湖幫派的普遍現象。各門各派都有其尊嚴，不容師門受到其他幫派的欺凌羞辱，誰做出「有辱師門」之事，便是犯了武林大忌。</p>\n\t\t\t<p>金庸筆下描繪的江湖組織大致依循著傳統價值觀，當然是不自由的。此外，金庸小說也會涉及種族意識。作為中原漢人，必然與邊境民族，尤其是入侵外族在民族認同上有所衝突。這種衝突完全不是個人所能選擇的，你生來是漢人，就必須站在漢人的立場上思考。《天龍八部》中蕭峯的英雄悲劇，就是最深痛的例證。</p>\n\t\t\t<p>這種民族認同上的歸屬感，及至金庸最後一部小說《鹿鼎記》，才有了截然不同的發展。同樣是反清復明，《書劍恩仇錄》中的陳家洛作為紅花會掌舵，始終不忘恢復漢人大統；但到了《鹿鼎記》中的韋小寶，他雖然是天地會中人，卻遊走在對立的朝野兩方，只要百姓有好日子過，漢人滿人誰當家都好。</p>\n\t\t\t<p>在我看來，武俠小說或許很難找到一個明確的起點，但明確終結於金庸的《鹿鼎記》。一個原因是，金庸寫完了《鹿鼎記》，武俠小說傳統的邊界幾乎都被他探索過了；另一個原因，則是傳統的「俠」文化難以定義在韋小寶身上，也走到了一個曖昧的終點。</p>\n\t\t</div>"},{"title":"13　《俠隱》《城邦暴力團》：另一個武俠的黃昏末日","content":"<div>\n\t\t\t<p>　</p>\n\t\t\t<h2 id=\"_idParaDest-46\"><span><span><span>1</span><span>3</span></span></span>　<span>《俠隱》《城邦暴力團》：另一個武俠的黃昏末日</span></h2>\n\t\t\t<p>　</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在金庸之後，依然有人持續創作武俠小說，其中也不乏佳作，只是再難超越。不過，有兩部作品特別值得提及，就是張大春的《城邦暴力團》及張北海的《俠隱》。這兩部小說雖然從各方面來看都不太一樣，但兩位作者共同都有一種清楚的意識，認知從文學史的角度看，武俠小說已經結束了。</p>\n\t\t\t<p>二<span>○</span>一八年，姜文改編張北海《俠隱》所拍的電影《邪不壓正》上映，小說《俠隱》的知名度隨之提升。只是姜文拍的電影和張北海寫的小說，不是同一回事。</p>\n\t\t\t<p>書名叫做《俠隱》，這是來自當時北京小報上，有一個寫打油詩叫做「將近酒仙」的人，給小說裡的李天然取的一個外號。不過稍微認真想一下，就知道這個外號取得不對勁。因為按照中文邏輯，稱呼一個人應該叫他「隱俠」，而不會叫「俠隱」。顯然張北海選擇「俠隱」二字另有寓意。</p>\n\t\t\t<p>說白了，「俠隱」就是俠不見了。俠沒有了，因為武俠沒有了。過去的武俠小說，「俠」與「武」──也就是過人的武功──是一而二、二而一，密不可分的。</p>\n\t\t\t<p>沒有武功還能叫做「俠」嗎？金庸在《鹿鼎記》裡大膽挑釁了武俠的基本定義，寫出了一個沒有真功夫、專門靠著滿口胡言唬人來闖蕩江湖的韋小寶，讓韋小寶成為武俠小說的主角。這是金庸了不起的成就，在武俠小說史上可說空前絕後。不過即使如此，我的很多朋友還是不太能夠接受韋小寶能被稱為「俠」吧，畢竟這部小說裡其他的角色大部分都是身懷武技的。</p>\n\t\t\t<p>張北海在《俠隱》中才當真寫出了武俠的黃昏末日，小說裡幾乎所有身懷武功的人，最後都不是死於武藝之下。故事的核心是太行山莊滅門血案，但小說一直到快一百頁，才以李天然對師叔追憶的方式呈現。李天然的回憶是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>第一槍打中了師父，就在我對桌，子彈穿進他的額頭，眼睛上邊，一槍就死了，緊接著十來槍，從我後邊窗戶那兒打了過來，我們沒人來得及起身，師母倒了，丹心倒了，丹青也倒了，我也倒了……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>一家五口沒有人來得及起身，也就沒有人來得及使上武功。這樣的仇究竟該怎麼報呢？到了最後時刻來臨前，藍青峰說了重話，告誡李天然：「你是想證明你比你大師兄厲害，武功比他高，還是想把他給幹掉，給你師父一家報仇？」這兩者關鍵的差別就在於，到底用槍還是不用槍。李天然不願承諾要用槍，藍青峰就提醒他：「你忘了你師父一家是怎麼給打死的？現在不用那把『四五』，那你可真是白在美國學了那手好槍。」</p>\n\t\t\t<p>是啊，死去的前太行派掌門和倖存下來報仇的現任太行派掌門，兩人的差別就是一個不會、可能也不屑用槍，而另一個就算仍然不屑用槍、卻還是不能不精通槍法，才會有這麼一段報仇戲，還要面對到底要不要用槍，應該用什麼方法來取仇人性命的問題。蓋世武功，抵不過飛來射穿額頭的子彈，就這麼現實，就這麼殘酷。</p>\n\t\t\t<p>俠之所以不見了，張北海的《俠隱》還寫出了另外一個理由，那就是俠賴以活動的江湖、武林也消失了，這不是任何一個俠能抵擋的。</p>\n\t\t\t<p>武俠小說最迷人的地方，就在於寫出了和現實世界平行存在的江湖、武林，在那裡，人間事的輕重緩急有了不同的標準。最重、最急的，在集體層次，莫過於武林存亡，或是盟主寶座歸屬問題；在個體層次，則莫過於師門興衰、決鬥勝負，以及有恩報恩、有仇報仇。</p>\n\t\t\t<p>《俠隱》裡的故事主軸，順著原來武俠小說的慣例，有太行派的滅門事件，引發唯一的倖存者李天然要從美國回到當時的北平尋仇報復。而小說最先出現和報仇有關的是一張圓臉，一個日本人的圓臉。自此開始，《俠隱》就不再是單純的武俠小說了，它變成了歷史小說，牽扯出一九三六年老北平的複雜局勢。</p>\n\t\t\t<p>這段歷史，正是過去現代史教育中說得最含混不清的一段。簡言之，就是一九三一年日本佔領東北之後，持續對華北展開軟硬兼施的侵略，除了派軍隊不斷南下迫近北平外，同時扶持了各種勢力與國民政府對抗，積極地在北平佈置軍事情報人員。</p>\n\t\t\t<p>這個時候，南京政府明顯採取對日妥協的態度。一方面，由張自忠帶領二十九軍防衛北平；另一方面，由宋哲元和日本人合作，實質上成立一個共同政府來管理華北。蔣介石選擇將華北放在日本人立即佔領的威脅之下，而將主要的軍力用於「剿匪」。</p>\n\t\t\t<p>李天然的仇人之一，是和關東軍有關係的日本人，另一個仇人則是原來的同門大師兄朱潛龍。滅門案發生六年之後，朱潛龍已經成為北平員警便衣組組長，隨著日軍進城，接著又升職為偵緝隊隊長。</p>\n\t\t\t<p>別說要報仇，光是要找到仇人，李天然就非得涉入這異常複雜的情勢不可，家恨與國仇纏捲在一起，還纏捲得越來越緊。到最後，對朱潛龍的報仇，變成了同時替國民政府暗殺漢奸的行動，得到了和二十九軍與藍衣社有關係的藍青峰的協助。李天然成了一個不情不願的歷史角色，想要將自己的行動保持為單純的報仇都不可能，甚至失去了自己選擇報仇地點和方式的自由。</p>\n\t\t\t<p>這當然就不是傳統觀念的武俠了，而是什麼呢？是現實。國家、政府、軍隊，更不要說方方面面的社會力量，在此時的北平交錯混雜，彼此干擾，形成教人無所逃於其外的現實。這就是現代生活，不像傳統的江湖，有那麼多的空隙可以讓人居停轉走。如此高密度的現代現實，還能想像江湖、武林存在的可能嗎？張北海感慨無奈，搖搖頭像是說：不可能了，最後的江湖、武林要消失了，俠當然也就只能跟著消失了。</p>\n\t\t\t<p>貫穿張北海小說《俠隱》的關鍵字，就是「最後」二字。張北海刻意將小說的時代背景放在一九三六到一九三七年，寫出了最後的北平。雖然嚴格說「北平」這個名字還繼續存在，直到一九四九年才由新建立的中華人民共和國取消而改回「北京」；不過對真正的老北平人來說，一九三七年爆發「盧溝橋事變」，日本軍進城後，北平就不再是北平了。</p>\n\t\t\t<p>民國時期的北平，和之前及之後的北京，最大的差別就在於──這座城市是新舊巧妙的雜陳混合。它不單只是一個過渡，所有舊的歷史性元素都還生機盎然地活著，而且和所有新的外來元素毫不扞格地並存，創造了既熱鬧又舒適的城市日常社會。</p>\n\t\t\t<p>沒有什麼比小說《俠隱》一開場出現的馬凱醫生，更足以代表這樣的北平了。馬凱醫生是北平特有的那一類外國人，上海、天津都少見：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他在洛杉磯加州大學醫學院剛實習完畢，就和新婚夫人依麗莎白來到北京，剛好趕上中華民國成立。後來凡是有生人問他來北京多久了，他就微微一笑：「民國幾年，我就來了幾年。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>算算這是民國二十五年，這位馬凱醫生在北京（北平）過了四分之一世紀的時間了。他說的是京腔，住的是四合院，對中國事物的瞭解讓他足以介入江湖；但同時，他開著黑福特回家，回到家之後，習慣喝上一杯威士卡。老北平就是這樣能夠讓馬凱醫生安居，忘掉了自己從美國來的地方。</p>\n\t\t\t<p>但日本人進城之後，這個條件徹底消失了。即使經歷了八年抗戰，一九四五年國民政府還都，那個曾經既傳統又現代、既中又洋的北平也回不來了。更何況沒有多久，內戰爆發，北平又染上了前線的緊張氣氛，要如何恢復昔日安定的日常呢？</p>\n\t\t\t<p>張北海動用自己年少的記憶，加上許多的搜羅考證，他要趁一切都來不及之前，把老北平給留下來。在這方面，《俠隱》實質上是一本生活史，裡面充滿了日常細節，可以穿越時空，神奇地凝視那一個歷史的片段。</p>\n\t\t\t<p>王德威教授為這本小說寫過一篇文章〈夢回北京〉，他這樣說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>細心的讀者不難發現，張的主角回到北京，由秋初到盛夏，度過四時節令，遍歷衣食住行的細節。為了營造敘事的寫實氣氛，張顯然參照了大量資料，自地圖至小報畫報、掌故方志，巨細無遺。他的角色特別能逛街走路。他們穿街入巷，乾麵胡同、煙袋胡同、前拐胡同、西總布胡同、月牙兒胡同、王駙馬胡同、東單、西四、王府井、哈德門、廠甸、前門……所到之處，舊京風味，無不排撻而來。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小說結尾的最後一章，李天然醒來，聽見夏蟬尖尖在叫，起床喝了一杯冰橘汁。這是一九三七年改變中國歷史的盛夏。回頭查看小說開頭第一章，李天然坐上馬凱接他的黑福特車，是寶石藍的九月天。這當然是張北海的仔細設計，故意讓小說發生的所有情節分散在一年之中。</p>\n\t\t\t<p>十月十五日，李天然去了圓明園廢墟，一個月後下雨的深秋，他和師叔燒掉了一座倉庫。再一個月發生西安事變的時候，他偷走了狂妄日本人的武士刀。冬至時他發現了東娘，臘八那一天他對巧紅告白了他的身世。過完年，春分日，他借著還刀，廢了日本人的手臂。然後五月節，師叔在屋頂中了槍。</p>\n\t\t\t<p>為什麼要將事件發生的時間寫得這麼精確？因為張北海的重點不只在寫情節，更在利用這些情節寫老北平的四季，每個季節都有它相應的景色、節氣、儀式，還有相應的活動與實物。所以李天然回到中國為師父報仇的故事，非得剛剛好花上一年的時間不可。《俠隱》在敘事的過程中，順便給了我們老北平的四季實錄。</p>\n\t\t\t<p>藉著《俠隱》，張北海也寫了最後的武俠小說。當然不是說《俠隱》之後，就沒有人可以再寫武俠小說，而是張北海探索了武俠小說成立的條件，明確地主張隨著老北平的消失，「武俠」這回事也就沒有了可以著落的時代背景。現代科技迫使武功無效，而現代社會的生活組構，又使得江湖、武林無法在現實之外存在，俠也就非隱不可，不會在之後的時空出現了。</p>\n\t\t\t<p>極有意思的是，幾乎就在張北海寫《俠隱》的同時，張大春也在寫他自己最後的武俠小說《城邦暴力團》。兩個人並沒有商量討論，雖然他們兩人認識多年，他們都選擇了用武俠小說來探索「武俠」如何結束。</p>\n\t\t\t<p>《城邦暴力團》將武俠寫到了二十世紀八<span>○</span>年代的臺灣，也就是將武俠小說終結的這個時間點，設定得比《俠隱》晚了近半個世紀。從這個角度看，張大春也就提出了《俠隱》之後「武俠」如何可能的觀念，無形中回應了張北海提出的書寫挑戰。《城邦暴力團》是一部大小說，有興趣的讀者可以對照著讀《俠隱》和《城邦暴力團》。</p>\n\t\t\t<p>抵擋不了子彈的武功，對於最後即將隱去的俠來說，還有什麼用處呢？在小說《俠隱》中，李天然的武功最後都用在對付日本人了，也就是說，至少似乎有著維護民族尊嚴的作用。一直到武俠徹底消失之前，中國人的武功始終沒有讓日本人追上。</p>\n\t\t\t<p>武功另一項更普遍的用處，是讓李天然動不動就跳上屋頂，不受平面空間的限制，在老北平愛去哪裡就去哪裡。王德威說，這部小說裡的人物特別喜歡穿街走巷，而且他們常常不是真的穿、真的走，而是跳、飛、躍，從不同的角度看這座即將消失的老北平城。</p>\n\t\t\t<p>那樣躍著、飛著、跳著，從這個屋頂輕鬆到那個屋頂，從這個院落進到那個院落的，已經不是李天然了，而是憑著記憶與夢回到了老北平、從記憶與夢的高度俯瞰老北平的張北海。</p>\n\t\t</div>"},{"title":"版權頁","content":"<div id=\"_idParaDest-47\">\n\t\t\t<h6>金庸的武林<span>2</span></h6>\n\t\t\t<h4>流轉江湖</h4>\n\t\t\t<h5>金庸奇俠的異想世界</h5>\n\t\t\t<p>　</p>\n\t\t\t<p>作者／楊照</p>\n\t\t\t<p>封面繪圖／李志清</p>\n\t\t\t<p>　</p>\n\t\t\t<p>副總編輯／鄭祥琳</p>\n\t\t\t<p>特約校閱／江秉憲</p>\n\t\t\t<p>美術設計／張巖</p>\n\t\t\t<p>排版／連紫吟、曹任華</p>\n\t\t\t<p>行銷企劃／廖宏霖</p>\n\t\t\t<p>出版一部總編輯暨總監／王明雪</p>\n\t\t\t<p>　</p>\n\t\t\t<p>發行人／王榮文</p>\n\t\t\t<p>出版發行／遠流出版事業股份有限公司</p>\n\t\t\t<p>地址／104005 臺北市中山北路一段11號13樓</p>\n\t\t\t<p>電話／(02)2571-0297　傳真／(02)2571-0197　郵撥／0189456-1</p>\n\t\t\t<p>著作權顧問／蕭雄淋律師</p>\n\t\t\t<p>　</p>\n\t\t\t<p>2024年5月10日 初版一刷</p>\n\t\t\t<p>電子書出版日期：2024年6月</p>\n\t\t\t<p>電子書格式：ePub</p>\n\t\t\t<p>有著作權．侵害必究</p>\n\t\t\t<p>ISBN：978-626-361-741-4 (EPUB)_V1</p>\n\t\t\t<p>　</p>\n\t\t\t<p><a href=\"http://www.ylib.com\"></a> <a href=\"http://www.ylib.com\">http://www.ylib.com</a> E-mail: <a>ylib@ylib.com</a></p>\n\t\t\t<p>金庸茶館粉絲團 <a href=\"https://www.facebook.com/jinyongteahouse\">https://www.facebook.com/jinyongteahouse</a></p>\n\t\t</div>"}];
const isHeader = [true, true, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, true, false, false, true, false, false, true, false, false, false, false, false, true, false, false, false, false, false, false, false, false, false, false, false, false, false, true];
let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  chapters.forEach(function(ch, i) {
    var btn = document.createElement('button');
    btn.className = 'chapter-btn' + (isHeader[i] ? ' is-header' : '');
    btn.textContent = ch.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});

initChapterList();
showChapter(0);

</script>
