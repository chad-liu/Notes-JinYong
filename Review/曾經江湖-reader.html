<script>

const chapters = [{"title":"作者簡介","content":"<div id=\"_idParaDest-2\">\n\t\t\t<p><span>作者／</span></p>\n\t\t\t<h3>楊照</h3>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer000\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<p>本名李明駿，1963年生，臺灣大學歷史系畢業，曾為哈佛大學史學博士候選人。</p>\n\t\t\t<p>擅長將繁複的概念與厚重的知識，化為淺顯易懂的故事，寫作經常旁徵博引，在學院經典與新聞掌故間左右逢源，字裡行間洋溢人文精神，並流露其文學情懷。近年來累積大量評論文字，以公共態度探討公共議題，樹立公共知識份子的形象與標竿。</p>\n\t\t\t<p> 曾任《明日報》總主筆、遠流出版公司編輯部製作總監、臺北藝術大學兼任講師、《新新聞》週報總編輯、總主筆、副社長等職；現為「新匯流基金會」董事長， BRAVO FM91.3電台「閱讀音樂」、臺北電台「楊照說書」節目主持人，並固定在「誠品講堂」、「敏隆講堂」、「趨勢講堂」及「藝集講堂」開設長期課程。著有長篇小說、中短篇小說集、散文、文學文化評論集、現代經典細讀等著作數十冊。</p>\n\t\t\t<p>　</p>\n\t\t\t<p><span>封面設計：張巖　封面繪圖：李志清</span></p>\n\t\t</div>"},{"title":"知音推薦","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-4\">知音推薦</h6>\n\t\t\t<p>詩，可以興，觀，群，怨，多識於鳥獸草木之名；讀金庸小說也可以的。年輕時，它甚至是我的交友寶典，辨識人格、性情，確認「理想型」男友的測驗題庫。重讀金庸，似乎隨時隨地，可從任一冊、任一段落開始。但是楊照的重讀金庸，是沿著著作的時間軸，有脈絡的，慢讀金庸。對於江湖新鮮人，這是一部極好的金庸導讀；而對於早已熟讀金庸者，更是一部可默默與之對話、切磋，不時擊節，啊，茅塞頓開！或很想要擊掌的知音之書。</p>\n\t\t\t<p>——作家 <span>宇文正</span></p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸百年，江湖再現。楊照新著重讀金庸武俠作品，不忘回首青少年時快速、隨意的亂翻書，此際更現身說法，逐章示範如何平心靜氣讀金庸——全面、系統、反思、比較式的細察慢讀。作者融會貫通文本分析，歷史地理，人物傳記，報業傳奇，影視改編，考據評論。在儼然構架、精妙文字中，全書再訪江湖武林，細說人情世故，辨析敘事譜系，探詢經典形成。在喧嘩巨變的時代，楊照招魂那位講故事的人，重整金庸筆下的山河歲月。</p>\n\t\t\t<p>——學者、美國羅格斯大學亞洲語言文化系 <span>宋偉杰</span></p>\n\t\t\t<p>　</p>\n\t\t\t<p>什麼叫俠？「群」、「我」之辨。</p>\n\t\t\t<p>那些為了自身武功、地位、名聲、財富而去騙、爭、搶、奪的人，不俠。</p>\n\t\t\t<p>蕭峯願以一人之死換取眾人之生，這般決斷叫「俠」。</p>\n\t\t\t<p>郭靖畢竟為堅守襄陽而死，這回終局叫「俠」。</p>\n\t\t\t<p>張無忌為調解明教與各派舊隙，將殺親之仇撇到一旁，這個判別叫「俠」。</p>\n\t\t\t<p>令狐冲對尼姑避之唯恐不及，卻能在困難中扛起恆山掌門，這樣挺身叫「俠」。</p>\n\t\t\t<p>韋小寶明辨小玄子能行王道，能為群體謀福，這片認知叫「俠」。</p>\n\t\t\t<p>謝遜、鳩摩智、金輪法王終究覺醒悔改，這場徹悟叫「俠」。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊照老師傳遞俠情，這套書寫叫「俠」。</p>\n\t\t\t<p>——相聲瓦舍創辦人 <span>馮翊綱</span></p>\n\t\t</div>"},{"title":"序言 重讀金庸的奇異旅程","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-5\"><span>序言</span></h6>\n\t\t\t<h1>重讀金庸的<br/>奇異旅程</h1>\n\t\t\t<p>金庸是好幾代人的共同記憶，雖然提到金庸，每個人心頭浮上的印象或畫面可能很不一樣。有人立即想到的是古墓裡睡在一根繩子上的小龍女，有人眼前出現了瘋瘋癲癲、左手和右手打架的周伯通，有人則為了喬峯和中原群豪飲酒絕交的氣概而情緒激動……</p>\n\t\t\t<p>有些人透過文字閱讀來認識金庸，可能有更多人是透過觀看影劇作品。如果是從影劇而來的經驗，又會牽涉到不同時代、不同地區的不同改編劇情、不同演員形象、不同武打表現方式……</p>\n\t\t\t<p>這些都是金庸，更準確地說，都是來自金庸所創作的武俠小說。對大部分讀者來說，金庸的主要身分是武俠小說作者，但必須特別強調的——金庸不是一般的武俠小說家。</p>\n\t\t\t<p>在金庸之前，武俠小說早已存在。武俠小說是帶有高度娛樂性質的「類型小說」，吸引了龐大的寫作隊伍投身其中，寫出了數量驚人的眾多作品。金庸寫武俠小說只有不到二十年的時間，到他寫完《鹿鼎記》封筆後，武俠小說這種類型創作也還在，又出現了許多作品。然而，在金庸之前的武俠小說，大部分沒有讀者了，作者和其作品幾乎被遺忘了；在金庸之後，照理說那些離我們更近的武俠小說，也紛紛從大眾的注目眼光中消失了，只有金庸還在。</p>\n\t\t\t<p>小學時，我就開始在報紙副刊上讀連載的武俠小說，中學有了一點零用錢，就到租書店搬更多武俠小說來讀，相對地，要更晚些，上了高中之後，才有機會讀到金庸的作品。那時候，我甚至不知道那些小說是金庸寫的。戒嚴時期的台灣，金庸被歸為「左派報人」、「左派文人」，他寫的書要被查禁，於是讀到的都是盜版書，封面上隨便放了別的作者名字，用以規避檢查。</p>\n\t\t\t<p>當時我已讀過不少的武俠小說，立即感受到這幾部作品很不一樣。那時候說不出、也說不清到底哪裡不一樣，正因為太熟悉武俠小說的表現套路，一下子就對不同於套路的金庸小說寫法感到著迷。</p>\n\t\t\t<p>這個衝擊印象在我心中擱放了將近四十年，一直到二○一八年，那一年金庸去世，掀起了一陣討論風潮。我相信許多人都受到召喚，不只重溫記憶，還會想要重讀金庸的作品。我也有一股衝動想要重讀，而且我讓這份衝動實現了，不只如此，我還懷抱著強烈的問題意識，開展了這次的重讀。</p>\n\t\t\t<p>我的問題是：第一，過去我對金庸的著迷，有多少是來自年少時的環境與閱讀經驗？這點令人忐忑不安，我想要認真檢視一下，經過多年閱讀小說、詮釋小說，甚至評論小說的視野累積，對於小說寫作的看法必然比以前成熟許多，我還會覺得金庸小說是好小說，具有擺脫武俠類型的開創性，甚至恆久價值嗎？還有第二，如果金庸真的不一樣，又是如何不一樣？</p>\n\t\t\t<p>從一九七二年之後，四十多年的時間裡，金庸沒有再寫過任何一部武俠小說，然而二○一八年他去世時，竟然在華文世界形成了討論熱度最高的話題現象。我不得不打心底問：為什麼金庸沒有被遺忘？為什麼他在五、六十年前創作的小說，到今天還如此火熱？更重要的，金庸小說真的經得起時代變遷帶來的考驗，繼續存在下去嗎？</p>\n\t\t\t<p>容我先簡單地總結這次重讀金庸的體會：金庸的武俠小說真的不一樣，真的寫得好，不只是好看，而且經得起仔細推敲，是有基底、有厚度、有設計、有技巧的好。之所以能得到這樣的結論，那是因為我有意識地採取了不同於以往的閱讀方式。</p>\n\t\t\t<p>＊</p>\n\t\t\t<p>以前讀金庸，逃不過三種態度，那就是「少」、「快」、「亂」，而這三者又彼此連動，互相影響。最核心的因素是「少」，年少的「少」。我在年紀很小的時候就接觸、著迷於武俠小說，然後又遇到了金庸的作品。那時候，包括金庸作品在內的所有武俠小說，都被當作消閒書，不只是課外讀物，還是觸犯學校規定、不被師長允許的「毒物」。在這種情況下，不可能好好端坐著讀，經常需要躲躲藏藏。書能到手的管道也不穩定，環境充滿了禁制，於是拿到一本算一本，在被發現、沒收之前，能讀多少算多少。</p>\n\t\t\t<p>在同學、朋友手上流傳的小說，或是在租書店裡按日計費租來的小說，也沒得計較，不可能有什麼閱讀計畫，想著可以先讀哪本、後讀哪本。一部小說往往分成好多冊，都不見得能夠從第一冊讀到最後一冊，拿到哪冊就看哪冊吧！</p>\n\t\t\t<p>那真是「亂」，而且是亂到荒唐的地步。像是金庸的「射鵰三部曲」——《射鵰英雄傳》、《神鵰俠侶》和《倚天屠龍記》，在我們的閱讀經驗中，很多人非但不是照這個次序讀的，甚至從來沒弄清楚過角色和情節的前後關連。</p>\n\t\t\t<p>「少」、「快」、「亂」的閱讀方式，不單是我自己有過的經驗，毋寧是武俠小說流行時代的共同印記。離開了這樣的因素，我們會從金庸小說裡讀到什麼？</p>\n\t\t\t<p>這一次，我刻意逆反原本的習慣，盡量放掉過去的印象，以「老」——帶著世故認知和對小說的純熟理解——的態度，來重讀金庸。從前看得「快」，這次反而有意放「慢」速度，不只仔細地讀，同時帶著分析思考的強烈動機來讀。以往「亂」讀一氣，得到某種恣意的快感，這次卻要有系統地讀。最簡單的系統，就是按照金庸小說創作的先後順序讀下來，從一九五六年完成的《書劍恩仇錄》開始，一路讀到最後的《鹿鼎記》。</p>\n\t\t\t<p>與「亂」相反的，還有在事先蒐羅了許多相關資料，關於金庸其人、他的寫作經歷、他所處的環境，以及在他之前就已經存在的武俠小說系譜，乃至他停筆之後，武俠小說的後續變化。將金庸的十四部小說放入這個脈絡中，予以對應查考，以求讀出更立體、更豐富的內涵。</p>\n\t\t\t<p>世故、仔細、有系統地將金庸小說完整地讀過一遍，先告訴大家我最強烈、最深刻的感受——這趟閱讀旅程太有收穫了，金庸小說比我原先認定、想像的還更了不起。</p>\n\t\t\t<p>＊</p>\n\t\t\t<p>金庸在十七年的時間裡，創作出八百多萬字的武俠小說，光是量就很驚人了。如此快速寫作完成的過程中，竟然還能不斷突破，創造了自己之前作品寫不出的新技巧、新層次、新境界、新意義。</p>\n\t\t\t<p>例如在相對篇幅較小的作品《雪山飛狐》中，金庸動用了類似舞台劇的技法，讓一個個角色次第說話，他們的對話圍繞著一個綽號叫「雪山飛狐」的人，講述他的身世、猜測他前來尋釁的動機，一起等待著他的出現。這裡的戲劇效果是眾聲相應，彼此補充又互相更正，在講述、討論、猜測乃至爭辯之後，「雪山飛狐」胡斐才上場。胡斐當然是主角，只是他上場沒多久，小說就結束了。</p>\n\t\t\t<p>我們不只沒有在其他武俠小說中看過這種寫法，也不曾在金庸自己以往的作品中看過類似的形式。</p>\n\t\t\t<p>又例如，金庸寫了那麼多讓人印象深刻的女性角色，黃蓉那麼嬌巧、小龍女那麼癡、周芷若那麼有心機。可是對於周芷若的心機，讀者不會因此討厭她，而是能夠理解她、甚至同情她。金庸小說裡的女性角色各有各的個性，各有各的千迴百轉的感情與心思。就是靠著寫出這些不一樣的女角，原本以男性為主要閱讀對象的武俠小說，才能爭取到大量的女性讀者。</p>\n\t\t\t<p>更值得注意與敬佩的，不論如何突破、創新，金庸總有辦法讓他的小說抓住讀者的胃口，讓讀者喜愛。過去，我們在「快讀」中得到巨大的娛樂消遣；現在，我可以負責任地向大家保證：不妨「慢讀」金庸，當作文學作品來讀，也能找到其中獨特的、原創的價值。</p>\n\t\t\t<p>從前的武俠小說慣常以連載方式來發表與創作，一部大長篇故事每天只寫一小段，天天寫，一段一段連接起來，可能要一兩年才寫得完。邊寫邊連載的過程中，很多作者照顧不到讓故事情節前後統一，更不必提要如何設計、推進小說架構了。可是金庸的許多作品卻呈現了井然的結構，讓你不得不相信，在動筆之前，金庸已經將未來兩年內要寫的內容，都想得清清楚楚了，然後以近乎不可思議的耐心與毅力，執行、實現那份設計藍圖。</p>\n\t\t\t<p>《倚天屠龍記》當然是大長篇，在結構上明明白白地分為前、後半部。前半部以金毛獅王謝遜奪取屠龍刀為軸線，寫到張無忌在冰火島出生，再到張無忌隨父母回武當。從結構角度看，漫長的前半部是一步一步、小心緊密地鋪陳，幾乎沒有浪費任何事件，也沒有矛盾之處，全都導引向「六大派圍攻光明頂」，合理地讓中原六大門派聯合起來，又合理地讓張無忌一個人代表明教，對抗並戰勝了六大門派。</p>\n\t\t\t<p>到了下半部，張無忌已經是明教教主，也練就了絕世神功，小說還能寫什麼呢？於是金庸轉換了重點，讓趙敏上場，主題變成了張無忌如何完成他的情感教育。他要學會什麼是人情、什麼是世故，這是武功蓋世的張無忌必須面對的人生考驗。</p>\n\t\t\t<p>再進一步，如果將「射鵰三部曲」連貫起來，從大架構上看，某種主題就會浮現出來，那就是：何謂「正邪」？「正」與「邪」究竟要以什麼標準來劃分？一般的標準真的能說服我們嗎？其中碰觸到社會評斷機制，展開了關於正義觀念的堅實討論。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在這套書裡，我將依照金庸的創作順序，為金庸十四部小說做逐一評析，讓大家明瞭：金庸小說為何經得起文學方法的探究，以及金庸龐大且驚人的創造力，是如何落實在他的武俠作品中。藉由這種方式，我們或許可以體會，為何讀過金庸小說之後，很難再從其他的武俠作品中得到滿足？以及，為什麼金庸寫完《鹿鼎記》已過了五十年，卻一直沒有見到能超越金庸、超越《鹿鼎記》的其他武俠作品？</p>\n\t\t\t<p>讓我們好好地重新認識金庸和他的武俠小說。</p>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer002\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"第一章 金庸 為武俠小說而生的人","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-6\"><span>第一章</span></h6>\n\t\t\t<h1>金庸</h1>\n\t\t\t<h4>為武俠小說而生的人</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer003\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 少年金庸，戰爭中的求學","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-7\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>少年金庸，<br/>戰爭中的求學</h1>\n\t\t\t<p>金庸小說作品生成的歷程，必須從他的生平來理解。金庸一九二四年出生於海寧查家，本名查良鏞。海寧查家是明清以來的望族，金庸在他的第一部武俠小說《書劍恩仇錄》裡，刻意透過陳家洛這個角色，書寫乾隆皇帝傳說中的身世，其目的就是為了突顯海寧查家的歷史地位。</p>\n\t\t\t<p>查良鏞生長於大地主世家，但到了他十三歲的時候，即一九三七年，日軍入侵江南。南京大屠殺之後，日軍再往南侵襲，從江蘇進入浙江。在嘉興讀書的查良鏞開始了流亡學生的生活，跟著學校逃亡期間，途經麗水、衢州，一路完成初中及高中學業。</p>\n\t\t\t<p>查良鏞的求學生涯頗為坎坷，就讀中學時曾被退學一次，大學時又被退學一次。他在流亡中學念書時，學校最重要、最權威的人物不是校長，而是訓育主任。在那樣的環境下，查良鏞寫了一篇諷刺、影射小說《愛麗絲漫遊記》。小說的靈感當然來自《愛麗絲夢遊仙境》（<span>Alice's Adventures in Wonderland</span>），但他描寫的是愛麗絲來到中國，造訪了自己就讀的流亡中學，遇到了一條眼鏡蛇。這條眼鏡蛇一直追著愛麗絲，愛麗絲走到哪裡，這隻眼鏡蛇就在她後頭追到哪裡。所有學生一看到這條眼鏡蛇，既害怕又厭惡，但無論怎麼逃跑，眼鏡蛇永遠在他們身後窮追不捨，跟在每一個學生後面，所有學生只能不斷詛咒、咒駡和尖叫。眼鏡蛇不但追著他們跑，還會說話，每當眼鏡蛇開口說話，開頭的公式都是：「如果……，你們就完蛋了。」每一句話都是威脅。</p>\n\t\t\t<p>這篇文章被發表在壁報上，立刻引來全校學生傳誦一時，所有人都曉得，那隻眼鏡蛇就是影射綽號叫做「如果先生」的訓育主任。正是因為這件震動全校的風波，查良鏞被退學了。不過這也是個預兆，透過這件事，金庸展現了他過人的文字能力和創作風格，由此來看，金庸後來的武俠小說創作，當然可能含有影射。</p>\n\t\t\t<p>查良鏞高中畢業之後，對日抗戰還未結束。十四歲之前，他在富裕的大地主家庭裡長大，十四歲之後成為流亡學生，家鄉也淪陷為戰區，這個人生巨大的轉變關鍵，在於一九三七年的日本侵華戰爭。因此，戰爭在查良鏞的心中，必然留下極為深刻的傷痕。他的母親在逃難途中生病，因為無法及時救治而過世。這段悲劇後來也反映在《書劍恩仇錄》裡——小說連載時，主角陳家洛母親的名字（徐慧祿）只和查良鏞母親的名字差一個字，雖然後來改寫了（改為徐潮生），但陳母仍然姓徐。這部小說，可說是查良鏞最具自傳性的武俠作品。</p>\n\t\t\t<p>那時候日本人還沒有辦法全面控制中國，但在淪陷區以內的地方，他不可能繼續念大學，於是高中畢業後，他決定和幾個同學結伴穿越淪陷區，一路途經江西、贛南、湘西，到四川大後方去。穿越淪陷區，讓他真正看清了戰爭的本質。當時他們徒步逃亡的路線與日軍進軍湖南的路線相平行，中間只差幾公里的距離，沿路堆滿了屍體。換言之，他們一行人隨時有可能遭遇日軍，性命堪憂。</p>\n\t\t\t<p>親眼看見過戰爭的殘忍及傷亡，經歷過生死別離的交界後，查良鏞到了重慶，而後考上了「西南聯大」外文系。報考外文系是因為他已經立定志向，將來想成為外交官。但很可惜，他未能前往「西南聯大」的所在地昆明，被迫留在了重慶，與夢想擦肩而過，轉而去念有學費補助的「中央政治學校」。「中央政治學校」當時的校長是陳果夫，查良鏞等於是進入了國民黨的核心幹部學校。</p>\n\t\t\t<p>一年半之後，查良鏞又被「中央政治學校」退學了。他自己從未說過其中的原委，只能參考他同學的兩種說法。</p>\n\t\t\t<p>此時已到了戰爭後期，日軍不斷地往西南逼近，整個東南亞包括緬甸、寮國和泰北都在日軍的控制下，滇緬公路也在日軍這次軍事行動中被截斷。日軍的策略是繞經東南亞進入中國西南部，企圖一舉攻佔重慶及四川盆地。戰況一度非常危急，所以才有「一寸山河一寸血，十萬青年十萬軍」的政策，號召青年從軍救國，尤其是尚在念書的青年。號召青年軍的口號一出來，國民黨就要求中央政治學校的學生必須起而響應，也就是說，這次的號召不是自願性質，而是強迫學生從軍。</p>\n\t\t\t<p>然而不是每一個學生都願意從軍，到後來，學校甚至規定每一系、每一班的從軍配額，造成了校園裡嚴重的分裂。學生們分為兩派：一批學生宣佈自願從軍，他們多是死忠的國民黨幹部；另一批學生沒有強烈的從軍意願，便成為從軍派學生的仇視對象。查良鏞屬於後者。按照他同學的回憶，本來查良鏞並不想惹是非，可是情勢所逼，學校默許國民黨的死忠學生幹部霸凌那些不願意從軍的學生。在這段過程中，查良鏞和這一群國民黨學生爆發了衝突，最後導致他被退學的結局。</p>\n\t\t\t<p>我們必須將退學事件放在心上，因為這段歷史陰影，很能說明金庸的性格特質以及他與政治之間的關連，也可以透過這件事去理解他與國民黨之間的關係。</p>\n\t\t\t<p>退學之後沒多久，幸而對日抗戰結束了。他返回家鄉，仍然念念不忘從事外交官的志業。當時他完全沒有門路，只好先去《東南日報》當記者，這是他接觸新聞行業的起點，而這個起點，對於查良鏞之所以成為金庸，再重要不過。</p>\n\t\t\t<p>小說家之外，金庸的另一個重要身分是報人。可以這麼說，金庸的武俠作品之所以生成，與編報、辦報有極為密切的關係。要理解金庸小說中的隱喻及其中的深意，我們就必須回到他創作武俠小說的背景。而香港新派武俠小說的誕生，亦是因應了香港報業的變化和發展。</p>\n\t\t</div>"},{"title":"02 風雲變幻，報業生涯的開端","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-8\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>風雲變幻，<br/>報業生涯的開端</h1>\n\t\t\t<p>抗戰結束後，查良鏞開始擔任《東南日報》的記者、編輯與撰稿人，後來他獲得前往上海《大公報》工作的機會。至今《大公報》仍是中國報業史上無法忽視的輝煌一頁。張季鸞所復刊的《大公報》地位特殊，首先這是知識分子辦報，其次張季鸞承襲、追隨了美國「新聞古典時代的第四權」，以堅決的信念復辦這份報紙，所提供的地位之高、待遇之好，吸引了當時不少有志從事新聞業的青年才俊。</p>\n\t\t\t<p>查良鏞得到報考《大公報》的機會，根據傳記資料，在一百零九人當中，他以第一名考取了《大公報》。此時的查良鏞雖然僅二十歲出頭，已然成為中國報業精英的一分子。到了一九四七年，國共內戰爆發，局勢詭譎，《大公報》內部做出了重要決策——成立香港《大公報》。香港《大公報》作為上海《大公報》的分社，當時報社已經規劃，萬一中國大陸時局發生變化，報社就必須從上海遷往香港。這個規劃來自《大公報》強調言論自由的理念，只有在自由的地方，《大公報》才能夠生存下去。那時查良鏞的另外兩位同事，一個準備結婚，另一個要參加考試，而他單身，又無其他掛念，所以就被派往香港分部。</p>\n\t\t\t<p>也因為這個際遇，查良鏞從未確切看到一九四九年之後，中國大陸的激烈變化。在一九四九年的轉捩點上，他不在國共鬥爭的歷史現場，沒有被迫要選邊站——選擇國民黨或共產黨，而是可以保持作為《大公報》新聞精英分子的立場。後來，一九四九年十月一日中華人民共和國成立，查良鏞曾在一九五○年離開香港，動身前往北京。他想藉由這次機會圓夢，成為新政府的外交官。透過門路，他見到了中國外交界的重量級人物喬冠華——很長一段時間裡，喬冠華一直是周恩來身邊最重要的外交人才。</p>\n\t\t\t<p>可是當查良鏞與喬冠華會面，卻被直截了當地告知：你不可能進入中華人民共和國的外交部，你可以去外事服務處工作，但因為你的身分不正確，無法被信任，就很難進入外交體系。這是個非常大的打擊，突然之間，成為外交官的夢想被明確打破了，查良鏞才又返回香港。</p>\n\t\t\t<p>回到香港之後，巨大的悲劇竟爾向他襲來。他父親是個地主，在土改、階級鬥爭的過程中被槍殺身亡。不只是他父親，整個海寧查家也在新中國的政權下徹底崩解。查良鏞別無選擇，只能留在香港。沒有多久，他又親身經歷了香港激烈的時局變化。</p>\n\t\t\t<p>香港在二戰後被英國從日本手中又奪回，它的地理位置就在中國內地旁邊，無法逃離內地的牽制。像是在港英政府統治時期，水資源都要從北邊運來，這是港英政府後來租借九龍半島和新界的主要原因。在港英政府的統治下，香港變成了地位奇特的避風港。</p>\n\t\t\t<p>一九四九年，中國共產黨眼看就要席捲全中國，借由美國襄助，國民黨在臺灣站住了腳跟。國民黨撤退到臺灣後徹底改組，黨內成立了「改造委員會」，肅清國民黨內部威脅蔣介石權威的其他勢力，驅逐陳立夫兄弟，剿滅<span>C</span><span>C</span>派的勢力。眼看局勢仍然不穩定，原來屬於右派的國民黨大老及知識分子則選擇落腳香港，觀望情勢如何演變。大陸、臺灣的政局變化，促成了香港的特殊地位。為什麼留在香港？因為臺灣在當時看來朝不保夕，如果選擇在臺灣定居，難免要再逃難一次，不如留在英國殖民統治的香港安身立命。這群人被稱為「南來文人」，他們對於近代香港的變化，尤其是香港雜誌、報業，有非常重要的影響力。</p>\n\t\t\t<p>及至一九五○年六月韓戰爆發，美國勢力捲入其中，也確立了臺海兩岸對峙的局面。在美國的保護下，臺灣必須開始尋找新的意識形態，也就是民主自由。這當然不是當時法西斯本質的國民黨及蔣介石所嚮往的，但情勢所迫，想要獲得美國援助，就要鼓吹民主自由。</p>\n\t\t\t<p>同時，自國共內戰——尤其是長春圍城——之後，直到蔣介石下野，這段時期迸發了一股新的政治力量。這股政治力量後來稱為「第三勢力」、「中間勢力」，也就是既非國民黨，也非共產黨。國民黨在臺灣紮根，「第三勢力」則移往香港作為據點，此時港英政府、中國共產黨、國民黨、「第三勢力」在香港密切交集互動。整個一九五○年代，香港的複雜程度不可思議，各方勢力均攪和其中。</p>\n\t\t\t<p>這幾股力量中，港英政府仍然是實質統治者。那麼港英政府的態度是什麼呢？他們治理港人的基本政策是——排除港人接觸政治的權利。換言之，港英政府拒絕香港人參政。長期以來，這是香港人歷史的痛楚。直到一九九七年回歸確定之後，最後一任港督彭定康（Christopher Francis Patten）才開始推動讓港人參與政治、港人治港的政策。但一切都太遲了。</p>\n\t\t\t<p>港英政府統治近一百年，香港人一直承受著兩面性的治理政策：香港人有充分自由，尤其是擁有傳統生活的自由。即使到今天，香港都存在這種異質性：一方面，香港到處聳立著高樓大廈，從尖沙咀到銅鑼灣，都是一棟棟輝煌的金融中心；另一方面，從北角走到旺角，你看到的卻是最傳統的生活方式，包括茶樓、街道，以及狹小到不可能接待客人的房子。這是因為港英政府從未想過讓香港人成為英國公民，他們甚至希望香港可以保留中國傳統文化的特質，只要香港人不涉足政治。所以，一方面港英政府給予港人充分的自由生活，另一方面又嚴格禁止並切割港人與政治、政務的一切連結，幾乎只有英國人與高等華人（又稱太平紳士），才能夠在有限度的情況下參與港英政府的政務。</p>\n\t\t\t<p>由於港英政府的基本政策，衍生了各方勢力聚集香港的結果，但他們不可能在政治上較量，只能透過媒體的力量各展其道。因此，二十世紀五○年代，香港媒體界喧騰一時。政治立場上，親共的左派、親國民黨的右派，以及「第三勢力」都在這裡。從另一個角度看，部分在地的香港人，受到這個局勢的啟發，選擇了其文化及政治立場。還有部分「南來文人」，有的嚮往內地，有的心向臺灣。在這個混亂的局勢下，香港媒體的黃金時代誕生了。</p>\n\t\t</div>"},{"title":"03 從報人到報業老闆","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-9\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>從報人<br/>到報業老闆</h1>\n\t\t\t<p>在當時的香港媒體界，《大公報》是最核心的媒體之一。在新中國成立之後，《大公報》成為新中國欲在香港建立據點的首要目標。</p>\n\t\t\t<p>《大公報》在張季鸞等人復刊之後，一直遵從西方的言論自由、記者第四權的理念，但在很短時間內，它轉向為左派媒體。第三勢力的媒體受到左派勢力排擠，活躍的空間則越來越少。就在這個時候，美國支援臺灣，國民黨在香港也創辦了兩份報紙：《華僑日報》和《星島日報》。總的來說，在當時的局勢下，政治立場與意識形態的衝突，全部集中在報業的競爭上。</p>\n\t\t\t<p>《大公報》想要擴張它在香港的影響力，因而決定另辦《新晚報》。本來在《大公報》從事國際電訊編譯工作的金庸，也調入了《新晚報》，擔任副刊編輯。</p>\n\t\t\t<p>一九五四年一月，為了刺激讀者掏錢買報，時任總編輯的羅孚在《新晚報》頭版上預告「本報增刊武俠小說」，隔日便開始連載梁羽生的《龍虎鬥京華》，這也是梁羽生的第一部武俠作品。</p>\n\t\t\t<p>連載《龍虎鬥京華》證明了一件事，那就是刊登武俠小說確實有助於增加報紙銷量。《龍虎鬥京華》連載七個月完結後，《新晚報》接著刊登了梁羽生的第二部武俠小說《草莽龍蛇傳》，最後一期結束於一九五五年二月。也許是累了，也許是想嘗試其他的方向，《草莽龍蛇傳》之後，梁羽生沒有在《新晚報》續寫新的武俠小說。梁羽生不寫了，武俠小說卻不能停，這個時候，羅孚就從梁羽生身邊找到了查良鏞，要他接著寫武俠小說。</p>\n\t\t\t<p>因為是報社指派下來的任務，當時查良鏞沒得推辭，也沒有多想，就把自己名字的第三個字「鏞」拆開來，以「金庸」當作他的筆名。</p>\n\t\t\t<p>為什麼會找到本名查良鏞的金庸呢？不過就是因為他經常和報社同事梁羽生一起下棋，下棋的時候就「砍大山」，天南地北的聊。兩人都是武俠小說的愛好者，滿腹讀武俠小說的經驗，累積了各種的記憶。很顯然，兩個人閒聊的時候，一定會討論什麼樣的武俠小說是好的、什麼是不好的、好的小說應該怎麼寫……。可能在這樣的交談過程中，他們多多少少也在想，如果我自己來寫武俠小說會怎麼寫？所以梁羽生一動筆就能寫，金庸也一樣。</p>\n\t\t\t<p>一九五五年二月八日，《草莽龍蛇傳》連載完結，金庸和他的第一部武俠小說——《書劍恩仇錄》，在《新晚報》的「天方夜譚」版面登場。因為已經積累閱讀了很多的武俠小說，金庸的《書劍恩仇錄》一出手就有一定的水準，的確也對《新晚報》的銷量有著不小的貢獻。</p>\n\t\t\t<p>金庸開始寫武俠小說的來歷非常重要。正是為了賣報紙，才開啟了金庸自此之後欲罷不能的寫作生涯。也正因為如此，他的小說創作與報業經營、時局變化有著無法剝離的糾纏。</p>\n\t\t\t<p>《書劍恩仇錄》之後，金庸在武俠小說領域有了一些名氣，一九五六年，又受到《香港商報》的邀請，連載的第二部武俠小說《碧血劍》也很受歡迎。但一直到第三部作品《射鵰英雄傳》，金庸才算是真正開創出大名著的格局。</p>\n\t\t\t<p>一九五七年，金庸轉行，到長城影業公司當電影編劇，身價也水漲船高，薪水從一個月一百五十塊港幣，變成兩百塊港幣。而金庸的創作效率有多高呢？通常每二到三個月，他就可以完成一部電影劇本，不論劇本最後是否成功拍攝為電影，都能拿到三千塊港幣的酬勞，這當然是待遇非常優渥的工作，而且他還能親近心儀的電影明星夏夢。</p>\n\t\t\t<p>金庸的愛情觀一部分展現在他追逐夏夢的過程。後來他創辦《明報》，許多證據顯示，金庸當時或許多多少少在想：如果我手上能掌握一家報社，夏夢會待我更好。為什麼能如此斷定？因為自從金庸創辦了《明報》之後的前五年，除了連載自己的武俠小說外，報上刊登過最多的名字，應該就屬夏夢了。《明報》勤於報導夏夢的消息是顯而易見的，金庸甚至出資讓夏夢去加拿大旅遊，旅途中按時發送海外旅行遊記，那一度是《明報》最重要的新聞內容。</p>\n\t\t\t<p>長城影業的這一段歷程，對金庸來說舉足輕重。首先，他累積了一筆財富；其次，也遭遇了許多挫折，一部分是追逐夏夢的挫折，另一部分是他編寫的劇本拍攝為電影的機率很低，因此，金庸決定再度回到報業。</p>\n\t\t\t<p>但如果沒有為報社寫武俠小說的這段經驗，金庸很可能不會有勇氣去辦報。</p>\n\t\t\t<p>一九五七到一九五九年，在長城影業工作的同時，金庸還在《香港商報》繼續連載《射鵰英雄傳》，一共刊登了八百多期。最後一期刊登在一九五九年五月十九日這一天的《香港商報》上。甫一結束，隔天五月二十日，《明報》創刊，《神鵰俠侶》連載登場，這是金庸——查良鏞——自己創辦的報紙。</p>\n\t\t\t<p>可以這樣說，因著過去寫連載武俠小說，刺激報紙銷量的經驗，讓金庸確信，藉由武俠小說連載，可以在一定程度上支撐起報社。所以五月十九日《射鵰英雄傳》完結，五月二十日《明報》創刊，這是經過精心安排的。看完《射鵰英雄傳》，接下來讀者就要到《明報》看《神鵰俠侶》，利用這種方式無縫接軌，金庸打算將《香港商報》的讀者引流到他的《明報》。</p>\n\t\t\t<p>從此之後，開始了金庸創作生涯非常關鍵的歷程。瞭解這段經歷，對我們如何去讀他的武俠小說相當重要。</p>\n\t\t\t<p>《明報》剛創刊的時候，報社共有兩位合夥人，他及另一位朋友。金庸出資三萬港幣，朋友出資兩萬，但很快就賠掉這五萬，於是金庸又增資五萬，維持五萬資本。《明報》早期的資本，金庸總共投入八萬，另一位合夥人投資兩萬，一直維持這個比例的股權。所以《明報》不折不扣是屬於金庸的報紙，他在長城影業累積的薪資，讓他足以支撐《明報》的營運。</p>\n\t\t\t<p>草創時期的《明報》，採用的是香港小報（tabloid）的做法，以四開報的形式發行。第一面頭版主要刊登香港社會新聞，或是與香港有關的大事件，第二版刊登小說，第三版刊載金庸的《神鵰俠侶》，第四版是雜文副刊。有一項遺憾是，根據金庸自己的說法，《明報》創刊後三十天的報紙沒有被保存下來，他曾一度懸賞二十萬港幣收購任一張《明報》創刊第一到三十天的報紙，但仍一無所獲。</p>\n\t\t\t<p>創辦《明報》，金庸的生命進入了另一個階段。他瞭解《明報》與香港其他報紙不一樣的地方，就是能夠跨越黨派好惡，因為無論哪一個政治立場的讀者都喜歡閱讀武俠小說。</p>\n\t\t\t<p>剛開始的時候，《明報》一天連載《神鵰俠侶》約一千一百字，一個禮拜後增至一千二百字，再一個月之後，一天刊載一千六百字。在這個階段，的的確確就是靠連載武俠小說將報紙的報份、收入給撐起來的。不過，雖然副刊可以增加報紙銷量，但如果只是為了讀武俠小說而買報，讀者也很容易看完報紙隨手就扔了，或是另覓免費的讀報途徑。在這種情況下，金庸必須另闢蹊徑，讓大眾覺得購買這份報紙是有價值的。</p>\n\t\t\t<p>金庸於是做了一項重要的決定——在《明報》頭版開闢社評專欄。當然，編輯部基本只有金庸一人，社評也就只能由他來主筆。《明報》社評的內容極為嚴肅，這和金庸過往在《大公報》擔任國際新聞編譯的經歷有關，這其實也是金庸的專長，畢竟他曾經最想做的職業是外交官，對於外交事務、國際形勢一直保持著興趣，也有一定的看法和掌握。</p>\n\t\t\t<p>如今再回看《明報》此次的調整，可以覺察出許多深意。誤打誤撞下，金庸用這種方式開拓出《明報》的特色，打破了當時大報和小報的分野，讓《明報》成為香港報業中一份非常奇特的報紙。</p>\n\t\t\t<p>在那個時代，大報就是大報，小報就是小報。像《明報》這種小報，讀者主要是為了娛樂而看，所以副刊很重要；大報關心時事，時評政論即是重要的承載。金庸在《明報》上的社評，其觀察深度及嚴肅程度，經常還超過了當時左、右兩派的大報。結合查良鏞寫的社評，又有金庸的連載小說，讓市井小民雅俗共賞，《明報》算是有了不錯的生存之道。</p>\n\t\t\t<p>這個辦報策略雖然高明，《明報》仍經營得非常辛苦。很長一段時間，金庸每天傍晚四、五點鐘到辦公室，先寫第二天要見報的武俠小說，然後編報紙，快到午夜再靜下來寫社評。幸好金庸有寫武俠小說的本事，在經營報社的同時，孜孜不倦地極盡寫作能力。因此，金庸的武俠小說創作與他辦報的歷程，完全無法切割開來。</p>\n\t\t\t<p>在嚴肅社評與通俗小說這兩種格格不入的內容基礎上，《明報》從香港報業中開出一條路來，雖然形式上依然是小報，卻具備了大報的潛力和基本精神，預伏了後來的茁壯。</p>\n\t\t\t<p>《明報》剛起步的時候，基本立場是跨越左、中、右派，這個立場直到一九六二年五月的難民潮之後才有了轉變。《明報》轉而成為香港大報，政治立場也變得鮮明，敢於挑戰港英政府的權威。</p>\n\t\t</div>"},{"title":"04 無可避免的時代投射","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-10\"><span>0</span><span>4</span></h6>\n\t\t\t<h1>無可避免的<br/>時代投射</h1>\n\t\t\t<p>一九六二年爆發了「五月逃亡潮」。從現實和歷史來看，中國的南方一向比北方富庶，但在當時，廣東也因為饑荒爆發了逃亡潮。許許多多難民或個別或集體渡過了邊界，逃到香港。剛開始的時候，香港總督束手無策，只能採取拒收、遣返的應對之法，進一步引發了香港本地的大騷動。</p>\n\t\t\t<p>然而當時的媒體上竟然看不到任何報導。對左派報紙來說，這是祖國所發生不太體面的事，不宜揭露；另外一些配合香港政府的或是右派的報紙，則裝作沒有難民問題，也不吭聲。</p>\n\t\t\t<p>但這既是人道的衝擊，也造成嚴重的社會問題，媒體理應有報導的天職。於是金庸又做了一個決定，那就是讓《明報》在極短的時間內，堅持政治中立的立場，對難民潮進行報導與評論。</p>\n\t\t\t<p>金庸為《明報》的立場定調，讓《明報》成為最早，而且是唯一敢於衝撞港英政府政策，譴責港督殘酷對待難民的報紙。不僅如此，《明報》還派記者到第一線做報導，讓香港民眾明白邊境上實際發生的狀況。《明報》也由此建立了自己的第一批記者。一夕之間，《明報》成為香港最有良心的呼聲，在報界的地位扶搖直上，引起讀者的重視，報份快速成長，終於在營運上站穩了腳步。</p>\n\t\t\t<p>即使如此，金庸還是持續一手寫社評，一手寫武俠小說，從《神鵰俠侶》一直到《鹿鼎記》，前後大約十三年的時間。通常下午寫武俠小說，晚上寫社評，這是他一天的基本工作。從這個角度看，顯示出社評與武俠小說兩者之間必有互涉（intertextuality），金庸的武俠創作必然呼應了他在時事評論中的觀察。</p>\n\t\t\t<p>閱讀金庸武俠小說，對照金庸社評裡所反映出的時勢變化，才能察覺單純閱讀小說時那些視而未見的意涵。在時評的對應下，金庸小說的層次變得立體起來。</p>\n\t\t\t<p>回顧一九六二到一九七四年這段時間，金庸在社評裡究竟反映了香港什麼樣的時局？</p>\n\t\t\t<p>有三個議題是顯而易見的。首先是香港正在快速建設與變化，積累日後成為國際金融中心的基礎。這其實與一九六二年的「五月逃亡潮」有關。難民湧進香港，迫使港英政府調整政策，香港因此快速金融化，迅速進行新的城市建設。當金庸一九四七年從上海抵達香港時，其實香港的城市建設是遠遠落後上海的，這和我們今天的想像和理解不同。正是在金庸同時寫社評和小說的這十幾年當中，香港才蛻變成為世界級的「東方明珠」。</p>\n\t\t\t<p>其次，在香港脫胎換骨轉型成為現代化都市的同時，中國大陸也經歷了翻天覆地的動盪。金庸出身赫赫有名的海寧世家，大地主身分讓他的父親受累被處決，從這一淵源來看，金庸對於大陸這段時期的動盪，包括文化大革命，必然有深刻的感觸與觀察。</p>\n\t\t\t<p>最後，是金庸與國民黨之間的糾結，這必須回溯至他的求學時期。在以金庸這個筆名寫武俠小說之前，他沒有正式的學歷，退學記錄超過畢業記錄。他曾就讀於中央政治學校，也就是當時國民黨的政治幹部學校，但他只念了一年半就被退學了。大陸發生「文革」的同時，國民黨正在臺灣進行「文化復興運動」。後來，國民黨視他為眼中釘，他的小說在臺灣成為禁書，他本人也被禁止踏足臺灣。</p>\n\t\t\t<p>基於這些時代背景，金庸寫社評時的基本價值觀，一定會滲入到他的武俠創作裡，兩者互涉並呼應了香港、大陸及臺灣的時事變化。如果有人願意找出金庸當年寫的所有社評，再與他的武俠小說情節脈絡進行查證對照，必定可以做出別有意義的研究。</p>\n\t\t\t<p>從大方向看，金庸小說架構中的某些象徵顯而易見。例如在《碧血劍》裡，金庸是讓真實的歷史人物走進小說，以抗清儒將袁崇煥的兒子——袁承志為主角。</p>\n\t\t\t<p>拿歷史人物當作武俠小說的素材，讓真實的歷史事件作為武俠小說的故事背景，必然會面臨一個棘手的問題，那就是沒辦法隨意竄改真實存在的歷史。依循歷史小說這條路數去寫武俠小說，可以回溯到他小學時的閱讀經驗。金庸曾經說過，當時他讀《三國演義》，全然站在護衛蜀漢劉備這一方。也許很多人都有這種情感投射，因為在羅貫中筆下，本來就有意要讓讀者認同蜀漢，尤其是敬佩諸葛亮。金庸說，他第一次讀到諸葛亮在五丈原之戰歸天後，就闔上《三國演義》，完全無法再讀下去，心情備受煎熬。蜀漢從五丈原撤退之後發生的故事，金庸還是從他表哥口中得知的——曹魏最終滅了蜀漢。金庸不能接受蜀漢竟然最先滅亡，為此和表哥激烈辯論，他表哥沒有辦法，只好搬出歷史教科書。書上幾行字指證歷歷，證明鄧艾、鐘會滅了蜀漢的歷史真實，金庸才悻悻然服輸，甚至流了不少眼淚。</p>\n\t\t\t<p>這件事在他心中留下了深刻的衝擊，傷痕一直都在，致使他創作武俠小說時，經常喜歡試圖在小說中改寫歷史，但如此一來，不容否認及推翻的歷史真實也就一直徘徊在小說裡。《碧血劍》的主角袁承志即是一例，他的武功如此高強，竭盡所能幫助闖王奪天下，他的最終目標就是對抗清軍、誅殺明朝崇禎皇帝。但說到底，歷史是人力無法撼動的事實。李自成攻入北京城，崇禎上吊，然後清兵入關，大敗李闖，多爾袞率清朝入主中原。</p>\n\t\t\t<p>《碧血劍》的情節主線，是以袁承志的復仇之志為鋪陳。依照史實，袁崇煥以「通虜謀叛」的罪名而遭凌遲，所以袁承志立誓輔助闖王，以報父仇。他的報仇對象當然就是崇禎皇帝。而袁崇煥服刑之慘烈，源頭來自對抗滿洲人入侵。</p>\n\t\t\t<p>無論如何，滿洲人終究還是進佔北京，將中原納入大清版圖，小說家不能為了成全袁承志而改寫歷史，金庸心裡有數，只能讓袁承志心灰意冷，草草將小說結尾。袁承志意興蕭索之餘，遠征異域，選擇在南方的海島隱居，也許是藉由這座海島來隱喻香港。</p>\n\t\t\t<p>對照首刊的連載版，以及金庸改寫於一九七○年代的修訂版，我們發現，《碧血劍》的開場和結尾都做了些修改。</p>\n\t\t\t<p>連載版《碧血劍》的開場是，「陝西秦嶺道上一個少年書生騎了一匹白馬，正在逸興橫飛的觀賞風景」，描寫侯朝宗在「斜陽將墮，歸鴉陣陣」下的少年身影。但是到了修訂版，小說開頭改為敘述浡泥國（即今婆羅洲北部的婆羅乃）國王朝貢明成祖，「西南海外浡泥國國王麻那惹加那乃，率同妃子、弟、妹、世子及陪臣來朝」。如此一來，就與袁承志隱居海島的結局相呼應，讓袁承志決定去海島做化外之民的小說寓意，象徵性作用更為強烈。</p>\n\t\t\t<p>此外，金庸小說的框架雖然承襲幫派、武林的大系統，但他也曾經寫出性質鮮明的大幫派，例如《倚天屠龍記》中對抗元廷的明教，由於教徒行事詭秘，教風、儀式及口號既神秘又曖昧，與其他江湖門派格格不入，江湖中人視之為「魔」。另一個金庸創造的神秘教派，則是徹徹底底的魔教，就是《笑傲江湖》中的日月神教，從教眾稱頌教主東方不敗的口號：「文成武德，仁義英明，千秋萬載，一統江湖！」再去對照金庸撰寫《笑傲江湖》的時間點，其深意不言而喻。</p>\n\t\t</div>"},{"title":"第二章 武俠小說系譜 集體的江湖世界","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-11\"><span>第二章</span></h6>\n\t\t\t<h1>武俠小說系譜</h1>\n\t\t\t<h4>集體的江湖世界</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer004\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 武俠小說：作為類型小說的一種","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-12\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>武俠小說：<br/>作為類型小說的一種</h1>\n\t\t\t<p>金庸曾多次提到他的武俠小說不是殿堂上的文學作品，但據我個人意見，如果將武俠小說排除在文學之外，從某種意義上來說，其實是破壞或傷害了文學。文學的類型不是只有唐詩、宋詞或經典名著，文學領域之廣泛，遠超於此。從廣泛的文學類型來看，武俠小說其實是類型小說（genre fiction）。換句話說，在文學的範疇裡，會有不同的文學類型召喚著讀者，要求讀者以不同的眼光及方式去閱讀。</p>\n\t\t\t<p>類型小說當然與大部分文學作品不一樣，它具有大眾化、娛樂讀者的性質，但也不容小看。類型小說有它自己的寫作公式，閱讀類型小說，尤其是武俠小說，讀者必須在翻開書頁前有一些醞釀和準備，否則就難以走進武俠世界。</p>\n\t\t\t<p>其中一項重要的準備，就是擱置現實感。這意味著在閱讀武俠文本時，要暫時懸置懷疑的念頭，不能用現實世界的眼光和標準去看待武俠小說裡的人事物。</p>\n\t\t\t<p>從另一個角度看，武俠小說的虛構性實現了它最重要的功能：由於武俠小說創造出「不真實」的感受，在閱讀當下，讀者便能夠暫時脫離現實，逃避真實世界中的逼仄。愈是深入武俠奇境，愈是容易讓人拋開外在的現實。所以有些時候，情況反而顛倒過來，讀者為了逃避現實世界，從而在閱讀武俠小說的過程中獲得愉悅感。讀者心甘情願同意武俠小說的設定，雖然明知其中的虛構成分，仍然願意相信在江湖世界所發生的一切，與之產生深刻的連結。</p>\n\t\t\t<p>簡言之，想要進入武俠世界，首先必須具備一項條件——相信這個世界的特定規則，比如飛簷走壁的輕功、制人行動的點穴等。你必須認真看待這些蓋世神功，哪怕稍有一點點現實的判準，對於神乎其技的武術、劈山裂石的掌力嗤之以鼻，你就無法優遊在武俠世界裡。</p>\n\t\t\t<p>不僅如此，江湖中有數不盡的「巧合」（coincidence）。「巧合」的設置在武俠小說中是十分常見的情節推進機關，透過這種精心佈置的巧合，故事才能在意外的轉折後繼續發展下去。例如《射鵰英雄傳》第三十一回〈鴛鴦錦帕〉，寫郭靖與黃蓉兩人告別一燈大師，下山之後，來到桃源縣城中的「避秦酒樓」，兩人吃著酒樓名菜蜜蒸臘魚：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖吃了幾塊，想起了洪七公，道：「不知恩師現在何處，傷勢如何，教人好生掛懷。」……黃蓉正待回答，只聽樓梯腳步聲響，上來一個道姑，身穿灰布道袍，用遮塵布帕蒙著口鼻，只露出了眼珠。……</p>\n\t\t\t<p>黃蓉心中狐疑，又向那道姑一望，只見她將遮在臉上的布帕揭開一角，露出臉來。黃蓉一看之下，險些失聲驚呼。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>眼前的道姑竟是穆念慈。三人在五六里外的一株槐樹下見面。穆念慈找郭靖、黃蓉說話，就是為了告訴他們：「你們僱的船是鐵掌幫的。他們安排了鬼計，要加害你們。」因為這樁巧合，郭靖和黃蓉才逃過一劫。</p>\n\t\t\t<p>到了下一回〈湍江險灘〉，靖蓉兩人在沅江上與鐵掌幫幫主裘千仞進行了一場惡鬥。後來兩人一路東行到浙南，在客店中說話時：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>忽聽十餘丈外腳步聲響，兩個夜行人施展輕身功夫，從南向北急奔而去，依稀聽得一人說道：「老頑童已上了彭大哥的當，不用怕他，咱們快去。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>一聽到「老頑童」三個字，心想這不是在說周伯通嗎？他們理所當然跟在這兩名夜行人後頭，果然就看到周伯通坐在地上僵硬不動。</p>\n\t\t\t<p>無窮無盡的巧合兜來轉去，穿插在這些小說情節之間，剛碰到一樁巧合，不久後又遇到另一樁巧合。郭靖、黃蓉兩人的江湖旅程，總是一而再地發生意外的轉折，來來回回都能遇見相識的人。讀者不能用現實的邏輯去計較這些不自然的巧合安排，你只能接受如此高頻率的巧合，這也是閱讀類型小說時的必要準備。</p>\n\t\t\t<p>在華文的類型小說中，金庸的武俠小說佔有極為獨特的地位，而且別具意義。我在《霧與畫：戰後臺灣文學史散論》一書中，也曾探討武俠小說系譜的來龍去脈，依循武俠小說的傳統敘事架構和系譜脈絡，更能定義金庸的文學成就。</p>\n\t\t</div>"},{"title":"02 平江不肖生的奇俠「傳」","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-13\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>平江不肖生的<br/>奇俠「傳」</h1>\n\t\t\t<p>一般而言，提及中國武俠小說的系譜，很多人偏向從《莊子．說劍》開始講起，又或是唐傳奇及《水滸傳》。但如果要明確梳理武俠小說系譜，就必須先勾勒江湖、武林的形成。談及武俠小說系譜的建立，至少一定要上溯到人稱「現代武俠之父」、本名向愷然的平江不肖生。</p>\n\t\t\t<p>向愷然出生於一八八九年，在長沙楚怡工業學校畢業後，赴日留學入華僑中學，一度返回中國，原本計畫二度前往日本，卻苦於旅費無著，還好有同鄉編劇家宋癡萍介紹，將手寫的《拳術講義》賣給《長沙日報》。</p>\n\t\t\t<p>向愷然寫《拳術講義》來自他的背景和本事，他出身武術世家，有著貨真價實的拳腳功夫。《拳術講義》的內容正是拳術及武術的介紹傳授，賣掉這本書後，他用賣書的錢籌措旅費，再度動身前往日本留學。返國後向愷然來到上海，將在日本的見聞剪裁拼湊，寫成《留東外史》，竟然大受歡迎，成為清末民初留學史上的一本名著。他接續又寫了《留東外史補》、《留東新史》、《留東豔史》等幾本書。《留東外史》比較趨近於紀實作品，但一本又一本留日見聞寫下來，到了《留東豔史》就漸漸變成小說了。</p>\n\t\t\t<p>臺灣資深武俠迷、也是武俠小說的重要研究學者葉洪生，曾著《武俠小說談藝錄——葉洪生論劍》一書，其中的一篇文章〈近代武壇第一「推手」〉寫道：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>當《留東》四部曲陸續在上海出版時，因文中頗涉武功技擊，真實有據，乃引起行家注意；加以向氏生性詼諧，健談好客，遂與往來滬上的奇人異士、武林好手如杜心南（南俠）、劉百川（北俠）、佟忠義（山東響馬）、吳鑒泉（太極拳家）、黃雲標（通臂拳王）及柳惕怡、顧如章、鄭曼青等結交為好友，切磋武學。上海灘青洪幫首腦杜月笙、黃金榮、虞洽卿等亦為座上客，時相過從。由是見聞益廣，對於江湖規矩、門檻無不知曉。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>向愷然憑藉自己通曉武術拳法，以及擅寫吸引讀者好奇的通俗小說，再加上與現實幫派人物過從甚密，這三項條件下，成就了平江不肖生「現代武俠之父」的地位。</p>\n\t\t\t<p>可是「現代武俠」到底是什麼？平江不肖生究竟開創了什麼前人未及發掘、想像的武俠成分呢？</p>\n\t\t\t<p>平江不肖生最具代表性的作品，公推《江湖奇俠傳》和《近代俠義英雄傳》。這兩部小說皆以「傳」為名，而且細究其形式，明顯是「紀傳體」與章回小說的奇妙結合。</p>\n\t\t\t<p>所謂「紀傳體」，是指《江湖奇俠傳》和《近代俠義英雄傳》所傳者皆非一人一俠。雖然有電影「火燒紅蓮寺」推波助瀾，主題曲歌詞紅遍通衢，「紅姑怹兒子叫陳繼志，她火燒紅蓮寺」，一度是非常轟動的閩南語電影和連續劇，使得《江湖奇俠傳》書中的「紅姑」聲名大噪。不過紅姑及「火燒紅蓮寺」的故事，在原書中直到八十回左右才登場，前面大肆鋪寫的是「爭水路碼頭」的來龍去脈。 「火燒紅蓮寺」之後，小說又熱火火地拉出另一條張汶祥「刺馬」的軸線來。《近代俠義英雄傳》則以霍元甲貫穿其間，然而讀者不可能不對一開頭就出場的大刀王五，或是後來的羅大鶴、孫福全等人留下深刻印象。</p>\n\t\t\t<p>《江湖奇俠傳》和《近代俠義英雄傳》二書都是「群傳」、「群俠傳」，平江不肖生寫這兩部小說的時候，大量援引傳統史學的「傳」體，給每位出場的英雄豪傑清楚的身世背景。換言之，每一位英雄人物彷彿都是現實中存在的人，有著真實的人生來歷。</p>\n\t\t\t<p>這種筆法在敘述「爭水陸碼頭」時最為明顯，有時甚至造成讀者閱讀上的困擾。第四回中，平江不肖生先是敘述了平江、瀏陽兩地人爭奪趙家坪的事件梗概，然後說：「只是平、瀏兩縣農人的事，和笑道人、甘瘤子一般劍客，有什麼相干呢？這裡的緣故，我應了做小說的一句套語，所謂說來話長了！待在下一一從頭敘來。」</p>\n\t\t\t<p>這一敘，先敘了楊天池的一大段來歷，中間連帶介紹楊繼新的出身，作為後文伏筆。楊天池拜師練藝，回到義父義母家，剛好遇上「爭水陸碼頭」，平江不肖生借著事件轉場，改而追蹤「怪叫花」常德慶的來歷。常德慶的師父是甘瘤子，於是又得費一番唇舌講甘瘤子，再由甘瘤子牽扯出桂武來。繞了一大圈，講了五、六人的曲折生平，好不容易回頭寫了一段常德慶與楊天池「爭水陸碼頭」的交涉，不料筆鋒一轉，平江不肖生又寫起向樂山來。向樂山的事蹟從第十二回寫起，一路寫到第十九回，故事還是沒有回到常德慶、楊天池身上，卻從向樂山再牽出朱復、萬清和……</p>\n\t\t\t<p>這種寫法，一方面有章回小說如《儒林外史》的影子，一個角色牽連出另外一個角色，就像撞球般一個撞一個。不過，換個角度看，將這些角色的生平詳細刻畫，事實上就等於是一部奇俠「傳」。事件只是陳述的引子，或說幌子，真正重要的是留下這些「奇俠」的身世與事蹟。給每一位奇俠一個來歷，就是給他一個身分、一種真實性。</p>\n\t\t\t<p>這種真實性倒不必然如施濟群在評注中所說的：「向君言此書取材，大率湘湖事實，非盡向壁虛構者也。」是否為事實，我們無需查考；不過一個角色如果有了那麼詳盡的生平故事，就顯見這個角色不是作者單純為了情節推進方便而去捏造出來的，作者不斷喻示讀者，這些角色有小說情節以外的豐富生命經驗可供汲取。這種「非功能性的敘傳細節」，給了這些角色「真實性」。</p>\n\t\t\t<p>引用張大春的話說：「俠不是憑空從天而下的『機械降神』（dues ex machina）裝置……俠必須像人一樣有他的血緣、親族、師承、交友或其他社會關係上的裝置。」（張大春《小說稗類》）張大春還進一步解釋：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在《江湖奇俠傳》問世之前，身懷絕技的俠客之所以離奇非徒恃其絕技而已，還有的是他們都沒有一個可供查考探溯的身世、來歷，也就是辨識座標。俠客的出現本身就是一個絕頂離奇的遭遇、一個無法解釋的巧合。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>然而到了平江不肖生手裡，眾多奇俠不只個個有來歷、有身世，而且彼此關係交錯，組成了一套人際系譜。</p>\n\t\t</div>"},{"title":"03 武俠「隱世界」的集體性格","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-14\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>武俠「隱世界」<br/>的集體性格</h1>\n\t\t\t<p>從俠義小說的脈絡往下梳理，譬如《水滸傳》、《三俠五義》，及至清代盛行的公案小說，一路流傳下來，到了清末民初的平江不肖生，開始打造新式的武俠、江湖概念。自此之後，類型小說從傳統的俠義小說脫胎換骨，轉變成現代的武俠小說。</p>\n\t\t\t<p>以前的俠，個個依其絕技存在，像是點綴在廣闊夜空中的點點星光。《江湖奇俠傳》之後，俠與俠組成的武林、江湖，自成一片空間（或說「反空間」），與夜空同時存在，偶爾還會透過「蟲洞」交錯穿越。</p>\n\t\t\t<p>平江不肖生對「武俠史」做出的另一大貢獻，是他創造了幫派系譜。他不只讓群俠各歸其位、各有所屬，俠與俠之間還有著千絲萬縷的恩怨情仇。同時，這套系譜也具備了不斷創新、擴張的彈性，誘引著後來的武俠作者跟隨他的腳步，投入到這塊「想像武林」的創作中。</p>\n\t\t\t<p>幾乎與平江不肖生同一時期，只比他起步稍晚的武俠小說家是趙煥亭，時人稱為「南向北趙」。趙煥亭的寫作路數與平江不肖生很像，譬如他的《奇俠精忠全傳》，書名就與《江湖奇俠傳》雷同，但《奇俠精忠全傳》無論在知名度還是地位上，皆遠不及平江不肖生的《江湖奇俠傳》。</p>\n\t\t\t<p>這其中有何緣故？除了小說本身的因素外，我們不能忽略文類傳承上所造成的選擇效果，也就是後來寫作武俠小說的人，受到平江不肖生的暗示，跟隨平江不肖生的例子，將他們創作的故事附麗在平江不肖生所創造的那個武林、江湖圖像上。這些後來者成就了平江不肖生，他們選擇寫一種「平江不肖生式」的武林，而不是「趙煥亭式」的武林，這才真正決定了「南向北趙」誰會成為「正統」。</p>\n\t\t\t<p>「南向北趙」時期之後，鄭證因、白羽、王度廬也寫出風格別具的武俠小說，緊接著出現了武俠奇書——還珠樓主的《蜀山劍俠傳》。當時的武俠小說家除了擅用「傳體」筆法外，更創造出變化多端的武功招數，描繪得栩栩如生。俠義小說如《水滸傳》的梁山泊英雄展現武功本領時，打鬥場面都在幾句話之內結束，比較少細節描述；而現代武俠小說家則傾力著墨武功細節，還在他們的筆下，逐漸勾勒出江湖、武林中「俠」的人際關係與原則。</p>\n\t\t\t<p>平江不肖生、趙煥亭、白羽、鄭證因、王度廬、還珠樓主等武俠小說家，風格和筆法原本差異頗大。及至一九四九年之後，武俠小說到了臺灣另闢天地，開啟另一段新的文學生命。</p>\n\t\t\t<p>這一批武俠小說家包括臥龍生、司馬翎等，他們幾乎都是同一代人，大部分也有軍中背景。抗戰流亡時，他們以武俠小說作為最重要的精神食糧，來到臺灣之後，便開始在雜誌、報紙嶄露頭角，出版大量的武俠作品，並且相互影響彼此的寫作。</p>\n\t\t\t<p>如何相互影響呢？這一代小說家在大量創作的過程中，迸發出越來越強烈的共同性，他們亦步亦趨地模仿平江不肖生所開創的江湖、武林系統。換句話說，他們的作品讓平江不肖生成為傳統武俠小說的代表性人物；而平江不肖生筆下的武林門派，也就成為臺灣武俠小說裡的共同門派。在這個背景之下，也影響了香港新派武俠文學，包括金庸在內。後起的作家都必須按照平江不肖生設置的武林，書寫他們小說中的武林。從這個脈絡來看，武俠小說的集體性，或說它的共同性格，也就更加明朗了。</p>\n\t\t\t<p>所謂集體性格，意味著無論這部武俠小說是由誰執筆的，小說框架不會有太大差別，雖然讀者還是會在意封面是冠上哪一位作家的名字，但是你不太可能只讀臥龍生的小說，也不太可能專攻東方玉的作品，基本上不存在這樣的武俠小說閱讀方式，大部分讀者都是「博覽群書」，會涉獵各個作者的武俠小說。</p>\n\t\t\t<p>再引一段也是張大春的評論：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>系譜這個結構裝置畢竟為日後的武俠小說家接收起來，它甚至可以作為武俠小說這個類型之所以有別於中國古典公案、俠義小說的執照。一套系譜有時不只出現在一部小說之中，它也可以同時出現在一個作家好幾部作品之中。比方說：在寫了八十八部武俠小說的鄭證因筆下，《天南逸叟》、《子母離魂首圈》、《五鳳朝陽》、《淮上風雲》等多部都和作者的成名巨制共有同一套系譜。而一套系譜也不只為一位作家所獨佔，比方說：金庸就曾經在多部小說中讓他的俠客進駐崑崙、崆峒、丐幫等不肖生的系譜，驅逐了金羅漢、董祿堂、紅姑、甘瘤子，還為這個系譜平添上族祖的名諱。（張大春《小說稗類》）</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這就是平江不肖生所設立的武林。</p>\n\t\t\t<p>閱讀武俠小說的人一定具備武俠世界的基本常識，少林派的絕技一定少不了拳腳功夫，崑崙派的弟子多半擅長使劍，四川唐門肯定善投暗器，峨嵋派掌門一定是師太（金庸的《倚天屠龍記》讓郭襄成為峨嵋派創派祖師打破了此規矩）。</p>\n\t\t\t<p>平江不肖生開創的武俠系譜，在一代代小說家不斷累積、擴張之後，變得如此逼真，更容易讓讀者遁入武俠的「隱世界」。武俠小說家所共同創造的這個系譜，也更加凸顯類型小說的特質。類型小說是集體性的，尤其是武俠小說，一脈相承地沿襲了同一套系譜，熟知這一套系譜是閱讀武俠小說的門檻及條件。</p>\n\t\t\t<p>若是閱讀《白鯨記》，或是《卡拉馬助夫兄弟們》、《戰爭與和平》這類純文學作品，你可以只讀任何一本。但如果你只想讀一本武俠小說，就無法領略武俠世界的魅力；當你讀了十本、二十本，這樣的世界能讓你欲罷不能，比如講到丐幫，這個幫派的來龍去脈你必知曉一二，丐幫的「打狗棒法」可能也如數家珍，也會知道丐幫弟子是以身上布袋區分層級，最高是九袋長老，丐幫弟子之間也有特殊的聯絡密技。</p>\n\t\t\t<p>不同作者所撰寫的武俠小說，形塑了一個集體世界。換另一個角度看，如果你不願付出龐大的閱讀時間，就不可能在武林、江湖中得到樂趣。</p>\n\t\t</div>"},{"title":"04 跳出「集體創作」的金庸","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-15\"><span>0</span><span>4</span></h6>\n\t\t\t<h1>跳出「集體創作」<br/>的金庸</h1>\n\t\t\t<p>在金庸之前，武俠小說最大的特色是集體創作與閱讀。讀者不會沉迷於單一小說，或單一作者，而是沉浸在武俠文類共同塑造的集體記憶中。讓讀者心嚮往之的，其實是眾多武俠作品所共同構建的江湖，像是反覆出現在不同小說家作品中的少林、武當、崑崙、峨嵋……，這一片江湖，才是讀者癡迷的對象。</p>\n\t\t\t<p>舉例來說，還珠樓主的《蜀山劍俠傳》氣魄不可謂不大、成就不可謂不高，然而《蜀山劍俠傳》的氣魄、成就，尤其是龐大的篇幅，反而阻止了後來者的仿效。《蜀山劍俠傳》總篇幅約五百萬字，大概超過金庸所有小說的一半。金庸他們那一代人都讀過《蜀山劍俠傳》，但今天的讀者已經不讀了，為什麼？這是因為讀者不熟悉《蜀山劍俠傳》裡大部分的門派和招數。同樣道理，讀者對趙煥亭的《奇俠精忠全傳》也不熟悉，小說裡的人物來歷、武功都很陌生。《蜀山劍俠傳》像是一座孤峯，凸出傲立；而平江不肖生《江湖奇俠傳》的文學風景，卻是一片連綿不絕的山脈。</p>\n\t\t\t<p>只是這種武俠小說的閱讀形態，自從金庸小說出現之後，就完全改變了。這也是直到今日，金庸的武俠小說仍然值得一讀的緣由。</p>\n\t\t\t<p>金庸是在誤打誤撞的情況下被報館交付專欄連載的任務，於一九五五年動筆寫第一部武俠小說。他在創作初期又進入電影界寫劇本，期間浸染於拍攝電影、編劇等新事物，而與女明星之間的接觸，也讓他經歷了摻雜虛華與真情的複雜情境。直到他創辦報紙，繼續寫外電編譯，分析國際局勢，最關鍵的就是美國及蘇聯在冷戰中對峙，同時國、共也在對峙。香港這個小島夾在中間，如何在紛亂局勢中生存下去，這些都是金庸每天面對的事情，也都成為滋養他武俠小說寫作的土壤。</p>\n\t\t\t<p>另一個不容忽視的背景是金庸的閱讀經驗，這讓他跟同代小說家、乃至前後崛起的大批武俠作家大相徑庭。他從小就儲存、累積了各種文史知識，作為海寧世家後代，他耳濡目染中國傳統文化，在典籍中引發他對史學的興趣。</p>\n\t\t\t<p>他的兩部早期作品《書劍恩仇錄》和《碧血劍》經常被忽略，主要是後來金庸寫了《射鵰英雄傳》，其後又有《神鵰俠侶》、《倚天屠龍記》，形成了波瀾壯闊的三部曲，也寫出了完全不一樣的金庸風格。其中一點，就是金庸以非常鮮明的人物個性，作為小說情節推動的主力。相較之下，《書劍恩仇錄》和《碧血劍》似乎沒那麼特別，可是我們也不應輕忽。比如在《書劍恩仇錄》中，金庸就大膽地做了一個嘗試，在武俠小說的傳統結構下放入歷史元素。</p>\n\t\t\t<p>從武俠小說傳承的角度看，金庸小說寫的不再只是集體論述當中的武林世界。金庸小說內容的獨特性，是如此自成一格，建立起獨樹一幟的武俠招牌。</p>\n\t\t\t<p>武俠小說原本是集體閱讀的類型小說，一般而言，讀者已經熟稔於由此建構出來的集體閱讀經驗。如果武俠小說寫得太具原創性、風格太強烈，很可能會讓讀者不買單，因為需要從頭熟悉、記憶這個新創立的武俠體系，容易造成閱讀疲累。但是金庸打破了這種閱讀規則，所有嗜讀武俠小說的讀者都沉迷在他的武俠世界中，即使他在集體意識中添加了許多獨創性的內容，仍然掀起一股風潮。</p>\n\t\t\t<p>前文提及，武俠小說作為類型小說中的一類，讀者在閱讀時必須有所準備，也就是讀者和作者之間存在著一種細膩的默契，比如讀者願意相信小說家所虛構的神奇武功。自平江不肖生之後，讀者與作者之間形成了一種新的默契，讀者對於虛構的容忍度開始有了限度，武俠世界可以超越現實，但這些俠客必須有身世來歷。</p>\n\t\t\t<p>作為新派武俠小說，金庸小說的主角人物，必定有著雙重來歷。首先是身世背景的來歷，其次是武功的來歷。</p>\n\t\t\t<p>金庸運用兩種書寫方式，讓小說主角的身世來歷極為具體，一種是早期像是寫陳家洛、袁承志等人物時，直接從歷史記載中尋覓這些角色的足跡。及至《射鵰英雄傳》，又嘗試另一種更吸引讀者的寫法，像是郭靖的來歷就與眾不同，而郭靖的身世又與楊康（完顏康）有著千絲萬縷的關係。金庸特意給郭靖如此漫長的身世鋪陳，與黃蓉截然不同，小說走筆到了郭靖入關赴十八年比武之約，黃蓉才突然從桃花島出走，進入讀者眼中。</p>\n\t\t\t<p>金庸從白茫茫的風雪之夜寫起，全真教道士丘處機的踏雪之聲從牛家村東邊大路上傳來，因緣際會，結識了郭靖之父郭嘯天、楊康之父楊鐵心。接著大批官兵突然來抓人，郭嘯天和楊鐵心各自懷著身孕的妻子都走散了。此時郭靖還未出世。丘處機為救李萍，和受人撥弄的江南七怪大打出手，兩敗俱傷。丘處機提出一個大賭注：既然一切都是為了拯救忠義之後而起，便由江南七怪尋找郭氏孤兒下落，教導他武藝，丘處機自己則教楊氏孤兒習武。十八年後，在嘉興醉仙樓相會，讓這兩個孩子比武定輸贏。這樣的來歷甚至能推動情節。</p>\n\t\t\t<p>另外一種來歷是指武功來歷。《碧血劍》中袁承志的武功不會無緣無故地練成，而是一點一滴地鋪述起來。藉由小說情節開展，讀者看到人物的成長，進而跟這個人物建立交情，才能隨著他的足跡、進入他的世界。</p>\n\t\t\t<p>金庸小說中的這兩種俠客來歷，來自平江不肖生建立起來的慣例。人際系譜將俠客們組成了「江湖」、「武林」，也就是眾多的奇俠組構成的一個「異類世界」。奇俠的異類世界是一個異質空間，它與現實人間平行。人際系譜一方面讓奇俠世界不再只是一般凡人的「奇觀」，有著他們自己的生活、自己的交往；另一方面，人際系譜也讓奇俠世界平行於「平凡世界」，偶有交錯。</p>\n\t\t</div>"},{"title":"05 逝去的連載小說時代","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-16\"><span>0</span><span>5</span></h6>\n\t\t\t<h1>逝去的<br/>連載小說時代</h1>\n\t\t\t<p>金庸創作武俠小說的背景，離不開香港報業發展的歷史，他的每一部武俠小說都誕生自報刊連載。今天的讀者沒有機會感受連載小說的魅力，那一段可堪懷念的時光。</p>\n\t\t\t<p>我是個讀連載小說長大的人，開始寫作時又剛好趕上副刊連載在臺灣消逝前的尾聲。《大愛》這部小說，就是從一九八九年開始在《自立晚報．本土副刊》連載的。那是我第一次嘗試寫長篇小說，寫的是一個時空交織錯亂的故事。我在美國讀史學博士班研究課程的第二年，同時密切觀察著臺灣島內風起雲湧的社會運動，那種生活也是時空交織錯亂的。一九九一年《大愛》寫完了，臺灣報業連載年代也差不多走完了。</p>\n\t\t\t<p>翻讀一九七五年九月出刊的舊雜誌《書評書目》，其中有一篇〈文學之死〉的文章，該文批評道：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>朱羽的崛起，正好說明了各報副刊的墮落。朱羽的小說取材於民初的江湖人物，恩怨加上仇殺，完全是武俠小說的翻版，了無新思，更談不上境界，但他能投編者（或者說是報館老闆）所好，在每日刊出字數的末了，一定製造一個「扣子」，引誘你明天再看……他的小說……一篇接一篇地在《中國時報》、《聯合報》、《中華日報》和《大華晚報》連載，而真正作家的文學作品，卻乏人問津！</p>\n\t\t\t<p>　</p>\n\t\t\t<p>曾經擔任過《聯合報》副刊主編的平鑫濤，在回憶錄《逆流而上》中說，他剛接編副刊時，對連載的武俠小說非常感冒，一直想把它停掉，可是卻遭到業務部門的強烈反對，認為不登載武俠小說會影響銷量。平鑫濤後來還是不動聲色地腰斬了武俠小說的連載。等到下一回開會，業務部門報告最近業績如何蒸蒸日上，他才突然發言：「這證明了停刊武俠小說對報紙銷售沒有負面影響。」業務經理當場目瞪口呆，因為他甚至沒留意到武俠小說已經不在版面上了。</p>\n\t\t\t<p>那個時代的連載文字仍能「扣住」讀者，讓讀者日日追讀報紙。那是個已經逝去的時代，是個每家報紙都有副刊，每份副刊上面天經地義一定要有武俠小說連載的時代；在香港，那是金庸靠著每天在自家報紙上寫武俠小說，創造了「明報傳奇」的時代。那是個文學中人，對連載小說又愛又恨的時代。</p>\n\t\t\t<p>我翻出了在那個時代，曾經比朱羽的作品還要風光十倍的古龍代表作《絕代雙驕》，除了重溫那有名的簡短文句、古怪對話外，還發現了一個秘密：古龍小說的情節，是靠著連綿不斷的意外轉折來推動的，這裡突然出現一個人、那裡突然飛來兩枚暗器、應該死掉的人卻復活了、被點了穴道不能動的人卻動了……，這些無窮無盡的意外轉折，其實都是前面所講的「扣子」。在每天連載故事的結尾，擺上一個出人意表的神秘現象，於是就達成了「欲知後事，請看明天」的效果。換句話說，那些都是吊讀者胃口的小把戲，因為必須不斷吊讀者胃口，結果小說中就非得不斷有意料之外與奇妙巧合了。</p>\n\t\t\t<p>古龍這種筆法和朱羽一樣，能迎合報館賣報紙的業務要求。不過依照眾家友人對古龍個性與生活習慣的記錄、描述，我一邊讀《絕代雙驕》，一邊彷彿看見已經喝得微醺的古大俠，他看看報館來取稿的時間到了，攤開稿紙隨意寫寫，寫到後來時間愈是緊迫，說不定報館的人都已經站在門口了，於是匆匆編了讓一個聲音、一個人影、一件武器憑空竄出，只要故弄玄虛地形容一下那聲音、那人影、那武器，就能填滿字數交差了事。</p>\n\t\t\t<p>至於那聲音、那人影、那武器究竟是什麼？交完稿回頭喝酒的古大俠，應該就沒興致再去想了吧！等明天再說。等明天又要交稿時，再來傷腦筋解釋。沒到下筆那刻，古龍自己也不知道究竟天外飛來的是人是鬼、是刀是箭。這是那個年代連載小說最大的特色，應該也是連載小說最被詬病的地方吧——連作者都不知道小說接下來要寫什麼，更不知道小說要發展到哪裡去。</p>\n\t\t\t<p>不寫武俠小說，但在連載時代跟朱羽、古龍一樣紅透半邊天的高陽，有他自己的方式對付門外等稿子的人。高陽寫歷史小說，照理講，故事前因後果、來龍去脈都已經先被史實給卡緊了，不可能像武俠小說有那麼大任想像隨意揮灑的空間；歷史小說得靠真實的歷史人物來承載敘述，也不可能像寫武俠小說那樣在中間穿插編造那麼多的神奇意外。沒關係，跟古龍一樣才氣縱橫、跟古龍一樣任俠好酒的高陽，自有他「跑野馬」的絕招來應付連載所需。</p>\n\t\t\t<p>高陽式的「跑野馬」，就是在歷史故事主線中，挑出一件零星瑣事，從枝微末節中岔出去，因為他腹有詩書氣自華，隨手拈來都是連篇累牘的歷史小掌故。例如《粉墨春秋》，要寫汪精衛南京偽政權的前後始末，一個歷史名人都還沒出場前，高陽光是大寫特寫抗戰前後南京的賭場設在哪裡、玩些什麼、規矩怎樣，以及如何一夕致富或破產的軼事，就接連而來，令人目不暇接。讀高陽小說，我也似乎看到了微醺中的高陽懶得費心編排情節，順手就寫自己記得的、正好讀到的掌故材料，從這條牽到那條、由這樁聯想到那樁，野馬一跑，隨心所欲想到哪裡寫到哪裡。</p>\n\t\t\t<p>這種歷史小說，表面看似乎有一定的框架，實則中間可以無窮無盡旁枝歧出，也就近乎可以無窮無盡地連載下去。換個角度看，寫連載歷史小說的高陽，跟寫連載武俠小說的古龍一樣，都不可能預先設想自己寫出的小說會有怎樣的結構，不可能預先規劃、排比好小說將具備的完整面貌。每寫一天，小說就展現一種新的可能，沒到連載結束，作者也不曉得結局是什麼。換言之，作者在連載的過程中且戰且走，一路與自己的小說搏鬥，這是連載小說的最大特色。</p>\n\t\t\t<p>這種寫法違背了小說作為嚴肅藝術的標準。藝術應該灌注了作者一種追求完美的精神，多一字不可、減一字不可，每篇有伏筆有呼應、有比例有策略，而且最好數易其稿，刪刪增增、左挪右移，才會達到精緻典範的程度。連載小說完全反其道而行，大段大段「跑野馬」的內容與主文之間沒什麼必然的、有機的關係，以至於寫到後面忘了前面，自我矛盾衝突是常有的現象，甚至整部小說看來就是由眾多部分雜混、拼湊起來的。難怪帶著嚴肅現代小說品味的讀者，會那麼不滿意於朱羽、古龍，乃至高陽了。不過說老實話，連載小說與現代文學品味標準間的齟齬，並非起自朱羽、古龍，而有更遠的淵源。</p>\n\t\t\t<p>連載是一項奇特的制度，連載打破了小說獨立自主的時間意識。小說時間與現實生活時間平行流淌著，而且不斷地互相指涉。現實生活無窮無盡、日復一日地走下去，於是小說似乎也就會同樣無窮無盡、日復一日地連載下去。連載小說因而沒有具體的頭中尾的分配，不只是結構鬆散的問題，而是永遠隱伏著一個呼之欲出的「然後呢？」 </p>\n\t\t\t<p>有頭有尾有中腰的文學作品，講究的是選擇好一段具特殊意義的時間，把它從長流中切截開來，封閉成一個完整、有機的單位。有頭有尾有中腰的文學美學，在意也講究小說應該有個「絕對」的開頭、「絕對」的結尾。小說內在要展現出一種意義、一種姿態，「行於所當行，止於所不可不止」，就是在這裡，小說完結了。多說一句都是累贅，都會破壞作品的完整性。</p>\n\t\t\t<p>連載小說不吃這套，或者說，連載條件使得這種小說不可能如此講究。同樣都叫「小說」，邊寫邊登的連載小說其實是獨樹一格的文體，具備專屬的風格，因而也就刺激、誕生了不一樣的寫作與閱讀經驗。</p>\n\t\t</div>"},{"title":"06 難以躋身文學行列的連載小說","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-17\"><span>0</span><span>6</span></h6>\n\t\t\t<h1>難以躋身文學行列<br/>的連載小說</h1>\n\t\t\t<p>寫作是一門藝術，創作者必須貫注完美的精神，文體精緻，敘事結構裁剪合度，一字一句精心潤飾，字裡行間預設伏筆、首尾呼應。連載小說在創作精神上，與嚴肅意義的小說藝術完全背道而馳。</p>\n\t\t\t<p>無怪乎《書評書目》那一篇文章會以「文學之死」攻訐武俠小說。「文學之死」意味著武俠小說不登大雅之堂，評論者是用現代小說的品味予以批評。但是連載小說真的不能與現代小說混為一談，兩者無法相提並論。</p>\n\t\t\t<p>連載小說在報業的發展中，逐漸形成一種文類，自有其來歷。這個來歷不容小覷，因為無論是香港或臺灣連載小說的起源，都不得不追索到晚清小說。</p>\n\t\t\t<p>晚清時代，小說曾經如雨後春筍般冒出來，夾雜著文言和白話。其中最負盛名、影響最巨者是社會寫實的黑幕小說。而晚清小說除了官場小說與黑幕小說，還有寓言、科幻小說，甚至是改寫古典小說，譬如讓林黛玉和賈寶玉結伴遨遊太空。晚清小說的想像力異常驚人。</p>\n\t\t\t<p>回顧晚清小說，王德威教授的文學觀點令人欽佩，他極有耐心地逐本閱讀現存的晚清小說，應該是全世界閱讀晚清小說最多的人，所以他的論斷理應讓人信服。據王德威教授研究，晚清小說最大的特色在於，不論書寫的形式及內容如何，絕大多數晚清小說都有一個共同點——它們都沒有結尾。</p>\n\t\t\t<p>大多數晚清小說都沒有完結。譬如晚清四大譴責小說之一的《老殘遊記》，它的結局究竟為何？這是個謎，因為劉鶚沒有寫完小說；曾樸的《孽海花》寫到「欲知來者是何人，為何事，且聽下文」，就再也沒有繼續往下寫，同樣沒有結尾。四部譴責小說當中，就有兩部沒寫完，而李伯元《官場現形記》、吳趼人《二十年目睹之怪現狀》各自寫下書成之日就是全書告終之時，勉強算是有個收場。</p>\n\t\t\t<p>一九一八年，胡適曾在〈建設的文學革命論〉這篇文章中，直言不諱地評斷：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>我以為現在國內新起的一班「文人」，受病最深的所在，只在沒有高明的文學方法。我且舉小說一門為例。現在的小說（單指中國人自己著的），看來看去，只有兩派。一派最下流的，是那些學《聊齋志異》的劄記小說。篇篇都是「某生，某處人，生有異稟，下筆千言，……一日於某地遇一女郎，……好事多磨，……遂為情死」；或是「某地，某生，遊某地，眷某妓，情好綦篤，遂訂白頭之約，……而大婦妒甚，不能相容，女抑鬱以死，……生撫屍一慟幾絕」；……此類文字，只可抹桌子，固不值一駁。還有那第二派是那些學《儒林外史》或是學《官場現形記》的白話小說。上等的如《廣陵潮》，下等的如《九尾龜》。這一派小說，只學了《儒林外史》的壞處，卻不曾學得他的好處。《儒林外史》的壞處在於體裁結構太不緊嚴，全篇是雜湊起來的。例如婁府一群人，自成一段；杜府兩公子自成一段；馬二先生又成一段；虞博士又成一段；蕭雲仙、郭孝子又各自成一段。分出來，可成無數劄記小說；接下去，可長至無窮無極。《官場現形記》便是這樣。如今的章回小說，大都犯這個沒有結構、沒有佈局的懶病。卻不知道《儒林外史》所以能有文學價值者，全靠一副寫人物的畫工本領。我十年不曾讀這書了，但是我閉了眼睛，還覺得書中的人物，如嚴貢生，如馬二先生，如杜少卿，如權勿用，……個個都是活的人物。正如讀《水滸》的人，過了二三十年，還不會忘記魯智深、李逵、武松、石秀……一班人。請問列位讀過《廣陵潮》和《九尾龜》的人，過了兩三個月，心目中除了一個「文武全才」的章秋穀之外，還記得幾個活靈活現的書中人物？——所以我說，現在的「新小說」，全是不懂得文學方法的：既不知佈局，又不知結構，又不知描寫人物，只做成了許多又長又臭的文字；只配與報紙的第二張充篇幅，卻不配在新文學上占一個位置。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>胡適從新文學的角度批評晚清小說是報屁股文章，只配給「報紙的第二張充篇幅」，「不配在新文學上占一個位置」。再看王德威，他對晚清小說做過最全面的學術研究，依照他的說法：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>晚清小說就算以中國的標準視之，它的文類仍大有問題，因為情節蕪蔓無序，資料唯是堆積，主題無聊炫耀，角色光怪陸離，組成了一種非常龐雜的敘述類型，或者是變成一種反敘事類型，意味著很難敘說故事，因為雜堆了太多的東西，反而威脅作品的統一性和讀者對小說結構的感知。晚清作家太急於說故事，反而沒有時間好好發展一個角色或是一幕場景。在敘述當中，他們會轉向不相干的事情，他們會彼此剽竊或者是重複。等而下之的，他們連作品到底完成沒有，都不放在心上了。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>王德威的觀察角度是從晚清小說的成書緣由來看，這些晚清小說固有的毛病及特性，其實來自當時盛行的連載風氣——這些小說是每一天、每三天或每一週，逐日逐期連載的。胡適的評論沒錯，晚清小說的確是在報紙第二張充篇幅的。作者逐日逐期寫作，報紙或刊物提供的稿費又非常優渥，他們當然會想辦法多賺取稿費，刻意把小說篇幅寫得長一點，最好一直連載不完，就無須面對上檔下檔的酬勞風險。這種情況有點像連續劇，只要收視率愈高，連續劇的集數就拍得愈長，到後來變成歹戲拖棚，敘事節奏愈來愈慢，故事橫生枝節。</p>\n\t\t\t<p>晚清小說之所以有這種面目，完全來自它們擔負著晚清報業成長的功能。雖然胡適極為輕蔑晚清小說，認為它們只配給「報紙的第二張充篇幅」，但現實情況是，報紙第二張的內容對於報社的生存影響甚巨。晚清時，人們對於社會各種光怪陸離的事情，已經產生強烈的好奇心，但是報社記者往往在採訪報導這門功夫上還不夠成熟到位，為了滿足社會大眾的獵奇心態、誘使大家掏錢買報，就必須靠報紙第二張上的連載小說。</p>\n\t\t\t<p>這樣的報業經營環境，不僅限於晚清時期，這個狀態一直延續到民國、延續到金庸在香港創辦《明報》時。在報社缺乏記者的情況下，老闆該如何吸引讀者翻閱你的報紙？金庸看準讀者饑渴地想要閱讀離奇故事，只有絞盡腦汁去編寫專欄。由於是一天、一期編寫下去，這類連載小說的敘事結構勢必難以層次井然。連載小說的目標是維持讀者的追讀動力，每一期都要保持故事的懸念才行。</p>\n\t\t\t<p>為了滿足讀者的閱讀需求，連載小說的作者通常不是從創作意念上去控制故事情節，只要小說能夠繼續發展下去，作者就繼續寫個不停。那麼，連載小說何時收尾呢？通常要等到讀者讀膩了，為了防止讀者對連載內容感到厭煩，報館主事者才下令結束連載。不過連載小說最普遍的腰斬情況，主要是報館倒閉。絕大部分的晚清小說經常把報紙或期刊給寫死了，寫著寫著，報館或雜誌社就不在了，作者只好擱筆不寫。只是這一家報社消失了，還有另一家報社冒出來，作者只要另起爐灶，就能繼續賺稿費。</p>\n\t\t\t<p>由於這些現實因素，晚清小說老是寫不完，不僅因為寫作者心裡不存在作品完整性的概念，社會氛圍也不催促連載小說作者一定要完成其作品。</p>\n\t\t\t<p>連載小說雖然有其來歷，但這並非晚清時代所發明的文類。這種寫得又臭又長、總是有頭沒尾的創作形式，有著更遙遠的淵源，意味著晚清小說的寫作風格是模仿而來的。連載小說正是從十九世紀的歐洲漂洋過海而來，尤其是法國、英國轟動社會的大眾小說。</p>\n\t\t\t<p>這些大眾小說一部比一部冗長，例如大仲馬的名著《基度山恩仇記》。大部分的人應該都沒有真正讀過完整版的《基度山恩仇記》，市面上流通的都是各種節譯版本，如果要完整翻譯出來，會是四至五冊的大合集。</p>\n\t\t\t<p>大仲馬寫《基度山恩仇記》的創作靈感怎麼來的？他取材自一個發生在一八○七年的社會真實案件。當這部小說於一八四五年八月二十八日在巴黎《辯論報》（<span>Journal des débats</span>）上一刊登，立即轟動一時。大眾都愛讀這類的煽情故事，讀者甚至一大早就去搶購剛印好的報紙。到後來，還有人直接跑到印刷廠，賄賂印刷工人，只為了搶先看到明天報紙上的連載內容。</p>\n\t\t\t<p>《基度山恩仇記》的原型，來自巴黎警方檔案管理員雅克．皮伽特（Jacques Peuchet）的回憶錄。他提到一樁真實的怪案，發生在拿破崙的時代，巴黎一家咖啡館老闆盧比昂與三個鄰居，對隔壁剛訂婚的鞋匠皮埃爾．畢卡德開了個惡意的玩笑。這四個人誣告畢卡德是英國間諜，畢卡德慘遭冤枉，被捕入獄。他在獄中待了七年，偶然間在獄中結識了一名義大利人，兩人成為好友。這名義大利人臨終前留下遺囑，將龐大遺產都贈予畢卡德。七年之後，畢卡德恢復自由之身，繼承遺產也讓他變得十分富裕。但是他卻發現一個更大的打擊，在他入獄期間，未婚妻竟然嫁給誣陷他的盧比昂，於是他誓言要復仇。他喬裝化名到盧比昂的咖啡館工作，先殺死同謀鄰居當中的兩人，再耐心等待十年，決意要讓盧比昂家破人亡。當他正要手刃盧比昂時，卻被倖存的第三個鄰居當場殺死了。</p>\n\t\t\t<p>利用這件充滿奇情的犯罪檔案，大仲馬加以增飾富麗，寫成一部超過百萬字的小說。除了基度山伯爵的復仇計畫之外，大仲馬還虛構了許多複雜的情節。由於節譯本盛行，也有評論者認為《基度山恩仇記》的全本小說不值得閱讀，情節太瑣碎了。</p>\n\t\t\t<p>不過，我們看到連載小說的種種毛病，其實是基於有頭有尾有中腰的小說美學，而不是連載小說自身的邏輯來評斷的。那麼連載小說有自己的美學嗎？我認為有的。連載小說能提供別的小說無法帶來的樂趣，就在於豐富的內在多元性，以及層出不窮的意外轉折。說白一點，連載小說之可貴，就在那些「跑野馬」的內容，那些為了吸引讀者讀下去而刻意穿插的花招。豐富內在與意外轉折，除了來自想要「勾住」讀者的因素外，還受到作者寫作過程中的強烈影響。</p>\n\t\t\t<p>幾乎無可避免的，連載小說作者會把在漫長寫作歲月中的所遇、所感、所讀、所思帶進作品裡。每天要交稿、每天要找題材寫下去，當然逼著作者東抓西撈，拉進什麼是什麼。連載小說跟著作者呼吸、跟著作者生活、跟著作者成長或變老。好的連載小說，就是作者能夠善用這種種生活變化，將小說寫得多彩多姿，毫無冷場。</p>\n\t\t\t<p>大家都說金庸小說好看，也有很多人讀到金庸小說裡有現實政治的影子，這兩件事其實二而一、一而二。為什麼金庸小說比別的武俠小說好看？因為其他的小說家用固定的方式炮製故事，金庸卻是一邊寫武俠小說、一邊辦報紙寫社論，報業的興衰榮枯、政治的是非得失，全在他眼中、心上，也就到了他的筆下。隨日子而變，隨社會情勢而走，就不會落入俗套、不會無聊重複了。</p>\n\t\t</div>"},{"title":"07 古龍的「個性」和「非江湖」","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-18\"><span>0</span><span>7</span></h6>\n\t\t\t<h1>古龍的「個性」<br/>和「非江湖」</h1>\n\t\t\t<p>小說家張大春曾經講過金庸終結武俠小說的問題。我也寫過一篇文章〈系譜的破壞與重建——論古龍的武林與江湖〉，在文章裡有比較準確且完整的意見。</p>\n\t\t\t<p>這篇文章原來是寫古龍的，不過講到武俠小說一個非常重要的背景和基礎，那就是武俠小說建立在武林上，而武林是一套非常龐雜的江湖系譜。面對此江湖系譜，金庸和古龍的態度、策略大不相同。金庸的策略是將歷史人物寫入江湖系譜中，讓真實世界與武俠世界產生直接的連繫，藉由歷史來擴大系譜。</p>\n\t\t\t<p>張大春在〈離奇與鬆散——從武俠衍出的中國小說敘事傳統〉一文中提到：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>（金庸）……向《水滸傳》裡討來一位賽仁貴郭盛，向《岳傳》裡討來一位楊再興，權充郭靖、楊康的先人。至於《書劍恩仇錄》裡的乾隆、兆惠，《碧血劍》裡的袁崇煥，《射鵰英雄傳》裡的鐵木真父子和丘處機，《倚天屠龍記》裡的張三丰，《天龍八部》裡的鳩摩智……以迄於《鹿鼎記》中的康熙，等等，無一不是擴大這系譜領域的棋子。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>以上這些都是歷史人物。那對照古龍呢？古龍卻是大開大闔，索性拋開了那套傳統江湖系譜。古龍的武俠小說是以性格突出到近乎畸形，卻又讓人不得不愛的人物角色為中心的。讀古龍小說，讀者記得的「座標」顯然是楚留香、李尋歡、蕭十一郎、江小魚、傅紅雪等這些俠客。</p>\n\t\t\t<p>如果再考驗一下自己的記憶，試著問：這幾部小說的情節，是以何門何派的恩怨情仇為主題？如此一問一想，我們只能得到一個結論：古龍是不怎麼理會那些江湖系譜的；古龍的武俠小說中，俠的個人特質明顯超越了江湖。</p>\n\t\t\t<p>古龍小說裡當然還是有門派、幫會，可是那些門派、幫會，往往都是原來系譜中的邊緣角色，或者乾脆是古龍自己發明的。像「天星幫」，這屬於系譜邊緣，面目模糊者。還有比較特別、有趣的「伊賀忍術」，這一看就知道是從日本劍道小說借來的，過去的武俠小說沒有看到過。另外，《絕代雙驕》中佔據重要位置的 「移花宮」，則是不折不扣古龍的原創。</p>\n\t\t\t<p>換句話說，古龍創造的門派、幫會，都是傳統武俠小說的讀者難以有清楚印象、有固定概念的。熟讀以往的武俠小說，無助於我們理解天星幫、伊賀忍術或移花宮。古龍將他的武俠事件從原來的大舞臺移走了，讓他們在一般人不那麼熟悉、不那麼習慣的另個舞臺上演出。</p>\n\t\t\t<p>古龍的新派武俠之「新」，很多評論者集中注意在他獨特的文字風格。但除了文字風格之外，古龍之新，還有一部分在於他拆解江湖系譜的做法。</p>\n\t\t\t<p>自覺或不自覺地，古龍跳脫了前面所說的「大互文結構」。「大互文結構」意味著那個時代不同作者所寫的武俠小說，因為都在同一個江湖、武林的系譜上，都是那幾個幫派、那幾項武功、那幾種兵器，於是就構成了一個互文的結構。可是古龍卻離開了從平江不肖生開創的江湖系譜，自己去想像一個江湖，或者說，如果用原來的標準對照來看，那是一個「非江湖」。</p>\n\t\t\t<p>為什麼說是「非江湖」？因為「江湖」的出現是根基於群俠的存在，他們彼此的人際關係才構成了江湖。可是到了古龍筆下，總是單一角色蓋過了群俠的魅力；武俠小說原本的「群性」，被古龍以個性化的個人英雄主義所取代，於是群俠間的關係不再重要，江湖也就不再重要。</p>\n\t\t\t<p>古龍小說的「個性」，相對於其他武俠小說的「群性」，在《絕代雙驕》裡表現得最徹底。這部小說的情節原本明白指向為雙主角，一對從小失散的雙胞胎兄弟，一個是江小魚，一個是花無缺。可是古龍寫活了那個古靈精怪、惡作劇不斷，卻又心地善良、近乎軟弱的江小魚，在「小魚兒」的對照、映襯之下，連花無缺都只能黯淡退位，變成了配角。所以，這部小說雖然叫做《絕代雙驕》，內容卻毋寧比較接近是《江小魚及他的兄弟》。同樣的，你去看《小李飛刀》，只要李尋歡一出來，其他角色你大概都不會想要看了。一個角色的完全形象塑造，操控、甚至涵蓋了古龍的每一部小說。</p>\n\t\t\t<p>從這裡我們就探知到古龍新派小說真正的秘訣。並非沒有別人試著寫過不在江湖系譜裡的武俠故事，然而往往都得不到讀者的青睞。因為讀者已經預期著要在武俠小說裡讀到他們熟悉的東西，而江湖系譜正是他們賴以辨識武俠小說這個文類的基本元素。找不到這個系譜，或是發現系譜被改得面目全非，讀者很難去欣賞作品的創意或突破，而是忿忿然：「這不是武俠小說！」</p>\n\t\t\t<p>古龍的成就在於拆掉了別人熟悉的江湖，可是他了不起的是，能夠補以鮮活的俠客及俠情，讓習於江湖系譜的人轉而在俠情世界中得到滿足與慰藉。古龍在武俠小說史上最重要的地位，就是作為一個敢於拆解江湖系譜，還能夠吸引讀者眼光的傑出作者。</p>\n\t\t\t<p>不過換個角度看，就能看出晚近武俠小說快速沒落的一點端倪。別忘了，遭到古龍挑戰、破壞的這一套江湖系譜，正是眾多武俠小說彼此連繫的根本。藉著江湖系譜，讀者可以這本通到那本，這位作者連到那位作者，讀這一本就為下一本練了功、打了底；讀者在江湖系譜的反覆熟悉中，自然得到基本的閱讀樂趣。</p>\n\t\t\t<p>如果沒有了系譜，沒有了互文，那麼每一部武俠小說等於是孤零零地存在，得靠自己的力量去爭取讀者。閱讀武俠小說不再是大量批發式的經驗，轉而變成零售式的精挑細選了。</p>\n\t\t\t<p>類型小說失去了「類型」的基礎，就得依憑著個別作者的個別本事。金庸有那麼大的才氣，古龍有那麼多的奇想，他們的作品可以獨立存在，獨立吸引讀者。那麼其他的作者及其作品呢？破壞掉了江湖系譜，也就等於拆掉了武俠小說共同的主舞臺，那些精彩不足的人物和情節，更顯得單調貧乏。</p>\n\t\t\t<p>這並不是要把武俠小說沒落的責任歸咎於金庸和古龍這兩位傑出的作家，而是要點出平江不肖生以來的那一套江湖系譜，在武俠小說的創作及閱讀上曾經發揮過多大的作用。這套江湖系譜固然限制了武俠創作者的想像自由，使得大批的武俠小說都面目相似，也讓部分作者得以快速複製大量的作品，不過卻也保證了讀者的最低滿足標準。</p>\n\t\t</div>"},{"title":"08 武俠小說的「終結」","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-19\"><span>0</span><span>8</span></h6>\n\t\t\t<h1>武俠小說的<br/>「終結」</h1>\n\t\t\t<p>如果想要更進一步解釋武俠小說為什麼沒落，其中一個核心原因是——武俠小說界原來是沒有明星的。大家在這個舞臺上混日子，就像今天我們會在網路平臺上寫小說，大家都可以寫，而且很多讀者也分不清楚到底誰是誰，誰寫了什麼作品，就是這裡一段、那裡一段挑選我們想要看的。</p>\n\t\t\t<p>可是武俠小說界後來偏偏出現了兩個明星，這兩個明星寫的小說，別人沒法複製、沒法抄襲，甚至沒法學習。</p>\n\t\t\t<p>其中一個用歷史視野擴大了武俠系譜，把這個系譜搞到這種程度：如果沒有好好學歷史，你就沒有辦法寫武俠小說。在金庸成就的籠罩下，你不可能再隨便抓一個歷史人物放進武俠小說裡，或是隨便給武俠小說安一個時代背景，愛怎麼寫就怎麼寫了。</p>\n\t\t\t<p>還有另外一個更糟的，那就是古龍。他乾脆把整個系譜都破壞掉，去寫他自己的武林。還有，他也寫自己的武器庫，別人平常在武俠小說裡慣用的武器——因為慣用，所以劍就是劍、刀就是刀、判官筆就是判官筆、槍就是槍——讀者都能夠想像，武功或打鬥就能夠寫得下去。古龍連這個都不要，而是去設計一個一個稀奇古怪的武器，像是天機棒、子母龍鳳環、小李飛刀……，甚至寫出《七種武器》系列，一種武器就是一個獨立故事，它們也是人性武器，代表不同的人格力量。</p>\n\t\t\t<p>這是在炫耀，也在表現他的奇想，然而這就等於在拆其他武俠小說家的臺子。這個臺子被古龍拆得差不多了，剩下的只有架子，而架子撐不了太多的人。</p>\n\t\t\t<p>本來在這種江湖系譜下，大家所寫的可以讓讀者獲得最低的閱讀滿足。以前的人讀武俠小說，哪裡會打算要從武俠小說裡得到什麼了不起的閱讀經驗、閱讀收穫？正因為武俠小說訴諸這種低度的要求，所以「江湖」顯得更重要。只要有江湖系譜在那裡，你隨便怎麼寫都可以。那個時候在租書店裡，一天五毛錢可以看三本，讀者也就甘願付了。</p>\n\t\t\t<p>可是到了金庸、古龍，用各自的本領把人家的臺子都拆了，那要再寫武俠小說就麻煩了，這是武俠小說沒落的其中一個原因。</p>\n\t\t\t<p>還有另一個相關的原因，大家都混跡於這種江湖系譜，運用低度閱讀滿足的寫法，但寫到了一定的程度，也就遇到了瓶頸。而這瓶頸是雙重的。</p>\n\t\t\t<p>作家唐諾有一篇文章〈畫百美圖的俠客金蒲孤〉，收錄在《盡頭》一書裡。這篇文章不完全是為了武俠小說而寫的，但是唐諾讀了這麼多的武俠小說，而且他的記憶力超好，小時候看過一大堆武俠小說他通通記得，才能寫出我寫不出來的文章。</p>\n\t\t\t<p>他說的金蒲孤是誰呢？</p>\n\t\t\t<p>「金蒲孤是一名一登場就已聲震全武林、完成品式的青年俠客，這意思是，作者司馬紫煙並不交代他的成長歲月，沒兒時被哪個無名老人帶走，或身負血海深仇掉落懸崖而在某山洞找到絕世秘笈之類的。」</p>\n\t\t\t<p>唐諾講的這些情節，在金庸的小說裡都出現過：被無名老人帶走，至少是在無名小島上認一個老人做義父而長大，這是《倚天屠龍記》裡的張無忌，另外《俠客行》裡的狗雜種也是；而身負血海深仇，在山洞裡找到絕世秘笈，這是《碧血劍》裡的袁承志。</p>\n\t\t\t<p>唐諾繼續說：「這種必要奇遇的從略往往是武俠小說書寫成熟期甚至進入晚期的徵象……」他明白地告訴我們說，司馬紫煙寫出俠客金蒲孤的這部小說《冷劍烈女》，在武俠小說發展過程中是相對比較晚期的作品。這樣的一種徵兆，隱隱透露出武俠小說的書寫已到達了極限。</p>\n\t\t\t<p>相對而言，我們發現在《鹿鼎記》中，金庸也是這樣寫的。韋小寶是一個有很多奇遇的人，可是韋小寶沒有因為這些奇遇而學會了高強武功。韋小寶最重要的本事是他如何說謊、如何詐騙、如何演戲。但是這些本事他從一上場就已經有了。在這個意義上，司馬紫煙所寫的金蒲孤很像韋小寶，基本上是同樣的角色屬性。一登場，身上的本事、武功已經齊備了。</p>\n\t\t\t<p>接下來，我們再看唐諾怎麼說：「一旦書寫者感覺用盡了它，讀者也厭煩它拆穿了它，這部分便可以大家你知我知一句話帶過了，同時也封閉起來不再開發新尋寶路徑了。」意思是說可以不要再寫了，反正每個人都知道，就是這一套。那不如算了，就乾脆上場的時候讓主角已經是這樣了。當讀者都能預期武俠小說裡的故事會這樣寫，以至於到一定的程度，武俠小說作者自己都不好意思這樣寫了。</p>\n\t\t\t<p>我們再來看看金蒲孤。「金蒲孤使用的不是有氣質的三尺青鋒之劍，而是一副特殊的強弓和神箭，奇怪武器的使用，也是武俠小說書寫另一個成熟期的徵象。」這不就和古龍發明自己的武器，不要用別人寫過的武器很類似嗎？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這副弓箭之名和他姓名同音，相互呼喚，是為金僕姑，這倒是大有來歷的，直接出自《左傳》：莊公十一年，公以金僕姑射南宮長萬。……很顯然，寶物神兵有靈，可抗拒悠悠時間的侵蝕分解力量，還彷彿有自主意識，最終像找到自己真正主人也似的抵達金蒲孤手中——我們倒無法說準金蒲孤是哪時代的人，武俠世界同時是時間的迷途之鄉。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金僕姑這個武器在《左傳》裡出現，那是春秋時代一段非常有趣的故事。如果大家有興趣，可以看看莊公十一年南宮長萬的故事。</p>\n\t\t\t<p>我們繼續再讀唐諾。「金蒲孤輝煌人生的最大對手是老人劉素客，這是一個自己完全不會武功卻對全天下各大門派武學無所不知、將黑白兩道所有人玩於指掌之上的大陰謀家……」前半句的描述形容，讓我們想起了《天龍八部》裡的王語嫣，不過王語嫣當然不是這樣的大陰謀家。</p>\n\t\t\t<p>再往下看，「他收有三名義女，分別以日、月、星為名，當然都非美若天仙不可，故事最後也必定奉武林大義和愛情之名背叛他。」這裡唐諾沒有直接點明，但只要你閱讀的範圍稍微廣一點，就知道三個女兒背叛他這樣的情節，不就是莎士比亞的《李爾王》嗎？</p>\n\t\t\t<p>接著，「事情便發生在金蒲孤和這三名女子的一場比試，其中一個題目是繪製百仙圖和百美圖，抽中百仙圖的劉日英，工匠技藝精湛無匹地不到半時辰便天上人間地以針繡完成。」可是這一邊要畫百美圖的金蒲孤，只信手畫了幾筆而已。</p>\n\t\t\t<p>「劉日英將信將疑地走到案前，劉星英也好奇湊過去，她們都不相信金蒲孤在三筆兩劃之下，會完成一幅百美圖！」大家可以想像嗎？知道這百美圖究竟怎麼畫嗎？</p>\n\t\t\t<p>金蒲孤的畫紙因為是放反的，劉日英伸手把它翻轉過來，她看到了什麼？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>白紙上只畫了一個半圓形，圓弧上畫了幾筆像亂草一般的墨跡，半圓中間則是一個大叉。她們看了半晌。</p>\n\t\t\t<p>劉日英才道：「金公子這是……」</p>\n\t\t\t<p>金蒲孤一笑道：「這是一幅寫意百美圖，嚴格說起來，不過是土一堆草一堆，交叉白骨紅顏淚……」</p>\n\t\t\t<p>劉日英呆呆的不作聲。</p>\n\t\t\t<p>金蒲孤一笑道：「千古美人今安在？黃土白骨青草中，我這一幅百美圖足以為千千萬萬絕色佳人寫照……」是了，所有的美女，所有的佳人，百美，一百個，死了之後通通都變成土一堆、草一堆，這就是他的意思，所以他就畫完了。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>唐諾特別解釋說：「大致上止於一九七一年，武俠小說是早期臺灣唯一本土自製成功的類型小說……」這個時候是武俠小說的輝煌時期；而差不多同時，也就是金庸寫《鹿鼎記》的時候，武俠小說其實也開始沒落了。不只是臺灣，還包括香港，「總產量其實還不小，彼此也就存在著追逐競爭，儘管基本上仍套公式寫，但總會因此冒出些較特別的東西」。</p>\n\t\t\t<p>什麼叫做特別的東西？唐諾隨手舉了一些例子：「金僕姑挖掘自《左傳》不起眼的一角，這對彼時多少有國學底子的武俠小說作家倒不算奇怪，更有趣的是歐美新東西新事物的偷偷滲入，像柳殘陽寫《金雕龍紋》就是大仲馬《基度山恩仇記》的改寫……」《基度山恩仇記》真的很好用，我們也就知道，為什麼金庸對於別人指稱《連城訣》以《基度山恩仇記》為原型這事要特別撇清，因為別人也在用。</p>\n\t\t\t<p>柳殘陽的《金雕龍紋》裡，「父親被逼死、美麗妻子失貞改嫁、飄流到無人島上找到復仇寶物的浪子楚雲當然是基度山伯爵愛德蒙．鄧蒂斯」。</p>\n\t\t\t<p>另外，古龍自己都承認，他的「楚留香系列」靈感來自英國小說家伊恩．弗萊明（Ian Fleming），他最有名的就是創造了〇〇七情報員詹姆士．龐德（James Bond）。原來楚留香是從詹姆士．龐德化身來的。</p>\n\t\t\t<p>唐諾接著說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>更厲害的是獨孤紅的《武林正氣歌》，書中赫然有個複姓西門的「斑衣吹笛人」角色，改都不改一下，多年以後，我才知道這原來是個歐洲人外國人，真的就是西方民間傳說故事裡那個以催眠魅惑笛音拐走全村小孩的傢伙。……</p>\n\t\t\t<p>迢迢來時之路——半世紀前的臺灣，貧苦蒙昧封閉，人容易慨然有廣大世界之志卻不容易有通向世界的道路、配備和盤纏，一知半解使得廣大世界比任何時期都更像個誘人之謎，人各自以他僅有的、鬼使神差的方式奮力接聽、窺視、捕捉和猜想，知識不僅破破碎碎而且通常二手三手扭曲變形真偽難分，半首歌、一句話、幾個人名、沒頭沒尾的一截故事、一張語焉不詳的照片云云，都被人視若珍寶地收藏和不斷炫耀傳頌。因此，那年代的臺灣社會的確有著一抹武俠小說世界也似的身影，人也會武俠中人也似的行動，有秘本，有畢生獨門絕藝，有遠方傳說中的高人……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>臺灣如此，香港社會何嘗不是如此？的的確確在那個時代，如果你手上有別人沒有的一張兩張唱片，這就是獨門秘訣了；如果你手上有舊本的《辭海》，可以寫出多少文章？那個時代沒有谷歌，沒有維基，沒有人知道你的這些東西到底是從哪裡抄來的，所以「啟蒙學習彷彿得從收拾包袱、告別父母親人、下定決心此去不回頭開始」。這就是武俠小說的開頭。</p>\n\t\t\t<p>好了，唐諾還要提醒我們：「今天來看，成果當然是可疑的而且通常並不划算。」他的意思是說，大仲馬、弗萊明實在不算什麼了不起的作家，或是什麼特別值得學習的對象，在學習、偷抄的時候風險還蠻高的——不是被發現，而是沒有抄到好的東西。</p>\n\t\t\t<p>這裡很關鍵的一件事，就是要告訴我們，在那樣的環境裡，即使是如此封閉，畢竟光是在「江湖」的套路上，一直套、一直套，人們還是會厭煩的。只要逮到機會，還是想要放一點新鮮的東西。</p>\n\t\t\t<p>但這是兩面刃，一面你放進新鮮的東西，就破壞了江湖、武林；另一面你不放新鮮的東西，江湖、武林就在這種套路的寫作中停滯下來，也就慢慢失去了吸引讀者的能力。</p>\n\t\t\t<p>金庸的《鹿鼎記》就是在這樣一個節骨眼出現的。一方面，金庸寫出了不得了的突破；另一方面，當他把歷史元素融合到這種地步，就像古龍，他把江湖系譜都趕出自己的小說外，江湖、武林這個舞臺就被他們兩人拆完了。</p>\n\t\t\t<p>這也是為什麼金庸在他的最後一部小說裡，創作出如此特別的主角韋小寶，因為他必須寫出一個過去的武俠小說從來沒出現過的角色。但寫完了之後，就連金庸自己都沒辦法繼續再寫了。</p>\n\t\t</div>"},{"title":"第三章 《書劍恩仇錄》 歷史武俠的嘗試","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-20\"><span>第三章</span></h6>\n\t\t\t<h1>《書劍恩仇錄》</h1>\n\t\t\t<h4>歷史武俠的嘗試</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer005\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 「如果」傳說是真的……","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-21\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>「如果」傳說<br/>是真的……</h1>\n\t\t\t<p>從傳統武俠小說的標準來看，作為金庸起手式的第一部作品《書劍恩仇錄》，其實已經寫得非常好看。到了《碧血劍》，在小說筆法上又有著飛躍的進步。光是創作出這兩部作品，金庸已算得上是非常稱職的武俠小說作者，甚至可說是第一流的武俠小說家。但這兩部小說後來之所以被忽略，主要原因是自《射鵰英雄傳》之後，金庸在創作上又昇華到了另一個境界。</p>\n\t\t\t<p>毋庸置疑，金庸創作前期的關鍵性成就是「射鵰三部曲」——《射鵰英雄傳》、《神鵰俠侶》及《倚天屠龍記》，讀完這三部曲之後，讀者就覺得《書劍恩仇錄》與《碧血劍》的風格沒有那麼「金庸」了，不是他的招牌著作。三部曲之後，金庸又寫出風格截然不同的《天龍八部》，及至晚期又創作出膾炙人口的《鹿鼎記》。這是就風格而言，劃分金庸的創作特點。</p>\n\t\t\t<p>但重讀《書劍恩仇錄》與《碧血劍》，有其意義。第一，重讀這兩部小說，更容易探討《射鵰英雄傳》前後的金庸風格；《書劍恩仇錄》、《碧血劍》是金庸作為傳統武俠小說作者的作品，到了第三部《射鵰英雄傳》之後，金庸發展出獨特的風格，在武俠小說領域中自成一家之言。第二，雖然在《書劍恩仇錄》、《碧血劍》時期，迷人的金庸風格還未形成，但已經在這兩部小說中出現某些原型。</p>\n\t\t\t<p>在《書劍恩仇錄》裡，金庸最不容輕忽的一個大膽嘗試是——在武俠小說的傳統架構中置入歷史元素。這部小說不只有極其明確的時代背景——清代乾隆朝，更重要的是，金庸在小說的框架中，挑戰、挑釁了明確記載於歷史典籍中的真實人物。乾隆皇帝是小說角色，甚至可以說，小說之所以成立，是以乾隆皇帝的身世傳言作為敘事的核心。海寧陳家也出現在小說中，清朝初年，海寧陳家曾在朝廷佔據重要分量，位居重臣，也牽涉雍正奪嫡的諸多傳言。</p>\n\t\t\t<p>在清朝，皇帝不是最高權力者，上面還有祖宗家法，皇帝必須依照祖宗家法治國。從皇太極以下，祖宗家法規定不立嫡，意味著嫡長子並非必然繼承皇位，而是在多位阿哥們中進行考核。因此，也必然形成諸皇子之間的競爭。康熙在位六十年，他的眾阿哥們在漫長的等待中，沒有人知道誰是下一位繼承者，所以當然會發生各種明爭暗鬥的事情。據史書記載，四子及十四子繼承皇位的呼聲最高，才有「傳位十四子」被篡改成「傳位于四子」的傳言。</p>\n\t\t\t<p>但從史實上來看，這則傳言完全站不住腳，因為清朝所有的詔書都是滿、漢文對照，不可能用同樣的方法來篡改滿文詔書。直到雍正皇帝登基後，開始採取秘密建儲的辦法，生前不公開立皇太子，而是把寫有皇位繼承人的秘密遺詔放置在「正大光明」匾額後面。皇帝駕崩後，取下遺詔，才知道是由哪位皇子繼承皇位。</p>\n\t\t\t<p>回到康熙一朝，皇帝在決定繼承者的同時，也意識到自己已經年邁的事實，同時他的眾多阿哥也已到了壯年的年紀。清朝歷史上，康熙不只長壽，而且精明。這時，皇位競爭的條件就不只在於哪位皇子比較成器，還必須同時衡量皇孫這個重要因素。因此，民間流傳著一則關於皇孫的傳言，尤其海寧人更加熟知，因為其中牽涉到海寧陳家。史料上也的確存在這個巧合：四阿哥胤禛，也就是後來的雍正，他的兒子出生的時候，海寧陳家也誕生了一個女兒。</p>\n\t\t\t<p>傳言是陳家實際上生的是兒子，胤禛得到的是女兒，為了確保自己比其他皇子更早有兒子，胤禛就硬逼著陳家割捨親生子，兩家調換嬰孩，而陳家的這個兒子就是日後的乾隆。所以，乾隆是漢人，而且是海寧陳家的後人。《書劍恩仇錄》的寫作素材擷取自這段歷史傳說，小說的核心不是武俠故事，而是歷史事件。其敘事方式，是以「如果」（what if）穿插小說架構：如果這個傳說是真的，乾隆的確是漢人、是海寧陳家的後人，接下來會發生什麼情況？金庸借由懸疑的傳說來佈局小說情節，鋪陳出奇特的安排。</p>\n\t\t\t<p>乾隆這個角色具有強烈的戲劇性，他後來得知自己是海寧陳家的後人，暗中去祭拜親生母親的墳墓，在那裡遇到他的親兄弟陳家洛。可是此時的陳家洛是紅花會總舵主，紅花會是反清復明的組織，兄弟倆各自身分的差異強化了小說的戲劇性衝突。兄長是清廷皇帝，而弟弟的事業是推翻清廷，於是兄弟之間的血緣問題，擴張成了朝廷與紅花會之間的關係，也就是滿、漢民族的對立。</p>\n\t\t\t<p>首先，這個設定極為大膽，因為這是歷史上的大假設，極為難寫。其次，必須追究，為什麼沒有其他作者也用同樣的方式寫武俠小說？這是金庸的自信，因為他長期浸淫在中國傳統典籍當中，精通傳統士人、文人所熟稔的知識學問。《射鵰英雄傳》裡的黃蓉為什麼那麼有趣？原因就在於金庸把近世以降的文人文化寫到了黃蓉身上。可是那只是小趣味，還有更大的背景，他沒有將之寫在任何角色身上，而是寫在武俠小說的架構中——從一開始創作《書劍恩仇錄》與《碧血劍》，他就構思了大的設計，在小說中寫翻案歷史。</p>\n\t\t</div>"},{"title":"02 考據學的繼承者","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-22\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>考據學的<br/>繼承者</h1>\n\t\t\t<p>金庸小說結集成冊的時候，還包含了注釋與附錄。世上哪有武俠小說有注釋、附錄？這些注釋、附錄都是針對武俠小說當中的虛構部分，或是金庸參用的史料、典籍記載，進行考據與對照。讀到後來，你可以察覺到金庸在歷史考據方面的癖好。例如，《碧血劍》後面附上〈袁崇煥評傳〉，來自金庸梳理袁崇煥生平史料的感觸；《射鵰英雄傳》附有〈成吉思汗家族〉。這些說明了金庸本人特別的來歷，即作為海寧查家的後人。位於浙江海寧如錢家、查家，都擁有最關鍵的知識學問——清朝的正統考據學。</p>\n\t\t\t<p>是的，金庸不只是報人、武俠小說家，其實還是考據學傳統的繼承者。雖然他不是正式承繼了這種知識系統，可是他擺脫不了考據學帶給他的深刻影響。高陽也是如此，在這方面的造詣，高陽比金庸更加深厚。考據學主要的工作是對古籍加以整理、校勘、注疏、輯佚，及至清末再擴張下去，演變成「疑古」。高陽學會了這一套本事，發揮在考據掌故小說和筆記小說上，成就了他驚人的學問。</p>\n\t\t\t<p>金庸也將這套方法與歷史知識運用在他的第一部小說中。如果乾隆皇帝是漢人，接下來會發生什麼事？照道理推測，接下來乾隆的漢人弟弟會策動紅花會造反，因為紅花會的宗旨就是推翻清廷。然而意外發現清朝皇帝身上流的不是滿人的血，而是一個貨真價實的漢人，在金庸穿針引線下，紅花會的使命轉移了，這也是小說吸引人的地方。之後的敘事則圍繞在如何藉由兄弟之情，說服乾隆承認自己是漢人，轉而將清廷變成漢人朝廷，如此一來，不用流血就能達成紅花會的使命。</p>\n\t\t\t<p>這是多麼龐大的命題，金庸的第一部小說，已經烙印上後來他其他武俠小說的根本關懷。例如，他就是放不下種族之間的隔閡與對立關係，像《書劍恩仇錄》裡的乾隆，究竟要不要承認自己是漢人？一旦承認，似乎所有難題都會迎刃而解。他的第一部小說的敘事或許相對天真，但顯然種族之間的選擇、政權之間的抉擇，與金庸過去的經驗有密切關係。換句話說，日本入侵中國，切身經歷過戰爭的威脅，對他而言是非常大的衝擊。</p>\n\t\t</div>"},{"title":"03 群戲的能耐","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-23\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>群戲的能耐</h1>\n\t\t\t<p>一九五五年，金庸創作第一部武俠小說《書劍恩仇錄》，我們可以清楚看到幾件事。</p>\n\t\t\t<p>首先，雖然他才剛初試啼聲，但對於書寫武俠題材已經非常熟練，不需要經過練習。我們沒有看到那種非常生澀、像習作一樣拙劣的內容。從一開始，金庸就已經擁有最基本的技能，尤其是如何佈局，如何利用連載的邏輯將小說一環一環地扣住，同時儘量延續連載的長度。</p>\n\t\t\t<p>例如，雖然《書劍恩仇錄》的主角是陳家洛，不過陳家洛這個人在小說裡第一次出現，是從別人口中提到的，說有這麼一位少舵主，他不接受義父遺命，不願意總領會務。等到陳家洛真正現身的時候，仍然只是一個過場。紅花會的人紛紛敦請陳家洛出任總舵主，陳家洛沒有任何明顯行動，只是接受了總舵主這個身分。</p>\n\t\t\t<p>他在小說裡真正成為一個重要角色，已經是小說進行到八分之一的時候了。那麼前面呢？都是各種不同線索的鋪陳——從隱居的陸菲青和他的女徒弟李沅芷說起，接下來引出關東六魔，接著再安排文泰來受傷、鐵膽莊遭圍攻等。金庸非常嫺熟於勾連這些旁支人物。</p>\n\t\t\t<p>其次是酣暢淋漓地描寫武打場面，從中牽扯出各門各派之間的糾葛，同時非常精細地呈現各幫會、門派的特質。例如陸菲青，一出場先是內家拳術，又是柔雲劍法，完全傳承了武當派的武功。這是金庸依循傳統武俠、江湖的系譜去創作的。</p>\n\t\t\t<p>另外，金庸最在行的本事就是寫群戲，以及開展出諸多配角與支線的故事。比如其中一條線，是四當家文泰來和他妻子駱冰的鰜鰈情深，文泰來身受重傷，駱冰死命保護丈夫。從這條故事線勾連出去，是十四弟余魚同暗戀駱冰，一度感情失控，雖然並未真正侵犯她，但自此之後深感愧疚。再從這個支線埋藏伏筆，描述小說人物內在心理狀態，後來每當余魚同出現，金庸就會強調這個角色的心理陰影。</p>\n\t\t\t<p>還有鐵膽莊莊主周仲英戲劇性的家庭悲劇——唯一的獨子死了，妻子又離家出走，而後女兒周綺與紅花會七當家徐天宏發展出曖昧情愫。金庸在寫男女之情時也很細膩。他不寫一見鍾情式的愛情關係，而是讓周綺與徐天宏一開始彼此看不順眼，直到患難相處後，才有了逆轉而互生好感。</p>\n\t\t\t<p>金庸寫《書劍恩仇錄》的成就，在於創造了精彩至極的群戲，而不是一般武俠小說家擅長的主角戲。小說裡設定的幾幕最高潮的場景，都是群戲。例如西湖邊，陳家洛與乾隆兩次相會。第一次，乾隆以東方耳的名字與陳家洛初見交談。第二次，陳家洛已經知道東方耳的真實身分就是乾隆皇帝，便邀他湖上賞月、共謀一醉。陳家洛帶著整個幫會在湖邊等乾隆赴會，乾隆身邊也是跟著一票人，「西湖邊上每一處都隱伏了御林軍各營軍士，旗營、水師，李可秀的親兵又佈置在外，一層一層的將西湖圍了起來。」這個場景在其他武俠小說看不到，它最特別的地方是「組織對組織」的排場，一邊是清軍，另一邊是陳家洛領頭的紅花會，兩方各召集大隊人馬在湖心相會，最後是紅花會在武技和埋伏上勝過了御林軍。</p>\n\t\t\t<p>然後再有第三次相會，陳家洛回到海寧老家，又遇到了乾隆，間接揭曉了乾隆的身世之謎。再往下，故事的核心越來越明顯，原來小說前半部寫營救文泰來，就是因為文泰來知曉乾隆的身世之秘，待乾隆出現之後，轉而就寫紅花會如何挾持皇帝。陳家洛要乾隆同意反滿復漢，把滿洲人驅逐出去，但相應的有一個條件——陳家洛必須取得已故總舵主放在回部的幾樣東西，也就是乾隆的出身證據。小說場景由此又再一變。</p>\n\t\t</div>"},{"title":"04 突破時代禁忌的兩性關係描寫","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-24\"><span>0</span><span>4</span></h6>\n\t\t\t<h1>突破時代禁忌的<br/>兩性關係描寫</h1>\n\t\t\t<p>乾隆和陳家洛在六和塔談判的時候，突然之間「天山雙鷹」現身攻塔，整部小說的故事線也轉向天山。在回疆，出現了一段有趣的插曲，那就是李沅芷癡戀余魚同。</p>\n\t\t\t<p>在金庸的筆下，李沅芷又聰明又調皮，她的癡戀有一部分就來自她這種愛捉弄人的個性。但金庸的琢磨不止於此，他讓李沅芷這個角色主動地追求余魚同。到了回疆古城那一段，眾人在古城遇到了大仇人張召重，這時李沅芷假意被張召重擒住，用計把張召重困在迷城裡。在通往張召重藏身處的路上，她沿途做了記號，只有她能找到他，想用這種法子策動所有人完成她的心願。這是了不起的計謀。</p>\n\t\t\t<p>她拋下張召重，重新與群豪會合，所有人都覺得怪怪的，李沅芷怎會毫髮無傷地逃出來，而且言語和行動中都有很多破綻。回部智者阿凡提一想就點出了關鍵：「明路就在他（余魚同）身上。」</p>\n\t\t\t<p>大家試著探問，李沅芷的藉口卻是，我失魂落魄，什麼都忘記了。這個時候，駱冰在李沅芷的耳邊低聲說：「你的心事我都明白，只要你幫我們這個大忙，大夥兒一定也幫你完成心願。」然後就拉余魚同到旁邊說了好一陣子話。余魚同本來頗見為難，後來下了決心：「好，為了給恩師報仇，我什麼都肯。」</p>\n\t\t\t<p>余魚同怎麼跟李沅芷說的？他說：「張召重那奸賊害死我恩師，只要有誰能助我報仇，我就是一生給他做牛做馬，也仍是感他大德。」李沅芷當然不領情，把他給罵跑了。為了讓李沅芷心甘情願帶路，駱冰只好以言語相激，要請出她的師父陸菲青。伶牙俐齒的李沅芷忙說：「女子要三從四德，這三從中可沒『從師』那一條。」</p>\n\t\t\t<p>到了這個時候，駱冰終於想到了辦法，李沅芷說「三從四德」，是要從誰呢？當然不會是遠在杭州的父親李將軍，那只有一條路，如果她成了親，「丈夫叫她領路，她一定既嫁從夫了。」這一語點醒了陸菲青，就請天池怪俠袁士霄當男方大媒，天山雙鷹任女方大媒，余魚同當場用半截金笛下定，終於圓滿了李沅芷癡戀余魚同的心事。</p>\n\t\t\t<p>金庸非常擅長寫這類的癡戀故事，在他的小說裡，會一而再、再而三地運用並翻轉這樣的故事和角色。例如，鐵膽莊莊主的女兒周綺，一開始在所有的紅花會群豪中，最受不了、最看不順眼的就是徐天宏，最後卻在金庸筆下，發展成一對個性互補的歡喜冤家。</p>\n\t\t\t<p>這是金庸的特殊本事，他寫的愛情相對是細膩的。除了武林的故事，他的愛情觀往往是另一條故事的主軸。從《書劍恩仇錄》開始，金庸就毫無保留地在小說裡刻畫女性角色，以及她們的內心與情感。李沅芷可以說是金庸小說的女性角色中最早的一個原型。</p>\n\t\t\t<p>當然用今天的眼光看，在描寫兩性關係時，這階段的金庸還是比較保守的。</p>\n\t\t\t<p>例如在《射鵰英雄傳》裡，郭靖和黃蓉兩人朝夕相伴，甚至在牛家村密室中七天七夜雙掌相抵，這樣的兩人還不明瞭什麼是男女的肉體關係。及至一燈大師替黃蓉治病，訴說周伯通和瑛姑之間的孽緣，黃蓉也不懂什麼是夫婦之事，什麼是肌膚相親，也不明白劉貴妃（瑛姑）怎麼會懷上了周伯通的骨肉。</p>\n\t\t\t<p>不過，金庸這一部分的保守，到了《神鵰俠侶》又有重大的突破，要藉由這種男女的肉體關係，來刻畫小龍女心境上激烈的轉變。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>她黑夜視物如同白晝，此時竟然不見一物，原來雙眼被人用布蒙住了，隨覺有人張臂抱住了自己。這人相抱之時，初時極為膽怯，後來漸漸放肆，漸漸大膽。小龍女驚駭無已，欲待張口而呼，苦於口舌難動，但覺那人以口相就，親吻自己臉頰。她初時只道是歐陽鋒忽施強暴，但與那人面龐相觸之際，卻覺他臉上光滑，決非歐陽鋒的滿臉虬髯。她心中一蕩，驚懼漸去，情欲暗生，心想原來楊過這孩子卻來戲我。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>從這一段開始，到了創作最後，就有了《鹿鼎記》中韋小寶與七女同床的這種戲碼，韋小寶低聲哼著〈十八摸〉，胡天胡帝，徹底突破了保守的尺度。</p>\n\t\t</div>"},{"title":"05 武功的限制在哪裡？","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-25\"><span>0</span><span>5</span></h6>\n\t\t\t<h1>武功的限制<br/>在哪裡？</h1>\n\t\t\t<p>除了人物之間的感情關係之外，在《書劍恩仇錄》陳家洛遠赴天山的場景裡，金庸還寫出了一種異域情調，鋪設了超越世俗環境的懸疑情節——狼群的出現。</p>\n\t\t\t<p>其他的武俠小說基本上不會這樣反覆描寫狼群，而在金庸的寫法裡，狼群的出現在於強調：這些所謂有武功的人，他們運用武功的限制在哪裡？這是他特別的用意——你再怎麼武藝超群，一旦身陷狼群，很難不被群狼給吞噬。</p>\n\t\t\t<p>關東三魔用兵刃打死了十多頭狼，仍然難敵群狼猛撲，只好跳到樹上去躲避。小說中的大反派張召重悲慘的死法，就是被余魚同扔進沙城的惡狼群中。張召重武功再高，一旦身陷狼群當中，一點辦法都沒有。</p>\n\t\t\t<p>所以，大自然是武林的一道限制。金庸善用武林的限制，對比出絕世武功並不是始終無往不利的。武俠小說裡的人物，如果武功太高、太強，他們就不會碰到困境，不會遇到挑戰，小說就很難寫了。</p>\n\t\t\t<p>武俠人物除了無法逃避大自然的限制和威脅，在千軍萬馬面前，也會無能為力。</p>\n\t\t\t<p>《書劍恩仇錄》裡，我們看到陳家洛和紅花會群雄到了回疆，其中一次極大的危難，就是被兆惠所帶領的軍隊包圍。這段情節的用意也在探討武功的限制，武林高手還是無法戰勝正規軍隊。讀到此處，讀者也許會有些悵然若失，原來再厲害的武功也無法每次都創造奇蹟。這是金庸把武俠小說從傳奇拉回到現實的一面。</p>\n\t\t\t<p>回到前述平江不肖生的武林、江湖系統。武林、江湖是平行於俗世之外的隱性世界，這個世界自有其生存邏輯，以及恩怨情仇。江湖的這種特質，可以說是武俠小說作者和讀者之間的一種自我保護意識，意味著真實的世界和江湖是不隨便交集的，只有倒楣的少數人才會遊走在俗世和武林之間。最典型、最常見的角色，就是客棧的店小二。</p>\n\t\t\t<p>即使是擁有一身好武藝，這些武林人士還是需要填飽肚子，他們經常在客店裡一言不合，就要動武交手。倒楣的常常都是店小二，在混戰當中要嘛被戲弄，要嘛被打傷，甚至不幸身亡。店小二就是不慎闖到武林之中，被牽連在江湖紛爭裡的少數人。</p>\n\t\t\t<p>除此之外，超現實的武林不會任意和俗世有交會。二十世紀中葉時，武俠小說如此盛行，就是因為閱讀小說的同時，得以暫時逃避、擱置現實。</p>\n\t\t\t<p>可是金庸一開始就對這樣的武俠世界通則不滿意，所以在創作《書劍恩仇錄》時，不僅捨棄了江湖和俗世平行的狀態，更利用武俠世界作為背景，寫正史出現過的人物。如此一來，真實存在過的歷史，就和江湖、武林相交接，兩個世界有了連結。</p>\n\t\t\t<p>金庸的用意是要超越傳統武俠小說的寫作範圍，這和他自己的身世，和他流亡時的逃難經驗有極大的關係。他寫武俠小說，並沒有天真地逃避現實，因為他自己也逃不過戰爭曾經帶給他的那種威脅感。</p>\n\t\t\t<p>江湖裡的俠客，他們也沒有辦法輕鬆地越過戰爭的壕溝。真正的戰事爆發，武林終究會被無情的戰火轟碎。</p>\n\t\t\t<p>《碧血劍》裡也有一段類似的描述，那是闖王李自成攻佔北京後，即使袁承志武功再高強，仍然無法挽救自己所支持的政權，只能眼睜睜看著它墮落、腐敗，只能徒呼負負，多麼令人悵惘。</p>\n\t\t\t<p>這樣的主題出現在袁承志身上，也出現在陳家洛的困境之中。他在回疆被兆惠的鐵甲軍包圍，這就不是比武功了，而是完全不一樣的鬥爭。最後還是要依靠霍青桐，帶著回族部落的旗軍，以軍隊對軍隊，才能夠打敗兆惠。金庸在小說框架中，以主角的困境與無能為力，凸顯了戰爭歸戰爭，武林歸武林。</p>\n\t\t\t<p>戰爭的面相也一而再、再而三地出現在金庸的小說裡。</p>\n\t\t\t<p>《射鵰英雄傳》存在著兩條故事線，一條是武俠小說的傳統敘事，就是要爭奪《九陰真經》，那是武林的至高秘笈；還有另外一條，就是爭奪《武穆遺書》，那是岳飛所留下的兵書。</p>\n\t\t\t<p>在小說最後，郭靖、黃蓉名震江湖，所向披靡，武功的造詣又到了出神入化的地步，這個時候就意味著，作者很難在這兩個角色上，繼續安排讓人膽戰心驚的危難情節。於是，金庸一方面安排郭靖、黃蓉去守襄陽城；另一方面，從《射鵰英雄傳》到《神鵰俠侶》，敘事主軸就從郭靖、黃蓉身上移開了，讓楊過取而代之。</p>\n\t\t\t<p>郭靖的成就，是由《九陰真經》、《武穆遺書》這兩部書一起造就的。兩軍交接的時候，《九陰真經》就無用武之地，必須靠著《武穆遺書》的兵法指點，才能夠度過難關。</p>\n\t\t\t<p>金庸的第一部武俠小說《書劍恩仇錄》，可以幫助我們看到金庸小說創新與突破的幾個面向。</p>\n\t\t</div>"},{"title":"06 少林寺最難過的關","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-26\"><span>0</span><span>6</span></h6>\n\t\t\t<h1>少林寺<br/>最難過的關</h1>\n\t\t\t<p>在《書劍恩仇錄》裡，故事的主軸線是繞著陳家洛的，他從回疆返回中原便前往少林寺，要去取得乾隆身世的證據。這條故事線依循了中國戲劇的藝術形式及套路，但是金庸仍然在其中運用了獨特的敘事手法。</p>\n\t\t\t<p>少林寺數百年來的慣例是，如果少林弟子違反了清規戒律，情由是不能向外人洩露的。陳家洛遠道而來，要求問他的義父、少林被逐弟子于萬亭的俗世情緣，依照寺規是不允許的，但是少林方丈又明白這件事關係到天下蒼生氣運，所以破了一個例。</p>\n\t\t\t<p>破什麼例？就是叫陳家洛自己到戒持院去取案卷。本來陳家洛以為難題已經解決了，可是周仲英提醒他，不是這麼回事，去到戒持院必須先經過五座殿堂，每一殿都有一位武功高深的大師駐守，要闖過了五殿才可抵達。</p>\n\t\t\t<p>這闖五關的橋段，金庸竟然變換出各式各樣的把戲。每一關要有它的精彩之處，就不能是單純的比武或廝殺。如果作者沒有充分的構思、安排，在寫這樣的段落時，敘事就會變得單調乏味。所以陳家洛連闖五殿，金庸便給每一關都設下了特定的比武規則。</p>\n\t\t\t<p>第一關是妙法殿，比試掌法，最簡單。到了第二殿，駐守的是大癲大師，用他的瘋魔杖把關。到了第三殿就開始有了變化，藏經閣的主座大癡大師笑容可掬地在那裡迎接陳家洛，要跟他比試暗器。</p>\n\t\t\t<p>這裡顯現出金庸和其他傳統武俠小說家在寫作上的區別，他定的比賽規則是這樣的：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>大癡笑道：「你我各守一邊，每邊均有九枝蠟燭，九九八十一炷香，誰先把對方的香燭全部打滅，誰就勝了。這比法不傷和氣。」向殿心拱桌一指道：「袖箭、鐵蓮子、菩提子、飛鏢，各種暗器桌上都有，用完了可以再拿。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>陳家洛本來就擅長暗器，圍棋子就是他的獨門暗器，他的衣囊裡隨時都藏著一把棋子。所以他一起手，就用師父教他的滿天花雨手法，將五顆棋子一把擲出，五炷香應聲而滅。</p>\n\t\t\t<p>大癡大師讚聲連連，然後把頸中一串念珠的繩子扯斷，也拿了五顆念珠打出，打滅了五炷香。不過大癡隨後連揮兩下，把對方的九枝蠟燭先打滅了。燭火一滅，黑暗中香頭火光看得越加清楚，就更容易取準頭。</p>\n\t\t\t<p>陳家洛這時候才領悟，卻太遲了。他連忙打向大癡的那排燭火，棋子卻都在半途被對方擊落，他的用意不但被大癡識破，恍惚間又被大癡乘機打滅了好幾炷香。一時之間，陳家洛陷入困境。</p>\n\t\t\t<p>金庸接著寫出精彩的轉折，眼看陳家洛這第三關要闖不過去了，雙方手上的暗器也快用完了。大癡禮讓陳家洛先到桌上拿暗器，陳家洛突發奇想，一下子把桌上所有的暗器一掃而空，全部收到自己的衣襟裡。輪到大癡要來拿，一摸桌上卻什麼暗器都沒有了。</p>\n\t\t\t<p>憑藉著這種急中生智，陳家洛有驚無險過了第三關，沒有落入比武的俗套。</p>\n\t\t\t<p>第四殿是達摩院首座天鏡禪師，陳家洛靠著在玉峯迷城中學到的奇異掌法，僥倖對拆了數十招而過關。最有趣的是最後一關，是由少林方丈天虹禪師坐鎮。陳家洛心想，第四關的天鏡已如此厲害，天虹是少林寺第一高手，怎麼能敵得過？再看這間靜室的空間窄小，不可能比拳腳暗器，多半要比內功，那就更加沒有取巧的餘地了。陳家洛驚疑未定，天虹禪師要他坐下後，竟然開始講起故事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>天虹禪師沉吟了一會，道：「從前有一人善於牧羊，以至豪富，可是這人生性慳吝，不肯用錢……有一人很是狡詐，知他愚魯，而且極想娶妻，就騙他道：『我知道有一女子十分美貌，替你娶做妻子吧。』牧羊人很是喜歡，給了他許多財物。過了一年，那人又道：『你妻子已給你生了一個兒子。』牧羊人從未見過妻子，但聽說已生兒子，更加高興，又給了他許多財物。後來那人又道：『你兒子已經死啦！』牧羊人大哭不已，萬分悲傷。」陳家洛頗務雜學，聽他說到這裡，已知是引述佛家宣講大乘法的《百喻經》。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>天虹禪師的意思是說：世上的事不都這樣嗎？皇位、富貴，就像那牧羊人的妻子與兒子，都是虛幻的，你為什麼還要一直掛在心上，費力以求？得了就覺得歡喜，失了就覺得悲傷？你是不是也在追求這些虛幻的東西？</p>\n\t\t\t<p>陳家洛聽了，也說了個故事，同樣引用《百喻經》：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>陳家洛道：「從前有一對夫婦，有三個餅。每人各吃了一個，剩下一個。兩人約定，誰先說話，誰就沒餅吃。……兩人僵住了不說話。不久有一個賊進來，把他們家裡的財物拿走了。夫婦倆因有約在先，眼睜睜的瞧著不說話。那賊見他們如此，大了膽子，就在丈夫面前侵犯他的妻子。丈夫仍然不理。妻子忍不住叫了起來。賊人拿了財物逃走了。那丈夫拍手笑道：『好啊，你輸啦，餅歸我吃。』」天虹禪師本來就知這故事，但聽到此處，也不禁微笑。陳家洛道：「為了一點小小的安閒享樂，反而忘卻了大苦。為了口腹之欲，卻不理會賊子搶己財物，侵犯自己親人。佛家當普渡眾生，不能忍心專顧一己。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>聽了陳家洛的回應，天虹再說一個故事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>天虹道：「從前有個老婆婆，臥在樹下休息，忽有大熊要來吃她。老婆婆繞樹奔逃，大熊伸掌至樹後抓拿，老婆婆乘機把大熊兩隻前掌捺在樹幹之上，熊就不能動了，但老婆婆也不敢放手。後來有一人經過，老婆婆請他幫忙，一同殺熊分肉。那人信了，按住熊掌。老婆婆脫身遠逃，那人反而為熊所困，無法脫身。」陳家洛知他寓意，說道：「救人危難，奮不顧身，雖受牽累，終無所悔。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>於是天虹拂塵一舉，讓陳家洛進了戒持院，算是過了第五關。這第五關不比武功，比的是講故事，以及藉由故事來顯現自己的心意。這當然不是傳統武俠小說的寫法。金庸雖是抄書，但他抄得真高明。這種閱讀上的小趣味也是金庸小說的迷人之處，因為超越了讀者的預期。</p>\n\t\t\t<p>陳家洛就這樣通過五殿的考驗，取回可以證明乾隆身世的證據。</p>\n\t\t</div>"},{"title":"07 失敗的故事是令人回味的","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-27\"><span>0</span><span>7</span></h6>\n\t\t\t<h1>失敗的故事<br/>是令人回味的</h1>\n\t\t\t<p>故事發展到這裡，似乎進入越難收拾的階段。《書劍恩仇錄》的敘事主軸，就是陳家洛要讓乾隆知道自己是漢人，以及如果乾隆確信自己是漢人，他會怎麼做？</p>\n\t\t\t<p>陳家洛和紅花會的英雄們，闖過一個接一個難關，完成了乾隆皇帝的請求。再下來要怎麼寫？若要符合歷史，紅花會最終的結局必然是失敗的，而這個失敗的結局，絕對無法取悅讀者，因為讀者在閱讀過程中很容易將自身的得失投射在主角身上。</p>\n\t\t\t<p>金庸一心一意要寫歷史武俠小說，然而，當歷史事實注定得讓主角陳家洛吞下敗果，那小說該如何收場？於是只好讓皇太后發現這件事，再去威脅乾隆，不但分散他的兵權，還搬出雍正的秘密遺詔。在太后表態之後，乾隆反悔了，把心一狠，決意要誅滅紅花會，推翻了原先和陳家洛的約定。</p>\n\t\t\t<p>接下來呢？乾隆用「反清復明」的興復大業為條件，逼迫陳家洛勸說香香公主入宮為妃，為小說結尾做了鋪陳。在西長安街清真禮拜寺裡，香香公主只能以身殉情，向陳家洛示警：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>對於一個虔信宗教的人，再沒比靈魂永遠沉淪更可怕的了，可是她沒有其他法子。愛情勝過了最大的恐懼。她低聲道：「至神至聖的阿拉，我不是不信你會憐憫我，但是除了用我身上的鮮血之外，沒有別的法子可以教他逃避危難。」於是從衣袖中摸出短劍，在身子下面的磚塊上劃了「不可相信皇帝」幾個字，輕輕叫了兩聲：「大哥！」將短劍刺進了那世上最純潔最美麗的胸膛。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小說最後，紅花會算是慘勝，只不過全身而退。故事戛然而止，陳家洛一路的努力，最後無法說服乾隆，無法將乾隆變成漢人皇帝。</p>\n\t\t\t<p>《書劍恩仇錄》寫完，很快又創作第二部《碧血劍》，金庸進步神速，顯然已經瞭解他在《書劍恩仇錄》所犯的毛病。</p>\n\t\t\t<p>其中一個毛病是，他太在意連載的形式，在小說開頭設置了多條線頭，以至於過了八分之一的篇幅，主角和主線才浮現。另一個毛病是，主角陳家洛是一個沒有武功來歷的人，他正式登場的時候，已經身懷絕技，緊接著就擔任紅花會總舵主。金庸沒有用「傳」的寫法來鋪述陳家洛的來歷。</p>\n\t\t\t<p>前一章提過，平江不肖生在武俠寫作上的重大貢獻，就是用史書的紀傳體形式，為每一個本來是虛構的武俠人物都描寫了身世。介紹一個角色，一定要從他的籍貫講起，包括他的祖輩、父母親是誰，他的家世背景如何，更關鍵的是，他的功夫來自何門何派，這是固定的寫法。陳家洛缺乏這樣的來歷，我們也就不容易對陳家洛留下像後來金庸小說其他主角的那種深刻印象。</p>\n\t\t\t<p>在寫《碧血劍》時，金庸立刻修正了這個缺點，讓主角袁承志及其他角色在小說中都有了來歷。相較之下，《碧血劍》的寫作技巧比《書劍恩仇錄》要成熟。</p>\n\t\t\t<p>不過，作為金庸的起手式，《書劍恩仇錄》突破了傳統武俠小說的寫作模式，開創了新的敘事手法，是一個不俗的起點。</p>\n\t\t</div>"},{"title":"第四章 《碧血劍》 復仇與抉擇","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-28\"><span>第四章</span></h6>\n\t\t\t<h1>《碧血劍》</h1>\n\t\t\t<h4>復仇與抉擇</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer006\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 複式的時間敘事","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-29\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>複式的<br/>時間敘事</h1>\n\t\t\t<p>金庸在《書劍恩仇錄》中處理了大的歷史問題，到了第二部《碧血劍》，他非但沒有收束，反而構思了一個更大的歷史命題。他把時代往前推，推到一六四四年明朝滅亡的關鍵時刻。同樣的，不只有確切的時代背景，小說中還有極重要的歷史人物，那是名將袁崇煥。但袁崇煥並未真正登場，而是由他的兒子袁承志代父上場。小說從袁崇煥的遭遇開始設置伏筆，讓袁承志作為小說主角，從他的身世開始敘事。</p>\n\t\t\t<p>《書劍恩仇錄》的敘事，可以歸類為一種直線的時間。從開場陸菲青的現身一直到結尾香香公主的墳塚，小說維持在同一方向的線性敘事，時間是一直往前走的。但是到了《碧血劍》，開始出現複式時間的敘事，為了方便描述各個角色的不同來歷。換句話說，金庸在他的第二部小說，開始學會了如何鋪陳小說的主軸，讓情節一環扣一環，持續地吊住讀者的胃口。</p>\n\t\t\t<p>一般來說，最先出場的角色通常都不是重要人物，而是藉著這些角色勾連出關鍵的情節，在高潮迭起的故事中，陸續上場的武俠人物功夫越來越高，藉以符合讀者越來越高的期待。《碧血劍》等於是回頭套用了傳統武俠小說的寫作模式，只是金庸寫得更加精緻。</p>\n\t\t\t<p>到了修訂版，金庸先從張朝唐開始寫起。張朝唐是個從海外歸來的華人，從張朝唐遇差匪引出仗義鏢頭楊鵬舉，再從楊鵬舉引出一個讓讀者覺得神秘又好奇的情節——他們逃到山間農舍躲藏寄住，卻偷窺到恐怖的血案。接著糊里糊塗跟著人上了聖峯嶂，這個時候孫仲壽上場，孫仲壽是《明史》裡有傳、確實存在過的歷史人物。由孫仲壽又引出了袁崇煥過去的部將，他們都要上山去祭拜袁崇煥，最後再引出袁崇煥的遺子袁承志。</p>\n\t\t\t<p>釐清了小說原來是要寫袁崇煥的兒子袁承志，接下來的情節就要解釋，袁承志如何從將軍之子變成身懷絕技的武林人物。袁承志的第一個師父是崔秋山，接著崔秋山把他交托給安大娘，安大娘又把他交給華山派掌門穆人清。袁承志跟穆人清學武的時候，又遇到了木桑道人。木桑道人不是他正式的師父，教他武藝是為了要袁承志陪他下棋，但這些功夫後來在臨敵時非常有用。袁承志之後又有一段奇遇，成了金蛇郎君的隔世弟子。</p>\n\t\t\t<p>這就是一種複式時間的敘述，不像《書劍恩仇錄》著力於發展多條支線，而是從一個故事主軸分枝出小說中的各色人物。這些人物又各有回憶，藉此去追溯他們到底發生了什麼故事。比如小說裡讓安大娘重新出現，就是借這個機會去追溯安大娘的過往，原來她有個投身錦衣衛的丈夫安劍通。又比如穆人清這個角色帶出了華山派的系譜和眾弟子，並牽連到木桑道人。</p>\n\t\t\t<p>在《碧血劍》裡，另一個重要的線索是金蛇郎君，與他有關的情節幾乎佔了全書三分之一的篇幅，有著非常複雜的身分來歷。十三歲的袁承志在華山絕壁的洞穴裡，發現了已經成為一副骷髏的金蛇郎君夏雪宜，得到了鐵盒中的《金蛇秘笈》。金蛇郎君跨越時空，成為袁承志絕世武功的最後一塊拼圖。</p>\n\t\t\t<p>承繼了金蛇郎君的武功、金蛇劍和重寶地圖，袁承志藝成下山，這是小說的前半部。我們徹底瞭解了袁承志的出身和武功來歷。</p>\n\t\t\t<p>袁承志下山之後，遇到闖王身邊的李岩，又再牽涉一樁奇異的黃金搶劫案，小說女主角溫青青出現了，後來我們知道她是金蛇郎君和溫儀的女兒。</p>\n\t\t\t<p>金庸在《碧血劍》裡的角色塑造方式，和《書劍恩仇錄》有著很明顯的不同。這個時候，金庸為了讓故事主軸更吸引讀者，開始磨練他最重要的功夫，那就是：如何讓角色藉由不同的個性，給讀者留下鮮明的形象。</p>\n\t\t\t<p>金庸最早的兩部小說經常被忽略，但是回到他的創作原點，可以清楚發現他在創作技巧更迭上的線索與痕跡，對於我們體會、認知金庸完整的武俠世界，具有重大意義。</p>\n\t\t</div>"},{"title":"02 復仇故事裡的現實投射","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-30\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>復仇故事裡的<br/>現實投射</h1>\n\t\t\t<p>第二章提及，連載小說的祖師爺是大仲馬的經典復仇故事《基度山恩仇記》。讀者對復仇的故事容易有感，遲來的正義（belated justice）讀來最酣暢淋漓，也大快人心。雖然正義被延遲實現，但在這過程中，讀者總是期待正義開花結果，並在「善惡到頭終有報」的結尾得到滿足。正義雖然晚來，但不是等不到，這是復仇故事最扣人心弦之處。</p>\n\t\t\t<p>《碧血劍》的定位就是袁承志的復仇故事。在史實上，袁承志有兩個大仇人。</p>\n\t\t\t<p>第一，崇禎皇帝下令誅殺袁崇煥，是殺死他父親的直接仇人，而且金庸還添加了一筆不共戴天之仇，讓袁承志長大後，得知他父親臨死時的慘狀；袁崇煥是以叛國罪名受凌遲之刑，當時滿人迫近明朝北境，很多老百姓恨之入骨，當場生咬他的肉，以致屍骨不全。</p>\n\t\t\t<p>第二，袁崇煥被冤罪磔殺，最主要原因是他力抗後金（大清），所以滿洲人是袁承志的第二仇人。袁崇煥抗清這段歷史，《清史稿》和《明史》的說法不一。儘管清人後來修纂《明史》時，重修了這段記載，但仍留下不少原本史料的記錄。當時盛傳，是清軍使了反間計，讓明廷以為袁崇煥與清軍有密約，煽動崇禎皇帝殺了袁崇煥這顆滿人的眼中釘。</p>\n\t\t\t<p>袁承志同時面對兩大仇人，立場艱難。在此種歷史情境下，金庸鋌而走險，讓袁承志轉而支持闖王李自成，以他的絕世武功協助李自成攻入北京城。</p>\n\t\t\t<p>明朝究竟是如何滅亡的？後來一直存在著爭議。尤其在清初，許多士人心中認定兩個答案，但這兩個答案無法並存，其中牽涉到明朝遺民，包括士大夫對待清廷的態度。一個答案是，明朝亡於滿人入關。另一個答案則是大部分遺民的理性思考，認為明朝並非亡於清廷，而是亡於流寇。首先，攻破北京城的是闖王李自成，他搶走了陳圓圓，吳三桂「衝冠一怒為紅顏」，打開山海關投降大清，滿人的軍隊這才進入北京城，趕走李自成。吳三桂領清兵入關，名義上是借兵為崇禎復仇，然而一旦入關，滿人就賴著不走了，順理成章遷居中原。</p>\n\t\t\t<p>這些歷史進程都被金庸寫進了《碧血劍》。在這部歷史小說中，金庸以極長的篇幅描寫袁承志如何遙奉闖王，認同李自成的理想，及至他如何暗領李自成號令，也和李自成手下部屬有不少來往，最後打開彰義門迎闖軍。闖軍入京，袁承志報了第一個大仇，崇禎皇帝上吊自盡，根本不需要他親自動手。但他還有第二個仇人，卻沒有辦法報仇，這是小說受限於史實的地方。李自成入主北京之後，不聽李岩等人的忠告，軍紀迅速敗壞，這讓袁承志非常失望。</p>\n\t\t\t<p>《碧血劍》剛開始的設定是雙重復仇故事，但滿清入關、闖軍腐敗，袁承志無法掌控接下來的時局變化，沒有機會徹底完成他的復仇。由於復仇無望，主角心灰意冷，只好隱居到南方海島。</p>\n\t\t\t<p>《碧血劍》寫於一九五六年，這樣的時代背景不可能不讓人察覺到小說中的歷史現實，有著香港讀者都洞悉的深刻寓意，因為他們之中不少人正是國事難為而流落到此島上的，金庸也成了其中之一。一九五○年，金庸一度到新中國外交部求職未果，成為外交官的希望落了空，他才又返回香港，或許他並不確定——包括所有南來文人在內——自己留在香港的決定是否正確。一九五五年，金庸開始寫武俠小說。</p>\n\t\t\t<p>追索金庸撰寫《碧血劍》的過程，小說的結尾，亦即袁承志最後的抉擇，必然與金庸的處境有密切關連。這個密切關連，不只是金庸本身的處境，也寫出了整個香港社會的共同命運與解答。金庸的春秋筆法並不是那麼隱晦，他寫一群人從鄉野中起家，輾轉獲得百姓的支持及眾多武林志士的加持，千辛萬苦地打進京城，然而一旦佔據權力核心，你讀到的是這個政權的墮落。</p>\n\t\t\t<p>年輕的時候作為金庸的讀者，常會用一種天真的方式讀《碧血劍》。對大部分年輕讀者來說，小說中記憶最深刻的人物、情節，可能是金蛇郎君。沒錯，這個角色墊高了袁承志的武功來歷，也承載了他自己與兩個女子（溫儀、何紅藥）之間的複雜情愫。慶幸的是，到了五十幾歲，我變成了世故的讀者，重新閱讀金庸，讀到的是非常世故的訊息，這是年少時單純把《碧血劍》當作武俠小說來讀所捉摸不到的地方。如果讀不到這些暗藏在小說裡的訊息，也就不太可能明白金庸小說與其他武俠小說的差異何在；同樣都是連載形式，成就卻是雲泥之別。</p>\n\t\t</div>"},{"title":"03 歷史武俠無法擺脫真實「結局」","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-31\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>歷史武俠無法擺脫<br/>真實「結局」</h1>\n\t\t\t<p>金庸第一部小說《書劍恩仇錄》寫陳家洛和紅花會的故事，第二部小說《碧血劍》以袁承志為主角，但兩部小說都遇到了棘手的問題——無法抗拒史實的存在。即使兩部小說都設定了讓讀者好奇的歷史大議題：如果乾隆皇帝是個漢人？如果袁承志報了仇，不但殺死崇禎皇帝，又阻止陷害他父親的滿清政權入侵中原，結果會是如何？只是讀者無須翻到結尾，就已經知道結局了。</p>\n\t\t\t<p>另一方面，由於金庸寫的是武俠小說，面對的是一般大眾讀者，雖然無法扭轉歷史的大脈絡，但是對於他們知之較少的部分，作者可以在小說中盡情發揮。比如可以寫海寧陳家、寫雍正調包，甚至乾隆的虛構兄弟陳家洛，在陌生的歷史內容中添入虛構成分，宛如在歷史推理中發現新大陸，非常過癮。</p>\n\t\t\t<p>不過，一般讀者都曉得乾隆這號人物，作者就沒有辦法改寫乾隆變成漢人皇帝。如果擅改了歷史上的認知，這部小說就不再是類型小說，讀者也很難接受這部作品。類型小說作者和讀者之間有一種默契，作者心中會有一把尺，知道讀者可以容忍虛構內容到什麼程度。如果乾隆成了漢人皇帝，清朝從此不存在了，這就打破了默契，讀者並沒有交付作者如此大的權力。</p>\n\t\t\t<p>金庸的創作起手式，就藝高人膽大地寫歷史武俠小說，超越了一般的通俗小說、類型小說，獨特之處也更加顯著。美國猶太作家菲利普．羅斯（Philip Roth）寫過一本精彩絕倫的歷史小說《反美陰謀》（<span>The Plot Against America</span>），徹底改寫了二戰期間美國一場關鍵的總統大選。一九四○年的美國總統大選，民主黨候選人是違背美國憲政慣例（總統只限兩任）、追求第三任期的羅斯福總統。真實的歷史情況是，在舉國投入戰爭的氣氛瀰漫之下，羅斯福順利連任第三任總統；一九四四年甚至連任第四任期，而死於任期間。</p>\n\t\t\t<p>羅斯在小說中改寫了一九四○年美國總統大選的結果，讓共和黨提名一個奇特的人物——查理斯．林白（Charles Lindbergh），他是人類史上第一位駕駛單引擎飛機橫跨大西洋的人，是位傑出的飛行英雄。</p>\n\t\t\t<p>除了創下飛越大西洋的紀錄外，林白這個人也很有故事性。在政治立場上，他是個極右派者，許多美國大富豪都跟他交情匪淺，政商關係良好，後來林白夫妻還經歷了一件慘痛的悲劇。推理女王阿嘉莎．克莉斯蒂（Agatha Christie）曾將這件慘案寫進小說《東方快車謀殺案》裡。小說中破案的關鍵是阿姆斯壯綁架案，就是根據林白長子的綁架案改寫的。有歹徒覬覦林白的龐大財產，闖進林白家中，綁架了他二十個月大的兒子，後來林白雖支付了贖金，兒子仍然慘遭撕票。儘管克莉斯蒂虛構了某些情節，但仍然寫到了一些真實事例。例如小說裡的女傭就是關鍵角色，林白之子綁架案發生後，警方在調查過程中，將這名女傭列為犯罪嫌疑人，懷疑她裡應外合，勾結歹徒犯案。最後這名女傭承受不了壓力而自殺，這件慘案也在一九三二年震驚了全美。</p>\n\t\t\t<p>羅斯在小說《反美陰謀》裡，描述林白競選美國總統，挑戰羅斯福的連任，結果林白成功當選了美國第三十三任總統。林白上任之後，美國社會也徹底轉變，因為林白是個大右派，還是最堅決、最邪惡的反猶主義者。那麼，羅斯挑選林白作為小說主角，他的寫作目的是什麼？正就是「如果」的小說敘事手法：如果那一年，一個反猶主義者當選總統，美國會發生什麼事？當然，作家更關切一件事：如果林白成為總統，當時美國境內的一百二十萬猶太人會遭受什麼樣的命運？</p>\n\t\t\t<p>小說敘事非常精彩，描寫林白如何與希特勒結成聯盟，並且說服美國人民，為了猶太人而向德國宣戰非常不值得；美國人為什麼要為了猶太人犧牲性命，德國真的得罪了美國嗎？小說改寫、反轉了美國這一段歷史。這種敘事筆法，凸顯了美國社會究竟是以何種方式建立起多元文化，尤其揭露了反種族主義、反種族歧視的價值觀成立的真相。在羅斯的筆下，美國社會是多麼脆弱且不堪一擊，只要歷史出現偶然，就會產生不同結果。</p>\n\t\t\t<p>寫歷史小說，不必然不能寫翻案文章。作為小說家，金庸並非不能寫紅花會最後推翻清廷、刺殺乾隆皇帝。但小說家必須遵守一個寫作上的限制——如果寫的是一本類型小說、通俗小說，創作空間就不像菲利普．羅斯寫的現代小說有這麼大的自由空間。這也是金庸所面臨的限制，讀者勢必會覺得武俠小說裡的歷史讀來索然無味。</p>\n\t\t\t<p>《書劍恩仇錄》和《碧血劍》這兩部小說，也許當時的讀者追讀時沒有特殊感受，今日的讀者可能也是如此。但仔細再讀一次，就會察覺到這兩部小說隱含的問題——小說主要情節的設定，到後來都以失敗告終。金庸並沒有滿足廣大讀者的預期，畢竟讀者會期待站在陳家洛、袁承志這一邊，認同他們的理念，希望他們最後可以舉事／復仇成功。讀者在掩卷歎息之餘，該如何面對留下殘念的結局？更重要的是，金庸怎麼看待這兩部作品？</p>\n\t\t\t<p>金庸察覺到寫歷史翻案文章非常棘手。不過，他始終放不下自己對歷史領域的高度興趣。</p>\n\t\t\t<p>到了第三部小說《射鵰英雄傳》，金庸不改歷史作為故事背景的元素，嚴格來說也保留了部分春秋筆法。只是金庸修正了小說中歷史的寫法，稍微收斂了翻案的野心。讀者並沒有看到小說設定要郭靖改變蒙古國的企圖，或是改變蒙古、女真與漢人之間的關係。《射鵰英雄傳》中歷史發揮的作用，與《碧血劍》、《書劍恩仇錄》相比，簡直小巫見大巫。雖然金庸從史料中翻找出成吉思汗邀請丘處機前往漠北的書信，但在小說情節上，即使郭靖、丘處機為大宋出力，也只是稍微改變了不痛不癢的處境，讓蒙古人減少些殺戮，仍然沒有改變宋朝的命運。</p>\n\t\t\t<p>《射鵰英雄傳》之後，金庸接著連載《神鵰俠侶》。此時，小說的歷史背景不再那麼重要，如果把《神鵰俠侶》的故事搬到其他朝代，仍然無礙於小說情節的開展，故事主軸仍然成立。不過，這並不表示金庸放棄寫歷史武俠小說，到了最後一部《鹿鼎記》中，他重新大量運用歷史元素，成功塑造了韋小寶這個奇特的角色。</p>\n\t\t</div>"},{"title":"第五章 《射鵰英雄傳》 俠之大者","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-32\"><span>第五章</span></h6>\n\t\t\t<h1>《射鵰英雄傳》</h1>\n\t\t\t<h4>俠之大者</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer007\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 暗含禁忌的「射鵰英雄」","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-33\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>暗含禁忌的<br/>「射鵰英雄」</h1>\n\t\t\t<p>由於金庸與《大公報》之間的淵源，以及後來自己創辦《明報》，長期以來，金庸就被臺灣當局視為左派報人／文人，他的武俠小說相當長一段時間在臺灣是被查禁的。一直到遠景出版社負責人沈登恩積極爭取將金庸作品解禁，一九七九年，臺灣當局終於以「尚未發現不妥之處」，允許發行金庸小說。解禁之後，《聯合報》副刊便開始連載《連城訣》，遠景出版社也陸續推出金庸小說。</p>\n\t\t\t<p>遠景第一部推出的是《俠客行》，並沒有按照金庸作品的創作順序，而第四部出版的，是大部分人都覺得陌生的書名——《大漠英雄傳》，現在書市上也很難找到蹤跡了。《大漠英雄傳》就是《射鵰英雄傳》。</p>\n\t\t\t<p>《射鵰英雄傳》的書名很有意思。小說主角是郭靖、黃蓉，他們身邊常常帶著兩隻白鵰，遇到危急的時候，也會呼叫白鵰前來解圍。可是郭靖既然從小將白鵰養大，和白鵰之間那樣親密，又怎麼會是射鵰者呢？書名為什麼叫做《射鵰英雄傳》？射鵰的英雄是誰呢？我們大概有兩個答案，一個是比較簡單的，這個射鵰英雄指的就是成吉思汗。但是還有一個稍微複雜一點的答案。</p>\n\t\t\t<p>《射鵰英雄傳》為何改名為《大漠英雄傳》？起因來自毛澤東寫的一闋詞，詞牌名為「沁園春」，詞名為「雪」。依照毛澤東自己所說，這首詞創作於一九三六年二月，作詩的地點在陝北，恰巧是隆冬時節，雨雪紛飛，觸景生情而寫下〈沁園春．雪〉：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>北國風光，千里冰封，萬里雪飄。望長城內外，惟餘莽莽；大河上下，頓失滔滔。山舞銀蛇，原馳蠟象，欲與天公試比高。須晴日，看紅裝素裹，分外妖嬈。</p>\n\t\t\t<p>江山如此多嬌，引無數英雄競折腰。惜秦皇漢武，略輸文采；唐宗宋祖，稍遜風騷。一代天驕，成吉思汗，只識彎弓射大鵰。俱往矣，數風流人物，還看今朝。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這闋詞說，在北國冬天冰封的情景下，舉目所及，看不見任何草木，廣闊的黃河上下也頓失滔滔水勢。作者以「山舞銀蛇」、「原馳蠟象」寫冬日的奇幻美景，由於冬季雪勢，綿延的山脈像是一條會動的銀蛇；高原大地上鋪了一堆一堆的雪，像極了一墩一墩蠟做的大象。等到放晴日，素白的雪色反映出紅光，看來分外妖嬈。轉折至下闋，就從自然講到歷史。江山何等美好，才吸引如此多的英豪前來爭奪，秦始皇、漢武帝都是英雄，可惜文采不足，唐太宗、宋高祖則不夠瀟灑。成吉思汗堪稱一代天驕，在武功上也不過會彎弓射鵰。這些都是過去的歷史人物，江山還有待今朝的能人志士。</p>\n\t\t\t<p>這闋詞口氣豪放，作者在詞裡清楚地提醒著：在這樣的時代，我們需要什麼樣的領導者？需要什麼樣的英雄？毛澤東刻意凸顯了自己的個性及優點：在北國荒涼的情境下，他都不可能氣餒，一方面他看到現實處境如此嚴酷，但另一方面仍能夠自得其樂，看到和欣賞天地的美。詞裡有一種昂揚的氣概，覺得處在這樣一個時代，他可以指點江山，評論過去曾建立過最了不起功業的人。這是他的氣魄，這是他的高度。</p>\n\t\t\t<p>一九五七年，金庸開始提筆寫《射鵰英雄傳》，連載時定下小說名為「射鵰英雄傳」。不只是金庸的讀者，當時所有人都知道書名在影射什麼。</p>\n\t\t\t<p>小說被查禁的另外一個原因，在於小說中的一段情節，描寫的是郭靖與黃蓉結伴而遊的小樂趣。黃蓉生長於桃花島，她精通水性，經常在海裡游水，就想著教郭靖游泳。此時的郭靖內力深厚，熟習換氣吐納功夫，很快便學會游泳，兩人更仗著好泳技游渡過長江。但為什麼寫渡過長江會犯了大忌呢？因為一九五六年中共的官方媒體才大肆宣傳毛澤東在武漢「泳渡長江」，說七十二歲的毛澤東「乘風破浪，暢泳長江，……歷時一小時零五分，游程近三十華里，不管風吹浪打，勝似閒庭信步。」</p>\n\t\t\t<p>在〈沁園春．雪〉這闋詞裡，說成吉思汗「只識彎弓射大鵰」；但金庸想講的是：射鵰者只會射鵰嗎？英雄應該具備的要素是什麼？除了善於弓馬外，還需要什麼？顯然金庸曾經思考過，想在武俠小說裡替成吉思汗做翻案文章，意思是他不只是一代天驕，不只會彎弓射鵰。這或許是金庸起始的用意。</p>\n\t\t\t<p>從書名上看，《射鵰英雄傳》真正的主角不應該是郭靖。作為武俠小說，郭靖、黃蓉自然是寫作計畫中重要的角色，但金庸的用心遠比寫郭靖、黃蓉，或者所有這些武林人物的故事要更龐大一點。從第一部《書劍恩仇錄》到第二部《碧血劍》，不難看出他對歷史的密切關心。這正是金庸和其他武俠小說作者不一樣的地方。</p>\n\t\t\t<p>一九五七至一九五九年間，中國大陸和國際間都發生了相當大的局勢變化，從史達林去世到「大躍進」等事件。在此氛圍下，金庸寫《射鵰英雄傳》時，必然想到這一切。之所以有這個推測，是因為金庸在當時也曾發表過相關時評，而他的小說和時評向來是彼此呼應的。</p>\n\t\t\t<p>此外，「射鵰者」這個詞也有意思，它的典故及來歷最早可追溯至《史記．李將軍列傳》。</p>\n\t\t\t<p>李將軍就是李廣。李廣當時在北邊防衛匈奴，漢武帝指派了中貴人（宦官）前去李廣軍中。漢武帝下這道命令，等於是利用自己寵信的太監，放在李廣身邊見習如何訓練士兵，擊禦匈奴，以掌握北境的軍事狀況。這名宦官某天帶了數十名騎兵外出，途中遇到三個匈奴人，自恃人多勢眾，與匈奴人打了起來，卻反被匈奴人射傷，數十名騎兵也幾乎被殺個精光。宦官逃到李廣面前究因，李廣只說：「是必射鵰者也。」意指這三名匈奴人只是善於射鵰的精騎。</p>\n\t\t\t<p>這段「射鵰者也」的敘述，司馬遷的寫法極為隱晦，言外之意是：這三個匈奴人箭術異於常人，是英勇的射鵰者，跟他們交戰是不自量力；另外一層含意是：這三個射鵰者只是出門打獵，沒有挑釁的意味，被射傷完全是宦官咎由自取。</p>\n\t\t\t<p>但李廣還是帶領一百名騎兵急馳，在幾十里外追到這三名匈奴人，李廣下令騎兵左右包抄，親自射死其中兩人，生擒一人。但事不湊巧，捆縛俘虜上馬之際，發現匈奴數千騎兵就在附近。匈奴大軍也看見李廣的一百騎兵，誤以為是來誘敵的，驚訝之餘連忙上山佈陣。李廣的部隊原本非常恐懼，想驅馬奔回營地，但李廣臨危不亂，對一百名騎兵說：我們距離敵軍駐地只有數十里之遠，如果逃跑，只要他們的大軍在後頭追射，我們就全軍覆沒了；如果按兵不動，他們反而有所懷疑，不敢貿然襲擊。為了營造出誘敵之態，李廣下令百騎前進，直到距離匈奴陣營兩公里處，又命令眾人下馬解鞍。麾下騎兵疑惑不解：敵軍人數眾多，現下距離又近，如果遇到緊急狀況，該如何是好？李廣洞悉敵軍想法，說：匈奴人原以為我們會逃走，現在解去馬鞍，表示沒有逃跑的意圖，會讓匈奴人更加堅信我們是誘餌。</p>\n\t\t\t<p>《史記》的這段描述極為精彩，提到了「射鵰者」的來歷。如果「射鵰者」含有英雄成分，英雄是指誰？即使金庸有意為成吉思汗寫翻案文章，不過寫著寫著，這個小說的主角慢慢就從成吉思汗移到了郭靖身上。本來更有歷史和現實野心的一部小說，最後寫出來的是一部曲折、有趣的長篇武俠故事。</p>\n\t\t\t<p>從評論現實、評論歷史的野心改變過來之後，金庸寫小說的方式當然也就不一樣了，《射鵰英雄傳》可說是不容忽視的重要突破。從這部小說開始，金庸轉向用更鮮明的人物性格，以及更趨想像的武俠情境，建構起小說的核心內容，這種寫法貫串他的「射鵰三部曲」。</p>\n\t\t</div>"},{"title":"02 金庸最像自己作品裡的哪個角色？","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-34\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>金庸最像自己作品裡<br/>的哪個角色？</h1>\n\t\t\t<p>《射鵰英雄傳》是金庸的第一部大長篇，確立了他的風格。雖然在《書劍恩仇錄》和《碧血劍》中，他敢於寫乾隆，敢於寫袁崇煥，但在歷史的架構之外，於寫作上和其他的武俠小說並沒有那麼大的距離。</p>\n\t\t\t<p>從《射鵰英雄傳》開始，金庸找到了怎麼將小說格局寫大、寫長，同時能夠扣住讀者一直追讀的特別法則。</p>\n\t\t\t<p>首先是以角色作為敘事主軸，讓角色的個性來推動情節；再者，金庸找到了一種綿長佈局的方法，可以把小說寫長。這兩點清楚地顯現在《射鵰英雄傳》的開篇。</p>\n\t\t\t<p>一開始是雪夜中的牛家村和丘處機，接下來江南七怪出場，再從丘處機與江南七怪的賭約聯繫到郭靖、楊康這兩個義士的遺腹子，而且是一場長達十八年的大賭注——不但要各自找到剛出生的小孩，還要教他武藝，十八年後比武決勝。</p>\n\t\t\t<p>這是多麼長的一個佈局！接著才讓八歲的郭靖上場，長大藝成之後，又透過他和黃蓉之間的情感關係，牽扯出東邪、西毒、南帝、北丐、老頑童等特立獨行的角色。真的是「特立獨行」，每一個角色都有獨特的個性和武功識別，這就讓我們不得不注意到金庸對於角色塑造的認知與理解。</p>\n\t\t\t<p>金庸寫武俠小說，非常重要的一項成就，就是創造了令人難忘的角色。這些角色既鮮明，而且多，從寫小說的角度來看，非常不容易。光是寫出鮮明的性格，寫了一兩個，這沒問題，但是他要寫那麼多個。這麼多的角色都能讓我們在閱讀小說的時候，不只看到了、感受到了，而且會記得，會難忘。</p>\n\t\t\t<p>這樣的一項成就，於是在金迷之間刺激出一種特殊的遊戲。我相信很多喜歡金庸的人都玩過這個遊戲，就是你會去分析自己，或朋友，或名人（新聞上甚至歷史上的名人），並問這樣一個問題：他（她）最像金庸筆下的哪一個角色？當然，一定也有人問過、想過，如果套用在金庸本人——寫出這些角色的小說家——身上，他又最像自己筆下的哪個角色呢？</p>\n\t\t\t<p>我也認真想過這個問題，而且找到了答案。當然，我的答案可能跟大部分讀者所得到、想到的答案都不太一樣。不過，我有我的道理。</p>\n\t\t\t<p>第一條道理是，要回答這個問題，首先要破除理所當然的偏見，也就是想到「金庸像誰」的時候，不必然要先從小說中的男主角裡去找。金庸當然寫過很多精彩的男主角，從陳家洛開始，到袁承志，到郭靖，到楊過，到張無忌，到蕭峯，到令狐冲，一直到韋小寶等等。如果你想問金庸最像誰？千萬不能一下子就限縮在這些男主角身上。金庸之所以了不起，是因為他寫了很多配角，這些配角在人物個性上和主角同等精彩。同時，金庸的武俠小說和龐大的武俠小說傳統最不同的地方，就是他擅長寫女性，還寫了好多個令人難忘的女性角色。</p>\n\t\t\t<p>另一條道理，則牽涉到我對小說寫作的基本認識，也就是我們該如何理解作者和他所創造出來的角色之間的關係。</p>\n\t\t\t<p>什麼樣的角色對作者來說最難寫，而且雖然最難寫，但他還是寫了？意思是，有一些角色，作者本身如果沒有那樣的個性，或者沒有那樣的知識，或者沒有那樣的興趣，或者沒有那樣的品味，他就寫不出這種角色。</p>\n\t\t\t<p>從這個角度看，那最像金庸本人的角色，應該是最難寫的。先讓我們用排除法，比如腦海裡馬上想到一個，絕對不會是最難寫的，那就是郭靖。郭靖很容易寫，老實說我也會寫，就是把他寫得笨笨的，但是因為笨，反而認真努力；又因為他那麼認真、那麼努力，所以天道好還，經常會有好的事情、好的運氣掉在他頭上。這就是郭靖。</p>\n\t\t\t<p>也絕對不會是楊過。楊過很清楚就是一個偏執的人，只要掌握了他那種偏執個性，包括他對小龍女那一心一意、激烈昂揚的愛情，就可以寫得出來。是的，我也會寫，我覺得我也可以寫得出小龍女。</p>\n\t\t\t<p>張無忌的難度高一點，因為張無忌初時非常天真，一路誤打誤撞才成為明教教主。但後來他開始一點一滴地學習，什麼叫做人情，什麼叫做勢利，什麼叫做世故。只是張無忌還是不能跟另一個最難的角色相提並論，也就是我的答案。</p>\n\t\t\t<p>金庸最像誰？如果我們從「他沒有那樣的個性就寫不出那樣的角色」的道理來看，那一定是黃蓉。</p>\n\t\t\t<p>黃蓉是最難寫的，如果金庸沒有那樣的特質，是無從去捏造、假裝出來的。黃蓉身上所具備的第一個特性是豐富的學識，還有興趣，尤其她的學識和興趣是連在一起的。第二個特性是她的調皮、她的狡猾，以及雖然狡猾卻不討人厭的那種幽默感。沒有這種個性的人，很難憑空去想像出來。</p>\n\t\t\t<p>先講第一個特性，黃蓉的學識與興趣。《射鵰英雄傳》裡有一段非常精彩的情節，就是郭靖和黃蓉遇到了瑛姑。這一段情節在講什麼？竟然是數學！（當你看武俠小說的時候，心裡應該不會想到，竟然能讀到艱難的數學題？）</p>\n\t\t\t<p>黃蓉遇到瑛姑，見到一個老太太正全神貫注地盯著地上一堆竹片，竹片大概四寸長、兩分寬，黃蓉一看就知道這是拿來算數用的，被排成商、實、法、借算四行。黃蓉瞧了一下，已知這個老太太正在計算五萬五千二百二十五的平方根。這個數學題目我們都學過。答案是多少？黃蓉心算一下，脫口而出「二百三十五」。老太太嚇了一跳，不理她，繼續去撥她的算子，果然算出了二百三十五。</p>\n\t\t\t<p>瑛姑臉有怒容，似乎在說，這麼一個小姑娘，不過是湊巧猜中，別在這裡打擾我。她又做下一道算術，這次題目是什麼呢？三千四百零一萬二千二百二十四的立方根。瑛姑剛把算子排好，才算出一個「三」，黃蓉就把答案給了她：「三百二十四」。瑛姑布算好久才得出答案，果真是三百二十四。</p>\n\t\t\t<p>直到郭靖、黃蓉準備離開，瑛姑得知黃蓉是桃花島主的女兒，而她苦習算術就是要闖桃花島救人，於是就想動手。黃蓉也瞭解到眼前這人是爹爹的仇人。</p>\n\t\t\t<p>黃蓉用什麼方式報復、修理瑛姑呢？這個劇情安排也太有趣了。本來想吵架的，但黃蓉靈活的腦袋馬上想出一個更惡毒的方法，她用竹杖在地下細沙寫了三道算題，第一道叫做「七曜九執天竺筆算」，第二題是「立方招兵支銀給米題」，第三題叫做「鬼谷算題」，說現在有個東西，不知道數量多少，只知道三個三個數剩下二，五個五個數剩下三，七個七個數剩下二，問這個東西有多少個？</p>\n\t\t\t<p>瑛姑不由得呆呆出神。等到郭靖、黃蓉出了林子安全了，郭靖才問黃蓉，沙上畫了些什麼？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉笑道：「我出三道題目給她。哼，半年之內，她必計算不出，叫她的花白頭髮全都白了。誰教她這等無禮？」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是黃蓉發洩怒氣的方式。但如果金庸不是對數學有興趣，如果不曾鑽研過中國古代的數學，他怎麼寫這一段？還不止如此，靖蓉二人得到瑛姑的三個錦囊，有機會尋得段皇爺，但必須先經過「漁樵耕讀」四個關卡。</p>\n\t\t\t<p>第一關很難過，又有瀑布急湍，又有金娃娃魚，要靠著郭靖使出千斤墜和降龍十八掌，好不容易才過這一關。到了第二關，想必也非常困難。卻見一個樵子做什麼呢？在唱歌，唱的是〈山坡羊〉的曲兒：「城池俱壞，英雄安在？雲龍幾度相交代？想興衰，苦為懷。唐家才起隋家敗，世態有如雲變改。疾，也是天地差！遲，也是天地差！」小說還向讀者解釋，這是宋末流傳於民間的調子，曲詞隨人而做，很顯然是樵子自己作的詞。</p>\n\t\t\t<p>這時黃蓉心裡轉著念頭，其實是發愁的。樵子後來又唱了兩首，黃蓉忍不住喝了聲采，樵子轉頭問說好在哪裡？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉欲待相答，忽想：「他愛唱曲，我也來唱個『山坡羊』答他。」當下微微一笑，低頭唱道：「青山相待，白雲相愛。夢不到紫羅袍共黃金帶。一茅齋，野花開，管甚誰家興廢誰成敗？陋巷單瓢亦樂哉。貧，氣不改！達，志不改！」</p>\n\t\t\t<p>她料定這樵子是個隨南帝歸隱的將軍，昔日必曾手綰兵符，顯赫一時，是以她唱的這首曲中極讚糞土功名、山林野居之樂……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉能在片刻之間做出這樣一首曲子，其實不是她真的聰明至斯，而是在桃花島時曾聽父親唱過。樵子聽得心中大樂，往山邊一指，就讓他們兩人上峯。這一關就用這種方式過了。</p>\n\t\t\t<p>這一關很有意思。如果從武俠、武鬥的角度看，這一關根本沒打起來。但是換另一個角度，這一段情節在武俠故事中是最難寫的，因為不能只寫武功的本事，需要的是另一種本事，而這種本事在過去的武俠作品中，我們很難看得到。</p>\n\t\t\t<p>黃蓉為什麼難寫？因為黃蓉身上具備許許多多本來不屬於武林的文化素質、文化成分，這是屬於傳統士大夫的東西，比如數學，比如詩詞。金庸運用這種方法，實質上改造了傳統的武俠小說。</p>\n\t\t\t<p>武俠小說之所以存在，本就是因為士大夫的大傳統瓦解了，所以人們才回到小傳統——民間的武林、江湖，尋求虛構的想像與安慰。金庸卻把這種幫助華人在戰亂時期得以逃避和安慰的小傳統，也就是武俠故事，和士大夫大傳統的內容套接上。他所選擇最重要的連接點，就是黃蓉這個角色。</p>\n\t\t\t<p>所以，黃蓉代表的就是金庸自己的文化底蘊與文化興趣，不然他怎麼可能寫得出這樣的黃蓉來？這樣的黃蓉，代表的是金庸本身的知識性好奇，以及他在知識上所做過的努力與能夠掌握的高度。再換另一個角度，黃蓉性格上的那種調皮、狡猾，還有幽默感，以及在危急時候總能繞一個彎，從別人想不到的地方去解決問題，這一部分應該也是金庸自己的性格，以及他的為人中非常重要的一部分。</p>\n\t\t</div>"},{"title":"03 黃蓉之巧：懂吃、懂詞、懂救命","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-35\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>黃蓉之巧：<br/>懂吃、懂詞、懂救命</h1>\n\t\t\t<p>黃蓉是金庸寫過的所有角色中最巧妙的一位，因為她的「巧」是多面向的。</p>\n\t\t\t<p>《射鵰英雄傳》中，黃蓉剛出場的時候，她女扮男裝，扮成一個小叫花子：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>那少年約莫十五六歲年紀，頭上歪戴著一頂黑黝黝的破皮帽，臉上手上全是黑煤，早已瞧不出本來面目，手裡拿著一個饅頭，嘻嘻而笑，露出兩排晶晶發亮的雪白細牙，卻與他全身極不相稱。眼珠漆黑，甚是靈動。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉來到酒館門口，店夥把她看作乞丐，想轟她走。當然，她非但不是個少年，還是個美少女，經過小說一路的劇情發展，到後來她真的成為了丐幫幫主。前後有著非常有趣的呼應。</p>\n\t\t\t<p>黃蓉初登場就有驚人之舉，是關於吃，這裡金庸又藉著黃蓉表現出自己對於美食佳餚的認識。</p>\n\t\t\t<p>雖然郭靖答應作東，店小二還是瞧不起黃蓉改扮的這個邋遢少年：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>那少年發作道：「你道我窮，不配吃你店裡的飯菜麼？只怕你拿最上等的酒菜來，還不合我的胃口呢。……夥計，先來四乾果、四鮮果、兩鹹酸、四蜜餞。」店小二嚇了一跳，不意他口出大言，冷笑道：「大爺要些甚麼果子蜜餞？」</p>\n\t\t\t<p>那少年道：「這種窮地方小酒店，好東西諒來也弄不出來，就這樣吧，乾果四樣是荔枝、桂圓、蒸棗、銀杏。鮮果你揀時新的。鹹酸要砌香櫻桃和薑絲梅兒，不知這兒買不買到？蜜餞麼？就是玫瑰金橘、香藥葡萄、糖霜桃條、梨肉好郎君。」店小二聽他說得十分在行，不由得收起小覷之心。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>接下來，黃蓉又點了八個「馬馬虎虎的」酒菜，分別是花炊鵪子、炒鴨掌、雞舌羹、鹿肚釀江瑤、鴛鴦煎牛筋、菊花兔絲、爆獐腿、薑醋金銀蹄子。另外又要了十二樣下飯的菜，再加上八樣點心。</p>\n\t\t\t<p>這可真是聲勢驚人！黃蓉巧在哪裡？不只是她好大的口氣、好大的氣派，更重要的是她擺氣派的方式——她是個懂吃的人。在小說裡，我們還會看到，黃蓉後來為了討好北丐洪七公，讓郭靖學得「降龍十八掌」，除了展現她對食物的知識外，還有她在食物上了不起的手藝。</p>\n\t\t\t<p>我們看金庸怎麼描述黃蓉收服洪七公的胃：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉笑盈盈的托了一隻木盤出來，放在桌上，盤中三碗白米飯，一隻酒杯，另有兩大碗菜肴。郭靖只覺得甜香撲鼻，說不出的舒服受用，只見一碗是炙牛肉條，只不過香氣濃郁，尚不見有何特異，另一碗卻是碧綠的清湯中浮著數十顆殷紅的櫻桃，又飄著七八片粉紅色的花瓣，底下襯著嫩笋丁子，紅白綠三色輝映，鮮豔奪目，湯中泛出荷葉的清香，想來這清湯是以荷葉熬成的了。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸快速描述出那一碗湯的美，是特別配色配出來的。而洪七公馬上就夾了兩條牛肉條放入口中：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>只覺滿嘴鮮美，絕非尋常牛肉，每咀嚼一下，便有一次不同滋味，或膏腴嫩滑，或甘脆爽口，諸味紛呈，變幻多端，直如武學高手招式之層出不窮，人所莫測。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸用這種方式，把美食和武功連結起來，而且連結得多麼巧妙、多麼自然。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>洪七公驚喜交集，細看之下，原來每條牛肉都是由四條小肉條拼成。洪七公閉了眼辨別滋味，道：「嗯，一條是羊羔坐臀，一條是小豬耳朵，一條是小牛腰子，還有一條……還有一條……」黃蓉抿嘴笑道：「猜得出算你厲害……」她一言甫畢，洪七公叫道：「是獐腿肉加兔肉揉在一起。」黃蓉拍手讚道：「好本事，好本事。」郭靖聽得呆了，心想：「這一碗炙牛條竟要這麼費事，也虧他辨得出五般不同的肉味來。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>再來是那碗湯。那碗湯太好看了，洪七公有點捨不得吃，先舀了兩顆櫻桃：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>荷葉之清、笋尖之鮮、櫻桃之甜，那是不必說了，櫻桃核已經剜出，另行嵌了別物，卻嚐不出是甚麼東西。洪七公沉吟道：「這櫻桃之中，嵌的是甚麼物事？」閉了眼睛，口中慢慢辨味，喃喃的道：「是雀兒肉！不是鷓鴣，便是班鳩，對了，是班鳩！」睜開眼來，見黃蓉正豎起了大拇指，不由得甚是得意，笑道：「這碗荷葉笋尖櫻桃班鳩湯，又有個甚麼古怪名目？」</p>\n\t\t\t<p>黃蓉微笑道：「老爺子，你還少說了一樣。」洪七公「咦」的一聲，向湯中瞧去，說道：「嗯，還有些花瓣兒。」黃蓉道：「對啦，這湯的名目，從這五樣作料上去想便是了。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這裡黃蓉展現的是：第一，對食物的認識與瞭解；第二，在食物烹煮上巧妙的手法；第三，將各種不同的食材做出創意結合；第四，不但要知道怎麼煮，還要給一個特別的名稱。什麼名稱呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>洪七公道：「要我打啞謎可不成，好娃娃，你快說了吧。」黃蓉道：「我提你一下，只消從『詩經』上去想就得了。」洪七公連連搖手，道：「不成，不成。書本上的玩意兒，老叫化一竅不通。」</p>\n\t\t\t<p>黃蓉笑道：「這如花容顏，櫻桃小嘴，便是美人了，是不是？」洪七公道：「啊，原來是美人湯。」黃蓉搖頭道：「竹解心虛，乃是君子。蓮花又是花中君子。因此這竹笋丁兒和荷葉，說的是君子。」洪七公道：「哦，原來是美人君子湯。」黃蓉仍是搖頭，笑道：「那麼這班鳩呢？『詩經』第一篇是：『關關睢鳩，在河之洲，窈窕淑女，君子好逑』。是以這湯叫作『好逑湯』。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸順理成章地講到《詩經》，靠著黃蓉精巧的廚藝，徹徹底底征服了洪七公，後來才有洪七公和靖蓉二人結為師徒的種種情節變化。這是金庸了不起的地方。</p>\n\t\t\t<p>這一段在書裡不過就是兩三頁，但是誰寫得出來呢？誰能夠創造出黃蓉這樣的角色？誰能夠賦予黃蓉如此靈巧的心思？她不但懂吃的、能夠做吃的，還會運用關於吃的知識，一路談到名目的文學性。所以為什麼我說金庸最像黃蓉？如果不是金庸自己這麼愛吃，更重要的，如果他不能夠理解所謂美食必然有這重要的兩面，他怎麼能用這種方式來寫黃蓉？</p>\n\t\t\t<p>用英文來說，美食關鍵的一點是good for eating，吃起來好吃。但如果僅限於這一個層次，那是不夠的。美食還有另外一面，就是good for thinking。有這樣的美味食材，更重要的，配上這樣的文學典故，這道料理吃起來才格外有滋味，不只吃在我們的舌尖上，還進入到我們的腦袋裡。</p>\n\t\t\t<p>《射鵰英雄傳》裡，黃蓉在張家口初登場，隨意點菜，就讓郭靖目瞪口呆，因為郭靖想都沒想過還有這樣的食物。</p>\n\t\t\t<p>等到黃蓉在京城外湖邊第三次出現，郭靖這才發現，黃蓉原來不是「黃賢弟」，而是個美麗少女。變回少女的黃蓉邀郭靖上船，把小船划到湖心，取出酒菜，想在這裡跟郭靖喝酒賞雪。兩人聊著聊著，黃蓉興致來了，便要唱歌。她不只懂吃，還會唱歌，唱的是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「雁霜寒透幙。正護月雲輕，嫩冰猶薄。溪奩照梳掠。想含香弄粉，靚妝難學。玉肌瘦弱，更重重龍綃襯著。倚東風，一笑嫣然，轉盼萬花羞落。</p>\n\t\t\t<p>「寂寞！家山河在：雪後園林，水邊樓閣。瑤池舊約，麟鴻更仗誰託？粉蝶兒只解尋花覓柳，開徧南枝未覺。但傷心，冷落黃昏，數聲畫角。」</p>\n\t\t\t<p>郭靖一個字一個字的聽著，雖然於詞義全然不解，但清音嬌柔，低迴婉轉，聽著不自禁的心搖神馳，意酣魂醉，這一番纏綿溫存的光景，竟是他出世以來從未經歷過的。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>但黃蓉的巧，不在於唱出這麼好聽的歌，更在於她還要教郭靖（其實背後是金庸在教我們）。教什麼呢？她說，詞是辛棄疾寫的，詞牌叫做「瑞鶴仙」，描寫的雖然是雪後梅花，卻反映了人們主觀的寂寞心情，又再聯繫到辛棄疾念茲在茲的江山故土。</p>\n\t\t\t<p>這本來不是武俠小說的成分，而是來自士大夫大傳統的精英文化。郭靖也正代表我們：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖道：「我一點兒都不懂，歌兒是很好聽的。辛大人是誰啊？」黃蓉道：「辛大人就是辛棄疾。我爹爹說他是個愛國愛民的好官。北方淪陷在金人手中，岳爺爺他們都給奸臣害了，現下只有辛大人還在力圖恢復失地。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這就是南宋的歷史背景。後來郭靖、黃蓉到趙王府中盜藥，黃蓉原本躲在大廳簷下偷聽，卻不小心洩漏行蹤，陷入被王府高手圍困的局面。由於侯通海一路被黃蓉戲弄，這時就要抓她。黃蓉如何施展她的功夫，如何想辦法脫困呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉……說道：「我和他各拿三碗酒，比比功夫。誰的酒先潑出來，誰就輸了，好不好？」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這不是一般的比武，這是有遊戲規則的，而且真的像遊戲一樣。這是黃蓉的另外一種巧。因為她知道梁子翁、彭連虎、沙通天等人的武功都比自己高，就算是三頭蛟侯通海，自己也只是仗著輕功與心思靈巧才能夠這樣戲弄他。所以她想了個計策：倚小賣小，跟他們胡鬧，如此才有可能脫身。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉閃身避過，笑道：「好，我身上放三碗酒，你就空手，咱們比劃比劃。」</p>\n\t\t\t<p>侯通海年紀大她兩倍有餘，在江湖上威名雖遠不如師兄沙通天，總也是成名的人物，受她這般當著眾人連激幾句，更是氣惱，不加思索的也將一碗酒往頭頂一放，雙手各拿一碗，左腿微曲，右腿已猛往黃蓉踢去。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這又是一種巧，目的是激怒侯通海。接下來兩人當然比輕功：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>但見黃蓉上身穩然不動，長裙垂地，身子卻如在水面飄盪一般，又似足底裝了輪子滑行，想是以細碎腳步前趨後退。侯通海大踏步追趕，一步一頓，騰騰有聲，顯然下盤功夫紮得極為堅實。黃蓉以退為進，連施巧招，想以手肘碰翻他酒碗，卻都被他側身避過。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>看到這裡，感覺已經不是比武了，黃蓉的巧和她的美是結合在一起的。但遇到下盤功夫紮實的對手，黃蓉怎麼贏呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉雙手齊振，頭頂一昂，三隻碗同時飛了起來，一個「八步趕蟾」雙掌向侯通海胸前劈到。侯通海手中有碗，不能發招抵禦，只得向左閃讓。黃蓉右手順勢掠去，侯通海避無可避，只得舉臂擋格，雙腕相交，侯通海雙手碗中的酒水潑得滿地都是，頭上的碗更落在地下，噹啷一聲，打得粉碎。</p>\n\t\t\t<p>黃蓉拔起身子，向後疾退，雙手接住空中落下的兩碗，另一碗酒端端正正的落在她雲鬢之頂，三碗酒竟沒濺出一點。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉以巧取勝，硬是贏了。接著，一關一關，全都靠她的巧思、巧技，讓一干人物都輸在了她手裡。最後黃蓉和歐陽克之間的比試，是另一個經典。他們兩人怎麼比呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>歐陽克伸出右足，點在地下，以左足為軸，雙足相離三尺，在原地轉了個圈子，只見磚地上已被他右足尖畫了淺淺的一個圓圈，直徑六尺，畫得整整齊齊。畫這圓圈已自不易，而足下內勁如此了得，連沙通天、彭連虎等也均佩服。</p>\n\t\t\t<p>歐陽克走進圈子，說道：「誰出了圈子，誰就輸了。」黃蓉道：「要是兩人都出圈子呢？」歐陽克道：「算我輸好啦。」黃蓉道：「若是你輸了，就不能再追我攔我？」歐陽克道：「這個自然。如你給我推出了圈子，可得乖乖的跟我走。這裏眾位前輩都是見證。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉答應了，走進圈子裡，兩人對打起來：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉……左掌「迴風拂柳」，右掌「星河在天」，左輕右重，勁含剛柔，同時發出。歐陽克身子微側，這兩掌竟沒能避開，同時擊在他肩背之上。黃蓉掌力方與他身子相遇，立知不妙，這歐陽克內功精湛，說不還手真不還手，但借力打力，自己有多少掌力打到他身上，立時有多少勁力反擊出來。她手不動，足不動，黃蓉竟是站立不穩，險些便跌出了圈子。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>出了圈子，黃蓉就要輸了，怎麼辦呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>她那敢再發第二招，在圈中走了幾步，說道：「我要走啦，卻不是給你推出圈子的。你不能出圈子追我。剛才你說過了，兩人都出圈子就是你輸。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>能夠有這種應變，有這種智巧，才構成了黃蓉迷人的身影。試問，如果作者自己沒有這般靈巧的心思，他怎麼想得出這樣的情節？如果他不是對辛棄疾的詞作有所感悟、體認，怎麼可能寫出黃蓉和郭靖泛舟湖上時，唱著辛棄疾的詞曲？如果他不是對美食的精神層次如此嫺熟，怎麼可能寫出這樣的黃蓉？</p>\n\t\t</div>"},{"title":"04 正邪之間的曖昧角色","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-36\"><span>0</span><span>4</span></h6>\n\t\t\t<h1>正邪之間的<br/>曖昧角色</h1>\n\t\t\t<p>讀《射鵰英雄傳》，除了主角之外，很容易浮上心頭的還有五個重要的角色：東邪、西毒、南帝、北丐、中神通。</p>\n\t\t\t<p>這五個人是配套的，號稱「天下五絕」，這也是傳統武俠小說的一種寫法。《射鵰英雄傳》裡也出現過其他的群體，像是全真七子、江南七怪、黑風雙煞，他們常常是一起出現的。一起出現有個好處，就是能夠寫群戲，還有，讀者在理解這些角色的時候，不用一個一個去記，可以彼此聯繫去認識他們。</p>\n\t\t\t<p>不過，同樣都是群體，東邪、西毒、南帝、北丐、中神通不一樣。最大的不同是，他們每一個人都有極其獨特的個性，也呈現出不同的個性層次。</p>\n\t\t\t<p>首先是中神通王重陽，他在這部小說裡並沒有真正上場，到了《神鵰俠侶》才有比較多他的故事。但這裡有一個跟他關係密切的替代性人物，就是他的師弟周伯通，金庸將他寫成了一個「終極頑童」。所謂「終極頑童」，除了愛玩之外，人生所有的一切他都不在意。對他來說，最好玩的事就是武功，練武功也是為了好玩。因為武功好玩，他對武功的追求猶如花蜜之於蜜蜂般著迷。</p>\n\t\t\t<p>他的頑童個性發展到極致，因為怕無聊、怕孤單，怕一個人的時候就沒有人可以跟他比武，於是發明了「左右互搏之術」，想辦法讓自己化身成兩個人，讓左手跟右手打架，而且左、右手必須在心神上真正的分開，要不然怎麼打也不會有趣。也因為這樣，他才能一個人在桃花島的山洞裡一待十五年。</p>\n\t\t\t<p>再看南帝段皇爺。跟王重陽一樣，按照小說的時間軸，他們年輕時的故事都已經過去了。南帝這個時候不再是南帝，而是一燈大師。這中間有一段不足為外人道的故事，借由瑛姑的糾纏一點一點地揭露出來。原來周伯通和當時還是劉貴妃的瑛姑私通，原本南帝才是被背叛、被傷害的人，後來卻成了被怨恨的對象。最關鍵的原因，是他當年由於心腸剛硬，不管瑛姑在他面前如何哀求，最終都沒有出手救治那命在垂危的、瑛姑私生的孩兒。這件事困擾了他許久，最後選擇出家來贖罪。</p>\n\t\t\t<p>南帝、中神通寫的並不多，著墨較多的是北丐、東邪和西毒。西毒歐陽鋒算是這部小說裡真正的大反派，為了成為武功天下第一，什麼陰險手段都敢使。再加上他的侄兒歐陽克，以及豢養的毒蛇群，讓人感到最不舒服，會希望郭靖與黃蓉最好不要碰到他們。到了小說末尾，黃蓉三次把歐陽鋒困住，更引得他逆練「九陰假經」而發瘋，也就看得特別過癮。</p>\n\t\t\t<p>黃藥師號稱東邪，也確實有他殘忍邪僻之處。桃花島上的傭僕都是又聾又啞，這是黃藥師下的手，他必須保證這些人沒有機會聽到什麼，也沒有辦法洩露秘密。又如，他的弟子陳玄風、梅超風偷盜《九陰真經》叛逃，他盛怒之下就把自己一手調教出來的徒弟都打斷腿逐出去，遷怒以洩憤。</p>\n\t\t\t<p>但是，黃藥師在小說裡有個特殊身分，使我們沒辦法用看待歐陽鋒的方式看待他，因為他是黃蓉的父親。黃藥師對這個女兒可說是寵愛有加，本來發誓一輩子不離開桃花島，卻為了尋找女兒而重現江湖，涉入江湖恩怨。</p>\n\t\t\t<p>正是在回看東邪、西毒、南帝、北丐、中神通這些人物時，所謂正派與反派、好人與壞人之間，金庸有了非常不一樣的寫法。南帝一生尊榮，卻也有見死不救的悔恨之事；西毒一世執念，卻也有對歐陽克的舐犢之情，到了《神鵰俠侶》更來個反轉，成了瘋傻得有點可愛的老人。</p>\n\t\t\t<p>單純從形象上來說，《射鵰英雄傳》中還有一個可怕的人物，就是鐵屍梅超風。她就像武俠小說裡典型的女魔頭，一來，她殺人不眨眼，冷血
