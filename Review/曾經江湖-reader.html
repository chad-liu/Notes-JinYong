無情；二來，她殺人的手法也不正派，由於錯練《九陰真經》，竟然是用手指插入人的頭骨，用最殘酷、血腥的方式奪人性命。</p>\n\t\t\t<p>不止如此，銅屍、鐵屍剛出場時，讀者跟著江南七怪先是看到了一堆一堆被排成三層的骷髏頭，那已經不是殘酷，實際上已接近於魔。</p>\n\t\t\t<p>這樣的魔頭，在一般的武俠小說中，理應要被正派追殺。通常他們有非常高強的武藝，於是成了整部小說的正派角色必須克服的一大難關。可是，就連梅超風這樣一個反派，在《射鵰英雄傳》裡竟然有這一段描寫：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>梅超風坐在地下，右手扼在郭靖頸中，左手抓住了他的手腕，十餘年來遍找不見的殺夫仇人忽然自行送上門來，……一霎時心中喜不自勝，卻又悲不自勝，一生往事，斗然間紛至沓來……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在這裡，金庸讓她用回顧並自述的方式來說她的故事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「我本來是個天真爛漫的小姑娘，整天戲耍，父母當作心肝寶貝的愛憐，那時我名字叫做梅若華。不幸父母相繼去世，我受著惡人的欺侮折磨。師父黃藥師救我到了桃花島，教我學藝。給我改名叫梅超風，他門下弟子，個個名字中都有個『風』字。在桃樹之下，一個粗眉大眼的年輕人站在我面前，摘了一個鮮紅的大桃子給我吃。那是師兄陳玄風。在師父門下，他排行第二，我是第三。我們一起習練武功，他時常教我，待我很好，有時也罵我不用功，但我知道是為了我好。慢慢的大家年紀長大了，我心中有了他，他心中有了我。一個春天的晚上，桃花正開得紅豔豔地，在桃樹底下，他忽然緊緊抱住了我。」……</p>\n\t\t\t<p>梅超風回憶到陳玄風和自己偷偷結了夫妻，怎樣懼怕師父責罰，離島逃走，丈夫告訴她盜到了半部《九陰真經》。以後是在深山的苦練，可是只練了半年，丈夫便說經上所寫的話他再也看不懂了，就是想破了頭，也難以明白。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>所以他們只好再回桃花島，想辦法把上半部經書偷出來。再看她回憶這段往事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「我們打聽到師父為了我們逃走而大發脾氣，把眾徒弟都挑斷了腳筋趕走啦，島上就只他夫婦二人和幾個僮僕。我二人心驚膽戰的上了桃花島。就在那時候，師父的大對頭正好找上門來。他二人說的就是九陰真經的事，爭吵了一會就動上了手。這人是全真教的，說話傻裏傻氣的……」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這人就是周伯通。周伯通的武功當然很高，高到讓梅超風意想不到的地步。她接著想：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「我想起師母待我的恩情，想在窗外瞧瞧她，哪知看到的只是一座靈堂，原來師母過世了。我心裏很難過，師父師母向來待我很好，師母死了，師父一人寂寞孤零，我實在對不起他，那時候我忍不住哭了，忽然之間，看見靈堂旁邊有個一歲大的小女孩兒，坐在椅子上向著我直笑，這女孩兒真像師母，定是她的女兒，難道她是難產死的麼？</p>\n\t\t\t<p>「我正在這樣想，師父發覺了我們，從靈堂旁飛步出來。啊，我嚇得手酸腳軟，動彈不得。我聽得那女孩兒笑著在叫：『爸爸，抱！』她笑得像一朵花，張開了雙手，撲向師父。這女孩兒救了我們的性命。師父怕她跌下來，伸手抱住了她。……」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這個小女孩就是黃蓉。但重點是，像梅超風這樣一個惡魔般的角色，金庸都給了她一個身世、一個來歷。她之所以變成了惡魔，是有原因的。</p>\n\t\t\t<p>包括東邪、西毒、南帝、北丐、中神通，包括許許多多其他的配角，每個人都有身世來歷。如此一來，我們讀小說時的感受也就不一樣了，不是只在分辨到底誰是好人、誰是壞人，而是會激發起心底一種理解的好奇。我們想要知道，他們為什麼會變成這樣？是什麼樣的遭遇，使得他們在人生的節骨眼上做出不一樣的選擇？</p>\n\t\t</div>"},{"title":"05 武功與感情的偏執","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-37\"><span>0</span><span>5</span></h6>\n\t\t\t<h1>武功與感情<br/>的偏執</h1>\n\t\t\t<p>其實在小說裡，金庸已經明確地寫出來，在江湖、武林環境中，塑造個性、決定命運，有兩個最重要的力量。一種力量是關於武功，也就是對於武學的著迷，所以像《九陰真經》、《九陽真經》這種至高的武學秘笈，便是整個江湖引起騷動的根本原因。武林中人之所以變得偏執，相當程度上是為了想要奪得秘笈、讓武功變強，因而形成了一種終極的欲望。</p>\n\t\t\t<p>這個終極的欲望可能有不同的來源，比如周伯通純粹就是個武癡，喜歡武功，喜歡玩，希望能夠想出、練出最高深的功夫；但大部分的人則是希望借由高強武功得到權力或地位。</p>\n\t\t\t<p>在桃花島上，周伯通曾把《九陰真經》的來龍去脈完完整整地講給郭靖聽。可是郭靖聽完之後的反應是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖道：「這樣說來，這部經書倒是天下第一害人的東西了。陳玄風如不得經書，那麼與梅超風在鄉間隱姓埋名，快快樂樂的過一世，黃島主也未必能找到他。梅超風若是不得經書，也不致弄到今日的地步。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖的話間接解釋了陳玄風、梅超風不是天生的惡魔，讓他們變成惡魔的重要原因，是對武功的著迷。聽了郭靖這番話，周伯通很驚訝，甚至有點生氣：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>周伯通道：「兄弟你怎麼如此沒出息？九陰真經中所載的武功，奇幻奧秘，神妙之極。學武之人只要學到了一點半滴，豈能不為之神魂顛倒？縱然因此而招致殺身之禍，那又算得了甚麼？咱們剛不是說過嗎，世上又有誰是不死的？」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>周伯通的這種態度，就是武林中人的態度。為了練功，連生命都不愛惜了，那還講什麼倫理，還講什麼道義？</p>\n\t\t\t<p>於是金庸也寫出了武俠世界的一種緊張感，甚至是矛盾。為了追求「武」，很多時候你就顧不了「俠」；要追求武功，還是要信守俠義，這兩者之間不是那麼理所當然地並存的。</p>\n\t\t\t<p>另一方面，金庸也藉此解釋了，為什麼郭靖能夠在江湖、武林的環境中，隨時保持著正直之心呢？正是因為周伯通罵他的這種「沒出息」的個性。他不覺得練武有這麼大的樂趣，從小他就是被逼著練武的，天資不好的他，過程更是辛苦得不得了。他對武功沒有那種執念，也才能擺脫從執念誘引出的個性上的偏執。</p>\n\t\t\t<p>除了對武功的執迷之外，在金庸小說中同等重要的，甚至更加重要的，是感情，也就是男女情愛的糾結與執著。這又是金庸在武俠創作上的一大突破。傳統武俠小說所寫的武林中種種恩怨，基本上是男人之間的事情，不會有女性的角色。例如平江不肖生寫《江湖奇俠傳》，雖然也寫到了女性角色如紅姑，但紅姑先是一個江湖人物，然後才是一個女人。她的女人性格、女人性情、女人性質，沒有那麼重要。</p>\n\t\t\t<p>在大部分的武俠小說中，就算有女性的角色，往往是陪襯的。可是我們讀金庸的小說就知道，像黃蓉這麼精彩絕倫的女性，怎麼可能是陪襯呢？而為了讓男性和女性在小說裡有同等的地位，就要連結、鋪陳各種情節，最常見的是愛情。</p>\n\t\t\t<p>愛情在金庸小說裡極度重要，甚至在很多地方是「愛情決定論」——因為你遇到了什麼樣的人，有了什麼樣的感情，這段感情有沒有結果，往往決定了這個角色會是什麼樣的個性，最後會變成正派人物抑或反派人物。同樣的，郭靖在這方面一帆風順，他是最幸運的人，因為他遇到了黃蓉，在感情上沒有任何糾結，只有在道義上有些挫折，避開了感情可能對他的人格所帶來的衝擊影響。</p>\n\t\t\t<p>不過在金庸的小說裡，郭靖是一個大特例。絕大部分的角色都陷在愛情的泥沼中，被感情牽著走，決定了他們變成什麼樣的人。金庸寫愛情，越寫越深，於是到了《神鵰俠侶》（《射鵰英雄傳》的接續之作），一開場，赤練仙子李莫愁在殺人前高歌：「問世間，情是何物，直教生死相許？」李莫愁是另外一個女魔頭，她原本也是個癡情種，卻因為感情的受挫和種種變化，才轉變成了一個惡魔。</p>\n\t\t\t<p>這也是金庸的武俠小說之所以能夠擴及原有的武俠讀者群之外，吸引更多讀者的重要因素。像是吸引了一大批女性讀者，吸引了以前只讀文藝小說的讀者，或是對情感有著敏銳感受的年輕讀者。</p>\n\t\t\t<p>用這種寫作技藝，武俠小說不再只是武俠小說，相當程度上變成了一種特別的愛情小說。同時，傳統武俠小說中簡單、明白的正邪之分，到了金庸的小說裡，藉由執迷所產生的人物個性，多了許許多多的曖昧，許許多多的層次。這是金庸了不起的成就。</p>\n\t\t</div>"},{"title":"06 香港新武俠：似電影、若戲劇","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-38\"><span>0</span><span>6</span></h6>\n\t\t\t<h1>香港新武俠：<br/>似電影、若戲劇</h1>\n\t\t\t<p>細數連載小說的來歷，從十九世紀起，連載小說就一直與報業的發展緊密連結，由歐洲傳播到中國，從晚清到民國一路開枝散葉，再延續到港、臺地區。連載小說打破了小說獨立自主的時間意識，與現實生活的時間平行流淌，並且不斷地互相指涉，只要現實生活日復一日、無窮無盡，小說裡的時空似乎也可以一天天延續下去。</p>\n\t\t\t<p>閱讀連載小說，你不會去預測它何時結束，它本來就有自身的步調，每過一天，理所當然就會有一段新的故事。連載小說沒有具體的頭中尾佈局，不只結構鬆散，還必須經常隱伏著呼之欲出的伏筆。</p>\n\t\t\t<p>金庸小說之所以好看，一部分是因為金庸的生活閱歷豐富，諸如辦報必須面對的煩瑣事務，同時必須洞悉時局，才能寫出言之有物的時評，就連天分極高的古龍在這點上也無法與金庸相提並論。這意味著一位作家的生命經歷過多少滋養，往往就決定他如何書寫小說。</p>\n\t\t\t<p>再舉古龍的例子。古龍小說的內在或基礎根本就是文青特質，只要每次重看，就能指出哪個段落埋伏著〇〇七電影，或是海明威小說，或是沙林傑《麥田捕手》的元素。為什麼？這跟古龍小說讀來好看也是有密切關係的，因為古龍善於消化他在當下所讀到、看到的著作和電影。古龍所處的時代，正是美國大眾文化傳播至臺灣的鼎盛期，古龍接觸到之後，能進一步將之轉化成小說素材，再寫進武俠小說裡。無論是臥龍生或東方玉，都沒有這種本事。這也是梁羽生雖然同為新武俠小說的起步者，後來的成就卻不及金庸的緣故。</p>\n\t\t\t<p>自金庸、梁羽生之後，香港有了所謂的「新武俠」。新武俠到底怎麼個新法？它不只是在寫法上新，在內容上新，當然它吸引讀者的方式也新。</p>\n\t\t\t<p>金庸在寫法上的新，可以從《射鵰英雄傳》中舉兩個有趣的例子。《射鵰英雄傳》在一九五七至一九五九年連載於《香港商報》，這段時間，金庸正好在香港長城影業公司擔任編劇，還參與過兩部電影的共同導演。作為電影工作者，金庸必定熟知許多電影作品，包括美國好萊塢電影在內。</p>\n\t\t\t<p>回溯二十世紀五○年代，美國有什麼新的變化和發展呢？</p>\n\t\t\t<p>首先，朝鮮戰爭從一九五○年打到一九五三年，終於結束了。韓戰結束最重要的效果，是讓美國從歐戰、太平洋戰爭一路下來飽受戰爭動員之苦後，終於得到喘息的機會。這個時候，美國社會終於可以用比較平靜的心態來面對戰爭，也就是說，可以將戰爭轉變為娛樂素材。</p>\n\t\t\t<p>其次，藉由新的影像技術，尤其是彩色銀幕，也讓戰爭場面的視覺效果震撼力十足，成功吸引觀眾的目光。例如一九六五年上映的電影《坦克大決戰》（Battle of the Bulge），雖然電影故事並未忠於史實，但的確取材於二戰時希特勒所建立的一支快速打擊部隊。這支德軍裝甲部隊的指揮官約阿希姆．派佩爾（Joachim Peiper），在盧森堡與比利時的邊界發動突擊，急攻盟軍，與英國坦克部隊對戰，後來美國也加入這場戰事。這部電影精彩之處在於數十輛坦克一字排開，氣勢磅礴，營造出一種壯麗的美感。</p>\n\t\t\t<p>另一部同樣精彩的美國史詩戰爭片，是《最長的一日》（The Longest Day），上映於一九六二年。電影製片公司眼光精湛，挑選二戰最後關頭的轉捩點——「諾曼第登陸」（D-Day）為題材，講述盟軍搶灘法國諾曼第的兩面戰場。一面戰場是搶灘，導演戮力於還原十幾萬盟軍登陸海灘的真實戰況，但這場規模龐大的戰役，直到史蒂芬．史匹柏（Steven Spielberg）執導的《搶救雷恩大兵》（Saving Private Ryan, 1998），才重現了戰史上「血腥奧馬哈」的震撼場面，戰爭的殘酷與壯烈，槍林彈雨的逼真程度都極為駭人。</p>\n\t\t\t<p>另一面戰場是傘兵作戰，盟軍的空降部隊以跳傘方式進入德國的佔領地，在空中就像一朵一朵的花展開。這就讓人聯想到《射鵰英雄傳》中的情節，金庸把傘兵大作戰也寫進了武俠小說。</p>\n\t\t\t<p>郭靖回到漠北之後，跟隨成吉思汗攻打花剌子模，在圍攻撒馬爾罕城時，黃蓉獻上破城計謀，要士兵割破帳篷，製成一萬頂圓傘。郭靖帶領將士們繫上革傘，從雪峯頂躍入城中，一支萬人傘兵部隊逐次降落在撒馬爾罕的南城，攻破了久攻不下的城池。小說場景堪比好萊塢電影製片的規模，超出了武俠小說的寫作想像。</p>\n\t\t\t<p>金庸用了很多力氣鋪陳，將這場傘兵攻城的橋段放置在一環扣著一環的故事情節中。從第三十五回〈鐵槍廟中〉開始，歐陽鋒擄走了黃蓉，大半年時間，黃蓉的下落一點消息都沒有，郭靖也回到了蒙古。但就在郭靖領軍西征前，丐幫的魯有腳等長老突然來到大漠草原，襄助郭靖西征。</p>\n\t\t\t<p>在魯長老幫助郭靖解決兵書難題的過程中，讀者已能從字裡行間意識到黃蓉一定藏身在不遠處。接下來，關鍵人物西毒歐陽鋒出現了，闖入郭靖的軍帳中，呵斥郭靖交出黃蓉。歐陽鋒提出一個約定：只要郭靖說出黃蓉的藏身之處，他絕不傷黃蓉一毫一髮。沒想到，郭靖反而提出另一個交換條件：如果歐陽鋒答應不傷黃蓉，「從今而後，你落在我手中之時，我饒你三次不死。」</p>\n\t\t\t<p>這項訂約委實奇怪，因為小說發展到此，郭靖的武功仍然不如歐陽鋒，難怪歐陽鋒覺得荒謬、甚至輕敵，所以一口就答應了。熟悉金庸小說筆法的讀者都知道，金庸又要安排黃蓉上場表演一番了，運用連環巧計，讓郭靖能夠饒歐陽鋒三次不死。</p>\n\t\t\t<p>黃蓉仍躲在暗處，教魯長老出面執行計策，第一次是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>在帳中掘了個深坑，坑上蓋以毛氈，氈上放了張輕便木椅。二十名健卒各負沙包，伏在帳外。……到第四天晚上，……歐陽鋒縱聲長笑，踏進帳來，便往椅中坐落。只聽得喀喇喇一聲響，他連人帶椅跌入坑中。……四十個大沙包迅即投入陷阱，盡數壓在歐陽鋒身上。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>歐陽鋒只能如鼴鼠般「土遁」，但都被郭靖命令騎兵縱馬踩踏，最後掘出閉氣假死的歐陽鋒，郭靖履踐前約，饒他一次不死。</p>\n\t\t\t<p>第二次，黃蓉依樣畫葫蘆，讓「魯有腳督率士兵，正在地下掘坑」。此時就連憨笨的郭靖都不禁懷疑：「這歐陽鋒狡猾得緊，吃了一次虧，第二次又怎再能上鉤？」魯有腳揭露這條計謀運用的正是兵書中的「虛者實之，實者虛之」，正因為對方不相信會用同樣的方法騙他兩次，他鐵定會上當！果然，歐陽鋒又連人帶椅落入坑中，但是這一次得到的待遇是「水灌陷阱」。幾鍋水從他頭頂往下澆，當時天氣酷寒，冷水離鍋立刻結冰，當場把歐陽鋒灌成一根大冰柱。依照前約，郭靖饒他二次不死。</p>\n\t\t\t<p>最後一次也很精彩，場景設在花剌子模名城撒馬爾罕城邊的雪峯上。黃蓉相約郭靖在「縱是猿猴也決不能攀緣而上」的雪峯絕頂見面，她想出一條登頂妙計，只要割下山羊的後腿，「乘著血熱，按在峯上，頃刻間鮮血成冰，將一條羊腿牢牢的凍在峯壁，比用鐵釘釘住還要堅固」，羊腿登時變成一節一節的「羊梯」。</p>\n\t\t\t<p>在「萬年寒冰結成一片琉璃世界」中，郭靖終於見到了黃蓉。久別重逢後，情節又一轉折，他們發現歐陽鋒躲在冰岩後面，便假意研究《九陰真經》，引誘歐陽鋒又一次上峯。兩人陸續下峯後，就用石油長索一把火燒掉了羊梯，將歐陽鋒困在峯頂上。本來打算困他十天十夜才饒他不死，可是等到第四天，歐陽鋒竟然自行脫困了：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他除下褲子，將兩隻褲腳都牢牢打了個結，又怕褲子不牢，將衣衫都除下來縛在褲上，雙手持定褲腰，咬緊牙關縱身一躍，從山峯上跳將下來。……一條褲子中鼓滿了氣，將他下降之勢大為減弱。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>歐陽鋒竟然用褲子做了一個降落傘，實在神乎其技，也給了黃蓉靈感，終於想到一個「傘兵大隊從天而降」的攻城妙計。</p>\n\t\t\t<p>跳脫小說情境，就現實層面來看，這或許有些荒唐，製作降落傘沒那麼容易。但讀者沒人在乎，因為讀者與作者之間已經存在一種默契。讀者會在進入武俠小說的世界時擱置懷疑的念頭，相信小說中登場人物的本事、發生事件的離奇，雖然明知未必真實，仍能認可小說家的設定，容忍非現實的事物。</p>\n\t\t\t<p>在這裡，金庸把讀者交託的這份默契擴張到極致，把美國好萊塢的電影場面寫進了武俠小說裡，讀者完全無法預期小說中竟會出現一支萬人規模的傘兵部隊，卻不覺得突兀，仍然越陷越深地讀下去，這是金庸的本事。即使金庸在小說中加入各式各樣的現代元素，卻仍符合傳統武俠小說的鋪陳原則。也就是說，他是按照武俠小說的敘事傳統，套用章回小說的「套盒」，大的盒子套著小的盒子，一環扣著一環，導引向作者想要設置的情節。在歐陽鋒三次與黃蓉鬥智的橋段中，讀者已放下心理防備，信任小說家所建立的規則。</p>\n\t\t\t<p>這就是金庸武俠的新穎之處，但是他的「新」又不是隨便亂來的。他知道怎麼將新奇的內容跟武俠小說中建立的世界觀牽合在一起。</p>\n\t\t\t<p>再舉一個例子，這是金庸自己說過的，即《射鵰英雄傳》第二十四回〈密室療傷〉。這一回寫到郭靖為護《武穆遺書》，在臨安皇宮被歐陽鋒的蛤蟆功擊得重傷，黃蓉帶著郭靖躲到了牛家村曲三酒館的密室裡，要花上七天七夜的時間幫郭靖療傷，過程中兩人必須手掌相抵，不能離開片刻。所以這裡先預設了一個條件，就是他們兩人在這七天七夜中是不能分開的，也就意味著他們沒有辦法分身抵抗敵人。還好有這樣一間密室，密室牆上還有一個小孔，可以看到外面發生了些什麼事。</p>\n\t\t\t<p>接下來，這個牛家村在這段時間裡變得異常熱鬧。有原本就住在這裡的傻姑，然後來了一批人，有完顏洪烈、楊康、彭連虎、侯通海、梁子翁、靈智上人等人，接著又來了程瑤迦和陸冠英，全真派的尹志平也來了，跟在尹志平後面的是桃花島主黃藥師。</p>\n\t\t\t<p>黃藥師的出現提升了在場武林人物的武功層級，接著跟黃藥師同一等級的周伯通也出現了。周伯通和西毒歐陽鋒正在較量輕功、互相追逐，歐陽鋒既然在，他的侄子歐陽克也在這裡。另外又來了穆念慈，更驚人的是，本來應該在蒙古的托雷和華箏也來到了牛家村。蒙古人之後，包括馬鈺、丘處機在內的全真七子也都來了。再後來呢，還有一個招搖撞騙的假裘千仞，又跟來一個可怖但值得同情的鐵屍梅超風。梅超風還不是最後出現的，後面還有江南六怪。先後出現這麼多人，這些人進進出出這曲三酒館，小說也就從二十四回一直寫到了二十六回。</p>\n\t\t\t<p>從一個角度看，就像傘兵大隊一樣，這是有些荒唐的情節。為什麼偏偏在這七天七夜當中，幾乎是《射鵰英雄傳》中所有重要的人物，都被金庸安排了「路過」牛家村，齊集在郭靖、黃蓉二人療傷的密室之外？</p>\n\t\t\t<p>然而金庸是有意識地寫這一段的，他曾坦言這一段敘事手法是受到戲劇的影響。因此，如果換另一個角度看，金庸實際上寫出了一齣「獨幕劇」。依據獨幕劇的邏輯，這些就說得通了。獨幕劇就是要在一個非常濃縮的時間與情境下，把不同的人與人之間的衝突、人與人之間的感情，用最密集的方式表達出來。另外，金庸在這裡也設下了一個自我挑戰。首先，是要盡可能寫到更多的角色，在能夠解釋的範圍內，讓他們進進出出於這個獨幕劇舞臺上。再來，藉由這些人物的交集、衝突，不斷提升讀者在閱讀時的緊張感。就像郭靖和黃蓉一樣，他們不能被發現，所以無論外面發生了什麼事都無能為力，只能在一旁窺看。接下來會有什麼狀況？他們不知道，我們也不知道，心情也就跟著緊張起來。</p>\n\t\t\t<p>用這種方法，金庸在考驗自己能夠寫出多少驚險情節來。先是侯通海發現了密室，眼看就要闖進去，卻被黃蓉「扮鬼」嚇跑了；還有個歐陽克，他已經知道黃蓉躲在密室裡且大打出手，隨後卻被楊康暗算了。接下來是幾場驚險的打鬥，像是全真七子與梅超風的殊死決戰，黃蓉和郭靖明知他們受人愚弄，卻只能乾著急。還有陸冠英與程瑤迦的拜堂成親，兩人調笑的親密言語，讓郭靖情慾浮動，差一點就把持不住。這麼多人連番上場，一幕幕情節有鬆、有緊，有快、有慢，形成了小說中近乎獨立的一齣戲碼。</p>\n\t\t\t<p>這是新的寫法，也寫出了新的內容，不是來自武俠小說，也不是來自傳統章回小說。金庸跳得更遠，借鏡了西方的戲劇形式，運用在《射鵰英雄傳》裡。</p>\n\t\t\t<p>我們覺得這一段寫得精彩，卻不會感到和前段、後段的敘事手法搭不上，或是特別突出。這又是一個重要的例證，金庸十分擅長融合新的筆法，而在運用這些新風格、新形式的時候，不會去挑戰讀者的預期感受。我們愈瞭解這樣的寫法有多麼困難，就愈知道金庸的成就有多麼高。</p>\n\t\t</div>"},{"title":"07 連載小說的技藝錘鍊","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-39\"><span>0</span><span>7</span></h6>\n\t\t\t<h1>連載小說的<br/>技藝錘鍊</h1>\n\t\t\t<p>金庸小說一開始都是在報刊上連載，而且大部分是每日刊出。每一天要產出多少篇幅的內容，其實對於連載作家來說，是不小的拘束和壓力。例如每一天都要安排「事件」，也就是說，為了吸引讀者有繼續讀下去的動力，連載小說必須持續營造出故事的懸疑感。</p>\n\t\t\t<p>因此連載小說的敘事面臨兩個難處。第一個難處在於故事情節不停地發展，作者必須不斷地構思事件，很容易就遇到瓶頸；第二個難處其實更棘手，就是當連載小說出版成書，讀者很容易感覺閱讀疲勞，因為每隔一兩頁，小說角色就又處在突發事件的情境中。</p>\n\t\t\t<p>倘若每天要寫一個新事件，很快就會面臨無事可寫的窘境，鑽進了死胡同。所以要寫連載小說，必須運用各式各樣的寫作技巧。好比金庸，一開始就已經懂得運用純熟的鋪陳手法，讓小說中的各個角色「打群架」。「打群架」是最容易讓小說連續好幾天都維持在有事件發生的狀態中。翻開《書劍恩仇錄》，不難看到金庸在設計武打橋段時，通常不是一對一過招，只有讓「多俠」混戰，才有辦法延續很長一段篇幅。</p>\n\t\t\t<p>從這一點來看，《射鵰英雄傳》中郭靖的來歷，隨著江南七怪的蹤跡而開展，是金庸在寫作上刻意的構思。從江南七怪在醉仙樓初登場，就可以感受到群戲的迷人之處，而且單是描寫其中一怪，就可以鋪陳許久。接著，丘處機與七怪比鬥，將一口數百斤重的銅酒缸托上酒樓，輪流向七怪敬酒，七怪一個一個接招，酒缸在眾人之間推過來飛過去，最後還飛到街外，老六韓寶駒倏忽用他肉團般的身軀擋了下來……，這段情節金庸大寫特寫，寫個三五天就過關了。</p>\n\t\t\t<p>群戲的一大特色是熱鬧，金庸是很擅長寫群戲的。群俠混戰有時也可以營造出一種懸疑感，例如《射鵰英雄傳》第三十八回〈錦囊密令〉，在被蒙古軍洗劫的村落石屋裡，周伯通、郭靖、裘千仞及歐陽鋒四人在漆黑之中混戰成一團，一下聯手，一下又交手，寫出群戲的趣味。</p>\n\t\t\t<p>但鋪陳群戲，讀者很容易過目即忘，因為過多的角色和事件夾雜在小說情節中，難以讓讀者留下深刻印象。金庸寫完《書劍恩仇錄》、《碧血劍》之後，直到《射鵰英雄傳》，才在寫作上有了重要的突破，也就是找到一個能貫穿小說的主題。即使在連續不斷的事件及插曲中，讀者會忘記或混淆故事片段，但對於貫穿小說的核心命題，往往能銘記於心。</p>\n\t\t\t<p>譬如前文提到，從〈鐵槍廟中〉開始鋪陳黃蓉和歐陽鋒鬥智的情節，延續到〈大軍西征〉、〈從天而降〉，在這幾回中，貫穿的主題就是——郭靖和黃蓉之間的愛情。當郭靖說出饒歐陽鋒三次不死，這並不是自大之語，而是金庸從黃蓉的角度來寫郭靖的思考模式；雖然明知歐陽鋒是殺了他五位師父的大仇人，即使郭靖一生堅守忠義之道，但為了保護黃蓉，只要歐陽鋒答應不傷害她，他可以退讓三次，意味著他願意在報師門深仇這件事上，付出三倍的代價。這是金庸小說敘事的深刻及動人之處。</p>\n\t\t\t<p>金庸從來不寫單一的場景，即使當他落筆寫下如好萊塢電影傘兵大作戰般的畫面，仍然表現出小說家的世故與圓融，不會任由這個場景單獨存在，而是包覆在細膩且完整的情節脈絡下，讓讀者讀來絲毫不覺得突兀。</p>\n\t\t\t<p>金庸的武俠小說催生了奇異的閱讀效應，或者說，養壞了讀者的閱讀口味。原本武俠小說家在集體的武林通則中各顯神通，只要萬變不離其宗，無論怎麼寫，讀者都會買單。到了金庸，他在武俠小說中增添了許多內在層次，以至於讀者在閱讀過程中有著更多的期待，就無法回頭再看其他的武俠小說——怎麼可能只寫到這種程度。金庸之後，武俠小說的創作邁向了新的標準。</p>\n\t\t\t<p>金庸小說的一大特點是人物辨識度極高，像是楊過、喬峯、張無忌等形象鮮明的主角，或是搶眼的配角如岳不羣、李莫愁等。讀者常常熱烈討論，並在現實世界裡找尋貌似小說角色的形象。無論是人性心理的豐富性，或是人物形象的描摹刻畫，金庸總能讓小說角色引起讀者高度的興趣，展現高超的小說藝術。</p>\n\t\t\t<p>在《射鵰英雄傳》之前，從來沒有一部武俠小說出現過黃蓉這樣的角色。在黃蓉身上，想像中的武俠「隱世界」，套接上了「顯世界」中的傳統知識學問，從詩詞歌賦、歷史掌故，到琴棋書畫，甚至術數奇門等都無所不精。在閱讀這個角色的同時，會不知不覺在傳統知識系統中穿遊，這是其他武俠小說無法提供的閱讀體驗。</p>\n\t\t\t<p>你不需要完全理解黃蓉所精通的學問，譬如當她為瑛姑解明她所留下的三道算題，傳授解題的算式：「以三三數之，餘數乘以七十；五五數之，餘數乘以二十一；七七數之，餘數乘十五。三者相加，如不大於一百零五，即為答數；否則須減去一百零五或其倍數。」即使你對於這個解答全然摸不著頭緒，也無礙於閱讀上的樂趣，反而跟著瑛姑神馳目眩，暗暗讚歎，折服於這個角色的聰穎，進而被小說故事說服了。同時，當我們看著瑛姑為了救出困在桃花島的周伯通，日夜苦思、鑽研術數，即使心知肚明再研習一百年也無用，根本勝不了桃花島主人的學識，仍然殫精竭慮，陷在術數的魅力中而欲罷不能，進而認同瑛姑的癡狂。閱讀至此，小說角色和故事情節完全虜獲了我們。</p>\n\t\t\t<p>普通的小說家寫不出這樣滿腹經綸、魅力十足，又令人信服的角色，無法像金庸一樣將傳統知識文化編織在小說敘事之中。敘事層次豐富的作者可以描寫扁平的扁形人物（flat character），換言之，立體的圓形人物（round character）不可能出自敘事簡單的作者筆下。對照之下，意味著小說中最複雜的角色，往往回應了小說作者的複雜程度，由此來看，至少在武俠這個類型小說的領域裡，金庸是獨一無二的。</p>\n\t\t\t<p>金庸創作過的角色，比如楊過、小龍女都令人印象深刻，但這兩個角色的形象純粹，都是屬於性格偏執的類型人物，是一般小說家可以掌握的。金庸的最大挑戰是寫出那些錯綜複雜的角色，他早期的突破之作《射鵰英雄傳》，其中的關鍵人物是黃蓉，而非郭靖。從塑造人物的難易度而言，郭靖是比較好駕馭的，難寫的是黃蓉及黃藥師。</p>\n\t\t\t<p>到了創作中後期，金庸在敘事上又有所超越，例如表現在《笑傲江湖》岳不羣這個角色身上。如果小說家的內心不存在豐富的層次和深度，絕對寫不出像岳不羣這種表裡不一、城府至深的人物。再往後看，在金庸小說的創作史上，《鹿鼎記》極為重要，這部作品總和了金庸寫小說的本領和敘事技巧，堪稱登峯造極，也就一點不令人意外。《鹿鼎記》之後，金庸再無新作，因為他已寫盡他所能寫的武俠小說。</p>\n\t\t</div>"},{"title":"第六章 《神鵰俠侶》 問世間情是何物","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-40\"><span>第六章</span></h6>\n\t\t\t<h1>《神鵰俠侶》</h1>\n\t\t\t<h4>問世間情是何物</h4>\n\t\t\t<div>\n\t\t\t\t<div id=\"_idContainer008\">\n\t\t\t\t\t\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>"},{"title":"01 難民潮背景下的《明報》","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-41\"><span>0</span><span>1</span></h6>\n\t\t\t<h1>難民潮背景下<br/>的《明報》</h1>\n\t\t\t<p>金庸小說有其獨特魅力，如果試著去瞭解金庸小說的寫作背景，亦即金庸當時所處的時代環境，會更容易理解金庸在武俠小說創作上的突破。如果同時精讀小說內容，就更能理解作者思想中最終極的關懷。</p>\n\t\t\t<p>然而，大部分讀者對於小說的創作背景並不清楚。因為武俠小說是類型小說，讀者不覺得需要嚴肅以待。金庸在非比尋常的時代背景下，一邊辦報紙，一邊寫小說，今天的讀者確實難以想像上世紀五○、六○年代的社會氛圍。</p>\n\t\t\t<p>一九五九年五月十九日，金庸在《香港商報》刊出《射鵰英雄傳》大結局。五月二十日，《明報》創刊號上開始連載《神鵰俠侶》第一期。金庸為《新晚報》寫《書劍恩仇錄》時，就發覺連載小說有其死忠讀者，雖然讀者不一定會買報紙，卻也可以提高報紙聲名，引起關注。因此，在報上開闢武俠小說專欄，可說是金庸辦報的重要策略。</p>\n\t\t\t<p>金庸以八萬港幣資本創立《明報》，一開始便設定以武俠小說作為報紙支柱，必然影響報紙的定位。當時《明報》為娛樂性小報，以副刊為主，苦撐了兩年之久。一九六二年五月，爆發「五月逃亡潮」，在良心驅策下，《明報》搶先報導大陸逃港難民被集體遣返的新聞，才改變了一直以來不左不右的中間立場，一時間輿論沸騰，也豎立起《明報》人道主義的精神形象，漸漸轉型為以新聞及社評為主的大報。</p>\n\t\t\t<p>回顧逃亡潮的歷史背景，必須再往前追溯至一九五七年。不曾生在那一個年代，很難理解當時的人所面臨的艱難。重述這段歷史，讓我想起一九六二年是多麼特殊的一個年分；我自己在一九六三年出生，卻從未意識到這一年牽連著一段多麼震撼的歷史事件。我早認識了和我同年出生的香港才子作家馬家輝，後來我們兩人在深圳遇到了胡洪俠，沒想到他也是一九六三年生的。因緣際會，我們三人共同在《深圳晶報》寫專欄，後來集結成書《對照記@1963》，書名凸顯了我們都出生於一九六三年。從此之後，就經常遇到讀者來相認，說他是這一年出生，或者他爸媽也是這一年出生。</p>\n\t\t\t<p>某一次聊天時，與胡洪俠提到這件事。胡洪俠說在他長大的河北衡水村子裡，基本上同一代人當中，極少比他年長三四歲；換言之，從一九六三年往前推算，約一九五八至一九六二年，幾乎沒有嬰兒出生。</p>\n\t\t\t<p>學界一般從一九五八年開始定義中國大陸的「三年困難時期」，當時中國發生嚴重的糧食短缺。到了一九六二年，連稻米之鄉廣東都發生了饑荒。廣東饑饉，便影響到香港，因為大批難民從廣東沿海冒險湧入。香港當時人口約三百三十萬，地狹人稠，港英政府認為香港人口負荷量已至極限，所以明確拒絕、禁止廣東難民從新界進入香港，這是基於現實因素上的考慮；作為對比，只需觀察香港現今緊張的局勢即可，幾乎是同樣的面積，現今名義上人口已有七百五十萬，實質人口大約逼近九百五十萬。這多出來的兩百萬人，就是來自大陸的移動人口。</p>\n\t\t\t<p>難民湧入香港，擾亂香港當地的供需平衡，人口一超載，將衍生許多問題，如教育體制被破壞，租房與住房亂象叢生。當時港英政府便決定遣返逃港難民，這項政策也得到不少人支持。</p>\n\t\t\t<p>但當時三百三十萬人口當中，超過一百萬人是一九四九年之後來港的，很多人剛離開大陸不久，能完全對大陸漠不關心嗎？不免有著複雜且矛盾的心情。以自身利益的角度，不宜接納廣東難民，但從人道主義的角度，也就是《明報》在一九六七年五月二十六日的社評〈豈有他哉？避水火也！〉，標題表示的，前後各波來港者，都同樣出於「避水火」的動機。</p>\n\t\t\t<p>《明報》以人道主義為出發點，立場既非左派也非右派，更不是站在港英政府的立場，《明報》社評撼動了當時許多人，激發香港人的憐憫與同理。金庸提醒香港人珍視安居樂業的當下，回想香港過去的移民史，身為被殖民的人民，對於同樣血脈的難民處境可以置若罔聞嗎？香港人至少可以付出人道關懷。金庸在一九六二年五月十五日發表首篇社評〈火速！救命！——請立刻組織搶救隊上梧桐山〉，並在短時間內派記者前去沙頭角梧桐山，報導難民的處境。這期間的新聞報導，為《明報》帶來關鍵的大轉折。</p>\n\t\t\t<p>港英政府治理香港的基本態度是：不涉及左、右派之爭，只要香港人在生活及經濟上一切守法，按照港英政府法律行事，發表任何言論皆不會被干涉。在此情況下，香港也同時關注大陸及臺灣的動靜。</p>\n\t\t\t<p>《明報》轉型為大報之後，開始增加正刊的新聞報導內容。金庸長期關注國際外交事務及國際關係評論，能夠快速掌握國際媒體訊息，也解析臺灣與大陸之間的關係及動態。武俠小說之外，我們也不能忽略金庸寫時評的能力，在經營《明報》前二十年的時間裡，金庸一共寫了約七千篇社論。雖然社論文章並未署名，但香港人自能辨別哪一篇出自金庸手筆，因為《明報》會以字體做區別，只要社評主筆是社長金庸，就用粗體宋體，其他人主筆則用楷體。</p>\n\t\t\t<p>這其實擔負著很大的風險。即使今天的記者寫新聞報導，都還是有消息掌握不夠全面的風險，何況那個年代，不論臺灣及大陸，都還處在非常封閉的社會狀態，很多時候金庸只能依據官方消息判斷局勢。以我自己的經驗，在《新新聞》週刊擔任總編輯時，曾經與資歷比我還深的記者共事過，他們身上必須有很多本事。例如，這些記者腦袋裡至少要能裝下兩千個電話號碼，一旦突發新聞事件，連翻本子、找電話的時間都很迫促，可能得撥打數十通電話，才能跑到一條獨家新聞。</p>\n\t\t\t<p>回顧香港當時局勢，金庸洞悉《明報》最重要的價值與立基何在。一九六二年六月，他為《明報》新闢專欄「自由談」；這個專欄名字現今或許已司空見慣，但對於上世紀六○年代的時代氛圍而言，提及的「自由」絕不能等閒視之。專欄「自由談」開版後，以「有容乃大，無欲則剛」為編輯室座右銘，由總編輯親自審閱稿件，號召讀者投稿。發刊詞寫道：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>本報定本月十七日起，每星期增出「自由談」副刊，內容自由之極，自國家大事、本港興革、賽馬電影，以至飲食男女、吸煙跳舞，無所不談。歡迎讀者諸君，惠賜稿件。來稿思想意見極端自由，極左極右，極高極低，無不拜嘉。本港迄今為止，當無如此「真正自由之至」的報紙副刊，《明報》不受任何政治力量的影響，為純粹的民間報紙，有條件同時刊登資本主義和馬克思主義者的文章，來稿貴乎「言之有物」，最歡迎談事實，比較不歡迎空談謾駡，但車大炮亦為自由之一，車得精彩，豈非快事？「自由談」副刊由本報總編輯親自處理來稿，保證不偏不倚，公正無私，對任何讀者均極端尊重。稿酬從豐，每篇希勿超過一千五百字。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這段徵稿的發刊詞，其中關鍵的句子就在「有條件同時刊登資本主義和馬克思主義者的文章」。這句話指出金庸深諳《明報》的重要性在於既非左派、也非右派的立場，甚至可以容納左右兩派不同的意見，不逢迎左右兩派的讀者。反映在報紙銷量上，立即凸顯出《明報》與其他報紙的高下之別，豎立了《明報》的獨特招牌。可是這種做法也容易使自己陷入兩難，這種既非左派、也非右派的立場，當然會引起兩方的攻訐，聯合起來駡《明報》及查良鏞，逐一找碴《明報》社評所提的各種議題。</p>\n\t\t</div>"},{"title":"02 筆戰與重生","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-42\"><span>0</span><span>2</span></h6>\n\t\t\t<h1>筆戰與重生</h1>\n\t\t\t<p>一九六四年，金庸前往日本參觀《朝日時報》，同時見到《朝日時報》社長及日本外相大平正芳。當外相對《朝日時報》社長鞠躬、社長回禮時，金庸下意識地認為，鞠躬的這個人一定是《朝日新聞》社長，因為中國官場的習慣向來如此。但一旁同行的人解釋說鞠躬致意的是外相，從來沒有報社社長向官員鞠躬的道理。金庸一聽非常驚訝。這次出訪日本所見所聞，讓金庸體會到何為新聞媒體的風骨與報格。</p>\n\t\t\t<p>《朝日新聞》針對金庸此行發佈了一則新聞，寫香港《明報》編輯部長金庸來訪。新聞一刊出，左派報紙立即抨擊查良鏞，時間長達一個月之久。這條新聞問題出在哪裡？在「編輯部長」四個字，左派報紙對此大做文章，說金庸吹噓自己，中國從來沒有「編輯部長」這個職稱，但這其實是日文翻譯問題。對於左派報紙有意攻訐，金庸絲毫不退讓，他特意在《明報》頭版刊登頭條新聞回應，寫明「敬請」某左翼報紙「指教和答覆」。《明報》與左派五大報之間的論戰一直延續至同年十一月，從頭至尾只有金庸一人執筆獨戰左派報紙所有文章。</p>\n\t\t\t<p>不過，這次完全不對等的香港報業論戰突然收場，實質上等於金庸勝出。極有意思的地方在於：首先，這起事件非常類似武俠小說的情節，以一敵五而最終獲勝；其次，國民黨雖然不喜歡金庸，卻從未以筆戰方式圍剿《明報》，當時主要發動攻擊的是《大公報》及《新晚報》。</p>\n\t\t\t<p>回首一九五五年金庸開始寫武俠小說，正是為了刺激《新晚報》的報份銷量。他創辦《明報》之後，相當長一段時間內，每逢《大公報》社慶，金庸都會受邀為《大公報》寫社論，這表示《大公報》十分看重金庸的文筆，他與《大公報》也一直維持良好關係，甚至當《大公報》記者替《明報》寫稿，《大公報》也毫不干涉；從另一個角度看，《明報》能夠順利經營，《大公報》其實功不可沒。但及至一九六四年，《大公報》、《新晚報》顯然與《明報》決裂了。</p>\n\t\t\t<p>對於這段過往的心路歷程，金庸留在了他的武俠小說裡。梁羽生曾經提過，當時金庸正在寫《天龍八部》，對照現實，小說有一幕場景反映了金庸當時的心境——蕭峯在聚賢莊英雄大宴上，端起一碗酒說道：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「這裏眾家英雄，多有喬峯往日舊交，今日既有見疑之意，咱們乾杯絕交。那一位朋友要殺喬某的，先來對飲一碗，從此而後，往日交情一筆勾銷。我殺你不是忘恩，你殺我不算負義。天下英雄，俱為證見。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>飲酒斷義之後，蕭峯以一人之力大戰中原武林群豪。這種武俠情節竟然出現在現實裡。</p>\n\t\t\t<p>依照武俠小說套路，經過八方人馬圍剿的情況下，一個人未死而活下來之後，武功一定會鍛鍊得更高強。《明報》經歷一九六四年這一場論戰後，總發行量已達到八萬份。實在應該感謝這些左派報紙，讀者都搶著看《大公報》怎麼攻擊金庸，金庸又如何回應。這是金庸人生當中另一段極為奇特的高峯，堪稱戲劇性，他的社評竟然比武俠小說還受歡迎。</p>\n\t\t\t<p>當左派報紙圍剿《明報》時，《明報》已經站穩香港第一大報的位置。作為香港第一大報，《明報》的基本路線及特色，在於不畏懼報導並解讀臺灣與大陸之間的關係。從這一角度來看，在香港報業史上，唯一能在立場與地位上跟《明報》相提並論，甚至能挑戰《明報》的新聞媒體，只有《新聞天地》雜誌。《新聞天地》創辦人是卜少夫，這份週刊與《明報》最大的共同點，在於兩者皆以中立的立場處理兩岸議題，而且都以見解精闢聞名。只不過《新聞天地》與《明報》在許多事件的解讀上，往往並不一致。所以當時香港讀者另一趣味，就是在大事件發生時，同時讀《明報》與《新聞天地》，對照看看查良鏞和卜少夫兩人是否持有相同看法。</p>\n\t\t\t<p>《明報》成為香港第一大報後，為維持名聲不墜，金庸必須持續精準地分析及預測社會局勢。那段時間，《明報》及查良鏞在香港報業的地位是相當高的。但由於金庸作為武俠小說家太成功，相對也付出了另一種代價：倘若他沒有成為金庸，作為《明報》社評主筆的查良鏞，在那個時代也絕對可以留名。只是金庸寫武俠小說的名氣遠勝過寫時評的查良鏞，及至後來，查良鏞走出人們的記憶，不記得他寫時評的筆鋒不亞於寫武俠小說的文采。</p>\n\t\t\t<p>當其他的報紙都從立場上發聲，唯有「國家大事、本港興革、賽馬電影，以至飲食男女、吸煙跳舞無所不談」的《明報》，能夠精闢地指陳時事，觀察兩岸局勢，成為公認可以信賴的新聞媒體中心。</p>\n\t\t\t<p>《明報》的影響力極大，部分肇因於查良鏞的社論風格趣味盎然。一方面顯示出查良鏞這期間對政治局勢的觀察及用心，遠超過他以往對中國事務所投注的關心；另一方面，由於十分洞悉中國時局，也因此從中衍生出感慨。例如查良鏞當時深信「文革」不只是文化事件，也預知這場政治浩劫很難收場。</p>\n\t\t</div>"},{"title":"03 在海嘯來襲的時候，築一道牆","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-43\"><span>0</span><span>3</span></h6>\n\t\t\t<h1>在海嘯來襲的時候，<br/>築一道牆</h1>\n\t\t\t<p>為何查良鏞如此關注「文革」？因為「破四舊」，即紅衛兵提倡的破除舊思想、舊文化、舊風俗、舊習慣。舉例來說，七○年代金庸全面修訂他的小說，陸續推出《金庸作品集》，香港和臺灣版本的小說前面，每一冊都選刊了與小說主題相關的歷史圖像。讀者也許完全不在意，但對於金庸來說卻彌足珍貴；他竭力尋找與小說內容相關的文物紀錄，舉凡宋代武器圖、古硬幣碑帖器物棋譜雕刻書冊、近代名家如八大山人、郎世寧的繪畫等，全都在他收錄的範圍之內。然而，這些珍貴歷史文物都是「四舊」，全都成為紅衛兵欲毀之而後快的邪惡存在。一九六六年一月，金庸做了一件至關重要的事，他決定在原來的報社之外另租一間辦公室，並打通辦公室隔間，設作藏書室，供他個人辦公使用。</p>\n\t\t\t<p>另闢一間辦公室，是為了創辦《明報月刊》。也就是在「文革」爆發的當下，《明報月刊》正式創刊。金庸後來在整理創辦《明報月刊》的心情時，曾經留下一句話：「在海嘯來襲的時候，築一道牆，把能夠留住的東西給留住。」 </p>\n\t\t\t<p>應該如何定義《明報月刊》？《明報月刊》和《明報》不一樣，對金庸而言，這份月刊是保存中華文化的重要基地，「把能夠留住的東西給留住」，這句話非常重要。我們可以回頭這樣看，金庸在寫武俠小說的時候，應該很早就動過這樣的念頭。時局不斷變化，許多東西在快速的變化中似乎都將消失了，所以他才有如此心情。</p>\n\t\t\t<p>雖然以香港為基地，雖然在香港發行，可是《明報月刊》是面對廣大海外，所有對中華文化有意見、有信念、有情感的華人。金庸自己是創辦人兼任總編輯，到一九六八年六月由胡菊人接任總編輯。他們兩人的基本做法就是想辦法蒐羅關於中華文化的各種文章。</p>\n\t\t\t<p>從《碧血劍》到《射鵰英雄傳》，金庸的寫作技法有著極大的飛躍；而從《射鵰英雄傳》到《神鵰俠侶》，又是另一個重要的轉折期。其中最關鍵的，來自查良鏞的《明報》副刊理念，舉凡「國家大事、本港興革、賽馬電影，以至飲食男女、吸煙跳舞，無所不談」。他心裡自有一個非常清楚的意念：除了《明報月刊》要做的，也企圖在武俠小說中保留另一些珍貴的東西，將來在香港可能再也見不到，甚至從此絕跡於時代洪流中的東西。那是什麼？那是天真的愛情。</p>\n\t\t\t<p>仔細探究《神鵰俠侶》的基本寫法，為什麼與《射鵰英雄傳》如此不同？因為一開場，所有人、事、物指向的重要核心是愛情。書中人物的恩怨情仇都始於愛情關係的糾葛，愛情竟然在人的生命中扮演如此關鍵的角色。因此，「愛情」元素於一般武俠小說被視為過場，但在《神鵰俠侶》中，「終南山下至死不渝的愛情」為通篇小說定調。《神鵰俠侶》以李莫愁、陸展元、何沅君與武三通之間的四角畸戀開場，實在太過奇特，本來接在《射鵰英雄轉》華山論劍之後，應該以黃蓉與郭靖為主線的故事，卻被楊過與小龍女的愛情喧賓奪主。</p>\n\t\t\t<p>武三通登場時是個「怪客」，瘋瘋癲癲說著傷心往事，陸無雙與程英兩個小女孩帶他去看槐樹下陸展元與何沅君夫婦的墓。武三通得知義女死訊，悲憤地狂叫、拔樹，不停出掌劈向陸展元的墓碑：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他呆了一呆，叫道：「我非見你的面不可，非見你的面不可。」雙手猛力探出，十根手指如錐子般插入了那座「陸門何夫人」墳墓的墳土之中，待得手臂縮回，已將墳土抓起了兩大塊。只見他兩隻手掌有如鐵鏟，隨起隨落，將墳土一大塊一大塊的鏟起。程陸二人嚇得臉無人色，不約而同的轉身便逃。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是小說第一個場景。接下來，第二個場景來到陸家莊：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>卻見牆上印著三排手掌印，上面兩個，中間兩個，下面五個，共是九個。每個掌印都是殷紅如血。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這是李莫愁留下的，因為她「殺人之前，往往先在那人家中牆上或是門上印上血手印，一個手印便殺一人」，陸立鼎一看，便知這是滅門警訊。這兩段畸戀，一個是武三通對義女何沅君的不倫之情，一個是李莫愁對陸展元的偏執之愛。陸展元移情別戀，與何沅君結為夫婦，導致李莫愁因愛生恨，從此性情大變，殺人不眨眼。她但凡聽到有誰「姓何」，或是看到「沅」字，便聯想起「何沅君」橫刀奪愛，對不相干人痛下殺手，「手刃何老拳師一家二十餘口男女老幼」，還不分青紅皂白，「在沅江之上連毀六十三家貨棧船行，只因他們招牌上帶了這個臭字」。</p>\n\t\t\t<p>這兩段畸戀都圍繞在「所愛之人棄己而去」的糾結上，而被棄之人終至瘋魔。十年前陸展元與何沅君的婚宴上，武三通與李莫愁同時大鬧宴席，卻被座中「一位大理天龍寺的高僧」制止，「保新夫婦十年平安」。十年約期一至，李莫愁心中仇恨高漲到不可思議的地步，一心要滅門洩憤。這兩段畸戀，是小說中的過場，同時也為小說主軸定調，如同後來李莫愁在烈焰之中臨死前仍淒厲唱著：「問世間，情是何物，直教生死相許？」堪稱《神鵰俠侶》的主題曲。</p>\n\t\t\t<p>金庸嚴肅看待「情是何物」這個小說主題。以往武俠小說裡提及生死，都是關乎俠客義氣與武林存亡，從傳統俠義小說以降，「義」重於一切。《射鵰英雄傳》也是如此，金庸在郭靖身上著墨最多的就是「義氣」二字，郭靖這個角色也象徵「義」。對照來看，黃蓉是武林怪胎，她可以不講義氣，而是以親情為重，在角色設定上，她性格中唯一較不可信的地方，在於她對郭靖的一片癡情；如此聰明絕頂的角色，為何會深愛郭靖？但金庸仍然發揮小說家本事，讓讀者覺得黃蓉愛郭靖愛得合情合理。</p>\n\t\t\t<p>到了寫《神鵰俠侶》，金庸反而認真地問：為何愛情可以「生死相許」？這部小說中出現的重要角色，都將愛情看得比自身生命還重要。為什麼會將愛情凌駕於生死之上？因為他們全都是感情殘缺之人。</p>\n\t\t\t<p>兩段畸戀開場之後，郭靖的故人之子楊過登場了。但是看楊過遇見郭靖的情景，便知楊過此時還不是主角。</p>\n\t\t</div>"},{"title":"04 楊過：從《阿Q正傳》跑出來的俠","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-44\"><span>0</span><span>4</span></h6>\n\t\t\t<h1>楊過：從《阿<span>Q</span>正傳》<br/>跑出來的俠</h1>\n\t\t\t<p>楊過這個角色有趣極了，他不折不扣是個誤打誤撞的主角。依照金庸原先的設定，《神鵰俠侶》接續《射鵰英雄傳》，寫成吉思汗死後郭靖、黃蓉的後續事蹟。但寫著寫著，楊過變成了主角。從楊過初次登場的形象，可以推測金庸在連載過程中，很可能更動了原先小說的情節設定。</p>\n\t\t\t<p>《射鵰英雄傳》書末，穆念慈在鐵掌峯失身於楊康之後，回臨安故居途中，在樹林破屋生下楊過。某天險遭丐幫彭長老凌辱，被郭靖、黃蓉巧遇搭救。黃蓉說起楊康已在嘉興鐵槍廟中去世，穆念慈垂淚請郭靖為孩兒取名字——「楊過，字改之。」金庸以楊康的遺腹子為引子，續寫郭靖、黃蓉解襄陽城之危後的江湖。</p>\n\t\t\t<p>金庸開始寫楊過，背後隱含一個人物原型。楊過當時十三歲，住在一個破窯洞裡，在赤練仙子李莫愁、飛天蝙蝠柯鎮惡等人大戰之際：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>一個衣衫襤褸的少年左手提著一隻公雞，口中唱著俚曲，跳跳躍躍的過來，見窯洞前有人，叫道：「喂，你們到我家裏來幹麼？」走到李莫愁和郭芙之前，側頭向兩人瞧瞧，笑道：「嘖嘖，大美人兒好美貌，小美人兒也挺秀氣，兩位姑娘是來找我的嗎？姓楊的可沒這般美人兒朋友啊。」臉上賊忒嘻嘻，說話油腔滑調。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭芙罵他「小叫化」，其實並不為過。穆念慈早幾年已染病身亡，從此之後，楊過一個人孤零零流落在嘉興，住在破窯中，「偷雞摸狗的混日子」。將小楊過設定為乞丐，意指楊過就是阿<span>Q</span>，他是從魯迅《阿<span>Q</span>正傳》化身出來的一個角色。及至郭靖、黃蓉尋查而來，郭靖想要為不小心中了李莫愁冰魄銀針之毒的楊過治傷：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭靖見他臉上悻悻之色，眉目間甚似一個故人，心念一動，……翻掌抓住了他手腕。那少年幾下掙不脫，左手一拳，重重打在郭靖腹上。……那知拳頭深陷在他小腹之中，竟然拔不出來。他小臉脹得通紅，用力後拔，只拔得手臂發疼，卻始終掙不脫他小腹的吸力。郭靖笑道：「你跟我說你姓甚麼，我就放你。」那少年道：「我姓倪，名字叫作牢子，你快放我。」郭靖聽了好生失望，腹肌鬆開，他可不知那少年其實說自己名叫「你老子」，在討他的便宜。那少年拳頭脫縛，望著郭靖，心道：「你本事好大，你老子不及乖兒子。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這段對話讓人聯想到《阿<span>Q</span>正傳》。阿<span>Q</span>生來有癩瘡疤，常被人取笑，當他「被人揪住黃辮子，在壁上碰了四五個響頭」時，心裡就想：「我總算被兒子打了，現在的世界真不像樣……」於是得勝似的心滿意足走了。幾乎全莊的人都知道阿<span>Q</span>有「這一種精神上的勝利法」，所以每當有人抓住他的黃辮子，都會衝著他說：「阿<span>Q</span>，這不是兒子打老子，是人打畜生。」</p>\n\t\t\t<p>金庸將楊過寫成阿<span>Q</span>，還在遇見瘋瘋癲癲的歐陽鋒時。歐陽鋒神志失常，第一次遇見楊過，就將楊過當作私生子歐陽克，要楊過叫他爸爸。楊過第二次再見到他：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過驚喜交集，叫道：「是你。」那怪人道：「怎麼不叫爸爸？」楊過叫了聲：「爸爸！」心中卻道：「你是我兒子，老子變大為小，叫你爸爸便了。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過此時完全是典型的阿<span>Q</span>，插科打諢，在小說裡是個被嘲笑的對象，或許當時金庸有意借由楊過去寫他眼中所見的國民性。倘若順著這個思路，楊過當然名副其實是個負面角色，但這個負面角色一路誤打誤撞、闖蕩江湖，原先阿<span>Q</span>的那一面旋即消失了。</p>\n\t\t\t<p>金庸筆下的楊過，其實是個感情殘缺的人；他是遺腹子，母親又早逝，葬母之後，他就是個孤零零的小乞丐。阿<span>Q</span>也「沒有家」。但金庸沒有魯迅那般的黑暗與殘酷，魯迅從來沒有同情過阿<span>Q</span>，因為他認為中國文化的沉痾來自社會底層的阿<span>Q</span>精神，導致革命失敗。魯迅藉著為阿<span>Q</span>立傳，描繪中國社會最黑暗的一面。金庸卻非如此，當他寫楊過這個角色時，時而同情、憐憫楊過，所以讀者能從這個小乞丐身上，感受到他的人生困局在於自卑及自大。因為他是小乞丐，人人都可以欺負他、瞧不起他；當他對郭靖說出「倪老子」的雙關語時，其實是仿效了阿<span>Q</span>的「精神勝利法」，借由言語上佔人便宜來自我保護。對金庸而言，這樣卑微的人飽受世俗白眼與滿腹委屈，才發展出扭曲的性格，他實在不忍心讓楊過徹底變成阿<span>Q</span>再世。</p>\n\t\t\t<p>隨著情節推進，楊過不僅無賴，還癡情無比，將這兩項特質合在一起，才能完整地形塑楊過。他為什麼會對小龍女一往情深？甚至情癡到了義無反顧的地步？因為他是個孤兒，沒有人真心疼愛他。楊過不是在正常的人情環境下長大，但凡有任何人對他釋出一點善意，他都會牢牢抓住這份情感。例如，當楊過為了逃避全真教群道的追擊，摔在活死人墓旁的山坡草叢中，是孫婆婆救治了他。在孫婆婆慈愛的關切聲中：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過已好久沒聽到這般溫和關切的聲音，胸間一熱，不禁放聲大哭起來。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>所以當全真教郝大通誤殺了孫婆婆，楊過更悲痛得號啕大哭。</p>\n\t\t\t<p>他對小龍女的癡情，凌駕在自己的生命之上。金庸在楊過身上灌注了非常濃厚的棄兒情結，淋漓盡致地描寫楊過棄兒般的身世。例如，當小龍女應允孫婆婆死前遺言，要照料楊過一生一世，教他武功，即使小龍女責打他，楊過的反應竟是：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過道：「那要瞧是誰打我。要是愛我的人打我，我一點也不惱，只怕還高興呢。她打我，是為我好。有的人心裏恨我，只要他罵我一句，瞪我一眼，待我長大了，要一個個去找他算帳。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>面對全真派道士汙辱他、嘲弄他，他怒不可遏，絕不屈從；反之，因為他從小就缺乏關愛，如果有人捎給他一丁點善意，他也都悉數牢記在心裡。所以當小龍女問楊過：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小龍女道：「你倒說說看，那些人恨你，那些人愛你。」楊過道：「這個我心裏記得清清楚楚。恨我的人不必提啦，多得數不清。愛我的有我死了的媽媽，我的義父，郭靖伯伯，還有孫婆婆和你。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>除了癡情，楊過還非常狡猾，能想出各式各樣的詭計。楊過聰明絕頂，比如歐陽鋒教他驅毒的口訣和行功之法，金庸形容楊過「極是聰明，一點便透，入耳即記」，就連歐陽鋒也說：「你這孩兒甚是聰明，一教便會，比我當年親生的兒子還要伶俐。」所以在寫楊過時，為了凸顯他的聰明與狡猾，很多時候金庸不是從他的武功著手，而是在關鍵時刻以詭詐心計逃過難關。楊過給人的印象就是詭計多端，分不清他口中究竟是真話或假話，需時時提防他話裡有詐。</p>\n\t\t\t<p>《神鵰俠侶》有一幕，精彩生動地描述了楊過、金輪法王、李莫愁三人的輪番纏鬥。原來郭靖黃蓉之女郭襄在襄陽城出生之後，被小龍女抱出來打算到絕情谷為楊過換取解藥，哪知金輪法王窺伺在側，與楊過、小龍女在屋頂惡鬥起來，更沒想到李莫愁又橫加插手，抱走了嬰兒。從這裡開始，金輪法王、楊過和李莫愁三人一路從城裡追到了城外，隨即展開混戰，誰都想要把嬰兒搶到手。剛剛出生的小嬰兒正是混戰的籌碼，對不怕傷害嬰兒的人來說，她是一面護住自身要害的盾牌；另一方面，誰怕這個小嬰兒受到損傷，她就成為誰的累贅。兩兩相鬥之下，第三人旁觀戰局之餘，也在琢磨下手的最佳時機。一場不斷疾殺的混戰，比的不只是功夫高下，更是一場心理戰，較量誰能看破對方的弱點，在空隙中搶得先機。</p>\n\t\t\t<p>幾個回合下來，當法王從李莫愁拂塵下搶走嬰兒，才剛喜不自勝，楊過又不顧性命撲來，奪回了嬰兒。但楊過已被金輪法王看破弱點：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>法王見李莫愁不顧嬰兒，招數便盡力避開嬰兒身子，但見楊過唯恐傷害於她，兩個輪子便攻向嬰兒的多而攻向他本人的反少。這一來，楊過更是手忙腳亂，抵擋不住，大聲叫道：「李師伯，你快助我打退禿賊，別的慢慢再說不遲。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過抵敵不住，便想與李莫愁聯手，引得法王猜疑。哪知李莫愁只是袖手不動。又鬥一陣，楊過已然勢窮力竭，轉眼便要喪命：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>三人中法王武功最強，李莫愁最毒，但論到詭計多端，卻推楊過。他一陣傷心過了，隨即籌思脫身之策，心想：「郭伯母當年講三國故事，說道其時曹魏最強，蜀漢抗曹，須聯孫權。」李莫愁既不肯相助自己，只有自己去助李莫愁了，當下刷刷兩劍，擋住了法王，疾退兩步，突將嬰兒遞給李莫愁，說道：「給你！」</p>\n\t\t\t<p>這一著大出李莫愁意料之外，一時不明他的用意……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過急中生智，引三國蜀漢聯孫吳抗曹魏之鑒，強拉李莫愁作孫吳。這一招是嫁禍惡計，唆使金輪法王轉而攻擊李莫愁，楊過得以坐山觀虎鬥，「待二人鬥個兩敗俱傷，才出來收漁人之利」。其後楊過又以口舌虛張聲勢，說自己劍上有劇毒，讓之前被楊過長劍刺傷的法王，不由得擔心氣餒。楊過和李莫愁躲進山洞後，又是一番精彩的鬥智詭計，兩人終於脫離法王要脅，全身而退。</p>\n\t\t\t<p>小說一再強調，楊過此時的武功不足以抵擋法王等高手，但最後都能想出萬全的退敵之策。他之所以勝出，不是技高一籌，而是憑藉他的聰明狡詐。作為主角，楊過在小說中的形象，截然不同於陳家洛和袁承志這類的英雄面目。</p>\n\t\t\t<p>在正統的武俠世界裡，「俠」必然有其原則；行走江湖的大俠，其迷人之處正在於他的正義原則。但是當楊過這樣一個不按牌理出牌的俠，栩栩如生地出現在讀者眼前，陳家洛及袁承志之類的俠，就顯得有些無聊，因為他們太有原則了。在任何場合，這些「俠」一律堅守江湖的遊戲規則，尤其忌諱以多欺少、以強凌弱。當金庸筆下的楊過一出場，你會發覺，武林不就應該是現實的武林嗎？武林之中，難道所有人只能靠比武爭勝嗎？面臨生死存亡之際，誰能夠贏、誰能夠活下來才是至關重要的事。楊過就是這樣一種現實主義的存在。</p>\n\t\t\t<p>楊過性格中的現實感有其來歷，我們可以從黃蓉這個角色聯繫到楊過身上，只不過楊過更具現實性。楊過與黃蓉其實是同一類人，《神鵰俠侶》中多次描寫楊過與黃蓉鬥智，楊過藏在心中的種種奸巧計謀，黃蓉全都推算得出來。比如〈襄陽鏖兵〉這一回，楊過下定決心要殺郭靖為父報仇，剛好郭靖夫婦邀他研商前去蒙古軍營搭救武氏兄弟之法：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過早已算到：「郭伯母智謀勝我十倍，我若有妙策，她豈能不知？……有我和姑姑二人相助，他（指郭靖）自能設法脫身。」隨即想到：「但若我和姑姑突然倒戈，一來出其不意，二來強弱之勢更是懸殊，那時傷他可算得易如反掌。我即令不忍親手加害，假手於法王諸人取他性命，豈不大妙？……黃蓉啊黃蓉，你聰明一世，今日也要在我手下栽個筋斗。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>但黃蓉畢竟智高一籌，她這樣回楊過：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>黃蓉搖頭道：「不，我意思只要過兒一人和你同去。龍姑娘是個花朵般的閨女，咱們不能讓她涉險，我要留她在這兒相陪。」楊過一怔，立即會意：「郭伯母果有防我之心，她是要留姑姑在此為質，好教我不敢有甚異動。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>兩人都猜出對方心中計策，但幾番交手，楊過處處落於下風。唯有相似之人能看穿對方心中所想，從這點來看，他們屬於同一類人，而這類人最大的特點在於他們距離傳統的「俠」非常遙遠。</p>\n\t\t\t<p>楊過每一個關鍵決定，都與「為國為民」無涉。他永遠感情用事，心目中的「第一優先」始終是他姑姑小龍女。直到小說中段，他備受父親楊康身死之謎所折磨，他的生命中才又多增添一項心願——完成為父報仇的私怨。在〈襄陽鏖兵〉這一回，就是描寫楊過如何包藏禍心，想要刺殺郭靖。在傳統武俠小說中，絕不會在主角身上發生這樣的情節。楊過從未打算光明正大地與郭靖一對一決鬥，從沒想過用有尊嚴的方式贏過郭靖、為父報仇，而是要在有限的生命時間完成夙願，伺機而動，當殺就殺。</p>\n\t\t\t<p>從司馬遷的《史記．遊俠列傳》，到清末章太炎的「儒俠」說，武俠小說繼承而來的「俠」，不應該像楊過那樣，故事都發展到一半了，主角心裡竟沒有「為國為民」的價值情操。他原本一心一意只想手刃殺父仇人，但自從和郭靖脫險歸來：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>一經共處數日，見他二人（郭靖夫婦）赤心為國，事事奮不顧身，已是大為感動，待在蒙古營中一戰，郭靖捨命救護自己，這才死心塌地的將殺他之心盡數拋卻，反過來決意竭力以報。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>其時郭靖身上負傷，臨危之際，楊過聽到郭氏夫婦以「國事為重」的簡短對答：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他決意相助郭靖，也只是為他大仁大義所感，還是一死以報知己的想法，此時突聽到「國事為重」四字，又記起郭靖日前在襄陽城外所說「為國為民，俠之大者」、「鞠躬盡瘁，死而後已」那幾句話，心胸間斗然開朗，……幼時黃蓉在桃花島上教他讀書，那些「殺身成仁、捨生取義」的語句，在腦海間變得清晰異常，不由得又是汗顏無地，又是志氣高昂。……他心志一高，似乎全身都高大起來，臉上神采煥發，宛似換了一個人一般。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>至此，楊過身上終於有了正統俠道的氣概。換言之，作為武俠小說主角，楊過大半時候並不是標準意義上的「俠」，他總是私情高於公義。</p>\n\t\t\t<p>《神鵰俠侶》的時代背景設定在南宋，楊過愛上姑姑，師徒二人欲結為夫妻，完全違背了當時的禮教。然而，楊過一往無前地公然與禮教對抗，只是為了一己私情，而不是為了公共性目的。金庸在這部小說中大肆翻轉「俠」的形象，讓楊過成為以私情為重、反禮教的象徵人物，也正因為如此，打動了不少讀者的心。</p>\n\t\t</div>"},{"title":"05 私情比公義迷人","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-45\"><span>0</span><span>5</span></h6>\n\t\t\t<h1>私情比<br/>公義迷人</h1>\n\t\t\t<p>陳家洛、袁承志、郭靖等人都可歸類為傳統的大俠，但武俠傳統發展到《神鵰俠侶》的楊過，突然間出現這麼一個不成體統的俠，為什麼會發生這種變化？回顧金庸創作史，其實有跡可循，原來金庸在寫作過程中慢慢注入一股新的力量，開始探討正、邪之間的曖昧地帶。這可以從《射鵰英雄傳》中看出。</p>\n\t\t\t<p>《射鵰英雄傳》其中一個故事核心，圍繞在東邪、西毒、南帝、北丐、中神通等「五絕」，這五人的寫法很明顯不太一樣，前一章已有提及。首先，人物刻畫最為簡單的是歐陽鋒，他就是純粹的壞，即使洪七公曾在大船之上、木筏之下救歐陽鋒倖免於難，他仍然不改其惡，屢次暗算洪七公。於是北丐洪七公與西毒歐陽鋒形成了強烈對比，從正邪之分來看，北丐不折不扣是個傳統武俠人物。北丐與西毒，一正一惡，從小說開篇至結尾，從未改變其面目。</p>\n\t\t\t<p>小說中有一幕場景令人印象深刻，金庸借用了《聖經》的故事。第二次華山論劍前夕，正當瑛姑等人要取仇敵裘千仞的性命時：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>裘千仞仰天打個哈哈，說道：「若論動武，你們恃眾欺寡，我獨個兒不是對手。可是說到是非善惡，嘿嘿，裘千仞孤身在此，那一位生平沒殺過人、沒犯過惡行的，就請上來動手。在下引頸就死，皺一皺眉頭的也不算好漢子。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>意思是說，沒有罪的人可以丟第一顆石頭，但是你們這些人生平都殺過人，憑什麼來指責我？這時只有一個人敢動手，這個人是誰？是九指神丐洪七公！</p>\n\t\t\t<p>　</p>\n\t\t\t<p>洪七公道：「不錯。老叫花一生殺過二百三十一人，這二百三十一人個個都是惡徒，若非貪官汙吏、土豪惡霸，就是大奸巨惡、負義薄倖之輩。老叫花貪飲貪食，可是生平從來沒殺過一個好人。裘千仞，你是第二百三十二人！」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他接著痛駡裘千仞與金人勾結，賣國賊絕不能爭這武功天下第一的榮號。如此大義凜然，如此堅持原則。</p>\n\t\t\t<p>是非善惡那麼黑白分明，及至《神鵰俠侶》，金庸自己都忍受不了，開始模糊正邪之間的界線。又是在華山，洪七公與歐陽鋒狹路相逢，兩人連續比拚了武功、內力、棒法杖法數日，最後卻相擁大笑而亡：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>洪七公哈哈大笑，叫道：「老毒物歐陽鋒，虧你想得出這一著絕招，當真了得！好歐陽鋒，好歐陽鋒。」……</p>\n\t\t\t<p>兩個白髮老頭抱在一起，哈哈大笑。笑了一會，聲音越來越低，突然間笑聲頓歇，兩人一動也不動了。……</p>\n\t\t\t<p>北丐西毒數十年來反覆惡鬥，互不相下，豈知竟同時在華山絕頂歸天。兩人畢生怨憤糾結，臨死之際卻相抱大笑。數十年的深仇大恨，一笑而罷！</p>\n\t\t\t<p>　</p>\n\t\t\t<p>正邪最後的結局是超脫並理解了正邪之間的曖昧。正因為人人都斷定邪不勝正，或是正邪不兩立，所以金庸沒有為正邪對決寫下最終勝者。如此結果，一切意在言外。</p>\n\t\t\t<p>不只楊過，南帝段皇爺（一燈大師）也不是傳統的俠。段皇爺摒棄塵世國君身分，是為了受困於「情」帶來的懊悔與痛苦。當他貴為一國之君時，愛妃劉貴妃（瑛姑）與周伯通在切磋點穴功夫之時，突破男女之防，鑄下私通大錯。此後他鬱鬱不樂，荒廢國務，只以練功自遣。回顧這段前塵往事時，一燈大師說當時雖未再召見劉貴妃，但「睡夢之中卻常和她相會」，顯然不能忘情。此外，他還須面對人生終極的試煉：是否要出手救情敵的小孩？當時他心中甚為傷痛，他沒有犧牲自己去救瑛姑的孩子，一部分原因是受愛情欺辱，一部分則是倘若為了救人，折損功力，「華山二次論劍，再也無望獨魁群雄」。</p>\n\t\t\t<p>因一己私欲，不救垂死嬰兒，對段皇爺而言是罪孽深重的心理障礙，他不飲不食，苦思三日三夜「終於大徹大悟」，出家為僧。段皇爺原屬公共性的角色，他貴為大理皇帝，卻將私情凌駕在國政之上，放棄了自己的公共責任。</p>\n\t\t\t<p>中神通王重陽也不是傳統意義上的俠。在《射鵰英雄傳》中，王重陽是丘處機等全真七子的師父，第一次華山論劍耗時七天七夜，擊敗東邪、西毒、南帝、北丐，奪得武功天下第一的威名及《九陰真經》。到了《神鵰俠侶》，王重陽則變得有血有肉，透過小龍女細數古墓派來歷，王重陽的生平重新被挖掘出來，全真派與古墓派之間的恩怨情仇，像倒影般映在小龍女與楊過的愛情故事上。在金庸所有小說中，王重陽與林朝英之間的感情糾葛，可說是一段最被低估的愛情。</p>\n\t\t\t<p>王重陽與林朝英的虐戀，是一種絕對的、終極的愛，而非一般的浪漫愛情故事。這兩人為什麼相互吸引，尤其是林朝英為什麼對王重陽愛得無法自拔？全是因為「武」，這種愛來自佩服，也來自崇拜。也因為如此，他們兩人永遠無法雙宿雙棲、結為情侶；這種生根於「武」的愛情，必然激發出武學上的競爭。</p>\n\t\t\t<p>王重陽和林朝英一直各自潛心練武、鑽研武學，也在武藝上論高下。最後一場莫名其妙的比武打賭，「王重陽竟輸給了祖師婆婆，這古墓就讓給她居住」。王重陽在古墓一間石室中留下武功精奧，「室頂石板上刻滿了諸般花紋符號」，而王朝英移居古墓後，也在另一間對稱的石室室頂「刻滿了無數符號」。原本賭局結束後，這段愛情應該也就此埋入古墓，但死亡又一次延續這段不服輸的愛情。</p>\n\t\t\t<p>原來林朝英在石室頂上留下的武功之秘，叫做《玉女心經》。林朝英故去後，王重陽悄悄回到古墓弔祭故人，見到了遺刻，「但見玉女心經中所述武功精微奧妙，每一招都是全真武功的剋星」，於是三年間足不出山，仍想不出一套融會貫串的武學，直到華山論劍後奪得《九陰真經》，終於豁然領悟，刻下破解《玉女心經》之法，更在石棺蓋底寫下「玉女心經，技壓全真；重陽一生，不弱於人」十六個字。愛情發展到最深刻時，會對那個人永遠念念不忘，也會想起對方令人敬佩的武學成就，就不可能忘卻彼此在武學上的競爭。</p>\n\t\t\t<p>這種感情僅止於思念，而越是思念，越想在武功上比個高下。這段感情牽絆著兩位武學奇才的自負，感情越深，好勝之心也越強，結成眷侶還是差了一步。</p>\n\t\t\t<p>相較於王重陽的不甘服輸，林朝英在生命終結前，將競爭的心情化成一股對愛情的嚮往，縷縷相思全都寄託在《玉女心經》最後一章——玉女素心劍法。此劍法如果要發揮最大效益，必須和全真派劍法相輔相成，一人使玉女劍法，一人使全真劍法，「相互應援，分進合擊」，兩人心意合一時，才能展現雙劍合璧的威力。</p>\n\t\t\t<p>王重陽是個情種，除了「組義師反抗金兵」，沒有其他公義的事蹟。在武俠歷練上，他開創全真教，奪得天下第一的稱號，除此之外，他與林朝英相知、相惜又相競的愛情故事，最令人印象深刻。</p>\n\t\t\t<p>五絕之中，東邪黃藥師以「邪」為名，但他不是真正的邪派，而是遊走於正邪之間。東邪的獨生女黃蓉也承襲了亦正亦邪的性格，使《射鵰英雄傳》偶爾也有些邪氣。金庸脫離武俠小說正道，創造了郭靖這樣一個既魯鈍又憨厚的角色；同時，也凸顯黃蓉有多麼嬌俏和聰穎，由黃蓉牽引著郭靖，鋪陳故事情節。</p>\n\t\t\t<p>當然，黃蓉也受了郭靖影響，跟隨其志，轉變為國家大義至上，然而《射鵰英雄傳》之後有了《神鵰俠侶》，金庸寫出楊過、小龍女這樣私情勝於公義的「俠侶」，來對照成婚後的黃蓉，反而重視起所謂的世俗禮教大防。</p>\n\t\t\t<p>郭靖因為黃蓉，有時也會暫且放下公義，顯現出顧念兒女私情的一面。金庸在《射鵰英雄傳》時稍微挑戰了傳統武俠小說，到了《神鵰俠侶》，便毫無顧忌地發展自己的小說路數，藉由楊過這個角色，離開傳統的、正統的「俠」，因為那樣的概念及形象，再也展現不出亂世中「俠」之意義。高蹈又理想性的形象，已無法套用在楊過身上。</p>\n\t\t\t<p>對於楊過及小龍女而言，私情勝於所有一切。江湖同時有兩個世界，一邊是國家大事，一邊是兩情相悅，但即使家國有難，楊過、小龍女的眼中仍只有對方。例如大勝關英雄大會上，金庸將這兩條故事線寫在一起。金輪法王引起戰局，正當眾江湖人士一古腦兒爭武林盟主時，縱使天下之大、千人圍觀，楊過與小龍女彼此情意纏綿，一派「我欲愛則愛，我欲喜則喜，又與旁人何干」。三場對戰，金輪法王那一方已勝了一場，對戰間點蒼漁隱所使鐵槳柄斷為兩截，槳片撞到小龍女左腳腳趾，本來師徒倆如與世隔絕般互訴別情，楊過氣憤要找是誰傷了姑姑，這麼打了個岔，搞了一場「季後賽」。</p>\n\t\t\t<p>三戰兩勝，金輪法王本應搶得武林盟主寶座，但楊過在言語上又使詐術延長賽事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過道：「今日爭武林盟主，都是徒弟替師父打架，是也不是？……我師父的徒弟你可沒打勝。……咱們也來比三場，你們勝得兩場，我才認老和尚作盟主。若是我勝得兩場，對不起，這武林盟主只好由我師父來當了。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>最後楊過合小龍女之力，將金輪法王、霍都一行人逼退。如此一來，小龍女豈不成了武林盟主？但「過兒，這些人蠻橫得緊，咱們走罷。」小龍女毫不稀罕，更在郭靖當眾將女兒許配楊過時直言：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小龍女搖了搖頭，說道：「我自己要做過兒的妻子，他不會娶你女兒的。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過與小龍女兩人不拘泥世俗禮法，師徒相戀，但不論走到何處，都被視為離經叛道，正如楊過的大聲疾呼：「我做了甚麼事礙著你們了？我又害了誰啦？姑姑教過我武功，可是我偏要他做我妻子。」兩人注定苦戀，經歷生死離別、禮教責難，一路風風雨雨，讓無數讀者讀之泫然。《神鵰俠侶》故事的主軸在於私情比武林或家國更加至上。</p>\n\t\t</div>"},{"title":"06 問世間，情是何物","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-46\"><span>0</span><span>6</span></h6>\n\t\t\t<h1>問世間，<br/>情是何物</h1>\n\t\t\t<p>愛情這條主軸隨著楊過的遭遇，在《神鵰俠侶》中變得越來越重要，金庸是以戲劇性且極端的方式來描寫的。故事寫到楊過、小龍女必須一同修練古墓派《玉女心經》的內功：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小龍女道：「這經上說，練功時全身熱氣蒸騰，須揀空曠無人之處，全身衣服暢開而修習，使得熱氣立時發散，無片刻阻滯，否則轉而鬱積體內，小則重病，大則喪身。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過對小龍女絲毫沒有邪念，並未想到男女有別，而小龍女也對世事一無所知：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>本門修練的要旨又端在克制七情六欲，是以師徒二人雖是少年男女，但朝夕相對，一個冷淡，一個恭誠，絕無半點越禮之處。此時談到解衣練功，只覺是個難題而已，亦無他念。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這段敘述延續並翻轉了武俠小說中一個巨大的矛盾，那就是道士及和尚在武俠小說裡的作用。他們不是應該出家遊於方外嗎？為什麼身懷精湛武功，又為什麼常常殺人？</p>\n\t\t\t<p>在武俠小說傳統中，本就存在練武的道士與僧人，因為他們較容易摒除世俗雜念，比一般人更能專注於練功。一般而言，少林寺的武學正統形象深入人心，如童子功也是少林寺的秘傳功法。依照傳統武俠敘述，童子功旨在抑制肉體欲望，如果練童子功的僧人與女性發生性行為，所練武功也就破功了。這點對應了中醫的陰陽論。</p>\n\t\t\t<p>金庸高明之處在於他翻轉了武俠傳統，改從小龍女身上寫人的七情六欲。首先，男女倒錯，此時是童女要練玉女功；其次，小龍女的武功深淺與肉體並無直接關係，她武功的致命傷是動情。正如古墓派玉女功的要訣：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「少思、少念、少欲、少事、少語、少笑、少愁、少樂、少喜、少怒、少好、少惡。行此十二少，乃養生之都契也。多思則神怠，多念則精散，多欲則智損，多事則形疲，多語則氣促，多笑則肝傷，多愁則心懾，多樂則意溢，多喜則忘錯昏亂，多怒則百脈不定，多好則專迷不治，多惡則焦煎無寧。此十二多不除，喪生之本也。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸又佈局設計了絕情谷斷腸崖的情節，小龍女為了讓楊過願意解毒求活，在斷腸崖石壁上刻下訣別語：「十六年後，在此重會，夫妻情深，勿失信約。」然後縱身躍入深谷。十六年約期一到，楊過苦候小龍女不至，「雙足一登，身子飛起，躍入了深谷之中」。這萬念俱灰下的一躍，讓兩人終於見了面。這個橋段當時在香港引起太勉強、不合理的批評，倪匡也不欣賞十六年後兩人重逢的結局。</p>\n\t\t\t<p>但關鍵重點在於金庸要藉此破解「絕情谷」。絕情谷是個什麼地方？地如其名，這座谷是教人棄情絕愛，不能有感情的地方。絕情谷中生長著情花，只要被花枝上的尖刺刺中，便「十二個時辰之內不能動相思之念，否則苦楚難當」。公孫綠萼告訴楊過：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>那女郎道：「我爹爹說道：情之為物，本是如此，入口甘甜，回味苦澀，而且遍身是刺，你就算小心萬分，也不免為其所傷。……」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>情花之毒如同世間情愛，藉由絕情谷中接連而起的風波，從谷主公孫止欲強娶小龍女、到髮妻裘千尺的復仇，金庸特意以此做對比，凸顯楊龍二人單純又至高的愛，正在於生死許之。情路坎坷，更顯人間至情至愛的珍貴。他們的這份至情至愛，克服了外在的「絕情」環境。</p>\n\t\t</div>"},{"title":"07 感情上的畸人","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-47\"><span>0</span><span>7</span></h6>\n\t\t\t<h1>感情上的<br/>畸人</h1>\n\t\t\t<p>《神鵰俠侶》中的大多數角色都是感情上的畸人，亦即不曾擁有正常的感情，這也是《神鵰俠侶》與《射鵰英雄傳》最大的差別。讀者很容易理解郭靖與黃蓉之間的感情，這段忠貞不渝的情愛令人感到安心，即使成吉思汗封郭靖為金刀駙馬，華箏心慕郭靖的這段感情插曲，也屬於正常的範疇。</p>\n\t\t\t<p>《神鵰俠侶》卻相反，小說主要角色個個有感情上的缺陷：楊過是孤苦伶仃的乞兒，小龍女自小便住在古墓裡，也是無依無靠；郭靖與黃蓉萬般寵愛的長女郭芙，是個無法體會他人痛苦、徹底被寵壞的小孩，也是一個沒有愛人能力的畸人——她不能真心去愛人，才會讓武修文、武敦儒兩兄弟為愛反目；武氏兄弟在決鬥前聲明贏的人要承擔「手報母仇、奉養老父、愛護芙妹」這三件大事，為了爭愛，竟不惜手足相殘、傷透父心，他們也是感情上的畸人。</p>\n\t\t\t<p>而小說中最極端的感情畸人，應該是王重陽與林朝英，且看金庸怎麼說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>王重陽與林朝英均是武學奇才，原是一對天造地設的佳偶。二人之間，既無或男或女的第三者引起情海波瀾，亦無親友師弟間的仇怨糾葛。王重陽先前尚因專心起義抗金大事，無暇顧及兒女私情，但義師毀敗、枯居石墓，林朝英前來相慰，柔情高義，感人實深，其時已無好事不諧之理，卻仍是落得情天長恨，一個出家做了黃冠，一個在石墓中鬱鬱以終。此中原由，丘處機等弟子固然不知，甚而王林兩人自己亦是難以解說，惟有歸之於『無緣』二字而已。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸寫兩人在切磋武學時，情根深種：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>卻不知無緣係「果」而非「因」，二人武功既高，自負益甚，每當情苗漸茁，談論武學時的爭競便伴隨而生，始終互不相下，兩人一直至死，爭競之心始終不消。林朝英創出了剋制全真武功的玉女心經，而王重陽不甘服輸，又將九陰真經刻在墓中。只是他自思玉女心經為林朝英自創，自己卻依傍前人的遺書，相較之下，實遜一籌，此後深自謙抑，常常告誡弟子以容讓自克、虛懷養晦之道。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>王重陽與林朝英的感情始終無法超越他倆在武學上的競爭，更蔓延為全真派與古墓派之間的恩怨，沒有外在因素干預，卻不能相許相伴，顯然他們心中懷抱比愛情更重要的事情。從這點來看，他們是另一種感情上的畸人。</p>\n\t\t\t<p>絕情谷主公孫止與其妻裘千尺，是另一對感情上的畸人，他們像是林朝英與王重陽故事的變形，這個變形卻令人感到心寒。裘千尺武功在公孫止之上，年紀又稍長，既傳授丈夫上乘功夫又事事嚴加管束，是個名副其實的悍妻。公孫止懼內，暗中與一名年輕婢女商議遠走高飛。裘千尺得知後，便以「生死相許」這道難題考驗公孫止。裘千尺將兩人拋入情花叢中，又將解毒丹藥數百枚「絕情丹」浸入砒霜水中，只留下一枚絕情丹，要公孫止「救她還是救自己，你自己拿主意罷」。公孫止沒有通過考驗，一劍刺死婢女，一人獨吞解藥。之後，公孫止無情狠辣地報復裘千尺，乘裘千尺被灌醉昏睡，挑斷其手足筋脈，再丟到萬丈深淵般的石窟之中。</p>\n\t\t\t<p>上述這兩對畸人，正好對照著小龍女與楊過之間的深情厚愛。首先，小龍女是楊過的師父，但兩人之間從未有過任何爭競心理；其次，當楊過與小龍女都身中情花毒，公孫綠萼好不容易偷出解藥，楊過當下的反應是先救小龍女，他可以為對方捨棄性命。金庸試圖凸顯《神鵰俠侶》中最動人也最難以置信的內容，就是至死不悔的愛；正因為這樣的愛情故事如此激烈，所以扣人心弦。</p>\n\t\t\t<p>金庸寫激烈、絕對的愛情，用意是在政治海嘯來襲時，藉武俠小說保留將被沖刷殆盡、悉數毀滅的可貴事物；至高武學並非最難得，人與人之間的情感才彌足珍貴。</p>\n\t\t\t<p>當李莫愁及其徒弟洪凌波潛入古墓，逼迫小龍女交出《玉女心經》時，金庸鋪陳了楊過與小龍女感情的轉捩點。原本小龍女收楊過為徒時，曾指著兩具空石棺，談論生死大事：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>小龍女說：「我答允孫婆婆要照料你一生一世。我不離開這兒，你自然也在這兒。」楊過……道：「就算你不讓我出去，等你死了，我就出去了。」小龍女道：「我既說要照料你一生一世，就不會比你先死。」楊過道：「為什麼？你年紀比我大啊！」小龍女冷冷的道：「我死之前，自然先殺了你。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>李莫愁闖入古墓，小龍女身受重傷，她反倒想讓楊過獨自逃生。在此危難之際，從來不動真情的小龍女卻兩度想落淚，她執意不願違背師命，叫楊過到墓外放下斷龍石堵死墓門：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過待巨石落到離地約有二尺之時，突然一招「玉女投梭」，身子如箭一般從這二尺空隙中竄了進去。小龍女一聲驚叫，楊過已站直身子，笑道：「姑姑，你再也趕我不出去啦。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過當初拜小龍女為師，還想著倘若小龍女有一日要殺他，他必會逃走；但是當他們的生命受到威脅時，楊過發覺「我若不能跟你在一起，一生一世也不會快活」，兩人早已情根深種，不惜生死相許。如此，他們的情感就走向了另一個境界。</p>\n\t\t\t<p>楊過固然深情，但金庸仍依循傳統武俠小說的慣例，塑造了一個最迷人的男主角。在武俠小說以男性讀者為大宗的年代，他們心理投射的對象必然是這些主角們，或許到處留情，也是所有女人的愛慕對象。金庸也將楊過寫成萬人迷，書中出現的同輩女性——包括陸無雙、程英、公孫綠萼、郭芙、郭襄——全都愛慕著他。但是金庸順著慣例，又寫出很不一樣的典型，楊過喜歡和女孩子調笑，看似油嘴滑舌，其實骨子裡只鍾愛小龍女一人。例如他之所以受到陸無雙吸引，就是因為陸無雙生氣的神情令他想起小龍女，所以他故意去惹得陸無雙發脾氣，想在她的眉目之間一解相思之苦。陸無雙莫名其妙成了小龍女的替身，而他欣賞的女子身上，都有著些許小龍女的影子。反觀陸無雙、程英對楊過的情愫與愛重，部分也源自楊過對小龍女的一往情深。</p>\n\t\t\t<p>「生死相許」的另一面，意味著這樣的感情，能做到像武功一樣所向披靡，其威力甚至超越武功。《神鵰俠侶》某些關鍵情節都是「以情制勝」。舉例來說，當楊過眼見李莫愁要傷害小龍女，情急之下，「攔腰抱住了李莫愁」。金庸形容李莫愁的心理感受：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>她雖出手殘暴，任性橫行，不為習俗所羈，但守身如玉，在江湖上闖蕩多年，仍是處女，斗然間被楊過牢牢抱住，但覺一股男子熱氣從背脊傳到心裏，蕩心動魄，不由得全身酸軟，滿臉通紅，手臂上登時沒了力氣。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>照道理講，以李莫愁的武功，她可以輕易擺脫楊過，卻一時之間迷醉於男子的擁抱，被制得不想掙扎。除此之外，絕情谷中，公孫止命令十六名弟子佈漁網陣，想要擒拿楊過。「四張漁網或橫或豎、或平或斜，不斷變換」，楊過眼見就要困於漁網之下：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過暗叫：「罷了，罷了！落入這賊谷主手中，不知要受何等折辱？」忽聽南邊持網人中有人嬌聲叫道：「啊喲！」楊過回過頭來，只見公孫綠萼摔倒在地，漁網一角軟軟垂下。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過得以暫時脫險，並不是以武功取勝，而是比武藝更加重要的「情感」因素。更有甚者，在對戰金輪法王的過程中，楊過與小龍女意外發現，一人使全真劍法，另一人使玉女劍法，可以將「玉女素心劍」發揮出匪夷所思的制敵力量。而這套劍法的精髓，正是要使劍的兩人心意相通、情切眷念，等於是以感情催動的無上劍術。</p>\n\t\t\t<p>金庸重視男女情愛，將情愛作用在武俠小說裡抬高到了前所未見的高度。</p>\n\t\t</div>"},{"title":"08 唯「武」不再獨尊","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-48\"><span>0</span><span>8</span></h6>\n\t\t\t<h1>唯「武」<br/>不再獨尊</h1>\n\t\t\t<p>金庸突破傳統武俠小說的寫法，在愛情面前，武林盟主的頭銜可以毫不重要。有人說《神鵰俠侶》就是一本「情書」，改變了武俠小說向來以男性讀者為主流的常態，女性讀者也因之踏入金庸筆下的世界。</p>\n\t\t\t<p>與傳統武俠小說相比，金庸小說是不折不扣的「新武俠」。然而，新武俠或許不應該說誕生在香港這個創作環境，不是從梁羽生一路發展而來，而是純粹出自金庸個人的手筆。金庸獨創新武俠，他的「新」非常驚人，徹底影響武俠小說讀者群的閱讀設定及想像。說到類型小說，一定會問：小說為誰而寫？從郭靖、黃蓉的江湖故事，再到楊過、小龍女的愛情故事，武俠小說的讀者群已然改變。如此陽剛的文類，倘若不是金庸，讀者的性別比重怎麼可能會是如今這個樣子？金庸小說迷倒了不少女性讀者，在平江不肖生那個時代，女生哪看什麼武俠小說啊！</p>\n\t\t\t<p>金庸小說開始出現女性讀者，等於終結了一部分的武俠小說，因為女性讀者可能不會去讀司馬翎的《焚香論劍篇》、《劍膽琴魂記》，或是東方玉的《東方第一劍》，更遑論武俠小說祖師爺平江不肖生的作品。讀者群結構既然改變，也會影響武俠小說作家對讀者的想像，短時間內將小說主軸迅速轉變，「武技」或許不再是唯一，讀者沉迷的不再只限於江湖本身。從《射鵰英雄傳》到《神鵰俠侶》，閱讀武俠小說的樂趣已經轉移了。</p>\n\t\t\t<p>當然，金庸仍然擅長寫武功招數，而且運用更多文學化、個性化的想像。但是看黃蓉或楊過闖蕩江湖，他們的武功施展技巧變得越來越詭詐，這意味著「俠」不僅僅是在拳腳上搏勝負，以腦袋去組織作戰策略更加重要；這正是金庸小說的迷人之處。在《射鵰英雄傳》、《神鵰俠侶》中，涉及武打場面時，金庸很喜歡將主角放在不會贏的那一方，再予以解套。</p>\n\t\t\t<p>例如《神鵰俠侶》第十三回〈武林盟主〉，描寫楊過和霍都對戰：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>二十餘招之後，楊過便即相形見絀。……楊過所使的打狗棒法神妙莫測，本非霍都的扇法掌法之所及，但洪七公所授的只是招數，棒法的口訣秘奧，他甫自黃蓉口中聽到，仗著聰明，才勉強湊合著兩者使用，然要立時之間融會貫通，施展威力，自是決無此理。再鬥一會，楊過東躲西閃，已難以招架。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>眼看楊過十招內就要被敵人打倒，他先是躍到小龍女身旁得她暗助，繼而又得黃蓉出聲指點，最後使出古墓派的美女劍法，又將要落敗：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>忽見楊過鐵劍一擺，叫道：「小心！我要放暗器了！」霍都曾用扇中毒釘傷了朱子柳，聽他如此說，只道他的鐵劍就如自己摺扇一般，也是藏有暗器，……見楊過鐵劍對準自己面門指來，急忙向左躍開。卻見楊過左手劍訣引著鐵劍刺到，那裏有甚麼暗器？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過連喊了三次「暗器來了」，都只是口頭說說，這正是「狼來了」效應，等到第四次再喊：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>霍都罵道：「小……」第二個字尚未出口，驀地裏眼前金光閃動，這一下相距既近，又是在對方數次行詐之後毫沒防備，急忙湧身躍起，只覺腿上微微刺痛，已中了幾枚極細微的暗器。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這場敘事，比武重點已不在拳腳高下，令人拍案叫絕的是楊過用計之巧妙。</p>\n\t\t\t<p>領略過《射鵰英雄傳》天下五絕高深莫測的武功絕學，再看《神鵰俠侶》，閱讀樂趣已經大不相同。你會仔細看陳家洛施展百花錯拳、看袁承志施展金蛇劍法，但到了《神鵰俠侶》，武打場面外的情節更加精彩，僅僅看楊過怎麼行詐，用各種奇想與詭計扭轉局面，就讓人讀得津津有味。</p>\n\t\t\t<p>「武」不再那麼重要，「俠」也是如此。江湖上有一個郭大俠足矣，讀者本來就不預期在楊過身上看到捨生取義的那種「俠」，金庸的「新武俠」其實比想像中更有革命性。</p>\n\t\t\t<p>金庸塑造出楊過這個人物，已經完成了武俠小說革命。即使不再唯「武」獨尊，武俠小說這個文類仍然存在，而且讀者愈來愈多。新的讀者涉足武俠世界，於是開啟了下一波武俠盛世。</p>\n\t\t\t<p>這一段時期，影劇界紛紛翻拍武俠電影，例如取材自平江不肖生小說《江湖奇俠傳》的電影《火燒紅蓮寺》。為何獨挑「火燒紅蓮寺」為題材一再重拍？或許純粹是因為「女主角」，缺少女主角的電影乏人問津。此時，金庸小說脫穎而出，創下滾雪球般的武俠劇翻拍效應。</p>\n\t\t\t<p>本來，武俠小說讀者一貫是「武癡」面目，但金庸筆下的江湖有情癡，令人斷腸銷魂，創造了更多新的讀者。</p>\n\t\t</div>"},{"title":"09 忘記腳下的高峯","content":"<div>\n\t\t\t<h6 id=\"_idParaDest-49\"><span>0</span><span>9</span></h6>\n\t\t\t<h1>忘記腳下的<br/>高峯</h1>\n\t\t\t<p>金庸一生傳奇，度過了一般人好幾輩子才能經歷的人生，完成了其他人好幾輩子加總起來的事功。</p>\n\t\t\t<p>武俠小說家金庸與報人查良鏞的人生同時並行，可回溯至上世紀五○年代。查良鏞移居香港後，於一九五九年創辦《明報》，並將《明報》從原先的小報經營成為香港首屈一指的大報。查良鏞辦報的野心不止於此，十年內陸續創辦了《明報月刊》、《明報晚報》，以及在華人地區佔有特殊地位的《明報週刊》。這幾個紙媒讓「明報」躍升為報業集團，而且各有不同任務。雖然都在「明報」旗下，《明報月刊》在總編輯胡菊人主持下，堪稱是不折不扣的知識分子型月刊；而《明報週刊》則截然不同，專注於香港日漸發達的電影和電視事業，是以影視明星為主要報導對象的娛樂媒體。</p>\n\t\t\t<p>作為報人的查良鏞在香港報業史上佔有十分獨特的地位；而以金庸筆名馳騁報刊連載專欄，更成為首屈一指的武俠小說宗師。將金庸小說劃分成不同階段來看，他每一段巔峯都是其他武俠小說家難以企及的成就。</p>\n\t\t\t<p>金庸前兩部起手式作品，突破既有武俠小說傳統，以歷史的春秋筆法，寫出別開生面的武俠小說格局。金庸一起筆，便將歷史小說與武俠小說熔鑄在一起，並且時刻展現超越自我的寫作功力。金庸從不囿於眼前成就，也不重複故事模式，《碧血劍》之後，《射鵰英雄傳》便嘗試了新的寫作路數。</p>\n\t\t\t<p>其實從創作《射鵰英雄傳》開始，金庸已經意識到人物角色與江湖世界之間隱而未發的衝突和緊張，何者為真理？何者又是虛妄的存在？金庸在七○年代重新修訂《神鵰俠侶》時，在〈後記〉中侃侃而談小說主旨：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>「神鵰」企圖通過楊過這個角色，抒寫世間禮法習俗對人心靈和行為的拘束。……我們今日認為天經地義的許許多多規矩習俗，數百年後是不是也大有可能被人認為毫無意義呢？</p>\n\t\t\t<p>　</p>\n\t\t\t<p>金庸從這個觀點切入，重新思考世俗禮教與至情人性之間的關係，顛覆他在《射鵰英雄傳》中塑造的「為國為民，俠之大者」的英雄情結。</p>\n\t\t\t<p>武俠世界充斥著不合理的現象，諸如飛簷走壁、掌風如刀、內力灌注等，並不符合物理常識，武功招數往往也是虛構的居多。但武俠世界應該要含有虛構以外的事物，作為其核心價值。只是江湖、武林離開了虛構，還能留下什麼？</p>\n\t\t\t<p>金庸嘗試在《射鵰英雄傳》中回答這個問題，從人物的性格塑造，凸顯《射鵰英雄傳》的獨特之處。相較於其他武俠小說，《射鵰英雄傳》有兩項重要突破。一是金庸首次嘗試書寫個性極端的迷人角色，如東邪、西毒、南帝、北丐、中神通，這五大絕頂高手第一次華山論劍就迸發出極強的戲劇張力。時逢寒冬歲盡、大雪封山，五絕「口中談論，手上比武，在大雪之中直比了七天七夜」。東邪黃藥師性格乖僻；西毒歐陽鋒是手段兇狠的老毒物；南帝段皇爺慈和寬厚；北丐洪七公向來神龍見首不見尾；中神通王重陽癡武甚於情愛。五絕個性鮮明，所以讀者不會單以武功去分辨他們，更多時候是以性格特徵。</p>\n\t\t\t<p>容我再強調一次，金庸不斷地突破自我。他十分明白群雄爭鬥這些情節可以吸引讀者，但這些並非現實而是虛構，也就容易被人遺忘；而那些與真實人生相應的人性與哲理，在戲劇性的描繪下反而更深入人心。《射鵰英雄傳》之後，金庸已經成功補足以往武俠小說最弱的一環——往前推溯，無論是還珠樓主、白羽，甚至平江不肖生，他們的武俠作品普遍存在一個問題——缺乏角色塑造。唯有少數作家，例如王度廬，能夠在角色形象上有較多著墨。</p>\n\t\t\t<p>金庸捨棄了純粹以江湖恩怨為主軸的敘事，從《射鵰英雄傳》開始，形成以人物性格推動故事情節的寫作模式。到了《神鵰俠侶》，更進一步發展「人物性格的可能性」，就像〈後記〉所說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>道德規範、行為準則、風俗習慣等等社會的行為模式，經常隨著時代而改變，然而人的性格和感情，變動卻十分緩慢。三千年前「詩經」中的歡悅、哀傷、懷念、悲苦，與今日人們的感情仍是並無重大分別。我個人始終覺得，在小說中，人的性格和感情，比社會意義具有更大的重要性。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>《射鵰英雄傳》不僅在敘事上有所突破，還塑造出武俠小說從未出現過的角色——黃蓉。這個角色象徵兩種潮流，首先是女性角色被重新書寫。女性在過去是「俠」的對立面，或是「俠」的依附，但在小說裡，黃蓉所流露出「俠」的特質與本事甚至高過郭靖，而且黃蓉根本不屑成為「俠」。</p>\n\t\t\t<p>黃蓉的人格特質承襲她的父親黃藥師。桃花島主無視世俗禮教，是個「正中帶有七分邪，邪中帶有三分正」的俠。於是在武俠正統之外，金庸提出了「俠」的另類性。試問：武俠小說裡最重要的人物就是「俠」嗎？「俠」本該至高無上，否則就失去讀武俠小說的意義？以往的讀者，首要的閱讀興趣是在江湖中尋找「俠」的蹤影；就這點而言，《射鵰英雄傳》顯現出曖昧性。這部小說的第一主角是郭靖，但這個角色並未能主導小說的情節發展，而是出現了比郭靖更加吸引讀者目光的角色——黃蓉，讓小說情節趣味橫生。黃蓉的來歷也促使我們思考：何謂「俠」或「武俠」？「武俠」是否存在其他可能性？</p>\n\t\t\t<p>武俠小說源於小傳統，最早可追溯至說書人、講史者所講述的民間傳說，經過宋代話本及明清章回小說作者加以踵事增華，清朝中葉至後期則大量出現以俠客、義士為核心的俠義小說。部分唐傳奇、《水滸傳》、《三俠五義》皆沿襲民間信仰及庶民文化，其中不曾出現過大傳統，即使內含詩詞，都只是說書人用來當作道德教訓的警語。但是藉由書寫黃蓉，金庸刻畫了新武俠小說人物的立體形象，融入武俠小說以往從未出現過的大傳統架構。也就是說，金庸將中國近世——宋代以來的文人文化——移植進武俠小說中。</p>\n\t\t\t<p>《射鵰英雄傳》延續《書劍恩仇錄》、《碧血劍》，書寫帝王或與帝王命運休戚相關的歷史主題，因此原本是以成吉思汗為傳奇核心，只是故事開展之後，成吉思汗的存在感就和乾隆（《書劍恩仇錄》）、崇禎（《碧血劍》）截然不同。成吉思汗的歷史成分被淡化了，其地位遠遠不及東邪西毒南帝北丐重要。</p>\n\t\t\t<p>走出歷史的局限，金庸在這條寫作路數上走得十分過癮，決定續寫第二次華山論劍之後郭靖和黃蓉闖蕩江湖的故事。郭靖、黃蓉夫婦鎮守襄陽城期間，不僅成為武林盟主，更讓晚年淫奢無度的宋理宗朝廷苟延殘喘了十幾年；或許這是原本《神鵰俠侶》的故事架構，等到真正開始寫作，金庸又會構思出別出心裁的小說情節，偏離原先的故事梗概。</p>\n\t\t\t<p>繼糅合武俠小說與歷史小說之後，金庸又一次突破武俠正統，讓赤練仙子李莫愁這個角色背負新的武林情仇，增添了通俗羅曼史小說的元素寫出羅曼史小說都難以刻畫的經典愛情。《神鵰俠侶》整部小說都圍繞在「直教生死相許」的各種愛情面貌之中，幾乎所有關鍵角色都逃離不了其羅網。書中唯一不受困於愛情這座圍城的角色，大概只有金輪法王了。</p>\n\t\t\t<p>在《神鵰俠侶》中，金庸渲染人生當中的死生契闊，甚至塑造出郭芙這個不合理的角色。整部小說顛覆了以往涇渭分明的正邪之分。譬如金輪法王座下二弟子達爾巴，個性就很憨厚，在〈武林盟主〉那一回，楊過用心記下達爾巴所講藏語：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過……便依樣葫蘆的用藏語說道：「我師父是金輪法王。我又不是小孩子，你該叫我大和尚。」……</p>\n\t\t\t<p>西藏喇嘛教中向來有轉世輪迴之說，……此時達爾巴聽了這番言語，只道楊過真是大師兄轉世，……向他凝視片刻，越想越像，突然拋下金剛杵，向楊過低頭膜拜，連稱：「大師兄，師弟達爾巴參見。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>他內心對已逝的大師兄實含有深厚感情。不似達爾巴的魯直，在書中犯下最多罪行的郭芙，卻不能將她歸類為反派人物，因為她站在武林正道這一方。郭芙作為頻頻惹事之人，隱含著一個道德教訓——郭芙之壞，因為她是個被寵壞的小孩。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>她自幼處於順境，旁人瞧在她父母份上，事事趨奉容讓，因此她一向只想到自己，絕少為旁人打算……</p>\n\t\t\t<p>　</p>\n\t\t\t<p>因此她會闖下比惡意更加可怕的禍事。楊過斷臂就是拜她所賜，這時更錯中將兩枚冰魄銀針射向正在運功驅毒的小龍女與楊過身上：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>她哪知小龍女身中這枚銀針之時，恰當體內毒質正要順著內息流出，突然受到如此劇烈的一刺，五毒神掌上的毒質盡數倒流，侵入周身諸處大穴，這麼一來，縱有靈芝仙丹，也已無法解救。</p>\n\t\t\t<p>　</p>\n\t\t\t<p>這個被寵壞的小孩脾氣暴躁、行事魯莽，又驕縱蠻橫，成為武林中另類的害人之惡。</p>\n\t\t\t<p>小說結尾前，金庸特意為郭芙犯下的所有過失做出解釋。當楊過在亂軍之中救了郭芙丈夫耶律齊的性命之後，戰場上殺聲震天，郭芙卻突然領悟：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭芙一呆，兒時的種種往事，剎時之間如電光石火般在心頭一閃而過：「我難道討厭他麼？當真恨他麼？武氏兄弟一直拚命的想討我歡喜，可是他卻從來不理我。只要他稍為順著我一點兒，我便為他死了，也所甘願。我為甚麼老是這般沒來由的恨他？只因為我暗暗想著他，念著他，但他竟沒半點將我放在心上？」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>直到此刻，她才明白自己二十年來的心事，她一生之中什麼都不缺，最大的遺憾就是無法得到楊過的愛。這段情節化解了小說前半部郭芙與楊過之間的心結，郭芙也為自己以往之非找到了緣由。</p>\n\t\t\t<p>郭芙是個徹底被寵壞的小孩，她第一次見到楊過，就歧視他是個「小叫花子」；但小說來到結尾，這些嫌隙突然之間全都不算數了，楊過甚至說：</p>\n\t\t\t<p>　</p>\n\t\t\t<p>楊過急忙還禮，說道：「芙妹，咱倆從小一起長大，雖然常鬧別扭，其實情若兄妹。只要你此後不再討厭我、恨我，我就心滿意足了。」</p>\n\t\t\t<p>　</p>\n\t\t\t<p>郭芙在情感上的頓悟，反映出《神鵰俠侶》的特別之處，也就是江湖之中包藏了羅曼史般的愛情現象，「武」和「俠」不再是唯一主題。</p>\n\t\t\t<p>感情挫折如排山倒海而來時，人的行為容易脫離常軌，江湖的禍端往往源自情關上的劫難，女魔頭李莫愁率先發動血雨腥風；武三通的家庭悲劇、陸家莊的滅門之災，全都起自「為情所困」。《神鵰俠侶》中一段又一段愛情偏差的故事，逼著你直視人生最難過的關。當書中角色都不免墜入情障，郭芙也無法置身事外，在最後悔悟她情感上的遺憾。</p>\n\t\t\t<p>《神鵰俠侶》中的恩怨情仇都源自感情的糾葛，藉由情癡這個主題，金庸又將武俠小說提升至另一個境界，革新武俠小說的寫作藝術。</p>\n\t\t\t<p>《射鵰英雄傳》雖然以郭靖、黃蓉為核心去推動小說情節，但其他關鍵角色諸如天下五絕，也同樣令人印象深刻。到了《神鵰俠侶》，閱讀效果則截然不同，由主角楊過貫穿了所有江湖故事，他涉及每一個關鍵事件，他的性格、身世和作為也牽動了整個江湖局勢。由此觀之，《神鵰俠侶》可說是單一主角小說；敘事圍繞著楊過，延伸至小龍女、程英、陸無雙及郭襄等角色。小說大篇幅描寫楊過的成長歷程，為了避免閱讀疲乏，金庸在小說四分之三處構思了感情大高潮，將所有懸念設置在絕情谷斷腸崖。此時楊過身中情花劇毒，非死不可，小龍女丹田內臟積聚冰魄銀針之毒，也必死無疑，這對命運多舛的愛侶在結為夫妻後，走到生離死別的人生關卡。為了等待小龍女定下的十六年之約，楊過服下斷腸草，解了情花毒。</p>\n\t\t\t<p>小說敘事沒有停留在這段高潮情節，原來小龍女留下「十六年後，在此重會，夫妻情深，勿失信約」這行文字便埋下了伏筆：小龍女真的死了？楊過與小龍女是否還會重逢？小說敘事最鬆散的部分，也在於楊過這十六年間的過渡與遭遇，幸而金庸以郭襄為橋樑，連結到《倚天屠龍記》故事。楊過變成了神鵰大俠，幾乎任何事都難不倒他，十六年約期未到之前，一切都是懸念，戲劇張力難免減弱，這正是單一主角為敘事主體的棘手之處。還好有楊過為郭襄「獻禮祝壽」這一段，依然吸引著讀者目光。</p>\n\t\t\t<p>到了創作後期，金庸筆鋒一轉，寫出了前後有兩百多個角色的《天龍八部》，和《鹿鼎記》一樣，是金庸作品中篇幅最長的小說。《天龍八部》就是一個多重中心的敘事結構，不存在單一主角，無論是蕭峯、段譽或虛竹，都有各自的人生際遇，然後形成了一個網絡，將書中所有人物編結起來，這是金庸另一個寫作上的突破。</p>\n\t\t\t<p>《天龍八部》、《笑傲江湖》之後，金庸持續琢磨寫作技藝，直到他的最後一部武俠作品——《鹿鼎記》，成為武俠小說史上既不可思議又無可取代的顛覆之作。《鹿鼎記》作為金庸封筆之作，絕對有其特殊意義——以更極致的歷史小說敘事手法，刻畫一個非武非俠、亦武亦俠的江湖廟堂。</p>\n\t\t\t<p>《鹿鼎記》將小說背景設定在康熙朝，刻意讓主角韋小寶攙和進康熙朝的三大歷史事件。一是康熙擊殺鰲拜，金庸引《清史稿．聖祖本紀》中「上久悉鰲拜專橫亂政，特慮其多力難制，乃選侍衛、拜唐阿年少有力者為撲擊之戲」描述，在小說中改寫為康熙與「小桂子」韋小寶合力設局擒拿住鰲拜；二是康熙平定吳三桂的三藩之亂，也歸功於韋小寶；三是大清帝國與羅刹國（俄羅斯）簽訂劃界定疆的《尼布楚條約》，也是靠著韋小寶的機智滑頭而「大功告成」。</p>\n\t\t\t<p>金庸一面構思符合史實的小說情節，同時在歷史的縫隙當中虛構小說故事，這種春秋筆法不只考驗小說家的史學智識，也考驗小說家如何佈局虛構的敘事空間。這是何等的企圖，何等的野心！</p>\n\t\t\t<p>金庸基本上就是一路這樣創作他的武俠小說，寫完一部到達了一座高峯，他就把這座高峯忘掉，再去爬另外一座高峯。在這件事情上，沒有人像金庸。我們要看到這樣的金庸，才能瞭解金庸所有小說之間彼此的關連。</p>\n\t\t</div>"},{"title":"版權頁","content":"<div id=\"_idParaDest-50\">\n\t\t\t<p>金庸的武林 <span>1</span></p>\n\t\t\t<h4>曾經江湖</h4>\n\t\t\t<h6>金庸，為武俠小說而生的人</h6>\n\t\t\t<p>　</p>\n\t\t\t<p>作者／楊照</p>\n\t\t\t<p>封面繪圖／李志清</p>\n\t\t\t<p>　</p>\n\t\t\t<p>副總編輯／鄭祥琳</p>\n\t\t\t<p>美術設計／張巖</p>\n\t\t\t<p>排版／連紫吟、曹任華</p>\n\t\t\t<p>行銷企劃／廖宏霖</p>\n\t\t\t<p>出版一部總編輯暨總監／王明雪</p>\n\t\t\t<p>　</p>\n\t\t\t<p>發行人／王榮文</p>\n\t\t\t<p>出版發行／遠流出版事業股份有限公司</p>\n\t\t\t<p>地址／104005 臺北市中山北路一段11號13樓</p>\n\t\t\t<p>電話／(02)2571-0297　傳真／(02)2571-0197　郵撥／0189456-1</p>\n\t\t\t<p>著作權顧問／蕭雄淋律師</p>\n\t\t\t<p>　</p>\n\t\t\t<p>2024年3月1日 初版一刷</p>\n\t\t\t<p>電子書出版日期：2024年3月</p>\n\t\t\t<p>電子書格式：ePub</p>\n\t\t\t<p>有著作權．侵害必究</p>\n\t\t\t<p>ISBN　978-626-361-539-7 (EPUB)_V1</p>\n\t\t\t<p>　</p>\n\t\t\t<p> <a href=\"http://www.ylib.com\">http://www.ylib.com</a>　E-mail: <a>ylib@ylib.com</a></p>\n\t\t\t<p>金庸茶館粉絲團 <a href=\"https://www.facebook.com/jinyongteahouse\">https://www.facebook.com/jinyongteahouse</a></p>\n\t\t</div>"}];
const isHeader = [true, true, true, true, false, false, false, false, true, false, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, false, false, true];
let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  chapters.forEach(function(ch, i) {
    var btn = document.createElement('button');
    btn.className = 'chapter-btn' + (isHeader[i] ? ' is-header' : '');
    btn.textContent = ch.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});

initChapterList();
showChapter(0);

</script>
