去。……國人習俗，向來上墳掃墓，若非清明，便是重陽，此所謂春秋兩祭。”</p>\n<p class=\"content\">少林寺張君寶追蹤《九陽真經》。</p>\n<p class=\"content\">《神鵰俠侶》第40回：張君寶即後來開創武當門派的張三丰，當年十三歲，是在少林寺幫助藏經閣覺遠大師灑掃曬經的俗家弟子。蒙古忽必烈麾下的武師瀟湘子和尹克西，在藏經閣中偷走了夾有《九陽真經》的《楞伽經》。張君寶隨著覺遠大師一路追蹤，來到華山。覺遠師徒和群雄制服了兩位武師，卻不見《九陽真經》的下落。原來瀟湘子、尹克西在華山之巔，眼看無法脫身，剛好身邊有隻蒼猿，兩人心生一計，便割開蒼猿肚腹，將經書藏在其中。按：“他小小身材，說話卻是中氣充沛，聲若洪鐘，眾人聽了都是一凜，只見他形貌甚奇，額尖頸細、胸闊腿長、環眼大耳，雖只十二三歲的少年，但凝氣卓立，甚有威嚴。楊過暗暗稱奇，問道，這位小兄弟高姓大名？覺遠道，小徒姓張，名君寶。他自幼在藏經閣中助我灑掃曬書，雖稱我一聲師父，其實並未剃度，乃俗家弟子。楊過讚道，名師出高徒，大師的弟子氣宇不凡。”《倚天屠龍記》第16回（1351年）：“原來九十餘年之前，瀟湘子和尹克西從少林寺藏經閣中盜得這部經書，被覺遠大師直追到華山之巔，眼看無法脫身，剛好身邊有隻蒼猿，兩人心生一計，便割開蒼猿肚腹，將經書藏在其中。後來覺遠、張三丰、楊過等搜索瀟湘子、尹克西二人身畔，不見經書，便放他們帶同蒼猿下山。”</p>\n<p class=\"content\">三月二十四，元朝王子忽必烈擊敗阿里不哥，立為帝。</p>\n<p class=\"content\">《神鵰俠侶》第39回：“後來忽必烈領軍北歸，與阿里不哥爭位，兄弟各率精兵互鬥。最後忽必烈得勝，但蒙古軍已然元氣大傷，暫時無力南攻，襄陽得保太平。直到一十三年後的宋度宗鹹淳九年（1273年），蒙古軍始再進攻襄陽。”《元史·世祖本紀》中統元年：“春三月戊辰朔（初一），車駕至開平。親王合丹、阿只吉率西道諸王，塔察兒、也先哥、忽剌忽兒、爪都率東道諸王，皆來會，與諸大臣勸進。帝三讓，諸王大臣固請。辛卯（二十四），帝即皇帝位。”</p>"},{"title":"《倚天屠龍記》故事編年（1263-1358）","content":"</a>\n<p class=\"sectionTitle\">《倚天屠龍記》故事編年（1263-1358）</p>\n<p class=\"content\">【背景】公元13世紀70年代，蒙古國改國號為元。元帝忽必烈陷襄陽，滅南宋，統一中國。90年代，元憲宗忽必烈卒，之後歷成宗、武宗等九帝，進入14世紀30年代，元順帝即位，民族矛盾異常激化。50年代，紅巾起義爆發，朱元璋揭竿而起；60年代，朱元璋蕩平群雄，滅元，建立明朝。</p>\n<p class=\"content\">【概要】江湖主要門派有明教、天鷹教，與之為敵的有少林、武當、峨嵋、華山、崑崙、崆峒六大門派。張無忌是武當派祖師張三丰的徒孫，父母雙亡後歷盡坎坷練成《九陽真經》，挫敗六大門派成為明教教主，指揮江湖群雄抗擊元朝統治。明教成為中原武林之首，張無忌與元朝郡主趙敏化敵為友結為佳偶。</p>\n<p class=\"content\">【紀年】故事開始時距郭靖、楊過華山掃墓三年，是1263年。元順帝至元二年（1336年），張三丰九十壽辰。第二年（1337年），張無忌出生。張無忌十五歲（1351年）跌入香花翠谷，五年後（1356年）出任明教教主，二十三歲時（1358年）送趙敏去蒙古，故事結束。</p>\n<p class=\"content\">注：本篇故事中人物年齡以虛歲計。</p>\n<p class=\"content\">1262年　元世祖中統三年（張三丰16歲）</p>\n<p class=\"content\">春，元朝武師尹克西和瀟湘子，為爭奪《九陽真經》互鬥而死。</p>\n<p class=\"content\">《倚天屠龍記》第1回：原在忽必烈麾下的武師尹克西和瀟湘子，在少林寺盜得《九陽真經》，藏在蒼猿腹中避開了搜索。兩人互相防範，終於在崑崙山驚神峰出手爭鬥，瀟湘子當場死去。尹克西臨終，委託“崑崙三聖”何足道，去少林寺告訴覺遠和尚經書下落。按（1263年）：“去年春天，我在崑崙山驚神峰絕頂彈琴，忽聽得茅屋外有毆擊之聲，出去一看，只見兩個人扭作一團，已各受致命重傷，卻兀自竭力拼鬥。”</p>\n<p class=\"content\">1263年　元世祖中統四年（張三丰17歲）</p>\n<p class=\"content\">郭靖之女“小東邪”郭襄獨闖少林寺。</p>\n<p class=\"content\">《倚天屠龍記》第1回：郭襄乃郭靖、黃蓉的次女，自和楊過、小龍女夫婦在華山絕頂分手後，三年來到處尋覓他二人的音訊。這日去少林寺打聽，遇見三年前在華山有一面之緣的覺遠、張君寶師徒。按：“郭襄自和楊過、小龍女夫婦在華山絕頂分手後，三年來沒得到他二人半點音訊。……想到楊過，心頭又即鬱郁，這三年來到處尋尋覓覓，始終落得個冷冷清清，終南山古墓長閉，萬花坳花落無聲，絕情谷空山寂寂，風陵渡凝月冥冥。”</p>\n<p class=\"content\">編者按：《倚天屠龍記》內的人物年齡，有別於金庸其它小說，是按虛歲計算的。例如史載張三丰生於1247年，小說記其九十壽辰在1336年（至元二年）；九十壽辰的第二年張無忌出生，百歲壽辰時張無忌已經十歲，等等。按虛歲計算，是年張三丰17歲，郭襄21歲。第1回：“這少女十八九歲年紀……只見身後站著個十六七歲的少年。”</p>\n<p class=\"content\">少林小僧張君寶被迫離寺。</p>\n<p class=\"content\">《倚天屠龍記》第1、2回：十天之後，崑崙派高手何足道到寺中挑戰，被藏經閣小僧張君寶以羅漢拳擊敗，張君寶卻因為無師自學少林武功，受達摩堂眾僧追緝。覺遠大師傳授張君寶、郭襄《九陽真經》後圓寂。張君寶、郭襄黯然分手，浪跡天涯。</p>\n<p class=\"content\">1273年　元世祖至元十年（張三丰27歲）</p>\n<p class=\"content\">元軍攻陷南宋襄陽，郭靖夫婦殉國。</p>\n<p class=\"content\">《神鵰俠侶》第39回、《倚天屠龍記》第9回：襄陽保衛戰的第二年，忽必烈在兄弟爭位中得勝，但蒙古軍已然元氣大傷。直到十三年後的宋度宗鹹淳九年，蒙古軍再攻襄陽。郭靖、黃蓉夫婦和襄陽軍民一起，浴血奮戰，雙雙殉難。參見《宋史·度宗本紀》鹹淳九年：“二月，庚戌（二十七），呂文煥以襄陽府歸大元。”《中國通史》卷七：早在宋鹹淳三年（蒙古至元四年，1267年）十一月，劉整“奏攻宋方略，宜先從事襄陽”。如攻佔襄陽浮漢入江，則宋可滅。次年七月，忽必烈命劉整協同阿術圍攻襄陽，宋將呂文德艱苦據守。鹹淳五年十二月，呂文德病死後宋軍繼續抗擊。宋鹹淳九年（元至元十年，1273年）正月，樊城在被圍四年後失陷。二月，宋襄陽守將呂文煥降元，歷時五年的襄樊保衛戰結束。</p>\n<p class=\"content\">倚天劍在郭襄手中，屠龍刀下落不明。</p>\n<p class=\"content\">《倚天屠龍記》第38回：襄陽陷落之前，黃蓉眼見元兵勢大，襄陽終不可守，夫婦二人決意以死報國。郭靖夫婦以楊過贈給郭襄的玄鐵重劍熔鑄成屠龍刀，以楊過的君子劍、小龍女的淑女劍熔鑄成倚天劍，內藏郭靖畢生兵法和武功精要，分別交給郭襄和郭破虜。襄陽城破之日，郭破虜和父母同時遇難，屠龍刀從此不知下落。郭襄當時身在西川，倚天劍因此保存在其後創立的峨嵋派。天下英雄為了尋找兩件神器，得到其中的秘密，幾十年來爭戰不息。江湖上代代相傳：“武林至尊，寶刀屠龍；號令天下，莫敢不從；倚天不出，誰與爭鋒。”</p>\n<p class=\"content\">1276年　元世祖至元十三年（張三丰30歲）</p>\n<p class=\"content\">張君寶創立武當門派，自號張三丰。</p>\n<p class=\"content\">《倚天屠龍記》第2回：張君寶與郭襄分手後，在武當山的一個巖穴中，孜孜不倦地修習覺遠所授的《九陽真經》。“他得覺遠傳授甚久，於這部《九陽真經》已記了十之五六，十餘年間竟然內力大進，其後多讀道藏，於道家練氣之術更深有心得。……他以自悟的拳理、道家沖虛圓通之道和《九陽真經》中所載的內功相發明，創出了輝映後世、照耀千古的武當一派武功。後來北遊寶鳴，見到三峰挺秀，卓立雲海，於武學又有所悟，乃自號三豐，那便是中國武學史上不世出的奇人張三丰。”</p>\n<p class=\"content\">1279年　元世祖至元十六年（張三丰33歲）</p>\n<p class=\"content\">南宋亡。</p>\n<p class=\"content\">《宋史·度宗本紀·瀛國公二王附》至元十六年：“二月，癸未，……陸秀夫走衛王舟，王舟大，且諸舟環結，度不得出走，乃負昺投海中，後宮及諸臣多從死者，七日，浮屍出於海十餘萬人。楊太后聞昺死，撫膺大慟曰：‘我忍死艱關至此者，正為趙氏一塊肉爾，今無望矣！’遂赴海死，世傑葬之海濱，已而世傑亦自溺死。宋遂亡。”</p>\n<p class=\"content\">1282年　元世祖至元十九年（張三丰36歲）</p>\n<p class=\"content\">郭襄出家為尼，開創峨嵋一派。</p>\n<p class=\"content\">《倚天屠龍記》第9回：“郭女俠心中念念不忘於一個人，那便是在襄陽城外飛石擊死蒙古大汗的神鵰大俠楊過。郭女俠走遍天下，找不到楊大俠，在四十歲那年忽然大徹大悟，便出家為尼，後來開創了峨嵋一派。”</p>\n<p class=\"content\">1305年　元成宗大德九年（張三丰59歲）</p>\n<p class=\"content\">少年謝遜拜成昆為師。</p>\n<p class=\"content\">《倚天屠龍記》第6、7回：明教護法金毛獅王謝遜生於1296年，“我在十歲那一年，因意外機緣，拜在一個武功極高之人的門下學藝。我師父見我資質不差，對我青眼有加，將他的絕藝傾囊以授。”師徒情若父子。按（1336年）：“今年我四十一歲。”</p>\n<p class=\"content\">1316年　元仁宗延祐三年（張三丰70歲）</p>\n<p class=\"content\">成昆發誓要覆滅明教。</p>\n<p class=\"content\">《倚天屠龍記》第19回（1356年）：成昆和師妹兩家乃是世交，兩人從小便有婚姻之約。陽頂天暗中也在私戀成昆的師妹，待當上明教教主後，威震天下，成昆師妹的父母是勢利之輩，竟將女兒嫁給了明教教主。“那是很久很久以前的事了，老衲今日已是七十餘歲的老人。……陽頂天和我師妹成婚之日，我曾去道賀，喝著喜酒之時，我心中立下重誓：成昆只要有一口氣在，定當殺了陽頂天，定當覆滅魔教。我立下此誓已有四十餘年，今日方見大功告成。”成昆當時約三十歲。</p>\n<p class=\"content\">1318年　元仁宗延祐五年（張三丰72歲）</p>\n<p class=\"content\">青年謝遜離開師父成昆，遠赴西域。</p>\n<p class=\"content\">《倚天屠龍記》第7回：“我在二十三歲那年離開師門，遠赴西域，結交了一群大有來歷的朋友，蒙他們瞧得起我，當我兄弟相待。五妹，令尊白眉鷹王，就在那時跟我結交的。”這些朋友，便是明教的骨幹。</p>\n<p class=\"content\">1320年　元仁宗延祐七年（張三丰74歲）</p>\n<p class=\"content\">峨嵋派立滅絕師太為掌門人。</p>\n<p class=\"content\">《倚天屠龍記》第38回：峨嵋派始祖郭襄，第二代掌門人風陵師太。是年，風陵師太的徒弟滅絕師太十五歲，風陵師太便知她日後武功必有大成，決定立她為第三代掌門人。按第13回（1350年）：“只見她約莫四十四五歲年紀。”</p>\n<p class=\"content\">明教少年高手楊逍擊敗峨嵋派孤鴻子。</p>\n<p class=\"content\">《倚天屠龍記》第38回：孤鴻子是峨嵋派新掌門滅絕師太的師兄。滅絕師太接掌本派門戶不久，孤鴻子和明教中的一個少年高手楊逍結下了樑子，約定比武，雙方單打獨鬥，不許邀人相助。孤鴻子心知對手年紀甚輕，武功卻極厲害，於是向滅絕師太將倚天劍借了去。倚天劍還沒出鞘，孤鴻子便被楊逍一掌擊敗，活活氣死。按：考楊逍年齡，今年約二十歲。1340年和紀曉芙相識相愛時，“約莫四十歲年紀”（第13回），其女兒生於1341年。</p>\n<p class=\"content\">1321年　元英宗至治元年（張三丰75歲）</p>\n<p class=\"content\">明教波斯總教送聖女黛綺絲至中土明教。</p>\n<p class=\"content\">《倚天屠龍記》第30回：謝遜結識殷天正等明教朋友，加入明教擔任護法法王，後來娶妻生子，一家人融融洽洽過得極是快活。明教由波斯傳入中土，總教設在波斯。總教規矩，符合繼任教主的聖女要先到各地積立功德。在謝遜新婚妻子懷孕那年，波斯總教送聖女黛綺絲至中土明教積立功德。黛綺絲美貌絕倫，明教的左右光明使、三法王、五散人、五行旗使，無不為之震動。按（1357年）：“三十餘年前，那時明教在陽教主統領之下，好生興旺。……那時我（謝遜）正當新婚，和妻子極是恩愛，妻子又懷了孕，我怎會另生他念？”謝遜之子生於此年，被成昆摔死時（1323年）才三歲。</p>\n<p class=\"content\">1322年　元英宗至治二年（張三丰76歲）</p>\n<p class=\"content\">冬，明教黛綺絲戰勝韓千葉，封為紫衫龍王。</p>\n<p class=\"content\">《倚天屠龍記》第30回：聖女黛綺絲來到中土第二年，明教教主陽頂天的仇人之子韓千葉，自海外靈蛇島來光明頂為父報仇。黛綺絲認陽頂天為義父，代替陽頂天與韓千葉在碧水寒潭中比武。韓千葉敗北，身負重傷。陽夫人贈與黛綺絲“紫衫龍王”稱號，與白眉鷹王殷天正、金毛獅王謝遜、青翼蝠王韋一笑並列。按：“過了一年，有一天海外靈蛇島來了一人，自稱姓韓，名叫千葉，……其時正當隆冬。”</p>\n<p class=\"content\">1323年　元英宗至治三年（張三丰77歲）</p>\n<p class=\"content\">明教光明頂事變。</p>\n<p class=\"content\">《倚天屠龍記》第19、30回：韓千葉雖然在碧水寒潭一戰中落敗，卻贏得了聖女黛綺絲的芳心。黛綺絲力排眾議，嫁給了韓千葉。事過不久，陽頂天教主夫婦同時失蹤，光明頂上人心惶惶。原來，陽夫人雖然嫁給了陽頂天，卻和師兄成昆藕斷絲連，幾年來兩人常在明教聖地的秘道里幽會。這一日，陽頂天在秘道密室修煉“乾坤大挪移”，驀然發現夫人與成昆在秘道幽會，驚怒之下走火入魔而死。陽夫人愧疚萬分，自殺而亡。明教諸眾到處尋找教主夫婦，卻不敢擅入秘道聖地。諸眾有一晚發現韓夫人黛綺絲從秘道出來，懷疑其與教主失蹤有關，其實韓夫人偷入秘道，是為了尋找“乾坤大挪移”的武功心法。雙方發生激烈爭執，韓夫人破教而出，與韓千葉飄然下峰。按（1356年）：“你既非查根問底不可，我便將三十三年前的一件隱事跟你說了。”</p>\n<p class=\"content\">七月十五，明教謝遜滿門被師父成昆殘殺。</p>\n<p class=\"content\">《倚天屠龍記》第19、30回：明教教主陽頂天失蹤後，教中兄弟為爭奪教主之位，竟致自相動武。白眉鷹王殷天正不聽謝遜勸阻，離開光明頂自創天鷹教。謝遜不願捲入是非旋渦，攜同妻兒回去中原老家。七月十五，成昆下了光明頂，回到中原，去探訪多年不見的愛徒謝遜。成昆為令明教自相殘殺，假裝醉酒，逼奸謝遜的妻子，乘機殺了他父母妻兒。按第7回：“在我二十八歲那年上，我師父到我家來盤桓數日，……在七月十五日那日酒後，忽對我妻施行強暴……將我只有三歲的兒子謝無忌……我師父抓起了他，將他摔成血肉模糊的一團。”第6回（1336年）：“今年我四十一歲，十三年來，我只和禽獸為伍，我相信禽獸，不相信人。十三年來我少殺禽獸多殺人。”</p>\n<p class=\"content\">1326年　元泰定帝泰定三年（張三丰80歲）</p>\n<p class=\"content\">明教謝遜第一次找成昆報仇失敗。</p>\n<p class=\"content\">《倚天屠龍記》第7回：成昆殘害徒弟謝遜全家十三口，故意放謝遜逃生。“我大病一場之後，苦練武功，三年後找我師父報仇。但我跟他功夫實在相差太遠，所謂報仇，徒然自取其辱。”</p>\n<p class=\"content\">1331年　元文宗至順二年（張三丰85歲）</p>\n<p class=\"content\">明教謝遜第二次找成昆報仇失敗。</p>\n<p class=\"content\">《倚天屠龍記》第7回：“可是這一十三條人命的血仇，如何能便此罷休？於是我遍訪名師，廢寢忘食的用功，這番苦功，總算也有著落，五年之間，我自覺功夫大進，又去找我師父。哪知我功夫強了，他仍是比我強得很多，第二次報仇還是落得個重傷下場。”</p>\n<p class=\"content\">成昆暗中幫助謝遜奪取崆峒派的《七傷拳譜》。</p>\n<p class=\"content\">《倚天屠龍記》第8回：“只是當年我報仇心切，費盡了心力，才從崆峒派手中奪得這本《七傷拳譜》的古抄本，拳譜一到手，立時便心急慌忙的練了起來，唯恐拳功未成而我師父已死，報不了仇。”成昆為了挑起天下武林對明教的敵意，在謝遜奪取崆峒派《七傷拳譜》時，將崆峒五老中二老擊成重傷。</p>\n<p class=\"content\">1333年　元順帝元統元年（張三丰87歲）</p>\n<p class=\"content\">成昆藏身少林寺，謝遜以師父名義到處殺人放火。</p>\n<p class=\"content\">《倚天屠龍記》第7、36回：謝遜第二次報仇身負重傷，養好傷不久便得了一本《七傷拳》拳譜，這路拳法威力實非尋常，謝遜潛心專練七傷拳內功，兩年後拳技大成，第三次上門去找成昆，卻已不見所在。原來成昆隱身少林寺，欲拜老僧渡厄為師，渡厄向來不收弟子，這才引薦他拜在師侄空見的門下，法名圓真。謝遜憤激之下，便到處作案，殺人放火，無所不為，每作一件案子，便在牆上留下師父成昆的姓名，意在逼他挺身而出。</p>\n<p class=\"content\">1336年　元順帝至元二年（張三丰90歲）</p>\n<p class=\"content\">二月，明教謝遜誤殺少林寺空見大師。</p>\n<p class=\"content\">《倚天屠龍記》第8回：謝遜為了逼出成昆，到處以成昆的名義作案。此次目標是武當七俠之一宋遠橋。少林寺空見大師受弟子圓真欺騙，出面阻攔謝遜，企圖化解圓真、謝遜師徒的仇怨。謝遜施展苦肉計，一拳將空見大師打死，圓真卻並沒有出面。空見臨終告誡謝遜：要對付圓真，除非能找到屠龍刀，找到刀中的秘密。按：“空見搖頭道，他另投名師，三年來的進境非同小可。你雖練成了崆峒派的七傷拳，卻也傷他不得。”</p>\n<p class=\"content\">三月二十四，武當派俞岱巖在錢塘江遭劫。</p>\n<p class=\"content\">《倚天屠龍記》第3回：武當派張三丰的弟子、武當七俠之一俞岱巖路過浙東餘姚，遇見長白三禽和海沙派為爭奪屠龍刀大打出手，兩敗俱傷，屠龍刀落在俞岱巖手中。天鷹教教主殷天正的兒子殷野王、女兒殷素素用暗器擊傷俞岱巖，奪取了屠龍刀。殷素素心地善良，請龍門鏢局總鏢頭都大錦護送俞岱巖回武當山。按：“這一年是元順帝至元二年，宋朝之亡（1279年）至此已五十餘年。其時正當暮春三月，……今日三月廿四，到四月初九還有一十四天，須得道上絲毫沒有耽擱，方能及時趕到武當山，祝賀恩師他老人家九十歲大壽。”</p>\n<p class=\"content\">四月初九，武當派張三丰九十歲生日。</p>\n<p class=\"content\">《倚天屠龍記》第3、4回：是日武當派創派祖師張三丰的九十壽辰。龍門鏢局都大錦護送俞岱巖至武當山，俞岱巖卻被成昆派來的高手劫走，將全身筋骨捏碎。師弟張翠山為報師兄之仇，獨赴臨安。月底，張翠山至臨安，龍門鏢局遭滅門之禍，少林高手被暗施襲擊，兇手成昆精心策劃，誣指是張翠山所為。按：“一路上雖然趕得辛苦，總算沒誤了那姓殷的客人所定的期限，剛好於四月初九抵達武當山。……這麼一來，到得臨安府時已是四月三十傍晚。”</p>\n<p class=\"content\">編者按：史料記載武當七俠的生卒，宋遠橋（1295-1380），俞蓮舟（1303-1387），俞岱巖（1306-1379），張松溪（1310-1394），張翠山（1313-1346），殷梨亭（1318-1403），莫聲谷（1323-1357），小說所述與史料記載大致相合。第3回：武當七俠中宋大俠有四十來歲（是年宋遠橋42歲）。第3回：適才有個三十歲左右的漢子（是年俞岱巖31歲）。第3回：見馬上乘者是個二十一二歲的少年（是年張翠山24歲）。第9回：他二人分別之時，殷梨亭還只十八歲（是年殷梨亭19歲）。第9回：莫聲谷卻已長得魁梧奇偉，雖只二十來歲（是年莫聲谷24歲）。</p>\n<p class=\"content\">五月，明教金毛獅王謝遜大鬧王盤山寶刀會。</p>\n<p class=\"content\">《倚天屠龍記》第4、5回：武當派張翠山在錢塘江畔結識十九歲的天鷹教教主之女殷素素，為其治療毒鏢之傷。殷素素對張翠山一見鍾情。天鷹教在王盤山上邀請武林各派，舉辦寶刀會展示屠龍刀，金毛獅王謝遜突然現身，殺死各派高手，奪走屠龍寶刀，擄走張翠山、殷素素，在海上尋覓定居之所。</p>\n<p class=\"content\">某月，明教謝遜和張翠山夫婦定居海外冰火島。</p>\n<p class=\"content\">《倚天屠龍記》第6、7回：謝遜挾持著張翠山、殷素素飄泊海上，座船撞上冰山沉沒。謝遜在冰山上狂性發作，殷素素不得不用銀針將其雙目射瞎。張翠山和殷素素在冰山上結為夫妻，兩人隨著冰山漂流到冰火島，不料謝遜早在島上。</p>\n<p class=\"content\">1337年　元順帝至元三年（張無忌1歲）</p>\n<p class=\"content\">冬，張無忌出生。</p>\n<p class=\"content\">《倚天屠龍記》第7回：謝遜和張翠山夫婦在冰火島住下，相安無事。每天，張翠山夫婦捕魚打獵，謝遜捧著屠龍刀低頭冥思，想參透其中奧秘。殷素素大致在春天懷孕，到冬天日短夜長的時候，產下一子。張翠山夫婦讓兒子認謝遜為義父，謝遜為孩子取名張無忌。按：“忽忽數月……這時日漸短而夜漸長，到後來每日只有兩個多時辰是白天，氣候也轉得極其寒冷。”</p>\n<p class=\"content\">1338年　元順帝至元四年（張無忌2歲）</p>\n<p class=\"content\">江西袁州周子旺起義。</p>\n<p class=\"content\">《倚天屠龍記》第11、25回：“那周子旺正是魔教明教中彌勒宗的大弟子，數年前在江西袁州起事，自立為帝，國號稱周，不久為元軍撲滅，周子旺被擒斬首。彌勒宗和天鷹教雖非一派，但同為明教的支派，相互間淵源甚深，周子旺起事之時，殷天正曾在浙江為之聲援。”周子旺有一副手叫彭瑩玉，“彭瑩玉曾在袁州扶助周子旺起義反元，均遭撲滅。”據《元史·順帝本紀》至元四年：“六月，辛巳（十七），袁州民周子旺反，譖稱周王，偽改年號，尋擒獲，伏誅。”</p>\n<p class=\"content\">1339年　元順帝至元五年（張無忌3歲）</p>\n<p class=\"content\">峨嵋派周芷若出生。</p>\n<p class=\"content\">《倚天屠龍記》第11回：峨嵋派第四代掌門人周芷若，原是袁州周子旺的餘黨之女，其父在周子旺遇難後，帶著周子旺的遺孤避難江湖。按（1348）：“那女孩約莫十歲左右，衣衫敝舊，赤著雙足，雖是船家貧女，但容顏秀麗，十足是個絕色的美人胎子，坐著只是垂淚。”</p>\n<p class=\"content\">1340年　元順帝至元六年（張無忌4歲）</p>\n<p class=\"content\">天鷹教殷野王之女殷離兒出生。</p>\n<p class=\"content\">《倚天屠龍記》第16回：殷野王是天鷹教教主殷天正之子。“這件事說來話長。我親生的媽媽是我爹爹原配，一直沒生兒養女，爹爹便娶了二孃。二孃生了我兩個哥哥，爹爹就很寵愛她。媽後來生了我，偏生又是個女兒。二孃恃著爹爹寵愛，我媽常受她的欺壓。”及至殷離兒的媽媽被氣死，殷離兒終於殺死二孃出走。按第12、13回（1350年）：“她走幾步，咳嗽幾聲，顯得極是辛苦，旁邊一個十一二歲的小姑娘扶著她左臂。……門窗無風自開，一個弓腰曲背的老婆婆攜著個十一二歲的少女，已站在室中。”第17回：“蛛兒道，嗯，原來你（張無忌）只比我大三歲。為甚麼留了這麼長的鬍子？”</p>\n<p class=\"content\">天鷹教殷素素教四歲的無忌識字。</p>\n<p class=\"content\">《倚天屠龍記》第7回：“到無忌四歲時，殷素素教他識字。”</p>\n<p class=\"content\">1341年　元順帝至正元年（張無忌5歲）</p>\n<p class=\"content\">峨嵋派紀曉芙的私生女楊不悔出生。</p>\n<p class=\"content\">《倚天屠龍記》第11、13回：楊不悔是明教楊逍和峨嵋派紀曉芙的私生女。“那一年咱們得知了天鷹教王盤山之會的訊息後，師父便命我們師兄妹十六人下山，分頭打探金毛獅王謝遜的下落。弟子向西行到川西大樹堡，在道上遇到一個身穿白衣的中年男子，約莫有四十來歲年紀。弟子走到哪裡，他便跟到哪裡。”紀曉芙擺脫不掉楊逍而懷上身孕，不敢向師父說知，躲在甘州假稱有病，產下楊不悔。按第11回（1348年）：“那一年你在甘州，是七年之前呢還是八年之前，我可記不清楚了，你自己當然是明明白白的，那時當真是生病麼？生倒是有個生字，卻只是生娃娃罷？”當時楊不悔八歲，應是七年前。第12回（1350年）：“月光之下，只見一個青衫女子攜著一個十歲左右的小女孩（楊不悔），正是峨嵋女俠紀曉芙。”</p>\n<p class=\"content\">冬，張無忌五歲生日。</p>\n<p class=\"content\">《倚天屠龍記》第7回：無忌五歲生日那天，張翠山請謝遜教其習武。謝遜搖頭道：“不成，我的武功太深，孩子無法領悟。還是你傳他武當心法。等他到八歲時，我再來教他。教得兩年，你們便可回去啦！”</p>\n<p class=\"content\">1342年　元順帝至正二年（張無忌6歲）</p>\n<p class=\"content\">明教光明右使範遙潛伏元朝汝陽王府。</p>\n<p class=\"content\">《倚天屠龍記》第26回：明教教主下設四大法王、光明左右使和五散人，光明左使即楊逍，光明右使即範遙，人稱“逍遙二仙”。教主陽頂天失蹤後，明教諸雄為爭教主之位四分五裂。範遙無意去爭教主，便遠遠躲開。有一日，範遙在大都看見成昆與汝陽王勾結，密謀毀了光明頂。為了查知汝陽王陰謀的翔實，範遙毀容易貌，裝聾作啞，先到花剌子模做了武士，又被當地王公送到汝陽王府，成了啞巴“苦頭陀”。按：範遙潛入王府的具體時間不詳，大概潛入王府後就與玄冥二老相識，第26回（1357年）記“他們和苦頭陀相識已有十五六年”，姑繫於此。</p>\n<p class=\"content\">1343年　元順帝至正三年（張無忌7歲）</p>\n<p class=\"content\">靈蛇島小昭出生。</p>\n<p class=\"content\">《倚天屠龍記》第19回：小昭是靈蛇島韓千葉和紫衫龍王黛綺絲的女兒。黛綺絲自從離開光明頂脫離明教後，更名為金花婆婆，又稱韓夫人，與丈夫韓千葉在靈蛇島恩愛度日。小昭的生年不詳，按原著描述，當比楊不悔小几歲，姑繫於此。按：“張無忌向外張望，見兩個都是少女，一個（楊不悔）穿著淡黃綢衫，服飾華貴，另一個少女（小昭）年紀更小，穿著青布衣衫，是個小鬟。”</p>\n<p class=\"content\">靈蛇島韓千葉中毒身亡。</p>\n<p class=\"content\">《倚天屠龍記》第13回：靈蛇島韓千葉夫婦被蒙古人手下的西域番僧下毒，來到蝴蝶谷請“醫仙”胡青牛醫治。胡青牛是明教中人，醫術高明，但除了明教弟子，外人一概不治，外號“見死不救”。韓千葉毒發身亡，金花婆婆獨自闖蕩江湖，對明教恨之入骨。大約稍後，金花婆婆收留離家出走的殷離兒為徒，授其“千蛛萬毒手”功夫。按（1350年）：“七年之前，有一對老夫婦身中劇毒，到蝴蝶谷求醫，那是東海靈蛇島主人金花婆婆和銀葉先生。”</p>\n<p class=\"content\">1344年　元順帝至正四年（張無忌8歲）</p>\n<p class=\"content\">明教謝遜教張無忌練習武功。</p>\n<p class=\"content\">《倚天屠龍記》第7回：在張無忌五歲生日時，謝遜答應等他到八歲時，開始教其武功。“到第八年上，謝遜果然要無忌跟他學練武功。傳授之時他沒叫張殷二人旁觀，他夫婦便遵依武林中的嚴規，遠遠避開。”</p>\n<p class=\"content\">1345年　元順帝至正五年（張無忌9歲）</p>\n<p class=\"content\">明教謝遜、武當派張翠山籌備迴歸中土事宜。</p>\n<p class=\"content\">《倚天屠龍記》第7、8回：“島上無事無記，日月去似流水，轉眼又是一年有餘。”謝遜向張翠山一家訴說與師父成昆的恩怨往事。“如此又過了大半年”，張翠山、謝遜扎木筏，準備離島行裝。“待得事事就緒，已是白日極短，黑夜極長。”按：“殷素素心中難過：大哥在島上一住九年，武功全然拋荒了。……無忌此時不過九歲，雖然聰明，但要短期內領悟謝遜這些世上罕有的武功，卻怎生能夠？”</p>\n<p class=\"content\">1346年　元順帝至正六年（張無忌10歲）</p>\n<p class=\"content\">三月，武當派張翠山夫婦帶著無忌回到中土。</p>\n<p class=\"content\">《倚天屠龍記》第8、9回：北風勁至，張翠山一家三口乘木筏回中土，謝遜和屠龍刀留在冰火島。張翠山一家在海上遇見武當派俞蓮舟與天鷹教動武，崑崙派、崆峒派、峨嵋派逼問謝遜的下落，殷素素告以惡賊謝遜在九年前無忌出生時已然死了。上岸之後，張翠山一家隨俞蓮舟直奔武當，月底途經漢口，張無忌被元朝軍隊中的高手劫走。按：“俞蓮舟心下盤算，五弟失蹤十年，原來和天鷹教教主的女兒結成了夫婦。……張翠山道，恩師百歲大壽轉眼即至，小弟竟能趕上這件武林中罕見的盛事，老天爺可說待我不薄了。”</p>\n<p class=\"content\">四月初九，武當派張三丰百歲生日，張翠山夫婦自盡謝罪。</p>\n<p class=\"content\">《倚天屠龍記》第9、10回：張翠山夫婦回到闊別十年的武當山，百歲高齡的師父張三丰親自接見，天鷹教主殷天正也派人送來厚禮。至四月初九張三丰百歲生日，武林各大門派雲集武當山，逼問謝遜的下落，名義上是為被謝遜無故殺害的冤魂報仇，實質上是追蹤屠龍刀的下落。俞岱巖得知十年前是被殷家兄妹暗器所傷，怨恨至極。張翠山、殷素素橫劍自刎，向天下英雄謝罪。張無忌被武當派奪回，可是已經中了元朝高手的玄冥神掌，生命垂危。張三丰讓無忌練習九陽真經，以化除體內寒毒。按：“過了數日，已是四月初八。張三丰心想明日是自己的百歲大壽，徒兒們必有一番熱鬧。”第19回：“原來他在十歲那一年身中玄冥神掌陰毒，直至十七歲上方才去淨。”第23回：“張無忌一聽此言，臉上登時紅了，他十歲喪父，未得跟父習練書法，此後學醫學武，於文字一道實是淺薄之至。”</p>\n<p class=\"content\">1348年　元順帝至正八年（張無忌12歲）</p>\n<p class=\"content\">八月，張無忌毒情加劇，張三丰向少林寺求援遭到拒絕。</p>\n<p class=\"content\">《倚天屠龍記》第10回：無忌依法修煉，練了兩年有餘，體內的寒毒卻無法化除。張三丰知道當年覺遠大師傳給自己的九陽神功，因自己年幼所學不全，為了救無忌，決定降尊紆貴去少林寺求援。誰知少林寺掌門空聞等高僧囿於門戶之見，婉言推辭。按：“張無忌依法修練，練了兩年有餘，……這一日中秋佳節，武當諸俠和師父賀節，還未開席，無忌突然發病。……只見他攜著一個面青肌瘦的十一二歲少年，兩個都貌不驚人，不見有甚麼威勢。”</p>\n<p class=\"content\">張無忌路遇周芷若，頃刻間又各奔前程。</p>\n<p class=\"content\">《倚天屠龍記》第11、22回：張三丰和無忌自少林寺回到武當山，在漢水之畔遇見袁州義軍周子旺的餘黨之女周芷若和照料她的明教骨幹常遇春。常遇春主動帶張無忌去蝴蝶谷求醫，張三丰帶著周芷若回武當山。張三丰以武當山上並無女子，一切諸多不便，當下揮函轉介，周芷若投入峨嵋派滅絕師太門下。是年，張無忌十二歲。“常遇春皺眉道，張兄弟，你今年幾歲？張無忌哽咽道，十二歲。”周芷若十歲。“那女孩約莫十歲左右，衣衫敝舊，赤著雙足。”</p>\n<p class=\"content\">九月，張無忌在蝴蝶谷治療寒毒。</p>\n<p class=\"content\">《倚天屠龍記》第11、12回：常遇春領著無忌去蝴蝶谷求醫，在樹林中遇見峨嵋派紀曉芙力救明教彭瑩玉和尚，與師姐丁敏君失和。紀曉芙早在兩年前和武當派殷梨亭有了婚約，可是武林中不知她有個八歲的私生女。蝴蝶谷“見死不救”的醫仙胡青牛，經不住常遇春的軟磨硬泡，收留張無忌在谷中邊學習醫術，邊接受治療。常遇春告辭離谷，後來成了明教朱元璋軍中大將。按：“其時已是深秋，但蝴蝶谷一帶地氣溫暖，遍山遍野都是鮮花……這一個多月之中，張無忌與他共當患難，相互捨命相交，已結成了生死好友，一旦分別，自是戀戀不捨。”</p>\n<p class=\"content\">1350年　元順帝至正十年（張無忌14歲）</p>\n<p class=\"content\">七月，張無忌為紀曉芙等人療傷。</p>\n<p class=\"content\">《倚天屠龍記》第12回：谷中安靜無事，歲月易逝，如此過了兩年，張無忌已是一十四歲。峨嵋派紀曉芙兩年前被師姐揭穿隱私，就帶著私生女楊不悔隱居度日。紀曉芙被靈蛇島金花婆婆打成重傷，帶著十歲左右的楊不悔來到蝴蝶谷求醫。胡青牛說起張無忌賴在谷中的時間，按時排比，應是“整整兩年差兩個月”。</p>\n<p class=\"content\">金花婆婆尋仇，殺明教胡青牛夫婦。</p>\n<p class=\"content\">《倚天屠龍記》第12、13回：金花婆婆即二十多年前脫離明教的韓夫人黛綺絲，七年前丈夫韓千葉受傷後來蝴蝶谷求醫遭拒而去世。金花婆婆耿耿於懷，是月十五，帶著十一歲的徒弟殷離兒前來尋仇，胡青牛夫婦費盡心機，仍未逃出她的毒手。按：“張無忌年紀幼小，本來不懂得這些生命的大道理，但他這四年來日日都處於生死之交的邊界，自不免體會到莊子這些話的含義。……四年之前，我還只是個小孩子的時候，便不怕那惡人的諸般惡刑，今日長大了，難道反而越來越不長進了？”又按：“這一晚是月半，月光從茅棚的空隙中照射進來。”</p>\n<p class=\"content\">峨嵋派滅絕師太殺徒弟紀曉芙。</p>\n<p class=\"content\">《倚天屠龍記》第13回：滅絕師太對明教楊逍仇深似海，三十年前她初任掌門，師兄孤鴻子被少年楊逍擊敗而死，九年前徒弟紀曉芙又被中年楊逍欺辱懷孕。滅絕師太終於找到紀曉芙母女，逼其加害楊逍，因紀曉芙不肯而殺之。孤女楊不悔按照母親遺囑，隨著張無忌逃出蝴蝶谷，去尋找生身父親楊逍。按：“只隔十天左右，各人陸續道謝辭去。……他只讀了八九天，醫術已是大進，但如何驅除自己體內陰毒，卻不得絲毫端倪。”</p>\n<p class=\"content\">張無忌路遇朱元璋、徐達。</p>\n<p class=\"content\">《倚天屠龍記》第14回：當時正是大飢之年，張無忌、楊不悔離開蝴蝶谷才兩天，差點被崆峒派、華山派的高手吃掉，幸得朱元璋、徐達等人出手相救。朱元璋就是後來的明朝開國皇帝，今年二十三歲，自十七歲起在皇覺寺出家，做的是風流快活和尚，不愛念經拜佛，整天便喝酒吃肉，值此社會動盪之際，糾合一幫豪氣干雲的兄弟，醞釀揭竿而起。徐達後來成為朱元璋軍中干將，今年十九歲。據《明史·太祖本紀》：“至正四年（1344年），旱蝗，大飢疫。太祖時年十七，父母兄相繼歿，貧不克葬。里人劉繼祖與之地，乃克葬，即鳳陽陵也。太祖孤無所依，乃入皇覺寺為僧。逾月，遊食合肥。道病，二紫衣人與俱，護視甚至。病已，失所在。凡歷光、固、汝、潁諸州三年，復還寺。”《明史·徐達傳》：“洪武十七年（1384年），太陰犯上將，帝心惡之。達在北平病背疽，稍愈，帝遣達長子輝祖齎敕往勞，尋召還。明年（1385年）二月，病篤，遂卒，年五十四。”第14回：“最後（徐達）是個二十歲上下的青年漢子。”</p>\n<p class=\"content\">九月，張無忌在崑崙山行醫療毒，楊逍帶走楊不悔。</p>\n<p class=\"content\">《倚天屠龍記》第14回：張無忌、楊不悔過了駐馬店，遇見武林人物蘇習之，和崑崙派弟子詹春，一起來到崑崙山三聖坳。崑崙派掌門人何太沖的愛妾五姑身中劇毒，張無忌以金銀血蛇為其療毒。張無忌在何太沖府上遇見明教楊逍，楊不悔隨父親前去光明頂。按：“行了十五六天，方到河南省境，……又行了二十餘天，……這一日過了駐馬店後，已是夏末秋初，……漸行漸西，天氣一天冷似一天。”</p>\n<p class=\"content\">十月，張無忌住進大理派朱家莊。</p>\n<p class=\"content\">《倚天屠龍記》第15回：朱家莊莊主朱長齡是大理派弟子朱子柳的後人，武家莊莊主武烈是大理派弟子武三通的後人，兩莊的小姐朱九真、武青嬰在崑崙一帶合稱“雪嶺雙姝”。張無忌離開三聖坳何府，被朱九真的惡犬咬傷，留在莊上療養。張無忌為朱九真的美貌所傾倒。按：“如此行了十餘日，臂傷漸愈，……一直躺了八天，才勉強起床，……此時已屆初冬，崑崙一帶早已極為寒冷。”</p>\n<p class=\"content\">十二月，張無忌住在朱家莊，寒毒時常發作。</p>\n<p class=\"content\">《倚天屠龍記》第15回：張無忌在朱家莊一住月餘，轉眼便要過年，他的臂骨已接續如舊，為群犬咬傷各處也已痊癒。這些日子，他身上寒毒仍每隔數日便要發作一次，每發一次，便厲害一回。按：“想不到在這裡一住月餘，轉眼便要過年。……富家大宅一到年盡歲尾，加倍有一番熱鬧氣象。”</p>\n<p class=\"content\">1351年　元順帝至正十一年（張無忌15歲）</p>\n<p class=\"content\">正月，大理派朱長齡識破張無忌身世，設下連環騙局。</p>\n<p class=\"content\">《倚天屠龍記》第15回：朱長齡的外甥衛璧，是武烈的弟子，為朱武兩位小姐所愛慕。衛璧欺辱張無忌，張無忌被迫自衛，使出的“武當長拳”蘊含了《九陽真經》中的上乘武學。朱長齡識破無忌是武當派張翠山的遺孤。為了套出金毛獅王謝遜和屠龍刀的下落，朱長齡精心設下連環騙局。按：“好容易爆竹聲中，盼到了元旦，張無忌跟著喬福，到大廳上向主人拜年。……他盼望了整整兩個月，才再聽到朱九真的聲音，教他如何不神搖意奪？”</p>\n<p class=\"content\">二月，張無忌、朱長齡跳下萬丈峽谷。</p>\n<p class=\"content\">《倚天屠龍記》第15回：朱長齡連續製造假象，使張無忌相信：張翠山早年有恩於朱長齡，朱長齡決意為張翠山夫婦報仇，遭到天下各大門派的追殺。朱長齡假意避仇，帶著張無忌舉家遷往海外冰火島。啟程之初，小姐朱九真情不自禁要與表兄相會，使張無忌在無意中得悉騙局真相。為了保護義父謝遜的安全，無忌縱身跳下懸崖。朱長齡不甘心兩個月的苦心經營付諸東流，抓住無忌一起跳下懸崖。兩人被困在峽谷半腰的平臺上，張無忌穿過山洞進入香花翠谷，朱長齡卻卡在山洞口，靠無忌每日摘送的鮮果度日。按：“在這二十餘日的養傷期間，朱九真常自伴在張無忌床邊，……轉眼到了二月中旬，這日張無忌和朱九真在小書房中相對臨帖。”</p>\n<p class=\"content\">四月，張無忌在白猿腹中得《九陽真經》。</p>\n<p class=\"content\">《倚天屠龍記》第16回：九十一年前，瀟湘子和尹克西從少林寺盜得《九陽真經》，藏在白猿腹中。張無忌在崑崙山香花翠谷中遇見此白猿，見其腹上縫合之處潰爛成瘡，為其治療，竟得到《九陽真經》秘笈。張無忌獨自在谷中誦讀經文，習練神功。按：“如此過了一月有餘。一天清晨，他兀自酣睡未醒，忽覺有隻毛茸茸的大手在臉上輕輕撫摸。”</p>\n<p class=\"content\">莫道石人一隻眼，挑動黃河天下反。</p>\n<p class=\"content\">《倚天屠龍記》第34回：“韃子皇帝任用番僧，朝政紊亂，又命賈魯開掘黃河，勞民傷財，弄得天怒人怨。……賈魯大人拉伕掘黃河，挖出一個獨眼石人，那石人背上刻有兩行字道：莫道石人一隻眼，挑動黃河天下反，這是運數使然，勉強不來的。”（金庸先生將此事件剪貼在張無忌22歲）《中國通史》卷八：元末社會矛盾極其尖銳，賈魯開河後，韓山童等決定利用這一時機發動起義。他們散佈民謠“石人一隻眼，挑動黃河天下反”，同時暗地裡鑿一獨眼石人，在其背上刻上“莫道石人一隻眼，此物一出天下反”幾個字，埋在即將挖掘的黃陵崗附近的河道上。至正十一年（1351年）四月，民工挖出獨眼石人，消息不脛而走，大河南北，人心浮動。韓山童等借獨眼石人來鼓動造反，收到了預期的效果。</p>\n<p class=\"content\">五月初三，紅巾起義爆發，韓山童被誅。</p>\n<p class=\"content\">《倚天屠龍記》第25回：初，韓山童散佈流言，謂天下當大亂，彌勒佛降生，民眾多信之。潁州人劉福通、杜遵道、羅文素、盛文鬱等人，說韓山童是宋徽宗八世孫，當主中國，乃殺白馬黑牛，誓告天地，以紅巾為號策劃起義。至是月，起義計劃暴露，韓山童被官府捕殺，其子韓林兒逃入武安山中，劉福通等人在河南潁州一帶起事。（金庸先生將此事件剪貼在張無忌21歲）據《元史·順帝本紀》至正十一年：“五月辛亥（初三），潁州妖人劉福通為亂，以紅巾為號，陷潁州。”參見《明史·韓林兒列傳》。</p>\n<p class=\"content\">八月初十，紅巾黨芝麻李、趙君用在徐州發動起義。</p>\n<p class=\"content\">《倚天屠龍記》第25回：“周顛率領芝麻李、趙君用等在徐宿豐沛一帶起事。”（金庸先生將此事件剪貼在張無忌21歲）據《元史·順帝本紀》至正十一年：“八月丙戌（初十），蕭縣李二及老彭、趙君用攻陷徐州。李二號芝麻李，與其黨亦以燒香聚眾而反。”</p>\n<p class=\"content\">紅巾黨徐壽輝在江西發動起義。</p>\n<p class=\"content\">《倚天屠龍記》第25回：“彭瑩玉和尚率領徐壽輝、鄒普勝、明五等，在江西贛、饒、袁、信諸州起事。”（金庸先生將此事件剪貼在張無忌21歲）據《元史·順帝本紀》至正十一年八月：“是月，車駕還自上都。蘄州羅田縣人徐貞一，名壽輝，與黃州麻城人鄒普勝等，以妖術陰謀聚眾，遂舉兵為亂，以紅巾為號。”</p>\n<p class=\"content\">張無忌練成《九陽真經》第一卷。</p>\n<p class=\"content\">《倚天屠龍記》第16回：張無忌幽居香花翠谷，不知谷外世事滄桑，專心修煉《九陽真經》。短短四月時光，便已將第一卷經書上所載的功夫盡數參詳領悟，依法練成，以前時常發作的寒毒侵襲也大為減弱。</p>\n<p class=\"content\">1352年　元順帝至正十二年（張無忌16歲）</p>\n<p class=\"content\">二月，紅巾黨郭子興起兵濠州，朱元璋投軍。</p>\n<p class=\"content\">《倚天屠龍記》第25回：“朱元璋、徐達、湯和、鄧愈、花雲、吳良、吳禎，會同常遇春寨中人馬，和孫德崖等在淮北濠州起兵。”第36回：“韓林兒手下另一支挺有力量的兵馬，大將是郭子興，自稱滁陽王。朱元璋、徐達都歸於他的麾下，朱元璋的妻子便是郭子興的養女。”據《明史·太祖本紀》：“至正十二年春二月，定遠人郭子興與其黨孫德崖等起兵濠州。元將徹裡不花憚不敢攻，而日俘良民以邀賞。太祖時年二十四（二十五），謀避兵，卜於神，去留皆不吉。乃曰：得毋當舉大事乎？卜之吉，大喜，遂以閏三月甲戌朔（初一）入濠見子興。子興奇其狀貌，留為親兵。戰輒勝，遂妻以所撫馬公女，即高皇后也。”</p>\n<p class=\"content\">四月，張無忌練成《九陽真經》第二卷。</p>\n<p class=\"content\">《倚天屠龍記》第16回：“張無忌練完第二卷經書，便已不畏寒暑。”編者按：張無忌練習《九陽真經》，共四卷，歷時五年有餘。其中第一卷四個月，第三卷整一年，第四卷三年有餘。據此推測，第二卷當在八個月左右。</p>\n<p class=\"content\">1353年　元順帝至正十三年（張無忌17歲）</p>\n<p class=\"content\">春，義軍首領徐達投奔朱元璋。</p>\n<p class=\"content\">《倚天屠龍記》第25回：徐達是朱元璋少年朋友，時年二十二，投奔郭子興軍中鎮撫朱元璋。不久，跟隨朱元璋南略定遠。據《明史·太祖本紀》：“至正十三年春，太祖收裡中兵，得七百人。[郭]子興喜，署為鎮撫。時彭[大]、趙[均用]所部暴橫，子興弱，太祖度無足與共事，乃以兵屬他將，獨與徐達、湯和、費聚等南略定遠。”《明史·徐達列傳》：“達少有大志，長身高顴，剛毅武勇。太祖之為郭子興部帥也，達時年二十二，往從之，一見語合。及太祖南略定遠，帥二十四人往，達首與焉。”</p>\n<p class=\"content\">四月，張無忌練成《九陽真經》第三卷。</p>\n<p class=\"content\">《倚天屠龍記》第16、19回：無忌越練到後來，越是艱深奧妙，進展也就越慢，第三卷整整花了一年時光。無忌在十歲那一年身中玄冥神掌陰毒，直至十七歲上方才去淨，七年之間，日日夜夜均在與體內寒毒相抗。</p>\n<p class=\"content\">1355年　元順帝至正十五年（張無忌19歲）</p>\n<p class=\"content\">二月，義軍首領韓林兒（龍鳳元年）稱帝，國號宋。</p>\n<p class=\"content\">《倚天屠龍記》第36回：“劉福通統帥大軍，擁韓林兒為帝，以亳州為國都，國號宋，稱為龍鳳皇帝。”（金庸先生將此事件剪貼在張無忌22歲）據《明史·韓林兒列傳》：“[至正]十五年二月，福通物色林兒，得諸碭山夾河；迎至亳，譖稱皇帝，又號小明王，建國曰宋，建元龍鳳。拆鹿邑太清宮材，治宮闕於亳。”</p>\n<p class=\"content\">三月，義軍首領郭子興卒，朱元璋任左副元帥。</p>\n<p class=\"content\">《倚天屠龍記》第36回：“不久郭子興去世，他的部眾歸其長子郭天敘統領。郭天敘是都元帥，張天祐任右副元帥，朱元璋任左副元帥。”（金庸先生將此事件剪貼在張無忌22歲）據《明史·太祖本紀》：“[至正十五年]三月，郭子興卒。時劉福通迎立韓山童子林兒於亳，國號宋，建元龍鳳。檄子興子天敘為都元帥，張天祐、太祖為左右副元帥。”</p>\n<p class=\"content\">四月，義軍首領常遇春投奔朱元璋。</p>\n<p class=\"content\">《明史·常遇春列傳》：“初從劉聚為盜，察聚終無成，歸太祖於和陽。未至，困臥田間，夢神人被甲擁盾呼曰：起起，主君來。驚寤，而太祖適至，即迎拜。時至正十五年四月也。”</p>\n<p class=\"content\">九月，義軍首領朱元璋統領郭子興部眾。</p>\n<p class=\"content\">《倚天屠龍記》第36回：“郭天敘領了大軍渡長江，攻陷了太平，再攻集慶路（南京），手下將領陳野光叛亂，殺了郭天敘和張天祐，朱元璋率領徐達等人平定叛亂，自任都元帥。”（金庸先生將此事件剪貼在張無忌22歲）據《明史·太祖本紀》：“[至正十五年]秋九月，郭天敘、張天祐攻集慶，野光叛，二人皆戰死，於是子興部將盡歸太祖矣。”</p>\n<p class=\"content\">1356年　元順帝至正十六年（張無忌20歲）</p>\n<p class=\"content\">三月，義軍首領朱元璋攻陷集慶路（南京），改名應天府。</p>\n<p class=\"content\">《倚天屠龍記》第36回：“[朱元璋]攻陷了集慶路，改名應天，宋國遷都應天府。朱元璋功大，官居平章政事，封吳國公，掌握宋國政權。”（金庸先生將此事件剪貼在張無忌22歲）據《明史·太祖本紀》：“[至正]十六年三月癸未（初三），進攻集慶，……庚寅（初十），再敗元兵於蔣山。……太祖入城……改集慶路為應天府。”</p>\n<p class=\"content\">六月，紫衫龍王之女小昭潛入光明頂。</p>\n<p class=\"content\">《倚天屠龍記》第22回：紫衫龍王黛綺絲，與韓千葉生有一女，名小昭，今年十四歲。黛綺絲當年進入光明頂秘道尋訪乾坤大挪移心法未得，做了金花婆婆後仍然此心不死，令女兒小昭設法潛入光明頂，伺機尋訪。是時，明教楊逍帶著女兒楊不悔下山遊玩，見到小昭一人撫著“親人”的屍首哭泣，便收留了她，叫她服侍不悔。</p>\n<p class=\"content\">七月初一，義軍首領朱元璋封吳國公。</p>\n<p class=\"content\">《明史·太祖本紀》：“秋七月己卯（初一），諸將奉太祖為吳國公。置江南行中書省，自總省事，置僚佐。”（金庸先生將此事件剪貼在張無忌22歲）</p>\n<p class=\"content\">十一月，張無忌練成《九陽真經》第四卷，走出香花翠谷。</p>\n<p class=\"content\">《倚天屠龍記》第16回：張無忌練習《九陽真經》，至功行圓滿，在這雪谷幽居已五年有餘。是年寒冬，無忌從雪谷鑽出山洞，來到懸崖半腰，被朱長齡推下摔斷雙腿。無忌跌落在山腳的大雪堆上，與千里尋訪他的殷離兒相遇。按：“他在這雪谷幽居，至此時已五年有餘，從一個孩子長成為身材高大的青年。……他身畔是三隻死狗，一個死人，好在隆冬嚴寒，屍體不會腐臭，他又過慣了寂寞獨居的日子，也不以為苦。”</p>\n<p class=\"content\">編者按：張無忌走出雪谷，直至在光明頂挫敗六大門派，攝任明教教主，均是發生在無忌二十歲年底的事。對此，原著有多次提示：1.無忌十歲時，張翠山夫婦自盡。第18回殷梨亭說“五師哥逝世已過十年，墓木早拱”。2.無忌十二歲時進蝴蝶谷求醫，周芷若投入峨嵋派門下。第21回張無忌記起“八年前在蝴蝶谷中，胡青牛曾對他言道，華山派的鮮于通害死了他妹子。”第22回記殷梨亭和張無忌“雖然分別八年”，“細看之下，記憶中的面貌一點點顯現出來。”周芷若回憶“這八年多時日之中師父的一言一動，於她便如是天經地義一般”。3.無忌十四歲時離開蝴蝶谷，與楊不悔在崑崙派何太沖府上有過一段難忘的經歷。第18回殷離兒說“六年之前，我曾在蝴蝶谷醫仙胡青牛家中見過他一面”。第21回何夫人說“她和張無忌分手不過六年”，楊不悔“六年前被你們封了穴道”，“她現下也不過是個稚齡少女，六年之前自是更加幼小。”4.無忌十五歲時摔下香花翠谷。第18回殷梨亭從武烈處得知“無忌已於五年多之前，失足摔入萬丈深谷之中”。第16回張無忌“進來時十五歲身子尚小，出去已是二十長大成人”，朱長齡“在這絕峰之上吃了五年多難以形容的苦頭”。5.此外，周芷若和殷離兒的年齡也可作為張無忌眼下二十歲的旁證。張無忌在十二歲時初遇周芷若，當時周芷若“十歲左右”（第11回），第17、19回記周芷若今年“約莫十八九歲年紀”；張無忌在十四歲時初遇殷離兒，當時殷離兒“十一二歲”（第12、13回），第16回記殷離兒今年“不過十七八歲年紀”。</p>\n<p class=\"content\">十二月，武林六大門派奔赴光明頂，圍剿明教。</p>\n<p class=\"content\">《倚天屠龍記》第16-18回：少林、武當、峨嵋、崑崙、崆峒、華山是武林六大門派，視明教為魔教，是年冬天聯手西征明教。張無忌、殷離兒大約在十二月初遇見峨嵋派、崑崙派，與周芷若闊別重逢，滅絕師太阻擊前往天鷹教告急求援的明教教徒。第十天又遇到武當派殷梨亭和宋青書。殷野王、殷離兒父女相見，殷離兒被明教護法韋一笑擄走，張無忌被說不得和尚擄走。按：“雖然隆冬，亦覺炎熱。”</p>\n<p class=\"content\">張無忌在光明頂挫敗六大門派，攝任明教教主。</p>\n<p class=\"content\">《倚天屠龍記》第19-22回：明教大敵當前，四大護法中紫衫龍王韓夫人早就破教而出，白眉鷹王殷天正自立門派，金毛獅王謝遜下落不明，只剩下青翼蝠王韋一笑。光明右使範遙多年前潛入元朝作臥底，光明左使楊逍與韋一笑、明教五散人素來不和。五散人即布袋和尚說不得、鐵冠道人張中、周顛、冷麵先生冷謙、彭瑩玉彭和尚。明教四分五裂，藏身少林寺化名為圓真的成昆乘虛得手，他回憶三十三年前的如煙往事，為自己瓦解明教終於大功告成欣喜不已。張無忌隨著說不得和尚來到光明頂，破袋而出，追擊成昆，在秘道中偶得乾坤大挪移心法。張無忌至光明頂廣場，挫敗六大門派，拯救明教於危難之中。殷天正解散天鷹教，與楊逍、周顛等人共奉張無忌為明教教主，決心重振明教雄風。其時大致已至十二月下旬。按：“到第八日上，張無忌已可坐起。”</p>\n<p class=\"content\">1357年　元順帝至正十七年（張無忌21歲）</p>\n<p class=\"content\">春，元朝郡主趙敏洗劫少林、武當兩大門派。</p>\n<p class=\"content\">《倚天屠龍記》第22-24回：元朝汝陽王察罕特穆爾，生有一子一女均是武藝超群，郡主趙敏奉命襲擊中原武林各大門派，然後嫁禍於明教，以化解江湖抗元勢頭。張無忌擔任明教教主後，與明教群豪約法三章，下山迎接謝遜法王，中途遇見被少林功夫擊成重傷的武當派殷梨亭，隨即改道去嵩山少林寺問罪。明教群豪至少林寺，發現少林寺慘遭浩劫。明教群豪至武當山，正遇上趙敏率領玄冥二老洗劫武當，張無忌奮力予以反擊。按：“在甘涼大路上趕道，驕陽如火，天氣熱了起來。”</p>\n<p class=\"content\">三月，明教張無忌允諾趙敏三件事。</p>\n<p class=\"content\">《倚天屠龍記》第25回：張無忌初見趙敏，是在去少林寺問罪的路上，趙敏機詐多變，無忌卻一見鍾情。無忌為了得到黑玉斷續膏，替俞岱巖、殷梨亭兩位師叔療傷，允諾趙敏日後替她辦三件事。此時當在三月。按：“那黑玉斷續膏果然功效如神，兩個多月後，殷梨亭雙手已能活動。……當下群豪各無異議，言明三個多月後的八月中秋，明教各路首領，齊集淮北蝴蝶谷胡青牛故居聚會。”</p>\n<p class=\"content\">七月初三，元朝郡主趙敏將擒獲的各大門派高手押至大都。</p>\n<p class=\"content\">《倚天屠龍記》第25回：趙敏襲擊六大門派，將擒獲的高手分批押至大都，以便觀摩和破解各派武功要訣。明教下屬朱元璋在六月上旬接到教主在蝴蝶谷聚會的令旨，四出準備賀禮，路上卻被趙敏徵用為押送少林、武當高手的車隊，因而偵知趙敏的陰謀。按第25回：“七月初三，我們載著少林和尚到了大都。”</p>\n<p class=\"content\">明教楊不悔將終身託付殷梨亭。</p>\n<p class=\"content\">《倚天屠龍記》第25回：峨嵋派紀曉芙本是武當派殷梨亭的未婚妻，因與明教楊逍有私情被師父打死。紀曉芙的私生女楊不悔，在照應殷梨亭療傷時萌生愛情，卻不敢啟齒。張無忌在發出聚會號令後，“如此過了兩個月有餘”，說服楊逍同意了楊不悔和殷梨亭的婚事。按：今年楊不悔十七歲，殷梨亭四十歲。“楊不悔道，不，在旁人看來，那是很久以前的事啦，連我都快十八歲了。……張無忌道，殷六叔也不過四十歲，方當壯盛。”</p>\n<p class=\"content\">八月十五，明教各路首領聚會蝴蝶谷。</p>\n<p class=\"content\">《倚天屠龍記》第25回：明教教主張無忌五月發出令旨，至八月十五各路首領陸續抵達蝴蝶谷聚會。張無忌登壇宣示和中原諸門派盡釋前愆、反元抗胡之意，又頒下教規，重申行善去惡、除暴安良的教旨。朱元璋通報了六大門派高手被關押在大都的消息，張無忌在聚會結束後，率領楊逍、韋一笑等人前往大都，營救六大門派的高手。按：“再過三日便是八月十五。”</p>\n<p class=\"content\">九月，張無忌與趙敏在大都萬安寺交鋒。</p>\n<p class=\"content\">《倚天屠龍記》第26、27回：張無忌率領明教群豪至大都，在關押各大門派高手的萬安寺，與趙敏交鋒。趙敏手下有兩大高手鹿杖客和鶴筆翁，即“玄冥二老”，用“十香軟筋散”，使六大門派的高手失去內力。潛伏在汝陽王府十五年的明教光明右使範遙現身，迫使鹿杖客交出解藥，救了六大門派的高手。元兵焚燒萬安寺寶塔，張無忌運乾坤大挪移神功，救各大門派的高手脫險。峨嵋派掌門滅絕師太仇恨明教，不肯受其恩惠，跳塔自殺，弟子周芷若接任掌門。趙敏要求張無忌踐諾的第一件事，就是借屠龍寶刀一觀。按：按事排比，時間已到了九月下旬。</p>\n<p class=\"content\">武當派莫聲谷遇害。</p>\n<p class=\"content\">《倚天屠龍記》第32回：六大門派的高手在大都萬安寺獲救後，與張無忌作別，分頭奔赴各派根本之地。那日深宵，武當派宋遠橋之子宋青書去偷窺峨嵋諸女的臥室，被七師叔莫聲谷撞見，一路追來，致有石岡比武、以侄弒叔之事。按：史載莫聲谷生卒（1323-1357），享年三十五歲。</p>\n<p class=\"content\">閏九月，明教波斯總教十一寶樹王齊集靈蛇島。</p>\n<p class=\"content\">《倚天屠龍記》第28-30回：張無忌帶著趙敏和小昭，金花婆婆帶著殷離兒、擄著峨嵋派掌門周芷若，一起出海尋找屠龍刀。一行人至靈蛇島，原來金毛獅王謝遜也在島上，他和金花婆婆兩人回憶起明教由盛轉衰的恩恩怨怨，感慨不已。波斯總教因聖女黛綺絲，即金花婆婆違令不歸，派三位使者持著聖火令前來追殺，張無忌和謝遜聯手抗旨。波斯總教十一寶樹王齊集島上，黛綺絲和女兒小昭被迫西去，小昭出任波斯總教教主。時在月初。按：“其時已是初冬天氣。……其時正當冬季。”第28回周芷若說“蒙武當派張真人之薦，於九年前引入峨嵋門下”。殷離兒以為無忌“早在六年之前，在西域墜入山谷死了”。</p>\n<p class=\"content\">峨嵋派周芷若暗害殷離兒，嫁禍趙敏。</p>\n<p class=\"content\">《倚天屠龍記》第31、38回：周芷若接任峨嵋掌門時，答應師父不以真心愛無忌，只以美色騙取屠龍刀和倚天劍。黛綺絲和小昭離去後，她隨著謝遜、張無忌一行飄泊到一無名小島。周芷若用趙敏的“十香軟筋散”迷倒眾人，劃破殷離兒的臉龐，製造趙敏所為的假象。殷離兒傷重去世，恰好趙敏又獨自離島，張無忌恨趙敏入骨。時在月中。謝遜做媒，張無忌和周芷若約下百年之好。時在月底。按：“這一個多月來。”</p>\n<p class=\"content\">十月初六，丐幫幫主史火龍遇害。</p>\n<p class=\"content\">《倚天屠龍記》第33回：混元霹靂手成昆去年年底在光明頂假死脫身後，獨霸武林的野心不死。成昆和徒弟陳友諒合夥殺死丐幫幫主史火龍，找了一個面容相像的山西蟊賊劉敖冒充幫主，計劃以此控制丐幫，挾制明教，進而籠絡少林、武當、峨嵋三大派。按：“張無忌……問道：請問姑娘，史幫主喪生已有多久了？黃衫女子道：去年十月初六，距今兩月有餘。”應是今年十月初六。</p>\n<p class=\"content\">十一月，元朝郡主趙敏派水師將張無忌等人接離無名小島。</p>\n<p class=\"content\">《倚天屠龍記》第31回：“如此忽忽過了數月，這一日島東幾株桃花開得甚美，張無忌折了幾枝桃花，去插在殷離墓前，……正自神傷，忽聽得海中鷗鳥大聲聒噪，抬起頭來，忽見遠處一艘帆船正鼓風駛來。”</p>\n<p class=\"content\">十二月十六，彌勒廟丐幫聚會。</p>\n<p class=\"content\">《倚天屠龍記》第31回：張無忌、謝遜一行在海上行駛一個多月，抵達關外遼東。丐幫在彌勒廟聚會，陳友諒挾制假幫主，威逼宋青書去陷害武當派。張無忌重遇趙敏，卻不忍下手為表妹殷離兒報仇。丐幫受陳友諒和假幫主利用，劫持謝遜和周芷若。按：“這一向北，更接連駛了二十餘日，……這一個多月之中，張無忌等不是取用自攜的食物，便是捕捉海中鮮魚為食。”“此時方當隆冬，五毒蟄伏土下，……執法長老道：陳兄弟、宋兄弟兩位，陪同掌缽龍頭赴長白山配藥，咱們先行南下。今兒是臘月十六，一個月後在老河口聚齊。”</p>\n<p class=\"content\">武當派莫聲谷和丐幫史火龍遇害的真相大白。</p>\n<p class=\"content\">《倚天屠龍記》第32-34回：張無忌、趙敏在雪山遇見武當四俠，趙敏幫助無忌洗刷冤誣，莫聲谷為師侄宋青書所害的真相大白。張無忌奔至盧龍丐幫總堂，發現謝遜已經脫離丐幫的掌握，被成昆劫走。無忌揭穿陳友諒讓人假冒丐幫幫主的陰謀，救出周芷若。張無忌和周芷若奔赴大都尋訪謝遜的消息，兩人在一小鎮傾吐海誓山盟。</p>\n<p class=\"content\">1358年　元順帝至正十八年（張無忌22歲）</p>\n<p class=\"content\">正月，張無忌與趙敏在大都邂逅，周芷若憤然離去。</p>\n<p class=\"content\">《倚天屠龍記》第34回：張無忌、周芷若至大都，觀看元朝皇帝大遊皇城。周芷若發現無忌與趙敏藕斷絲連，不辭而別。張無忌離開大都，在濠州大會明教諸雄。按：“次晨三人繼續南行，路上也沒發現趙敏的蹤跡，這天是大年初一，三人道上風塵僕僕，也沒心緒來慶賀新年。……不一日已來到大都。……店小二道，現下過了新年，明天是皇上大遊皇城的日子。”</p>\n<p class=\"content\">二月，張無忌至白衣庵拜會周芷若。</p>\n<p class=\"content\">《倚天屠龍記》第34回：峨嵋派掌門周芷若將本派總門遷到定海，住在白衣庵。她按照師父臨終傳授的辦法，從屠龍刀和倚天劍中得到提示，獨自去桃花島掘出《九陰真經》的抄本，練習“九陰白骨爪”和“白蟒鞭”兩項陰功。張無忌不知原委，至白衣庵拜會周芷若，兩人盡釋前嫌，擇定婚期。按：“這一個多月來的愁雲慘霧，便在兩人一笑之間，化作飛煙而散。”</p>\n<p class=\"content\">六月十五，趙敏攪散張無忌與周芷若的婚禮。</p>\n<p class=\"content\">《倚天屠龍記》第34、35回：張無忌與周芷若在濠州舉行成婚大禮，趙敏不速而至，要無忌辦的第二件事，就是今天不得與周芷若拜堂成親。無忌聽說趙敏有義父謝遜的消息，便隨她而去，周芷若恥辱難當，誓與無忌恩斷義絕。張無忌和趙敏路遇汝陽王，趙敏不惜違抗父命，追隨張無忌。張無忌和趙敏在護國寺與成昆同黨惡鬥，獲悉謝遜被囚禁少林寺。按：“楊逍擇定六月十五為黃道吉日。……好在重陽節距今二月有餘，時日大是從容，待傷勢痊癒後前去相救，盡來得及。”</p>\n<p class=\"content\">七月，張無忌進入少林打雜。</p>\n<p class=\"content\">《倚天屠龍記》第35回：成昆將謝遜囚禁在少林寺，派三位老僧專意看守，向天下武林散發英雄帖，定於重陽節召開屠獅英雄會。武林中當年遭受謝遜濫殺的仇人，紛至沓來。張無忌結識了與謝遜有殺子之仇的杜百當、易三娘夫婦，混入少林寺打雜幫忙。其間，無忌目睹“西涼三劍”為了屠龍刀的下落，葬身少林寺。按：“重陽前後，寺中要多上千餘位客人，挑水劈柴，說甚麼也忙不過來。這個兄弟倒生得健旺，你來幫忙兩個月，算五錢銀子一個月的工錢給你如何？”</p>\n<p class=\"content\">八月，白眉鷹王殷天正為營救謝遜而死。</p>\n<p class=\"content\">《倚天屠龍記》第35、36回：成昆威逼謝遜說出屠龍刀的下落，謝遜寧死不從。張無忌大戰少林三位老僧的“金剛伏魔圈”，卻無法救出義父謝遜。明教群豪上少林寺營救謝遜，亦為三僧所阻。白眉鷹王殷天正為老僧渡難的真氣所傷，命喪當場。明教即在少室山下操辦殷天正的喪事。按：“又過數日，已是八月中旬，離重陽節一天近似一天。”</p>\n<p class=\"content\">明教朱元璋上少室山逼宮。</p>\n<p class=\"content\">《倚天屠龍記》第36回：張無忌率領明教群豪為外公白眉鷹王舉喪，朱元璋率領一支兵馬前來少室山，幫助教主營救謝遜法王。朱元璋近幾年戰功赫赫，已被韓林兒的龍鳳政權封為吳國公。朱元璋居功自大，以教主身邊的趙敏是元朝郡主為由，逼迫張無忌讓出教主之位，教中兄弟均憤憤不平。趙敏發誓退回蒙古。按：“這天是殷天正去世的頭七，張無忌率領教中群豪，在靈位前陳祭致哀。”</p>\n<p class=\"content\">九月初九，少林寺屠獅英雄大會。</p>\n<p class=\"content\">《倚天屠龍記》第37-39回：武林各大門派在重陽節會聚少林寺，參加屠獅英雄會。峨嵋派周芷若和武當叛徒宋青書聯手，公然與明教、武當派為敵。在下午的廣場比武中，宋青書被武當師叔俞蓮舟重創，周芷若卻連敗殷梨亭、俞蓮舟和張無忌等高手，取得武功天下第一的稱號。按比武前的約定，周芷若有權處置金毛獅王謝遜，第二天，她在張無忌的幫助下，攻破少林三位老僧的“金剛伏魔圈”，救出謝遜。謝遜與師父成昆決鬥，了結三十五年來的恩怨。謝遜擊敗成昆後，傷其雙目，又自廢武功，坦然接受當年那些無辜受害者親屬的羞辱。按：“彈指間重陽正日已到，張無忌率領明教群豪，來到少林寺中。……九月初十清晨，少林寺鐘聲鐺鐺響起，群雄又集在廣場之中。”又按：“南宋末年，郭靖、黃蓉夫婦曾先後在大勝關（1242年）及襄陽（1259年）邀集天下豪傑，共商抗禦蒙古人入侵的大計，此後將近百年，直至今日方始再有英雄大會。”“原來銳金旗當年在西城與峨嵋派一場惡戰（1356年十二月），損折極重，連掌旗使莊錚也死在滅絕師太的倚天劍下，……武功本來已有相當根柢，再在明師指點下練得年餘，已成為一支可上戰陣、可作單斗的勁旅。”</p>\n<p class=\"content\">明教成為中原武林之首。</p>\n<p class=\"content\">《倚天屠龍記》第39回：張無忌擊敗周芷若，得到《武穆遺書》和《九陰真經》。元兵包圍少室山，張無忌率領各大門派的高手擊敗元兵，各大門派奉明教為中原群雄之首。朱元璋手下的徐達、常遇春作戰有功，張無忌贈送《武穆遺書》以資勉勵。張無忌派人從海外無名小島取回屠龍刀、倚天劍，將屠龍刀復原，倚天斷劍奉還峨嵋派。按：“朱元璋因知徐達、常遇春二人與張無忌交好，因此半個月前來開封逼宮時（八月下旬），刻意支開了二人的兵馬。”</p>\n<p class=\"content\">殷離兒劫後餘生，與張無忌重逢。</p>\n<p class=\"content\">《倚天屠龍記》第40回：去年殷離兒為周芷若所害，並未死去，重生後一直想找周芷若報仇。張無忌與趙敏、周芷若、殷離兒團圓，捫心自問，愛得最深的還是趙敏。無忌知道芷若的所作所為是師命所迫，也就原諒了她。周芷若和殷離兒黯然離去。按：“山道上晚風習習，其時正當秋末，良夜露清，耳聽著一個美貌少女吐露深情，張無忌不能不怦然心動。”</p>\n<p class=\"content\">十月，張無忌送趙敏前往蒙古。</p>\n<p class=\"content\">《倚天屠龍記》第40回：張無忌和趙敏至武當山，宋青書因傷重而死，其父宋遠橋引咎辭去掌門之職，俞蓮舟繼任掌門。張無忌和趙敏至應天府，朱元璋等人奉請教主稱王，無忌嚴詞拒絕。波斯總教教主小昭派遣使者，送來餘下的六枚聖火令，無忌回贈“乾坤大挪移心法”羊皮。張無忌將教中事務交給楊逍等人代理，自己送趙敏去蒙古，從此不再回中土。</p>\n<p class=\"content\">1363年　元順帝至正二十三年（張無忌27歲）</p>\n<p class=\"content\">八月十三，明教朱元璋擊敗陳友諒。</p>\n<p class=\"content\">《倚天屠龍記》第40回：“此後朱元璋改稱吳王，在鄱陽湖與陳友諒會戰，周顛、五行旗等人相助朱元璋，將陳友諒殺得大敗，斃於湖中。”據《明史·太祖本紀》：“二十三年，秋七月癸未（初三），友諒聞太祖至，解圍，逆戰於鄱陽湖。……八月壬戌（十三），友諒食盡，趨南湖觜，為南湖軍所遏，遂突湖口。太祖邀之，順流搏戰，及於涇江。涇江軍復遮擊之，友諒中流矢死。”</p>\n<p class=\"content\">1364年　元順帝至正二十四年（張無忌28歲）</p>\n<p class=\"content\">正月初一，明教朱元璋改稱“吳王”。</p>\n<p class=\"content\">《倚天屠龍記》第40回。據《明史·太祖本紀》：“二十四年，春正月，丙寅朔（初一），李善長等率群臣勸進，不允。固請，乃即吳王位。建百官。”</p>\n<p class=\"content\">1366年　元順帝至正二十六年（張無忌30歲）</p>\n<p class=\"content\">十二月十二，宋帝韓林兒（龍鳳十二年）駕崩。</p>\n<p class=\"content\">《倚天屠龍記》第40回：“龍鳳皇帝應吳國公之請，自滁州遷往應天，到得鎮江對岸的瓜步，座船傾覆，在長江中崩駕。……韓林兒在瓜步舟覆溺斃，負責護送的是大將廖永忠。吳國公朱元璋得訊後大怒，已下旨將廖永忠處死，作為護送主上不忠不力的懲罰。”（金庸先生將此事件剪貼在張無忌22歲）據《明史·太祖本紀》：“二十六年十二月，韓林兒卒。以明年為吳元年，建廟社宮室，祭告山川。”《明史·韓林兒列傳》：“太祖為吳王。又二年，林兒卒。或曰太祖命廖永忠迎林兒歸應天，至瓜步，覆舟沉於江雲。”《中國通史》卷八：這時，宋政權已名存實亡，但元璋仍奉之為正朔。十二月十二日，朱元璋在平定南方割據勢力取得節節勝利之際，命廖永忠自滁州迎小明王、劉福通至應天，船至瓜步（今江蘇六合南），將他們溺死。</p>\n<p class=\"content\">1367年　元順帝至正二十七年（張無忌31歲）</p>\n<p class=\"content\">明教朱元璋消滅張士誠、方國珍等敵對勢力。</p>\n<p class=\"content\">《倚天屠龍記》第40回：“後來更滅了張士誠、方國珍等敵對勢力。”《明史·太祖本紀》：“二十七年九月辛巳（初八），徐達克平江，執士誠，吳地平。……十二月丁未（初五），方國珍降，浙東平。”</p>\n<p class=\"content\">1368年　明太祖洪武元年（張無忌32歲）</p>\n<p class=\"content\">正月初四，明教朱元璋滅元，建立明朝。</p>\n<p class=\"content\">《倚天屠龍記》第40回：“朱元璋派徐達帶兵北伐，將元順帝趕入塞外沙漠，蒙古人在中華所建的元朝就此滅亡。朱元璋倒還記得明教，將他所建的朝代稱為明朝。但因明教維護百姓，朝廷官府便對其殘殺鎮壓，時日既久，後世首領無能，明教終於也漸漸式微了。”《明史·太祖本紀》洪武元年：“春正月乙亥（初四），祀天地於南郊，即皇帝位。定有天下之號曰明，建元洪武。……閏七月丙寅（二十八），克通州，元帝趨上都。……八月己巳（初一），以應天為南京，開封為北京。庚午（初二），徐達入元都。”</p>\n<p class=\"content\">1381年　明太祖洪武十四年（張無忌45歲）</p>\n<p class=\"content\">明帝朱元璋賜徐達“大功坊”。</p>\n<p class=\"content\">《碧血劍》第10回：明朝開國，大將軍徐達功居第一。他和明太祖朱元璋是布衣之交。朱元璋做了皇帝后，還是稱他為“徐兄”。一日，朱元璋和他一起喝酒，飲酒中間，說道：“徐兄功勞很大，還沒安居的地方，我的舊邸賜了給你吧。”徐達深知朱元璋猜忌心極重，當下只是道謝，卻說什麼也不肯接受。過了幾天，朱元璋將徐達灌醉了，命侍從將他抬到自己的臥室之中，徐達酒醒之後，連稱死罪。朱元璋心想此人忠字當頭，全無反意，當即下旨，在舊邸之後另起一座大宅賜他，親題“大功”兩字，作為這宅第所在的坊名。那便是南京“大功坊”和“魏國公賜第”的由來。據《明史·徐達傳》：“十四年，復帥湯和等討乃兒不花。已，復還鎮。每歲春出，冬暮召還，以為常。還輒上將印，賜休沐，宴見歡飲，有布衣兄弟稱，而達愈恭慎。帝嘗從容言，徐兄功大，未有寧居，可賜以舊邸。舊邸者，太祖為吳王時所居也。達固辭。一日，帝與達之邸，強飲之醉，而蒙之被，舁臥正寢。達醒，驚趨下階，俯伏呼死罪。帝覘之，大悅。乃命有司即舊邸前治甲第，表其坊曰大功。”</p>\n<p class=\"content\">1385年　明太祖洪武十八年（張無忌49歲）</p>\n<p class=\"content\">二月，明朝大將軍徐達去世。</p>\n<p class=\"content\">《碧血劍》第10回：“徐達雖對皇帝恭順，但他精於韜略，善於將兵，戰無不勝，太祖還是怕他造反。洪武十八年，徐達背上生疽。據說生背疽之人，吃蒸鵝立死。太祖派人慰問，附賜蒸鵝一隻。徐達淚流滿面，當著使者把一隻蒸鵝吃個乾淨，當夜毒發而死。生背疽而吃蒸鵝，未必便死，但朱元璋賜這蒸鵝，便是賜死，徐達縱然吃了蒸鵝無事，也只好服毒自盡。此事正史不載，不知真假。”據《明史·徐達傳》：“十七年，太陰犯上將，帝心惡之。達在北平病背疽，稍愈，帝遣達長子輝祖齎敕往勞，尋召還。明年二月，病篤，遂卒，年五十四。帝為輟朝，臨喪悲慟不已。追封中山王，諡武寧，贈三世皆王爵。”</p>\n<p class=\"content\">1390年　明太祖洪武二十三年（張無忌54歲）</p>\n<p class=\"content\">西域雪山派創立。</p>\n<p class=\"content\">《俠客行》第16回：雪山派祖師爺在西域凌霄城建城開派，自中土過去需穿越沙漠戈壁、峭山雪徑，加上城牆常年凝結，冰雪堅如精鐵，所以開派之後未有外敵來攻，只是隆冬之際常有餓狼侵襲，卻也走不進城去。雪山派建城開派一百七十年以後，發生了《俠客行》的故事，當時的雪山派掌門人是“威德先生”白自在。</p>\n<p class=\"content\">1399年　明惠帝建文元年（張無忌63歲）</p>\n<p class=\"content\">明朝燕王朱棣起兵造反。</p>\n<p class=\"content\">《碧血劍》第10回：明太祖朱元璋於1398年駕崩，因皇太子早夭，皇太孫朱允炆繼承大位，是為建文帝。燕王朱棣是朱元璋的第四子，在父親去世的第二年就起兵造反，與侄兒爭奪皇位。故大將“徐達有四子三女，三個女兒都做了太祖兒子的王妃：長女是燕王王妃，次女是代王王妃，三女是安王王妃。燕王造反，徐達的長子徐輝祖忠於建文帝，帶兵力抗燕軍。徐達的幼子徐增壽卻和妹夫燕王朱棣暗中勾結”。</p>"},{"title":"《笑傲江湖》故事編年（1509-1515）","content":"</a>\n<p class=\"sectionTitle\">《笑傲江湖》故事編年（1509-1515）</p>\n<p class=\"content\">【背景】公元15世紀初，明洪武帝朱元璋去世不久，永樂帝朱棣從侄兒建文帝手中奪得帝位。50年代，因瓦剌軍進犯中原而失去帝位的宣德帝，閒居八年後終於復辟成功。80年代的弘治帝恭仁儉樸，朝多君子。16世紀初，正德帝少年即位，好聲色犬馬，信用太監荒疏朝政，農民起義此起彼伏，明朝進入中衰。</p>\n<p class=\"content\">【概要】江湖主要門派：日月教與少林、武當、峨嵋和五嶽劍派為敵，其中五嶽劍派包括華山、嵩山、恆山、衡山、泰山五派，此外，青城派和福威鏢局也已經名重江湖。華山派弟子令狐沖行俠仗義，因師妹移情別戀而傷心欲絕。他目睹了師長們為了名利勾心鬥角的醜惡，自己在混濁江湖裡與清純的日月教公主任盈盈一見鍾情。</p>\n<p class=\"content\">【紀年】元朝末年，張無忌率領明教與正教諸派攜手抗元。明教後來改稱日月教，再度與正教諸派為敵，纏鬥不休達百餘年。長江三俠《笑傲江湖年代考》，考證故事主體發生在1500年稍後。故事開始時福威鏢局王夫人屬虎，年三十九，可知歲次蛇年，是1509年。《金庸散文集》記金庸答北大同學問，確認故事差不多發生在明朝正德至崇禎年間。兩年後（1511年）五嶽劍派合併，任我行去世。再過三年（1514年），令狐沖和任盈盈喜結連理。翌年（1515年）春天，令狐沖夫婦重遊華山，故事結束。</p>\n<p class=\"content\">1400年　明惠帝建文二年</p>\n<p class=\"content\">日月神教與正教諸派再度為仇。</p>\n<p class=\"content\">《笑傲江湖》第32、39回：日月神教的前身就是明教，數百年來與正教諸派勢不兩立。在張無忌擔任教主的時候，明教曾經和正教諸派一釋前嫌，攜手抗擊元朝統治。朱元璋建立明朝以後，明教為了避諱，改稱日月教。到了15世紀初葉，日月教再度與正教諸派為仇，纏鬥不休，互有勝敗。少林、武當、峨嵋諸派因派大勢眾，自然不懼。華山派、嵩山派、恆山派、衡山派、泰山派為了抵禦強敵，攜手結盟同氣連枝，成為五嶽劍派。五派互為支援，一派有難，四派齊至，饒是如此，此後的百餘年中也只能維持一個不勝不敗的局面。按（1511年）：“想我五嶽劍派向來同氣連枝，百餘年來攜手結盟，早便如同一家。”</p>\n<p class=\"content\">“五毒教”更名為“五仙教”。</p>\n<p class=\"content\">《笑傲江湖》第16回（1510年）：“其實百餘年前，這教派的真正名稱便叫作五毒教，創教教祖和教中重要人物，都是雲貴川湘一帶的苗人。後來有幾個漢人入了教，說起五毒二字不雅，這才改為五仙。這五仙教善於使瘴、使蠱、使毒，與百藥門南北相稱。五仙教中教眾苗人為多，使毒的心計不及百藥門，然而詭異古怪之處，卻尤為匪夷所思。”至16世紀初，五仙教從屬於日月神教。</p>\n<p class=\"content\">莆田少林寺紅葉方丈得《葵花寶典》。</p>\n<p class=\"content\">《笑傲江湖》第30回：《葵花寶典》是12世紀末南宋一位宦官所著。寶典中所載的武功精深至極，開篇便是“武林稱雄，揮劍自宮”，因此二百餘年來無一人能據書練成。至15世紀初，這部寶典為福建莆田少林寺的方丈紅葉禪師所得。紅葉禪師對寶典研究多年，因寶典所載武功太過陰損毒辣，始終沒有起始練習。按（1511年）：“三百餘年來，始終無一人能據書練成。……百餘年前，這部寶典為福建莆田少林寺下院所得。”</p>\n<p class=\"content\">編者按：紅葉禪師的弟子渡元，即後來創辦福威鏢局的林遠圖。自紅葉至林遠圖、至林仲雄、至林震南、至林平之，百餘年間共傳四代。林平之生於1490年，則九十年間傳了三代，以平均每代間隔三十年計，林遠圖大致出生在公元1400年，當時紅葉禪師約三十歲。紅葉禪師三十歲的時候得到《葵花寶典》，四十歲左右收少年林遠圖為徒。</p>\n<p class=\"content\">1402年　明惠帝建文四年</p>\n<p class=\"content\">六月，明朝燕王朱棣登基。</p>\n<p class=\"content\">《碧血劍》第10回：經過四年征戰，燕王兵臨城下，建文帝知道徐達幼子徐增壽勾連叛軍，揮劍斬殺。建文帝逃離南京前，內府重寶倉皇不及攜帶，令魏國公徐輝祖保管，以為他日重光宗廟社稷之資。燕王朱棣篡位，是為明成祖。徐輝祖對建文帝忠心耿耿，始終圖謀復辟，將重寶埋在後花園的一間柴房之下。徐輝祖得罪了成祖，他的子孫不敢再在大功坊的賜第居住，另行遷居。大功坊賜第數度易手，經過二百四十多年，後人再也不明這座舊宅的來歷，藏寶地圖卻落在“金蛇郎君”夏雪宜的手中，引出《碧血劍》的故事。按：“吾叔之叛，武臣無不降者。魏國公徐輝祖以功臣世勳，忠於社稷，殊可嘉也。內府重寶，倉皇不及攜，魏公為朕守之。他日重光宗廟社稷，以此為資。建文四年六月庚申御筆。”</p>\n<p class=\"content\">1430年　明宣宗宣德五年</p>\n<p class=\"content\">日月神教夜襲武當山，盜走一經一劍。</p>\n<p class=\"content\">《笑傲江湖》第40回（1511年）：“武當派創派之祖張三丰先師所用佩劍名叫真武劍，向來是武當派鎮山之寶，八十餘年前，日月教幾名高手長老夜襲武當山，將寶劍連同張三丰手書的一部《太極拳經》一併盜了去。當時一場惡鬥，武當派死了三名一等一的好手，雖然也殺了日月教四名長老，但一經一劍卻未能奪回。這是武當派的奇恥大辱，八十餘年來，每一代掌門臨終時留下遺訓，必定是奪還此經此劍。但黑木崖壁壘森嚴，武當派數度明奪暗盜，均無功而返，反而每次都是送了幾條性命在黑木崖上。”</p>\n<p class=\"content\">華山派弟子嶽肅、蔡子峰偷閱《葵花寶典》。</p>\n<p class=\"content\">《笑傲江湖》第30回：莆田少林寺收藏的《葵花寶典》，所載武學不但博大精深，兼且兇險至極，因此秘不示人。華山派嶽肅、蔡子峰師兄弟，到莆田少林寺作客，偷閱了寶典。兩人離寺後，少林寺方丈紅葉禪師察覺此事，當下派遣得意弟子渡元禪師前往華山，勸諭嶽蔡二位，不可修習寶典中的武學。按：按照林家每代三十年的估計，當時林遠圖約三十歲，紅葉禪師約六十歲。</p>\n<p class=\"content\">少林弟子林遠圖還俗，創立福威鏢局。</p>\n<p class=\"content\">《笑傲江湖》第30、35回：華山派弟子嶽肅、蔡子峰在莆田少林寺偷閱《葵花寶典》時，來不及遍閱全書，只得各記一半。回到華山共同參悟，竟然無法對攏。正好渡元禪師前來勸諭，便就寶典所載武學向其請教，殊不知渡元卻從未蒙師傳授。渡元禪師並不點明，反從嶽蔡二位那裡，得悉了寶典中的部分經文。渡元禪師離開華山，將殘缺不全的寶典經文記在袈裟之上，凡心難抑，決意還俗，再也沒有回莆田少林寺。渡元取名林遠圖，揮劍自宮，從《葵花寶典》殘本中悟出七十二路辟邪劍法，創辦了福威鏢局。為了掩蔽自宮習武的真相，林遠圖娶妻以後，領養一子，取名林仲雄。</p>\n<p class=\"content\">日月教奪取《葵花寶典》殘本。</p>\n<p class=\"content\">《笑傲江湖》第30回：華山派弟子偷閱《葵花寶典》一事，在武林中不脛而走。“過不多時，即有魔教十長老攻華山之舉。”“魔教十長老攻華山，便是想奪這部《葵花寶典》，其時華山派已與泰山、嵩山、恆山、衡山四派結成了五嶽劍派，其餘四派得訊便即來援。華山腳下一場大戰，魔教十長老多數身受重傷，鎩羽而去，但嶽肅、蔡子峰兩人均在這一役中斃命，而他二人所筆錄的《葵花寶典》殘本，也給魔教奪了去。”按：“算來那時候連你師父（岳不群）也還沒出世呢。”</p>\n<p class=\"content\">華山派始有劍宗、氣宗之爭。</p>\n<p class=\"content\">《笑傲江湖》第30回：“華山派嶽肅、蔡子峰二人錄到《葵花寶典》不久，便即為魔教十長老所殺，兩人都來不及修習，寶典又給魔教奪了去。因此華山派中沒人學到寶典中的絲毫武功。但兩人由於所見寶典經文不同，在武學上重氣、重劍的偏歧，卻已分別跟門人弟子詳細講論過，華山派後來分為氣劍兩宗，同門相殘，便種因於此。”嶽肅是華山派氣宗之祖，後世傳人有岳不群；蔡子峰是華山派劍宗之祖，後世傳人有風清揚、封不平等。</p>\n<p class=\"content\">1435年　明宣宗宣德十年</p>\n<p class=\"content\">日月教十長老被囚華山。</p>\n<p class=\"content\">《笑傲江湖》第30回：日月教上次進攻華山，雖然奪得《葵花寶典》，但十長老也多數身受重傷，“五年之後魔教捲土重來。這一次十長老有備而來，對五嶽劍派劍術中的精妙之著，都想好了破解之法。沖虛道兄與老衲推想，魔教十長老武功雖高，但要在短短五年之內，盡破五嶽劍派的精妙劍招，多半也還是由於從《葵花寶典》中得到了好處。二次決鬥，五嶽劍派著實吃了大虧，高手耆宿，死傷慘重，五派許多精妙劍法從此失傳湮沒。只是那魔教十長老卻也不得生離華山。想像那一場惡戰，定是慘烈非凡。”日月教十長老中了五嶽劍派的埋伏，被誘入山洞之中囚禁起來，無法從華山脫身。十長老中“大力神魔”範松、“飛天神魔”趙鶴、“金猴神魔”張乘風、“白猿神魔”張乘雲等，囚在山洞心懷不平，既在石壁上刻字痛罵五嶽派，又刻下破解五嶽劍派的法門，好使後人得知，他們並非戰敗，只是誤中機關而已。</p>\n<p class=\"content\">1450年　明代宗景泰元年</p>\n<p class=\"content\">五嶽劍派在武林崛起。</p>\n<p class=\"content\">《笑傲江湖》第30回：五嶽劍派在華山全殲日月教十長老後，在武林中聲名鵲起。當時少林派為武林領袖，數百年來眾所公認，少林之次便是武當，更其次是崑崙、峨嵋、崆峒諸派。五嶽劍派雖然興旺得快，家底總還不及崑崙、峨嵋，更不用說和少林派博大精深的七十二絕藝相比了。按（1511年）：“五嶽劍派在武林中崛起，不過是近六七十年的事。”</p>\n<p class=\"content\">1460年　明英宗天順四年</p>\n<p class=\"content\">福威鏢局林遠圖擊敗青城派長青子。</p>\n<p class=\"content\">《笑傲江湖》第3回：林遠圖還俗後，從《葵花寶典》殘本中悟出七十二路辟邪劍法。“當年林遠圖以七十二路辟邪劍法開創鏢局，當真是打遍黑道無敵手。其時白道上英雄見他太過威風，也有去找他比試武藝的，長青子便因此而在他辟邪劍法下輸了幾招”，引為畢生奇恥大辱。青城派小道士長青子和華山派掌門是好朋友，兩人拆解辟邪劍法鑽研數月，找不到破解的法門。當時華山派弟子岳不群還只是個十來歲的少年，在旁斟茶伺候，有幸目睹辟邪劍法的精妙招數。</p>\n<p class=\"content\">編者按：“那時我（岳不群）剛入師門，還只是個十來歲的少年。”岳不群后來出任華山派掌門，第5回（1509年），“塞北明駝”木高峰對他說：“你說不會採補功夫，誰也不信，怎地你快六十歲了，忽然返老還童，瞧起來倒像是駝子的孫兒一般。”說明岳不群生年在1450年左右，十來歲進入華山派學藝在1460年左右。第3回記“那時候林遠圖早已成名多年，是武林中眾所欽服的前輩英雄，長青子卻是個剛出道的小道士”。按照林家每代三十年的估計，今年林遠圖六十歲，其子林仲雄三十歲，其孫林震南剛出生。至1509年笑傲江湖故事主體展開時，林震南四十九歲，王夫人三十九歲，林平之十九歲，大致相合。</p>\n<p class=\"content\">1476年　明憲宗成化十二年</p>\n<p class=\"content\">福威鏢局林遠圖和青城派長青子先後去世。</p>\n<p class=\"content\">《笑傲江湖》第3回：青城派長青子敗在林遠圖劍下的時候，是個剛出道的小道士，年齡當在二十歲左右。長青子胸襟極狹，自視又高，比武敗北後，一直耿耿於懷，以此在三十六歲上便鬱鬱而終。弟子餘滄海接任青城派掌門。福威鏢局總鏢頭林遠圖比長青子早死，臨終留下遺訓：“袈裟上的《葵花寶典》殘本，是林家祖傳之物，須得好好保管。凡我子孫不得翻看，否則有無窮禍患。”</p>\n<p class=\"content\">編者按：“後來長青子在三十六歲上便即逝世。”岳不群認為，長青子“多半臨死時對餘滄海有什麼遺命。林遠圖比長青子先死，餘滄海要報師仇，只有去找林遠圖的兒子林仲雄”。餘滄海是青城派的繼任掌門，據第2回1508年所記，是“一個身穿青色道袍的矮小道人，約莫五十來歲年紀”，上推三十二年，餘滄海擔任掌門時約莫二十來歲。至於福威鏢局林家，按照三十年一代的估計，在長青子去世時，林遠圖已經去世，卒年不到七十六，其子林仲雄四十六歲，其孫林震南年方十六。看來餘滄海要報師仇，也只能去找林仲雄，岳不群所言不虛。</p>\n<p class=\"content\">1484年　明憲宗成化二十年（令狐沖2歲）</p>\n<p class=\"content\">華山派女俠甯中則拜師練劍。</p>\n<p class=\"content\">《笑傲江湖》第11回：甯中則初入華山派練劍時，還是個十三歲的小丫頭。當時華山派以劍宗為主，堂上的匾額是“劍氣凌霄”四個大字，之後不久便發生了劍宗、氣宗同門相殘的悲慘一幕，氣宗取得了華山派的主導地位，堂上的匾額也就改為“正氣堂”。</p>\n<p class=\"content\">編者按：“那時我（甯中則）還是個十三歲的小丫頭。”寧女俠後來成為華山派掌門岳不群的夫人，生有一女名嶽靈珊。嶽靈珊在1509年笑傲江湖故事主體展開時年方十八，證據一是第5回令狐沖說：“十五年前蒙恩師和師母收錄門下，那時小師妹還只三歲”，證據二是第8回令狐沖說：“直至今年她十八歲生日，師父才給了她（碧水劍）當生日禮物。”嶽靈珊生於1491年，當時寧女俠大致二十歲，說明寧女俠十三歲進入華山派，正值劍氣兩宗同門相殘之年。按照當時的婚育習俗，寧女俠進華山派即使早於今年，亦相去無多，福威鏢局林震南的夫人王氏，在二十歲時生子林平之，可為佐證。</p>\n<p class=\"content\">華山派劍宗氣宗之爭，岳不群出任華山派掌門。</p>\n<p class=\"content\">《笑傲江湖》第9回：華山派劍宗、氣宗之爭，源於三十年代嶽肅、蔡子峰對《葵花寶典》理解的分歧，至五十年代，已發展成相互對立的兩個宗派。劍宗功夫易於速成，見效極快，兩宗各練十年後，劍宗佔上風；各練二十年後，練氣宗功夫的才漸漸地越來越強；到得三十年時，練劍宗功夫的便再也不能望氣宗之項背了。然而劍宗弟子死硬到底，始終不肯服輸，雖然在玉女峰上大比劍時一敗塗地，卻大多數橫劍自盡，剩下未死的則悄然歸隱，再也不在武林中露面了。比劍之時，岳不群被本門師叔斬上一劍，昏暈在地。他只道岳不群已經死了，沒再加理會。岳不群死裡逃生，後來出任了華山派掌門。按第11回（1509年）：“二十五年前，劍宗一敗塗地，退出了華山一派，由為師執掌門戶，直至今日。”</p>\n<p class=\"content\">華山派劍宗高手風清揚退隱江湖。</p>\n<p class=\"content\">《笑傲江湖》第30回：風清揚是劍宗高手，論輩分是岳不群的師叔。華山兩宗火併之時，以風清揚劍法之精，倘若參與鬥劍，氣宗無論如何不能佔到上風。於是，華山氣宗託人在江南設置騙局，買了個妓女冒充小姐，讓風清揚去江南娶親加以羈絆。等到風清揚得悉兩宗火併之訊趕回華山，劍宗好手已然傷亡殆盡，一敗塗地。風清揚重回江南，他的假岳丈全家早已逃得不知去向。江湖傳言風清揚惱羞成怒，就此自刎而死，其實他是退出江湖，在華山思過崖，悉心揣摩石洞中日月教長老留下的五嶽劍術破解法門，發誓終生不再與人過招。</p>\n<p class=\"content\">嵩山派左冷禪取得五嶽劍派盟主之位。</p>\n<p class=\"content\">《笑傲江湖》第9回：五嶽劍派即華山派、嵩山派、恆山派、衡山派、泰山派。說到人才之盛，武功之高，原以華山派居首，只因華山派內爭激烈，玉女峰上大比劍，死了二十幾位前輩高手，劍宗固然大敗，氣宗的高手卻也損折不少，這才讓五嶽劍派的盟主之席給嵩山派左冷禪奪了去。</p>\n<p class=\"content\">1488年　明孝宗弘治元年（令狐沖6歲）</p>\n<p class=\"content\">日月教教主任我行修習“吸星大法”。</p>\n<p class=\"content\">《笑傲江湖》第22回：日月教教主是任我行，下設左右光明使、十大長老和十二堂正副香主。教主用“三尸腦神丹”控制教眾和從屬門派，丹內伏有屍蟲，平時並不發作，亦無異狀，但若到了每年端午節的午時不服剋制屍蟲的藥物，屍蟲便脫伏而出，進入大腦，使人行動如妖如鬼，痛苦不堪而死。當世毒物，無逾於此。日月教因此勢多人眾，令出如山。教主任我行還不滿足，開始修行能吸人內功的“吸星大法”。“吸星大法”創自北宋年間的逍遙派，分為“北冥神功”與“化功大法”兩路，分別從大理段氏和星宿派傳承至今。這項神功在江湖上大有聲名，正派中人聞之無不喪膽。按（1498年）：“其時我修習吸星大法已在十年以上。”</p>\n<p class=\"content\">1490年　明孝宗弘治三年（令狐沖8歲）</p>\n<p class=\"content\">福威鏢局的第四代傳人林平之出生。</p>\n<p class=\"content\">《笑傲江湖》第1回：福威鏢局的創始人林遠圖，早在1476年前就已經去世。第二代傳人林仲雄今年六十歲，第三代傳人林震南今年三十歲。林震南的武功不及乃父乃祖，然而經營鏢局的本事，卻可說是強爺勝祖。南方的福建、廣東，北方的浙江、江蘇，這四省的基業是林遠圖闖出來的；山東、河北、兩湖、江西和廣西六省的天下，卻是林震南手裡創的。林震南娶的夫人，是洛陽金刀門“無敵金刀”王元霸的小姐，今年二十歲，屬虎。王夫人婚後產下一子，取名平之。按（1509年）：“娘子，你今年三十九歲罷？……這匹大宛名駒，是林平之的外婆在洛陽重價覓來，兩年前他十七歲生日時送給他的。”</p>\n<p class=\"content\">1493年　明孝宗弘治六年（令狐沖11歲）</p>\n<p class=\"content\">恆山派弟子儀琳出生。</p>\n<p class=\"content\">《笑傲江湖》第12、37回：儀琳的父親原是個殺豬屠夫，母親是個尼姑。屠夫愛上了尼姑，尼姑不予理睬，屠夫就出家做了和尚，法名不戒。尼姑為他的真情所動，就嫁給和尚，生了一個可愛的女兒。女兒生下來才三個月，不戒和尚抱著女兒在門口曬太陽，與路過的美貌少婦搭話時發生誤會，尼姑以為他負心薄倖、好色無厭，憤而離去。不戒和尚抱著女兒四處尋找，訪遍了天下的尼姑庵。經過恆山白雲庵時，恆山派掌門定逸師太收養了女嬰。不戒和尚走遍大江南北，卻再無愛人的蹤影，原來尼姑在恆山懸空寺裝聾作啞，充了一名僕婦，人稱啞婆婆。那個女嬰長大後，出家為尼，法名儀琳。按（1509年）：“她還只十六七歲年紀，身形婀娜。”</p>\n<p class=\"content\">1494年　明孝宗弘治七年（令狐沖12歲）</p>\n<p class=\"content\">令狐沖成為華山派掌門岳不群的大弟子。</p>\n<p class=\"content\">《笑傲江湖》第5回：令狐沖是個無父無母的孤兒，是年蒙師父岳不群和師母甯中則收錄門下。那時小師妹嶽靈珊還只三歲，令狐沖比她大九歲，常常抱了她出去採野果、捉兔子。兩人是從小一塊兒長大的，岳不群夫婦沒兒子，待令狐沖猶似親生兒子一般。按（1509年）：“十五年前蒙恩師和師母收錄門下，那時小師妹還只三歲。”第24回：“記得師父說這個故事時，嶽靈珊還只八九歲，自己卻有十七八歲了。”</p>\n<p class=\"content\">華山派劍宗弟子封不平隱居練劍。</p>\n<p class=\"content\">《笑傲江湖》第12回：華山派劍宗、氣宗同門相殘一役，發生在十年前。劍宗倖存弟子封不平，隱居中條山潛心研究劍法。他胸懷大志，不但要執掌華山一派，還想進而成為五嶽劍派盟主，創制出一百零八式“狂風快劍”。按（1509年）：“這套狂風快劍，是封不平在中條山隱居十五年而創制出來的得意劍法。”</p>\n<p class=\"content\">1495年　明孝宗弘治八年（令狐沖13歲）</p>\n<p class=\"content\">日月教任我行大權旁落，東方不敗越俎代庖。</p>\n<p class=\"content\">《笑傲江湖》第22回：東方不敗本是日月教風雷堂副香主，近年來深得教主任我行的信賴，破格提拔為光明左使，包攬了教中一應大權。任我行正在潛心修習吸星大法，糾正大法中的若干缺陷，教中事務無暇顧及。東方不敗狼子野心，表面上對教主十分恭敬，教中事務安排得井井有條，暗中卻培植異己勢力，假諸般藉口，將所有忠於教主的部屬或是撤革，或是處死。是年，文長老被革出教，受嵩山、泰山、衡山三派高手圍攻而死。按（1496年）：“再先一年，文長老被革出教。”</p>\n<p class=\"content\">1496年　明孝宗弘治九年（令狐沖14歲）</p>\n<p class=\"content\">日月教丘長老客死甘肅。</p>\n<p class=\"content\">《笑傲江湖》第22回：教主任我行的親信丘長老不明不白地死在甘肅，數年之後想來，自然也是野心家東方不敗暗中安排的毒計。按（1497年）：“再早一年。”</p>\n<p class=\"content\">1497年　明孝宗弘治十年（令狐沖15歲）</p>\n<p class=\"content\">日月教郝賢弟被東方不敗處死。</p>\n<p class=\"content\">《笑傲江湖》第22回（1498年）：“早一年。”</p>\n<p class=\"content\">日月教教徒丹青生在西域得美酒十桶。</p>\n<p class=\"content\">《笑傲江湖》第19回：日月教中有黃鐘公、黑白子、禿筆翁、丹青生江南四友，武功卓絕又分別擅長琴、棋、書、畫。是年，丹青生在西域作客，把西域劍豪送與的吐魯番美酒，用五匹大宛馬馱到杭州。按（1510年夏）：“屈指算來，正是十二年半以前之事。”</p>\n<p class=\"content\">1498年　明孝宗弘治十一年（令狐沖16歲）</p>\n<p class=\"content\">日月教任我行將《葵花寶典》傳給東方不敗。</p>\n<p class=\"content\">《笑傲江湖》第22回：日月教教主任我行有一愛女，名盈盈，年方七歲，其聰明伶俐，心思之巧，實不輸於大人。是年端午大宴，盈盈在席上點點人數，忽然問：“爹爹，怎麼咱們每年端午節喝酒，一年總是少一個人？”眾人深感任教主的親信正在凋零殆盡。事後親信向問天數次進言，要教主提防，教主反而怪他心懷嫉妒。向問天一怒而去，高飛遠走，從此不再見面。任教主因向問天不辭而別大為惱怒，練功正在緊要關頭險些出了亂子。東方不敗趁機大獻殷勤，任教主瞧出他野心勃勃，意存跋扈，將計就計將《葵花寶典》傳給他，想要他在修習這門邪惡武功時自取滅亡。按：“就是東方不敗發難那一年，端午節晚上大宴，……那一年小姐是七歲罷。”</p>\n<p class=\"content\">日月教東方不敗篡奪教主之位，任我行被囚梅莊地牢。</p>\n<p class=\"content\">《笑傲江湖》第22、31回：端午大宴之後，東方不敗擔心自己用心被識破，又擔心教主會傳位於小姐，便冒險發難，將教主任我行囚禁於杭州梅莊，派“江南四友”嚴加看管。東方不敗取而代之接任日月教掌門，朱雀堂羅長老不服，被風雷堂長老童百熊所殺，從此無人敢有半句異言。東方不敗對任教主的女兒盈盈禮敬如昔，任教主失蹤的真相無人得知。任教主的親信向問天見教主離奇失蹤，東方不敗篡位，知道事出蹊蹺，只得隱忍。按（1510年）：“十二年之前，教主離奇失蹤。”</p>\n<p class=\"content\">日月教“江南四友”之一黑白子覬覦“吸星大法”。</p>\n<p class=\"content\">《笑傲江湖》第21回：“江南四友”黃鐘公、黑白子、禿筆翁、丹青子奉新教主東方不敗之命，在杭州梅莊看管囚犯任我行。老二黑白子知道任我行已經練成了“吸星大法”，要他答應傳授大法秘要，然後助他脫困。此後的十二年中，黑白子每隔兩個月便來地牢詢問一次，任我行總是拒不答允。按（1510年）：“十二年來，每年我都有六次冒險來到此處。”</p>\n<p class=\"content\">日月教“殺人名醫”平一指為老不死姑娘開出起死回生藥方。</p>\n<p class=\"content\">《笑傲江湖》第15回：江湖豪傑老爺字頭子、祖宗字千秋，合稱“江湖老祖”。老頭子有一女，名不死，年方五歲，在孃胎之中帶來一種怪病，久治不愈，去請“殺人名醫”平一指診療。平一指醫術精深，能起死回生，但有一規矩，治好一人，須得殺一人抵命。老頭子知其心意，將平一指生平最恨的岳母一家五口殺死，平一指為其女兒老不死開出“續命八丸”藥方。之後的十二年中，老頭子費了無數心血，採集千年人參等種種珍貴藥材，製成八顆起死回生的“續命八丸”。老頭子、祖千秋、平一指都是受日月教“三尸腦神丸”控制的江湖人物。按（1510年）：“那姑娘約莫十七八歲年紀，雙眼緊閉，睫毛甚長。”</p>\n<p class=\"content\">1499年　明孝宗弘治十二年（令狐沖17歲）</p>\n<p class=\"content\">華山派令狐沖和師妹嶽靈珊鬥蟋蟀。</p>\n<p class=\"content\">《笑傲江湖》第24回：那天，令狐沖和靈珊去捉蟋蟀來打架，令狐沖把最大最壯的蟋蟀讓給了她，偏偏還是她的輸了。她哭個不停，令狐沖哄了她很久，她才回嗔作喜，兩個人同去請師父岳不群講故事。岳不群在故事裡說有一種草，浸了酸液用來寫字，幹了後字跡便隱沒，但如浸溼了字跡卻又重現。按：“記得師父說這個故事時，嶽靈珊還只八九歲，自己卻有十七八歲了。”</p>\n<p class=\"content\">1506年　明武宗正德元年（令狐沖24歲）</p>\n<p class=\"content\">嵩山派弟子勞德諾進入華山派臥底。</p>\n<p class=\"content\">《笑傲江湖》第2回：嵩山派掌門人左冷禪是五嶽劍派盟主，他為了稱雄武林，著手描繪將五嶽劍派併成一派，進而與少林、武當等名門大派一爭高下的藍圖。左冷禪的三弟子勞德諾奉師命投奔華山，成為掌門人“君子劍”岳不群的第二弟子。華山派弟子的排列按照入門時間，不按照年齡，勞德諾入門比令狐沖晚了十二年，雖然年齡比令狐沖大許多，仍然尊令狐沖為大師哥。按：“弟子拜入華山派時，大師哥已在恩師門下十二年了。”</p>\n<p class=\"content\">華山派岳不群得浙江龍泉“碧水劍”。</p>\n<p class=\"content\">《笑傲江湖》第8回：岳不群在浙江龍泉得到“碧水劍”，是一口斷金削鐵的利器。女兒靈珊一見之下愛不釋手，連求數次，岳不群始終不給，直至三年之後她十八歲生日，才給了她當生日禮物。按（1509年）：“三年前從浙江龍泉得來。”</p>\n<p class=\"content\">福威鏢局林震南刻意巴結青城派餘滄海。</p>\n<p class=\"content\">《笑傲江湖》第1回：福威鏢局現任總鏢頭是林家的第三代傳人林震南，他的武功不及乃祖多矣，鏢局生意上卻是得鄂望蜀，著手向四川發展。林震南深知鏢車要去四川，非得跟青城、峨嵋兩派打上交道不可。他每年春秋兩季，總是備了厚禮，專程派人送去青城派、峨嵋派。可是這兩派的掌門人從來不收。去青城派的鏢車在半山就給擋了駕。半個世紀前青城派的長青子敗在林遠圖劍下，也許林遠圖覺得沒什麼，可長青子耿耿於壞，多半臨死時對弟子餘滄海有什麼遺命。餘滄海是青城派的現任掌門人。按（1509年）：“我打從三年前，每年春秋兩季，總是備了厚禮。”</p>\n<p class=\"content\">1507年　明武宗正德二年（令狐沖25歲）</p>\n<p class=\"content\">華山派岳不群夫婦向弟子們演示“玉女劍十九式”。</p>\n<p class=\"content\">《笑傲江湖》第8回：此時岳不群門下已有許多弟子，除了令狐沖、勞德諾外，還有梁發、施戴子、高根明、陸大有、陶鈞、英白羅和舒奇。當著眾弟子和女兒靈珊，岳不群連使各家各派的不同劍法進攻，寧女士始終以這“玉女劍十九式”招架，一十九式玉女劍，居然和十餘門劍法的數百招鬥了個旗鼓相當。當時眾弟子瞧得神馳目眩，大為驚歎。嶽靈珊便央著母親要學，寧女士以她年紀還小，功力不夠，待到二十歲時再學。按（1509年）：“這件事過去已近兩年，此後一直沒提起。”</p>\n<p class=\"content\">華山派令狐沖對小師妹愛惜有加。</p>\n<p class=\"content\">《笑傲江湖》第8回：令狐沖跟嶽靈珊一起乘涼，看到天上星光燦爛。靈珊想睡在露天看星星眨眼，令狐沖捉了幾千只螢火蟲，裝在十幾只紗囊之中，靈珊拿來掛在她帳子裡，說道滿床晶光閃爍，她像是睡在天上雲端裡，一睜眼，前後左右都是星星。按（1509年）：“前年夏天，我曾捉了幾千只螢火蟲兒。”</p>\n<p class=\"content\">日月教和五嶽劍派繼續爭鬥仇殺。</p>\n<p class=\"content\">《笑傲江湖》第8回：華山派弟子令狐沖在鄭州大路上遇到嵩山派的孫師叔，他雙手雙足齊被截斷，兩眼也給挖出，不住大叫：“魔教害我，定要報仇！”那時嵩山派已有人到來接應，但孫師叔傷得這麼重，如何又能再治？按（1509年）：“又想起兩年前在鄭州大路上遇到嵩山派的孫師叔。”</p>\n<p class=\"content\">1508年　明武宗正德三年（令狐沖26歲）</p>\n<p class=\"content\">十二月，華山派岳不群雪天論劍。</p>\n<p class=\"content\">《笑傲江湖》第8回：岳不群見大雪飛舞，興致甚高，聚集了一眾弟子講論劍法，最後施展了這招“無邊落木”出來，但見他一劍快似一劍，每一劍都閃中了半空中飄下來的一朵雪花，連夫人甯中則都鼓掌喝彩，說道：“師哥，這一招我可服你了，華山派確該由你做掌門人。”岳不群笑道：“執掌華山一派門戶，憑德不憑力。”按（1509年）：“記得去年臘月，師父見大雪飛舞。”</p>\n<p class=\"content\">華山派令狐沖在漢中痛打“青城四秀”。</p>\n<p class=\"content\">《笑傲江湖》第5回：青城派掌門人餘滄海今年五十歲，門下有眾多弟子，出名的有“英雄豪傑，青城四秀”，即侯人英、洪人雄、於人豪和羅人傑四位弟子。華山派大弟子令狐沖和六弟子陸大有，在漢中酒樓遇見“青城四秀”中的侯人英、洪人雄，令狐沖一腳將兩位踢下樓梯，取笑青城派的招數是“屁股向後平沙落雁式”。岳不群知道後，對弟子令狐沖重責三十棍，還派二弟子勞德諾去青城派賠禮道歉。勞德諾在青城山發現青城派弟子正在潛心修習福威鏢局林家的“辟邪劍法”。按（1509年）：“去年臘月裡，大師哥在漢中打了青城派的侯人英、洪人雄。”</p>\n<p class=\"content\">1509年　明武宗正德四年（令狐沖27歲）</p>\n<p class=\"content\">正月，華山派師兄妹元宵之樂融融。</p>\n<p class=\"content\">《笑傲江湖》第5回：元宵佳節，華山派師兄妹相聚飲酒，小師妹靈珊（18歲）出了個燈謎，說是：“左邊一隻小狗，右邊一個傻瓜”，打一個字。那時坐在她左邊的，是六師哥陸大有，坐在她右邊的是大師哥令狐沖。這個謎兒的謎底便是令狐沖的這個“狐”字。靈珊出這個謎兒，是取笑令狐沖和這位陸師兄的。</p>\n<p class=\"content\">編者按：日月教與五嶽劍派、青城派與福威鏢局的百年恩怨，演繹至今年，才是《笑傲江湖》故事主體的正式開始。關於《笑傲江湖》故事發生的年代，金學迷們多年來眾說紛紜。金庸先生自稱小說內容可以發生在任何朝代，但從小說中武林門派的沿革、人物言談舉止和風土人情，可以確定故事發生在明朝。《倚天屠龍記》記述武當派在元末的掌門人是張三丰的弟子，《鹿鼎記》有“前朝有位令狐沖大俠”等字樣，可以作為《笑傲江湖》故事發生在明朝的佐證。長江三俠的《笑傲江湖年代考》，經多方論證，確定《笑傲江湖》故事主體發生在1500年稍後，這個結論為大多數金學迷們所接受。故事開始時交代福威鏢局總鏢頭林震南的夫人王氏“今年三十九歲，屬虎”，說明故事展開之年是蛇年。公元1500年之後的第一個蛇年是1509年，因此本文確定《笑傲江湖》故事展開之年是1509年。作家出版社《金庸散文集》記有金庸答北大同學問。問：“《笑傲江湖》的時代背景是否明朝正德至崇禎年間？”答：“大致是明朝吧，沒有具體時代背景。因為我想這種權力鬥爭、奸詐狡猾，互相爭奪權位的事情，在每個朝代都會發生。如果有特定的時代背景，反而沒有普遍性了。這位同學估計是在明朝正德至崇禎年間，我想他很有歷史知識，大致差不多。”</p>\n<p class=\"content\">華山派弟子勞德諾、嶽靈珊奉命前往福州。</p>\n<p class=\"content\">《笑傲江湖》第1回：岳不群聽說青城派弟子正在潛心修習福威鏢局的“辟邪劍法”，知道五十年前兩派前輩的恩怨到了了斷的時候。他派二弟子勞德諾、女兒靈珊前往福州，化名薩老頭和宛兒祖孫倆，在福威鏢局附近開了一家酒店，以觀兩虎相鬥見機行事。岳不群內心也是覬覦林家的“辟邪劍譜”。</p>\n<p class=\"content\">三月，福威鏢局的滅門之禍。</p>\n<p class=\"content\">《笑傲江湖》第1、2回：福威鏢局林震南之子林平之，今年十九歲，在勞德諾開的酒店裡，與青城派弟子賈人達和餘滄海的小兒子餘人彥相遇。餘人彥調戲嶽靈珊，被血氣方剛的林平之失手打死。青城派弟子聚集福州，趁機發難，福威鏢局一門上下被青城派屠戮殆盡。總鏢頭林震南夫婦被青城派劫持，少鏢頭林平之隻身流浪江湖。按：“和風燻柳，花香醉人，正是南國春光爛漫季節。”</p>\n<p class=\"content\">四月，華山派令狐沖在衡陽城坐鬥田伯光。</p>\n<p class=\"content\">《笑傲江湖》第2-5回：五嶽劍派中衡山派二掌門要金盆洗手，各路豪傑應邀畢集衡陽城。當年不戒和尚和尼姑生的女兒儀琳，寄養在恆山白雲庵，已是恆山派中一個年方十六的美貌尼姑。儀琳在衡陽城外被淫賊“萬里獨行”田伯光劫走，正在危急時刻，華山派弟子令狐沖出手相救，保住了儀琳的清白。令狐沖明知自己的武功不如田伯光，故意約定兩人坐鬥，誰先站起身來，屁股離了椅子便算輸，施用機詐之計贏了田伯光。田伯光被迫拜小師太儀琳為師。青城派弟子羅人傑趁機偷襲令狐沖，將令狐沖刺成重傷，自己卻被垂危的令狐沖一劍刺死。儀琳以為令狐沖已死，將其屍首放在荷塘之旁。日月教護法長老曲洋和孫女曲非煙，將令狐沖救活後，藏在城裡一個妓院裡，躲過了青城派的圍剿。儀琳用恆山派的天香斷續膠和白雲熊膽丸為令狐沖療傷，春心萌動。按：“林平之一路乞食，……行得八九日後，已到了江西境內，……不一日來到湖南省會長沙。”</p>\n<p class=\"content\">華山派岳不群在衡陽城收林平之為徒。</p>\n<p class=\"content\">《笑傲江湖》第5回：福威鏢局少鏢頭林平之的身份暴露後，不懷好意的武林豪傑紛紛對他注目。青城派餘滄海想劫持他，以此逼迫林震南夫婦交出《辟邪劍譜》。“塞北明駝”木高峰和“君子劍”岳不群，為了《辟邪劍譜》都想收他為徒。林平之認為岳不群武藝高強且為人正派，便拜在華山派門下，一心學藝報仇。</p>\n<p class=\"content\">衡山派劉正風金盆洗手受阻。</p>\n<p class=\"content\">《笑傲江湖》第6-7回：衡山派是五嶽劍派之一，掌門人“瀟湘夜雨”莫大先生和二掌門劉正風一向不和。劉正風與日月教護法長老曲洋因琴簫相和成為知音，劉正風知道五嶽劍派與日月教不久便有一場大火拼，同門之誼和知音之交不能兩全，決定金盆洗手退出武林。五嶽劍派盟主左冷禪，派師弟費彬率領嵩山派高手包圍劉府，阻止劉正風舉行洗手儀式。劉正風全家被殺，劉正風和曲洋在嵩山派的追殺下，將《笑傲江湖曲譜》交託令狐沖去尋覓傳人，一對知音攜手自殺。</p>\n<p class=\"content\">福威鏢局林震南夫婦遇難。</p>\n<p class=\"content\">《笑傲江湖》第7回：青城派餘滄海和“塞北明駝”木高峰，勒索《辟邪劍譜》而不得，惱羞成怒殺害了林震南夫婦。林震南臨終，將祖父林遠圖的袈裟藏在福州向陽巷老宅地窖中的秘密以及林遠圖“凡我子孫，不得翻看，否則有無窮禍患”的遺訓，請令狐沖轉告林平之。</p>\n<p class=\"content\">五月，華山派令狐沖被罰思過崖面壁一年。</p>\n<p class=\"content\">《笑傲江湖》第7回：華山派向有門規：首戒欺師滅祖，不敬尊長；二戒恃強欺弱，擅傷無辜；三戒姦淫好色，調戲婦女；四戒同門嫉妒，自相殘殺；五戒見利忘義，偷竊財物；六戒驕傲自大，得罪同道；七戒濫交匪類，勾結妖邪。掌門人岳不群以令狐沖此次下山，犯六、七兩戒，大損華山派聲譽，罰其在玉女峰絕頂的思過崖面壁一年。</p>\n<p class=\"content\">八月，華山派嶽靈珊夜宿思過崖。</p>\n<p class=\"content\">《笑傲江湖》第8回：令狐沖在思過崖面壁思過，小師妹嶽靈珊每天上崖送飯。“如此過了兩個多月，華山頂上一日冷似一日。”有一天靈珊上山之後不曾及時下山，與令狐沖夜宿山洞，告訴令狐沖，她正在教師弟林平之練劍：“這小子不中用得很，一套入門劍法練了三個月，還是沒半點樣子。”</p>\n<p class=\"content\">九月，華山派嶽靈珊與師弟林平之漸生情愫。</p>\n<p class=\"content\">《笑傲江湖》第8回：靈珊上次夜宿山洞，受了風寒，下山後發燒不退，“到得她又再上崖，卻是二十餘日之後了”，已是九月初。令狐沖脫口而稱“好妹子”，靈珊喜悅無限。“過了二十餘日，嶽靈珊提了籃粽子上崖”，當是九月底。靈珊告訴令狐沖，師弟小林子日夜練功，“我拉他陪我玩兒，他總是不肯爽爽快快地陪我”。令狐沖悵然若失。</p>\n<p class=\"content\">十月，華山派令狐沖偶見日月教十長老留下的破解五嶽劍法的招式。</p>\n<p class=\"content\">《笑傲江湖》第8回：“這次她過了十餘日才又上崖，酒飯之外又有一隻小小竹籃，盛著半籃松子、栗子。”時在十月中旬，令狐沖得知靈珊已得師母寧女俠傳授“玉女劍十九式”，並每天由林平之喂招練習。令狐沖心中煩躁，試招之中，將岳不群作為生日禮物送給靈珊的“碧水劍”震落山谷。靈珊含淚而去，再也沒有上山。“直過了十八日，她才和陸大有一同上崖”，已是十月底。陸大有眼見靈珊移情別戀，神色之中很是憤慨。令狐沖聽到靈珊下山時歡快地唱著林平之教她的福建山歌，心中如受重錘猛擊。當晚，令狐沖無意間進入三十年代囚禁日月教十長老的山洞，目睹了當年十長老刻在石壁上痛罵五嶽劍派的文字和破解五嶽劍法的招式，內心大受震撼。靈珊誤以為令狐沖指使陸大有在父母面前告狀，割絕下崖。令狐沖頹然病倒。</p>\n<p class=\"content\">十一月，華山派岳不群夫婦上思過崖看望令狐沖。</p>\n<p class=\"content\">《笑傲江湖》第9回：令狐沖“這場病直生了一個多月，這才漸漸痊可。這一個多月中，嶽靈珊曾來探視了三次。”時光已至十一月底。岳不群夫婦從關外回山，即到思過崖看望令狐沖，發現他這幾個月內功非但沒長進，反而後退了，責成他用功修習，半個月後再來考校。</p>\n<p class=\"content\">十二月，華山派岳不群回首二十五年前的劍宗、氣宗之爭。</p>\n<p class=\"content\">《笑傲江湖》第9回：“半個月晃眼即過，這日午後，岳不群夫婦又連袂上崖”，時在十二月中旬。岳不群本來是來傳授令狐沖紫霞功的入門口訣，準備師徒聯手，剿滅在長安連續作案的“萬里獨行”田伯光，卻發現令狐沖的武功走上了華山派劍宗的邪路。岳不群向眾弟子講述二十五年前華山派的劍宗、氣宗之爭，告誡令狐沖棄邪歸正，不要成為本門罪人。</p>\n<p class=\"content\">華山派前輩風清揚幫助令狐沖擊敗田伯光。</p>\n<p class=\"content\">《笑傲江湖》第9、10回：淫賊田伯光在開封府一富戶家作案時，被不戒和尚制服。不戒和尚是恆山派儀琳的父親，眼看女兒為相思令狐沖日漸憔悴，不戒和尚威逼田伯光一個月內將令狐沖請到恆山。田伯光來到華山思過崖，依恃劍術之高欲劫持令狐沖。令狐沖在華山派前輩風清揚的指點下，揣摩運用石壁上的五嶽劍法和破解招數，制服了田伯光。風清揚是華山派劍宗弟子，二十五年前在華山同門相殘後隱居不出，對現任掌門岳不群頗不以為然，但十分器重令狐沖的人品資質，將生平絕學“獨孤九劍”悉心傳授於他。</p>\n<p class=\"content\">華山派劍宗弟子威逼岳不群退位。</p>\n<p class=\"content\">《笑傲江湖》第10、11回：華山派劍宗弟子封不平、成不憂等人，十五年臥薪嚐膽，此時奉了五嶽劍派盟主左冷禪的令旗，前來華山威逼岳不群退出掌門之位，以報當年劍宗慘敗之仇。令狐沖聞訊，衝下思過崖赴師門之難，為成不憂掌擊重傷。“桃谷六仙”奉不戒禪師之命，來請令狐沖去恆山，見此情景，生生將成不憂扯成四塊。按第12回：“岳不群道，田伯光來到華山，已有幾日？令狐沖道，約莫有半個月。”說明時值十二月底。</p>\n<p class=\"content\">1510年　明武宗正德五年（令狐沖28歲）</p>\n<p class=\"content\">正月，華山派令狐沖在韋林鎮退敵救師。</p>\n<p class=\"content\">《笑傲江湖》第12回：岳不群為避強敵，率眾弟子去嵩山找盟主左冷禪論理。二弟子勞德諾本是嵩山派臥底，趁亂殺死六師弟陸大有，盜走華山派內功典籍《紫霞秘笈》。岳不群一行至韋林鎮，在一座破廟裡遭到緝訪《辟邪劍譜》的十五名左道高手圍攻，封不平領著嵩山派高手也來糾纏不休，岳不群夫婦命懸一線。情急之下，令狐沖施展出獨孤九劍，擊退封不平等人，刺瞎十五名左道高手的眼睛，使華山派化險為夷。令狐沖的劍術來歷不明，因此遭到師父岳不群的猜忌。按：“嶽夫人道，今年春雷響得好早，只怕年成不好。”</p>\n<p class=\"content\">華山派令狐沖在洛陽結識日月教“聖姑”任盈盈。</p>\n<p class=\"content\">《笑傲江湖》第12、13回：岳不群率領華山派一行改奔洛陽，拜訪“金刀無敵”王元霸。王元霸是福威鏢局林震南的岳父，林平之的外公，生有兩子，王伯奮和王仲強。令狐沖懷有劉正風、曲洋臨終交託的《笑傲江湖曲譜》，因深奧難懂，被王家父子疑為林家祖傳的《辟邪劍譜》。令狐沖百口難辯，乃求證於精於音律的洛陽隱士綠竹翁。綠竹翁和姑姑琴簫相諧，證實確係曲譜。綠姑同情令狐沖的遭遇，授以《清心普善咒》助其療傷。原來這綠姑便是日月教“聖姑”任盈盈，原教主任我行之女，今年十九歲。東方不敗囚禁任我行篡奪教主之位後，為了掩人耳目，對盈盈禮遇有加。令狐沖只聞其聲未謀其面，以為綠姑是一位德高年尊的婆婆。</p>\n<p class=\"content\">二月，五霸岡群豪聚會。</p>\n<p class=\"content\">《笑傲江湖》第13-17回：岳不群領著華山派一行離開洛陽，令狐沖失戀遭嫉之餘，對綠竹翁和綠姑的眷顧依戀不捨。將到開封，江湖上左道門派接踵而至，對令狐沖禮敬不已，饋贈奇珍秘藥助其療傷。“黃河老祖”中的祖千秋，把老頭子為女兒採集十二年制成的“續命八丸”，偷來給令狐沖服用。雲南五仙教教主藍鳳凰贈飲五仙大補藥酒，還將自身之血注入令狐沖體內。天河幫幫主黃伯流請來江湖上洞主、島主上千人聚會五霸岡，擄來名醫為令狐沖會診。“殺人名醫”平一指因迴天無術，愁悶而死。原來這些左道之士，都是受日月教“三尸腦神丹”控制的江湖成名人物，他們聽說聖姑任盈盈青睞令狐沖，紛紛前來巴結，卻對華山派掌門人岳不群不屑一顧。後來群豪聽說聖姑因心事外露而惱怒，隨即一鬨而散，岳不群亦因猜忌日深終於棄之而去。令狐沖循著琴聲來到綠姑隱身的草舍，阻止欲騷擾綠姑的少林派辛國樑之流，再受重創。令狐沖負著綠姑落荒而走，及澗水倒映其面，始知綠姑非年邁婆婆，而是一個妙齡少女。兩情相悅，令狐沖卻不知道她就是令江湖上聞風喪膽的日月教聖姑。按：“如此一連二十餘日，令狐沖一早便到小巷竹舍中來學琴。”</p>\n<p class=\"content\">五月，華山派岳不群將令狐沖逐出門牆。</p>\n<p class=\"content\">《笑傲江湖》第18回：一日，令狐沖傷重昏厥，盈盈將其送入少林寺，自為人質，求方證方丈用“易筋經”救其性命。三個月之後，令狐沖醒來，寧可傷重不治，也不肯背棄師門改投少林寺為徒。方證方丈出示岳不群手書，內雲因令狐沖結交妖孽，已被逐出本派門戶，武林正派諸友人人可得而誅之。令狐沖萬念俱灰，慘然離開少林寺。按：“原來我昏迷不醒已有三個多月，我還道只是二十多天的事。”</p>\n<p class=\"content\">華山派令狐沖結識日月教光明左使向問天，身陷囹圄。</p>\n<p class=\"content\">《笑傲江湖》第18-20回：向問天是日月教前任教主任我行的親信，十二年來千方百計，終於探知任教主被囚在杭州梅莊，便即前往助其脫困，途中遭到正教豪傑的圍剿，和東方不敗派來教中高手的追殺。令狐沖拔劍相助，和向問天結成生死之交。向問天領著令狐沖來到杭州梅莊，拜謁看押任我行的“江南四友”，投其所好，以琴棋書畫珍品誘“江南四友”與令狐沖比劍賭勝。“江南四友”不敵，但為珍品所惑，引令狐沖到地牢與任我行比劍。任我行以李代桃僵之法，將令狐沖囚在地牢，自己逃之夭夭。向問天的一套連環計安排得天衣無縫，令狐沖卻蒙在鼓中。其時已是五月下旬。</p>\n<p class=\"content\">六月，華山派令狐沖在地牢裡修習“吸星大法”。</p>\n<p class=\"content\">《笑傲江湖》第21回：十二年來任我行被囚在地牢，以為再難生還，擔心一身通天徹地神功與枯骨同朽，便將“吸星大法”秘訣刻在地牢的鐵床上。令狐沖無意中摸到秘訣，照之修習，體中內傷漸漸地爽然若失。按：“黑獄中日夜不分，自不知又被囚了多少日子，只覺得過一天便熱一天，想來已到盛夏。”</p>\n<p class=\"content\">七月初一，日月教“江南四友”之一黑白子私會“任我行”。</p>\n<p class=\"content\">《笑傲江湖》第21回：黑白子覬覦“吸星大法”，十二年中每隔兩個月便來地牢一次，要求任我行傳授大法秘訣。黑白子不知現在囚在地牢裡的是令狐沖，依舊前來求懇，令狐沖決定將計就計，趁機脫困。按：“話聲入耳，令狐沖便認出是黑白子，倘若此人在一個多月以前到來，令狐沖定然破口大罵。……今日七月初一，我問的還是這一句話，老先生到底答不答允？”</p>\n<p class=\"content\">八月十四，日月教任我行重現江湖。</p>\n<p class=\"content\">《笑傲江湖》第22回：任我行在向問天幫助下，從地牢脫身回到江湖，對教中背叛他投靠東方不敗的屬下毫不留情。薛香主一身金鐘罩、鐵布衫的橫練功夫，尋常刀劍也砍他不入，可是給任我行五指插入胸膛，將一顆心硬生生地挖了出來。日月教在本月十四得到訊息，派長老鮑大楚、秦偉邦前往杭州核實查處。按：“咱們是上月十四得到的訊息……到今日是第十七天。”</p>\n<p class=\"content\">九月，華山派令狐沖利用黑白子逃出地牢。</p>\n<p class=\"content\">《笑傲江湖》第22回：令狐沖自七月初與黑白子見面後，將束縛自己的鐵圈除去，刻在鐵床上的大法秘訣也被刮掉。“如此又過了一個月有餘，他雖在地底，亦覺得炎暑之威漸減。”他趁黑白子來送酒菜的機會，依樣畫葫蘆施用“李代桃僵”之計，將黑白子囚在地牢，自己穿著黑白子的衣服奪門而出。“江南四友”中其餘三人以為逃走的是二莊主黑白子。</p>\n<p class=\"content\">編者按：黑白子兩月一次的例行探視是在七月初一，三日之約是在七月初四。令狐沖逃出地牢在之後一個多月，倘是八月，當是初五以後。原著說“上月十四得到的訊息……到今日是第十七天”，顯然是提示令狐沖逃出地牢是在初一，至多初二，即不可能在八月。本文將其繫於九月，正與“炎暑之威漸減”相合。大約是黑白子每逢單月初一，便去地牢詢問任我行。原著說“過去數月被囚於地牢”，至少應有三月之數，令狐沖自五月下旬身陷囹圄，至九月初逸出，正是三月有餘。</p>\n<p class=\"content\">日月教任我行威逼令狐沖入教不遂。</p>\n<p class=\"content\">《笑傲江湖》第22回：任我行在光明左使向問天陪同下再訪梅莊，正遇到日月教長老鮑大楚、秦偉邦等人在此查辦要犯逃逸一案。任我行以“三尸腦神丸”迫使這些當年舊部就範，抗拒者格殺勿論。“江南四友”之首黃鐘公飲刀自盡，長老秦偉邦不屈而死。任我行因令狐沖是“吸星大法”的唯一傳人，威逼他加入日月教，令狐沖威武不能屈，富貴不能移，斷然拒絕，揚長而去。</p>\n<p class=\"content\">十月，華山派令狐沖搭救恆山派諸師太。</p>\n<p class=\"content\">《笑傲江湖》第23回：五嶽劍派盟主左冷禪假傳訊息，說魔教大舉入閩，企圖劫奪林家的《辟邪劍譜》。恆山派定靜率領諸師太入閩，在浙閩交界的仙霞嶺遭遇埋伏，令狐沖喬裝成福建泉州府參將吳天德，拔劍相助，擊退冒充日月教的嵩山派高手。嵩山派鍾鎮乘人之危，要定靜師太贊同五嶽劍派合併的陰謀，受到定靜的譴責，定靜師太力戰而亡，令狐沖在二十八鋪救出諸師太，奉定靜遺命，護送她們至福建無相庵安頓。按：“一路向南，到金華府、處州府後，南方口音已和中州大異，甚難聽懂。”</p>\n<p class=\"content\">福威鏢局《辟邪劍譜》被盜。</p>\n<p class=\"content\">《笑傲江湖》第24回：所謂《辟邪劍譜》，即當年林遠圖寫在袈裟上的《葵花寶典》殘本，武林各派皆欲得之而甘心。岳不群領著華山派抵達福州，林平之和嶽靈珊到福威鏢局尋找劍譜，遭到嵩山派“白頭仙翁”卜沉和“禿鷹”沙天江的偷襲。卜、沙二位翻出袈裟，被在旁邊觀察良久的令狐沖趕上殺死。令狐沖昏倒在地，袈裟復為岳不群盜走。岳不群冤枉令狐沖偷走袈裟刺傷林平之，幾欲置之死地而後快，令狐沖幸得師母寧女俠庇佑方得逃生。岳不群早知二弟子勞德諾是嵩山派臥底，故意偽造一假劍譜，讓其盜走。勞德諾身份暴露，徑往嵩山將假劍譜獻給左冷禪。</p>\n<p class=\"content\">十一月，華山派令狐沖率領群豪去少林寺救任盈盈。</p>\n<p class=\"content\">《笑傲江湖》第25回：定閒、定逸師太在浙江鑄劍谷受到冒充日月教的嵩山派圍攻，飛鴿傳書告急，令狐沖率領群尼馳援鑄劍谷。救出兩位師太后，嵩山派左冷禪吞併五嶽劍派的野心已暴露無遺。令狐沖護送恆山派返回北嶽，舟至夏口，遇見衡山派掌門莫大先生，方知日月教聖姑任盈盈為了救治令狐沖，自二月以來，作為人質一直被囚禁在少林寺後山山洞之中。江湖左道門派前去救助者不計其數，都是有去無回。令狐沖如夢初醒，為報盈盈的再生之恩，發誓要救盈盈出寺。沿路左道門派紛紛來奔，推舉令狐沖做了盟主。恆山派定閒、定逸師太自告奮勇，日夜兼程前往少林寺，向方證大師請求釋放盈盈。按：“今日已是十一月下旬，他們下月十五要去少林寺，為時已然無多。”</p>\n<p class=\"content\">十二月，正教和日月教在少林寺比武賭勝。</p>\n<p class=\"content\">《笑傲江湖》第26至28回：經恆山派定閒、定逸求情，少林寺方證釋放任盈盈。嵩山派左冷禪卻又將她們分頭截住，殺害定閒、定逸，扣押盈盈。日月教原教主任我行和向問天救出盈盈，又被正教諸派團團圍困。令狐沖率領左道門派趕到少林寺，定逸已死，定閒奄奄待斃，臨終遺命要令狐沖繼掌恆山派門戶。令狐沖安排左道門派從地道突圍後，隻身重返寺中要救盈盈，正遇上正教諸派圍攻任我行、向問天和盈盈三人。少林寺方證方丈為了江湖寧靜，要求任我行等三人在少林寺居留十年，任我行當然不肯。武當派沖虛道長提出比武以決三人去留，雙方贊同其議，正教由方證、沖虛和左冷禪出手，三場兩勝以決輸贏。第一場任我行使詐計先勝方證，接著中了左冷禪的暗算，輸了第二場。第三場任我行要令狐沖與沖虛比劍，沖虛自認不敵。方證方丈要按諾言放任我行等下山，岳不群突然提出要與令狐沖較量。令狐沖不忍與師父對陣，只守不攻，岳不群明知不敵卻糾纏不休。令狐沖救盈盈心切，不慎誤傷岳不群。令狐沖隨任我行出寺下山，任我行再次威逼利誘，要他加入日月教，令狐沖總是不肯。按第29回：“這一日午間在一家酒樓中喝酒，眼見街上人來人往，甚是忙碌，家家戶戶正在預備過年，一片喜氣洋洋。”</p>\n<p class=\"content\">1511年　明武宗正德六年（令狐沖29歲）</p>\n<p class=\"content\">正月，華山派令狐沖接任恆山派掌門。</p>\n<p class=\"content\">《笑傲江湖》第29回：令狐沖遵從定閒師太的遺囑，前往恆山出任掌門，定於二月十六黃道吉日舉行慶賀典禮，令狐沖派遣弟子分赴少林寺迎回兩位師太的骨灰，向各門派分送慶典通知。</p>\n<p class=\"content\">二月，不戒和尚、田伯光等人投奔恆山。</p>\n<p class=\"content\">《笑傲江湖》第29回：不戒和尚是恆山派儀琳小師太的父親，他知道令狐沖是女兒的心上人，眼見他一個大男人做一群女尼的掌門人，難免別人背後譏笑，便代女兒收田伯光為徒，師祖孫兩人一起投奔恆山。江湖上左道人士祖千秋、老頭子、藍鳳凰等人，奉聖姑任盈盈之命，相繼投奔恆山。按（二月十六）：“半個月前，太師父又找到了我。”</p>\n<p class=\"content\">十六，恆山派掌門令狐沖的就職典禮。</p>\n<p class=\"content\">《笑傲江湖》第29、30回：二月十六的就職典禮如期進行，盈盈唯恐令狐沖貽笑江湖，親率江湖群豪加入恆山門下，少林寺方證方丈、武當山沖虛道長推崇令狐沖的為人，亦來祝賀，並共同計議抵制嵩山派左冷禪稱霸武林的陰謀。日月教教主東方不敗派遣部下偷襲恆山懸空寺，盈盈出手，制服了日月教眾高手，令狐沖化險為夷。按：“二月十六日清晨，令狐沖起床後出來，只見見性峰上每一座屋子前懸燈結彩，佈置得一片喜氣。”</p>\n<p class=\"content\">華山派嶽靈珊和林平之拜堂成親。</p>\n<p class=\"content\">《笑傲江湖》第35回：去年十月，岳不群竊得袈裟上的《辟邪劍譜》後，當即自宮練劍。回到華山，林平之每晚去岳不群臥室之側偷聽。岳不群竊取袈裟、自宮練劍的可恥行為被夫人覺察，受到嚴厲譴責。岳不群將袈裟拋下窗外懸崖，被林平之勾住。林平之隨即情不自禁地自宮練劍，要報家門之仇。岳不群夫婦哪裡知道這個未來的女婿已經自宮，仍在今年二月舉辦了他和靈珊的婚禮。按第32回（三月十五）：“嶽夫人又悲又喜，說道，你小師妹和你林師弟，上個月在華山已成了親。”</p>\n<p class=\"content\">日月教任我行殺東方不敗，重登教主之位。</p>\n<p class=\"content\">《笑傲江湖》第30、31回：東方不敗自十三年前篡奪教主之位以後，按照《葵花寶典》的指引，自宮練劍。他排斥異己，信用奸佞，大搞個人崇拜，弄得教內天怒人怨。近年信任男寵楊蓮亭，自己躲入閨房密室繡花取樂，一應教務，連長老的生殺予奪都聽憑楊蓮亭處置，已經是眾叛親離。原教主任我行、光明左使向問天會同令狐沖、任盈盈闖入日月教總壇黑木崖，揭穿楊蓮亭的奸佞伎倆，在密室殺死正在繡花的東方不敗。任我行重登教主之位，繼承了東方不敗窮奢極欲、威福自用的衣缽，令狐沖大為不滿，不辭而別。</p>\n<p class=\"content\">三月十五，華山派岳不群奪取五嶽劍派盟主之位。</p>\n<p class=\"content\">《笑傲江湖》第32-34回：五嶽劍派盟主左冷禪經過多年策劃，定於三月十五在嵩山封禪臺舉行五派合併儀式。華山岳不群、衡山莫大先生、泰山天門道人、恆山令狐沖分別率門下弟子準時出席，少林寺方證、武當山沖虛前來觀禮道賀，日月教任盈盈喬裝改扮後混入嵩山大會，以傳音之術唆使“桃谷六仙”攪亂會場。左冷禪挑動泰山派內訌，掌門天門道人被已經投靠左冷禪的三位師叔誅除。左冷禪以莫大先生殺死嵩山派高手費彬一事相要挾，迫使衡山派對並派一事不置可否。令狐沖以為岳不群會堅決反對並派，願以其馬首是瞻，不料岳不群心存野心，同意並派。於是並派之議得以通過，各方議定比劍以定掌門。岳不群使女兒嶽靈珊出場，分別以諸派劍法擊敗泰山派天門的師叔玉璣子、玉罄子和衡山派掌門莫大先生。令狐沖見正在蜜月期的師妹悶悶不樂，便登場以當年師兄妹獨創的“衝靈劍法”與之對舞，竟至於自傷。岳不群突然發難，向左冷禪施出辟邪劍法。左冷禪針鋒相對，卻不知自己通過勞德諾得到的劍譜是岳不群故意設下的陷阱，終於雙目被岳不群刺瞎。岳不群奪得五嶽劍派掌門之位，左冷禪滿懷勝算，到頭來卻是為人作嫁。令狐沖終於認清了師父的真面目，與盈盈經此生死患難，已成知心情侶。按：“等到三月十五正日，令狐沖率同眾弟子，一早動身上山。”</p>\n<p class=\"content\">華山派林平之殺嶽靈珊，投奔嵩山左冷禪。</p>\n<p class=\"content\">《笑傲江湖》第35-36回：林平之自宮以後，終於練成祖傳“辟邪劍法”。離開嵩山，林平之追殺青城派餘滄海和眾弟子，手刃“塞北明駝”木高峰，報了父母之仇。但林平之的雙目被木高峰駝背之中的毒水噴瞎，他對岳不群以女兒為誘餌，攫取辟邪劍譜又嫁禍令狐沖的卑鄙行為深惡痛絕，繼而遷怒嶽靈珊。適逢嵩山派左冷禪派三弟子勞德諾來招降林平之，平之為表忠心，竟然喪心病狂地將新婚妻子殺死。可憐靈珊新婚一月，只有夫妻之名，沒有夫妻之實，到頭來命喪愛人之手。她臨終拜託令狐沖，要他盡力照顧林平之。按：“其時三月天時，北方冰雪初消，哪裡用得著扇子？”</p>\n<p class=\"content\">四月，華山派掌門夫人甯中則自殺。</p>\n<p class=\"content\">《笑傲江湖》第36回：日月教派出數名長老擒獲華山玉女甯中則，以此誘殺掌門人岳不群。岳不群聽說令狐沖已經盡知他自宮練劍的秘密，執意要殺人滅口。師徒惡鬥，令狐沖出劍制住師父卻忍手不殺，岳不群以怨報德忽施毒手，將令狐沖刺成重傷。甯中則目睹丈夫的卑鄙行徑，羞愧自殺。岳不群被盈盈強迫服下“三尸腦神丹”，魂不附體。按：“令狐沖養了二十餘日，傷勢已痊癒了八九。……此後十餘日中，兩人耳鬢廝磨，合奏琴簫，……其時已是初夏，幽谷中蟬聲此起彼和。”</p>\n<p class=\"content\">八月，不戒和尚夫婦逼迫令狐沖娶儀琳為妻。</p>\n<p class=\"content\">《笑傲江湖》第37、38回：恆山派弟子儀琳今年十八歲，其父母就是不戒和尚和懸空寺的啞婆婆。啞婆婆十八年前因誤會離家出走，這幾年又洞悉了女兒心儀令狐沖的秘密，便設法將令狐沖囚禁起來，迫使他娶儀琳為妻。令狐沖非常喜歡儀琳小師妹，但此心已許任盈盈，對啞婆婆的命令萬難應承。不戒和尚十八年來為尋愛妻，踏遍了天涯海角，在令狐沖和任盈盈的幫助下，終於夫妻團聚。按第39回：田伯光道，“這大半年來，弟子一直隨著太師父。直到十天之前，這才分手，好容易今日又在華山相聚。”不戒和尚再遇田伯光，並代儀琳收徒，是在今年二月。大半年後，至早是八月。</p>\n<p class=\"content\">五嶽劍派在華山思過崖慘遭聚殲。</p>\n<p class=\"content\">《笑傲江湖》第38、39回：岳不群在奪取五嶽劍派掌門人的座位後，唯恐其他四派高手與之相爭，便設下一條毒計，遍邀五嶽劍派的高手，到華山思過崖觀摩石壁劍招。岳不群採用七十年前五嶽劍派對付日月教長老的辦法，將洞口用巨石封住，企圖盡誅各派高手。嵩山派左冷禪糾集一批與令狐沖有仇的瞎子，在石洞中追殺令狐沖，兇險迭出，最後反被令狐沖所殺。令狐沖沿著當年日月教長老“大力神魔”開鑿的秘道走出石洞，正與岳不群狹路相逢。恆山派儀琳刺死岳不群，報了殺師之仇。</p>\n<p class=\"content\">日月教任我行命喪華山朝陽峰。</p>\n<p class=\"content\">《笑傲江湖》第39、40回：日月教教主任我行得悉五嶽劍派自相殘殺，感到機會難得，便率領數千教眾和左道門派包圍華山朝陽峰，要盡滅五嶽劍派。待聽說岳不群、左冷禪等五嶽高手已死於內訌，意興蕭索之際，任我行以女兒盈盈和“副教主”職務相許，要令狐沖歸順日月教，令狐沖斷然拒絕。任我行怒極，發誓一個月內踏平恆山見性峰。令狐沖下山以後，任我行因心力交瘁一命嗚呼。日月教光明左使向問天與長老會商，一致推舉聖姑任盈盈接任教主。</p>\n<p class=\"content\">九月，恆山派令狐沖和日月教任盈盈重聚在恆山見性峰。</p>\n<p class=\"content\">《笑傲江湖》第40回：令狐沖不知日月教任我行已然去世，在恆山厲兵秣馬，準備與魔教決一死戰。少林寺方證、武當山沖虛親來恆山，共商拒敵大計，沖虛道長的師弟和師侄製作了一張能引發二萬斤炸藥的寶椅，方證方丈傳授令狐沖“易筋經”內功心法。一個月後，日月教人馬如期而來，教主卻是盈盈。盈盈教主贈給少林寺方證一部手抄梵文《金剛經》，贈給武當山沖虛的，乃是八十多年前武當派失竊的祖師張三丰的“真武劍”和《太極拳經》，贈給恆山令狐沖的，除了衣履用品，還有當年盈盈與令狐沖相識的媒介，綠竹翁的古琴和盈盈的玉簫。兩人約定，待盈盈三年滿服後成親。武林群豪感慨不已，江湖暫歸平靜。按：“屈指計算，離任我行朝陽峰之會已將近一月，此人言出必踐，定不誤期。”</p>\n<p class=\"content\">1514年　明武宗正德九年（令狐沖32歲）</p>\n<p class=\"content\">十二月，恆山派令狐沖和日月教任盈盈在西湖孤山梅莊結為連理。</p>\n<p class=\"content\">《笑傲江湖》第40回：盈盈待父喪三年滿服後，辭去日月教教主之位，交由向問天接任。令狐沖將恆山掌門之位交給儀清接掌。令狐沖和盈盈在西湖孤山梅莊拜堂成親，正邪二教從此化干戈為玉帛，數年來江湖上倒也太平無事。任盈盈今年二十三歲。按：“三年後某日，杭州西湖孤山梅莊掛燈結綵。”</p>\n<p class=\"content\">1515年　明武宗正德十年（令狐沖33歲）</p>\n<p class=\"content\">四月，令狐沖、任盈盈新婚燕爾重遊華山。</p>\n<p class=\"content\">《笑傲江湖》第40回：令狐沖已將林平之安置在杭州梅莊的地牢裡，衣食不愁，兌現了當年對師妹嶽靈珊作出的“照顧平弟一生”的承諾。任盈盈將嵩山派勞德諾與兩隻大馬猴鎖在一起，放在華山之上。一對武林伉儷在新婚第二年的春天，共赴華山拜見太師叔風清揚，要叩謝他傳劍授功之德。可是兩人踏遍華山五峰三嶺，各處幽谷，始終沒發現風清揚的蹤跡。按：“四個月後，正是草長花濃的暮春季節。”</p>"},{"title":"《俠客行》故事編年（1557-1564）","content":"</a>\n<p class=\"sectionTitle\">《俠客行》故事編年（1557-1564）</p>\n<p class=\"content\">【背景】公元16世紀20年代，明正德帝卒，嘉靖帝即位。嘉靖帝是弘治帝的親侄兒，為稱呼弘治為父還是伯父之爭，綿延數年。40年代，宮婢楊金英造反，嘉靖帝差點被勒死。奸臣嚴嵩兩度入閣為宰，第二次執政達十四年。嘉靖帝沉湎道士方術，大權旁落。60年代，嘉靖帝恨天下不治，令嚴嵩致仕。之後不久嘉靖帝病逝。</p>\n<p class=\"content\">【概要】江湖主要門派，除了少林、武當等數百年老派，還有雪山派、俠客島、長樂幫等新興幫會。上清觀石清之子石中堅，從小被母親的情敵抱去撫養，十三歲時偶得玄鐵令的主人傳授武藝，十九歲時因面貌酷肖其兄，被長樂幫強為幫主石破天。石破天仗義接受俠客島的臘八粥邀請，在島上參悟出不世武功。</p>\n<p class=\"content\">【紀年】庚申年聶家拳在滄州、濟南作惡，幾年後故事結束時閏二月。枚舉與庚申相隔不足十年的閏二月年份是1382、1564、1621和1803年，用排除法可以確定故事結束之時為1564年。故事開始於七年之前，在1557年。第一次臘八之約與最後一次相距三十年，在1533年。</p>\n<p class=\"content\">1521年　明武宗正德十六年（白自在30歲）</p>\n<p class=\"content\">雪山派掌門人白自在娶妻生子。</p>\n<p class=\"content\">《俠客行》第18回：西域凌霄城雪山派開創於約1390年，一百三十年後的掌門人是威德先生白自在。當時武林中有位姑娘名叫史小翠，貌美如花，武林中青年子弟對之傾心者大有人在，白自在和丁不四尤為其中的傑出人物。白自在三十歲當上雪山派掌門，向來傲慢自大，史小翠本來對他不喜，但她父母看中了白自在的名望武功，將他許配了這個雪山派掌門人。成婚之初，史小翠常和丈夫拌嘴，一拌嘴便埋怨自己的父母，說當年若是嫁了丁不四，也不致受這無窮的苦惱。白自在空自暴跳，卻無可奈何。好在兩人成婚之後，不久便生了兒子白萬劍。史小翠養育愛子，一步不出凌霄城，數十年不和丁不四見上一面。白自在縱然心中喝醋，卻也不疑有他。按第6回（1563年）：“雪山派九人走進廳來，都穿著白色長衫，當先一人（白萬劍）身材甚高，四十二三歲年紀，一臉英悍之色。”</p>\n<p class=\"content\">編者按：金庸沒有明確交代《俠客行》故事發生的年代，幾十年來金庸迷們眾說紛紜。筆者從原著出發，考據如下：1.故事發生在元代以後。《倚天屠龍記》中武當派的第一代掌門人是張三丰，第二代掌門人是張三丰的弟子，當時已是元末明初。《俠客行》中武當派掌門人是愚茶道長，因此可以確定故事發生在元代以後。2.故事發生在《笑傲江湖》之後。《笑傲江湖》裡說日月神教和五嶽派百年來紛爭不斷，而《俠客行》裡對此毫無反應，說明《俠客行》如果早於《笑傲江湖》，就應至少早出百年以上。《俠客行》第7回白萬劍說：“本派的內功秘訣，老實說未必有特別的過人之處，比之少林、武當、峨嵋、崑崙諸派，雖說各有所長，畢竟雪山一派創派的年月尚短，可能還不足以與已有數百年積累的諸大派相較。”白萬劍提到的四大派，其中少林寺是達摩祖師一葦渡江後開創的，史載於527年；武當派是張三丰離開少林十幾年後開創的，大約在1276年；峨嵋派是郭襄四十歲時開創的，大約在1282年；華山派的開創時間不詳，《倚天屠龍記》第21回，華山派掌門鮮于通說：“這路鷹蛇生死搏，乃華山派已傳之百年的絕技”，當時是1356年，說明華山派開創的時間不會晚於1256年。白萬劍說話時，雪山派已開創一百七十餘年，“年月尚短”，諸大派的開創時間“數百年”至少應是二三百年。以四大派中開創最晚的峨嵋來考察，白萬劍說話時已經過了1500年。3.故事結束之年是1564年。《俠客行》第19回提到一個具體的干支“庚申”，第21回說故事結束之年“閏二月”，據此兩個非常重要的線索，再考證明清兩代所有與之相關的年份：</p>\n<p class=\"content\">1380庚申：1382、1439閏二月；</p>\n<p class=\"content\">1440庚申：1458閏二月；</p>\n<p class=\"content\">1500庚申：1534閏二月；</p>\n<p class=\"content\">1560庚申：1564、1572、1583、1602閏二月；</p>\n<p class=\"content\">1620庚申：1621、1651、1670閏二月；</p>\n<p class=\"content\">1680庚申：無閏二月；</p>\n<p class=\"content\">1740庚申：1765、1795閏二月；</p>\n<p class=\"content\">1800庚申：1803、1814閏二月；</p>\n<p class=\"content\">1860庚申：1890、1909閏二月。</p>\n<p class=\"content\">原著敘述河北通州聶家拳在庚申年作惡，俠客島殺其滿門。白自在說：“姓白的倘若早得幾年見了這本賬簿，俠客島就是對他留情，姓白的也要殺他全家。”我們知道，俠客島是每隔十年開展一次“賞善罰惡”活動，白自在說“早得幾年”，而不是“早得十幾年”或“早得幾十年”，說明聶家拳作惡是幾年內的事情。在上述閏二月年份中剔除與庚申年相距十年以上的年份，得出故事結束之年可能是1382、1564、1621和1803年。其中1382年與雪山派建城開派“一百七十餘年”相牴觸；1621年因為聶家拳作惡之年與俠客島賞善罰惡之年重疊，不符合白自在“早得幾年”的說法；1803年因為三十年前少林寺掌門妙諦方丈的排輩，與《飛狐外傳》中少林寺排輩不合。由此可以斷定聶家拳作惡是在1560庚申年，俠客島賞善罰惡是在1563年，故事結束是在閏二月的1564年。雪山派建城開派應該在1393年之前，比四大門派中開創較晚的峨嵋晚了一百一十年左右。</p>\n<p class=\"content\">1523年　明世宗嘉靖二年（白自在32歲）</p>\n<p class=\"content\">龍島主、木島主聯手闖蕩江湖。</p>\n<p class=\"content\">《俠客行》第19回：龍、木二位在少年之時兄弟訂交，意氣相投，本想聯手江湖，在武林中賞善罰惡，好好做一番事業。不意甫出江湖，便發現了一張地圖，得悉圖中所繪的無名荒島上，藏有一份驚天動地的武功秘訣。這無名小島就是後來名揚天下的俠客島，武功秘訣就是唐代詩人李白的古風《俠客行》及其圖解，含義極是深奧繁複。龍、木二位大喜之下，便即按圖解修習。練習多時，兩人對圖解所示武功產生歧見，爭執不休，疑難不解。龍島主和木島主各收徒弟，讓他們去研習圖解，結果各人見地卻又紛紜不同。按（1563年）：“四十年前，我和木兄弟訂交，意氣相投。”</p>\n<p class=\"content\">1524年　明世宗嘉靖三年（白自在33歲）</p>\n<p class=\"content\">六合丁不四的女兒梅芳姑出生。</p>\n<p class=\"content\">《俠客行》第19、20回：六合丁氏三兄弟武藝高強，為人行事卻十分乖張。老二丁不三號稱“一日不過三”，一日之中最多隻殺三人。老三丁不四苦戀史小翠，小翠卻嫁給雪山派掌門白自在。丁不四沮喪之餘，愛上了女俠梅文馨，兩人生了一個女兒，便是梅芳姑。丁不四心中忘不掉史小翠，中途將梅文馨遺棄。芳姑隨母練習梅花拳。按（1563年）：“什麼約莫四十歲？是三十九歲。”</p>\n<p class=\"content\">1533年　明世宗嘉靖十二年（白自在42歲）</p>\n<p class=\"content\">俠客島第一次臘八之約。</p>\n<p class=\"content\">《俠客行》第13、19回：俠客島的龍島主、木島主參研不透島上的古詩圖解，親自請來少林寺妙諦大師和武當山愚茶道長。誰知兩位當今武林的頂尖人物，因對圖解所見不合大起爭執。龍島主、木島主均覺得這圖解博大精深，若要通解全圖，非集思廣益不可。恰好其時島上的“斷腸蝕骨腐心草”開花，此草配以其他佐使之藥，熬成熱粥，於練武之人大有補益。於是兩位島主派出張三、李四兩位賞善罰惡使者，邀請當世名門大派的掌門人及身懷異能絕技的名家大豪，來島上喝臘八粥，參研圖解。對有惡行劣跡的幫派，毫不容情地予以誅滅。是年應邀去俠客島的有三十七人，被誅滅的有一十四人，其中包括涼州崆峒派旭山道長、渝州巴旺鏢局刁老鏢頭、五臺山善本長老和崑崙派苦柏道長。中原武林見兩位手持銅牌的少年使者武功驚世駭俗，應邀前去俠客島的各派掌門又一去不復返，便認定俠客島是一股武林邪惡勢力，心中又恨又怕。按（1563年）：“三十年之前，武林中許多大門派、大幫會的首腦，忽然先後接到請柬，邀他們於十二月初八那日，到南海的俠客島去喝臘八粥。”</p>\n<p class=\"content\">1542年　明世宗嘉靖二十一年（白自在51歲）</p>\n<p class=\"content\">玄素莊石清拒絕了梅芳姑的愛情。</p>\n<p class=\"content\">《俠客行》第19、21回：石清、閔柔是上清觀同門師兄妹，學藝時互生情愫。丁不四和梅文馨的女兒梅芳姑，自幼隨母學藝，十八歲上也愛上了石清。石清明明白白地跟她說：“在這世上，我石清心中便只閔柔一人。我石清一生一世，從未有過第二個女人。你心中倘若對我好，我雖感激，但那也只是害了我。”梅芳姑因愛成恨，伺機報復。按：“梅芳姑自幼隨母學藝，十八歲上……”第21回（1564年）：“這話在二十二年前我曾跟你說過，今日仍是這麼幾句話。”</p>\n<p class=\"content\">冬，玄素莊石清長子石中玉出生。</p>\n<p class=\"content\">《俠客行》第2、7回：石清和師妹閔柔在上清觀學藝時互生情愫，合使劍法心心相印。其後結縭生下石中玉，共棲江南玄素莊，“黑白雙劍”聞名江湖。劍法心意相通，有若一人，武林中更無另外兩人能與之相比。按第2回（1557年）：“中玉還只一十五歲。”第7回（1563年）：“其後結縭二十餘載。”</p>\n<p class=\"content\">1543年　明世宗嘉靖二十二年（白自在52歲）</p>\n<p class=\"content\">俠客島第二次臘八之約。</p>\n<p class=\"content\">《俠客行》第13回：俠客島的“斷腸蝕骨腐心草”，每隔十年開一次花，因此，令武林聞之喪膽的臘八粥也是十年邀約一次。這次，張三、李四兩位賞善罰惡使者的武功已然大進，十餘天之內，便有三個門派、兩個大幫數百人遭到誅滅。峨嵋派三位長老出面，邀集三十餘名高手，埋伏在紅槍會總舵。黑龍幫沙幫主表面上接下銅牌，暗裡卻通知紅槍會，企圖圍剿兩位使者。結果三十餘名高手反被兩位使者一網打盡。這樣一來，誰也不敢再思抗拒，接到銅牌，即應邀前往俠客島。是年共有四十八人去俠客島，都是一去無蹤。按：“不料過得十年，這兩塊銅牌請柬又再出現。”</p>\n<p class=\"content\">六合丁不四以為女兒梅芳姑去了俠客島。</p>\n<p class=\"content\">《俠客行》第19回（1563年）：“那麼在下向龍島主打聽一個人。有一個女子，名叫這個芳姑，聽說二十年前來到了俠客島上，此人可曾健在？”</p>\n<p class=\"content\">1544年　明世宗嘉靖二十三年（白自在53歲）</p>\n<p class=\"content\">春，梅花拳梅芳姑盜走石清次子石中堅。</p>\n<p class=\"content\">《俠客行》第13、21回：石清長子石中玉剛滿週歲，次子石中堅還沒滿月，梅芳姑闖到江南玄素莊報復石清夫婦。芳姑將金錢鏢打在中玉的小屁股上，逃走時將中堅搶去。第三天芳姑送來一具臉上血肉模糊的童屍，穿著中堅的衣服，心窩中插了兩柄黑白短劍。石清夫婦悲痛欲絕，到處尋訪芳姑，要為愛子報仇。其實，梅芳姑並沒有殺害石中堅，而是帶著他隱居於豫西盧氏縣與陝東商州之間的熊耳山之枯草嶺。芳姑為中堅取名“狗雜種”，從不告訴他的身世。按第1回（1557年）：“那是個十二三歲的小丐……自從堅兒死後，這十三年來你給我買的首飾。”</p>\n<p class=\"content\">1553年　明世宗嘉靖三十二年（石破天9歲）</p>\n<p class=\"content\">俠客島第三次臘八之約。</p>\n<p class=\"content\">《俠客行》第13回：第二次臘八之約又過了十年，江西無極門首先接到俠客島的銅牌請柬。早在一年之前，各大門派首腦已經商議定當，大夥決意到俠客島上去瞧個究竟，齊心合力除去這武林公敵。是年銅牌所到之處，未傷及人命，共有五十三人應邀前往俠客島，其中有山東八仙劍的掌門溫仁厚。按：“又過十年，江西無極門首先接到銅牌請柬。”</p>\n<p class=\"content\">1554年　明世宗嘉靖三十三年（石破天10歲）</p>\n<p class=\"content\">江湖俠客吳道通得到謝煙客的玄鐵令。</p>\n<p class=\"content\">《俠客行》第1回：“摩天居士”謝煙客是當世江湖大俠，三十歲上遇到一件大失意之事，隱居摩天崖。謝煙客共有三枚玄鐵令，分贈三位當年於他有恩的朋友，說道只須持此令來，親手交在他手中，便可請他做一件事，不論如何艱難兇險，他必定能夠做到，所謂江湖上人人心往的“玄鐵之令，有求必應”。這三枚玄鐵令，有兩枚已歸還謝煙客手中，武林中因此發生了兩件驚天動地的大事。手持第三枚玄鐵令的朋友，武功高強，沒什麼難辦之事，令牌於他無用。這位朋友沒子女，逝世之後令牌不知去向。幾年來，大家都在拼命找尋，想以此叫謝煙客幫助幹一件大事。此枚玄鐵令後來被江湖俠客吳道通得到，他扮作個賣餅老人，在汴梁城外侯監集隱居，設法面見玄鐵令的主人謝煙客。按（1557年）：“他（吳道通）扮作個賣餅老人，在侯監集隱居。一住三載，倒也平安無事，但設法想見那物的原主（謝煙客），卻也始終找尋不到。”</p>\n<p class=\"content\">玄素莊石清送長子石中玉（12歲）至雪山派拜師學藝。</p>\n<p class=\"content\">《俠客行》第18回：江南玄素莊莊主石清生有兩子，長曰石中玉，次曰石中堅。妻子閔柔對中玉本就寵愛，自從中堅被梅芳姑搶走，閔柔對中玉更是千依百順。石清見中玉小小年紀，頑劣異常，礙著妻子在眼前，實在難以管教，便硬著心腸送他上凌霄城，拜雪山派“風火神龍”封萬里為師。封萬里是雪山派掌門人白自在的弟子。按第2回（1557年）：“小兒到了貴派之後，三年來我未見過他一面。”</p>\n<p class=\"content\">長樂幫在江湖上崛起。</p>\n<p class=\"content\">《俠客行》第13回：長樂幫是新近創立的江湖幫派，幫主“快馬”司徒橫，本是遼東的馬賊頭兒。副手“著手成春”貝海石，久病成醫，內力精湛，是年，“冀中三煞”為他一晚之間於三地擊斃，成為武林中人人悚然動容的大事。長樂幫總舵下設內三堂外五堂，分立香主統率各路幫眾。按第4回（1563年）：“九年之前，冀中三煞被他一晚間於相隔二百里的三地分別擊斃，成為武林中一提起來便人人悚然動容的大事。”第13回（1563年）：“長樂幫是近年來江湖上崛起的一個大幫，八九年間闖下了好大的萬兒。”</p>\n<p class=\"content\">1556年　明世宗嘉靖三十五年（石破天12歲）</p>\n<p class=\"content\">石清長子石中玉（14歲）與祖師叔廖自礪動手較量。</p>\n<p class=\"content\">《俠客行》第6回：雪山派掌門人“威德先生”白自在，有四個師弟成自學、齊自勉、廖自礪和梁自進。白自在的弟子“風火神龍”封萬里，兩年前收玄素莊石清長子石中玉為徒。石中玉本性頑劣，在雪山派學藝依然是膽大妄為，竟然和祖師叔廖自礪動手較量。廖自礪為了教訓於他，曾在他左腿上刺了六劍，每一劍都呈雪花六角之形。按（1563年）：“七年之前，敝派有個不成器的弟子。”</p>\n<p class=\"content\">十二月初十，石清長子石中玉懼罪逃出凌霄城。</p>\n<p class=\"content\">《俠客行》第2回：雪山派掌門人白自在的兒子叫白萬劍，雅號“氣寒西北”，與封萬里合稱“雪山雙傑”。白萬劍的女兒阿繡，是白家的掌上明珠。是月初十，石中玉竟將阿繡綁住手足，剝得一絲不掛，想要強姦。事情敗露後，石中玉砍傷兩個丫環，懼罪逃出凌霄城。阿繡羞辱難當，第三天跳下萬丈深谷。白自在暴跳如雷，遷怒石中玉的師父封萬里，將其右臂砍去。白自在的妻子史小翠與丈夫爭執，提到關於丁不四的陳年舊事，白自在動手打了小翠一個巴掌，小翠大怒，一氣衝出凌霄城。白萬劍的妻子氣得發了瘋。白萬劍率領幫中子弟，四處緝拿石中玉。按：“十二月初十。”</p>\n<p class=\"content\">1557年　明世宗嘉靖三十六年（石破天13歲）</p>\n<p class=\"content\">三月，石清次子石中堅離開梅芳姑，流浪江湖。</p>\n<p class=\"content\">《俠客行》第3回：江南玄素莊石清的次子石中堅，出生尚未滿月，就被梅芳姑擄走。中堅不知自己的身世，只知道自己名叫“狗雜種”，以為芳姑就是自己的母親。母子倆在熊耳山枯草嶺相依為命，從不下山。“狗雜種”從小除了媽媽，再沒見過第二個人。那天媽媽不見了，“狗雜種”找媽媽時從山上掉了下來，一個人四處流浪，找不到回家的路。按：“前幾天媽媽不見了。”</p>\n<p class=\"content\">侯監集的玄鐵令之爭。</p>\n<p class=\"content\">《俠客行》第1至3回：吳道通得到“摩天居士”謝煙客的玄鐵令，在侯監集上隱居賣燒餅的消息，終於在江湖中不脛而走。金刀寨寨主安奉日派出的高手捷足先登，江南玄素莊石清夫婦也聞訊趕到，雪山派在中原追捕石中玉的弟子正好路過此地。吳道通被金刀寨高手殺死，玄鐵令卻不知所終。原來，吳道通臨死，將玄鐵令藏在燒餅裡面，讓正在集市上乞討的小丐石中堅無意得去。群豪不可開交之際，玄鐵令的主人謝煙客趕到。謝煙客擔心小乞丐被別人挾持利用，便帶著石中堅來到摩天崖。石清夫婦聞說兒子石中玉在凌霄城雪山派的所作所為，又愧又痛，黯然離去。謝煙客希望小乞丐能開口求他辦一件事，卻不能如願。按：“今日三月十二，白師哥離凌霄城已有三月。”</p>\n<p class=\"content\">長樂幫殺死大悲老人。</p>\n<p class=\"content\">《俠客行》第3回：長樂幫的勢力越來越大，卻懼怕俠客島十年一期的“賞善罰惡令”。奉幫主之命，香主米橫野逼迫白鯨島島主大悲老人加盟長樂幫，共同對付俠客島。大悲老人視長樂幫為邪惡幫派，寧死不從。小丐石中堅隨謝煙客路過此地，挺身相護。大悲老人臨終，將一套畫有圖譜的泥制玩偶送給石中堅。</p>\n<p class=\"content\">石清次子石中堅在摩天崖修習內功。</p>\n<p class=\"content\">《俠客行》第3回：謝煙客將小丐石中堅帶上摩天崖，既想信守當年關於玄鐵令的誓言，又擔心這小丐為他人所利用，便在授其內功時，故意錯亂水火互濟、陰陽相配的原理，企圖致其走火入魔而死。誰知石中堅心無雜念，不受情慾侵擾，過得大半年，已練得內息能循“足少陰腎經”經脈而行；過得一年有餘，居然練成了“陽蹺脈”。</p>\n<p class=\"content\">1560年　明世宗嘉靖三十九年（石破天16歲）</p>\n<p class=\"content\">三月初三，石清長子石中玉（18歲）出任長樂幫幫主。</p>\n<p class=\"content\">《俠客行》第15回：石中玉逃出雪山派，流浪江湖三年多，化名石破天，投奔長樂幫，要幫主司徒橫提攜，在江湖上創名立萬。過不多久，長樂幫按慣例於三月初三全幫大聚，幫中何香主提到再過三年，便是俠客島邀宴銅牌重現之時，應早作打算。司徒幫主不願面對這一難題，殺害了何香主。石破天侃侃陳詞，勸幫主到時候慷慨赴難，換取全幫上下的平安。司徒幫主惱羞成怒，欲殺石破天反為其所敗，黯然離去。長樂幫眾位高手奉石破天為幫主，意在讓他做三年之後俠客島臘八之宴的替死鬼。按（1563年）：“三年以前，幫主奉了師父之命……例於三月初三全幫大聚。”</p>\n<p class=\"content\">五月初二，河北通州聶家拳在滄州作惡。</p>\n<p class=\"content\">《俠客行》第19回：河北通州聶家拳是江湖上的俠義幫派，背地裡卻幹著勾結官府，欺壓良善，威逼強買，傷天害理的勾當。掌門人聶老拳師聶立人，兩個兒子叫聶宗臺、聶宗泰，在江湖上頗有英俠之名，暗中竟是無惡不作。據俠客島賞善罰惡帳簿記載：“庚申五月初二，聶宗臺在滄州郝家莊姦殺二命，留書嫁禍於黑虎寨盜賊。”</p>\n<p class=\"content\">十月十七，河北通州聶家拳在濟南作惡。</p>\n<p class=\"content\">《俠客行》第19回：據俠客島賞善罰惡帳簿記載：“庚申十月十七，聶宗泰在濟南府以小過擊傷劉文質之長子，當晚殺劉家滿門一十三人滅口。”</p>\n<p class=\"content\">1563年　明世宗嘉靖四十二年（石破天19歲）</p>\n<p class=\"content\">二月，石清長子、長樂幫幫主石中玉（21歲）失蹤。</p>\n<p class=\"content\">《俠客行》第4回：石破天本是江南玄素莊石清的長子石中玉，被長樂幫奉為幫主後，劣性不改，到處惹草招花。他勾搭上丁不三的孫女丁璫，霸佔了屬下豹捷堂香主展飛的妻子，還對丫環侍劍動手動腳。幫中大小事務，卻是唯軍師貝海石之命是從。石破天不想當這個傀儡幫主，從幫中逃到揚州，在妓院裡逍遙快活。按（八月）：“幫主失蹤了半年，到處尋覓他不到。”</p>\n<p class=\"content\">八月，長樂幫將石清次子石中堅作為幫主接回幫中。</p>\n<p class=\"content\">《俠客行》第3、4回：長樂幫幫主石破天失蹤後，幫中高手四出尋找。江南玄素莊石清的次子石中堅，六年前在侯監集被謝煙客擄往摩天崖，現已長成十九歲的青年，面貌酷似其兄石中玉。石中堅正寒熱大作，昏迷不醒，長樂幫高手以為他就是失蹤的幫主石破天，軍師貝海石雖覺察有異，但為應付冬天的俠客島臘八之宴，只好將錯就錯，將其接回幫中。石中堅莫名其妙，成了長樂幫幫主石破天。時在八月中旬。按：“那少年這時已有十八九歲，身材粗壯。……關東四大門派約定重陽節來本幫總舵拜山，時日已頗迫促。”</p>\n<p class=\"content\">長樂幫石破天釋放雪山派弟子花萬紫。</p>\n<p class=\"content\">《俠客行》第5回：石中堅在長樂幫總舵昏睡七天後醒來，反覆聲明自己不是幫主石破天，眾人哪裡肯信。又過了三天，雪山派弟子緝捕石中玉擅闖長樂幫被擒，花萬紫也認定眼前的幫主石破天就是從雪山派逃走的石中玉。石破天心地厚道，釋放了花萬紫，時在八月下旬。按：“此刻相距侯監集之會已歷六年……其時中秋已過，八月下旬的天氣，頗有涼意。”</p>\n<p class=\"content\">長樂幫石破天與丁璫拜堂成親。</p>\n<p class=\"content\">《俠客行》第6-9回：丁璫是丁不三的孫女，與原來的石破天幫主情投意合。丁璫誤以為現在的石破天幫主就是原來的天哥，在爺爺丁不三的撮合下，與其拜堂成親。雪山派白萬劍來長樂幫尋仇，劫走石破天。玄素莊石清夫婦救子不遂，石破天被丁不三奪去。石破天未能在約定的十天內打敗白萬劍，差一點被丁不三殺掉，幸虧丁璫將其從刀下救出，此時已到了八月底。按：“八月天時，還這麼熱。”</p>\n<p class=\"content\">雪山派史小翠不肯去碧螺島。</p>\n<p class=\"content\">《俠客行》第9回：雪山派掌門白自在的妻子史小翠，七年前賭氣走出凌霄城，帶著跳崖未死的孫女阿繡闖蕩江湖。是日練功走火正在調息，不想石破天自天而降，摔在阿繡的被窩裡。史小翠少女時代的崇拜者丁不四路過此處，趁機要挾小翠去他的碧螺島，以了卻幾十年來的心願。史小翠堅持不肯，帶著阿繡、石破天去了紫煙島。</p>\n<p class=\"content\">九月，長樂幫石破天與俠客島賞善罰惡使者結為兄弟。</p>\n<p class=\"content\">《俠客行》第10-12回：史小翠在紫煙島上心血來潮，建立金烏派，收石破天為開門弟子，取名史億刀。雪山派弟子在紫煙島上大戰丁氏兄弟，石破天救白萬劍脫險。十年一度的俠客島臘八之約如期而至，賞善罰惡使者張三、李四懲處飛魚幫和鐵叉會，與石破天相識，三人結為兄弟。河北通州聶家拳滿門被殺，大約也在此時。按：“這時江上秋風甚勁。”</p>\n<p class=\"content\">上清觀爭奪赴約銅牌。</p>\n<p class=\"content\">《俠客行》第12回：江南玄素莊石清夫婦在江湖上尋找失蹤了的兒子石中玉，路過師門上清觀，聽說上清觀接到俠客島臘八之約的銅牌，決意要為師門分憂。掌門師兄不準，雙方爭奪銅牌。石破天路過此地，上前幫忙不慎用毒掌傷了上清觀的道人。石清夫婦以為他就是從雪山派逃出來的兒子石中玉。</p>\n<p class=\"content\">十月，長樂幫出現兩個石幫主。</p>\n<p class=\"content\">《俠客行》第13-15回：關東四大門派前來拜訪長樂幫總舵，原約定是在重陽節，不料途中遇事耽擱，是以來遲，途中苦戰丁不四，幸得石破天仗義出手，四大門派感激不盡。長樂幫原來的幫主石中玉，被賞善罰惡使者從揚州妓院找到，揪到長樂幫。面對兩個一模一樣的石幫主，眾人目眩神迷。石中玉狡猾懦怯，不肯接受俠客島的邀請；石破天銳身任難，挺身為幫中兄弟承擔危險。石清夫婦痛心不已。按：“幫主確曾患過一場大病（八月），寒熱大作，昏迷多日，但那只是兩個多月之前的事。……到十二月初八還有兩個月，就算到那時非死不可，可也是多活了兩個月。”</p>\n<p class=\"content\">雪山派內訌。</p>\n<p class=\"content\">《俠客行》第16-18回：丁不三兄弟造訪凌霄城，丁不四吹噓說已經請史小翠去過碧螺島。雪山派掌門白自在狂怒不已，殺死兩名大夫三名弟子。白自在的四個師弟趁機發難，將自大成狂的白自在鎖入地窖，意欲取代掌門之位，雪山派發生內訌。等到俠客島的賞善罰惡使者來到凌霄城，四個師弟又誰也不敢接任掌門之位。史小翠和石破天甘冒死命，接下俠客島的銅牌。摩天居士謝煙客以為石中玉就是當年送還玄鐵令的小丐，奉其指令，來挑雪山派。真相大白之後，謝煙客應石破天之請，將石中玉帶去摩天崖鞭策教導。史小翠、石破天一行毅然前往俠客島。</p>\n<p class=\"content\">十二月初五，雪山派史小翠、阿繡的三月初八之約。</p>\n<p class=\"content\">《俠客行》第19回：史小翠、石破天一行來到南海之濱的小漁村，被告知雪山派掌門白自在已去俠客島，長樂幫幫主石破天也在臘八之宴邀請之列，其餘人等不得前往。史小翠、阿繡與石破天約定，並請轉告白自在，務要在三個月內回來。到了三月初八還不能回來，史小翠和阿繡將跳海自盡。按：“十二月初五，史婆婆率同石清、閔柔、白萬劍、石破天、阿繡、成自學、齊自勉、梁自進等一行人，來到南海之濱的一個小漁村中。”</p>\n<p class=\"content\">初八，俠客島群雄聚會。</p>\n<p class=\"content\">《俠客行》第19、20回：石破天來到俠客島，只見白自在、丁不四、上清觀天虛道人、關東四大門派共一百來人應邀出席臘八之宴，受到龍島主、木島主的盛情款待。原來三十年來受到俠客島懲處的幫派確有可殺之罪，三十年來滯留在島上的武林好漢都是自願留下，在島上觀摩和練習《俠客行》古詩中蘊含的不世武功。白自在也被石室中的古詩圖解迷住，不肯離島，石破天只好陪在島上習武。按：“到第四日午間，屈指正是臘月初八。”</p>\n<p class=\"content\">1564年　明世宗嘉靖四十三年（石破天20歲）</p>\n<p class=\"content\">三月，長樂幫石破天大功告成，龍、木島主安然逝去。</p>\n<p class=\"content\">《俠客行》第20回：三十年來，多少武林豪傑為石室中古詩的圖解窮智竭慮，殊不知上面的每一句註釋都在故意導人誤入歧途，石壁上的《太玄經》也不是眾人揣摩不透的蝌蚪文，只不過是一些經脈穴道的線路方位而已。石破天不識字，只是循著圖上的線路方位運功，偏是歪打正著，竟然大功告成。龍島主、木島主終於破解了幾十年來存於心中的疑難，安然逝去，臨終前將石室中的古詩圖解盡行毀去。按第21回：“咱們在島上過了一百一十五日。”</p>\n<p class=\"content\">初八，雪山派史小翠、阿繡因閏月得以死裡逃生。</p>\n<p class=\"content\">《俠客行》第21回：白自在、石破天等人相繼離島，屈指數來已在島上呆了近四個月，按原來的約定，史小翠、阿繡早已投海而死。誰知是年閏二月，白自在、石破天回到小漁村，才是三月初八，史小翠、阿繡在投海時得救。按：“今年閏二月，有兩個二月。”</p>\n<p class=\"content\">熊耳山梅芳姑自殺。</p>\n<p class=\"content\">《俠客行》第21回：丁不四在俠客島上闊別重逢當年的情人梅文馨，得悉兩人的女兒梅芳姑隱居在熊耳山枯草嶺，相約前去尋訪。白自在夫婦、石清夫婦、石破天等人一同前往。石破天發現梅芳姑就是把他撫養至十三歲的母親。芳姑聽到石清當年拒絕她的原因，憤而自殺。眾人見芳姑至死仍是處子之身，才知石破天並非芳姑親生。石清夫婦恍然大悟，二十年前被芳姑搶走的兒子石中堅並沒有死，正是眼前的武林奇才石破天。</p>"},{"title":"《白馬嘯西風》故事編年（1628-1640）","content":"</a>\n<p class=\"sectionTitle\">《白馬嘯西風》故事編年（1628-1640）</p>\n<p class=\"content\">【背景】公元17世紀10年代，女真族努爾哈赤在困境中崛起，建立後金政權“清”。20年代，明天啟帝寵信宦官魏忠賢，閹黨專政，民怨沸騰；十七歲即位的崇禎帝剛愎自用，誅殺功臣袁崇煥；陝西農民大起義，李自成脫穎而出。30年代，李自成被推舉為闖王，農民起義如火如荼。清軍數度長驅入關，明朝統治搖搖欲墜。</p>\n<p class=\"content\">【概要】本篇故事與袁崇煥的少年時代重疊，江湖門派主要有華山派、棋仙派、五毒教、鐵劍門、仙都派、金龍幫等，金蛇郎君、白馬李三、呂梁三傑、一指震江南等武林人物赫然有名。漢族女孩李文秀，身懷高昌國千年寶藏的秘圖在回疆哈薩克族長大，機緣湊巧練成一身武藝，心有所儀卻不能終成眷屬。</p>\n<p class=\"content\">【紀年】唐貞觀十四年（640年），唐朝吏部尚書侯君集攻滅高昌國。一千年後（1640年）江湖群雄尋至高昌國藏寶之處，故事結束。此時，孤兒李文秀已經在回疆哈薩克族住了十二年，可知故事開始在1628年。時值袁崇煥五歲。</p>\n<p class=\"content\">1610年　明神宗萬曆三十八年（夏雪宜10歲）</p>\n<p class=\"content\">金蛇郎君夏雪宜慘遭滅門之禍。</p>\n<p class=\"content\">《碧血劍》第6回：當時浙江衢州有個棋仙派，溫氏八兄弟自稱“八德堂”，在外擄掠姦淫，無惡不作。老六溫方祿闖入江南夏家，侮辱夏雪宜的姐姐之後，又將其父母兄長一家五口盡數殺死。夏雪宜孤身一人在外，從此苦練武功，伺機要報這血海深仇。夏雪宜長大後說起小時候的事情，他爸爸媽媽怎樣疼他，哥哥姐姐又怎樣愛護他，還保存著媽媽為他週歲繡的肚兜。說明夏雪宜慘遭滅門之禍，正在他剛剛記事之年，大約十歲左右。</p>\n<p class=\"content\">1618年　明神宗萬曆四十六年（夏雪宜18歲）</p>\n<p class=\"content\">上官虹愛上白馬李三，師兄史仲俊因愛成仇。</p>\n<p class=\"content\">《白馬嘯西風》：史仲俊和上官虹原是同門師兄妹，兩人自幼一起學藝。史仲俊一直愛著這個嬌小溫柔的小師妹，師父也有意從中撮合，因此同門的師兄弟們早把他們當做一對未婚夫婦。豈知上官虹無意中和白馬李三相遇，竟而一見鍾情，家中不許他倆的婚事，上官虹便跟著他跑了。史仲俊傷心之餘，大病一場，性情也從此變了。他對師妹始終痴情不移，一直沒有娶親。</p>\n<p class=\"content\">編者按：《白馬嘯西風》的故事發生年代不詳。小說裡記高昌國國王鞠文泰修造迷宮，唐朝吏部尚書侯君集攻滅高昌國是在唐貞觀十四年（640年），小說裡“一指震江南”華輝在迷宮裡裝扮鬼魂，反覆說：“我在這裡已安安靜靜地住了一千年，誰也不敢來打攪我。”金庸先生也說：“千餘年來，沙漠變遷，樹木叢生，這本來就已十分隱秘的古宮，更加隱秘了。”說明《白馬嘯西風》故事結束，是在1640年或稍後。史仲俊和上官虹分手十年後，在回疆大漠重逢；再過十二年，上官虹的女兒李文秀找到了高昌迷宮，說明史仲俊和上官虹分手，距故事結束整二十二年。姑繫於此，待考。</p>\n<p class=\"content\">1620年　明光宗泰昌元年（夏雪宜20歲）</p>\n<p class=\"content\">哈薩克人瓦耳拉齊逃亡中原，成為轟動大江南北的武林高手。</p>\n<p class=\"content\">《白馬嘯西風》：在回疆大漠高昌國故址，聚居了一群哈薩克人，青年瓦耳拉齊和車爾庫，同時愛上了一個美麗的姑娘雅麗仙。瓦耳拉齊失戀，半夜裡刀殺情敵車爾庫未遂，卻被族長逐出本族，永遠不許回來。瓦耳拉齊逃到中原，學了漢人武功，化名為“一指震江南”華輝。他伺機要回哈薩克報仇。按（1640年）：“忽然之間，李文秀有些可憐那個瓦耳拉齊起來。他得不到自己心愛的人，又給逐出了本族，一直孤零零地住在這迷宮裡。阿曼十八歲，他在這迷宮裡已住了二十年吧？”</p>\n<p class=\"content\">1622年　明熹宗天啟二年（夏雪宜22歲）</p>\n<p class=\"content\">金蛇郎君夏雪宜得到雲南五仙教的鎮教“三寶”。</p>\n<p class=\"content\">《碧血劍》第17回：雲南五仙教原名五毒教，以精研毒藥聞名天下，教中三寶，即祖傳金蛇劍、二十四枚金蛇錐和當年建文帝遺下的藏寶地圖。江南少俠夏雪宜身負血海深仇，卻因仇家溫氏棋仙派人多勢眾，報仇沒有把握，聽說五仙教的施毒功夫在江湖上首屈一指，因此來到雲南。夏雪宜遇見五仙教何教主的妹妹何紅藥，少年少女情竇初開，何紅藥為之傾倒。夏雪宜為何紅藥在粗蠶絲絹上畫了一幅肖像，何紅藥則帶他進入麗江府玉龍雪山的毒龍洞，取走鎮教“三寶”。是年，何紅藥二十歲，夏雪宜大約二十二歲。按：“見那肖像是個二十歲左右少女，雙頰暈紅。”</p>\n<p class=\"content\">1623年　明熹宗天啟三年（夏雪宜23歲）</p>\n<p class=\"content\">金蛇郎君夏雪宜始報滅門之仇。</p>\n<p class=\"content\">《碧血劍》第6回：夏雪宜取得雲南五仙教的“三寶”，劍術和內力大增，江湖上稱“金蛇郎君”。夏雪宜在揚州殺死仇人溫方祿，將其斬成八塊，託溫氏二房溫方義的兒子溫南揚帶回浙江，捎信發誓要殺溫家五十人，姦汙溫家婦女十人。從此，溫氏棋仙派惶惶不可終日，老七、老八橫屍溝壑。半年之後，溫家天天有人喪命，四房裡的兩個媳婦還被“金蛇郎君”夏雪宜賣進揚州妓院，接了一個月的客。兩年之間，溫家大大小小被殺死三十八口人。是年，溫南揚二十六歲，夏雪宜比他小著幾歲，至多二十三歲。按（1643年）：“那是二十年前的事了，那時我二十六歲。……他是個長得很俊的年輕人，年紀還比我小著幾歲。”</p>\n<p class=\"content\">浡泥國那督張信延師教子。</p>\n<p class=\"content\">《碧血劍》第1回：西南海外的浡泥國，自宋朝太平興國二年起，來中土朝貢不絕。福建漳州張氏在該國累世受封那督。是年，那督張信為十二歲的兒子張朝唐聘請西賓，學習《四書五經》，以期學成迴歸中土趕考功名。按（1633年）：“十年間，四書五經俱已熟習。”</p>\n<p class=\"content\">1624年　明熹宗天啟四年（袁承志1歲）</p>\n<p class=\"content\">春，金龍幫和仙都派結下樑子。</p>\n<p class=\"content\">《碧血劍》第8回：當時江湖幫派林立，仙都派是武當旁支。仙都派弟子閔子葉，時任山東濟南府會友鏢局總鏢頭，接鏢護送山東省東兗道丘道臺卸任回籍。他聽說丘道臺的二小姐十分美貌，便與飛虎寨強盜設下圈套，準備上演“英雄救美人”的鬧劇。金龍幫幫主、“鐵背金鰲”焦公禮正要攔路搶劫，無意間得知這一陰謀，不由得火星直冒，當眾叫破他的詭計。閔子葉惱羞成怒，在激鬥中被焦公禮一刀砍死。仙都派門人得知訊息，氣勢洶洶要與焦公禮為難。幸虧“金蛇郎君”夏雪宜路過，拔劍相助，將焦公禮護送到仙都山龍虎觀，向仙都派掌門人黃木道長說明原委，並呈上飛虎寨寨主的伏辯和丘道臺的謝書。黃木道長很識大體，約束門人不得尋仇。閔子葉有個弟弟叫閔子華，當時年齡幼小不知內情，長大後只道焦公禮是殺兄仇人，要為兄長報仇。按（1643年）：“先兄當年遭害身亡，兄弟十多年來到處訪查。”此事發生在夏雪宜遭溫家暗算之前，但又不可能早於今年。</p>\n<p class=\"content\">三月，金蛇郎君夏雪宜劫走溫家小姐溫儀，萌生愛情。</p>\n<p class=\"content\">《碧血劍》第6回：“金蛇郎君”夏雪宜繼續向溫家尋仇，每到端午、中秋、年關三節，他就送封信來，開一張清單，說還欠人命幾條，婦女幾人。這天是陽春三月，溫氏三房溫方山的女兒溫儀，年方十七，在園子裡盪鞦韆，被夏雪宜劫走，關在山頂的一個石洞裡。溫方山來救女兒，差點被夏雪宜打死，幸虧溫儀出言相救。夏雪宜和溫儀產生愛情，他告訴她，自己得了當年建文帝的藏寶地圖，眼下先把她送回家，待尋到珍寶後再來接她。按：溫儀回憶夏雪宜殺溫方祿，“那時我（溫儀）比你（溫青青）此刻還小兩歲，比你更加孩子氣。”溫儀說話時溫青青十八歲，因知溫儀去年十六，今年十七。</p>\n<p class=\"content\">六月，金蛇郎君夏雪宜遭溫氏五行陣的暗算。</p>\n<p class=\"content\">《碧血劍》第6回：溫儀在家裡等了三個月，一天晚上忽然聽得窗下有人唱歌，果然是情郎來了。兩人相親相愛，懷上女兒青青。一對情人商量著第二天偷偷溜走，溫儀的父親溫方山來到閨房，要求夏雪宜正式娶他女兒。誰知這是溫氏兄弟設下的圈套，他們在蓮子羹裡放進秘製毒藥“醉仙蜜”，進而用溫氏“五行陣”制服夏雪宜，將他的腳筋和手筋挑斷，逼迫他帶路去尋找寶藏。溫氏兄弟歹毒無比，蓮子羹是讓溫儀端給夏雪宜的，一對情人心碎欲裂，從此天各一方。按（1643年）：“十九年來，我沒跟爹爹說過一句話，以後我也永不會和他說話。我本來早不該再住在溫家，可是我有了青青，又能去哪裡？”</p>\n<p class=\"content\">五仙教何紅藥毀容行乞。</p>\n<p class=\"content\">《碧血劍》第17回：兩年之前，何紅藥沉溺於夏雪宜的愛情，讓他取走了鎮教“三寶”。他說報仇之後，一定歸還三寶，何紅藥天天思念，兩年來竟沒有半點訊息。後來聽說江湖上有位“金蛇郎君”，知道定然是他，三寶失落的情況卻被教主兄長知道。按教裡規矩，何紅藥服了解藥身入蛇窟，遭受萬蛇咬齧之災，花容月貌毀於一旦。何紅藥養好傷在江湖上乞討活命，沿路尋找“金蛇郎君”夏雪宜。按：“他去了之後，我天天想念著他，兩年來竟沒半點訊息。”</p>\n<p class=\"content\">金蛇郎君夏雪宜命喪華山。</p>\n<p class=\"content\">《碧血劍》第17回：何紅藥找到夏雪宜時，夏雪宜已被棋仙派溫氏五祖抓住，逼迫去華山尋寶。何紅藥伺機對溫氏五祖下毒，將情郎藏入華山頂峰山洞，待得發現他另有意中人，追問姓名又不得，想到自己遭受的這般苦楚，不由得妒恨交加，對情郎日夜鞭打虐待。夏雪宜趁何紅藥下山去尋訪溫儀，便自封山洞，留下遺囑，離開了人世。</p>\n<p class=\"content\">明朝袁崇煥之子袁承志週歲之慶。</p>\n<p class=\"content\">《碧血劍》第2回：袁崇煥生於1584年，1619年考中進士，任福建邵武知縣。1622年進京述職，升為兵部主事，監軍山海關。當時明朝政權與關外後金政權之間的征戰正如火如荼。後金政權是女真族領袖努爾哈赤在1616年建立的，1618年起開始進攻明朝疆土，四年多的時間，覆沒明朝數十萬大軍，攻佔撫順、開原、鐵嶺、瀋陽，直逼山海關。北京宣佈戒嚴，進入緊急狀態。袁崇煥協守山海關期間，豪言壯語中顯示出天才的軍事才能，朝廷派他和副將滿桂駐守寧遠。1623年九月，袁崇煥到達寧遠，大張旗鼓、雷厲風行地進行築城。其子袁承志此時出生。今年承志做週歲，袁崇煥部下大將趙率教贈一金項圈，項圈上鑲著八顆小珍珠，鎖片上刻著“富貴恆昌”四個大字，還有兩行小字，一行是“袁公子承志週歲之慶”，一行是“小將趙率教敬贈”。趙率教、祖大壽、何可綱、滿桂，是袁崇煥部下的四大名將。參見金庸《袁崇煥評傳》。按：袁承志生於1623年，溫青青生於1625年，兩人相差兩歲。第5回（1643年）記：“袁承志笑道，你真是孩子脾氣，你幾歲了？溫青青道，我十八歲，你呢？袁承志道，我大你兩歲。”</p>\n<p class=\"content\">1625年　明熹宗天啟五年（袁承志2歲）</p>\n<p class=\"content\">五仙教何教主去世。</p>\n<p class=\"content\">《碧血劍》第15回：雲南五仙教的鎮教“三寶”被夏雪宜盜去，何教主雖然嚴懲了妹妹何紅藥，三寶終未復得，鬱郁而死。教主遺下一女，名何鐵手，年方五歲，繼任教主。老教主為了讓女兒練成祖傳絕技“金蜈鉤”，從小將其左手割去，裝上帶毒的鐵鉤，說是兵器拿在手裡，總不如干脆裝在手上靈便。“何鐵手”之名由此而來。小教主雖然未得父親親傳，卻得到教中高手的授業。十歲起練習“金蜈鉤”，練了十三年，許多秘傳仍未得精要。按第15回（1643年）：“先父過世之時，小妹還只五歲。十八年來，哪裡找得著這位前輩？”第16回：“我練了十三年，還不大成。”第18回：“她五歲那年，父親便即去世。”</p>\n<p class=\"content\">明朝錦衣衛安劍清之女小慧出生。</p>\n<p class=\"content\">《碧血劍》第13回：江湖老拳師楚大刀，當年收留一個凍餓瀕死的孤兒安劍清，將他一手養大，教了武功，還把女兒安大娘嫁給他。這一年，小兩口也生了個女兒名叫小慧。不料安劍清貪圖富貴，投入錦衣衛當差。楚大刀夫婦和兒子均為錦衣衛害死，安大娘氣忿不過，跟丈夫決裂分手，與女兒小慧在江湖上相依為命。按第5回（1643年）：“袁承志見那少女（安小慧）大約十八九歲年紀，雙頰暈紅，容貌娟秀。”</p>\n<p class=\"content\">1626年　明熹宗天啟六年（李文秀6歲）</p>\n<p class=\"content\">“一指震江南”華輝回故鄉哈薩克報仇。</p>\n<p class=\"content\">《白馬嘯西風》：哈薩克人瓦耳拉齊化名華輝，在中原學了漢人武功，還收了漢人徒弟馬家駿。這一年，華輝、馬家駿師徒潛回哈薩克鐵延部，得知車爾庫和雅麗仙的女兒阿曼已經四歲，妒火中燒，用毒針刺死昔日情人雅麗仙。華輝讓徒弟在水井裡下毒，要把全族人一起毒死。馬家駿良心發現，下不了手，又怕師父殺人滅口，便先下手為強，出其不意地在師父背心上射了三枚毒針。從此，華輝躲在附近山洞裡運功御毒。馬家駿更容易貌，化名計老人，住在哈薩克鐵延部裡，逃避師父的追殺。按（1638年）：“李文秀道，啊，你中了毒針，幾時中的？是今天麼？華輝道，不是，中了十二年啦！”</p>\n<p class=\"content\">1628年　明思宗崇禎元年（李文秀8歲）</p>\n<p class=\"content\">白馬李三夫婦命喪回疆，計老人收養李文秀。</p>\n<p class=\"content\">《白馬嘯西風》：早在公元640年（唐貞觀十四年），西域高昌國國君鞠文泰為了防禦唐朝的征討，造下一座曲折奇幻的迷宮，將國內的珍奇寶物盡數藏在宮中。後來。唐朝軍隊攻破高昌國，迷宮逐漸荒蕪，隱入回疆大漠。千年之後，高昌迷宮的地圖落入白馬李三手中，這一年，白馬李三與“金銀小劍三娘子”上官虹的女兒李文秀已經八歲。上官虹的師兄“梅花槍”史仲俊至今未娶，與“神刀震關西”霍元龍、“青蟒劍”陳達海意氣相投，合夥在山西省太谷縣開設了晉威鏢局，江湖上稱為“呂梁三傑。”“呂梁三傑”聽說高昌迷宮的地圖在白馬李三夫婦手上，便糾合六十三名高手，從甘涼一直追逐到回疆。白馬李三寡不敵眾，被史仲俊挾恨所殺，上官虹掩護女兒李文秀騎白馬脫身後，用金銀劍與師兄史仲俊同歸於盡。李文秀遇到好心的漢人計老丈，居留在哈薩克鐵延部。按：“一別十年，想不到呂梁三傑和李三夫婦竟在甘涼道上重逢，更為了爭奪一張地圖而動起手來。”“前面是匹高腿長身的白馬，馬上騎著個少婦，懷中摟著個七八歲的小姑娘。”“我爹爹媽媽一定知道你的名字，我到回疆來時還只八歲，什麼也不懂。”</p>\n<p class=\"content\">“呂梁三傑”霍元龍、陳達海屠殺哈薩克人。</p>\n<p class=\"content\">《白馬嘯西風》：“呂梁三傑”霍元龍、陳達海為了高昌迷宮的地圖，四處尋找孤兒李文秀。他們衝進哈薩克人居住的綠洲，大肆擄掠。哈薩克壯士蘇魯克的妻子和大兒子都在這次劫難中喪生，只剩下他和小兒子蘇普。蘇魯克對漢人充滿仇恨，教導十歲的蘇普要永遠憎恨真主降罰的漢人。按：“蘇普比她大了兩歲，長得很高，站在草地上很有點威武。”</p>\n<p class=\"content\">1629年　明思宗崇禎二年（袁承志6歲）</p>\n<p class=\"content\">十二月初一，明朝抗清名將袁崇煥蒙冤入獄。</p>\n<p class=\"content\">《碧血劍》第1、2回：年輕的崇禎皇帝繼位之初，十分器重袁崇煥，擢升為兵部尚書。1628年，寧遠和錦州因朝廷欠餉相繼發生兵變，袁崇煥奉詔前去安撫。當時後金努爾哈赤已經去世，其子皇太極繼位。袁崇煥出於對國家財力和軍隊戰鬥力的考慮，就皇太極提出的和平建議進行積極交涉。1629年六月，袁崇煥視察皮島駐軍毛文龍部，以專制悖逆、濫殺冒功、觀望養敵等罪狀，將毛文龍當場處斬。崇禎皇帝表面上對“議和”和“殺毛”事件表示嘉許，內心卻充滿疑懼。十月，清兵進迫京城，袁崇煥揮師勤王。崇禎中了皇太極的離間計，於十二月初一將袁崇煥逮捕入獄。主帥蒙冤，部下趙率教、滿桂和抗清大將孫祖壽憤而出戰，先後陣亡。參見金庸《袁崇煥評傳》。</p>\n<p class=\"content\">1630年　明思宗崇禎三年（袁承志7歲）</p>\n<p class=\"content\">八月十六，明朝崇禎皇帝殺大將袁崇煥。</p>\n<p class=\"content\">《碧血劍》第1、2回：袁崇煥蒙冤入獄後，朝野有識之士紛紛上書解救。崇禎也知道袁崇煥的“謀叛”之罪不實，卻為了顧全皇帝的面子，於八月十六執意將袁崇煥凌遲處死。當時袁承志只有七歲，孫祖壽的弟弟孫仲壽，帶著袁崇煥舊部心腹，將承志從錦衣衛手中救出，盡心撫育，密謀復仇。袁部大將祖大壽和何可綱，在袁崇煥下獄之時就反出北京，經袁崇煥在獄中修書相勸，才帶兵重回戰場。祖大壽因此遭崇禎疑忌，浴血沙場卻得不到增援，以致在大淩河被皇太極重重圍困，不得已而投降清軍。按：“袁督師被害之後，留下一位公子，那時還只有七歲。”</p>\n<p class=\"content\">明朝程氏兄弟慷慨報袁公。</p>\n<p class=\"content\">《碧血劍》第10、17回：程本直、程本剛兄弟是布衣百姓，與袁崇煥素無淵源。程本直對袁崇煥欽佩不已，投在袁部辦事。袁崇煥被捕後，程本直上書皇帝，列舉種種事實，為袁崇煥辯白，請求釋放讓他帶兵衛國，程本直在最後還要求為崇煥而死。崇禎大怒，將他下獄處死，完成了他的志願。程本剛不忿兄長被害，化名程青竹，設法投身皇宮，當了崇禎的侍衛，伺機行刺昏君。崇禎有個小女兒九姑，在袁崇煥遇害時才三歲，她小時候貪玩，曾跟程青竹學武。後來程青竹行刺崇禎不成，反為侍衛所擒，囚禁待斬，幸得九姑半夜裡悄悄放他逃出皇宮。程青竹在河北建立青竹幫，幹些黑道上沒本錢的買賣，數年之內，名動江湖。程青竹與徒弟九姑再次相遇，是在1643年六月袁承志運送珠寶北上之時，當時九姑十六歲。按第9回（1643年）：“見她十六七歲年紀，神態天真，雙頰暈紅。”程青竹行刺崇禎的時間不詳，大致在1640年左右，當時九姑十三四歲。程青竹花了三年時間，使青竹幫名動江湖。</p>\n<p class=\"content\">1632年　明思宗崇禎五年（李文秀12歲）</p>\n<p class=\"content\">漢族女孩李文秀傷心地離開蘇普。</p>\n<p class=\"content\">《白馬嘯西風》：李文秀隨著計老丈住在哈薩克部落，與哈薩克男孩蘇普相識。他倆一起牧羊，一起講故事，一起唱情歌。蘇普在李文秀受到野狼襲擊時，奮不顧身殺死野狼。蘇普接近漢人女孩，受到父親蘇魯克的鞭打。李文秀為了心上人不再受到鞭打，再也不與他見面，把他送的那張狼皮，悄悄地放在哈薩克最美麗的姑娘阿曼家的門口。按（1640年）：“只聽蘇普續道：她叫做阿秀，後來隔了八九年，一直沒再見到她。……說到這裡，在蘇普和李文秀心底，都出現了八九年前的情景，在小山丘上，一個男孩和一個女孩並肩坐著照顧羊群。”</p>\n<p c
