“三月丁酉（十八），以福康安為雲貴總督”；四十六年：“八月壬午（十二），調福康安為四川總督”；四十七年：“八月甲戌（初十），加福康安太子太保”；四十八年：“五月壬辰（初二），以福康安為正黃旗領侍衛內大臣”；四十九年：“閏三月丙辰朔（初一），兵部尚書福隆安卒，以福康安為兵部尚書”；（福康安列傳：嘉慶元年五月，卒于軍）。</p>\n<p class=\"content\">5.四子福長安</p>\n<p class=\"content\">《飛狐外傳》第15回：“傅恆第四子福長安任戶部尚書，後來封到侯爵。”《清史稿·傅恆列傳》：“福長安，……乾隆四十五年，命在軍機處學習行走。累遷戶部尚書。……嘉慶三年，俘王三槐，福長安以直軍機處得侯。……二十二年，卒。”《清史稿·高宗本紀》乾隆五十六年：“冬十月癸丑（十二），戶部尚書巴延三以浮估城工褫職，調福長安代之。”《清史稿·仁宗本紀》嘉慶三年：“八月，以獲教匪王三槐功，晉勒保及和坤公爵，福長安侯爵。”</p>\n<p class=\"content\">傅恆一家，所謂“當時滿門富貴極品，舉朝莫及”。金庸先生將傅氏在乾隆、嘉慶數朝的榮華濃縮在一個較短的時間段內，是小說家言。事實上，在乾隆三十六年，傅恆和長子福靈安確已去世；次子福隆安任工部尚書、一等公；三子福康安正任戶部侍郎，尚未至金川前線；四子福長安年紀幼小，尚未仕朝。</p>\n<p class=\"content\">八月十五，天下掌門人大會。</p>\n<p class=\"content\">《飛狐外傳》第14-20回：八月十五，福康安在府中如期召開天下掌門人大會，一方面籠絡江湖武俠，一方面用二十四隻御杯為餌，誘使一百餘位掌門人自相殘殺，所謂“二桃殺三士”之計。“雪山飛狐”胡斐奪得西嶽華拳門掌門之位，與程靈素喬裝赴會。袁紫衣一路奪得九個半門派的掌門之位，與胡斐、程靈素默契配合，大鬧掌門人大會，打碎御杯，揭露朝廷和福康安挑撥瓦解江湖武林的陰謀。當年害死袁紫衣母親的元兇鳳天南、湯沛在混戰中被殺。紅花會群雄為了祭奠香香公主，也來到京城，趙半山、常氏雙雄、心硯參與了大鬧掌門人大會。馬春花進宮後，慘遭福康安母親的毒害。紅花會總舵主陳家洛應胡斐之請，冒充福康安去藥王廟，安慰已經奄奄一息的馬春花。馬春花在虛擬的情人懷裡安然逝去，兩個孩子由常氏雙俠帶往回疆。“毒手神梟”石萬嗔為了取得師兄遺下的《藥王神篇》，追蹤暗算胡斐、程靈素。胡斐不慎身中劇毒，程靈素為救胡斐而喪生。胡斐將靈素骨灰埋葬在滄州父母墓旁的時候，遭到田歸農率領朝廷武士的突然圍攻。此時，田夫人南蘭已經看穿田歸農卑鄙骯髒的靈魂，在關鍵時刻暗中指點胡斐，當年苗人鳳在胡一刀夫婦墳前埋有一把“冷月寶刀”。胡斐取出寶刀，突圍而出。深愛胡斐的袁紫衣，即圓性尼姑，因師門戒律不得不悵然離去。</p>"},{"title":"《雪山飛狐》故事編年（1780）","content":"</a>\n<p class=\"sectionTitle\">《雪山飛狐》故事編年（1780）</p>\n<p class=\"content\">【背景】公元18世紀80年代初，乾隆四十五年（1780），乾隆帝七旬萬壽，優禮朝鮮賀壽使臣，減負各地額賦。乾隆第五次下江南，至浙江杭州、海寧，觀海潮。乾隆命福康安為雲貴總督，命和坤為戶部尚書。西藏班禪額爾德尼進京入覲，因患痘卒於北京。</p>\n<p class=\"content\">【概要】江湖主要門派有胡家刀、苗家劍、天龍會、興漢丐幫、飲馬川、北京平通鏢局、山東百會寺、玉筆峰山莊等。“雪山飛狐”胡斐於乾隆四十五年三月十五正午，至烏龍山玉筆峰山莊了斷百年恩怨。撲朔迷離百餘年的闖王寶藏終於水落石出，苗人鳳誤以為胡斐乃奸惡小人，一老一少兩位絕世俠客在玉筆峰生死相搏。</p>\n<p class=\"content\">【紀年】故事發生在乾隆四十五年（1780）三月十五。</p>\n<p class=\"content\">1780年　清乾隆四十五年（胡斐27歲）</p>\n<p class=\"content\">二月，天龍門田歸農密獻取寶之計。</p>\n<p class=\"content\">《雪山飛狐》第8回：天龍門北宗田歸農經過多年研摩，終於知道尋找闖王寶藏的關鍵，一是天龍門保管的那把闖王軍刀，一是苗家劍世代相傳的藏寶地圖。田歸農進京向皇帝報告這個秘密，並獻計以興漢丐幫範幫主為餌，誘捕“金面佛”苗人鳳。御前侍衛總管賽赫圖，一面將範幫主擒入天牢，佈下天羅地網，等待苗人鳳上鉤；一面派劉光鶴等侍衛出京打探田歸農所獻之計的虛實。按第2回（三月十五）：“上個月御前侍衛總管賽赫圖，親率大內侍衛十八高手，將範幫主擒了關入天牢。”</p>\n<p class=\"content\">苗家劍苗人鳳單身闖天牢。</p>\n<p class=\"content\">《雪山飛狐》第9回：苗人鳳念及苗、田、範三家百餘年來同盟之誼，單身闖天牢，搭救範幫主。人雖沒救出，但一柄長劍殺了十一名大內侍衛，賽總管也臂上中劍。賽總管一計不成，一計又生，採用諂諛拍馬之法，與範幫主結成至交好友。範幫主答應用家傳“龍爪擒拿手”，幫助賽總管擒拿苗人鳳。</p>\n<p class=\"content\">天龍門田歸農的夫人南蘭去世。</p>\n<p class=\"content\">《雪山飛狐》第7回：南蘭本是苗人鳳的妻子，十四年前因傾慕田歸農的風流倜儻，隨其私奔。後來南蘭發現田歸農人品低劣，知曉他當初拐騙自己的目的是為得到苗家的藏寶圖，不由得失望至極。南蘭受了些小風寒，便不肯服藥吃飯，執意待死。臨終將鬢邊珠釵取下，要田歸農交還苗人鳳或女兒苗若蘭，說道這是苗家物事。田歸農哪裡知道，他孜孜以求的闖王藏寶圖，就在這枚鳳頭珠釵之中。</p>\n<p class=\"content\">天龍門田歸農的女兒青雲未嫁生子。</p>\n<p class=\"content\">《雪山飛狐》第7回：田青雲是田歸農前妻生的女兒，今年二十四歲。田歸農將青雲許配給飲馬川山寨寨主陶百歲的兒子陶子安，青雲卻和大師兄曹雲奇發生私情，生下一個嬰兒。田青雲將這個嬰兒藏在自己的閨房之中。按第1回：“那人（陶子安）面目英俊，雙目斜飛，二十三四歲年紀，一身勁裝結束。”《飛狐外傳》第11回（1771年）：“她（程靈素）吃了一驚，回過頭來，只見一個十五六歲的姑娘（田青雲）厲聲道，給我規規矩矩地站著，別搗鬼。”</p>\n<p class=\"content\">天龍門軍刀交接儀式。</p>\n<p class=\"content\">《雪山飛狐》第7回：天龍門的軍刀，由南北兩宗每隔十年輪流保管。十年之期已屆，北宗掌門人田歸農要把軍刀移交給南宗掌門人殷吉。田歸農選擇在同日閉門封劍，大張筵席，請了數百位江湖上的成名英雄。北宗師弟阮士中，弟子曹雲奇、周雲陽，親家陶百歲和未來女婿陶子安都來幫忙料理，大內侍衛劉雲鶴也到會致賀。宴客之際，田歸農宣佈將北宗掌門之位傳給大弟子曹雲奇。</p>\n<p class=\"content\">天龍門田歸農府上怪事迭出。</p>\n<p class=\"content\">《雪山飛狐》第7回：田歸農的二弟子周雲陽趁府中賓客盈門，偷出闖王軍刀，埋在後園。田歸農的女兒田青雲自覺對不起陶子安，將私生子在被中悶死，也去埋在後園。田歸農回房，發現軍刀失蹤，這一驚可非同小可。師弟阮士中又來告知青雲未嫁生子之秘，並以曹雲奇傷風敗俗、大犯淫戒為由，要求繼承北宗掌門之位。田歸農焦頭爛額，請來陶子安，要他將已經空無一物的軍刀鐵匣去埋藏關外。南宗掌門殷吉見田歸農遲遲不肯交接軍刀，焦慮不安。</p>\n<p class=\"content\">苗家劍苗人鳳深夜造訪田府。</p>\n<p class=\"content\">《雪山飛狐》第7回：田歸農得悉，仇人苗人鳳和胡斐在今夜造訪，便端坐房中，拿著陶子安留下的長劍嚴陣以待。苗人鳳從田府後園取出軍刀和死嬰，來到田歸農房中逼問南蘭去世的情形。田歸農交還南蘭的珠釵，當他聽說闖王藏寶圖竟然就在這珠釵之中，不由得痛悔交加，在苗人鳳離去後，用陶子安留下的長劍自殺身亡。</p>\n<p class=\"content\">飲馬川陶百歲父子將軍刀埋在關外。</p>\n<p class=\"content\">《雪山飛狐》第7回：田歸農自殺之際，大內侍衛劉雲鶴因為盜刀之念，早已潛伏在房中床下。飲馬川陶子安發現岳父要他去埋的是軍刀空盒，又驚又怕。他去送還空盒，發現田歸農已然身亡。陶子安取走軍刀，與大內侍衛劉雲鶴聯手殺出，逃離田府。陶百歲父子將軍刀埋在關外，被一路跟去的劉雲鶴看破機關。天龍門諸人都以為田歸農是陶子安所害，循蹤追至關外。</p>\n<p class=\"content\">三月十五清晨，天龍會和飲馬川群雄的奪刀之戰。</p>\n<p class=\"content\">《雪山飛狐》第1回：陶百歲父子率領飲馬川另外三個寨主，到關外取出埋在這裡的軍刀，想不到大內侍衛劉雲鶴和北京平通鏢局熊天獻、鄭三娘、山東百會寺靜智大師在此埋伏了三天三夜。已經跟蹤多時的天龍會阮士中、殷吉、曹雲奇、周雲陽、田青文等人也突然現身。三方爭寶，各顯神通，靜智大師當場戰死。正在不可開交時，路過此地的寶樹和尚制住眾人，一併帶往烏龍山玉筆峰山莊。這寶樹和尚，就是當年在胡、苗之戰中施放毒藥的跌打醫生閻基，十四年前他在商家堡截鏢不遂，被迫出家。按：“這是乾隆四十五年三月十五。……東方紅日甫從山後升起。”</p>\n<p class=\"content\">閻基、平阿四、陶百歲在玉筆峰追憶如煙往事。</p>\n<p class=\"content\">《雪山飛狐》第3-5回：“雪山飛狐”胡斐已經長成人，他與玉筆峰莊主杜希孟約定今日拜莊，要索回當年失落在莊上的父母遺物。杜希孟邀請“金面佛”苗人鳳、青藏派玄冥子大師、崑崙山靈清道長、河南無極門姜老拳師上山助拳，企圖在制服胡斐的同時，幫助朝廷擒獲苗人鳳，一舉破解闖王寶藏的秘密。天龍會、飲馬川、平通鏢局諸人隨著寶樹和尚來到玉筆峰山莊，苗人鳳的女兒苗若蘭隨後到達。胡斐派來的雙胞胎童子，竟然大折眾人的威風。當年的跌打醫生閻基，田歸農的副手陶百歲，現在山莊充為傭人的燒火小廝平阿四，追憶著胡、苗、範、田四家百餘年來的恩怨情仇，嘆息不已。按：胡斐二十七歲，苗若蘭十七歲。“苗若蘭輕聲道，十年之前，那時候我還只七歲，我聽爹爹說你爹媽之事，心中就儘想著你。”“她隨即想到，自己一直叫他可憐的孩子，其實他已是個二十七歲的男子，比自己還大著十歲，臉上不禁一紅。”</p>\n<p class=\"content\">編者認為，胡斐派來的兩個孿生童子，可能是福康安和馬春花的孿生兒子。《飛狐外傳》記載：1766年，馬春花與福康安偷情。1767年，孿生兄弟出生。1771年，馬春花去世，孿生兄弟被紅花會常氏雙俠帶去回疆。第12回：“兩個男孩兒四歲左右，卻雪白可愛，兩人相貌一模一樣，顯是一對孿生兄弟。”第19回：“胡斐拜託常氏雙俠和倪氏昆仲，將馬春花的兩個孩子先行帶到回疆，他料理了馬春花的喪事之後，便去回疆和眾人聚會。”大約之後不久，胡斐去回疆，將兩個孩子收為童子。今年，兩個孩子十三歲。《雪山飛狐》第2回：“兩名小童一般高矮，約莫十三四歲年紀，……這兩人眉目如畫，形相俊雅。”</p>\n<p class=\"content\">正午，“雪山飛狐”胡斐第一次拜莊。</p>\n<p class=\"content\">《雪山飛狐》第6回：“雪山飛狐”胡斐如約在正午登峰，莊上諸人心懷鬼胎，躲避不迭。苗若蘭落落大方，出面款待胡斐，兩人一見鍾情。胡斐聽說莊主杜希孟出去邀請苗人鳳等人尚未回莊，便去峰下守候。</p>\n<p class=\"content\">寶樹和天龍門、飲馬川、平通鏢局諸人下山尋寶。</p>\n<p class=\"content\">《雪山飛狐》第8回：寶樹和尚聽了天龍門軍刀交接之日發生的故事，與眾人從苗若蘭鬢邊的珠釵中取出藏寶地圖，得知寶藏就在烏龍山玉筆峰下。眾人下山尋寶之前，將苗若蘭點中穴道除去衣衫，置於廂房帳中。眾人沿著軍刀刀鞘上圖紋的指引，找到藏寶山洞，發現冰封了的寶藏，和苗、田兩位前輩的屍體。眾人貪婪之心頓生，又怕別人暗算獨吞，在聯手融冰之時，又不得不相互嚴加防範。</p>\n<p class=\"content\">傍晚，胡斐再次拜莊，救苗人鳳。</p>\n<p class=\"content\">《雪山飛狐》第9回：胡斐再次來到玉筆峰山莊，不料已經空無一人。突然，御前侍衛總管賽赫圖帶著杜希孟、範幫主、玄冥子、靈清道人、姜老拳師以及大內侍衛共十八人來到莊內，情急之下，胡斐躲入廂房帳內，正好與只穿內衣的苗若蘭面面相覷。“金面佛”苗人鳳隨後趕到莊上。莊主杜希孟、興漢丐幫範幫主等武林敗類突然發難，埋伏在四周的賽赫圖帶著大內侍衛一擁而上，將毫無防備的苗人鳳擒獲。賽總管正要下毒手廢了苗人鳳，胡斐從帳中躍出，仗義相救。兩人聯手，將十八名敵人打得落花流水。</p>\n<p class=\"content\">苗家劍苗人鳳和“雪山飛狐”胡斐的玉筆峰之戰。</p>\n<p class=\"content\">《雪山飛狐》第10回：苗人鳳正在和胡斐聯手抗拒清廷侍衛和武林敗類，突然發現胡斐躍出的帳中，竟還有隻穿內衣的女兒苗若蘭，就誤以為胡斐乃欺辱女兒的奸惡小人，拼死追殺。胡斐抱著苗若蘭逃下峰去，一路上海誓山盟，私定百年之好。天龍會、飲馬川以及寶樹和尚等諸人在藏寶洞內貪婪爭奪，互相廝殺。胡斐關閉石門，令寶藏和貪婪之徒永不見天日。苗人鳳趕到，與胡斐在陡峭山谷的突出懸崖上比武。一個要報殺父之仇，一個要雪辱女之恨，生死相搏，旗鼓相當。懸巖晃動，危如累卵。突然，苗人鳳的劍招出現漏洞，若胡斐趁機進招劈下，可以將對手逼下懸崖，但這對手是意中人的父親，又是自己崇拜多年的豪傑；若不進招劈下，自己必將粉身碎骨。他這一刀到底劈下去還是不劈？</p>\n<p class=\"content\">金庸先生將這個答案留給了讀者。</p>"},{"title":"二、金庸武俠人物大全","content":"</a>\n<p class=\"chapterTitle\">二、金庸武俠人物大全</p>\n<p class=\"content\">金庸武俠人物大全</p>"},{"title":"A","content":"< let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn-top, .chapter-btn-sub').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn-top.active, .chapter-btn-sub.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  sidebarItems.forEach(function(item, i) {
    var btn = document.createElement('button');
    btn.className = item.depth === 0 ? 'chapter-btn-top' : 'chapter-btn-sub';
    btn.textContent = item.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});

initChapterList();
showChapter(0);

</script>
