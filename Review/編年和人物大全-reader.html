<script>

const chapters = [{"title":"序","content":"</a>\n<p class=\"chapterTitle\">序</p>\n<p class=\"content\">如果說歷史是不盡的長河，那麼文學就是跌宕不休的粼粼碧波；如果說歷史是廣袤的原野，那麼文學就是綿延不絕的濃濃綠蔭；如果說歷史是無際的長空，那麼文學就是閃爍不停的滿目繁星。</p>\n<p class=\"content\">歷史催生和哺育文學。原始祭祀儀式中，人們載歌載舞，頌祖揚神，頌揚之辭成為歷史上最早的口頭文學；女媧補天、精衛填海、后羿射日，傳說與神話，乃遠古人類欲與自然相協調的精神追索。文學豐腴和活躍了歷史。誰都難以想象：倘若沒有唐詩、宋詞、元曲、明清小說，歷史將是何等地乾涸與羞澀？倘若沒有文學的再現與塑造，難以枚舉的歷史人物又怎能婦孺皆知，至今依然栩栩如生？文學與歷史結伴而來，相映成輝。《詩經》是曠古的文學精品，又是時代風俗的珍貴印證；《史記》是一部龐大的歷史畫卷，又是一部對後人薰陶不盡的文學鉅獻，在這裡，文學與歷史相輔相成，珠聯璧合。</p>\n<p class=\"content\">文學與歷史的淵源，古今中外，莫不如是。</p>\n<p class=\"content\">金庸是位史學大師，又是一位文學巨匠。金先生的文學作品同樣根植於歷史。正如先生所言：小說“加上歷史人物，是為了增加真實性，反正有歷史人物陪襯，讀者會覺得小說故事可靠性多一點”。先生的文學精品“飛雪連天射白鹿，笑書神俠倚碧鴛”十四部小說，時跨公元1000年至1780年共計780年，歷經宋、金、元、明、清五朝，作品大多以小說人物為主線，以歷史的興衰、更替或重大歷史事件的發生發展為隱線，饗以讀者，倍覺真實。文學畢竟不同於歷史，所以金先生寫小說時更信馬由韁，文思泉湧。又如先生所談到的：“歷史小說有個基本範圍，被歷史事件所侷限，限制較多，想象空間較少。像《鹿鼎記》比較像歷史小說，但真正的歷史小說，有可能讓韋小寶娶七個老婆，卻不能創造出韋小寶和俄國打仗。”歷史的真實加以文學的創造，先生的小說方至既真實可信，又曲折離奇、興趣迭生。由此，文學與歷史的區別又可窺一斑。</p>\n<p class=\"content\">金庸文學研究亦稱為“金學”，幾與“紅學”齊驅。吾友丁俞斌先生既是一位文學愛好者，又是一位喜歡琢磨歷史的有識之士，繼《四大名著故事編年和人物大全》出版之後，筆耕不輟，將金先生十四部小說中的武俠故事和小說人物彙編於一冊，對有案可稽的歷史事件和小說虛構的武林大事，對歷史人物和小說人物逐一加以甄別。從中，我等不僅可以更清晰地感受文學與歷史的交融，而且可以更深切地領略文學與歷史的錯位；無論是從文學再欣賞的角度，或是從歷史再認知的角度，讀來均大有裨益。</p>\n<p class=\"right-content\">陳志軍</p>\n<p class=\"right-content\">二〇〇八年十一月二十日</p>"},{"title":"一、金庸武俠故事編年","content":"</a>\n<p class=\"chapterTitle\">一、金庸武俠故事編年</p>"},{"title":"《天龍八部》故事編年（1091-1108）","content":"</a>\n<p class=\"sectionTitle\">《天龍八部》故事編年（1091-1108）</p>\n<p class=\"content\">【背景】11世紀，中國境內宋、遼、西夏三國並立，大理等少數民族政權僻居邊隅。宋朝自60年代王安石變法起，新舊兩黨的政治鬥爭一直持續到本世紀末；遼道宗與叔父的皇權爭奪，導致了60年代的重元之亂；大理國權臣高氏在90年代逼迫段氏保定帝出家，自立為君，兩年後又還政於段氏。</p>\n<p class=\"content\">【概要】江湖門派主要有少林派、丐幫、大理派、慕容派和逍遙派，逍遙派後來又派生出靈鷲宮、星宿派。丐幫喬峰的契丹人身世大白後，被革去幫主之職；大理鎮南王世子段譽風流多情，豔遇的卻都是父親當年的私生女；少林寺方丈的私生子虛竹，陰差陽錯成了逍遙派、靈鷲宮的掌門，最後還做了西夏王國的駙馬。</p>\n<p class=\"content\">【紀年】金庸先生說，《天龍八部》故事發生於北宋哲宗元祐、紹聖年間，1094年左右。原著交代段譽生於壬子年（1072），鍾靈生於乙卯年（1075），喬峰接任丐幫幫主在大宋元豐六年（1083），故事開始時段譽十九歲，鍾靈十六歲，喬峰執掌丐幫已經八年，據此可確定故事始於1091年。故事結束時段正淳之子段譽即大理帝位，史載1108年。</p>\n<p class=\"content\">1000年　宋真宗鹹平三年（天山童姥3歲）</p>\n<p class=\"content\">逍遙派弟子無崖子出生。</p>\n<p class=\"content\">逍遙派時任掌門人逍遙子，一生收徒三個，天山童姥（女）生於997年，無崖子生於1000年，李秋水（女）生於1005年。後來逍遙派弟子因愛恨情仇發生內訌，天山童姥創立靈鷲宮。無崖子的大弟子蘇星河創立聾啞門，二弟子丁春秋創立星宿派。李秋水先是橫刀奪愛，從師姐那裡把師兄無崖子奪來，之後又紅杏出牆，勾搭上師侄丁春秋，最終去西夏國做了皇妃。按第35回（1093年）：“無崖子倘若不死，今年九十三歲。”</p>\n<p class=\"content\">1003年　宋真宗鹹平六年（天山童姥6歲）</p>\n<p class=\"content\">逍遙派弟子天山童姥始練“不老長春功”。</p>\n<p class=\"content\">《天龍八部》第35回：“這天長地久不老長春功，原是一門神奇無比的內功。只是我練得太早了些，六歲時開始修習，數年後這內功的威力便顯了出來，可是我的身子從此不能長大，永遠是八九歲的模樣了。……這功夫威力奇大，練成了能長生不老，卻有一個大大的不利之處，每三十年，我便要返老還童一次。”按（1093年）：“我是你師父無崖子的師姊，無崖子倘若不死，今年九十三歲，我比他大了三歲，難道不是九十六歲？”</p>\n<p class=\"content\">1004年　宋真宗景德元年（天山童姥7歲）</p>\n<p class=\"content\">宋、遼訂立“澶淵之盟”，罷兵休戰。</p>\n<p class=\"content\">《天龍八部》第21回：“宋軍自當年陳家谷大敗之後，契丹兵此後連年南攻，勝多敗少。到真宗皇帝景德元年，契丹皇帝和母親蕭太后親率大軍，攻抵澶州城下。真宗皇帝親至澶州，與契丹訂盟，稱為澶淵之盟，約為兄弟之國，從此罷兵休戰。至今八十餘年，兩國間並無大戰，遼國只去攻打高麗，大宋只去對西夏用兵。”白壽彝《中國通史》（以下簡稱《中國通史》）卷七：雍熙三年（遼統和四年，986年）正月，宋太宗聽信雄州知州賀令圖等的進言，認為遼聖宗年幼，承天太后專政，寵臣韓德讓掌權，內部不穩，是攻遼的好時機。……楊業與遼軍主帥耶律斜軫激戰於朔州南，又為遼軍蕭撻覽部伏兵所襲擊，當楊業按預定戰略退到陳家谷時，潘美卻早已違約率軍逃跑，遂使楊業全軍覆沒，楊業身負重傷後被俘，不食而死（楊業即歷史上著名的楊家將主帥楊老令公。編者注）。《中國通史》卷七：宋景德元年（遼統和二十二年，1004年）閏九月，承天太后、遼聖宗又以收復被後周世宗佔領的關南地區為名，發動大規模戰爭。宋廷雖也調整和部署了邊防的將領，準備抗擊遼軍……宋真宗只得繼續北上，並在寇準、高瓊迫請下渡過黃河，進到澶州（今濮陽）北城，宋軍士氣因而大振。遼軍也早已進至澶州北城下，但遼軍主將蕭撻覽卻被宋軍伏弩射傷致死，宋朝重兵駐守的定州（今河北定縣）也威脅著遼軍的後方，因而遼承天太后、聖宗也想議和退兵。十二月，雙方訂立和議，規定宋朝每年交給遼朝絹20萬匹、銀10萬兩以換取和平，澶州的郡名為澶淵，故史稱這次盟約為“澶淵之盟”。從此，宋遼和平相處直至北宋末年。</p>\n<p class=\"content\">1023年　宋仁宗天聖元年（天山童姥26歲）</p>\n<p class=\"content\">逍遙派弟子天山童姥走火入魔。</p>\n<p class=\"content\">《天龍八部》第37回：“當年童姥雖身材矮小，但容貌甚美，師弟無崖子跟她兩情相悅。她練了天長地久不老長春功，又能駐顏不老，長保姿容，在二十六歲那年，她已可逆運神功，改正身材矮小的毛病。其時師妹李秋水方當十八歲，心中愛上了師兄無崖子，妒忌童姥，在她練功正當緊要關頭之時，在她腦後大叫一聲，嚇得她內息走火，真氣走入岔道，從此再難復原，永不長大，兩女由此成為死敵。”</p>\n<p class=\"content\">1031年　宋仁宗天聖九年（天山童姥34歲）</p>\n<p class=\"content\">六月初三，遼聖宗耶律隆緒崩，子宗真即位。</p>\n<p class=\"content\">《天龍八部》第27回：“耶律洪基的祖父耶律隆緒，遼史稱為聖宗。聖宗長子宗真，次子重元。宗真性格慈和寬厚，重元則極為勇武頗有兵略。聖宗逝世時，遺命傳位於長子宗真，但聖宗的皇后卻喜愛次子，陰謀立重元為帝。遼國向例，皇太后權力極重，其時宗真的皇位勢將不保，性命也已危殆，但重元反將母親的計謀告知兄長，宗真及早部署，令皇太后密謀不逞。宗真對這兄弟自十分感激，立他為皇太弟，宣示日後傳位於他，以酬恩德。”據《遼史·興宗本紀》太平十一年：“夏六月，己卯（初三），聖宗崩，[興宗]即皇帝位於柩前。壬午（初六），尊母元妃蕭氏為皇太后。”</p>\n<p class=\"content\">1033年　宋仁宗明道二年（天山童姥36歲）</p>\n<p class=\"content\">逍遙派天山童姥第一次返老還童，歷時三十天。</p>\n<p class=\"content\">《天龍八部》第35回：“我自六歲起練這功夫，三十六歲返老還童，花了三十天時光。”</p>\n<p class=\"content\">神山上人少林求師遭拒。</p>\n<p class=\"content\">《天龍八部》第39回（1093年）：“‘少林莊嚴寶剎，小僧心儀已久，六十年前便來投拜求戒，卻被拒之於山門之外。六十年後重來，垣瓦依舊，人事已非，可嘆啊可嘆。’……當年神山上人到少林寺求師，還只一十七歲。少林寺方丈靈門禪師和他接談之下，便覺他鋒芒太露，我慢貢高之氣極盛，器小易盈，不是傳法之人，若在寺中做個尋常僧侶，他又必不能甘居人下，日後定生事端，是以婉言相拒。”</p>\n<p class=\"content\">1034年　宋仁宗景祐元年（天山童姥37歲）</p>\n<p class=\"content\">五月，遼興宗立耶律重元為皇太弟。</p>\n<p class=\"content\">《中國通史》卷七：重熙三年（1034年）五月，皇太后蕭耨斤陰謀廢興宗另立次子耶律重元為帝，由於耶律重元告密而陰謀破產，皇太后被迫歸政於遼興宗，並被囚禁於慶州（今巴林左旗西北）。遼興宗隨後立耶律重元為皇太弟，不久又任命為南樞密院使事，這既是賞功，也是為了安撫耶律重元所代表的那部分勢力，順利地處理了這次政治風波，但並沒有能徹底解決問題。</p>\n<p class=\"content\">1046年　宋仁宗慶曆六年（天山童姥49歲）</p>\n<p class=\"content\">神山上人出任清涼寺方丈。</p>\n<p class=\"content\">《天龍八部》第39回：“神山這才投到清涼寺中，他才能傑出，只三十歲時便做了清涼寺方丈。”</p>\n<p class=\"content\">1048年　宋仁宗慶曆八年（天山童姥51歲）</p>\n<p class=\"content\">慕容派少年慕容博路傷黃眉僧。</p>\n<p class=\"content\">《天龍八部》第9回：慕容博，鮮卑族人，其祖先在晉朝五胡亂華之世，入侵中原建立割據政權，歷前燕、後燕、南燕、西燕數朝，後為北魏所滅。慕容氏子孫四散，但中興復國之志代代相傳。是年，慕容博喪父不久，路遇時任鏢師的大理拈花寺黃眉大師，以金剛指傷之。黃眉大師重創之下死裡逃生。按（1091年）：“說來那是四十三年前的事了，那時老衲年輕力壯，剛出道不久。”</p>\n<p class=\"content\">1051年　宋仁宗皇祐三年（天山童姥54歲）</p>\n<p class=\"content\">逍遙派李秋水生李青蘿，即王夫人。</p>\n<p class=\"content\">《天龍八部》第12回：逍遙派李秋水和師兄無崖子住在大理無量山劍湖之畔，逍遙相愛，生一女，取名李青蘿。無崖子尋得一塊巨玉，按李秋水十八歲時的模樣雕成人像。李青蘿長大後，嫁給蘇州王家，是王語嫣的母親。按（1091年）：“不過這女子是個中年美婦，四十歲不到年紀，洞中玉像卻是個十八九歲的少女。”</p>\n<p class=\"content\">1055年　宋仁宗至和二年（天山童姥58歲）</p>\n<p class=\"content\">八月初四，遼興宗耶律宗真崩，子洪基即位。</p>\n<p class=\"content\">《天龍八部》第27回：“耶律宗真遼史稱為興宗，但他逝世之後，皇位卻並不傳給皇太弟重元，仍是傳給自己的兒子洪基。耶律洪基接位後，心中過意不去，封重元為皇太叔，顯示他仍是大遼國皇儲，再加封天下兵馬大元帥，上朝免拜不名，賜金券誓書，四頂帽，二色袍，尊寵之隆，當朝第一；又封他兒子涅魯古為楚王，執掌南院軍政要務，稱為南院大王。”據《遼史·道宗本紀》：“[重熙]二十四年秋八月，己丑（初四），興宗崩，[道宗]即皇帝位於柩前，哀慟不聽政。辛卯（初六），百僚上表固請，許之。……壬辰（初七），以皇太弟重元為皇太叔，免漢拜，不名。”</p>\n<p class=\"content\">1060年　宋仁宗嘉祐五年（天山童姥63歲）</p>\n<p class=\"content\">逍遙派天山童姥滅絕一字慧劍門。</p>\n<p class=\"content\">《天龍八部》第38回（1093年）：逍遙派天山童姥自愛人被師妹奪走後，性情大異，自創縹緲峰靈鷲宮門派。是年，天山童姥大開殺戒。“我這門派之中，卻只老夫孤家寡人、光桿兒一個。‘一字慧劍門’三代六十二人，三十三年之前，便給天山童姥殺得乾乾淨淨了。”……“一字慧劍門”滿門師徒給童姥殺得精光，當時卓不凡不在福建，倖免於難，從此再也不敢回去，逃到長白山中荒僻極寒之地苦研劍法，無意中得了前輩高手遺下來的一部劍經，勤練三十年，終於劍術大成。</p>\n<p class=\"content\">1061年　宋仁宗嘉祐六年（天山童姥64歲）</p>\n<p class=\"content\">春，契丹族蕭峰出生。</p>\n<p class=\"content\">《天龍八部》第14回：蕭峰之父蕭遠山，契丹族人，自幼隨漢人師父習武，武功屬遼國第一，受遼國太后信任，任屬珊軍總教頭。蕭遠山致力於宋遼睦鄰修好，每每勸阻遼道宗用兵動武，深得宋遼兩國士民的愛戴。是年，蕭遠山喜得愛子。按：“兩人敘了年歲，喬峰比段譽大了十一歲，自然是兄長了。”</p>\n<p class=\"content\">八月，慕容派慕容博傳假信，意欲挑起宋遼爭端。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博見宋遼交好，兵戎不興，復燕之志無可乘之機，聞說九月初八蕭遠山赴武州岳父家拜壽，便去少林寺報信，說遼國派出高手，在重陽節大舉進襲少林寺，奪取武學典籍。少林寺方丈玄慈信以為真，召集中原豪傑於路阻截。按：“慕容博獲此消息，其時正當八月炎暑，便即趕赴少林寺報訊。”第16回（1091年）：“三十年前，中原豪傑接到訊息，說契丹國有大批武士要來偷襲少林寺，想將寺中秘藏數百年的武功圖譜，一舉奪去。……心想欺侮一個不滿週歲的嬰兒，那算是什麼男子漢、大丈夫？”</p>\n<p class=\"content\">九月初八，雁門關大戰。</p>\n<p class=\"content\">《天龍八部》第42回：少林寺玄慈方丈率領丐幫汪幫主、天台山智光大師等二十一名武林高手，在雁門關截獲蕭遠山及妻兒。蕭遠山猝不及防，嬌妻被殺。雙方惡鬥，蕭遠山殺死多名中原高手後，縱身懸崖。帶頭大哥玄慈等不忍殺其幼子，送喬三槐撫養，取名喬峰。按：“這日聽得蕭遠山的一個親戚說起，九月初八是蕭遠山嶽父的生辰，該日他必攜妻兒前往武州拜壽。”</p>\n<p class=\"content\">慕容博隱姓埋名，匿跡江湖。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博隱居於家中地窖，絕足不出。少林寺玄慈方丈知道被騙，派人四出查訪，卻杳無音信。按：“然而從九月重陽前後起，直到臘月，三個多月之中，竟沒半點警耗，待想找那報訊之人來詳加詢問，卻再也找他不到了。”</p>\n<p class=\"content\">1062年　宋仁宗嘉祐七年（蕭峰1歲）</p>\n<p class=\"content\">慕容博至少林寺偷錄武功秘笈。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博為求少林七十二絕技，獨自落戶在少林寺旁。不出半年，摸清了寺中藏經閣的情況，潛入閣中抄錄武功秘笈。“如此抄錄四月有餘，已得二十八門、共三十餘冊秘笈副本。其時已然入冬，年暮歲晚，他掛念妻子，返回蘇州……是年冬天，慕容博的妻子懷了身孕，慕容博便長留蘇州，等待妻子生育。”</p>\n<p class=\"content\">1063年　宋仁宗嘉祐八年（蕭峰2歲）</p>\n<p class=\"content\">五月，靈鷲宮天山童姥第二次返老還童，歷時六十天。</p>\n<p class=\"content\">《天龍八部》第35回：“六十六歲返老還童，那一次用了六十天。”</p>\n<p class=\"content\">七月十九，遼國耶律重元之亂。</p>\n<p class=\"content\">《天龍八部》第27回：“當年耶律重元明明可做皇帝，卻讓給兄長，可見他既重義氣，又甚恬退。耶律洪基大舉北出圍獵，將京中軍國重務都交給了皇太叔，絲毫不加疑心。這時訊息傳來，謀反的居然是南院大王耶律涅魯古，耶律洪基自是又驚又憂，素知涅魯古性子陰鷙，處事狠辣，他既舉事謀反，他父親決無袖手之理。”（金庸先生將此事件剪貼在1092年。）《遼史·道宗本紀》清寧九年：“秋七月丙辰（十七），如太子山。戊午（十九），皇太叔重元與其子楚國王涅魯古等凡四百人，誘脅弩手軍犯行宮。時南院樞密使許王仁先等率宿衛士卒數千人御之。涅魯古躍馬突出，將戰，為渤海近侍詳穩阿廝、護衛蘇射殺之。己未（二十），族逆黨家。庚申（二十一），重元亡入大漠，自殺。”</p>\n<p class=\"content\">八月以後，慕容博之子慕容復出生。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博為兒子取名慕容復，以期克紹箕裘，繼承先祖遺志，光復大燕。按第14回（1091年）：“聽說慕容復儒雅英俊，約莫二十八九歲年紀，本來比賢弟是要大著好幾歲。”</p>\n<p class=\"content\">是年，逍遙派弟子丁春秋將師父無崖子推下懸崖。</p>\n<p class=\"content\">《天龍八部》第31回：逍遙派掌門無崖子有兩徒，長曰蘇星河，次曰丁春秋。無崖子因涉獵廣泛，對師妹李秋水有所疏遠。李秋水勾搭上丁春秋，將無崖子打落懸崖。丁李兩人將“琅嬛玉洞”所藏武林秘笈以及無崖子和李秋水的女兒青蘿帶往蘇州。之後，李秋水去西夏國做了王妃，丁春秋自己創立了星宿派，蘇星河則裝聾作啞，以師父留下的珍瓏殘局，尋訪可以發揚光大逍遙派的少年俊彥。按（1093年）：“幸得我大徒兒蘇星河裝聾作啞，瞞過了逆徒耳目，老夫才得苟延殘喘，多活了三十年。”</p>\n<p class=\"content\">1064年　宋英宗治平元年（蕭峰3歲）</p>\n<p class=\"content\">慕容博與蕭遠山相遇少林藏經閣。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博胸懷復國之謀，易容改裝，自稱燕龍淵，在江湖上急難濟困，廣交朋友。入秋，他再度潛入少林寺，數月之後，又抄得十餘冊功訣。蕭遠山在雁門關之戰後，躲在少林寺旁數次偷看武功秘笈。有一日，兩人在藏經閣不期而遇。</p>\n<p class=\"content\">1066年　宋英宗治平三年（蕭峰5歲）</p>\n<p class=\"content\">慕容博、蕭遠山比試武功。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博、蕭遠山初會的次年，兩人再次相遇，約於第二年比試掌法。是年，兩人如約比試，武技不分高下。同日，慕容博遇吐蕃高僧鳩摩智（20多歲），兩人相約，鳩摩智去大理天龍寺求取《六脈神劍劍譜》，交換慕容博抄錄的少林寺絕技副本。</p>\n<p class=\"content\">1068年　宋神宗熙寧元年（蕭峰7歲）</p>\n<p class=\"content\">喬峰七歲殺人。</p>\n<p class=\"content\">《天龍八部》第18回：喬峰與養父母喬三槐夫婦相依為命，喬三槐生病，許家集的許大夫輕視窮人性命不肯出診。喬峰潛入許家將其殺死。按：“那孩子長到七歲時，身子已很高大，能幫著爹爹上山砍柴了。”</p>\n<p class=\"content\">少林寺玄苦大師授喬峰武功。</p>\n<p class=\"content\">《天龍八部》第16回：“你長到七歲之時，在少室山中採棗子，遇到野狼。有一位少林寺的僧人將你救了下來，殺死惡狼，給你治傷，自後每天便來傳你武功。”</p>\n<p class=\"content\">1069年　宋神宗熙寧二年（蕭峰8歲）</p>\n<p class=\"content\">王安石變法。</p>\n<p class=\"content\">《天龍八部》第49回：“當年王安石變法，創行保甲、保馬之法，還不是為了要國家富強，洗雪歷年祖宗之恥。”《中國通史》卷七：熙寧二年（1069年）二月，王安石任參知政事，首先創設變法改革的指導機構“制置三司條例司”，由王安石和樞密副使韓絳兼領，呂惠卿任“檢詳文字”，章為編修三司條例官，曾布任檢正中書五房公事。同年七月至十一月先後頒佈實行均輸法、青苗法（常平法）、農田水利法。</p>\n<p class=\"content\">少林僧虛竹出生。</p>\n<p class=\"content\">《天龍八部》第36回：虛竹之母葉二孃，十八歲時與少林寺方丈玄慈法師相愛，生虛竹。蕭遠山為了報復玄慈，搶走嬰兒虛竹，放在少林寺菜園之中，讓少林僧將他撫養長大，授他一身武藝。按（1093年）：“虛竹今年二十四歲，生平只和阿紫、童姥、李秋水三個女人說過話，這二十四年之中，只在少林寺中唸經參禪。”第38回：“二人敘了年紀，虛竹大了[段譽]三歲。”</p>\n<p class=\"content\">1070年　宋神宗熙寧三年（蕭峰9歲）</p>\n<p class=\"content\">靈鷲宮天山童姥以生死符控制武林群雄。</p>\n<p class=\"content\">《天龍八部》第36回：天山童姥自從成為靈鷲宮主人，為實現獨霸武林的野心，以生死符控制三十六洞洞主，七十二島島主。生死符是童姥發明的一種暗器。“這生死符一發作，一日厲害一日，奇癢劇痛遞加九九八十一日，然後逐步減退，八十一日之後，又再遞增，如此週而復始，永無休止。每年我派人巡行各洞各島，賜以鎮痛止癢之藥，這生死符一年之內便可不發。”第34回（1093年）：武林群雄俯首聽命於靈鷲宮，上山朝見均矇住眼睛，不見童姥真面目。“那是在二十三年之前，有人大著膽子，偷偷拉開蒙眼的黑布，向那老賊婆望了一眼，還沒來得及將黑布蓋上眼去，便給老賊婆刺瞎了雙眼，又割去了舌頭，斬斷了雙臂。”</p>\n<p class=\"content\">1072年　宋神宗熙寧五年（蕭峰11歲）</p>\n<p class=\"content\">二月十五，大理國鎮南王妃刀白鳳委身於叫花子段延慶。</p>\n<p class=\"content\">《天龍八部》第48回：大理937年立國，今傳至孝德帝段思廉。段思廉之子段廉義，段廉義之子段延慶。段延慶因故流落江湖，淪為乞丐。段延慶有堂兄段正淳，時任鎮南王。段正淳生性風流，到處拈花惹草，其妻刀白鳳不堪其辱，決意報復。是月，刀白鳳在大理天龍寺外菩提樹下，委身於段延慶。按：“段延慶腦子中一陣暈眩，瞧出來一片模糊，似乎是回到了二十多年前的月圓之夜。……我就在這一年的二月間被人圍攻，身受重傷，來到天龍寺外。”</p>\n<p class=\"content\">十一月二十三，大理國鎮南王世子段譽出生。</p>\n<p class=\"content\">《天龍八部》第48回：段譽名義上是鎮南王段正淳之子，實為鎮南王妃刀白鳳和乞丐段延慶的私生子。按：“鏈端懸著一塊長方的小金牌，一面刻著長命百歲四字，翻將過來，只見刻著一行小字：壬子年十一月廿三日生。”</p>\n<p class=\"content\">1073年　宋神宗熙寧六年（蕭峰12歲）</p>\n<p class=\"content\">大理派段正淳私生女木婉清出生。</p>\n<p class=\"content\">《天龍八部》第4回：“修羅刀”秦紅棉是大理鎮南王段正淳的情人之一，兩人相愛，生木婉清。按（1091年）：“木婉清道：我活了十八年，一直跟師父住在深山裡，本來……段譽插口道：嗯，你十八歲，小我一歲。”</p>\n<p class=\"content\">大理派段正淳與十七歲的康敏相愛。</p>\n<p class=\"content\">《天龍八部》第24回：康敏，即後來丐幫副幫主馬大元的妻子馬伕人。按第21回（1091年）：“但見她（馬伕人）眉梢眼角間隱露皺紋，約莫有三十五六歲年紀，臉上不施脂粉，膚色白嫩。”第24回：“小康，你的十根手指，比你十七歲時更加雪白柔嫩了。”</p>\n<p class=\"content\">慕容派慕容博在崔百泉胸前裝入三粒算盤珠。</p>\n<p class=\"content\">《天龍八部》第9回：“金算盤”崔百泉，是伏牛山派掌門柯百歲的師弟，是年在南陽府遇見中年慕容博。姑蘇慕容在江湖上已有“以彼之道，還施彼身”之名，以崔百泉慣用的算盤珠，裝入崔百泉的胸前。崔百泉萬念俱灰，隱姓埋名，棲身於大理鎮南王府。按（1091年）：“他這家出名的人就只一個慕容博，四十三年前，用金剛指力傷了這位大師的少年十五六歲，十八年前，給我身上裝算盤珠的傢伙當時四十來歲，算來就是這慕容博了。”</p>\n<p class=\"content\">大理派段正淳的私生女王語嫣出生。</p>\n<p class=\"content\">《天龍八部》第12回：王夫人即逍遙派掌門無崖子和師妹李秋水的女兒，原名李青蘿。青蘿長大後嫁給慕容博的舅子，卻又與段正淳結下私情，生王語嫣。後來青蘿的丈夫王姓少年去世，青蘿逼段正淳殺妻重娶，鬧得不可開交，段正淳只好不辭而別，溜之大吉。是年，王夫人22歲。按：“他（慕容復）比我（王語嫣）大十歲，一直當我是他的小妹妹，以為我除了讀書、除了記書上的武功之外，什麼也不懂。”</p>\n<p class=\"content\">1075年　宋神宗熙寧八年（蕭峰14歲）</p>\n<p class=\"content\">春，大理派段正淳與甘寶寶相愛。</p>\n<p class=\"content\">《天龍八部》第9回：“俏夜叉”甘寶寶是大理鎮南王段正淳的情人之一，歡好兩個月，懷上鍾靈。按（1091年）：“十六年前的春天，和她歡好兩個月，便有了鍾靈這孩兒。”</p>\n<p class=\"content\">六月，甘寶寶嫁給萬劫谷谷主鍾萬仇。</p>\n<p class=\"content\">《天龍八部》第9回：甘寶寶懷孕後，段正淳不知去向。苦候不來，十七歲的甘寶寶懾於父親和後母之威，只好嫁給萬劫谷谷主鍾萬仇。按：“傷心苦候，萬念俱灰。然是兒不能無父，十六年前朝思暮盼，只待君來。迫不得已，於乙卯年六月歸於鍾氏。”</p>\n<p class=\"content\">十二月初五，大理派段正淳的私生女鍾靈出生。</p>\n<p class=\"content\">《天龍八部》第2回：鍾靈名義上是萬劫谷谷主鍾萬仇之女，實為鎮南王段正淳與甘寶寶的私生女。按：“揭開盒蓋，見盒中有塊紙片，色變淡黃，顯是時日已久，紙上隱隱還濺著幾滴血跡，上寫乙卯年十二月初五丑時女十一字，筆致柔弱，似是出於女子之手。”</p>\n<p class=\"content\">是年，大理派段正淳與阮星竹的大女兒阿朱出生。</p>\n<p class=\"content\">《天龍八部》第23回：阮星竹是大理鎮南王段正淳的情人之一，時十九歲。按第19回（1091年）：“沒一個料得到車中出來的，竟然是個十六七歲的小姑娘（阿朱），而且是來求薛神醫治傷。”第22回（1091年）：“蕭峰和阿朱向她（阮星竹）瞧去，只見她……容顏秀麗，嘴角邊似笑非笑，約莫三十五六歲年紀。”</p>\n<p class=\"content\">1076年　宋神宗熙寧九年（蕭峰15歲）</p>\n<p class=\"content\">大理派段正淳與阮星竹的小女兒阿紫出生。</p>\n<p class=\"content\">《天龍八部》第23回：段正淳與阮星竹生了兩個女兒，欲歸大理，星竹不放，兩人大吵一場分手。阮家家教很嚴，星竹不敢把阿朱姐妹帶回家，只好分送給人家。為了日後能夠相認，星竹在兩個女兒的肩頭都刺了個段字，並在她們身上各放了一個金鎖片。阿朱後來做了姑蘇慕容家的丫頭，阿紫成了星宿派丁春秋的弟子。按：“原來我爹爹另外有妻子的，他和媽媽不是正式夫妻，先是生下了我，第二年又生了我妹妹。”第22回（1091年）：“瑟瑟幾響，花樹分開，鑽了一個少女（阿紫）出來，全身紫衫，只十五六歲年紀。”</p>\n<p class=\"content\">丐幫長老奚山河捨身赴國難。</p>\n<p class=\"content\">《天龍八部》第15回（1091年）：“十五年前，契丹國入侵雁門關，奚長老得知訊息，三日不食，四晚不睡，星夜趕回，報知緊急軍情，途中連斃九匹好馬，他也累得身受內傷，口吐鮮血。終於我大宋守軍有備，契丹胡騎不逞而退。這是有功於國的大事，江湖上英雄雖然不知內中詳情，咱們丐幫卻是知道的。”</p>\n<p class=\"content\">1077年　宋神宗熙寧十年（蕭峰16歲）</p>\n<p class=\"content\">喬峰加入丐幫，拜幫主汪劍通為師。</p>\n<p class=\"content\">《天龍八部》第16回：丐幫是江湖上一大門派，汪劍通時任幫主，馬大元任副幫主。“到得十六歲上，遇上了汪幫主，他收你做了徒兒，此後有許許多多的機緣遇合，你自己天資卓絕，奮力上進，固然非常人之所能及。”</p>\n<p class=\"content\">大理王子段延慶練成腹語術。</p>\n<p class=\"content\">《天龍八部》第48回：段延慶在奇遇鎮南王妃刀白鳳後，“他不敢在大理境內逗留，遠至南部蠻荒窮鄉僻壤之處，養好傷後，苦練家傳武功。最初五年習練以杖代足，再將一陽指功夫化在鋼杖之上，然後練成了腹語術。”</p>\n<p class=\"content\">1080年　宋神宗元豐三年（蕭峰19歲）</p>\n<p class=\"content\">大理高氏平定楊氏之亂，段壽輝即位。</p>\n<p class=\"content\">《天龍八部》第8回：“原來十多年前的上德五年，大理國上德帝段廉義在位，朝中忽生大變，上德帝為奸臣楊義貞所弒，其後上德帝的侄子段壽輝得天龍寺中諸高僧及忠臣高智升之助，平滅楊義貞。段壽輝接帝位後，稱為上明帝。”上明帝封高智升為繕闡侯，從此，高氏父子在大理國權傾朝野。據李大莊《簡明大理史：段郎的風花雪月》。</p>\n<p class=\"content\">1081年　宋神宗元豐四年（蕭峰20歲）</p>\n<p class=\"content\">大理上明帝段壽輝出家為僧，段正明即位。</p>\n<p class=\"content\">《天龍八部》第8回：大理上明帝段壽輝即位後，迫於高氏的權勢而心神恍惚，“上明帝不樂為帝，只在位一年，便赴天龍寺出家為僧，將帝位傳給堂弟段正明，是為保定帝。”段正明是段正淳之兄。據李大莊《簡明大理史：段郎的風花雪月》。按《天龍八部》第6回（1091年）：“大理國於五代後晉天福二年（937年）建國，比之趙匡胤陳橋兵變、黃袍加身（960年）還早了廿三年。大理段氏其先為武威郡人，始祖段儉魏，佐南詔大蒙國蒙氏為清平官，六傳至段思平，官通海節度使，丁酉年得國，稱太祖神聖文武帝。十四傳而到段正明，已歷一百五十餘年。”</p>\n<p class=\"content\">丐幫副幫主馬大元娶康敏。</p>\n<p class=\"content\">《天龍八部》第24回：康敏是大理鎮南王段正淳的情人之一，今年二十五歲，因與段正淳分手，嫁給丐幫馬大元。按（1091年）：“讓我抱抱你，別了十年，你是輕了些呢，還是重了些？”</p>\n<p class=\"content\">1082年　宋神宗元豐五年（蕭峰21歲）</p>\n<p class=\"content\">大理王子段延慶網羅四大惡人。</p>\n<p class=\"content\">《天龍八部》第48回：段延慶乃大理上德帝段廉義之子，淪落江湖練成腹語術。“又練五年後，前赴兩湖，將所有仇敵一家家殺得雞犬不留，手段之兇狠毒辣，實是駭人聽聞，因而博得了‘天下第一大惡人’的名頭，自稱惡貫滿盈，擺明了以作惡為業，不計後果。其後又將葉二孃、南海鱷神、雲中鶴三人收羅以為羽翼。他曾數次潛回大理，圖謀復位，但每次都察覺段正明的根基牢不可拔，只得廢然而退。”</p>\n<p class=\"content\">1083年　宋神宗元豐六年（蕭峰22歲）</p>\n<p class=\"content\">五月初七，喬峰接任丐幫幫主。</p>\n<p class=\"content\">《天龍八部》第16回：喬峰自入丐幫，武藝既精，立功又多，丐幫上下歸心，以為幫主之位非他莫屬。汪劍通幫主因喬峰是契丹人，傳位之意猶豫不決。少林寺玄慈大師也來信勸他三思而行。是年泰山大會，喬峰連創丐幫強敵九人，汪劍通方將幫主之位傳給喬峰。同時留下遺令，如喬峰親遼叛漢，全幫均可得而誅之。按：“下面注的日子是大宋元豐六年五月初七日。喬峰記得分明，那正是自己接任丐幫幫主之日。”第15回（1091年）：“喬峰……執掌丐幫八年以來，經過了不少大風大浪。”</p>\n<p class=\"content\">姑蘇慕容博詐死。</p>\n<p class=\"content\">《天龍八部》第42回：慕容博、慕容復父子博覽武功秘笈，武功隨日而長。是年，少林老僧玄悲登門求見，慕容博藏身地窖不出，後離家出走，由妻子對外稱老爺客死他鄉，並辦理奠祭、入葬事宜。按第22回：“蕭峰喝了一碗酒，問道，慕容老爺去世時年紀並不太老吧？阿朱道，五十來歲，也不算老。”</p>\n<p class=\"content\">1085年　宋神宗元豐八年（蕭峰24歲）</p>\n<p class=\"content\">宋哲宗幼年即位，祖母高太后垂簾執政。</p>\n<p class=\"content\">《天龍八部》第49回：“元祐年間太皇太后垂簾聽政，重用司馬光和蘇軾、蘇轍兄弟。”《中國通史》卷七：元豐八年（1085年）三月，宋神宗去世，年僅10歲的太子趙煦即位，是為哲宗。英宗皇后高氏以太皇太后垂簾執政。神宗生前高太后就不贊成變法改革，執政後任命司馬光為門下侍郎、呂公著為尚書左丞，參與朝政。司馬光用“太皇太后以母改子（神宗）”，作為廢除新法的理論依據，新法逐漸被廢除。七月，首先廢罷保甲團教，半年之內，方田均稅法、市易法、保馬法等相繼被廢。</p>\n<p class=\"content\">少林寺玄渡大師傳授虛竹羅漢拳。</p>\n<p class=\"content\">《天龍八部》第39回：“這玄渡大師為人慈和，極得寺中小輩僧侶愛戴。虛竹十六歲那年，曾奉派替玄渡掃地烹茶，服侍了他八個月。玄渡待他十分親切，還指點了他一些羅漢拳的拳法。”</p>\n<p class=\"content\">1086年　宋哲宗元祐元年（蕭峰25歲）</p>\n<p class=\"content\">春，丐幫老幫主汪劍通題詩，贈扇新幫主喬峰。</p>\n<p class=\"content\">《天龍八部》第16回：喬峰二十五歲生日，老幫主汪劍通贈扇題詩：“朔雪飄飄開雁門，平沙歷亂卷蓬根；功名恥計擒生數，直斬樓蘭報國恩。”扇上壯士出塞殺敵圖，為丐幫長老徐沖霄所作。</p>\n<p class=\"content\">1089年　宋哲宗元祐四年（蕭峰28歲）</p>\n<p class=\"content\">洛陽城百花會。</p>\n<p class=\"content\">《天龍八部》第24回（1091年）：“蕭峰一怔，洛陽城開百花會，那是兩年前的事了，他與丐幫眾兄弟同去赴會，猜拳喝酒，鬧了個暢快，可是說什麼也記不起在會上曾見過她，……‘百花會中一千多個男人，就只你自始至終沒瞧我。你是丐幫的大頭腦，天下聞名的英雄好漢。洛陽百花會中，男子漢以你居首，女子自然以我為第一。你竟不向我好好的瞧上幾眼，我再自負美貌，又有什麼用？那一千多人便再為我神魂顛倒，我心裡又怎能舒服？’”康敏由此懷恨在心。</p>\n<p class=\"content\">1090年　宋哲宗元祐五年（蕭峰29歲）</p>\n<p class=\"content\">五月初五，丐幫副幫主夫人康敏偶然得悉幫主汪劍通的遺令。</p>\n<p class=\"content\">《天龍八部》第24回：端午節，康敏在家拭抹箱籠，發現少林寺玄慈方丈和丐幫汪劍通幫主的密封書信，得悉新幫主喬峰原是契丹人。康敏微露口風試探丈夫馬大元，被馬大元狠揍了一頓。按（1091年）：“去年端午節，我拭抹箱籠，清除蟲蟻，在舊箱籠中見到一通書信。”</p>\n<p class=\"content\">八月十五，丐幫長老白世鏡殺副幫主馬大元。</p>\n<p class=\"content\">《天龍八部》第24回：白世鏡是丐幫執法長老，中秋節在馬家做客，與馬伕人康敏勾搭成奸。康敏告知喬峰是契丹人的秘密，被馬大元聽去。兩人聯手殺死了馬大元。康敏為了扳倒幫主喬峰，又勾搭上舵主全冠清、長老徐沖霄，等待時機一起發難。按：“過了三個多月，白世鏡來作客，那日是八月十四，他到我家來過中秋節，他瞧了我一眼，又是一眼。”</p>\n<p class=\"content\">冬，青城派司馬衛、秦家寨秦伯起遇害。</p>\n<p class=\"content\">《天龍八部》第13回：司馬衛，川西青城派掌門，獨門功夫為“青”字九打，“城”字十八破，冬至之日被姑蘇慕容用“城”字十八破中的“破月錐”功夫致死。秦伯起，雲州秦家寨的掌門之子，獨門功夫為“五虎斬門刀”，也為姑蘇慕容“以彼之道，還施彼身”所殺。按（1091年）：“去年冬天……數月之前。”</p>\n<p class=\"content\">1091年　宋哲宗元祐六年（蕭峰30歲）</p>\n<p class=\"content\">正月，大理王子段譽結識鍾靈、木婉清。</p>\n<p class=\"content\">《天龍八部》第1-6回：大理鎮南王段正淳的公子段譽出宮遊玩，遇見甘寶寶的女兒鍾靈、秦紅棉的女兒木婉清，互生愛慕之情。天下第一惡人段延慶念念不忘大理皇位，派另外三大惡人來大理尋釁滋事，中途劫持了段譽。段譽獲救回宮，方知與鍾靈、木婉清是同父異母兄妹，心情沮喪。按：“段譽笑道：那也好，那你得叫我做大哥了。你幾歲？鍾靈道：十六！你呢？段譽道：我大你三歲。”</p>\n<p class=\"content\">二十八，少林寺玄悲法師在大理陸涼州遇害。</p>\n<p class=\"content\">《天龍八部》第9回：少林方丈玄慈得知四大惡人去大理國尋釁，派師弟玄悲前來報訊助拳。玄悲師徒兼程南來，二十八日在大理陸涼州身戒寺掛單時遇害。因為致玄悲於非命的，正是玄悲的成名絕招“大韋陀杵”，故推測兇手乃姑蘇慕容。按（二月）：“我師徒兼程南來，上月廿八，在大理陸涼州身戒寺掛單。”</p>\n<p class=\"content\">二月，大理王子段譽被困於萬劫谷石屋。</p>\n<p class=\"content\">《天龍八部》第7-9回：萬劫谷谷主鍾萬仇對情敵段正淳痛恨入骨，與四大惡人聯手將段譽劫入萬劫谷石屋。段延慶為了毀敗段氏清譽，用春藥折磨段譽和木婉清。初三，保定帝段正明親自出馬，在黃眉大師和大理三公、四衛的協助下，救出段譽兄妹。按：“今兒初三，上月月小，二十八晚間是四天之前，譽兒被擒入萬劫谷是二十九晚間。”</p>\n<p class=\"content\">吐蕃高僧鳩摩智劫持大理王子段譽。</p>\n<p class=\"content\">《天龍八部》第10回：二十五年前，鳩摩智與慕容博相約，以《六脈神劍劍譜》交換少林寺絕技副本。鳩摩智至大理天龍寺求取劍譜不遂，將正在寺裡驅毒的段譽劫走，作為六脈神劍的活圖譜。</p>\n<p class=\"content\">三月，大理王子段譽在蘇州曼陀山莊結識王語嫣。</p>\n<p class=\"content\">《天龍八部》第11-13回：鳩摩智劫持段譽出了大理，威逼段譽默寫劍譜，段譽寧死不從。兩人至蘇州，慕容府上的丫鬟阿碧、阿朱，幫助段譽擺脫了鳩摩智的魔掌。段譽至曼陀山莊，對王夫人的女兒王語嫣一見鍾情。王語嫣卻一心繫於表哥慕容復，段譽黯然離去。按：“這般走了十餘天，料想已出了大理國境……自此一路向東，又行了二十餘日……這時正是三月天氣，杏花夾徑，綠柳垂湖，暖洋洋的春風吹在身上，當真是醺醺欲醉。”</p>\n<p class=\"content\">四月，丐幫喬峰在杏子林平定幫眾叛亂。</p>\n<p class=\"content\">《天龍八部》第14-16回：大理段譽在無錫遇丐幫幫主喬峰，兩人義結金蘭。丐幫幫眾在杏子林發動叛亂，被喬峰平定。康敏、白世鏡等人出示了書證，天台山智光大師作為雁門關之戰的人證，喬峰的身世大白。喬峰氣苦不堪，辭去幫主之位。按第39回：“前年四月間，丐幫在江南無錫聚會，說到幫主喬峰身世之事。”</p>\n<p class=\"content\">喬峰的父母、恩師相繼遇害。</p>\n<p class=\"content\">《天龍八部》第17、18回：慕容復化名李延宗，帶領西夏一品堂襲擊丐幫。丐幫群龍無首，被擊敗後困在天寧寺，幸得段譽和慕容府的丫鬟阿朱相救。喬峰的養父喬三槐夫婦、武藝啟蒙老師玄苦相繼遇害，眾人皆疑是喬峰殺人滅口，其實是喬峰之父蕭遠山所為。</p>\n<p class=\"content\">聚賢莊英雄宴。</p>\n<p class=\"content\">《天龍八部》第19回：阿朱去少林寺盜取《易筋經》時身受重傷，喬峰去聚賢莊請求神醫薛慕華醫治。薛慕華是逍遙派掌門人無崖子的再傳弟子，與遊氏雙雄召集中原各大門派共商剷除喬峰之計。喬峰力戰中原群雄，為了救護阿朱迭遇險境，在生死關頭得父親蕭遠山的救助。遊氏雙雄陣亡，遺下孤兒遊坦之。</p>\n<p class=\"content\">五月，喬峰確認自己是契丹人。</p>\n<p class=\"content\">《天龍八部》第20回：喬峰在雁門關重逢阿朱，與契丹同胞相遇，確認自己是契丹人。為了弄清帶頭大哥是誰，喬峰帶著阿朱，去尋訪徐沖霄長老等知情人。按：“堪堪到得二十天上，自覺傷口已好了七八成，酒癮大發，再也忍耐不住……喬峰心中鬱怒難伸，仍是一掌掌的劈去，似要將這一個多月來所受的種種委屈，都要向這塊石壁發洩。”</p>\n<p class=\"content\">七月，丐幫徐沖霄等知情人相繼遇害。</p>\n<p class=\"content\">《天龍八部》第21回：喬峰帶著阿朱沿路尋訪知情人。初三，丐幫長老徐沖霄為白世鏡所害；初七，太行山譚婆、趙錢李遇害，譚公自殺；初九，泰山單正全家被燒死；月底，天台山智光大師服毒自盡。喬峰更名為蕭峰。按第39回：“徐長老的兒子和媳婦，七月初三晚上服侍他老人家上床安息，到初四早晨，卻見徐長老肋骨齊斷，死在床上了。……七月初七乞巧節，丐幫在衛輝開弔祭奠徐長老。”</p>\n<p class=\"content\">九月，契丹人蕭峰在小鏡湖失手打死阿朱。</p>\n<p class=\"content\">《天龍八部》第21-23回：初二，蕭峰、阿朱在信陽找到馬伕人康敏，康敏騙他們說帶頭大哥就是大理鎮南王段正淳。蕭峰、阿朱在桐柏小鏡湖遇見隱居在此的段正淳和阮星竹，阿朱得知自己和星宿派的阿紫原來是段、阮兩人的女兒，決意代父而死。蕭峰報仇心切，失手打死了易容成段正淳的阿朱，痛心不迭。阿朱臨終將阿紫託付給蕭峰。按：“今日是初二，就算有月亮，也決不會圓，她說這話是什麼意思？”</p>\n<p class=\"content\">十月，丐幫馬大元、徐沖霄遇害的真相大白。</p>\n<p class=\"content\">《天龍八部》第23、24回：蕭峰跟蹤阮星竹母女來到信陽馬伕人家，秦紅棉母女、丐幫諸人也先後抵達。馬伕人康敏痛恨段正淳的無情，與丐幫白世鏡設計謀害段正淳，遭到蕭峰的制止，馬大元、徐沖霄遇害的真相大白。阿紫氣死馬伕人，追隨蕭峰北上。按：“這時已經入冬，這一年天冷得早……其時氣候雖寒，但入冬未久，樹葉未落。”天冷得早是有緣故的，這一年閏八月。</p>\n<p class=\"content\">蕭峰在長白山森林中結識完顏阿骨打。</p>\n<p class=\"content\">《天龍八部》第26回：完顏阿骨打是女真人族長之子，後來成為金朝的開國皇帝。阿骨打在森林中打獵時遭遇兩虎，蕭峰出手相救。阿骨打邀請蕭峰去女真族作客，蕭峰英雄本色，受到女真族上下的敬重。</p>\n<p class=\"content\">1092年　宋哲宗元祐七年（蕭峰31歲）</p>\n<p class=\"content\">四月，蕭峰與遼帝耶律洪基結為兄弟。</p>\n<p class=\"content\">《天龍八部》第26回：蕭峰客居女真族，為阿紫療傷。初夏，蕭峰隨著阿骨打等外出打獵，遇見並俘虜了遼道宗耶律洪基。蕭峰念同胞之情，與洪基結為兄弟並將其放回，洪基回國後派人送來金銀牛馬無數。按：“匆匆數月，冬盡春來……其時已是初夏，冰雪消融……在下蕭峰，今年三十一歲。”</p>\n<p class=\"content\">秋，蕭峰為遼國平定內亂，封為南院大王。</p>\n<p class=\"content\">《天龍八部》第26、27回：蕭峰、阿紫在路上遇見外出圍獵的遼帝耶律洪基，正巧遼國朝中發生內亂（實際發生在1063年，被金庸剪貼於此），蕭峰大智大勇，幫助洪基平定內亂。洪基封其為南院大王。按：“夏去秋來，阿紫的病又好了幾分。……蕭峰聽她提到星宿海三字，心中一凜，這大半年來和女真人共居，竟將武林中的種種情事淡忘了。……其時秋高氣爽，聞著長草的青氣，甚是暢快。草叢間諸般小獸甚多，蕭峰隨獵隨食，無憂無慮。”</p>\n<p class=\"content\">十月，阿紫收留前來尋仇的遊坦之，百般折磨。</p>\n<p class=\"content\">《天龍八部》第27、28回：遊坦之是聚賢莊遊氏雙雄的孤兒，北上尋蕭峰報仇，落在阿紫手中。阿紫將其戴上鐵罩，取名鐵醜，遊坦之慕其美貌，逆來順受。按：“如此調補，她內傷終於日痊一日，到得初冬，自己可以行走了。”</p>\n<p class=\"content\">1093年　宋哲宗元祐八年（蕭峰32歲）</p>\n<p class=\"content\">三月，星宿派阿紫捕捉毒蟲練習化功大法，遊坦之死裡逃生。</p>\n<p class=\"content\">《天龍八部》第28、29回：阿紫和遊坦之用星宿老怪丁春秋的神木王鼎，在南京捕捉毒蟲練功。阿紫讓毒蟲吸吮遊坦之身上的血液，遊坦之以《易筋經》中的功夫自解蟲毒。阿紫後來在城西“憫忠寺”捕得毒蟲之王冰蠶，大功告成。遊坦之九死一生，獨自遊蕩江湖。按：“如此過了兩個多月，天氣漸暖……其時三月暮春，天氣漸暖，但冰蠶一入偏殿，殿中便越來越冷。”</p>\n<p class=\"content\">五月初二，靈鷲宮天山童姥第三次返老還童，被烏老大所擒。</p>\n<p class=\"content\">《天龍八部》第34、35回：童姥今年九十六歲，第三次返老還童，需得九十天時光，方能恢復功力。初二，不堪生死符折磨的烏老大等人，聽說童姥身患重病，萌生背叛之心。童姥返老還童之後，功力全失，每練成一日便恢復一年的功力。童姥恢復到九歲功力時，不慎被烏老大等人當作靈鷲宮的丫頭擒去。按：“今年五月初二，在下與天風洞安洞主、海馬島欽島主等九人輪值供奉。”</p>\n<p class=\"content\">六月十五，少林僧虛竹被奉為逍遙派掌門人。</p>\n<p class=\"content\">《天龍八部》第29-32回：三十年前，逍遙派掌門人無崖子被二弟子丁春秋推落懸崖，生還後閉門不出，讓大弟子蘇星河擺出珍瓏棋局，能破解棋局者為掌門繼承人。今年六月十五日，蘇星河遍請天下英雄至河南擂鼓山天聾地啞谷，舉辦珍瓏破解擂臺賽。大理段譽、姑蘇慕容復、星宿派丁春秋、四大惡人段延慶等人應邀前往，少林僧虛竹隨玄難大師來到擂賽現場。眾英雄窮智竭慮，無人能破。虛竹誤打誤撞，竟然一舉成功。無崖子收虛竹為徒，授其神功後去世，逍遙派奉虛竹為掌門人。按：“蘇星河奉請武林中各位精通棋藝之才俊，於六月十五日駕臨河南擂鼓山天聾地啞谷一敘。”</p>\n<p class=\"content\">萬仙大會，逍遙派虛竹救走天山童姥。</p>\n<p class=\"content\">《天龍八部》第33-35回：烏老大召集三十六洞洞主和七十二島島主，密謀背叛童姥。烏老大正要處死擒獲的九歲功力的童姥，卻被虛竹出手救走。相處兩日，童姥和虛竹始知是同門叔侄。按：小說情節，當在六月下旬。“虛竹道：眼下你回覆到了十一歲時的功力，要回到九十六歲，豈不是尚須八十五天？”</p>\n<p class=\"content\">七月，天山童姥和虛竹藏身於西夏皇宮的冰庫。</p>\n<p class=\"content\">《天龍八部》第35、36回：童姥恢復到十七歲功力時，被師妹李秋水找到並肆意摧殘。虛竹揹著童姥日夜兼程，奔波六七日，躲入西夏皇宮的冰庫。按：小說情節，當在七月上旬。李秋水找到童姥時，“我還得有七十九日，方能神功還原，那時便不怕這賤人了。這七十九日，卻躲到哪裡去才好？……她此時已回覆到十七歲時的功力，與李秋水相較雖然大大不如，彈指殺鴉卻是輕而易舉。”</p>\n<p class=\"content\">八月，天山童姥在冰庫中強迫虛竹破戒開葷。</p>\n<p class=\"content\">《天龍八部》第36回：“如此過了一個多月，童姥已回覆到六十歲時的功力，出入冰庫和御花園時直如無形鬼魅。”</p>\n<p class=\"content\">九月初三，北宋朝太皇太后崩，哲宗皇帝趙煦親政。</p>\n<p class=\"content\">《天龍八部》第49回：太皇太后，即宋英宗的皇后高氏。英宗之子神宗在位的時候，王安石於1069年實施變法，遭到司馬光、蘇軾等保守派的阻撓。1085年，神宗駕崩，其子哲宗登基，大權操縱在高太后手中，司馬光、蘇軾得到重用，王安石的新法被逐一廢除。哲宗做了九年傀儡皇帝。本月初三，太皇太后崩，哲宗正式親政。據《宋史·哲宗本紀》元祐八年：“九月，戊寅（初三），太皇太后崩。己卯（初四），詔以太皇太后園陵為山陵。庚辰（初五），遣使告哀於遼。”</p>\n<p class=\"content\">中旬，逍遙派虛竹與西夏公主李清露在冰庫相會。</p>\n<p class=\"content\">《天龍八部》第36回：天山童姥為了破除虛竹的淫戒，從而控制為己所用，將西夏公主李清露帶到冰庫。虛竹忽近女色，如膠似漆，兩人以“夢郎”、“夢姑”相稱。按：“虛竹今年二十四歲……這位姑娘今年一十七歲……原來虛竹在冰庫中已近二月，再加上先前的日子，光頭上早已生了三寸來長的頭髮。……童姥和他相處將近三月，已摸熟了他的脾氣。”</p>\n<p class=\"content\">下旬，天山童姥去世，靈鷲宮奉虛竹為主人。</p>\n<p class=\"content\">《天龍八部》第36、37回：童姥在虛竹身上種下生死符，並傳授其製作、破解生死符的法門。童姥的神功練成之日（歷時90天，大致是五月3天，六月5天，七月30天，八月30天，九月22天），師妹李秋水終於來到冰庫，生死相搏後兩敗俱傷，童姥和李秋水先後死去。靈鷲宮九天九部，按童姥遺囑，尊逍遙派掌門虛竹為主人。按：“日子過得好快，不知不覺，居然整整三個月過去了。”</p>\n<p class=\"content\">十月上旬，虛竹、段譽結為兄弟，共尊蕭峰為大哥。</p>\n<p class=\"content\">《天龍八部》第37-39回：虛竹率領部眾回到縹緲峰靈鷲宮，遭到要求破解生死符的三十六洞洞主、七十二島島主的圍攻。大理段譽為其解圍，兩人結為兄弟，並共尊蕭峰為大哥。虛竹慈悲為懷，幫助各位洞主、島主逐個拔除生死符。按：“餘婆和這位新主人同行了十來日，早知他忠厚老實，不通世務。”</p>\n<p class=\"content\">月底，逍遙派虛竹回到少林寺，罰在菜園挑糞澆菜。</p>\n<p class=\"content\">《天龍八部》第39回：虛竹花了二十餘天時光，才拔除乾淨群豪身上的生死符，而虛竹的武功亦與日俱進。虛竹回到少林寺，因違犯殺戒、淫戒、葷戒、酒戒，被罰在菜園做工懺悔。</p>\n<p class=\"content\">十一月初十，少林寺英雄大會。</p>\n<p class=\"content\">《天龍八部》第39-43回：聚賢莊遊氏雙雄之後遊坦之，化名莊聚賢，出任丐幫新幫主。他廣為散發英雄帖，邀請天下英雄聚集少林，推選武林盟主。姑蘇慕容復、星宿派丁春秋、丐幫遊坦之圍攻契丹人蕭峰，逍遙派虛竹、大理段譽出手為蕭峰助拳。慕容復之父慕容博、蕭峰之父蕭遠山現身亮相，三十多年前神秘的雁門關事件來龍去脈真相大白。蕭遠山揭秘虛竹的身世，少林方丈玄慈、四大惡人之一葉二孃雙雙自盡。蕭遠山與慕容博之間的生死大仇，被藏經閣一武功卓絕的掃地老僧化解，兩人一起皈依佛門。按：“這一日正是十一月初十。”</p>\n<p class=\"content\">中旬，蕭峰、虛竹、段譽和慕容復前往西夏，觀摩公主招親。</p>\n<p class=\"content\">《天龍八部》第44回：西夏銀川公主，即在西夏皇宮冰庫與虛竹幽會的“夢姑”李清露，因思念“夢郎”，佈告天下，定於明年三月清明招親。大理段譽奉父王之命前去求親，以為國家強援；蕭峰正好要去靈鷲宮，為阿紫治眼睛；虛竹是隨大流，無可無不可。慕容復出於復國大計前去招親，志在必得。</p>\n<p class=\"content\">1094年　宋哲宗紹聖元年（蕭峰33歲）</p>\n<p class=\"content\">三月，吐蕃王子宗贊前往西夏，應聘駙馬。</p>\n<p class=\"content\">《天龍八部》第45回：鳩摩智是吐蕃國師，因求親成敗有關吐蕃國運，當即派遣高手武士對付各地前來競爭駙馬的敵手。在三月初一前後，吐蕃國師的武士已將數百名聞風而來的貴族少年、江湖豪客都逐了回去。</p>\n<p class=\"content\">西夏銀川公主選中虛竹為駙馬。</p>\n<p class=\"content\">《天龍八部》第44-46回：因慕容復、鳩摩智的陷害，段譽和王語嫣相繼跌入一口枯井，生死關頭，兩人互訴傾慕之情。慕容復有心栽花，虛竹無意插柳，銀川公主考試擇婿，終於找到了冰庫中的夢郎虛竹。段譽聞說父親鎮南王遇險，匆匆返回大理。按：“次日是三月初七，離清明尚有二日。”</p>\n<p class=\"content\">四月，北宋朝大臣蘇軾、蘇轍兄弟相繼被貶。</p>\n<p class=\"content\">《天龍八部》第49回：蘇軾、蘇轍兄弟當年反對王安石變法，在太皇太后垂簾聽政期間受到重用。現下太皇太后一死，哲宗皇帝便貶逐蘇軾、蘇轍，朝野人人自危。《宋史·哲宗本紀》紹聖元年：“三月丁酉（二十六），賜禮部奏名進士、諸科及第出身九百七十五人。蘇轍罷。……夏四月壬子（十一），蘇軾坐前掌制命語涉譏訕，落職知英州。”</p>\n<p class=\"content\">五月，大理王子段譽在成都遭到王夫人的毒手。</p>\n<p class=\"content\">《天龍八部》第47回：段譽帶著王語嫣、鍾靈、木婉清奔赴大理，在成都遇上語嫣之母王夫人。王夫人因愛生恨，正與外甥慕容復設計陷害鎮南王段正淳。段譽一行均被王夫人的醉人蜂迷倒。按：“三五月間氣候漸熱，毒蟲毒蚊萌生，為害最大，……這一晚正當月盡夜，星月無光。”</p>\n<p class=\"content\">六月，大理鎮南王段正淳的王妃和情人全部遇害，段譽的身世揭秘。</p>\n<p class=\"content\">《天龍八部》第47-48回：姑蘇慕容復為了光復大燕，認四大惡人之首段延慶為義父，計劃讓保定帝傳位給段正淳，段正淳傳位給段延慶，段延慶再傳位給慕容復，從而取得大理江山。為了逼迫段正淳就範，慕容復相繼殺害了段正淳的情人秦紅棉、甘寶寶、李青蘿，還殺害了王妃刀白鳳。刀白鳳臨終之前，為了保住段譽之命，坦白了段譽身世。段延慶飄然而去。按：“這醉人蜂刺了人之後，便會將人麻倒，令人四五日不省人事。段譽心下一驚：難道我已暈倒了四五日？”</p>\n<p class=\"content\">八月，蕭峰義退遼兵，與阿紫自盡。</p>\n<p class=\"content\">《天龍八部》第49-50回：遼帝耶律洪基聽說南宋少年皇帝趙煦斥逐重臣，便欲興兵攻宋，令南院大王蕭峰為平南大元帥。蕭峰不願看到戰亂又起，生靈塗炭，請求辭官隱居山林。兩個多月後，耶律洪基率遼軍追擊中原群豪至雁門關，蕭峰在兩軍陣前挾持遼帝，迫其退兵並承諾，終其一生，不許遼軍一兵一卒越宋遼疆界。蕭峰身為遼人，自責此舉有違忠義，自殺身亡。阿紫悲痛欲絕，抱著蕭峰的屍體跳下懸崖。遊坦之熱戀阿紫，殉情而死。按：“兩個多月來蕭峰全無掙扎脫逃之意，監視他的官兵已遠不如先前那般戒慎提防。”</p>\n<p class=\"content\">是年，大理保定帝段正明出家為僧，權臣高升泰篡位。</p>\n<p class=\"content\">李大莊《簡明大理史：段郎的風花雪月》：段正明在位（1082-1094年）時，權臣高智升之子高升泰為相，權勢熏天，至此終於撕破臉皮，廢段正明而自立，改元“上治”，正式取代段氏在大理的統治地位。</p>\n<p class=\"content\">1096年　宋哲宗紹聖三年（段譽24歲）</p>\n<p class=\"content\">大理國主高升泰去世，鎮南王段正淳即位。</p>\n<p class=\"content\">李大莊《簡明大理史：段郎的風花雪月》：權臣高升泰篡位兩年後去世，迫於國內各方勢力的制約，遺囑其子高泰明還政於段氏。高泰明在父親去世後，擁立保定帝之弟、鎮南王段正淳，是為文安帝。段氏王位失而復得，史稱“後理國”。《中國通史》卷七：宋紹聖元年（1094年），大理國權臣、白族封建主高升泰奪取政權，稱“大中國”。兩年之後，高升泰的兒子高泰明被迫把政權重新歸還段氏，以段正淳為國王。</p>\n<p class=\"content\">1108年　宋徽宗大觀二年（段譽36歲）</p>\n<p class=\"content\">大理文安帝段正淳出家為僧，其子段譽即位。</p>\n<p class=\"content\">《天龍八部》第50回：文安帝段正淳自命為中興之主，在位十三年（1096-1208年）。是年，段正淳出家為僧，禪位其子段正嚴（又名段和譽），是為宣仁帝。段譽隆重舉辦登基大典，自明年起改元“日新”。段譽恭諡父親段正淳為中宗文安帝，母親刀白鳳為慈和文安皇后。據李大莊《簡明大理史：段郎的風花雪月》。第50回將段正淳之死剪貼在保定帝出家之年。</p>\n<p class=\"content\">姑蘇慕容復的復國夢徹底破滅。</p>\n<p class=\"content\">《天龍八部》第50回：慕容復神志昏亂，淪落山林，王語嫣、阿碧不忘舊情，追隨如故。段譽立木婉清為貴妃、鍾靈為賢妃、西夏銀川公主的丫頭曉蕾為淑妃，在位四十年後（1147年）傳位其子段正興，段正興在位二十五年後（1171年）傳位其子段智興。段智興即《射鵰英雄傳》中華山論劍的五絕之一——南帝段皇爺。據李大莊《簡明大理史：段郎的風花雪月》。</p>"},{"title":"《射鵰英雄傳》故事編年（1204-1227）","content":"</a>\n<p class=\"sectionTitle\">《射鵰英雄傳》故事編年（1204-1227）</p>\n<p class=\"content\">【背景】12世紀10年代，遼國東部的女真族建立金政權。20年代，金政權滅遼、滅北宋。宋南遷，形成南宋、金、夏鼎足之勢。13世紀初，成吉思汗在金國北部建立蒙古國；10年代，蒙古國攻宋、攻金，西征花剌子模；20年代，蒙古國滅西夏，成吉思汗去世。南宋積弱不振，在蒙古和金國的夾縫中苟安偷生。</p>\n<p class=\"content\">【概要】江湖主要門派有全真教、大理派、丐幫、桃花島派和西毒派，鐵掌幫、江南七怪也在江湖存名立足。郭靖之父為金人所害，郭靖隨寡母寄居蒙古，拜江南七怪為師，娶桃花島公主黃蓉為妻，融會全真教和丐幫的武學精要，遂成一代大俠。郭靖深得蒙古成吉思汗的器重，被封為“金刀駙馬”。</p>\n<p class=\"content\">【紀年】楊康之子楊過生於甲申年（1224年），當時郭靖十九歲，由此知郭靖生於1205年；黃蓉之母生於猴年（1188年），二十歲時難產而死，由此知黃蓉生於1208年。故事開始時郭靖之母始懷孕，是在1204年；故事結束時成吉思汗逝世，是在1227年。</p>\n<p class=\"content\">1115年　宋徽宗政和五年（段譽43歲）</p>\n<p class=\"content\">北宋朝黃裳奉命刻印《萬壽道藏》。</p>\n<p class=\"content\">《射鵰英雄傳》第16回：“咱們大宋以前有個皇帝，叫做徽宗。徽宗皇帝信的是道教，他於政和年間，遍搜普天下道家之書，雕版印行，一共有五千四百八十一卷，稱為《萬壽道藏》。皇帝委派刻書之人，叫做黃裳……他生怕這部大道藏刻錯了字，皇帝發覺之後不免要殺他的頭，因此上一卷一卷的細心校讀。不料想這麼讀得幾年，他居然便精通道學，更因此而悟得了武功中的高深道理。他無師自通，修習內功外功，竟成為一位武功大高手。”後記：“《射鵰英雄傳》中所說的黃裳（1043-1129年）真有其人。近人陳國符先生《道藏源流考》中考證宋徽宗訪求天下道教遺書刻版的經過頗詳。徽宗於政和三年下詔天下訪求道教仙經，所獲甚眾。政和五年設經局，敕道士校定，送福州閩縣，由郡守黃裳役工鏤版。所刊道藏稱為《政和萬壽道藏》，共五百四十函，五千四百八十一卷。黃裳，字晟仲，人稱演山先生，福建延平人，高宗建炎三年卒，年八十七。”《宋史·徽宗本紀》政和三年：“十二月，癸丑（初六），詔天下訪求道教仙經。”</p>\n<p class=\"content\">1120年　宋徽宗宣和二年（段譽48歲）</p>\n<p class=\"content\">北宋朝黃裳奉命剿滅方臘明教。</p>\n<p class=\"content\">《射鵰英雄傳》第16回：“那黃裳練成了一身武功，還是做他的官兒。有一年他治下忽然出現了一個希奇古怪的教門，叫作什麼摩尼教，又叫明教，據說是西域的波斯胡人傳來的。……徽宗皇帝只信道教，他知道之後，便下了一道聖旨，要黃裳派兵去剿滅這些邪魔外道。……打了幾仗，黃裳帶領的官兵大敗。他心下不忿，親自去向明教的高手挑戰，一口氣殺了幾個什麼法王、什麼使者。……那些人氣不過，將他家裡的父母妻兒殺了個乾乾淨淨。”《倚天屠龍記》第19回：“我明教源於波斯國，唐時傳至中土。……只因歷朝貪官汙吏欺壓我教，教中兄弟不忿，往往起事，自北宋方臘方教主以來，已算不清有多少次了。張無忌也聽到過方臘的名頭，知他是北宋宣和年間的四大寇之一，和宋江、王慶、田虎等人齊名。”《宋史·方臘列傳》：宣和二年（1120）十月，方臘在青溪縣誓師起義。宣和三年（1121）四月，在童貫大軍的征剿下，方臘戰敗被俘；八月，方臘被殺於京城開封。</p>\n<p class=\"content\">1125年　宋徽宗宣和七年（段譽53歲）</p>\n<p class=\"content\">十二月二十三，金兵大舉南侵，北宋朝徽宗帝退位。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：“想當年徽宗道君皇帝一心只想長生不老，要做神仙，所用的奸臣，像蔡京、王黼，是專幫皇帝搜刮的無恥之徒；像童貫、梁師成，是隻會吹牛拍馬的太監；像高俅、李邦彥，是陪皇帝嫖院玩耍的浪子。道君皇帝正事諸般不理，整日裡若不是求仙學道，便是派人到處去找尋希奇古怪的花木石頭。一旦金兵打到眼前來，他束手無策，頭一縮，便將皇位傳給了兒子欽宗。”據《宋史·徽宗本紀》宣和七年：“十二月，庚申（二十三），詔內禪，皇太子即皇帝位。尊帝為教主道君太上皇帝，居於龍德宮。尊皇后為太上皇后。”</p>\n<p class=\"content\">1126年　宋欽宗靖康元年（段譽54歲）</p>\n<p class=\"content\">閏十一月二十五，北宋京城汴梁失守。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：“那時忠臣李綱守住了京城汴梁，各路大將率兵勤王，金兵攻打不進，只得退兵，不料想欽宗聽信了奸臣的話，竟將李綱罷免了，又不用威名素著、能征慣戰的宿將，卻信用一個自稱能請天神天將、會得呼風喚雨的騙子郭京，叫他請天將守城。天將不肯來，這京城又如何不破？”據《宋史·欽宗本紀》靖康元年：“二月，戊戌（初二），罷李綱以謝金人，廢親征行營司。……十一月，丁丑（十六），命成忠郎郭京領選六甲正兵所。……閏十一月，丙辰（二十五），妖人郭京用六甲法，盡令守禦人下城，大啟宣化門出攻金人，兵大敗。京託言下城作法，引餘兵遁去。金兵登城，眾皆披靡。……京城陷。”</p>\n<p class=\"content\">1127年　宋欽宗靖康二年（段譽55歲）</p>\n<p class=\"content\">五月初一，北宋滅亡，南宋開始。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：“終於徽宗、欽宗都給金兵擄了去。這兩個昏君自作自受，那也罷了，可害苦了我中國千千萬萬百姓。……後來康王在南京接位做皇帝，手下有韓世忠、嶽爺爺這些天將，本來大可發兵北伐，就算不能直搗黃龍，要收復京城汴梁，卻也並非難事。只恨秦檜這奸賊一心想議和，卻把嶽爺爺害死了。”據《宋史·欽宗本紀》靖康二年：“夏四月庚申朔（初一），大風吹石折木。金人以帝及皇后、皇太子北歸。……五月庚寅朔（初一），康王即位於南京，遙上尊號曰孝慈淵聖皇帝。”</p>\n<p class=\"content\">1129年　金太宗天會七年（段譽57歲）</p>\n<p class=\"content\">宋朝黃裳去世。</p>\n<p class=\"content\">《射鵰英雄傳》第16回：黃裳練成絕世武功後，原來的仇人已無跡可循。“那黃裳心想，原來我也老了，可也沒幾年好活啦。他花了這幾十年心血，想出了包含普天下各家各派功夫的武學，過得幾年，也染上了那誰也逃不過的瘟疫，這番心血豈不是就此湮沒？於是他將所想到的法門寫成了上下兩卷書，那是甚麼？咱們說了半天，說的就是《九陰真經》的來歷。”黃裳匯合天下各派武功，編撰《九陰真經》上下兩卷（準確時間不詳，當在剿滅方臘明教之後）。黃裳去世，年八十七。《九陰真經》後來成為武林人物爭奪不休的秘笈。</p>\n<p class=\"content\">1140年　金熙宗天眷三年（段譽68歲）</p>\n<p class=\"content\">七月初七，南宋朝將領岳飛抗金，郾城大捷。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：“當年嶽爺爺幾個勝仗，直殺得金兵血流成河，屍積如山，只有逃命之力，更無招架之功，而北方我中國義民，又到處起兵抄韃子的後路。金人正在手忙腳亂、魂不附體的當兒，忽然高宗送到降表，說要求和。金人的皇帝自然大喜若狂，說道：議和倒也可以，不過先得殺了岳飛。”據《宋史·高宗本紀》紹興十年：“秋七月，己酉（初七），岳飛及兀朮戰於郾城縣，敗之。”</p>\n<p class=\"content\">1141年　金熙宗皇統元年（段譽69歲）</p>\n<p class=\"content\">十月十三，南宋朝岳飛入獄，留下《武穆遺書》。</p>\n<p class=\"content\">《射鵰英雄傳》第9回：“原來岳飛給關在獄中之時，知道已無活命之望，他這人精忠報國，倒是不假，竟把生平所學的行軍佈陣、練兵攻伐的秘要，詳詳細細的寫了一部書，只盼得到傳人，用以抗禦金兵。”岳飛在獄中著成的《武穆遺書》，後來成為宋、金兩國競相查訪的秘笈。據《宋史·高宗本紀》紹興十一年：“冬十月，戊寅（十三），詔修玉牒。下岳飛、張憲大理獄，命御史中丞何鑄、大理卿週三畏鞫之。”</p>\n<p class=\"content\">二十八，南宋朝韓世忠削除兵權，上官劍南加入鐵掌幫。</p>\n<p class=\"content\">《射鵰英雄傳》第32回：“那上官劍南原是韓世忠部下的將領。秦檜當權後岳飛遭害，韓世忠給削除兵權，落職閒住。他部下官兵大半也解甲歸田。上官劍南憤恨奸臣當道，領著一批兄弟在荊湖一帶落草，有的到襄陽去投軍守城，上官劍南則入了鐵掌幫。不久老幫主去世，他接任幫主之位。這鐵掌幫本來只是個小小幫會，二十多年中經他力加整頓，多行俠義之事，兩湖之間的英雄好漢、忠義之士聞風來歸，不過數年聲勢大振，在江湖上浸尋已可與北方的丐幫分庭抗禮。上官劍南心存忠義，雖然身在草莽，卻是念念不忘衛國殺敵、恢復故土，經常派遣部屬在臨安、汴梁等地打探消息，以待時機。”據《宋史·高宗本紀》紹興十一年：“冬十月，癸巳（二十八），韓世忠罷為醴泉觀使，封福國公。”《中國通史》卷七：紹興十一年（1141）……十月罷樞密使，以醴泉觀使、奉朝請。韓世忠“自此杜門謝客，絕口不言兵，時跨驢攜酒，從一二童奴遊西湖以自樂，平時將佐，罕得見其面”。</p>\n<p class=\"content\">南宋朝黃藥師全家充軍雲南。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：“師父是浙江世家，書香門第，祖上在太祖皇帝時立有大功，一直封侯封公，歷朝都做大官。師父的祖父在高宗紹興年間做御史。這一年奸臣秦檜冤害大忠臣岳飛，師父的祖父一再上表為岳飛申冤，皇帝和秦檜大怒，不但不準，還將他貶官。太師祖忠心耿耿，在朝廷外大聲疾呼，叫百官和眾百姓大夥兒起來保岳飛。秦檜便將太師祖殺了，家屬都充軍去雲南。師父是在雲南麗江出生的。”</p>\n<p class=\"content\">十一月，宋、金簽訂停戰和約。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：岳飛入獄一個月後，宋、金兩國議和成功，“以淮水中流為界，高宗皇帝向金國稱臣……他在降表中寫道：臣構言：既蒙恩造，許備藩國，世世子孫，謹守臣節。每年皇帝生辰並正旦，遣使稱賀不絕。歲貢銀二十五萬兩，絹二十五萬匹。”據《宋史·高宗本紀》紹興十一年：“十一月，與金國和議成。”</p>\n<p class=\"content\">十二月二十九，南宋朝岳飛在風波亭遇害。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：“於是秦檜定下奸計，在風波亭中害死了嶽爺爺。”據《宋史·高宗本紀》紹興十一年：“十二月，癸巳（二十九），賜岳飛死於大理寺，斬其子云及張憲於市，家屬徙廣南，官屬於鵬等論罪有差。”</p>\n<p class=\"content\">1151年　金海陵王天德三年</p>\n<p class=\"content\">鐵掌幫得《武穆遺書》。</p>\n<p class=\"content\">《射鵰英雄傳》第32回：“事隔多年，鐵掌幫中一名兄弟與當年看守岳飛的一名獄卒交好，得悉岳飛死後遺物入官，其中有一部兵法遺書，輾轉打聽之下，竟得悉是在皇宮之中。這訊息快馬報到鐵掌峰上，上官劍南即日盡點幫中高手，傾巢東下，夜入深宮，毫不費力的便將遺書《破金要訣》盜了出來，當晚持書去見舊主韓世忠。此時韓世忠年紀已老，在西湖邊上隱居，見到上官劍南送來的岳飛遺書，想起英雄冤死、壯志未酬，不由得拔劍斫案、扼腕長嘆。”按：上官劍南盜書確切時間不詳，當在1151年韓世忠去世之前，姑繫於此。《宋史·高宗本紀》紹興二十一年：“八月，壬申（初五），韓世忠薨，詔進太師致仕。”</p>\n<p class=\"content\">1161年　金世宗大定元年</p>\n<p class=\"content\">南宋朝道士王重陽隱居古墓。</p>\n<p class=\"content\">《神鵰俠侶》第4回：“我恩師不是生來就做道士的。他少年時先學文，再練武，是一位縱橫江湖的英雄好漢，只因憤恨金兵入侵，毀我田廬，殺我百姓，曾大舉義旗，與金兵對敵，占城奪地，在中原建下了轟轟烈烈的一番事業，後來終以金兵勢盛，先師連戰連敗，將士傷亡殆盡，這才憤而出家。那時他自稱活死人，接連幾年，住在本山的一個古墓之中，不肯出墓門一步，意思是雖生猶死，不願與金賊共居於青天之下，所謂不共戴天，就是這個意思了。”據天樂道人李道謙《七真年譜》：“宋徽宗政和二年壬辰（1112），重陽祖師生於是年十二月二十二日。……世宗大定元年辛巳，重陽祖師年五十。於終南南時村鑿壙丈餘，封高數丈，以活死人目之，坐於墓中。”</p>\n<p class=\"content\">1163年　金世宗大定三年</p>\n<p class=\"content\">南宋朝道士王重陽出古墓，創立全真教。</p>\n<p class=\"content\">《神鵰俠侶》第4回：王重陽心灰意懶，不肯出古墓。其紅顏知己林朝英激其出墓比武。王重陽比輸後，將古墓讓給林朝英和丫鬟居住，自己在終南山古墓旁邊蓋了一座小小道觀，正是重陽宮的前身。數年之中，先後收馬鈺、孫不二、譚處端、劉處玄、丘處機、郝大通、王處一為弟子，建立全真教。據天樂道人李道謙《七真年譜》：“大定三年癸未，重陽祖師年五十二。秋，填活死人墓，遷劉蔣村結茅，與玉蟾和公、靈陽李公三人同居，即今之祖庭重陽萬壽宮也。”</p>\n<p class=\"content\">編者按：小說記載當時王重陽約三十歲，林朝英二十五六歲，林朝英的丫鬟十四五歲。《神鵰俠侶》第5回：“西壁畫中是兩個姑娘。一個二十五六歲，正在對鏡梳妝，另一個是十四五歲的丫鬟，手捧面盆，在旁侍候。”《神鵰俠侶》第28回：“只見畫中道人手挺長劍，風姿颯爽，不過三十來歲年紀，肖像之旁題著活死人三字。”實際上王重陽當時已經五十出頭。金庸小說中關於全真教主王重陽和全真七子生卒年代的敘述，與史料記載均有很大的出入。如史料記載王重陽去世在1170年，小說裡卻記在黃藥師新婚之年（1205）；再如史料記載丘處機去世在1227年，小說裡卻記在楊過襄陽保衛戰（1259）之後。</p>\n<p class=\"content\">桃花島主黃藥師出生。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：黃藥師祖父被殺，全家充軍雲南。黃藥師出生在雲南麗江，從小不尊聖賢之道，被父親趕出家門。他在江湖上非聖毀祖，謗罵朝廷，人稱“黃老邪”。後來他乾脆在桃花島上遠避塵世，收徒授武。按（1203年）：“我（梅超風）年紀一天天地大了起來。這年快十五歲了，拜入師父門下已有三年多了，讀書武功都已學了不少。……大師哥三十歲，大了我一倍。……過了幾天，我問曲師哥：師父為什麼自稱黃老邪？這稱呼可夠難聽的，師父不過大得你十來歲吧。”</p>\n<p class=\"content\">1169年　金世宗大定九年（黃藥師6歲）</p>\n<p class=\"content\">四月，全真教王重陽結識師弟周伯通。</p>\n<p class=\"content\">金密國公金源鑄撰《全真教祖碑》：“[金大定]九年己丑四月，寧海周伯通者，邀先生住庵，榜曰金蓮堂，夜有神光照耀如晝，人以為火災，近之，見先生行光明中。”《射鵰英雄傳》第16回：“周伯通眉飛色舞，說道，是啊。我和王師哥交情大得很，他沒出家時我們已經是好朋友，後來他傳我武藝。他說我學武學得發了痴，過於執著，不是道家清靜無為的道理，因此我雖是全真派的，我師哥卻叫我不可做道士。”</p>\n<p class=\"content\">1188年　金世宗大定二十八年（黃藥師25歲）</p>\n<p class=\"content\">桃花島弟子梅超風出生。同年十月，黃藥師的妻子馮衡出生。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：“師母年紀很輕，和我同年，我們兩個都屬猴。”1188年歲次戊申，是猴年。</p>\n<p class=\"content\">1196年　金章宗明昌七年（黃藥師33歲）</p>\n<p class=\"content\">金朝冊封蒙古鐵木真為部落統領。</p>\n<p class=\"content\">《射鵰英雄傳》第3回：“其時金國明昌皇帝完顏璟在位，得悉漠北王罕、鐵木真等部落強盛，生怕成為北方之患，於是派了三子完顏洪熙、六子趙王完顏洪烈前去冊封官職，一來加以羈縻，二來察看各部虛實，或以威服，或以智取，相機行事。”（金庸先生將此事件剪貼在郭靖6歲）按史料記載：鐵木真是蒙古乞顏部落酋長。1162年出生；1170年父親為仇人塔塔兒部毒死，1172年與總角之交札木合結為安答（義兄弟）；1179年，拜父親的義兄弟王罕為義父，歸附於他，同年新婚妻子被蔑兒乞惕人擄去；1180年依靠王罕和札木合，打敗蔑兒乞惕人，搶回妻子；1189年被乞顏部落擁戴為汗。《中國通史》卷八：1196年，塔塔兒部叛金，金章宗命丞相完顏襄統兵討伐，塔塔兒潰敗……完顏襄以他們助徵叛部有功，承製授予脫裡王號，自此稱王罕；授鐵木真“札兀惕忽裡”（諸部統領）官號。</p>\n<p class=\"content\">1199年　金章宗承安四年（黃藥師36歲）</p>\n<p class=\"content\">桃花島弟子梅超風被賣給上虞蔣家。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：“我本來是個天真爛漫的小姑娘，整天戲耍，父母當作心肝寶貝地愛憐，那時我名字叫作梅若華。不幸父母相繼去世，我伯父、伯母收留了我去撫養，在我十一歲那年，用五十兩銀子將我賣給了一家有錢人家做丫頭，那是在上虞縣蔣家村，這家人家姓蔣。蔣老爺對我很好，蔣太太可兇得很。”</p>\n<p class=\"content\">1200年　金章宗承安五年（黃藥師37歲）</p>\n<p class=\"content\">桃花島黃藥師收梅超風為徒。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：“在我十二歲那年，我在井欄邊洗衣服，蔣老爺走過來，摸摸我的臉，笑眯眯地說道：小姑娘越長越齊整了，不到十六歲，必定是個美人兒。我轉過了頭不理他，他忽然伸手到我胸口來摸，……就這樣，我跟著師父來到桃花島，做了他的徒弟。我師父是桃花島島主黃藥師，他已有一個大弟子曲靈風、二弟子陳玄風，還有幾個年紀略小的弟子陸乘風、武罡風、馮默風。師父給我改了名字，叫做梅超風。”</p>\n<p class=\"content\">1201年　金章宗泰和元年（黃藥師38歲）</p>\n<p class=\"content\">蒙古鐵木真擊敗泰亦赤兀部，哲別歸順。</p>\n<p class=\"content\">《射鵰英雄傳》第3回：泰亦赤兀部與鐵木真部落為世仇，是年兩大部落在翰難河上游連戰數次，鐵木真頸部中矢。最後泰亦赤兀部被殲大半，鐵木真大獲全勝。泰亦赤兀部的神箭手哲別歸順鐵木真，在三王子窩闊臺手下擔任十夫長。（金庸先生將此事件剪貼在郭靖六歲）《中國通史》卷八：1201年鐵木真與札木合所率十一部聯軍會戰於闊亦田，哲別射傷鐵木真白嘴黃馬。是役，鐵木真拼死獲勝，泰赤烏部勢衰，哲別終於投奔鐵木真。</p>\n<p class=\"content\">鐵掌幫裘千仞出任幫主。</p>\n<p class=\"content\">《射鵰英雄傳》第28回：“原來裘千丈與裘千仞是同胞孿生兄弟，幼時兩人性情容貌，全無分別。到十三歲上，裘千仞無意之間救了鐵掌幫上官幫主的性命。那上官幫主感恩圖報，將全身武功傾囊相授。裘千仞到得二十四歲時，功夫浸尋有青出於藍之勢，次年上官幫主逝世，臨終時將鐵掌幫幫主之位傳給了他。當年華山論劍，王重陽等曾邀他參與。裘千仞以鐵掌神功尚未大成，自知非王重陽敵手，謝絕赴會，十餘年來隱居在鐵掌峰下閉門苦練，有心要在二次論劍時奪取武功天下第一的榮號。”按：裘千仞出任幫主確切時間不詳，當在第一次華山論劍之前。裘千仞今年25歲，至1259年去世，已是83歲高齡，因此，裘千仞出任幫主即使早於今年，亦相去無多，姑繫於此。</p>\n<p class=\"content\">冬，第一次華山論劍。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：“幾年前，武林中為了爭奪《九陰真經》這部武功秘笈而鬧得滿是腥風血雨，殺傷人無數。全真教教主王重陽真人邀集武林中武功絕頂的幾位高手到華山去比試武功，當時稱為華山論劍，言明武功最高的人掌管《九陰真經》，從此誰也不得爭鬥搶奪，使得天下江湖上覆歸太平。當時參與論劍的共有五人，稱為東邪（黃藥師）、西毒（歐陽鋒）、南帝（段智興）、北丐（洪七公）、中神通（王重陽）。論劍結果，東邪、西毒等四人都服中神通居首。”按第16回：“那時是在寒冬歲盡，華山絕頂，大雪封山。他們五人口中談論，手上比武，在大雪之中直比了七天七夜，東邪、西毒、南帝、北丐四個人終於拜服我師哥王重陽的武功是天下第一。”</p>\n<p class=\"content\">編者按：第一次華山論劍的年代，根據第二次華山論劍年代上推二十五年確定。第二次華山論劍後，郭靖和黃蓉在桃花島成婚。黃藥師和女兒女婿同住數月，不覺厭煩起來，離島而去。一別經年音訊杳然，是到了第二年。黃蓉去江湖上尋找了數月，因有身孕不得不回島。生下郭芙是在第三年，說明郭芙出生是第二次華山論劍兩年後（《神鵰俠侶》第1回）。神鵰小說裡楊過出場的時候，郭芙九歲（《神鵰俠侶》第1回）楊過十三歲（《神鵰俠侶》第2回），郭芙小四歲，說明楊過出生兩年後才是第二次華山論劍。小說交代楊過十八歲那年和公孫綠萼相遇，公孫綠萼生於甲申年（1224年），也是十八歲，可推知1224年楊過出生，1226年第二次華山論劍，1228年郭芙出生。兩次華山論劍的時間間隔是整整二十五年（《神鵰俠侶》第40回），所以第一次華山論劍應該發生在1201年。</p>\n<p class=\"content\">1202年　金章宗泰和二年（黃藥師39歲）</p>\n<p class=\"content\">全真教王重陽、周伯通訪問大理。</p>\n<p class=\"content\">《射鵰英雄傳》第30回：華山論劍翌年，全真教王重陽至大理拜訪南帝段智興，切磋武功。同去的師弟周伯通與大理貴妃劉瑛姑兩情相悅，惹出事端。王重陽帶著師弟羞慚告退。按：“那次華山論劍，各逞奇能，重陽真人對我師的一陽指甚是佩服，第二年就和他師弟到大理來拜訪我師，互相切磋功夫。……那一年全真教主重陽真人得了真經，翌年親來大理見訪，傳我先天功的功夫。他在我宮中住了半月，兩人切磋武功，言談甚是投合，豈知他師弟周伯通這十多天中悶得發慌，在我宮中東遊西逛，惹出了一場事端。”</p>\n<p class=\"content\">1203年　金章宗泰和三年（黃藥師40歲）</p>\n<p class=\"content\">桃花島弟子陳玄風和梅超風相愛。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：梅超風在桃花島三年多，讀書武功都進步不少，出落得十分美麗。大師兄曲靈風告訴她華山論劍的故事。師父黃藥師、大師兄曲靈風、二師兄陳玄風對她都懷有異常的情愫。陳玄風捷足先登，與小師妹相親相愛。是年，梅超風15歲，陳玄風17歲，曲靈風30歲，黃藥師40歲。按：“我年紀一天天地大了起來。這年快十五歲了，拜入師父門下已有三年多了，讀書武功都已學了不少。……大師哥三十歲，大了我一倍。……過了幾天，我問曲師哥：師父為什麼自稱黃老邪？這稱呼可夠難聽的，師父不過大得你十來歲吧。……二師哥粗眉大眼，全身是筋骨，比我大兩歲，但很少跟我說話。曲師哥比我大了十幾歲，陸師弟小我兩歲，武師弟、馮師弟年紀更小，在我心裡，他們都是小孩子。”</p>\n<p class=\"content\">桃花島弟子曲靈風被逐至臨安府。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：曲靈風得知陳玄風與梅超風的戀情，心生醋意，動手打陳玄風，還說梅超風欺騙了師父。黃藥師惱羞成怒，用木杖震斷曲靈風腿骨，將其逐出師門，送至臨安府牛家村。牛家村從此多了一個開酒店的跛子曲三。</p>\n<p class=\"content\">編者按：曲靈風被逐出桃花島時，梅超風究竟幾歲。小說裡有兩種表述：</p>\n<p class=\"content\">一說梅超風十五歲。第19回黃蓉說：“世上之物，是不是愈有靈性，愈不長久？只因為我媽媽絕頂聰明，這才只能活到二十歲？”我們知道，曲靈風搬到臨安府一年後，因去皇宮盜寶被追殺，當時郭靖的母親已懷孕。又過一年，郭靖出生，說明郭靖出生在曲靈風被逐出桃花島兩年以後。黃蓉小郭靖三歲，說明黃蓉出生在曲靈風被逐出桃花島五年以後。梅超風和黃蓉的媽媽同年，黃蓉的媽媽是在二十歲時生黃蓉時難產而死的，所以曲靈風被逐出桃花島時，梅超風應該是十五歲。</p>\n<p class=\"content\">另一說梅超風十八歲。第10回：“我年紀一天天地大了起來。這年快十五歲了，拜入師父門下已有三年多了，讀書武功都已學了不少。我身子高了，頭髮很長，有時在水中照照，模樣兒還真挺好看，大師哥有時目不轉睛地瞧我，瞧得我很害羞。……可真說準了，師父酒醒時，我的人真不見了，隨著二師哥陳玄風走了。……曲師哥瞧著我的眼色，一向也是挺溫柔的，那時候我已十八歲了，明白了他眼光的含意，但他成過親，老婆死了，還有個小女兒，而且我已經跟賊哥哥好了，只好避開曲師哥的眼光。……師父用一根木杖，震斷了曲師哥的兩根腿骨，向眾同門宣稱：曲靈風不守門規，以後非我桃花島弟子。命啞僕將他送歸臨安府。”</p>\n<p class=\"content\">面對這兩種說法，我們再從郭靖和楊過的生年去考察。楊過的媽媽懷孕是在郭靖十八歲，楊過出生當然是在郭靖十九歲。楊過和公孫綠萼都是生於甲申年（1224年），則郭靖生於1205年，曲靈風被逐出桃花島應該在1203年。結論是曲靈風被逐出桃花島時，梅超風十五歲。另外，第二種說法中，梅超風在十五歲時與二師哥陳玄風相愛，到十八歲時才被大師哥曲靈風察覺，也有點不近情理。</p>\n<p class=\"content\">秋，蒙古鐵木真擊敗義父王罕。</p>\n<p class=\"content\">《射鵰英雄傳》第6回：蒙古鐵木真的勢力和威望與日俱增，威脅到義父王罕的地位。王罕、桑昆父子以結姻為由，將鐵木真誘入包圍。“王罕和桑昆本來生怕鐵木真前來報仇，日日嚴加戒備，待見都史平安回來，還攜來重禮，既聽鐵木真的使者言辭極盡卑屈，又知鐵木真受了重傷，登時大為寬心，撤了守軍，連日與完顏洪烈、札木合在帳中飲宴作樂。哪知鐵木真三路兵馬在黑夜中猶如天崩地裂般衝殺進來。王罕、札木合聯軍雖然兵多，但慌亂之下，士無鬥志，登時潰不成軍。王罕、桑昆倉皇逃向西方，後來分別為乃蠻人和西遼人所殺。都史在亂軍中被馬蹄踏成了肉泥。”（金庸先生將此事件剪貼在郭靖18歲）《新元史·太祖本紀》癸亥：“桑昆謀害帝，偽許婚，請帝飲布渾察兒，譯言許婚酒也。帝率十騎以往。……秋，帝將攻王罕，遣合薩兒偽請降。王罕信之，不設備。帝晝夜兼進，襲王罕於徹徹爾溫都爾，盡俘其眾。王罕父子走死。”</p>\n<p class=\"content\">大理國貴妃劉瑛姑產下私生子。</p>\n<p class=\"content\">《射鵰英雄傳》第32回：全真教王重陽師兄弟離開大理，“此後大半年中，我沒召見劉貴妃，但睡夢之中卻常和她相會。一天晚上半夜夢迴，再也忍耐不住，決意前去探望。我也不讓宮女太監知曉，悄悄去她寢宮，想瞧瞧她在幹些甚麼。剛到她寢宮屋頂，便聽得裡面傳出一陣兒啼之聲。”段皇爺痛恨交加，從此對劉瑛姑不聞不問。按：“霜濃風寒。”</p>\n<p class=\"content\">1204年　金章宗泰和四年（黃藥師41歲）</p>\n<p class=\"content\">八月，桃花島弟子曲靈風皇宮盜寶。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：曲靈風一年多之前被逐出師門，在臨安府牛家村化名曲三，開了一家小酒店。曲三潛入皇宮盜寶，遭到大內高手的追緝。牛家村壯士郭嘯天、楊鐵心助其掩埋屍體，答應守口如瓶。郭嘯天是梁山泊好漢郭盛之後，楊鐵心是岳家軍將領楊再興之後。按：“江畔一排數十株烏桕樹，葉子似火燒般紅，正是八月天時。……原來曲三是一年多之前因死了妻子，不願再在原地住，搬到牛家村來開了家小酒店。……我兄弟倆有眼無珠，跟你老兄在牛家村同住了一年有餘，全沒瞧出你老兄是位身懷絕技的高手。”</p>\n<p class=\"content\">冬，全真教丘處機殺死宋朝使者。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：宋朝使者王道乾奉命去向金主慶賀生辰，竟跟金人勾結圖謀侵犯江南，為全真教弟子丘處機所殺。丘處機躲避官府追捕，在牛家村結識壯士郭嘯天、楊鐵心。三人聯手拒敵，將前來追捕的宋、金捕快盡數殺死。只有金國王子完顏洪烈被楊妻包惜弱誤救，得以死裡逃生。是年，郭妻、楊妻均已懷孕，丘處機分別為兩個未出世的孩子取名郭靖、楊康，以志靖康之恥。按：“秋盡冬來，過一天冷似一天。這一日晚間颳了半夜北風，便下起雪來。第二日下得更大，銀絮飛天，瓊瑤匝地，四下裡都白茫茫地。”</p>\n<p class=\"content\">1205年　金章宗泰和五年（黃藥師42歲）</p>\n<p class=\"content\">三月，牛家村風雪之變。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：金國王子完顏洪烈領路，宋國軍官段天德帶人前來牛家村緝拿郭嘯天、楊鐵心。兩位壯士奮起反抗，郭嘯天當場戰死，楊鐵心身負重傷藏身於農家。郭妻李萍被段天德劫持。楊妻包惜弱被完顏洪烈救起，完顏洪烈假充好人，一路悉心照應。按：“忽忽臘盡春回，轉眼間過了數月，包惜弱腰圍漸粗，愈來愈慵困，於那晚救人之事也漸漸淡忘了。”</p>\n<p class=\"content\">穆念慈出生臨安府。</p>\n<p class=\"content\">《射鵰英雄傳》第9回：穆念慈是臨安府荷塘村一農家之女，楊鐵心躲入她家時，她出世未久。後楊鐵心潛回牛家村探聽消息，穆念慈一家四口，有三人染瘟疫身亡。楊鐵心收穆念慈為義女，自己化名穆易，父女倆流落江湖相依為命。</p>\n<p class=\"content\">廿四，全真教丘處機與江南七怪的十八年之約。</p>\n<p class=\"content\">《射鵰英雄傳》第2、3回：丘處機追蹤宋朝軍官段天德，江南七怪不明真相加以阻攔，雙方惡鬥兩敗俱傷，段天德趁機帶著李萍遠走蒙古大漠。包惜弱以為丈夫已死，追隨完顏洪烈而去。丘處機提議，江南七怪去尋訪李萍，培養郭靖，自己去尋訪包惜弱，培養楊康，待十八年後孩子們十八歲之時，再到嘉興醉仙樓與天下英雄聚會，讓兩個孩子比試武藝，以決丘處機和江南七怪的高下。江南七怪慨然允諾。按：“今日是三月廿四，十八年後的今日正午，大夥兒在醉仙樓相會，讓普天下英雄見見，誰是真正的好漢子！”</p>\n<p class=\"content\">七月初五，南宋朝以韓侂冑為丞相。</p>\n<p class=\"content\">《射鵰英雄傳》第1回：南宋王朝偏安臨安，孝宗傳光宗，金人佔定了宋國的大半江山。光宗傳到當今天子慶元皇帝手裡，用韓侂冑為丞相。韓丞相不思恢復失地，一味作威作福。《宋史·寧宗本紀》開禧元年：“秋七月，庚申（初五），詔韓侂冑平章軍國事，立班丞相上，三日一朝，赴都堂治事。”</p>\n<p class=\"content\">十月，郭靖出生於蒙古沙漠。</p>\n<p class=\"content\">《射鵰英雄傳》第3回：郭妻李萍被段天德挾持遠走北國，逃避江南七怪追蹤。在兵荒馬亂之中，李萍與段天德走散，獨自在大漠漂泊，郭靖於此患難流離之際誕生。按：“這時雖是十月天時，但北國奇寒，這一日竟滿天灑下雪花，黃沙莽莽，無處可避風雪。……這時已是夜半，大雪初停，一輪明月從雲間鑽了出來，她陡然覺醒，不禁失聲痛哭，原來腹中胎兒已在患難流離之際誕生出來了。”</p>\n<p class=\"content\">十一月，楊康出生於金國趙王府。</p>\n<p class=\"content\">《射鵰英雄傳》第9回：楊妻包惜弱家破人亡，舉目無親，只道丈夫已死，只得隨完顏洪烈北來。是月，楊康出生在趙王府。過得年餘，包惜弱委身相嫁完顏洪烈。按第15回：“兩人敘起年紀，郭靖先出生一個月。兩人在郭嘯天靈前對拜了八拜，結為兄弟。”</p>\n<p class=\"content\">是年，桃花島黃藥師娶馮衡。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：黃藥師自從趕走了大弟子曲靈風，不再跟梅超風、陳玄風說話，也不再傳他們功夫。不久，黃藥師去了慶元府、臨安府。再過兩年，忽然娶了馮衡回到桃花島。</p>\n<p class=\"content\">全真教王重陽去世，周伯通被騙走《九陰真經》。</p>\n<p class=\"content\">《射鵰英雄傳》第17回：王重陽染上瘟疫去世，是年江浙一帶流行瘟疫，穆念慈父母也因此瘟疫而死。周伯通擔心師哥一死，西毒歐陽峰會再來奪取《九陰真經》，便帶經文去南方雁蕩山收藏，途中卻遇上了桃花島黃藥師和新婚妻子馮衡。馮衡聰慧好記，過目不忘，把《九陰真經》的內容偷記了去，反說周伯通的經書是一部算命占卜的雜書（史料記載王重陽去世在1170年）。按：“我見他滿面春風，說是新婚。”</p>\n<p class=\"content\">大理國“南帝”段皇爺棄位出家。</p>\n<p class=\"content\">《射鵰英雄傳》第31回：大理貴妃劉瑛姑生下週伯通的私生子兩年後，鐵掌幫裘千仞為了干擾段皇爺的功力長進，將這個孩子擊成重傷。瑛姑苦求段皇爺運功相救，皇爺心存嫉恨，冷漠無睹。孩子死了，瑛姑立下報仇毒誓，破窗而去。段皇爺萬念俱灰，就此出家為僧（史料記載段智興出家在1200年）。按：“過了兩年有餘，一日夜晚，我正在臥室裡打坐，忽然門帷掀起，劉貴妃衝了進來。”</p>\n<p class=\"content\">蒙古鐵木真殺安答札木合。</p>\n<p class=\"content\">《射鵰英雄傳》第6回：“札木合失了部眾，帶了五名親兵逃到唐努山上，那五名親兵乘他吃羊肉時將他擒住，送到鐵木真帳中來。鐵木真大怒，喝道，親兵背叛主人，這種不義之人，留著何用？下令將五名親兵在札木合之前斬下首級，轉頭對札木合道，咱倆還是做好朋友罷？札木合流淚道，義兄雖然饒了我性命，我也再沒臉活在世上，只求義兄賜我不流血而死，使我靈魂不隨著鮮血而離開身體。鐵木真黯然良久，說道，好，我讓你不流血而死，把你葬在我倆幼時一起遊玩的地方。札木合跪下行禮，轉身出帳，鐵木真下令用重物將他壓死，不讓流血。”（金庸先生將此事件剪貼在郭靖18歲）《新元史·太祖本紀》甲子（1204）：“秋，再議進兵，以忽以來、哲別為前鋒。……帝自臨前敵，指揮諸將大破乃蠻兵，擒太陽罕，殺之，……札木合、託黑託阿遁去。”乙丑（1205）：“是年，札木合至唐努嶺，其家奴五人執之來降。帝曰，以奴賣主，不忠莫甚焉。札木合乃五人並伏誅。”</p>\n<p class=\"content\">1206年　金章宗泰和六年（郭靖1歲）</p>\n<p class=\"content\">蒙古鐵木真稱成吉思汗。</p>\n<p class=\"content\">《射鵰英雄傳》第6回：“王罕和札木合潰敗，蒙古各族中更無人能與鐵木真相抗。鐵木真在斡難河源大會各族部眾，這時他威震大漠，蒙古各族牧民戰士，無不畏服。王罕與札木合的部眾也盡皆歸附。在大會之中，眾人推舉鐵木真為全蒙古的大汗，稱為成吉思汗，那是與大海一般廣闊強大的意思。”（金庸先生將此事件剪貼在郭靖18歲）《元史·太祖本紀》元年丙寅：“帝大會諸王群臣，建九遊白旗，即皇帝位於斡難河之源，諸王群臣共上尊號曰成吉思皇帝。是歲實金泰和之六年也。”</p>\n<p class=\"content\">桃花島弟子陳玄風、梅超風盜走《九陰真經》下卷。</p>\n<p class=\"content\">《射鵰英雄傳》第10回：黃藥師從周伯通手裡騙到《九陰真經》抄錄本，上下兩卷。中秋節之後的一個晚上，二弟子陳玄風趁師父研摩上卷出神，偷出下卷，當晚帶著師妹梅超風逃離桃花島。兩人練習真經下卷裡的陰毒功夫，人稱“黑風雙煞”，不斷受到各路英雄的圍攻。按第17回：“過了年餘，江湖上忽然有人傳言，說桃花島門下黑風雙煞得了《九陰真經》，練就了幾項經中所載的精妙武功，到處為非作歹。”</p>\n<p class=\"content\">1207年　金章宗泰和七年（郭靖2歲）</p>\n<p class=\"content\">全真教丘處機告知周伯通《九陰真經》確切下落。</p>\n<p class=\"content\">《射鵰英雄傳》第17回：周伯通先是聽江湖上傳言，桃花島門下黑風雙煞得了《九陰真經》。“又過一年，丘處機忽然到我家來，說他訪得實在，《九陰真經》的下卷確是給桃花島的門人得去了。”</p>\n<p class=\"content\">蒙古成吉思汗之女華箏出生。</p>\n<p class=\"content\">《射鵰英雄傳》第5回：成吉思汗生有四子：朮赤、察合臺、窩闊臺和拖雷，今年又生了一個女兒，名叫華箏。華箏比郭靖小兩歲。按（郭靖六歲）：“華箏這小姑娘年方四歲，哪知豹子的兇猛，笑嘻嘻地奔到哥哥身前。”</p>\n<p class=\"content\">1208年　金章宗泰和八年（郭靖3歲）</p>\n<p class=\"content\">桃花島黃蓉出生，其母馮衡流產而死。</p>\n<p class=\"content\">《射鵰英雄傳》第17回：“原來黃夫人為了幫著丈夫，記下了經文。……不料卻給陳玄風與梅超風偷去了下卷。黃夫人為了安慰丈夫，再想把經文下卷默寫出來。她對經文本來毫不明白，當日一時硬記，默了下來，到那時事隔已久，中間又讀了不少詩詞閒書，怎麼還記得起？那時她懷孕已八月有餘，苦苦思索了幾天幾晚，寫下了七八千字，卻已無法完整，心智耗竭，忽爾流產，生下了一個女嬰，她自己可也到了油盡燈枯之境。任憑黃藥師智計絕世，精通醫藥，終於也救不了愛妻的性命。”這個女嬰就是黃蓉，小郭靖三歲。按：黃夫人與梅超風同年，去世時年方二十。第19回：“世上之物，是不是愈有靈性，愈不長久？只因為我媽媽絕頂聰明，這才只能活到二十歲？”</p>\n<p class=\"content\">又按：郭靖黃蓉相遇的時候，郭靖十八歲，黃蓉十五歲。①第7回：郭靖十八歲赴嘉興醉仙樓之約，在張家口初遇女扮男裝的黃蓉，只見“那少年約莫十五六歲年紀，頭上歪戴著一頂黑黝黝的破皮帽，臉上手上全是黑煤，早瞧不出本來面目”。②第8回：郭靖再遇恢復了女兒裝的黃蓉，“那船慢慢蕩盡，只見那女子方當韶齡，不過十五六歲年紀，肌膚勝雪，嬌美無比。”③第21回：“黃藥師與歐陽鋒的武功本來不相伯仲，可是黃蓉還只盈盈十五，歐陽克卻已年過三旬，兩人學藝的時日相差幾達二十年，何況男女體力終究有別。”④第25回：“黃蓉與亡母容貌本極相似，這副情狀當時曾使黃藥師如痴如狂，雖然時隔十五年，每日仍是如在目前。”⑤《神鵰俠侶》第12回：“黃蓉自十五歲上與郭靖相識，對資質遲鈍之人相處已慣，魯有腳記心不好，她倒也並不著惱。”</p>\n<p class=\"content\">桃花島黃藥師與全真教周伯通大戰桃花島。</p>\n<p class=\"content\">《射鵰英雄傳》第10、17回：周伯通約了全真七子去找黑風雙煞，誰知兩人已逃得不知去向。周伯通只好去找黃藥師，方知黃藥師的妻子為了默寫經文，已經難產而死。黃藥師遷怒於周伯通，兩人大戰桃花島。周伯通打輸了，被囚禁在桃花島十五年。正是這個時候，黑風雙煞在盜取真經兩年後，再去桃花島，想偷取《九陰真經》上卷，方知道師母已經流產而死，還目睹了黃藥師與周伯通的桃花島大戰。按：“這樣心驚膽戰地過了兩年，我獨個兒常常想，早知這樣，盜什麼勞什子的真經，還不如安安靜靜地在桃花島好。”</p>\n<p class=\"content\">十月初十，南宋朝以史彌遠為丞相。</p>\n<p class=\"content\">據《宋史·寧宗本紀》嘉定元年：“冬十月，丙子（初十），以錢象祖為左丞相，史彌遠為右丞相。”</p>\n<p class=\"content\">1209年　金衛紹王大安元年（郭靖4歲）</p>\n<p class=\"content\">桃花島弟子黑風雙煞殺柯辟邪。</p>\n<p class=\"content\">《射鵰英雄傳》第4、10回：黑風雙煞第二次離開桃花島，“有一天，我們在一座破廟裡練‘摧心掌’，突然四面八方的給數十名好手圍住了。領頭的是師弟陸乘風。……那飛天神龍柯辟邪是賊漢子殺的，還是我殺的？可記不清楚了，反正誰殺的都是一樣。”柯辟邪是江南七怪之首柯鎮惡的兄長，柯鎮惡當時正在山東追尋郭妻李萍下落，沒有前往參戰。按（郭靖六歲）：“那銅屍是男人，鐵屍是女人，江湖上稱為黑風雙煞。幾年前他們初練九陰白骨爪，為害忠良，我兄長受人之邀，前去圍攻除害。追尋多年，直到兩年前這才遇上，激鬥之中，我兄長死在他們手裡。”</p>\n<p class=\"content\">1211年　金衛紹王大安三年（郭靖6歲）</p>\n<p class=\"content\">十月，郭靖拜江南七怪為師。</p>\n<p class=\"content\">《射鵰英雄傳》第3、4回：飛天蝙蝠柯鎮惡帶著江南七怪，按照與全真教丘處機的約定，六年多來在沙漠中、草原上到處打聽段天德和李萍的行蹤。這一天與六歲的郭靖不期而遇，江南七怪欣喜若狂。按：“忽忽數年，孩子已經六歲了。李萍依著丈夫的遺言，替他取名為郭靖。這孩子學話甚慢，有點兒呆頭呆腦，直到四歲時才會說話，好在筋骨強壯，已能在草原上放牧牛羊。”“這一年方當十月，郭靖騎了一匹小馬，帶了一條牧羊犬出去牧羊。”又按：“這幾人便是江南七怪。他們自南而北，一路追蹤段天德直到大漠，此後就再也沒了消息。六年多來，他們在沙漠中、草原上到處打聽段天德和李萍的行蹤，七人都學會了一口蒙古話，但段李兩人卻始終渺無音訊。”</p>\n<p class=\"content\">江南七怪惡鬥黑風雙煞。</p>\n<p class=\"content\">《射鵰英雄傳》第4回：江南七怪在蒙古沙漠發現黑風雙煞的蹤跡，為替老大柯鎮惡的兄長報仇，江南七怪不顧武功懸殊，埋伏在荒山實施突襲。惡鬥之中，梅超風的雙目被柯鎮惡的毒菱打瞎，抱恨終生；陳玄風被劫持在懷的郭靖用匕首刺中罩門，命喪荒山；七怪之一張阿生為了救護小妹韓小瑩，被“九陰白骨爪”當場打死。按第14回：“梅前輩，晚輩當年還只六歲，孩童無知，誤傷了陳老前輩，一人作事一人當，你只管找我。”</p>\n<p class=\"content\">1212年　金衛紹王大安四年（郭靖7歲）</p>\n<p class=\"content\">楊康拜全真教丘處機為師。</p>\n<p class=\"content\">《射鵰英雄傳》第11回：金國趙王完顏洪烈視包惜弱之子為己出，取名完顏康，百般呵護，包惜弱卻念念不忘前夫楊鐵心。金兵到牛家村楊家舊居搬取鐵槍犁頭等物品，全真教丘處機一路追蹤，訪知小王爺正是楊鐵心的骨血，便收其為徒。按第5回（郭靖16歲）：“貧道仗諸俠之福，幸不辱命，楊君子嗣，亦已於九年之前訪得矣。”</p>\n<p class=\"content\">1214年　金宣宗貞祐二年（郭靖9歲）</p>\n<p class=\"content\">李全領導的紅襖軍，成為南宋朝抗擊金兵的重要力量。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“益都青州是魯南要地，近年來金兵對蒙古連吃敗仗，聲勢衰弱，地方上的漢人揭竿起事，佔了不少地方，稱為忠義軍，奉濰州人李全為首。那李全甚是能幹，他夫人楊妙真更為了得，當時號稱二十年梨花槍，天下無敵手。再加上李全的哥哥李福，三人將金兵打得落花流水，山東義民紛紛來歸，聲勢浩大。”</p>\n<p class=\"content\">1215年　金宣宗貞祐三年（郭靖10歲）</p>\n<p class=\"content\">五月初二，蒙古成吉思汗攻陷金國中都。</p>\n<p class=\"content\">《射鵰英雄傳》第25回：“此時成吉思汗正督師伐金，與金兵在長城內外連日交兵鏖戰，……拖雷奉父王之命出使臨安，約宋朝夾擊金國。但宋朝君臣苟安東南，畏懼金兵，金兵不來攻打，已是謝天謝地，哪敢去輕捋虎鬚？因之對拖雷十分冷淡，將他安置在賓館之中，遷延不理。……及後消息傳來，蒙古出兵連捷，連金國的中都燕京也已攻下，宋朝大臣立即轉過臉色，對拖雷四王子長、四王子短，奉承個不亦樂乎。至於同盟攻金，變成毫不費力的打落水狗，尚能乘機坐收厚利，又何樂而不為？滿朝君臣立即催著訂約締盟。拖雷心中鄙夷，但還是與南宋訂了同盟攻金之約。”（金庸先生將此事件剪貼在郭靖18歲）據《金史·宣宗本紀》貞祐三年：“五月，庚申（初二），招撫山西軍民，仍降詔諭之。是日，中都破，尚書右丞相兼都元帥定國公承暉死之。戶部尚書任天寵、知大興府事高霖皆及於難。”《元史·太祖本紀》十年乙亥：“五月，庚申（初二），金中都留守完顏福興仰藥死，抹撚盡忠棄城走，明安入守之。”</p>\n<p class=\"content\">1218年　金宣宗興定二年（郭靖13歲）</p>\n<p class=\"content\">正月初十，紅襖軍首領李全歸順南宋朝。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：李全“近幾個月來連打勝仗，將淮南與山東的金兵趕得只好西退，自從岳飛、劉錡、虞允文以來，宋人從未如此大勝金兵過。臨安朝廷得訊後大喜，其時丞相史彌遠當政，便任命李全為京東路總管（其時京東路早已屬金國轄管，但宋朝仍任命京東路的官員），部下軍隊正式稱為忠義軍，以楚州（淮安）為總部。”據《宋史·寧宗本紀》嘉定十一年：“正月，壬午（初十），京東路忠義軍李全率眾來歸，詔以全為京東路總管。”</p>\n<p class=\"content\">花剌子模國王殺害蒙古使者，挑起戰端。</p>\n<p class=\"content\">《射鵰英雄傳》第36回：蒙古成吉思汗滅了西遼，與中亞大國花剌子模相鄰。花剌子模疆土有今天的蘇聯中亞部分、阿富汗、伊朗等地，國王叫摩訶末。“朮赤走上一步，大聲道，那年父王命孩兒征討該死的蔑兒乞惕人，得勝班師。那摩訶末狗王派了大軍，也來攻打蔑兒乞惕人。兩軍相遇，孩兒命使者前去通好，說道父王願與花剌子模交朋友。那紅鬍子狗王卻道：成吉思汗雖命你們不打我，真主卻命我打你們。一場惡戰，咱們打了勝仗，但因敵人十倍於我，咱們半夜裡悄悄退了兵。博爾忽說道，雖然如此，大汗對這狗王仍是禮敬有加。咱們派去商隊，但貨物被狗王搶了，商人被狗王殺了。這次派使者去修好，那狗王聽了金狗王子完顏洪烈的唆使，把大汗的忠勇使者殺了，將使者的衛兵殺了一半，另一半燒了鬍子趕回來。”（金庸先生將此事件剪貼在郭靖19歲）《中國通史》卷八：1215年，他（摩訶末）派遣一使團到東方探聽蒙古與金朝的戰爭情況。成吉思汗接見了使者，表示願與花剌子模友好通商，並遣使回訪，同時組織了一支四百多人的商隊前往花剌子模貿易。1218年，商隊抵達花剌子模邊城訛答剌（今哈薩克斯坦錫爾河中游東之齊穆耳），該城長官哈只兒只蘭禿貪圖商隊財物，竟誣為間諜，將他們盡加殺害，奪其貨物。一名倖免於難的駱駝夫逃回蒙古報告，成吉思汗憤怒至極，遣三使者問罪，又被摩訶末殺一人，二人剃鬚後驅逐出境。於是，兩國之間的戰爭不可避免了。</p>\n<p class=\"content\">1219年　金宣宗興定三年（郭靖14歲）</p>\n<p class=\"content\">閏三月，南宋朝忠義軍李全擊敗渡淮金兵。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：李全的紅襖軍被收編為忠義軍，“宋朝在江北有了一支軍隊，似乎有所振作。但朝廷雖對忠義軍發一些糧餉，其實對之十分猜忌。後來金兵渡淮，攻向長江邊，李全率軍打得金兵一敗再敗，一蹶不振。”據《宋史·寧宗本紀》嘉定十二年：“閏三月，淮南流民渡江避亂，諸城悉閉。金人遊騎數百至東採石、楊林渡，建康大震。京東總管李全自楚州、忠義總轄季先自漣水軍各引兵來援，金人乃解去。全追擊，敗之於曹家莊，獲其貴將。”</p>\n<p class=\"content\">春，蒙古成吉思汗西征花剌子模。</p>\n<p class=\"content\">《射鵰英雄傳》第36回：成吉思汗決定發動對花剌子模的戰爭，為死者報仇，並且擴大自己的統治範圍。出兵前夕，成吉思汗確定三子窩闊臺為汗位繼承人。蒙古大軍二十萬人，前軍由察合臺、窩闊臺統領，中軍由朮赤統領，自己率領主力隨後應援。進入花剌子模後勢如破竹。（金庸先生將此事件剪貼在郭靖19歲）據《新元史·太祖本紀》十四年己卯：“春，帝親征貨勒自彌，以皇弟斡赤斤留守和林。……六月，帝會諸皇子、大將於也兒的失河，議分兵討貨勒自彌。……九月，皇子察合臺、窩闊臺圍訛剌脫兒城；朮赤西北攻氈的城。”參見《元史·太祖本紀》。</p>\n<p class=\"content\">五月，蒙古成吉思汗自乃蠻詔召丘處機。</p>\n<p class=\"content\">《射鵰英雄傳》第36、37回：蒙古大軍西征途中，成吉思汗在乃蠻嚮往長生不老之術，派近臣劉仲祿持詔邀請全真教丘處機。丘處機接詔後，“心想蒙古人併吞中國之勢已成，難得成吉思汗前來相邀，正好乘機進言，若能啟他一念之善，便可令普天下千千萬萬百姓免於屠戮，實是無量功德，心中又掛念郭靖，當下帶了十餘名弟子冒寒西來。”（金庸先生將此事件剪貼在郭靖19歲）據《新元史·太祖本紀》十四年己卯：“五月，遣劉仲祿佩金虎符，徵道士丘處機於登州。”參見《元史·釋老列傳》、《長春真人西遊記》、《中國通史》卷八。</p>\n<p class=\"content\">1220年　金宣宗興定四年（郭靖15歲）</p>\n<p class=\"content\">夏，古墓派小龍女出生，屬龍。</p>\n<p class=\"content\">《神鵰俠侶》第4回：全真教的本部設在終南山重陽宮，是夜宮中弟子發現宮外包袱中裹著一個嬰兒。當時掌教馬鈺不在山上，丘處機去了西域，眾弟子正沒理會，山後古墓中林朝英的丫鬟走出來，收留了這個屬龍的不知姓名的女嬰。按1238年：“今日是那姓龍女子十八歲生辰。……十八年前的一天夜裡，重陽宮外突然有嬰兒啼哭之聲，宮中弟子出去察看，見包袱中裹著一個嬰兒，放在地下。”</p>\n<p class=\"content\">編者按：林朝英的丫鬟當時是一箇中年婦人，按照《神鵰俠侶》第5回的說法，1163年王重陽出古墓時那個丫鬟十四五歲，到小龍女出生時，那個丫鬟已經七十出頭了。事實上，金庸小說中關於全真教人物活動年代的記載，均比史料記載下移了三十多年，如史料記載王重陽去世在1170年，小說卻記在黃藥師新婚之年1205年；史料記載丘處機去世在1227年，小說卻記在楊過襄陽保衛戰1259年等。因此，小說裡王重陽出古墓的時間，大致在1190年左右。</p>\n<p class=\"content\">五月，蒙古成吉思汗攻克花剌子模的首都撒麻爾罕。</p>\n<p class=\"content\">《射鵰英雄傳》第37回：蒙古大軍分路進軍，節節獲勝，再西進數百里，即是花剌子模的名城撒麻爾罕。成吉思汗哨探獲悉，花剌子模本以名城玉龍傑赤為都，撒麻爾罕建成後，遷為新都，結集重兵十餘萬守禦，兵精糧足，城防完固，城牆之堅厚號稱天下無雙，料得急切難拔，是以傳令四路軍馬會師齊攻。（金庸先生將此事件剪貼在郭靖19歲）據《新元史·太祖本紀》十五年庚辰：“夏五月，進至撒馬爾幹城，朮赤等三路之師亦傅城下。……帝自率諸皇子圍撒馬爾幹，阿兒潑汗以波斯兵出戰，中伏大敗。康裡兵開門出降。”</p>\n<p class=\"content\">十二月，花剌子模國王病死於逃亡途中。</p>\n<p class=\"content\">《射鵰英雄傳》第38回：“此時花剌子模各城或降或破，數十萬雄師如土崩瓦裂。花剌子模國王摩訶末素來傲慢暴虐，眾叛親離之餘，帶了一群殘兵敗將，狼狽西遁。……摩訶末日暮途窮，後來病死於裡海中的一個荒島之上。”（金庸先生將此事件剪貼在郭靖19歲）據《新元史·太祖本紀》十五年庚辰：“十二月，蘇爾灘入嗄比斯海島，聞其母妻被獲，幼子又為帝所殺，心悸而卒。”</p>\n<p class=\"content\">1221年　金宣宗興定五年（郭靖16歲）</p>\n<p class=\"content\">三月清明，全真教丘處機派徒弟問候江南六怪。</p>\n<p class=\"content\">《射鵰英雄傳》第5回：“漠北草原之上，夏草青青，冬雪皚皚，晃眼間十年過去，郭靖已是個十六歲的粗壯少年，距比武之約已不過兩年，江南六怪督促得更加緊了，命他暫停練習騎射，從早到晚，苦練拳劍。”全真教丘處機在赴西域途中，派弟子尹志平至蒙古大漠問候江南六怪，向六怪千金一諾的雲天高義致以敬意：“全真教下弟子丘處機沐手稽首，謹拜上江南六俠柯公、朱公、韓公、南公、全公、韓女俠尊前：江南一別，忽忽十有六載。七俠千金一諾，間關萬里，雲天高義，海內同欽，識與不識，皆相顧擊掌而言曰：不意古人仁俠之風，復見之於今日也。……二載之後，江南花盛草長之日，當與諸公置酒高會醉仙樓頭也。人生如露，大夢一十八年，天下豪傑豈不笑我輩痴絕耶？”</p>\n<p class=\"content\">郭靖彎弓一箭雙鵰。</p>\n<p class=\"content\">《射鵰英雄傳》第5回：“他跟江南六怪練了十年武藝，上乘武功雖然未窺堂奧，但雙臂之勁，眼力之準，卻已非比尋常，眼見兩頭黑雕比翼從左首飛過，左臂微挪，瞄準了黑雕項頸，右手五指鬆開，正是：弓彎有若滿月，箭去恰如流星。黑雕待要閃避，箭桿已從頸對穿而過。這一箭勁力未衰，接著又射進了第二頭黑雕腹內，一箭貫著雙鵰，自空急墮。眾人齊聲喝彩。”</p>\n<p class=\"content\">全真教馬鈺教郭靖內功。</p>\n<p class=\"content\">《射鵰英雄傳》第5回：馬鈺是教主王重陽的首徒，繼王重陽出任掌教。馬鈺聽說師弟與江南七怪賭賽之事（史料記載馬鈺其時早已去世），出於道家抑己從人的至理，雅不欲師弟丘處機取勝，於是遠來大漠，暗中傳授郭靖內功。“如此晚來朝去，郭靖夜夜在崖頂打坐練氣。說也奇怪，那道人並未教他一手半腳武功，然而他日間練武之時，竟爾漸漸身輕足健。半年之後，本來勁力使不到的地方，現下一伸手就自然而然的用上了巧勁；原來拼了命也來不及做的招數，忽然做得又快又準。江南六怪只道他年紀長大了，勤練之後，終於豁然開竅，個個心中大樂。”</p>\n<p class=\"content\">九月，蒙古成吉思汗的孫子在範延戰死。</p>\n<p class=\"content\">《射鵰英雄傳》第37回：“又過一日，察合臺的長子莫圖根急於立功，奮勇迫城，卻被城上一箭射下，貫腦而死。成吉思汗素來鍾愛此孫，見他陣亡，悲怒無已。……成吉思汗笑道：沒事，沒事。這狗城不服天威，累得我損兵折將，又害死了我愛孫，須得大大洗屠一番。大家都去瞧瞧。……蒙古軍十幾個千人隊齊聲吶喊，向人叢衝去，舉起長刀，不分男女老幼的亂砍。這一場屠殺當真是慘絕人寰，自白髮蒼蒼的老翁，以至未離母親懷抱的嬰兒，無一得以倖免。”（金庸先生將此事件剪貼在郭靖19歲）據《新元史·太祖本紀》十六年辛巳：“九月，帝親攻八米俺城，皇孫漠阿圖堪中流矢卒。帝怒，城下之後，遇生物悉屠之，改城名曰卯庫兒幹。”</p>\n<p class=\"content\">1222年　金宣宗興定六年（郭靖17歲）</p>\n<p class=\"content\">四月初五，蒙古成吉思汗在雪山會見全真教丘處機。</p>\n<p class=\"content\">《射鵰英雄傳》第37回：丘處機帶著十八名弟子遠赴西域，歷時四年，經數國抵達雪山。“丘處機一路西行，見到戰禍之烈，心中惻然有感，乘著成吉思汗向他求教長生延年之術，當下反覆開導，為民請命。成吉思汗以年事日高，精力駸衰，所關懷的只是長生不老之術，眼見丘處機到來，心下大喜，只道縱不能修成不死之身，亦必可獲知增壽延年之道，豈知他翻來覆去總是勸告自己少用兵、少殺人，言談極不投機。”（金庸先生將此事件剪貼在郭靖19歲）據《長春真人西遊記》：“壬午……又四日，得達行在。上遣大臣喝剌播得來迎，時四月五日也。館舍定，即入見。上勞之曰：佗國徵聘，皆不應。今遠踰萬里而來，朕甚嘉焉。”</p>\n<p class=\"content\">是年，蒙古成吉思汗的西征軍隊班師。</p>\n<p class=\"content\">《射鵰英雄傳》第38回：“丘處機隨大軍東歸，一路上力勸大汗愛民少殺。成吉思汗雖然和他話不投機，但知他是有道之士，也不便過拂其意，因是戰亂之中，百姓憑丘處機一言而全活的不計其數。”（金庸先生將此事剪貼在郭靖19歲）《新元史·太祖本紀》十七年壬午（1222）：“冬十月丙子（初二），下詔班師。”</p>\n<p class=\"content\">鐵掌幫裘千仞的妹妹離家出走，嫁給絕情谷主。</p>\n<p class=\"content\">《神鵰俠侶》第19、30回：鐵掌幫主裘千仞共有兄妹三人，大哥裘千丈是裘千仞的孿生兄弟，在江湖上借用裘千仞的名頭招搖撞騙，常遭裘千仞責罵。小妹裘千尺護著大哥，與二哥發生爭執，一怒之下，離開鐵掌峰闖蕩江湖。裘千尺後來在絕情谷遇見谷主公孫止，結為夫妻。當時裘千尺20歲，在成親後將全身武功傾囊以授公孫止。按（1242年）：“二十年前，鐵掌幫在江湖上確是聲勢極盛。……當時（裘千尺）盈盈二十，嬌嫩婀娜。”</p>\n<p class=\"content\">1223年　金宣宗元光二年（郭靖18歲）</p>\n<p class=\"content\">正月，全真教馬鈺和江南六怪聯手嚇退梅超風。</p>\n<p class=\"content\">《射鵰英雄傳》第5、6回：黑風雙煞之一梅超風十年來武功精進，再次來到蒙古沙漠尋仇。其時江南六怪已知悉馬鈺兩年來傳授郭靖內功，感激不盡。馬鈺和江南六怪冒充全真七子，迫使梅超風知難而退。按：“又過一年，離比武之期已不過數月，江南六怪連日談論的話題，總離不開這場勢必轟動天下豪傑之士的嘉興比武。……他們怎知過去兩年之中，那三髻道人每晚在高崖之頂授他呼吸吐納之術。……柯鎮惡嘆道：咱們一十八年辛苦，想不到竟是養虎遺患。”</p>\n<p class=\"content\">二月，郭靖隨江南六怪赴十八年之約。</p>\n<p class=\"content\">《射鵰英雄傳》第7回：江南六怪按照十八年前之承諾，帶郭靖奔赴江南，讓他三月廿四中午和楊康在嘉興醉仙樓比武。向東南進發出了大漠草原後，郭靖先行，在張家口遇見桃花島黃藥師之女黃蓉。按：“你先去等我們，不到一個月，我們也跟著來了。……總而言之，三月廿四中午，你必須趕到嘉興府醉仙酒樓，便有天大的事也不能失約不到。”</p>\n<p class=\"content\">穆念慈在中都比武招親。</p>\n<p class=\"content\">《射鵰英雄傳》第7回：牛家村楊鐵心當年死裡逃生，化名穆易，領著義女穆念慈流浪江湖。穆念慈今年十八歲，楊鐵心為了尋訪郭靖，讓她在中都比武招親。金國趙王府王子完顏康上臺比武，勝了穆念慈，卻不肯娶她。郭靖路見不平，拔刀相助。</p>\n<p class=\"content\">群豪大鬧趙王府。</p>\n<p class=\"content\">《射鵰英雄傳》第8-11回：楊鐵心父女和郭靖不忍完顏康的輕薄之辱，前往趙王府論理。楊鐵心不期在王府與結髮之妻包惜弱闊別重逢，遭到王府內武林高手的追殺。全真三子、江南六怪各顯神通，與梅超風、王府的高手殊死搏鬥。楊康知道自己的身世後，貪圖富貴不肯回頭，楊鐵心夫婦傷心自殺，楊康的師父丘處機也對十八年之約甘心認輸。丘處機和江南六怪要郭靖娶穆念慈為妻，郭靖不捨黃蓉，兩人結伴闖蕩江湖。按：“半年之後，八月中秋，咱們一邊賞月，一邊講究武功，彭寨主你瞧怎樣？……半年之後，時日算來剛好。……到中秋節足足還有半年。”</p>\n<p class=\"content\">三月，郭靖、黃蓉來到山東西路襲慶府泰寧軍地界。</p>\n<p class=\"content\">《射鵰英雄傳》第11回：“這一日來到山東西路襲慶府泰寧軍地界，時近四月，天時已頗為炎熱。”</p>\n<p class=\"content\">四月，丐幫洪七公傳授郭靖降龍十八掌。</p>\n<p class=\"content\">《射鵰英雄傳》第12回：郭靖、黃蓉渡過長江，遇見丐幫幫主洪七公。洪七公貪吃黃蓉烹製的美味佳餚，開始傳授郭靖降龍十八掌。按：“這般十餘天一過，郭靖仗著內力深厚，水性已頗不弱，雖與黃蓉相較尚自遠遜，……夏日暴雨，驟至驟消，兩人游到對岸，已是雨過天晴，朗月懸空。”</p>\n<p class=\"content\">五月，金國王子完顏康擔任欽差，出使宋朝。</p>\n<p class=\"content\">《射鵰英雄傳》第12回：當時蒙古和金國的戰事正烈，金朝擔心受到蒙古和宋國的夾擊，派趙王府王子完顏康出使金朝，謀求議和。穆念慈自從中都比武招親之後，對完顏康痴情不已，一直從京中跟蹤至江南。在黃蓉的幫助下，完顏康和穆念慈在金國欽使的下榻處相會，一對情侶海誓山盟。按：如此一月有餘，洪七公已將降龍十八掌中的十五掌傳給了郭靖，……‘兩個娃娃，咱三人已相聚了一個多月，這就該分手啦。’又按第15回（六月初五）：“楊康心中感慨無已，一月前命駕南來時左擁右衛，上國欽差，何等威風，這時悄然北往，榮華富貴，頓成一場春夢。”</p>\n<p class=\"content\">六月，郭靖在歸雲莊殺仇祭父。</p>\n<p class=\"content\">《射鵰英雄傳》第13-15回：太湖歸雲莊莊主是桃花島弟子陸乘風，其子陸冠英奉命在湖中截獲金國欽差完顏康、宋朝迎接欽差的官員段天德。梅超風曾傳授完顏康陰毒功夫，聞訊到歸雲莊發難，被路過此處的師父黃藥師制止。郭靖殺段天德祭父，與楊康結為兄弟，同赴京中，刺殺完顏洪烈。按：“今日是六月初五，七月初一我們在嘉興醉仙樓相會，同赴桃花島之約。”</p>\n<p class=\"content\">金國王子完顏康在寶應救完顏洪烈脫險。</p>\n<p class=\"content\">《射鵰英雄傳》第15、16回：郭靖和楊康一路往北，至寶應遇見黃蓉，從歐陽克魔掌中救出穆念慈、程瑤珈。金國趙王完顏洪烈為了阻止宋朝與蒙古結盟聯兵，領兵追殺蒙古王子拖雷，也路過寶應。楊康難捨十八年的養育之情和日後的富貴前程，讓完顏洪烈逃走。按：“兩人直說到月上中天，此時正是六月天時，靜夜風涼，……時當六月上旬，天時炎熱，江南民諺雲：六月六，曬得鴨蛋熟。”</p>\n<p class=\"content\">桃花島黃藥師考試選婿。</p>\n<p class=\"content\">《射鵰英雄傳》第16-22回：郭靖隨黃蓉至桃花島，遇到被困島上十五年的武林高人周伯通。周伯通傳授郭靖《九陰真經》武功和雙手互搏之術。西毒歐陽鋒叔侄、丐幫洪七公先後來島，分別向黃藥師求親。黃藥師考試選婿，考題竟是《九陰真經》經文，郭靖輕鬆勝出。眾人離開桃花島，在與鯊魚、海浪搏鬥時，洪七公慈悲為懷，多次救援歐陽鋒叔侄，歐陽鋒卻恩將仇報，暗施毒手將洪七公打成重傷。</p>\n<p class=\"content\">郭靖在臨安皇宮保護武穆遺書。</p>\n<p class=\"content\">《射鵰英雄傳》第23回：郭靖、黃蓉、歐陽克等人上岸後，洪七公傷勢沉重，去臨安郊外靜療。黃蓉在牛家村遇到傻姑，方知父親的大弟子曲靈風已慘死十八年。洪七公一行潛入皇宮欲偷食御廚，卻遭遇潛入皇宮欲盜取武穆遺書的完顏洪烈。郭靖奮不顧身出手制止，被楊康突然襲擊以匕首刺成重傷。</p>\n<p class=\"content\">七月，郭靖在牛家村酒店養傷。</p>\n<p class=\"content\">《射鵰英雄傳》第23-26回：初一至初七，黃蓉陪護郭靖在牛家村酒店養傷，不料七日七夜之間，正邪兩道各色人物在這小酒店裡風雲際會。金國趙王完顏洪烈帶著楊康，來酒店尋找《武穆遺書》的線索，黃藥師擊敗趙王府眾多高手。寶應富家之女程瑤珈來向郭靖致謝，黃藥師做媒將她許給歸雲莊陸冠英。西毒之侄歐陽克侮辱穆念慈，被楊康殺死。鐵掌幫裘千仞的孿生兄弟裘千丈，造謠說周伯通已被黃藥師害死，全真七子聚集在酒店謀劃復仇之策。蒙古王子拖雷出使宋朝北返，與妹妹華箏在酒店相聚，郭靖面對黃蓉和華箏，難取難捨。按：“今日七月初二，靖哥哥要到初七方得痊可。……這日正是七月初五，一彎新月，恰在窗間窺人，……這一日中全真六子坐立不寧，茶飯無心，直守到初七午夜。”又按：“只聽完顏洪烈輕輕的道，十九年前，就在這村子之中，我初次和你相見。……丘處機接了過來，反覆撫挲，大是傷懷，嘆了幾口氣，說道，十九年前，我在此處與你父及你郭伯父相交。”</p>\n<p class=\"content\">十五，嶽州丐幫大會。</p>\n<p class=\"content\">《射鵰英雄傳》第26-28回：郭靖、黃蓉連騎西行，趕赴洞庭湖君山頂七月十五的丐幫大會。黃蓉從楊康手裡奪取丐幫神器“打狗棒”，揭穿其金國奸細的真面目，出任丐幫幫主。次日，裘千丈冒充鐵掌幫主裘千仞，相約郭靖、黃蓉七日內在鐵掌山比試武功。按：“七月十四，兩人來到荊湖南路境內；……今日七月十五，這正是丐幫大會。”</p>\n<p class=\"content\">郭靖、黃蓉闖鐵掌峰，得《武穆遺書》。</p>\n<p class=\"content\">《射鵰英雄傳》第28-31回：郭靖、黃蓉至鐵掌峰，方始遇見真正的裘千仞，兩人被圍在峰頂幫中禁地，尋得《武穆遺書》。裘千仞之兄裘千丈墜崖而死，黃蓉被裘千仞擊成重傷，與郭靖乘著雙鵰飛離峰頂，落在大理貴妃劉瑛姑在黑沼的隱居之所。經瑛姑指點，郭靖、黃蓉至桃源縣求助南帝段皇爺。段皇爺捨命用一陽指為黃蓉療傷，劉瑛姑乘機上山，因當年愛子之死向段皇爺尋仇。郭靖挺身相代，以報皇爺之德。按：“一言為定，七日之內，我們必來拜山。……這時正當七月盛暑，赤日炎炎，流火鑠金，……廟前有一個荷塘，此時七月將盡，高山早寒，荷葉已然凋了大半。”</p>\n<p class=\"content\">楊康、穆念慈在鐵掌峰下喜結連理。</p>\n<p class=\"content\">《射鵰英雄傳》第28、32回：楊康在丐幫大會上被黃蓉揭穿底細無處立足，帶著穆念慈去鐵掌幫避難。禁不住楊康的花言巧語，穆念慈把握不住，與他做了夫妻，懷上楊過。是時，正是郭靖、黃蓉闖峰之日，約為七月二十三。</p>\n<p class=\"content\">八月十四，嘉興煙雨樓比武。</p>\n<p class=\"content\">《射鵰英雄傳》第31-34回：郭靖、黃蓉辭別段皇爺，趕赴八月十五的煙雨樓比武之約。兩人在東海之濱遇見江南七怪之首柯鎮惡，聽說黃藥師害死江南五怪的噩耗。郭靖、黃蓉至桃花島，目睹了五怪死後的慘狀，郭靖含恨離開黃蓉，直奔嘉興。郭靖、柯鎮惡、全真六子在煙雨樓圍攻桃花島黃藥師，丐幫洪七公、西毒歐陽鋒也加入混戰。郭靖對黃藥師恨之入骨。按：“眾人聽了他這幾句話，陡然間都想起今天還是八月十四，比武之約尚在明日。”</p>\n<p class=\"content\">十五，鐵槍廟楊康斃命。</p>\n<p class=\"content\">《射鵰英雄傳》第35、36回：黃蓉在鐵槍廟中訊問在桃花島上目睹慘案發生的傻姑，得知原來江南五怪在桃花島是被歐陽鋒、楊康兩人所殺。傻姑還說出當日在牛家村酒店殺死歐陽克的便是楊康，致使歐陽鋒和楊康反目成仇。楊康困獸猶鬥，抓在黃蓉的軟蝟甲上，中了歐陽鋒的蛇毒，不治身亡。歐陽鋒為了取得《九陰真經》經文，綁架了黃蓉。郭靖得知桃花島慘案的真相，滿懷愧疚，四處尋找黃蓉。按：“歐陽鋒向天上一指，笑道：子時早過，現下已是八月十五清晨了。”</p>\n<p class=\"content\">1224年　金哀宗正大元年（郭靖19歲）</p>\n<p class=\"content\">二月，郭靖四處尋找黃蓉。</p>\n<p class=\"content\">《射鵰英雄傳》第36回：“此後郭靖一路打聽，找尋黃蓉的蹤跡。這一找就是半年，秋去冬來，冬盡春回，他策紅馬，攜雙鵰，到處探訪，問遍了丐幫、全真教以及各地武林同道，黃蓉的音訊竟是半點俱無。想到這半年中黃蓉不知已受了多少苦楚，當真心如刀割，決心走遍天涯海角，也要把她找到。他一赴燕京，二至汴梁，連完顏洪烈竟也不知去向。丐幫群丐聽得幫主有難，也是全幫出動尋訪。”</p>\n<p class=\"content\">初三，絕情谷公孫綠萼出生。</p>\n<p class=\"content\">《神鵰俠侶》第19回：絕情谷谷主公孫止娶鐵掌幫主裘千仞的妹妹裘千尺為妻，是年，二月初三，女兒綠萼出生。在裘千尺懷孕之期，公孫止暗中勾搭上谷中丫頭柔兒。按：“我今年十八歲……是甲申年二月初三的生日，戌時生。”</p>\n<p class=\"content\">五月，穆念慈之子楊過出生。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“原來穆念慈在鐵掌峰上失身於楊康（去年七月），竟然懷孕，只盼回到臨安故居，千辛萬苦地向東行到長興郊外，支持不住，在樹林中一家無人破屋中住了下來，不久生了一子。她不願見人，索性便在林中捕獵採果為生，幸喜那孩子聰明伶俐，解了她不少寂寞悽苦。”兩年後，黃蓉為孩子取名楊過，字改之。按：《神鵰俠侶》第10、18回記楊過十八歲那年和公孫綠萼相遇，公孫綠萼生於甲申年，那年也是十八。</p>\n<p class=\"content\">1225年　金哀宗正大二年（郭靖20歲）</p>\n<p class=\"content\">正月，蒙古成吉思汗回到蒙古行宮。</p>\n<p class=\"content\">《射鵰英雄傳》第38回：“花剌子模與蒙古相距數萬裡，成吉思汗大軍東還，歷時甚久，回到斡難河畔後大宴祝捷，休養士卒。”據《元史·太祖本紀》二十年乙酉：“春正月，還行宮。”</p>\n<p class=\"content\">二月二十五，南宋朝青州守將李全殺死上司許國。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“朝廷升李全為保寧軍節度使（1222年）兼京東路鎮撫副使，儼然是大將大官了。但朝廷在李全之上，又派了一名大將許國任淮東制置使（1223年），以作牽制。許國過去在襄樊、棗陽打仗，軍功卓著，但他為人貪暴，對李全、楊妙真夫婦不加禮遇（1224年）。忠義軍與宋軍（正規軍）如發生摩擦糾紛，許國必定處分忠義軍，十分不公。其時李全在山東青州前線作戰，後方忠義軍氣憤不平，即便作亂，殺了許國全家，許國自殺（1225年）。”據《宋史·寧宗本紀》嘉定十五年：“十二月丁亥（十三），以李全為保寧軍節度使、右金吾衛上將軍、京東路鎮撫副使。”《宋史·叛臣李全傳》：“嘉定十六年十一月，許國自武階換朝議大夫、淮東安撫制置使，命下，聞者驚異。”“嘉定十七年正月，國之鎮，楊氏郊迓，國辭不見，楊氏慚以歸。國既視事，痛抑北軍，有於南軍競者，無曲直偏坐之，犒賚十裁七八。”“寶慶元年，時全圖國之意已決，遣慶福還楚城，使為亂。……二月乙卯（二十四），國晨起蒞事，忽露刃充庭，客駭走，國厲聲曰：不得無禮！矢已及顙，流血蔽面，國走。亂兵悉害其家，大縱火，焚官寺，兩司積蓄盡入賊。親兵數十人翼國登城樓，縋城走，伏道堂中宿焉。……丙辰（二十五），許國縊於途。”</p>\n<p class=\"content\">郭靖在山東遇蒙古王子拖雷，回到蒙古沙漠。</p>\n<p class=\"content\">《射鵰英雄傳》第36回：“拖雷說起北國軍務，郭靖才知別來年餘，成吉思汗馬不停蹄的東征西伐，拓地無數。朮赤、察合臺、窩闊臺、拖雷四王子、木華黎、博爾術、博爾忽、赤老溫四傑，都立下了不少汗馬功勞。現下拖雷與木華黎統兵攻打金國，河南、山東數場大戰，將金兵打得潰不成軍。金國餘兵集於潼關，閉關而守，不敢出山東迎戰。郭靖在拖雷軍中住了數日，快馬傳來急訊，成吉思汗召集諸王眾將，大會漠北。拖雷與木華黎不敢怠慢，將令旗交了副將，連夜北上。郭靖想念母親，當下與拖雷同行。”</p>\n<p class=\"content\">九月，蒙古成吉思汗密令攻宋，郭靖之母自殺殉國。</p>\n<p class=\"content\">《射鵰英雄傳》第38回：成吉思汗西征班師回到蒙古，又過數月，眼見金風肅殺，士飽馬騰，又興南征之念。成吉思汗一面遣兵三路伐金，一面留下錦囊密令，令三軍破金後立即移師南向，攻滅臨安宋朝。郭靖知悉密令，叱責成吉思汗背盟棄約。成吉思汗以郭母李萍要挾，李萍自殺殉國。郭靖隻身逃奔南宋。按：“咱們在北國一住二十年，雖然多承大汗眷顧，我卻是想家得緊。……但我在漠北二十年，大汗性情，頗有所知，看來此中另有別情。”</p>\n<p class=\"content\">1226年　金哀宗正大三年（郭靖21歲）</p>\n<p class=\"content\">三月初一，蒙古軍隊包圍宋國青州。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“其時蒙古兵擊敗金兵，打到了山東，起始進攻青州。”據《宋史·叛臣李全列傳》：“寶慶二年，三月丙辰朔（初一），大元兵攻青州，全大小百戰，終不利，嬰城自守。大元築長圍，夜布狗砦，糧援路絕。”</p>\n<p class=\"content\">郭靖南歸，思索是非善惡，感慨良多。</p>\n<p class=\"content\">《射鵰英雄傳》第39回：“但成吉思汗呢？他殺了完顏洪烈，該說是好人了，卻又命令我去攻打大宋；他養我母子二十年，到頭來卻又逼死我的母親。……學武是為了打人殺人，看來我過去二十年全都錯了，我勤勤懇懇的苦學苦練，到頭來只有害人。早知如此，我一點武藝不會反而更好。”</p>\n<p class=\"content\">第二次華山論劍。</p>\n<p class=\"content\">《射鵰英雄傳》第39、40回：距離第一次華山論劍（1201年）二十五年後，黃藥師等第二次華山論劍。《神鵰俠侶》第40回：“第一次華山論劍，郭靖尚未出世，那時東邪、西毒、南帝、北丐、中神通五人，為爭一部《九陰真經》，約定在華山絕頂比武較量，藝高者得，結果中神通王重陽獨冠群雄，贏得了武功天下第一的尊號。二十五年後，黃藥師等第二次華山論劍，除東邪、西毒、南帝、北丐四人外，又有周伯通、裘千仞、郭靖三人參與。各人修為精湛，各有所長，真要說到天下第一四字，實所難言，單以武功而論，似乎倒以發了瘋的歐陽鋒最強。”按：《神鵰俠侶》記楊過比郭靖之女郭芙大四歲，郭芙出生是第二次論劍兩年後的事，因此，第二次華山論劍時，楊過應是兩歲。</p>\n<p class=\"content\">郭靖、黃蓉結為伉儷。</p>\n<p class=\"content\">《神鵰俠侶》第1回：“當年郭靖、黃蓉參與華山論劍之後，由黃藥師主持成婚，在桃花島歸隱。”</p>\n<p class=\"content\">1227年　金哀宗正大四年（郭靖22歲）</p>\n<p class=\"content\">春，郭靖、黃蓉出桃花島尋訪黃藥師。</p>\n<p class=\"content\">《神鵰俠侶》第1回：郭靖、黃蓉成婚之後，“黃藥師性情怪僻，不喜熱鬧，與女兒女婿同處數月，不覺厭煩起來，留下一封書信，說要另尋清靜之地閒居，逕自飄然離島。黃蓉知道父親脾氣，雖然不捨，卻也無法可想。初時還道數月之內，父親必有消息帶來，哪知一別經年，音訊杳然。黃蓉思念父親和師父洪七公，和郭靖出去尋訪。”</p>\n<p class=\"content\">黃蓉為楊康之子楊過取名。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：郭靖、黃蓉出了桃花島，在長興遇見穆念慈母子，黃蓉為孩子取名楊過，字改之。</p>\n<p class=\"content\">五月初三，南宋朝青州守將李全棄城降元。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：郭靖、黃蓉南行至湖州，聞青州被元兵包圍之事，便北返山東，幫助忠義軍李全、楊妙真夫婦守衛青州。原來領兵包圍青州的正是蒙古四王子拖雷，李全聞知郭大俠與元兵首領是故舊，便商量著要獻城投降。郭靖痛心不已，與黃蓉出城刺殺拖雷，卻聽說成吉思汗病重，思念拖雷和郭靖。三人一起北上。“後來果不出所料，李全為蒙古大軍包圍，無法得脫，便即投降。”《宋史·叛臣李全列傳》：“寶慶三年，時全在圍一年，食牛馬及人且盡，將自食其軍。初軍民數十萬，至是餘數千矣。五月辛亥（初三），全欲歸於大元，懼眾異議，乃焚香南向再拜，欲自經，而使鄭衍德、田四救之，曰：譬如為衣，有身，愁無袖耶？今北歸蒙古，未必非福。全從之，乃約降大元。大元兵入青州，承製授全山東行省。”</p>\n<p class=\"content\">六月，蒙古大軍破西夏。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“原來成吉思汗於滅了西夏後得病，近來病勢日重，自知不起，召拖雷急速班師回去相見。”《中國通史》卷八：1227年春，成吉思汗派一部分軍隊圍攻中興府，自己率軍南下進金境，攻陷臨洮府等城，駐夏於六盤山。七月，病死。蒙古軍圍攻中興半年餘，城中食盡，夏主晛出降，蒙古諸將遵照成吉思汗遺命殺晛，西夏亡。</p>\n<p class=\"content\">金國遣使者向蒙古求和，成吉思汗拒之。</p>\n<p class=\"content\">《射鵰英雄傳》第40回：“那使者伏在地下說道，下邦自知冒犯大汗天威，罪該萬死，特獻上祖傳明珠千顆，以求大汗息怒赦罪。這千顆明珠是下邦鎮國之寶，懇請大汗賜納。那使者見大汗收納禮物，歡喜無限，說道，大汗許和，下邦自國君而下，同感恩德。成吉思汗怒道，誰說許和，回頭就發兵討伐金狗。”</p>\n<p class=\"content\">七月十二，蒙古成吉思汗逝世。</p>\n<p class=\"content\">《射鵰英雄傳》第38、40回：成吉思汗臨崩對左右說，“金國精兵都在潼關，南據連山，北限大河，難以遽破。莫如假道宋境，自唐州、鄧州進兵，直搗金國都城大梁。大梁乃金國皇帝所居之地，可是駐兵不多，一見我師迫近，金國是必從潼關急調金兵回師相救。然以數萬之眾千里赴援，精兵銳卒，十停中到不了一停，加之人馬疲憊，雖至而弗能戰。我軍在大梁城外休兵養銳，以逸待勞，必可大破金兵。”言訖而崩，年六十六。郭靖與黃蓉向大汗遺體行過禮後，辭別拖雷，即日南歸。據《元史·太祖本紀》二十二年丁亥：“六月，金遣完顏合周、奧屯阿虎來請和。帝謂群臣曰：朕自去冬五星聚時，已嘗許不殺掠，遽忘下詔耶。今可佈告中外，令彼行人亦知朕意。是月，夏主李晛降。帝次清水縣西江。秋七月壬午（初五），不豫。己丑（十二），崩於薩里川哈老徒之行宮。”</p>\n<p class=\"content\">黃蓉懷孕，偕郭靖回桃花島。</p>\n<p class=\"content\">《神鵰俠侶》第1回：“黃蓉思念父親和師父洪七公，和郭靖出去尋訪，兩人在江湖上行走數月，不得不重回桃花島，原來黃蓉有了身孕。”</p>\n<p class=\"content\">二十四，古墓派李莫愁遭遇愛情變故。</p>\n<p class=\"content\">《神鵰俠侶》第1回：創立古墓派的是全真教王重陽的紅顏知己林朝英，林朝英生平不收弟子，一身武功傳給了隨身相侍的丫鬟。林朝英去世後，那丫鬟收了兩個弟子，一是李莫愁，二是小龍女。是年李莫愁年未二十，奉師命下山，愛上了江南少年陸展元。不料分手才兩個月，陸展元又愛上了大理派武三通的義女何沅君。七月二十四，陸、何在大理成親，李莫愁和武三通同時去跟新婚夫婦為難，喜宴座中一位大理天龍寺的高僧出手鎮住兩人，兩人被迫應承十年內不跟新婚夫婦為難。</p>"},{"title":"《神鵰俠侶》故事編年（1237-1260）","content":"</a>\n<p class=\"sectionTitle\">《神鵰俠侶》故事編年（1237-1260）</p>\n<p class=\"content\">【背景】公元13世紀30年代，蒙古帝窩闊臺滅金，南宋成為主要攻擊對象。40年代，蒙古帝窩闊臺、宰相耶律楚材相繼去世，乃馬真後攝政。50年代，蒙古帝蒙哥滅大理，繼而在進攻南宋時被擊斃，王子阿里不哥為帝。60年代初，蒙古王子忽必烈登帝位。南宋君昏臣佞，朝政日壞，岌岌可危。</p>\n<p class=\"content\">【概要】江湖主要門派依然是全真教、大理派、丐幫、桃花島派和西毒派，古墓派、絕情谷派等已經嶄露頭角。楊康之子楊過蒙郭靖夫婦收養，先是投師全真教，後又學藝古墓派，成為小龍女的徒弟、丈夫。襄陽攻防時他被郭靖之女郭芙斬斷右臂，磨鍊成神鵰大俠。十六年後他與小龍女劫後重逢，在襄陽大展神威擊斃蒙哥。</p>\n<p class=\"content\">【紀年】故事開始時楊過十三歲，郭芙九歲，是在1237年，金政權已為蒙古所滅。故事結束在蒙古帝忽必烈即位之年，是1260年。上一年，乃“大宋理宗皇帝開慶元年，是為蒙古大汗蒙哥接位後的第九年”。</p>\n<p class=\"content\">1228年　金哀宗正大五年（楊過4歲）</p>\n<p class=\"content\">桃花島郭靖之女郭芙出生。</p>\n<p class=\"content\">《神鵰俠侶》第1回：1226年，郭靖、黃蓉在第二次華山論劍後結為伉儷；1227年，郭靖夫婦在江湖上尋找黃藥師，黃蓉有了身孕，兩人重回桃花島；“不覺十月過去，黃蓉生下一女，取名郭芙。”</p>\n<p class=\"content\">1229年　金哀宗正大六年（楊過5歲）</p>\n<p class=\"content\">八月二十四，蒙古立皇子窩闊臺為帝。</p>\n<p class=\"content\">《神鵰俠侶》第9回：蒙古國大汗成吉思汗逝世後，先由四皇子拖雷監國，至是年八月，諸王百官以成吉思汗遺詔，立三皇子窩闊臺為帝，是為元太宗。據《元史·太祖本紀》戊子年（1228年）：“是歲，皇子拖雷監國。”《元史·太宗本紀》元年己丑（1229年）：“秋八月，己未（二十四），諸王百官大會於怯綠連河曲雕阿蘭之地，以太祖遺詔即皇帝位於庫鐵烏阿剌裡。始立朝儀，皇族尊屬皆拜。”</p>\n<p class=\"content\">1230年　金哀宗正大七年（楊過6歲）</p>\n<p class=\"content\">絕情谷公孫止置妻子於石窟之中。</p>\n<p class=\"content\">《神鵰俠侶》第17、19回：女兒綠萼六歲那年，公孫止勾搭谷中丫頭柔兒之事，被妻子裘千尺察覺。裘千尺將他倆摔入情花叢中，使中情花之毒。公孫止為了自保，先殺死情人柔兒，騙得絕情丹，然後將妻子灌醉，關在鱷魚潭下石窟之中，不見天日長達十二年。按：“自我六歲那年媽媽死後。……十二年的修煉倒抵得旁人二十四年。”</p>\n<p class=\"content\">1232年　金哀宗天興元年（楊過8歲）</p>\n<p class=\"content\">大理派慈恩和尚致信絕情谷。</p>\n<p class=\"content\">《神鵰俠侶》第19回：慈恩和尚即鐵掌幫主裘千仞，在第二次華山論劍時，蒙一燈大師點化，放下屠刀皈依佛門，取名慈恩。慈恩俗緣難斷，常憶及兄妹昔日之歡，是年寫信給小妹裘千尺，告訴她大哥裘千丈於鐵掌峰上命喪郭靖、黃蓉之手。慈恩哪裡知道，此刻的小妹裘千尺，已被妹夫公孫止關閉在鱷魚潭下的石窟之中。按（1242年）：“十年之前，我曾接到裘千仞的一通書信。”</p>\n<p class=\"content\">1234年　金哀宗天興三年（楊過10歲）</p>\n<p class=\"content\">正月，蒙古滅金。</p>\n<p class=\"content\">《神鵰俠侶》第3回：蒙古大軍節節深入，黃河以北，盡為蒙古人天下。金哀宗從開封逃至蔡州，傳位給宗室元帥完顏承麟，自縊而死。蒙古軍拔蔡州，殺完顏承麟，金亡。據《金史·哀宗本紀》天興三年：“正月，戊申（初九），夜，上集百官，傳位於東面元帥承麟，承麟固讓。……己酉（初十），承麟即皇帝位。百官稱賀。禮畢，亟出捍敵，而南面已立幟。俄頃，四面呼聲震天地。南面守者棄門，大軍入，與城中軍巷戰，城中軍不能御。帝自縊於幽蘭軒。末帝退保子城，聞帝崩，率群臣入哭，諡曰哀宗。哭奠未畢，城潰，諸禁近舉火焚之。奉御絳山收哀宗骨瘞之汝水上。末帝為亂兵所害，金亡。”《元史·太宗本紀》六年甲午：“春正月，金主傳位於宗室子承麟，遂自經而焚。城拔，獲承麟，殺之。宋兵取金主餘骨以歸，金亡。”</p>\n<p class=\"content\">古墓派小龍女的師父去世。</p>\n<p class=\"content\">《神鵰俠侶》第6回：終南山古墓派創始人林朝英，將一身武功傳給了丫鬟，早在第一次華山論劍前就已去世。那個丫鬟在古墓中收了兩個徒弟，一是赤練仙子李莫愁，二是龍年被遺棄在重陽宮外的小龍女。李莫愁因本性不善，被師父趕下了終南山。是年，小龍女十四歲，小龍女的師父去世。按：“我師父去世之時，我還只十四歲，本門功夫是學全了，全真派武功卻只練了個開頭，更不用說《玉女心經》了。”</p>\n<p class=\"content\">江南俠客陸展元伉儷去世。</p>\n<p class=\"content\">《神鵰俠侶》第1回：陸展元英年早逝，其妻何沅君當晚便自刎殉夫。陸展元臨終囑咐弟弟陸立鼎，再過三年，便是赤練仙子李莫愁前來報仇之期，須帶全家遠遠避開。按（1237年）：“哥哥已去世三年。”</p>\n<p class=\"content\">1235年　元太宗七年（楊過11歲）</p>\n<p class=\"content\">楊過之母穆念慈染病身亡。</p>\n<p class=\"content\">《神鵰俠侶》第2回：楊過之父楊康，在楊過出生前就喪身嘉興鐵槍廟。“楊過自幼沒有父親，母親也在他十一歲那年染病身亡。穆念慈臨死之時，說他父親死在嘉興鐵槍廟裡，要他將她遺體火化了，去葬在嘉興鐵槍廟外，又要他去投奔師父郭靖。楊過遵奉母親遺命辦理，從太湖邊的長興來到嘉興，路程不遠，葬了母親後，從此流落嘉興，住在這破窯之中，偷雞摸狗地混日子。”</p>\n<p class=\"content\">1237年　元太宗九年（楊過13歲）</p>\n<p class=\"content\">七月二十四，古墓派李莫愁在嘉興因愛尋仇。</p>\n<p class=\"content\">《神鵰俠侶》第1、2回：十年前，江南少年陸展元與大理派武三通的義女何沅君結為連理。古墓派赤練仙子李莫愁對陸展元一往情深，因愛成恨，十年後來陸家尋仇。陸展元夫婦三年前已經去世，其弟陸立鼎全家慘遭李莫愁毒手，唯一存活的陸立鼎之女陸無雙被李莫愁擄走。按：“時當南宋理宗年間，……節近中秋，……屈指算來，今日正是十年之期。……下個月二十四日，我在大理跟何姑娘成親。”</p>\n<p class=\"content\">桃花島郭靖、黃蓉收養孤兒楊過。</p>\n<p class=\"content\">《神鵰俠侶》第1、2回：郭靖夫婦帶著女兒郭芙再次走出桃花島，尋訪父親黃藥師，在嘉興路遇李莫愁。楊過路見不平拔刀相助，被李莫愁打成重傷；大理派武三通瘋癲出走，妻子武三娘被李莫愁打死，留下兩個兒子敦儒、修文孤苦無依。郭靖夫婦將三個孩子一併帶往桃花島。是年，郭芙9歲（第1回：“忽忽數年，郭芙已滿九歲了。”）；武修文11歲，武敦儒12歲（第1回：“陸二孃忙伸手扶起，問起名字，那摔破額角的叫做武敦儒，是哥哥，弟弟叫做武修文。兩人相差一歲，一個十二，一個十一，武學名家的兩個兒子，卻都取了個斯文名字。”）；楊過13歲（第2回：“這話如為大男人所說，只有惹她厭憎，出於這十二三歲少年之口卻又不同，一時心軟，竟然下不了手。”第3回：“楊過雖比二人大了一兩歲，但雙拳難敵四手。”）；黃蓉29歲，郭靖32歲。（第2回：“那男的濃眉大眼，胸寬腰挺，三十來歲年紀，上唇微留髭鬚。那女的看來不到三十歲，容貌秀麗，一雙眼睛靈活之極。”）</p>\n<p class=\"content\">八月，桃花島黃蓉收楊過為徒。</p>\n<p class=\"content\">《神鵰俠侶》第3回：郭靖夫婦帶著四個年齡相若的孩子。在桃花島，郭靖傳授郭芙和武氏兄弟武藝，黃蓉主動收楊過為徒，卻只是教他讀書，絕口不提武功。楊過對此不滿，自行修習西毒歐陽鋒傳授的蛤蟆功入門心法。上個月在嘉興，楊過邂逅歐陽鋒，認其為義父。按：“一連數日，黃蓉只是教他讀書，絕口不提武功。”</p>\n<p class=\"content\">年底，楊過在桃花島和武氏兄弟打架。</p>\n<p class=\"content\">《神鵰俠侶》第3回：武氏兄弟依恃武功，欺侮楊過。楊過在危急之際使出歐陽鋒的絕技“蛤蟆功”，將武修文打傷。柯鎮惡同門五人當年為歐陽鋒所害，不願和歐陽鋒的傳人同處桃花島。郭靖決定送楊過去終南山全真教學藝。按：“黃蓉教他讀書，不到三月，已將一部《論語》教完。……幾個月過去，黃蓉始終不提武功，楊過也就不問。‘……楊大哥，你跟師孃學武藝，我們三個跟師父學。這幾個月下來，也不知是誰長進得快了。’”</p>\n<p class=\"content\">1238年　元太宗十年（楊過14歲）</p>\n<p class=\"content\">夏，楊過拜全真教趙志敬為師。</p>\n<p class=\"content\">《神鵰俠侶》第3回：郭靖送楊過學藝終南山。至終南山，正是古墓派小龍女十八歲生日。蒙古霍都王子聽信江湖上小龍女比武招親的傳謠，前來騷擾，先後被郭靖和小龍女擊退。楊過留在重陽宮，拜全真教王處一的大弟子趙志敬為師。按：“此時大金國已為蒙古所滅，黃河以北，盡為蒙古人天下。……今日是那姓龍女子十八歲生辰。”</p>\n<p class=\"content\">十二月十五，楊過離開重陽宮，拜古墓派小龍女為師。</p>\n<p class=\"content\">《神鵰俠侶》第4、5回：臘月十五全真教武功小較，楊過受同門師兄弟欺負，逃出重陽宮，被古墓派照料小龍女的孫婆婆收留。孫婆婆為全真教郝大通失手打死，楊過進入古墓，拜姑姑小龍女為師。按：“夏盡秋至，秋去冬來，轉瞬過了數月，楊過記了一肚皮的口訣，可是實在功夫卻絲毫沒有學到。……轉眼到了臘月……這一天臘月望日，……趙志敬怒道：我傳了你大半年功夫，怎說不會絲毫武藝？這大半年中你幹甚麼來著？楊過無話可答，低頭不語。”</p>\n<p class=\"content\">1239年　元太宗十一年（楊過15歲）</p>\n<p class=\"content\">三月，古墓派小龍女教楊過練習“柔網勢”。</p>\n<p class=\"content\">《神鵰俠侶》第6回：“柔網勢”是古墓派祖師林朝英自創武功，共八十一招，練成後能將八十一隻麻雀籠罩在掌法之內。楊過自三月至八月練習不輟，方始告成。按：“兩人來到墓外，此時正當暮春三月，枝頭一片嫩綠。”</p>\n<p class=\"content\">八月，楊過開始練習“天羅地網勢”。</p>\n<p class=\"content\">《神鵰俠侶》第6回：“柔網勢”是不令八十一隻麻雀脫出圈子，“天羅地網勢”是任由麻雀夭矯空碧，再以掌力將它逼低，直至逼落為止。按：“如此練習不輟，春盡夏來，日有進境。……到了中秋過後，柔網勢已然練成。”</p>\n<p class=\"content\">1240年　元太宗十二年（楊過16歲）</p>\n<p class=\"content\">春，古墓派小龍女、楊過練習《玉女心經》。</p>\n<p class=\"content\">《神鵰俠侶》第6回：玉女心經是古墓派祖師林朝英創立的專門對付全真教的武功，心經要訣便是刻在墓頂的符號圖訣，另有詳解十篇，小龍女得自師父口傳。小龍女、楊過練習數月，練成《玉女心經》的外功。按：“這年楊過已十六歲了，身材漸高，喉音漸粗，已是個俊秀少年，……小龍女其時已年逾二十，可是自幼生長古墓，於世事可說一無所知。……楊過對師父越來越是敬重，兩年之間，竟無一事違逆師意。”</p>\n<p class=\"content\">秋，全真教趙志敬、甄志丙偷窺小龍女和楊過練功。</p>\n<p class=\"content\">《神鵰俠侶》第6回：小龍女帶著楊過練習玉女心經，耳磨廝鬢漸生情愫。全真教第三代首座弟子甄志丙，心儀小龍女，在小龍女夏天二十歲生日，謹具蜜餞蟠桃恭祝芳辰。是日小龍女和楊過解衣練功，被甄志丙和師哥趙志敬撞見，兩人發誓不對外洩露，方得脫身。按：“事隔兩年，楊過已自孩童長成一個長身玉立的少年，趙志敬初時並不知道是他，待得聽他二次喝罵，臉龐又轉到月光之下，這才瞧清楚原來是自己的徒兒。”</p>\n<p class=\"content\">古墓派李莫愁闖入古墓，小龍女師徒移居終南山谷。</p>\n<p class=\"content\">《神鵰俠侶》第6、7回：赤練仙子李莫愁不知《玉女心經》是口傳之訣，帶著徒弟洪凌波闖入古墓，索取《玉女心經》。墓室內機關重重，師姊妹相鬥之際將墓室關閉。四人歷盡艱辛走出古墓，小龍女師徒在終南山腳搭了兩間茅屋以蔽風雨。</p>\n<p class=\"content\">1241年　元太宗十三年（楊過17歲）</p>\n<p class=\"content\">春，古墓派小龍女、楊過練成《玉女心經》。</p>\n<p class=\"content\">《神鵰俠侶》第7回：師徒倆住在終南山谷，日間睡眠，晚上用功。數月過去，先是小龍女練成了《玉女心經》，再過月餘，楊過也功行圓滿。按：“他在墓中住了兩年多，練了古墓派內功，居然火性大減，倒也難得。”</p>\n<p class=\"content\">十一月初八，元朝皇帝窩闊臺去世。</p>\n<p class=\"content\">《神鵰俠侶》第9回：“原來蒙古國大汗成吉思汗逝世後，第三子窩闊臺繼位。窩闊臺做了十三年大汗逝世。”據《元史·太宗本紀》十三年辛丑：“十一月，丁亥（初四），大獵。庚寅（初七），還至[zz98-1]鐵辜胡蘭山。奧都剌合蠻進酒，帝歡飲，極夜乃罷。辛卯（初八）遲明，帝崩於行殿。在位十三年，壽五十有六。葬起輦谷。追諡英文皇帝，廟號太宗。”《元史·耶律楚材列傳》：“歲辛丑，冬十一月四日，帝將出獵，楚材以太乙數推之，亟言其不可，左右皆曰：不騎射，無以為樂。獵五日，帝崩於行在所。”</p>\n<p class=\"content\">1242年　元乃馬真後元年（楊過18歲）</p>\n<p class=\"content\">春，元朝皇后乃馬真氏執政。</p>\n<p class=\"content\">《神鵰俠侶》第9回：“窩闊臺做了十三年大汗逝世，皇后尼瑪察臨朝主政。皇后信任群小，排擠先朝的大將大臣，朝政混亂。宰相耶律楚材是三朝元老，又是開國功臣，遇到皇后措施不對之處，時時忠言直諫。”《元史·太宗本紀》壬寅年：“春，六皇后乃馬真氏始稱制。”《元史·耶律楚材列傳》：“皇后乃馬真氏稱制，崇信奸回，庶政多紊。奧魯剌合蠻以貨得政柄，廷中悉畏附之。楚材面折廷爭，言人所難言，人皆危之。”</p>\n<p class=\"content\">九月，古墓派小龍女被全真教甄志丙玷汙。</p>\n<p class=\"content\">《神鵰俠侶》第7回：小龍女、楊過練成《玉女心經》，練習《九陰真經》年餘之間，師徒倆內功外功俱皆精進。是日練功完畢，楊過與義父歐陽鋒闊別重逢。歐陽鋒傳授楊過怪異功夫時，小龍女被歐陽鋒點穴後全身癱軟，遭全真教甄志丙乘機玷汙，她還以為是楊過所為。小龍女第二天聽說楊過不肯娶她，傷心地離開了終南山，是為楊過和小龍女的第一次分別。</p>\n<p class=\"content\">元朝宰相耶律楚材避禍南下，遇刺客完顏萍。</p>\n<p class=\"content\">《神鵰俠侶》第8、10回：耶律楚材輔助成吉思汗和窩闊臺平定四方，功勳卓著，長子耶律鑄出任汴梁經略使。耶律楚材忠言直諫，自知得罪皇后，請旨前往河南宣撫，皇后准奏後，耶律楚材帶了次子耶律齊、三女耶律燕徑來河南避禍。耶律楚材本是遼國遺民，遼被金滅後，決意輔助蒙古攻金。完顏萍是金國遺民，金被元滅後，一心追蹤刺殺耶律楚材。完顏萍三次行刺，均被耶律齊所阻，終於為耶律齊的俠義所動，與楊過、陸無雙等人聯手對付惡魔李莫愁。按：“楊過道，別叫我楊爺。你今年幾歲啦？完顏萍道，我十八歲，你呢？楊過道，我也是十八。”又按：“此時正當月盡夜，星月無光。”</p>\n<p class=\"content\">十一月，北丐洪七公和西毒歐陽鋒在華山同歸於盡。</p>\n<p class=\"content\">《神鵰俠侶》第10、11回：楊過在武關惡鬥李莫愁後，大概在十月下旬來到華山絕頂，遇見北丐洪七公。第五天上洪七公廢了川邊五醜，西毒歐陽鋒又來到山頂。兩位高手比拼武藝十多天，終於內力消竭，相擁而死。楊過在兩人屍身旁守了七日七夜，又將兩人的神招演習了二十餘天，才下山來到淮水之畔。按：“天空竟飄下了一片片雪花；……朔風肅殺。”</p>\n<p class=\"content\">十二月，大勝關英雄聚會。</p>\n<p class=\"content\">《神鵰俠侶》第11-14回：當年，桃花島弟子陸乘風的太湖歸雲莊，被西毒歐陽鋒一把火燒成白地，便舉家遷居大勝關。郭靖夫婦假座陸家莊召集英雄大會，共謀推舉“抗蒙保國盟”的盟主。楊過聞訊前往，與師父小龍女不期而遇。蒙古的金輪國師來會上爭奪武林盟主，氣焰囂張，楊過出手挫其威。楊過當眾宣佈要娶小龍女為妻，郭靖和各門派群雄皆不以為然。楊過和小龍女孤立無援，雙雙離開了陸家莊。</p>\n<p class=\"content\">桃花島黃蓉已經懷孕。</p>\n<p class=\"content\">《神鵰俠侶》第12回：“黃蓉第二次懷孕之後，某日修習內功時偶一不慎，傷了胎氣，因是大感虛弱。這日教了半天，頗感疲累，倚在石上休息，……郭靖輕撫黃蓉手背，溫言道：自從你懷了這第二個孩子，最近身子大不如前，快些將丐幫的大小事務一古腦兒的交了給魯有腳，須得好好補養才是。郭芙大喜，心道：原來媽媽有了孩子，我多個弟弟，那可有多好。媽怎麼又不跟我說？”</p>\n<p class=\"content\">楊過和小龍女的第二次分別。</p>\n<p class=\"content\">《神鵰俠侶》第14回：蒙古金輪國師在陸家莊受挫，心中不忿，伺機擄走了郭靖之女郭芙。楊過在酒樓裡幫助黃蓉奪回郭芙，黃蓉卻提醒小龍女：楊過長住古墓，總有一天會氣悶厭煩。小龍女思前想後，終於留言離去。楊過四處尋找。</p>\n<p class=\"content\">楊過與桃花島黃藥師的忘年交。</p>\n<p class=\"content\">《神鵰俠侶》第15回：楊過被金輪國師打成重傷，桃花島小弟子程英將其救回療傷。魔頭李莫愁進攻楊過等人，路過的黃藥師、傻姑出手相救。黃藥師聽說楊過反出全真教，毆打本師，又要娶姑姑小龍女為妻，離經叛道正合自己的心意，引為生平第一知己，傳授其彈指神功。按：“其時楊過未滿二十歲（18歲），黃藥師已年近八十（79歲），中間隔了四十上下的郭靖（37歲）、黃蓉（34歲）夫婦，楊過其實已是他的孫輩。”</p>\n<p class=\"content\">楊過為報父仇，與金輪國師結盟。</p>\n<p class=\"content\">《神鵰俠侶》第15、16回：楊過和陸無雙、程英拜訪鐵匠馮默風，聯手擊退了李莫愁的進攻。楊過從傻姑口中得知楊康當年命喪黃蓉之手，悲憤交加，發誓要殺郭靖夫婦為父報仇。楊過竭智窮慮，與蒙古金輪國師結成同盟，前去拜訪蒙古王子忽必烈。按：“馮默風約莫五十幾歲（不到52歲），……我離師門已三十餘年（不到39年）。”又按：“忽必烈是這麼一個會說漢語，謙和可親的青年。”忽必烈今年二十七歲，《元史·世祖本紀》：“世祖聖德神功文武皇帝，諱忽必烈，睿宗皇帝第四子。母莊聖太后，怯烈氏。以乙亥（1215年）歲八月乙卯（二十八）生。及長，仁明英睿，事太后至孝，尤善撫下。……歲甲辰（1244年），帝在潛邸，思大有為於天下，延藩府舊臣及四方文學之士，問以治道。”</p>\n<p class=\"content\">楊過大鬧絕情谷。</p>\n<p class=\"content\">《神鵰俠侶》第17-20回：絕情谷谷主公孫止武功精湛。十二年前，公孫止喜新厭舊，將裘千尺推下鱷魚潭。半個月前，公孫止故伎重演將練功走火入魔的小龍女救回谷中，準備拜堂成親。楊過隨著金輪國師等蒙古高手，奉命緝拿周伯通，進入絕情谷，與小龍女重逢。楊過和小龍女聯手，以玉女劍法擊敗公孫谷主，卻中了情花劇毒。谷主的女兒綠萼今年十八，心中愛慕楊過，偷取父親的絕情丹要救楊過，兩人一起跌入鱷魚潭。綠萼與母親在地底相逢，方知十二年前母親遇害的真相。裘千尺將楊過、綠萼救上地面，大鬧公孫止的喜堂。公孫止落荒逃走，裘千尺為替裘千丈報仇，要楊過用郭靖夫婦的首級來換取半枚絕情丹。楊過、小龍女和眾人走出絕情谷，前往戰事正烈的襄陽城。按：“我今年十八歲……甲申年二月初三的生日。”</p>\n<p class=\"content\">1243年　元乃馬真後二年（楊過19歲）</p>\n<p class=\"content\">九月，襄陽攻防，楊過大義泯恩仇。</p>\n<p class=\"content\">《神鵰俠侶》第21回：元朝軍隊在皇子忽必烈統率下，大舉進攻襄陽，郭靖夫婦協助宋朝的襄陽安撫使呂文煥，固守已大半年。楊過抱著行刺郭靖的企圖，與小龍女進入襄陽，眼見郭靖為國為民一片俠義，遲遲不忍下手，反而在郭靖奮勇殺敵登城遇險時，本能地出手援救。武氏兄弟為了爭奪郭芙的芳心，貪功冒進，為金輪國師所擒。郭靖、楊過冒死來到忽必烈大營，救出武氏兄弟。楊過仰重郭靖的高風亮節，在心裡放棄了行刺的念頭。</p>\n<p class=\"content\">編者按：原著記載絕情谷事件和襄陽攻防幾乎是接連發生的。但是，絕情谷事件發生在公孫綠萼十八歲，公孫綠萼出生於甲申年（1224年），可知，絕情谷事件只能發生在1242年；襄陽攻防時郭襄出生，十六年後是宋理宗開慶元年、蒙古蒙哥九年（1259年），可知，郭襄只能出生在1243年。此外，大勝關英雄大會時，黃蓉剛剛懷孕，郭芙還看不出來（第12回）；郭芙在今年去終南山的路上，說是去年與耶律齊初會（第29回）；郭襄十六日生日（1259年）時，朱子柳說大勝關英雄大會是十七年以前的事（第37回），都印證了絕情谷事件發生在1242年，差不多將近九個月後才是襄陽攻防、郭襄出生的事實。</p>\n<p class=\"content\">廿四，桃花島黃蓉生雙胞胎郭襄、郭破虜。</p>\n<p class=\"content\">《神鵰俠侶》第22回：黃蓉去年年底大勝關英雄會前懷孕，至今分娩在即，因幫助丈夫守衛襄陽，勞心勞力驚動胎息，提前產下一對龍鳳胎。郭襄落草之時，正值金輪國師、尼摩星進襄陽刺殺郭靖。混戰之中，郭襄被女魔頭李莫愁奪去，楊過緊追不放。出城以後，郭襄嗷嗷待哺，楊過、李莫愁以母豹哺乳，救了燃眉之急。按第35回：“你生日是九月廿四，是不是？”</p>\n<p class=\"content\">楊過和小龍女的第三次分別。</p>\n<p class=\"content\">《神鵰俠侶》第22-25回：武氏兄弟為了郭芙各不相讓，決定在荒山決鬥，楊過要排難解紛，謊稱郭靖夫婦已將郭芙許以他為妻，不料這話正巧給小龍女聽到。全真教趙志敬、甄志丙奉命至襄陽，探聽兩軍交戰信息，兩人議論當年小龍女被玷汙之事，正巧又給小龍女聽到。小龍女急怒攻心，離開襄陽一路追逼趙志敬、甄志丙。在忽必烈的元軍大營，小龍女出手救了盜取蒙古王旗的周伯通。</p>\n<p class=\"content\">十月，楊過右臂被郭靖之女郭芙斬斷。</p>\n<p class=\"content\">《神鵰俠侶》第23、24回：楊過在絕情谷身中情花之毒，至郭襄出生之日，距離毒發尚有七日。當天武氏兄弟在荒山決鬥，被李莫愁的冰魄銀針暗傷，楊過捨命為其吮吸毒質，中毒後昏迷不醒。七日之後醒來，情花之毒未發，原來兩般劇毒相侵相剋，楊過反得善果。天竺僧帶著武三通、朱子柳去絕情谷尋求解藥，郭芙卻和昏迷七日初醒的楊過發生激烈口角。郭芙說出甄志丙玷汙小龍女的事，楊過怒不可遏，狠狠抽了她一個嘴巴。驕縱任性的郭芙揮劍砍出，楊過的右臂被生生斷下。</p>\n<p class=\"content\">楊過在獨孤求敗的埋骨洞中養傷。</p>\n<p class=\"content\">《神鵰俠侶》第26回：楊過斷臂之後離開襄陽城，來到劍魔獨孤求敗的埋骨之處，與陪伴過獨孤大俠的神鵰相依度日。楊過使用獨孤的重劍，與神鵰過招相抗，月餘之間，功力大進。按：“過得月餘，竟勉強已可與神鵰驚人的巨力相抗，發劍擊刺，呼呼風響，不禁大感欣慰。”</p>\n<p class=\"content\">十一月，楊過打消復仇之念，前往終南山尋找小龍女。</p>\n<p class=\"content\">《神鵰俠侶》第26-29回：楊過為報斷臂之恨，潛入襄陽郭家，目睹郭靖欲斷郭芙手臂，被黃蓉擋住的場景，黃蓉母女離家出走，便尾隨而去。黃蓉在路上遇見抱著嬰兒郭襄的李莫愁，雙方爭鬥之際，楊過乘機抱走了郭襄，徑往終南山。黃蓉母女、李莫愁緊追楊過，遇見正在圍攻絕情谷主公孫止的武氏父子、完顏萍和耶律兄妹。三對青年男女意氣相投，各有所鍾，結伴前往終南山。按：當在十一月上旬。“原來她吃了一個多月豹乳，……[李莫愁]於郭襄有月餘養育之恩。”</p>\n<p class=\"content\">全真教代掌教之爭。楊過、小龍女喜結良緣。</p>\n<p class=\"content\">《神鵰俠侶》第25-28回：全真教緊急召回甄志丙，要他攝任代掌教之位。甄志丙拒絕接受元朝對全真教的敕封，趙志敬以當眾揭露其玷汙小龍女的醜行相挾，脅迫其讓出代掌教之位。趙志敬攝任代掌教後，卑躬屈膝，接受了元朝的敕封。全真諸道中正義之士發難，重陽宮發生內訌。小龍女欲殺甄志丙，遭全真教和蒙古武師圍攻，身受重傷，甄志丙自殺謝罪。楊過來到終南山，與小龍女在重陽宮祖師王重陽畫像前拜堂成親，之後帶著郭襄潛入古墓。按：當在十一月中旬。“[小龍女]在道上追蹤甄志丙和趙志敬一月有餘。”</p>\n<p class=\"content\">郭靖之女郭芙誤發銀針，破壞了小龍女的療程。</p>\n<p class=\"content\">《神鵰俠侶》第28、29回：楊過將小龍女自重陽宮救回古墓，從王重陽寫給林朝英的信中得到啟發，用寒玉床為小龍女療傷。黃蓉母女一行至終南山，李莫愁偷襲正在以內功療傷的小龍女，被楊過封在石棺之中。楊過、小龍女躲在另一具石棺中繼續療傷，不料隨後趕來的郭芙誤發銀針，致使小龍女的療程前功盡棄。楊過對郭芙的怨毒更深。按：當在十一月底。“當時郭靖受傷，黃蓉以七日七夜之功助他療傷，小龍女體質既遠不如郭靖壯健，受的傷又倍重之，所需時日自更為長久。”</p>\n<p class=\"content\">大理派一燈大師救小龍女。</p>\n<p class=\"content\">《神鵰俠侶》第30回：元朝軍隊攻打重陽宮失利，放火燒山洩憤。楊過、小龍女夜宿山腰木屋，南帝一燈大師和徒弟裘千仞來到木屋，贈靈藥一顆，服後可保七日平安。一燈大師領著楊過、小龍女去絕情谷，尋找天竺僧求取解毒之法。按：“北風呼呼，大雪不停。”</p>\n<p class=\"content\">十二月初七，絕情谷再起風波，楊過、小龍女的十六年之約。</p>\n<p class=\"content\">《神鵰俠侶》第30-32回：去年年底絕情谷主公孫止被迫離谷出走，其妻裘千尺擔任了谷主。楊過、小龍女和眾人來到谷中的時候，天竺僧為了尋求化解情花毒之方，以身試毒昏暈初醒，被李莫愁用銀針暗殺，因此，楊過解毒的希望就只剩下裘千尺手中的半枚絕情丹。楊過沒有如約帶來郭靖夫婦的首級，裘千尺寧死不肯拿出絕情丹。老谷主公孫止重回谷中，勾搭上不慎中了情花之毒的女魔頭李莫愁，也要爭奪這半枚絕情丹。裘千尺之女公孫綠萼對楊過一往情深，自刺情花想讓母親把絕情丹拿出來。多次較量之後，楊過終於拿到了那半枚絕情丹，李莫愁殺徒自保，葬身火窟，公孫止誤殺女兒綠萼，與裘千尺相擁跳澗。楊過雖然解毒有望，但想到小龍女中了冰魄銀針之毒，命在旦夕，不惜將半枚絕情丹擲入萬丈深谷，誓與妻子同生死。小龍女為了給予楊過生存下去的希望和勇氣，半夜悄然離去，在斷腸崖上刻下十六年之約。按第38回：“楊過於十二月初二抵達絕情谷，比之十六年前小龍女的約期還早了五天。”</p>\n<p class=\"content\">1244年　元乃馬真後三年（楊過20歲）</p>\n<p class=\"content\">二月，楊過離開斷腸崖，飄零江湖。</p>\n<p class=\"content\">《神鵰俠侶》第32回：楊過在斷腸崖前停留了兩月有餘，將《玉女心經》傳給陸無雙，終無小龍女半點音訊蹤跡，知道再等無用，拔了一束斷腸草藏在懷中，沙上留字，飄然離去。</p>\n<p class=\"content\">五月，元朝丞相耶律楚材去世。</p>\n<p class=\"content\">《神鵰俠侶》第24回：“尼瑪察皇后臨朝後，信任權臣溫都爾哈瑪爾，對老臣耶律楚材多方貶斥，後來將其下毒害死，又殺了其子耶律鑄，下令追殺其家屬，得悉耶律鑄的弟妹等人逃到了南朝，命霍都稟報忽必烈後逮捕斬殺，以絕後患。”忽必烈認為耶律楚材是元朝忠臣，一時受冤，日後必可平反，對皇后的旨意暫且不理。（金庸先生將此事件剪貼在楊過19歲）據《元史·太宗本紀》甲辰年：“夏五月，中書令耶律楚材薨。”</p>\n<p class=\"content\">1245年　元乃馬真後四年（楊過21歲）</p>\n<p class=\"content\">二月，楊過與神鵰至東海之濱。</p>\n<p class=\"content\">《神鵰俠侶》第32回：楊過離開斷腸崖後，來到襄陽獨孤求敗當年隱居之所，用木劍和神鵰練劍，不覺夏盡秋來，自秋而冬，內力既增，體內情花之毒盡解。眼見天寒地凍，與小龍女分手將屆週年（1244年十二月），神鵰咬住楊過衣衫，拉他向南。楊過邁開大步，隨著神鵰疾馳，只兩個月間，已抵東海之濱。</p>\n<p class=\"content\">1247年　元定宗二年（楊過23歲）</p>\n<p class=\"content\">四月初九，武當派祖師張三丰出生。</p>\n<p class=\"content\">《神鵰俠侶》第40回：張三丰，原名張君寶，少時在少林寺出家為僧，拜覺遠為師。後因故離寺闖蕩江湖，創立武當門派。按（1260年）：“只見他形貌甚奇，額尖頸細、胸闊腿長、環眼大耳，雖只十二三歲的少年，但凝氣卓立，甚有威嚴。”張三丰著《雲水集》中有《悠悠歌》：“悠悠歌，悠悠歌，四十八歲空消磨，人生壽命能幾何！株守恆山十六載，燕趙往來成逝波。倒不如攜琴劍，整笠蓑，東走蓬萊唱道歌。”此詩作於北嶽，時至元三十一年甲午歲（1294年）也。</p>\n<p class=\"content\">1251年　元憲宗元年（楊過27歲）</p>\n<p class=\"content\">楊過練成黯然銷魂掌，攜神鵰闖蕩江湖。</p>\n<p class=\"content\">《神鵰俠侶》第32、34回：楊過隨神鵰至東海之濱，在海潮之中練功數年，自創“黯然銷魂掌”，其名取自江淹《別賦》，共有一十七招。六年之後，某一日風雨如晦，楊過心有所感，當下腰懸木劍，身披敝袍，一人一雕，悄然西去，自此足跡所至，踏遍了中原江南之地。按：“春去秋來，歲月如流，楊過日日在海潮之中練劍，日夕如是，寒暑不間。……自此從輕而響，從響而輕，反覆七次，終於欲輕則輕，欲響則響，練到這地步時，屈指算來在海邊已有六年了。”</p>\n<p class=\"content\">1253年　元憲宗三年（楊過29歲）</p>\n<p class=\"content\">七月十八，南宋朝理宗帝殺四川抗元大帥餘玠。</p>\n<p class=\"content\">《神鵰俠侶》第33回：“蒙古韃子攻打四川十多年，全賴餘玠餘大帥守禦，全川百姓都當他萬家生佛一般。哪知皇上聽信了奸臣丁大全的話，說餘大帥甚麼擅權，又是甚麼跋扈，賜下藥酒，逼得他自殺了，換了一個懦弱無能的奸黨來做元帥。”據《宋史·理宗本紀》寶祐元年：“五月，甲午（十七），詔餘玠赴闕。……秋七月，甲午（十八），餘玠卒，贈官五轉。”</p>\n<p class=\"content\">十二月，元朝滅大理國（段興智天定三年）。</p>\n<p class=\"content\">《神鵰俠侶》第35回：“蒙古軍行神速，沒多久就滅了大理。其時大理國國主是段興智，是一燈大師的曾孫，號稱定天賢王，年方稚幼，立後未及兩年而國亡，國亡時由武三通、朱子柳、點蒼漁隱等救出，逃奔在外。”段興智後在昆明被俘，投降元朝。（金庸先生將此事件剪貼在楊過35歲）據《元史·世祖本紀》歲癸丑：“十二月丙辰（十二），軍薄大理城。”《中國通史》卷七：蒙古蒙哥汗三年，一支蒙古兵南下，打破了大理國境內各民族貴族分子對立紛爭的局面，十二月十二日，蒙古軍到達大理首府大理（今屬雲南）城下，蒙古軍入大理城，大理國亡。</p>\n<p class=\"content\">1254年　元憲宗四年（楊過30歲）</p>\n<p class=\"content\">十月二十五，南宋朝殺抗元名將王惟忠，神鵰俠楊過救其子。</p>\n<p class=\"content\">《神鵰俠侶》第33回：南宋王朝撤換四川元帥後，“陣前兵將是餘大帥的舊部，大家一樣拼命死戰。但那元帥只會奉承上司，一到打仗，調兵遣將甚麼都不在行，自然抵擋不住了。丁大全、陳大方這夥奸黨庇護那狗屁元帥，反冤枉力戰不屈的王惟忠將軍通敵，竟將他全家逮京，把王將軍斬首了。”神鵰俠楊過將其子小王將軍救出。據《宋史·理宗本紀》寶祐二年：“八月乙亥（初五），詔以前知閬州兼利西安撫王惟忠付大理獄，尋命臺臣監鞫。……戊戌（二十八），籍王惟忠家財。……冬十月甲午（二十五），斬王惟忠於都市。丁酉（二十八），追削餘玠資政殿學士。”</p>\n<p class=\"content\">1258年　元憲宗八年（楊過34歲）</p>\n<p class=\"content\">四月二十八，南宋朝以丁大全為丞相。</p>\n<p class=\"content\">《神鵰俠侶》第33回：“那臨安少年道，神鵰俠誅殺奸臣，是小王將軍親眼目睹，那麼自然不是天神天將所為了。但奸臣丁大全一夜之間麵皮變青，卻必是上天施罰之故。”《宋史·奸臣列傳》：“丁大全，字子萬，鎮江人，面藍色。……寶祐六年，拜參知政事。四月，拜右丞相兼樞密使，進封公。”《宋史·理宗本紀》寶祐六年：“夏四月，丁未（二十八），以丁大全為右丞相兼樞密使。”</p>\n<p class=\"content\">1259年　元憲宗九年（楊過35歲）</p>\n<p class=\"content\">三月，郭靖之女郭襄風陵渡口遇楊過。</p>\n<p class=\"content\">《神鵰俠侶》第33-35回：郭靖之女郭芙，奉父命帶著弟弟郭破虜、妹妹郭襄，前去終南山邀請全真教出席九月十五的英雄大會。返程經過風陵渡口，聽了一夜神鵰大俠的事蹟，郭襄心嚮往之。第二天，郭襄如願見到神鵰俠楊過。楊過排難解紛，西山十鬼和史家兄弟握手言和，裘千仞得到了周伯通和劉瑛姑的寬恕，安然逝去。郭襄告別神鵰俠楊過，隨姐姐郭芙徑歸襄陽。按：“大宋理宗皇帝開慶元年，是為蒙古大汗蒙哥接位後的第九年，時值三月殘春。”是年，郭芙31歲，郭襄、郭破虜16歲。第33回：“只見她年紀三十有餘，……身後跟著一男一女，都是十五六歲年紀。”</p>\n<p class=\"content\">元朝大軍雲集襄陽，南宋朝廷不以為意。</p>\n<p class=\"content\">《神鵰俠侶》第35回：“這一次蒙古事先籌劃數年，志在必得，北上的大軍由皇弟忽必烈統率，南下大軍由蒙古皇帝蒙哥御駕親統，精兵猛將，盡皆從龍而來。聲勢之大，前所未有。一至秋高氣爽，草長馬肥，正利於蒙古鐵騎馳騁，即便南北夾攻襄樊。蒙古大軍兵糧雲集，襄陽城局面緊急。臨安大宋朝廷由奸臣丁大全當國，主昏臣奸，對此竟然不當作一回事。”郭靖知道此番局勢緊急，委實非同小可，於是撒下英雄帖，遍請天下英雄齊集襄陽，會商抗敵禦侮大計。會期定於九月十五，預定連開十日。</p>\n<p class=\"content\">南宋朝奸臣賈似道逐漸得勢。</p>\n<p class=\"content\">《神鵰俠侶》第33回：“小王將軍嘆道：主上若不昏庸無道，奸臣便不能作惡。去了個秦檜，來個韓侂冑；去了韓侂冑，來個史彌遠；去了史彌遠，又來丁大全。眼見賈似道日漸得勢，這又是個禍國殃民之徒。唉，奸臣一個接著一個，我大宋江山，眼見難保呢。”是年正月，賈似道以樞密使出任四省宣撫，領兩淮兵甲，六月受理宗獎諭，十月任右丞相，封茂國公。《宋史·奸臣列傳》：賈似道“寶祐二年（1254年），加同知樞密院事、臨海郡開國公，威權日盛。……四年（1256年），加參知政事。五年（1257年），加知樞密院事。六年（1258年），改兩淮宣撫大使”。《宋史·理宗本紀》開慶元年：“春正月丁卯（二十三），賈似道以樞密使為京西湖南北四川宣撫大使、都大提舉兩淮兵甲、湖廣總領、知江陵府。……六月己亥（二十七），詔獎諭賈似道。……冬十月辛未朔（初一），丁大全罷，以觀文殿大學士判鎮江府。壬申（初二），以吳潛為左丞相兼樞密使，進封相國公；賈似道為右丞相兼樞密使，進封茂國公，宣撫大使等如舊。”</p>\n<p class=\"content\">九月十五，襄陽英雄大會，郭靖出任抗元會盟盟主。</p>\n<p class=\"content\">《神鵰俠侶》第35回：應郭靖之邀，天下英雄陸續抵達襄陽，與蒙古武師的鬥爭也隨之展開。丐幫現任幫主魯有腳被蒙古王子霍都所害，神鵰俠楊過暗助郭襄殺死蒙古武師尼摩星。十五日，英雄大宴群英聚會，共開了四百來桌，襄陽統率三軍的安撫呂文煥、守城大將王堅等向各路英雄敬酒。筵席間眾人說起蒙古殘暴，殺我百姓，奪我江山，無不扼腕憤慨，決意與之一拼。當晚便推舉郭靖為會盟的盟主，人人歃血為盟，誓死抗敵。按：“這一日正是十三，距會期已不過兩天，東南西北各路好漢，猶如百川匯海，紛紛來到襄陽。”</p>\n<p class=\"content\">二十四，郭靖之女郭襄十六歲生日，耶律齊出任丐幫幫主。</p>\n<p class=\"content\">《神鵰俠侶》第36、37回：早在襄陽英雄大會前，楊過就邀請江湖上眾多武林高手，十日內會聚襄陽為郭襄慶賀生日。二十四日，郭襄十六歲生日，楊過派人送來三件禮物：一是殺死蒙古軍隊在唐州、鄧州的前鋒兩千人，並割下左耳；二是以流星煙火為號，燒了蒙古軍隊在南陽的火藥糧草；三是利用金輪國師的弟子達爾巴，揭穿冒充丐幫弟子的霍都王子的真面目，殺之為魯有腳報仇。蒙古軍隊退兵百里，按兵不動。同日，丐幫弟子大會，比武選拔新幫主。當時武氏兄弟都已三十有餘，分別娶了耶律燕和完顏萍為妻，郭芙已嫁給了耶律齊。耶律齊力勝群雄，出任丐幫幫主。按：“這日九月廿四，大會已畢，排定午後推選丐幫的幫主。……今日是襄兒生日，十六年前，襄兒出世後，又過數月，楊過才在絕情谷中與小龍女分手。”</p>\n<p class=\"content\">十月，各路英豪分頭趕赴絕情谷。</p>\n<p class=\"content\">《神鵰俠侶》第37、38回：郭襄在十六歲生日之後，擔心楊過大哥在兩個多月後找不到小龍女會自尋短見，便離家去尋楊過。郭襄路遇蒙古金輪國師，被強收為徒擄往蒙古大營。郭襄激金輪國師與楊過、小龍女比武，兩人起程前往絕情谷。黃蓉尋找郭襄，至風陵渡，在郊外遇見周伯通和一燈大師，相偕同去絕情谷。楊過聞說世上並無南海神尼其人，小龍女生死不明，心急如焚趕往絕情谷。按：“[黃蓉等]三人離開襄陽時方入深秋，沿路緩緩而行，尋消問息，不放過任何蹤跡，到得風陵渡時已是初冬。……秋海棠又叫八月春，那也是挺好看的。這時快十一月了，這裡地氣暖，還有八月春，可真不容易了。”“此時已當十月盡，江南雖不若北方苦寒，這一年卻冷得甚早。”</p>\n<p class=\"content\">十二月初七，楊過、小龍女在闊別十六年後重逢。</p>\n<p class=\"content\">《神鵰俠侶》第38、39回：楊過於十二月初二抵達絕情谷，比之十六年前小龍女的約期還早了五天。初七，小龍女並未如約而至，楊過大失所望，一日一夜不飲不食以後，縱身躍下萬丈深谷。楊過抱著必死之心，卻在絕情谷底與妻子小龍女重逢。存疑：原著記載楊過“此時三十六歲，年方壯盛”，可能是舊版內容未予更正，因為舊版說的十六年之約，要到郭襄十六歲生日的次年三月初七才到期。</p>\n<p class=\"content\">襄陽保衛戰，楊過擊斃元朝皇帝蒙哥。</p>\n<p class=\"content\">《神鵰俠侶》第39回：黃蓉等群豪以為楊過已殉情谷底，回襄陽全力抗擊元朝軍隊。元朝皇帝蒙哥親臨前線督戰，襄陽戰況慘烈。宋朝襄陽守將呂文煥按黃藥師的五行之術，部署“二十八宿大陣”退敵；蒙古金輪國師將徒弟郭襄綁上高臺，逼迫郭靖投降。正在危急時刻，楊過和小龍女趕到襄陽，挫敗金輪國師陰謀。金輪國師臨終向善，捨生救出郭襄。楊過在萬軍陣中擊斃元朝皇帝蒙哥，蒙古大軍撤退，襄陽保衛戰全面獲勝。按：史料將蒙哥在中原被擊斃之事，記載在今年七月。《元史·憲宗本紀》九年己未：“二月丙子（初二），帝悉率諸兵渡雞爪灘，至石子山。丁丑（初三），督諸軍戰城下。辛巳（初七），攻一字城。癸未（初九），攻鎮西門。三月，攻東新門、奇勝門、鎮西門小堡。夏四月丙子（初三），大雷雨凡二十日。乙未（二十二），攻護國門。丁酉（二十四），夜登外城，殺宋兵甚眾。五月，屢攻不克。六月丁巳，汪田哥複選兵夜登外城馬軍寨，殺寨主及守城者。王堅率兵來戰。遲明，遇雨，梯折，後軍不克進而止。是月，帝不豫。秋七月辛亥（初九），留精兵三千守之，餘悉攻重慶。癸亥（二十一），帝崩於釣魚山，壽五十有二，在位九年。追諡桓肅皇帝，廟號憲宗。”</p>\n<p class=\"content\">元朝立王子阿里不哥為帝。</p>\n<p class=\"content\">《神鵰俠侶》第39回：“自蒙古和宋軍交鋒以來，從未有如此大敗，而一國之主喪於城下，更軍心大沮。蒙古大汗之位並非父死子襲，系由皇族王公、重臣大將會議擁立。蒙哥既死，其弟七王子阿里不哥在北方蒙古老家和林得王公擁戴而為大汗。”</p>\n<p class=\"content\">1260年　元世祖中統元年（楊過36歲）</p>\n<p class=\"content\">二月二十三，華山掃墓，重新排定五絕之位。</p>\n<p class=\"content\">《神鵰俠侶》第40回：元軍襄陽退兵，郭靖率領群雄去華山祭掃北丐洪七公之墓。撫今追昔，黃藥師等商定華山新五絕之位，乃東邪黃藥師、西狂楊過、南僧一燈大師、北俠郭靖、中頑童周伯通，以周伯通為首。按：“到得清明（二月二十三）節近，哨探查探明白，蒙古大軍果真退軍，郭靖等一行人悄悄出了北門，徑往華山而
