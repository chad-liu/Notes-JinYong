lass=\"content\">1633年　明思宗崇禎六年（袁承志10歲）</p>\n<p class=\"content\">八月，袁承志救浡泥國張朝唐主僕。</p>\n<p class=\"content\">《碧血劍》第1回：浡泥國那督之子張朝唐經過十年苦讀，回中土應試，誰知明朝已經兵連禍結，民不聊生。張朝唐主僕蒙江湖俠客楊鵬舉相救，卻又誤入袁氏舊部撫育袁承志的隱居之所。袁氏部將擔心他們洩露秘密，正要殺人滅口，幸虧袁承志出言相救。袁承志年方十歲，白天牧牛，晚上跟隨朱安國、倪浩、應松和羅大千等叔叔讀書、練武。按：“其時正是崇禎六年……那牧童約莫十歲上下年紀。”</p>\n<p class=\"content\">十六，袁黨“山宗”在聖峰嶂祭奠袁崇煥。</p>\n<p class=\"content\">《碧血劍》第2回：八月十六，是袁崇煥遇害三週年忌辰。袁氏舊部紛紛來到他的故鄉，在廣東東莞附近的聖峰嶂相聚，祭奠舊主。當時，農民起義烽煙四起，山西義軍在兩年前結成同盟，稱為“三十六營”，“紫金梁”王自用為盟主。其中以闖王高迎祥最為出名，他麾下外甥李自成稱為闖將，英雄了得，威震晉陝。李自成聽說袁黨“山宗”在聖峰嶂聚會，派部將田見秀、劉芳亮、崔秋山前來祭拜。袁承志的四個老師眼見崔秋山武功了得，懇請他傳授承志武藝。崔秋山軍務在身，又推辭不過，便在八九天內傳授了袁承志一套“伏虎拳”。按：“此日正是中秋佳節，張朝唐、楊鵬舉和張康隨著大眾一早上山。”</p>\n<p class=\"content\">九月，明朝錦衣衛安劍清派人來接女兒小慧。</p>\n<p class=\"content\">《碧血劍》第2回：朝廷太監曹化淳派人追捕袁承志，要斬草除根。李自成的部將崔秋山帶著承志避難，與隱居深山的安大娘母女相識。安大娘自從丈夫安劍清投入錦衣衛，害死父母兄長後，便帶著女兒小慧隱姓埋名，決意不和丈夫見面。安劍清訪得母女隱居之所，派胡老三來接女兒。袁承志用新學的“伏虎拳”，幫助安大娘擊退了錦衣衛騷擾。按：“如此過了十多天，這一日安大娘到鎮上去買油鹽等物。”</p>\n<p class=\"content\">十月，袁承志拜華山派掌門穆人清為師。</p>\n<p class=\"content\">《碧血劍》第3回：一百多年前，華山派出過一位名動江湖的大俠，叫令狐沖。當今的華山派掌門人“神劍仙猿”穆人清，武功之高也是舉世無雙，在江湖上行俠仗義，近二十年來從未遇過對手。穆人清多年前收過兩個弟子，大弟子是“銅筆鐵算盤”黃真，二弟子是“神拳無敵”歸辛樹。他還點撥過崔秋山的武藝。經崔秋山介紹，穆人清念袁承志是忠臣之後，又是一個可造之材，便收為關門弟子，悉心培養。按：“這般曉行夜宿，不斷向北行了一個多月。”</p>\n<p class=\"content\">1635年　明思宗崇禎八年（袁承志12歲）</p>\n<p class=\"content\">正月，農民義軍七十二營的“滎陽大會”。</p>\n<p class=\"content\">《碧血劍》第20回：三十六營盟主王自用被官府剿滅，義軍群龍無首。是年正月，“闖王”高迎祥和“八大王”張獻忠、“曹操”羅汝才等十三家七十二營義軍大會於滎陽，商議拒敵之計。高迎祥麾下“闖將”李自成進言，眾頭領聽之。李自成佔領富平、固州以後，與明朝總督洪承疇戰於渭南、臨潼，大敗東走。李自成的部將高傑，在軍中與李自成的妻子邢氏私通。高傑怕走漏風聲，李自成殺他，帶了邢氏逃跑，還帶走了一批部隊投降朝廷，官至總兵，與闖王義軍為敵。據《明史·流賊李自成傳》：“八年正月，大會於滎陽。老回回、曹操、革裡眼、左金王、改世王、射塌天、橫天王、混十萬、過天星、九條龍、順天王及迎祥、獻忠共十三家七十二營，議拒敵，未決。自成進曰：一夫猶奮，況十萬眾乎！官兵無能為也。宜分兵定所向，利鈍聽之天。皆曰：善。……承疇遣將追自成，小捷，至醴泉。賊將高傑通於自成妻邢氏，懼誅，挾之來降。承疇身追自成，大戰渭南、臨潼，自成大敗東走。”</p>\n<p class=\"content\">1636年　明思宗崇禎九年（袁承志13歲）</p>\n<p class=\"content\">七月，農民義軍李自成被推舉為“闖王”。</p>\n<p class=\"content\">《碧血劍》第3回：高迎祥進攻西安兵敗，為陝西巡撫孫傳庭所殺，李自成被諸營首領推舉為“闖王”，率領義軍繼續征戰在四川、甘肅、陝西一帶。同年，後金政權改稱清朝，皇太極稱帝，清軍第三次入關攻城略地，明朝政權內憂外患，風雨飄搖。至此，袁承志華山學藝一晃已是三年，年方十三。這三年之中，師父穆人清又傳了他“破玉拳”和“混元掌”，身子已出落得壯健異常，百病不侵。據《明史·流賊李自成傳》：“九年……秋七月，擒迎祥於盩啡，獻俘闕下，磔死。於是賊黨乃共推自成為闖王矣。”</p>\n<p class=\"content\">1637年　明思宗崇禎十年（袁承志14歲）</p>\n<p class=\"content\">五月，鐵劍門木桑道長在華山傳授袁承志輕功。</p>\n<p class=\"content\">《碧血劍》第3、20回：木桑道長和玉真子都是鐵劍門弟子，開山祖師所用的鐵劍代代相傳，稱為“掌門之寶”。有一年他們的師父在西藏逝世，鐵劍從此不知下落。玉真子初時勤於學武，為人正派，不料師父一死，沒人管束，竟然奸盜濫殺無惡不作，師兄弟劃地絕交。木桑道人為了避開師弟，來到華山，與袁承志圍棋娛樂。他在華山絕頂一住就是半年，把一身輕功和暗器心法毫不藏私地傳給承志，還把一件用烏金絲和金絲猴毛織成的護身背心送給承志。按：“這一年端午節，吃過雄黃酒，穆人清又請出祖師爺的畫像。”</p>\n<p class=\"content\">十月，華山派袁承志得到“金蛇郎君”夏雪宜的重寶秘術。</p>\n<p class=\"content\">《碧血劍》第3、4回：袁承志在華山頂上馴養了兩頭巨猿，因巨猿手掌中了金蛇郎君的金蛇錐，承志循跡來到當年夏雪宜藏身的山洞，石壁上有警示：“重寶秘術，付與有緣，入我門來，遇禍莫怨。”承志按照夏雪宜的指引，得一裝有《金蛇秘笈》的鐵盒，卻對書中內容不甚了了。按：“這天正是初冬，袁承志上午練了拳劍，下午和木桑在樹下對弈。……袁承志在十四歲上無意中發現鐵盒，這些年來早把這件事忘得乾乾淨淨。”</p>\n<p class=\"content\">1638年　明思宗崇禎十一年（李文秀18歲、袁承志15歲）</p>\n<p class=\"content\">春，漢族女孩李文秀拜“一指震江南”華輝為師。</p>\n<p class=\"content\">《白馬嘯西風》：“呂梁三傑”霍元龍、陳達海等人在回疆大漠尋找李文秀整整十年。那年春天，李文秀眼見蘇普已和阿曼相愛，傷心之下信馬由韁，不想與這夥漢人強盜相遇。隱藏在戈壁山洞裡療毒的“一指震江南”華輝，在李文秀的幫助下拔出背上十二年的毒針，收李文秀為徒，授其武藝。按：“這十年之中，大家永遠不停地在找這小女孩，草原千里，卻往哪裡找去？”“十七八歲的年輕姑娘，雖然寂寞傷心，花一般的年月之中，總是有不少的歡笑和甜蜜。”</p>\n<p class=\"content\">八月十五，仙都派掌門黃木道人失蹤。</p>\n<p class=\"content\">《碧血劍》第16回：仙都派是武當派的旁支，歷史悠久，第四代掌門人菊潭道長因濫殺無辜，在恆山受到各派劍客圍攻，終於筋疲力盡以匕首自殺。從此仙都派定下一條規矩，每名學藝完畢的弟子都授一把匕首，名曰“仙都戒殺刀”，訓示：“嚴戒擅殺，善視珍藏，義所不敵，舉以自戕”。每兩年一次在仙都山大會，有人犯戒，便得在師長兄弟之前，用戒殺刀自行了斷。是年中秋，又是大會之期，掌門人黃木道人云遊在外，既不回山主持，也不帶信回來，弟子水雲、閔子華、洞玄等又是奇怪又是擔憂。點蒼派“追風劍”萬里行捎來書信，仙都派弟子趕往雲南，方知師父在大理城外遭五毒教圍攻，生死不明。仙都派三十二弟子同下雲南尋師，始終沒半點線索。原來是五毒教教主何鐵手的姑姑何紅藥，聽說黃木道人認得金蛇郎君夏雪宜，便綁架了道人要逼問金蛇郎君的下落。按（1643年）：五年前的中秋，又是大會之年。</p>\n<p class=\"content\">九月，清軍長驅直入。</p>\n<p class=\"content\">《碧血劍》第11回：自從督師袁崇煥被害，明朝朝中無人，再也無力抗禦清兵。1636年六月，清皇太極派阿齊格、阿巴泰等大將進攻長城，直打到北直隸腹地。1638年，九王多爾袞率領阿巴泰等人又打到北直隸，漢臣盧象昇和孫承宗先後殉國。多爾兗那年還攻破濟南，俘虜明朝四十多萬百姓北去。據《明史·莊烈帝本紀》崇禎九年：“秋七月，己未（十七），大清兵入昌平，巡關御史王肇坤等死之。……是月，大清兵入寶坻，連下近畿州縣。”崇禎十一年：“九月，辛巳（二十二），大清兵入牆子嶺，總督薊遼兵部侍郎吳阿衡死之。……十一月戊辰（初十），大清兵克高陽，致仕大學士孫承宗死之。……十二月庚子（十二），盧象昇兵敗於鉅鹿，死之。”</p>\n<p class=\"content\">1640年　明思宗崇禎十三年（李文秀20歲、袁承志17歲）</p>\n<p class=\"content\">哈薩克高手華輝和計老丈同歸於盡。高昌迷宮真相大白。</p>\n<p class=\"content\">《白馬嘯西風》：李文秀向華輝學習武藝，兩年下來已然成為武林高手。風雪之夜，蘇普和阿曼避雪來到計老丈家，“呂梁三傑”陳達海查訪地圖也來到計老丈家。一個詢問兒時的夥伴，一個追查當年的漢族小姑娘，雙方動起手來。李文秀女扮男裝，幫助蘇普禦敵。李文秀髮現當年為蘇普裹傷的手帕，他一直帶在身邊，正是那張高昌迷宮地圖。陳達海奪走地圖，去戈壁尋寶，李文秀、蘇普等人尾隨而去，來到高昌國迷宮。哈薩克人發現在迷宮中裝成千年惡鬼的華輝，正是二十年前被逐出本族的瓦耳拉齊。計老丈為了救護李文秀，出手和師父瓦耳拉齊相鬥，師徒同歸於盡，原來計老丈的真面目，不過是個三十多歲的壯漢。高昌迷宮中本無寶物，只是些中原隨處可見的書籍文物、諸般用具，傳說在迷宮中的奇珍異寶，在一千年前就已被唐朝軍隊運去長安。李文秀把對蘇普的眷戀深深地埋在心底，騎著父母遺下的白馬回到中原。按：“蘇魯克雖然大醉，但十二年來心中念念不忘深仇大恨。”</p>\n<p class=\"content\">十二月，闖王李自成三卜三吉。</p>\n<p class=\"content\">《碧血劍》第19回：闖王李自成屢戰屢敗，被官軍重重圍困於巴西、魚復諸山中。李自成想上吊，被侄兒李雙喜勸止。李自成走進一座廟宇，對老兄弟劉宗敏說：“人言我當為天子，盍卜之，不吉，斷我頭以降。”結果三卜三吉，劉宗敏殺妻誓死相從。李自成燒了行李輜重，輕騎急奔，從鄖陽、均縣殺入河南。正好河南大旱，災民相從者數萬，於是從南陽攻宜陽，殺知縣唐啟泰，攻永寧，殺知縣武大烈。從此打一仗，勝一仗，一路捷報頻傳。據《明史·流賊李自成傳》：“時十三年十二月也。”</p>\n<p class=\"content\">明朝李巖夫婦投奔闖軍。</p>\n<p class=\"content\">《碧血劍》第4回：李巖原名李信，前兵部尚書李精白之子，本是杞縣舉人，因賑濟災民，得罪了縣官和富室，被誣陷入獄。女俠紅娘子仰慕他的為人，率領災民攻破牢獄，救他出來。兩人結成夫婦，投入闖王軍中。李巖作歌謠：“迎闖王，不納糧”，令小兒唱誦，投奔闖王的人越來越多。據《明史·流賊李自成傳》。</p>"},{"title":"《碧血劍》故事編年（1633-1645）","content":"</a>\n<p class=\"sectionTitle\">《碧血劍》故事編年（1633-1645）</p>\n<p class=\"content\">【背景】公元17世紀40年代，李自成的農民起義軍克洛陽，破潼關，勢如破竹直逼北京。崇禎帝煤山上吊，明朝亡，李自成建立大順政權。山海關明將吳三桂為雪奪妾之恨，勾結清攝政王多爾袞，夾攻大順軍。清軍入關，清朝開始。李自成退出北京，在武昌府通山縣九宮山走上英雄末路。</p>\n<p class=\"content\">【概要】江湖門派主要有華山派、棋仙派、五毒教、鐵劍門、仙都派、金龍幫和金蛇營等。明朝督師袁崇煥之子袁承志，七歲喪父，十歲拜華山派掌門穆人清為師，二十歲投奔闖王李自成，成為金蛇營首領。闖王起義失敗後，袁承志避居海外，他深愛著金蛇郎君的女兒夏青青，又牽掛著崇禎帝的獨臂公主阿九。</p>\n<p class=\"content\">【紀年】崇禎六年（1633年），“山宗”祭奠袁崇煥三週年忌辰，故事開始。1645年，“揚州十日”，九宮山闖王失蹤，故事結束。</p>\n<p class=\"content\">1641年　明世宗崇禎十四年（袁承志18歲）</p>\n<p class=\"content\">正月，闖王李自成攻克洛陽，殺萬曆皇帝的兒子、福王朱常洵。</p>\n<p class=\"content\">《碧血劍》第3回：“但現下局面不同了，闖王節節勝利，洛陽已得，一兩年內，便可進取北京。闖王英明神武，那時由他來主持大局，哪裡還怕遼東滿洲人入寇？”據《明史·流賊李自成傳》：“十四年正月攻河南，有營卒勾賊，城遂陷，福王常洵遇害。自成兵汋王血，雜鹿醢嘗之，名福祿酒。王世子由崧裸而逃。”</p>\n<p class=\"content\">1642年　明世宗崇禎十五年（袁承志19歲）</p>\n<p class=\"content\">二月二十一，明朝總督洪承疇降清。</p>\n<p class=\"content\">《碧血劍》第13回：洪承疇是明朝的薊遼總督，崇禎皇帝委以兵馬大權。洪承疇在松山之戰兵敗被擒，降了清。松山失陷之初，崇禎還以為他已殉國，曾親自隆重祭祀。後來得知其降清，天下都笑崇禎無知人之明。據《明史·莊烈帝本紀》崇禎十五年：“二月，戊午（十八），大清兵克松山，洪承疇降。”《清史稿·太宗本紀》崇德七年：“春二月，戊午（十八），阿濟格奏敗明兵於寧遠。辛酉（二十一），豪格、阿達禮、多鐸、羅洛宏奏拔松山，擒明總督洪承疇。”</p>\n<p class=\"content\">秋，仙都派弟子閔子華欲為兄長報仇。</p>\n<p class=\"content\">《碧血劍》第8回：十八年前，金龍幫幫主焦公禮仗義執劍，剷除武林敗類閔子葉。今年秋天，有朋友傳話給焦公禮，說閔子葉的兄弟閔子華在仙都派藝成下山，得知焦公禮是他殺兄仇人，要來報仇。按（1643年）：“去年秋天，有朋友傳話給我。”</p>\n<p class=\"content\">十二月，“太白三英”投奔清王爺多爾袞。</p>\n<p class=\"content\">《碧血劍》第8、9回：史秉光、史秉文、黎剛是陝西秦嶺太白山太白派的三個盟兄弟，號稱“太白三英”。“太白三英”眼見清兵勢大，賣身投靠清九王爺多爾袞。多爾袞寫信，吩咐他們伺機奪取江南幫會的地盤，挑撥武林人士自相殘殺，同時設法擴充勢力，等清兵入關，便起事內應。正好金龍幫焦公禮前來，請求史家兄弟澄清自己當年與仙都派的過節，史家兄弟非但不去向仙都派解釋，反而從中挑撥，幫助閔子華大舉約人，企圖擴大事態。按（1643年）：“師父（焦公禮）去年臘月趕去陝西，連年也不在家裡過，就為這事了？”</p>\n<p class=\"content\">1643年　明世宗崇禎十六年（袁承志20歲）</p>\n<p class=\"content\">正月十六，華山派袁承志得“金蛇郎君”的藏寶地圖。</p>\n<p class=\"content\">《碧血劍》第3、4回：袁承志十歲那年上華山拜師學藝，十年來拳劍內功與日俱深。天下已如沸如羹，闖王李自成節節勝利，明朝政權危如累卵。袁承志奉師命下山之前，正遇到棋仙派弟子張春九、汪禿子來華山搜尋藏寶地圖，兩個貪婪之徒內訌而死。袁承志在六年前撿到的鐵盒裡，發現“金蛇郎君”夏雪宜遺下的《金蛇秘笈》和藏寶地圖，圖後留有遺囑：“得寶之人，真乃我知己也。務請赴浙江衢州靜巖，尋訪女子溫儀，贈以黃金十萬兩。”袁承志研習秘笈，對照山洞中的石刻圖解，練熟了“金蛇劍法”，從容下山。按第8回：“這天正是初春。……我五個爺爺每年正月十六，總是派了幾批子侄徒弟出去尋訪探找。”</p>\n<p class=\"content\">三月，華山派袁承志拜見闖王李自成。</p>\n<p class=\"content\">《碧血劍》第4回：袁承志來到闖王軍中，方知師父穆人清和崔秋山已去江南籌措軍餉。闖王對袁承志青眼有加。承志與闖王軍中的李巖公子意氣相投，結為兄弟。按：“我混元功早已練成，為了這部金蛇秘笈，卻在山上多耽了兩個月功夫。”</p>\n<p class=\"content\">初七，闖王李自成斬“曹操”羅汝才。</p>\n<p class=\"content\">《碧血劍》第19回：羅汝才是“滎陽大會”十三家起義軍的大首領，兩年前歸順李自成，封為“代天輔民威德大將軍”。羅汝才功高戰勇，足智多謀，闖軍老兄弟劉宗敏對他十分嫉妒，在闖王面前屢加詆譭。黃州書生陳黃中進讒言說，羅汝才軍中戰馬的屁股上都烙了個“左”字，是要投向明軍左良玉。李自成信以為真，派兵偷襲羅汝才，將他殺了。其實馬軍分為前後左右五隊，分別烙字是為了避免混亂，陳黃中叫人牽來的，全是左隊馬軍的馬，竟釀成闖軍自相殘殺的慘禍。據《明史·莊烈帝本紀》崇禎十六年：“三月庚子（初七），李自成殺羅汝才，並其眾。”《明史·流賊李自成傳》：“十六年，自成自號奉天倡義大元帥，號羅汝才代天撫民威德大將軍。……自成善攻，汝才善戰，兩人相須若左右手。自成下宛、葉，克梁、宋，兵強士附，有專制心，顧獨忌汝才。乃召汝才所善賀一龍宴，縛之，晨以二十騎斬汝才於帳中，悉兼其眾。”</p>\n<p class=\"content\">四月，華山派袁承志大鬧溫氏棋仙派。</p>\n<p class=\"content\">《碧血劍》第4-7回：溫青青是當年“金蛇郎君”夏雪宜和溫儀生的女兒，今年十八歲。青青盜取闖王從江南籌措的軍餉，受到華山派弟子、游龍幫等黑道人物的追蹤。袁承志路遇夏青青，輾轉來到浙江衢州溫家，見到溫儀，悉知當年夏雪宜與溫家的恩怨情仇。華山派大弟子黃真，帶著徒弟崔希敏、安小慧來到溫家索取軍餉，與溫氏五老大打出手。袁承志使用“金蛇劍法”，破了溫氏五老的五行八卦陣，軍餉如數歸還。溫氏五老蛇蠍心腸，殺害女兒溫儀。溫青青改名夏青青，追隨袁承志浪跡天涯。按：“溫青青道，我十八歲，你呢？袁承志道，我大你兩歲。”</p>\n<p class=\"content\">五月，華山派袁承志為金龍幫和仙都派調停。</p>\n<p class=\"content\">《碧血劍》第8、9回：仙都派弟子閔子華為十九年前兄長遇害一事，糾集武林朋友向金龍幫尋仇，已經投靠清廷的“太白三英”趁機推波助瀾，意在挑起武林爭鬥，以收漁翁之利。金龍幫主焦公禮寡不敵眾，準備一死以泯宿仇。袁承志獲知事件真相後，仗義出手，當眾出示當年飛虎寨主的伏辯和丘道臺的謝書，說明閔子葉確是不良該殺之輩。袁承志還出示清朝九王爺多爾袞給“太白三英”的密諭，揭穿了他們投敵賣國的真面目。金龍幫和仙都派握手言和，焦公禮和女兒焦宛兒感激不盡。夏青青從藏寶地圖上得知，二百多年前建文帝遺下的內府重寶，地點就在魏國公府內。夏青青又得知這座宅邸現在閔子華手中，便使盡心機將宅邸贏了過來。按：“其時天氣正熱，衣衫單薄，雨水浸溼後甚是不雅，青青又羞又急，伏在涼亭欄杆上哭了出來。”</p>\n<p class=\"content\">華山派袁承志和二師兄歸辛樹過招比武。</p>\n<p class=\"content\">《碧血劍》第9、10回：歸辛樹是華山派掌門穆人清的二弟子，歸氏夫婦已經收了好幾個徒弟。大弟子梅劍和、三弟子劉培生、五弟子孫仲君應邀參加仙都派的尋仇大會。“飛天魔君”孫仲君不問青紅皂白，將金龍幫弟子羅立如的右臂斬落，“沒影子”梅劍和將袁承志出示的書證當眾扯碎，袁承志出手教訓，他們又不相信這位少年竟是他們的師叔。歸辛樹夫婦不認識袁承志，師兄弟正在過招印證門派之時，師父穆人清趕到。孫仲君被罰以終生不許用劍，歸氏夫婦被責以教徒不嚴、為長不尊。歸氏夫婦對袁承志耿耿於懷。按：“闖王今秋要大舉起事。”說明時未至秋。</p>\n<p class=\"content\">六月，華山派袁承志降伏山東八寨和河北青竹幫。</p>\n<p class=\"content\">《碧血劍》第10、11回：袁承志和夏青青按圖索驥，在魏國公府內取出十箱金銀珠寶，袁承志喬裝改扮將珠寶北運，資助闖王攻打北京。黑道各幫派聞風而動，山東惡虎溝寨主沙天廣、千柳莊莊主褚紅柳、河北青竹幫幫主程青竹等江洋大盜紛至沓來要當道攔劫。袁承志不動聲色，後發制人，群盜為其驚天神功所懾服。袁承志率領群盜截下朝廷漕運，救出孫仲壽等被朝廷擒獲的袁黨“山宗”，眾人願意追隨袁督師的公子，為闖王效力。袁承志在此事件中認識了程青竹的徒弟九姑，她是崇禎皇帝的小女兒，因出宮打獵與幼時師父相遇。</p>\n<p class=\"content\">七月二十，泰山大會，華山派袁承志被推舉為七省江湖首領。</p>\n<p class=\"content\">《碧血劍》第11回：七月二十，江蘇、河北、山東、浙江、河南、贛北等七省草莽英雄在泰山石經谷聚會，袁部舊將英賢畢至，大家一致推舉袁承志擔任七省江湖會盟的盟主，舉旗造反，救民於水火，為督師袁崇煥報仇。這時，闖王李自成屬下有橫天王、爭世王、亂世王、改世王、左金王等十三營，分佈在中原、西北各地與明軍對抗，袁承志這支人馬，江湖上就稱為“金蛇王營”。按：“七月二十清晨絕早，群雄在石經谷會聚。”</p>\n<p class=\"content\">孟家神拳孟伯飛六十大壽。</p>\n<p class=\"content\">《碧血劍》第12回：保定府富豪孟伯飛是孟家神拳、快活十三掌的創始人，仗義疏財，最愛朋友，人稱“蓋孟嘗”。孟伯飛六十大壽，江湖賀客達三千多人。鳳陽總督馬士英重金製成八十顆茯苓首烏丸，有起死回生之效，密請永勝鏢局總鏢頭董開山護送四十顆上京，進貢崇禎皇帝。華山派二弟子歸辛樹聞訊，為了搶救病重垂危的幼子歸鍾，一路追蹤而來。董開山混入賀客人群，將茯苓首烏丸藏在賀禮壽桃之中。壽宴上風波陡起。袁承志鬥智鬥勇，識破董開山的機關，為二師兄奪得救子藥丸，歸氏夫婦感激不盡，師兄弟前嫌盡釋。</p>\n<p class=\"content\">八月，華山派袁承志挫毀紅夷大炮。</p>\n<p class=\"content\">《碧血劍》第12、13回：李自成在河南南陽、汝州大破兵部尚書孫傳庭所統官兵，進逼潼關。朝廷將原本用於關遼，抵禦清軍隊的葡萄牙大炮調往潼關，對付李自成義軍。運輸大炮的葡萄牙軍人在河北高碑與袁承志遭遇，洋人首領雷蒙和彼得為了一個叫若克琳的女子發生內訌，袁承志設計將大炮盡數毀壞，為兩個月後李自成攻陷潼關立下大功。按：“侯文飛道，袁盟主是七省總盟主，眾兄弟齊奉號令。……袁承志道，這還是上個月的事。”</p>\n<p class=\"content\">初九，清皇帝皇太極身亡，順治即位。</p>\n<p class=\"content\">《碧血劍》第13、14回：皇太極，清締造者努爾哈赤的第八個兒子，是當年用反間計殺害袁崇煥的元兇。袁承志為報父仇，潛入滿清京城行刺皇太極。第一次入宮，被已成為清廷爪牙的鐵劍門弟子玉真子擒獲，幸虧當年袁部大將祖大壽捨命放出。祖大壽雖然被迫降清，對故主袁崇煥的恩義依然眷眷在懷。袁承志第二次入宮，是在八月初九，目睹皇太極被九弟睿親王多爾袞刺殺。睿親王多爾袞向來極得皇太極的寵信，手掌兵權，卻和嫂嫂莊妃私通。他殺了皇太極，第二天宣佈皇帝“無疾而終”，由莊妃六歲的兒子福臨繼位。按：“滿清皇帝皇太極在八月庚午夜裡無疾而終，皇太極的兒子福臨接位做皇帝。小皇帝年方六歲，由睿親王多爾袞輔政。”據《清史稿·太宗本紀》崇徳八年：“八月，庚午，上御崇政殿。是夕，亥時，無疾崩，年五十有二，在位十七年。九月壬子，葬昭陵。”</p>\n<p class=\"content\">十月，明朝太監曹化淳勾結清廷，策劃廢立帝位。</p>\n<p class=\"content\">《碧血劍》第15-17回：眼見闖王李自成勢如烽火，崇禎皇帝的叔父、惠王爺朱常潤勾結宮中大太監曹化淳，密謀私通清睿親王多爾袞，想借清兵入關消滅闖軍。崇禎知道清廷虎狼之心，借兵滅寇後患無窮，是以堅辭不允。於是，惠王爺和曹化淳策劃廢除崇禎，立惠王為帝，然後引清兵入關。為達此目的，惠王爺在王府招賢館聚集了不少武林好手，主要有“太白三英”，棋仙派溫氏五祖和雲南五毒教的眾多高手。曹化淳派出五毒教去戶部偷盜庫銀，誘使崇禎大發雷霆，將忠於皇上的周將軍和傅尚書下旨革職，為惠王爺篡位清除障礙。按（十一月）：“原來上個月戶部大庫接連三次失盜，被劫去數千兩庫銀。”</p>\n<p class=\"content\">初六，闖王李自成攻破潼關。</p>\n<p class=\"content\">《碧血劍》第13、17回：闖軍進攻潼關，明朝兵部尚書、督師孫傳庭戰死，麾下大將高傑棄關逃赴西安。十月初六，闖軍攻破潼關，得西安，再取北京。袁承志部毀炮挫敵之功甚巨，“金蛇營”名聲大振。《明史·莊烈帝本紀》崇禎十六年：“冬十月，丙寅（初六），李自成陷潼關，督師尚書孫傳庭死之。”</p>\n<p class=\"content\">十一月初二，“太白三英”殺金龍幫焦公禮。</p>\n<p class=\"content\">《碧血劍》第15、16回：今年五月，經袁承志調解，仙都派閔子華和金龍幫焦公禮握手言和。“太白三英”挑撥武林爭鬥的陰謀不甘心就此作罷，於八月十七日夜在蚌埠通商大客棧，偷走閔子華的“仙都戒殺刀”，趁焦公禮參加泰山大會後南下，於十一月初二將其在徐州殺害，並將“仙都戒殺刀”留在焦公禮屍首上，意在嫁禍仙都派。金龍幫大為震動，全力追殺閔子華。袁承志經過反覆的調查核對，揆情度理，終於揭穿了“太白三英”的漢奸伎倆。按：“但昨晚夜裡，小弟的戒殺刀忽然給萬惡狗賊偷去，真是慚愧之至。如果尋不回來，我再沒面目見大師兄了，千萬千萬。小弟閔子華拜上，八月十八日。……爹爹於十一月初二在徐州被害。”</p>\n<p class=\"content\">十二月，雲南五毒教劫走夏青青。</p>\n<p class=\"content\">《碧血劍》第16、17回：雲南五毒教現任教主何鐵手，是個二十三歲的美貌姑娘，她羨慕袁承志的功夫和神采，一心要拜袁承志為師。何教主的姑姑何紅藥，還在為十幾年前“金蛇郎君”的移情別戀恨恨不已，五年前綁架仙都派掌門人，逼問夏雪宜的下落沒有結果。當她得知夏青青就是夏雪宜和另外一個女子生的女兒，不由得妒性大發，糾集教中子弟劫走夏青青，關押在宮中惠王爺的招賢館中。按：“這時正當隆冬，寒風刺骨，暖轎底下都結了冰。”</p>\n<p class=\"content\">1644年　明世宗崇禎十七年（袁承志21歲）</p>\n<p class=\"content\">正月初一，闖王李自成在西安建立大順政權。</p>\n<p class=\"content\">《碧血劍》第17回：闖軍自去年十月攻破潼關，旋得西安。李自成改名李自晟，自立為王，國號大順，年號永昌。據《明史·流賊李自成傳》：“十七年正月庚寅朔（初一），自成稱王於西安，僭國號曰大順，改元永昌，改名自晟。”</p>\n<p class=\"content\">二月，華山派袁承志與九姑在深宮重逢。</p>\n<p class=\"content\">《碧血劍》第17、18回：袁承志自去年六月與崇禎皇帝的小女兒九姑相遇，對其音容笑貌縈繞在心。承志深入皇宮去救青青，為了躲避惠王府爪牙的追捕，倉猝間進入九姑公主的閨房。情急之下兩人共枕而臥，肌膚相接，承志方知九姑對自己也是一往情深。袁承志從民族大義和闖軍安危出發，粉碎了惠王爺和曹化淳改立皇帝、借兵滅寇的陰謀。</p>\n<p class=\"content\">二十九，闖王李自成攻克寧武關。</p>\n<p class=\"content\">《碧血劍》第18回：李自成的軍隊逼近北京，在代州與明朝總兵周遇吉激戰。明軍糧盡，退守寧武關。二月二十九，李自成攻陷寧武關，總兵周遇吉戰死。袁承志在宮中聽到闖軍攻下寧武關的喜訊，與夏青青、焦宛兒等人歡呼雀躍。《明史·莊烈帝本紀》崇禎十七年：“二月，乙亥（十六），議京師城守。李自成攻代州，總兵官周遇吉力戰，食盡，退守寧武關。……戊子（二十九），李自成陷寧武，周遇吉力戰死之。”</p>\n<p class=\"content\">三月，闖王李自成進攻北京勢如破竹。</p>\n<p class=\"content\">《碧血劍》第18回：大同、宣府、居庸，都是京師外圍要塞，向來駐有重兵。崇禎不信武將，每軍都派有親信太監監軍。三月初二，闖軍克大同，明軍總兵姜瓖投降。三月十一，闖軍克宣府，監軍太監杜勳投降。三月十五，闖軍克居庸，總兵唐通、監軍太監杜之秩投降。據《明史·莊烈帝本紀》崇禎十七年：“三月庚寅（初二），賊至大同，總兵官姜瓖降賊，……己亥（十一），李自成至宣府，監視太監杜勳降，癸卯（十五），……唐通、杜之秩降於自成，賊遂入關。”</p>\n<p class=\"content\">華山派袁承志收五毒教主何鐵手為徒。</p>\n<p class=\"content\">《碧血劍》第18回：闖軍兵臨城下，五毒教教主何鐵手毅然擺脫惠王爺和曹化淳的束縛，不顧姑姑何紅藥和教中高手的反對，幫助袁承志救出夏青青。袁承志同意收其為徒，改名何惕守。</p>\n<p class=\"content\">十九，闖軍進入北京，明朝崇禎皇帝在煤山上吊。</p>\n<p class=\"content\">《碧血劍》第18回：李自成日夜攻城，袁承志率領城內江湖群豪裡應外合，崇禎皇帝知道大勢已去，在煤山上吊而死。崇禎皇帝臨死前欲殺九姑，將九姑的右臂砍落。袁承志打開正陽門，李自成的軍隊蜿蜒進入北京，封袁承志為果毅將軍。據《明史·流賊李自成傳》：“十八日，賊攻益急，自成駐彰義門外，……帝出宮，登煤山，望烽火徹天，嘆息曰：苦我民耳。徘徊久之，歸乾清宮，令送太子及永王、定王於戚臣周奎、田弘遇第，劍擊長公主，趣皇后自盡。……長公主絕而復甦，舁至，令賊劉宗敏療治。”《明史·莊烈帝本紀》崇禎十七年：“三月，丙午（十八），日晡，外城陷。是夕，皇后周氏崩。丁未（十九），昧爽，內城陷。帝崩於萬歲山，王承恩從死。”《中國通史》卷九：十八日夜間，大順軍架飛梯攻西直、平則、德勝諸門。太監曹化淳開彰義門，農民軍一擁而入。太監張殷勸崇禎帝只要投降便無事，被崇禎帝一劍殺死。此時的崇禎帝已是精疲力竭，感情從憤恨、失望轉向了瘋狂，他把周皇后和袁妃叫來，連呼左右進酒，一口氣飲了幾十杯。他不能看著他的愛妃陷入敵手，於是揮劍將袁妃砍死。皇后急赴坤寧宮自縊。長平公主在一旁痛哭不已，崇禎帝悲嘆道：“汝為何生我家！”一劍砍去，公主揮臂遮擋，被砍斷右臂，昏倒在地。接著又殺了幼女昭仁公主及幾個嬪妃。</p>\n<p class=\"content\">闖王李自成豔遇美女陳圓圓。</p>\n<p class=\"content\">《鹿鼎記》第32回：陳圓圓原名邢沅，常州奔牛鎮的一個小家碧玉，因家道貧困淪入蘇州娼家。當時，明朝的江山已經搖搖欲墜，後宮卻依然明爭暗鬥。崇禎皇帝寵愛田貴妃，冷落了周皇后。周皇后的父親嘉定伯為了分寵，將陳圓圓從蘇州妓院裡買出來，送入宮中。崇禎皇帝沉湎於陳圓圓的美色，連續三天沒有上朝，闖王李自成攻破了三座城市。崇禎皇帝遷怒於陳圓圓，將她送回周國丈府中。崇禎皇帝派總兵吳三桂去鎮守山海關，京城裡的達官顯貴紛紛為三桂餞行。吳三桂在周國丈府裡見到陳圓圓，心神俱蕩，向國丈討去做了小妾。吳三桂離京不久，闖王李自成攻下北京，陳圓圓被闖王部將劉宗敏擄去，送給李自成。一代豪傑和絕世美女兩情相悅，斷送了大順國如火如荼的勝利成果。參見《中國曆代名女·名妓卷》“陳圓圓紅顏傾倒大順國”。</p>\n<p class=\"content\">闖軍在北京施暴，發生內訌。</p>\n<p class=\"content\">《碧血劍》第19回：闖軍進城後，部將劉宗敏、高必正等放縱士卒姦淫搶劫，京城百姓再次陷入水深火熱。李自成授意將明朝大官捉來拷打，逼他們交出金銀，朝野人心惶惶。劉宗敏要將九姑佔為己有，與袁承志發生爭執。起義之初追隨李自成的老兄弟，和後來投奔李自成的“左革五營”發生內訌，權將軍劉宗敏殺了亂世王藺養成、革裡眼賀一龍，老回回馬守應見情勢不對，反出順天，投西南而去。</p>\n<p class=\"content\">華山派袁承志離京赴華山。</p>\n<p class=\"content\">《碧血劍》第19回：李自成在河南之時，軍師宋獻策造讖語：“十八子，主神器”，進京之後，丞相牛金星在後面加上“山下石，坐龍椅”，誣陷制將軍李巖圖謀篡位。李巖因此遭到李自成的嫉恨。袁承志眼見闖軍四分五裂，危機重重，奉師父之命，離京前往華山，請程青竹和焦宛兒悉心照顧九姑。</p>\n<p class=\"content\">明朝大臣在南京立福王為帝。</p>\n<p class=\"content\">《碧血劍》第20回：福王朱由崧是崇禎皇帝的堂弟，他父親朱常洵是前光宗皇帝的兄弟。福王雖與帝脈較近，但為人昏淫，南朝兵部尚書史可法以潞王朱常淓較為賢明，主張立潞王。鳳陽總督馬士英掌握兵權，為了日後便於控制朝政，力挺福王，與駐兵江北的四大總兵高傑、劉澤清、劉良佐、黃得功聯絡，派兵迎來了福王。史可法無可奈何，只得同意。據《明史·奸臣馬士英傳》：“十七年三月，京師陷，帝崩，南京諸大臣聞變，倉卒議立君。……士英亦自廬、鳳擁兵迎福王至江上，諸大臣乃不敢言。王之立，士英力也。”</p>\n<p class=\"content\">四月十五，華山派門人大會。</p>\n<p class=\"content\">《碧血劍》第19-20回：華山派掌門人穆人清書諭諸弟子：“吾華山派歷來門規，不得在朝廷居官任職。今闖王大業克就，吾派弟子功成身退，其於四月月圓之夕，齊聚華山之巔。”至四月十五，華山派門人在華山之巔聚會，穆人清將掌門之位授予大弟子黃真。鐵劍門不肖弟子玉真子在西藏找到了開山祖師的“鐵劍”，來與師兄木桑道人為難，被袁承志等華山派弟子圍剿而死。五毒教何紅藥設計毒死浙江棋仙派溫氏五祖，劫持溫青青，在華山尋得“金蛇郎君”夏雪宜的遺骸，殉情火海。夏青青將父母骨灰合葬，了卻母親心願。穆人清同意何惕守加入華山派，何惕守正式成為袁承志的弟子。九姑拜鐵劍門木桑道長為師，隨師父去藏邊學藝。按：“安大娘安慰他道，這日正是華山派的會期。”</p>\n<p class=\"content\">二十二，明朝將領吳三桂引清兵入關。</p>\n<p class=\"content\">《碧血劍》第20回：明朝駐守山海關的將領吳三桂，見明朝已亡，正準備歸順闖軍，卻聽得闖軍將領劉宗敏搶了他的愛妾陳圓圓，獻給李自成，衝冠一怒為紅顏，便投降了清王爺多爾袞。李自成親率大軍征討山海關，四月二十二在一片石大戰，被吳三桂和多爾袞的聯軍擊敗。李自成敗回北京，於四月二十九登基稱帝，第二天便逃往西安。清軍佔領北京。據《明史·流賊李自成傳》：“四月二十二日，自成兵二十萬，陣於關內，自北山亙海。我兵對賊置陣，三桂居右翼末，悉銳卒搏戰，殺賊數千人，賊亦力鬥，圍開復合。……二十九日丙戌僭帝號於武英殿，追尊七代皆為帝后，立妻高氏為皇后。……五月二日，我大清兵入京師，下令安輯百姓，為帝后發喪，議諡號，遣將偕三桂追自成。”《清史稿·世祖本紀》順治元年：“四月戊寅（二十一），李自成率眾圍山海關，我軍逆擊之，敗賊將唐通於一片石。己卯（二十二），師至山海關，三桂開關出迎，大軍入關。……乙酉（二十八），自成棄燕京西走，我軍疾追之。”</p>\n<p class=\"content\">闖王李自成密藏金銀珠寶於關外。</p>\n<p class=\"content\">《雪山飛狐》第5回：闖王破了北京，明朝的皇親國戚、大臣大將盡數投降，這些人無不家資豪富，闖王部將逼他們獻出金銀珠寶贖命。闖王退出北京，派親信將領，押著財寶去藏在一個極隱僻的所在（遼東烏龍山玉筆峰），以便將來捲土重來之時作為軍餉。他將藏寶的所在繪成一圖，而看圖尋寶的關鍵，卻置於一把軍刀之中。</p>\n<p class=\"content\">清八旗分藏八本《四十二章經》。</p>\n<p class=\"content\">《鹿鼎記》第15回：清軍進關之時，並沒有想能得到大明江山。進關之後，見到中國地方這樣大，人這樣多，又是歡喜又是害怕，八旗的旗主接連會議多日，是佔領整個中國，還是搶掠一番退回關外，在會議中口角爭吵，拿不定主意。最後攝政王多爾袞決定，一面搶掠，將金銀財寶運到關外收藏，一面在中國做皇帝。如果漢人起來造反，形勢危急，旗人便退出山海關。多爾兗將收藏財寶的秘密所在，繪成地圖，剪成碎片，分藏在八本不同封面的《四十二章經》中，由八旗旗主各執一本。只有收齊了八本經書裡的地圖碎片，才能知道寶藏所在。保管八部經書的主人，分別是正黃旗順治皇帝、正紅旗康親王、正白旗蘇克薩哈、正藍旗嘉坤、鑲黃旗鰲拜、鑲紅旗和察博、鑲白旗（佚名）、鑲藍旗鄂碩克哈。</p>\n<p class=\"content\">五月，闖王李自成妄殺李巖夫婦。</p>\n<p class=\"content\">《碧血劍》第20回：隨著南明朝廷的建立和大順軍的節節敗退，很多歸順李自成的原明朝將領復投南明或清朝，李自成於是疑心日甚。加上丞相牛金星和權將軍劉宗敏的挑撥，李自成懷疑李巖夫婦反叛。李巖夫婦自刎而死。據《明史·流賊李自成傳》。</p>\n<p class=\"content\">十二月，南京明朝馬士英重用阮大鋮。</p>\n<p class=\"content\">《碧血劍》第20回：馬士英獨攬南明朝政大權，今年九月加少傅，十二月進少師。馬士英為人貪鄙無遠略，重用魏忠賢的餘孽阮大鋮，事事非錢不行，腐敗不堪，所有官職都可出賣。南京人有順口溜道：“職方賤如狗，都督滿街走。”據《明史·奸臣馬士英傳》。</p>\n<p class=\"content\">1645年　清順治二年（袁承志22歲）</p>\n<p class=\"content\">二月初六，明朝總兵高傑為許定國所殺。</p>\n<p class=\"content\">《碧血劍》第20回：高傑本是李自成部將，十年前帶著李妻邢氏私奔，後降明朝升總兵。南明政權建立後，高傑駐紮江北泗水，兵部尚書史可法要他去和“金蛇營”袁承志聯絡，共抗清兵進犯。高傑知金蛇營曾是闖軍的精銳之師，心懷鬼胎不敢去聯絡，卻去和河南總兵許定國勾結。不料許定國已經降清，假意設宴，殺了高傑。據《清史稿·世祖本紀》順治二年：“二月，己未（初六），降將許定國襲殺明興平伯高傑於睢州。”</p>\n<p class=\"content\">四月二十五，“揚州十日”，史可法從容就義。</p>\n<p class=\"content\">《碧血劍》第20回：清兵於四月十五日攻揚州城，兵部尚書史可法五次拒降，奮力應戰，金蛇營骨幹朱安國也在他身邊助戰，至二十五日城陷，史可法就義。金蛇營派去助戰的一千名兵將全部殉難。城破後清兵大肆燒殺，殘酷無比，十日之間殺了八十餘萬人，後來稱為“揚州十日”。據《清史稿·世祖本紀》順治二年：“四月，丁丑，拜尹圖、圖賴、阿山等克揚州，故明閣部史可法不屈，殺之。”</p>\n<p class=\"content\">六月初十，南明福王政權覆滅。</p>\n<p class=\"content\">《碧血劍》第20回：清豫親王多鐸五月攻入南京，福王朱由崧及大學士馬士英遁走太平。多鐸遣軍追擊福王，淮泗四將之一黃得功迎戰清軍，中流矢而死。明朝總兵田雄執福王投降清軍。馬士英逃往杭州，後來逃到福建，一年後為清兵擒斬。據《清史稿·世祖本紀》順治二年：“六月，辛酉（初十），豫親王多鐸遣軍追故明福王硃由崧於蕪湖。明靖國公黃得功逆戰，圖賴大敗之，得功中流矢死。總兵官田雄、馬得功執福王及其妃來獻，諸將皆降。”</p>\n<p class=\"content\">九月，大順皇帝李自成在通城九宮山失蹤。</p>\n<p class=\"content\">《碧血劍》第20回：闖王敗至陝西，軍紀未見大改，百姓不附，諸將解體。是年二月，清兵破潼關，李自成放棄西安，引兵至湖北，連戰敗績，竄於通城九宮山。秋九月，李自成留李過守寨，自率二十騎掠食山中，為村民所困，不能脫。據說李自成為村民所擊斃，惟事無佐證，不知道真假。劉宗敏等大將多數為清軍擒斬。丞相牛金星降清封官。《明史·流賊李自成傳》：“順治二年二月，我兵攻潼關，偽伯馬世耀以六十萬眾迎戰，敗死。潼關破，自成遂棄西安，由龍駒寨走武岡，入襄陽，復走武昌。……自成走咸寧、蒲圻，至通城，竄於九宮山。秋九月，自成留李過守寨，自率二十騎略食山中，為村民所困、不能脫，遂縊死。或曰村民方築堡，見賊少，爭前擊之，人馬俱陷泥淖中，自成腦中鉏死。剝其衣，得龍衣金印，眇一目，村民乃大驚，謂為自成也。時我兵遣識自成者驗其屍，朽莫辨。”</p>\n<p class=\"content\">九宮山闖王失蹤，飛天狐狸忍恥降清。</p>\n<p class=\"content\">《雪山飛狐》第3、5回：在武昌府通山縣九宮山，闖王被清兵和吳三桂重重圍困，幾次衝殺不出，英雄終於到了末路。闖王身邊有胡、苗、範、田四名衛士，個個武藝高強。四人之中又以姓胡的武功最強，人最能幹，闖王軍中稱他為“飛天狐狸”。闖王派苗、範、田三名衛士黑夜裡衝出去求救。援兵遲遲不至，敵軍卻愈來愈近。“飛天狐狸”胡衛士攔住要橫刀自刎的闖王，從陣亡將士之中撿了一個屍首冒充闖王，親自揹著去投降清營。假闖王一死，敵軍即日解了九宮山之圍，真闖王早已易容改裝，扮成平民，輕輕易易地脫險下山。闖王逃下九宮山，至湖南省石門峽普慈寺出家，法名叫做“奉天玉和尚”。胡衛士降敵，清皇帝封為大官，後來在吳三桂手下做到提督。闖王在九宮山兵敗逃亡前，將寶藏之圖與軍刀都交給了胡衛士。</p>\n<p class=\"content\">華山派袁承志、夏青青避居海外。</p>\n<p class=\"content\">《碧血劍》第20回：李自成的農民起義失敗，袁承志改“金蛇營”為“崇字營”，繼續抗擊清軍，終因寡不敵眾，全軍覆沒。袁承志劫後餘生，帶著夏青青、何惕守、安小慧、焦宛兒等崇字營殘餘人眾，揚帆出海，來到浡泥國左近大海中的一座海島，做了化外之民。</p>"},{"title":"《鹿鼎記》故事編年（1663-1689）","content":"</a>\n<p class=\"sectionTitle\">《鹿鼎記》故事編年（1663-1689）</p>\n<p class=\"content\">【背景】公元17世紀60年代，順治帝悲痛董鄂妃之死，與世長辭，子康熙帝即位。南明桂王政權覆滅，鄭成功收復臺灣。康熙帝親政後，除去專橫藐主的輔臣鰲拜。70年代，平西王吳三桂叛亂，歷時八年終被平定。80年代，康熙帝派兵攻克臺灣，攻克雅克薩城，與俄羅斯進行尼布楚談判，取得外交上的重大勝利。</p>\n<p class=\"content\">【概要】江湖門派主要有少林寺、清涼寺、華山派、王屋派、鐵劍門、天地會、神龍教、沐王府和平西王府等。揚州妓女之子韋小寶，進入皇宮冒充太監，和康熙帝結為知交，輾轉成為內宮尚膳司副總管、天地會青木堂香主、神龍教白龍使、少林寺晦明高僧，最後榮封一等鹿鼎公，豔娶七位夫人，享盡人間榮華。</p>\n<p class=\"content\">【紀年】史載1663年莊廷“明史案”，故事開始。1667年，鰲拜殺蘇克薩哈；1669年，康熙帝逮捕鰲拜；1673年，吳三桂起兵反叛；1683年，施琅攻克臺灣；1689年，中俄兩國的尼布楚談判，故事結束。</p>\n<p class=\"content\">1646年　清順治三年</p>\n<p class=\"content\">神龍教教主夫人蘇荃出生。</p>\n<p class=\"content\">《鹿鼎記》第19回：神龍教是教主洪安通創建的江湖邪教組織，教址位於遼東神龍島（蛇島），下轄五龍使，即青龍使許雪亭、白龍使鍾志靈、黑龍使張淡月、黃龍使殷錦、赤龍使無根道人，教旨是一統江湖，獨霸武林。教主洪安通的年齡、神龍教的創建時間不詳，依據五龍使的年齡推測，洪安通要比夫人蘇荃大四十多歲。蘇荃長大，被逼嫁給洪安通，後來成為韋小寶的一夫人（按年齡序）。按（1669年）：“那女的卻是個美貌少婦，看模樣不過二十三四歲年紀，微微一笑，媚態橫生，豔麗無匹。”第39回：“泥粉落下，露出一張姿媚嬌豔的臉蛋，年紀比方怡大了五六歲，容貌卻比她更美，原來是洪教主夫人。”</p>\n<p class=\"content\">南明福王遇害，唐王、魯王、桂王接踵而立。</p>\n<p class=\"content\">《鹿鼎記》第9回：1644年四月闖王攻入北京，逼死崇禎天子，吳三桂帶領清兵入關，佔領明朝江山。各地的忠臣義士，紛紛推戴太祖朱元璋的子孫為王。五月，福王在南京做天子，史稱弘光帝。1645年五月，南京淪陷，福王被清軍俘虜（次年遇害）。閏六月，鄭芝龍等人在福建立唐王為天子，史稱隆武帝；張國維等人在浙江立魯王為天子。1646年八月，唐王被俘，在福州絕食而死。十一月，丁魁楚等人在廣東立桂王為天子，史稱永曆帝。桂王是歷史上南明政權中稱帝最晚，堅持抗清時間最久的皇帝，後來進入雲南，得到沐王府的全力擁戴。唐、魯、桂三派，均以反清復明的正統自居，攻擊別人為篡位。</p>\n<p class=\"content\">十二月，南明鄭成功舉兵抗清。</p>\n<p class=\"content\">鄭芝龍（1604-1661）、鄭成功（1624-1662）父子是南明隆武政權的忠實追隨者，鄭成功被隆武帝賜姓為朱，封招討大將軍，人稱“國姓爺”。隆武帝被俘遇害，鄭芝龍認為明朝的氣數已盡，不顧鄭成功的反對，十一月十五（據計六奇《明季南略》），隻身北上投降清廷；三十（據《泉州人名錄·田川氏》），鄭成功的母親不堪其辱切腹自盡；十二月，鄭成功在小金門起兵抗清。1657年九月，永曆帝桂王封其為延平郡王（據許浩基編《鄭延平年譜》）。</p>\n<p class=\"content\">1647年　清順治四年</p>\n<p class=\"content\">宮女陶紅英的太師父與神龍教鄧炳春交手，重傷而死。</p>\n<p class=\"content\">《鹿鼎記》第15回：民間流傳，滿洲人藏寶的那座山，是他們的龍脈所在，滿洲韃子的祖先就葬在那裡，如能找到那座寶山，將龍脈截斷，再挖了墳，那麼滿洲韃子非但做不成皇帝，還得盡數死在關內。這個大秘密，便藏在那八部《四十二章經》中。因此，各路江湖反清豪傑都費盡心血，追尋八部經書的下落。陶紅英的太師父被鑲藍旗旗主鄂碩克哈擄去，在得知經書的秘密後，出手盜經，卻被潛伏在旗主府中的神龍教高手鄧炳春擊成重傷。太師父臨死，派陶紅英的師父混進宮中，伺機盜經。師父進宮後，收陶紅英為徒，將這一秘密傳授給陶紅英。陶紅英是明朝崇禎皇帝的公主九姑的侍女，闖王攻入北京時，九姑的臂膀被父皇砍斷，九姑隨著袁承志流落江湖，陶紅英便留在宮中繼續做宮女。按：“滿清韃子由吳三桂引進關來……直到三年多之後，才遇到我師父。”</p>\n<p class=\"content\">1652年　清順治九年</p>\n<p class=\"content\">沐王府家將之女方怡出生。</p>\n<p class=\"content\">《鹿鼎記》第2回：雲南沐王府是明朝開國元勳沐英的後代，太祖朱元璋封他沐家永鎮雲南。劉、白、方、蘇四家，祖先隨著沐王爺平服雲南，二百多年來，累世為沐王府的家將。方怡長大，傾心於師兄劉一舟，後來成為韋小寶的二夫人。按第11回（1669年）：“只見這女子半邊臉染滿了鮮血，約莫十七八歲年紀，一張瓜子臉，容貌甚美。”</p>\n<p class=\"content\">1654年　清順治十一年</p>\n<p class=\"content\">三月十八，清朝順治帝第三子玄燁出生。</p>\n<p class=\"content\">《鹿鼎記》第6回：順治皇帝的皇后，是順治之母的侄女，1651年八月冊立為後，因奢侈善妒，於1653年被廢為靜妃，史稱“廢后”。玄燁的生母佟佳氏，是漢軍旗人佟圖賴之女，順治皇帝的妃子，1654年三月生玄燁。後來玄燁即位，即康熙皇帝，尊生母為皇太后。按第4回（1667年）：“只見那男孩約莫十四五歲年紀，身穿短打，伸拳擊打樑上垂下來的一隻布袋。”據《清史稿·世祖本紀》順治十一年：“三月，戊申（十八），皇第三子玄燁生，是為聖祖。”《清史稿·聖祖本紀》：“聖祖……皇帝，諱玄燁，世祖第三子也。母孝康章皇后佟佳氏，順治十一年三月戊申（十八）誕上於景仁宮。天表英俊，嶽立聲洪。”參見《清史稿·后妃傳》。</p>\n<p class=\"content\">1655年　清順治十二年</p>\n<p class=\"content\">清朝假皇后毛東珠的私生女建寧公主出生。</p>\n<p class=\"content\">《鹿鼎記》第25回：明朝皮島駐將毛文龍，因專制悖逆、濫殺冒功，被兵部尚書袁崇煥先斬後奏。毛文龍之女毛東珠流落江湖，加入了神龍教。教主洪安通為了得到八部《四十二章經》，派高手鄭炳春潛伏在鑲藍旗旗主府中，派毛東珠潛伏在宮中。順治皇帝1653年八月廢皇后為靜妃，1654年五月聘科爾沁貝勒綽爾濟之女為妃，六月冊立為後。毛東珠服侍皇后，竟將皇后囚禁起來，逼問《四十二章經》下落，自己用易容術喬裝成皇后。師兄鄧炳春有時假扮宮女，偷偷到宮中與假皇后幽會，建寧公主便是他倆的私生女。建寧公主長大，下嫁平西王吳三桂之子吳應熊，後來成為韋小寶的三夫人。按第21回（1669年）：“韋小寶見這少女十五六歲年紀，一張瓜子臉兒，薄薄的嘴唇，眉目靈動，頗有英氣。……我做主子做了十五年，總是給人服侍，沒點味道，今兒咱們來換換班。”</p>\n<p class=\"content\">陳圓圓的私生女阿珂出生。</p>\n<p class=\"content\">《鹿鼎記》第32回：吳三桂領清兵入關，李自成退出北京，吳三桂再次得到陳圓圓。後來吳三桂封為親王，要立福晉，陳圓圓便搬出昆明平西王府。李自成出現在陳圓圓面前，原來他兵敗後出家為僧，在昆明住了三年，要與佳人再見一面。英雄和美人歡好如初，生下一女，就是阿珂。阿珂長大，喜歡鄭成功的孫子鄭克樉，後來成為韋小寶的四夫人。按第22回（1670年）：“看這兩個女子時，一個二十歲左右，身穿藍衫，另一個年紀更小，不過十六七歲，身穿淡綠衣衫。”第31回：“這女子可是十七八歲年紀，身材苗條，容貌十分美麗的？”</p>\n<p class=\"content\">1656年　清順治十三年（韋小寶1歲）</p>\n<p class=\"content\">王屋派弟子曾柔出生。</p>\n<p class=\"content\">《鹿鼎記》第22回：王屋派掌門人司徒伯雷，本是明朝山海關總兵吳三桂的一名副將，抗拒滿洲入侵頗立功勳，與李自成部奮勇作戰攻回北京。當時他只知道清兵入關，是為崇禎皇帝報仇，哪知清兵卻趁機佔了漢人的江山，吳三桂做了大漢奸。司徒伯雷大怒之下，棄官隱居王屋山。舊時部屬不願投降清廷的，便聚居在王屋山，逐漸形成王屋派，曾柔的父親即其中之一。父親臨終，命曾柔拜在老上司門下。曾柔長大，成為韋小寶的五夫人。按（1670年）：“韋小寶側頭看去，見是個十五六歲的小姑娘，臉蛋微圓，相貌甚甜。……剛才那小姑娘，只十五六歲年紀，也練了武功。”</p>\n<p class=\"content\">揚州妓女韋春花之子韋小寶出生。</p>\n<p class=\"content\">《鹿鼎記》第50回：麗春院位於揚州瘦西湖畔的鳴玉坊，當時十七八歲的妓女韋春花頗討客人青睞，經常光顧她生意的有漢人，也有滿洲官兒、蒙古武官、回人子弟和西藏喇嘛，煙花生涯生下的韋小寶種族不明，據說鼻子生得像那個相貌俊俏的回子，眼睛像那個上床之前一定要念經的西藏喇嘛。韋小寶長大後，陰差陽錯，成了權傾朝野的清廷大官。按第2回（1667年）：“驀地裡大堂旁鑽出一個十二三歲的男孩。”第5回（1669年）：“他以一個十四五歲的小孩，平生哪裡受過這樣的尊敬？”第6回：“孩子，你今年幾歲啦？……我是十四歲吧。”第16回：“他打聽一個十四五歲的太監，那不是衝著韋香主嗎？……聽說這桂公公只是個十三四歲的小孩童，就是狡猾機靈。”第30回1670年：“韋爵爺只不過十五六歲年紀，已貴為驍騎營都統。”第32回：“但韋小寶只是個十五六歲的少年，竟也為自己的絕世容光所震懾。”又按第4回：“韋小寶道，好，算他只大我一兩歲吧，可是他比我高大得多。”當時韋小寶“十二三歲”，康熙“十四五歲”。再按第44回：“洪夫人喜道，好啊，咱們排一排年紀，瞧是誰大誰小。各人報了生日年月，自然是洪夫人蘇荃最大，其次是方怡，更其次是公主。曾柔、沐劍屏和韋小寶三人同年，曾柔大了他三個月，沐劍屏小了他幾天。”一、當時阿珂和雙兒不在場，按書裡記載，阿珂與建寧公主同年，雙兒和韋小寶等三人同年。二、建寧公主名義上是順治的第二個皇后所生，史載孝惠章皇后在順治十一年（1654年）五月聘為妃，六月冊為皇后，因此建寧公主出生至早在1655年。按書裡記載，韋小寶比建寧公主小，又不是同年，其出生至早在1656年。</p>\n<p class=\"content\">黔國公沐天波之女沐劍屏出生。</p>\n<p class=\"content\">《鹿鼎記》第10回：沐天波是開國元勳沐英之後，世居雲南，府中有劉白方蘇四大家將。南明桂王政權逃到雲南，沐王府是桂王政權的忠實擁護者。沐天波生有一子一女，沐劍聲和沐劍屏。沐劍屏長大，成為韋小寶的六夫人。按（1669年）：“只見這人身體瘦小，一頭長髮，卻是個十四五歲的少女。”</p>\n<p class=\"content\">湖州莊家的丫鬟雙兒出生。</p>\n<p class=\"content\">《鹿鼎記》第17回：雙兒的父母祖籍不詳，書裡記載她從小成為孤兒，是莊家的少奶奶收留了她。莊家在明史案文字獄中慘遭滅門，雙兒隨著劫後餘生的寡婦們隱跡江湖，後來做了韋小寶的七夫人。按（1669年）：“但見眼前是張十分清秀的少女臉孔，大約十四五年紀，頭挽雙鬟，笑嘻嘻地望著自己。”第45回、50回記沐劍屏稱她為“雙兒妹妹”，可知她雖與韋小寶等人同年，月份略小，據第34回所記，雙兒的生日很有可能在九月中旬。</p>\n<p class=\"content\">十二月初六，清朝順治帝立董鄂氏為妃，賜鑲白旗《四十二章經》。</p>\n<p class=\"content\">《鹿鼎記》第7、29回：董鄂氏，清大臣鄂碩之女，十八歲入侍皇上，寵冠後宮，皇上因此對重立的孝惠章皇后也十分冷淡。今年八月，董鄂氏立為賢妃，十二月冊為皇貴妃。之前，鑲白旗旗主因事獲罪，鑲白旗的《四十二章經》沒入宮中，順治皇帝寵愛董鄂妃，便將這部經書賜予她。《清史稿·世祖本紀》順治十三年：“十二月己卯（初六），冊內大臣鄂碩女董鄂氏為皇貴妃，頒恩赦。”參見《清史稿·后妃傳》。《中國通史》卷十：董妃，又作董鄂妃，內大臣鄂碩之女，順治十三年八月立為賢妃。她原是福臨異母弟襄親王博穆博果爾之妃，大概由於清代命婦入侍的緣故，福臨屢與董氏接觸而萌發好感，遂熱戀起來。襄親王“因憤致死，或許竟是自殺而死”。福臨於是將其未亡人董氏收入宮中，時為順治十三年七月，董氏十八歲。八月冊董氏為賢妃，九月晉為皇貴妃。十二月冊封皇貴妃，福臨特頒恩詔大赦天下，這是殊典。按清朝制度冊封妃嬪向無頒詔之例。</p>\n<p class=\"content\">1657年　清順治十四年（韋小寶2歲）</p>\n<p class=\"content\">鐵劍門白衣尼九難劫走阿珂。</p>\n<p class=\"content\">《鹿鼎記》第32回：陳圓圓和闖王李自成的私生女阿珂，兩歲時被白衣神尼九難半夜劫走。九難就是崇禎皇帝的公主九姑，北京陷落時被父皇砍斷一條臂膊，成為鐵劍門木桑道長的弟子，出家後取名九難。九難恨吳三桂引清兵入關，奪取大明江山，她以為阿珂就是吳三桂生的女兒，搶去教其武藝，讓她長大後去刺殺吳三桂，以報國恨家仇。按：“阿珂生下來兩歲，半夜裡忽然不見了。”</p>\n<p class=\"content\">1659年　清順治十六年（韋小寶4歲）</p>\n<p class=\"content\">正月初八，清朝吳三桂攻克雲南，得正藍旗《四十二章經》。</p>\n<p class=\"content\">《鹿鼎記》第29回：南明桂王政權在雲南，得到沐天波、李定國等舊臣的擁戴。清朝派吳三桂、多尼等將進攻雲南，所向皆捷。正藍旗旗主嘉坤在攻打雲南時陣亡，一切後事都是吳三桂料理。正藍旗繼任旗主富登年歲尚幼，吳三桂交到他手裡的，只是一顆印信、幾面軍旗，還有幾萬兩銀子。那本正藍旗《四十二章經》被吳三桂吞沒。據《清史稿·世祖本紀》順治十六年：“春正月，庚子（初八），多尼克雲南，以捷聞。”</p>\n<p class=\"content\">七月二十五，南明鄭成功進攻江南失敗，建立天地會。</p>\n<p class=\"content\">《鹿鼎記》第8回：國姓爺鄭成功率領義師，自福建進攻江南，圍困江寧，功敗垂成，甘輝等五名大將在江寧殉難。在退回福建之前，鄭成功接納軍師陳近南的建議，設立天地會。天地會共分十堂，前五堂後五堂，以“回覆大明，滅絕胡虜”為宗旨，以七月二十五日丑時為創會的日子時辰。蓮花堂蔡德忠、洪順堂方大洪、家後堂馬超興、參太堂胡德第、宏化堂李式開，以及青木堂尹香主等等，都是當時國姓爺鄭成功軍中的校尉士卒。據《清史稿·世祖本紀》順治十六年：“秋七月丙子（十七），鄭成功犯江寧。八月己丑朔（初一），江南官軍破鄭成功於高山，擒提督甘輝等，燒敵船五百餘艘。鄭成功敗遁，我軍追至瓜州，敵兵大潰。甲辰（十六），鄭成功復犯崇明，官軍擊敗之。”</p>\n<p class=\"content\">1660年　清順治十七年（韋小寶5歲）</p>\n<p class=\"content\">三月初五，苗、範、田三名闖王衛士刺殺吳三桂不遂。</p>\n<p class=\"content\">《雪山飛狐》第3回：苗、範、田三名衛士以為闖王已經遇難，分別扮成腳伕、化子和郎中，四處尋找姓胡的義兄，找了七八年竟沒半點音訊，三人以為義兄已遭不幸。再過幾年，他們決定去刺殺平西王吳三桂，為闖王和胡衛士報仇。三人行刺正要得手，卻遭到一個高手的阻擋。不想這個高手竟是胡衛士。三人得知義兄已變節投敵，正是殺害闖王的兇手，都怒火填膺。義兄派人送來一封信，約三人三月十五晚間在滇池飲酒。按：“可是找了七八年，竟沒半點音訊，……再過幾年，他們決定不再尋訪這位義兄了。”此時距1645年九宮山闖王失蹤已十多年，大致在1660年左右。是年三月十五“飛天狐狸”被誤殺，其後人胡斐選擇1780年三月十五在遼東烏龍山玉筆峰揭秘事情真相，正值“飛天狐狸”一百二十週年忌辰。姑繫於此。</p>\n<p class=\"content\">十五，苗、範、田三名衛士在滇池誤殺胡衛士。</p>\n<p class=\"content\">《雪山飛狐》第3、5回：苗、範、田三名衛士暗帶兵刃，到滇池赴約。三人認準胡衛士是賣主求榮的元兇，借賞月飲酒之際，聯手將其殺害。其實，胡衛士當年在九宮山降清，是為了掩護闖王脫險。他後來深得吳三桂信任，如要行刺，原是舉手之勞。但他志不在此，他巧妙地安排許多事端，使清皇帝對吳三桂大起疑心，迫使吳三桂不得不舉兵謀反，製造天下大亂，闖王復國的良機。即便吳三桂的反叛迅即平息，這個漢奸也必遭滅族之罪，遠勝於將他刺死，讓他身後受清廷的榮諡厚恤。可惜這個深謀遠慮被三位義弟毀於一旦。闖王的軍刀落入三位義弟之手。</p>\n<p class=\"content\">八月十九，清朝董鄂妃薨逝，假皇后毛東珠得鑲白旗《四十二章經》。</p>\n<p class=\"content\">《鹿鼎記》第6回：董鄂妃是順治皇帝的寵妃，1657年十月，生第四皇子。1658年正月，第四皇子夭折，三月，順治帝追封第四皇子為和碩榮親王。是年八月，董鄂妃薨逝，順治帝追封其為端敬皇后。端敬皇后逝世，人人都道她是心傷榮親王之死，其實不然。榮親王和董鄂妃，都是被假皇后毛東珠用上乘武功暗害的。假皇后害死董鄂妃後，吞沒了順治當年賜給董鄂妃的鑲白旗《四十二章經》。據《清史稿·世祖本紀》順治十七年：“八月壬寅（十九），皇貴妃董鄂氏薨，輟朝五日。”</p>\n<p class=\"content\">冬，胡衛士之子前往昆明報仇。</p>\n<p class=\"content\">《雪山飛狐》第3回：“飛天狐狸”胡衛士遭三位義弟殺害的消息傳到家鄉，他兒子十分悲傷，趕往昆明為父親報仇。那兒子在一座破廟中將三人一一打倒，說：“三位叔叔，我爹爹忍恥負辱，甘願負一個賣主求榮的惡名，你們怎懂得其中深意？瞧著你們和我爹爹結義一場，今日饒了你們性命。快快回家去料理後事，明年三月十五是我爹爹忌辰，我當來登門拜訪。”他說了這番話兒，奪了那把闖王軍刀，揚長而去。按：“這時已是隆冬，那三人當即北上，將三家家屬聚在一起。”</p>\n<p class=\"content\">1661年　清順治十八年（韋小寶6歲）</p>\n<p class=\"content\">正月初七，清朝順治帝棄位出家，康熙即位。</p>\n<p class=\"content\">《鹿鼎記》第6回：順治皇帝因心愛的董鄂妃死了，傷心至極，到五臺山清涼寺做了和尚，離宮時留書說道永不回來。順治的母親和“皇后”毛東珠說道國家不可一日無君，於是宣告天下說順治駕崩，立第三子玄燁，改元康熙。順治帝留下詔書，小皇帝由索尼、蘇克薩哈、遏必隆、鰲拜四位大臣輔政。珍妃董鄂氏自殺殉主，其實是死於假皇后毛東珠的“化骨綿掌”毒手。康熙即位後，尊毛東珠為仁憲“皇太后”，尊生母佟佳氏為慈和皇太后。當世知道順治皇帝出家這一秘密的，只有六人，順治之母太皇太后，假皇后毛東珠，順治本人，替順治剃度的五臺山清涼寺玉林大師，還有兩個服侍順治的奴才，一個是侍衛總管赫巴察，跟著順治在五臺山出了家，另一個就是太監海大富。據《清史稿·世祖本紀》順治十八年：“春正月，丁巳（初七），崩於養心殿，年二十四。”</p>\n<p class=\"content\">三月十五，苗、範、田三名衛士抱愧自刎。</p>\n<p class=\"content\">《雪山飛狐》第3、5回：“飛天狐狸”遇害一週年，苗、範、田三位衛士在田衛士家中大開筵席，請了一百多位江湖上成名英雄，靜候胡衛士之子的到來。到了晚上，胡衛士之子孤身趕到，在密室裡將闖王尚在人世的秘密以及父親的一番苦心告訴了三位叔叔，並言明這個秘密，要從大順永昌二年（1645乙酉年）算起，過了一百年（1745年乙丑年）方能洩露。如果洩露早了，會危及闖王性命。苗、範、田三位衛士聽了，悲痛悔恨至極，等不及囑咐自己的子弟，便走出密室當眾自刎。</p>\n<p class=\"content\">七月，沐王府沐天波盡忠而死。</p>\n<p class=\"content\">《鹿鼎記》第2回：南明末代皇帝桂王逃到雲南，黔國公沐天波忠心耿耿，保駕護主。1658年吳三桂打到雲南，沐天波保了桂王逃往緬甸。1661年，緬甸的壞人要殺桂王，沐天波代主而死。第二年，緬甸人將桂王交給吳三桂，吳三桂將桂王及其眷屬絞死。據《明史·沐天波列傳》：“明年己丑七月，緬又來請，天波辭。……又明年庚寅七月，難作。”《中國通史》卷九：順治十二年，李定國奉朱由榔至昆明。孫可望由貴州進攻雲南，被李定國打敗，向清軍投降。順治十五年，清軍分三路攻雲南，清將鐸尼的中路軍迅速抵達曲靖，使昆明兩面受敵。永曆政權由昆明退到永昌（今保山），由永昌退到騰越（今騰衝），再由騰越逃入緬甸。李定國沿怒江設三道埋伏，雖被吳三桂攻破，總算遏住清兵窮追的勢頭。清康熙元年（1662年），緬甸當局把朱由榔交給清軍處置，吳三桂用弓弦把他絞死，李定國得到這個消息也悲憤而死，堅持抗清十多年的永曆政權滅亡。</p>\n<p class=\"content\">十二月初六，南明鄭成功收復臺灣。</p>\n<p class=\"content\">《鹿鼎記》第46回：自荷蘭殖民者1624年（明天啟四年）佔領臺灣，臺灣人民反抗殖民統治的鬥爭前赴後繼，從未間斷。最壯烈的一次是1652年（清順治九年，南明永曆六年）九月初七，鄭芝龍的舊部郭懷一在臺灣發動起義，焚燒荷蘭人的官署和店鋪。荷蘭人調集炮火反攻，殘殺中國人四千多人（據連橫《臺灣通史卷一·開闢記》，金庸先生將此事件繫於是年八月十五）。</p>\n<p class=\"content\">1661年（清順治十八年，南明永曆十五年）鄭成功在夏門部署收復臺灣，作為反清復明的基地。二月，鄭成功大營移駐金門城。三月初一，全軍誓師祭海；初十，鄭成功率領各路船艦齊集料羅灣候風；二十三，大軍開出；二十四，大軍抵達澎湖；三十，鄭成功在中軍艦上豎起帥字大旗，發炮三聲，橫渡海峽進攻臺灣。四月初一，大軍抵達鹿耳門港外，海潮大漲，戰船湧進鹿耳門，大軍登陸赤嵌城區，海戰中，大軍擊沉荷蘭戰艦一艘，重創兩艘；初五，荷蘭赤嵌守軍投降退出；初七，鄭成功進兵荷蘭太守揆一所駐的熱來遮城；荷軍固守，鄭成功一面派兵開墾種田，一面加緊圍城。五月二十八，荷蘭巴達維亞殖民當局派兵援助臺灣駐軍。七月二十五，援軍抵達臺灣海峽。閏七月二十三，荷蘭援軍和駐軍夾攻鄭成功大軍，水陸大戰，鄭軍大獲全勝，揆一縮進熱來遮城。荷蘭守軍揆一請求清廷出兵，夾攻鄭成功，八月初二，清廷答應派七千人助戰。</p>\n<p class=\"content\">早在二月下旬，清廷見招撫鄭成功之謀無效，便囚禁了其父鄭芝龍及其家屬。九月二十四，康熙帝下旨審理鄭芝龍謀叛一案。十月初三，清廷將鄭芝龍及其三個兒子全家老小誅於北京菜市。消息傳到臺灣，鄭成功常常在半夜裡失聲痛哭。十二月初六，鄭成功向熱來遮城發起總攻（據菲力普·梅《梅氏日記·1662年1月25日》，金庸先生將此事件繫於十一月二十三），荷蘭守軍揆一豎白旗投降；十三，鄭成功准許荷軍簽署降書十四款。次年的正月二十七起，揆一率領殘兵敗將上船離臺，逃去巴達維亞。荷蘭人佔領三十八年後，臺灣重回中國版圖。</p>\n<p class=\"content\">勘誤：小說裡記鄭成功部將施琅當時駐守廈門，大軍出兵前曾和鄭成功一起到各鎮激勵軍心，與史實不符。據史料記載，施琅1621年出生；1637年加入鄭芝龍隊伍，任千夫長；1646年從鄭芝龍降清；1648年又從總督李成棟反清復明；1649年率部投奔鄭成功，重用為左先鋒；1651年，施琅因反對擄掠和遠征，失去鄭成功的信任，免去左先鋒職；不久，施琅違抗軍令，斬殺逃往鄭成功營中的部將曾德，五月二十，鄭成功逮捕施琅；施琅伺機逃脫後，去安平投奔鄭成功的叔父鄭芝豹，求為排解；鄭成功怒不可遏，將施琅的父親、弟弟處斬，致使雙方對立不可挽回；七月，施琅走投無路，投降清廷，歷任同安副將、同安總兵和福建水師提督。鄭成功收復臺灣時，施琅降清已整十年，時任同安總兵。</p>\n<p class=\"content\">1662年　清康熙元年（韋小寶7歲）</p>\n<p class=\"content\">五月初八，南明鄭成功在臺灣去世。</p>\n<p class=\"content\">《鹿鼎記》第44回：當年鄭成功攻克臺灣，派兒子鄭經駐守金門、廈門。鄭經很得軍心，卻行止不謹，和乳母通姦生子。鄭成功得知後憤怒異常，派人持令箭去廈門殺鄭經。諸將認為是“亂命”，不肯奉令，公啟回稟，有“報恩有日，候闋無期”等語。鄭成功見部將拒命，更是憤怒，於1662年五月初八病死，年方三十九歲。臺灣統兵將領擁立鄭成功的弟弟鄭襲為主。十月，鄭經從金、廈回師臺灣，打垮臺灣守軍而接任延平王之位。據《清史稿·鄭成功列傳》。</p>\n<p class=\"content\">1663年　清康熙二年（韋小寶8歲）</p>\n<p class=\"content\">二月十一，清朝康熙帝之母佟佳氏崩。</p>\n<p class=\"content\">《鹿鼎記》第6回：假太后毛東珠用同樣的“化骨綿掌”手法，殺害了康熙的生母佟佳氏，諡為孝康皇太后。至此，榮親王、董鄂氏、貞妃、佟佳氏共四人，在假太后手中死於非命。據《清史稿·聖祖本紀》康熙二年：“二月庚戌（十一），慈和皇太后佟佳氏崩。”</p>\n<p class=\"content\">五月，湖州府莊廷“明史案”。</p>\n<p class=\"content\">《鹿鼎記》第1回：浙西湖州府南潯鎮富戶莊允城，長子莊廷雙目失明。莊廷[zz271-1]在順治年間，從明代天啟朝朱相國的後人手中，得到朱相國編撰的《明史稿》的一部分，興趣盎然，卑辭重金邀集許多通士鴻儒，或正誤潤飾，或補撰一兩篇崇禎朝和南明史事的文字，至1655年，這部集不少大手筆之力的明史終於輯成。書成不久，莊廷便即去世。莊允城心傷愛子之逝，招請工匠刊書，名士作序，1660年冬，全書刊成，取名《明史輯略》，莊廷之名一時噪於大江南北。1661年，湖州歸安知縣吳之榮因貪贓枉法被朝廷革職，偶爾發現《明史輯略》中，在明清改朝換代之際，有數十處使用明朝年號，而不使用大清年號。吳之榮為了邀功贖罪，向清廷告發，起初，三處衙門因該書牽涉諸多名士，全力維護，以挾嫌誣告將吳之榮駁回。當時康熙剛即位，輔政大臣鰲拜聞知此案後，為了震懾人心，派欽差專辦此案。1663年，莊允城被捕死於獄中，莊廷被開棺焚骨，參與襄助此書的名士、刻書賣書藏書的文人商賈、原先維護莊家的大小官員，均被處死。莊家數十口男丁盡數處斬，妻女發配瀋陽，給滿洲旗兵為奴。後來成為韋小寶七夫人的莊家丫鬟雙兒，年方八歲隨著莊家三少奶發配瀋陽，途中為反清志士何惕守所救。</p>\n<p class=\"content\">據周慶賢《詠莊氏史案》志批：“廷臨歿，語屬其父君維刻此稿。”陳寓清《榴龕隨筆》：“……允城於鎮北庵召匠刻之，凡五年而成”。楊鳳苞《記史案本末》：此書“順治十七年冬刊成”出售。翁廣平《書湖州莊氏史獄》：“辛丑歲，有吳之榮者，年二十有餘，以贓繫獄，遇赦得出。……並刻書鬻書者，同磔於杭州之弼教坊，時癸卯五月五日也。”《中國通史》卷十：明史案發生於康熙二年（1663），當時玄燁尚未親政。浙江湖州富商莊廷從明末大學士朱國禎的子孫處購到朱國禎撰寫的明朝歷史的稿本。莊廷本是個雙目失明的瞎子，但為了沽名釣譽，於是請人續補朱國禎書中所缺的崇禎朝及南明歷史。書成後改名《明書》，並署上了他自己的大名。但莊廷未及刊刻這部書就死了。書中如實地敘述了滿洲族先祖與明王朝的隸屬關係，清入關前用明朝年號，不是用清朝年號，指責孔有德、耿仲明等叛明降清等。莊氏觸犯了禁例，於是參與編纂或在卷首列名者以及為莊氏書作序、刻字、校對、印刷、售賣者，甚至買書者及莊氏全族，遭株連達200多人，其中70多人被殺。莊廷早死，亦被剖棺戮屍。</p>\n<p class=\"content\">天地會吳六奇義救查伊璜。</p>\n<p class=\"content\">《鹿鼎記》第1回：吳六奇本是丐幫中的八袋弟子，位居左護法，明朝末年，因酒醉打傷孫長老被斥革出幫。吳六奇歲暮避雪，被海寧孝廉查伊璜邀入府中飲酒取暖，鬱悶之情登緩。第二年春，吳六奇和查伊璜在杭州不期而遇，查伊璜稱其為海內奇男子。過不多時，清兵南下，吳六奇投效清軍，立了不少軍功。明朝覆亡，吳六奇官封提督。1659年，鄭成功建立天地會，丐幫和天地會結盟，同心協力反清復明。丐幫的孫長老介紹吳六奇暗中加入天地會，在洪順堂任紅旗香主。1661年，吳六奇訪得昔日知交查伊璜，邀其到廣東提督府上作客，並派人在查伊璜的海寧故居大興土木，營建樓臺。查伊璜的朋友黃宗羲見他府第煥然一新，大為驚訝。1663年，查伊璜捲入“莊氏明史案”，本來在劫難逃，吳六奇仗義出面說項疏通，朝中大臣對吳將軍倚畀正殷，查伊璜得以死裡逃生。按（1663年）：“兩年之前，兄弟到伊璜先生家中作客，但見他府第煥然一新。……兩年之前，半夜裡忽然有人闖入我臥室行刺。”</p>\n<p class=\"content\">1667年清康熙六年（韋小寶12歲）</p>\n<p class=\"content\">三月二十九，韋小寶離開揚州前往京城。</p>\n<p class=\"content\">《鹿鼎記》第2-3回：揚州麗春院的妓女之子韋小寶，從小聽書看戲，羨慕戲文裡的英雄好漢。韋小寶一時性起，搭救越獄在逃的江湖好漢茅十八。茅十八感激韋小寶關鍵時刻施以援手，加上小寶糾纏不休，便將他帶到都城北京。四月初到京城，韋小寶便被海大富、小桂子一老一小兩個太監劫持到內宮。韋小寶施展詭計，將老太監海大富的眼睛弄瞎，又將小太監小桂子弄死。從此，韋小寶便冒充小桂子，在宮中做起太監來。海大富是順治皇帝的近侍，順治在五臺山清涼寺出家後，他奉主子之命潛伏宮中，秘密調查董鄂妃、榮親王等人的死因。按：“今天是三月二十九，是不是？半年之前，這場架便約好了的。”是年，韋小寶十二歲。第2回：“驀地裡大堂旁鑽出一個十二三歲的男孩。”</p>\n<p class=\"content\">五月，韋小寶和康熙帝結為知交。</p>\n<p class=\"content\">《鹿鼎記》第4回：海大富為了盜取皇上手中的《四十二章經》，讓韋小寶去賭錢，結交上書房太監。有一次韋小寶賭博歸來，遇到一個自稱小玄子的華服少年正在練武，便與他交上了手。少年正是尚未親政的康熙帝玄燁。康熙帝喜歡他語言有趣，重義守信，遂成知交。是年，康熙帝十四歲。第4回：“韋小寶好奇心起，探頭張望，只見那男孩約莫十四五歲年紀，身穿短打。”</p>\n<p class=\"content\">七月十七，清朝輔政大臣鰲拜殺蘇克薩哈。</p>\n<p class=\"content\">《鹿鼎記》第4-5回：當年康熙帝即位之時，清廷任命索尼、蘇克薩哈、遏必隆和鰲拜擔任輔政大臣。是年六月，索尼因病去世。鰲拜與蘇克薩哈，為了鑲黃旗和正白旗兩旗的換地之爭，各不相讓。七月初七，康熙皇帝親政，鰲拜奏請誅殺蘇克薩哈，康熙早知道其是出於私怨，遲遲不肯准奏。鰲拜囂張跋扈，對小皇帝捋袖揎拳，施加壓力，受到韋小寶的呵斥。但康熙初親大政，對鰲拜十分忌憚，不敢立即和他破臉。鰲拜終於在七月十七日，以懷抱奸詐、存蓄異心、欺藐幼主、不願歸政等二十四項大罪，按本朝“大逆律”，將蘇克薩哈和其長子內大臣察克旦凌遲處死；餘子六人、孫一人、侄子二人，皆斬決；族人前鋒營統領白爾赫圖、侍衛額爾圖等也都斬決。正白旗保管的《四十二章經》被鰲拜吞沒，至此，鰲拜手中擁有鑲黃旗、正白旗兩部經書。據《清史稿·聖祖本紀》康熙六年：“秋七月，己酉（初七），上親政。……己未（十七），輔臣鰲拜擅殺輔臣蘇克薩哈及其子姓。”參見《清史稿·蘇克薩哈列傳》。</p>\n<p class=\"content\">1669年　清康熙八年（韋小寶14歲）</p>\n<p class=\"content\">五月十六，清朝康熙帝逮捕輔政大臣鰲拜。</p>\n<p class=\"content\">《鹿鼎記》第5回：康熙帝親政以來，久知鰲拜專橫亂政，又顧忌他力大難制，於是讓韋小寶選拔十二名年少有力的小太監，為撲擊之戲。五月十六，鰲拜入見，康熙帝命十二名太監一擁而上，將鰲拜制服，交刑部收審。五月二十八，王公大臣查明鰲拜欺君擅權大罪一共三十款，奏請誅滅全族。康熙帝下詔：“鰲拜雖然罪重，但他是顧命大臣，效力年久，可免其一死，革職拘禁，永不釋放，抄沒他的家產。”韋小寶與已故輔臣索尼之子索額圖，奉旨去抄沒鰲拜的家產。兩人合夥貪汙，韋小寶分得贓銀四十五萬兩。鰲拜府裡的鑲黃旗、正白旗兩部章經，查繳太后。至此，假太后毛東珠手中，連同從董鄂妃處吞沒的鑲白旗章經，共有三本章經。據《清史稿·聖祖本紀》康熙八年：“五月戊申（十六），詔逮捕輔臣鰲拜交廷鞫。……庚申（二十八），王大臣議鰲拜獄上，列陳大罪三十，請族誅。”參見《清史稿·鰲拜列傳》。《中國通史》卷十：索額圖，姓赫舍里氏，滿洲正黃旗人，出生年代推算當在崇德元年（1636年）前後，生於盛京（瀋陽）。</p>\n<p class=\"content\">韋小寶出任內宮尚膳司副總管太監。</p>\n<p class=\"content\">《鹿鼎記》第6回：老太監海大富在宮中潛伏八年，終於查清榮親王、董鄂妃、貞妃和康熙生母佟佳氏，都是死於假太后毛東珠之手。海大富奉已經出家的順治帝之命，去慈寧宮行刺假太后，因武功不濟，反為假太后所殺。韋小寶因護衛“太后”有功，頂替了海大富尚膳司副總管的職位。</p>\n<p class=\"content\">韋小寶出任天地會青木堂香主。</p>\n<p class=\"content\">《鹿鼎記》第7、8回：韋小寶奉康熙帝之命，將鰲拜暗殺於拘禁之處。康熙帝固然龍顏大悅，反清秘密組織天地會對韋小寶也是青眼有加。天地會是國姓爺鄭成功一手創辦的，現任總舵主是鄭成功當年的軍師陳近南。天地會下設前後十堂，其中青木堂的尹香主兩年前為鰲拜所害，當時青木堂兄弟立誓，誰殺得鰲拜，誰就擔任青木堂香主。面對堂內兄弟為香主人選爭執不下的局面，總舵主陳近南毅然決定收韋小寶為關門弟子，委任其為青木堂香主。據《清史稿·鰲拜列傳》康熙八年：“鰲拜死禁所。”具體日期不詳。</p>\n<p class=\"content\">十月，天地會和沐王府的南明正統之爭。</p>\n<p class=\"content\">《鹿鼎記》第9-14回：南明唐王政權覆滅後，以陳近南為首的天地會擁戴唐王的子孫；桂王政權覆滅後，以沐劍聲為首的沐王府擁戴桂王的子孫。當時黔國公沐天波早已為主盡忠，沐劍聲是沐天波之子，沐劍屏是沐天波之女。唐派和桂派均以明朝正統自居，斥責對方是篡逆，多年來紛爭不斷。沐王府的白氏兄弟之一白寒松，被天地會青木堂的徐天川失手打死，沐王府群雄便綁架了徐天川。青木堂兄弟以牙還牙，將小郡主沐劍屏綁架，藏在宮內韋小寶的住所。沐王府派高手進宮行刺康熙帝，沐劍屏的師姐方怡在行刺失敗後為韋小寶所救。為了請求韋小寶去救情人劉一舟，方怡不惜以身相許。小寶兩美雙收，樂不可支。平西王吳三桂的兒子吳應熊來到京城，康親王傑書設宴接風，請來小寶作陪。席間，康親王請來的一名武林高手齊元凱盜竊正紅旗《四十二章經》，被韋小寶無意間發現。小寶順手牽羊，佔為己有。御前侍衛副總管瑞棟受“太后”指使，殺害宗人府統領和察博，奪得鑲紅旗《四十二章經》。韋小寶在方怡、沐劍屏的幫助下，殺死瑞棟，將經書收入囊中。韋小寶撞破了“太后”與神龍教勾結的秘密，躲避追殺之際，發現“太后”寢所還有三本《四十二章經》，乾脆照單全收。至此，韋小寶手中，一共有五本經書。據第9回：“秋盡冬來，天氣日冷一日。”</p>\n<p class=\"content\">韋小寶去五臺山尋訪清朝順治帝。</p>\n<p class=\"content\">《鹿鼎記》第15-18回：韋小寶將順治帝在五臺山出家、“皇太后”害死董鄂妃、佟佳氏等人的秘密告訴了康熙帝。康熙聞說父親尚在人間，又驚又喜，立即派韋小寶去五臺山尋訪。韋小寶在去五臺山的途中，遭遇當年在“莊氏明史案”中已經家破人亡的莊家孤兒寡婦，莊家三少奶奶感激韋小寶手刃鰲拜的大恩，將貼身丫鬟雙兒送給他隨身服侍。韋小寶曆盡艱險不辱使命，找到了在五臺山清涼寺坐關修心的順治帝。順治帝不肯回京，只是將自己保管的正黃旗《四十二章經》讓韋小寶帶給康熙。據第17回：“十月天時，平白無端地下這陣頭雨，可真作怪。”第18回：“順治七歲（1644年）登基，二十四歲出家（1661年），此時還不過三十幾歲（32歲）。”《清史稿·世祖本紀》順治十八年：“春正月丁巳，崩於養心殿，年二十四。”</p>\n<p class=\"content\">韋小寶出任神龍教白龍使。</p>\n<p class=\"content\">《鹿鼎記》第18回：韋小寶從五臺山回到京城，尚未向康熙帝覆命，即被神龍教徒眾劫持到遼東蛇島。神龍教是江湖邪教組織，教主洪安通神通廣大，下轄五龍使。最近幾年，洪教主在嬌妻蘇荃的蠱惑下，不斷圍剿殘殺老兄弟。韋小寶上島之時，白龍使鍾志靈遇害，小寶趁機施展拍馬溜鬚絕技，取得教主和教主夫人的信任，擔任了在教內職位相當高的白龍使。在此之前，沐王府小郡主沐劍屏和女俠方怡，也已經加入了神龍教。</p>\n<p class=\"content\">韋小寶成為少林高僧“晦明禪師”。</p>\n<p class=\"content\">《鹿鼎記》第21-22回：韋小寶回到宮中，被迫與建寧公主打架取樂。建寧公主，就是“太后”毛東珠與其神龍教師兄鄧炳春的私生女。“太后”聽說韋小寶是教中職位甚高的白龍使，惶恐俯伏不已。康熙帝為了採取合適的方式去五臺山保護父皇，命韋小寶去少林寺出家。韋小寶在去少林寺的途中，結識了王屋派弟子曾柔。韋小寶至少林寺，成了與方丈晦聰同輩的晦明禪師。“高僧”在寺裡窮極無聊，便屢屢生事，把一個千年古剎搞得烏煙瘴氣。</p>\n<p class=\"content\">1670年　清康熙九年（韋小寶15歲）</p>\n<p class=\"content\">韋小寶拜鐵劍門九難為師。</p>\n<p class=\"content\">《鹿鼎記》第22-28回：九難就是明朝末代皇帝崇禎的公主，明亡後成了鐵劍門弟子，出家為尼。十幾年前，九難偷了陳圓圓的女兒阿珂，收徒授藝，計劃讓她去刺殺吳三桂為明朝報仇。韋小寶在少林寺做高僧時結識阿珂，一見傾心，發誓非娶她做老婆不可。韋小寶在少林寺廝混半年後，奉旨去五臺山，遇見刺客九難師太。韋小寶為了接近阿珂，拜九難師太為師。師徒結伴來到京城皇宮，撞見建寧公主奉“母后”之命，盜取皇帝哥哥手上的正黃旗《四十二章經》。九難師太奪取經書，參透了經書中藏有地圖碎片的秘密。後來，九難師徒遭到西藏喇嘛圍攻，韋小寶把這部經書給了桑結喇嘛，卻把地圖碎片留在自己手中。神龍教高手鄧炳春在鑲藍旗旗主鄂碩克哈府上潛伏多年，終於得到了鑲藍旗的《四十二章經》，交給假太后，又被韋小寶偷走，至此，韋小寶手中已經掌握了七部經書的地圖碎片。按：“在少林寺遊蕩了月餘，……這一日春風和暢。”“原來小皇帝思慮周詳，……讓自己在少林寺住了半年有餘，得與群僧相熟，以便挑選合意僧侶，同赴清涼寺。”</p>\n<p class=\"content\">說明：小說敘述韋小寶鍾情阿珂，阿珂卻心繫臺灣明鄭政權的小王爺鄭克樉。第26回記鄭克樉的年齡，“那人面目俊美，約莫二十三四歲年紀，滿臉歡容。”據史料記載：鄭成功之子鄭經生有兩子，長子克臧，生於1664年，次子克樉生於1670年。目下鄭克塽剛剛出生，金庸先生在第29回注曰：“鄭克樉即位時（1681年）年僅十二歲，本書因故事情節所需，加大了年紀，與史實有出入。”</p>\n<p class=\"content\">韋小寶出任雲南“賜婚使”。</p>\n<p class=\"content\">《鹿鼎記》第29-31回：康熙帝為了拉攏和麻痺平西王吳三桂，將妹妹建寧公主嫁給平西王之子吳應熊，封韋小寶為一等子爵“賜婚使”，護送建寧公主前赴雲南。韋小寶和建寧公主本就相熟，一路調笑，未至雲南即生私情，賜婚使成了駙馬爺。到了雲南平西王府，韋小寶使用調包計，得到了吳三桂手中的正藍旗《四十二章經》，至此，八部經書暗藏的地圖碎片全部落入韋小寶手中。正與小寶打得火熱的建寧公主不肯與吳應熊成婚，花燭之夜竟將吳應熊的“命根子”閹去。韋小寶見事變倉猝，只好帶著建寧公主，準備離開雲南。史料記載，下嫁吳應熊的是皇太極的女兒和碩公主，時在1653年。《清史稿·世祖本紀》順治十年：“八月壬午（十九），以太宗十四女和碩公主，下嫁平西王吳三桂子應熊。”</p>\n<p class=\"content\">闖王李自成和愛人陳圓圓闊別重逢。</p>\n<p class=\"content\">《鹿鼎記》第32-34回：阿珂奉師父九難之命，去平西王府刺殺吳三桂，失敗被擒。闖王李自成和已經出家為尼的陳圓圓在闊別十幾年後重逢，阿珂的身世大白，李自成和吳三桂殊死搏鬥，難分勝負。韋小寶趁機要挾吳三桂，劫持吳應熊逃離了這個是非之地。到了京城以後，韋小寶和雙兒將八部經書中的羊皮碎片，拼接成完整的藏寶地圖，費盡周折，韋小寶得悉當年清八旗的藏寶地點，是在黑龍江之北的鹿鼎山。</p>\n<p class=\"content\">1671年　清康熙十年（韋小寶16歲）</p>\n<p class=\"content\">韋小寶領兵攻打神龍教。</p>\n<p class=\"content\">《鹿鼎記》第34-35回：康熙帝命韋小寶率領水師攻打神龍教，由福建水師提督施琅協助。這施琅本是鄭成功手下大將，降清後進駐廈門。三年前進京陳述攻臺方略，滯留至今。韋小寶、施琅率水陸大軍浩浩蕩蕩出發，尚未抵達遼東蛇島，主帥韋小寶便做了神龍教主洪安通的俘虜。小寶身臨絕境，不得已故伎重演，一頓馬屁將洪教主騙得暈頭轉向，然後趁機逃出。據：“施琅道，卑職到北京來，已整整三年了。……韋小寶心想：你在北京熬了三年，已精通做官的法門。”《清史稿·施琅列傳》：“〔康熙〕七年（1668年），〔施〕琅密陳〔鄭〕錦負嵎海上，宜急攻之。詔旨京師，上詢方略。”</p>\n<p class=\"content\">1673年　清康熙十二年（韋小寶18歲）</p>\n<p class=\"content\">韋小寶衣錦還揚州。</p>\n<p class=\"content\">《鹿鼎記》第37回：三藩吳三桂、尚可喜、耿精忠相互勾結，謀反跡象日益顯著。三月十二，尚可喜上奏，說他年紀大了，想歸老遼東，留他兒子尚之信鎮守廣東。康熙帝批示說，尚可喜要回遼東，也不必留兒子在廣東了。七月初三，吳三桂疏請撤藩，康熙批示同意。七月初九，耿精忠疏請撤藩，康熙帝也批示同意。為了安撫民心穩定天下，康熙帝命韋小寶赴揚州，替前明忠臣史可法修建忠烈祠。韋小寶到揚州讀完聖旨，溜到麗春院去看望母親韋春花，不料陷入江湖反清人士的包圍。小寶略施小計，用迷藥將各路人馬迷倒，在妓院裡將神龍教教主夫人蘇荃、沐劍屏、方怡，陳圓圓的女兒阿珂，王屋派弟子曾柔以及自己的俏丫鬟雙兒一網打盡，享盡人間豔福。據《清史稿·聖祖本紀》康熙十二年：“三月壬午（十二），平西王尚可喜請老，許之。……秋七月庚午（初三），平西王吳三桂疏請撤藩，許之。丙子（初九），嗣靖南王耿精忠疏請撤藩，許之。”</p>\n<p class=\"content\">十二月十七，平西王吳三桂起兵謀反。</p>\n<p class=\"content\">《鹿鼎記》第40-41回：十二月十七，吳三桂起兵謀反，雲南提督張國桂、貴州巡撫曹申吉、提督李本深等歸降，雲南巡撫朱國治被殺，雲貴總督甘文焜自殺。吳三桂以故明朱三太子為號令，傳檄天下恢復明室。康熙帝宣召韋小寶急速回京，至於敕建揚州忠烈祠之事，交由江蘇省布政司辦理。韋小寶的香豔夢被攪散，帶著雙兒從揚州返回京城。據《清史稿·聖祖本紀》康熙十二年：“十二月壬子（十七），吳三桂反，殺雲南巡撫朱國治。”第41回記吳三桂檄文：“爰以甲寅之年（1674年）正月元旦，恭奉太子，祭告天地，敬登大寶，建元周諮。”</p>"},{"title":"《連城訣》故事編年（1684-1690）","content":"</a>\n<p class=\"sectionTitle\">《連城訣》故事編年（1684-1690）</p>\n<p class=\"content\">【背景】公元17世紀70年代，平西王吳三桂叛亂，天地會、南明殘餘反清勢力紛紛介入，歷時八年為清朝廷平定。80年代，臺灣鄭經去世，施琅攻取臺灣，明鄭政權亡。是時，俄羅斯彼得大帝年幼，由其姊蘇菲亞公主攝政。清廷派兵攻佔俄羅斯在中國東北的基地雅克薩城，與俄政府進行了尼布楚談判。</p>\n<p class=\"content\">【概要】本篇故事時間上與《鹿鼎記》後半部分重疊，江湖主要幫派除了天地會、沐王府、華山派、神龍教外，還有血刀門、龍沙派、北四怪、南四奇等，梅念笙的三名弟子也各樹一幟。莊戶後生狄雲與師妹青梅竹馬，被誣入獄後痛失所愛，卻有幸與胸懷連城劍訣的俠客丁典相識。出獄後目睹師父輩的貪婪嘴臉，得到水笙姑娘的純真愛情。</p>\n<p class=\"content\">【紀年】據《鹿鼎記》，1674年，天地會吳六奇被華山派歸辛樹夫婦誤殺，同門梅念笙被三名弟子謀殺。十五年後狄雲越獄，當時狄雲在獄中已苦度五年時光，可推知1684年，狄雲蒙冤入獄，故事開始；1689年，狄雲越獄；1690年，武林群豪找到梁元帝的千年寶藏，故事結束，正值康熙帝第一次親征蒙古準噶爾部之年。</p>\n<p class=\"content\">1674年　清康熙十三年（韋小寶19歲、狄雲10歲）</p>\n<p class=\"content\">正月，華山派歸辛樹夫婦誤殺天地會吳六奇。</p>\n<p class=\"content\">《鹿鼎記》第41回：歸辛樹是華山派穆人清的二弟子，明朝滅亡之後，夫婦倆帶著兒子歸鍾四處奔波，謀求趕走韃子皇帝。平西王吳三桂蠱惑說：“吳六奇是廣東大官，要起兵復明，非先殺了他不可。”其實吳六奇是天地會洪順堂的香主，廣東提督不過是掩護身份。歸二孃和歸鍾母子不明所以，合攻吳六奇，將他擊斃。歸辛樹夫婦在香河遇見急速回京的韋小寶，方知吳六奇身份原委，後悔不迭。當時，吳三桂的大軍已取得湖南沅州，正在進攻長沙。按：“長沙要不要緊，倒不知道。吳三桂派了他手下大將馬寶，從貴州進攻湖南，沅州是失陷了，總兵崔世祿被俘。”《清史稿·聖祖本紀》康熙十三年：“春正月庚辰（十五），吳三桂陷沅州。……二月甲寅（二十），吳三桂陷長沙。”又按第42回：“先皇（崇禎）殉國（1644）已三十年，……吳三桂十二年前在昆明市上絞殺永曆皇帝（桂王）父子（1662）。”</p>\n<p class=\"content\">四月十四，韋小寶先救康熙帝，後救陳近南。</p>\n<p class=\"content\">《鹿鼎記》第42-43回：華山派歸辛樹夫婦進宮行刺康熙帝，韋小寶難捨多年的君臣相知之誼，冒險畫圖向康熙報信，併火速進宮護駕。宮中嚴加防範，歸辛樹夫婦被捕就義。從天地會叛徒風際中處，康熙知道了韋小寶勾結天地會的底細，派重兵將天地會群豪聚會的韋爵府團團圍困，命韋小寶親自回府捉拿群雄，戴罪立功。韋小寶不忍加害師父，又冒著生命危險將天地會群豪救出，自己則帶著建寧公主畏罪潛逃。按：小說記韋小寶進宮，是在康熙帝處死吳三桂之子吳應熊的次日。“吳三桂這老小子果真反了。他打了幾個勝仗只道我見他怕了，不敢殺他兒子。他媽的，老子昨天已砍了吳應熊的腦袋。”《清史稿·聖祖本紀》康熙十三年：“夏四月丁未（十三），吳三桂子應熊、孫世霖伏誅。”</p>\n<p class=\"content\">遼東蛇島神龍教的覆滅。</p>\n<p class=\"content\">《鹿鼎記》第44回：韋小寶一行逃亡途中，被神龍教教主洪安通劫持到遼東蛇島。洪教主聽說夫人蘇荃懷了韋小寶的孩子，恥辱難當，下狠心要殺五龍使滅口，以免為天下英雄所笑。神龍教內訌，韋小寶趁機偷襲，殺死洪教主，帶著蘇荃遠走高飛。</p>\n<p class=\"content\">十月，韋小寶的兩子一女出生。</p>\n<p class=\"content\">《鹿鼎記》第45回：韋小寶帶著蘇荃、方怡、建寧公主、阿珂、曾柔、沐劍屏和雙兒七位夫人，藏身在通吃島。阿珂生一子韋虎頭，蘇荃生一子韋銅錘，建寧公主生一女韋板凳。閤家團聚其樂融融，康熙派人叫他回京，韋小寶不肯。按：“秋去冬來，天氣一日冷似一日。蘇荃、公主、阿珂三人的肚子也一日大似一日。……過得十餘日，阿珂先產下一子，次日蘇荃又產下一子。公主卻隔了一個多月，才生下一女。”阿珂和蘇荃，都是在1673年十二月揚州麗春院七女同床時受孕的。</p>\n<p class=\"content\">湘中梅念笙因“連城訣”被三名弟子所殺。</p>\n<p class=\"content\">《連城訣》第3回：公元549年，六朝時梁武帝因侯景之亂而死。552年，梁元帝在江陵繼位。在位三年，梁元帝積聚無數金珠珍寶。554年（承聖三年），江陵被魏兵攻破，梁元帝被殺，這批珍寶下落不明。《連城訣》第12回：天地會廣東紅旗香主吳六奇的師叔，是荊州天寧寺高僧。高僧在無意中發現梁元帝遺下的寶藏，用密碼寫信告訴吳六奇，請其發掘出來作天地會反清復明之用。不幸密碼送到時，吳六奇已誤遭殺害，密碼便流落在外。這密碼須掌握唐詩劍法的劍招次序，對照《唐詩選輯》方能破解。因事關價值連城的寶藏，江湖上稱為《連城訣》。《連城訣》第3、9回：湘中“鐵骨梅萼”梅念笙，是高僧和吳六奇的同派門人，會使“唐詩劍法”，後來又得了劍訣密碼。梅念笙有三名弟子：五雲手萬震山、陸地神龍言達平和鐵鎖橫江戚長髮。三名弟子見師父不肯傳授《連城劍譜》，便合謀在四川三峽將師父殺死，奪走劍譜，卻找不到劍訣。在追查劍訣的途中，劍譜又神秘失蹤。相互猜疑爭執無果，三名弟子揚鑣分道。其實是戚長髮盜走了那本《唐詩選輯》，卻參詳不出其中的奧妙。梅念笙被江湖俠士丁典救起，他將武學秘笈《神照經》和《連城訣》一併送給了丁典，因傷勢過重不治身亡。</p>\n<p class=\"content\">編者按：梅念笙被三名弟子所害的具體年份不詳，應在吳六奇遭難之後不久，姑繫於此。據小說所記，十五年後丁典和狄雲越獄，當時狄雲在獄中已苦度了五年多時光，可推算出狄雲入獄在1684年，出獄在1689年。第3回：“那是十五年前的事了，我乘船從四川下來，出了三峽後，船泊在三鬥坪。”</p>\n<p class=\"content\">1675年　清康熙十四年（韋小寶20歲）</p>\n<p class=\"content\">十二月，韋小寶在通吃島晉封二等伯。</p>\n<p class=\"content\">《鹿鼎記》第45回：康熙帝呼召韋小寶不至，初時大家擔心天威不測，或有後患，過了數月，一無消息。到得夏天，大臣王進寶又率領大船數艘到來，原來是康熙帝派兵五百，駐島保護公主，賞賜諸般用具、食物。是年十二月，趙良棟前來頒旨，皇帝立次子胤礽為皇太子，大赦天下，韋小寶晉爵一級，封為二等通吃伯。據《清史稿·聖祖本紀》康熙十四年：“十二月丙寅（十三），立皇子胤礽為皇太子，頒詔中外，加恩肆赦。”</p>\n<p class=\"content\">1676年　清康熙十五年（韋小寶21歲）</p>\n<p class=\"content\">二月，闖王李自成去世。</p>\n<p class=\"content\">《雪山飛狐》第5回：“闖王逃下九宮山後，到了湖南省石門縣夾山普慈寺出家，法名叫做奉天玉和尚。闖王一直活到康熙甲辰年二月，到七十歲高齡方才逝世。”按：史料記載闖王李自成生於1606年。享年七十歲，逝世之年應在1676年，是丙辰年，而不是甲辰年。《中國通史》卷九：李自成，陝西米脂雙泉裡李繼遷寨（今屬橫山）人。生於萬曆三十四年（1606）八月二十一日酉時。乳名黃來兒，初名鴻基，小字磑生。祖輩世代務農。父名李守忠，有二子，長子李鴻名，鴻基為次子，比兄小二十歲。鴻名有子名過，與鴻基同年生。</p>\n<p class=\"content\">1680年　清康熙十九年（狄雲16歲）</p>\n<p class=\"content\">九月，江湖俠客丁典結識翰林之女凌霜華。</p>\n<p class=\"content\">《連城訣》第3回：梅念笙去世，丁典身懷藏寶秘密的消息，在江湖上不脛而走，上門騷擾的人越來越多，丁典只好隱姓埋名遠走高飛。過得五六年，在漢口出名的重陽節菊花會上，丁典結識了翰林淩退思的女兒凌霜華，一見傾心。以後的六個多月，丁典每天早晨去武昌翰林府，與淩小姐隔窗相望，淩小姐的窗檻上，也總是風雨不改地每天更換一盆鮮花。據（1689年）：“那是在九年多之前，九月上旬，我到了漢口，向藥材店出賣從關外帶來的老山人參。”</p>\n<p class=\"content\">1681年　清康熙二十年（韋小寶26歲、狄雲17歲）</p>\n<p class=\"content\">正月二十八，臺灣鄭經去世，次子鄭克樉即位。</p>\n<p class=\"content\">《鹿鼎記》第44、46回：鄭經長子鄭克臧，生於1664年；次子鄭克塽，生於1670年。1674年鄭經渡海西征反攻大陸，由陳永華（近南）留守臺灣。1679年，經陳永華建議，鄭經立長子鄭克臧為監國。克臧娶陳永華之女為妻，諸事悉受陳永華輔佐。1680年，鄭經反攻大陸七年無功返回臺灣，意志消沉沉湎酒色，鄭氏集團內部權力之爭激烈，以陳永華為首的留守派和以馮錫範為首的西征派互相傾軋。而鄭成功夫人董氏，念念不忘鄭成功之死是因鄭經與乳母生子而起，是以對乳母所生的克臧十分痛恨，極力主張立嫡孫克樉為世子。陳永華中了馮錫範的詭計，自動交出兵權，不久便抑鬱而死（小說第44回將陳近南之死剪貼於韋小寶隱居通吃島之前）。1681年正月二十八，鄭經在臺灣去世，享年三十九歲，遺命大公子克臧接位。正月三十，鄭克臧在接受董太夫人召見時，被馮錫範刺殺，年僅十八歲，已懷有身孕的陳永華之女貞烈自縊。二月初一，董太夫人和馮錫範扶持十二歲的鄭克樉即位。六月二十，董太夫人去世，從此鄭氏集團的權柄落入馮錫範、劉國軒之手。據《泉州人名錄》。《清史稿·鄭經列傳》：“〔康熙二十年〕，〔鄭〕錦（經）卒。子克臧，自錦出師時為居守，永華請於錦，號監國。年未冠，明察能治事，顧乳媼子錫範等意不屬，先構罷永華兵，永華鬱郁死；及錦卒，遂其縊殺克臧，奉錦次子克樉為延平王。”《臺灣通史·陳永華列傳》永曆三十四年：“一日齋沐，入室拜禱，願以身代民命。……越數日近，〔鄭〕經臨其喪，諡文正。”</p>\n<p class=\"content\">三月初五，江湖俠客丁典被血刀門弟子擊成重傷。</p>\n<p class=\"content\">《連城訣》第3回：三月初五，丁典在寓所遭到血刀門兩位僧人的襲擊，身受重傷，在床上足足躺了三個多月。不料梅退思在丁典受傷後不久舉家遷徙，不知去向。按：“這樣子的六個多月，不論大風大雨，大霜大雪，我天天早晨去賞花。”</p>\n<p class=\"content\">十月二十八，清朝康熙帝平定西南吳三桂叛亂。</p>\n<p class=\"content\">《鹿鼎記》第45回：“此後日復一日，年復一年，韋小寶和七女便在通吃島上耽了下去。”韋小寶在宮中的四個好朋友，王進寶、張勇、趙良棟和孫思克在平定三藩的征戰中屢立功勳，官爵頻頻提升。吳三桂到處吃敗仗，佔地一處處丟失，眼看支持不住了，就想在臨死之前過一過皇帝癮，於是在1678年三月穿起黃袍，身登大寶，定都衡州。清軍聽得他做了皇帝，更是稀里嘩啦地狠打，他幾個大敗仗一吃，又驚又氣，在八月二十七就嗚呼哀哉了。吳三桂死後，部下諸將擁立他孫子吳世璠即位，退到昆明。清軍打到昆明，殺吳三桂的大將夏國相、馬寶。1681年十月二十八，吳世璠自殺，三藩之亂全部平定。韋小寶因薦將有功，晉升一等通吃伯。《清史稿·聖祖本紀》康熙十七年：“八月乙未（二十七），吳三桂死，永興圍解。”康熙二十年：“秋七月辛酉（初十），馬寶降，械送京師誅之。”“王師於十月二十八日入雲南城，吳世璠自殺，傳首，吳三桂析骸，示中外。”</p>\n<p class=\"content\">1682年　清康熙二十一年（韋小寶27歲、狄雲18歲）</p>\n<p class=\"content\">五月，俄羅斯公主蘇菲亞攝政。</p>\n<p class=\"content\">《鹿鼎記》第36回：俄羅斯老沙皇阿萊克修斯·米海洛維支娶過兩位皇后。第一位皇后子女甚多，現任沙皇西奧圖三世和蘇菲亞公主都是她所生，另有兒子伊凡。第二位皇后娜達麗亞年輕得多，生有一子叫彼得。現任沙皇西奧圖三世是年二十歲，身體殘疾行動不便，國家大事經常在臥榻之上處理裁決。是年四月，西奧圖三世因病去世，在伊凡和彼得的皇位繼承之爭中，娜達麗亞依靠“杜馬會議”獲勝。蘇菲亞公主不甘認輸，操縱皇宮御林軍火槍營發動政變。火槍手作亂，是在五月十五至十七的三日之中。五月二十九日，火槍營在蘇菲亞指使之下，上書請十六歲的伊凡和十歲的彼得併為沙皇，請蘇菲亞公主攝政，裁決軍國大事。亂事大定，已在六月中旬。這裡的彼得就是後來名垂千古的彼得大帝。據《世界史·俄國》。金庸先生將此事件剪貼在康熙帝十七歲，並記韋小寶參與其事。</p>\n<p class=\"content\">七月十五，荊州知府淩退思逮捕丁典，逼其交出連城訣。</p>\n<p class=\"content\">《連城訣》第3回：丁典遊蕩江湖，在江陵找到凌霜華，“兩人一年多不見，都以為今生再無相見之日，此番久別重逢，真是說不出的歡喜。”兩人無話不說，過了大半年快活日子。丁典把《神照經》、連城訣的事告訴了淩小姐，誰知淩退思本是兩湖龍沙派的掌門，他連任荊州知府的目的就是為了尋找梁元帝寶藏的下落。七月十五，淩退思將丁典手足上了鐐銬，連琵琶骨也用鐵鏈穿過，逼其交出《神照經》和連城訣。丁典寧死不屈，以後的每月十五，淩退思便將丁典提出獄去拷打一頓，逼勒一番。據（1689年）：“淩退思，瞧在你女兒分上，你折磨了我這七年，咱們一筆勾銷。”</p>\n<p class=\"content\">1683年　清康熙二十二年（韋小寶28歲）</p>\n<p class=\"content\">八月二十九，清朝將軍施琅攻取臺灣，鄭克樉降清。</p>\n<p class=\"content\">《鹿鼎記》第46回：五月，康熙派施琅攻打臺灣。閏六月，澎湖一戰，鄭軍水師大敗，施琅乘勝入臺。八月，明延平郡王鄭克樉不戰而降。臺灣就此歸於大清版圖。康熙論功行賞，以施琅當年閒居北京不用，得韋小寶保薦而立此大功，特此升韋小寶為二等通吃侯，加太子太保頭銜。據《清史稿·聖祖本紀》康熙二十二年：“五月甲子（二十三），命施琅徵臺灣。閏六月戊午（十八），施琅克澎湖。八月戊辰（二十九），施琅疏報師入臺灣，鄭克樉率其屬劉國軒等迎降，臺灣平。”</p>\n<p class=\"content\">1684年　清康熙二十三年（狄雲20歲）</p>\n<p class=\"content\">萬震山五十大壽，戚長髮的弟子狄雲蒙冤入獄。</p>\n<p class=\"content\">《連城訣》第1-2回：師父梅念笙遇害後，大弟子萬震山在荊州江陵收徒授藝，二弟子言達平假充乞丐四處打探連城劍譜的下落，三弟子戚長髮帶著女兒戚芳、徒弟狄雲隱居在湘西沅陵的南郊。狄雲和師妹無意間把師父的那本《唐詩選輯》放在一個山洞裡。這一年，萬震山以做壽為名，邀戚長髮去江陵打探虛實。戚長髮被萬震山擊傷後砌入夾牆，了無蹤影，狄雲被萬震山的八個弟子誣為強姦偷盜，鋃鐺入獄。同一獄室的丁典以為狄雲是知府淩退思派來的臥底，對他不斷毆打折辱。是年，狄雲二十歲。按：“那少女十七八歲年紀，圓圓的臉蛋，一雙大眼黑溜溜的，……那青年比她大著兩三歲，長臉黝黑，顴骨微高，粗手大腳，那是湘西鄉下常見的莊稼少年漢子。”</p>\n<p class=\"content\">1685年　清康熙二十四年（韋小寶30歲）</p>\n<p class=\"content\">五月，清朝軍隊攻佔雅克薩城。</p>\n<p class=\"content\">《鹿鼎記》第47回：沙皇俄國向中國黑龍江流域擴張，先後建立了雅克薩和尼布楚兩個據點，作為進一步侵略中國的基地。雅克薩城就建在鹿鼎山上。康熙帝封韋小寶為三等鹿鼎公、撫遠大將軍，領兵征討雅可薩，滿洲都統彭春、臺灣降將林興珠率福建藤牌兵隨大軍出征。韋小寶欣然領命，按照康熙帝的既定戰略，一路殺去連連得手，最後用三千尊水炮“尿射鹿鼎山”，一舉將俄國軍隊擊敗。雅克薩的統兵大將圖爾布青（Alexi Tolbusin ）被迫投降。康熙帝封韋小寶為二等鹿鼎公。據《清史稿·聖祖本紀》康熙二十四年：“春正月癸未（二十三），命公彭春赴黑龍江督察軍務，命侯林興珠率福建藤牌兵從之。……五月，彭春等攻雅克薩城，羅剎來援，林興珠率藤牌兵迎擊於江中，破之，沉其船，頭人額裡克舍（圖爾布青）乞降。”《中國通史》卷十：康熙二十四年五月二十二日，彭春致書俄軍，“羅剎恃巢穴堅固，不肯遷歸”。於是三千名清軍於二十三日分水陸兩路夾營而立，二十四日將神威大將軍炮等火器移入前沿陣地。二十五日黎明各路清軍發起猛攻，城中俄軍一片混亂。俄軍頭目額裡克舍·托爾布津被迫出城投降。</p>\n<p class=\"content\">苗家劍、興漢丐幫、天龍會追殺“飛天狐狸”之子。</p>\n<p class=\"content\">《雪山飛狐》第3回：1660年，苗、範、田三位闖王衛士抱愧自刎，江湖群雄皆以為是受“飛天狐狸”之子的奸計所逼。三家後人報仇心切，學得絕技各樹一幟，苗家武功稱為苗家劍，姓範的後人成為興漢丐幫的掌門，姓田的後人建立了天龍會。只是那“飛天狐狸”之子在密室事件後銷聲匿跡，不知去向。這苗範田三家後代，二十餘年後終於找到了那姓胡的兒子。那時他正身患重病，被三家逼得自殺。從此四家後人輾轉報復，百餘年間，沒一家的子孫能得善終。按：確切年代不詳，姑繫於此。</p>\n<p class=\"content\">1686年　清康熙二十五年（狄雲22歲）</p>\n<p class=\"content\">年底，江湖俠客丁典練成“神照功”，凌霜華毀容拒嫁。</p>\n<p class=\"content\">《連城訣》第3回：丁典從梅念笙手中得到《神照經》，經過十二年研摩苦練，終於練成神照功。當天，丁典越獄去見凌霜華，方知霜華因父親逼嫁已經自毀其容。丁典把“連城劍訣”告訴霜華，自己重回獄室，依然每天從獄窗裡注目小姐窗前的鮮花。按：“我這神照經已練了一十二年，直到兩個月前才練成。……我練成神照功後，當天便出去了，只是出去之前點了你的昏睡穴，你自然不知道了。”兩個月後是狄雲入獄第四年（1687年）的春天，可知丁典練成神照功，大致在1686年的年底。</p>\n<p class=\"content\">1687年　清康熙二十六年（狄雲23歲）</p>\n<p class=\"content\">春，戚芳嫁給萬圭，丁典傳授狄雲神照功。</p>\n<p class=\"content\">《連城訣》第二回：萬震山的弟子來獄中探望狄雲，告知戚芳已嫁給萬震山之子萬圭。狄雲萬念俱灰，上吊自盡。丁典知他不是淩退思派來的臥底，出手救其性命，並把剛練成的“神照功”開始傳授於他。江湖上雪山派、血刀門高手先後到獄中尋寶，都敗在丁典的神照功之下。按：“到第四年春天，狄雲心中已無出獄之念。……我和他在獄中同處三年”。</p>\n<p class=\"content\">1689年　清康熙二十八年（韋小寶34歲、狄雲25歲）</p>\n<p class=\"content\">七月，中俄兩國尼布楚談判。</p>\n<p class=\"content\">《鹿鼎記》第48-49回：自從清廷出兵攻克雅克薩城，中俄兩國在這一地區激烈爭奪，多次反覆，雙方同意進行邊界談判。今年四月，康熙帝命韋小寶、索額圖為議和大臣，前往尼布楚城。七月初八，雙方開始談判。經過艱苦的唇槍舌劍、鬥智鬥勇，二十四晚上，雙方舉行了隆重的條約簽字儀式。這是一份對中國十分有利的條約，割歸中國的土地極為廣大，遠比康熙諭示者為多。勒碑邊界，碑上共有滿、漢、蒙、拉丁及羅剎五體文字。韋小寶等回京覆命，已是十二月中旬。康熙帝封韋小寶為一等鹿鼎公。據《清史稿·聖祖本紀》康熙二十八年：“夏四月壬辰（二十六），覆命索額圖等赴尼布楚，與鄂羅斯定邊界。……十二月乙亥（十三），內大臣索額圖疏報與鄂羅斯立約，定尼布楚為界，立碑界上，以五體文字書碑。”《中國通史》卷十：清朝這個談判代表團於康熙二十八年六月十五日抵達尼布楚，俄使戈洛文因忙於鎮壓貝加爾湖以東蒙古人民的抗俄鬥爭，拖延至七月初四日才到。中俄代表團正式談判是從七月初八日至二十四日（公曆8月22日至9月7日）舉行。……終於在二十四日（1689年9月7日）中俄雙方一致同意簽訂第一個條約，即《中俄尼布楚議界條約》。</p>\n<p class=\"content\">韋小寶隱居雲南大理城。</p>\n<p class=\"content\">《鹿鼎記》第49、50回：康熙帝讓韋小寶監斬江湖豪傑茅十八，韋小寶以李代桃僵之法矇混過關。韋小寶封妻廕子，權勢與榮華達到頂峰，可是不久又起波折，康熙帝要他去剿滅反清的天地會，天地會眾兄弟要他擔任總舵主，繼承師父陳近南的遺志，繼續反清復明大業。韋小寶左右為難，忠義不能兩全，便棄官出逃，到揚州接了母親韋春花，攜著七個夫人和兒女一家人同去雲南，自此隱姓埋名，在大理城過那逍遙自在的日子。韋小寶閒居無聊之際，想起雅克薩城鹿鼎山下尚有巨大寶藏未曾發掘，自覺富甲天下，心滿意足。</p>\n<p class=\"content\">丁典、凌霜華雙雙去世。</p>\n<p class=\"content\">《連城訣》第2-4回：“此後兩年多的日子過得甚是平靜，狄雲勤練神照功，頗有進展。”丁典心中放不下凌霜華，與狄雲一起越獄。不料霜華已死，其父淩退思知府在女兒的棺木上塗了“金波旬花”劇毒，丁典撫棺痛哭的時候，中了這無可救藥之毒。丁典臨終，囑託狄雲將他和凌霜華合葬。按：“[狄雲]在這根鐵鏈的束縛之下，在暗無天日的牢獄中苦度五年多時光。”</p>\n<p class=\"content\">十月，狄雲和水笙姑娘的恩怨情仇。</p>\n<p class=\"content\">《連城訣》第4-8回：當時，中原武林中武功最厲害的，除了丁典之外，還有南四奇、北四怪。北四怪人稱“風虎雲龍”，南四奇則是“落花流水”，即陸天抒、花鐵幹、劉乘風、水岱異姓兄弟四人。水笙姑娘是水岱之女，與表哥汪嘯風並稱為“鈴劍雙俠”。當時在中原武林為非作歹的是青海黑教“血刀門”。“血刀門”掌門人是老僧血刀老祖，門下有寶象、善勇、勝諦等五名惡徒。“血刀門”五名惡徒在十幾年前，為了奪取《神照經》和連城劍訣，將丁典打成重傷，後來又到獄室逞強，被丁典當場殺死兩名。目下，血刀老祖又帶著惡徒在中原作惡。狄雲攜著丁典的骨灰亡命江湖，撞上血刀門惡僧寶象。寶象誤食毒鼠身亡，狄雲穿著寶象的僧袍，被江湖幫派以為是血刀門的小淫僧，連血刀老祖也以為狄雲是自己的徒孫。血刀老祖劫持水岱之女水笙姑娘，帶著狄雲一起逃走。南四奇“落花流水”率領中原武林群豪緊追不捨。十一月，雙方相繼來到川青之交的巴顏喀拉山，被雪崩堵在山裡。一場惡鬥，陸天抒、劉乘風、水岱先後被血刀老祖殺死，花鐵幹臨危屈膝，投降了血刀老祖。狄雲的神照功水到渠成，拼死一擊，殺死了血刀老祖。十二月，花鐵幹兇相畢露，要用幾位結義兄弟的屍體充飢，又想殺狄雲和水笙滅口。狄雲竭盡全力保護水笙父親的屍體，併為水笙打鷹為食。水笙對他的仇恨和猜疑慢慢消除。按：“這一前一後的追逐，轉眼間將近二十日。……這時還只十一月初，等到明年初夏雪融，足足要捱上半年。……踏進十二月，雪谷更加冷了。”</p>\n<p class=\"content\">1690年　清康熙二十九年（狄雲26歲）</p>\n<p class=\"content\">五月，狄雲從二師伯言達平處得悉《連城劍譜》真相。</p>\n<p class=\"content\">《連城訣》第8-9回：春暖雪化，被堵在雪山之外半年之久的中原武林高手進山救人，花鐵幹誣衊狄雲和水笙苟且成奸，水笙的表哥汪嘯風信以為真，執意要殺狄雲，狄雲被迫獨闖江湖。一個月後，在家鄉湘西沅陵，狄雲找到了當年和師妹放在山洞裡的那本《唐詩選輯》。大師伯萬震山與正在那裡挖掘連城劍譜的二師伯言達平火拼，狄雲從萬震山劍下救出言達平，言達平把當年師兄弟三人謀殺師父，奪取劍譜的真相告訴這位救命恩公，還將毒傷萬震山之子萬圭的解藥送給狄雲。按：“臘月將盡，狄雲卻渾不知歲月，……冬去春來，天氣漸暖，山谷中的積雪不再加厚，……這半年中他（汪嘯風）在雪谷之外，每日每晚總是想著。……狄雲在雪谷中又耽了半個月，……他腳程很快，但也一直走了三十多天，才到麻溪鋪老家。其時天氣已暖，田裡禾苗已長到四寸來高了。”</p>\n<p class=\"content\">狄雲和戚芳劫後重逢。</p>\n<p class=\"content\">《連城訣》第10-11回：狄雲來到荊州萬府，終於見到幾年來日思夜想的師妹。戚芳雖然嫁給萬圭，對師兄狄雲也是念念不忘，她把女兒取名為“空心菜”，這是她當年對師兄的暱稱，還每天為師兄的平安禱告。戚芳得知師兄遭萬家父子陷害的真相，心中又痛又悔。狄雲經不住戚芳的哀求，用解藥救了萬圭。萬家父子恩將仇報，在參透那本《唐詩選輯》的奧妙之後，為了殺人滅口，竟殘忍地殺死了戚芳。</p>\n<p class=\"content\">人為財死，武林群豪為寶藏瘋狂。</p>\n<p class=\"content\">《連城訣》第12回：狄雲將丁典和凌霜華合葬，在霜華的棺材裡發現了連城劍訣。萬震山、言達平、戚長髮師兄弟三人終於知道：一千多年前梁元帝遺下的寶藏在江陵城南天寧寺，是一座高逾三丈的金鑄佛像，和佛像肚中的無數珍珠寶貝。武林群豪聞訊趕來，花鐵幹、汪嘯風等人在寶藏面前，都變成了瘋狂的野獸，亂咬亂搶，將珍寶吞入肚中。原來藏寶的梁元帝怕魏兵搶劫，當年在珍寶上都塗了毒藥。狄雲目睹眾人為寶瘋狂，抱著師妹的女兒“空心菜”悄然離開。在川邊雪谷，美麗多情的水笙姑娘正靜靜地等著他的到來。</p>"},{"title":"《鴛鴦刀》故事編年（1735）","content":"</a>\n<p class=\"sectionTitle\">《鴛鴦刀》故事編年（1735）</p>\n<p class=\"content\">【背景】公元18世紀初葉，康熙帝反覆廢立皇太子，諸皇子爭奪儲位的鬥爭此起彼伏。康熙第四子胤封為雍親王，協助辦理政事。10年代，胤禎生皇孫弘曆，頗得康熙帝的寵愛。20年代，康熙帝卒，胤禎立，是為雍正帝。雍正誅殺功臣和政敵，手段異常酷烈。30年代，雍正帝卒，弘曆立，是為乾隆帝。</p>\n<p class=\"content\">【概要】江湖主要門派和人物有三湘大俠楊伯衝、晉陽大俠蕭半和、太嶽四俠、威信鏢局、少林寺、天龍門、屠龍幫和關東六魔等。少年蕭半和為報父仇，入宮為太監，後來為救鴛鴦刀兩位主人的夫人，倉皇逃出皇宮。鴛鴦刀重現江湖時，蕭半和拜託江湖上諸路朋友，奪回寶刀完璧歸趙，以安慰袁、楊兩位英雄之靈。</p>\n<p class=\"content\">【紀年】康熙帝殯天之時（1722），鴛鴦刀被盜出宮中；十三年後（1735），川陝總督劉於義尋獲寶刀，是年蕭半和五十歲。蕭半和十六歲進宮做太監，是在1701年。</p>\n<p class=\"content\">1701年　清康熙四十年（蕭半和16歲）</p>\n<p class=\"content\">蕭半和入宮為太監，伺機為父報仇。</p>\n<p class=\"content\">《鴛鴦刀》：蕭半和原名蕭義，其父蕭老英雄平生跟清韃子勢不兩立，慘遭殺害。蕭老英雄的七個結義兄弟歃血為盟，誓死要為他報仇，但清廷勢大，這七位結義兄弟無一能得善終，不是在格鬥中為清宮的侍衛殺死，便是給捕到了凌遲處死。這一場冤仇越結越深，蕭老英雄十六歲的兒子蕭義細細思量，要練到父親和這七位伯叔一樣的功夫，便竭一生之力也未必能夠，便算練成了，也未必能報得了血海深仇。於是蕭義甘心淨了身子，進宮服侍皇帝，為的是伺機刺死清廷皇帝，為先父報仇。改名“半和”，是羨慕大明三寶太監鄭和遠征異域，宣揚中華德威之意。按：“我在十六歲上便淨了身子，進宮服侍皇帝。”說話時值1735年，蕭半和五十歲壽辰。</p>\n<p class=\"content\">1708年　清康熙四十七年（蕭半和23歲）</p>\n<p class=\"content\">少林寺弟子於萬亭擅自下山探視情人。</p>\n<p class=\"content\">《書劍恩仇錄》第19回：福建莆田少林寺第二十一代天字輩俗家弟子於萬亭，出身農家，從小與鄰女徐潮生甚相親愛，長大後私訂終身。於父過世後，連年乾旱，田中並無收成，萬亭出外謀生，成為少林弟子。於萬亭掛念徐女恩情，塵緣不能割捨，未入少林派武學堂奧，便擅自下山歸鄉，驚悉徐女之父已將女兒嫁給當地豪族之子陳世倌。及後徐女隨夫移居都門，於萬亭戀戀不捨。按：“三年後復去探望，是夜適逢徐女生育（1711年）。”參見《清史稿·陳世倌列傳》：“世倌，康熙四十二年（1703年）進士，改庶居士，自編修累遷侍讀學士，督順天學政。”</p>\n<p class=\"content\">1711年　清康熙五十年（蕭半和26歲）</p>\n<p class=\"content\">八月，清朝四皇子胤禛施展“掉包計”，陳世倌的長子成為皇孫弘曆。</p>\n<p class=\"content\">《書劍恩仇錄》第11回：當時康熙諸子爭儲奪嫡，明爭暗鬥，無所不用其極。康熙五十年八月十三，皇四子胤禛的側妃鈕祜祿氏生了一個女兒，不久聽說大臣陳世倌的夫人同日生產，命人將小兒抱進府裡觀看。哪知抱進去的是兒子，抱出來的卻是女兒。陳世倌知是皇四子掉了包，大駭之下，半句都不敢洩漏出去。皇四子胤禛即後來的雍正帝，這換去的孩子取名弘曆，即後來的乾隆帝。少林弟子於萬亭正好進陳府探望徐夫人，徐氏神色倉皇，將此事告訴了少年時的情人。據《清史稿·聖祖本紀》康熙五十年：“八月庚午（十三），高宗純皇帝生。”《清史稿·高宗本紀》：“諱弘曆，世宗第四子，母孝聖憲皇后，康熙五十年八月十三日生於雍親王府邸。”</p>\n<p class=\"content\">1719年　清康熙五十八年（蕭半和34歲）</p>\n<p class=\"content\">清朝太監蕭半和義薄雲天，搭救袁、楊兩家孤兒寡婦。</p>\n<p class=\"content\">《鴛鴦刀》：蕭半和入宮為太監，方知禁宮之中警衛森嚴，別說走近皇帝跟前，便想見皇帝一面，也著實不容易。十多年之中，雖然他每日每夜都在想刺殺皇帝，始終找不到一個機會。一天晚上，蕭半和聽得宮中的兩名侍衛談起，皇帝得知世上有一對“鴛鴦寶刀”，得之者可無敵於天下，這對刀分別在一位姓袁和一位姓楊的英雄手中。於是皇帝將袁楊兩人全家捕來，勒逼兩人交出寶刀。其中姓楊的英雄，乃名震當世的三湘大俠楊伯衝。兩位大英雄不屈而死，兩位英雄的夫人卻給逮進了天牢。蕭半和心中細一琢磨，為死人報仇，實不如救活人要緊，於是混進天牢，殺了幾名獄卒，將兩位夫人救出牢來。當時袁大俠的兒子冠南三歲，楊大俠的女兒中慧只兩歲。敵人勢大，蕭半和倉皇奔逃之時，袁公子竟在途中失落。為了瞞過清廷耳目，蕭半和裝上一大叢大鬍子，又委屈袁楊兩位夫人做他夫人。好在他是個太監，這權宜之計，也不致辱沒袁楊兩位大俠的英名。按：“十六年前的一天晚上，我聽得宮中的兩名侍衛談起，皇帝得知世上有一對鴛鴦寶刀。”說話時值1735年，蕭半和五十壽辰。“袁相公他三歲時就跟母親失散了，……至於中慧呢，你今年十八歲啦，我初次見到你時，還只兩歲。”</p>\n<p class=\"content\">1720年　清康熙五十九年（蕭半和35歲）</p>\n<p class=\"content\">清朝皇孫弘曆熱河獵熊，深得康熙之寵。</p>\n<p class=\"content\">《書劍恩仇錄》第11回：四皇子胤禛從陳世倌家換去的男孩取名弘曆，自小聰穎武勇，六歲即能誦《愛蓮說》，九歲時，跟隨祖父到熱河打獵，面對大黑熊絲毫不懼，射擊之後剛要上馬，黑熊未死突起，眾侍衛連忙將其擊斃。康熙驚喜交集，認為弘曆福命大，兼之文武雙全，諸孫中對其最為寵愛。胤禛後來能做皇帝，實頗仗這假兒子之力。據《清史稿·高宗本紀》：“木蘭從獼，命侍衛引射熊，甫上馬，熊突起，上控轡自若。聖祖御槍殄熊，入武帳，顧語溫惠皇太妃曰，是命貴重，福將過予。”</p>\n<p class=\"content\">1722年　清康熙六十一年（蕭半和37歲）</p>\n<p class=\"content\">十一月二十，清朝雍正帝即位，下密旨查訪鴛鴦刀。</p>\n<p class=\"content\">《鴛鴦刀》：川俠總督劉於義說：“今上還在當貝勒爺的時候，就已密派親信，到處尋覓。接位之後，更下了密旨，命天下十八省督撫著意查訪。”據《清史稿·世宗本紀》：“[康熙]六十一年十一月，聖祖在暢春園不豫，命代祀圜丘。甲午（十三），聖祖大漸，召於齋宮，宣詔嗣位。聖祖崩。辛丑（二十），上即位，以明年為雍正元年。”</p>\n<p class=\"content\">編者按：一、小說裡共有兩位皇帝。前一位皇帝得知世上有一對鴛鴦寶刀，就將兩位寶刀的主人捕來，勒逼致死；後一位皇帝在當貝勒爺的時候，就留意尋覓鴛鴦刀，即位之後更是刻意查訪。二、後一位皇帝至晚是乾隆。《鴛鴦刀》故事的主題仍然是武林人士反抗滿清，這樣的事情大都發生在清朝前期，即順治、康熙、雍正、乾隆年間，到嘉慶以後就漸趨式微，基本上平息了。《飛狐外傳》有：“清朝順治、康熙、雍正三朝，武林中反清義舉此起彼伏，百餘年來始終不能平服，但自乾隆中葉以後，武林人士自相殘殺之風大盛，顧不到再來反清，使朝廷去了一大隱憂。”三、後一位皇帝應是雍正或乾隆。小說故事主體展開時的皇帝，在當貝勒爺時就握有權柄，能夠廣派密探，查訪武林至寶。整個清朝的皇帝中，順治、康熙、同治、光緒都是幼年即位，並沒有當過貝勒爺。當過貝勒爺並握有權柄的，唯有雍正、乾隆兩位。四、雍正是後一位皇帝的可能性最大。雍正1722年即位時四十五歲，乾隆1735年即位時二十五歲，在對付武林人士的謀略和手段上，顯然是雍正更為老辣。至於兩人的為人性情，小說最後袁夫人說：“滿清皇帝聽說這雙刀之中，有一個能無敵於天下的大秘密，這果然不錯，可是他便知道了這秘密，又能依著行嗎？”這個結論，放在雍正身上更為合適。五、金庸先生曾明確交待故事發生在雍正時代。《鴛鴦刀》的最初版本中，川俠總督劉於義是這樣說的：“那本來是大內中所藏之物，先帝康熙爺殯天之際，不知怎地給人偷盜出去，流落在外。今上接位之後便下了密旨，命天下十八省督撫尋訪，十三年來，始終不見蹤跡。總算是叨了皇上洪福，給我得到了。”這句話從第二版起就被改掉，大約是金庸先生不願意直接將康熙爺牽扯進來。康熙殯天，雍正即位在1722年，十三年後的1735年，正是雍正殯天、乾隆即位之年。按照前面的分析，《鴛鴦刀》故事主體展開時，即使早於1735年，應相去不遠。姑繫於此，待考。</p>\n<p class=\"content\">天龍門掌管闖王軍刀。</p>\n<p class=\"content\">《雪山飛狐》第3回：雍正初年，闖王衛士苗、範、田三家為掌管闖王軍刀發生爭執，偏巧胡家又出了一對武功高強的兄弟，一口氣傷了三家十多人。三家遍邀江湖好手，齊心合力殺了胡氏兄弟，並與大江南北的英雄豪傑在洛陽盟誓，由天龍門田氏執掌軍刀，號令江湖對付胡氏。藏寶之圖由苗家世傳。天龍門後來分為南宗北宗，兩宗每隔十年，輪流掌管寶刀。按：小說原文只交代三家爭刀在雍正初年，天龍門南北兩宗輪流執掌的年代不詳。按照原文最後一次軍刀交接在乾隆四十五年（1780年），推測首次輪流執掌大致在1730年，軍刀由天龍門北宗田氏掌管。</p>\n<p class=\"content\">1728年　清雍正六年（蕭半和43歲）</p>\n<p class=\"content\">天池怪俠袁士霄失戀發誓。</p>\n<p class=\"content\">《書劍恩仇錄》第15、18回：袁士霄與關明梅青梅竹馬，一起長大，互生情愫，只是他性子古怪，兩人因小事爭執，一言不合，袁士霄竟遠走漠北，十多年沒回來，音訊全無。關明梅只道他永遠不歸，就嫁給了陳正德。不料婚後不久，袁士霄忽然回鄉。兩人黯然神傷，不在話下。陳正德甚是不快，攜妻遠走回部。哪知袁士霄舊情難忘，也移居天山。袁士霄生怕自己妒火焦焚，狂性大發之下，竟爾將陳正德打死，是以立下重誓約束自己：“從此而後，決不跟人單打獨鬥。”關明梅為避嫌疑，儘量不與舊日情侶見面，陳正德卻總是不免多心，之後數十年夫妻齟齬不斷。天地怪俠袁士霄後來成為陳家洛的師父，雪雕關明梅後來成為霍青桐的師父。按第18回：“我三十歲那一年，曾向祖師爺立過重誓，從今而後，決不跟人單打獨鬥。”第2回（1758年）：“原來禿鷹陳正德醋心極重，夫妻倆都已年逾花甲，卻還是疑心夫人雪雕關明梅移情別向，數十年來口角紛爭，沒一日安寧。”第11回（1758年）：“陸菲青笑道：禿兄，你們兩夫妻都是六十開外的人啦，這件事吵了幾十年還沒吵完嗎？”</p>\n<p class=\"content\">1733年　清雍正十一年（蕭半和48歲）</p>\n<p class=\"content\">海寧公子陳家洛、乾隆私生子福康安出生。</p>\n<p class=\"content\">《書劍恩仇錄》第8、20回：陳家洛是海寧陳世倌閣老的三公子，其長兄被雍正帝“掉包”換去，成為四皇子弘曆，即後來的乾隆帝。四皇子弘曆的妃子是大臣傅恆的妹妹。傅恆之妻十分美貌，進宮來向皇子妃請安之時，給弘曆看到了，就和他私通生了福康安。弘曆在這一年被封為寶親王。弘曆兒子不少，對這私生子偏生特別鍾愛。福康安與陳家洛面貌相似，只因兩人原是親叔侄，血緣甚近。按第4回：“他十五歲上，就由我們於老當家送到了天山，拜天池怪俠為師，一直沒回江南來。”第8回（1758年）：“陳家洛離家十年，日處大漠窮荒之中，這般江南富貴之家的滋味今日重嘗，恍如隔世。”“乾隆不願他再提文泰來之事，問道，你今年幾歲？陳家洛道，二十五了。”《飛狐外傳》第3回（1766年）：“居中一位青年公子（福康安）面目清秀，丰神俊朗，容止都雅，約莫三十二三歲年紀。”第15回（1771年）：“老夫人點頭道：你（福康安）年近四旬，尚無所出，有這兩個孩子自然很好。”《清史稿·世宗本紀》雍正十一年：“二月己未（初七），上御經筵。封……皇四子弘曆為寶親王。”《清史稿·高宗本紀》：“雍正元年八月，世宗（雍正）御乾清宮，密書上（乾隆）名，緘藏世祖（順治）所書正大光明匾額上。五年，娶孝賢皇后富察氏。十一年，封和碩寶親王。”《清史稿·傅恆列傳》：“傅恆，字春和，富察氏，滿洲鑲黃旗人，孝賢純皇后弟也。”《清史稿·陳世倌列傳》：雍正“四年，母憂歸。命治江南水利，坐遲誤奪職，並命赴曲阜督修孔子廟。”可見陳家洛出生時，陳世倌已離開了京都。</p>\n<p class=\"content\">1735年　清雍正十三年（蕭半和50歲，陳家洛2歲）</p>\n<p class=\"content\">二月，清朝川陝總督劉於義查獲鴛鴦刀。</p>\n<p class=\"content\">《鴛鴦刀》：袁、楊兩位大俠被捕遇害，鴛鴦刀下落不明。十六年之後，川陝總督劉於義終於查獲這一武林至寶，請威信鏢局總鏢頭周威信護送上京，面呈皇上。皇上派大內侍衛、周威信的師叔卓天雄專程接應。隱居多年的晉陽大俠蕭半和得訊，決心要奪回寶刀，以慰袁楊兩位英雄之靈，撒下英雄帖，拜託秦晉冀魯四省好漢，務須將這對寶刀劫奪下來。“太嶽四俠”逍遙子兄弟、“夫妻刀”傳人林玉龍夫婦等武林人物聞風而動。楊大俠的女兒中慧瞞著養父蕭半和和母親楊夫人，加入了劫寶行列。袁大俠的兒子冠南已經長大成人，一路尾隨周威信的鏢隊而來。按（三月初十）：“蕭半和威名遠震，與江湖上各路好漢廣通聲氣，上月間得到訊息，武林中失落有年的一對鴛鴦刀重現江湖，竟為川陝總督劉於義所得。”</p>\n<p class=\"content\">三月初十，晉陽大俠蕭半和五十壽辰，鴛鴦刀物歸原主。</p>\n<p class=\"content\">《鴛鴦刀》：武林各路英雄各自展開劫寶行動，押送鴛鴦刀的威信鏢隊險情迭出。大內高手卓天雄暗中保護鏢隊，袁冠南、蕭中慧等人遲遲不能得手。兩位少俠在劫寶行動中暗生情愫，又得到“夫妻刀法”的真傳，聯手險勝卓天雄，奪得鴛鴦刀。三月初十蕭半和五十壽誕，袁冠南與袁夫人母子相認，袁冠南和蕭中慧喜結連理，卓天雄被“太嶽四俠”用魚網所擒，失落了十六年的鴛鴦刀完璧歸趙。蕭半和將自己身世和鴛鴦刀的淵源和盤托出，原來，“仁者無敵”！這便是鴛鴦刀無敵於天下的大秘密。</p>\n<p class=\"content\">八月二十三，清朝雍正帝駕崩，預遣血滴子行刺陳世倌夫婦。</p>\n<p class=\"content\">《書劍恩仇錄》第19回：雍正暴斃，乾隆接位。雍正留下遺旨：“如朕崩駕之時，陳世倌及其妻徐氏未死，將其全家老小盡數處決不貸。”於萬亭是陳世倌夫人徐氏的少年情侶，他心恐雍正陰險狠毒，預遣刺客加害徐女滅口，故當夜又入陳府，藏於徐女室內。是夜果來刺客兩名，皆為於萬亭所殺，並在其身上搜出雍正遺旨。據《清史稿·世宗本紀》雍正十三年：“八月丁亥（二十一），上不豫。戊子（二十二），上大漸，宣旨傳位皇四子寶親王弘曆。己丑（二十三），上崩，年五十八。”</p>\n<p class=\"content\">屠龍幫陸菲青與關東六魔之一焦文期結仇。</p>\n<p class=\"content\">《書劍恩仇錄》第1回：屠龍幫是反清秘幫，在雍正初年聲勢甚是浩大。武當派陸菲青、王氏太極門趙半山等都是屠龍幫中響噹噹的人物。關東六魔是江湖中的邪派人物，是年，第三魔焦文期在直隸濫殺無辜，給陸菲青撞上了，出手制止，當時手下留情，未曾趕盡殺絕，只打了他一掌。焦文期卻引為奇恥大辱，誓報此仇。按（1753年）：“陸老英雄，一晃十八年，可還認得焦文期麼？”</p>"},{"title":"《書劍恩仇錄》故事編年（1753-1759）","content":"</a>\n<p class=\"sectionTitle\">《書劍恩仇錄》故事編年（1753-1759）</p>\n<p class=\"content\">【背景】公元18世紀40年代，乾隆帝即位初期，出兵平定四川大小金川之亂，大學士傅恆受到重用，出任戶部尚書。50年代，乾隆帝平定蒙古準噶爾部、新疆回部天山南路的叛亂。將軍兆惠功勳殊烈，曾在平回之役中，被圍“黑水營”達四月之久。在此期間，乾隆帝多次奉母南遊，江南吏民不堪重負。</p>\n<p class=\"content\">【概要】江湖主要門派有莆田少林寺、屠龍幫、太極門、八卦門、紅花會、關東六魔、飛馬鏢局、鎮遠鏢局等。海寧閣老陳世倌之子陳家洛，十五歲離家到天山學藝，二十五歲接任紅花會總舵主，遭遇當年因“掉包計”成為乾隆帝的長兄，幾經周折，反清復明的宏圖成為泡影，陳家洛心愛的香香公主也不幸血灑京城。</p>\n<p class=\"content\">【紀年】清乾隆十八年（1753），“綿裡針”陸菲青殺“關東六魔”之一焦文期，故事開始。乾隆二十三年（1758），安西總兵李可秀升任浙江水陸提督，清廷平回之役全面展開。第二年（1759），木卓倫父子力戰而死，香香公主在北京遇難，故事結束。</p>\n<p class=\"content\">1740年　清乾隆五年（陳家洛7歲）</p>\n<p class=\"content\">少林寺弟子於萬亭被逐出師門。</p>\n<p class=\"content\">《書劍恩仇錄》第19回：雍正臨終派往陳府的刺客，為於萬亭所殺，乾隆大抵不知掉包之事，是以再無刺客遣來。於萬亭仍不放心，乃化裝為傭，在陳府操作賤役，劈柴挑水，共達五年。確知已無後患，方始離去。於萬亭回到少林寺，因為一己私情擅闖民居、預聞皇室機密、大膽妄為敗壞少林清譽被逐出師門。天池怪俠袁士霄為抱不平，邀請武林同道要上少林寺找掌門人評理。於萬亭盡力分說，袁士霄這才作罷。於萬亭被逐出師門之後，隱居數年，後來創建紅花會，終於轟轟烈烈地做出一番大事來。</p>\n<p class=\"content\">1742年　清乾隆七年（陳家洛9歲）</p>\n<p class=\"content\">反清組織屠龍幫被清廷鎮壓瓦解。</p>\n<p class=\"content\">《書劍恩仇錄》第1回：反清組織屠龍幫在雍正初年聲勢甚是浩大，後來雍正、乾隆兩朝厲行鎮壓，到乾隆七八年時，屠龍幫終於落得瓦解冰消。幫中高手陸菲青遠走邊疆，遭到清廷的嚴加查緝。趙半山是陸菲青在幫裡的好友，比陸菲青年輕十歲，是溫州王氏太極門的掌門大弟子。趙半山在屠龍幫瓦解後，參加於萬亭創建的紅花會，坐第三把交椅。按（1758年）：“至今分別二十年，算來他（趙半山）也快五十歲。”</p>\n<p class=\"content\">1748年　清乾隆十三年（陳家洛15歲）</p>\n<p class=\"content\">苗家劍、天龍門田氏兩位掌門失蹤。</p>\n<p class=\"content\">《雪山飛狐》第5、10回：胡、苗、範、田四家子孫，百年來輾轉報復，都是因為胡家子孫沒有洩露當年“飛天狐狸”忍恥降清的機密。胡家傳到胡一刀手裡，百年之期已過。胡一刀正要去向三家說明上代結仇的緣由，苗家劍苗人鳳的父親、天龍門北宗田歸農的父親田安豹在同赴關外時失蹤，三家都認為是遭了胡一刀的毒手。實際上，苗人鳳的父親、田歸農的父親已經參透闖王軍刀的秘密，結伴來到遼東烏龍山玉筆峰藏寶之洞，結果在挖掘寶藏時各起異心，互鬥而死。</p>\n<p class=\"content\">編者按：兩位掌門失蹤的確切年代不詳。據第5回：“待得傳到胡一刀大爺手裡，百年之期已過。”“這秘密起因於李闖王大順永昌二年，那年是乙酉年，也就是順治二年（1645年），當時胡、苗、範、田四家祖宗言明，倘若清朝不亡，須到一百年後的乙丑年（1745年），方能洩露這個大秘密。”由此可知兩位掌門失蹤年代的上限是1745年。第5回：“皇天不負苦心人，他訪查數年，終於得知二人確息。”胡一刀得知苗掌門、田安豹二人確息時，與胡夫人相識，後來兩人結為伉儷。胡斐出生在乾隆十八年（1753年），可知兩位掌門“失蹤”年代的下限是1751年。</p>\n<p class=\"content\">再看田安豹、田歸農父子的年齡。田安豹客死關外時不過四十歲。《雪山飛狐》第8回：“眾人見田安豹的容貌瞧來年紀不過四十，比阮士中還年輕。”其子田歸農在乾隆三十一年（1766年）時三十八歲。《飛狐外傳》第1回：“男的長身玉立，氣宇軒昂，背上負著個包裹，三十七八歲年紀。”我們建立這樣一個數學模型，假設“兩位掌門失蹤”之年為x，則田安豹的出生之年為x－40，其子田歸農出生之年為1766-38=1728，當時田安豹的年齡為1728-（x-40）=（1768-x）歲。可以理解，田安豹生子的年齡不會小於17歲；而田安豹失蹤後，田歸農已經能夠四出尋訪胡一刀，年齡也不會小於17歲，即田安豹生子的年齡不會大於23歲。解23≥1768-x≥17得出1745≤x≤1751，與小說透露的上述線索相吻合，取其中，“兩位掌門失蹤”之年約為1748年。姑繫於此。</p>\n<p class=\"content\">海寧公子陳家洛離家，拜天池怪俠袁士霄為師。</p>\n<p class=\"content\">《書劍恩仇錄》第4、5回：清朝閣老陳世倌的三公子陳家洛，十五歲中舉後不久，母親徐氏讓陳家洛認於萬亭為義父，將他偷偷帶出陳府。於萬亭當時可能正忙於紅花會組織的籌建完善，便將陳家洛送至天山，讓他拜天池怪俠袁士霄為師。紅花會中只有無塵道長、趙半山幾位年長的香主與少年陳家洛見過面。陳家洛離家出走，只有母親徐氏知道他的下落，陳府出了重賞找尋，數年之中一無音訊。按第8回（1758年）：“陳家洛離家十年，日處大漠窮荒之中。”</p>\n<p class=\"content\">1749年　清乾隆十四年（陳家洛16歲）</p>\n<p class=\"content\">八卦門弟子商劍鳴殘害苗人鳳的四位親人。</p>\n<p class=\"content\">《雪山飛狐》第4回：商劍鳴，山東武定縣人，是“威震河朔”王維揚的弟子，八卦門中的好手。商劍鳴聽說苗家傳人苗人鳳的外號叫做“打遍天下無敵手”，心中不服，找上門來比武。正巧苗人鳳有事去了嶺南，商劍鳴竟下殺手，將苗人鳳的兩個兄弟、一個妹子全用重手震死，連那不會武功的弟婦也被一掌打死。殊不知苗人鳳是因父親失蹤，要激胡一刀出面，才取了這個外號。按（1753年）：“四年之前，我有事去了嶺南。”</p>\n<p class=\"content\">1750年　清乾隆十五年（陳家洛17歲）</p>\n<p class=\"content\">武當派陸菲青做總兵衙門西賓。</p>\n<p class=\"content\">《書劍恩仇錄》第1回：武當派陸菲青是反清幫會屠龍幫的高手。屠龍幫瓦解後，為了躲避清廷的查緝，他想到“大隱隱於朝，中隱隱於市，小隱隱於野”之理，化名陸高止，混到陝西扶風延綏鎮總兵李可秀府中教讀。學生李沅芷是李可秀的獨生女兒，是李可秀在湘西做參將任內所生，年方十一。按：“清乾隆十八年六月，陝西扶風延綏鎮總兵衙門內院，一個十四歲的女孩兒跳跳蹦蹦地走向教書先生書房。……沅芷，你我師生三年，總算相處不錯。”</p>\n<p class=\"content\">1753年　清乾隆十八年（陳家洛20歲）</p>\n<p class=\"content\">闖王衛士之後胡一刀娶妻。</p>\n<p class=\"content\">《雪山飛狐》第5、10回：關外大俠胡一刀的夫人是玉筆峰莊主杜希孟的表妹。自從苗家劍、天龍門北宗的兩位掌門人神秘失蹤，兩位掌門人的兒子苗人鳳、田歸農四處尋訪胡一刀，欲為父親報仇。胡一刀為了洗刷自己的冤枉，也在到處尋找苗、田兩位前輩。杜希孟得到一些線索，猜得闖王寶藏必在烏龍山玉筆峰附近，是以長住峰上找尋。他一來心思遲鈍，二來機緣不巧，始終參透不出藏寶的所在。胡一刀暗中查訪數年之後，在杜希孟之前得知藏寶之處。他進了藏寶之洞，發現苗、田兩位前輩在這裡早已互鬥而死。杜希孟的表妹跟蹤而來，與胡一刀互相欽慕，兩人結為夫婦。</p>\n<p class=\"content\">六月，武當派陸菲青鬥殺關東六魔之一焦文期。</p>\n<p class=\"content\">《書劍恩仇錄》第1、5回：焦文期是關東六魔第三魔，受海寧陳世倌閣老府上之託，前赴回疆尋訪離家多年的三公子陳家洛，途經陝西扶風，偶得十八年前有一掌之仇的武當派陸菲青的行蹤。焦文期和同伴“鐵臂羅漢”羅信、“玉判官”貝人龍圍攻陸菲青。“綿裡針”陸菲青施展平生絕技，連斃三敵。自己也身受重傷，回到總兵李可秀的衙門療養。按：“清乾隆十八年六月。”</p>\n<p class=\"content\">八月，武當派陸菲青傳授李沅芷武當派功夫。</p>\n<p class=\"content\">《書劍恩仇錄》第1回：身受重傷的陸菲青在總兵衙門療養兩個月後，內傷痊癒。他的女學生李沅芷在這兩個多月中妥為護侍，盡心竭力。從那時起，陸菲青便以武當派的入門功夫相授，李沅芷悟性甚高，進步極快。</p>\n<p class=\"content\">武當派弟子餘魚同加入紅花會。</p>\n<p class=\"content\">《書劍恩仇錄》第2回：“綿裡針”陸菲青共有武當派同門師兄弟三人，大師兄馬真是武當派掌門，他居中老二，師弟張召重熱衷功名利祿，投身朝廷青雲直上，陸菲青多年前已與他劃地絕交。大師兄馬真雲遊江湖，收了個弟子叫餘魚同。餘魚同乃江南望族子弟，中過秀才，父親遭豪門陷害，瘐死獄中，餘魚同拜馬真為師，棄文習武，回鄉刺死土豪，亡命江湖，人稱“金笛秀才”。這一年，餘魚同加入於萬亭的紅花會，坐第十四把交椅。他對紅花會的十一當家“鴛鴦刀”駱冰一見傾心，怎奈駱冰此時已和四當家“奔雷手”文泰來結為連理。按第3回（1758年）：“餘魚同顫聲說，你一點也不知道，這五六年來，我為你受了多少苦。我在太湖總香堂第一次見你，我的心就不是自己的了。”是年，餘魚同十八歲。第13回：“二十三年來往事，一幕幕湧上心頭。”駱冰十七歲。第3回：“她人緣又好，二十二年來可說是個江湖驕女，無求不遂，無往不利。”文泰來三十歲左右。第2回：“文泰來比她大上十多歲，除了紅花會的老舵主於萬亭和幾位義兄之外，生平就只服這位嬌妻。”</p>\n<p class=\"content\">八卦門商劍鳴砍傷飛馬鏢局馬行空。</p>\n<p class=\"content\">《飛狐外傳》第1回：“百勝神拳”馬行空是飛馬鏢局總鏢頭，在甘涼道上與八卦門的高手商劍鳴動手。商劍鳴砍他一刀，劈他一掌，將他打成重傷。馬行空養傷三年方得康復。按（1766年）：“十三年前，你師父給人砍過一刀，劈過一掌，養了三年傷方得康復。”據商老太回憶：“他（商劍鳴）回得家中，傷未平復，咱們的對頭胡一刀深夜趕上門來，將你爹害死。”胡一刀殺商劍鳴是在乾隆十八年十二月下旬，估計商劍鳴砍傷馬行空，就是在這一年的秋冬之交。</p>\n<p class=\"content\">十二月二十，胡一刀之子胡斐出生。</p>\n<p class=\"content\">《雪山飛狐》第5、10回：胡一刀的夫人懷孕待產，胡一刀夫婦從關外迴歸故鄉，途經直隸滄州唐官屯，遭到天龍會田歸農、興漢丐幫範幫主攔截。胡一刀用金錢鏢擊退眾人，住進小鎮的一家客店。田歸農、範幫主去向苗人鳳報信求援。胡一刀在客店裡找不到接生婆，強迫小鎮上一個跌打醫生閻基，給夫人接下了一個白白胖胖的小子，取名胡斐。按第3回（1780年）：“此刀我已第二次瞧見。首次見到之時，屈指算來已是二十七年之前的事了，……苗姑娘約莫十七歲年紀，她說那是她出世之前十年的事，正是二十七年之前。”第5回：“寶樹坐椅中，凝目瞪視，回思二十七年前之事，始終想不出此人是誰。……二十七年之前，我是滄州那小鎮客店中灶下燒火的小廝。”第4回：“那一年臘月，老衲（閻基）喝了三碗冷麵湯睡了。”第5回：“爹爹（苗人鳳）叫廚子做了滿桌菜，倒十幾碗酒，從十二月二十二起，一連五天，他每晚在[胡一刀]靈位邊喝乾這十幾碗酒，神情十分傷心，喝到後來，往往撫刀大哭。”胡苗比武之期正是五天，因此可以確定，比武自十二月二十二起，至二十六胡一刀中毒身亡止。胡斐出生在此稍前。按第4回：“孩子生下來還只幾天，自然不會說話，只咿咿啊啊幾聲。”</p>\n<p class=\"content\">胡一刀仗義救助平阿四一家。</p>\n<p class=\"content\">《雪山飛狐》第5回：平阿四是直隸滄州唐官屯小鎮一個客店的燒火小廝，那年冬天家中遭遇大禍，爹爹欠了當地趙財主的高利貸，被逼得走投無路。正好胡一刀的夫人臨產，住進這個客店。胡一刀聽說平阿四一家的遭遇後，慷慨解囊，給他一百兩銀子。平阿四感激涕零，發誓要為胡大爺赴湯蹈火在所不辭。按：“胡大爺道，我今日生了兒子，我很疼他憐他，將心比心，你爹媽疼你也是這般。”</p>\n<p class=\"content\">二十一，跌打醫生閻基為胡一刀傳信。</p>\n<p class=\"content\">《雪山飛狐》第4、7回：胡一刀牽掛著夫人和兒子的安全，對即將來臨的大戰憂心忡忡。因為擔心範、田兩位糾纏不清，加上苗、田兩位上輩死得不太體面，胡一刀不便當面述說。他派跌打醫生閻基去告知苗人鳳三件大事。一是胡苗範田四家上代結仇的緣由；二是苗人鳳父親和田歸農父親的死因；三是關於闖王軍刀的秘密。胡一刀還帶信給苗人鳳，待自己送夫人迴歸故鄉之後，將親自帶他去迎回苗人鳳父親的屍首。苗人鳳有事外出，田歸農接待了前來送信的閻基，之後卻沒有將這三件大事轉告苗人鳳，導致苗人鳳繼續向胡一刀尋仇。按：“田相公看了那信，說道，不必另約日子了，我們明天準到。”</p>\n<p class=\"content\">二十二，胡一刀以苗家劍殺商劍鳴。</p>\n<p class=\"content\">《雪山飛狐》第4回：胡一刀和苗人鳳之間的一場大戰終於不可避免，這是胡、苗之戰的第一天。比武正酣，田歸農在旁邊用彈弓暗算胡一刀，苗人鳳大怒，折斷其彈弓，並大聲斥責。胡、苗兩人的俠義之氣和絕世武藝都令對手欽佩之至。胡一刀聽說苗人鳳生平掛懷之事，是四年前“八卦刀”商劍鳴的滅門之仇，便連夜趕往山東武定縣的商家堡，用苗家劍法殺死了商劍鳴。苗人鳳聽說胡一刀最是牽掛兒子胡斐的安危，當下發誓一定要將胡斐撫養成人。</p>\n<p class=\"content\">二十五，天龍門田歸農、跌打醫生閻基在兵器上暗施毒藥。</p>\n<p class=\"content\">《雪山飛狐》第4、7回：這是胡、苗之戰的第四天，田歸農與胡一刀自是有仇，對苗人鳳折斷彈弓、當眾辱罵一事也耿耿於懷，他希望兩人同歸於盡，就在天龍門獨一無二的秘製毒膏中，混入“毒手神梟”石萬嗔的藥物，見血封喉，厲害無比，交給跌打醫生閻基見機行事。閻基趁胡、苗兩位大俠同榻而眠，切磋武學之時，偷偷將藥膏塗在兩位大俠比武所用的刀劍之上。</p>\n<p class=\"content\">“毒手神梟”石萬嗔為田歸農配製毒藥。</p>\n<p class=\"content\">《飛狐外傳》第20回：洞庭湖畔的白馬寺，有一對師兄弟“毒手藥王”和“毒手神梟”，施毒和解毒的功夫超群絕倫。“毒手藥王”脾氣暴躁，出家後法名“大嗔”；後來修性養心，頗有進益，於是更名“一嗔”。“毒手神梟”法名“萬嗔”，因使毒無節，多傷好人，給師父逐出門牆。此後數十年中曾和一嗔爭鬥過多次，石萬嗔每一回屈居下風。石萬嗔因此廢寢忘食地鑽研毒藥，以求勝過師兄。按第18回（1771年）：“只見此人（萬嗔）極瘦極高，……頭髮已然花白，至少已有五十來歲，臉上生滿了黑斑。”第20回：“他畢生鑽研毒藥，近二十年來更加廢寢忘食地用功，以求勝過師兄，實已跡近瘋狂。”</p>\n<p class=\"content\">《飛狐外傳》第10回：一嗔大師有三個徒弟，慕容景嶽、姜鐵山和薛鵲。慕容景嶽本來有妻子，師妹薛鵲喜歡大師兄，便把師嫂毒死。慕容景嶽一氣之下，暗中下毒，害得師妹駝背跛腳。姜鐵山一直喜歡著師妹，她雖殘疾，卻並不嫌棄，便和她成了親，生有一子叫姜小鐵。從此，慕容景嶽和他們夫婦倆結下深仇，三個人誰也不肯干休，難以收拾。按第9回（1771年）：“只見那女子（薛鵲）容貌文秀，雖身有殘疾，仍可說得上是個美女，那大漢（姜鐵山）卻滿臉橫肉，形相兇狠，兩人都是四十來歲年紀。”第10回：“奇怪的是一隻大鐵鑊盛滿了熱水，鑊中竟坐著一個青年男子（姜小鐵）。”既然十八年後姜小鐵是一個青年男子，差不多是此時或稍前出生的。</p>\n<p class=\"content\">二十六，胡一刀夫婦遇難，平阿四救走胡斐。</p>\n<p class=\"content\">《雪山飛狐》第4回：這是胡、苗之戰的第五天。兩位大俠雖為仇家，卻互相引為知己，一場生死之搏已經演變成高層次的武學切磋。兩位大俠交換刀劍切磋武藝時，胡一刀左臂小傷，竟然中毒斃命，胡夫人隨夫自盡。閻基趁亂去房裡暗害嬰兒胡斐，被客店裡的燒火小廝平阿四一棍打昏。平阿四抱著小胡斐奪路而逃，讓田歸農一劍斬下右臂。平阿四後來悉心撫養胡斐，用胡一刀遺下的刀譜教其武藝，胡斐終於名動江湖，人稱“雪山飛狐”。</p>\n<p class=\"content\">1754年　清乾隆十九年（胡斐1歲）</p>\n<p class=\"content\">平阿四投奔玉筆峰莊主杜希孟。</p>\n<p class=\"content\">《雪山飛狐》第10回：胡、苗比武之時，胡夫人將丈夫的武學秘本、家譜、遺書等物放在小胡斐的襁褓之中。平阿四抱著胡斐去投奔胡夫人的表兄杜希孟。哪知杜希孟隱約猜到胡一刀夫婦知道藏寶秘密，偷偷搜查他的遺物。平阿四情知不妙，抱著胡斐連夜逃下玉筆峰。他們帶走胡一刀的武學秘本，而其他一包遺物，卻失落山莊。</p>\n<p class=\"content\">苗人鳳錯怪“毒手藥王”石一嗔。</p>\n<p class=\"content\">《飛狐外傳》第11回：胡一刀中毒身亡後，苗人鳳聽說此毒與“毒手藥王”有關，便去洞庭湖畔找一嗔大師論理。兩人言語失和，動起手來。苗人鳳用劍將一嗔大師左手兩根手指削去。第二天，一嗔大師命人送來一隻鐵盒，苗人鳳打開盒蓋時，被盒裡躍出的小蛇咬了一口。幸虧一嗔在盒內附有蛇藥，服用之後性命無礙，這一番痛苦卻也難當之至。按（1771年）：“我確是把這位故人瞧得小了。一別十餘年，人家豈能如我苗人鳳一般，全沒長進？”苗人鳳尋釁，當在胡一刀去世後不久。</p>\n<p class=\"content\">是年，佛山弱女袁銀姑受辱自盡，孤兒袁紫衣遠走回疆。</p>\n<p class=\"content\">《飛狐外傳》第14回：銀姑是廣東佛山的鄉下姑娘，外號“黑牡丹”，是年十八九歲，被佛山鎮惡霸鳳天南玷汙成孕。父親含恨去世，銀姑幾個月後產下一女，即是袁紫衣。佛山鎮魚行的一名夥計不嫌棄銀姑，願意娶她為妻，卻在拜堂成親之日被鳳天南打死。銀姑走投無路，抱著幼女流落江湖，投在江西南昌湯沛大俠府上做了女傭。湯沛號稱“甘霖惠七省”，卻是人面獸心，乘人之危強暴了銀姑。銀姑羞憤之下，懸樑自盡。銀姑死後第三天，峨嵋派中一位輩分甚高的尼姑，將孤女袁紫衣救去，帶到天山自幼便給她落髮，授以武藝。按：袁銀姑從佛山至南昌，袁紫衣從南昌去回疆，可以確定在今年。第14回（1771年）：“十七年前，也是這麼一個下雨天的晚上，在廣東省佛山鎮，一個少婦抱著一個女娃娃，冒雨在路上奔跑。……我媽死後第三天，我師父便接了我去，帶我到回疆，隔了一十七年，這才回來中原。”</p>\n<p class=\"content\">袁紫衣出生之年，原著未作明確交代。第14回（1771年）：“我也是十幾歲的人，心裡可不服氣了。……這小胡斐是個魯莽匹夫，就算武功，也勝不了一個十幾歲的小姑娘。”袁紫衣年紀比胡斐小。第14回：“這次小妹東來，文四嬸便要我騎了她的白馬來。”第20回：“圓性含淚道，胡大哥，不成的……我見到你是我命苦，不見你，我仍然命苦。”胡斐生日在1753年的十二月下旬，因此袁紫衣出生不會早於今年。比照上文，可知袁銀姑是年生下袁紫衣，同年在南昌受辱自盡。</p>\n<p class=\"content\">1755年　清乾隆二十年（陳家洛22歲）</p>\n<p class=\"content\">清朝將領李可秀調任甘肅安西鎮總兵，《書劍恩仇錄》第1回：武當派名宿陸菲青向女弟子李沅芷傳授武當派功夫。匆匆兩年有餘，李沅芷既用功又聰明，進步很快。其時李沅芷的父親李可秀調任甘肅安西鎮總兵。安西北連大漠，乃關外重鎮。</p>\n<p class=\"content\">1756年　清乾隆二十一年（陳家洛23歲）</p>\n<p class=\"content\">清朝大臣陳世倌的二公子逼淫母婢，致死人命。</p>\n<p class=\"content\">《書劍恩仇錄》第11回：陳世倌與夫人徐氏共生有三子，長子被雍正“掉包”，即當今乾隆；次子居家，“庸愚頑劣，令人神傷”（據《徐氏致於萬亭書信》）；三子陳家洛被義父於萬亭帶往回疆大漠，拜天池怪俠袁士霄為師。至於換到陳家的女兒，本是公主，後來嫁給常熟蔣溥。蔣溥由戶部尚書、禮部尚書、吏部尚書而大學士，終乾隆一朝，蔣家榮寵不衰。參見《清史稿·蔣廷錫列傳》：“子溥，字質甫。雍正七年，賜舉人。八年，進士。”按雍正七年，皇子弘曆十八歲。與弘曆同歲的陳世倌“女兒”大約就是在此時或稍前嫁給蔣溥的。</p>\n<p class=\"content\">《書劍恩仇錄》第8回：陳家洛幼時在家，有兩個服侍丫頭，晴畫和雨詩。雨詩和府中家人進忠相好，有一天卻被二老爺酒醉糟蹋了。雨詩想不開，夜裡偷偷地跳了海。進忠抱著她屍身哭了一場，在府門前的石獅子上一頭撞死。按（1758年）：“雨詩已在前年過世啦，晴畫還在這裡，我去叫她來。”參見《清史稿·陳世倌列傳》：“乾隆十六年，命入閣辦事，兼管禮部事。二十二年，以老病乞休，詔從其請，加太子太傅。”陳世倌退休，是在次子逼死人命的第二年，或許兩者之間也有些因果關係，待考。</p>\n<p class=\"content\">1758年　清乾隆二十三年（陳家洛25歲）</p>\n<p class=\"content\">春，紅花會於萬亭夜闖皇宮，告知乾隆身世。</p>\n<p class=\"content\">《書劍恩仇錄》第4、8、9回：紅花會總舵主於萬亭，受陳世倌老夫人徐氏所託，到北京夜闖皇宮，告知乾隆本是漢人。他向乾隆出示了兩件書證，一是當年雍正做貝勒時，寫給陳世倌要求抱看其新生兒子的信；一是徐氏寫給於萬亭的信，信中詳述當時經過，又說乾隆左臀有殷紅朱記一塊，這是再也確切不過的明證。紅花會四當家文泰來隨於萬亭入宮，十一當家駱冰在宮外把風。於萬亭要求乾隆推翻清廷，光復漢家天下。乾隆雖然信了九成，但遲疑未決。按第11回：“是你們紅花會已故的首領於萬亭今年春天進宮來，我才聽說的，現今我仍是將信將疑。”</p>\n<p class=\"content\">四月，清朝大臣陳世倌夫婦先後去世。</p>\n<p class=\"content\">《書劍恩仇錄》第8回：海寧陳世倌夫人徐氏大約是聽了於萬亭的回報後，很不開心，一連三天沒好好吃飯，得病十幾天就過世了，臨終惦記著三子陳家洛，說：“三官呢？他還沒來嗎？我要三官呀！”這樣叫了兩天才死。按：小說記“陳家洛心想父親逝世多年，實是猜不透皇帝何以對他家近年忽然特加恩寵”。其實，陳世倌倒確實是今年四月去世的。《清史稿·高宗本紀》乾隆二十三年：“夏四月庚午（十五），致仕大學士陳世倌卒。”《清史稿·陳世倌列傳》：“乾隆二十三年春，陛辭，……未行，卒，諡文勤。”</p>\n<p class=\"content\">清朝乾隆帝下旨在海寧修建海神廟。</p>\n<p class=\"content\">《書劍恩仇錄》第8回：乾隆從於萬亭處得知自己的身世，又從幼時乳母廖氏處得到確認。他一方面派人絞死廖氏，防止走漏隱事，一方面又下旨在海寧陳府大興土木，新造府第莊園，還在陳世倌夫婦墓穴前修建了海神廟。中殿供奉的潮神面目清秀，下頜微髭，一如陳閣老生時；天后宮供奉的天后神像臉如滿月，雙目微揚，與徐氏相貌一模一樣。按：“陳家洛道，那新園子是怎麼回事？瑞芳道，今年上半年才造的，不知用了幾十萬兩銀子哪，……陳家洛問，海神廟？瑞芳道，那也是今年春天剛造的。廟大極了，在海塘邊上。”</p>\n<p class=\"content\">六月，紅花會總舵主於萬亭去世，義子陳家洛接位。</p>\n<p class=\"content\">《書劍恩仇錄》第4回：於萬亭離京回到江南，便遣急使趕去回疆，要義子陳家洛到安西玉虛觀候命，自己即去杭州府海寧州。於萬亭因為生平至愛徐氏逝世，傷心過度一病不起，臨終遺命要義子陳家洛接任總舵主，讓紅花會六堂正副香主趕赴西北，會見少舵主共圖大事，一切機密，待四當家文泰來親見少舵主面陳。按第1回：“紅花會總舵主於萬亭上個月死在無錫，江湖上誰不知道。”</p>\n<p class=\"content\">七月，武當派陸菲青師徒隨李可秀赴任杭州。</p>\n<p class=\"content\">《書劍恩仇錄》第1回：李可秀調任安西鎮總兵兩年多，到了乾隆二十三年，因平定伊犁一役有功，乾隆降旨，著李可秀升任浙江水陸提督。其女李沅芷，隨著武當派名宿陸菲青習武五年，把金針、劍術、輕功、拳技，都學了個全，所差的就是火候未到，經驗不足。赴任途中，李沅芷女扮男裝，興高采烈。按：乾隆年間，伊犁多次發生叛亂，朝廷多次出兵。與小說時間最接近的一次，據《清史稿·高宗本紀》乾隆二十二年：“三月丁酉（初六），噶勒藏多爾濟陷伊犁，命成袞扎布討之。”</p>\n<p class=\"content\">紅花會“千里接龍頭”。</p>\n<p class=\"content\">《書劍恩仇錄》第1-2回：按照總舵主於萬亭的遺囑，紅花會無塵道長、趙半山、文泰來、常赫志、常伯志、徐天宏、楊成協、衛春華、章進、駱冰、石雙英、蔣四根、餘魚同等首領趕赴安西，迎接新任總舵主陳家洛。乾隆帝聽說闖宮告知自己身世的於萬亭已經去世，不由得心中一寬，他又擔心隨同進宮的文泰來洩露隱事，便派御林軍佐領張召重率領八名大內侍衛，兜捕文泰來夫婦。張召重是武當派馬真、陸菲青的師弟。</p>\n<p class=\"content\">群雄大鬧鐵膽莊。</p>\n<p class=\"content\">《書劍恩仇錄》第2-4回：紅花會四當家文泰來在擺脫清廷鷹爪時身負重傷，一見如故的陸菲青推薦他夫婦去鐵膽莊周仲英處避難。周仲英的幼子不慎洩露行藏，文泰來被捕，周仲英惱怒之下，失手將幼子打死。紅花會群雄以為文泰來為鐵膽莊所出賣，在總舵主陳家洛率領下，大鬧鐵膽莊。弄清原委之後，雙方握手言和。周仲英見莊子已毀，攜女兒周綺，跟著紅花會去救文泰來。按：“秋風秋雨，時緊時緩，破窗中陣陣寒風吹進房來。”</p>\n<p class=\"content\">天山北路回族的聖物失而復得。</p>\n<p class=\"content\">《書劍恩仇錄》第4回：天山北路回族首領木卓倫，生有一子兩女，霍阿伊、霍青桐和喀絲麗（即香香公主）。部族有一部視為聖物的祖傳手抄《可蘭經》，被清朝派在天山北路督辦軍務的定邊將軍兆惠奪去。回人攔截押送聖物的鎮遠鏢局車隊，寡不敵眾。陳家洛仗義相助，奪回聖物，與“翠羽黃衫”霍青桐互生情愫，後見青桐與女扮男裝的李沅芷嬉鬧，遂生疑忌之心。霍青桐是“天山雙鷹”關明梅的徒弟。參見《清史稿·高宗本紀》：“乾隆二十二年，冬十月，辛未（十二），以兆惠為定邊將軍。……二十三年，春正月，庚寅（初三），命兆惠……徵回部。”</p>\n<p class=\"content\">紅花會徐天宏和鐵膽莊周綺喜訂終身。</p>\n<p class=\"content\">《書劍恩仇錄》第5-6回：徐天宏是紅花會七當家，外號“武諸葛”，周綺是鐵膽莊周仲英老英雄的愛女，外號“俏李逵”。兩人在黃河邊上與群豪走散，一路雖然鬥智鬥嘴，相互垂青之意卻是俱增。至潼關，合力救出周母，在陳家洛、周仲英的主持下，兩人訂下百年之好。按：“時方初秋，竟自飄下雪花。”</p>\n<p class=\"content\">八月十八，清朝乾隆帝、紅花會陳家洛兄弟相會。</p>\n<p class=\"content\">《書劍恩仇錄》第7-8回：陳家洛得悉四哥文泰來已被張召重秘密押往杭州，率領紅花會群雄直奔杭州。西湖賞月，陳家洛與化名東方耳的乾隆帝不期而遇。乾隆目睹這江湖第一幫會，不僅幫中高手如雲、領袖儒雅倜儻，而且根基之深、觸鬚之廣，已經直達八旗軍營，不由得膽戰心驚。陳家洛到海寧老家，與私下祭掃墳墓的乾隆再度相逢。陳家洛斷然拒絕乾隆要求他退出江湖，入朝為官的請求。雙方擊掌為誓，約定日後互不傷害。按：“八月十八，海潮最大。我母親恰好生於這一天，……所以我母親閨字潮生。”又按：乾隆在位期間，曾多次巡視江南。與小說內容最吻合的一次，應該是1762年。《清史稿·高宗本紀》乾隆二十七年：“三月甲午朔（初一），上奉皇太后臨幸杭州府。乙未（初二），上幸海寧閱海塘。”參見第8回：“乾隆點了點頭道，令尊有功於國家，我決不忍他墳墓為潮水所吞。轉頭向白振道，明日便傳諭河道總督高晉、巡撫莊有恭，即刻到海寧來，全力施工。”《清史稿·高宗本紀》：“乾隆十六年八月辛酉，以莊有恭為江蘇巡撫。……二十四年夏四月戊午，以莊有恭為浙江巡撫。……二十六年三月戊申，江南河道總督白鍾山卒，以高晉代之。……二十七年冬十月辛卯，調莊有恭為江蘇巡撫。”</p>\n<p class=\"content\">二十三，武當派張召重和八卦門王維揚兩虎相鬥。</p>\n<p class=\"content\">《書劍恩仇錄》第8-9回：綠林中有言道：“寧見閻王，莫碰老王；寧挨三槍，莫遇一張。”老王就是“威震河朔”王維揚，押送回部玉瓶的震遠鏢局總鏢頭；一張就是“火手判官”張召重，保護乾隆、看押文泰來的清廷御林軍佐領。紅花會七當家徐天宏，利用總舵主陳家洛與乾隆私生子福康安面貌酷肖的有利條件，設下“卞莊刺虎”之計，讓王維揚和張召重在獅子峰比武。王維揚元氣大傷，差一點被張召重活埋。張召重落入紅花會之手，武當派掌門師兄馬真求情，領走張召重。按：“今日是[八月]二十，那就約定二十三午時。”</p>\n<p class=\"content\">紅花會在六和塔囚禁乾隆帝。</p>\n<p class=\"content\">《書劍恩仇錄》第10-11回：掃清了張召重這一障礙，紅花會從李可秀的提督府救出四當家文泰來，進而乘勝追擊，借西湖花船點狀元之機，以名妓玉如意為誘餌活捉了乾隆帝，將其囚禁在六和塔中。陳家洛對這位同胞兄長動之以情，施之以威，訂下驅清復明大計。“天山雙鷹”陳正德、關明梅從內心不信任乾隆帝，不肯參加盟誓。</p>\n<p class=\"content\">九月，紅花會徐天宏和周綺的成親大喜。</p>\n<p class=\"content\">《書劍恩仇錄》第12回：“山上林木蔭森，此時已是深秋，萬竿翠竹之外，滿山紅葉，草色漸已枯黃。”</p>\n<p class=\"content\">十月，紅花會餘魚同在寶相寺出家為僧。</p>\n<p class=\"content\">《書劍恩仇錄》第12-13回：餘魚同是紅花會十四當家，多年來陷於對駱冰的暗戀而不能自拔。武當派陸菲青的女弟子李沅芷，對餘魚同一往情深。餘魚同與紅花會群雄走散，受到關東三魔和言伯乾的追蹤圍堵。言伯乾的雙目早先被餘魚同射瞎，關東三魔以為焦文期、閻氏兄弟也是紅花會所害，是以聯合尋仇。餘魚同數次陷入絕境，多虧李沅芷出手救助。餘魚同為情所苦，自覺對不起四哥文泰來，又辜負李沅芷的一片痴情，遂於寶相寺出家為僧。按：“一路向北，天時漸寒，時逢霜雪，已是初冬景象。”</p>\n<p class=\"content\">十一月，紅花會陳家洛回疆遇美女。</p>\n<p class=\"content\">《書劍恩仇錄》第13-14回：李沅芷救助餘魚同，用的是霍青桐名號，使的是陸菲青“金針”絕技，關東三魔斷定焦文期等兄弟是霍青桐所害，日夜兼程赴回疆尋仇。陳家洛獲悉後，單槍匹馬去回部報信，中途遇見霍青桐的妹妹喀絲麗，人稱香香公主，果真是美貌絕倫。陳家洛一見傾心，不能自已。按：“那少女回來對陳家洛說，滿洲兵已佔了阿克蘇和馬什，木卓倫老英雄他們已退到了葉爾羌，這裡去還有十多天路程呢。”《清史稿·高宗本紀》乾隆二十三年：“九月壬子（二十九），馬什城降。……冬十月丁卯（十四），兆惠自巴爾楚克進兵葉爾羌。……十一月丁酉（十四），兆惠至葉爾羌城外，陷賊圍中。”《中國通史》卷十：乾隆二十三年十月軍至葉爾羌。……十月十三日，兆惠留少數兵守黑水營，親率千餘騎自東向南，渡河取其牧群。誰知四百騎兵剛過去，橋就斷塌了。兆惠這才知道中了叛軍之計。……於是霍集佔派兵築長圍，妄圖困死清軍。兆惠率領人數很少的士卒同一萬多叛軍足足相持了三個月。</p>\n<p class=\"content\">武當派同門相殘，張召重殺師兄馬真。</p>\n<p class=\"content\">《書劍恩仇錄》第14回：武當派掌門人馬真道人，把師弟張召重從紅花會的掌握中解救出來。不料張召重功名利祿之心不死，重新接受乾隆旨意，要去回部找玉瓶上畫的絕色美女。馬真嚴詞阻止，張召重喪心病狂，竟然將師兄雙眼戳瞎。馬真撞牆而死。</p>\n<p class=\"content\">回部霍青桐力排眾議，大敗清軍主力。</p>\n<p class=\"content\">《書劍恩仇錄》第14-15回：陳家洛與香香公主相親相愛，霍青桐既高興又傷心。陳家洛和香香公主去兆惠營中下戰書，遇見來到回疆的張召重，陳家洛被清兵困於沙漠之中。回部上下都要霍青桐出兵援救，青桐強嚥失戀之苦，甘冒父兄之疑，忍辱負重運籌帷幄，調兵遣將出奇制勝，終於連打三個勝仗，殲滅清兵主力三萬餘人，繼而將兆惠的“黑水營”團團圍困。參見《清史稿·兆惠列傳》：“霍集佔既逼我師為長圍，相持數月。……迫歲暮，圍合已三月，軍中糧漸盡，士卒煮鞍革，甚或掠回民為食。”</p>\n<p class=\"content\">1759年　清乾隆二十四年（陳家洛26歲）</p>\n<p class=\"content\">二月十八，清朝富德率援兵至葉爾羌。</p>\n<p class=\"content\">《書劍恩仇錄》第15回：清廷接報兆惠在回疆遭圍困，急派將軍富德領兵前往援救。兆惠在軍中說：“富德將軍有一支兵東越戈壁而來，咱們只有向東南去和他會師。”“富德帶來的援兵，途中與兆惠及張召重相遇，得知清兵大軍覆沒，忙收集殘兵，向東撤退，哪知終於被霍青桐攔住。”“回人在黑水河英奇盤山腳大破清兵，再加圍困，達四月之久，史稱黑水營之圍。”參見《清史稿·高宗本紀》乾隆二十三年：“十一月庚戌（二十七），富德赴葉爾羌。”二十四年：“二月己巳（十八），富德至葉爾羌，會兆惠兵進攻。”</p>\n<p class=\"content\">天池怪俠袁士霄建沙城，掃除狼害。</p>\n<p class=\"content\">《書劍恩仇錄》第16-17回：霍青桐大敗清兵後傷心出走。陳家洛心存內疚，帶著香香公主一路追趕，先後遭遇狼群、張召重和關東三魔。正邪兩道聯手抗擊惡狼，險象環生。天池怪俠袁士霄為了替回民兄弟掃除狼害，花半年時間建一沙城，以駝馬將狼群引入城中，然後關門待其餓斃。眾人剛從狼群的威脅中解放出來，立即又分成冰炭不相容的黑白兩道。</p>\n<p class=\"content\">武當派張召重葬身狼腹。</p>\n<p class=\"content\">《書劍恩仇錄》第18-19回：“火手判官”張召重殘害掌門師兄馬真，激起群豪的極大憤慨。尤其是馬真的徒弟餘魚同，脫下袈裟誓報此不共戴天之仇。陳家洛運平生之技，加上在古洞裡新悟的武功，將張召重擊敗，投入沙城狼群。餘魚同師仇得報，接受了李沅芷的愛情。阿凡提告知周綺已有身孕，紅花會七當家徐天宏喜不自勝。按：至乾隆二十四年八月香香公主遇害，徐天宏的孩子剛出生一個月（第20回）。這一年閏六月，推知周綺懷孕，在乾隆二十三年十月間。徐天宏、周綺是在九月拜堂成親的。眼下徐天宏尚未察覺妻子有身孕，當是周綺尚未顯懷。</p>\n<p class=\"content\">初夏，紅花會陳家洛在福建莆田少林寺連闖五關。</p>\n<p class=\"content\">《書劍恩仇錄》第19回：陳家洛為了弄清義父於萬亭當年被逐出少林師門的真相，帶著紅花會群豪、陸菲青、周仲英等人來到福建莆田，在少林寺連闖五關，找到了義父當年的供詞和少林長老的批示，義父和生母徐氏的俠義情緣、乾隆帝和自己的血脈淵源，方始瞭然於胸。按：“回入嘉峪關後，天時漸暖，已有春意。……這時天已入夜，蟬聲甫歇，暑氣未消，他（文泰來）袒開胸口，拿著一柄大葵扇不住扇風。”</p>\n<p class=\"content\">七月，回部木卓倫、霍阿伊父子力戰而死。</p>\n<p class=\"content\">《書劍恩仇錄》第19回：清軍派來的富德援兵，與被圍的兆惠殘部內外夾擊。木卓倫老英雄和兒子霍阿伊力戰而死，回部全軍覆沒。據逃出來的回人說，那時霍青桐姑娘正在病中，不能指揮，戰敗後下落不明。參見《清史稿·高宗本紀》乾隆二十四年：“六月庚申（十一），命兆惠進兵喀什噶爾，富德進兵葉爾羌。……閏六月甲辰（二十六），霍集佔棄葉爾羌遁。……秋七月己酉朔（初一），兆惠等奏喀什噶爾、葉爾羌回眾迎降。……冬十月庚子（二十三），富德奏巴達克山素勒坦沙獻霍集佔首級，全部投誠。命宣諭中外。”按：木卓倫父子史無記載，是回民抗擊清兵的代表人物，其事蹟與回民英雄霍集佔相類。謹錄以備考。</p>\n<p class=\"content\">八月，回部香香公主在北京遇難。</p>\n<p class=\"content\">《書劍恩仇錄》第19-20回：乾隆殲滅回部反清勢力後，將香香公主擄到北京，欲佔為己有。香香公主抵死不從。乾隆無奈，請陳家洛從反清復明的大局出發，忍痛割愛。香香公主聽從了陳家洛的勸說，卻發現乾隆口是心非，意將反清幫派一網打盡。香香公主自殺示警，避免了紅花會群雄的滅頂之災。按：“乾隆道，去年八月間，我在海寧塘邊曾給你一塊佩玉，這玉你可帶在身邊？”據《雪山飛狐》第19回（1771年八月）：“陳家洛、霍青桐等紅花會群雄自回疆來到北京，卻為這日是香香公主逝世十年的忌辰，各人要到她墓上一祭。”十年之期雖然不確，八月之時誠是不虛。</p>\n<p class=\"content\">紅花會陳家洛率領群雄棲身回疆。</p>\n<p class=\"content\">《書劍恩仇錄》第20回：面對乾隆帝的反覆無常和陰險毒辣，眾英雄在北京城大開殺戒。紅花會十當家章進、天山雙鷹陳正德和關明梅陣亡，乾隆落入紅花會手中。霍青桐正要殺乾隆為回族父老報仇，福建藩臺方有德挾持了徐天宏剛出生才一個月的嬰兒威脅群雄。陳家洛不忍心無辜的嬰兒死於非命，決定綁架乾隆的私生子福康安，與乾隆約法三章，撤出京城。紅花會首領和各路英雄在祭奠香香公主以後，連騎向西而去。按：“這嬰兒還只有一個月大，憨憨地笑著，伸出小手，去摸按在他頸裡方有德那隻乾枯凸筋的大手。”這嬰兒生於今年七月。在二月時，周綺懷孕不久，所以連徐天宏這樣細心的丈夫也沒有察覺。</p>\n<p class=\"content\">1760年　清乾隆二十五年（陳家洛27歲）</p>\n<p class=\"content\">八月，紅花會釋放福康安。</p>\n<p class=\"content\">《書劍恩仇錄》第20回：乾隆帝在一年之中，做到了三件事：第一，撥庫銀重建少林寺；第二，放歸全部俘虜的回部男女；第三，沒有報復捕拿紅花會人眾。陳家洛兌現諾言，將乾隆的私生子福康安從回疆放回。按：“明年此日，我們見這三件事照辦無誤，就放福統領回來。”</p>"},{"title":"《飛狐外傳》故事編年（1766-1771）","content":"</a>\n<p class=\"sectionTitle\">《飛狐外傳》故事編年（1766-1771）</p>\n<p class=\"content\">【背景】公元18世紀60年代，緬甸入侵，乾隆帝數易雲南總督，領兵大舉反擊。大學士傅恆深入緬甸腹地，與緬帥議和後不久去世。70年代初，大小金川復叛，乾隆帝以阿桂為四川總督，領兵平叛。戶部侍郎福康安領隊去軍前授印，留在軍中效力，以軍功數獲擢升，出任正白旗滿洲都統，盛京將軍。</p>\n<p class=\"content\">【概要】江湖主要門派有胡家刀、苗家劍、天龍門、興漢丐幫、八卦門、太極門、藥王門和飛馬鏢局等。闖王李自成的四名護衛胡、苗、田、範，四家後代百餘年來相互仇殺，胡一刀之子胡斐在父母雙亡後流落江湖，十三歲與紅花會趙半山大鬧商家堡，十八歲大鬧天下掌門人大會，紅顏知己程靈素不幸中毒喪生。</p>\n<p class=\"content\">【紀年】據《雪山飛狐》，胡斐、苗人鳳比武在乾隆四十五年（1780），胡斐出生在二十七年之前（1753）。1766年，十三歲的胡斐路過商家堡，故事開始。十八歲那年（1771），胡斐參加天下掌門人大會，故事結束。</p>\n<p class=\"content\">1761年　清乾隆二十六年（胡斐8歲）</p>\n<p class=\"content\">八卦門“威震河朔”王維揚去世。</p>\n<p class=\"content\">《飛狐外傳》第3回：王維揚生前是鎮遠鏢局總鏢頭、八卦門掌門。王維揚的弟子商劍鳴八年前被胡一刀殺死。王維揚的兩個兒子，王劍英、王劍傑在朝廷當差，受福康安節制。王維揚享年七十二歲。按《書劍恩仇錄》第8回（1758年）：“威震河朔王維揚今年六十九歲，自三十歲起闖道走鏢。”《飛狐外傳》第3回（1766年）：“王劍英道：先父已去世五年了。”</p>\n<p class=\"content\">藥王門“毒手神梟”石萬嗔的雙目被師兄燻瞎。</p>\n<p class=\"content\">《飛狐外傳》第20回：毒手藥王和毒手神梟師兄弟數次鬥法，石萬嗔每一回均屈居下風，若不是一嗔大師始終念著同門之誼，手下留情，早已取了他的性命。在最後一次鬥毒之時，石萬嗔終於為“斷腸草”燻瞎了雙目，逃往緬甸野人山。一嗔大師在此役之後更名為“偶嗔”。按（1771年）：“石萬嗔在野人山中花了十年功夫，才勉強治癒傷目，回到中原時聽到無嗔大師的死訊。”</p>\n<p class=\"content\">1762年　清乾隆二十七年（胡斐9歲）</p>\n<p class=\"content\">藥王門“毒手藥王”偶嗔收程靈素為徒。</p>\n<p class=\"content\">《飛狐外傳》第10回：毒手藥王偶嗔有三個徒弟：慕容景嶽、姜鐵山和薛鵲。收了薛鵲後，本來不想再收徒兒了，但見三位弟子為了愛恨情仇鬧得太不像話，只怕他百年之後無人制得他們，三人為非作歹，更要肆無忌憚，害人不淺，因此到得晚年，又收了程靈素這個幼徒。按第11回：“他老人家收我做徒弟的時候，法名叫做偶嗔。”程靈素投師的確切時間已不可考，既然說是幼徒，應當是十歲之前吧。小說裡靈素八歲時把媽媽的鏡子丟到井裡（第12回），又說靈素在爹媽去世後拜藥王為師（第9回），我們大致可確定她是在八至十歲時投師的。程靈素出生之年約在1754年，因此投師時間在1762-1764年。</p>\n<p class=\"content\">1763年　清乾隆二十八年（胡斐10歲）</p>\n<p class=\"content\">春，苗家劍苗人鳳雪天救南蘭。</p>\n<p class=\"content\">《飛狐外傳》第2回：江南官員南仁通調補京官，攜女兒南蘭進京，隨身攜帶的“冷月寶刀”，引來蔣調侯等五名江湖豪客的跟蹤和圍攻。“金面佛”苗人鳳去滄州察看亡友胡一刀夫婦墓前的殘破之處是否已經修好，目睹了豪客們殺害南仁通，劫刀又劫色的殘暴行徑，奮神威殺死五名豪客，救出孤女南蘭。不料那位妝成腳伕的豪客，是鄂北鬼見愁鍾氏三兄弟的徒弟。鍾氏三兄弟圍攻苗人鳳，差一點將苗人鳳燒死在客店之中。按：小說裡記“十年前的臘月，他與遼東大俠胡一刀在滄州比武，……苗人鳳為了此事，十年來始終耿耿於懷，鬱鬱寡歡。……胡一刀夫婦逝世十年之期將屆。”苗胡比武在1753年。又按1766年：“苗人鳳望著懷裡幼女那甜美文秀的小臉，腦海中出現了三年多前的往事。這件事已過了三年多，但就像是剛過了三天一般。……苗人鳳全身的血在沸騰，他的心要給女兒叫得碎了。三年多前，滄州雪地裡的事又湧上心頭。”</p>\n<p class=\"content\">存疑：“時近歲晚，道上行人稀少。”苗若蘭比胡斐小十歲，出生也在今年。可以確定，苗人鳳救南蘭是在春天，南蘭生苗若蘭是在冬天。</p>\n<p class=\"content\">苗家劍苗人鳳埋刀胡一刀墓前。</p>\n<p class=\"content\">《飛狐外傳》第2回：苗人鳳在救南蘭時，雙腿中毒不能動彈。到腿上傷愈之後，他與南蘭小姐結成夫妻。新婚燕爾，苗人鳳帶著嬌妻拜祭胡一刀夫婦之墓，並將那把“冷月寶刀”埋在胡一刀墓前。正是這一次，苗人鳳對胡夫人的讚美，使南蘭黯然神傷，造成了夫妻間永難彌合的裂痕。按：“在胡一刀墓前，他把當年這場比武與誤傷的經過說給妻子聽，……這件事在他心中鬱積了十年。”</p>\n<p class=\"content\">冬，苗家劍苗人鳳之女若蘭出生。</p>\n<p class=\"content\">《飛狐外傳》第2回：女兒若蘭出世了，像母親一般的美麗，像母親一般的嬌嫩，夫妻間的感情也加深了一層。按：苗若蘭比胡斐小十歲。《雪山飛狐》第5回：“其實他已是個二十七歲的男子，比自己還大著十歲。”第6回：“胡斐比她大了十歲，閱歷又多，知道眼前之事幹系不小。”又按《飛狐外傳》第1回（1766年）：“打開包裹，裡面包著個女孩，約莫兩三歲年紀，雙頰通紅，閉著雙眼。”第8回（1771年）：“胡斐雖與他一見心折，……雙手接過女孩，見她約莫七八歲年紀，生得甚是嬌小。”《雪山飛狐》第3回1780年：“苗姑娘約莫十七八歲年紀，她說那是她出世之前十年的事（1753年胡斐出生），正是二十七年之前。”“那是在我出世之前十年的事，不知那個可憐的孩子怎樣了，我真盼望他好好活著。”</p>\n<p class=\"content\">1766年　清乾隆三十一年（胡斐13歲）</p>\n<p class=\"content\">春，太極門北宗同門相殘。</p>\n<p class=\"content\">《飛狐外傳》第4回：太極門分南北兩宗，南宗溫州太極門以紅花會三當家趙半山為代表，北宗廣平太極門孫掌門有三個弟子，孫剛峰、陳禹之父、呂希賢。孫剛峰繼任掌門，陳禹之父逝世得早，陳禹和師叔呂希賢在北京定王府當差。呂希賢是定王府教師爺，遵守門規不肯將本門秘奧亂環訣、陰陽訣傳於定王爺。陳禹奉王爺之命到呂希賢家中追問，一言不和，竟將師叔呂希賢和他的兒子殺死。掌門人孫剛峰自知無力清理門戶，便砍下自己左手，蘸寫血書，讓呂希賢十一二歲的女兒呂小妹前往回疆，請南宗高手趙半山主持公道。趙半山接信後，趕到廣平和北京，方知陳禹已經投身福王府，隨侍福康安南下，便帶著呂小妹一路追去。</p>\n<p class=\"content\">天龍門田歸農勾引苗夫人南蘭私奔。</p>\n<p class=\"content\">《飛狐外傳》第2回：苗夫人南蘭嫌丈夫不夠溫柔體貼，終日鬱郁不歡。英俊瀟灑的天龍門田歸農來苗家做客。為得到苗家世傳的藏寶圖，田歸農勾引南蘭。南蘭拋夫棄女，隨其私奔。按《雪山飛狐》第10回：“那時我還只三歲，爹抱了我連夜追趕，他不吃飯不睡覺，連追三日三夜，終於趕上了他們。”</p>\n<p class=\"content\">少年遊俠胡斐棲身商家堡。</p>\n<p class=\"content\">《飛狐外傳》第1-3回：商家堡主人商劍鳴，十三年前的冬天為胡一刀所殺。孤孀商老太帶著兒子商寶震日夜練武，誓報殺夫之仇。飛馬鏢局總鏢頭馬行空，帶著女兒馬春花和徒弟徐錚，押送三十萬兩鏢銀路過商家堡，遭遇已淪為綠林劫盜的跌打醫生閻基。天龍門田歸農拐著南蘭私奔，恰好經過此處，也對三十萬兩鏢銀起了垂涎之心。金面佛苗人鳳抱著女兒，終於在這裡追上了私奔的妻子。夫呼女喚，南蘭不為所動，苗人鳳黯然離去。跟著平阿四在商家堡避雨的胡斐，是年十三歲，怒斥南蘭無情無義。南蘭無地自容，與田歸農離開商家堡。主人商老太太與劫盜閻基鬥智鬥勇，迫使閻基削髮為僧，退出綠林，成為“寶樹”和尚。馬行空留在商家養傷，平阿四和胡斐從此在商家打雜為生。按：“閻基笑道，十三年前滄州府，小的曾服侍過你老（田歸農）。”</p>\n<p class=\"content\">胡斐今年十三歲。第1回：“另一個是個十二三歲的男孩，黃黃瘦瘦。”第3回：“胡斐這時才十三歲，全不識男女之意，但情竇初開，已知欣賞女子和美色。”第4回：“千手如來趙半山在江湖上是何等的威名，何等的身手，今日竟要與一個十二三歲的小孩義結金蘭，實是事非尋常。”第12回：“我初識馬姑娘之時，是個十三四歲的拖鼻涕小廝。”第13回：“當年兩人相見時，胡斐是個十三四歲的孩子，這時身量一高相貌也變了，哪裡還認得出來。”</p>\n<p class=\"content\">冬，清朝大臣福康安與飛馬鏢局馬春花的露水姻緣。</p>\n<p class=\"content\">《飛狐外傳》第3回：飛馬鏢局總鏢頭馬行空在商家堡養傷，少主人商寶震看上了他的女兒馬春花。商老太認為當年丈夫被胡一刀所害，是因為之前不久，丈夫和馬行空相鬥傷了元氣，因此要向馬氏父女尋仇。馬行空擔心女兒受辱，匆匆忙忙將女兒許配給徒弟徐錚。正好清廷大官福康安領人經過商家堡，馬春花情不自禁，在父親將她終身許配給師哥的第二天，竟做了福康安的情婦。按：“這樣過了七八個月，馬行空的傷早就痊癒了。……馬春花嬌憨活潑，明豔動人，在商家堡這麼八個月一住，商寶震和她日日相見，竟叫他一縷情絲，牢牢地縛在這位姑娘身上。”福康安與陳家洛同年，今年三十三歲。第3回：“居中一位青年公子面目清秀，丰神俊朗，容止都雅，約莫三十二三歲年紀。”馬春花十八歲。第3回：“馬春花青春美豔，十八九歲年紀，身材豐滿，皮膚白晳，雖非絕色美女，但豔麗非凡。”</p>\n<p class=\"content\">紅花會趙半山和少年遊俠胡斐結為兄弟，聯手大鬧商家堡。</p>\n<p class=\"content\">《飛狐外傳》第3-4回：福康安是乾隆的私生子。隨身侍衛的大內高手中，有八卦門“威震河朔”王維揚的兩個兒子，王劍英和王劍傑，有太極門北宗害死師叔的陳禹。紅花會三當家趙半山受人之託，攜著孤女呂小妹萬里追蹤陳禹，來到商家堡。此時商老太已知悉胡斐就是殺夫仇人胡一刀的兒子，她與丈夫的兩個八卦門師弟聯手，欲除掉胡斐為丈夫報仇，卻遭到趙半山的阻撓。商老太急怒攻心，將趙半山、胡斐、王氏兄弟、陳禹一干人眾困在商家特製的鐵廳之中，四周加以烈火燒烤。胡斐從狗洞鑽出，救眾人脫離險境。馬行空、商老太、陳禹葬身火海。趙半山和胡斐結為兄弟，並授予武學要訣。</p>\n<p class=\"content\">1767年　清乾隆三十二年（胡斐14歲）</p>\n<p class=\"content\">秋，飛馬鏢局馬春花生一對孿生兒子。</p>\n<p class=\"content\">《飛狐外傳》第12回：馬行空死後，徐錚和馬春花不久成婚，兩人接掌飛馬鏢局。馬春花在成婚之時，因與福康安的露水姻緣已然懷孕。次年產下孿生兒子，雪白可愛。</p>\n<p class=\"content\">1768年　清乾隆三十三年（胡斐15歲）</p>\n<p class=\"content\">藥王門“毒手藥王”偶嗔更名為“無嗔”。</p>\n<p class=\"content\">《飛狐外傳》第11回：毒手藥王本名大嗔，隨著心性修養，先後更名一嗔、偶嗔，今更名為無嗔。慕容景嶽、姜鐵山、薛鵲三名弟子依然勾心鬥角，關門弟子程靈素聰明和順。無嗔大師晚年深悔一生用毒太多，潛心著述《無嗔醫藥錄》，乃是一部濟世救人的醫書藥書。按（1771年）：“三年之前，他老人家改做了無嗔。”</p>\n<p class=\"content\">1770年　清乾隆三十五年（胡斐17歲）</p>\n<p class=\"content\">苗家劍苗人鳳向女兒細述苗、胡兩家的恩仇。</p>\n<p class=\"content\">《雪山飛狐》第3回：“苗若蘭眼望火盆，說道，在我七歲那一年，有一晚見爹爹磨洗長劍，我說我怕刀劍，要爹爹收起了別玩。爹說這柄劍還得殺一個人，才能收起永遠不用。我摟住他頭頸，求他不要殺人，他就跟我說了一個故事。”第10回：“苗若蘭輕聲道，十年之前，那時候我還只七歲，我聽爹爹說你爹媽之事，心中就儘想著你。我對自己說，若是那個可憐的孩子活在世上，我要照看他一生一世，要叫他快快活活，忘了小時候別人怎樣欺侮他、虧待他。”</p>\n<p class=\"content\">1771年　清乾隆三十六年（胡斐18歲）</p>\n<p class=\"content\">五月，清朝大臣福康安籌備召開天下掌門人大會。</p>\n<p class=\"content\">《飛狐外傳》第14回：清朝大臣福康安知道今年是香香公主逝世十[二]週年，料得今年秋冬之交，紅花會群雄要上北京來，便以召開天下掌門人大會的名義，先行召集各省武林好手。福康安從十[二]年前被紅花會囚禁，吃了那個大苦頭之後，才知他手下兵馬雖多，卻不足以與武林豪傑對抗。按第15回（八月）：“打從三個月前，咱們在西京便接到福大帥從北京傳來的通知，要咱們華拳門在八月中秋趕到京城，參與天下掌門人大會。”</p>\n<p class=\"content\">今年是乾隆三十六年。一、上距胡斐出生十八年。第9回：“在十八年之前，胡斐生下還只一天，苗人鳳在河北滄州的小客店中也曾見過他。……苗人鳳卻哪裡知道，十八年前那個初生嬰兒，便是今日這個不識面的少年英雄。”二、上距苗人鳳雪天救南蘭八年。第8回：“鍾氏三雄……八年前敗於苗人鳳手下，引為奇恥大辱，……八年苦練，武功大進。”“那時你腿上受傷，我三兄弟仍非敵手，心中不服，苦練了八年武功之後，今日再來討教。”“我兄弟苦練八年，武功也沒什麼長進。”三、上距馬春花生孿生子四年。第12回：“兩個男孩四歲左右，卻雪白可愛，兩人相貌一模一樣，顯是一對孿生兄弟。”</p>\n<p class=\"content\">存疑：有金學迷認為今年是乾隆三十四年，上距紅花會大鬧紫禁城十年。第17回：“自從十年前武當派掌門人馬真逝世，武當高手火手判官張召重又死在回疆，沒聽說武當派立了誰做掌門人啊。”第19回：“福康安十年前曾為紅花會群雄所擒，大受折辱。”且存疑待考。</p>\n<p class=\"content\">六月，少年遊俠胡斐追殺五虎派鳳天南。</p>\n<p class=\"content\">《飛狐外傳》第5-7回：鳳天南是廣東佛山鎮的惡霸，為了霸佔貧農鍾阿四的菜田，誣指其子偷吃鳳家的家鵝，逼得鍾妻在北帝廟將兒子剖腹以證清白。十八歲的“雪山飛狐”胡斐聞說此事，怒不可遏，將鳳天南之子鳳一鳴擒至北帝廟，逼鳳天南出面。胡斐正要下手為鍾家報仇，一紫衣姑娘施“調虎離山”之計，使鳳氏父子死裡逃生。紫衣姑娘就是當年鳳天南強姦銀姑所生之女，十七年前在母親自盡後隨師父去回疆學藝，今年回中原為母報仇。袁紫衣念父女之情，要救鳳天南三次性命。此後胡斐有三次殺死鳳天南的機會，都因袁紫衣的干擾而未能得手。按：“福大帥主持的掌門人大會，定在八月中秋，還有兩個月時光，貴門須得及早為計才好。”</p>\n<p class=\"content\">藥王門“毒手藥王”石無嗔去世，“毒手神梟”石萬嗔重返中原。</p>\n<p class=\"content\">第8-10回：毒手藥王無嗔大師去世，遺給關門弟子程靈素一部濟世救人的醫書《藥王神篇》。其師弟石萬嗔，在緬甸野人山中花了十年功夫，勉強治癒雙目，回到中原要尋無嗔報仇，卻聽到無嗔的死訊。他回到中原做的第一件壞事，就是把斷腸草給了天龍門田歸農。田歸農派人送毒信，毒瞎了苗人鳳的雙眼。胡斐痛悔不明真相，出於對苗人鳳的敬佩而暗中保護送信人，釀成此禍。胡斐去求助毒手藥王，得到藥王高足程靈素的芳心。程靈素至苗家為大俠治眼。毒手神梟石萬嗔無法向師兄報仇，便遷怒於師兄的門人，慕容景嶽、薛鵲二位背師事仇，改換門庭，拜萬嗔為師。薛鵲夥同慕容景嶽，害死丈夫姜鐵山、兒子姜小鐵，兩人結為夫妻，轉而再引萬嗔去襲擊小師妹程靈素，意欲奪取《藥王神篇》。</p>\n<p class=\"content\">程靈素今年十七歲。第9回：“她相貌似乎已有十六七歲。身形卻如是個十四五歲的幼女，但見她拔草理花時手腳利落。”第17回：“程靈素卻扮成箇中年婦人，弓背彎腰，滿臉皺紋，……誰又瞧得出她是個十七八歲的大姑娘？”第20回：“石萬嗔……聽說程靈素只不過是個十七八歲的姑娘，更是毫沒放在心上。”</p>\n<p class=\"content\">程靈素比胡斐略小，胡斐稱程靈素為二妹。第10回：“胡斐望著她似乎弱不禁風的身子，好生慚愧，她年紀還小我一兩歲，但這般智計百出，我枉然自負聰明，又怎及得上她半分？”第20回：“程靈素道，你爹爹媽媽（胡一刀夫婦）去世之時，我尚未出生。”胡一刀夫婦去世在1753年十二月，程靈素出生於次年。</p>\n<p class=\"content\">程靈素比袁紫衣還要小一點，今年至多十七歲。第14回：“袁紫衣取手帕抹了抹眼角，微微一笑，道，你叫我姊姊，該當把解藥給我服了吧？……袁紫衣道，程家妹子，你在那單刀之上，為何不下致命的毒藥？”</p>\n<p class=\"content\">七月，清朝大臣福康安派人接回馬春花和兩個孩子。</p>\n<p class=\"content\">《飛狐外傳》第11-13回：馬春花與師哥徐錚成婚後，帶著福康安的兩個孩子在江湖上艱難度日。徐錚接掌飛馬鏢局，三四年中連碰了幾次釘子。福康安在朝中官運亨通，成為乾隆第一信用之人，卻因膝下無子，輾轉打聽到馬春花生的孿生兒子，正是當年與自己露水姻緣結的果，便派大內高手去接兩個孩子。這幾年一直牽掛著馬春花的八卦門商寶震，趁火打劫殺死徐錚。馬春花手刃殺夫仇人，隨大內高手進京去和福康安相會。按第15回（八月）：“福康安笑道，這兩個孩兒的事，也是直到上個月才知道的。”</p>\n<p class=\"content\">考清朝傅恆父子五人。</p>\n<p class=\"content\">1.傅恆</p>\n<p class=\"content\">《飛狐外傳》第15回：“福康安的父親傅恆，是當今乾隆之後孝賢皇后的親弟。傅恆的妻子是滿洲出名的美女，入宮朝見之時給乾隆看中了，兩人有了私情，生下的孩子便是福康安。傅恆由於姊姊、妻子、兒子三重關係，成為乾隆的親信，出將入相，一共做了二十三年太平宰相，此時（乾隆三十六年）已經逝世。”《清史稿·傅恆列傳》：“傅恆，字春和，滿洲鑲黃旗人，孝賢純皇后弟也。……乾隆十年六月，命在軍機處行走。十二年，擢戶部尚書。……三十四年七月，卒，上親臨其第酹酒，命喪葬視宗師鎮國公，諡文忠。……傅恆直軍機處二十三年，日侍左右，以勤慎得上眷。”《清史稿·后妃傳》：“高宗孝賢純皇后，富察氏。察哈爾總管李榮保女。高宗為皇子，雍正五年，世宗冊後為嫡福晉。乾隆二年，冊為皇后。”</p>\n<p class=\"content\">2.長子福靈安</p>\n<p class=\"content\">《飛狐外傳》第15回：“傅恆共有四子。長子福靈安，封多羅額駙，曾隨兆惠出征回疆有功，升為正白旗滿洲副都統，已死。”《清史稿·傅恆列傳》：“福靈安，多羅額駙，授侍衛。準噶爾之役，從將軍兆惠戰於葉爾羌，有功，予雲騎尉世職。[乾隆]三十二年，授正白旗滿洲副都統。署雲南永北鎮總兵。卒。”</p>\n<p class=\"content\">3.次子福隆安</p>\n<p class=\"content\">《飛狐外傳》第15回：“次子福隆安，封和碩額駙，做過兵部尚書和工部尚書，封公爵。”《清史稿·傅恆列傳》：“福隆安，尚高宗女和嘉公主，授和碩額駙、御前侍衛。[乾隆]三十三年，擢兵部尚書、軍機處行走，移工部尚書。三十五年，襲一等忠勇公。……四十九年，卒，諡勤恪。”《清史稿·后妃傳》：“純惠皇貴妃，蘇佳氏。事高宗潛邸，即位，封純嬪。……子一，永瑢；女一，下嫁福隆安。”</p>\n<p class=\"content\">4.三子福康安</p>\n<p class=\"content\">《飛狐外傳》第15回：“第三子便是福康安，……這時他身任兵部尚書，總管內務府大臣，加太子太保銜。”第13回：“那正是平金川大帥，做過正白旗滿洲都統、盛京將軍、雲貴總督、四川總督，現任太子太保、兵部尚書、總管內務府大臣的福公子、福大帥。”《清史稿·福康安列傳》：“福康安，字瑤林，富察氏，滿洲鑲黃旗人，大學士傅恆子也。”《清史稿·高宗本紀》乾隆三十七年：“五月壬寅（初八），命戶部侍郎福康安在軍機處行走。十二月癸酉（十三），福康安為領隊大臣（福康安列傳：王師徵金川，以溫福為定邊將軍，阿桂、豐升額為副將軍，高宗命福康安齊印往授之，即授領隊大臣。乾隆三十八年夏，至軍，阿桂方攻當噶爾拉山，留福康安自佐。四十一年，授正白旗滿洲都統，出為吉林、盛京將軍）”；四十五年：
