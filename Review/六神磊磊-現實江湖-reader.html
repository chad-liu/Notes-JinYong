<script>

const chapters = [{"title":"序言 你我皆凡人","content":"<h1 id=\"sigil_toc_id_2\"><span><span>序言  你我皆凡人</span></span></h1>\n<p><span>我常常想，如果我們生在武俠小說裡，在那個叢林法則盛行的世界長大，最終會成長為一個什麼樣的角色？</span></p>\n<p><span>郭靖？令狐沖？胡一刀？且慢說這些讓人肅然起敬的名字。現實可能有些無奈。</span></p>\n<p><span>試想我們一頭扎進那個世界的底層。由於事先不可能讀過原著，我們將不會知道那些概率極低的升級攻略，例如某月某日，你必須趕到張家口，且一定要善待一個貧嘴的小叫花子；某月某日，你必須在樹林裡準時燒一隻雞，以便引來路過的洪七公。</span></p>\n<p><span>我們中的絕大多數人，都難以進入江湖上那些頂尖的大公司，比如少林公司、武當公司、全真公司。事實上，能有幸進入「秦家寨」這樣的區域性大企業，學上一門「五虎斷門刀」之類的技能，都已值得同齡人豔羨。</span></p>\n<p><span>但那又怎樣？有一位叫包不同的先生，給這家公司的員工下了令人沮喪的斷語：「再練三十年，也不配慕容公子去砍他一刀。再練一百二十年，慕容公子也不屑去砍他四刀。」</span></p>\n<p><span>什麼？想攜書彈劍縱橫四海，「與河朔群雄爭鋒」「殺盡仇寇、敗盡英雄」？那是創業明星獨孤求敗。你我的真實狀況是，縱使豪富如福威鏢局，也必須到處求人，連青城公司忽然肯收禮物了都欣喜不已。</span></p>\n<p><span>就算人品爆發，進入了少林武當這樣的偉大公司，是否意味著我們能取得輝煌成就？現實仍然很殘酷。少林公司的技術部門高管澄觀老和尚曾經詳解過這條升遷之路，那簡直是一條以磨耗人生為代價的血淚之路——</span></p>\n<p><span>「入門之後先學少林長拳，熟習之後，再學羅漢拳，然後學伏虎拳，內功外功有相當根底了，可以學韋陀掌……聰明勤力的，學七八年也差不多了。如果悟性高，可以跟著學散花掌……」</span></p>\n<p><span>想要在少林公司躋身高管，大致要修完「一指禪」的學分，那至少要花四五十年，還必須天賦極高、玩命加班才行。按照澄觀先生的說法，多數人是無望的，「我看還是專門念「金剛經」參禪的為是」。</span></p>\n<p><span>什麼？你初入江湖便得遇名師？那不過是「黃河四鬼」耳；你際遇更加不凡，師祖爺是當代頂尖人物？那不過是「藏邊五醜」耳；你勤奮苦練半生，武功有成，終於稱霸一州一縣？那也不過是「江南七怪」耳。</span></p>\n<p><span>例如我自己，要是身在江湖，大俠、中俠、小俠怕都是做不了的，自問要麼是壽南山之類的角色，貪生怕死，萬壽無疆；要麼是司徒千鍾這樣的角色，愛說三道四，嘴上兜不住風，被人一怒之下碾壓。</span></p>\n<p><span>在感情問題上，你大概不很滿足於和完顏萍結廬在人境？大概不太情願和耶律燕攜手闖江湖？你挑剔陸無雙太橫、水笙有點黑、符敏儀年紀稍大？你常常覺得令狐沖不體貼、韋爵爺花心、陳家洛龜毛？卻不知假使你我身在江湖，武修文、陶子安怕已經是人所仰望的高富帥，而洪凌波、貝錦儀亦是高不可攀的女神。</span></p>\n<p><span>我們何幸自己是讀者，不是俠客；何幸自己不必親歷江湖、刀頭舐血，而是由大師們書就武林青史卷冊，送到你我手中。當身畔錦幄初溫、獸煙不斷，我們捧著書高高在上、指指戳戳：何不早除陳友諒！何不早除風際中！多麼酣暢任性。</span></p>\n<p><span>今天這本書裡收錄的，就是我一年多來陸續寫就的「指指戳戳」的文章。我自知這是在用凡人膚淺的目光來度量英雄，例如抱憾於王重陽和林朝英的不會戀愛，但或許在他們的眼中，俗世的情侶關係並不值一哂；又例如感傷於殷素素太快被江湖忘記，也許在殷小姐看來，碌碌庸眾的懷念毫無價值。</span></p>\n<p><span>一千一百多年前的李商隱說：「不知腐鼠成滋味,猜意鵷雛竟未休。」我把它當成是給這本書的題語。但話說回來，嘁嘁喳喳、品評豪傑，不正是專屬於你我凡人的樂趣嗎？</span></p>\n<p>六神磊磊<br/>\n  2015.3.25</p>"},{"title":"人間鐵","content":"<h1 id=\"sigil_toc_id_3\"><span><span>人間鐵</span></span></h1>\n<p><span>鑄就而今相思錯，料當初、費盡人間鐵。</span></p>"},{"title":"王重陽和林朝英：他們還以為自己在談戀愛","content":"<h2 id=\"sigil_toc_id_4\"><span>王重陽和林朝英：他們還以為自己在談戀愛</span></h2>\n<p><span><span>他們像網友一樣互相頂著帖，還以為自己在談戀愛。</span></span></p>\n<p>王重陽和林朝英，是一對神仙眷屬。和這一對相比，江湖上其他的幾對所謂「神仙眷屬」都統統差了點意思。</p>\n<p>袁士霄和關明梅顯得比較「遜」；無崖子和李秋水顯得比較「淫」；楊過和小龍女離經叛道，顯得不如王林兩人「正」；郭靖和黃蓉則顯得比較世俗，仙氣兒不夠。黃藥師和馮衡這一對本來挺討人喜歡，但是金庸後來改了書，安排黃老邪去暗戀梅超風，意境大跌。至於歐陽鋒和他嫂子……咱們可以不提那一出嗎？</p>\n<p>綜上，王重陽和林朝英，簡直是天造地設、組織贊成、群眾擁護、形勢需要的一對革命夫妻。傲嬌如黃藥師，在評點二人時說的是「二仙此相遇」，如此不吝溢美之辭。然而結果大家都知道：這兩人沒有在一塊。</p>\n<p>於是問題就來了：為什麼？</p>\n<p>金庸對此先後給出過兩種解釋。第一種解釋最深入人心，說這兩個人「爭競之心」太重，互相不服氣，死掐了一輩子。用原文說就是：「二人武功既高，自負益甚，每當情苗漸茁，談論武學時的爭競便隨伴而生，始終互不相下。」意思是說，這兩人都是頂尖的奧林匹克運動員，只知道「更高、更快、更強」，不懂得「友誼第一，比賽第二」，所以關係處不好。</p>\n<p>這個解釋，似是而非。江湖上互相競爭的夫妻有的是。比如胡青牛和王難姑，兩人一個是「毒仙」，一個是「醫仙」，慘烈地互掐了幾十年，都想要壓倒對方，一直鬧到死才作罷。他們的「爭競之心」比林、王豈非有過之而無不及？但是卻不影響他們結婚做夫妻。</p>\n<p>此外，王重陽真的是對林朝英一點都不相讓嗎？翻翻原著，其實未必。《神鵰俠侶》上借丘處機的話說，王重陽對林朝英「知她原是一番美意，自是一路忍讓」「先師不出重手，始終難分勝敗」「決意不論比什麼都輸給她便是」。由此看來，他和林朝英打架，其實從頭到尾都在讓。</p>\n<p>第二種解釋，是說兩個人「礙於禮教」，不能在一起。原著中楊過說：「當年重陽先師和我古墓派祖師婆婆原該好好結為夫妻，不知為了什麼勞什子古怪禮教，弄得各自遺恨而終。」</p>\n<p>楊過這種說法，沒有證據，多半出於私心——明明是他自己要搞師徒戀，卻去附會古人，到重陽祖師的身上找合法性。王林二人既非師徒，又沒有什麼親緣關係，他們想要結合並沒有任何禮教上的妨礙。</p>\n<p>事實上，這兩個人鴛盟難偕，另有其問題：王重陽和林朝英的關係不像朋友，倒像是網友——平時交流挺多，互相之間也寫了好多信，「英妹」「英妹」地亂叫，但一見面就尷尬，找不到共同話題，只好講論武功。</p>\n<p>這兩人的互動方式，也很類似於網友——今天我發帖、你頂帖，明天你發帖、我頂帖，看似朋友圈裡熱火朝天，關係卻沒有實質性進展。</p>\n<p>比如原著中，王重陽給林朝英寫信，絮絮叨叨地只是講自己帶兵抗金的戰況，等於是在朋友圈發帖「坑爹啊，今天金兵好猛」，林則回帖「喆哥贊」；下一次林朝英跑到古墓叫陣，也等於是發了個帖「哈哈，我武功天下第一」，王於是又積極回帖「嘿嘿我不信」。</p>\n<p>他們無休止的「爭勝負」「拼輸贏」，只是表面現象。我不認為兩人真的這麼在乎勝負。誰高誰下，雙方心裡不都明鏡一樣嗎——原著上說，王重陽「自料武功稍高她一籌」，林朝英也知道他「並非存心和我相鬥」。可是不鬥又怎麼辦呢？畢竟除了戀愛關係，「纏鬥」好歹也算是種親密關係啊！</p>\n<p>王重陽和林朝英的真正問題，在於不會談戀愛。</p>\n<p>戀愛和輕功、暗器一樣，也是一門需要先天稟賦和後天學習的技術活。張翠山不會談戀愛，但是幸虧殷素素會，所以做成了夫妻；而王重陽、林朝英兩人都不會，作為一派宗師，他們又沒有父母之命、媒妁之言當橋板，所以問題就大了。</p>\n<p>他們都是文武全才，王重陽甚至連工程建築都懂，古墓的圖紙都是他畫的；林朝英也一樣，你看玉女劍法裡，她會的東西真是太多了：「小園藝菊」「撫琴按簫」「松下對弈」「錦筆生花」……這樣的兩個人，怎麼肯暴露自己不會談戀愛呢？</p>\n<p>一個人越是優秀、越全能，萬一碰到某個自己不會的領域，就越是寧死也不肯碰。</p>\n<p>於是他們互相寫了那麼多封親熱的信，卻「沒一句涉及兒女私情」。他們都努力裝作「只要我願意，隨時可以談私情」，就像兩隻強壯的旱鴨子在泳池邊上淡定地比畫、熱身，聊天氣，聊美食，卻誰也不肯下水。</p>\n<p>他們上演了一幕幕類似「給女神吭哧吭哧修電腦，修完水也不喝就回家」的拙劣對手戲。林朝英聲稱自己看中了古墓，說：喆哥，我覺得你的房子真好。王重陽馬上回答：好呀，我搬出來給你住。過了幾天王重陽跑來說：英妹，我發現有一種石床對你的身體很好。林朝英說：好呀好呀我要！結果王重陽辛辛苦苦地給她打了張「寒玉」牌單人床。</p>\n<p>他們就這樣不鹹不淡地互相頂著帖，揮霍著年華歲月，還以為這就算是在談戀愛。</p>\n<p>最後，林朝英孤獨地老了，死了。王重陽跑到古墓，熟視故人遺容，「痛哭了一場」。</p>\n<p>然後呢？給她作上一篇女兒誄？或者像段正淳一樣殉情？那是你們想多了。他的做法是——吭哧吭哧地把一篇武功刻在人家牆上，還非常呆氣地留了一行字：</p>\n<p>「玉女心經，技壓全真，重陽一生，不弱於人。」</p>\n<p>有人或者會說：瞧，你還說他倆不是爭勝！都人鬼殊途了，他還一心想著比武呢！</p>\n<p>然而再仔細想想，那是爭勝嗎？那隻不過是王重陽又重複了一遍自己唯一會做的事，他又更新了一條朋友圈：「妹子，還是我武功高嘛。」然後得意揚揚地圈給了林朝英。</p>\n<p>他都這麼老了，但戀愛的技術仍然停留在小男孩階段：不知道怎麼接近心儀的小姑娘，於是挑釁她，拉她辮子，換來她的憤怒迴應，然後沾沾自喜。</p>\n<p>不同的是，這一次，林朝英再也不會回帖，也不會點讚了。他們朋友圈裡的更新，永遠停留在了這一年的這一天。</p>\n<p>你也很體面，我也很體面，但是我們的愛情，只收獲了一個永遠寂靜的朋友圈。</p>"},{"title":"程靈素之殤：她唯獨在愛情上放棄了進攻","content":"<h2 id=\"sigil_toc_id_5\"><span>程靈素之殤：她唯獨在愛情上放棄了進攻</span></h2>\n<p><span><span>一個鄉下丫頭面對闊氣小姐，敢比學習成績、敢比工作業績，但一說到面對面地搶男人，就立刻心虛認輸了。</span></span></p>\n<p>金庸江湖的情場上有一條規則：逆取者勝，順守者敗。所以溫青青勝，阿九敗；趙敏勝，周芷若敗；楊逍勝，殷梨亭敗；韋小寶勝，鄭克爽敗……</p>\n<p>程靈素因此敗了。這個女子這麼出眾，有一身「可驚可怖的本事」，敢於面對一切惡毒的敵人。但唯獨在愛情上，她放棄了進攻。</p>\n<p>我們要感謝金庸，這個風流的報人，在寫了那麼多漂亮女性的同時，以無比的溫情給我們留下了一個醜醜的程靈素。</p>\n<p>她不漂亮，而且發育不良，「相貌似乎已有十六七歲，身形卻如是個十四五歲的幼女」。在金庸小說裡所有的年輕女孩子中，長相不如程靈素的，我一時能想起的只有兩個：一個是《倚天屠龍記》裡的史紅石，一個是《笑傲江湖》裡的老不死。</p>\n<p>程靈素的缺陷，對於女孩子來說幾乎每一點都是要命的：面板是「肌膚枯黃」「臉有菜色」，頭髮「又黃又稀」，身材「雙肩如削」「身材瘦小」……</p>\n<p>一個醜醜的女孩子，偏偏還在《飛狐外傳》這樣一本不太重要的書裡出場，並且是在全書幾乎已經過半的第九章才出場。我想當然地以為，她只是個小旦角兒而已。結果，她在僅有的十章篇幅裡，上演了一場彎道超車，發出了最耀眼的光。</p>\n<p>她對敵人狠，對朋友義，對愛人忠，氣度磊落，坦蕩豁達。幾章過後，她的光彩就開始超過了男一號胡斐，也超過了女一號袁紫衣。又幾章之後，我發現她的氣場甚至直逼書中的大俠苗人鳳。</p>\n<p>在給素不相識的大俠苗人鳳動眼睛手術時，兩個人上演了一出類似晉吳之間羊祜給陸抗送藥般的對手戲。程靈素毫不見外，讓苗人鳳放鬆穴道，拿了刀針就要下手，苗人鳳坦然不懼，旁邊的胡斐卻「忽然對她起疑」。程靈素的反應是「會意而笑，說道：‘苗大俠放心，你卻不放心嗎？’」在這一瞬間，程苗兩人的坦蕩，明顯把胡斐比了下去。</p>\n<p>到了第二十章，隨著她在江湖上一次次從容若定、履險如夷，我們發現她的光芒甚至有可能要威脅黃蓉、趙敏、小龍女、任盈盈這些金書裡的著名大青衣。她甚至挽救了《飛狐外傳》這本書，因為有了她，讓這本書在金書裡也能獨樹一幟，沒顯得太過遜色。一開始誰能想到？</p>\n<p>吾聞馬周昔作新豐客，天荒地老無人識。只能給她三個字——奇女子。</p>\n<p>這個奇女子在情場上的失敗，讓人扼腕。她其實非常像是金書兩位名旦黃蓉、趙敏的綜合體。她有黃蓉的機智，亦有趙敏的辣手。但她卻沒有得到像黃、趙二女那樣圓滿的感情。黃、趙都是感情上的積極進攻者，而程靈素唯獨在愛情上放棄了進攻。</p>\n<p>對於潛在的情敵，如穆念慈、華箏、周芷若等，黃、趙二女出手何等凌厲，絕不給人可乘之機。但程靈素恰恰相反。面對江湖上的敵人，她從來都敢於出擊：攻破掌門人大會，誅戮叛徒，清理門戶，一擊制敵，絕不失手。唯獨在感情上，她成了一個徹底的防守者，惴惴不安、患得患失，把感情的火種默默埋在灰燼裡，直到熄滅。</p>\n<p>她無限度地付出，卻從不敢索取，最後除了一個被慣壞的胡斐，她什麼也沒有得到。</p>\n<p>程靈素輸得很冤。她在情場上的對手不能算強的——袁紫衣在金書的女角里根本排不上號。有位朋友說得露骨：袁紫衣，不過是一個「雲空未必空」的討厭尼姑而已。</p>\n<p>她要攻克的男人，也不算太難——胡斐在感情問題上遠沒有他爹胡一刀那樣堅定明確，充其量只是個陳家洛般拖泥帶水的龜毛男。更何況，她也沒有什麼好輸的——她本來就只是胡斐的「二妹」，如果為愛情放手一搏，就算輸了，也不過還是「二妹」而已。</p>\n<p>然而，我們的小程偏偏過早地認輸了。當胡斐提出結拜兄妹的時候，程靈素就給自己的愛情判了死刑。</p>\n<p>再看看黃蓉和趙敏，她們的愛情也遇到了絕望的關口，郭靖答應要娶華箏，張無忌更是和周芷若要拜堂了，但黃蓉和趙敏放棄了嗎？想想趙敏華堂奪夫的勇猛吧。「光明右使範遙眉頭一皺,說道:‘郡主,世上不如意事十居八九，既已如此，也是勉強不來了。’趙敏道:‘我偏要勉強。’」</p>\n<p>程靈素的退縮，大概是因為自卑。她可能不知道該拿什麼向胡斐進攻。趙敏的進攻方式是：「張公子，你說是我美呢，還是周姑娘美？」黃蓉的進攻方式也很相似：「你說我好看嗎？」二人倚仗的利器都是容貌。</p>\n<p>程靈素不能用這些招數。她不好看。她沒有意識到自己的價值。在很多讀者心裡，胡斐配不上她；但在她自己心裡，她配不上胡斐，只是個醜醜的貧村窮女。</p>\n<p>她高估了山外面的那些大家閨秀，低估了自己這個村裡的黃毛丫頭。面對袁紫衣，她甚至都沒敢交手就認慫了。她大概都沒有動過哪怕半點兒念頭：「她到底哪裡比我好？」就像一個鄉下丫頭面對闊氣小姐，敢比學習成績、敢比工作業績，但一說到面對面地搶男人，就立刻心虛認輸了。</p>\n<p>趙敏、黃蓉為感情而戰，即便輸了，她們也照樣是眾星捧月的江湖名花，所以她們反而放得下架子，敢於進攻，也輸得起。程靈素沒有這樣的底氣。作為一個連鏡子都不敢照的女孩，如果再輸了，她的自信可能會被徹底摧垮，人生可能會更加灰暗。</p>\n<p>有時候，我真希望程靈素學一學另外一個女人——石榴姐。石榴姐說：我就是貌美如花、萬人驚豔的石榴姐。程靈素也可以說，我就是世界上最好的女人，你沒發現嗎？不愛我，你愛誰？你是豬腦子嗎？</p>\n<p></p>\n<p>【鹿鼎記·收拾鄭克爽】</p>"},{"title":"哪個碧池吃了你的菜","content":"<h2 id=\"sigil_toc_id_6\"><span>哪個碧池吃了你的菜</span></h2>\n<p><span><span>最容易被剩下的，反而是程英。愛既不願打折，又必須要求自己有尊嚴、有風範，那一枚含蓄的粽子，一句委婉的毛詩，能有多大勝算？</span></span></p>\n<p>如果用紅樓裡的分類法來看《神鵰俠侶》裡的姑娘，那麼「正冊」裡大概會是小龍女、郭襄；「副冊」裡可能是郭芙、程英、陸無雙、公孫綠萼；「又副冊」裡會是完顏萍、耶律燕、洪凌波……</p>\n<p>這些美麗的女士之中，沒嫁掉的至少佔一半，而且是乾脆一輩子都沒嫁。《神鵰俠侶》就是一部剩女書。</p>\n<p>讓很多人痛心疾首的是，論長相、論素質、論武功，沒嫁的女士都不比嫁了的差。要是再加上林朝英、李莫愁這些沒嫁的，那剩女們在素質上甚至還要壓倒人妻們。</p>\n<p>要知道，當時江湖武林上的戀愛環境是不錯的——戀愛基本上自由，道德法制環境都很寬鬆，青年男女們活動範圍既大，交際圈子也廣，私相授受、瓜田李下、肌膚之親都是常事，何況房子又不貴，還允許自己私搭亂蓋。</p>\n<p>剩女們到底「剩」在哪裡？都是「一見楊過誤終身」嗎？恐怕沒有那麼簡單。</p>\n<p>原因之一，眾所周知：社會的外力，會使戀愛和婚姻的輪盤發生偏轉。例如郭芙，她本來應該是最嫁不出去的一個，結果她卻嫁得最好，家庭最完滿。她老公耶律齊是年青一代中的佼佼者，結婚之後又馬上接任丐幫幫主，用書上的話說，「她這一生什麼都不缺少了」，上哪兒說理去？</p>\n<p>這就是典型的輪盤偏轉，讓郭芙這種情場裡的「下駟」硬生生變成了「上駟」。耶律齊被郭家相中了，憑空被拎去當女婿，別人只有讓步。在戀愛的自由選號池裡，有些號碼壓根兒就沒有被放到池子裡來。假如是一個只喜歡耶律齊的女孩子，在選號池裡撈了半天，只看到武修文、武敦儒這種甲魚，不肯下叉，於是就剩下了。</p>\n<p>由此可見，如果你看中了一盤菜，卻總是遲遲不見它被端上桌，那麼多半是被郭芙們吃掉了。</p>\n<p>程英們被剩下，還有結構性的原因。在江湖裡，一個人的師承門派，大概就反映他們的社會身份。比如一流門派峨眉派的紀曉芙，和超一流門派武當派的殷梨亭訂婚，這應該是當時江湖裡最標準的婚姻模式。</p>\n<p>女士們都在習慣性地「仰攻」。二流人物的女徒弟，總是想方設法撬一流人物的男徒弟。就像溫青青撬袁承志，殷素素撬張翠山，連孫不二的女徒弟程瑤迦，都勇敢地嘗試過撬洪七公的男徒弟郭靖。女追男隔層紗，只要有決心，何紅藥都可以推倒金蛇郎君。</p>\n<p>於是問題就來了，那些二流人物的男徒弟怎麼辦？例如丘處機們的男徒弟、達爾巴們的男徒弟、彭連虎們的男徒弟怎麼辦？他們在讀者的眼裡固然不太重要，不過是書中的邊緣配角，但別忘了，在現實江湖上精英畢竟是極少數，趙志敬們才是江湖上最中堅、最廣泛、數量最多的人群。</p>\n<p>他們只好往下找，去找三流人物的女徒弟，例如朱長齡們的女徒弟、侯通海們的女徒弟、枯木大師們的女徒弟……</p>\n<p>武修文懂得向下找，最終放棄了郭芙，順利娶了完顏萍。妄圖挑戰這一規則的，即便一時小動作得逞，最後也往往只能作死。比如丘處機的徒弟——尹志平同志。作為二流人物的男徒弟，他不肯俯就，偏要仰攻，冒死去進攻一流人物的女徒弟小龍女，結果可想而知。</p>\n<p>因此，我們常常只顧同情剩女，卻往往忽略了江湖裡那些悲催的剩男。</p>\n<p>比如黃河四鬼，比如藏邊五醜，比如江南六怪，比如鹿清篤，比如高則成、蔣濤，比如曹雲奇，比如徐錚……這些沉默的剩男，如果不是鐵桿金迷，你可能連他們的名字都沒聽過。更別提那些神拳門、巨鯨幫、海沙派裡的寂寞男青年們，他們都是有血有肉、同樣渴望愛情和婚姻的活生生的人，卻一直都剩著。</p>\n<p>就像你我身邊，多少剩下的小夥在廠礦裡、車間裡、工地上。我們大談所謂都市剩女現象的時候，很少想到他們。</p>\n<p>江湖上還有一個規律：越是往基層走，男士就越容易被剩下，而女士反而越不愁嫁。在那些江湖二三流的門派中，姑娘很搶手，根本不用擔心被剩下。比如田青文、馬春花、戚芳們，這些二三流門派裡的花朵兒哪一個不是扛著大備胎？</p>\n<p>最容易被剩下的，反而是程英。她已經是黃藥師的徒弟了，還能到哪裡去找更優秀的青年才俊？即便好不容易物色到一兩個，卻還必須要求自己愛得有尊嚴、有風範，面對各色女子們的洶洶競爭，她那一枚含蓄的粽子，一句委婉的毛詩，能有多大勝算？</p>\n<p>當然，我相信，所有有著好胃口的姑娘，最終都會找到自己的菜。只有兩種人會真有可能被剩下——過於現實的人和過於理想的人。</p>\n<p>程英、郭襄，都有點過於理想，最後前者只得到了一句「兄妹之情，皓如日月」，後者只得到一句「咱們就此別過」。馬伕人康敏則好像有點過於現實，已經嫁了副幫主，卻非要撬幫主；段正淳已經答應了她當側妃，偏要當皇后。</p>\n<p>我突然發現，這兩種人其實是一種人，都是過於理想的人。</p>"},{"title":"寧碰康敏別碰秦紅棉","content":"<h2 id=\"sigil_toc_id_7\"><span>寧碰康敏別碰秦紅棉</span></h2>\n<p><span><span>「修羅刀下死」容易，守著修羅刀一輩子去死不容易。</span></span></p>\n<p>《天龍八部》裡有兩條規律：一是所有的爹幾乎都不是親爹；二是所有段正淳的女人都沒有好下場。</p>\n<p>第一條的原因很簡單，無非是緣於段正淳的花心。第二條的原因就複雜了。段正淳的女人們，性格人品都完全不一樣，有溫柔的，有潑辣的，有善良的，有狠毒的，有死纏爛打的，有果斷嫁人的，為什麼都沒有好下場？</p>\n<p>有說法是，因為她們所託非人，看上誰不好，偏偏看上了段正淳；也有說法是她們太過痴情、腦筋不轉彎等等。事實上，人們常常忽略了秦紅棉們的最大問題，就是她們的本質都是女俠，而不是女人。</p>\n<p>秦紅棉、甘寶寶們究竟想從段正淳這裡得到什麼？或者說她們對段正淳的要求是什麼？是段郎「跟了我去」，完全加入她們的生活。最典型的是秦紅棉的一番告白：「淳哥，你做了幾十年王爺，也該做夠了。你隨我去吧。」</p>\n<p>她們的毛病都不是女人的毛病，而是女俠的毛病。她們不能和段正淳終老，不完全是刀白鳳吃醋，很大的原因是她們在骨子裡是屬於江湖的。她們夢想中的完美愛情，是自己照樣做美麗豪俠的「修羅刀」和「俏藥叉」，身後跟著一個百依百順的段郎。</p>\n<p>偏偏段正淳的本質不是俠客，而是一個官僚貴族。正如他手下的褚、傅、古、朱、高升泰等也不是俠客，而是門客。本質上不相同的兩個人，很難實現最終的契合。秦紅棉們的愛情註定很難有好的結局。</p>\n<p>段正淳的女人之中，只有一個人例外，那就是馬伕人康敏。和秦紅棉、甘寶寶、王夫人、阮星竹等都不一樣，她的本質不是女俠，而是女人。</p>\n<p>她是唯一一個明確提出要當王妃的，目標堅定而清晰。《天龍八部》第二十四章「燭畔鬢雲有舊盟」裡，在下決心殺段正淳之前，她向這個花心男人發出了最後絕命三問，層層遞進：「以後你怎生安置我？」「帶不帶我去大理？」「封不封我做皇后娘娘？」</p>\n<p>康敏的詞用得非常好——「安置」。在她的設定裡，自己毫無疑問是該被「安置」的物件。而秦紅棉們正好相反，她們考慮自己被「安置」的少，而幻想自己該怎麼「安置」段郎的多。她們最大的樂趣，大概就是盤算將來收服段郎後如何「安置」。像王夫人，連專門安置他的愛巢曼陀山莊都準備好了。</p>\n<p>或者有人說，秦紅棉們很純情，康敏太有野心。但事實上，康敏為段正淳出的題目反而相對是最實際、最好操作、最沒有野心的——你覺得對於一個王儲而言，是換一個妃容易，還是要他放下富貴尊榮、拋棄對國家民族的責任、下決心跟一個野女人跑掉更容易？</p>\n<p>男人們常常把女人過度追求物質、身份稱為「有野心」，而把一心追求情感滿足的稱為「純情」。大概是因為前者容易讓男人感到直接而明顯的壓力，覺得自己無法源源不斷地供給所需，卻不知後者有時更難。</p>\n<p>秦紅棉、甘寶寶們的那些夢想，「不當王爺、隨了我去」「提了刀白鳳那賤人的首級，一步一步拜上萬劫谷來」，別說是段正淳了，哪怕是個機關小職員，要他下決心拋棄一切跟一個女人去混江湖，從此世界裡只有這個女人，有這麼容易嗎？</p>\n<p>段正淳的把妹經典名句是「修羅刀下死，做鬼也風流」。我們相信他這是真心話，事實上他也做到了，最後義無反顧地為她們殉情而死。但他用一輩子拖泥帶水的感情經歷，證明瞭另一句話，就是「修羅刀下死」容易，守著修羅刀一輩子去死不容易。</p>\n<p>說到底，男人們需要管住自己，如果沒有說走就走的勇氣，寧可去碰康敏，也不要去招惹修羅刀。</p>"},{"title":"慾望不會殺死女人","content":"<h2 id=\"sigil_toc_id_8\"><span>慾望不會殺死女人</span></h2>\n<p><span><span>女人的慾望如果明確，就像一個幾何體，哪怕形狀再刁鑽，也總有一個容器盛得下。就怕康敏這樣，她的慾望像是在做夸克運動，不斷變化，沒有規律，永不停息。</span></span></p>\n<p>每當讀到康敏，我就想起郭芙。這兩個女人很有必要拿到一起比較。或有人會驚訝：這兩個女人如何比較？她們哪裡有半點共同點？事實上，她們大有可比之處。</p>\n<p>郭芙是丐幫幫主夫人。她的這個身份，來得何其容易？整個過程，大致是她的爹媽安排了一場幫主招聘會，讓女婿參加競選，最後順利選上，眾望所歸，鼓掌通過，整個過程一共也就半天時間。</p>\n<p>再看康敏。她也想當丐幫幫主夫人。但她這個夫人當得何其艱難？她折騰了一輩子，把老公殺了，把幫主廢了，陪長老睡了，毒計用盡，最後把命都送掉，終於還是差一步沒當上。</p>\n<p>是的，那個江湖不公平。郭芙有一對好爹孃，而康敏沒有。她打拼的全部資本只有「兩個月餅」。雖然書上說它們「又圓又白」，但月餅畢竟只是月餅，拿去喂有權有勢的人，常常會肉包子打狗。</p>\n<p>但我在這裡要講的，不是關於公平，而是關於慾望。</p>\n<p>康敏其實是有過機會的——段正淳答應了她做大理鎮南王的側妃。但是她不幹，一定要當王后。不能完全怪命運不公，命運給了她機會，而她拒絕了，連認真考慮一下都沒有。於是，命運之神收回了他的饋贈，判康敏出局。</p>\n<p>我過去一度覺得，康敏的敗因是她太貪婪，就像大仲馬說的，人這東西，老天給了他們有限的能力，卻又偏偏給了他們無限的慾望。然而隨著時間的推移，我慢慢發現並不是這樣。</p>\n<p>對康敏的慾望，我試著做了一個詳細的解剖：</p>\n<p>她七歲的時候，想有錢買花衣服；十七歲的時候，喜歡的是風流倜儻的段正淳；幾年之後，嫁給頗有身份的丐幫副幫主馬大元；後來她看上了偉岸的喬峰；喬峰不搭理她，她又攛掇馬大元殺了喬峰當幫主，想自己當幫主夫人；段正淳和她舊情復燃，她又提出要當王后；終於王后沒當成，臨死前的最後一個要求，是喬峰抱著自己看上幾眼，吻她一下。</p>\n<p>她慾望的軌跡是這樣的：財富——男人——地位——男人——地位——男人。</p>\n<p>她一會兒要身份，一會兒要愛情。當命運給了她地位的時候，她要愛情；命運給了她愛情的時候，她要地位。所有《天龍八部》的讀者大概都有一個共同感受：沒有人能搞清楚康敏到底要什麼。她自己大概也不知道自己到底要什麼。</p>\n<p>再看郭芙。同樣解剖一下她的慾望，就會發現簡單得多，只有一個詞——被寵，被寵，被寵。我恍然大悟。</p>\n<p>郭芙和康敏，都不討人喜歡。但區別在於，郭芙能被人讀懂。我們知道她什麼時候會怒，什麼時候會笑，知道如何能讓她開心。她固然是極難伺候的女人，但沒關係，世上總會有耐心無敵的男人。在楊過眼裡她固然是大糞，但在耶律齊眼裡她就是鮮花。</p>\n<p>郭芙的慾望很明確，就像一個幾何體，即便形狀再刁鑽、再難看，也總會有一個容器盛得下。康敏則不一樣，她的慾望像是在做夸克運動，沒有規律，永不停息。愛情、金錢、地位、溫柔，都無法收買她。她是真正的富貴不能淫，威武不能屈。</p>\n<p>沒有人能夠搞懂康敏。你無法知道她什麼時候開心，什麼時候妒忌，什麼時候惱怒。不信你看，《天龍八部》裡沒有一個男人瞭解她，無論是段正淳、馬大元、白世鏡、全冠清、喬峰，都不懂她。因此也就沒有人愛她。《天龍八部》裡有很多的惡女人，但她們都有人愛。阿紫這麼壞，都有遊坦之愛；葉二孃這麼壞，都有玄慈愛。但是康敏沒有人愛。</p>\n<p>人的目標遠大一點，甚至貪婪一點，未必就是壞事。康敏作為一個出身貧苦的底層女孩子，十七歲時還在幹粗活，以至於一雙手都是粗糙的，那時說她想當王妃或是想當幫主夫人或是想找天下最有氣概的男子，不也是我們所謂的貪婪、痴心妄想嗎？但事實上，她證明瞭自己的能力，她當上了副幫主夫人，並差點成為王妃。我相信，如果她的目標夠堅定，朝著一個方向去努力，很有可能會實現夢想的。</p>\n<p>壞就壞在她不清楚自己真正要什麼，不斷地開闢新戰場，把自己在舊戰場的繳獲輕易地拼光了。就像她想當幫主夫人，卻殺了老公馬大元，結果連副幫主夫人都不是了；她想得到英雄男子喬峰，就去利用白世鏡，結果反而被這個糟老頭子玷汙了。</p>\n<p>有個笑話叫狗熊掰棒子，先掰一個夾在左胳膊下，再掰一個又夾在右胳膊下，如是往復地掰，棒子不停地掉，忙碌了半天，最後只夾著一個走了，這多麼像康敏。</p>\n<p>慾望不會殺死女人，但前提是女人必須瞭解它，明白自己真正想要的是什麼，然後再去努力。現在有人概括說男人的所謂「四大傻」，其中之一就是「包了二奶還要娃」，話雖然粗俗，但也是同樣的道理——你究竟是要二奶，還是要娃？</p>"},{"title":"可以不貞，不能不死","content":"<h2 id=\"sigil_toc_id_9\"><span>可以不貞，不能不死</span></h2>\n<p><span><span>金庸塑造了那麼多風情各異的「壞女人」，為她們獻上愛和嘆惋，但卻只差一步，終於不能讓她們衝破曹雪芹「情既相逢必主淫」的判詞，不能跳出秦可卿的影子，活出另一種人生。</span></span></p>\n<p>鮑鵬山先生曾有一個很有意思的觀點，他把《水滸傳》裡的女人分為三類：</p>\n<p>第一類是「說錯誤的女人的話的壞女人」，比如潘金蓮、閻婆惜，她們的語言聲口都是純粹的女人，但因為「淫」，思想上不正確，所以她們的話是「錯誤的女人的話」。</p>\n<p>第二類是「說正確的男人的話的好女人」，比如孫二孃、顧大嫂，她們粗聲大氣，愛兄弟，講義氣，沒慾望，思想上倒是完全正確，但半點女人味也沒有，所以她們的話是「正確的男人的話」。</p>\n<p>第三類是「不說話的女人」，代表人物是扈三娘。作為一百單八將裡模樣最美的女人，她必須不邪不淫，道德上沒有瑕疵，卻又不能粗聲大氣，破壞了美麗；她既不能說正確的男人的話，又不能說錯誤的女人的話，作者也不知如何處理是好了，所以只有讓她不說話。</p>\n<p>一部《水滸傳》，從頭到尾，扈三娘確實基本上不說話。</p>\n<p>在對待女性的問題上，金庸比《水滸傳》溫存了太多，也比同時代的許多武俠作家溫存了太多。傅立葉說，不管在什麼社會，女性解放的程度都是衡量整體解放的天然尺度，那麼相對於《水滸傳》，金庸的江湖堪稱是解放區了。在他的江湖裡，好女人、壞女人都基本可以自由說話，都有均等的機會登臺闡述自己的人生觀、愛情觀。</p>\n<p>於是，在金庸江湖裡，我們看到一個個「壞女人」風姿綽約地翩翩走過，甚至傲嬌地放下話來：我們就是要追求不同尋常的人生！</p>\n<p>但是，不要高興得太早。對她們，金庸自覺不自覺地留了一手：她們可以不貞，但不能不死。</p>\n<p>看看那些所謂失貞過、出軌過、背叛過的女人，《雪山飛狐》裡的南蘭、馬春花、田青文，《射鵰英雄傳》裡的包惜弱，《天龍八部》裡的刀白鳳、康敏，《連城訣》裡的戚芳，《倚天屠龍記》裡的陽夫人……幾乎無一例外都被安排了悲慘的結局。</p>\n<p>她們有的是情有可原，有的是咎由自取；有的純粹是好像一生下來就立志做壞女人，有的則是本想做良家女子，卻被人誤打誤撞撬開了慾望的閥門，從此食髓知味，不惜赴湯蹈火。</p>\n<p>金庸對她們的愛，有的多，有的少。比如同是《雪山飛狐》，對馬春花的愛就明顯比對田青文多；同是《天龍八部》，對刀白鳳的偏袒就比對康敏多。然而，當金庸換上法袍，走上她們命運的宣判臺時，最後的判決仍然只有一個字——死。</p>\n<p>還真是法不容情啊。</p>\n<p>在這裡，我沒有任何說金庸小說的所謂侷限性之意。事實是，他潛意識裡覺得女人一旦邁出「淫」的那一步，就踏入了命運的窄門，如同純潔的天使選擇了墮落，若想要贖罪，唯有投身血池。</p>\n<p>比如《連城訣》裡的戚芳，她愛著師兄狄雲，但又嫁給了有錢有勢還會甜言蜜語的萬圭。最後她發現狄雲很好、萬圭很壞，又偷偷幫著狄雲對付萬圭，結果死在萬圭手上。</p>\n<p>這就是武俠江湖上的「戚芳困境」：女人的一次背叛，不能用另一次背叛來救贖。</p>\n<p>她的每一步選擇都情有可原。然而事實是，對於狄雲來說，戚芳是「淫婦」；對於萬圭來說，戚芳還是「淫婦」。即便狄雲們不介意，但萬圭們會介意，那個江湖會介意。</p>\n<p>在這個江湖裡，男人的「淫」是可以洗白的——哪怕田伯光這樣作孽無數的採花大盜，「割」了之後，還能到恆山別院裡充一條好漢，彷彿過去的罪孽都一筆勾銷；而女人一旦沾上了「淫」，則永遠無法洗清，江湖裡上哪兒去找她們的「恆山別院」。</p>\n<p>金庸肯定並不認為那些「汙點女性」都該死，但他想必下意識地覺得，在這個江湖裡，那些女性沒有出路。他覺得很難給南蘭、馬春花、刀白鳳、戚芳們安排一個好去處，最後大筆一揮，死了死了的。</p>\n<p>有人或者要說，還有小龍女呀。但小龍女是被姦汙的，她的「失貞」和南蘭、馬春花們不同，她的身上沒有「淫」的標籤。即便如此，作者似乎也有意安排楊過斷臂，以對應小龍女的失貞，甚至被讀者稱為是「天殘地缺」，這是我非常難以理解的，她何缺之有呢？</p>\n<p>我其實多麼想看到，哪怕有一個「汙點女性」能在江湖裡活得很好，最後得到圓滿的人生。當她回想起過去荒唐事兒的時候，能只當作是青春的懵懂和騷動付之一笑。然而這種例子幾乎沒有。</p>\n<p>這是金庸的遺憾之處。他塑造了那麼多風情各異的「壞女人」，書寫她們跌宕起伏的故事，為她們獻上愛和嘆惋，但卻只差一步，終於不能讓她們衝破曹雪芹「情既相逢必主淫」的判詞，不能跳出秦可卿的影子，活出另一種人生。</p>\n<p>也許他的每一個「壞女人」都死得很深刻，但如果所有「壞女人」都不得好死，那就又成為另一種膚淺了。眾所周知，在現實的世界裡，壞女人有時候是比好女人過得好的；汙點不是都會變成負擔的；有些女人偶爾壞一次，往往是賭對了的。</p>\n<p>幸好還有一個劉瑛姑。</p>\n<p>她私通老頑童，背叛了段皇爺，三個人糾結了幾十年，最後算是大家盡釋前嫌，做了鄰居，終老花谷。但劉瑛姑的代價也忒沉重了一點：孩子夭折了，自己的青春年華也毀了，用大半輩子的孤獨和創痛，才換來了晚年花谷裡的一點安寧，幾個意思啊？</p>\n<p>其實這三個人最後只勘破了「恩怨」，還沒有勘破「情仇」。劉瑛姑和周伯通最後做了夫妻嗎？沒有。金庸最後仍然吝嗇了一把，終於沒有為劉瑛姑送上最完滿的祝福。</p>\n<p>或者有人會問：反正都七老八十了，做鄰居和做夫妻有什麼區別？呵呵，我倒是希望沒有區別。那麼，美女，願意和我做鄰居嗎？</p>"},{"title":"俞蓮舟和殷素素：一種不動聲色的友誼","content":"<h2 id=\"sigil_toc_id_10\"><span>俞蓮舟和殷素素：一種不動聲色的友誼</span></h2>\n<p><span><span>俞蓮舟和殷素素，他們像冰和炭般不同爐，卻互知道冷熱。他們有一種不動聲色的友誼。</span></span></p>\n<p>有一句話，據說每個人一輩子平均至少會被問到兩次——「你相信男女之間真的有純潔的友誼嗎？」這幾乎已經成了初級兩性沙龍裡的必備問題。</p>\n<p>我的看法是，既然同性之間都可以有愛情，異性之間為什麼就不能有友誼？提問的人難道是覺得自己對所有異性朋友都想入非非嗎？好可怕。</p>\n<p>回到主題「讀金庸」，金書裡對男女之間的友誼著墨不多，但偶爾也有閒筆會寫到。比如黃蓉和朱子柳、周伯通和小龍女，他們的友誼都十足純真。你要說他們誰想把誰當備胎，誰想撲倒誰，我絕對和你拼命。</p>\n<p>拿黃蓉和朱子柳來說，他們之間有一種聰明人之間的奇妙默契，讓人嚮往。兩人互相揶揄幾句「隰有萇楚」「羊牛下括」，然後郭靖在旁傻笑：「蓉兒，這是梵語麼」——我相信，這一場景甚至是黃蓉人生中最美好愉快的記憶之一。</p>\n<p>黃朱之交，是多數金書讀者都知道的。然而，金書裡另有一對男女，他們之間的友誼常常被人忽略。他們就是《倚天屠龍記》裡的俞蓮舟和殷素素。</p>\n<p>《倚天屠龍記》的重點，按照金庸自己的說法，是「男子與男子間的情義」。但在這部皇皇大書裡，俞蓮舟和殷素素的異性友誼，就像是一幅書法作品裡無意掃出來的遊絲和飛白，讓人回味。</p>\n<p>俞蓮舟、殷素素這兩個人，與黃蓉和朱子柳、小龍女和周伯通完全不同。後兩對純是同性相吸——朱、黃兩人都是一樣的貧嘴、聰明、有學問，而小龍女和周伯通則都是同樣地恬淡率真、一拍即合。他們都是因為共同的革命志趣而走到了一起。</p>\n<p>俞蓮舟和殷素素完全相反。他們除了名義上的「俞二伯」和「五弟妹」外，兩人全身上下幾乎找不到半點相近的材料。</p>\n<p>俞蓮舟作為清教徒般的「武當俞二」，無妻無女，冷峻嚴肅，除了武功之外似乎再沒有什麼興趣，小一輩的好像都怕他，連武當派的準接班人宋青書平時都「最怕這位俞二叔」，簡直是高大上、冷傲酷、偉光正的典型；而殷素素作為惡名昭著的天鷹教的第三號人物紫微堂主，說她是妖女都輕了，簡直該說她是魔頭。</p>\n<p>這兩人一個正，一個邪；一個冷，一個熱；一個嚴肅自律，一個任性妄為，本來應該是死都不會有交集的那種人。所以，當我說他們之間存在深厚的友誼，你可能根本不服氣：我把書讀了十遍，也沒看出來他們有什麼友誼。</p>\n<p>我要告訴你，有的。</p>\n<p>首先，俞蓮舟幾乎是那個江湖上唯一記住了殷素素、懷念著殷素素的人。</p>\n<p>殷素素所在的江湖，是一個健忘的江湖。她活著的時候，年輕劍客們為她爭風吃醋、打架拼命，崑崙派的高澤成和蔣濤不是為了他互相拿刀子捅麼？而她一旦死了，就像彗星沉入大海，沒有了聲音，也沒有了影子。</p>\n<p>人們好像忽然忘了她這個人，除了兒子張無忌，誰也不記得她，誰也不提起她。她死後三十多回書裡，我有印象的明確提起了她名字的只有寥寥兩三人，其中一個是峨眉派的靜玄，一個是圍攻彭和尚的少林僧，提到她時不是懷念，而一律是隻有簡短兩個字——妖女。</p>\n<p>唯一主動地想起了她、並默默懷念著她的，只有俞蓮舟——居然不是父親殷天正，不是哥哥殷野王，不是侄女殷離，而是那個冷冰冰的俞二伯。</p>\n<p>在光明頂上，六大門派圍攻殷素素的父親殷天正，打得他奄奄一息。崆峒派的宗維俠準備將殷天正一拳擊斃，是俞蓮舟站出來「攔在宗維俠身前」，一力維護殷天正。最後實在是迫於大局，無法阻止宗維俠，還撂下一句狠話：眼下且由你，回頭再領教你的七傷拳。</p>\n<p>俞蓮舟和崆峒派無冤無仇。他不惜當眾開罪同道，維護敵人，其中原因作者寫得很清楚，因為他「想到張翠山與殷素素」。</p>\n<p>「與殷素素」這四個字，作者不是胡亂加的，讀者要體味到它的分量。武當山對張翠山和殷素素夫婦倆是區別對待的，對張翠山懷念有加，而對殷素素基本是當成害人精來看。殷家送禮物來要被退回去，派使者來都要被「狠狠打一頓」。</p>\n<p>即便後來查明瞭殷素素不是害老三俞岱巖的元兇，她的過錯比想象中的輕，也證明瞭張翠山、殷素素夫婦似乎用不著自殺，但俞岱巖感嘆的只是：「可惜了我的好五弟」。</p>\n<p>注意作者筆下的分寸。老三可惜的只是「五弟」，並沒有五弟妹。五弟是「好五弟」，但五弟妹呢？是好還是壞？老三沒有明說，但恐怕在他心裡還是害人精的成分居多。</p>\n<p>而唯獨在老二俞蓮舟的心裡有殷素素的位置。不管同門其他人怎麼看，那個又邪又壞的五弟妹，他是認的。</p>\n<p>不僅如此，在關鍵的時候，俞蓮舟是殷素素最大的強援。殷素素原本是有靠山的，她有強悍的老爹和大哥。但我把書讀來讀去，覺得和不靠譜的殷野王相比，冷冰冰的俞蓮舟反而更像是她的大哥。</p>\n<p>她夫婦倆從冰火島返回家鄉，一路上遇到無數兇險，都是俞蓮舟「寧可自己性命不在」，「保護師弟一家平安周全」。相比之下，殷素素的孃家天鷹教也是第一時間知道姑娘返鄉的，也肯定能預料到她一路上很不安全。但從頭到尾，沒看見孃家天鷹教派一個人來保護，連暗地裡護送一下都沒有。</p>\n<p>更難得的是，俞蓮舟是少有的能夠欣賞殷素素的人。</p>\n<p>他從極其有限的接觸中很快讀出了她性格里閃光的一面，迅速對她從厭惡轉為欣賞。原著上說，俞蓮舟「對她的不滿之情，已逐日消除，覺得她坦誠率真……反而更具真性情」。金庸想告訴我們，他是懂殷素素的。</p>\n<p>反過來，眼高於頂的殷素素對俞蓮舟也心服口服，發自肺腑地崇拜——她「心下好生佩服：這位二伯名不虛傳，當真了得」。</p>\n<p>兩人居然還很聊得來。回武當山的一路上，俞蓮舟和誰聊天說話最多？不是張翠山，也不是張無忌，而是殷素素。不妨翻翻原著，他平時冷言冷語，但一和殷素素聊天，總是大段大段的。</p>\n<p>俞蓮舟打心眼兒裡關心這個弟妹。在被玄冥神掌打傷時，他的第一反應是什麼？是「低聲道：‘快叫弟妹回來’」。張翠山問他傷勢，俞蓮舟又說了一遍：「不礙事，先將弟妹叫回來要緊。」</p>\n<p>武當山上，當遭遇各大門派圍攻時，又是俞蓮舟顧唸到殷素素，書上說他「點頭道：‘五弟妹身子恐怕未曾大好，你叫五弟全力照顧她，應敵禦侮之事，由我們四人多盡些力’」。</p>\n<p>在戰場上，殷素素和俞蓮舟還能夠迅速形成默契，根本不需要說話，就能夠配合無間，這種默契甚至超過了和丈夫張翠山。</p>\n<p>比如有這麼一段情節：敵人「賀老三」挾持了小張無忌，危急之中，殷素素毫無徵兆地突然裝瘋，吸引敵人注意力，「俞蓮舟只一轉念間便即明白」，抓住機會飛劍制勝。相比之下，旁邊的張翠山居然慢了一拍。</p>\n<p>當然，他們的友誼也不必過分誇大。要說患難與共，他倆比不上張無忌和楊不悔；要說趣味相投，他倆比不上朱子柳和黃蓉；要說交相輝映，他倆比不上小龍女和周伯通。</p>\n<p>但他們的友誼有另一種感人，一種不動聲色的感人。俞蓮舟和殷素素，就像冰和炭般不同爐，但互知冷熱。她死掉以後，我相信俞蓮舟肯定偶爾還會想起她，不只是光明頂上那一次，而且會在平時，在忽然之間。因為記住就是最好的紀念。</p>"},{"title":"愛情的本質是性+嫉妒？","content":"<h2 id=\"sigil_toc_id_11\"><span>愛情的本質是性+嫉妒？</span></h2>\n<p><span><span>愛情的本質，是性＋嫉妒。等到性和嫉妒都沒了的階段，就是婚姻的化石階段，是愛情的墳墓。</span></span></p>\n<p>金庸小說裡的為人婦者，普遍有一個特點：兇猛的小三和姨娘很少，而惡毒善妒的大婦很多。「三兒」們一般都是絕對弱勢的角色。</p>\n<p>比如《倚天屠龍記》裡何太沖的妻子斑淑嫻，《神鵰俠侶》裡公孫止的妻子裘千尺，《笑傲江湖》裡不戒和尚的妻子啞婆婆，都是出名的又善妒又厲害的大婦。</p>\n<p>她們收拾起情敵來，真可謂是踏石留印、抓鐵有痕。裘千尺是把柔兒「一把拋入情花叢中」 ，「那賤婢痛得死去活來」；斑淑嫻則是一味毒藥直接讓五姑「一張臉腫得如豬八戒一般」，差點兒送了命。</p>\n<p>金庸老爺子為什麼對大婦印象不好，而對姨娘們多少抱有同情，我不好妄加揣測。這裡我只談點兩性的話題：原本親密的兩性關係是怎麼逐漸異化、然後崩壞的呢？</p>\n<p>前幾天翻雜誌，讀到一句話，說「愛情的本質就是性+嫉妒」。對這種武斷結論，我本該習慣性嗤之以鼻的。但回頭仔細一想，它倒還真能解釋一些事兒。</p>\n<p>愛情開始時，原本是「有性有嫉妒」的。我相信何太沖和斑淑嫻、裘千尺和公孫止都曾經恩愛過。比如裘千尺和公孫止，他們實在是有一個浪漫的開始：少女裘千尺和兄長吵了架，一氣之下出來闖蕩江湖，誤入絕情谷，遇到了比自己小几歲的公孫止，愛得無法自拔。這個開頭和郭靖與黃蓉的相遇多麼相似。黃蓉不正是和父親吵架、無法溝通，然後離家出走，遇到郭靖的嗎？</p>\n<p>裘千尺回憶過他們恩愛的時候：「成親後我不但把全身武藝傾囊以授，連他的飲食寒暖，哪一樣不是照料得週週到到，不用他自己操半點兒心。」既然這麼恩愛，當然是有性的，不然水靈靈的閨女公孫綠萼怎麼來的？</p>\n<p>何太沖娶斑淑嫻，是為了報恩，斑淑嫻在給他爭掌門人的時候出了力。既然是報恩，當然要全方位地報，公糧肯定是要交足的。</p>\n<p>這個階段的嫉妒，淺且頻繁，即便有一些猜疑和吵鬧，也往往不過像愛情之河裡的鹽粒，充其量不過是製造出一丁點兒酸澀，很快就消解了。</p>\n<p>隨著時間推移，激情慢慢褪去，一些婚姻開始進入「無性有嫉妒」的階段。何太沖、斑淑嫻就是這個階段的典型代表。人到中年，性的間隔由七天、十天、二十天逐漸變為無限長，愛情沒有了新的增長點。何太沖藉口無子，從「二姑」一直娶到「五姑」，斑淑嫻能做什麼呢？只有嫉妒。</p>\n<p>不妨對比一下：段正淳的情人們爭風吃醋那麼厲害，互相之間口口聲聲「殺了這個賤人」「宰了那個賤婢」，但卻沒發生一起真正的流血死人事件；斑淑嫻則一出手就要制五姑死命。為什麼？</p>\n<p>因為段正淳和他的伴侶們一直處在前一個「有性有嫉妒」的階段，秦紅棉、阮星竹們不管遇到再多情敵，但在情郎面前，她們仍然相信自己的美麗，相信自己在配偶心目中的地位。</p>\n<p>而斑淑嫻所體驗的是後一個階段的嫉妒，它可怕得多，往往伴隨著沉痛的無力感，深而強烈，可謂是天雨血、鬼夜哭。江湖上那些真正慘烈的手刃情敵的事，不大都發生在這個階段嗎？</p>\n<p>當然，還是有一些夫妻苦練內功，熬了過來。他們看穿了、看透了，可以心如止水，各玩各的了。那麼恭喜他們，終於進入了最後一個「無性無嫉妒」的階段。它是婚姻的化石階段，是愛情的墳墓。</p>\n<p>這些化石夫妻已經歷過前兩個階段了，覺得這一路上太坎坷、太勞心費神，說什麼也不願從頭再玩一遍了。他們寧願維持著形式上的婚姻，湊合著過下去。如果磨合得好，他們之間也有交流，也有扶持，那更是另一種人生之喜。</p>\n<p>世界上的情侶五花八門，有的人一輩子都在第一階段裡玩，比如段正淳和他的情人們，玩得樂此不疲、有聲有色。有的則始終在第二階段裡轉，玩好了的比如譚公譚婆和趙錢孫的三角戀，天天打架吃醋，一直熱熱鬧鬧折騰到了老；沒玩好的比如裘千尺、公孫止，直接玩崩了，把自己玩進了地獄。</p>\n<p>我沒法告訴你們，哪個階段好，哪個階段壞。煙花轟轟烈烈，但容易傷人；化石沒有了活力，但是性質穩定。人生怎可能盡如人意，默契永存你我心底，且行且珍惜。</p>"},{"title":"女人的弱點是男人？","content":"<h2 id=\"sigil_toc_id_12\"><span>女人的弱點是男人？</span></h2>\n<p><span><span>金庸小說有一個規律：再厲害的女人，只要男人完蛋了，她就崩塌了，再也無法重建自己的生活，要麼馬上死掉，要麼變得人不像人、鬼不像鬼，最後還是死掉。</span></span></p>\n<p>《笑傲江湖》裡面綜合素質最高的女角，不是任盈盈、儀琳這些青衣花旦，也不是恆山上的定閒師太等老旦，而是一個武旦——令狐沖的師孃，金庸小說裡長相好、又能打的「四大阿姨」之一的甯中則。</p>\n<p>金庸對這個女性很偏愛，到處給她植入廣告。書上老魔頭任我行品評天下英雄，也不忘給她留一席之地：「那個‘華山玉女’叫寧……寧什麼的，那小姑娘倒也慷慨豪邁，是個人物。」</p>\n<p>甯中則最後自殺了，很多人覺得可惜：為什麼要死嘛？她怎麼就不能堅強一點，好好活下去，重整華山呢。</p>\n<p>她當然有自殺的道理：老公是個極品，還偷練葵花寶典變成了死太監，獨生女兒又被女婿殺了，整個華山派也幾乎全滅。</p>\n<p>在那個魍魎橫行的地獄般的江湖裡，如果非要勉強一個飽受創傷的中年女人「勇敢」活下去，以滿足自己憐香惜玉的偽同情心，確實有點兒殘忍。</p>\n<p>更關鍵的是，甯中則不能不死，因為金庸小說有一個規律：再厲害的女人，只要她的男人完蛋了，她的愛情和家庭崩塌了，她就離死掉不遠了。要麼她會馬上死掉，要麼活得人不像鬼、鬼不像鬼，最後還是死掉。</p>\n<p>這樣的例子比比皆是，例如《雪山飛狐》裡胡一刀的老婆，那麼牛的一個人，武功又高，人又厲害，但男人一死，她就連兒子也不要了，閃電抹脖子。</p>\n<p>《倚天屠龍記》的殷素素，老公一自殺，她馬上丟下兒子尋短見。其實她有什麼必要非死不可？她孃家是黑幫的扛把子，一個老爸，一個大哥，都是何等人物，天塌下來都扛得住。</p>\n<p>《神鵰俠侶》的李莫愁，心狠手辣，但是情人先劈腿後病死，她的人生就毀掉了，瘋瘋癲癲十幾年，最後被燒死。《飛狐外傳》裡的商老太，也是個硬角色，但自從老公被胡一刀殺了，她就變成了精神不正常的復仇機器，最後把自己燒死。《碧血劍》的紅娘子，堪稱女中豪傑，老公李巖一死，也是馬上自殺；還有何紅藥，那麼狠的一個角色，卻義無反顧地追隨夏雪宜去死。</p>\n<p>這樣的例子舉不勝舉。作者或有意、或無意地給這些女中豪傑們安排了唯一的出路——隨男人去死，不管這個男人是好是壞、對她們有沒有感情、值不值得用生命殉葬。</p>\n<p>夏雪宜對何紅藥、喬峰對阿紫，都是根本沒什麼愛情可言的，但男的一死，女的就跟著照死不誤。甚至於陽頂天的老婆這類，根本不喜歡老公，但殉起夫來卻毫不含糊。</p>\n<p>在金庸的書裡，在失去了男人之後，女人還能正常過日子的，少得可憐。少有的例外之一是紫衫龍王戴綺絲，老公死後，她算是活了下來，但還是有意無意地安排她變成了一個雞皮老太婆，從此與愛情絕緣，苦熬了幾十年。</p>\n<p>和女人相比，江湖上的男人們就完全不一樣。金庸小說裡很多所謂的痴情男人，在失去伴侶之後都過得很滋潤。</p>\n<p>例如黃藥師，算是個極品情痴吧？老婆馮衡死掉了，他作無比悲痛狀，甚至還修了艘花船，號稱要和老婆同沉大海，但十幾年了這艘船都沒開出海去。</p>\n<p>謝遜的老婆孩子一天之內被人殺絕，遭遇不比甯中則好多少。雖然他也狀若痛苦、也要報復，但還是好好地活了下來，照樣稱雄江湖。楊逍、殷梨亭這兩個，都是著名的大情種，但是在紀曉芙暴死以後，一個偶作悲痛狀，另一個則直接弄上了紀的女兒當替身，連找滅絕師太給紀曉芙報仇的意思都沒有。</p>\n<p>陳家洛對香香公主做的那檔子事就不說了，虧了公主死後他還好意思去掃墓。</p>\n<p>最典型的是公孫止、裘千尺夫婦。這一對活寶可謂是金庸小說裡感情生活最失敗的一對夫婦。但在婚姻破裂以後，男的日子照樣滋潤，女的卻變成了地洞裡的怪物、異形，最後女人還是得給男的陪葬。</p>\n<p>面對另一半的離去，男人和女人的待遇差別這麼大，你當然可以說是金庸的「侷限性」——在他的潛意識裡，仍然覺得女人不管再怎麼牛，她的幸福都要維繫在男人身上，是男人的附屬品。</p>\n<p>但完全怪金庸嗎？我們還不是天天犯一樣的毛病，把男的婚姻不好叫作「感情不順」，女的婚姻不好叫作「歸宿不好」。</p>\n<p>有這樣一種關於女作家的說法：女作家的創作風格，往往受她們的戀愛婚姻狀況影響很大。那些戀愛婚姻完滿的女作家，比如冰心、舒婷之類，就總寫一些溫馨雋永的東西；那些經歷坎坷的女作家，像張愛玲、李清照之類，寫的就總是憂鬱陰暗的東西。</p>\n<p>相比之下，男作家受這方面的影響就小得多，你很難從男作家的創作風格看出他的婚姻狀況。</p>\n<p>不管是文壇還是武林，似乎女人的弱點都是男人。這裡的所謂「弱點」，不是指女人有多麼離不開異性，而是說一旦家庭崩壞了，這些江湖俠女似乎就接到了人生失敗的終審判決，永遠無法重建自己的生活。</p>\n<p>馬爾克斯有一本書叫作《枯枝敗葉》，其中說，當一個人的妻子死了，就在牆角種一株茉莉，便能夜夜想起她。我覺得殷素素、胡夫人、紅娘子們不妨學學這種「茉莉法」，種一株花就好，不必把生命的種子也一併埋葬；或是學學黃藥師，伴侶失去了，家庭殘破了，最多為它造艘花船放在那裡，每年油漆幾把，當作永遠的紀念就行。至於當真放火把自己燒了，似乎沒那個必要。</p>\n<p></p>\n<p>【笑傲江湖·甯中則的命運】</p>"},{"title":"不被祝福的愛情","content":"<h2 id=\"sigil_toc_id_13\"><span>不被祝福的愛情</span></h2>\n<p><span><span>得不到祝福的愛情，也是愛情。我們總喜歡問公孫止和李莫愁接下來該如何，但愛情有時真的只對它發生的剎那負責。</span></span></p>\n<p>希望大家讀這篇文章時，不要去聯想娛樂圈裡的某某與某某某。按金庸的說法，「對映性的小說並無多大意義」，對映性的雜文也是一樣沒有太多意義的。</p>\n<p>話說，有兩顆滄桑的心，在一個美麗的幽谷裡相逢——這是金庸小說裡的誰和誰？</p>\n<p>楊過和小龍女，狄雲和水笙，還是晚年的劉瑛姑和周伯通？都對，然而別忘了還有另一個讓人無語的答案：公孫止和李莫愁。在金庸小說裡，最不被人祝福的愛情，恐怕就是公孫止和李莫愁這一對活寶。</p>\n<p>公孫止，就是《神鵰俠侶》裡大名鼎鼎的「絕情谷主」，雖然武功上頗有建樹，但他還有另一個刺眼的標籤——被說成是個慣於始亂終棄、拋棄妻女的登徒子。如果初讀《神鵰俠侶》，除非是瘋了，才會相信公孫止先生和李莫愁小姐會搞到一起。</p>\n<p>然而偏偏就有那麼一天，當浪蕩無行的男武士遇上了情路坎坷的女強人，隨即便發生了讓人驚訝的一幕，他們「三言兩語，竟爾說得甚是投契」。</p>\n<p>李莫愁對公孫止有多大興趣？很難說。書中說她是虛與委蛇，但男女感情這種事從來是李莫愁的逆鱗，觸者即死，寧折不彎，她和誰虛與委蛇過呢？為什麼就縱容公孫止無禮呢？既然是虛與委蛇，怎麼又「三言兩語，竟爾說得甚是投契呢」？</p>\n<p>按說，他們的相遇本該是挺浪漫的——靜悄悄的幽谷宛如童話世界，風吹起來的時候，滿天都是情花飛舞。</p>\n<p>然而，這一次本該讓人珍重的相遇，卻特別不討旁觀者的好。在書中，他們到處遭嫌、人人喊打。其中黃蓉吼的一嗓子最有代表性：「過兒，隔開這兩個魔頭，別讓他們湊近！」</p>\n<p>這倆大齡青年談個婚論個嫁，得罪誰了？</p>\n<p>原因之一，是公孫止長得不太討好。</p>\n<p>金庸寫他的長相，是明褒暗貶的，表面上說人家「一揖一坐，有軒軒高舉之概」，彷彿隨時都會傲岸發問：「你的夢想是什麼？」但抽冷子又說人家「麵皮蠟黃，容顏枯槁」，拿的武器也是怪異的「黑劍金刀」，說不上哪裡醜，但總是一副暗黑相，讓人看著沒來由地產生負能量。</p>\n<p>原因之二，是人們總覺得他倆不是同一型別。海鳥和魚相愛，我們可以接受；但海帶和魚相愛，難免讓人覺得離奇。大多數人不瞭解此圈中人的生活和擇偶觀，於是便在自己熟悉的油鹽柴米中找到類比：一個是土豪趁著國際大牌打折拼命掃貨，一個是過季款眼看行情不好趕快清倉。</p>\n<p>當然，更關鍵的原因，是絕大多數人都不相信愛情與履歷無關——難道有了愛情，公孫止就不是公孫止，李莫愁就不是李莫愁了嗎？回頭是岸的事，怕只有佛經中才有。貓的誓言，大概只能喚起人們對魚骨的記憶。</p>\n<p>面對他們的相遇，江湖上每個人的心裡都湧起不同的內容——恨嫁愁娶的，疾惡如仇的，同病相憐的，兔死狐悲的，曾經滄海的，杞人憂天的……就像同一句「My Music King」，各有各的讀法。</p>\n<p>那些愛李莫愁的，紛紛諫言：仙子，你怎麼嫁他？他的下三濫程度僅次於抄六神磊磊稿子不署名的垃圾號小編呢，你嫁他還不如嫁陸立鼎，不如嫁武三通，不如嫁了楊過；那些愛公孫止的，則憂心忡忡：谷主，你怎麼娶她？我看你還不如娶了洪凌波……</p>\n<p>至於那些兩個人都不愛的，則開心不已：你們彼此相愛，就是為民除害。</p>\n<p>說到這裡，我不禁想起一百六十多年前的那首著名的匈牙利詩歌，它曾經在魯迅先生的介紹下在中國廣為傳唱——生命誠寶貴，愛情價更高；若為自由故，二者皆可拋。</p>\n<p>這首詩裡提到的三樣東西——生命、愛情、自由，都有個共同點：當它們被抽象地單拿出來時，彷彿人人喜歡、人人珍重；但假如它真真實實、沾泥帶土、不加修飾地出現在你面前時，往往很難讓你敞開懷抱喜歡。</p>\n<p>愛情的有趣之處，就在於不講道理：它有時毫不遵從我們的習俗、場合、環境、身份、願望，它的花朵常常不在我們認為合適的土壤裡盛開，它會故意把我們認為不配、沒資格談愛情的人勾連在一起。</p>\n<p>當我們想歌頌它的純美時，它可能偏要以邪惡的姿態出現；我們把它渲染得溫柔可愛，它卻總任性地展示另一面的可怕力量，讓天雷勾動地火，暴雨突襲荒原。</p>\n<p>得不到祝福的愛情，也是愛情。我們總喜歡問公孫止和李莫愁接下來該如何，但愛情有時真的只對它發生的剎那負責。</p>"},{"title":"哪個圈都不比哪個圈亂","content":"<h2 id=\"sigil_toc_id_14\"><span>哪個圈都不比哪個圈亂</span></h2>\n<p><span><span>我們每個人都伸著脖子，顯得自己浮在道德的海平面上，把目光到處搜尋，看水淹了哪個倒黴鬼的下半身。</span></span></p>\n<p>常常有讀者問：六神，今天這個明星離婚了，明天那個明星出軌了，文章先生遇到事了，黃奕女士遇到事了，你怎麼不解讀解讀？</p>\n<p>討厭，都說了我只讀金庸，我不讀黃易。另外，黃易先生什麼時候又變成女士了？</p>\n<p>事實上，每當這類事情發生時，人們的第一反應往往是一句話：「貴圈真亂」。在人們印象裡，有幾個圈的「亂」幾乎已經沒有爭議——比如娛樂圈，你隨便動動滑鼠，都能找到血淋淋溼漉漉的大把證據。</p>\n<p>不斷有讓人震驚的細節曝光，不斷有驚人的影像資料公佈，今天男友曝照，明天前夫補刀，後天女星痛陳，我們幾乎要覺得這些圈裡的男男女女都可以隨意排列組合，恍如人間天堂，把誰和誰連在一起都有夫妻相。</p>\n<p>然而，亂的只有這幾個高危圈嗎？文藝圈呢？我們大概會衝口而出，亂，當然亂，詩人不都是溼人嗎？媒體圈呢？肯定也亂啊！青年們呢？現在的孩子甭提了——「酷就少廢話趕緊脫，別假惺惺問我是什麼星座」；學術圈呢？嘖嘖不多言了……</p>\n<p>這多麼像金庸小說裡，放眼江湖，你幾乎找不到乾淨的門派。</p>\n<p>《天龍八部》裡的少林寺本來是最不該亂的，但玄慈老方丈居然有私生子，養在廟裡近二十年；丐幫應該是正義而嚴肅的，但你能想到副幫主夫人康敏居然至少和兩個長老睡過？</p>\n<p>明教的莊嚴聖地密道里，天天上演教主夫人的活春宮；逍遙派無崖子三兄妹之間的那點事，估計要畫個示意圖才能說清楚。峨眉派門規如鐵，最有前途的女弟子卻和魔教淫徒生了娃；武當派乃是名門正派，第三代傳人卻喜愛偷窺女生寢室；恆山派應該算最潔淨的吧？但裡面連一個掃地的啞婆婆都有「和尚尼姑」的往事……</p>\n<p>知名大門派尚且這樣，自不用說什麼無量劍、天龍門、飛馬鏢局了，管理鬆散，紀律鬆弛，更是腥風陣陣，其亂無窮。</p>\n<p>我的看法是，沒有哪個圈比別的圈更亂。事實是哪個圈子被關注得越多，它就顯得最亂。這就是為什麼你會覺得最亂的是白宮、是伍茲、是陳老師、文老師、黃老師們。</p>\n<p>你說什麼？我等鄉民土眾想亂還沒資格？你太悲觀了。不妨打個比方：如果以你的交際圈為限畫個圓，讓那些你不知道的事都浮出水面，結果一定非常驚人，非常可觀。你絕不會想到原來A居然禿嚕過B，C居然咔嚓過D，E居然曾和F情孽糾纏，H居然推倒過G。</p>\n<p>或者說，凡俗世界的任何一個宅院、一個村落，如果集中狗仔下大力氣挖一挖，結果都會充滿驚喜。</p>\n<p>真正亂的是我們的生活本身，它是那麼經不起推敲。每個人都努力伸著脖子，顯得自己浮在道德的海平面上，還把目光到處搜尋，看水淹了哪個倒黴鬼的下半身；我們看著別人的笑話，驚訝萬狀，彷彿不知道無數笑話正發生在自己的桌底。</p>\n<p>最後宣告，我絕不是說別人亂得有理。非要誇我的話，你可以換種文藝的說法：「六神磊磊是在表達對人性的悲憫和失望」，顯得多麼上檔次，又有見地。</p>"},{"title":"不能改變她，那就照耀她","content":"<h2 id=\"sigil_toc_id_15\"><span>不能改變她，那就照耀她</span></h2>\n<p><span><span>做不了她的老師，那就做她的燈塔。</span></span></p>\n<p>讓我們先來猜一個人：</p>\n<p>一個十六七歲的女孩子，孤兒，從小在人渣堆裡混，師父是壞蛋裡的大boss，同班同學個個是人渣惡棍，最善於自相殘殺，她自己也被迫學了一身下毒放蠱、殺人滅口的本事。你猜這是金庸小說裡的誰？</p>\n<p>「六神我知道，是阿紫！」</p>\n<p>對這個答案，我只能給50分，因為還漏了另一個答案：程靈素。</p>\n<p>有一部老電影，是法國新浪潮的代表作，叫作《四百下》。乍一看題目你還以為是成人片呢，其實這部電影是講不良少年的，套用了一句法國諺語：一個熊孩子要挨四百下打才能學好，大概相當於我們的「棍棒底下出孝子」。</p>\n<p>阿紫同學在星宿派長大，捱打可能遠遠不止四百下，可能是八百下、一千下，結果卻打成了金庸小說裡不良少女的突出代表，也是近現代文學史上一個經典的壞女孩形象。</p>\n<p>說起她的學壞，我們總傾向於一種解釋：她成長的環境太惡劣了，她就讀的學校太垃圾了，她的同班同學太極品了，她不學壞才怪。她上的那個學校——星宿武術和化學進修學校，是專門培養惡棍的，開的課程都是殺人滅口投毒之類，什麼缺德教什麼。比如老仙的那一門武功「腐屍毒」，就是妥妥的細菌武器啊！</p>\n<p>而且這所學校的校規太駭人聽聞了，專門提倡自相殘殺：想當班幹部怎麼辦？殺同學——殺了學習委員你就是學委，殺了班長你就是班長，老師還給你點贊。估計這所學校的校歌是「煮豆燃豆萁」吧？</p>\n<p>再看她那些同班同學，什麼摘星子、獅吼子們，一個個不像是俠義小說裡的人物，而像是《西遊記》裡的怪物，從長相到使壞的本事，直接拿到什麼黃風洞、獅駝嶺、平頂山去都是一號角色，妥妥壓倒那些只會「大王，禍事了！禍事了！」的小鑽風們。天天和這些同學混，一個小姑娘能學好？</p>\n<p>由此我們得出了結論：阿紫變成不良少女，是因為環境太差。</p>\n<p>但這難以解釋另一個問題：程靈素為什麼就學好了？</p>\n<p>程靈素的成長環境，和阿紫的非常相似——都是一個爛學校，一群爛同學。她的學校辦學條件惡劣、食堂伙食差勁，吃得她一把黃頭髮稀稀拉拉，發育不良，臉有菜色，這都暫且不說了。關鍵的是，她的學校和阿紫的一樣，都是大名鼎鼎的壞蛋團夥，也都特別擅長玩毒藥，能讓各自時代的最強武力擁有者——蕭峰和苗人鳳們聽了就皺眉頭。</p>\n<p>程靈素的師叔、師兄們同樣是一群標準人渣，相比於星宿派裡單純粗暴的惡，更多了一種陰森森的鬼氣。如果說阿紫的師兄們演的是魔獸片，那程靈素的師兄們演的就是鬼片：</p>\n<p>比如她的師叔石萬嗔老師，戰績驕人，有著毒死大俠胡一刀的光榮事蹟；她的師姐薛鵲、師兄姜鐵山和慕容景嶽，堪稱金庸小說裡最混亂的三角關係：薛勾搭慕容——薛殺了慕容老婆——慕容打殘了薛——薛嫁了姜——慕容勾搭薛——慕容和薛殺了姜——薛讓慕容殺了自己的親兒子……是不是精彩紛呈、應接不暇？程靈素的這個班級，是不是甚至比阿紫的還恐怖？</p>\n<p>幾乎完全相同的環境，程靈素卻長成了和阿紫完全相反的人：善良、仁愛、寬容，絕不濫殺無辜、心靈十分健全，為什麼？</p>\n<p>唯一的解釋，就是程靈素有一個師父——毒手藥王。</p>\n<p>小姑娘的成長，有時候起導向作用的不是那些真、善、美的東西，而是另一個字兒——「酷」。她未必會認同最善的、最美的，但往往會羨慕和追求那個最酷的。</p>\n<p>想象一下這個場景：我們的小姑娘程靈素到了青春期。她坐在教室裡，瞪著烏黑的大眼睛，懵懂地尋覓著一切新奇炫酷的東西。</p>\n<p>女同學薛鵲來告訴她：當壞女孩最酷，當第三者、第四者最酷，能把討厭的情敵女同學叫到廁所裡抽耳光、喂血饅頭、剝光痛打，甚至直接賞個割禮最酷。</p>\n<p>男同學慕容景嶽告訴她：上街打架鬥毆最酷，外面有幾個蹲過班房的兄弟最酷，能把仇人扔坑裡填土埋了然後坐邊上吹口琴最酷。</p>\n<p>又一個男同學姜鐵山告訴她：能賺錢最酷，挨個宿舍收學弟的保護費最酷。</p>\n<p>在一片嘈雜的聲音中，我們的小姑娘程靈素卻沒有學壞。因為在她面前，總有毒手藥王那寂寞、枯瘦卻又無比偉岸的背影。他似乎總在無聲地說：丫頭，別信這些貨的。我告訴你，當學霸最酷。</p>\n<p>他以完全壓倒性的業務能力，讓程靈素的各路師叔、師兄們相形失色：你們這些也號稱是玩毒藥的，不管你殺馬特也好，你EMO也好，你哥特也好，業務被老和尚無懸念地碾軋，爆你十條街，你酷個屁。</p>\n<p>在講臺上，藥王不算是一個好老師。看《飛狐外傳》原著，總覺得他說話有點囉唆，不夠簡潔精到，不善教育人。比如他開解徒弟們的三角戀，效果就很差，「不管怎麼開導教訓，這三人反反覆覆，總是糾纏不清」。</p>\n<p>藥王對程靈素的影響，不在於教誨，而在另外兩個方面：一是自身超強的學術水平。他讓程靈素高山仰止、無比崇拜。比如胡斐誇程靈素醫術好，程靈素回答：「那算什麼？你若見我師父給人開膛剖腹、接骨續肢的本事，那才叫神技呢。」</p>\n<p>這是發自心底的敬重和仰慕，覺得有豐碑在前，自己無足稱道，唯有努力。這一幕在金庸其他書裡也似曾相識——比如《神鵰俠侶》裡，金輪法王誇周伯通和東邪、南帝名不虛傳，周伯通付之一哂：「若我師兄在世，你焉能接得住他十招？」</p>\n<p>二是以身作則的寬厚人格。毒手藥王以前法號叫「大嗔」，脾氣暴躁，後來修為越來越深，對事情越看越透，慢慢改成「一嗔」「微嗔」，直到人生的最後三年，他終於改名「無嗔」，實現了真正的大覺圓滿。</p>\n<p>他的恢巨集和寬博，正是程靈素仁慈、寬容性格的來源。就像一些偉大的學者，你從他身上學的東西，往往比從他講義裡學到的更多。</p>\n<p>藥王沒能改變程靈素的師門環境，卻以自身的光芒，成了她的人生燈塔。對於女孩子，你與其教誨她，有時候不如照耀她。</p>\n<p>當然，燈塔這種東西，出現得不能太早了，也不能太晚了。阿紫後來也碰到了人生的燈塔——蕭峰，可惜晚了，她已經到了十六七歲，性格養成了，星宿派絕技都已經學了全套了。程靈素就比較幸運，毒手藥王改名無嗔、脾性和氣質最好的時候，恰好她十三四歲，正是養成性格的關鍵年紀。</p>\n<p>但不管怎樣，以身作則是關鍵。你剛上街砍完人，拿著滴血的刀回家了，對孩子說兒子不要學我，可能嗎？曾經有一個熟人問我：我孩子怎麼就不愛讀書，怎麼教育都沒用。我說你家裡估計除了安全套說明書和麻將牌上的東南西北，還能找出任何一片帶字兒的東西來嗎？你還好意思要她讀書呢！</p>"},{"title":"江湖史","content":"<h1 id=\"sigil_toc_id_16\"><span><span>江湖史</span></span></h1>\n<p><span>歷時千年、無數俠客參與的江湖，究竟發生了一些什麼大事件？</span></p>"},{"title":"《射鵰英雄傳》：一個關於收藏的故事","content":"<h2 id=\"sigil_toc_id_17\"><span>《射鵰英雄傳》：一個關於收藏的故事</span></h2>\n<p><span><span>郭靖先後摧毀了兩個偉大收藏家的夢想，他讓古籍善本收藏家歐陽鋒永遠無法收藏到《九陰真經》，也讓城郭和人口的收藏家鐵木真終生沒有收藏到襄陽城。</span></span></p>\n<p>在金庸小說裡，記敘了一個讓人不忍卒讀的故事：有一位叫作歐陽鋒的執著的古籍善本收藏家最後發了瘋。</p>\n<p>在數十年的時間裡，他瘋狂地搜尋著一部叫作《九陰真經》的珍貴古籍，併成功獲得了一個抄本。然而真相卻是：他搞到的是一部「筍貨」，是被人挖改描補的贗品，最後讓他精神崩潰，神經錯亂。</p>\n<p>《射鵰英雄傳》，就是一部關於收藏的悲劇故事。</p>\n<p>在今天的收藏市場上，古籍的行情不高。但在大約公元1200年的南宋，古籍善本收藏蔚然成風，一部叫作《九陰真經》的珍貴古籍最受關注。</p>\n<p>這是一部系統的古代體育學著作，囊括了關於體育運動、人體生理科學、古代醫學乃至精神病治療（移魂大法）方面的內容，有很高的文物和科研價值。</p>\n<p>這部古籍傳世稀少，按照金庸的說法，一個多世紀以來只出現了六個版本，分別是：作者黃裳手稿本、桃花島馮衡手抄本、梅超風鞣製人皮本、王重陽古墓遺刻本、倚天劍內藏縮略本，以及郭靖洪七公篡改偽造本。請注意，前五個版本都算是善本，而後一個版本是贗品。</p>\n<p>五湖四海的收藏家們為此展開了激烈爭奪。他們來自東北、華北、雲南、東海乃至西部邊疆地區，甚至發生了惡性的鬥毆事件。例如西部邊疆的收藏家歐陽鋒先生就把華北的收藏家洪七公先生毆致吐血。</p>\n<p>當時藝術品拍賣的最高殿堂是華山專場，相當於今天的佳士得和蘇富比。在拍賣《九陰真經》黃裳手稿本時，經過三天三夜的激烈角逐，大收藏家王重陽先生成功競得。</p>\n<p>王重陽的身份是南宋收藏協會主席、陝西終南山全真博物館館長。競拍結束後，他發出了引人深思的呼籲：「是藏品重要，還是整個收藏界的團結和友誼更重要？並宣佈，《九陰真經》將永不流入市場 」。</p>\n<p>除了《九陰真經》之外，另一部珍貴古籍《武穆遺書》也是收藏家們心儀的物件。</p>\n<p>據金庸所說，這部古籍是嶽飛「親筆所書」的孤本，其文物價值難以估量。難怪連當時的大收藏家、大考古學家、金國皇族完顏洪烈先生也加入了爭奪。</p>\n<p>完顏洪烈聘請了多位學者，一起開展《武穆遺書》的考古發掘工作，其中有黃河學派的代表沙通天，長白山學派的專家樑子翁，以及新疆白駝山學派歐陽鋒教授的研究生歐陽克等。</p>\n<p>經過一番考證，他們先在臨安南宋皇宮進行了發掘，又輾轉到附近的牛家村一帶進行了科考，卻一無所獲。最終，在湖南一座偏僻的鐵掌峰上，這部書被郭靖給撿了漏。</p>\n<p>除了古籍善本之外，《射鵰英雄傳》還描寫了南宋年間其他收藏領域的繁榮景象，可謂百花齊放、讓人驚訝。</p>\n<p>比如東海的黃藥師教授喜歡收藏古玩字畫，為了滿足他的研究需要，他的研究生曲靈風甚至不惜去盜竊皇家博物館，竊取了大量名貴的字畫法帖，其中包括吳道子的《送子天王圖》，韓幹《牧馬圖》和南唐李後主《林泉渡水人物》。</p>\n<p>甚至一些極其冷門的收藏專案也有人熱衷。比如有一位名叫裘千丈的先生，喜歡收藏魔術道具；一位叫歐陽克的青年收藏家，喜歡收藏各族的美女；還有歷史上聲名顯赫的鐵木真先生，喜歡收藏土地、城郭和人口。</p>\n<p>順便說一句，《射鵰英雄傳》裡還披露，早在南宋就有大規模的文物仿製和造假行為。最典型的就是郭靖夥同洪七公，猖狂地偽造了贗品《九陰真經》抄本。</p>\n<p>他們偽造了序跋，篡改了內文，裁截了目錄。對於這部贗品，當時的大收藏家歐陽鋒先生居然鑑定不出真偽，被騙了幾十年，可見我國文物造假歷史源遠流長，你完全不必對後來困擾無數文物專家的「河南造」感到驚奇。</p>\n<p>《射鵰英雄傳》這部皇皇大書，是以收藏開始的，也是以收藏結束的。</p>\n<p>這部書的開頭，講的是黃藥師的研究生曲靈風盜竊皇家博物館，並和安保人員發生衝突的故事。而這部書的結尾，講的是金國人給蒙古首領鐵木真送來珍貴藏品——上千顆珍珠，卻遭到蒙古人的藐視，被鐵木真粗魯地把珍珠打翻在草原上。後來幾個世紀裡，都有牧民持續在這裡從事珍珠的撿拾和發掘工作。</p>\n<p>在全書的最後，郭靖和鐵木真還就收藏話題展開了一番理論探討。</p>\n<p>鐵木真認為：自己收藏了大量的土地、城郭和人口，建造了史上最大的蒙古博物館——「自中心達於諸方極邊之地，東南西北皆有一年行程」，堪稱是史上最偉大的收藏家。郭靖則尖刻地指出，這些藏品的實用性不強，不適合年老體衰之人欣賞把玩。與此同時，郭靖還暗下決心，要阻止鐵木真收藏襄陽城。</p>\n<p>事實證明，郭靖先後摧毀了兩個偉大收藏家的夢想。他讓歐陽鋒永遠無法收藏到《九陰真經》，也讓鐵木真終生沒有收藏到襄陽城。前者發瘋而死，後者吐血而亡。</p>\n<p>郭靖為什麼和鐵木真有這麼大的仇恨？根據我的研究，答案很可能也在收藏上——郭靖是一個鳥類收藏家，尤其喜歡蓄養猛禽，而鐵木真是一個射鵰愛好者，常常把猛禽當作靶子。他們的仇恨，一目瞭然。</p>"},{"title":"從偉大武功到偉大公公","content":"<h2 id=\"sigil_toc_id_18\"><span>從偉大武功到偉大公公</span></h2>\n<p><span><span>儒家武士的沒落，是從北宋年間的慕容氏開始的。生於公元1170年左右的黃藥師，是江湖裡最後一個武功達到絕頂境界的書生，此後的儒生武士便再沒有了絕頂人物。</span></span></p>\n<p>在江湖上，有一個名字最狂野、最張狂的教派，叫作「日月神教」。</p>\n<p>但諷刺的是，這個組織的頭目東方不敗先生完全沒有這種功能。他和教名裡那個張狂而粗魯的動詞完全沾不上邊。</p>\n<p>這個明顯名不副實的教派，卻擁有至少數千名信徒，遠遠超過了釋家的少林和道家的武當，更超過了首腦以儒生自居的華山。</p>\n<p>像東方先生這樣沒有健全功能的人，是怎麼能夠超越釋道儒三家，吸引眾多擁躉的呢？要剖析這一現象，讓我們先從大約400年前的《天龍八部》時代說起。</p>\n<p>《天龍八部》的時代，是一個武學繁榮、百花齊放的時代。當時最偉大的武功大多被收藏在三個頂尖牛叉的圖書館：一個叫還施水閣，是慕容家開的；一個叫琅嬛玉洞，是逍遙派開的；一個叫藏經閣，是少林寺開的。江湖高手們挖空心思，都想到這三個牛叉的圖書館裡去看書。</p>\n<p>開這三個圖書館的，一個是儒家，一個是道家，一個是佛家。很長一段時間裡，三座聖殿交相輝映，鼎立武林。</p>\n<p>我要說的是開辦了「還施水閣」的姑蘇慕容家。他們的末代領袖慕容博以鮮明的儒生形象縱橫江湖——「那男子約莫四十歲上下，相貌俊雅，穿著書生衣巾」。他是個儒家積極用世的踐行者，志在修齊治平、興復故國，哪怕成功率幾乎是零，卻仍然知其不可而為之，雖殞身而不恤。</p>\n<p>在當時的江湖裡，作為儒生的他武學思想最為桀驁，提倡以直報怨，其核心精神是「以彼之道，還施彼身」。</p>\n<p>相比之下，雖然道家一脈的逍遙派也有狠辣的折梅手和貪婪自私的北冥神功，佛家的少林寺也有「大韋陀杵」這種專門上演大石碎胸口的粗暴絕技，但都不如慕容家「用你的辦法殺死你」來得這麼偏激和極端。</p>\n<p>然而，在《天龍八部》裡，這個文采風流的慕容家轟轟烈烈地牛了一把，充當了一回武林的風暴眼，然後就無可挽回地衰敗了。不管是宋、遼、西夏還是大理、吐蕃，乃至江湖上一切的勢力和存在，都嫌他們太鬧騰、太偏激了。他們是眾矢之的，是威脅、是麻煩、是刺頭。</p>\n<p>金庸的武學史長河中，儒家武士的一角塌陷，正是從慕容氏的衰敗開始的。</p>\n<p>這種衰敗勢難挽回。到了南宋，生於公元1170年左右的黃藥師成為了金庸江湖裡最後一個武功達到絕頂境界的書生。讓我們記住黃藥師的形象——「穿一件青色直綴，頭戴方巾，是個文士」。</p>\n<p>這是武俠史上最後一個偉大的儒者形象，是孔孟門生在江湖最高殿堂上的絕唱。自黃藥師之後的那些儒家武士，無論楊逍、張翠山、陳近南、陳家洛還是餘魚同，不管再怎麼風流機巧，終究都是二三流的人物。</p>\n<p>在儒家武士沉淪的同時，大約公元1160年，隨著一個叫黃裳的人以《萬壽道藏》為基礎，寫出了一本叫《九陰真經》的書，道家的武士迎來了輝煌的時代。</p>\n<p>此後大約一百年的時間裡，《九陰真經》被抬到一個極其崇高的地位，甚至被稱為「天下武學之總綱」。</p>\n<p>黃裳的繼任者王重陽延續了道家武士的輝煌，他的武功被稱為「玄門正宗」，他創立的全真教成為武林第一門派，他本人也成為無可置疑的天下第一高手，在「射鵰三部曲」中留下一個高不可攀的背影。</p>\n<p>哪怕是一貫驕傲的儒生黃藥師，也不得不用詩歌表達對道士王重陽的仰慕和服膺：「重陽起全真，高視仍闊步。矯矯英雄姿，乘時或割據……於今終南下,殿閣凌煙霧。」</p>\n<p>或許是吸收了儒家武士衰敗的教訓，道家的《九陰真經》溫和了太多。它一上來就開宗明義——「天之道，損有餘而補不足，是故虛勝實，不足勝有餘」，表示自己絕不多吃多佔，沒有野心，絕不會像慕容家一樣動不動就粗魯地雄起，炒菜都要戳翻油鍋。</p>\n<p>在這種溫吞水的思想指導下，道家的武人們誠惶誠恐，拼命打磨著武功中的稜角，在「知足」和「無求」中小心翼翼地尋找著偉大的可能。</p>\n<p>道家高手周伯通的武學叫作「空明拳」，號稱「天下至柔」，已經夠痿的了；後來的道家掌門張三豐卻發明瞭比空明拳還要更痿的「太極」系列武功。當他的徒弟俞蓮舟偶然創造出了峻烈的「虎爪絕戶手」時，他大驚失色，叮囑徒弟千萬不要使用。</p>\n<p>真是一代不如一代。當年好歹曾研發出「九陰白骨爪」的道家武士們，居然連遠為溫柔的「虎爪絕戶手」都覺得太敏感太刺激了。</p>\n<p>道家的《九陰真經》散佚之後，下一個稱雄江湖的是佛家的《九陽真經》。</p>\n<p>在「萎靡」的道路上，佛家的武士比道家走得更遠——你不是還遮遮掩掩地說什麼「虛勝實」「不足勝有餘」嗎？我乾脆連遮羞布也不要了，乾脆捱打不還手、唾面任風乾如何？</p>\n<p>於是，就有了《九陽真經》裡著名的「他強任他強，清風拂山崗；他橫由他橫，明月照大江」。</p>\n<p>《九陽真經》裡最露骨的是那一句「他自狠來他自惡，我自一口真氣足」，每次讀到，總讓我聯想起幾十年前北宋中原人民的「金兵有狼牙棒，俺們有天靈蓋」——這句曾使遺民淚盡胡塵裡的辛酸笑話，經過一番包裝，居然成了正統的武學思想了。</p>\n<p>然而，即使萎靡退讓到了這一步，武學人士的進化（或者說蛻化）之路還沒有完。冥冥之中有一種力量，覺得武人們的陽氣還是重了一點。</p>\n<p>於是，在武學進化史的加拉帕戈斯群島上，經過偉大的自然選擇，一種更神奇的武人出現了。他們踏過狂躁的儒家武士、謙退的道家武士、自虐的佛家武士的遺蹟，登上了武學江湖的王座，他們的名字叫作——閹人,不是張翼德那個燕人，而是閹割的閹。金庸武俠史上從此出現了儒、釋、道三教之外的第四個教派——閹教。揮劍自宮，是加入這個教的投名狀。</p>\n<p>翻開腥臊撲鼻的《笑傲江湖》，我驚訝地看到，在《天龍八部》四百年後，一群公公成了武學的最高統治者。</p>\n<p>過去歷史上的那些武聖們，從掃地僧到獨孤求敗、黃裳、張三豐，不論如何修持禁慾，至少都是完整的。王重陽甚至可以和林朝英「二仙此相遇」，差一點兒就推倒了。</p>\n<p>但在明清時代的《笑傲江湖》裡，閹人完全呈壓倒性優勢。你看儒家武士最高成就的代表不過是岳不群，戰鬥力也就是個七十出頭。為了攀登武學新高峰，嶽老師一咬牙，揹著老婆揮劍自宮，交了投名狀，馬上變身超級賽亞閹人，打遍五嶽劍派無敵手。</p>\n<p>左冷禪曾經是嶽老師最大的敵人，金庸說他「名字中雖有一個‘禪’字，卻非佛門弟子，其武功近於道家’」。但不管左老師是佛還是道，都是過時的明日黃花，一碰到加盟閹教的岳不群，立刻被戳瞎了狗眼。</p>\n<p>至於釋道兩家的代表人物方證和尚和沖虛道士，只能蝸居少室山和武當山，避免遭遇閹教的東方教主，免得毀了一世英名。假如真要遇上東方教主，估計也是被爆十條街的下場。還有也算正宗道家高手的餘滄海老師，碰上閹教的新秀林平之，居然毫無反擊之力，被爆得花兒殘滿地傷，笑容都泛黃。</p>\n<p>那個江湖上已經沒有了偉大的武功，只剩下一些偉大的公公。</p>\n<p>我們不得不承認，閹人確實是武士的完美進化形態，比什麼儒釋道都更讓人放心。眾所周知，雄性動物再溫順也難免會咬人的，只有騸掉，才會完全失去攻擊性。</p>\n<p>我常常想，如果《笑傲江湖》的明清時代還搞華山論劍，一定很精彩。幾位大宗師嘰嘰喳喳地比武討論完畢，然後全部一起蹲著噓噓，那將是多麼壯觀啊！</p>"},{"title":"劉元鶴們的逆襲史","content":"<h2 id=\"sigil_toc_id_19\"><span>劉元鶴們的逆襲史</span></h2>\n<p><span><span>《天龍八部》的時代，幾個江湖豪客開一個小會，就能操弄天下的興亡。而試問幾百年後，《鹿鼎記》裡最強的歸辛樹、九難尼姑、洪安通等一幫人開個會，能搞出什麼名堂？</span></span></p>\n<p><span>【一】</span></p>\n<p>劉元鶴，是《雪山飛狐》裡的一個小人物。把他單獨拿出來，主要是因為他的特殊身份，是個清宮的侍衛。</p>\n<p>金庸的江湖史，有人說是一部武學的沒落史，有人說是一部俠客的消亡史。其實，它還有不為人察覺的一條暗線：它是一部如劉元鶴這樣的官府武士的逆襲史。</p>\n<p>在金庸的江湖裡，很長一段時期內，給朝廷當差不是一個好的選擇。在江湖上，最重要的戰略資源無疑是武功，特別是頂級武功，控制它們的是民間武士和門派。比如七十二絕技是少林寺的，乾坤大挪移是明教的，太極拳劍是武當派的，官府伸不進手來。作為朝廷郡主的趙敏想學武功，也不得不採取成本極大、效率極低的笨辦法，不辭辛勞地把各大門派一網打盡，關起來逐個拷問。</p>\n<p>在北宋《天龍八部》的時代，那些最重要的戰略物資儲備中心——最著名的比如少林寺的藏經閣，姑蘇慕容家的還施水閣，逍遙派神仙姐姐的琅環玉洞，收藏之巨、規模之大，簡直像今天的核武器庫，哪一個是在衙門手中？</p>\n<p>按說官方色彩最濃的是大理段氏，但他們家最牛的六脈神劍收藏在哪裡？不是皇宮，而是天龍寺。甚至段氏家族的族長——保定皇帝段正明要學一點六脈神劍的劍法，都必須先剃度出家，不然連看看劍譜的資格都沒有。</p>\n<p>在《天龍八部》的時代，俠客的權力籠罩一切，動輒以布衣抵卿相，直接擔當朝廷要職。蕭峰布衣而得掌天下第一強國的兵權，虛竹是布衣而為駙馬，與大理王子結拜兄弟。國家的戰與和、民族的盛與衰、天下的興與亡，很大程度上居然決定在幾個超一流的俠客手中。</p>\n<p>一個鳩摩智，就能決定強大的吐蕃國的對外政策，書上說吐蕃國「是和是戰，多半可憑他一言而決」；一個蕭峰，能左右宋遼間的大國關係，他「官居遼國南院大王，手握兵符，坐鎮南京，倘若揮軍南下，盡佔南朝黃河以北土地，建立赫赫功業，進則自立為王，退亦長保富貴」。</p>\n<p>幾個江湖豪客開一個小會，就能操弄天下的興亡——在少林寺藏經閣裡，蕭峰父子、慕容博父子和鳩摩智幾大高手開會，商量的是什麼話題？是遼國、吐蕃、西夏、大理、大燕五國瓜分大宋！天下興亡大事，歷史轉折關口，居然全在幾個高手的股掌之中。</p>\n<p>試問幾百年後，《鹿鼎記》裡最強的歸辛樹、九難尼姑、洪安通等一幫人開個會，能搞出什麼名堂？</p>\n<p>《天龍八部》的時代裡，也有一些民間俠客投靠朝廷，但這只是一種鬆散的合作，沒有人身依附關係。比如西夏的一品堂招徠了「四大惡人」，最多算一種僱傭。而且打工的是爺，僱人的是孫子，幾大惡人想幹就幹，不想幹就走，西夏國能轄製得了嗎？鳩摩智當吐蕃國師，突然大徹大悟不想幹了，拍屁股走人，吐蕃拿他有什麼辦法？</p>\n<p>那時候的俠客，能力絕對強勢，身份絕對超脫。充分的競爭和寬鬆的環境，造就了武學的極大繁榮，神奇武功層出不窮，高手們一峰更比一峰高，甚至接近魔幻。「八荒六合唯我獨尊功」可以返老還童，北冥神功隨意吸人內力，六脈神劍用氣劍殺人，一片百花齊放的景象。</p>\n<p><span>【二】</span></p>\n<p>到了宋元年間的《射鵰英雄傳》《倚天屠龍記》時代，情況已經起了變化。</p>\n<p>朝廷對民間高手的吸引力在增強，比如沙通天、彭連虎、侯通海甚至歐陽鋒都一度加入金國王子完顏洪烈的幕府。完顏洪烈等官方領袖對江湖高手們固然十分客氣，表面上平起平坐，以「老師」稱呼之，但除了對歐陽鋒之外，他的姿態和身份已經不像合作者，而隱隱是老闆和領袖，「主」和「從」的關係逐漸形成。</p>\n<p>當然，這些高手們絕不是他的廝養傭僕。他們不受朝廷束縛，沒有職位品級，隨時可以退出。更重要的是，他們似乎並不一心向往衙門，就算是二流人物沙通天等人，也仍然保留著江湖上的一絲驕傲。如果官府讓沙通天放棄當「鬼門龍王」，而去充任一個官職，他大概並不會很情願，也不會很以為榮耀。所以我們照樣可以看到，洪七公去皇宮吃「鴛鴦五珍燴」，如入無人之境；楊過帶人毆打南宋宰相丁大全，也很讓人痛快。</p>\n<p>到了《倚天屠龍記》的元代，一些江湖俠客淪為廝養的苗頭開始出現。最極端的比如汝陽王郡主手下的阿大、阿二、阿三等人，已經是徹底的家奴。他們所謂的「八臂神劍」「丐幫長老」等民間身份已成為次要的裝點。</p>\n<p>但即便在這個時代，以劉元鶴為代表的朝廷武士們也遠沒有完成逆襲。江湖中人在取向上也仍然並不都以入幕當官為榮，反而仍然覺得投靠朝廷不太光彩。</p>\n<p>比如《笑傲江湖》裡，衡山派的俠客劉正風金盆洗手，退出武林，花錢捐了一個「參將」的官做，立刻被武林同道集體鄙視：好好的劉三爺不當，跑去捐官，太沒出息了。劉正風辯解說，自己去當官是為了「自汙」——更說明江湖上普遍認為做鷹犬是不體面的事。</p>\n<p><span>【三】</span></p>\n<p>到了《碧血劍》《雪山飛狐》《鹿鼎記》的年代，形勢急轉直下，江湖人士迅速地屌絲化，封建朝廷已經膨脹成一隻擎天巨手，可以輕易把江湖搓圓捏扁，俠客們開始紛紛去擠官路謀求出頭。</p>\n<p>《鹿鼎記》裡的武林高手，多是廝養家丁，人人頭上似乎都插著一面小旗，其身份統屬一望即知。有的是清廷的，有的是臺灣地區延平郡王府的，有的是平西王府的，有的是沐王府的，一個個活像軍棋裡的軍、師、旅、團、營、連、排長，在棋盤上打來打去。韋小寶貌似超脫格局之外，不按套路出牌，其實他的本質也就是個工兵，飛來飛去地給主子挖地雷而已。</p>\n<p>《鹿鼎記》時代的頂級高手們都是些什麼角色？放眼望去，一個個遠離權力核心，鄉氣十足，要麼為封建權貴充當打手，要麼奔波半生、碌碌無為。</p>\n<p>貌似全書武功第一的神龍教洪教主，不過是僻處一隅的土霸王而已，只能在荒涼小島上作威作福，後來拼命搞投機，也不過是羅剎國的馬前小卒；江湖第一號正面英雄陳近南，大半輩子碌碌無為，最後命喪宵小之手；「神拳無敵」歸辛樹，去充當平西王府的刺客，稀裡糊塗地被一群宮廷侍衛活活堆死，吳三桂甚至根本就不認識這個人；「一劍無血」馮錫範，充當他人打手，名義上是高階武官，其實是保安隊長，最後被清廷權貴輕鬆設計害死；「獨臂神尼」九難，最不知所云的一位高手，做事顛三倒四，完全不知道她在忙活什麼。</p>\n<p>他們可能影響半點王朝大事？可能改變半點歷史走向？不能。讀罷《鹿鼎記》全書，你覺得最威嚴、最有權勢的人是誰？無可置疑——半點武功都不會的康熙啊！</p>\n<p><span>【四】</span></p>\n<p>清代武林，官府的力量可以直接插手江湖事務，左右武林格局。短短幾萬字的《雪山飛狐》裡，朝廷的武師在江湖上橫衝直撞，小小一個「御前一等侍衛」劉元鶴，在書上是多麼威風，只要一表露身份，就江湖豪傑們個個「驚懼」。</p>\n<p>劉元鶴上門去找江湖大佬田歸農，田歸農「十分歡喜，說道‘貴客上門’」——你能想象在《天龍八部》或者《射鵰英雄傳》裡，小小一個侍衛能有這種待遇嗎？能讓武林大豪們「驚懼」嗎？光是《射鵰英雄傳》裡的牛家村曲三，就像殺雞一樣不知殺了多少個劉元鶴般的宮廷侍衛。</p>\n<p>當時江湖上最大的「腕兒」，是金面佛苗人鳳。對這位民間最重量級的人物，清廷是什麼態度？在書上，苗人鳳的女兒頭上插了一個釵子，是尋寶的線索。旁邊在座的江湖大佬們懼怕他爹的威名，無人敢於動手，然而唯獨區區一個侍衛劉元鶴例外。他「向眾人橫眼一掃，臉露傲色，走到苗若蘭面前，右手一探，突然將她鬢邊的珠釵拔了下來」。官府裡的小角色，竟視民間領袖如無物。</p>\n<p>而後，清廷居然還敢組織一幫殺手去圍剿苗人鳳，而且還差點兒得手——我們不可想象，在《射鵰英雄傳》裡，南宋朝廷組織一幫人去殺黃藥師，或是在《笑傲江湖》裡，朝廷組織一群人去殺任我行試試？</p>\n<p>幾百年前的周伯通、楊過們，還享有著和封建王朝不合作的自由。江湖的天地廣闊，可以任由他們去遊戲人間。但幾百年後的胡一刀、苗人鳳們同樣是蓋世高手，江湖上卻已經沒有清廷不能覆蓋的角落。哪怕在遼東邊遠的大雪山、在百丈高的天險玉筆峰上，也會有賽總管、劉元鶴們的身影。不合作者唯有被封建王朝收拾，不管是浪漫偏激的大俠胡一刀，還是沉默無害的大俠苗人鳳。</p>\n<p>學成文武藝，貨與帝王家。當桃花島沒有了，白駝山沒有了，躋身封建王朝成了武林人士的唯一出路，江湖當然就慢慢失去活力，神奇的武功逐漸消亡。一方面，高手們不再去鑽研武學，而是整天盯著劉元鶴大人們，憤憤於他們的庸庸碌碌，抱怨自己的仕進無門。另一方面，劉元鶴大人們也十分委屈和憤怒，認為自己原本是精英，卻被封建朝廷生生揉捏成庸人。</p>\n<p>於是，衙門內外的武師們互相仇恨，隔著一道門對罵：「有種你出來！」「有種你進來！」微妙的區別在於，在那個古代社會，裡面的人多數並不大真心想出去，而外面的多數人真心想進來。</p>"},{"title":"英雄，能否做得從容","content":"<h2 id=\"sigil_toc_id_20\"><span>英雄，能否做得從容</span></h2>\n<p><span><span>光有一身好武功，卻不贏下大舞臺，是不能名垂史冊的，就像金庸不惜寫下卷帙浩繁的「郭靖世家」，卻沒有一部「裘千仞列傳」。</span></span></p>\n<p>小時候看三國，常常對一件事難以釋懷，那就是斬顏良。</p>\n<p>鑑於讀者特別是女士們對打打殺殺的故事不一定熟悉，我解釋一下：顏良是《三國演義》裡一個著名武士的名字。在一場戰役中，他遭遇了同時代的另一個著名武士關羽。</p>\n<p>按照古代戰場上的禮儀，顏良打算詢問對方的來歷和姓名——「方欲問」。但關羽顯然並未遵循這一禮節，而是藉助優良的戰馬，發動了一場頗不紳士的小突擊。在小說的設定中，關羽的馬匹有著摩托車般的速度，使顏良措手不及，竟然被殺死。</p>\n<p>幼小的我怎麼也想不通：明明武藝相當的兩個人，因為一場不甚光明正大的戰鬥，戰敗者顏良從此淪為陪襯，戰勝者關羽卻獲得巨大的榮耀，生前身後不斷被加封，最後竟然封到「蓋天古佛」。我小小的心靈在喊：那不公平。</p>\n<p>這場戰鬥也給顏家的後人留下了痛苦的記憶，數百年裡他們始終想不通。後來的《顏氏家訓》專門訓示子孫不要從事武職，教訓就是「齊有顏涿聚，趙有顏最，漢末有顏良，宋有顏延之，並處將軍之任，竟以顛覆」。</p>\n<p>無獨有偶，作為暢銷武俠小說作家的金庸也有著類似的幼年心靈創傷。</p>\n<p>在《袁崇煥評傳》裡，金庸回憶說，幼年讀《荷馬史詩》，讀到《伊裡亞特》裡赫克託爾和阿喀琉斯繞城大戰這一段，見眾天神拿了天平來稱這兩個英雄的命運，結果赫克託爾這一端沉了下去。這意味著他必須戰敗而死，而阿喀琉斯會贏得光榮。小金庸感到非常難過，叫喊著：「那不公平！那不公平！」</p>\n<p>幼年的男孩子也許都特別看重一種公平：同樣的武功，就應該贏得同樣的榮耀。</p>\n<p>但隨著年齡的增長，這種信念備受打擊。同樣的武功，並不總是帶來同樣的光榮，就像葉孤城和西門吹雪，後者的聲名和成就要輝煌得多，儘管他未必是前者的對手。</p>\n<p>類似的例子比比皆是。在相對最講究硬實力的競技體育，我吃驚地發現，單說腳底下的本事，裡克爾梅未必不如齊達內，迪烏夫那兩下子未必不如舍甫琴科。</p>\n<p>十幾年前的一個晚上，我偶然看了一場葡萄牙對義大利的低年齡隊決賽，葡萄牙兩個孩子給我印象最深，一個是技術花哨的邊路球員，油頭粉面；一個是老辣早熟的中場球員，很帥氣，長髮，戴著髮箍，看上去前途無量。後來那個花哨的邊路就是C.羅納爾多。而那個中場呢？不知道淪落到哪去了，鬼知道他叫什麼名字。</p>\n<p>又比如教育和考試。前幾天和一個老鄉聊起高考，她是那年某個地市的文科狀元，我驚訝地發現，她考數學居然從來都放棄最後一道圓錐曲線題。這在我看來是忍無可忍、嚴重有損學霸尊嚴的行徑——難道志在當學霸者不該從第一道三角函式一直擼到最後一道圓錐曲線然後交卷嗎？她不，但她高考的總分卻比我高。</p>\n<p>無數現實讓我逐漸低頭：人生的拳臺上，榮譽之神不愛看點數，而更愛看誰最終站立或者倒下。就像巴西世界盃，梅西把最後一個定位球跩上天空，也就此失去了比肩老馬的可能。一個聲音向我嘶吼著：開啟幼年的心結吧！英雄的桂冠不是易得的，除了要練就好武功，還要贏下大舞臺。</p>\n<p>也許只能這麼理解——我們每個人都像一隻只不由自主的落水狗，被拋在命運的汪洋裡。有的狗天生倒黴，入水的姿勢就不對，直接被拍死在海面上，再驍勇也是白費；其他僥倖順利地下了水的，也瞬間被激流衝向四面八方。</p>\n<p>它們只能拼命狗刨，划水，求生。一些狗天賦異稟，極其善於游泳，但卻生不逢時——它們要麼落水的位置錯了，要麼游泳的路線錯了，要麼洋流的方向錯了，它划水的前方註定沒有島嶼，哪怕奮力游出一千里、一萬裡，也只有嗆水死掉。</p>\n<p>在深深的海底，不知道埋葬了多少默默無名的猛犬。</p>\n<p>只有少數既善於游泳、又碰巧撞上了合適的風向水文的狗，才能僥倖遇到汪洋裡的小島。它們喘息著上了岸，抖擻精神，稱霸這方寸之地，面朝大海咆哮。這樣的幸運狗，我們叫它們英雄。</p>\n<p>顏良和關羽，就是兩隻尚算幸運的猛犬。他們都生在暴力為王的烽火年代，迎來了展示個人專長的絕佳機會。在命運的汪洋中，這兩隻猛犬從幾乎同樣的距離遊向同一座島嶼，誰先登陸，誰就成為牛逼的獒王。這座島嶼，就是他們相遇的白馬之戰。</p>\n<p>可惜顏良卻對這個舞臺不夠珍惜，他沒有意識到這是人生命運的關鍵之戰，而關羽意識到了。於是，漫不經心的人被殺死，更渴望勝利的人存活，我們有什麼理由不把更多的崇敬贈予後者呢？</p>\n<p>我慢慢地變節了。成王敗寇是一種殘忍的公平，但英雄們自己似乎也認可這種公平。翻開江湖的歷史，每一個英雄都不滿足於練就好武功，而是畢生追求著贏下一個屬於自己的大舞臺，就像華山之於王重陽，襄陽城之於郭靖，光明頂之於張無忌。</p>\n<p>他們似乎從來不曾想：「我已經夠了！我的戰鬥力已經達到九十了，這不是最大的成就嗎？我何必非要贏下什麼呢？」</p>\n<p>另一個變節者，是那個小時候曾經為赫克託爾傷心難過的金庸。他寫出了卷帙浩繁的《郭靖世家》，卻甚至沒有一篇《裘千仞列傳》。</p>\n<p>無可奈何中，我彷彿又看見那個為顏良鳴不平的孩子。也許這就是冥冥中的安排：它讓勝利者享受成年人的膜拜，而讓失敗者得到孩子們的溫情。這也算是一種公平吧！</p>\n<p>用一首高楓的老歌《做英雄》，送給所有汪洋中的落水狗們：</p>\n<p>尋歡之夜美酒月光有時去匆匆，</p>\n<p>綠燈紅燭歌舞昇平有時也無蹤。</p>\n<p>人如花樹這輩子能有幾個好夢，</p>\n<p>一張歡顏背後幾多雨和風。</p>\n<p><br/></p>\n<p>船上有帆湖中有浪人生旅途中，</p>\n<p>經得起風經得起雨方能見彩虹。</p>\n<p>別以為翻過一山，就路兒條條通；</p>\n<p>別以為躲過一浪，就可以放鬆。</p>\n<p><br/></p>\n<p>做英雄，能否做得從容，</p>\n<p>天地動，明朝又是何夢。</p>\n<p>做英雄，能否做得從容，</p>\n<p>攀頂峰，難得四大皆空。</p>"},{"title":"讀懂華山論劍","content":"<h2 id=\"sigil_toc_id_21\"><span>讀懂華山論劍</span></h2>\n<p><span><span>郭靖的「俠之大者、為國為民」這八個字，在理論高度上全面超越了上一代大佬王重陽的「行俠仗義、濟世救人」。當這八個字高高飄揚在襄陽城上時，郭靖才真正成了整個江湖的道義領袖、精神導師。</span></span></p>\n<p><span>【一】</span></p>\n<p>華山論劍，不但代表了南宋末年的武學巔峰，也是整個金庸江湖史上後無來者的盛事。</p>\n<p>非要打比方的話，武人們的華山論劍，歷史地位就像文人的那一次蘭亭雅集。我們壓根兒就沒看見過王重陽的真正身手，正如今天再也見不到《蘭亭序》的真跡，只能在一代又一代人的口耳相傳中想象傳奇。</p>\n<p>華山論劍一共有三次，每次間隔約為二十五年。金庸的書雖然反覆修改，但時間前後不搭的問題仍然不少，只能說三次論劍大致是1200年左右第一次、1225年左右第二次、1259年左右第三次。</p>\n<p>三次論劍，每一次都是有主題的，而且分別有一個明的主題、一個暗的主題。</p>\n<p>第一次論劍時的大背景，是宋金相持，一個北伐未舉，一個南侵無力。在宋朝這邊，寧宗皇帝剛剛解決完黨爭問題，還沒來得及騰出手對付金國；金國則正為蒙古的擴張煩惱不已，本來打算在西南、西北部挖些壕塹阻擋蒙古人，然而每修好一點就被風沙所平，白白折騰老百姓，所謂「無益於禦侮而徒勞民」。</p>\n<p>趁著時局平穩，武林得到了難得的喘息機會，開始了緩慢的重組和新生。此時的江湖上可謂山頭林立、派系眾多，四方豪傑像野草般恣意生長，跑馬圈地，充滿了一種「榛榛莽莽、天地初闢」的自由氣息。</p>\n<p>各路派系之中，有一些大的山頭，比如全真教山頭、桃花島山頭、白駝山山頭、大理段氏山頭；有小一點的山頭，比如黃河幫沙氏山頭、遼東長白山樑氏山頭、藏邊大手印山頭等，各自都蓬勃發展，稱霸一方。</p>\n<p>甚至一些弱小的勢力也能在夾縫中生存，例如「江南七怪」之流，他們沒有什麼重要的戰略資源（武功差），也從來沒有依附過什麼大的勢力，卻也都能割據一城一寨，揚名立萬。</p>\n<p>第一次華山論劍，就是這樣一種江湖格局的最好體現：參與的高手們頗有些五湖四海、不拘一格的味道，東至東海，西達西域，南極大理，北逾黃河，各方都有代表參加。論劍的過程也基本上是公平競爭，「五人口中談論，手上比武，在大雪之中直比了七天七夜」，沒有以多欺少的情況。而且大家只論武功，不論所謂的是非善惡，基本上沒有附會道義上的東西。最後，大家公推全真教主王重陽為第一。</p>\n<p>第一次論劍，明面上的主題是「九陰真經」，誰武功高，誰就拿去。而暗的主題，則是群雄逐鹿，是各大山頭第一次直接的實力大比拼。</p>\n<p>論劍之後，江湖上形成了一個較為穩固的「一超多強」格局，各大山頭初步劃定了勢力範圍，這就是大家耳熟能詳的「東邪、西毒、南帝、北丐、中神通」。在王重陽和全真教強大的武力威懾下，江湖上的各種矛盾暫時被壓制住，用周伯通的話說，就是「武林之中倒也真的安靜了一陣子」。</p>\n<p>第一次華山論劍後的格局有幾大特點：</p>\n<p>一是幾大山頭共同承認王重陽的超級地位，認可由他獨自佔有最重要的戰略資源《九陰真經》。</p>\n<p>二是五大山頭之間形成一種默契：互相之間沒有不可調和的矛盾，儘量不發生大規模的戰爭。偶爾，他們也有小規模、區域性性的摩擦，但絕不搞生死火併。</p>\n<p>三是部分山頭之間結成了一定的鬆散聯盟，比如北丐和南帝之間，南帝和中神通之間，都有一定的聯盟性質，還進行了一些重要戰略資源的輸送和交易。王重陽和南帝之間就互相交換了一陽指和先天功。</p>\n<p>如果王重陽長壽一些，這個由他肇建的江湖格局還會長久延續下去，那麼「射鵰三部曲」就不會是現在的樣子，北方蒙古草原上的那個苦孩子不會有成長為「大俠郭靖」的機會。</p>\n<p>然而，數年之後，這個「東邪、西毒、南帝、北丐、中神通」的格局很快就崩塌了。最主要的導火索就是王重陽的逝世。</p>\n<p><span>【二】</span></p>\n<p>過去，王重陽一直奉行的政策是「大陸均勢」，東邪、西毒、南帝、北丐幾大山頭誰也吃不掉誰，好讓全真教一家獨大。</p>\n<p>他也早就預料到了風險：一旦自己死去，這一格局將遭到嚴重的衝擊。因此，在油盡燈枯的最後日子裡，王重陽憑著超人的精力和才幹，運籌帷幄，做了大量的安排部署，試圖把他生前苦心肇建的江湖格局保持下去。</p>\n<p>在人生最後的時間裡，王重陽佈置了這樣幾件大事：</p>\n<p>第一，他選擇了南帝作為盟友，不惜親自率隊出訪大理，甚至一度和南帝大搞軍火交易——互相教對方先天功和一陽指。</p>\n<p>第二，他不惜破壞「五絕」之間不作殊死格殺的默契，設計出了通過詐死誘殲歐陽鋒的行動，要對西毒實行肉體消滅。</p>\n<p>第三，他精心研發了高科技新式武器「天罡北斗陣」，爭分奪秒地在全真教裡推廣，希望通過武器和戰法的先進來彌補「全真七子」單兵作戰能力的不足，以便在自己死後使全真教繼續保有「一超」的地位。</p>\n<p>這些安排都很有遠見，證明瞭王重陽雄才大略，確實乃一代人傑。然而結果卻事與願違。這三個部署均告破產。</p>\n<p>最先破裂的，是他苦心孤詣和南帝建立的聯盟。按他先前的設計，如果這個聯盟維持下去，確實可以對西毒形成絕對強勢的壓制。但因為一起非常偶然的事件，這個聯盟失敗了——他的師弟周伯通和南帝的妃子劉瑛姑私通。私通也就罷了，而且還生了孩子。</p>\n<p>表面上，王重陽和南帝很好地處置了這一事件，南帝大度地表示，願意把劉瑛姑送給周伯通為妻。但事實上它的後果是非常嚴重的。南帝為此頹然出家，幾乎完全退出了壓制歐陽鋒的計劃，聯盟事實上宣告破裂。</p>\n<p>此後，全真教和大理段氏兩大集團越來越疏遠，甚至到了老死不相往來的地步。讀者們不難發現，到了《神鵰俠侶》，這兩大集團之間已幾乎沒有什麼實質性的直接往來了，更不可能互相賣軍火——你能想象朱子柳把一陽指教給郝大通嗎？</p>\n<p>至於對西毒的誘殲行動，也是功敗垂成。王重陽躲藏在棺木裡，一躍而出，成功地一指重創歐陽鋒，破了蛤蟆功，對他產生了一定的震懾效果，但卻沒有形成毀滅性打擊。更可怕的是，這一次行動開啟了潘多拉魔盒的蓋子——「五絕」之間也可以發動生死決戰了。</p>\n<p>此外，他精心研發、寄予厚望的「全真七子＋天罡北斗陣」，雖然神妙，但終究無法和東邪西毒等大山頭抗衡。「天罡北斗陣」的峰值戰鬥力挺強，但僅僅存在於理論意義上。它受人員、地域等不確定因素的限制太多，對東邪、西毒等人而言，別說與之並駕齊驅了，連起一點側面牽製作用都很勉強。</p>\n<p>武器和戰法的精良，不能彌補人員素質的巨大差距，這一點已經在金庸江湖的歷代搏殺中被證明。張三豐的「真武七截陣」在紙面推演上實力強大，但自從研發成功以來，根本就沒機會投入實戰；大理天龍寺的「六脈神劍陣」理論上天下無敵，然而碰上鳩摩智，還是被攪得一塌糊塗；至於全真几子後來閉關研發出來的「七星聚會」……不提也罷。</p>\n<p>王重陽一去，留下了巨大的權力真空。武林亂局重啟，新的格局呼之欲出。</p>\n<p>各大山頭之間的衝突不斷升級，矛盾逐漸不可調和，連「五絕」這個層次之間都連續上演生死惡戰。這其中有：東邪重創並囚禁周伯通；西毒畫「割肉飼鷹圖」害南帝，打傷古墓派的林朝英傳人，並重創北丐；東邪惡鬥全真七子；西毒打死江南五怪並嫁禍東邪……江湖上血雨腥風，惡鬥連連。</p>\n<p>一些過去的二流勢力也加入了角逐。例如鐵掌幫，過去因為幫主裘千仞的鐵掌功夫尚未大成，這個幫會也並未躋身一流。但此時，隨著裘千仞武功臻於圓熟，開始圖謀北方新霸主地位，對北方的傳統老霸主「北丐」山頭髮起挑戰。他跑到丐幫君山大會上去砸場子，提出的要求之一，就是要讓丐幫讓出北方，退到黃河以南。</p>\n<p>也正是因為這一場亂局，讓一支新生力量得以悄悄地萌芽、滋長，左右逢源，一躍成為新的統治者。</p>\n<p>這一支新生力量，通過兩次「華山論劍」的契機，最終登上王座，一統江湖，這就是「郭靖—黃蓉」聯盟。</p>\n<p><span>【三】</span></p>\n<p>簡單剖析一下「郭靖—黃蓉」分別代表的勢力：</p>\n<p>郭靖代表的最重要勢力是全真教山頭。不但周伯通是他的義兄，「全真七子」中影響力最大的三個人——馬鈺、丘處機、王處一也都是他的老師。黃蓉的背後則是桃花島山頭，這無須多言。</p>\n<p>郭、黃還共同拉攏並分享了一些強大的資源，包括北丐山頭和南帝山頭。郭靖和黃蓉同時成為北丐洪七公的徒弟，又一起籠絡了南帝一燈大師。五絕之中，郭黃已得其四，強大的聯盟隱隱成形。</p>\n<p>所以說，有了郭靖和黃蓉的江湖，是一個並不精彩的江湖。後來的華山論劍又哪裡還有什麼「論劍」？不過是「郭黃聯盟」的牌桌而已。</p>\n<p>細心的讀者會發現，「郭黃聯盟」開始給華山論劍設定門檻，不斷把異己勢力排除在外。二十五年前第一次華山論劍「五湖四海、不問來歷」的宗旨，到這個時候已經被逐漸拋棄了。</p>\n<p>比如裘千仞，就被莫名其妙地拒絕參加第二次華山論劍，理由是他的道德水平低。洪七公對裘千仞說的一番話最有代表性：「你上得華山來，妄想爭那武功天下第一的榮號，莫說你武功未必能獨魁群雄，縱然是當世無敵，天下英雄能服你這賣國奸徒嗎？」</p>\n<p>這話貌似有理，然而有一處卻說不通：二十五年前，在王重陽、洪七公們參加的第一次華山論劍裡，為什麼裘千仞又是被主動邀請的物件呢？待到「郭黃聯盟」高高樹起道義的旗幟，裘千仞就因為「人品壞」，所以連參加論劍的資格都被稀裡糊塗地剝奪了？</p>\n<p>或者有人說，二十五年前裘千仞還沒有顯露惡跡，還沒有通敵賣國、投靠金人。那麼歐陽鋒的境遇更能說明問題。他可一直以來都是老毒物，但在兩次華山論劍上，他受到的待遇有天壤之別。</p>\n<p>在第一次華山論劍上，西毒得到了公平的對待，沒有被人群毆。而在郭靖黃蓉聯盟主導的第二次論劍中，歐陽鋒遭到車輪戰和圍攻，被黃藥師、洪七公、郭靖、黃蓉以各種方式修理，直到被搞發瘋。《射鵰英雄傳》原著中，連參與者都心中清楚：「這是合東邪、北丐二人之力，合拼西毒一人」。</p>\n<p>華山上已經不是爭什麼「武功天下第一」，而是一家子人存心在對付另一家子人。</p>\n<p>西毒瘋掉之後，江湖上再也沒有力量阻止「郭黃聯盟」的獨大。到了《神鵰俠侶》，「郭黃」已經成為一統武林的超級家族,全真教和丐幫是其部屬，桃花島是他們的後花園，南帝是他們的戰略同盟，陸家莊等是他們的金庫和財源。比如郭靖黃蓉開大勝關英雄大會，誰出的錢？陸家莊啊!書上說：「正廳、前廳、後廳、廂廳、花廳各處一共開了二百餘席。」「這日陸家莊上也不知放翻了多少頭豬羊、斟幹了多少罈美酒。」</p>\n<p>那些不服管束的魚蝦，如李莫愁等，不論平時多麼兇猛，一聽見郭靖黃蓉的嘯聲，只有望風而逃。</p>\n<p>家族聯盟坐大的典型特徵，就是可以不斷複製自己的勢力。比如丐幫幫主的位子，在魯有腳這個傀儡幫主手上過渡了一段時間後，傳給了誰？是郭靖的大女婿耶律齊。有些人不識相地跳出來想分一杯羹，攪亂郭黃聯盟的內部權力交接，比如霍都，結果如何？</p>\n<p>郭黃聯盟還在繼續擴大勢力，不斷地散枝開葉。比如郭靖把侄兒楊過千里迢迢送到哪裡去深造？是全真教。這不但可以鞏固和全真教的關係，而且能保證在周伯通、丘處機之後，全真教的後幾代徒眾裡仍然有郭黃聯盟的代言人。</p>\n<p>又比如郭靖收了誰做徒弟？是武修文、武敦儒兄弟。他們兄弟兩人品猥瑣、資質平庸，難道郭靖黃蓉看不出來？郭靖黃蓉真正看重的，是倆兄弟有南帝的背景，是一燈大師第二代傳人的親子。兄弟倆被郭靖收為徒弟，不但讓家族和南帝的關係更牢固，也算是郭黃家族向南帝勢力長期支援自己的一種回饋。</p>\n<p>聯盟坐大，雞犬昇天——即便是內部那些不爭氣的成員，也在家族勢力的庇護下快樂地生活著。</p>\n<p>比如柯鎮惡，過去他過的是什麼日子？掙紮在武林的最底層，武功低微，流竄江湖，到處受辱，連自己兄弟的命都保不住。現在搖身一變，成為德高望重的「柯大公公」，鹹魚翻身了，到處優哉遊哉，東走西晃，無人敢惹。就算遇上強敵如李莫愁，都不敢對他下殺手，最多微笑著恫嚇兩句：「柯老爺子，赤練神掌拍到你胸口啦！」可她敢發勁嗎？</p>\n<p>還有大小姐郭芙，一個半點兒生存能力都沒有的庸人，武功低微、又乏應變之才，還到處得罪人，如果放在三十年前的江湖上，早不知道死了多少次，也許早就被捆住放上歐陽克的大床了，或者是被參仙老怪給「雙修」了。</p>\n<p>但在郭黃聯盟的勢力威懾下，她就是活得好好的，安安全全、渾渾噩噩地長到三十多歲，沒碰到大的危險，和誰說理去？</p>\n<p><span>【四】</span></p>\n<p>一統江湖的最高層次是什麼？不止是擁有江湖上最強大的武力，還要引領江湖道義和話語權。難能可貴的是，經過近二十年奮鬥，郭靖黃蓉終於做到了這一點。他們樹立的主流道義觀念是八個字——「俠之大者、為國為民」。</p>\n<p>可以說，在此前的大勝關英雄聚會上，郭靖還不過是個望重武林的俠士而已；而當這八個字的旗幟高高飄揚在襄陽城上時，郭靖已經是整個江湖的道義領袖、精神導師。</p>\n<p>不得不佩服聯盟傑出的智囊和文膽——黃蓉。雖然在表面上，這八個字是從郭靖的口中和眾人見面的，但在幕後提煉出它們的，無疑是黃蓉。在當時的大背景下，這八個字最好地概括了郭靖黃蓉家族的功績：它能團結最廣大的江湖人士，讓他們聚集在自己的麾下。</p>\n<p>「俠之大者，為國為民」這八個字，在理論高度上也全面超越了上一代江湖宗主王重陽。相比之下，儘管王重陽也在抗金，也做了不少「為國為民」的事，但在理論上始終缺乏概括和提煉，他的口號仍然停留在「行俠仗義、濟世救人」上——這幾個字可不是我編的，而是王重陽親口說的。他批評師弟周伯通時，就說周伯通「少了一副‘濟世救人’的胸懷」。</p>\n<p>中原武林中，難道就沒有郭靖和黃蓉的異見者嗎？有的。有一些勢力就一直遊離在江湖主流之外，比如古墓派山頭。這是一支歷史悠久，又十分難纏的力量。在王重陽坐大時，這個山頭的領袖林朝英就選擇不合作；當「郭靖黃蓉」坐斷江湖時，這個山頭的代表人物楊過、小龍女等還是選擇不合作。</p>\n<p>尤其是楊過，原本是郭黃家族的成員，而且是郭靖極為看重的嫡系。郭靖送他去全真教拜師，本來是想讓他開一家分公司，沒想到楊過反而被另一家大企業古墓派獵獲，另立門戶，後來和郭家一度要決裂。</p>\n<p>《神鵰俠侶》裡，當一燈大師第一次見到楊過小龍女夫婦時，有這樣一段意味深長的評價：「這一對少年夫妻……我生平所遇，只有郭靖、黃蓉夫婦方能和他們比肩。」這是什麼意思？隱隱也是指楊過夫婦有抗衡郭黃夫婦、另立山頭的潛質啊！</p>\n<p>對於這樣一支不合作的力量，決裂嗎？消滅嗎？郭黃顯示出了武林第一家族的手腕和氣度：他們決定和古墓派山頭互相承認，求同存異。</p>\n<p>什麼叫互相承認？就是郭靖黃蓉承認楊過小龍女的逾越禮法、師徒可婚；而作為回饋，楊過和小龍女也承認郭靖黃蓉的「俠之大者、為國為民」，到襄陽參加抗蒙戰鬥，正式併入郭靖黃蓉家族的版圖。</p>\n<p>楊過不但重新成為郭黃家族的成員，還擔任了家族的重要職務——公關經理。江湖上的一些中間派人士，比如什麼人廚子、聖因師太、張一氓、百草仙、史家兄弟、煙波釣叟等，都是在楊過的公關努力下和郭黃達成同盟，到襄陽城效力的。</p>\n<p>最終，襄陽一戰，楊過擊斃蒙哥，幫助郭靖走上家族事業的巔峰。讓我們回到原著，看看當時有趣而又微妙的情景吧：</p>\n<p>「郭靖攜著楊過之手，拿起百姓呈上來的一杯酒，轉敬楊過」。「此時對飲三杯，兩位當世大俠傾吐肺腑，只覺人生而當此境，復有何求？」</p>\n<p>一杯酒中，包含了多少深意；而楊過的一句「郭伯伯」中，又蘊含著多麼複雜的內容。</p>\n<p>周公吐哺，天下歸心。一統江湖，是時候了。於是我們看到，郭靖黃蓉趁熱打鐵，率領江湖群雄再上華山，施行大典。當然，加冕之事不可名言，郭靖黃蓉提出上華山的理由是什麼呢？是想念恩師，要到華山祭掃洪七公之墓。這真是一個再堂皇不過的理由，任誰也挑不出毛病來。</p>\n<p>這個提議剛提出來，第一個出聲附和的就是楊過。原著中楊過馬上說道：「郭伯伯，我也正想說這句話，大夥兒一齊去如何？」隨即，一燈、黃藥師、周伯通等也紛紛表態支援，「都想念這位逝世的老友，齊聲贊同」。</p>\n<p>這一次上華山，可以稱為第三次華山論劍。它名義上的主題是祭奠洪七公，而它實質上的主題，是郭靖黃蓉聯盟一統江湖的加冕禮。它必須選在武林的莊嚴聖地華山上。這一次論劍，沒有比武，沒有角鬥，大家經過其樂融融的商量，產生了新版本的「五絕」——東邪、西狂、南僧、北俠、中頑童。</p>\n<p>新版的「五絕」，明顯沒有舊版的自然妥帖。舊版是「東邪、西毒、南帝、北丐、中神通」，可謂實至名歸，「東邪」確實在東海，「西毒」也的確在西域，南帝的確在大理，北丐也是在黃河以北抗金。而新版的「五絕」則顯得很牽強：楊過為什麼是「西」？僅僅因為是西毒的義子？似乎說不通；郭靖的「北」似乎有些道理，他成長在大漠，但主要功業卻是在華中的湖北襄陽；周伯通也很難說是什麼「中」，他浪蕩天下，四海為家。</p>\n<p>事實上，在這個時候，東南西北已經無所謂了。新版本「五絕」的真正意義是：東邪是父，西狂是侄，南僧是師，北俠是夫，中頑童是兄。都是這一家子人，你說東南西北還重要嗎？</p>\n<p>數十年過去，華山論劍終於從五湖四海的英雄爭霸，變成了一家人其樂融融的內部聚會；那所謂東南西北的名號，也從天下豪傑誓死爭奪的地盤和版圖，變成了郭靖黃蓉聯盟內部商量著分的蛋糕。可嘆其他那些足夠躋身「五絕」的人，那些和郭靖黃蓉唱反調的人，如歐陽鋒、裘千仞、金輪法王等骸骨朽矣。</p>\n<p>如果郭黃家族有紋章，那麼一定是這樣的：上空飛舞著雙鵰，背景是巍峨的華山，襯底的是雄偉的襄陽城。</p>\n<p>在《神鵰俠侶》的結尾，有一群人，武功很差，卻還想效仿先賢，跑到華山上來「論劍」，最後在楊過的長笑聲裡屁滾尿流跑下山。</p>\n<p>其實不能怪他們武功低微——他們實在是沒地方學。那個時代最好的武功，降龍掌、打狗棒、先天功、一陽指、九陰真經、玉女心經、彈指神通……哪一樣不是盡數在郭黃聯盟的武庫中呢？家族過去沒有的神功，要麼通過種種渠道被收入武庫，比如蛤蟆功、鐵掌功、玉女心經，就由楊過、郭襄、完顏萍等學會了；要麼像龍象般若功一樣，隨著主人永遠長眠地下。</p>\n<p>所以，這些人從華山上被趕下來以後，肯定很疑惑——俺們倒是想從此發奮，好好練武，但除了山上那一家子人，天下哪裡還有剩下的好武功呢？</p>"},{"title":"英雄志","content":"<h1 id=\"sigil_toc_id_22\"><span><span>英雄志</span></span></h1>\n<p><span>閒話英雄，是專屬於凡人的樂趣。</span></p>"},{"title":"當餘滄海攻入群玉院","content":"<h2 id=\"sigil_toc_id_23\"><span>當餘滄海攻入群玉院</span></h2>\n<p><span><span>餘滄海不好意思質問別人「殺人全家，是什麼行徑」，也不好意思質問別人「搶人錢財，是什麼行徑」，想來想去，最保險的辦法就是質問別人嫖妓宿娼。</span></span></p>\n<p>金庸小說裡，有一段很有意思的情節，就是餘滄海先生掃蕩聲色場所群玉院。</p>\n<p>當時的江湖，名義上在封建王朝的管轄下。眾所周知，當時的社會中黃賭現象較為氾濫，而封建官府普遍性不作為，名門正派的俠士們便擔負起了一定的社會責任，比如主持江湖道義、維護公序良俗、肅清不良風氣,等等。而在眾多以掃黃聞名的大俠中，第一位當數青城派掌門餘滄海餘大俠。</p>\n<p>餘掌門德高望重、一派宗師，仗劍攻入衡山群玉院，大快人心。要知道，這群玉院乃是「衡山城首屈一指的大妓院」，背景深厚，後臺多半是五嶽劍派之中大名鼎鼎的衡山派。</p>\n<p>餘掌門疾惡如仇，率眾殺將進窯子去，「將妓院中龜頭和鴇兒打得殺豬般叫」，弄得旁邊的地頭蛇——衡山派大佬劉正風劉三爺很下不來臺，只好賠笑：「這間妓院藏垢納汙，兄弟早就有心將之搗了。」劉三爺的話聽著好虛偽。這麼多年了，群玉院日益興隆，你倒是搗了沒有？</p>\n<p>有趣的是，在《笑傲江湖》裡這一次最嚴厲的掃黃中，餘滄海掌門還在群玉院裡撞見了華山派大弟子令狐沖。餘掌門向他發出了振聾發聵的正義質問：「嫖妓宿娼，是什麼行徑？」</p>\n<p>食色性也。江湖人士們的風流行徑，大概有三種檔次和境界。</p>\n<p>第一檔是歐陽鋒級別的。他到桃花島上做客，向黃藥師送禮，一出手就是「三十二名處女」，而且是「派人到各地採購來的」，「曾由名師指點，歌舞彈唱，也都還來得」。</p>\n<p>這才是大佬級的享受——服務是定製型的服務，娛樂場所是優美的桃花島，朋友是高雅的黃藥師，琴簫相伴，落英繽紛，碧海環抱，連服務人員都是桃花島著名的啞僕，也就是聾啞人，絕對安全隱秘。那些只會在低檔場所狂嫖濫飲的田伯光之流，連做夢都夢不到。</p>\n<p>第二檔是餘滄海級別的。他也絕對不會逛窯子。用書上的話說，因為他「大老婆、小老婆著實不少」，連徒弟們打劫了大土豪福威鏢局，都要專門留一包珠寶「孝敬眾位師孃」。</p>\n<p>第三檔是韋小寶級別的，逛的是少室山下的潭頭鎮妓院，眾妓女都是些「粗手粗腳的庸脂俗粉」，「或濃眉高顴，或血盆大口，比他自己還著實醜陋幾分」。韋小寶還「得意揚揚，拉過身邊一個妓女，在她嘴上一吻，只覺一股蔥蒜臭氣直衝而來，幾欲作嘔」。</p>\n<p>那個江湖上的格局就是，玩定製的歐陽鋒看不起玩姨娘的餘滄海；而玩姨娘的餘滄海則又會鄙視逛窯子的韋小寶，就像他質問令狐沖一樣：「嫖妓宿娼，是什麼行徑？」</p>\n<p>作為當時封建社會裡的名門正派的大俠，餘滄海老師必須時不時質問一下別人，不然怎麼主持正義。套用一個流行的詞語「合法性」，質問封建社會裡的不公，就是那個時代大俠們合法性的來源。</p>\n<p>但他實在不好意思質問別人「殺人全家，是什麼行徑」，因為他殺過林鎮南全家；也不好意思質問別人「搶人錢財，是什麼行徑」，因為他侵吞人家福威鏢局的財產；也不好意思質問別人「奪人武功，是什麼行徑」，因為他搶過人家的辟邪劍譜。</p>\n<p>想來想去，最保險的辦法就是質問別人嫖妓宿娼，甚至可以正氣凜然地攻入群玉院——魔教我搗不了，東方不敗我打不過，「白板煞星」「塞北明駝」之類的壞蛋我不願惹，但難道群玉院我也搗不了嗎？你看我至少可以「將妓院中龜頭和鴇兒打得殺豬般叫」。</p>"},{"title":"慕容復的教訓","content":"<h2 id=\"sigil_toc_id_24\"><span>慕容復的教訓</span></h2>\n<p><span><span>慕容復同學一邊辛辛苦苦地「找朋友」，另一邊卻不斷錯過了那些送上門的朋友，那些真正能幫助他謀幹大事的好朋友。</span></span></p>\n<p>我們曾經有過一個說法，叫作「四有新人」：有理想、有道德、有文化、有紀律。翻遍金庸全集，能稱得上「四有新人」的鳳毛麟角——郭靖有理想沒文化；段譽有文化沒理想；狄雲是理想文化都沒有；令狐沖不但沒理想、沒文化，好像還沒紀律；韋小寶更可怕，四個都沒有，簡直是四冇新人。</p>\n<p>江湖上能算是「四有新人」的，首推慕容復：文武全才，嚴格律己，勤勤懇懇，一心只為興復大燕國而奮鬥。然而，這個「四有新人」的事業卻最失敗，復國大業始終停留在口頭上，連個架子都沒拉起來就失敗了，下屬星散，自己還發了瘋。要知道，上述那些綜合素質遠不如慕容復的金書主角里，哪怕混得最差的狄雲，最後好歹還當了個雪谷的谷主。</p>\n<p>慕容復的失敗，原因有很多：武功不夠登峰造極、缺乏實幹才能、復國的口號缺乏號召力，等等。但我覺得最關鍵的是，他選擇了一條不適合自己性格的成功道路。</p>\n<p>慕容複選的道路，是廣泛發動和團結江湖底層俠客，搞「一大片」，讓草根群雄都到他的「大燕復國公司」裡來投資入股。</p>\n<p>這條底層路線本身並沒有問題，金庸書中至少有兩個男一號都用過，而且效果不錯：比如楊過靠籠絡西山一窟鬼、萬獸山莊、人廚子、聖因師太、煙波釣叟等眾多江湖中下層勢力，隱隱然成為與郭靖相當的一方霸主；又比如令狐沖糾集四方群豪攻打少林寺，一路上招兵買馬、藏汙納垢，迅速成為江湖上炙手可熱、舉足輕重的一支新興力量。</p>\n<p>但是這條路，楊過可以走——他雖然性子桀驁，但出身底層，小時候是在破窯裡長大的，十幾歲前都在偷雞摸狗，天然地容易博得中下層人士的認同；令狐沖也可以走——他雖然出身名門正派，但為人疏懶，不擺架子，好打交道。然而慕容復卻走不通。</p>\n<p>慕容復的性格，太過孤傲耿介。在交朋友的時候，他往往想俯就卻不肯折節，欲禮賢卻不能下士。而且他公子王孫的味兒太濃，很難融入江湖底層的圈子——一個使用著妖嬈的丫鬟，家裡叫作什麼「燕子塢」、連丫頭住的房子都要叫什麼「琴韻小築」「聽香水榭」的人，怎麼可能和那些摳腳挖鼻的粗魯豪傑們打成一片？</p>\n<p>慕容復每次去江湖上「交朋友」，費了不少勁，結果都鬧了個不歡而散。他幫三十六洞主、七十二島主攻打靈鷲峰，不能說不出力，最後卻鬧得翻臉成仇，怏怏下山；他在少林寺討好中原群豪，出頭挑戰蕭峰，卻遭遇人生最大敗仗，非但沒落上個好，反而成了笑柄。</p>\n<p>最可惜的是，慕容復同學一邊辛辛苦苦地「找朋友」，另一邊卻不斷錯過了那些送上門的朋友，那些真正能幫助他謀幹大事的好朋友。</p>\n<p>例如蕭峰對慕容復，一直是傾心仰慕的，對這位和自己齊名的人物念念於心。在無錫松鶴樓裡，蕭峰就把段譽誤認為是「南慕容」，存心結交；後來在杏子林裡，他又主動幫慕容復分辯冤屈，稱讚他的部屬公冶乾、風波惡等個個都是人傑，「慕容公子相交相處的都是這麼一干人，他自己能是大奸大惡、卑鄙無恥之徒嗎？」</p>\n<p>慕容復如果投桃報李，順水推舟，結交了蕭峰這個朋友，在蕭峰落魄的時候聲援一下、幫助一把，豈不是得了一個強援？後來蕭峰在遼國做南院大王，更是何等大的一個臂助？「南慕容」和「北喬峰」訂交，又豈不是武林一段佳話？</p>\n<p>但慕容復卻偏要沒來由地和蕭峰鬧翻，在少林寺，明明無冤無仇，還當眾出頭找人家打架，活活把這天下第一條好漢搞成自己的對立面，最後只落得一句：「蕭某大好男兒，竟和你這種人齊名。」</p>\n<p>又如段譽，他對慕容復一直崇拜尊敬，何況段譽苦戀王語嫣，正好是慕容復結交他的良機：你不是胸懷大志、不戀女色嗎？何不乾脆成全了段譽，用表妹收服了他，哪怕表面上為他泡妞出把力，這個大理國王子豈不是送上門來的臂助？當年《三國演義》裡李儒怎麼勸董卓的？「今貂蟬不過一女子，而呂布乃太師心腹猛將也。太師若就此機會，以蟬賜布，布感大恩，必以死報太師。」</p>\n<p>但他就因為「吃醋」這麼小兒科的原因，生生把段譽搞成仇人，還沒來由地一招「夜叉探海」打傷段譽老爸。這何其糊塗：你那麼辛苦地追求西夏公主，又何必那麼輕易地得罪大理王儲？慕容復後來還去拼命巴結段延慶——拼命去認一個下野了、被流放的過氣太子做乾爹，卻無緣無故去得罪一個正當權、年富力強的在位王儲，這不是荒誕嗎？</p>\n<p>還有虛竹，他對慕容復，是禮敬客氣的。世界上沒有比虛竹再好交朋友的人了，何況他是逍遙派掌門、靈鷲宮宮主，儼然江湖一方宗主。靈鷲峰上，虛竹對慕容復十分傾慕，「竭誠挽留」，稱讚他「文武雙全，英雄了得」，要嚮慕容復請教。如果慕容復能夠屈尊留下來，和段譽一樣與虛竹大醉一場，結為兄弟，還怕他今後不給你出力嗎？但慕容復絕不！他非要和虛竹鬧個臉紅脖子粗，摔門下山。</p>\n<p>最後，我們的慕容復同志既沒拉攏群眾，又得罪了精英。他甚至還不如他爹——以慕容博之孤傲，還能有鳩摩智做好朋友；慕容覆在高手圈子裡卻沒有一個好朋友，放眼望去，全是仇人。</p>\n<p>所以說，成功之路本沒有對錯，只有適合和不適合。適合你性格的道路，再錯也是對的——破釜沉舟不合情理吧，但是項王去幹，就幹對了；不適合你性格的道路，再對也是錯的——相信群眾、依靠群眾沒錯吧？但慕容復去幹，就幹錯了。</p>\n<p>最近流行「眾籌」，慕容復的「大燕復國公司」就是個典型的眾籌失敗的教訓。我曾問一個朋友，「眾籌」和「要飯」的區別是什麼？她回答是一個是站著，一個是跪著。但其實要玩好眾籌，偏偏不能太在乎是站著還是跪著。</p>\n<p>告訴你一個事實，現在那些傲嬌地站著的大佬們，當初掙錢時都大多曾跪著過的。江湖多風波，舟楫恐失墜，你還想站著把錢掙了？你以為你是張麻子。</p>"},{"title":"再論慕容復的教訓","content":"<h2 id=\"sigil_toc_id_25\"><span>再論慕容復的教訓</span></h2>\n<p><span><span>慕容復「找朋友」時的最大的問題，在於他「只能下交、不能平交」，所以很難和一流的人士結成友誼。</span></span></p>\n<p>前文說過，慕容復是以一副「嚶其鳴矣，求其友聲」的姿態踏上江湖的，到處刻意結納江湖人士。然而有趣的是，到處「找朋友」的他卻從頭到尾沒有結交到一個好朋友。連他那同樣孤傲的老爸，都有一個鳩摩智做好朋友，唯獨慕容覆沒有好朋友。</p>\n<p>問題出在哪裡？他為什麼會一再錯過段正淳、蕭峰、段譽、虛竹這樣本可以成為好朋友的人？我認為他最大的問題，在於交朋友時「只能下交、不能平交」，很難和高層次的人士結成友誼。</p>\n<p>細讀《天龍八部》，我們會發現，慕容復所追慕和效仿的人格有兩種：一種是戰國時孟嘗、平原等諸公子般的禮賢下士，羅致四方豪傑；一種是韓信般的忍辱負重，能承受胯下之恥。</p>\n<p>在行走江湖時，每當他遇到地位比自己更低、能力比自己更弱的豪傑時，他的第一種戰國公子情結就要發作。這使得他往往能擺出求賢若渴、刻意結納的姿態，主動伸出橄欖枝。甚至面對江湖上的敗類和渣滓，他也頗能顯現出幾分不唯出身、不究過往、有交無類的胸襟。</p>\n<p>例如他遇見所謂「三十六洞主、七十二島主」，這群人都是江湖的中下層次人士，魚龍混雜，良莠不齊。對於結交這些人，慕容復的部下是明確反對的。他手下排名第一的家將鄧百川，江湖經驗豐富，為人也老成持重，就一力反對和這些人結交，「見這些人殊非良善之輩，與之交遊，有損無益」「連使眼色，示意慕容復急速抽身」。</p>\n<p>按說鄧百川的看法是有道理的，但慕容復不但堅持和這些人定交結盟，而且還說了一些很過頭的熱乎話，比如「有生之年，始終禍福與共，患難相助，慕容復供各位差遣便了」。明明和人家交情沒到這個份兒上，卻說出如此親密的話來，「簡直是結成了生死之交的口吻」。他的這一態度當然大出島主、洞主們的意料，所以「眾人彩聲雷動，紛紛鼓掌叫好」。</p>\n<p>這種交朋友的場景和狀態，是慕容復最喜歡、感覺最舒適的狀態——自己高高在上，眾星捧月；群豪粥粥在下，受寵若驚。</p>\n<p>不妨看看全書之中，凡是慕容復能夠主動地、愉悅地交朋友的幾乎全是類似的場景。比如在後來的少林寺大會上，他幾乎又是一模一樣地為群雄挺身而出，主動出頭挑戰武林公敵蕭峰，說什麼「為中原豪傑盡了一份微力，雖死猶榮」。和此前對那些島主、洞主所說的「禍福與共，患難相助」一樣，這也是一句沒來由的過頭話，取得的效果也是幾乎一樣的，「霎時間喝彩之聲，響徹四野」。</p>\n<p>許多讀者往往認為慕容復是一個心胸狹窄的人，容不得被冒犯，事實上並不完全如此。面對地位和能力不如自己的人，他往往顯得頗有容人之量，即便被嚴重冒犯、甚至人家要強姦他表妹也不以為忤。</p>\n<p>比如三十六洞主、七十二島主，冒犯他不能算少了，言辭無禮的比如「山中無猛虎，猴兒稱大王」「乳臭未乾的小子」「好笑啊好笑，無恥啊無恥」，還差點兒非禮了王語嫣，慕容復可以一概不往心裡去。這算不算是有容人之量呢？</p>\n<p>前文說到，除了戰國公子的禮賢下士外，慕容復喜愛效仿的另一種人格，是韓信的能受胯下之辱。大概是由於小時候父母的灌輸教育和自己攻書讀史的體會，他深深地認可「成大事者必受千磨萬折」，何況史書上有劉邦白登之圍、韓信胯下之恥的先例在前，讓慕容復覺得忍一時的恥辱無損於個人尊嚴。</p>\n<p>出於這種心態，看似無比高傲的他，有時卻能做出卑躬屈膝、毫無節操的事來。比如他為了復國，跑去認大理的廢太子段延慶做乾爹，在眾目睽睽之下「雙膝一曲，便即跪倒，咚咚咚咚，磕了四個響頭」。他的家將包不同對主人性格最為瞭解，一語道破了他的心事：「你只不過想學韓信，暫忍一時胯下之辱，以備他日的飛黃騰達。」</p>\n<p>當慕容覆在以極其屈辱誇張的行為巴結別人時，會是什麼心態？是含羞忍垢、覺得生不如死嗎？我看未必。我反倒覺得，在那一刻，他的心中會湧起強烈的自我認同，覺得自己正在效法古代成就帝業和霸業的先賢，進行著一項偉大的事業。旁人越覺得他屈辱、誇張，他的自我認同和滿足感大概就越強烈，自己越把自己感動得要死。</p>\n<p>如此看來，慕容復豈不應該是極會結交朋友、極討江湖人喜歡？答案偏偏是否定的。</p>\n<p>他有個最大的問題：每當遇見和自己地位相若、能力相近的人時，他便會本能地犯軸起來，覺得自己受到了威脅，失去了對雙方關係的主導權，繼而劣根性發作，腦筋短路，再也無法保持良好的心態。</p>\n<p>他與蕭峰、段譽、虛竹等江湖一流人士的翻臉幾乎全是這種情況。比如他和虛竹，兩人從無過節，虛竹對他也沒有任何冒犯，「見慕容復等要走，竭誠挽留」。慕容復的表現是什麼？「雙眉一挺，轉身過來，朗聲道：‘閣下是否自負天下無敵，要指點幾招嗎？’」</p>\n<p>這就是典型的犯軸的表現。表面上看，他反感虛竹，是誤以為他暗戀王語嫣。但之前三十六洞主、七十二島主甚至要強暴非禮王語嫣，不比虛竹的暗戀嚴重得多嗎？慕容復為了結納這幫爛人，居然能一筆勾銷、毫不在意，為什麼又偏偏容不得一個比洞主、島主們價值更大、更值得結交的虛竹？</p>\n<p>說到底，是那些洞主島主身份卑微、武功見識均低下，慕容復和他們結交，有一種凌居人上的快感。而虛竹顯露的武功不在他之下，勢力不在他之下，這都讓慕容復感到心虛和畏懼，覺得無法掌握二人關係的主導權，於是心虛轉而變為傲慢，逞強好勝的念頭剎那間壓過了交朋友，把什麼「廣交群豪」「謀幹大事，只嫌人少，不怕人多」的初衷都拋到九霄雲外去了。</p>\n<p>不妨看看書中，當虛竹伸來友誼的橄欖枝時，慕容復的拙劣表現：</p>\n<p>「虛竹連連搖手，道：‘不……不敢……’慕容複道：‘在下不速而至，來得冒昧，閣下真的非留下咱們不可嗎？’虛竹搖頭道：「不……不是……是的……唉！」慕容復站在門口，傲然瞧著虛竹……隔了半晌，慕容復袍袖一拂，道：‘走吧！’昂然跨出大門。」</p>\n<p>所謂的「傲然」「昂然」，不過是慕容復強撐面子的鎧甲而已，背後裹藏著多少心虛和茫然。</p>\n<p>他這種性格上的弱點，緣於家庭教育的畸形。慕容復的才貌、武功、家世、門第，都是《天龍八部》中的一流人選。然而父母親對他要求過高，總以「開國英主」「王霸雄才」來要求他，巨大的重壓，使他成了一個極其缺乏自信的人，說話做事總要往聖帝賢王、英才良將上靠，到故紙堆中去找佐證。</p>\n<p>如果是靠得上那些偉大人物的行為，比如平原君、信陵君們的禮賢下士，乃至韓信的忍辱負重，他就很樂意效仿，並覺得自己也在接近「偉大」；如果是碰上那些能力和人格足夠強大的武林同道，有可能危及他「人中龍鳳」「眾星捧月」的形象，他就本能地警惕起來，對人家由衷感到厭惡，把人家排斥在自己的圈子之外。</p>\n<p>他最後殺了家將包不同，直接導致了自己班底的反水和崩盤，原因之一固然是因為包不同反對他卑躬屈膝、巴結大理國廢太子，但也未嘗不是因為他失去了和包不同關係的主導權——一個平時對自己敬若神明的下屬，忽然開始有了不同意見，自己嘴上說不過他、氣勢壓不住他，只好惱羞成怒，撕破臉皮。</p>\n<p>這種「慕容復型性格」，在個人生活中，都常常有所體現。比如：有的人只喜歡和比自己能力弱的人混，沉湎於這種「眾星捧月」的感覺，遇上能力強的人就處不好；比如：慕容復對島主、洞主們的「折節下交」「患難相助」，慕容復對大理延慶太子的「忍辱負重」「卑躬屈膝」，都始終難以構建一個正常、有序、良好的生活圈子，交不到對等的好朋友。</p>\n<p>在我們的老話中，人們似乎常要面臨一種選擇——做「雞頭」還是做「鳳尾」？其實做「雞頭」不難，做「鳳尾」亦不難，最考驗人的，是能不能與人做平平常常的好朋友。</p>"},{"title":"石破天，壞江湖裡的好兵帥克","content":"<h2 id=\"sigil_toc_id_26\"><span>石破天，壞江湖裡的好兵帥克</span></h2>\n<p><span><span>《俠客行》這部童話告訴我們，在一個複雜的世界裡，做聰明人無疑是好事；但在一個過於複雜的世界裡，做一個笨人或許也是不壞的選擇。</span></span></p>\n<p>笨人，是小說裡永恆的題材。一些偉大的小說常常拿笨人當主人公，比如《戰爭與和平》裡的比埃爾，《巨人傳》裡的卡岡都亞，更嚴重一點的比如《巴黎聖母院》的卡西莫多，《堂吉訶德》的堂·吉訶德，都是不同程度上的笨人。</p>\n<p>中國小說家裡，最鍾愛「笨人」、把「笨人」題材玩得最好的，金庸算是其中之一。</p>\n<p>除去傻姑等著名配角，金庸有三個著名的笨人主人公，他們是郭靖、狄雲、石破天。三個人的發展方向各自不一樣：郭靖的笨有點先天性質，他有很強的國家責任感和道德使命感，最後成為了一個愛國的笨人；狄雲的笨是成長環境導致的，他揹負的仇恨太重，怨念太深，最後成了一個憤世嫉俗的笨人。</p>\n<p>《俠客行》裡的石破天和他們都不同。他的笨完全是後天因素，是家庭教育缺失和社會經驗嚴重匱乏造成的。他沒有強烈的道德使命感，沒有仇恨，沒有怨念，始終愉快地玩耍，最後成為了笨人中最讓人羨慕的那一種——快樂的笨人。</p>\n<p>石破天進入江湖的過程很富偶然性。他本來是一個小叫花子，有一天流竄到一個叫侯監集的小城鎮，覺得餓了。於是他像平時做過無數次的一樣，隨手撿了地上的一個燒餅。出乎意料的是，燒餅裡面藏著一個武林高手們都在搶的大寶貝，叫作玄鐵令。就是因為這一撿，石破天同志正式踏入了江湖。</p>\n<p>然而我們的石破天從來不知道有「江湖」二字的存在。他從小生活的地方叫作熊耳山，在他的眼中，江湖不過是一個更大一點的熊耳山——笨人的基本功，就是能把很複雜的事情看得很簡單。</p>\n<p>在聰明人的眼裡，江湖上到處都是危險，到處都是殺機，有時候說錯一句話就可能引來殺身之禍。但石破天同志不是。他不知道什麼是江湖規矩，什麼是紅燈停綠燈行。江湖上那些最陰險最恐怖的地方，他都當成是村莊和田園，傻乎乎樂呵呵地就去了。</p>\n<p>比如摩天崖，那可是殺人不眨眼的謝煙客的老巢，聽著都像是《西遊記》裡的地名，連貝海石那樣的高手都要湊夠一堆人才敢摸上去，然而石破天渾渾噩噩地就去了。又比如長樂幫、凌霄城、丁不三家裡，要麼住著殺人如麻的瘋子，要麼住著陰險狡詐的壞人，都是江湖上著名的犯罪窩點，他也傻乎乎地去了。</p>\n<p>最恐怖的是俠客島。在當時的江湖上，一說去俠客島，感覺就和今天坐馬航差不多，武林高手們聽了都要尿褲子，石破天同志居然也主動申請簽證，揣著護照就去了。</p>\n<p>就好比在動物園裡，你忽然發現有個傢伙笨手笨腳地爬進了獅虎山，還在裡面到處亂轉。你在籠子外面揪心地問他想做什麼，他一臉無辜地看著你：「撿帽子啊……」</p>\n<p>每次讀到石破天，我都想起文學史上另外一個有名的笨人——奧匈帝國的好兵帥克。帥克的一大特點，就是把別人施予他的一切都當作是善意。不管你表揚他、禮遇他，還是罵他、笑話他、虐待他、給他灌腸，他都不當你是壞心。他尊敬生命裡的每一個過客，不折不扣地執行他們的命令。他像一隻快樂的簸箕，把別人所有的惡意都像水一樣瀝過去。</p>\n<p>這多麼像我們的石破天同志。他坦然接受別人給他安排的一切東西，從身份、名字，到爹孃、老婆。他的名字從狗雜種、石破天，到石中玉、史億萬，別人給他取什麼名字，他都接受；一會兒梅芳姑把他當兒子，一會兒閔柔又把他當兒子，他也都認賬；他的老婆一會兒是丁璫，一會兒是阿秀，他也不反抗，他跟哪個姑娘在一起都開心。</p>\n<p>他在江湖上遇到無數壞人，但他永遠把他們當好人，全心全意地尊敬他們。江湖上那些大俠、魔頭、妖女、小賊，在他眼裡全是叔叔、伯伯、姑姑、哥哥。</p>\n<p>比如謝煙客，一個挖空心思想弄死他的暴徒，石破天自始至終把他當好人，一口一個「老伯伯」；還有貝海石，一個從來都在利用他的陰謀家，但在石破天眼裡，他是值得尊敬的「貝先生」；又比如張三李四，也是對小石同學起過殺心的，但石破天硬是把他倆當成「大哥二哥」，掏心掏膽，隨時準備為他們兩肋插刀。</p>\n<p>我一直覺得在金庸的小說裡，《俠客行》和《連城訣》是相反的兩部書，它們互為映象。這兩本書裡的江湖很相似，都是魍魎橫行、壞人當道，但從狄雲的眼裡看過去，江湖上全是壞人，他的眼睛像是照妖鏡；從石破天的眼裡看過去，江湖上全是好人，他的眼睛像是萬花筒。</p>\n<p>好兵帥克的作者英年早逝了，我們沒法知道帥克的結局，但是我們知道石破天的結局——那些仇恨他、一心想傷害他的人，都有很強大的武力，但他們最後都拿石破天沒有辦法。從謝煙客到貝海石，他們最後都只能苦笑著，無奈地接受石破天滔滔不絕的尊敬和友誼。</p>\n<p>《俠客行》裡有很多聰明人，像石中玉、廖自勵、米橫野……這些人最後都活得沒有石破天好。他們眼睜睜看著石破天成了天下第一高手，就像《格林童話》裡那些狡猾而歹毒的配角，最後總是眼睜睜看著一個叫漢斯的笨蛋娶走了公主。</p>\n<p>我不知道金庸是在什麼心情下寫出《俠客行》這本書的。在這本書之前，他的上一本書是《天龍八部》，是浪漫主義的高峰；下一本書是《笑傲江湖》，是諷刺現實的極致。大概在寫這兩本書的間隙裡，作者想舒緩一下心情，就好像一個遊客在攀登兩座高山的途中，忽然去遊覽了一個寧靜的湖泊，留下一些單純美好的東西，於是就有了這本童話般的《俠客行》。</p>\n<p>這個童話告訴我們，在一個複雜的世界裡，做聰明人無疑是好事；但在一個過於複雜的世界裡，做一個笨人或者也是不壞的選擇。</p>\n<p>當然，我不是反對大家做聰明人。我的意思是——如果你的天賦、性格實在不適合做聰明人，那麼不要勉強去做；不如像石破天一樣做個笨人。即便你沒有他那樣的內功，那樣的運氣，也至少可以……當炮灰的吧?</p>\n<p></p>\n<p>【俠客行】</p>"},{"title":"郭芙都寫詩了，你還粗魯什麼","content":"<h2 id=\"sigil_toc_id_27\"><span>郭芙都寫詩了，你還粗魯什麼</span></h2>\n<p><span><span>郭芙和完顏阿骨打，如此沒文化的粗人，當他們情緒到位了的時候，隨口說出來的話，都是一首好詩。</span></span></p>\n<p>一位農民女詩人寫到「穿過大半個中國去睡你」，結果，小半個中國都沸騰了。各路詩歌愛好者，像餓紅了眼的動物一樣，從各個洞窟裡鑽出來：摁住她，快摁住她，好不容易出來個詩人，不容易……</p>\n<p>「詩歌已死」，好像是國人永遠的怕和痛，每隔一段時間就要拿出來擔憂一下。「大雅久不作，吾衰竟誰陳？」李白當初的追問被一代代人重複了千百年。</p>\n<p>回到我的主業讀金庸。武俠小說裡的江湖，是一個武力為王的粗暴的世界。在那個叢林獵場般的江湖裡，「詩人」是最具無力感的一個群體。每一個以「詩人」身份登場的人都弱爆了。</p>\n<p>他們要麼是隻能插科打諢的龍套，讓你看三遍書都不一定記得住，比如《天龍八部》裡的苟讀；要麼是成事不足的老憤青，比如《鹿鼎記》裡的顧炎武、黃宗羲、呂留良、查伊璜四個老教授。</p>\n<p>然而，即便是在那個粗暴的江湖裡，仍然有一些可愛的武人，他們在默默地喜歡詩。</p>\n<p>比如「全真七子」。他們人氣不太高，說話做事都不太討讀者的好。但我有點喜歡他們，因為他們不只練武，還是一個詩歌興趣小組，幾乎人人都喜歡寫點詩。</p>\n<p>其中的丘處機、馬鈺、王處一這幾個，知識分子的氣味最濃，動不動吟詩作賦，且不說了；連七個人裡最粗手大腳、最不像詩人的譚處端，出家前甚至是個山東的鐵匠，也在集體中受到了薰陶，成了一位詩人。</p>\n<p>後來在被人偷襲打傷、行將辭世時，他選擇了用詩歌為自己的生命畫上句號：</p>\n<p>「譚處端緩緩睜開眼來，低聲道：‘我要去了。’……吟道：‘手握靈珠常奮筆，心開天籟不吹簫。’吟罷閉目而逝。」我覺得他是一個真正的詩人。</p>\n<p>更讓我印象深刻的是，每當「全真七子」動用最強攻擊叢集「天罡北斗陣」的時候，每人會先朗誦一句七言詩，然後依次進入戰鬥位置，宛如《力士參孫》般的雄偉詩劇。</p>\n<p>在佈列戰陣時搞一些詩歌助興，後來日本人比較興這一套。偷襲珍珠港的時候，六艘航母為主力的艦隊駛入北太平洋，那一刻，無線靜默，天海沉寂，濁浪滔滔，唯一的訊號是NHK電臺播放的漢詩：</p>\n<p>山川草木轉荒涼，</p>\n<p>十里風腥新戰場，</p>\n<p>徵馬不前人不語，</p>\n<p>金州城外立斜陽。</p>\n<p><br/></p>\n<p>聽著挺牛，但我看這一套完全是從全真七子那兒學去的，是赤裸裸的抄襲。到了二戰日本戰敗後，日本武士們更沒創意了，每當進入戰鬥狀態前，都只會大喊一聲「武裝起來」或「穿上聖衣」，和丘處機、馬鈺們佈陣前長吟「雲在西湖月在天」的文藝範兒相比，簡直粗鄙得難以直視。</p>\n<p>江湖上，還有許多文化水平遠不如「全真七子」的粗人，他們也悄悄地愛上了詩歌。</p>\n<p>例如郭靖，從小沒讀過什麼書，講一口臨安鄉下土話，一個和詩歌完全不沾邊兒的牧民。然而，在《射鵰英雄傳》第二十八回，那一個夜晚，在漆黑的鐵掌峰上，在鬆柴火光的照耀中，在黃蓉的依偎下，我們的粗人郭靖翻開了《武穆遺書》，讀到了嶽飛的詩文。</p>\n<p>他從《小重山》《滿江紅》讀到了《題翠光寺》《贈張完》《題鄱陽龍居寺》……那是郭靖人生中第一次認真讀一部詩集，也是他第一次真正感受到文化的力量。</p>\n<p>書上說：「郭靖識字有限，但胸中激起了慷慨激昂之情，雖然有幾個字讀錯了音，竟也……讀得聲音鏗鏘，甚是動聽。」</p>\n<p>黃蓉說「大英雄的詩，小英雄來讀」，這固然是開玩笑，但大英雄嶽飛的詩魂，的確是照亮了小英雄郭靖的心。我相信，從那一刻起，郭靖真正愛上了詩歌。</p>\n<p>於是，多年之後，我們看到了詩的傳承——郭靖帶著市儈油滑、不愛文學的侄子楊過，躍馬在襄陽城下。他沒有給楊過講武功，而是給楊過吟誦杜甫的詩。</p>\n<p>那個烽煙滾滾的亂世裡，強大如降龍十八掌亦不能留存下來，到元末就只剩十二掌，後來終於全部失傳。但郭靖當時吟誦的那首《潼關吏》，卻箭一般穿越了時光，一直流傳至今。</p>\n<p>我們這個時代，很像郭靖的江湖，詩人的存在感極差，人們以當詩人為恥。</p>\n<p>記得以前各種BBS還很火的時候，我做過一件事，至今都很內疚：有一次我發了個關於南京城歷史的帖子，有個哥們興奮地來留言：「南京城古稱金陵……」然後就貼上了那首著名的「金陵夜寂涼風發，獨上高樓望吳越」。</p>\n<p>我很不厚道地回了一帖：「把文學青年都引出來了。」那哥們頓時氣壞了：「靠，你才是文學青年！」隨即刪了帖，大怒而去。這件事我至今很後悔，我向他道歉。</p>\n<p>然而，雖然有人明面上恥於當詩人，覺得其不光彩程度僅次於抄襲六神磊磊稿子還不署名的垃圾編輯號，然而他們其實一直在悄悄喜歡詩。</p>\n<p>在我的微信公號後臺，讀者們的簽名裡隨便抓幾個，個個充滿詩情畫意，什麼「既往不戀、未來不迎」「但使世間人無病，何妨袈上藥生塵」「塵世中一個迷途小書童」「榮耀都歸你」，文藝得要死。</p>\n<p>雷同度高一點的比如「生活有詩有遠方」，再不濟哪怕來個「心如猛虎細嗅薔薇」，雖然撞臉係數高，但追求是美好的。</p>\n<p>詩不過是美化過的情緒而已。只要今天的人仍然能感受到丘處機們的憤怒、郭靖們的慷慨，詩就會一直在。老一輩的唱「愛我所愛，無怨無悔」，年輕一點的唱「你不曾真的離去，你始終在我心裡」，更年輕的唱「雨紛紛，舊故里草木深」，他們唱的時候，把他們感動得抽搐的，都是詩的力量。</p>\n<p>其實，在金庸小說裡，哪怕是那些最沒文化、最粗鄙的人，只要情緒到位了，也會一秒鐘瞬間變成詩人。</p>\n<p>我舉一男一女兩個例子。女的比如郭芙，算是夠沒文化、夠粗魯的吧？但在書的結尾，她和楊過並肩大戰襄陽的時候，她心裡想的事情從原著上一字不改地搬出來，就是一首詩——《嫉妒》：</p>\n<p>我難道討厭他嗎？</p>\n<p>當真恨他嗎？</p>\n<p>武氏兄弟</p>\n<p>一直拼命地想討我歡喜，</p>\n<p>可是他卻從來不理我。</p>\n<p>只要他稍微順著我一點兒，</p>\n<p>我便為他死了，</p>\n<p>也所甘願。</p>\n<p>郭芙啊郭芙，</p>\n<p>你是在</p>\n<p>妒忌自己的親妹子！</p>\n<p><br/></p>\n<p>還不服？我再舉個男的例子——《天龍八部》裡的完顏阿骨打，夠沒文化的吧？人家一個女真人，半原始部落，連文字都沒有，真是沒文化到家了。</p>\n<p>但在全書結尾，完顏阿骨打和蕭峰灑淚分別的時候，他說出來的話，一字不改搬過來，就是一首催人淚下的牛叉好詩——《喝酒》：</p>\n<p>哥哥，</p>\n<p>喝酒。</p>\n<p>不如便和兄弟，</p>\n<p>共去長白山邊。</p>\n<p>打獵喝酒，</p>\n<p>逍遙快活。</p>\n<p>中原蠻子，</p>\n<p>囉裡囉唆，</p>\n<p>多半不是好人，</p>\n<p>我也不願和他們相見。</p>\n<p><br/></p>\n<p>看看，連郭芙、完顏阿骨打他們都寫詩了，你說你還粗魯個啥？</p>\n<p></p>\n<p>【射鵰英雄傳·全真七子】</p>"},{"title":"黃藥師的演員型人格","content":"<h2 id=\"sigil_toc_id_28\"><span>黃藥師的演員型人格</span></h2>\n<p><span><span>黃藥師嚮往的人格是「魏晉風度」。然而反倒是不知魏晉為何物的洪七公和周伯通，一個得其放曠，一個得其率真，和他們相比，黃藥師只得了個皮毛。</span></span></p>\n<p>在寫《射鵰英雄傳》之前，金庸一直嘗試著塑造一些高蹈出塵的人物。比如《書劍恩仇錄》裡的袁士霄，《碧血劍》裡的穆人清。</p>\n<p>這兩個人物都不算太成功。他們的面目比較模糊，性格也顯得單調寡淡，比二流武俠作家塑造的那些「怪俠」「奇俠」沒有高明到哪裡去。就連他們的外號——「天池怪俠」「神劍仙猿」，也顯得格外拘束，讀者對他們的印象也都不太深。</p>\n<p>到了第三部書《射鵰英雄傳》，金庸抖擻精神，放開筆墨，把袁士霄的「怪」和穆人清的「清」拿到一起，捏合成了一個新的人物——東邪黃藥師。這個人物獲得了極大的成功。黃藥師成了一個讓人印象深刻的王爾德式的人物，才華橫溢又離經叛道，有強烈的唯美主義傾向，還創作了華麗而又淫靡的《莎樂美》——「碧海潮生曲」。</p>\n<p>這個角色當然很有魅力，喜歡黃藥師的人大概非常多，也包括我在內。但是我每次讀《射鵰英雄傳》的時候，總覺得他有什麼地方不大對勁兒，和書上其他的人說話做事不太一樣，但一時又說不上問題出在哪裡。</p>\n<p>直到有一天，我瞭解到有一種病症，叫作「表演型人格障礙」，才突然想明白了黃藥師讓我感到奇怪之處：他所說的話、所做的事，都很像是戲劇裡的臺詞和表演。換句話說，他隨時都像是在不自覺地演戲。</p>\n<p>《射鵰英雄傳》裡有四大宗師——東邪、西毒、南帝、北丐。如果問這四個人一天到晚都在忙些什麼，大概北丐為了「吃」，西毒為了「經」，南帝為了「情」，而東邪為了「酷」。</p>\n<p>從登場開始，黃藥師就一直沉浸在對亡妻的深深哀悼和憂傷之中。這種感情讓人欽佩而同情。但他處理妻子遺體的方式非常奇特：墓室從不固封，人們可以輕易進入。妻子馮衡的玉棺旁邊陳列著昂貴的珠寶，懸掛著她的畫像，整個墓室像是一個小型的愛情主題的博物館。</p>\n<p>在他居住的桃花島上，也充滿了類似的極富視覺功能的「博物館式」的佈置。</p>\n<p>從彈指閣、試劍亭，到清音洞、綠竹林，再到那個著名的「桃花影落飛神劍」的對聯，都透露出主人的微妙而矛盾心理：他一方面似乎十分抗拒外人闖入，煞費苦心地佈下花樹大陣阻擋來訪者，但另一方面，他在內心深處又似乎期待著遊客的到來，好鑑賞主人的超凡脫俗。</p>\n<p>桃花島的主人透露著一種糾結：既渴望離群索居，但又因為沒有人們的喝彩和崇敬而深感孤獨。</p>\n<p>黃藥師嚮往的人格似乎是「魏晉風度」。然而在《射鵰英雄傳》整部書裡，更具有「魏晉風度」的反而是不知魏晉為何物的洪七公和周伯通。前者得其放曠，後者得其率真，和他們相比，黃藥師可謂只得了個皮毛。</p>\n<p>有時候他甚至不如歐陽鋒看得開——歐陽鋒由於目標專一，一心只追求練武稱霸，所以有時對一些小事反而不太介懷。比如黃藥師和歐陽鋒都被周伯通潑了尿，「黃藥師氣極，破口大罵，歐陽鋒卻只笑了笑」。</p>\n<p>黃老邪充滿了矛盾。他聲稱自己反對禮教，實際上徒弟卻不能自由戀愛，又幹涉女兒的婚事，遠沒有歐陽鋒管侄子一樣灑脫；他聲稱反對條條框框，結果他的門派在四大宗師裡條條框框最多——明明已經把徒弟陸乘風打斷了腿，趕出了門下，十幾年後他還要狐疑地檢查徒弟有沒有違反「門規」，把武功私傳給兒子。</p>\n<p>甚至他聲稱從老婆死後再不沾女色，但又潛心研究「碧海潮生曲」這樣淫靡的東西。這又是何苦？</p>\n<p>表演型人格的另一個特點，就是隨時覺得自己站在無形的舞臺上，下面有許多觀眾，讓自己一刻都不能停止表演。</p>\n<p>比如歐陽鋒殺了一個教書先生，理由是這位先生上課時教學生做「忠臣孝子」。黃藥師的反應是「臉上色變」，將那人頭埋了，恭恭敬敬地作了三個揖，而且「凜然道：‘忠孝乃大節所在，並非禮法！’」把歐陽鋒搞得十分尷尬。</p>\n<p>這種事情比比皆是，好像他的每一幀生活場景擷取下來，都必須是一張完美的劇照。</p>\n<p>最典型的是馮衡死了以後，他給自己設計的殉情辦法：他打造了一艘巨大的花船，準備「將妻子遺體放入船中，駕船出海」「當波湧舟碎之際，按玉簫吹起《碧海潮生曲》，與妻子一齊葬身萬丈洪濤之中，如此瀟灑倜儻以終此一生」。這是多麼富於戲劇表演性和視覺衝擊力的一幅畫面。</p>\n<p>更有趣的是，金庸不忘寫了一筆：黃藥師把這艘花船「每年油漆，歷時常新」。似乎他擔心自己哪一年不去油漆，就會有無形的觀眾出來指摘他不誠心。</p>\n<p>我們很難猜想，黃藥師在完全休閒放鬆的時候會是什麼樣子——西毒大概會是在苦練武功，南帝大概在默坐懺悔，北丐大概在大快朵頤。而黃藥師呢？大概是坐在海邊某塊石頭上吹簫吧！瞧瞧，還是像一張天然的劇照截圖。</p>\n<p>劉國重說黃藥師「活得好累」，大致屬實。他太聰明瞭，太優秀了，所以十分害怕平庸，處處都要顯得與眾不同。他太希望自己「瀟灑倜儻」，說話做事總往這個方向靠，結果在洪七公、周伯通等人面前反而顯得很拘謹，有時候既不瀟灑、也不倜儻。</p>\n<p>他其實很羨慕洪七公的放達。《射鵰英雄傳》的最後，洪七公用一種很酷的方式不告而別——「榻上洪七公已不知去向，桌面上抹著三個油膩的大字：‘我去也’，也不知是用雞腿還是豬蹄寫的。」</p>\n<p>黃藥師嘆道：「七兄一生行事，宛似神龍見首不見尾。」看著洪七公用一隻豬蹄，就玩出了自己嚮往的風範，是不是有一點淡淡的自愧不如呢？</p>"},{"title":"黃蓉的豆腐不好吃","content":"<h2 id=\"sigil_toc_id_29\"><span>黃蓉的豆腐不好吃</span></h2>\n<p><span><span>黃蓉的豆腐，是過度加工的典型，即袁枚所謂「穿鑿」，會好吃才怪。</span></span></p>\n<p>金庸筆下，有很多會做菜的女人，比如《神鵰俠侶》裡的程英、《天龍八部》裡的阿朱和阿碧、《俠客行》裡的梅芳姑等，都各有絕活兒。她們有的善做宴席，有的善做點心，而其中「廚神」之名最響、能力最強的大概是黃蓉。</p>\n<p>金庸的筆下也有很多美食家，例如愛吃小街涮羊肉的白富美趙敏，善於品嚐糕點的紈絝子弟段譽，而其中最有名的老饕，無疑是洪七公。</p>\n<p>如果「第一廚神」黃蓉，遇上了「第一吃貨」洪七公，是不是會很精彩呢？答案是未必。</p>\n<p>在《射鵰英雄傳》裡，黃蓉就炮製了自己「最拿手」的菜給洪七公享用，按道理說，本該是珍饈佈列、廚神和吃貨交相輝映的吧？但我總覺得黃蓉的這道精品菜不怎麼好吃。</p>\n<p>這道菜名字很考究，叫作「二十四橋明月夜」，連小杜的詩都用上了，其實就是火腿蒸豆腐。做這道菜的目的，乃是為了哄騙洪七公教郭靖武功，因此黃蓉一定是不遺餘力，拿出了全身的解數。</p>\n<p>其具體做法如下（密集恐懼症患者不宜）：先把火腿砍開，挖二十四個洞；再把豆腐削成二十四個圓球，必須正好能塞進洞裡。上火蒸熟以後，火腿丟了不要，只吃豆腐，所以叫作「二十四橋明月夜」。</p>\n<p>這種豆腐會好吃才怪！</p>\n<p>記得蔡康永曾經寫文章說，總覺得金庸裡的吃食不饞人，不像古龍的牛肉湯和白饅頭真的讓人餓。我想原因大概就在於對菜餚的過度加工。</p>\n<p>例如金庸書裡最名貴的菜，要數《射鵰英雄傳》裡的「鴛鴦五珍燴」。這道菜被寫成只有皇宮中才有，不但用料名貴，而且必須用特製的鍋碗、炭火才做得出來。洪七公在皇宮裡躲了整三個月，才吃到過兩次。</p>\n<p>蔡康永說，誰知道「鴛鴦五珍燴」是啥滋味？無經驗則無從聯想，不像深夜的餛飩攤子勾人。的確，對讀者來說，這道鴛鴦什麼什麼的的確一點也不饞人，因為名字太繞口、工序太麻煩。事實上，一道菜好不好吃，和用料是不是名貴、工序是不是複雜沒有半毛錢關係。</p>\n<p>黃蓉作為廚神，原本不用我們費勁兒為她解釋這個道理。不然她也不會驕傲地宣稱自己最拿手的菜是「家常四樣」：蒸豆腐、炒白菜、燉雞蛋、白切肉。就像清代一位大吃貨袁枚說的：「豆腐得味，遠勝燕窩。海菜不佳，不如蔬筍。」</p>\n<p>袁枚主張食材沒有高低貴賤之分。他把各種菜比喻成江湖兒女，說雞、豬、魚、鴨是「豪傑之士」，因為它們「各有本味，自成一家」；而海參、燕窩是「庸陋之人」，說它們「全無性情，寄人籬下」。</p>\n<p>他主張做菜忌「穿鑿」，意思就是不要過度加工——「燕窩佳矣，何必捶以為團？海參可矣，何必熬之為醬？西瓜被切，略遲不鮮，竟有制以為糕者。蘋果太熟，上口不脆，竟有蒸之為脯者」，這些「都是矯揉造作」。</p>\n<p>黃蓉既然深諳其理，卻按捺不住炫技的衝動，把簡單的食物搞複雜了。按道理說，豆腐是中國菜裡最寬容、最隨和的食物，怎麼做都可以吃，豆腐腦可以吃，豆腐絲可以吃，豆腐皮可以吃，薰成幹可以吃，冷凍了可以吃，長毛了可以吃，臭了都可以吃。但是黃蓉姑娘非要把豆腐削成球去蒸。</p>\n<p>而且《射鵰英雄傳》原著上說，為了完成這一砍豆腐成球的高難度技巧，還必須用上桃花島家傳武功「蘭花拂穴手」 ，這不是作嗎？</p>\n<p>黃蓉做菜，一直有點過度加工的毛病。她做的「玉笛誰家聽落梅」，也就是燒烤牛肉條，每一條肉要用四種小肉條拼起來，一條是羊羔屁股，一條是小豬耳朵，一條是小牛腰子，還有一條是獐腿肉加兔肉揉在一起，純屬吃飽撐的。 這和把燕窩捶成團、把海參熬成醬是一個道理。</p>\n<p>要理解什麼是過度加工，可看《紅樓夢》裡那道大名鼎鼎的「茄鯗」，一個茄子要用十幾只雞來配，醃了又炒，炒了又拌，做得完全沒有了茄子的味道、口感和營養，這道菜唯一存在的目的，就是震懾劉姥姥。</p>\n<p>在《射鵰英雄傳》原著裡，美食家洪七公吃了這個火腿蒸豆腐，居然「大為傾倒」。至於你信不信，反正我是不信。</p>\n<p>金庸這個土豪是懂吃之人，兒子查傳倜據說是美食家，綽號「柴、米、油、鹽、醬、醋、茶、酒」的「八袋弟子」，應該和乃父不無關係。金庸在北京嘗小吃，據說連豆汁兒都認真喝完了，真是端嚴可敬的一流饕客。他隨筆點評美食，「百粵之地毒蛇做羹，老貓燉盅，斑魚似鼠，巨蝦稱龍，肥蠔炒響螺,龍蝨蒸禾蟲,烤小豬而皮脆,煨果狸則肉紅」，也都精彩、精到。</p>\n<p>在他的小說裡，勾人流口水的菜不是沒有，洪七公炸的蜈蚣就貌似不錯。我發現，他花了大力氣寫出來的菜，往往沒有隨筆寫出的吃食勾人，最饞人的餚饌往往躲藏在最不起眼的文字縫裡。</p>\n<p>例如《俠客行》裡，善於烹飪的主角石破天有一次在船上做菜，鍋裡油聲滋滋，香氣撲鼻，「片刻間將兩尾魚煎熬得微焦」，讀到這裡時，我忽然覺得饞涎欲滴，這兩條微黃的魚，不比黃蓉的豆腐好吃多了？</p>\n</div>"},{"title":"金庸江湖裡的三個PR","content":"<h2 id=\"sigil_toc_id_30\"><span>金庸江湖裡的三個PR</span></h2>\n<p><span><span>越是混亂的市場環境，公關工作越不能放鬆。</span></span></p>\n<p>看了標題，你大概以為我胡扯：武俠小說裡是什麼世道，叢林法則盛行，一切靠刀劍和拳腳說話，這麼混亂的市場環境，需要什麼PR？</p>\n<p>你錯了。越是嚴酷和複雜的市場環境下，公關工作越不能放鬆。</p>\n<p>舉一正一反兩個例子說明：正面例子是郭靖。正因為有了得力的公關經理黃蓉，為他經營公眾形象，大大地幫助了「郭大俠」揚名天下，連郭家的紅馬和雙鵰都成了消費者喜聞樂見的吉祥物。相比之下，洪七公就缺乏一流公關人才輔佐，雖然也有俠名，但卻遺憾地留下一個深入人心的「吃貨」形象。</p>\n<p>反面例子是星宿派。這家公司不可謂不重視公關工作：公司一把手親自抓公關，全體成員群策群力搞公關，但由於沒有一位好的公關人才策劃統籌，星宿公司的公關形象定位、內容建設和技巧創新都很不足，每次搞市場公關總是產生負面效果，形象和口碑也越來越不堪。</p>\n<p>所以，在江湖上公關工作不是重要，而是至關重要。</p>\n<p>下一個問題就來了：武俠世界裡，公關工作的最大挑戰是什麼？或有人說：最大挑戰是合作伙伴和消費者對你說的話信不信。這當然有一定道理，但卻不夠深刻。我覺得最大的挑戰倒不是別人信不信，而是自己信不信——道理很簡單，如果公關經理對自己宣揚的公司理念、企業文化都不相信，又怎麼談得上塑造形象、協調關係、優化受眾心理環境？</p>\n<p>下面我以金庸小說裡的三位公關經理為例進行說明。第一位，是對自己的企業文化真服、真信的典型，乃是南海鱷神。</p>\n<p>南海鱷神是四大惡人公司的公關經理、「喇叭」和發言人，忠於公司，至死不渝，很大程度上為四大惡人公司扭轉了公眾形象。</p>\n<p>在《天龍八部》裡，細看就會發現，我們關於四大惡人公司的背景知識大多數都來自南海鱷神的普及，包括四人的名稱、綽號、宗旨、性格，等等，金庸都是借南海鱷神的口說出來的。他是個稱職的公關和發言人，不但在四大惡人裡話最多，嗓門兒最大，而且發言風格直率誠懇，幾乎有問必答，甚至問一答三，絕不搞閃爍其詞或無可奉告。</p>\n<p>事實上「四大惡人」並不太重視公關工作，南海鱷神在董事會裡只排名第三就是明證。但難能可貴的是，南海鱷神始終尊敬和擁護CEO段延慶，搞公關工作出彩而不出位，口口聲聲：「老大的話總是不錯的」「他武功還是比我強得多」。</p>\n<p>最終南海鱷神被老大殺了，死在了自己人的手裡，這也說明瞭公關工作是多麼難做。但自始至終，南海鱷神對公司的忠誠和信仰從未改變。讀者們逐漸地喜愛上了他。如果沒有這位好公關經理，四大惡人公司的市場形象和人氣要差一大截。</p>\n<p>他留給我們的啟發是深刻的：一位公關經理，能做到始終忠於公司、忠於董事會、忠於投資人，忠於自己說的每一個字，終究會得到行業的信任和公正的評價……當然，本人有沒有好結果就另說了。</p>\n<p>第二位公關經理，是從「信」到「不信」的動搖的典型，乃是李巖。</p>\n<p>李巖是《碧血劍》裡闖王李自成同志的公關經理。應該說，在公司創業的初期，在研發產品、開拓市場的關鍵階段，李巖是有功勞的，特別是制定了那一句著名的slogan：「吃他娘，穿他娘，開了大門迎闖王，闖王來時不納糧。」</p>\n<p>不要小看這一句口號，為闖王公司開啟市場發揮了巨大作用。而六神磊磊到現在都沒想出一句好的口號來。</p>\n<p>然而到了後期，李巖同志的認識不太清醒了，觀念跟不上市場形勢的變化，對公司理念的信仰和忠誠開始動搖。《碧血劍》中說，闖王公司的業務做進了京城後，李巖僅僅因為看到有的業務部門不太守規矩，有的員工犯了一點小錯誤，比如強迫性借住了幾間民房、借用了一些錢米，和一些姑娘大嫂產生了強迫性戀愛關係等等，他就想不開了，「悲憤不已，只有浩嘆」，說了不少牢騷怪話，甚至「氣得說不出話來，臉色發白，騰的一聲，重重坐在椅中」，用類似的舉動宣洩自己對公司同事的不滿情緒。</p>\n<p>最後闖王當機立斷，把李巖一腳踢開，清除出了董事會，最後又把他和老婆紅娘子一舉除名。</p>\n<p>李巖經理的深刻教訓是，創業團隊最難接受的是信念動搖。對於公司的既定方針和戰略，你不但要信，而且要始終相信，永遠相信。像李巖這樣先是相信、然後又忽然不信了的，還不如從一開始就不信，免得搞得自己很難過，也搞得整個創業團隊都很難過。</p>\n<p>第三位公關經理，是心裡對公司理念從來都不忠誠、對團隊的戰略從來都不信的「補鍋匠」典型，乃是神龍教公司的陸高軒老夫子。如果說李巖是從「信」到「不信」，那麼陸高軒經理就是一直都不信、但一直都裝作很信的典型。</p>\n<p>對於神龍公司的市場戰略，對CEO洪安通先生的理念，他從來都談不上什麼信念，也談不上什麼忠誠，不過是為了保住自己在創業團隊裡的位子，揣度著CEO的心思，拼命地把「文章做得四平八穩」，搞些縫縫補補的工作。</p>\n<p>比如韋小寶胡說八道有一篇唐代碣文，預言洪教主要「仙福永享、壽與天齊」。公關經理陸高軒明明知道是假的，不但不戳穿敵人的謊言，反而順水推舟，偽造了一篇碣文來拍CEO的馬屁，這不是縫縫補補、欺上瞞下的典型嗎？</p>\n<p>後來神龍公司裡一夥高管不滿自己被邊緣化，聯手造反，和洪教主鬥得兩敗俱傷，關鍵時候也是陸高軒最先跳出來搞妥協、搞調和，當「補鍋匠」，和洪教主一起重組董事會，讓公司這艘到處漏水的大船繼續開下去。</p>\n<p>陸高軒經理補來補去，最後越補越漏，自己也沒落到個好。英明的CEO洪教主看見他就來氣，終於「一把抓住了陸高軒，喝道：‘都是你這反教叛徒從中搗鬼！’」然後重重一掌，打得他「雙目突出，氣絕而死」。</p>\n<p>陸高軒的拙劣做法，最值得批判和反思。說到底，他不是一個公司的好員工和好戰士，只是一個公司事業的同路人。等到CEO洪教主自己都混到無路可走了，你一個同路人又能走到哪裡去？要知道，一個創業團隊裡最不缺的就是補鍋匠。</p>\n<p>說到這裡，我們不僅深深惋惜，可惜洪教主的團隊裡沒有一個南海鱷神那樣堅定的好PR。如果要有的話，恐怕教主……恐怕教主還是照樣要戴綠帽子吃翔的吧？</p>"},{"title":"紅塵戲","content":"<h1 id=\"sigil_toc_id_31\"><span><span>紅塵戲</span></span></h1>\n<p><span>江湖中的遊戲，亦有自己的規矩。</span></p>"},{"title":"什麼是金庸小說裡的AK-47","content":"<h2 id=\"sigil_toc_id_32\"><span>什麼是金庸小說裡的AK-47</span></h2>\n<p><span><span>發明一種兵器的人，只製造出兵器的軀殼；使用這種兵器的人，才製造了兵器的性格。</span></span></p>\n<p>有一種槍，不管你對它是什麼印象，都已經似乎註定會載入兵器發展的史冊，那就是傳奇步槍AK-47。2013年12月23日，發明這種步槍的一代槍王卡拉什尼科夫謝世，六十多年裡，他見證了這支槍風靡世界，一場場大戰小戰、地區衝突、獨立運動裡，都有它的身影。</p>\n<p>我的主業是讀金庸。常常被人問到：金庸江湖裡最厲害的武功是什麼？這個問題缺乏新意。在此我倒想探討一下，金庸江湖上百餘種奇絕詭怪的武功裡，哪一種能稱得上是AK-47？</p>\n<p>它必須具備以下條件：簡單、廉價、好學、耐用、粗獷、硬朗、火力猛、歷史長、流傳廣泛、亦正亦邪，是人人心目中的經典。</p>\n<p>入圍的武功有很多。要說名聲響亮的，比如降龍十八掌。不過降龍十八掌的火力過於猛了，更像是一挺勃朗寧M2HB重機槍，不像是粗獷的半自動步槍。</p>\n<p>而且降龍十八掌會的人太少，精英味兒太濃，完全不符合AK-47在很多地方人手一支的平民氣質。我粗略統計，金庸十四本書裡，學了降龍十八掌的有名可考的只有8人，他們是洪七公、郭靖、郭破虜、耶律齊、蕭峰、汪劍通、史火龍、黎生。而AK-47呢？據說在1988年的海德拉巴，保守估計就有80000支AK-47，你出門就可能碰到人們用AK-47交火。</p>\n<p>另一門有望入圍的武功，是超級偷襲絕技「含沙射影」。它易操作、火力強，不會半點武功的韋小寶裝備了這麼一套，立刻就敢對一流高手馮錫範叫板。然而這個東西也是高精尖產品，無法量產，韋小寶雖然富可敵國，也充其量只給自己搞到一套。</p>\n<p>說到陰狠歹毒、殺傷力大的，比如化骨綿掌，可謂是宮鬥劇專用的第一武功。想當年，陰森森的清宮裡，假太后怒鬥海大富，讓化骨綿掌一戰成名。只不過它陰柔有餘，硬朗不足，會的人也還是太少，和AK-47也不太符合。</p>\n<p>真正夠格稱為AK-47的武功是什麼？我覺得是少林寺的羅漢拳。</p>\n<p>是的，你沒有看錯，就是羅漢拳。</p>\n<p>讓我們把目光投向千年前的蒼莽嵩山吧！在武學聖地少林寺，一套最質樸無華的拳術誕生了。它註定風靡江湖，超越其他所有花樣繁多的武術，在冷兵器時代閃爍出最耀眼的光。</p>\n<p>——它簡單、粗淺，是最基本的平民武功，但卻足以把一名農夫武裝成戰士。</p>\n<p>「到得少林，便先學羅漢拳。」它是每一個少林弟子最先學的入門功夫之一。雖然粗淺，哪怕是手無縛雞之力的青年，學會了這一套羅漢拳，就算是正式踏入了江湖。</p>\n<p>想當年，好和尚虛竹渾渾噩噩地踏入江湖，所會的武功只有兩套：一套是韋陀掌，另一套就是羅漢拳。就好比戰亂地區的街上走著一個娃娃兵，雖然他面相稚嫩，身材瘦小，但他背了一支AK-47，你敢上去招惹他，插他鼻孔試試？</p>\n<p>——它古老、流傳最廣，江湖上沒人不會、沒人不識，好比AK-47人手一支。</p>\n<p>在金庸的江湖裡，有人不認得黯然銷魂掌，不認得龍象般若功，但估計沒有不認得羅漢拳的，否則你還有臉出來混？</p>\n<p>它足夠古老，北宋年間的虛竹在用羅漢拳，元代的張三豐仍然在用羅漢拳。這和AK-47多麼像。據說現在阿富汗還能找到1956年產的AK-47，它已不知道在蘇聯大兵、當地民兵、阿富汗士兵們的手裡傳了多少次，效能還好得很，還能再用個幾十年。</p>\n<p>——它簡陋廉價，卻火力強大,只要你足夠勇猛，一套羅漢拳足以抵擋絕世高手。</p>\n<p>金庸江湖裡，多少位一代宗師都有用羅漢拳打架的經歷。就像AK-47，民兵們用它，總統、暴君們也用它；政府軍用它，遊擊隊也用它；大國軍隊裝備它，原始部落也用它。</p>\n<p>想當年，少室山上，少年張三豐以一套最普通的羅漢拳，打得「崑崙三聖」毫無還手之力，發出了初入江湖的響亮啼聲。往前追溯數百年，同樣是在少林寺，大輪明王鳩摩智上門挑釁，他渾身都是精良武器，什麼「七十二絕技」「小無相功」「火焰刀」等等，頗像一支前來空襲的長弓阿帕奇直升機戰隊。然而，我們的好和尚虛竹提著一把AK-47出現了。他只用一套羅漢拳，而且悶著頭只用那一招「黑虎掏心」，一拳又一拳，打得鳩摩智的那些高階兵器黯然失色，只能落荒而逃。</p>\n<p>——它的地位經典而崇高，在江湖人的心目中，它就是武學的象徵，有無可取代的意義。</p>\n<p>《倚天屠龍記》裡，江湖面臨空前浩劫，六大門派高手幾乎被趙敏一鼓盪盡。生死關頭，張三豐作為武林泰山北斗，他選擇了留一套什麼武功傳給後世？沒錯，是羅漢拳！</p>\n<p>他珍重地掏出能夠演練羅漢拳的一對鐵鑄羅漢，交給徒弟俞岱巖：「盼從這對鐵羅漢身上，留傳少林派的一項絕藝！」</p>\n<p>——它還有獨特的紀念意義，是江湖高手們饋贈親友的最好禮物。無色禪師送給郭襄的生日禮物是什麼？是羅漢拳！郭襄送給少年張三豐的紀念禮物是什麼？是羅漢拳！張三豐留給徒弟俞岱巖的又是什麼？還是羅漢拳！</p>\n<p>——它還亦正亦邪。當年創造出羅漢拳的那位高僧，想必初衷是為了護法伏魔，就像槍王卡拉什尼科夫發明AK-47，也一定是為了保家衛國。然而江湖風雲變幻，事實上是佛也用它，魔也用它。虛竹這種好人學會了，火工頭陀這種暴戾的惡人也學會了；甚至郭襄用羅漢拳來打無色禪師，張三豐帶著羅漢拳反出少林，還建立了一個武當派和少林派對峙，恐怕當年創造羅漢拳的高僧也沒想到吧！</p>\n<p>羅漢拳和AK-47都是兵器。它們遵守一條共同的兵器定律——發明一種兵器的人，往往沒有使用這種兵器的人出名。就像少林寺裡創造羅漢拳的那位高僧，根本沒留下名字，我們已經永遠不知道他是誰，但後世郭襄、無色、張君寶、虛竹這些羅漢拳的使用者卻名垂千古。</p>\n<p>就像今天，不管媒體上怎麼連篇累牘地紀念發明AK-47的槍王，但婦孺之中有誰記得「卡拉什尼科夫」？</p>\n<p>這不是因為槍王的名字太拗口，讓人記不住，而是因為發明兵器的人，只造出了兵器的軀殼，只有使用兵器的人，才真正書寫了兵器的性格。「降龍十八掌」並不見得天生比「九陰神抓」光明正義，讓它偉大起來的是蕭峰、郭靖。小說中，在襄陽城上，在雁門關前，當他們以這種強大的暴力縱橫江湖的時候，仍然不忘吟誦一句：「乃知兵者是兇器，聖人不得已而用之。」</p>"},{"title":"濃眉大眼的好青年","content":"<h2 id=\"sigil_toc_id_33\"><span>濃眉大眼的好青年</span></h2>\n<p><span><span>不要拿年輕人無法驗證的東西去哄騙年輕人。不要拿圈子裡的事去騙圈子外的人。如果你是尹志平，最好不要吹噓自己是「郭靖的好朋友」，人家拖雷才是郭靖的好朋友。</span></span></p>\n<p>大概從沒有一個時代，偶像產生和倒下的速度都是如此之快。</p>\n<p>一個濃眉大眼的年輕人，可能數年之間便炙手可熱，成為許多青年人的偶像——他的書佔據暢銷榜首，一些年輕人徹夜等候他，興奮得滿臉通紅，只為了用手機拍到他的正面頭像。然而一夜之間，他又可以轟然倒掉，連喜歡他也變成了品位不堪的象徵。</p>\n<p>我想用武俠來打比方，為這些芮粉或別的什麼粉們說幾句話。</p>\n<p>設身處地地想一下，假如我自己是江湖上一個初出茅廬的年輕女俠，忽然碰上了一個濃眉大眼的俠客。他出身大派——全真教，師出名門——丘處機，武功高強——至少比我見過的人水平都高。他說他叫尹志平。我於是對他產生好感甚至敬慕，難道不是人之常情嗎？</p>\n<p>然後他便溫和地自我介紹說，他有一個非常好的朋友，叫作郭靖。說出這個震動天下的名字時，他平淡得像是在說一個自小熟識的普通人。他還輕描淡寫地說，自己是全真教第三代弟子中首位和師父、師伯們合練天罡北斗陣的。</p>\n<p>接著，他換了一個舒服的坐姿，淡淡地說起自己曾在煙雨樓和一個與重陽祖師齊名的著名俠客交過手，那個人叫作黃藥師。那一戰黃藥師傾盡了全力，卻並未獲勝。他還回憶說：「我的那位對手——黃藥師曾經當面說我‘有膽量，有骨氣’。」</p>\n<p>他還貌似不經意地提到，自己曾和一個叫小龍女的美麗女子有過刻骨銘心的糾纏。後來她選擇了嫁給一個叫楊過的年輕人，據說也挺優秀的。他祝她幸福。</p>\n<p>這樣一來，有什麼理由讓我不崇拜這位尹志平先生呢？</p>\n<p>有人或許可以憑著閱歷指責我，說尹志平的武功和地位並不是那麼牛；說他的老師丘處機也遠遠算不上是一流的武士。有人甚至還可以唾棄我，沒見識、沒閱歷，說尹志平根本不算是郭靖的好朋友，拖雷才是郭靖的好朋友。有人還可以揭露真相——在煙雨樓那一戰中，尹志平只不過是群毆黃藥師的一大堆雜毛之一，而且是最小的角色。</p>\n<p>可是這些我並不知道啊！我沒法區別丘處機和黃藥師到底誰的武功更高，反正都遠遠比我高；我也無法知道尹志平是否真的能和郭靖稱兄道弟，但至少他倆確實見面過、敘談過、切磋過，有無數照片為證啊，誰能否認嗎？</p>\n<p>我不過是身處一座小丘之上，再怎麼抬頭仰望，也無法知道珠穆朗瑪和乞力馬紮羅究竟誰高。對我來說它們都高聳入雲啊！那雲上的世界是什麼樣子、是什麼格局，我又怎能知道？我甚至覺得香山都挺巍峨的呢！</p>\n<p>我只能預設香山是和珠穆朗瑪峰並肩至齊的，並認真地仰望著它。就像《射鵰英雄傳》裡的程瑤迦，不能說她眼光低、見識淺吧？但她一聽說尹志平是丘處機的弟子，立刻羨慕不已。這能怪她嗎？她只不過是孫不二的弟子，又怎能不敬慕丘處機呢？</p>\n<p>如今尹志平或芮志平身敗名裂了，被你們說成是個虛榮浮誇的傢伙，我勉強接受了這個事實；但如果改日另一個叫趙志敬的又來了，淡淡地說神鵰大俠楊過曾是他的徒弟，著名高手金輪法王曾稱他為「中土第一流劍士」，我該不該又崇拜他呢？他說的可都是真的啊！</p>\n<p>所以，我們不要因為某個偶像有些問題，就覺得粉絲們都很low。</p>\n<p>如果江湖上真有一群人崇拜尹志平，那麼主要問題在於尹志平自己。介紹自己身份時候，老老實實說是「長春真人弟子」就好，不要老強調是郭靖的朋友；介紹自己武功的時候，說「全真教第三代弟子裡數一數二」都沒問題，最好不要說自己曾大戰過黃藥師。</p>\n<p>不要拿年輕人無法驗證的東西去哄騙年輕人。不要拿圈子裡的事去騙圈子外的人。這樣的話，你也許能騙到許多圈外人的崇拜，卻會失去圈內人的尊重。</p>"},{"title":"武林中有沒有“派”","content":"<h2 id=\"sigil_toc_id_34\"><span>武林中有沒有「派」</span></h2>\n<p><span><span>如果你的眼睛裡只有「派」，甚至把「派」當作解讀江湖武林大事件的唯一脈絡，會謬以千里的。</span></span></p>\n<p>有的人讀書、讀史，總喜歡分「派」——我這裡所說的派，不是「幫會」「門派」，而是指團夥和派系，比如認為A俠客是屬於這個派系的，B俠客是屬於那個派系的，他們動手打架，是因為派系矛盾使然。就連武松打個吊睛白額大蟲，有的讀者都要這樣理解——「大蟲是屬於景陽岡派的，而武松是屬於陽谷縣派的，兩派一直在激烈較量，所以……」</p>\n<p>真的嗎？派系對於武林真的這麼重要嗎？</p>\n<p>的確，江湖上派系無處不在。丐幫有汙衣和淨衣，華山有氣宗和劍宗，雪山有長門和支門，難怪連王熙鳳家裡的奴才都要分「二爺這邊的」和「二奶奶這邊的」。它們就像外戚與宦官，閹豎與東林……翻遍所有的舊書店，我們幾乎找不到一本沒有「派系」的武俠小說。</p>\n<p>如果你揪住我的衣領子喝問：江湖上到底有沒有「派」？我當然只好說「有」——每一個江湖好漢的成長都離不圈子。有地域的圈子，比如郭靖就有一群蒙古朋友；有年齡的圈子，郭靖和拖雷的年齒相近，和察合臺、窩闊臺的年齡差距就比較大，也就不太熟；有師承門派的圈子，例如郭靖對七怪、全真教始終不忘故舊；有性格愛好的圈子，郭靖和楊康、歐陽克就怎麼都玩不到一塊兒。</p>\n<p>所以你至少可以故作深刻地說，郭靖在北方各族裡屬於蒙古派，在蒙古派裡又屬於拖雷派；在江湖上屬於七怪派，在整個江湖的青少年俠士裡又屬於無趣派。粗略一算就已經四五個派了。</p>\n<p>但如果你的眼睛裡只有「派」，甚至把「派」當作解讀江湖武林大事件的唯一脈絡，會謬以千里的。</p>\n<p>在江湖上，大多數時間裡，「派」不是一個絕對清晰嚴密的團體，不像一些觀察家所想象的，每個大俠腦門上都頂著一個清晰的標籤，可以被歸屬成這個派、那個派。比如黃蓉作為丐幫幫主，是汙衣派還是淨衣派？要是以私人情感論，她和魯有腳關係最好，應該算是汙衣派；但她和樑長老、簡長老關係也不惡啊。最要命的是，汙衣派的宗旨是什麼？一要行乞，二要衣著噁心邋遢，三要把飯菜弄得稀爛才吃，黃蓉能這麼幹？</p>\n<p>事實上，她在生活方面是個堅定的淨衣派，最差的打扮也是在大勝關英雄大會上，穿「淡紫的綢衫」，實在躲不過丐幫幫主的身份，也只是在「不顯眼處打幾個補丁了事」。</p>\n<p>江湖上內鬥最兇狠的，莫過於日月神教。你可以說神教有「任我行派」和「東方不敗派」，也勉強可以說向問天、任盈盈是「任派」，童百熊、楊蓮亭是「東方派」。但是問題來了——日月神教的另一些高手，桑三娘、秦偉邦、黃鐘公這夥人又是什麼派？前兩人逼死了後者，又算是什麼派打什麼派？更頭疼的是，長老曲洋又該算是什麼派？要從感情上說，他和劉正風關係最好，總不能說他是衡山派！</p>\n<p>「派」不會告訴你所有的答案。楊康殺了歐陽克，你以為是「全真教和白駝山矛盾的總爆發，是他們的總後臺周伯通和歐陽鋒水火不容的體現」？別搞笑了，他們是在爭姑娘。</p>\n<p>郝大通打死了孫婆婆，你以為是「古墓派和全真教數十年尖銳對立的必然擦槍走火」？同樣別搞笑了，郝大通不過是要面子，孫婆婆不過是要男娃子，兩個老人處事不夠圓融，不關王重陽和林朝英什麼事。</p>\n<p>謝遜打死了神僧空見，難道是「少林三渡滿懷對魔教之仇，在幕後指使愛徒空見收容庇護魔教敵人成昆，招致了魔教謝遜的一次復仇行動」？我不得不說，真相只是空見神僧太單純。</p>\n<p>用「派」來解讀江湖武林，是一種偷懶的捷徑：在這種邏輯下，所有的對立，都是黨同伐異；所有的握手，都是利益共謀。這就是無知之論的典型特點：當事人沒有切身體會過江湖的水深，對江湖的風向和水文缺乏概念，於是總想在大事件中建立一些簡單的因果聯絡——只要劍宗有人倒黴了，就必定是氣宗的陰謀嘛，還調查什麼呢？</p>\n<p>再寫就長了，做個總結吧。</p>\n<p>——在武俠江湖裡，「派」在多數時候是一個不絕對清晰和有組織的團體。有的人可能身兼數派的特點，比如郭靖作為金刀駙馬，有高富帥派的一面；作為農婦李萍之子，又有質樸的一面。江湖人物是複雜的立方體，不要幻想一個框能把他們裝下。</p>\n<p>——「派」不是江湖俠客們做事的唯一標準和根本原則。一流的俠客們會隨時超越自己的「派」，依照著現實的需要，或結盟，或反目，或死磕。林平之可以和左冷禪聯手，過去他們從來不是一個派，但有了共同的敵人岳不群，他們就成了「派」。</p>\n<p>——不能忽視大俠們個人性情的重要性。江湖俠客們是「利益人」，但他們也仍然是自然人；只要是人就有感情、有好惡、有情緒。令狐沖曾是「任我行派」的骨幹，但由於個人情趣和老大任我行格格不入，結果在「任派」裡越來越邊緣，最後乾脆滑落到和「任派」作對的反面上去了。</p>\n<p>總之，江湖複雜。手捧一冊俠義小說，常嘆息情節無常，又深感所知有限。正在發愁該怎麼結束時，突然猛地想起一部古典名（rou）小（pu）說（tuan）開篇的那首詞來：</p>\n<p>黑髮難留，朱顏易變，人生不比青松；名消利息，一派落花風。</p>\n<p>得趣朝朝，燕酣眠處，怕響晨鐘；睜眼看，乾坤覆載，一幅大春宮。</p>"},{"title":"小圈子裡的大人物","content":"<h2 id=\"sigil_toc_id_35\"><span>小圈子裡的大人物</span></h2>\n<p><span><span>桃花山上的好漢排座次，老大叫「打虎將」，老二叫「小霸王」，都像煞有介事。</span></span></p>\n<p>我常常覺得，咱們電影圈裡的腕兒們，和另外某個圈很像，但一時半會兒又總想不出是哪個圈。直到有一次路過報攤，一晃眼看見電影雜誌和《體壇週報》擺在一起，這才猛然想了起來：是足球圈。</p>\n<p>曾經有那麼幾年，中國足球圈裡有很多大人物。這個是「董」，那個是「大將軍」，還有亞洲第一啥啥、東亞第一啥啥、三十年不遇的啥啥，反正個個都有才，名號都很輝赫。</p>\n<p>當時足球圈裡那些腕兒的做派，也都很符合我們對大人物的想象：愛翻白眼，比較刺兒，不好好說話，說事兒喜歡上下五千年，對批評的容忍度比較低，常常又怒斥誰誰、又炮轟誰誰之類。</p>\n<p>那些腕兒們自己也很鬱悶。他們敏銳地察覺到，在公眾和媒體表面上的追捧背後，總是隱藏著一種不待見的情緒，一等到他們風頭不順時就會冒出來反攻倒算。</p>\n<p>這種不安全感讓他們覺得委屈。2014年巴西世界盃，有網站約郝海東來做節目，老同志退役都這麼多年了，一開口，仍然對足球評論員們有撒不完的怒氣。</p>\n<p>常常有人指責說，這些球員脾氣太大，我覺得這不太公允。這不怪人家脾氣大，要怪圈子小。</p>\n<p>那時候的中國足球，是個標準的小圈子。所謂「亞洲前四」的實力，見了韓國伊朗雖然照例要　　，但遇到沙特似乎還可一戰；遠徵畋獵雖不足，看家護院卻有餘。這等小圈子裡的大人物，脾氣難免要大一點。</p>\n<p>就好像《水滸傳》裡的桃花山，實力雖然遜，卻也足以猖狂村野，稱霸鄉裡。山上的好漢關起門來取外號、論座次，老大叫「打虎將」，老二叫「小霸王」，聽著都像煞有介事。只要魯智深不打山下路過，就太平無事，一眾嘍囉前呼後擁，天天朝拜。</p>\n<p>我的主業是讀金庸。翻翻金書的武林人物，那些脾氣最大、最刺兒的、在四川、重慶方言中所謂「吆不到臺」的人，都是混小圈子的人。</p>\n<p>比如《天龍八部》，整部書裡最狂的是誰？不是掃地僧，亦非北喬峰、慕容博、鳩摩智，而是「劍神」卓不凡先生，是個典型的小圈子裡的大人物。又比如《神鵰俠侶》裡蒙古王子霍都、《倚天屠龍記》裡的高麗武士泉建男，都是典型的狂徒，剛來中土時，一個居然敢放話讓郭靖接他三十招，另一個則打算挑了武當七俠，都是在小圈子裡混久了的典型。</p>\n<p>相比之下，圈子如果大一點，刺兒反而倒軟一點。林沖是東京八十萬禁軍槍棒教頭，犯了罪被髮配充軍，在滄州一個村子裡碰到了武術教師「洪教頭」，兩人見面的情景就很有意思。</p>\n<p>洪教頭是「歪戴著一頂頭巾，挺著脯子」。林沖急急向他躬身唱喏，洪教頭「全不睬著，也不還禮」，說話也不好好說，有一搭沒一搭的，很像今天許多腕兒的做派。</p>\n<p>這不能怪洪教頭粗魯。書上解釋了他形成這種做派的原因，是「到此不多時，此間又無對手」——要知道，洪教頭從事武術活動的地方，是偏僻的滄州橫海郡的一個村莊，乃是「遠惡軍州」，他在村裡又沒有對手，當然就比較牛。你不能像要求林沖一樣要求他，林沖是混東京大圈子的，知道天外有天的道理。</p>\n<p>小圈子裡的大人物，一大顯著特點是對批評的容忍度往往比較低。同樣是《水滸傳》裡，大俠王進逃難到偏僻的史家村，無意間批評了村長的兒子武功不好，這位兒子頓時大怒：</p>\n<p>「你是什麼人？敢來笑話我的本事？俺經了七八個有名的師父，我不信倒不如你？你敢和我扠一扠嗎？」</p>\n<p>想想我們當年吐槽的一些電影，那些被招惹的大導演們的激烈反應，恨不得把批評者們揪出來親手「扠一扠」，是不是很像史家村裡的兒子？</p>\n<p>對於一些大人物的獨特脾性，我們常常喜歡理解為「有才」。因為我們絕大多數人都沒有才，所以不明白「有才」究竟是怎麼回事，就像男人永遠理解不了女人懷孕是什麼感受。</p>\n<p>我們喜歡給「有才」的人附會一些東西。比如大人物愛翻白眼不好好說話，我們覺得是因為他「有才」，所以孤標傲世；大人物面對批評常要發飆，也是因為他「有才」，所以「深深感到與世界無法交流的痛楚」。就像前幾天我看了一個評論，某導演身上的刺兒，乃是為了刺醒一眾庸人的神經云云。</p>\n<p>我覺得這和「有才」沒什麼關係。真相是因為我們的電影也是個標準的小圈子，而他們在這個圈子裡混久了。</p>\n<p>中國電影說起來是「輝煌一百年」，就如同《天龍八部》裡的三十六洞主、七十二島主，你非要說人才薈萃，我也不好反駁，確實湧現出了烏老大、不平道人等「人物」不是？但事實擺在眼前，這些個人，這幾臺戲，成色怎麼樣，經典有幾何，你我心裡有數。</p>\n<p>無怪這裡發生著和當年足球圈很像的一幕：誰誰是董，誰誰是大將軍，誰誰是三十年不遇之奇才，誰誰又是不世出之怪客，個個霸氣側漏。你要是敢問具體成績，那肯定是找不自在，他們必定對你翻白眼：你懂不懂球？</p>\n<p>村裡的大人物們，其實不是不知道外面天高地大。就像「劍神」卓不凡，再怎麼與世隔絕，也至少該知道世上還有個天山童姥；
