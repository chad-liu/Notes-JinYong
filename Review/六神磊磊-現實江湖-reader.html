他和慕容覆在一起的時候也顯得挺安分。</p>\n<p>小圈子裡的大人物，其實是有著另一副低眉順眼的嘴臉的。只有在關起門來，面對自己村裡的人的時候，才會特別自信。洪教頭之所以敢於鄙視林沖，乃是因為他誤以為林沖是騙子，他覺得真正的大人物在小圈子裡出現的概率很低。如果林沖有個帶鋼印的工作證，洪教頭斷然不會輕率挑釁。</p>\n<p>紅火是好事，但唯獨有一點：我們最好不要把什麼毛病都解釋成「有才」，老這麼過度解讀，對當事人也不公允。記得金聖嘆評水滸時說，同樣是粗魯，魯達粗魯是性急，史進粗魯是少年任氣，李逵粗魯是蠻，武松粗魯是豪傑不受拘束，阮小七粗魯是悲憤無說處，焦挺粗魯是氣質不好。</p>\n<p>大家可能不太熟悉這個焦挺。他「祖傳三代，相撲為生」，在自家的小圈子中山府一帶確實算是一號人物；然而拿到大圈子梁山上比，108將裡焦老師只能排第98。</p>\n<p>你喜歡焦老師沒關係，但如果非要說他粗魯是因為「才華和這世界格格不入所產生的霸氣」，他本人當然是會笑納的，可你不覺得怪噁心的嗎？！</p>"},{"title":"武林高手的導師癖","content":"<h2 id=\"sigil_toc_id_36\"><span>武林高手的導師癖</span></h2>\n<p><span><span>一個武林高手「成功」之後，往往就覺得僅僅「功成名就」不過癮了，而要做人生導師。搞房地產的要當大儒，拍電影的要當佛學大師，主持電視節目的都侃侃而談自己「畫第一,舊體詩第二,文章第三,書法最差」，一臉認真。</span></span></p>\n<p>喜歡給人當導師，大概是武林高手們普遍的毛病。在金庸的江湖裡，不管多麼淡泊名利、與世無爭的前輩高人，潛意識裡都把「導師」當成是終極職業夢想，一有機會給人授業解惑，就比什麼都開心。</p>\n<p>比如風清揚先生，貌似是心灰意懶、隱居深山，但學生令狐沖一上門，就忍不住鑽出來猛教一氣；少林寺的掃地僧前輩，默默蟄伏四十二年，連語言能力都有些退化了，一等到賓客大集，忍不住便道「我有幾句話，不妨說給你們聽聽」，然後訓話整整一章，口水如瀑，大過嘴癮。</p>\n<p>還有任我行同志，在西湖底下坐牢，基本的人身自由都沒了，仍一心不忘教育事業，千辛萬苦地把講義刻在鐵板上，讓學生研讀；獨孤求敗先生人都要去世了，還把論文埋在地下，題曰《論劍道的三個層次》，並隨文附帶玄鐵重劍等全套教具，還貼心地留下了輔導員神鵰，讓後世小子隨時溫習。</p>\n<p>當然，以上這些老師的自身業務能力精強，開的課程都是自己最擅長的學問，傳授得法，徒弟也爭氣，成為師範中的楷模。</p>\n<p>怕就怕有的高手胡亂開課，明明是練鐵砂掌的，卻非要打扮成輕功高手，所傳非其專，誤人子弟。江湖裡這種「成功人士」可不在少數。</p>\n<p>《碧血劍》裡的木桑道長，擅長的是步法暗器，然而自以為圍棋水平絕高，殊不自知是臭棋簍子；滅絕師太所長者不過內功劍術，其實頭腦僵化，全無領袖江湖、隨機應變的帥才，卻堅決自認為大局觀很強，最愛給人上江湖形勢政治課。</p>\n<p>天山童姥性格乖戾，談戀愛也談得稀巴爛，卻非要和虛竹在性靈脩養的問題上爭個高下，還要當人家的愛情導師；《俠客行》的白自在先生，特長是一身吃蛇膽吃來的內功，本來就偏科嚴重，卻非要練十項全能，自封「古往今來劍法第一、拳腳第一、暗器第一的大英雄、大豪傑、大俠士、大宗師」。</p>\n<p>他們越是不擅長什麼，就越喜歡教人傢什麼——《神鵰俠侶》裡的裘千尺老夫人，靠著一門噴棗核釘的功夫，躋身暗器界成功人士之列。按理說，她開門課教學生吐棗核釘就完了，再延伸一點，也最多教到暗器理論學、射釘器工程構造學之類。</p>\n<p>但裘千尺不這麼認為。她覺得自己對戀愛婚姻學最有研究，固執地給女兒開情感婚姻課：「普天下的男人都是一般，對付男人，一步也放鬆不得」「丈夫，丈夫，一丈之外，便不是丈夫了」。她難道不知道自己最不擅長的就是婚戀問題嗎？金庸小說裡還有比她的婚姻更失敗的嗎？她授課的結果可想而知的，女兒沒得到愛情和幸福，反而年紀輕輕就送了命。</p>\n<p>大概人在功成名就之後，便往往覺得做「成功人士」不過癮了，要做精神導師。</p>\n<p>今天，由「成功人士」轉行的導師滿天飛，搞哲學的，搞玄學的，燉心靈雞湯的，言必稱世界大勢的，隨處可見裘千尺們主持的情感熱線、木桑道長們辦的棋藝講堂。搞房地產的要當大儒，拍電影的要當佛學大師，當捕快頭的要做博導，主持電視節目的都侃侃而談自己「畫第一,舊體詩第二,文章第三,書法最差」，一臉認真。</p>\n<p>我們常聽到一句話，叫「認識你自己」。其實它還有一層含義，就是「尊重你自己」——尊重你自己的行業，尊重你的稟賦特長。任何職業只要做到極致，都是值得尊重的，當一個公正的捕快頭，並不比當博導遜色；當一個經邦濟世的好商人，遠比做空頭「大師」有意義。自己明明是A，何必非要裝B。</p>\n<p>只能理解這是出於心虛——捕快頭生怕被當成一介武夫，官員最不願顯得粗鄙無文，商人則唯恐自己銅臭味太濃，於是紛紛操弄起儒釋道、文史哲來，然而又不肯真下功夫鑽研，只能燉燉雞湯，搞搞摘抄，互相抬轎，裝點門面。起初或許還信心不足，但當屬下一片歡呼「鬱鬱乎文哉，老大真牛掰」後，他們遂欣然而喜，毅然踏上成為文化巨匠、精神導師的不歸路，畫個小雞吃米，還自以為是《鳳凰傲意圖》。</p>\n<p>說到這裡，我忽然想起了金毛獅王謝遜。人家是真正的文武全才、水陸俱能，但在和張翠山比書法後，面對對方的銀鉤鐵劃，他爽快地認輸：「我寫不出。」</p>\n<p>好一句「我寫不出」，謝獅王畢竟大氣。書法不好沒關係，好好練自個兒的七傷拳吧，不丟人。</p>"},{"title":"教主最不虔","content":"<h2 id=\"sigil_toc_id_37\"><span>教主最不虔</span></h2>\n<p><span><span>對日月公司的經營理念和市場戰略——「千秋萬載、一統江湖」，全公司上下誰最不當回事？答案很弔詭，居然是CEO東方不敗自己。</span></span></p>\n<p>《笑傲江湖》裡的市場格局，大致有點「一超多強」的意思，所謂「一超」就是最大的公司——東方不敗的日月神教公司。就像所有的公司都有一個承載其企業文化的經營理念，日月公司也有一個理念——「千秋萬載、一統江湖」。</p>\n<p>對這個經營理念，公司裡有奉若神明的，也有陽奉陰違的。最不虔誠的人是誰呢？答案很弔詭，居然是CEO東方不敗自己。</p>\n<p>東方不敗是全公司上下對這個理念看得最透徹、認識最深刻、反思最到位的人。在他（或者她）蓄養男寵的小屋子裡，他曾經向令狐沖等敞開心扉，講述了自己的心裡話：「說什麼文成武德、中興聖教，當真是不要臉的胡吹法螺」。如果這句話換了別人說出來，簡直是對公司理念的極大汙衊中傷，按規矩解僱個十次八次都不嫌多。</p>\n<p>作為日月公司的CEO，東方不敗內心真正認同的運營理念是什麼？原著上他自己作了回答：「直到後來修習《葵花寶典》，才慢慢悟到了人生妙諦……終於明白了天人化生、萬物滋長的道理。」看吧，他信奉的理念居然是「天人化生、萬物滋長」。這完全和公司所提倡的企業文化和組織使命背道而馳——它強調萬物有其變化的規律，就等於否定了「千秋萬載、一統江湖」，簡直是赤裸裸的褻瀆。</p>\n<p>他不但在理念上和公司完全悖反，在實踐上也是一樣，根本不帶頭貫徹董事會的決定，不推行公司擴張型的市場政策，對公司既定的市場發展目標——「一統江湖」態度消極，而是一天到晚「把全副心思都放在楊蓮亭這鬚眉男子身上」，全是享樂和奢靡的東西。當我們瞭解了東方不敗每天的真實生活時，就會頓時明白日月公司這家企業永遠不可能實現「一統江湖」。</p>\n<p>他還沒有半點兒作為公司CEO的榮譽感，居然對任盈盈說，羨慕對方是貨真價實的女人：「若得能和你易地而處，別說是日月神教的教主，就是皇帝老子，我也不做。」難以想象公司員工們知道他的消極態度後會多麼寒心。</p>\n<p>這是多麼諷刺的一幕：在《笑傲江湖》的故事中，在這個偌大的公司裡，那麼多忠誠的老員工和新員工，那麼多成天加班加點、熬更守夜、為了「千秋萬載、一統江湖」的遠大目標而奮鬥的職員，他們團團簇擁著的CEO卻是一個純粹的異端。</p>\n<p>日月公司的八字經營理念，東方不敗不信，其他高管信嗎？答案是沒有一個信的。老CEO任我行當然是不信的；董事會另一位成員向問天也是不信的。再往下，賈布、上官雲、曲洋等高管也是不信的。雖然他們的興趣愛好千差萬別，有的喜歡研究毒水毒藥，有的喜歡研究民族樂器，但真正認同公司八字經營理念的，一個也沒有。</p>\n<p>眾多高管裡面，只有童百熊對CEO東方不敗倒是死忠，但那是因為私人感情，根本談不上理念層面的認同。事實上，他是整個公司裡對這位偉大的CEO的底細最清楚的一個，念念不忘：想當年你寒酸的時候，死了爹媽沒錢埋，是老人家我給你料理的……</p>\n<p>公司偌大的權力金字塔裡，越是上層，就越不虔誠；越往下走，忠誠的好員工就越多。照理說，童百熊的孫子本來應該是最難管理約束的員工，因為他的爺爺是公司的叛徒，他自己是出身不佳的狗崽子。但這個十歲的小孩子反而似乎對公司最虔誠：「一天不讀教主寶訓，就吃不下飯，睡不著覺。讀了教主寶訓，練武有長進，打仗有氣力。」</p>\n<p>教主常常是最不忠實的員工，這種事發生在各行各業，就好像編寫星座知識的人往往最不信星座一樣。記得我大學時候一個校友，據說每月一千塊錢給一家網站攢關於星座的內容，天天在地下室裡筆耕不輟。這種人會信星座才怪。</p>"},{"title":"某絲的崇拜是種高利貸","content":"<h2 id=\"sigil_toc_id_38\"><span>某絲的崇拜是種高利貸</span></h2>\n<p><span><span>但凡是智識上的某絲，總有兩樣東西最敏感，一是道德感，二是自尊心。他們對你的喜愛很容易轉化為憤怒。在付出了尊敬後，他們會小心翼翼地等待著回報；一旦不如願，他們就會懵了，然後用十倍的怨毒要求你補償。</span></span></p>\n<p>在金庸江湖裡，我們經常發現一個很熟悉的現象：有一些明星偶像們，雖然沒什麼顯著劣跡，但總是特別招人恨，尤其是招某絲們恨。</p>\n<p>比如《射鵰英雄傳》裡，最上層的人物是「五絕」，他們是當時的競技體育明星；最某絲的是柯鎮惡等江南七怪。而柯鎮惡對「五絕」恨得要命。</p>\n<p>他曾大聲怒斥：「你們東邪西毒，南帝北丐，自恃武藝蓋世，就可橫行天下了？哼，我瞧多行不義，必無善果！」</p>\n<p>他罵得很突兀，連一旁的周伯通都忍不住好奇地問他：「咦，南帝又犯著你什麼了，連他也罵在裡頭？」</p>\n<p>柯鎮惡恨東邪，還可以理解，畢竟東邪有殺他兄弟的嫌疑；但恨西毒，就說不過去了。翻翻原著就知道，他罵出此語時，西毒還從沒公開得罪過他，殺他兄弟的事也還沒露餡兒；至於南帝，八竿子打不著，南帝有沒有聽說過「江南七怪」這號人物都是個問題，柯鎮惡把他也罵上了，誤傷面確實有點過大。</p>\n<p>再作個對比，你會發現一個更有趣的現象：同樣是殺了他兄弟的仇人，而且還打瞎了他的眼睛，但柯老爺子似乎並沒有這麼恨梅超風——碰到梅超風時，他的表現是恐懼、剋制、冷靜；但碰到黃藥師時，他的反應是抓狂、歇斯底里、拼老命。</p>\n<p>他在蒙古的崖頂上遭遇梅超風時，自知不是對手，不能魯莽報仇，於是用計嚇跑梅超風了事；但碰到比梅超風還厲害十倍的黃藥師時，他的理智突然就都崩潰了，像沒了腦子一樣上去猛衝亂打，這不奇怪嗎？</p>\n<p>事實上是，梅超風這個層次的仇人，只傷害了他的親情，所以只有仇恨；而黃藥師還傷害了他的自尊。他對黃藥師除了仇恨，還有強烈的看不慣。</p>\n<p>這源自一種微妙的「從崇拜到仇恨」的心路歷程：一開始，柯鎮惡等七怪雖然知道黃藥師名聲不好，但仍是不無敬仰的，稱五絕是「當世五位武功最高的前輩」，連聽到他們的名字，都要「不禁肅然起敬」。</p>\n<p>可惜的是，柯鎮惡沒有和「五絕」這個層次的人打交道的經驗。過去，他結交過的層次最高的人是丘處機，雙方有過良好的互動。他對丘處機付出了崇敬和友誼，而丘處機也向他回饋了足夠的尊重。可惜，這種愉快的經驗卻無法複製在地位更高、性格更怪的黃藥師身上。</p>\n<p>在和黃藥師見了面之後，柯鎮惡想必感覺到了一種強烈的落差，覺得自己遭到了蔑視。當時的情形是：黃蓉向父親介紹柯鎮惡六怪，黃藥師卻粗魯地來了一句「我不見外人」。結果，六怪「見他如此傲慢無禮，無不勃然大怒」。</p>\n<p>江南七怪被很多人輕視、汙衊過，言辭比黃藥師過分的多的是，但七怪並不總是勃然大怒。而一旦當自己敬重的「五絕」只是輕描淡寫、不經意地蔑視了自己一把，就足以讓人怒火中燒，甚至留下心理陰影。柯鎮惡會把這種陰影擴大到「五絕」的其他人身上——連從不曾招惹他的南帝，他也一起恨上了。</p>\n<p>柯鎮惡其實不算是一個小氣的人，某些方面還很大度。我在此無意拿他當反面典型解剖。事實上，對於明星、偶像們莫名地恨，在江湖上有太多例子。</p>\n<p>《連城訣》裡，武林人士們表面上都很尊重大俠「南四奇」，在內心深處卻都莫名地痛恨著他們。在得知他們的死訊後，人人嘴上都「嘆息了一番」，心裡卻都「暗暗存在一個念頭：‘南四奇’這些年來得了好大名頭，耀武揚威，不可一世。死得好，死得妙！」</p>\n<p>這有助於我們理解現在體育圈裡的一些現象。但凡「某絲」們，總有兩樣東西最敏感，一是道德感，二是自尊心。這裡的某絲，不是指身份上的，而是指智識上的。</p>\n<p>他們的崇拜是一種高利貸。他們對你的喜愛，很容易轉化為憤怒。他們付出了尊敬後，會聚精會神、小心翼翼地等待著回報。如果這種預期的回報沒有出現，他們就會用十倍的怨毒，讓你補償。</p>\n<p>他們總是喜歡一廂情願地預設自己和偶像的關係：偶像們成功時，必須說大快人心語，好供他們歡呼；偶像失敗時，必須作傷心痛苦狀，好供他們安撫；偶像碰到傷病、中途倒下時，必須作涕淚交流、萬分愧疚狀，最好是爬到終點，繞場一週，向他們致意，好讓他們感受到自己存在的意義。</p>\n<p>如果這些預設的場景沒有出現，如果偶像失敗時並不向他們反省，如果偶像倒下後只是爬起來默默回頭走了，「某絲」們就會懵住：你怎麼能這樣？我是這麼地尊重你，我是這麼地愛戴你，你嚴重地虧欠我了！於是，你瞬間成了他們的仇人。</p>\n<p>這就可以解釋為什麼偶像勝利後沒有感謝國家，「某絲」們就會出離憤怒——他們其實並不是為國家難過，他們是為自己難過。</p>\n<p>確實，有一些偶像的自身素質不太好，黃藥師就是一個，我們會另文分析。但問題在於，即便偶畫素質不好，只該讓人產生反感和排斥，最多是譴責；只有加上奇妙的「某絲」心態，才能產生怨毒。</p>\n<p>《射鵰英雄傳》的後來，陰差陽錯，因為郭靖、黃蓉的結合，柯鎮惡和黃藥師成了一家人，但他們終究沒有住在一起。黃藥師選擇了讓出桃花島，獨自浪跡江湖。</p>\n<p>是什麼讓黃藥師在島上感覺不自在？有沒有柯鎮惡的因素呢？反正，本身就素質不太好的明星偶像黃藥師，和有一點小敏感的草根柯鎮惡，能搞到一起才怪。</p>"},{"title":"江湖大佬們的遺言","content":"<h2 id=\"sigil_toc_id_39\"><span>江湖大佬們的遺言</span></h2>\n<p><span><span>大佬的遺言，往往很讓人失望。《笑傲江湖》裡四個大佬的遺言，左冷禪是「有火把？」任我行是「永如今」；岳不群是「啊喲！」東方不敗是「你好毒！」都很無釐頭。</span></span></p>\n<p>人固有一死，分析一下金庸筆下那些江湖著名大佬們臨死之前會說些什麼話，是件挺有趣的事情。</p>\n<p>在善良的人們的心目中，那肯定應該是振聾發聵、黃鐘大呂的，比如「我真的好想再活五百年」之類。然而，現實總是無聊的。江湖大佬的精彩遺言往往只存在於人們的想象裡，真實的情況有時很糟糕。</p>\n<p>就像《笑傲江湖》裡，夠得上野心勃勃的「大佬」級的人物只有四位，但他們的臨終表現都不太精彩。左冷禪的遺言是無釐頭的「有火把？」任我行的遺言是半截子沒說完的話：「永如今」；岳不群的遺言是：「啊喲！」東方不敗的遺言則稍微文藝一點，但仍然很無釐頭，居然是張學友的歌名：「你好毒！」</p>\n<p>人們對這種遺言肯定不會滿意。翻翻史書，在我們的民間，善良的人們發揮想象力，給古代臨終的大佬們杜撰了很多精彩的遺言。一般來說大致分成三類：</p>\n<p>第一類是遺憾型的，表示對事業未竟的深刻惋惜。比如「既生瑜、何生亮！」「今大事未成，奈何死乎！」這類遺言一般都是設計給功敗垂成的英雄們的。如果沒有這些遺言，我等凡夫俗子又拿什麼抒發對豪傑們大業不成的唏噓？</p>\n<p>第二類是傲嬌型的，對自己極度自戀，對失敗死不認賬，比如項羽同志的「天之亡我，我何渡為？」還有金輪法王在絕情谷受到東邪、南帝、中神通的圍攻後，自知難以倖免，乾脆耍賴般把輪子拋在地下：「單打獨鬥、老衲誰也不懼」。</p>\n<p>第三類是叮囑型的，比如《封神榜》裡的周文王：「你過來拜子牙為尚父」，就是典型的叮囑型遺言。</p>\n<p>臨終遺言不可小看，它是構成江湖大佬歷史形象的重要一部分。人們不自覺地有一種習慣，喜歡給大人物們層層堆疊一些東西，直到完全符合我們的想象為止。大人物們臨死前到底說了什麼，天知道；關鍵的是人們希望他說些什麼，然後歷史就會逐漸被堆疊成這個樣子。當事人真正的面孔，往往已經淹沒在層層的刪述和粉飾之中。</p>\n<p>其實《笑傲江湖》裡那些不太精彩的遺言反而可能更符合實際。就像很多人諷刺歷史上曹操的遺言，說他「分香賣履，留戀妾婦」，但請問大家覺得曹操死前應該說什麼呢？難道非要說：「丕，一統天下吧！幸甚至哉，歌以詠志！」</p>\n<p>有趣的是，我們給江湖大佬們編造了五花八門的遺言，但唯獨有一種非常稀缺，那就是慚愧型的遺言。如果哪位大佬說了這樣的遺言，我們往往並不因此而更尊重他，反而有些瞧他不起。</p>\n<p>在《倚天屠龍記》裡，明教教主陽頂天臨終前遺書說：「餘名頂天，然於世無功，於教無勳……狂言頂天立地，誠可笑也。」像這類慚愧型的遺言少之又少。連陽頂天本人似乎也覺得不好意思，認為自己堂堂教主，在臨終前低頭認錯，終究不大體面——在他的遺書中，前文中關於吩咐後事、安排教務的內容都用大字寫成，唯獨懺悔這一段改用「一行小字」，顯得頗為拘禁羞澀。讀者們對陽頂天也普遍不大推崇，覺得他是個失敗的領袖。</p>\n<p>看來大家都覺得，江湖上的豪雄們不會做錯什麼事，即便做錯了事也大可不用慚愧。與其像陽頂天一樣絮絮叨叨地贅述前過，顯得很不夠霸氣，遠不如項羽般地一錯到底更招我們喜愛。</p>\n<p>寫到這裡，我不禁想起羅伯斯庇爾的遺言：「我們將會逝去，不留下一抹煙痕；因為在人類的歷史長河中，我們錯過了以自由立國的時刻。」這算不算是少有的慚愧型的遺言呢？羅伯斯庇爾也太多此一舉了，其實他慚愧的算是什麼大錯呢？</p>"},{"title":"信不信讓人和你絕交","content":"<h2 id=\"sigil_toc_id_40\"><span>信不信讓人和你絕交</span></h2>\n<p><span><span>不明交了，還可以暗交；不暗交了，還可以神交。左盟主管天管地，還管得了劉正風和誰神交嗎？</span></span></p>\n<p>金庸的小說裡，一大主題是友情：郭靖和拖雷的友情，武當七俠的友情，謝遜和張翠山的友情，苗人鳳和胡一刀的友情……無不感天動地，基情四射。</p>\n<p>然而，偏偏有一種事，在金庸的江湖裡經常發生，那就是逼著別人和朋友絕交。比如《笑傲江湖》裡，就有一個最著名的逼人絕交的故事：</p>\n<p>當時江湖上的名門正派都痛恨魔教，也因而仇恨魔教的長老曲洋，好像一提到曲洋的名字，他們都要衝天憤怒。於是……於是俠客們殺了曲洋？剮了曲洋？都沒有。他們憤怒地找到曲洋的一個朋友劉正風，捉了老劉全家當人質，強烈要求劉正風寫下保證書，和曲洋絕交。</p>\n<p>劉正風不肯絕交。俠客們義憤填膺地殺了老劉全家，然後高興地走了。於是正義得到了伸張，曲洋得到了懲罰。</p>\n<p>這真是一招妙棋——雖然我們拿曲洋沒辦法，但他們至少拿曲洋的朋友有辦法；雖然我們整治不了曲洋，但我們至少可以噁心一下曲洋。</p>\n<p>有趣的是，雖然俠客們那麼痛恨魔教，搞得好像和魔教不共戴天的樣子，但我把整部《笑傲江湖》從頭翻到尾，沒有一個俠客提出過要去直接攻打魔教，好像大家都想不起這回事一樣。</p>\n<p>魔教的位置，從來都不是秘密。東方不敗就住在河北省平定州西北四十餘裡的黑木崖上，人盡皆知。既然那麼恨魔教，上山把這個大壞蛋幹掉，不就結了？然而，俠客們沒有一個人提過要上山去幹掉東方不敗的。他們只是憤怒地找出一個又一個劉正風，逼他絕交，殺他全家，然後興奮不已。</p>\n<p>俠客們彷彿遵守著一種奇妙的默契：恨魔教可以，罵魔教可以，真去打魔教，絕對不可以。</p>\n<p>反而是魔教對名門正派從來不玩讓人絕交的遊戲，而是經常操著傢伙上門就打。比如那什麼範鬆趙鶴、張乘風張乘雲等「十長老」，一不開心就提著斧子來攻華山。</p>\n<p>像這種逼人家絕交的故事，金庸江湖上還有不少。例如《倚天屠龍記》裡的滅絕師太，她最大的仇人叫楊逍，是魔教的高管人員。她口口聲聲和楊逍誓不兩立，一提到楊逍兩個字都要拍案大怒。但有趣的，幾十年裡，從沒看見滅絕師太去崑崙山找過楊逍報仇。她唯一做了的事情，就是在自家的峨眉山上，咬牙切齒地對著崑崙山比中指。</p>\n<p>直到有一天，她發現自己的女徒弟紀曉芙和楊逍有私情，便好像又突然記起了這樁深仇大恨般，大張旗鼓，要求紀曉芙和楊逍絕交。紀曉芙不肯，師太便滿懷仇恨打死了紀曉芙，並憤怒地要殺掉紀的女兒，以表示要「斬草除根」。</p>\n<p>做完這一切後，師太又變得更加威嚴了幾分，好像她的血海深仇已經報了一小部分一樣。</p>\n<p>對於自己為什麼一直不找楊逍動手，在原著里老師太做出瞭解釋，說是一直不知道楊逍的下落——滅絕師太抬頭向天，恨恨不已，喃喃自語：「楊逍，楊逍……多年來我始終不知你的下落……」她這話是有意當著徒弟們講的託詞，是靠不住的。</p>\n<p>讀者都知道，在《倚天屠龍記》裡，你可以說謝遜不好找（在北極），陽頂天不好找（悄悄死掉好多年了），範遙和黛綺絲不好找（整容了），你絕對不能說楊逍很難找。何況，師太既然說找不到楊逍，為什麼後來六大門派聯手圍攻明教的時候，師太立刻雄赳赳氣昂昂地加入，揮師直殺崑崙山，還發表了一番慷慨的演講，要「先取光明左使者楊逍」。這時候她老人家就找得到楊逍了？</p>\n<p>再者，就算你找不到楊逍，就不能讓楊逍來找你嗎？你可以去光明頂滅了聖火嘛，可以搞些炸藥去炸光明頂的聖地地道嘛，楊逍能不來管嗎？</p>\n<p>滅絕師太的舉動，怎麼看怎麼像《天龍八部》裡的鐘萬仇。他恨透了段正淳，又不敢上門找人家報仇，只好在自己家裡豎一個牌子：「姓段的來我家殺無赦！」你說你做給誰看呢？！</p>\n<p>滅絕師太的徒弟丁敏君抱怨她的一句話，用在此處倒頗為貼切：「你打不過人家，便拿我出氣！我算是倒黴！」</p>\n<p>所以說，憎恨是一把雙刃劍。當我們公開表達憎恨一個人的時候，實際上也給自己挖了個坑：你必須得對這個傢伙做點什麼，打一頓最好，罵兩句也行。不然會很沒面子。</p>\n<p>但偏偏有時候，你雖然不得不憎恨他，但又打不過他、辯不贏他、惹不起他、動不得他，無奈只好大吼一聲：「丫等著，信不信讓人和你絕交！」</p>\n<p>江湖上真正有實力的大俠，處置別人的標準是「罪與非罪」，你有罪，老子就收拾你；你沒罪，老子就不動你——比如《俠客行》裡的龍木二島主，認為人家有罪的就直接痛快宰掉，什麼時候玩過逼人家絕交的把戲？</p>\n<p>而那些實力不夠、底氣不足、辦事又做不到公平的俠客們，處置人的標準就不能再是「罪與非罪」了，而是「惹得起和惹不起」。一旦碰上惹得起、辯得贏的，就不妨幹掉；碰上惹不起、辯不贏的，就回頭收拾他的三鄰四友、七大姑八大姨，威風凜凜地讓他們寫絕交保證書。</p>\n<p>東方不敗有罪，但是咱惹不起，所以從長計議；劉正風本來沒罪，但是你和東方不敗的魔教交往，你就有罪，何況我們又惹得起你，所以殺你全家。就好像《哆啦A夢》裡，尖嘴強強如果惹不起胖虎，就回頭去抽康夫：「抽死你，叫你跟他混！」</p>\n<p>其實俠客們自己也明白，江湖歷史上，保證書什麼時候有用過？交情這種東西，又真的能絕得了嗎？不明交了，還可以暗交；不暗交了，還可以神交。嵩山派左盟主管天管地，還管得了劉正風和誰神交嗎？！</p>"},{"title":"大同府的姑娘","content":"<h2 id=\"sigil_toc_id_41\"><span>大同府的姑娘</span></h2>\n<p><span><span>跑了不少地方，從沒發現哪裡的姑娘就一定比別的地方的好看，唯獨只發現一點：第三產業的姑娘比第二產業的好看，第二產業的姑娘又比第一產業的好看；土豪產業的比某絲產業的好看，朝陽產業的姑娘比夕陽產業的好看。</span></span></p>\n<p>話說《鹿鼎記》裡有一個經典段子，說韋小寶跑到少室山下逛窯子，抖擻精神，看見老鴇，劈頭就是一句：有沒有大同府的姑娘？</p>\n<p>就這麼一問，便顯得韋爵爺是歡場老手、出語不凡。老鴇頓時「面有慚色，低聲道：‘有是有一個，不過是冒牌貨，她是山西汾陽人，只能騙騙冤大頭，可不敢欺騙行家。’」</p>\n<p>金老爺子筆下，逛窯子就像逛潘家園，進門頭一句問話最講究門道。是內行還是棒槌，一問之下就露了底。</p>\n<p>於是問題也來了：韋小寶為什麼點名要找大同府的姑娘？這家妓院為什麼巴巴地要找汾陽女子來冒充大同府的姑娘？</p>\n<p>對這一問題，不少人都下功夫做過研究，作家嚴曉星在《金庸識小錄》裡為此還興致勃勃地專門講了一章。各種說法中，被引用最多的是明代一本書，名字很拗口，叫作《五雜俎》，內中說：「九邊如大同，其繁華富庶不下江南，而婦女之美麗，什物之精好，皆邊寨之所無者。」還說「大同婆娘」和「薊鎮城牆」「宣府教場」並列叫作「三絕」。</p>\n<p>這看似有理。要知道，寫這本書的作者叫謝肇淛，此人出生在杭州，自小是從江南美人窩裡滾過來的，眼光想必是高的。大同女子當時不知道是何等美麗法，居然讓他也感到驚豔，還特意記在了書裡，使我等後輩讀到，如何不垂涎想象。</p>\n<p>不過《五雜俎》這本書聽聽便可，倒也不能太當真。書裡內容不靠譜的多。比如說人身上生有白毛的就是人妖，還說有「九真女子趙嫗，乳長數尺」，等等。由此看來，這位謝先生不但編書的風格任性，口味也真真是好重的。</p>\n<p>大同女子的豔名，其實不少是來自明清兩代的下三路文學。清朝有個叫呂熊的文人，寫了本小說《女仙外史》，講白蓮教起義的故事，文筆很糟糕，其中專門寫到一個大同府的「失足婦女」，書上說：「有一大同府妓者，姓柳，名煙，字非煙……生得體態輕盈，姿容妖冶，舉止之間，百媚橫生……一時名震西陲，獨是淫蕩絕倫，有‘滿床飛’之號。」</p>\n<p>讀到這一段，不禁瞠目結舌。「滿床飛」這外號真是任性。曾聽到過一句民諺說：「左痣嬌，右痣俏，上痣滿床飛，下痣天天要。」看來名振西陲的柳姑娘應該是屬於「上痣」型別的。</p>\n<p>在這些文人的拼命炒作下，別說是韋小寶爵爺了，那些更有名的人也不能免俗，對大同趨之若鶩。清朝的大才子紀曉嵐據說好色成癖，被當時人稱為「野怪轉世」，他就特別鍾愛一個小妾，名叫郭彩符。我一直搞不清楚原因，直到讀到他在《槐西雜誌》裡說:「侍姬郭氏,其父大同人……」這才恍然大悟，原來郭姑娘也是大同妹子。</p>\n<p>又例如明朝的正德皇帝，坐擁豹房這種高階娛樂場所，也忍不住要跑到大同去散心，遇到千嬌百媚的李鳳姐姊妹，當場上演了一出《遊龍戲鳳》，到今天京戲裡還唱個不停——那時候搞豔遇哪有麗江什麼事呢？無怪乎當年馮玉祥將軍帶兵打山西，這個能關了河南所有妓院的人，為了激勵部隊的士氣，軍歌裡也要高唱「北地胭脂大同女,銀子窩窩府十縣」，真是振奮人心。</p>\n<p>當然，如果以為李鳳姐就是當年大同姑娘的代表，那也是錯了。光靠美麗和奇技淫巧討好男人，是打不下大同姑娘的名聲的。史書上的大同姑娘是千變萬化的，出得了女神，也出得了女王。隋朝開國皇帝的獨孤皇后、楊家將的折老太君（就是那個小說裡的佘太君），兩個赫赫有名的女王，就都是大同女子。</p>\n<p>例如隋文帝楊堅，亂世裡殺出來的政治強人，居然在獨孤皇后嚴厲的目光下噤若寒蟬，不敢偷吃。後宮佳麗三千，想必綠茶、咖啡、外圍女等人才薈萃，卻從沒有哪個敢作死去勾引老皇帝的。據說後來老皇帝實在忍不住了，偷偷推倒了一個漂亮小姑娘。獨孤皇后聞訊，二話不說，帶上眾宮女抄傢伙就出了門，把倒黴的少女一頓暴打，當場毆死。</p>\n<p>皇帝楊堅得知此事，勃然大怒，然後……然後把皇后廢了？錯。他一個人悲憤交加地跑到了荒山裡，號啕大哭了一場：「吾貴為天子，而不得自由！」哭完之後，老人家擦乾眼淚默默回家了。歷史畢竟不是《聊齋》，沒有賣「丈夫再造丸」的馬介甫。</p>\n<p>閒敘一筆，金庸寫的BUG級高手獨孤求敗，我估計就多半是大同人。要知道大同和古云中郡關係密切，「獨孤」乃是當地赫赫有名的姓氏。在《神鵰俠侶》裡，獨孤求敗於劍冢中留言，「弱冠前以之與河朔群雄爭鋒」，而山西正好便在河朔，可見是少年獨孤求敗揚名立萬的地方。後來他劍術到了新的境界，悟到軟劍、重劍的妙處了，才走出了家鄉河朔，相會天下英雄。</p>\n<p>難怪獨孤大俠驚才絕豔，他血管裡流著大同姑娘的血，繼承了祖上獨孤皇后家族的厲害。</p>\n<p>然而，今天我讀到大同美女紅極一時的故事時，總是有一種很魔幻的穿越感——面對如今的「中國煤都」，你能想象僅僅二三百年前它居然曾以美麗的姑娘而聞名嗎？幾百年過去，如今那裡的城市名片，早由白嫩嫩的婆姨，變成了黑乎乎的煤炭。當年雲中郡那豔冠河朔的風光，只能在一頁頁發黃的史書、筆記裡找尋了。</p>\n<p>其實又何止是大同。如今每一個聽起來俗俗的地名兒，翻開塵封的史冊來，揩抹掉了灰，總是會豔麗得讓你憂傷。比如義烏，過去的名片是什麼？是駱賓王啊。他是義烏給整個中國出產的最精美華麗的產品。</p>\n<p>傳說他避禍躲到錢塘，多年後大詩人宋之問被貶謫，夜遊靈隱寺，想寫詩了，好不容易憋出兩句：「鷲嶺鬱岧嶢，龍宮鎖寂寥」，就沒了靈感寫不下去，忽然旁邊一個老僧隨口說：怎麼不接「樓觀滄海日，門對浙江潮」呢？</p>\n<p>這兩句的氣象和逼格，可比宋之問的高明多了。宋之問大吃一驚，明天再訪，人已不見，才醒悟那老僧就是駱賓王。看來初唐四傑不愧為「傑」，駱賓王排名第四，卻能把大名鼎鼎的「沈宋」硬壓一頭。而如今義烏的名片是什麼？小商品市場啊。</p>\n<p>又比如海寧，曾經最盛產的是什麼？是大詩人、大棋士。前者不必說了，比如徐志摩、朱淑真、查慎行，後者比如清代最牛的兩大圍棋國手範西屏和施襄夏，還出了個晚清「圍棋雙璧」之一的陳小仙。而現在的海寧什麼最有名？皮草城啊。</p>\n<p>風流總被雨打風吹去。黑乎乎的東西，紛紛取代了白嫩嫩的東西，聽上去是個大悲劇，然而這就是我們的小時代。話說回來，如今的人又何必非要死抱著「美女之鄉」的名聲呢？現今論牛掰，不在於你那裡出不出產美女，而在於留不留得住美女。</p>\n<p>現在有些朋友，還念念不忘基因決定論，他們非覺得A地的女孩就是比B地好看，我認為這都是心理作用使然。我跑了全國不少地方，從沒發現哪裡的姑娘就一定比別的地方的好看，唯獨只發現了一點：第三產業的姑娘比第二產業的好看，第二產業的姑娘又比第一產業的好看；土豪產業的比某絲產業的好看，朝陽產業的姑娘比夕陽產業的好看。</p>\n<p>難怪說起如今的城市，不管自己如何包裝，反映在我們頭腦裡的名片一張張總是和錢有關的，都是打著條形碼的。過去的文藝範兒算什麼？劉歡老師唱得好，昨天所有的榮譽，已變作遙遠的回憶。</p>\n<p>論壇上「美女經濟學」的帖子風靡，不能全怪公眾沒文化，而是事實使然——你看空乘裡的美女確實少了，售樓處里美女則更加少了，至於傳統紙媒行業裡的美女，更是快跑光了、絕跡了，偶有殘餘的一兩個，也是笑漸不聞聲漸悄，漬在那裡漸漸珠黃了。</p>\n<p>畢竟人人都不傻，道理都能想通——只要搞活了經濟，哪裡還會缺美女呢；反之，窮鄉僻壤產業凋零，就算出產美女不也要跑光的嗎？知道現代美女分佈規律的精髓嗎？就是煤都不如花都，花都不如帝都，美女不論出處。什麼叫resource allocation？就是連中學生都會背的，要讓市場在資源配置中起決定性作用。</p>"},{"title":"金庸會議學：開會重要性和人數成反比","content":"<h2 id=\"sigil_toc_id_42\"><span>金庸會議學：開會重要性和人數成反比</span></h2>\n<p><span><span>即便是會議文化如此不成熟、會議形式如此粗疏的草莽江湖，居然也遵循一條開會的鐵律——會議的重要性和人數成反比。換句話說就是，開會的人越多，會議越不重要。</span></span></p>\n<p>開會這個東西，本該是我們俗世中的事。金庸江湖裡的俠客大致是一夥粗人，打架的多，講理的少，決定事情一般靠拳頭，本該是不太喜歡開會的。</p>\n<p>我們經常看到這樣的情節：一群俠客遇到了爭端，哪怕文縐縐地商量半天，到最後還是靠打架解決問題，總會有某個人惱將起來，掣出刀子：「多說無益，咱們兵刃上見真章罷！」</p>\n<p>但神奇的是，即便是會議文化如此不成熟、會議形式如此粗疏的草莽江湖，居然也遵循一條開會的鐵律——會議的重要性和人數成反比。換句話說就是，開會的人越多，會議越不重要。</p>\n<p>不妨看看金庸小說裡那幾場真正震動天下、扭轉乾坤的會議，無一例外都是小會；而那些所謂的「群雄大會」「武林大會」，不管再怎麼開得鑼鼓喧天、鞭炮齊鳴，也幾乎無一例外都成了過場乃至鬧劇。</p>\n<p>比如《天龍八部》裡，最重要的一場會議是什麼？毫無疑問是少林寺藏經閣裡，蕭峰父子、慕容博父子和鳩摩智這五大高手開的小會，再加上一個列席旁聽的掃地僧，與會者一共不過六人。</p>\n<p>會議是夠小的，可他們的議題是什麼？乃是遼國、吐蕃、西夏、大理、大燕五家瓜分大宋。真可謂天下興亡大事、歷史轉折關口，全在幾個江湖大腕的一念之間。</p>\n<p>在這次小會上，要不是蕭峰獨持異議，加上旁聽的掃地僧及時作了重要發言，喧賓奪主，力挺蕭峰，讓這個瓜分大宋的「慕尼黑陰謀」未能通過，恐怕天下不久便是幾國交兵，狼煙四起，生靈塗炭了。</p>\n<p>又比如《倚天屠龍記》裡，起到了關鍵轉折性作用的一次會議，就是明教八名首腦擁立張無忌做教主。這也是一次標準的小會——會議地點是在張無忌的病房裡，所有與會人員再加張無忌，也不過九個，再加上一個端茶倒水的小昭也不過是十個人。</p>\n<p>開會的過程也非常簡單：楊逍先吹風，彭瑩玉正式提議，張無忌依禮謙讓，眾頭領一力勸進，最後大家鼓掌通過，時間不過小半個時辰。</p>\n<p>然而這次「病房小會」的意義在《倚天屠龍記》裡怎麼說都不過分——張無忌成了教主，江湖武林格局從此大變，明教由此中興，到後來興兵滅元，終有天下，可以說都是從這一次小會而來。</p>\n<p>再回頭看看那些貌似熱鬧的「武林大會」「英雄大會」，你就會發現它們其實遠沒有看起來那麼重要。</p>\n<p>在張無忌擔任明教教主的全過程中，明教一共開了兩個會；一個是先前的「病房小會」，一個是幾天後的「光明頂大會」。若從形式上說，最終正式確認張無忌教主地位的應該是在後一個光明頂大會上，他和教眾約法三章，答應暫攝教主之位；要論規模，當然也是大會遠勝小會，「光明頂上燒起熊熊大火」「教眾歡聲雷動」「宰殺牛羊，和眾人歃血為盟」。</p>\n<p>但相信沒有人會覺得大會比小會重要。在開大會時，張無忌的教主地位事實上早已敲定。他甚至已經履行了教主職責，實實在在地指揮了一場戰鬥。光明頂大會的實質意義遠遠沒有看上去那麼重要，所謂「約法三章」，不過乃是新教主頒佈施政方針、展現俠骨仁風的儀式而已。</p>\n<p>江湖上更有一些轟轟烈烈的大會，實則有頭無尾，不知所云。比如《射鵰英雄傳》裡的大勝關英雄大會，郭靖黃蓉一力促成的，說是為了選舉武林盟主，領導群雄抵抗蒙元。主持者遍邀天下豪傑，堪稱盛事。</p>\n<p>然而這次大會究竟開成啥樣呢？我們只記得陸家莊的肉山酒海、各方勢力的狠打亂鬥、楊過的插科打諢、達爾巴的混沌呆憨。最後稀裡糊塗弄了個小龍女當盟主，有名無實，不了了之，再無下文。</p>\n<p>又如《天龍八部》裡的聚賢莊大會、少林寺大會，盡數淪為不知所云的愚戰惡鬥。在少林寺大會上，少室山門前的群雄們興高采烈，呼朋喚友，點評英雄，自以為參與了一場武林盛事，尤其是親眼旁觀了不少高手打架，「都覺今日得見當世奇才各出全力相拼，實是大開眼界，不虛了此番少室山一行」。</p>\n<p>然而他們可知道，就在外面的打鬥熱鬧進行的同時，真正重要的小會正在藏經閣裡秘密上演？可知道自己的命運早已形如砝碼，被蕭氏、慕容氏等幾大高手在天平上撥弄嗎？</p>\n<p>金庸小說裡，開會最多的莫過《鹿鼎記》，也將「小會幹大事、大會不幹事」的特徵體現得最明顯。除鰲拜、撤三藩、平邊患，這幾件大事的拍板，全在小玄子和小桂子兩人開的碰頭小會上。等最後再發諸朝臣討論時，看似熱火朝天，實則大家不過是抱著康熙和韋小寶編好的劇本背書而已。</p>\n<p>當然，武林江湖亦有規矩，大會自然有其意義，一些必要的形式仍然是需要的。像康熙主持的撤藩討論大會那樣，確實不能不開。怕就怕最後把大會開成鬧劇和笑話，反而耽誤大事。</p>\n<p>金庸江湖裡最無聊的一場大會，就是《鹿鼎記》裡所謂的「殺龜大會」——天下反清復明的英雄好漢群聚河間府，商討剿殺吳三桂的大計。</p>\n<p>會議的規模十分隆重，「黑壓壓地坐滿了人」，從明朝宗室到雲南沐家、臺灣鄭家、武林豪強等各方勢力雲集，有的明朝遺老遺少還穿著故國衣冠，極壯聲勢。會務工作也是相當到位，「牛肉，麵餅，酒水，流水價送將上來，群豪歡聲大作，大吃大喝」。</p>\n<p>可這麼重要的大會，產生了什麼成果呢？主要成果有兩個：一是出了一本《殺吳三桂方案集》，內容五花八門，有的說要凌辱吳三桂N代祖宗，直接換掉他家族基因，讓他未生先死；有的說要殺吳三桂全家，留他獨活，讓他孤單傷心而死；有的說要將陳圓圓抓來送到窯子裡，讓吳三桂真正做烏龜，鬱悶憋屈死。真是不怕做不到，就怕想不到。</p>\n<p>二是搞了一個《殺吳三桂小組人員名單》，成立了十八個「殺龜同盟」，推選了鄭克爽等十八個「盟主」和陳近南等兩個「總軍師」，可謂是為殺龜提供了強有力的保障。</p>\n<p>然後呢？然後就沒有然後了。</p>\n<p>我們翻完《鹿鼎記》全書，此後整整二十三回、上百萬字裡，這些殺龜方案一條也沒有執行，這些組織一點也沒有發揮作用。到了最後，「盟主」鄭克爽反而一刀殺了「總軍師」陳近南，我們才反應過來：好個無釐頭的「殺龜大會」啊，最後「龜」沒殺了，殺「總軍師」倒是挺利索。</p>\n<p>或有人問：難道「殺龜大會」就一無是處嗎？那也不然，好處還是有的，那就是「殺龜大會」的組織者居然並不勉強大家參會和表態。原著上說，會場的一側角落裡「疏疏落落地站著七八十人」，他們「既不願做盟主，也不願奉人號令」。而作為組織者的顧亭林和馮難敵，也「明白這些武林高人的脾性習性，也不勉強」。</p>\n<p>虧了這一個「也不勉強」。如果會議組織者馮難敵先生抽出刀子說：今天的「殺龜大會」上誰不表態，誰就是縮頭烏龜，我們就先把他殺了，那該多可怕啊！</p>"},{"title":"俠客的名字，江湖的品位","content":"<h2 id=\"sigil_toc_id_43\"><span>俠客的名字，江湖的品位</span></h2>\n<p><span><span>經常有人問我：六神，你就是那個寫了本關於曹操的歷史讀物的王曉磊嗎？</span></span></p>\n<p>我倒想學一學陳百祥演的祝枝山，把臉一抹，正色道：「不錯，姑娘，我就是唐伯虎。」但事實是：我不是。六神是獨一無二的，活潑有才又帥氣。</p>\n<p>同名同姓的事情，我偶爾會碰到，但千萬不要以為我對此煩惱——對於能夠擁有現在這個名字，我滿懷感激和慶幸。我出生的那天，作為老革命的祖父心潮澎湃，大哭了起來，一度拍板要給我取名「王愛國」。幸虧父母深明大義，拼死進諫才作罷。大家該理解我為什麼慶幸，不然你們今天看到就是「六神愛國讀金庸」了。</p>\n<p>取名字這件事情是個學問。每一個寫武俠小說的遇到的第一個考驗，就是給人物取個好名字。這不但影響到小說的流傳度，而且直接暴露作者的愛好和品味。</p>\n<p>《倚天屠龍記》裡，張三豐在漢水上救了一個船戶的閨女，一問名字，叫作「周芷若」。老張頓時很驚訝：「船家女孩，取的名字倒好。」後來他對這個女孩也一直高看一眼，關照有加。</p>\n<p>相反，一些看似不錯的名字其實不一定經得起推敲。比如「岳不群」。大多數讀者可能覺得這是個好名字，又傲嬌又霸氣。事實上古代儒生不大可能會起這個名字，因為所謂小人黨而不群，儒生取這個名字，有可能會顯得自己粗鄙無文的。</p>\n<p>反而是岳不群老婆的名字挺貼切——甯中則，孔子先生說「虛則攲，中則正，滿則覆」，而華山玉女也確實不覆不攲，一輩子都很正派。</p>\n<p>小說里名不副實的人物也有很多。比如《俠客行》裡的雪山派有兩個師兄弟，一個叫齊自勉，一個叫廖自礪。師父給他倆取名的初衷，大約是希望兩人互相勉勵，和睦友好。但在小說裡，他們從來都不互相勉勵，反而互相拼命拆臺，巴不得把對方消滅。所以，當你擁有了一個好的名字，千萬舉止要謹慎，不要讓它成為諷刺。</p>\n<p>一般來說，小說人物的名字總體還是比較響亮的。現實中，有的家長確實不太擅長取名字，包括一些知名人物。</p>\n<p>我給大家舉個例子。距今160多年前，有一位廣東花縣的讀書人生了個兒子，鉚足了勁要取個好名字。他讓人準備了一堆備選方案，經過篩選，一個最洋氣的名字被敲定了——「洪天貴」。</p>\n<p>過了幾年，這個讀書人突然成了暴發戶，當了大官，發了大財，覺得兒子的名字不夠完美，要改。他又鉚足了勁，拼命想了半天，最後敲定「洪貴福」。</p>\n<p>又過了一陣，這個讀書人的事業越鬧騰越大了，覺得兒子的名字還不夠完美，鉚足勁又改了半天，終於臉露微笑，改出了他無比滿意的牛逼名字——「洪天貴福」。這真是個洋氣的好名字。順便說一下，這位讀書人名叫洪火秀，又名洪秀全。</p>\n<p>洪秀全先生曾經四次參加科舉考試都落榜了——別誤會，他不是考進士落榜的，而是考秀才落榜的。從他給兒子取名的文化水平來看，大清朝的考官倒還是挺公正。</p>\n<p>當然，我們知道洪秀全先生盡力了，他帶著誠摯的愛，把自己所認為最美妙的字眼兒給了兒子。從這個意義上說，我們每個人得到的名字固然是良莠不齊的，但其中蘊含的父母的愛，卻並不因此而有差別。</p>\n<p>好的姓名固然給人增色——比如我認識的姓上官的姑娘，姓端木的姑娘，她們碰巧都是美女（可能是心理作用），但大路貨的姓名也另有優勢。有個理論叫「大姓吞噬小姓」，就是說經過長期自然的婚姻組合，人口多的姓氏會越來越多，而人口少的姓氏會逐漸被吞噬。也許過了幾百年，全中國人都會姓李王張劉陳了。</p>\n<p>名字還有一項功能——它不只是父母給的，而且是環境給的，是一個時代在你身上的烙印。把千千萬萬個人的名字串聯起來，能讀出很有意思的東西。</p>\n<p>以我自己的家族故事為例。我叔伯們的名字叫作「剛」「強」「斌」，給他們取名字的是我祖母，她是個老師。相比之下，我祖父的名字居然文藝得多，叫「玉湖」，給他取名字的是他爹，是內蒙古草原上的一個鐵匠，祖上八輩貧農。結果，20世紀50年代的教師，給孩子取的名字不如20年代的鐵匠。</p>\n<p>再看母親這邊，舅舅們的名字叫「勇」「勤」「衛東」。給他們取名的是我外祖母，是個幹部；相比之下，我外祖父的名字居然也更有文化，叫「厚德」，竟然還用上典故了。給他取名的也是他爹，是個地道的南方的農民。結果，20世紀50年代的幹部，給孩子取的名字又不如20年代的農民。</p>\n<p>這個小小的家族姓名演變史說明，曾經我們的品味是不差的；我們給孩子取名的時候，曾經也是力求美好和雋永的，不然為什麼一位內蒙古的鐵匠給孩子取名叫「玉湖」，一位南方的農民給孩子取名叫「厚德」。但忽然間，這種對美好的追求發生了中斷，給孩子取名只剩「勇猛剛強」了，好像隨時和人有仇。只能說這與個人的志趣無關，而是時代的烙印。</p>\n<p>最近一些年來，人們變得越來越洋氣，給孩子取名字也變得講究了，甚至有人揚言取名要翻《山海經》，也不知道他希望孩子變成什麼怪物。</p>\n<p>前不久，一個老同學讓我幫侄女取名，姓李，要求有三點：一是名字要美麗；二是要用上古籍典故；三是還要帶上三點水。</p>\n<p>我說叫「李漫浩」吧，多美，「涉江採芙蓉，長路漫浩浩」。他說不好，孩子父母覺得這名字不夠上進。</p>\n<p>取名字又想要美麗，又想要上進，可見這些三四十歲的父母多麼糾結。他們在兩個割裂的時代裡掙扎著，既想要新時代的洋氣的表，又難以忘記舊時代的戰鬥的魂。</p>\n<p>我很快想出了一個又美麗又上進的名字——李玉剛，不知道你們覺得怎樣。</p>"},{"title":"房產和秘笈","content":"<h2 id=\"sigil_toc_id_44\"><span>房產和秘笈</span></h2>\n<p><span><span>有一些過剩，是門派性的過剩；有一些短缺，是江湖性的短缺。</span></span></p>\n<p>眾所周知，我的主業是讀金庸，但總被問到一些專業之外的問題，比如「房市這下真的會崩盤嗎」？</p>\n<p>我的研究範圍，僅限於小說裡的江湖武林。在這個世界中，房產不值錢，各路俠客們可以私搭亂蓋，大俠們找到稱心如意的伴侶後，動不動就「蓋間茅屋養小雞小鴨」，小產權房遍地開花。何況古代江湖裡私人財產很沒有保障，別說林震南的房子保不住，連東方不敗的花園小屋都沒保住。誰肯買房子？</p>\n<p>江湖上，有一樣東西倒是和我們關心的房子很像，長期以來被認為是最搶手、最稀缺、最保值的，那就是武功秘笈。你要是問我武功秘笈的市場會不會崩盤，我倒可以聊聊。</p>\n<p>我們首先要搞清楚，武功秘笈是怎麼火起來的。</p>\n<p>過去，江湖上的規矩是武功秘笈不準買賣，統一分配。比如老張家有男孩長大了，要進入江湖當俠客了，盟主一查戶口，老張家是山西大同的，歸雲州秦家寨管轄，於是分配你一本《五虎斷門刀》，自個兒練去吧；老李家的閨女及笄了，盟主再一查戶口，是四川都江堰的，歸青城派管轄，那麼分配一本《摧心掌》，回家好好學習。</p>\n<p>分到後來，大家發現這種做法難以為繼：一是秘笈畢竟太少不夠分；二是俠客們流動性增強，開始全國亂跑了，沒法分；三是秘笈白分出去，沒有經濟效益，不賺錢。所以要改。</p>\n<p>怎麼個改法？難道是把武功秘笈寫作的行當放開，以後隨便寫、隨便賣？那不行。制度的設計者通過精心設計，創造了一種獨特的秘笈買賣管理辦法。</p>\n<p>首先，寫秘笈要用紙。管理者明確一個原則：必須用我發行的紙寫秘笈才算數，才能給你蓋個章：「正規秘笈」。除此之外，哪怕你是武林絕世高手，也不能隨便找張草紙寫秘笈，你寫了我也不認，哪怕寫出《九陰真經》來我也不認，照樣給你蓋個章「邪門武功」，隨時可以沒收，嚴格管理，看誰敢買？</p>\n<p>其次，紙也是不允許賣的，只能租，比如租50年、70年，管理者隨時保留收回的權力。至於紙上的字兒？那是附著物，你看著辦吧。</p>\n<p>第三，秘笈不是誰都可以寫的，只有管理者批准的各大門派可以寫。你以為你是黃藥師，就可以亂寫什麼「落英神劍掌」「旋風掃葉腿法」？照樣是邪門武功，隨時沒收。</p>\n<p>第四，盟主每年把紙拿出來招拍掛，有時候拿一刀紙，有時候拿兩刀紙，各大門派都來搶。少林派出一萬，武當派出一萬二，巨鯨幫沒忍住，出了兩萬，就成了「紙王」。</p>\n<p>解決了紙的問題，接下來是錢的問題。</p>\n<p>紙越來越貴，各大門派也慢慢拍不起了；即便買到了紙，各大門派組織一幫高手搞秘笈的開發、寫作、印刷、裝幀，也要花錢。於是他們叫苦不迭。</p>\n<p>解決的辦法應運而生，江湖上的錢莊出場了。於是對各大門派說：沒關係呀，我借錢給你們呀。</p>\n<p>隨著武功秘笈一本本上市了，新的問題出現了——紙本身就已經很貴，再加上錢莊的利潤，讓秘笈就更貴了，各路俠客沒有錢買！這時錢莊又微笑著對俠客們說，沒關係，我借錢給你們呀。</p>\n<p>從此，武功秘笈產業風生水起，越來越興旺，各種秘笈產品五花八門，極大豐富。比如少林派，高階的客戶可以買《少林·般若掌》，低端的客戶可以買《少林·羅漢拳》。為了豐富產品線，少林寺還開發了針對超級有錢的土豪俠客的頂級產品《少林·金剛不壞體神功》，一百萬塊錢一本，讓眾普通俠客們羨慕嫉妒恨不已。</p>\n<p>秘笈於是開始嗖嗖地漲價，今天五萬，明天十萬。江湖俠客們要是手上沒有一兩本秘笈，出門都不好意思和人打招呼。特別是那些熱點地段、俠客數量最多的地方，比如嵩山之類，大門派扎堆，一本最爛的秘笈都要賣出天價。</p>\n<p>在市場競爭中，各大門派也越來越精了，一本秘笈不肯一次賣完，而是拆開了分期賣。比如一本《降龍十八掌》，這個月賣「亢龍有悔」，下個月賣「見龍在田」，今天兩萬賣一招，明天三萬賣一招。你嫌貴不買？那麼對不住了，再下個月「神龍擺尾」開盤，要賣五萬。</p>\n<p>賣到後來，秘笈市場越來越火，各大門派發現，寫一本秘笈再賣一本，太虧了，應該預售。</p>\n<p>比如武當派貼一個通知：「我派隆重推出‘虎爪絕戶手’專案，精品大秘笈，撼世好武功，現開展內部認購。秘籍正全力研發中，預定後年交付使用。」江湖俠客們沒辦法，後年就後年吧，連秘笈的封皮都沒看到，內文是宋體字還是黑體字都不知道，也照搶不誤。</p>\n<p>由於武功秘笈的市場實在太火了，眼看著各大武林門派賺了大錢，其他行當也眼紅了，也想來開發秘笈。比如什麼麗春院、群玉院、碧桃居之類的都看不下去了，怎麼我們賣肉的還不如賣紙的賺錢呢，於是這些從來都沒寫過秘笈的門派也紛紛出馬：「我們也要招拍掛，我們也要開發秘笈。」於是，《群玉·十八摸神功》《麗春·相思無更調神功》等也紛紛上市。</p>\n<p>江湖俠客們也很痛苦：秘笈那麼貴，品質又那麼差，咱們能不能不買了？</p>\n<p>但不買秘笈，又能買什麼呢？可以投資的專案太少，把錢留在手上，風險太大啊。你沒看見金庸小說裡的林震南、柯百歲、白剝皮等人，錢多武功差，最後的結果是死得直挺挺啊！</p>\n<p>有人擔心：秘笈有沒有泡沫，會不會崩盤啊？</p>\n<p>如果你想問的是崩盤的時間，那麼我認為，江湖經歷證明，能夠預言到的，都不是真相。如果連壽南山、「黃河四鬼」之流都在紛紛傳說秘笈馬上要崩盤，那麼多半就不會崩盤了。</p>\n<p>如果你想問的是最終結果，那麼不要忘了一點：秘笈，終究是拿來練的。有的人搞了四五本秘笈，根本練不了，最終賣給誰去練呢？</p>\n<p>各大門派說，紙是有限的，而錢是無限的。以無限的錢，買有限的紙，能不漲價嘛？然而不要忘了，俠客也是有限的。</p>\n<p>人們總是下意識地覺得，紙張有限，俠客很多。但是紙張的限度在哪裡，大家都在算，也比較好算清楚；而俠客的限度在哪裡，很少有人算，也很難算清楚。</p>\n<p>眼下看不清楚形勢，買什麼樣的秘笈最危險？大家都盯著少林寺、武當派，說你們的秘笈賣得最貴，所以最危險。</p>\n<p>有人去少林寺藏經閣一點：一、二、三、四……七十一，七十二，好傢伙，囤了七十二絕技啊！全部閒置啊！沒人能練完啊！看來多半要崩盤了。</p>\n<p>確實，少林寺的秘笈一直過剩，七十二絕技明顯閒置得太多了，根本練不完。連最牛的玄澄大師只不過多練了幾門，號稱「本寺二百年來武功第一」，卻突然一夜之間筋脈盡斷，變成廢人。</p>\n<p>其實不只是少林，武當、明教、峨眉的武功好像都有點過剩。然而請記住，有一些過剩，是門派性的過剩；有一些短缺，是江湖性的短缺。看看金庸的江湖史吧，少林派的七十二絕技不論再怎麼練不完，也一直有人搶，一直有人眼紅，哪怕有片言隻字流落到江湖上，也是稀缺品，總的來說仍然還是比較保值。</p>\n<p>最危險的，反而是神拳門、巨鯨幫、海沙派的武功秘笈。在市場行情火爆的時候，這些渣滓門派也一哄而上，寫了五六十本秘笈，都是些什麼「海沙神拳」「巨鯨神功」之類的玩意兒，標上死貴死貴的價錢，賣給誰去？</p>\n<p>武功一道，有盛世、有衰世；盛世之中也會有波谷，衰世之中也會有波峰。歷史的答案總是隱藏在雲霧之中，凡人最難看清楚的，就是當下的時代在歷史中所處的位置。</p>\n<p>我等草根俠客，很難做到投資時代、投資潮流，那麼不如選擇投資價值。不管怎樣，在武學盛世的《天龍八部》，像「青字九打」「城字十八破」這樣的爛武功，也不會很保值；在武學衰世的《雪山飛狐》，只要是真正的好武功，比如「胡家刀法」的兩頁紙也有人玩兒命搶。</p>\n<p></p>\n<p>【笑傲江湖·東方不敗的花園小屋】</p>"},{"title":"醫生沒有好老婆","content":"<h2 id=\"sigil_toc_id_45\"><span>醫生沒有好老婆</span></h2>\n<p><span><span>金庸小時候可能被一個叫「天德」的孩子欺負過。</span></span></p>\n<p>金庸小說裡有所謂的「四大定律」：表哥是男神，師兄當備胎，醫生老婆壞，天德最悲哀。</p>\n<p>所謂表哥是男神，眾所周知，不用多說。金庸的小說裡總是有一個風流倜儻的男神表哥，像《天龍八部》裡的慕容復，《連城訣》裡的汪嘯風，《倚天屠龍記》裡的衛璧，都被一眾女士愛得死去活來。</p>\n<p>但別忘了，男神有多神，那些備胎就有多慘。金庸小說裡那些很苦悶的備胎師兄們，令狐沖、武修文、武敦儒、徐錚、曹雲奇、狄雲……你們可關心過嗎？</p>\n<p>金書的苦悶師兄有五大看家絕招：當備胎，戴綠帽，接包袱，背黑鍋，斷子絕孫。</p>\n<p>比如大武哥哥、小武哥哥這兩位師兄，降龍十八掌、一陽指之類學得稀巴爛，一門備胎神功卻靠著自己摸索，練得登峰造極。兄弟倆明明都是郭芙的千年備胎命，還互相拆臺火併，非要爭一爭誰才是全尺寸的。假如我是他爹武三通，早一人一個耳光扇過去了：「叫你丫自學成才！」</p>\n<p>另外幾門神功也被眾師兄練得爐火純青。狄雲師兄這麼一個老實巴交的進城務工青年，被師妹當成了流氓、財迷、叛徒、小賊，背的大黑鍋那叫一個黑；徐錚師兄被師妹馬春花心理和身體雙出軌，還附贈一對娃，接的包袱那叫一個沉；令狐沖師兄則用親身經歷告訴我們，有一門功夫比獨孤九劍更厲害，叫福建山歌。</p>\n<p>斷子絕孫神功又是誰？且看《雪山飛狐》裡的曹雲奇師兄。按理說，他推倒了女神田青文，算是諸多師兄裡最爭氣的了，不幸的是好不容易讓女神懷上娃，居然被女神挖個坑埋了，曹師兄再怎麼擦乾心中的血和淚痕，也留不住自己的根。</p>\n<p>備胎師兄們情場遭際如此之慘，讓我不覺想起金庸先生到浙大講課，對學子曰：「我還是你們的大師兄。」底下浙大學生想必不懷好意地笑了：師兄，把小師妹照顧好哦，我們正在抓緊學福建山歌咧！</p>\n<p>在金庸的書裡，醫生還都沒有好老婆。</p>\n<p>金書裡的神醫都有一些共同點：孤僻，傲慢，缺德，也不知這是否反映出金庸內心對名醫們的成見。在他自覺不自覺的安排下，神醫們的老婆也一個比一個極品。</p>\n<p>比如《笑傲江湖》裡平一指大夫的老婆，出場就先嚇你一跳：「高高瘦瘦」「滿臉病容」「方面大耳，眼睛深陷，臉上全無血色」。這段文字告訴我們，面無血色的女人不全都是小龍女，還有平夫人。</p>\n<p>原著不斷渲染平大夫的家庭生活多麼悽慘：「一個天不怕、地不怕的人，居然怕老婆」「（老婆）有甚麼吩咐，他不敢不聽」「（老婆）要殺什麼人，他便會……去殺」。</p>\n<p>由於對老婆的極度厭惡和恐懼，使平大夫的愛情觀和婚姻觀都發生了嚴重扭曲，他的名言是：「天下女子言語無味，面目可憎，最好是遠而避之，真正無法躲避，才只有極力容忍，虛與委蛇。」</p>\n<p>對他的痛苦陳述，令狐沖的反應是：「你以己之妻將天下女子一概論之」「你的夫人固然言語無味，面目可憎，但天下女子卻並非個個如此」。細聽令狐沖這語氣，雖然意不允可，其中難道沒有一分理解和同情在嗎？</p>\n<p>還有一個比平一指更出名的神醫，叫作「蝶谷醫仙」胡青牛。相應地，他的老婆也比平一指的更極品。</p>\n<p>胡青牛的老婆叫「毒仙」王難姑，長相倒不難看，人到中年仍然「秀眉粉臉」，但做事是絕對調皮。她對胡青牛態度不好，「冷冷愛理不理」，那也罷了，更要命的是她的人生目標太可怕了——要用自己的毒術，把老公的醫術壓下去。</p>\n<p>她死磕老公的辦法是：到處找人下毒，讓老公治。</p>\n<p>胡青牛打算息事寧人：我認輸行不？不治了行不？沒想到極品老婆發明瞭絕招：老孃給自己下毒，看你治不治？</p>\n<p>這個女人死磕老公幾十年，上演無數離家出走、反目成仇、傷天害理的鬧劇，還間接導致兩口子和高手金花婆婆結仇，最後被金花婆婆雙雙弄死。和這個女人一比，我忽然覺得郭芙之類的都算溫柔賢淑的好妻子。</p>\n<p>這還解答了金庸小說的一個謎團：在《天龍八部》裡，星宿老怪丁春秋要找神醫薛慕華的晦氣，薛神醫慌忙安排「全家老幼藏在地洞之中」。</p>\n<p>薛神醫是「函谷八友」之一，其餘幾兄弟也被丁老怪追殺，卻從不擔心親屬，為什麼唯獨薛神醫擔心家小？我看答案就是：丁春秋也知道神醫的老婆必是極品，連他都看不下去了，他此番真正要滅掉的正是薛神醫的老婆啊！薛神醫敢不把老婆藏在地洞裡嗎？</p>\n<p>金庸定律之四：取名不能叫天德。</p>\n<p>「天德」二字，堪稱是金庸小說裡最爛的名字，叫這個名的沒一個好人，全是猥瑣的壞軍官。</p>\n<p>例如《射鵰英雄傳》裡郭靖的殺父仇人壞軍官段天德，簡直是全書唯一的純反派渣滓。其餘反派人物裡，連侯通海都有魯直可愛的一面，歐陽克都有痴情無悔的一面，沙通天和彭連虎都有兄弟義氣的一面，唯獨這個段天德，硬是半點兒好的都沒有。</p>\n<p>為了讓讀者記住他有多噁心，金庸還特地給天德兄精心打造了一句出場白：「老爺行不改姓，坐不改名，姓段名天德，上天有好生之德的天德！」這句大反派亮相臺詞是如此戳心，以至於郭靖小時候雖然傻得連爹媽的名字都記不住，但一被問到大仇人是誰，立刻條件反射般咬牙切齒：「他叫段天德！」</p>\n<p>大概是黑了一個天德不過癮，金庸在《笑傲江湖》裡又搞出一個天德，同樣也是個猥瑣的軍官——「福建泉州府參將」吳天德。</p>\n<p>本來人家作為一個龍套丑角，一筆帶過就算了，但金庸卻不吝筆墨，非把吳將軍寫得肥蠢貪橫，還生生往死裡作踐，不但被令狐沖暴打一頓，還「將他內衣內褲一起剝下，全身赤條條地一絲不掛」「反手綁了，縛在樹上，再在他口中塞滿了爛泥」。我不禁想問，金庸老爺子小時候是被叫「天德」的熊孩子打過嗎？</p>\n<p>還有一些猥瑣軍官和「天德」這個名字擦肩而過，險些中招。比如《射鵰英雄傳》裡還有一個軍官——趙王完顏洪烈手下的親兵隊長，也被金庸寫成傻大粗蠢壞的集合體，並賜予大名「湯祖德」——竟仍然是個「德」字輩的。</p>\n<p>這位德將軍的下場也很慘。在王府宴會上，他不知天高地厚，向全真教的鐵腳仙王處一同志挑釁，結果被狠狠教訓，「左手按入一碗糟溜魚，右手浸入一碗酸辣湯」「兩碗碎裂，魚骨共瓷片同刺，熱湯與鮮血齊流。」「湯祖德哇哇大叫，雙手亂揮，油膩四濺，湯水淋漓。」</p>\n<p>我不禁想起金庸有《參覃有感四首》，說自己「句酌字斟愧拙艱」。詩句的本意，大概是說他參與起草香港基本法時的謹慎，但用在他寫小說的態度上也是成立的。金大俠既然「句酌字斟」，卻仍然把「德」字輩黑成這個樣子，他是故意的呢？還是故意的呢？</p>"},{"title":"武林高手的數字崇拜","content":"<h2 id=\"sigil_toc_id_46\"><span>武林高手的數字崇拜</span></h2>\n<p><span><span>即便是武林中最淡泊名利的人，例如連《鹿鼎記》路澄觀老和尚這樣的人，也過不了數字崇拜這一關。</span></span></p>\n<p>有一種奇怪的現象：江湖上有些大俠對名利、金錢、美女都看得開，唯獨對幾個無關緊要的數字看不開，而且是一輩子都看不開。</p>\n<p>金庸小說有所謂的「幾大謎」，其中之一就是「十三絕神僧之謎」，說是宋初的時候，少林寺出了個了不起的和尚，居然學會了「少林七十二絕技」裡的十三門，於是震古爍今，成為傳奇。</p>\n<p>這個和尚到底是書上的誰，是不是《天龍八部》裡的玄澄，眾說紛紜，成為一大懸案。但這件事情至少說明：數字能帶來巨大的榮耀。人們甚至都沒記住這位偉大和尚的名字，卻牢牢記住了「十三」這個數字。</p>\n<p>在江湖上，有許多頂尖的人物，一輩子都為了一兩個數字忙碌、奮鬥。比如明教教主陽頂天同志，他的奮鬥數字是「四」，因為已經很多年沒有教主能把「乾坤大挪移」練到第四層；又比如金輪法王，他的奮鬥數字則是「十」，因為歷史上從來沒有人可以把「龍象般若功」練到第十層。</p>\n<p>一個小小的數字，可以帶給他們莫大的驕傲和自信。天山童姥的得意數字是「一」，號稱「殺人不用第二招」；另一位俠客洪七公的得意數字是「二百三十一」，他津津樂道自己一生殺了二百三十一個人，其中沒有一個是好人；還有鳩摩智大師，這個極可能是《天龍八部》裡IQ最高的人，到處宣傳自己史無前例地學會了少林寺全部七十二門絕技，後來為此不惜練功到走火入魔。</p>\n<p>反過來，如果人生在一兩個數字上遇到缺憾，會讓高手們感到嚴重憋屈，甚至一輩子都耿耿於懷。</p>\n<p>例如《倚天屠龍記》裡的丐幫幫主史火龍先生，因為降龍十八掌只學會了十二掌，所以他的幫主就當得十分勉強和抑鬱。《天龍八部》裡，南海鱷神一輩子都不滿足自己是「嶽老三」，最大的理想就是要當「嶽老二」。公冶乾同志一直自以為是「掌法江南第二」，併為此得意了很多年，直到和喬峰一對掌，才發現差距巨大，意識到了真相的殘酷，從此一蹶不振，外號也改成了自暴自棄的「天下第屁」。</p>\n<p>有時候，數字還會變成高手們精神上的沉重負擔。</p>\n<p>天龍寺的本因方丈，堂堂一代高僧，被人問到「一陽指練到了多少品」，他馬上就感到很慚愧，「額上汗水涔涔而下」，說自己「只修得到第四品」，似乎「四」這個數字讓他很抬不起頭來。</p>\n<p>不只是高手們，那些江湖上的小角色們照樣有數字崇拜。《天龍八部》裡有一個武功很差勁的門派，叫作青城派，卻世世代代想把家傳武功「青字九打、城字十八破」這幾個數字湊全；而另一個很小的門派——雲州秦家寨的武功五十九路「五虎斷門刀」失傳了兩招，於是非要硬生生另編出兩招來，好補足「五十九」這個數字。</p>\n<p>我們甚至驚訝地看到，即便是武林中最淡泊名利的人，也過不了數字崇拜這一關。</p>\n<p>《鹿鼎記》裡有一位澄觀老和尚，算是金庸全部作品裡最與世無爭、淡泊名利的人之一了，但連他都不能免俗，一輩子對兩個數字始終念念不忘、難以釋懷：一個是自己只花四十二年就練成了「一指禪」，速度在少林寺歷史上排名第三，讓他得意揚揚；另一個是他的練功速度雖然快，但「內力修為平平」，指力「恐怕要排名在七十名以下」，讓他又「不禁沮喪」。</p>\n<p>區區幾個數字，為什麼在江湖上會顯得如此重要？我想大概是因為它可以用來比較。有了數字，人和人之間就有了競爭、高低、強弱，以及勝負。</p>\n<p>庸人的一大特點，就是喜歡把複雜的事物變成簡單的數字，然後興高采烈地進行對比。在平常生活中，我們經常見到類似現象，比如「我們國家人多，怎麼不去打某國呢，可以用三個人拼掉他一個人」「我們一艘核潛艇可以拼掉某國一艘航母」「我們掌握了多少多少億的外債，可以買下別國多大多大的地盤」之類。</p>\n<p>這多麼像《笑傲江湖》裡的一個段子：在衡山的茶館裡，那些江湖庸人們在高談闊論：「聽說了沒？劉三爺的武功可比莫大先生強多啦！因為劉三爺一劍可以刺五頭雁，莫大先生只能刺三頭！」</p>\n<p>其實數字又真正能代表什麼呢？</p>\n<p>那位「十三絕神僧」玄澄，號稱少林寺「二百年來武功第一」，某一晚突然筋脈盡斷，變成廢人；陽頂天先生剛剛練到第四層乾坤大挪移，幾分鐘之後就被不忠的老婆氣死；宋代的密宗高僧把「龍象般若功」練到第九層，結果走火入魔，狂舞七天七夜而死；金輪法王好不容易練到了第十層，自詡「珠穆朗瑪大師」，雄心滿滿，要去踏平襄陽城，沒過幾天，竟然戰死，這門神功還被搞得失傳。</p>\n<p>如果數字真的那麼有用，金庸江湖裡武功最高的就不會是掃地僧、獨孤求敗，而應該是崔百泉先生。他外號「金算盤」，隨身帶著一把算盤。然而事實是，他那麼會算，武功卻差得可憐。</p>\n<p>當然，說歸說，總有一些數字會讓你感到震撼不已，望塵莫及。</p>\n<p>比如前一陣有個未經證實的報道，說是有人「睡遍了金陵十二釵」，讓我大吃一驚。因為即使在《紅樓夢》原著裡，也沒有一個人能做到「睡遍十二釵」。別說十二個了，睡到三個的都沒有。請原諒我用了這個不太尊重女性的動詞，是為了和傳言相互印證。</p>\n<p>不妨統計一下，金陵十二釵裡，寶玉也就只睡了一個——寶釵；賈璉也只睡了一個——鳳姐；連皇帝都只睡了一個——元春。書中的最高紀錄有可能是賈蓉，撐死也不過是兩個——秦可卿和鳳姐，而且他究竟有沒有睡到鳳姐還有很大爭議。</p>\n<p>看來是我錯了。誰說數字沒有意義？這位先生的人生真是太有意義了。</p>"},{"title":"處男統治江湖","content":"<h2 id=\"sigil_toc_id_47\"><span>處男統治江湖</span></h2>\n<p><span><span>我們的男人是該有多麼自戀自大，才會覺得身上凡是和男性特徵有關的東西，無一不是寶貝。</span></span></p>\n<p>經常被問到一個問題：金庸江湖上誰武功最高？這個很難回答。但有一個規律是大致不錯的，在金庸的江湖裡，假如把武功最高的幾個人拿出來，會得到一個令人吃驚的結果：他們幾乎不是老處男，就是死太監。</p>\n<p>「射鵰三部曲」裡，堪稱大宗師者兩人，王重陽和張三豐，居然都是老處男。一個遙望林朝英的古墓，打熬筋骨；一個胸懷郭女俠的羅漢，唏噓百年。</p>\n<p>大宗師中倘若不是老處男，那就是死太監：東方不敗是死太監，《葵花寶典》的作者是死太監，就連《鴛鴦刀》這樣不太被重視的金庸作品，裡面的第一條好漢——晉陽大俠蕭半和，也是個死太監。</p>\n<p>再舉其他冠絕一時的絕頂高手，更讓人吃驚，如丁典，如石破天，都是處男。</p>\n<p>還有一些絕頂高手，雖然沒有直接證據，但也高度疑似處男，至少是過著處男般類似禁慾苦行的生活。比如很有望競爭「金書第一高手」的掃地僧，躲在少林寺裡連四十二年還是四十三年都記不清了，是老處男的可能性很大。又比如獨孤求敗，一個人常年住在山洞裡，「與雕為友」，你要說他沒有禁慾，簡直不堪往下想。</p>\n<p>金庸自己可能都沒意識到，他筆下的江湖，原來是一幫老處男統治的江湖。</p>\n<p>像這種對處男的推崇，不是金庸的特例，而是很多年來的定式思維。就像《水滸傳》裡，一流的英雄幾乎個個是「整日打熬筋骨，於女色上不十分要緊」。</p>\n<p>他們打心眼兒裡認定，只要失去了處男之身，武功似乎就要大受影響。就像老頑童周伯通說，自己不管怎麼苦練，武功「終究達不到絕頂之境」，他還深刻反思：當年我若不是失了童子之身，不能練師兄的幾門厲害功夫，黃老邪又怎能欺負我？</p>\n<p>我們的男人們大概是太愛自己了，覺得身上只要是和男性特徵有關的東西，無一不是寶貝。就連一些用於生殖的汙穢東西，也以為是天地間第一寶貝，美其名曰什麼「精華」「元陽至寶」，似乎比血液還珍貴得多，不能輕易丟失，否則連武功都練不好。</p>\n<p>自戀的男人們還處處表示對女人的壓制和輕視。同樣是和生殖有關的分泌物，女人的就統統被說成是骯髒的、不潔的，甚至誇張到沾一下都要死人的地步。</p>\n<p>比如兒時讀野史《清宮十三朝》，婦女趙碧娘不堪楊秀清的凌辱，在他的帽子裡偷偷放了「穢布」，想致楊秀清於死地，結果被人告發。楊秀清拆開帽子，果然發現有「穢布」，大怒之下，把趙碧娘點了「天燈」，就是把人裹上布浸上油燒死。</p>\n<p>小時候不明白「穢布」是什麼東西，後來才知道大致就是沾了經血的布。楊秀清和趙碧娘居然都打心眼兒裡相信這東西很危險、很致命——男性的東西留著，不但無害，還可以練絕世武功；而女性的東西頂在腦袋上就會死人，這真是一種奇怪的念頭。</p>"},{"title":"飯後煙","content":"<h1 id=\"sigil_toc_id_48\"><span><span>飯後煙</span></span></h1>\n<p><span>這是一些和武俠沾邊的有趣雜談。</span></p>"},{"title":"那些掉進黑洞的大備胎","content":"<h2 id=\"sigil_toc_id_49\"><span>那些掉進黑洞的大備胎</span></h2>\n<p><span><span>令狐沖：「我體內有九股異種真氣，始終無法融匯在一起。」任我行淡淡一笑：「那是因為泡利不相容原理。」</span></span></p>\n<p><span>【一】</span></p>\n<p>「衝兒，去吧，去思過崖面壁吧。」岳不群教授溫柔地說，「你是我的PlanA，回來之後我一定讓你接班」。</p>\n<p>「納尼？不！」令狐沖驚叫，「那是什麼狗屁思過崖，那是黑洞！我一掉進去就會被潮汐力拉成麵條的！」</p>\n<p>「瞎說什麼呢？你是華山派的大弟子，我是保你的。」岳不群嘩啦啦翻開一本算術簿，「喏，我正在解《紫霞神功》的方程式。等你下山，方程就解開了，我一定教給你。」</p>\n<p>說完，他一踩腳踏板，把令狐沖的飛行器丟擲去了。</p>\n<p>眼看令狐沖慘呼著消失在黑洞視界之中，岳不群面無表情地回頭，拍了拍小林子的肩膀：「這個傻瓜要變成麵條了。賢婿，華山派的未來是你的，你是我的PlanB。」</p>\n<p>「可是……師父，你不是還要解‘紫霞神功’的方程，還要教給大師兄嗎？」</p>\n<p>「傻瓜，世界上根本就沒有什麼紫霞神功。那個方程式是個騙局，是壓根兒解不開的。」</p>\n<p>林平之無語了，半晌才說：「師父，你好賤，比抄襲六神的那些人還賤。」</p>\n<p>岳不群以為他的計劃成功了，然而他忘了，黑洞裡還有一個五維生物——風清揚。</p>\n<p>「衝兒，你醒啦？現在你在我創造的五維空間裡。」風清揚說。</p>\n<p>令狐沖傻眼了：眼前是一排排書櫃，被放在無數個矩陣般的小格子裡。書櫃的對面有很多人正在打來打去。「這……這些小格子是什麼？」</p>\n<p>「不，傻瓜，這是時間，五維空間裡的時間。」</p>\n<p>「那這些在對面打來打去的人又是誰？」</p>\n<p>「他們是魔教十長老。」風清揚耐心地說。</p>\n<p>「他們不是早就死了幾十年了嗎？」令狐沖不解。</p>\n<p>「唉，你怎麼還不懂，我都說了這是五維空間，你可以把時間像抽屜一樣拉開來，看到過去的每一個片段。你信不信我可以在大力神魔範鬆的屁股上打一個摩斯碼……」</p>\n<p>「我信，我信，不用了……」令狐沖流汗道。</p>\n<p>風清揚拿出一把劍來：「現在我教你一門五維的高階武功，用來打敗岳不群。」</p>\n<p>他一招一式地教著：「學會這門劍術之後，你的出劍就會像光一樣快。光速是永恆不變的，所以你的速度也將永恆不變。敵人不管用什麼速度來追你，你都是永恆的光速。」</p>\n<p>令狐沖似懂非懂：「如果敵人也練得和光速一樣快，怎麼辦？」</p>\n<p>風清揚臉上浮現詭譎的微笑：「那他就更慘了。他的時間會趨向於無窮慢，最後慢到停止。在你的眼裡，他將無處不是破綻。」</p>\n<p>令狐沖用力搖了搖頭，放棄了進一步思考：「這門武功有名字嗎？」</p>\n<p>「叫獨孤九劍。」風清揚沉聲說。</p>\n<p>「這個名字不酷。」</p>\n<p>「它還有另外一個名字，叫狹義相對論。」</p>\n<p><span>【二】</span></p>\n<p>學會了相對論後，令狐沖天下無敵。</p>\n<p>什麼「九曲劍鍾鎮」「萬裡獨行田伯光」之類的經典力學大師，都紛紛敗在他劍下。</p>\n<p>直到有一天，令狐沖來到杭州大學講課，受到了校方的隆重接待。</p>\n<p>他正在講述獨孤九劍的原理，忽然聽到遠處隱隱有人在大吼大叫。</p>\n<p>「那是誰？」令狐沖不悅地問。</p>\n<p>「他……他是任我行教授，是一個瘋子。他說他的理論才是武學終極理論。我們已經把他關起來了。您別理他。」</p>\n<p>「有他的論文嗎？」令狐沖雙眉一擰。</p>\n<p>「這……好吧。您看看就是，千萬別當真啊！」校長命人送上來一塊刻滿了字的鐵板。令狐沖拿起鐵板，先讀了序言：</p>\n<p>「老夫任我行被困於此，一身通天徹地神功，不免與老夫枯骨同朽，亦憾事也。茲將老夫神功精義要旨，留書於此，後世小子習之，行當縱橫天下，老夫死且不朽矣。」</p>\n<p>接下來，作者深深地刻下了武功的名字——「吸星大法，又名量子力學。」</p>\n<p>令狐沖虎軀一震：「快！這位任教授在哪裡？帶我去見他！」</p>\n<p>牢房之中，二人相見了。</p>\n<p>「你的狹義相對論，解釋不了武功的本源。」任我行一邊嚼著一隻鴨掌，一邊傲然笑道。</p>\n<p>「何以見得？」令狐沖不服。</p>\n<p>「內功的本質是什麼？回答我！」任我行問。</p>\n<p>「這……大概是一種氣體……或者液體……」令狐沖猶豫了。</p>\n<p>任我行笑了笑：「我來告訴你吧，是粒子。準確地說，是費米子凝聚態物質。」</p>\n<p>「……」令狐沖啞口無言。</p>\n<p>任我行丟掉啃了一半的鴨掌，用油膩的手拿起一支粉筆，chua、chua、chua在牆上寫下了一個數字：「-273.15。」</p>\n<p>他無視令狐沖驚愕的表情，滔滔不絕地說：「我在練功時發現，把具有費米子特性的氣體鉀原子降溫到絕對零度——也就是我寫在黑板上的這個數以上的十億分之一度，你猜鉀原子出現了什麼？停止運動！如果能將氣體約束在真空小室——也就是‘膻中氣海’中，並採用超集束光和磁場使鉀原子配對，就能成功地創造出‘費米子凝聚態’，也就是——內功！順便說一句，費米冷凝體原子對之間的吸引力比超導體中電子對的吸引力強得多。這就是‘吸星大法’的基本原理。」</p>\n<p>令狐沖完全呆了。「武學一道，果然深不可測啊……」他喃喃道。</p>\n<p>任我行笑道：「你練功的時候，是否遇到過什麼困惑？」</p>\n<p>令狐沖一震：「我發現體內有九股異種真氣，始終無法融匯在一起。」</p>\n<p>任我行淡淡一笑，眼中閃爍著智慧的光芒：「那是因為泡利不相容原理。你如果信得過老夫的話，老夫試為你解之。」</p>\n<p><span>【三】</span></p>\n<p>令狐沖和任我行走到了一起。這是相對論和量子力學的偉大結合，人類的武學基本理論躍上了一個光輝的臺階。</p>\n<p>這一天，令狐沖來找任我行喝酒，發現任我行正對著黑板上密密麻麻的公式發呆。</p>\n<p>「大哥你在算什麼？」</p>\n<p>「唉！我正在推算吸星大法的一個關鍵常數，即陽蹺二十二穴和陽維三十二穴，在這五十四個穴道之間，如何使內息遊走自如，既可自陽蹺入陽維，亦可自陽維入陽蹺。」</p>\n<p>「大哥真牛逼。」令狐沖恭維說。</p>\n<p>突然，門被人用力推開了，一個人在颼颼冷風中款款走進，淡淡地說：</p>\n<p>「我看你不用算了。不就是普朗克常數嘛。」</p>\n<p>「東方不敗教授？」任我行大吃一驚，「天下理論物理學第一高手！」</p>\n<p>東方不敗嫣然一笑：「狹義相對論和量子力學，就想解釋武功的本源？可笑，可笑！我問你們，武功的本質是什麼？」</p>\n<p>任我行回顧令狐沖：「衝兒，這個問題我教過你的，快回答這個人妖。」</p>\n<p>「是粒子！」令狐沖漲紅了臉大聲說。</p>\n<p>東方不敗嘆氣搖頭。她慢慢拿出一根繡花針，穿上了線，絲線上反射著神秘的銀光：「你錯了，世界的本源，是弦。」</p>\n<p>任我行大驚失色：「難道你已經練成了傳說中的……弦理論！」</p>\n<p>屋子裡很靜，彷彿掉了根針都能聽見。</p>\n<p>東方不敗伸手一彈，絲線發出嗡嗡顫動：「天下武功，唯弦不破。一切武功的基本單位都是一維的能量弦。有了一維弦的振動和執行，才有恆河沙數的基本粒子。」</p>\n<p>任我行罵：「呸，你看多了《生活大爆炸》吧，衝兒，扁他！」</p>\n<p>兩人猛撲而上，卻發覺東方不敗的身影突然消失了。隨即，一根繡花針從不可思議的空間飛了出來，戳中了任我行的眼睛。「啊！你這個死人妖！」任我行捂眼大呼，一絲血線從指間沁下。</p>\n<p>「感覺怎麼樣？這就是弦理論的‘額外維度攻擊’。令狐沖，你會光速攻擊又怎麼樣呢？我現在在六維空間攻擊你，分分鐘滅掉你們這兩個低維度的D3膜生物……」</p>\n<p>很快，令狐沖和任我行都捂著眼睛倒在了血泊中。</p>\n<p>「衝兒，我忘了，死太監都是六維生物……快……這是唯一的逃跑辦法了……」任我行掙扎著，從懷裡摸出一個陀螺，「快看看我們在第幾層夢境，有沒有辦法逃走……」</p>\n<p>「不要溫順地走進那個良夜……」令狐沖喃喃唸誦著，沒有接那個陀螺，「逃，是沒有用的。要有光。」</p>\n<p>突然，他奮力躍起，揮劍在空中chua､chua､chua劃動，亮麗的劍鋒劃破夜空，聯成幾個閃亮的符號。</p>\n<p>「什麼？你竟敢向黑暗森林宇宙暴露我的經緯度……」東方不敗尖叫道，但已經無力阻止光符號飛向太空。</p>\n<p><span>【四】</span></p>\n<p>廣袤的太空。</p>\n<p>一行清淚，從任盈盈的臉上緩緩流下。</p>\n<p>「爹殘了，衝哥也殘了，而敵人還在。」望著遠方那個發光的座標，她的聲音微不可察，「不要溫順地走進那個良夜……不要溫順地走進那個良夜……」</p>\n<p>「小姐，你的意思是要……大浦洞？」機器人向問天說。</p>\n<p>任盈盈轉過來，淡淡地看著它：</p>\n<p>「請給我一張二向箔。」</p>"},{"title":"搞什麼飛機","content":"<h2 id=\"sigil_toc_id_50\"><span>搞什麼飛機</span></h2>\n<p><span><span>我真的希望，世界上能有一架安全的大飛機，裝下我的小夢想。</span></span></p>\n<p>武俠小說中，常常見到殺人。劉國重先生將《笑傲江湖》稱為「相斫書」，可見殺人之多。</p>\n<p>然而，不論小說家將殺人這事兒寫得多麼慘烈，也比不上生活中的真事兒震撼人心。例如被擊落的馬航MH17飛機。</p>\n<p>以前看過一個老笑話：有一支炮兵部隊搞演習，一發炮彈打歪了，士兵跑去找落彈點，一直找到一處菜地裡。只見彈坑旁站著個農民，被炸得渾身漆黑，欲哭無淚地說：「老總，俺就是偷棵菜而已，你至於嗎？」</p>\n<p>這個笑話讓我笑了很多年，但是當MH17飛機被擊落的事情發生時，想到這個笑話，我忽然覺得想哭。</p>\n<p>設想我坐在MH17飛機上。我只是想趕上旱季的尾巴，和妻子、孩子到吉隆坡去旅個遊，看看雙塔、國會大廈和火車站。</p>\n<p>為了節省，我們特意訂了平價的班次和座位，併為節約下來的錢欣喜不已。上飛機前我們分別給爸媽打電話，對他們的擔心感到好笑，我們相信飛機不會總失聯的。</p>\n<p>然後，你們就用不知是導彈還是別的什麼彈的恐怖東西，把我們打下來。我想像那個偷菜的農民一樣，弱弱地問一聲：你們至於嗎？</p>\n<p>我不知道你們是什麼人，不知道你們是政府軍還是反對派。我真的不知道你們之間到底結了些什麼樑子，也不知道那些看上去長得差不多、都說斯拉夫語的人為什麼要打來打去。不好意思，我真的不太愛看新聞，特別是時政新聞。說實話，其實我連烏克蘭這個國傢俱體在哪裡都不太清楚。</p>\n<p>我更不知道你們打仗是為了捍衛統一還是爭取自由。我真的無意冒犯，我也冒犯不來。你們的夢想，我都尊重；你們的勇猛，我都欽佩，我五體投地、卑躬屈膝地欽佩。</p>\n<p>我只是想和家人去吉隆坡旅個遊。我們沒有去很貴的地方啊，我們沒有訂很貴的酒店啊，我們沒有安排很貴的行程啊。這只是我們作為凡俗人的小小的夢想。和你們拿著武器去追尋的偉大夢想比起來，它確實好渺小，好微不足道，但是我就是個平庸的人，有什麼辦法呢？</p>\n<p>我不是存心飛越你們上空的——買票的時候他們只告訴我起飛的地方和到達的地方，沒有告訴我中途會經過哪裡，是五個國家還是六個國家，是山還是海，是平原還是河流。不懂地理是我的錯，但是罪不至死啊！</p>\n<p>中國有一部俠義小說，叫作《連城訣》，它是我讀過的最悲愴的書。那個主人公叫狄雲，是一個鄉下孩子。在故事的開頭，他只是想穿上新衣服進一趟城，陪師妹開開眼界。那也只是個小小的夢想。</p>\n<p>他根本不關心那些什麼武林秘籍、寶藏地圖該歸誰，該歸「五雲手」萬震山還是「陸地神龍」言達平；他完全不會干涉你們的龍爭虎鬥。事實上，如果你們不歡迎他進城，只需要喝一聲：「滾蛋，不準來！」他決計不會來的啊！</p>\n<p>你們犯得著用那麼大的毒計來害他，又栽贓又嫁禍，又剁手指又穿琵琶骨嗎？</p>\n<p>古往今來，有許多著名的人害人的故事。然而有人迫害唐代斯，畢竟是因為他要當船長，影響了人家升遷；有人迫害亞瑟，畢竟是他沾上了青年義大利黨的獨立運動，影響了人家的社會穩定。可狄雲那小小的夢想，招誰惹誰了呢？就像你們碾碎我小小的夢想，是想搞什麼飛機呢？</p>\n<p>如果你們不准我飛過來，只需要說一聲：「不準來！」我不會來的。如果能給我一次機會，讓我可以滾開你們的戰場上空，永遠不要來，我一定會做到的。我願像狗一樣落荒而逃，襯託你們的霸氣。</p>\n<p>可你們什麼都沒說，卻用導彈、火箭彈或者什麼彈，把我和我的家人打下來，讓我們橫死異鄉，屍骨無存。</p>\n<p>我真的希望，世界上能有一架安全的大飛機，裝下我的小夢想。</p>"},{"title":"中日圍棋差距，曾比軍艦的差距還大","content":"<h2 id=\"sigil_toc_id_51\"><span>中日圍棋差距，曾比軍艦的差距還大</span></h2>\n<p><span><span>我經常想，段祺瑞這種舊軍閥下棋慘敗給日本人，怎麼沒有憤怒一拍桌子：「不下了，走，不跟你小日本玩了！」</span></span></p>\n<p><span>【一】</span></p>\n<p>金庸喜歡圍棋，據說有業餘三四段的棋力。對他的棋力我很懷疑，但他對圍棋的熱情確實不假。這可能和他的家鄉浙江海寧有關。</p>\n<p>人們一般只知道海寧出詩人，什麼朱淑真、查慎行、徐志摩等等，但不大知道海寧還出圍棋國手。清代最牛的兩大國手，一個範西屏，一個施襄夏，都是海寧人。號稱晚清「圍棋之璧」的陳小仙也是海寧人。</p>\n<p>我要講的圍棋故事卻不是那個時代，而是從1909年開始。</p>\n<p>那時候，甲午戰爭已經過去了十五年，義和團「拳亂」也過去了近十年。「天朝上國」對小日本已經完全認　　，徹底承認自己玩打仗、搞政治、搞經濟統統不如人了。所以當時儘管湖北的饑民已經餓到搶米店，那邊清廷還派人帶十萬塊錢去助賑日本的水災。</p>\n<p>但當時天朝上國人還是剩下了一點點自尊的：咱們總還有一些比小日本強的吧！比如遛鳥、喝茶、下棋，小日本能玩得過咱嗎？然而真相是：哪怕下棋，咱也下不過小日本。我敢說，當時我們和日本在圍棋上的差距，甚至比在軍艦上的差距還大。</p>\n<p><span>【二】</span></p>\n<p>當時，中國圍棋界有一位總舵主——段祺瑞。</p>\n<p>金庸告訴我們，段氏一族不但武功好，而且有下圍棋的光榮傳統。一代高手段譽先生甚至吃了春藥還能下圍棋，可謂震古爍今。</p>\n<p>段氏一族傳到了段祺瑞手上，武學衰微，什麼一陽指、六脈神劍統統失傳，唯獨愛下圍棋的家風不減，不管當軍閥還是當總理，段祺瑞都在家裡大搞圍棋俱樂部，客人來下棋還發獎金，搞得府上各路棋手川流不息。</p>\n<p>據說段府每個月花在圍棋上的錢有上千元。要知道，當時北京普通四口之家，一個月伙食費也就是十來元。不然你以為人家段祺瑞「圍棋北護法」的外號是白給的。</p>\n<p>問題是，如果段祺瑞一輩子只和中國人下棋，那也就算了，反正大家都哄著他玩。然而，段先生覺得和中國人下棋不過癮，非要去找日本人下棋。這一下，就下出事兒來了。</p>\n<p>有那麼一陣子，老段在保定軍官學堂當總辦。保定一帶日本僑民多，段先生和他們下棋總是贏，便留下一個印象：日本人下棋臭。可惜走多了夜路，難免碰到鬼——有一個名叫中島比多吉的日本人路過保定，據說會下圍棋。</p>\n<p>段祺瑞大喜，又有了痛宰日本人的機會了！他邀中島下棋，結果是——大敗。老段不服，再戰，結果——連敗。老段吃驚不小：「你這麼厲害，想必是日本頂級高手？」</p>\n<p>「頂級高手？」中島差點沒噎死，「俺只是個業餘棋手，在俺們那疙瘩還有更厲害的職業棋手咧！」</p>\n<p>老段死活不信。謊言，肯定是謊言，多半是小日本找個超級高手冒充菜鳥來羞辱咱來啦！這一招咱老祖宗不就玩過嘛。據說唐朝宣宗的時候，日本圍棋第一高手小林勝雄來挑戰，我大唐第一高手顧師言就冒充菜鳥應戰，下出一招千古名棋「鎮神頭」，贏了不明真相的小林勝雄。</p>\n<p>就好像趙敏對波斯明教吹牛逼：「金毛獅王在中土明教中排名第三千五百零九。」咱老祖宗玩剩下的套路，嚇唬誰啊？</p>\n<p>段祺瑞一捋袖子，告訴中島：小樣你等著！俺大中華有的是高手來削你！</p>\n<p>五千年的風和雨啊藏了多少夢，八千里山川河嶽像是一首歌……還能讓小日本猖狂？</p>\n<p><span>【三】</span></p>\n<p>段祺瑞氣呼呼跑回北京，召集了一群高手，什麼「龍霸天」「震八方」之類，都是他府上圍棋俱樂部裡的猛將，組成段家軍，氣勢洶洶來削中島了。</p>\n<p>「呔！你這中島由紀惠……啊不，中島比多吉，快快受死！」</p>\n<p>對戰開始。中方高手剛惡狠狠地一落子，就把中島嚇呆了。別誤會，不是因為中方高手的棋好，而是因為他們的下法實在是太古老了，太OUT了。中島驚呼連連：「什麼？你們居然還在‘座子’？！」</p>\n<p>解釋一下，所謂「座子」，是上古圍棋的一種規矩，下棋前要先在四個角星位交錯放黑白各二子。</p>\n<p>中方高手不爽了「：大驚小怪什麼？難道你們島國下棋不‘座子’？」</p>\n<p>中島囁嚅地說：「‘座子’限制了圍棋的變化，俺們早在戰國的織田信長時代，就由大棋士算砂把‘座子’制度廢除鳥！」他的潛臺詞是：乖乖，都20世紀了，你們居然還在下兩千年前發明的上古化石圍棋！</p>\n<p>段家軍和中島鏖戰多日，一開始還能獲勝。但一個月下來，中島慢慢摸清了中方的棋路，段家軍連戰連輸，眼看頂不住了。他們慌忙找到段祺瑞：老大，我們陷了，敵軍實在太猖狂啊！</p>\n<p>段祺瑞震驚了：快！快請張樂山、汪雲峰來！</p>\n<p>張樂山，一代圍棋名家，長居北京。據說當時上海圍棋高手搞擂臺賽，每局棋不過五銀元，張樂山一到上海開價就是每局十銀圓，可見霸氣側漏。</p>\n<p>汪雲峰，著名棋手，棋風凌厲，最善亂戰。</p>\n<p>兩大高手飄然出現在中島面前，咣咣一通猛砸，中島不敵，吐血數升，大龍憤死。</p>\n<p>兩大高手正要慶祝勝利呢，卻見中島趴在棋盤上，喘息著說：「俺有個朋友，叫作高部道平，正在朝鮮旅遊，那可是比俺更厲害的職業棋手，你們敢會會他嗎？」</p>\n<p>張、汪兩大高手傲然一笑。爾要戰，便來戰！讓世界知道我們都是中國人！</p>\n<p>段祺瑞對此非常支援。他相信，日本「職業棋手」再強也不會比中島強多少嘛，在張、汪兩大高手面前絕討不了好去！</p>\n<p>這種自信，很像《三國演義》裡的冀州牧韓馥先生。韓先生給我們留下過一句充滿自信的千古名言：「吾有上將潘鳳，可斬華雄！」</p>\n<p><span>【四】</span></p>\n<p>當段祺瑞攜兩大高手見到高部道平時，差點兒沒僕翻過去。眼前這個28歲的小青年，鬍鬚才剛冒頭的浪人，居然還號稱是什麼比中島更厲害的「職業棋手」？</p>\n<p>汪雲峰先上。他發揮特長，落子如飛，大刀闊斧，一通猛攻！結果是——大敗！</p>\n<p>張樂山再上。他吸取教訓，穩凝如山，綿密厚重，招招致敵！結果還是——大敗。</p>\n<p>分先平等對局是不行了，改成讓子。高部道平讓張樂山二子，前後共弈近八十局，張樂山僅勝十三局。訊息傳出，震驚棋壇。</p>\n<p>國人不服：北方沒有高手，難道南方也沒有嗎？就像《連城訣》裡，絕頂高手裡除了「北四怪」，還有「南四奇」呢！</p>\n<p>於是乎羽檄星傳，浙、皖、淞、滬、揚南方數省高手齊集，邀戰高部道平。交手的地點定在一個龍盤虎踞的地方——南京。</p>\n<p>領銜出戰的正是中華棋壇的「南四奇」，他們是陳子俊、丁學博、王彥卿、範楚卿。這四大高手，有的善戰，有的善守，有的善屠龍，有的善官子，個個是一時之雄。高部道平欣然赴會，金陵棋戰就此揭幕。</p>\n<p>王彥卿、陳子俊先上，結果大敗，被高部道平打到讓兩子。其餘南方諸省高手也紛紛脆敗。</p>\n<p>碩果僅存的只有丁學博和範楚卿了。範楚卿出馬挑戰，仍被打到讓二子。「與對子，皆大負，受二子，仍負。」</p>\n<p>圍棋裡讓兩子是什麼概念？往大里說，幾乎是職業水平和業餘玩票的區別。舉個例子，1988年我國首屆「晚報杯」業餘圍棋賽，職業高手PK業餘高手，規則就是讓二子。</p>\n<p>陣中惱起了老將軍丁學博。他雖年事已高，毅然出戰，結果又被打到讓二子。至此，南京之戰，江南高手盡墨。</p>\n<p>王濬樓船下益州，金陵王氣黯然收！</p>\n<p>當然，上述幾戰是陸續完成的，不是同一地點，但大致情況如上文。我常常想，古龍的《浣花洗劍錄》裡，東瀛刀客孤身打敗中華群雄，是不是就是從這一段抄來的？</p>\n<p><span>【五】</span></p>\n<p>金陵之敗，讓國人徹底傻眼了。下棋都下不過小日本，我們不服啊！</p>\n<p>一個圍棋的發源地，一個湧現過顧師言、黃龍士、徐星友、範西屏、施襄夏、無崖子、段延慶、鳩摩智等圍棋大師的皇皇大國，現在居然衰到這種水平了？</p>\n<p>國人試探著問高部道平：「喂，聽說你們島國的職業棋手都是有段位的，就好比俺們丐幫有布袋，想必您一定是個九段高手囉？」</p>\n<p>高部道平嚇了一跳：「九段？你們想嚇死俺是吧？別害俺回去被師父師兄們笑話啊！俺只是個四段好吧！」</p>\n<p>國人不解，猛揉腦袋：「四段是個什麼檔次？」高部道平連連搖頭：「這麼說吧，在俺們那疙瘩，五段以上才能算是高段啊！」</p>\n<p>他還說了一段讓國人如雷轟頂的話：</p>\n<p>「俺們島國的圍棋，高手如雲，奇才輩出。最猛的門派一個是‘本因坊’，一個是‘方圓社’，相當於明教和少林派；俺充其量也就是‘方圓社’的一般水平，也就和你們全真教裡的什麼尹志平、趙志敬之類差不多。</p>\n<p>「說句不中聽的，你們的高手到了俺們那裡，弄不好也就是個鹿清篤啊！」</p>\n<p>寂靜，死一般的寂靜。過了好久才有人問：「有什麼辦法可以見識一下你們的真正高手呢？」高部道平抓耳撓腮：「要不，你們湊點錢，俺試試看能不能把俺大哥——廣瀨平治郎六段請來？」</p>\n<p>「湊錢！馬上湊錢！」段祺瑞一把揪住兩個最有錢的土豪朋友——中國銀行總裁王克敏和大富豪李律閣，「一定要把廣……廣那個什麼六段請來！」</p>\n<p><span>【六】</span></p>\n<p>廣瀨平治郎六段一聽，你找爺？爺來了！</p>\n<p>他帶來了更殘忍的真相——面對高部道平，張樂山等還勉強可以只受讓三子。但面對廣瀨平治郎，中國高手統統被讓三子，還是輸的多。</p>\n<p>至於段祺瑞自己，對陣高部道平都要被讓五子，對廣瀨平治郎估計要被讓七子、八子了。</p>\n<p>可以想象，當時中國圍棋人的心情。就像你閉門造車，苦練多年，自以為天下無敵，興奮地跑到終南山上去挑戰王重陽，結果被第四代弟子一掌KO，連丘處機、尹志平的面都沒見到。換了是你，你什麼心情？</p>\n<p>當時圍棋圈幾乎所有人都產生了同一個念頭：俺們的棋，可不能再這麼下了！人家島國的圍棋改革創新已經幾百年了，俺們還在把兩千年前的「座子」當寶貝。這種棋能不輸才見鬼！</p>\n<p>當時一個叫李子乾的人，目睹中國圍棋慘敗，憤懣而感慨地狂寫了十首《詠棋》詩，有一首是這樣的：</p>\n<p>「古法拘泥計本疏，兵情頃刻不相如。趙家十萬長平骨，誤在將軍讀父書！」</p>\n<p>我們國家的好多改革都是吵來吵去的，但是在當時圍棋改革的問題上，大家出奇地一致。因為圍棋可以分勝負。你要搞文學改革，肯定有人和你吵：憑什麼新文學好，舊文學壞？憑什麼不學老祖宗的要學人家的？但是圍棋不太存在這個問題：不服是吧？不服你出來走兩步？</p>\n<p><span>【七】</span></p>\n<p>從此，圍棋學日本掀起一大波高潮。1917年，段祺瑞送青年顧水如赴日本學棋；1918年，段祺瑞等促成「方圓社」棋士廣瀨平治郎訪華；1919年，又促成日本青年高手瀨越憲作訪華；同年年底，邀請日本第一高手本因坊秀哉訪華，震動一時——被鹿清篤打倒的國人，終於算是真正見到王重陽了。</p>\n<p>到了1928年深秋，史詩般的一幕出現了。14歲的福州青年吳泉東渡日本學棋，歷經磨難，終成為一代宗師——吳清源。</p>\n<p>當然，吳清源的成功，是日本圍棋圈裡的事，不代表中國圍棋的崛起。我們超過日本仍然是後來的事。</p>\n<p>近百年後的今天，日本人的圍棋玩不過咱們了。咱們現在派一批「90」後去，都能把他們的九段殺得稀里嘩啦。</p>\n<p>讓我們的目光穿越百年時空，重回到當年那塊棋盤上。在微弱的光芒中，彷彿又看到了「臭棋簍子」段祺瑞，他正被高部道平殺得大敗，底褲都輸掉了。</p>\n<p>我經常想，段祺瑞這種舊軍閥怎麼沒有把桌子掀了，怒吼一聲：「老子不下了，走，不更你小日本玩了！」</p>\n<p></p>\n<p>【天龍八部·珍瓏棋局】</p>"},{"title":"我做狂人，不做人渣","content":"<h2 id=\"sigil_toc_id_52\"><span>我做狂人，不做人渣</span></h2>\n<p><span><span>狂人會發動戰爭，但人渣才屠戮無辜。德軍裝甲艦長的故事告訴我們：有一種底線，叫作至少不要做人渣。</span></span></p>\n<p><span>【一】</span></p>\n<p>2006年，在烏拉圭一個名叫「蒙得維的亞」的海港附近，有人打撈起了一具奇怪的東西：一個三百公斤重的青銅雄鷹。</p>\n<p>那是德國裝甲軍艦「斯佩伯爵號」的艦首像。六七十年前，這艘船被炸沉在了那裡。</p>\n<p>這是一艘很牛的船。翻翻許多大人物的二戰回憶錄，很多人都誇過這條船。如果是德國人自己誇，比如鄧尼茨誇，又或者雷德爾誇，那沒什麼；關鍵連丘吉爾都誇。丘吉爾寫了本《二戰回憶錄》，一不小心得了諾貝爾文學獎。他給這艘德國船兩個這樣的評語——「勇猛果敢」「神出鬼沒」。</p>\n<p>之前說了，這艘船是二戰時德國的裝甲艦。請注意，「裝甲艦」名字聽著威風，其實是一種不上不下，甚至有點尷尬的東西。</p>\n<p>當時的軍艦裡，最牛逼的江湖大哥叫作戰列艦，聽名字就知道了，Battleship，排水量一般三萬噸以上；再往下的重巡洋艦，排水量就一萬噸左右了。</p>\n<p>德國人想造戰列艦，但是英國法國不準。要知道，第一次世界大戰德國戰敗，被迫簽了《凡爾賽和約》，不準造戰列艦。事實上別說戰列艦了，1935年之前連潛艇都不準有。</p>\n<p>鬱悶的德國人只好把1910年以前的幾艘老船開著玩。《凡爾賽和約》還要求，就算老船報廢，你新造的替代船也不能超一萬噸，主炮口徑不得超過二百八十毫米。</p>\n<p>德國人於是發了狠——行！老子就用一萬噸的船，安上280毫米的炮，把裝甲搞得厚厚的，續航能力強強的，不照樣揍你？</p>\n<p>就這樣，1928到1932年，德國人一口氣開工了三艘這樣的怪艦，分別是「德意志號」「舍爾海軍上將號」和今天的主角「斯佩伯爵號」。其中老三「斯佩伯爵號」裝甲最厚，防空火力最強，小身子，粗胳膊，活像大力水手。</p>\n<p>它又不是戰列艦，又不是重巡洋艦，所以被叫作「袖珍戰列艦」或「裝甲艦」。它的設計思路簡直是猥瑣——海戰之中，如果碰上敵人主炮二百毫米左右的重巡洋艦，它就上去用二百八十毫米的主炮胖揍人家；如果碰上三百毫米～四百毫米主炮的戰列艦，就拍拍屁股走人。</p>\n<p>英國覺得有點頭疼了：這種猥瑣的海盜船，巡洋艦打不過，戰列艦又追不上，還真有點難搞。</p>\n<p>當然，德國人知道，光靠怪船是搞不過老牌海霸英國的。1938年，德國人搞了一個「Z計劃」，打算猛造戰船，計劃要造五萬噸級的戰列艦六艘，兩萬噸級的裝甲艦八艘，二萬噸級的航空母艦四艘，還有潛艇二百三十三艘。這裡面還不包括兩艘國寶級的「俾斯麥級」戰列艦。</p>\n<p>可惜時不我待，德國佬已經沒有了造船的和平環境。二戰很快就開打了，這些船多數沒造出來。</p>\n<p>「斯佩伯爵號」，就靠你們哥兒幾個了，上吧。</p>\n<p><span>【二】</span></p>\n<p>其實，「斯佩伯爵號」在德國戰艦裡的江湖地位不算太拔尖——要看一艘船在德國的江湖地位，只要看它的名字就大致瞭然了。</p>\n<p>比如「俾斯麥號」，鐵血宰相大名鼎鼎，所以這艘戰列艦也無比牛逼；又比如「提爾皮茨號」，名字取自帝國海軍元帥阿爾弗雷德·馮·提爾皮茨，所以和「俾斯麥號」是同一級別，一樣牛。</p>\n<p>而「斯佩伯爵號」就明顯差了點，名字取自一戰時候德國海軍的斯佩伯爵，雖然也是條好漢，但只是中將，身份遠不如前兩個牛。</p>\n<p>就如同全真教造戰船，叫王重陽號､周伯通號的肯定比較牛，而「丘處機號」就肯定要差點兒，一個道理。</p>\n<p>你如果翻翻地圖就知道，德國人要和英國人打海戰，有個天然吃虧之處：大西洋公海在人家英國的西邊，不挨著你德國。你要打人家英國的海上運輸線，必須大繞圈子，偷偷地經北海，溜出設得蘭—挪威海峽，跑到人家後院大西洋去打。</p>\n<p>這個虧就吃大了——德國船一出來，就可能被英國的飛機和船隻發現，沿途漫長的行程中，步步挨刀，處處該災，人家隨便找地方捶你;而一旦有什麼刮蹭啊、追尾啊、戰損啊，英國佬的船隨便就回家修了，德國佬卻還要千里迢迢跑回本國去修。</p>\n<p>每次看地圖，我都覺得德國佬的海軍大兵真不容易。</p>\n<p>二戰開始後，「斯佩伯爵號」在艦長朗斯多夫海軍上校的指揮下，提前偷偷出發，繞過英國，潛入了大西洋中部，然後就漂在了那裡，吃喝拉撒，等著打仗。他們非常幸運，英國人居然沒發覺。</p>\n<p>既然你沒發覺，那就別怪爺太狠心了。</p>\n<p><span>【三】</span></p>\n<p>1939年9月，「斯佩伯爵號」結束打盹，正式開打，先就捶掉了英國商船「萊門特號」。這艘船隻有五千噸，沒有任何武器，幾炮就幹沉了。</p>\n<p>接著，它越戰越猛，接連捶掉了商船「阿什利號」､「牛頓海灘號」､「獵人號」､「特里文恩號」和油船「非洲貝號」。</p>\n<p>為了怕英國人報復，朗斯多夫上校帶著船溜到印度洋，深藏功與名。漂了個把月後，朗斯多夫在印度洋上只捶掉一艘船，覺得不過癮，又翻身殺回南大西洋。</p>\n<p>可能是在印度洋憋久了，嘴裡淡出鳥來，「斯佩伯爵號」一回大西洋就幹了一票大的，把萬噸貨輪「多裡剋星」給捶掉了。據統計，「斯佩伯爵號」自己才一萬噸出頭，捶掉的船已經有五萬多噸。</p>\n<p>朗斯多夫用兵神出鬼沒。為了迷惑英國佬，他還經常把船的外觀改來改去，時而修幾個木頭假炮塔，時而改改煙筒，英國人每次碰到的「斯佩伯爵號」都不一樣，鬧不明白德國究竟有多少艘裝甲艦在這裡晃。</p>\n<p>一而再､再而三地被人搞，英國皇家海軍怒了，真的怒了，覺得德艦太無恥，比抄六神磊磊稿子不署名的還無恥。他們調了四十多艘船，包括戰列艦、航母、巡洋艦等等，組了八個搜尋分艦隊，到南大西洋上去捶德國佬。</p>\n<p>必須說的是，朗斯多夫上校雖然狡猾好戰，卻並不殘暴。他的一個舉動讓自己留下了好名聲。</p>\n<p>在捶掉敵人的商船之前，他總會發出訊號，放救生艇，迫使敵方船員棄船登上「斯佩伯爵號」，這才動手攻擊。德國媒體20世紀末採訪老艦員，老人還滿懷敬意地談起朗斯多夫：「我們每擊沉一條船，都會把對方的船員接到艦上，給他們食物和水。」</p>\n<p>除非是遇到抵抗，朗斯多夫竟沒有殺害一名對方無辜船員，據說連德軍國防軍司令部都覺得他太仁慈了。</p>\n<p><span>【四】</span></p>\n<p>終於，在又捶掉了一艘商船後沒幾天，12月13日，英國海軍的三艘獵殺船發現了「斯佩伯爵號」。</p>\n<p>據說，當時朗斯多夫上校也發現了逼近的英重巡洋艦「埃克塞特號」，但他誤以為後面的兩艘船是驅逐艦，不捶白不捶，於是就準備上去胖揍別人。待到臨陣，才發現人家不是驅逐艦，是巡洋艦「阿賈克斯號」和「戰神號」。</p>\n<p>一挑三？朗斯多夫上校仗著炮粗皮厚，一咬牙，幹了，不就是多兩艘輕巡嘛，老子的副炮都有他的主炮粗！</p>\n<p>此戰的過程眾所周知。英國三艦成品字形群毆「斯佩伯爵號」。德國船用二百八十毫米主炮猛轟，把英國三艦最強的「埃克塞特」捶成重傷，然而雙拳難敵六神，自己也被毆到吐血，彈藥也快告罄，有種說法是當時主炮彈藥只剩五分之二。</p>\n<p>我忽然想起了《神鵰俠侶》裡的金輪法王，面對東邪、南帝和老頑童，把輪子丟在地上：「單打獨鬥，老衲誰也不懼。」</p>\n<p>趁著夜幕降臨，海上一片漆黑，「斯佩伯爵號」殺出了包圍圈。然而大海茫茫無處可去，航速又不佔優勢，只有邊修邊跑，一頭扎進了中立國烏拉圭的蒙得維的亞港。</p>\n<p>後來很多人說上校不懂政治，去錯了地方，他應該去阿根廷，因為阿根廷親德，烏拉圭親英。反正事後諸葛亮當起來容易。</p>\n<p>國際法規定，交戰方軍艦在中立港口只能呆七十二小時。烏拉圭一心想英國人拿世界盃，不給德國隊面子，拒絕延長時間。英國皇家海軍就堵在港口外，又新加入了重巡洋艦「坎伯蘭號」，並且放出假訊息：航空母艦「皇家方舟號」和戰列巡洋艦「聲望號」也到了。</p>\n<p>英國最想的是俘獲該艦，並得到關鍵的技術，如戰鬥桅樓，每次射擊後不必重新調整，而且它使水兵的視野非常寬闊。</p>\n<p>朗斯多夫上校面臨選擇：衝出去戰死，被俘，還是自沉？</p>\n<p><span>【五】</span></p>\n<p>12月16日夜，郎斯多夫做出了自己的選擇。</p>\n<p>次日下午，「斯佩伯爵號」緩緩駛離港口，數千人聚在岸上圍觀。開了數海里後，艦上剩餘人員坐救生艇離開，戰艦猛烈爆炸，開始下沉，連炮塔都被炸飛了。</p>\n<p>這就是郎斯多夫的選擇——自沉。他保住了所有船員的命。一千多船員都疏散到了阿根廷。其中大部分人後來返回了德國，剩餘的三百多人長久定居阿國。所有人毫髮無傷。</p>\n<p>只有朗斯多夫自己例外。安頓了船員後，他摸出手槍，朝自己腦袋開了一槍，為戰艦殉葬。</p>\n<p>當時據說就有阿根廷媒體嘲笑朗斯多夫。直到今天，我們還有一些人評論說朗斯多夫是孬種：為什麼不殺將出去？為什麼不和英艦拼個彈盡人亡？那才壯烈嘛！應該學鄧世昌，撞也要撞沉敵艦嘛！</p>\n<p>這種論調，我們太熟悉不過了：你為什麼不戰鬥到死？你為什麼不爬到終點？你嚴重傷害了我們觀眾的感情！</p>\n<p>有一條評論，不妨記在這裡：「朗斯多夫挽救了所有船員的性命。不過大家可否想過，如果我們在‘斯佩伯爵號’上服役，你是否會一輩子都感謝這個男人？</p>\n<p>整個二戰，最喜歡拼到最後一人的是日本軍隊。比如直接挑起盧溝橋事變的那個一木清直，後來就在瓜島和美國人拼到彈盡糧絕，然後燒了軍旗剖了腹。你覺得這支隊伍很可愛嗎？</p>\n<p>讀二戰史，有太多的屍山血河。朗斯多夫至少說明瞭一個道理：狂人會發動戰爭，但人渣才屠戮無辜。</p>\n<p>他重視對手的生命，也重視自己戰士的生命。我找不到什麼合適的詞來形容，只有一個詞約莫接近——騎士。</p>\n<p>德軍司令部都沒有要求這一千船員去拼命，而如果你一個八竿子打不著的中國人卻為此恨恨不已，悵然若失，這大概只說明一件事：你有做人渣的潛質。</p>"},{"title":"足球三篇·我願江湖如綠茵","content":"<h2 id=\"sigil_toc_id_53\"><span>足球三篇·我願江湖如綠茵</span></h2>\n<p><span><span>在我的想象中，最美好的結局乃是：左冷禪摸出一隻皮球：「嶽先生，這五嶽劍派盟主的歸屬，咱們踢一場見真章吧。」</span></span></p>\n<p>這是三篇關於足球的文章。</p>\n<p>世界盃和歐洲盃的週期，都是四年。如果放到武俠江湖裡，這是一個太短的時間，短到完全不足以申量英雄好漢。</p>\n<p>在江湖上，四年能做什麼？按照《鹿鼎記》裡武學理論家澄觀老和尚的說法，「學韋陀掌或大慈大悲千手式，聰明勤力的，學七八年也差不多了」。由此可見，區區四年，不過是隻夠學半套韋陀掌而已——連剛出道的虛竹都不如，人家虛竹剛出場時好歹還會一套韋陀掌、一套羅漢拳呢！</p>\n<p>這就是為什麼華山論劍這樣的大賽會動輒要以二十五年為期。只有足夠長的時間醞釀，新一代的英雄豪雄才能長成。「西毒北丐」被「西狂北俠」所取代，用了多少日子？那可是足足五十年。</p>\n<p>然而，我等浮躁庸眾、短暫浮生，哪裡能等得二十五年？四年的週期，已是我們忍耐的極限。</p>\n<p>華山論劍來臨時是什麼樣的感覺，我們無緣體會；但僅是每四年一屆的大球賽來臨時，我都會心潮澎湃，感到一種血戰將臨的氣息。對於我們武俠迷，這種氣息是何等似曾相識——在聚賢莊前，伏魔圈裡，光明頂上。</p>\n<p>我們知道，勝利者就在那三二十支隊伍裡，或者範圍再小一點兒，就在那五六支隊伍裡，卻無法確定將是誰；我們不知道那一群群看上去潛力無窮的青年裡，誰會困頓如曾阿牛，誰又會雄起如張無忌。</p>\n<p>我常常感嘆，武林和足球是多麼相似，只不過劍讓位給了球，變成了男人最迷戀的遊戲；我還常常感嘆，足球的發明者是何等的智慧和仁慈，把幾何體中最沒有稜角、最沒有傷害性的一種形體，指定為戰士們生死決鬥的武器。</p>\n<p>大約六百多年前，一個叫羅貫中的東方作家，還極力用詩歌美化血腥的搏殺——「世人黑白分，往來爭榮辱。」誰能想到，這個場面會從古人美好的想象，變成了今天草地上的現實？</p>\n<p>大約四百多年前，一個叫莎士比亞的西方作家，曾寫下過對力量的由衷讚美——「世界如同我的牡蠣，我能以劍將它撬開。」他又哪裡知道，將來征服世界不必非要用劍，還可以用球？</p>\n<p>球場畢竟不是江湖。江湖很危險，球場則很溫柔——再殘忍，不過是面對塔法雷爾的高射炮耳；再憤懣，不過是瞄準馬特拉齊胸脯的頭槌耳。以最少的血，換得最大的江湖快意；最小的戰場，博取最崇高的人生光榮，戰士們何樂不為？看客們何樂不為？</p>\n<p>金庸曾寫盡了武林，但他所描繪過最美好的結尾，亦不過是「耶律洪基說道：‘於我一生之中，不許我大遼國一兵一卒，侵犯大宋邊界’」。</p>\n<p>而在我的想象中，最美好的結局乃是：左冷禪摸出一隻皮球：「嶽先生，這五嶽劍派盟主的歸屬，咱們踢一場見真章吧。」</p>\n<p>人道綠茵如江湖，我願江湖如綠茵。</p>"},{"title":"金庸式崛起，古龍式老去","content":"<h2 id=\"sigil_toc_id_54\"><span>金庸式崛起，古龍式老去</span></h2>\n<p><span><span>金庸和古龍不同，他對老人是充滿溫情的。在他的遊戲規則裡，武功會隨著年齡的增長而不斷變強，絕世高手多是些自稱「老夫」「老衲」「老朽」的傢伙。</span></span></p>\n<p>最近三個世界盃週期中，足球江湖裡的一大事件，就是偉大西班牙的崛起和沒落。</p>\n<p>他們在巴西世界盃上出局時，有個專欄約我寫評論。我卡在了題目上，搜腸刮肚想了好幾個都不合適，忽然看到書架上的《風雲第一刀》，心有所感，想到了一句話——他們以金庸的方式崛起，卻又以古龍的方式老去。</p>\n<p>在金庸的江湖裡，大俠們的成長是很艱辛的，大多要經過一番從小到大、由弱到強的坑爹捶打。</p>\n<p>瞧瞧吧，小郭靖被扔到蒙古草原，小楊過在破窯裡登場，小張無忌乾脆被作者一下捅到北極。令狐沖算是成年人登場，但一上來體內就被搞了七八道真氣，哼哼唧唧，半條人命。他們被小角色們狂虐，被「黃河四鬼」打，被鹿清篤打，被西華子打——這些人都是些什麼渣滓啊，不是鐵桿金庸迷，可能連聽都沒聽過。他們飽經風雨，直到機緣巧合、風雲際會，才能撐破乾坤一氣袋，從此一鳴驚人。</p>\n<p>這多麼像西班牙隊，從1954年到2010年，他們敢半個多世紀不進世界盃四強，一直頂著「慢熱」「軟蛋」的名頭，被奈及利亞虐，被韓國虐，被南斯拉夫虐，直到南非才水到渠成，成就了霸業，締造了王朝。</p>\n<p>但殘酷的是，輝煌以後，他們的王朝卻不能以金庸的方式體面落幕。</p>\n<p>金庸對老人是充滿溫情的。在他的遊戲規則下，武功和內力會隨著年齡的增長而不斷變強；滿頭白髮不意味著衰邁，而意味著深不可測；絕世高手多是些自稱「老夫」「老衲」「老朽」的傢伙。</p>\n<p>金庸認為武功只會失傳，而不會過時。最好的武功往往是最古老的武功，不會被時代的進步所淘汰。一本秘笈可以流傳數百年，一朝出世，仍然可以驚天動地。你撕了胡家刀法的一頁紙回家練練，足以數十年間威震江湖。</p>\n<p>如果按金庸的規則，西班牙王朝應該以北丐、西毒的方式在華山之巔華麗謝幕，他們的足球應該永遠被後生小子模仿學習，不應該這樣窩囊廢死。</p>\n<p>可惜，王者之師以古龍的方式老去了。</p>\n<p>在古龍的江湖裡，歲月不饒人。衰老、不好的生活方式、缺乏鬥志和進取心，都會讓英雄的劍變慢、變鈍，最後癱軟如泥。英雄豪傑們必須時時刻刻像繃緊的弦，在江湖一線的廝殺中磨礪自己。如果遠離戰場太久，他們就會蛻化。</p>\n<p>古龍認為，一時一刻的偉大絕不代表永遠的偉大。江湖上最強武力的擁有者往往不是昏聵的老朽，而是李尋歡、葉孤城們。天機老人在兵器譜上排名更高，然而因為脫離血腥的殺場太久遠了，照樣鬥不過年齒正盛的上官金虹。</p>\n<p>足球場說到底是狼的世界。狼王換代的時候，是沒有什麼所謂體面可言的。這裡沒有蟄伏四十一年還可以稱霸的掃地僧，只有無數蠢蠢欲動、野心勃勃的小狼崽子，隨時準備撕碎年邁的老大。</p>\n<p>在金庸和古龍的江湖中，都有英雄人物對命運歸宿的終極之問。</p>\n<p>金庸問的是：「我是誰？」古龍問的是：「天涯遠不遠？」</p>\n<p>前者優裕、充實，可以從容靜思裝十三，以追求自我的實現和心靈的圓滿。後者漂泊、孤獨，永遠充滿不安全感，時刻覺得在被放逐。</p>\n<p>西班牙人曾完滿解開了前一問，正在茫然尋找後一問者的答案。</p>"},{"title":"愛上一個隊，像追一個妞","content":"<h2 id=\"sigil_toc_id_55\"><span>愛上一個隊，像追一個妞</span></h2>\n<p><span><span>很多人喜滋滋地選好了自己的姑娘，準備涉江採芙蓉，然後……然後就憂傷以終老了。</span></span></p>\n<p>現在高喊「我德威武」的年輕人，很多是2006年以後喜歡德國隊的。那時候足球話題在社會上越來越熱，越來越時尚，正好德國隊年輕又搶眼，自克林斯曼以下個個乾淨利落，優等生氣質十足，成績又好，他們就這麼喜歡上了。</p>\n<p>真羨慕這些傢伙。他們就好像選姑娘，一上來憑印象挑了一個，結果就趕上了她最好的年華，她青春自信，活力四射，渴望愛情，讓小夥子們輕鬆就摘到了愛情的果實。</p>\n<p>小傢伙們那一句句「我德威武!」喊得多麼輕鬆，好像姑娘從來都是唾手可得，感情這玩意兒是天下最簡單的事。</p>\n<p>至於我就悲催了。我和大家一起看義大利，然而在2000年歐洲盃的時候忽然迷上了葡萄牙。</p>\n<p>我也以為自己挑到了好姑娘，趕上了她的好年華，然而十四年過去，她始終對我若即若離，似有意似無意，然而卻始終泡她不開，推她不倒，偶爾給些小驚喜，更多的是傷痛和寂寥。</p>\n<p>更刺激人的是，旁邊那些新晉德迷約會個兩次就得手了。德國隊——那個2000年時無法和我的女神比的柴火妞兒，如今打扮得花枝招展，和小男朋友們牽著手逛大街了。</p>\n<p>物傷其類。我知道一些廣東朋友看英超比較早，許多人就此喜歡英格蘭；一些90年代看佛羅倫薩的，許多因為巴蒂而迷上了阿根廷；一些人帶著「三劍客」或是博格坎普的情結而認準了荷蘭。他們也喜滋滋地選好了自己的姑娘，準備涉江採芙蓉，然後……然後就憂傷以終老了。</p>\n<p>愛上一個妞兒的方式，五花八門，其實和「眼光」是沒有多大關係的。有時候是一個姑娘突然一頭撞進你心裡，仔細一看，其實長得不太美，也不太適合結婚，但你偏就看上了，就像我知道有一群人因為裡克爾梅那一陣忽然迷上了比利亞雷亞爾。</p>\n<p>有時候是一個姑娘資質不錯，但情場遭遇太慘，引發了你的同情心，你勸著勸著就喜歡上了，就像經歷了黑洞時代的「大國米」球迷。</p>\n<p>有些姑娘過去曾經女神過，超級美，你被她當年的海報、畫片兒迷住了，找到真人一看，她容顏已經憔悴，境況也不如前，但你還是無怨無悔地認下了，比如最近幾年的米蘭球迷。</p>\n<p>有句歌怎麼唱的來著，愛一旦發了芽，就算雨水都不下，也阻止不了它開花。對於英迷、荷迷、葡迷等輩嘛，別再計算代價，愛了就愛了。</p>"},{"title":"老院主的逼格","content":"<h2 id=\"sigil_toc_id_56\"><span>老院主的逼格</span></h2>\n<p><span><span>把最奢華的玩意，偏偏放在最不起眼的地方，這是逼格的至高境界。</span></span></p>\n<p>《西遊記》裡面的人物，在生活態度上和《紅樓夢》明顯不同。紅樓裡的人很追求生活的品質，食不厭精，膾不厭細。西遊裡的人物不一樣，對生活的品質和情趣都不怎麼講究。</p>\n<p>他們追求的東西大多是這麼幾種：第一類是想吃唐僧肉長生不老的，比如白骨精、金角大王等；第二類是想去西天成正果的，比如黃眉怪等；第三類是想「奼女求陽」的，比如女兒國的國王、玉兔精、金鼻白毛老鼠精等。還有想吃人作孽的，想佔據山野為王的，等等，都不大重視生活的細節。</p>\n<p>但也有例外。有一個《西遊記》裡的人物，他別無所求，唯獨追求生活的品質。他就是觀音禪院的老院主同志，也就是電視劇裡偷唐僧袈裟的那個老和尚「金池長老」。</p>\n<p>這個人號稱活了二百七十歲，最喜歡講究穿著打扮、器物用品，對其他事情都毫無興趣。比如他不喜歡旅遊，用他自己的話說是「虛度一生，山門也不曾出去」；不喜歡求仙問道，半點都沒有黃眉怪那樣取代唐僧去取經成正果的念頭；不喜歡駿馬，他後來迷戀上了唐僧的錦襴袈裟，卻對同樣罕見的白龍馬視而不見，甚至要燒死白馬就是例子。</p>\n<p>這個人一出場，作者就鋪陳他對穿著打扮的講究：他戴的是「一頂毗盧方帽，貓睛石的寶頂光輝」；身上穿的是「一領錦絨褊衫，翡翠毛的金邊晃亮」；而且「一對僧鞋攢八寶，一根拄杖嵌雲星」，一個穿金戴銀、花裡胡哨的老和尚躍然紙上。</p>\n<p>作者覺得鋪陳得還不夠，又開始渲染他對器物用品的講究。比如他請唐僧喝茶，「一個羊脂玉的盤兒，三個法藍鑲金的茶盅。又一童，提一把白銅壺兒，斟了三杯香茶」。不但用的茶具是好茶具，茶葉至少也是萬兒八千塊一斤的好茶葉，不然作者也不會說那茶「真個是色欺榴蕊豔，味勝桂花香」。</p>\n<p>他老人家生活這麼奢華，怎麼讀者偏偏感覺不到他高大上呢？因為作者時時刻刻不忘提醒你，他的品位其實很差勁，他的逼格很低。</p>\n<p>例如老院主向唐僧炫耀他的七八百件袈裟，吩咐「道人開庫房，頭陀抬櫃子，抬出十二櫃。開了鎖，兩邊設下衣架，四圍牽了繩子，將袈裟一件件抖開掛起，請三藏觀看」。</p>\n<p>這個舉動太傷逼格了。就像有些裝逼指南里說的，看歌劇的票根要夾在書裡讓客人隨手翻到才行，怎麼能公然嵌在茶几的玻璃板上？一件好袈裟，有無數種展示的辦法，怎麼能牽了繩子一件件抖開掛起來呢？</p>\n<p>此外，《西遊記》的作者還不斷提醒你，那些袈裟本身的品質也不太高。書上借孫悟空的口說，這些袈裟「都是些穿花納錦，刺繡銷金之物」，鄙視之情溢於言表。要知道，孫悟空是個山裡混大的土妖精，極欠藝術細胞，自己的穿戴也不講究，本身可以算是非常沒有品位的。連他都覺得不夠高階大氣的袈裟，能是什麼好貨色嗎？</p>\n<p>唐僧就更不用說了，人家是見過大世面的，不但是大廟出身的法師，還是大唐皇帝的御弟，分辨好壞的能力當然超級強。雖然他說話沒有孫猴子刻薄，但更是一眼就看穿了老院主的底細，給了老院主精闢的評語——「貪婪奸偽之人」。</p>\n<p>和老院主一對比，唐僧是多麼有品位啊！他雖然表面上風塵僕僕、衣服破舊，但你可知道他騎的馬是龍馬，全名是「敖閏龍王玉龍三太子」？你可知道他拿的杖是價值兩千兩銀子的九環錫杖？你可知道他化緣用的是紫金缽盂，不但是唐代官窯精品，一代名器，而且還是皇帝親賜的高階貨——後來西天大雷音寺裡，向唐僧索賄的阿儺、伽葉可以算是見過世面的吧，算是眼光高的吧，收到這個缽以後都要「微微而笑」「只是拿著缽盂不放」。</p>\n<p>更體現唐僧品位的是，他的錦襴袈裟從來不穿，偏要用油紙包著放在行李箱裡——你以為是他愛惜捨不得嗎？這其實是體現自己極高品位的一個明證啊！請記住，把最奢華的玩意兒，偏偏放在最不起眼的地方，這是逼格的至高境界。</p>\n<p>現在很多人士也很追求品位，這沒錯，只是一定要學唐僧，不然就會變成老院主一樣的土鱉。有一次吃飯，席上有一位幹部，當上了一杯咖啡時，他微微皺眉，用手把杯子推開，淡淡地說：「我對咖啡的要求是比較高的。」但是，你的鼻毛大簇大簇地露在外面，你對自己儀表的要求還沒有咖啡高嗎？</p>"},{"title":"你真的看懂了新白娘子傳奇嗎？","content":"<h2 id=\"sigil_toc_id_57\"><span>你真的看懂了新白娘子傳奇嗎？</span></h2>\n<p><span><span>李公樸其人，相當於錢塘縣派出所所長。後來出場的九爺則是經營了一家鏢局，相當於錢塘保險公司董事長。這就是為什麼九爺和二奶奶一門心思要把女兒香巧嫁給許仕林的原因。</span></span></p>\n<p>白素貞見多識廣，她的感情目的性強，所以閃電結婚，直奔主題。從她遇見許仙，到許仙說出「娘子，紅燭已半，咱們早點安歇了吧」，只用了一集。</p>\n<p>胡媚娘情竇初開，要逛街，要看燈，要喝茶，要旅遊，重視過程，和許仕林拍拖了幾十集，自己能搭上的都搭上了，最後還落得一個「碧蓮，仕林是你的，我搶不走」。這就是熟女和少女在處理感情上的區別。</p>\n<p>法海以降妖除魔為己任，但整部戲裡的妖怪那麼多，他唯獨對抓白蛇特別積極,對其他妖怪一概姑息養奸。比如金鈸法王，算是鳳凰山妖怪集團的頭目，法海見了理都不理。</p>\n<p>唯一可能的解釋，是法海出於心理上的原因，只抓那些男女作風混亂的妖怪，和太監恨青樓的心態差不多。而金鈸法王平時好像不大愛好女色，而是更沉迷於演奏民族打擊樂器；他雖然生了一個兒子蜈蚣精，但蜈蚣精的媽始終沒有出現，可能是死了，也可能已被拋棄了。</p>\n<p>彩茵去金鈸的房間裡偷金牌時，他也是獨自睡覺，睡的還是單人床，沒有叫人陪睡的跡象。這就是為什麼法海對金鈸看著還比較順眼。</p>\n<p>青蛇的口頭禪是「這可不是鬧著玩的！」但她自己卻到處鬧著玩。她非常重視房產對於現代婚姻的作用。在和張公子的拍拖過程中，她先是到錢塘縣遠郊區，添置了一棟名叫「逍遙居」的小產權房，並進行了簡裝；後來她誤以為張公子的爹媽要死了，高興之下，又起了侵佔地段更好、面積更大、裝潢更豪華的張家房產的念頭，打算「那張公子就不用搬出來了，我住進來就好了」。</p>\n<p>沒想到最後兩人終於不能在一起，原因不是沒房子，而是在兩性上不能相容，這一段是我後來才看懂的。可見愛情不管負載了多少外來之物，最終決定其質量的，仍是一些最本源的東西。</p>\n<p>這不僅讓人想到現在，多少人因為激情搞到一起，卻因為物質而分開；也有多少人因為物質而搞到一起，又因為沒激情而分開。</p>\n<p>李公樸其人，相當於錢塘縣派出所所長。後來出場的九爺則是經營了一家鏢局，相當於錢塘保險公司董事長。所以，九爺必然要拍李公樸的馬屁，不然就沒法生存。這就是為什麼九爺和二奶奶一門心思要把女兒香巧嫁給許仕林的深層次原因，如果成功了，這就是一場典型的官商勾結的婚姻。</p>\n<p>但是許仕林年輕，在兩性問題上不成熟，對乾瘦木訥的香巧不感興趣，而是迷戀上了「胡記繡莊」服裝店的老闆娘胡媚娘。二奶奶當然非常憤怒，無法理解許仕林為什麼放著大企業家的千金不要，非要去和女個體戶混，所以她堅信胡媚娘是「狐狸精」，暗指胡記繡莊以賣服裝為幌子，實際上是李公樸暗地裡支援的一家大夜總會。</p>\n<p>大家看片時注意，李公樸多次在公開場合為胡媚娘說話，這可能讓二奶奶更堅信了李公僕在給胡記繡莊做保護傘。</p>\n<p>同理，雖然九爺沒能如願把女兒香巧嫁給李所長家的許公子，但後來他一直非常注意搞好和李家的關係。李公僕被金鈸法王打傷後，他就十分積極地來給李公樸接骨；後來又巴巴地派老婆二奶奶送藥來，希望二奶奶能和派出所所長夫人許婉容搞好關係。可惜二奶奶太不善於處事，把李家上下都得罪了，可惜了老公一片苦心。</p>\n<p>李公樸雖然是個搞笑分子，工作能力也不強，但並不幼稚愚蠢。他說話有時候言簡意賅，一針見血，比如他說「衙門是個大染缸，出來的人都是五花六色的」。</p>\n<p>李碧蓮，大體是個無知、愚蠢、暴躁、無味的女人。按道理說，敵人的敵人是朋友，但李碧蓮呢？敵人的朋友是她的敵人，敵人的敵人還是她的敵人。本來她的最大威脅是胡媚娘，在這一點上她和二奶奶是共同的，她們應該是朋友。對於李碧蓮來說，先擊敗媚娘應是主要矛盾，因為她和媚娘比毫無優勢；至於她和香巧之間應該是次要矛盾，因為她和香巧比要大佔優勢。</p>\n<p>但李碧蓮分不清主要矛盾和次要矛盾的區別，四面開火，到處進攻。因為不滿香巧提親的事，她每次必攻擊二奶奶，把所有人都推向她的對立面。整個劇集裡，除了大備胎戚寶山，幾乎沒有一個人公開說碧蓮的好話。</p>\n<p>李碧蓮多次正面挑戰胡媚娘，非但不智，而且愚蠢。她的進攻方式就是衝到別人家裡去吵架，可謂是以己之短，攻人之長，處處落於下風。</p>\n<p>她的醋意達到最高潮的一次，是胡媚娘當著她的面對許仕林說「這是我特地從家鄉帶來的靈芝，帶給你補補身子的……」如此富有性暗示的一句話，讓李碧蓮完全喪失理智，發動瘋狂進攻，也把自己的弱點完全暴露。</p>\n<p>有一個情節，是她給許仕林送花，卻發現許仕林已經收了胡媚孃的花，就憤而把花丟掉，說：「我的野花哪裡有你的家花香！」</p>\n<p>其實按道理說，她和許仕林青梅竹馬，又有長輩指婚，光明正大，她應該是「家花」才對；胡媚娘來路不明，應該是「野花」才對。</p>\n<p>但李碧蓮由於久攻媚娘不克，長期落於下風，連她自己潛意識裡都覺得自己是「野花」，胡媚娘是「家花」，可見她的危機感和悲觀情緒是多麼強烈，對這場戰鬥是多麼沒有信心。如果不是編劇和導演安排，看不出李碧蓮有任何贏的機會。</p>"},{"title":"後記","content":"<h1 id=\"sigil_toc_id_58\"><span><span>後記</span></span></h1>\n<p><span>小時候的夢想，都是有用的</span></p>\n<p><span><span>如果過去的自己、那個十歲的少年來到我面前，問我：你把我的夢想搞到哪裡去了？我怎麼回答？對不住，我把它打包了，塞到犄角旮旯裡去了？</span></span></p>\n<p>看金庸小說，有時候是「血淋淋」的事。是的，你沒看錯，是這三個字，一點不誇張。比如我上中學那會兒，樓上的一個班級就發生了一件關於金庸的血案。</p>\n<p>那個班上有三四個金庸迷，把盜版三聯金庸小說藏在抽屜裡，被女班主任抓住了。那時候不像現在，小說有口袋本，還可以在電腦、手機上看，那時候只有大本的書，一旦查起來你想往褲襠裡塞都不行，很容易就人贓俱獲。</p>\n<p>發飆的女老師命令他們必須寫下保證書，絕不再看金庸。這倒沒什麼，要命的是後一句——必須咬破手指，在保證書上按血手印。</p>\n<p>那幾個夯貨就真的開始咬，紛紛選擇自以為最不疼的手指，有的咬拇指，有的咬中指。現在的小朋友估計對此很難理解，但在那時候的笨孩子心裡，老師說讓咬，那就必須咬啊。</p>\n<p>幾個夯貨啃了半天仍然沒有咬出血來，幾乎要哭了，說：老師，真的咬不破啊！女老師將信將疑：電視劇上按血手印，不都是隨便一咬就破了嗎？然後更可怕的事發生了。不記得是女老師自己想出來的，還是哪個操蛋的班幹部提議的——既然咬不破，那就用刀。</p>\n<p>一種肅殺的氣氛瀰漫了整個教室。女老師真的搞來了一把小刀，削鉛筆的那種。小刀很鈍，還有點鏽——是一把鏽春刀。</p>\n<p>第一個被選來開刀的是個姓盧的同學。他身板壯實，貌似很能挨刀。但後來發生的事證明，女老師和盧同學都顯然低估了冷兵器對人體的殺傷力。</p>\n<p>盧同學為人實誠，一刀割破了自己的指肚。在血冒出來的剎那，他崩潰了，發出慘叫，臉瞬間變得慘白，搖搖欲墜。</p>\n<p>被嚇壞的女老師失去了繼續執行酷刑的勇氣，慌忙命人把盧同學送去校醫院。後面幾個「犯人」則死裡逃生，被「皇恩」大赦，統統釋放。</p>\n<p>護送盧同學的隊伍正好從我窗前經過。我作為當時金學盟主，卻對他愛莫能助，只有他那慘白的死鬼般的臉色，到現在還記憶猶新。</p>\n<p>今天我說這些，用意倒不在揭露女老師是多麼殘忍。我只是想說，這就是看金庸的代價。</p>\n<p>那個年代，用手電筒在被窩裡看過書的人，才懂這種代價。武俠電視劇沒有重播，過期不候，每天只放一集，電視劇裡桃花島的佈景比現在許多密室逃生還山寨，我們卻能從頭到尾一集不落。</p>\n<p>我們研究著小說裡的各種問題，比如：為什麼書裡明明沒有「碧血劍」，書名卻要叫《碧血劍》？女生到底能不能練「葵花寶典」？咱們能不能給女同學偷偷點個守宮砂？</p>\n<p>然而，不知不覺間，人就長大了。</p>\n<p>我們開始覺得金庸小說迂腐起來——書上的愛情觀比絕大多數現代題材小說都保守；書上所謂倜儻瀟灑的俠客其實好古板，做事好多條條框框；書上的成功學不夠黑、不夠狠，無法教人在競爭激烈的今天成功。</p>\n<p>我們好像開始理解了女老師想用刀子告訴我們的話：你們小時候的愛好沒有意義，小時候喜歡的東西不能養活你；小時候喜歡的妞都不是真愛。</p>\n<p>於是，小時候的夢想被打包了起來，塞進了書櫃的最下層。我們努力去學一些小時候討厭的東西，做小時候討厭的人。女老師的刀子，指引著我們前進。</p>\n<p>大學畢業的時候，我忽然意識到要養活自己，得找份工作。</p>\n<p>有個公司招一個弄稿子的人。我打算去，卻發現自己面臨一個難題——我無法說服人家我會弄稿子。我學了一堆自己小時候討厭的東西，但是人家不稀罕。</p>\n<p>左思右想，我抱了一摞書去，是大學時出的一套打打殺殺的小說。我只有十套樣書，之前左送右送，只剩下不完整的幾本了。</p>\n<p>結果公司把我收下了。我這才發現一個讓人驚訝的事實：小時候挨刀的興趣，居然養活了我。原來小時候的夢想，真的是有用的。</p>\n<p>越往後來，這種感覺就越強烈：小時候認定的好多事情，那些一度曾動搖過的事情，原來沒錯啊！</p>\n<p>比如人生理想就是可以隨心所欲讀閒書——如今越發覺得，這個目標確實特麼遠大；比如娶黃蓉這樣的老婆——天理良心，找到個廚藝好的老婆，真是比什麼都強；比如小時候喜歡的妞——回頭想想，那絕對是真愛啊！</p>\n<p>我們愧對小時候的自己。是我們改變了初心，掰彎了自己，一邊被社會爆，一邊還自鳴得意。</p>\n<p>如果過去的自己、那個十歲的少年來到我面前，問我：你把我的夢想搞到哪裡去了？我怎麼回答？對不住，我把它打包了，塞到犄角旮旯裡去了？</p>\n<p>小時候攢下來的金庸全集和各種武俠連環畫，早就風吹雲散，不知道搞到哪裡去了。時代變得很快，物質迅速腐朽，但我相信，我搞丟的那些書不管已經變成什麼形態存在於這世界上，依然會牛逼閃閃。</p>\n<p>當然，武俠電視劇我們不追了，因為老劇太糙，新劇太傻，越來越沒耐心看下去。原著也很少從頭再讀了，想要有整個空閒的下午回爐一本書，真是好難。</p>\n<p>但這不妨礙我們開啟深藏的包袱，撣撣心上的灰，重溫少年的夢。</p>\n<p>來，讓我們乾了這碗雞湯，拾掇拾掇理想，重新上路。</p>\n</div>"}];

let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn-top, .chapter-btn-sub').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn-top.active, .chapter-btn-sub.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  sidebarItems.forEach(function(item, i) {
    var btn = document.createElement('button');
    btn.className = item.depth === 0 ? 'chapter-btn-top' : 'chapter-btn-sub';
    btn.textContent = item.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});
