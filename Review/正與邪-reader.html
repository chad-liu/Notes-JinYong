呈上貴重禮物，一場大禍消弭於無形。原來任我行天年已盡，現下教主是轎子裡的盈盈。</p>\n<p>三年以後兩人成親，方證、沖虛、莫大等人都前來道賀。令狐沖和盈盈給眾人合奏《笑傲江湖》曲，無不心曠神恰。令狐沖體內真氣已盡數化去，將掌門傳給儀清，盈盈也將教主交由向問天。令狐沖答應過小師妹照料林平之，已把他關在梅莊地底的黑牢之中。勞德諾自練“辟邪劍法”，不得其法，廢了一身武功，盈盈把他跟兩隻大馬猴鎖在一起，給馬猴拖來拖去，不由自主。</p>\n<p>心理分析</p>\n<p>沖虛道長安排也夠精密，兩萬斤炸藥足夠把魔教炸得屍骨橫飛。各派高手退入深谷，傷亡可減至最輕。任我行大獲全勝，得意之下也必定會去坐那寶椅。那寶椅也著實漂亮，符合任我行的口味，任我行一見之下，豈能不喜？</p>\n<p>靜室之中，霎時間光彩奪目，但見那椅套以淡黃錦緞製成，金黃色絲線繡了九條金龍，捧著中間一個剛從大海中升起的太陽，左邊八個字是“中興聖教，譯被蒼生”，右邊八個字是“千秋萬載，一統江湖”。那九條金龍張牙舞爪，神采如生，這十六個字更是銀鉤鐵劃，令人瞧著說不出的舒服。在這十六個字的周圍，綴了不少明珠、鑽石，和諸般翡翠寶石。簡陋的小小庵堂之中，突然間滿室盡是珠光寶氣。</p>\n<p>這樣的安排，找不出絲毫遺漏，即使是任我行如此細心的人，也找不出任何可疑之處。但總有人棋高一招，跟任我行相比，沖虛的計謀畢竟遜了一籌，還是有所不及。論心思計謀，不得不承認任我行有過人之處，他所精心策劃的，根本就不是攻打恆山，聲東擊西，名義上攻取恆山，實則圖謀武當少林，利用的正是武當少林救援恆山之際，內部實力空虛，可以一舉拿下。料定此次進攻，武當少林必然救援恆山。不出所料，武當少林果然積極救援，主要力量都調上恆山。方證、沖虛等人細心安排抵禦的同時，殊不知，正好中了任我行大計。這一仗打起來，死傷慘重還是小事，只怕任我行拿了武當少林，真要成就千秋萬載大業，生靈塗炭，在所難免。任我行這個人，說到做到，他要滅掉一個派，一個族，那可絲毫沒有誇張的成分。</p>\n<p>方證哈哈一笑，說道：一場大禍消弭於無形，實是武林之福。看任教主今日的舉止，於我正教各派實無敵意，化解了無量殺劫，實乃可喜可賀。</p>\n<p>只聽得供桌下不斷髮出聲音：“衝哥，我爹爹，他……他老人家已過世了。”“怎麼會過世的？”“那日在華山朝陽峰上，你下峰不久，我爹爹忽然從仙人掌上摔了下來。向六哥和我接住了他身子，只過得片刻，便即斷了氣。”“那……那……有人暗算他老人家麼！”“不是的。向大哥說，他老人家年紀大了，在西湖底下又受了這十幾年苦，近年來以十分霸道的內功，強行化除體內的異種真氣，實在是大耗真元。這一次為了佈置誅滅五嶽劍派，又耗了不少心血。他老人家是天年已盡。”“當真想不到。”</p>\n<p>方證、沖虛、令狐沖三人聽著，亦不禁都有悽惻之意。任我行一代怪傑，雖然生平惡行不少，但如此下場，亦令人為之嘆息。令狐沖對任我行的心情更是奇特，雖憎他作威作福，橫行霸道，卻也不禁佩服他的文武才略，尤其他肆無忌憚、獨行其是的性格，倒和自己頗為相投，只不過自己絕無“一統江湖”的野心而已。一時三人心中，同時湧起了一個念頭：“自古帝皇將相，聖賢豪傑，奸雄大盜，元兇巨惡，莫不有死！”</p>\n<p>任我行這一死，從心理反應上，令狐沖是第一大受益者。前邊的文章裡已經用不少篇幅介紹過心理反應對軀體反應的影響，我們很難否定這樣的事實，因為太多的案例表明，心理健康狀況，潛意識的反應，對軀體疾病是有影響作用的。令狐沖在朝陽峰拜見任我行的時候，體內真氣開始大發作，疼痛難以忍受。以往雖然時不時有發作，但一直沒那麼厲害。其實這倒特別符合他的潛意識反應，因為他在朝陽峰的時候，已經意識到問題的嚴重性，自己不可能加盟魔教，而任我行是不會善罷甘休的，說過的話不能不算。雙方不肯讓步，令狐沖就必然要面對一個殘酷的事實，是關於盈盈的情感取捨的問題。跟任我行對戰，盈盈站哪邊都不是，但更大的可能還是站在父親一邊。令狐沖覺得，自己死了不要緊，關鍵是盈盈。跟任我行鬥，必死無疑，最可怕的只是，自己死了以後，盈盈一天都不可能多活，他清楚盈盈的性格，說服是不可能的，勸說根本不會有用。而他身體上的反應，體內真氣攪動糾葛，跟他情感取捨的糾纏，方式上完全一致。</p>\n<p>細心的讀者會注意到，令狐沖體內真氣兩次大發作是最明顯的。上邊說的拜見任我行是一次，下一次發作最厲害的，是在剛好收到魔教攻打消息的時候。這次的疼痛比上次還厲害，疼到抱著肚子在地上打滾。心理原因很簡單，更進一步接近情感的取捨了。假如盈盈被炸死，自己真的什麼都沒有了。特別於心不忍，但是又沒有任何辦法。</p>\n<p>任我行死了以後，令狐沖跟盈盈圓滿成親，那麼體內真氣也該化解了，理所應當。於是，體內真氣也還真就完全化解了。因此，與其說是方證的內功心法救了令狐沖，不如說是任我行的死，以及盈盈的愛情救了他。當然，我們並不反對，他體內真氣的確是《易筋經》的內功心法給化了去，但潛意識為什麼選擇那樣的時刻發作，之後又選擇這樣的時刻化解，並不是純粹巧合的。</p>\n<p>除了令狐沖，天下不知道多少無辜的性命，都因為任我行的死而僥倖存活。讓人忍不住感嘆：幸好老傢伙死了！排除這些現實的理由，單從心理影響上說，我們也認為，人都會死，這其實是對人類特別有利的一條基本規律。因為生命的本質就在於追求變化，要在不斷的變化中，生命才有意義。任何停滯了的，阻礙生命運動的行為，都是反生命的。沒有死亡，現在可能還是秦始皇的天下，這是一個很恐怖的事實。</p>\n<p>人往往都比較容易膨脹，某一方面是天才，出了頭就會誤以為自己處處是天才。比如我今天去主持節目走紅了，明天就會以為自己唱歌也是天才，還覺得那個某某某唱歌根本就不如我。到處賣唱，別人又把我捧紅了，我就可以去打壓那些新手，讓他們沒有翻身的機會。心理學界也一樣，有些人搞後現代療法，出了名就會以為自己在所有的諮詢領域都是泰山。有人在認知心理學領域取得了輝煌的成就，就可以以蔑視的口氣說：“精神分析那都搞的什麼玩意兒！”能夠成為大師還保持謙虛和誠懇，虛心傾聽來自各方面的聲音，這樣的人比較罕見。</p>\n<p>其實，即使是這樣的大師，如果其永居權威之位，對心理學的發展也有很不利的影響。因為人對權威的信任和崇拜，是很難迴避的，意識裡可能提醒自己注意，但無意識的影響就很難注意到。舉個例子，某次專業課，是心理體驗課，相當於一次督導，給我們上課的是國內一個極厲害的大人物。臨時有事，又考慮到不是理論課，是帶體驗，他的弟子就能完成這個任務，所以讓弟子來給我們帶一次。結果上課的人出奇的少，少到四五個而已。大家都覺得，我們要上的是創始人的課，弟子來帶有什麼意思。其實很多人心裡清楚，這次帶體驗的課，創始人帶，跟他的弟子帶，沒有區別。因為督導小組上，成長靠個人，你有多少投入，就有多少收穫，沒有投入，專家指著名字點撥你，也絲毫不會有效果。只要你個人投入，隨便一個水平比自己稍高的人來帶，效果都一樣。那個創始人找來的弟子，水平顯然又比學生高了一檔。所以說，泰山不讓賢，不但弟子出不了頭，對再後來加入的新人，對他們的學習也是有不良影響的，因為隊伍擴大了，創始人不可能在像小團體時候一樣，每個人都手把手教，手把手訓練。</p>\n<p>針對這個問題，意象對話諮詢技術的創始人倒是新出了個招，就是他自己逐步退出第一線，儘量不去講課，不去指點，偶爾帶一下，指點指點他的弟子。然後讓新加入的學員，重新去跟他的弟子建立師徒關係。打消新學員的念頭，讓他們心裡清楚，不太可能直接跟創始人交流，只能跟著自己的師父，從頭學起。有虛心和誠懇的態度，去跟自己師父踏踏實實地學，而不想著一步登天，直接挑戰創始人，這對新學員的學習反而是有利的。</p>\n</div>"},{"title":"第四十一章　總結","content":"<div>\n<p>第四十一章　總結</p>\n<p>所有的子人格是圍繞令狐沖的，但針對令狐沖也要用同樣的方式分析，因為在意象裡，“令狐沖”也是他本人的一個子人格。每一個子人格身上，也有不同的人格側面，並不是就只有單一性格。所以我一章只探討一個話題，這個話題跟某個子人格的一個側面有關係，這樣可以把每個子人格分析的稍微深入一些。讀者根據自己的閱讀需要，如果要對某一個人物的心理作集中的瞭解，就不用按照章節的順序閱讀，可以挑選跟這個人物有關的章節，集中起來閱讀。</p>\n<p>令狐沖：令狐沖失戀；沒有固定的招；打不過也不跑；血液象徵；絕路；地牢裡；蒙冤主題；就是不入；陰影；兩次彈劍；</p>\n<p>盈盈：女孩的心思你別猜；</p>\n<p>田伯光：田伯光的好漢氣概；選擇風流；報應；嗅覺；</p>\n<p>儀琳：小尼姑，大淫賊；一家三口；</p>\n<p>任我行：天生的王者；死亡恐懼；幸好會死；</p>\n<p>東方不敗：繡花針；</p>\n<p>岳不群：君子多疑；心理戰；理智化；辟邪劍譜；岳不群攬權；</p>\n<p>楊蓮亭：小人專權；</p>\n<p>左冷禪：冒充；</p>\n<p>林平之：居安思危；受辱；失明；</p>\n<p>平一指：殺人名醫；</p>\n<p>桃谷六仙：強迫思維；</p>\n<p>莫大：人以群分；</p>\n<p>藍鳳凰：注血無效；</p>\n<p>梅莊四莊主：玩物；</p>\n<p>恆山掌門：恆山掌門之死；</p>\n<p>泰山派：窩裡鬥。</p>\n<p>也有一些章節是涉及多個人物的，比如“一家三口”、“辟邪劍譜”、“小人專權”。還有些章節可以當作介紹事物，現象的專題來閱讀，比如“血液象徵”、“繡花針”、“陰影”、“蒙冤主題”、“死亡恐懼”等。</p>\n<p>介紹每個人具體的性格側面時，主要按照健康與不健康的大方向作區分。整個人的成長過程，也是按照健康與不健康的標準判斷。有的人物是相對比較健康的，比如令狐沖、任盈盈、田伯光、莫大、藍鳳凰等，每個人或許有少許的不足，但也還相對比較好。岳不群、任我行、左冷禪、東方不敗、林平之都屬於心理比較病態的。</p>\n<p>正邪雙方力量的比拼，其實最終靠的並不是武藝，不是說誰的武功高強，誰就能奪得天下第一。令狐沖走的路子比較正，不被魔鬼迷惑，不被地位誘惑，所以他身上才具有正義的力量，他是不會被岳不群打敗的。即使岳不群僥倖獲勝，殺死令狐沖，令狐沖的正義之氣依然會給人健康的影響。從心理意義上說，正與邪的區分，並不像三歲孩子頭腦裡那麼簡單和明確，好人就是好人，壞人就是壞人。諸如任我行、左冷禪等人，可能有雄才大略，胸懷大志，但他們的遠大目標給人類帶來的是災難。岳不群之流，屬於“滿口仁義道德，滿肚子男盜女娼”的偽君子，心理學家撇開他表面的作風，會發現，他的心理病態程度，較之左冷禪，有過之而無不及。</p>\n</div>"},{"title":"後記","content":"<div>\n<p>後記</p>\n<p>感謝朱建軍老師，在連續三個月只有兩天空閒的情況下，還不斷給予精心的指導。他總是我書稿的第一讀者，直到所有的稿件結束以後，依然要被聯繫出版社之類的瑣事煩擾。</p>\n<p>感謝蔡晨瑞老師，意象對話叢書的寫作和出版，是他的主意。出版社與作者之間的所有溝通，都是他個人完成的。為了跟出版社協調修改，他是我書稿的第二位讀者。他廣博的心理測驗方法，使我有機會在不斷的嘗試中練習和總結。</p>\n<p>感謝燕程、吳勤、明華，每週末帶領督導小組做體驗，既是自我成長的關鍵，也是經驗總結的基礎。</p>\n<p>感謝02級所有的兄弟姐妹，分開才發現你們的支持和幫助太重要，相互之間的情感太過難得，聚餐的時候全場大哭，好感人，實在珍貴。</p>\n<p>感謝我的女朋友，親愛的歌歌，每天都在為我的事情操心……</p>\n</div>"}];
const isHeader = [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, true];
let currentIndex = 0;

function showChapter(index) {
  if (index < 0 || index >= chapters.length) return;
  currentIndex = index;
  var ch = chapters[index];

  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('chapter-content').innerHTML = ch.content;
  document.getElementById('chapter-progress').textContent =
    (index + 1) + ' / ' + chapters.length;
  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === chapters.length - 1);

  document.querySelectorAll('.chapter-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });

  var activeBtn = document.querySelector('.chapter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

function changeChapter(delta) { showChapter(currentIndex + delta); }

function initChapterList() {
  var nav = document.getElementById('chapter-list');
  chapters.forEach(function(ch, i) {
    var btn = document.createElement('button');
    btn.className = 'chapter-btn' + (isHeader[i] ? ' is-header' : '');
    btn.textContent = ch.title;
    btn.onclick = function() { showChapter(i); };
    nav.appendChild(btn);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); changeChapter(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); changeChapter(1);
  }
});

initChapterList();
showChapter(0);

</script>
</body>
</html>
