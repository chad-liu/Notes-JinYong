面對問題的可能。折磨我的是這個擔心，我不敢開放它。真正坦白了，向自己開放內心以後，也就不再是什麼大問題。即使沒有向姐姐坦白，只是我自己敢於面對了，那也是一個進步，以後就少了一重困擾，不用再處心積慮地隱藏。這就是真誠的反思能起到的效果。</p>\n<p>懺悔也是一樣，雖然不能徹底解決問題，但它是解決問題的開始。當真心懺悔的時候，把事情對自己說一遍，就已經解開了一大心結。因為不敢對自己提起的時候，我要耗費很多精力去隱藏，這是我給自己增加的負擔。但也不是隨意說說就能起到作用，說的時候必須帶感受，是有感而發，感受比說更重要，不能空口瞎說。還有很關鍵的一點就是態度要誠懇，要真心的。真誠特別重要，不能帶有目的性，不能說，為了以後減輕自己的負擔，我就懺悔一下，這樣是不可能有效的。不為什麼，我就是願意面對，願意對自己開放內心。</p>\n<p>不一定非要像懺悔那麼正式，生活當中定時這樣反思一下就會很有用。當然，正式一點會更好，因為那樣更容易靜下心來，要靜下心來，才能沉下去感受，浮在大腦裡思考是沒有用的。但若條件不允許的話，也可以不用那麼正式，只要有體會，感受真實就行。最簡單的做法，帶著感受，把那些引起消極情緒的事情，仔細地回想一遍，想得越細越好，細到最小最小的細節。回想的時候，不要去迴避那些不愉快的情緒，承認它，不愉快就讓它不愉快好了。令狐沖被困在牢底，有一個階段就是在胡思亂想。</p>\n<p>如此胡思亂想，不覺昏昏睡去，一覺醒來時，睜眼漆黑，也不知己是何時，尋思：“憑我自己，無論如何是不能脫困的。如果向大哥也不幸遭了暗算，又有誰來搭救？師父已傳書天下，將我逐出華山一派，正派中人自然不會來救。盈盈，盈盈……”一想到盈盈，精神一振，當即坐起，心想：她曾叫老頭子他們在江湖上揚言，務須將我殺死，那些旁門左道之士，自然也不會來救我的了。可是她自己呢？她如知我被禁於此，定會前來相救。左道中人聽她號令的人極多，她只需傳一句話出去，嘻嘻……忽然之間，忍不住笑了出來，心想：“這個姑娘臉皮子薄得要命，最怕旁人說她喜歡了我，就算她來救我，也必孤身前來，決不肯叫幫手。倘若有人知道她來救我，這人還多半性命難保。唉，姑娘家的心思，真好叫人難以捉摸。像小師妹……”一想到嶽靈珊，心頭驀地一痛，傷心絕望之意，又深了一層：“我為什麼只想有人來救我？這時候，說不定小師妹已和林師弟拜堂成親，我便脫困而出，做人又有什麼意味？還不如便在這黑牢中給囚禁一輩子，什麼都不知道的好。”想到在地牢中被囚，倒也頗有好處，登時便不怎麼焦息，竟然有些洋洋自得之意。但這自得其樂的心情挨不了多久，只覺飢渴難忍，想起昔日在酒樓中大碗飲灑、大塊吃肉的樂趣，總覺還是脫困出去要好得多，心想：“小師妹和林師弟成親卻又如何？反正我給人家欺侮得夠了。我內力全失，早是廢人一個，平大夫說我已話不了多久，小師妹就算願意嫁我，我也不能娶她，難道叫她終真為我守寡嗎？”但內心深處總覺得：倘若嶽靈珊真要相嫁，他固不會答允，可是嶽靈珊另行愛上了林平之，卻又令他痛心之極。最好……最好……最好怎樣了“最好小師妹仍然和以前一樣，最好是這一切事都沒發生，我仍和她在華山的瀑布中練劍，林師弟設到華山來，我和小師妹未遠這樣快快活活地過一輩子。唉，田伯光、桃谷六仙、儀琳師妹……”想到恆山派的小尼姑儀琳，臉上登時露出了溫柔的微笑，心想：“這個儀琳師妹，現今不知怎樣了？她如知道我給關在這裡，一定焦急得很。她師父收到了我師父的信後，當然不會准許她來救我。但她會求她的父親不戒和尚設法，說不定還會邀同桃谷六仙，一齊前來。唉，這七個人亂七八糟，說什麼也成不了事。只不過有人來救，總是勝於無人理睬。”想起桃谷六仙的纏七夾八，不由地嘻嘻一笑，當和他們共處之時，對這六兄弟不免有些輕視之意，這時卻恨不得他們也是在這牢房內做伴，那些莫名其妙的怪話，這時如能聽到，實是仙樂天音一般了，想一會，又復睡去。</p>\n<p>令狐沖也不是剛發現自己身陷牢底就去想這些，倘若那樣，倒未必有用。剛發現的時候，正常的反應都是焦躁、著急、惱火。令狐沖不但大罵梅莊四狗卑鄙無恥，連送來的飯菜都打翻了。經過一陣折騰，這才慢慢靜下來。假如沒有經歷前邊的折騰，心中焦躁，是很難沉下來回憶往事的。即使回憶起來，心也是浮著的，很容易被焦躁帶走，因為太焦躁的時候，焦躁佔據情緒主導，回憶往事的真實感受，很容易被焦躁遮掩、替代，或者被影響。當出去的希望逐漸破滅，不急於立即脫身時，心情反而會平靜一些，這才更容易找到真情實感。</p>\n<p>閉關可能能起到類似的作用，因為剛開始一定是不太習慣的。但是當適應了以後，它會比平常更容易讓心平靜下來，這時候再去靜修，效果會比平常更好。當然有的人天分好，生活中也能隨處靜下來，完全不在乎形式，那也犯不著非要閉門謝客。</p>\n<p>令狐沖並不是主動閉關，是被困，但只要能靜下來，一樣有效果。對於令狐沖這樣生性放蕩，不受羈絆的人，偶爾被關一下，倒未必是件壞事。牢底其實還是個不錯的環境，因為安靜，昏暗，不受干擾，有安全感。精神分析心理諮詢就要故意找一個空房子，打上昏暗的燈光，這樣的環境有利於進入人的潛意識深層。</p>\n<p>上一篇關於令狐沖的文章《絕路》，已經作了分析，令狐沖心結的解決，已經取得一定的進步。在被逼上絕路以前，他對自己的心結，更多采取的是迴避，偶爾想到，也就是一帶而過，不太願意去想那些讓人不愉快的事情。對於自己的內傷，令狐沖其實也蠻消極的，生死由命，大不了一死。逼上絕路之後，沒有辦法不面對，無論你高不高興，都已經被天下人，被自己的親人拋棄，這是既定的事實。內心極度悲痛，充分地痛苦，比之迴避是一個進步，但這還不是解決問題的開始，只是為解決問題提供了可能。沒有以後的進步，光是痛苦也沒有用。但是，痛苦比不痛苦要好，因為本來就該痛苦，正常人在這種時候都會痛苦，假如你不覺得有痛苦，一定有潛意識的迴避，除非你早已解脫，做了神仙。逼上絕路以後，我們說他的健康可能會有所好轉，至少不會再加重。這次牢底的反思又提供了一個機會，回想過去的人和事，在心中過一遍，這是他解決心理問題的開始。心理問題解決了，健康也會變好。在這樣的反思之後，緊跟著令狐沖就修習“吸星大法”，化去了體內異種真氣，這個奇妙的安排特別符合事實。僅僅化去六七成，顯然，這麼不徹底的處理當然不可能完全健康，能化去六七成已經相當不錯了。他心理問題更徹底的解決，還需要等待一個時機。</p>\n</div>"},{"title":"第二十章　死亡恐懼","content":"<div>\n<p>第二十章　死亡恐懼</p>\n<p>故事梗概</p>\n<p>令狐沖返回梅莊，想探個究竟，順便救出牢底的任前輩。正趕上魔教四大長老追究四莊主放走任我行之罪。任我行和向問天出現，原來向問天的紙團裡有鋼絲鋸，任我行用內力狂嘯，震暈眾人之際，鋸開手足鐐銬，換了令狐沖的衣服逃走了。</p>\n<p>任我行是魔教前任教主，東方不敗篡位，才把他囚禁，用四莊主看守。幸而得以脫身，重見天日。任我行逼長老鮑大楚服下三尸腦神丹，又逼王誠、桑三娘服下，秦偉邦不願意，但武功低微，技不如人，被硬生生塞進去。黑白子想服，任我行不願意將藥浪費在廢人身上，禿筆翁，丹青生服下，黃鐘公自殺。</p>\n<p>令狐沖想起一事，求請任我行重出江湖，不要跟華山派為難。任我行不願對人許承諾，以免今後行事礙手礙腳，但答應手下留情，前提是令狐沖與任我行義結金蘭，加入魔教。令狐沖婉言謝絕，任我行也不再提此事。想起東方不敗篡位之事，也是諸多疑團，明知自己會傳位於他，為何還要篡位？向問天明白其中原由，東方不敗怕日久生事，因為教主女兒已經漸漸長大懂事。任我行再次提起入教之事，大有威脅之意，令狐沖熱血上湧，滿口拒絕，不歡而散。怕華山派遭毒手，需早些告知，向著福建尋師父他們去了。</p>\n<p>心理分析</p>\n<p>死亡總是跟恐懼情緒聯繫在一起，對死亡的恐懼是人類共有的，最基本的反應。任何人也擺脫不了死亡，終究有一死。少數人能超越死亡，對死亡不再恐懼，超越了人類一大本能。但是顯然，這樣超脫的人極為罕見，多數人不怕死，不害怕死亡，那都是假的，內心裡特別害怕。有的人的確刀架在脖子上也不怕，那也不能說明他/她沒有對死亡的恐懼，有些情況下，這些人的確不感到害怕，其實是用冷漠和麻木來防禦對死亡的恐懼，表面上越是不怕，說明內心深處越是害怕，否則就用不著防禦了。</p>\n<p>心理分析發現一個奇怪的現象，殺人的人都是想自殺。正常人都有對死亡的恐懼，但一定的恐懼並不可怕，想自殺的人對死亡的恐懼遠遠超過正常人的水平，活著忍受對死亡的恐懼，其痛苦已經遠遠超過對死亡本身的恐懼，所以想通過自殺來獲得解脫。分析有自殺傾向的人的心理就會發現，他們絕對不是因為不害怕死亡，所以才自殺；恰恰相反，是因為對死亡過度的恐懼，難以忍受，所以才想要自殺。對他們而言，活著反而是巨大的痛苦。但是，想自殺就敢於自殺的人，是需要相當的勇氣的。這一點常規都能理解，不是隨便一個人都敢於自殺，自殺是一件非常可怕的事情。更何況想自殺的人對死亡的恐懼尤其強烈，所以多數人想自殺但是不敢。怎麼辦呢？選擇殺人。這聽起來特別荒誕可笑，自殺跟殺人怎麼能扯上關係呢？首先必須申明一點，筆者絕對沒有給罪犯找殺人的藉口的意思，如果有人非要曲解，那一定不是本人的意思。只是心理分析的經驗一再告訴我，事實如此，我們不得不面對，弄清事實的真相，才有可能找到解決的辦法。</p>\n<p>為什麼想自殺又不敢的人選擇殺人呢？因為它能起到很重要的緩解作用。通過殺別人，把對自己死的恐懼投到別人身上去，看到別人死，就可以緩解對自己死的恐懼。就像一個人害怕失敗，看到別人失敗自己就能獲得安慰一樣。有兩種不同的防禦方式，一種是嫉妒，一種是投射。這兩種方式有些細微的差別。我害怕失敗，看到別人成功我就不舒服，要把他/她拉下水，這是嫉妒；另外一種方式，看到別人失敗我就獲得安慰，這是投射，把自己害怕的失敗投到別人身上，起到讓別人替代自己失敗的作用，可以暫時緩解害怕。顯然，這是兩種非常不健康的防禦方式，但是在人身上普遍存在，所以我們沒有理由加以迴避。不敢自殺而選擇殺人的人，也是同樣的道理。自己想死，看到別人活，因為嫉妒而把別人拉下水，這是一種方式；另外一種方式，看著別人死，起到替代自己死的緩解作用。無論其中的哪一種，都非常可怕。</p>\n<p>明眼人不難看出，這兩種方式，都只能獲得表面上的緩解效果，並不能從根本上消除內心的恐懼，相反，它會加強。無論是出於嫉妒，還是投射，看別人死都只能從表面上獲得緩解，內心的恐懼一定會加強，畢竟看別人死不是一件讓人舒服的事情，看別人死一次，自己同時也再一次看到了死亡的恐懼，等於自己內心又經歷了一次死亡的恐懼，當然會變得更加恐懼。越恐懼越不可忍受，只能再求助於緩解，這意味著無辜的受害者又要遭殃。所以我們會看到，連環殺手會變得越來越可怕，像是殺人上癮，停不了手。剛開始還會膽怯，畢竟殺人是一件挺恐怖的事情，到後來，連殺人的猶豫都幾乎沒有了，麻木不仁，殺人不眨眼。因為只有麻痺自己，接連殺人才能緩解內心極度的恐懼。</p>\n<p>想自殺的人，殺人只是一個暫時的緩解手段，潛意識最終會作出安排，讓他自己去死。用子人格的理論來解釋這一過程更清晰。兩個子人格，殺人的時候，自己認同的是強者，是那個殺人的人。兩個子人格中，每一次殺人的時候，心理力量被加強最多的，是那個被殺的人。因為主人公最根本的情結就是對死亡的恐懼，最終目的是要自殺，主要的心結在那個被殺人的子人格身上。不斷加強，強到不可控制的時候，他的認同就會轉向那個被殺的子人格。這一過程是潛意識的，不是主人公自己能夠控制的。當認同於被殺的子人格時，他就會找個機會，被人殺死。可能是一個更強的強者，但多數是警察，繞了半天，有些人潛意識就是希望警察代替他實現自己的不敢的這一步而已。所以很多時候會發現，連環殺手最後被抓的時候特別輕鬆，比上幾次犯案的時候更容易留下線索。甚至有些時候，就是罪犯自己找上門來的。他不過是想找個人幫他死，因為自己不敢。</p>\n<p>一個人有這種對死亡過度的恐懼，他一定會以各種不同的方式，把這種恐懼傳染給別人，被傳染的人還會繼續傳染。上面講的是通過殺人，更多的時候不一定非要殺人，只要跟他生活在一起就會被影響。看魔教上下，從教主任我行開始就不大正常。“千秋萬載，一統江湖”，大凡喊這種口號的專制獨裁者，一定希望長生不老。這種傳統主要開始於秦始皇，特別希望找到長生不老藥。做心理分析的人比較熟悉這樣的常識，急於長生不老的人，一定是因為對死亡特別的恐懼，不是恐懼過度的話，也就不用非得要長生不老藥。這種獨裁者會把他對死亡的恐懼傳染給別人，權力越大，受影響的範圍越寬。生活在一個極端獨裁，而又掌握生殺大權的人身邊，當然會恐懼，更何況經常要見到人死。整個秦朝社會的顏色基調是黑色，黑色在心理分析中是常見的死亡象徵，同時還可能象徵仇恨，怨憤等。很有意思，魔教上下都是黑色，生活在任我行身邊也不比秦始皇身邊安全多少。整個魔教上下充滿了對死亡的恐懼，從上而下，教主把恐懼傳達給長老，也有直接傳達教眾，長老是肯定要傳達下面教眾的。受害者又會向外界傳播，因此不光是魔教內部上下充滿恐懼，外界提到魔教的時候也是神秘而恐懼。當然，傳達的具體途徑，很多時候是通過殘忍地殺人，筆者在這裡需要細述的是魔教內部一種特殊的工具，三尸腦神丹。先得對三尸腦神丹的特性做個詳細的瞭解。</p>\n<p>鮑大楚道：“服了教主的腦神丹後，便當死心塌地，永遠聽從教主驅使，否則丹中所藏屍蟲便由僵伏而活動，鑽而入腦，咬齧腦髓，痛楚固不必說，而且行事狂妄顛倒，比瘋狗尚且不如。”任我行道：“你說得甚是。你既知我這腦神丹的靈效，卻何以大膽吞服？”鮑大楚道：“屬下自今而後，永遠對教主忠貞不貳，這臉神丹便再厲害，也跟屬下並不相干。”任我行哈哈一笑，說道：“很好，很好。這裡的藥丸哪一個願服？”黃鐘公和禿筆翁、丹青生面面相覷，都是臉色大變。他們與秦偉邦等久在魔教，早就知道這“三尸腦神丹”中裡有屍蟲，平時並不發作，一無異狀，但若到了每年端午節的午時不服剋制屍蟲的藥物，原來的藥性一過，屍蟲脫伏而出。一經入腦，其人行動如妖如鬼，再也不可以常理測度，理性一失，連父母妻子也會咬來吃了。當世毒物，無逾於此。再者，不同藥主所煉丹藥，藥性各不相同，東方教主的解藥，解不了任我行所制丹藥之毒。眾人正驚惶躊躇間，黑白子忽然大聲道：“教主慈悲，屬下先服一枚。”說著掙扎著走到桌邊，伸手去取丹藥。任我行袍袖輕輕一拂，黑白子立足不定，仰天一跤摔了出去，砰的一聲，腦袋重重撞在牆上。任我行冷笑道：“你功力已失，廢人一個，設的糟了我的靈丹妙藥。”轉頭說道：“秦偉邦、王誠、桑三娘，你們不願服我這靈藥，是不是？”那中年婦人桑三娘躬身道：“屬下誓願自今而後，向教主效忠，永無二心。”那矮胖老者王誠道：“屬下謹供教主驅策。”兩人走到桌邊，各取一枚丸藥，吞入腹中。他二人對任我行向來十分忌憚，眼見他脫困復出，已然嚇得心膽俱裂，積威之下，再也不敢反抗。那秦偉邦卻是從中級頭目升上來的，任我行掌教之時，他在江西管轄數縣之地，還沒資格領教過這位前任教主的厲害手段，叫道：“少陪了！”雙足一點，向牆洞竄出。任我行哈哈一笑，也不起身阻攔。待他身子已縱出洞外，向問天左手輕揮，袖中倏地竄出一條黑色細長軟鞭，眾人眼前一花，只聽得秦偉邦“啊”的一聲叫，長鞭從牆洞中縮轉，已然捲住他左足，倒拖了回來。這長鞭鞭身極細，還沒一根小指頭粗，但奏偉邦給捲住了左足足踝，只有在地下翻滾的份幾，竟然無法起立。任我行道：“桑三娘，你取一枚腦神丹，將外皮小心剝去了。”桑三娘應道：“是！”從桌上拿了一枚丹藥，用指甲將外面一層紅色藥殼剝了下來，露出裡面灰色的一枚小圓球。任我行道：“喂他吃了。”桑三娘道：“是！”走到秦偉邦身前，叫道：“張口！”秦偉邦一轉身，呼的一掌，向桑三娘劈去。他本其武功雖較桑三娘略遜，但相去也不甚遠，可是足踝給長鞭捲住了，穴道受制，手上已無多大勁力。桑三娘左足踢他手腕，右足飛起，啪的一聲，踢中胸口，左足鴛鴦連環，跟著在他肩頭踢了一腳，接連三腳，踢中了三處穴道，左手捏住他臉頰，右手便將那枚脫殼藥丸塞入他口中，右手隨即在他喉頭一捏，咕的一聲響，秦偉邦已將藥丸吞入肚中。</p>\n<p>曾經看過西方的一部影片，片名記不大清楚了，裡面有一個多次出現的場面，一堆黑色的小蟲子，可能是甲殼蟲，迅速爬過，被追上的人瞬間吃得乾乾淨淨。蟲子還有一種獨特的能力，鑽入人體以後，能在體內迅速地從下往上爬，一直爬進大腦，吸噬腦髓，被傷到的人痛不欲生，其慘狀難以目睹，發瘋地用自己的腦袋撞牆壁，直到撞死。一旦爬到大腦，這個人也就沒救了。其他的影片也出現過類似的場景，一群黑色的蟲子排山倒海壓過來，瞬間把人吸食乾淨。這是一個標準的死亡象徵。在集體潛意識層面，人比較常見的就是用一群黑色的蟲子來象徵死亡，人對這種蟲子的恐懼，是對死亡的恐懼。一般人在看到這個場景的時候，都會極度恐懼，非常難受。這可能是影片成功的一個重要原因。不管是影片，還是一般的文學作品，一定是觸及深層潛意識的作品，才具有普遍性，更加吸引人。</p>\n<p>通過這樣的比較之後，非常明顯，三尸腦神丹在這裡也是個死亡象徵，人們對它的恐懼，是對死亡本能的恐懼。任我行逼迫別人服下三尸腦神丹，就是逼迫別人徹底放棄反抗。放棄就是一種死亡，死亡最根本的特點就是對生命力的放棄。放棄是死，不放棄也是死，只不過是生理意義上的死。任我行通過三尸腦神丹這種東西，向他的下屬傳達對死亡巨大的恐懼，這個恐懼還會危害更多人，因為它會繼續傳染，繼續傳達給更多的人。大腦是一個有理性的人存在的根本，催眠，或者一般的體驗，都會先象徵性地放鬆大腦，放棄理性，理性下降的情況下才有利於情感的體驗。三尸腦神丹要破壞一個生命。要讓人體驗到對死亡本能的恐懼，一定要破壞理性，最終吞噬大腦。</p>\n</div>"},{"title":"第二十一章　陰影","content":"<div>\n<p>第二十一章　陰影</p>\n<p>故事梗概</p>\n<p>令狐沖把將軍吳天德的軍服、皮靴、腰刀、包裹都換到自己身上，還把鬍子一根根膠到自己臉上，著實神氣。道上聽說有魔教大舉進攻，怕恆山派遭到伏擊，攔路擋道。不聽勸阻，前面的女弟子果然中了暗器。想要撤退，背後也中了埋伏。令狐沖腳步踉蹌，跌跌撞撞，穿梭於人群中，瞬間戳倒數人。定靜身處險境，擔心眾女弟子安危，飛鴿求救。</p>\n<p>恆山派中了敵人的調虎離山之計，數十女弟子被迷魂毒藥迷倒，令狐沖急奔客店，想先探個究竟。剛好碰到七名高手圍攻定靜，令狐沖抽身先救醒堂中儀琳等三個女子。轉身出外，去救定靜。連刀帶鞘當作長劍使用，手腕抖動，向各入手背上點去，但聽得嗆啷、嗆啷響聲不絕，長劍落了一地。定靜趕去救弟子，令狐沖留下喝酒。</p>\n<p>定靜離奇失蹤，剛才被迷倒在屋子裡的女弟子也全沒了人影。急速追蹤，發現定靜又被人圍攻，受了重傷，臨終託付令狐沖，把恆山一眾女弟子帶到福州無相庵中。一路護送，平安到達。令狐沖扯下滿腮虯髯，脫掉軍裝，換上店小二的打扮，從此不再做將軍。</p>\n<p>心理分析</p>\n<p>老天有時候似乎喜歡跟人開玩笑，令狐沖一堂堂正正的隱士，居然去過了一把做官的癮，玩得不亦樂乎。玩什麼不好，偏偏玩軍官遊戲？！也許只是巧合，也許只是令狐沖一時性氣，在心理學家看來這都不重要，重要的是他的確做了一回官。要扮演也不是隻有一種選擇，為什麼令狐沖偏偏最後選擇扮演了一回做官？從令狐沖的心理來分析，的確是非常符合的。我相信讀者朋友也一定會有類似的經歷，自己一直以來非常不願意做的一件事，而且是真心的不願意做，不是有意造作，後來一個偶然自己就做了。或許出於被逼，或許出於客觀，不得不做，但最終的結果是做了。好像是天意，命中註定如此。從心理分析的角度來看，的確是開了個玩笑，不過開玩笑的是自己，不是老天，不是神秘的自然力量。</p>\n<p>榮格理學，關於人格結構系統的討論，有兩個非常重要的概念：一個是人格面具，一個是陰影，它倆是很好的一對。很多人誤以為，陰影就非常可怕，充滿破壞性的力量，充滿毀滅衝動，一切陰影都是報復性的。其實根本沒有那麼可怕，人格結構的每一部分，都是自己的心理成分，是一種心理力量，沒有好壞善惡之分。認識它最重要，看用在什麼地方，用得恰當，它就是建設性的；有意迴避，消極面對，它就可能阻礙生命，成為破壞力量。</p>\n<p>人格面具是那些能被社會，被周圍人接受，因而由我們自己扮演的角色；相應的，那些不能被接受的觀念就會成為我們陰影的一部分。非常細微的觀念都可能成為陰影，因此陰影並不是我們想象中那麼可怕。</p>\n<p>有一個測驗陰影的小方法。想象兩把椅子，自己坐在其中一把椅子上，對面坐的是一個黑衣人。自己對黑衣人提出批評性的意見，比如說：“你是邪惡的，搗蛋的，不聽話的……”然後轉換角色，由自己坐對面的椅子上，對剛才的批評給出回應，先說：“我不是邪惡的，我不是搗蛋的，我不是不聽話的。”然後再說：“我是……的；我是……的；我是……的。”可以繼續這個過程，多次重複，最後那個說“我是……的”人，就是我們的陰影。舉個例子，最後那個人說：“我是不太善良的，我是有點調皮的，我是不聽老師話的。”這個說話的人，就是我自己的陰影。</p>\n<p>那些批評意見，可能來自父母，也可能來自周圍的人。為了接受這些批評，我們形成一個符合這些標準的樣子，就是自己生活中表現出來的樣子，這是所謂的人格面具。而那些原本是自己的，但是因為被批評而受到壓抑的樣子，就成為陰影。不太善良，有點調皮，不聽老師話，這未必就是壞孩子。太善良招人欺負，有點調皮是活潑的表現，不聽老師話，可以成為學生有自己獨特見解的基礎。但是，前提是我們要認識，要知道自己的這些特點，有效利用，有效發揮，才能起到好的作用。不去認識，永遠只知道自己的一個側面，只知道人格面具，不知道陰影，這個孩子會誤以為，只要是善良的，不搗蛋的，聽話的，就是好孩子。好孩子容易做到，也還蠻討人喜歡，但是多半沒出息。即使取得很大成功，這個孩子也不知道自己到底最終要的是什麼，成功了，但自己好像並不需要。而且，受到壓抑的部分處於潛伏狀態，隨時可能得到表現，而你自己不知道是怎麼回事。這種時候，陰影就可能表現為破壞力量。比如說，一個一直表現非常聽話的孩子，有一天突然反叛老師，做出驚人之舉，不可思議。而所反叛的東西在常人看來，也不是什麼不能解決的大問題。甚至僅僅是一個很不起眼的小碰撞，結果事情就鬧得很大。後果有多嚴重，要看對陰影的壓抑有多嚴重。平時有多聽話，此刻的異常表現就會有多可怕。壓抑越嚴重，陰影的表現欲就越強，破壞力也就越大，後果也就越糟糕。</p>\n<p>壓抑陰影部分，不是解決陰影問題的辦法。只有通過認識，不斷認識自己的陰影部分，把陰影和人格面具部分進行整合，才有利於我們心理健康。對陰影的壓抑不光來自父母的批評，還來自周圍人的影響，所以一定會受社會大環境的影響。有些問題不是個人的，不是家庭的，是社會的，是整個大環境的通病。</p>\n<p>一個問題成了通病，它會在無意中對我們造成影響。陰影部分受到壓抑，它的報復一直在左右著我們，而自己往往很難意識到。舉個小例子，筆者一向自以為對權力根本不感興趣，覺得天生就挺看不起那些熱衷權力的人，學了心理學之後，回頭一看，唸書才唸到本科，16年時間裡，我有超過10年的時間都在做班長！不喜歡權力，又怎麼老在做班長呢？這不就是潛意識權力象徵嗎？假如不能意識到，不能修改，這種模式會一直伴隨我，到死都是這樣，但我自己會不知道。</p>\n<p>有人可能覺得，現在做這樣的推斷還太早。我們通過心理分析發現，一個人的命運像註定的一樣，人生就是一個潛意識的劇本，不修改的話，基本的模式會不斷重複。這個劇本，其實在早年，甚至童年（7歲以後）就會有所體現。我的一個老師，前幾天到戒毒所給人做心理諮詢，碰到一個來訪者，進門就不斷抱怨，覺得別人不應該抓他/她（為了隱私，省去性別）。因為自己連續幾起大案，都只做策劃，沒有參與。並且最後分贓自己也沒有參與，全都讓別人分了。這人從小學就不做作業，喜歡出點子。後來瞭解到，一直喜歡讀書，直到現在，仍然喜歡三本書：《泯滅》、《策劃》、《刺殺》。這三個名詞排起來特別有意思，泯滅自己的良心，作策劃，刺殺。這一模式從小就已經開始，不斷重複。這就是劇本，不加以修改，這個劇本不會變，這個人在戒毒所裡依然擅長搞策劃，安排，派遣所裡的成員，自己不出力。但他/她顯然不知道自己的這個模式。</p>\n<p>回到令狐沖身上，我們會認為，這個“隱士”突然做了一次軍官，並不偶然。因為“隱士”一定意味著對做官的不接受。在江湖俠義之士看來，軍官一類的詞彙，常常跟“走狗”有著某種意義上的等同。但令狐沖最終還是做了一回，不過跟我們先前的預設不一樣，做官也不等於走狗，令狐沖做得還很讓人滿意。只是在做完之後，自己才感覺到某種程度的茫然。</p>\n<p>儀請道：“將軍，我們想眼前的第一件大事，是火化師伯的遺體。此後如何行止，還請示下。”令狐沖搖頭道：“和尚尼姑的事情，本將軍一竅不通，窯我吩咐示下，當真是瞎纏三官經了。本將軍升官發財，最是要緊，這就去也！”邁開六步，疾向北行。眾弟子大叫：“將軍，將軍！”令狐沖哪去理會？他轉過山坡後，便躲在一株樹上，直等了兩個多時辰，才見恆山一眾女弟子悲悲切切的上路。他遠遠跟在後面，暗中保護。令狐沖到了前面鎮甸投店，尋思：“我己跟魔教人眾及嵩山派那些傢伙動過手。泉州府參將吳天德這副大鬍子模樣，在江湖上不免已有了點兒小小名聲。他奶奶的，老子這將軍只好不做啦！”當下將店小二叫了進來，取出二兩銀子，買了他全身衣衫鞋帽，說道要改裝之後，辦案拿賊，囑咐他不得洩漏風聲，倘若叫江洋大盜跑了，回來捉他去抵數。次日行到僻靜處，換上了店小二的打扮，扯下滿腮虯髯，連同參將的衣衫皮靴、腰刀文件，一股腦幾地掘地埋了，想到從此不能再做“將軍”，一時竟有點茫然若失。</p>\n<p>不做將軍，又做什麼呢？令狐沖茫然的感受一定是內心非常真實的寫照。隱士？隱士真的就是自己想要的？真能代表內心真實的自己？恐怕也未必。令狐沖是嚮往自由的人，自由自在是他追求的目標。但真能自由嗎？從心理分析的角度看，一輩子追求自由的人，恰恰等於是最受自由限制的人，一輩子都被束縛在自由上了。只有明白了自己為什麼追求自由，明白了不接受束縛的原因，才可能自由。直到小說結尾，令狐沖這個人依然沒有自由，因為他又被束縛在盈盈的愛情上了。</p>\n</div>"},{"title":"第二十二章　蒙冤主題","content":"<div>\n<p>第二十二章　蒙冤主題</p>\n<p>故事梗概</p>\n<p>令狐沖去了福威鏢局，看到小師妹半夜闖入小林子房間，兩人相偎相倚，笑作一團，甚是甜蜜，令狐沖恨不得拔劍自刎。但聽師妹問起《辟邪劍譜》，林平之每天晚上在房裡亂翻，尋找劍譜。自己被人冤枉，跟劍譜關係重大，強忍心酸，聽個水落石出。</p>\n<p>兩個陌生人推門衝進房間，制住林平之和師妹，在屋頂找到了劍譜，越牆而出。令狐沖緊緊跟隨，兩人突施怪招，令狐沖被雙刀砍中。藉著一絲光亮施展辟邪劍譜的劍招，殺死兩人，奪回劍譜。失血過多，回到門口便即暈倒。醒來的時候躺在床上，師父師孃在身邊。《闢邢劍譜》再次失蹤。</p>\n<p>鍾鎮找上門來，原來剛才殺的兩人是嵩山派的。恆山眾女弟子也已趕到，前來拜訪岳不群夫婦。鍾鎮忌憚吸星大法，敗得狼狽，徑自走了。恆山掌門飛鴿傳書，遇難被困，弟子請求嶽掌門出手相救，岳不群推三阻四，見死不救。令狐沖不願袖手旁觀，一同前往救人。</p>\n<p>嶽靈珊騎馬疾馳而來，張口就問令狐沖要劍譜，令狐沖有口難辯，明明是自己搶回劍譜，醒來就不見了，不懷疑自己又能懷疑誰呢？更奇怪的，師妹一口咬定自己殺了勞德諾，殺了八師弟，還把兩人面孔剁得稀爛。又在背後砍了林平之一劍，還不知道能不能好。</p>\n<p>心理分析</p>\n<p>英雄也是榮格心理學一個重要的原型，英雄原型的特點是力大無窮、英勇無畏。光彩奪目，它總是能創造奇蹟般的成就。巨人原型也力大無比，但它跟英雄原型還有很大區別。巨人原型只強調力量大，英雄原型不僅有力量，還很有智慧。巨人是真正的四肢發達但頭腦簡單，英雄卻是有勇有謀，這才能創造光輝燦爛的成就。</p>\n<p>跟王者原型比較，英雄又先天缺乏優秀的領導才能，英雄只注重個人的成就。王者走到哪兒都是以團隊精神著稱，而英雄不管在哪兒出現，都是個人主義的。王者很合群，英雄永遠是孤獨的。如果用獅子比喻王者最恰當的話，那麼跟英雄最接近的動物，就是老虎。獅子和老虎都處於食物鏈的頂端，光彩照人，但老虎是安靜的，永遠都是孤獨的英雄。</p>\n<p>英雄還有一個根本的情結，就是蒙冤。這是王者和巨人都沒有的。英雄是一個主動尋求衝突解決的形象，在動作片或者武俠小說中，一般說來主人公都會具有英雄原型的特點，儘管大都不是那麼純粹的英雄原型。如把整部作品看作一個心理的矛盾衝突，主人公則承擔瞭解決衝突的責任，這一角色正是英雄的特點。</p>\n<p>筆者曾經碰到一個案例，來訪者男性，22歲，本科生。同學對他有一個比較一致的印象，就是他總喜歡做些驚天動地的事情。但他自己並不這麼認為，只覺得自己也是被逼無奈，迫不得已才走一些在別人看來不尋常的路徑。比如說，大家積極入學校社團的時候，他不參與，而是自己創辦社團，理由是：“參加別人的社團麻煩，還不如自己創辦一個。”</p>\n<p>有一次，老師跟本班學生髮生爭執，言語間不是很客氣，他挺身而出，列舉本門課程的一些缺點，言辭激烈，當場把老師羞辱了一番。老師因為此事抑鬱了好幾天，在同學的勸說下，他最終主動找老師道歉。期末本門成績亮了紅燈，他因此而失掉保研資格。心中不服氣，自己考，結果又考上研究生了。</p>\n<p>在回憶自已經歷的時候，他覺得有兩件事情印象深刻。一件是中考前兩個月，突然得了一場病，闌尾發炎，做手術。手術傷口又發炎，折騰了一個月，才趕回學校。回學校的時候母親特別不放心，但阻擋不住，就送他回了學校。強忍支撐，最後一個月考上了省重點中學。另外一件就是現在，考研的時候又病了，是腰椎間盤突出，疼的時候能哭，上不了床。校醫告訴他這個病沒有辦法治療，只有麻醉藥止疼，可以在止疼期間做一點腰部運動，臥床慢慢療養，少說三個月，可能生效。但能不能徹底恢復，很難說。他因此而求助心理諮詢治療。</p>\n<p>聽起來蠻有些傳奇色彩，後來做了一個月的意象諮詢。特別有意思，他的意象基本上是同一主題，而且意象裡剛好有一隻老虎，反覆出現。</p>\n<p>意象裡，一隻受了傷的老虎，半躺在地上，掙扎著硬是想站起身來，但是被一個鐵鉤子鉤住了，站不起來。鐵鉤是黑色的，掛臘肉用的那種鐵鉤，剛好鉤在老虎的腰上，準確說是鉤在老虎的腰椎骨上，來訪者自己感覺就是突出的那個位置。鐵鉤的另一端，被一個黑衣服的老頭牽著，用力往下拉，就是不讓老虎起來。老虎很惱火，想要硬拽，但就是吃不上勁。</p>\n<p>通過了解，這個意象的象徵意義非常明顯，老虎就是現在的自己，老頭是父親。來訪者的父親是一個非常權威，非常專制的人，在來訪者印象中，自己的父親甚至有些暴虐，像秦始皇一樣。這個意象代表跟父親之間的情結。</p>\n<p>由於此處不是為了專門介紹治療案例，所以其中的一些治療的詳細過程，暫時省去，不詳細介紹。四個月之後，來訪者的病基本好了。這是在諮詢師預料中的事，不但會得大病，而且自己能再把它治好，這是肯定的，否則就不是英雄了。</p>\n<p>腰椎的病一定會好，但最根本的情結暫時還沒有解決，所以只能基本算好。關於根本情結的解決，那是後話，提前讓來訪者知道了也不好。就關於腰椎的事情來說，來訪者一定會好，這是沒有問題的。就像上次的手術一樣，雖然久經摺騰，但最後還是會好一樣。看起來來訪者很冤枉，父親暴虐那是父親的事，跟他什麼相關呀，怎麼偏偏就要讓他受這樣的委屈呢？他自己也這麼覺得，父親的問題，居然把他給牽扯進去了，年紀輕輕得這種老年人的病！</p>\n<p>生活中他也挺蒙冤的，那次跟老師的口角，他沒有必要承擔全部責任。後來本門課程不及格，也是罕見的怪事。那是一門全校性質的必修課，本校學生好像還沒有過掛科記錄，恰好是從他們這一屆開始打破紀錄的。而且，就這屆的學生來說，能掛那門課程的人也少之又少，這樣的事情居然讓他這個準備保研的人碰上了。</p>\n<p>病會好，考研也會考上。就像上次帶病中考一樣，病一定會病得很厲害，考也最終能考上。要不是大病，不是帶病大考，並最終考上，又怎麼能突顯英雄本色呢！</p>\n<p>在令狐沖的故事裡，蒙冤的主題也一直伴隨在左右。只不過在本章跟小師妹的衝突裡，才把蒙冤主題推到頂峰。</p>\n<p>嶽靈珊哼了一聲，縱馬上前數步，說道：“拿來！”伸出了右手。令狐沖有氣沒力地道：“什麼？”嶽靈珊道：“到這時候還在裝腔作勢，能瞞得了我麼？”突然提高嗓子，叫道：“拿來！”令狐沖搖頭道：“我不明白。你要什麼？”嶽靈珊道：“要什麼？要林家的辟邪劍譜！”令狐沖大奇，道：“辟邪劍譜？你怎會向我要？”嶽靈珊冷笑道：“不問你要，卻問誰要？那件袈裟是誰從林家老宅中搶去的？”令狐沖道：“是嵩山派的兩個傢伙，一個叫什麼‘白頭仙翁’卜沉，一個叫‘禿鷹’沙天江。”嶽靈珊道：“這姓卜姓沙的兩個傢伙，是誰殺的？”令狐沖道：“是我。”嶽靈珊道：“那件袈裟，又是誰拿了？”令狐沖道：“是我。”嶽靈珊道：“那麼拿來！”令狐沖道：“我受傷暈倒，蒙師……師……蒙你母親所救。此後這件袈裟，便不在我身上。”嶽靈珊仰起頭來，打個哈哈，聲音中卻無半分笑意，說道：“依你說來，倒是我娘吞沒了？這等卑鄙無恥的話，虧你說得出口！”令狐沖道：“我絕沒說是你母親吞沒。老天在上，令狐沖心中，可沒半分對你母親不敬之意。我只是說……只是說……”嶽靈珊道：“什麼？”令狐沖道：“你母親兄到這件袈裟，得知是林家之物，自然交給了林師弟。”嶽靈珊冷冷地道：“我娘怎會來搜你其上之物？就算要交還林師弟，是你拼命奪來的物事，哼哼，你醒過來後，自己不會交還麼？怎會不讓你做這個人情？”令狐沖心道：“此言有理。難道這袈裟又給人偷去了？”心中一急，背上登時出了一身冷汗，說道：“既是如此，其中必有別情。”將衣衫抖了抖，說道：“我全身衣物，俱在此處，你如不信，儘可搜搜。”嶽靈珊又是一聲冷笑，說道：“你這人精靈古怪，拿了人家的物事，難道會藏在自己身上？再說，你手下這許多尼姑和尚、不三不四的女人，哪一個不會代你收藏？”嶽靈珊如此審犯人般對付令狐沖，恆山派群弟子早已俱都憤憤不平，待聽她如此說，登時有幾人齊聲叫了出來：“胡說霸道！”“什麼叫做不三不四的女人！”“這裡有什麼和尚了？”“你自己才不三不四！”嶽靈珊手持劍柄，六聲道：“你們是佛門弟子，糾纏著一個大男人，跟他日夜不離，那還不是不三不四？呸！好不要臉！”恆山群弟子大怒，刷刷刷之聲不絕，七八人都拔出了長劍。嶽靈珊一按劍上簧扣，刷的一聲，長劍出鞘，叫道：“你們要倚多為勝，殺人滅口，儘管上來！嶽姑娘怕了你們，也不是華山門下弟子了！”令狐沖左手一揮，止住恆山群弟子，嘆道：“你始終見疑，我也無法可想。勞德諾呢？你怎不去問問他？他既會偷《紫霞秘籍》，說不定這件袈裟也是給他偷去了？”</p>\n<p>嶽靈珊大聲道：“你要我去問勞德諾是不是？”令狐沖奇道：“正是！”嶽靈珊喝道：“好，那你上來取我性命便是！你精通林家的辟邪劍法，我本來就不是你的對手！”令狐沖來道：“我……我怎會傷你？”嶽靈珊道：“你要我去問勞德諾，你不殺了我，我怎能去陰世見著他？”令狐沖又驚又喜，說道：“勞德諾他……他給師……師……給你爹爹殺了？”他知勞德諾帶藝投師，華山門下除了自己之外，要數他武功最強，若非岳不群親自動手，旁入也除不了他。此人害死陸大有，自己恨之入骨，聽說已死，實是一件大喜事。嶽靈珊冷笑道：“大丈夫一人做事一身當，你殺了勞德諾，又為何不認？”令狐沖奇道：“你說是我殺的？倘若真是我殺的，卻何必不認？此人害死大師弟，早就死有餘辜，我恨不得親手殺了他。”嶽靈珊大聲道：“那你為什麼又害死八師弟？他可沒得罪你啊，你……你好狠心！”令狐沖更是大吃一驚，顫聲道：“八師弟跟我向來很好，我……我怎會殺他？”嶽靈珊道：“你……你自從跟魔教妖人勾結之後，行為反常，誰又知道你為什麼……為什麼要殺八師哥，你……你……”說到這裡，不禁垂下淚來。令狐沖踏上一步，說道：“小師妹，你可別胡亂猜想。八師弟他年紀輕輕，和人無冤無仇，別說是我，誰都不會忍心加害於他。”嶽靈珊柳眉突然上豎，厲聲道：“那你又為什麼忍心殺害小林子？”令狐沖大驚失色，道：“林師弟……他……他也死了？”嶽靈珊道：“現下是還沒死，你一劍沒砍死他，可是……可是誰也不知他……他……能不能好。”說到這裡，嗚咽起來。令狐沖舒了口氣，問趁：“他受傷很重，是嗎？他自然知道是誰砍他的。他怎麼說？”嶽靈珊道：“世上又有誰像你這般狡猾？你在他背後砍他，他……他背後又沒生眼睛。”</p>\n<p>林震南死的時候，把《辟邪劍譜》的秘密託付給他，自己也不明白林震南的話什麼意思，偏偏又學了“獨孤九劍”的奇妙劍法，還不能說出傳授劍法一事，別人沒有理由不懷疑他。好容易找到了，劍譜被人搶走，自己冒死才追了回來，結果暈倒，醒來之後劍譜又沒了。當時只有師父師孃在，總不至於懷疑師父他們吧？一直被冤枉偷了師父的《紫霞秘籍》，最終在勞德諾身上發現，這個罪名本該洗清，只是勞德諾和八師弟離奇死掉，兩人面孔都被剁得稀爛。自己既然跟魔教妖人來往，在別人看來，誰知道會不會因此而性情大變，變得不可理喻，沒有人性？最慘的是林平之被砍了一劍，小師妹被搶走，因生嫉妒而報復，很合情理。所有這些，令狐沖沒有一件事情能說清楚。被自己最心愛的人懷疑，這本身已經充滿諷刺意味。但是，這還恰恰就是英雄的一個根本情結，不蒙冤，不受苦受難，不遭受常人難以承受的恥辱，又怎麼能成就英雄呢？</p>\n</div>"},{"title":"第二十三章　冒充","content":"<div>\n<p>第二十三章　冒充</p>\n<p>故事梗概</p>\n<p>令狐沖帶領恆山女弟子，找到掌門受困之地，殺傷數十敵人，餘人毫無鬥志，逃得乾乾淨淨。令狐沖使出“獨孤九劍”，逼迫剩下三名高手施展本門劍法，原來是嵩山派的，無可抵賴。為了合併五嶽劍派，嵩山在冒充魔教，要將拒絕並派的恆山盡數殲滅。</p>\n<p>白蛟幫的兩位堂主密謀鑿船陷害恆山女尼，被令狐沖抓獲，得知田伯光正在聯絡江湖各派，上少林寺救任大小姐。和尚尼姑一家，擔心恆山上少林寺相助，這才密謀陷害。</p>\n<p>碰上莫大先生，才把事情的來龍去脈弄清楚。當日自己昏迷不醒，盈盈背自己上少林求方丈治傷。答應給令狐沖療傷，但是因為盈盈殺了少林弟子，要將她扣留。自己醒來就離開了，毫不知情。定閒、定逸感恩，先自上少林求情去了，託付令狐沖照應恆山眾女弟子。令狐沖恨不得插翅飛上少林，只是擔心眾女尼，怕遇上意外。莫大說，但去無妨。言下之意，是答應照料了。</p>\n<p>心理分析</p>\n<p>經常有研究歷史的人問這樣一個問題：人是不是先天具有追求權力的本性？因為稍微瞭解一點中國歷史的人都知道，這個問題實在太重要了。一部宮廷史，可以說就是一部爭權奪利的歷史。而宮廷裡的爭權奪利，它所波及的範圍絕對不僅僅限於宮廷，還會給整個國家帶來血腥的災難，後果極其恐怖。</p>\n<p>魔鬼是原型，原型是集體潛意識的，是全人類共有的，並不單獨屬於某一個人。你承認它，它存在；你不承認，它照樣存在。區別只在於，有的人容易被魔鬼控制，並且程度嚴重，表現明顯。而有的人不容易被魔鬼控制，偶爾有控制，也僅限於影響個人心理健康，不是那麼嚴重的話，不會因此而傷害到別人。承認它的人，才可能對它有所認識，也才能儘量避免它的影響帶來的危害；不承認的人，其實是最容易被它控制的。因為如果堅決不承認魔鬼，這件事情本身，多半就正在受魔鬼操縱，但既然你已經被控制，堅決不承認，當然也不可能知道自己被控制。魔鬼特別善於偽裝自己，無處不在。它能隨時跟你善的念頭結合，加以利用，導致你誤以為自己是善的，其實正在作惡。你還責怪身邊的人，覺得別人缺乏遠見、目光短淺，不能理解你遠大的目標。旁觀者清，明眼人卻一眼就能看出你在作惡。只有當你能從中跳出來，以旁觀者的眼光來看時，才大為驚訝，當真鬼迷心竅了，自己明顯錯了，怎麼就是不能醒悟呢！</p>\n<p>當我們把自己的看法強加給別人，用自己的觀點去幹涉別人，強行影響別人時，那就是權力。權力沒有天性，你願意利用，它就有；能時時刻刻醒悟，不亂加利用，那就不是權力。有人愛追求權力，但也有人不願意，並不是所有的人都熱衷於此。當你願意利用，而又剛好被魔鬼控制，加以利用，帶個高帽，比如說用別人的利益做外套，用大多數人的利益做外套，用全人類的利益做外套，那就會非常可怕，因為它會讓你不擇手段，還把不擇手段合法化，不惜犧牲自己，更可怕的是不惜犧牲別人。</p>\n<p>秦始皇統一天下，也可以以天下人利益作為標榜，但究竟真為天下人，還是為一己私利，為了建立千秋功業，滿足無限制膨脹的權力慾，那就很難說。統一一定意味著對反抗者尊嚴的傷害。而且在用心理學的眼光來看的時候，秦始皇對權力的追求明顯是病態的，這可能跟他幼年的成長經歷有很大關係。因為我們知道，秦始皇幼年曾寄人籬下，跟母親躲在趙國的一個將軍家裡做幫傭。躲躲藏藏，上街還總被小孩子用石頭砸，這樣的日子活得並不光彩。有朝一日揚眉吐氣，也可以讓別人嚐嚐寄人籬下，受人欺辱的滋味。當然他的地位越高，遭殃的人越多。高到皇帝，那就天下人遭殃。阿德勒的心理學裡有一個挺重要的理論，是自卑補償論。人會因為某方面的自卑而用一生的精力去追求補償，比如有的人先天口吃，他可能立志訓練，把自己訓練成為全世界一流的演說家。儘管如此，也未必就能感到滿足。這個理論用在秦始皇身上就挺符合。童年地位的低下，可能讓他不斷追求補償，幼年受人欺負，長大了欺負別人，至少不再被人欺負。</p>\n<p>我們軍訓的時候碰到一個教官，講他新兵時期經歷的辛酸。班長煙剛叼到嘴裡，你就趕緊把火點上，否則訓練的時候整死你。甚至用不著等到訓練，現場就踢上幾腳，你又能怎麼樣？煙抽完了，菸灰缸馬上遞過去，沒有的話就伸手接住，否則扔地上也是你清理。有一次班長為了訓練他的毅力、吃苦耐勞的精神，要求他清洗廁所不準用刷子，要用手。可恨的是，這位教官說到這兒，很自豪地稱，也總算熬出來了，現在自己做了班長，以後不用受氣，可以訓練別人了。</p>\n<p>沒有左冷禪童年的生活資料，不知道跟秦始皇有沒有類似。但就追求統一，為此不惜犧牲任何代價這一點，卻很有共通之處。</p>\n<p>定閒師太緩緩地道：“貴派意欲將五嶽劍派合二為一，併成一個五嶽派。貧尼以恆山派傳世數百年，不敢由貧尼手中而絕，拒卻了貴派的倡議。此事本來儘可從長計議，何以各位竟冒充魔教，痛下毒手，要將我恆山派盡數誅滅。如此行事，那不是太霸道了些嗎？”</p>\n<p>原來當晚嵩山派大舉來襲，各人也都蒙面，冒充是魔教的教眾。恆山派倉促受攻，當時大有覆沒之虞，幸好水月庵也是武林一脈，庵中藏得五柄龍泉寶劍，住持請曉師太在危急中將寶劍分交定閒、定逸等禦敵。龍泉寶劍削鐵如泥，既將敵人兵刃削斷了不少，又傷了不少敵人，這才且戰且退，逃到了這山谷之中。請曉師太卻因護友殉難。這山谷舊產精鐵，數百年前原是鑄鐵之所，後來精鐵採完，鑄劍爐搬往別處，只剩下幾座昔日煉焦的石窯。也幸得這幾座石窯，恆山派才支持多日，未遭大難。嵩山派久攻不下，堆積柴草，使起火攻毒計，倘若令狐沖等來遲半日，眾人勢難倖免了。定逸師太不耐煩去聽儀文述說往事，雙目瞪著令狐沖，突然說道：“你……你很好啊。你師父為什麼將你逐出門牆？說你和魔教勾結？”令狐沖道：“弟子交遊不慎，確是結識了幾個魔教中的人物。”定逸師太哼了一聲，道：“像嵩山派這樣的狼子野心，卻比魔教更加不如了。哼，正教中人，就一定比魔教好些嗎？”</p>\n<p>已經身為嵩山掌門，又是五嶽盟主，左冷禪並不感到滿足。追求權力的病態慾望是永遠不可能滿足的。</p>\n</div>"},{"title":"第二十四章　桓山掌門之死","content":"<div>\n<p>第二十四章　桓山掌門之死</p>\n<p>故事梗概</p>\n<p>令狐沖遇到老頭子，被告知，群雄決定十二月十五，同上少林寺去接聖姑盈盈出寺。這些日子來，卻為了誰做盟主之事，爭鬧不休，大傷和氣。令狐公子既到，盟主自然是他了。只有“桃谷六仙”不是很服氣。</p>\n<p>吶喊聲中，列隊進發。武當山下，三人擋道，一個挑菜的，另一個擔柴的，還有一個騎驢的老者，盡是劍法上罕見的高手。他們要跟令狐沖比試，前兩人容易對付，那老者的劍法卻是毫無破綻，令狐沖行險招破解，打了個平手。老者愛惜後輩人才，勸令狐沖回頭，令狐沖義無反顧。</p>\n<p>上了少林，發現整座少林寺空空如也，一個和尚也找不到，就是廚子雜工，也都不知去向。卻發現兩位老尼躺在地上，是定閒和定逸，定逸已經氣絕身亡，定閒還剩一口氣，死不瞑目，託付令狐沖接了恆山掌門之位，這才閉上眼睛。</p>\n<p>山下被敵人把守，不正面進攻，只放冷箭，群豪死傷慘重，兩次硬衝，都被逼了回來。偶然發現地道，從地道來到山下。告別眾人之後，令狐沖再回少林，猜想群豪離去之後，少林僧和正教中人都會回入少林，說不定他們把盈盈帶在身邊。</p>\n<p>心理分析</p>\n<p>有人說，每個人都會死，但又都對死一無所知，世界上沒有人能知道自己的生死。這句話說得非常誠懇，我相信也說出了很多人的心聲，多數人都會對死感到可怕，但又不可避免。想要知道，卻也不是那麼容易。但其實這句話也不是完全準確。因為只是大多數人不知道生死，有少數人，比較罕見的少數人，他們的確是知道的。在真正知道生死的人看來，知道生死其實也不是什麼特別了不起的事情，儘管一般人都會非常困難。有的人誤以為，某一天突然覺得自己看開了，不在乎生命了，那就是看透了。倒不是這樣，那些不在乎的，也有兩類，一類是真知道，所以就不是特別在乎了；另一類並不真正知道，他們所謂的不在乎，只是一種麻痺，那恰恰說明他太不知道了。</p>\n<p>這樣罕見的少數人，可以試著舉幾個例子。比如榮格，死之前就預言自己晚上會死，然後晚上時間一到，也就真的死掉了。死的時候也沒有什麼痛苦。比如孔子，由於孔子曾經說過“未知生，焉知死”這樣的話，有些人就誤以為孔子不知道。但據現在道德修為非常高，本身對生死有些瞭解的人推測，孔子其實知道，只是他不說而已。他不說可能還恰恰就是因為他知道。再比如莊子，老子，他們就是屬於不太在乎的那一類，但他們是真知道。像他們這樣真正大解脫的人，雖然不在乎，但也不會找死，不會故意尋死。要死了那就死，也沒什麼，生跟死在他們看來沒有很大區別。但不用死的時候，那就不會主動去死，活著也蠻好的。還有一些人，主要是佛教裡的高僧，但由於佛教高僧向來不太願意宣傳什麼學說，所以外界知道的比較少，不像對孔子，老子那麼熟悉。但其實，在佛教界，經常有高僧坐化，這在他們看來根本不是什麼稀罕的事情。預知自己生死，然後時間到就按時坐化了，這不是什麼了不起的本領，高僧對人心深層的體會遠遠超過這些。</p>\n<p>就大多數人而言，生死依然是個神秘的，似乎不可知的問題。聽過北大教授的一個健康講座，據說人的自然死亡年齡應該在120歲左右，就是說，正常人都應該活到這個年齡。事實剛好相反，正常人對這個年齡想都不敢想，像個天文數字。特別遺憾，很多人沒活過60歲就去世了。按照新的劃分辦法，這些人根本沒活過中年。死亡的原因非常多，但據說多數是病死，很多人四五十歲就一副病懨懨的樣子。老教授談到這個問題的時候，特別感嘆，但也多少有些感到自豪，他本人七八十歲了，精神矍鑠，健健康康，沒什麼病，聲音洪亮，底氣實足，見了他你真的不得不佩服。</p>\n<p>當然，他主要是從飲食保健的角度來談健康問題，但我在聽的時候特別有一種感覺，殊途同歸，角度不一樣，但對待健康問題的基本態度是非常有共識的，比如說，我們也同意現代人的健康問題特別突出，過早死亡，而且是病死，不是自然死，按理說應該多數人正常死，少數人病死，事實剛好相反。我們完全不反對從疾病、飲食保健等多角度看待健康問題，只不過我們心理學還有另外的一種視角，是從心理健康來看。心理不健康的人不大容易長壽，更談不上自然死。前面已經介紹過，心理的健康也會影響到生理的健康，這兩者不是完全獨立的。比如搞講座的那個老教授，我們一看就知道此人心理非常健康，所以他很長壽，很精神，身體很健康，那都不奇怪。</p>\n<p>我們提供的另外一種視角，就像心理健康會影響生理健康一樣，它也會影響到人的死亡。健康跟死亡之間，本來就直接聯繫。一個人突然得了大病，經過分析，我們能從中找出心理因素，找出潛意識的決定因素，看看潛意識是怎麼安排的。潛意識要生病，然後就在生理上反映出來，表現為生理疾病，這在我們看來一點都不稀奇。同樣的道理，程度再嚴重一些，就到死亡的地步了。有的人死了，分析潛意識可能發現，他/她還就是想死。死是有心理原因的，一個人不會平白無故就死去。</p>\n<p>以前看《三國演義》的時候，忍不住對諸葛亮的死耿耿於懷，覺得很傷感，也挺痛恨魏延，覺得他是罪魁禍首，不把燈弄熄，不就沒事了？現在再去看，就會覺得不是那麼回事，其實諸葛亮的死不可避免。網上有一個資料，是用調侃的語氣寫的，但很詳細，而且比較符合心理分析的特點，我先引述一下。</p>\n<p>諸葛亮經世之才，想出入投地，不甘做一個螺絲釘，好容易選擇了劉備，多年征戰卻沒有什麼效果，還在蜀國憋著，心懷大志，欲統一中國卻無獲，心情鬱悶。六出祁山作戰，均不獲而勞，報失了大量的人力、財力、物力，使蜀國力量大衰。諸葛亮培養人才不利，因此產生了“蜀中無大將，廖化作先鋒”的青黃不接的情況。在舊時的戰將當中你看，也並無多少出類拔萃人物。關羽自持狂傲、張飛蠻橫異常，常於酒後鞭打士卒，被士兵殺死那是必然之事。最可恨的是，張飛常逼人喝酒，我最煩被人逼著喝酒，由此可見，張飛其人並不怎麼樣。馬超英年早逝。黃忠並未見其利害之處，唯有一個趙雲可以評點。說白了，五虎上將之說就是劉備與諸葛亮的個人英雄主義。其勢必敗。而觀東吳與魏國，將軍不少，也很少能想起某個人來特別牛，但綁在一塊就是一個無往而不利的團隊，這是最可怕的。打仗不就是靠的團隊嗎？因此，蜀國先亡。</p>\n<p>即使活過來，也未必就能挽救局勢，其時手下好用的大將已經幾乎沒有了，可以說大勢已去，還真不如趁這個機會死去。在人生最不得意的時候大病一場，也是非常常見的潛意識原因，死不過是比大病更嚴重一些而已。諸葛亮在這個時候死去也就不奇怪了。</p>\n<p>同樣的事情也發生在恆山掌門人身上，定靜、定逸、定閒三位前輩師太先後相繼死去，現實層面的原因是受嵩山派迫害，但我們詳細瞭解一下恆山此刻的處境，就不難理解其心理原因。</p>\n<p>七人恍若不聞，仍圍著定靜師太，諸般兵刃往她身上招呼。令狐沖見定靜師六布袍上已有好幾攤鮮血，連臉上也濺了不少血，同時左手使劍，顯然右手受傷……定靜師太身子晃了幾下，再也支特不住，一跤坐倒。定靜師太臉上黴出一絲笑容，斷斷續續地道：“那……那我就放心了。我……我是不成的了，相煩足下將恆山派……這……這些弟子們，帶……帶……”她說到這裡，呼吸急促，隔了一陣，才道：“帶到福州無相庵中……安頓，我掌門師妹……日內……就會趕到。”</p>\n<p>這是定靜師太死時的細節，下面是定逸和定閒兩位師太：</p>\n<p>令狐沖探頭向房中看時，不由得大吃一驚，只見兩位老尼躺在地下，側面向外的正是定逸師太，眼見她臉無血色，雙目緊閉，似已氣絕身亡。他一個箭步搶了進去。祖千秋叫道：“盟主，小心！”跟著進內。令狐沖繞過躺在地下的定逸師太身子，去看另一人時，果然便是恆山掌門定閒師太。令狐沖俯身叫道：“師太，師太。”定閒師太緩緩張開眼來，初時神色呆滯，但隨即目光中閃過一絲喜色，嘴唇動了幾動，卻發不出聲音。令狐沖身子俯得更低，說道：“是晚輩令狐沖。”定閒師太嘴唇又動了幾下，發出幾下極低的聲音，令狐沖只聽到她說：</p>\n<p>“你……你……你……”眼見她傷勢十分沉重，一時不知如何才好。定閒師太運了口氣，說道：“你……你答允我……”令狐沖忙道：“是，是。師太但有所命，令狐沖縱然粉身碎骨，也當為師太辦到。”想到兩位師太為了自己，只怕要雙雙命喪少林寺中，不由得淚水直滾而下。定閒師太低聲說道：“你……你一定能答允……答允我？”令狐沖道：“一定能夠答允！”定閒師太眼中又閃過一道喜悅的光芒，說道：“你……你答允接掌……接掌恆山派門戶……”說了這幾個字，已是上氣不接下氣。令狐沖大吃一驚，說道：“晚輩是男子之身，不能作貴派掌門。不過師太放心，貴派不論有何艱鉅危難，晚輩自當盡力擔當。”定閒師太緩緩搖了搖頭，說道：“不，不是。我……我傳你令狐沖，為恆山派……恆山派掌門人，你若……你若不答應，我死……死不瞑目。”祖千秋等四人站在令狐沖身後，面面相覷，均覺定閒師太這遺命也太匪夷所思。令狐沖心神大亂，只覺這實在是件天六的難事，但眼見定閒師太命在頃刻，心頭熱血上通，說道：“好，晚輩答應師太便是。”定閒師太嘴角露出微笑，低聲道：“多……多謝！恆山派門下數百弟……弟子，今後都要累……累你令狐少俠了。”</p>\n<p>定靜身為掌門人的師姐，先被人圍攻，令狐沖解圍。隨後帶領女弟子，被人一路追殺，甚是狼狽，終於找到個避身的地方，敵人用火攻，若令狐沖救援遲到片刻，可能被敵人盡數殲滅。掌門被困，飛鴿求救，恆山全派沒有一個人能夠撐腰，求助於岳不群，這位“正人君子”又推三阻四，幸虧令狐沖出手相救，差點被人活活燒死。恆山全派，遭人蹂躪，危在旦夕，從掌門到屬下，沒有一個人能擔大頭。處境之尷尬，可以理解。定閒和定逸，也就是在這之後，緊跟著就死去。</p>\n<p>人在身處困境，或者重病，大難，臨死的時候，特別容易得到別人的同情。假如不是身處這種重大關頭，令狐沖也不可能隨便答應接任掌門，畢竟門下全是女弟子，一個大男人做掌門，這在恆山派歷史上都是沒有過的怪事。就上面的細節裡令狐沖的反應中也能明顯看出這一點。沒有人能撐腰，又找不到繼承人，大難當頭，這時候求助令狐沖是最有效的。</p>\n</div>"},{"title":"第二十五章　心理戰","content":"<div>\n<p>第二十五章　心理戰</p>\n<p>故事梗概</p>\n<p>令狐沖隱身少林，當今武林頂尖高手，盡皆到來。為避免任我行重出江湖，製造血雨腥風，方丈想把任我行三人留在少林，任我行覺得自己名字取錯了，是任我行，不是任你行！武當沖虛道長提議，雙方比武三場，對方勝了，任由下山，決不阻攔；倘若對方輸了，就在少林呆上十年。</p>\n<p>第一場，任我行對方證大師，方證慈悲為懷，任我行險招取勝。左冷禪乘機搶攻，打了個車輪戰，任我行驕傲自大，不願意向問天出手相助，硬生生接了下來，居然也不落敗勢。眼看左冷禪就要敗陣，又出險招，利用任我行的“吸星大法”，把自己的“寒冰真氣”輸入對方體內。任我行大驚之下，被左冷禪封了“天池穴”。一勝一負，第三場非常關鍵，令狐沖對戰沖虛道長。沖虛沉默良久，最後請四位下山，這一場不用比了。原來他就是武當山下騎驢的老者，已經跟令狐沖拆過三百餘招，沖虛道長仔細回憶，想不出破解令狐沖的招數，因此認輸。</p>\n<p>岳不群認為這第三場還沒比，因此不肯放人。自己主動出擊，挑戰令狐沖。令狐沖不傷師父顏面，只把師父的殺招一一化解，不敢以“獨孤九劍”相攻。這般死纏爛打，終是分不出勝負。岳不群利用令狐沖的心病，故意使出令狐沖當年跟小師妹一起練的劍法。令狐沖心有所動，但隨即想到盈盈，心神混亂，迷糊中隨手一劍，岳不群長劍落地。</p>\n<p>心理分析</p>\n<p>岳不群對付令狐沖的方法，利用的是心理戰。功夫再高，外表再堅強的人，內心都可能是脆弱的。所以要打敗一個人，最簡單，最有效的辦法，莫過於攻心，攻他心靈最脆弱的地方。沒有學過心理學的人，對此心向神往，不具備這個能力的，盼望學到；學到一點皮毛的，便亂加利用，隨處炫耀，以為自己掌握了獨門絕技，能把握和利用別人的心理。而真正從事心理諮詢的，對別人心理的把握更深，要利用也不是什麼難事，卻偏偏不屑於使用這樣歪門邪道的雕蟲小技。其中更為是的原因，利用別人，最終傷害的是自己，另外還在於，我們知道一個心理事實，你利用別人，別人其實是知道的。自作聰明的人，終將受到報應。</p>\n<p>我們都低估了人心的識別能力，以為高手騙人，對方就識別不出來。實際上人心的感受力比我們想象中要高明得多，雖然可能不知道別人是在騙自己，但對方內心的心理感受我們是知道的。在心理分析的實踐中發現，人JL\\其實的確很像一面鏡子。對方內心怎麼對我，就會像一面鏡子一樣，原原本本地照在我的內心，我跟他是心照不宣的。只是由於我們需要回避一些不願意面對的情緒，就養成了一些習慣的迴避方式，用另外一種情緒來代替遇到的真實情緒。所以有時候似乎感覺不到對方真實的情緒，感覺會出錯。這就像鏡子上面落了一小層灰，或者多了一點顏料，遮住真實的顏色了。但遮住並不是就沒有了，只是暫時不清晰而已，只要把灰塵抹了，真實的面目就展現出來了。我們的心也是一樣，那些習慣了的迴避方式，會讓我們暫時感覺不到對方的真實情緒。但僅僅是暫時的，真實的感受會一直保留在內心深處，等到某一天那個消極的迴避方式被排開了，真實的就會呈現出來。心理分析的時候經常發現這種現象，來訪者曾經受到傷害，當時用習慣的迴避方式，輕輕就滑過去了，等到用心理諮詢的方法，把他/她的迴避方式排開以後，真實的情緒就會原封不動地出現。</p>\n<p>用一個比較極端的例子可以清晰地看出這個過程。一位婦女本來心裡特別不喜歡鄰居家的女孩，但是在某次見面的時候，裝出極度熱情的樣子，問這問那，還伸手抱抱這個女孩，嘴上誇獎這個女孩多麼的討人喜歡，自己一看到女孩就說不出的高興，特別親切。這個女孩當時也沒有感覺到不舒服，很自然地就過去了。後來在諮詢中提起這件事，諮詢師幫她排開防禦，她再次面對的時候，馬上說：“那個女人真假，她雖然很親切，但我感覺非常不舒服。”這個時候，真實的感受就出來了。當一個人隱藏她的真實情緒，而偽裝得很熱情，很親切時，她不會讓我們因此而跟她親近，相反，她會讓我們感覺很難受，很不舒服。這個女孩在事情發生的時刻，不願意面對這種不愉快的感受，產生一個迴避，因此她當時自己也並沒有感覺難受，就那麼過去了。連她自己也沒有意識到，但她沒有意識到，並不意味著沒有。這是很常見的迴避方式，潛意識能把我們自己也騙過。但在內心深處，她其實是知道對方內心的。這種感受會保存在內心深處，經過挖掘，最後就可以找出來。有時候不用諮詢師幫忙，她自己回憶起這件事，當不再回避的時候，她自己也就會知道。</p>\n<p>假如只是這麼一次，也許就那麼過去了。這個女孩以後也沒再想起，就都那麼欺騙過去了，雖然女孩的內心深處知道。假如次數多了的話，這個女孩一定會表現出反感。</p>\n<p>經常碰到有的家庭，母親對孩子抱怨說：“為了你，我吃苦操勞。我為你做了那麼多，你為什麼就不能為我做一點！”看起來非常合理，我都能為你，你怎麼就不能為我？這正好是出問題的關鍵。如果你操勞就是為了孩子，你樂意，那麼孩子會因此而感激你。假如你操勞是帶有目的的，為了孩子將來對你好，那麼，你其實不是為了他，是在為你自己。儘管你可能並沒有表現出來，但孩子內心是知道的。這種情況下，你對他好，不會讓他感覺舒服，反倒會讓他很難受，因為他能感覺到，你把他當工具，你不是真心對他好。假如你真心對他好，那你付出那是你樂意。假如你是真心對他好，付出的同時也可以期望對方有回報，但當這樣的回報沒有得到的時候，你不能怪罪對方。就是說，你可以期望，但不能要求一定得到。如果一定要得到的話，那你一定不是真心對他好。對方其實寧可你對他不好，因為那樣更真實，坦白內心的話，對方至少還覺得你把他當人看，沒有把他當工具，所以他反而舒服些。</p>\n<p>這就是我們特別反對隨便使用心理戰的原因，千萬不要誤以為你的心理戰手段高明，隱藏好，對方不會知道。對方不知道，那只是暫時不知道而已。當然，有的時候別人當時就知道，嘴上不說而已。有的時候，對方的確不知道，那只是當時的意識裡不知道，內心深處，對方絕對知道。你隱藏深，對方暫時發現不了，但總有發現的機會。不管你怎麼隱藏，總會原原本本地照到對方心裡去。對方要是知道了，那還好，以後不再上你的當，或者頂多有意識地報復你一下。這真的不算恐怖，最恐怖的是無意識的報復。你一再欺騙，對方的確不知道，因為一直也沒有意識到，但內心又知道，那你就可能遭到無意識的報復。有意識的報復，再嚴重它也受人控制，無意識的報復，連對方自己都不知道怎麼回事，後果可以想見。最輕微的報復，像上面這位母親，孩子會逐漸疏遠她。孩子也不知道為什麼，但就是不願意親近自己的母親。嚴重一點的話，一輩子不理。一輩子被親生孩子疏遠，每個母親都能理解，這種感受一定很痛苦。這種報復還只是通過疏遠，假如採取的是一些更極端的方式呢？比如陌生人之間無意識的打擊報復？</p>\n<p>岳不群利用令狐沖心靈上的弱點，令狐沖在被師父誘惑的時候，有一個無意識的動作很能說明問題。</p>\n<p>岳不群又是一招“浪子回頭”，一招“蒼松迎客”，兩招連綿而至。劍招漸急，疾不可耐。令狐沖猛地裡省悟：“師父叫我浪子回頭，當然不是口說無憑，是要我立刻棄劍認輸，這才將我重新收入門下。我得返華山，再和小師妹成婚，人生又復何求？但盈盈、任教主、向大哥卻又如何？這場比試一輸，他們三人便得留在少室山上，說不定尚有殺身之禍。我貪圖一己歡樂，卻負人一至於斯，那還算是人麼？”言念及此，不由得背上出了一陣冷汗，眼中瞧出來也是模模糊糊，只見岳不群長劍一橫，在他自己口邊掠過，跟著劍鋒便推將過來，正是一招“弄玉吹籍”。令狐沖心中又是一動：“盈盈甘心為我而死，我竟可舍之不顧，天下負心薄倖之人，還有更比得上我令狐沖嗎？無論如何，我可不能負了盈盈對我的情義。”突然腦中一暈，只聽得錚的一聲響，一柄長劍落在地下。旁觀眾人“啊”的一聲，叫了出來。令狐沖身子晃了晃，睜開眼來，只見岳不群正向後躍開，滿臉怒容，右腕上鮮血涔涔而下，再看自己長劍時，劍尖上鮮血點點滴滴的掉將下來。他大吃一驚，才知適才心神混亂之際，隨手擋架攻來的劍招，不知如何，竟使出了“獨孤九劍”中的劍法，刺中了岳不群的右腕。他立即拋去長劍，跪倒在地，說道：“師父，弟子罪該萬死。”</p>\n<p>根據書中的描寫，令狐沖當時的反應，是因為想到盈盈，當然也有這種可能性，但當時想到什麼並不重要，它不影響令狐沖最終做出無意識的反應。在筆者引述的這段原文前面，還有大段的描寫，都是岳不群用心理戰，誘惑令狐沖回頭。非常精彩，岳不群恰恰找準了令狐沖心理上最脆弱的地方，但為了避免過多的引述，被筆者省去，讀者有興趣的話，不妨詳細閱讀。</p>\n<p>在意識層面，令狐沖也絕對不敢做出這種大不敬的反應。他跪地認罪的舉動也說明，其實自己特別不願意這麼做，只是在心神混亂之際，順手使出來了。這個心理反應特別重要，它就是精神分析向來特別注重的潛意識動作。不受意識控制，無意中做出的反應，往往更能反應內心，因為它更真實，不用因為對師父的敬重而受到壓抑。</p>\n<p>岳不群這一套劍法，勾起了令狐沖諸多回憶，刺中他的傷疤，是令狐沖的一大心結。令狐沖這時候特別容易心情煩躁，僅僅為了取勝的話，不失為一個好辦法。假如岳不群是真心實意地想勸令狐沖回頭，令狐沖內心也會非常感動，別說是棄劍認輸，就是讓他去死，令狐沖都可能心甘情願。有時候被人接受是很難得的，難以想象它會產生多麼強的心理動力。但從後邊我們對故事的瞭解，可以知道，此刻岳不群勸令狐沖回頭，並不是真心的，他只是想利用令狐沖。所以這一劍，令狐沖也沒有冤枉他，岳不群罪有應得。</p>\n</div>"},{"title":"第二十六章　就是不入","content":"<div>\n<p>第二十六章　就是不入</p>\n<p>故事梗概</p>\n<p>令狐沖刺了師父一劍，被一腳踢暈，醒來已在山洞裡，身邊是盈盈，火光耀眼。想起跟盈盈山澗烤青蛙，當真快活。談笑有加，情意纏綿。洞外傳來喘氣聲，原是任我行寒氣發作，向問天正在助教主驅散寒氣。兩人加入，雪花落在身上，絲毫不化，瞬間成為雪人。兩騎馬馳近，是師父師孃。師孃顯然正在生氣，師父在做解釋，言語間有接受左冷禪並派的意思。師孃堅決反對，雖是女流，豪氣尤勝鬚眉。師父卻說他是為華山全派的利益著想。</p>\n<p>師父師孃離開，林平之和小師妹找來。魔教徒十餘人出現，圍困兩人。嶽靈珊被人抓住，想要脫光她的衣服。令狐沖出手相救，迅速把敵人斬殺幹部。令狐沖發現自己左臂不能用力，任我行教他暢通經脈，緊接著重提入教之事，令狐沖再次拒絕，雙方就此別過。</p>\n<p>心理分析</p>\n<p>前文介紹魔鬼的特點時強調，對付魔鬼，首先最重要的一點，要學會識別，瞭解它的特點。能夠識別，才可能不被欺騙，不上圈套，不至於被魔鬼控制自己還不知道。識別清楚以後，要加以拒絕。拒絕的時候，態度一定要明確。一旦有猶豫，很容易再度上當。也不需要什麼理由，拒絕就是拒絕，沒有理由。假如你列舉理由的話，多半要被說服，因為它勸說的技巧是非常高明的，你很容易被它說服，誘惑。當你態度明確地拒絕時，它倒的確拿你沒辦法。</p>\n<p>很多人都做過類似的夢，夢裡黑衣人來抓自己。面孔看不大清楚，但能感覺有些可怕。它會對你說：“我來帶你走。你必須跟我走。”有時候還會更明確地嚇唬：“帶你去個地方，去了就不讓你回來。”有些人因為害怕，這種時候猶豫不決。顯然不太敢去，但又不敢拒絕，而且還有那麼一點點好奇，不知道自己到底是去，還是不去。讀者朋友要是遇到過這種情況的話，可以告訴自己，下次再做這個夢的話，我不會跟它去。多告訴幾遍的話，下次遇到，夢中你會覺得自己有一點意識，似乎知道自己正在做夢。它讓你去，你就可以明確地拒絕：“我就是不去。”它可能會繼續誘惑，或者嚇唬你，不去就怎麼怎麼樣。不用管它，繼續告訴它：“我就是不去。”也無非嚇唬一下而已，它能把你怎麼著？大不了把你殺了，那也只是個夢而已，夢中殺死，又不是真的死。這個黑衣人多半就是魔鬼的化身，跟它去了，它就一定會有下一步的安排，進一步控制你。比如說讓你去死，告訴你，你必須死。你會莫名其妙地願意聽它的話。有時候沒那麼嚴重，但它一定會進一步讓你受它的控制，這是魔鬼的特點，它決不會滿足於僅僅帶你去走一遭。走到要去的地方，又會繼續讓你幹別的，總之不去的好。有一種人可以去，就是能時時刻刻識別魔鬼的人，敢去，而且能保證每個時刻都能識別，能去看而又絕對不會被迷惑。這種人極其罕見，所以不提倡使用。</p>\n<p>被控制會怎麼樣？這可能才是讀者朋友最關心的問題。第一，被控制意味著你這部分的生命力受限制。比如說你夢中被帶走的是個愛好學習的人，那你以後愛好學習的這部分動力可能逐漸喪失。第二，帶走以後，繼續接受下一步的條件，可能作出原本不必要的犧牲。比如帶你到一具死屍旁邊，告訴你，你可以救活他，但你必須死。我可以救活他，但誰說我必須死！第三，被控制的這部分力量，可能被它加以利用。總之走的不是正道。</p>\n<p>更多的時候，魔鬼的誘惑也不一定是通過這種夢的形式。我的一個老師，曾經碰到一位來訪者，據說是個很有錢的老闆。進門之後說，聽說你是個大名鼎鼎的醫生，所以專門找的你。我給你兩萬塊，也不需要你做什麼，我有錢。別人出兩百，我出兩萬沒有問題。假如是缺經驗的諮詢師，這種時候很容易上當，誤以為對方在誇自己。說得也很合理，人家有錢，有的是錢，多出一點也無所謂。自我感覺比較良好的諮詢師，收下兩萬塊的話，這個諮詢師就基本可以宣告完蛋了。來訪者第一個要處理的問題是，為什麼他非要跟人不一樣？別人出兩百，他非要出兩萬？魔鬼正在誘惑諮詢師，按照我的方式進行，我給你兩萬。諮詢師接受的話，就等於諮詢的第一步上了套，是來訪者設的一個套。諮詢不是按照諮詢師的方式進行，是按照來訪者的方式進行。那麼緊跟著下一步，來訪者一定還有越來越多的方式，是無意識的方式，繼續誘惑諮詢師，讓諮詢師按照自己的方式去做。而且看起來都非常合理。諮詢師被來訪者帶著四處跑，那諮詢當然要失敗。告訴對方：“你有錢，你有你的，我不管。我只收兩百，所有人都一樣。你也不特殊。”拒絕了兩萬塊，那等於，諮詢沒有被來訪者牽著走。從第一步開始，就是按照諮詢師的方式去做。</p>\n<p>諮詢中的這個例子，跟現實生活中的貪汙受賄特別像。甚至可以說，這就是一次不成功的賄賂。那些最後被發現貪汙，甚至被抓起來的人，多半會抱怨，自己也不是有意的。也不是開脫，的確有很多人不是有意的。首先申明，筆者絕沒有為貪汙犯洗罪的意思，相反，我們一樣認為，貪了就是應該懲處，而且特別應該。筆者這裡只是要說清楚，貪汙受賄心理的這一過程。真正從一開始就特別想貪，大膽地貪汙，這樣的人是非常少的。很多人的確是無意中走上這條路的，而且第一次往往帶有試探性，很少有人第一次就特別大膽。沒有哪個送禮的，會直截了當地就說這是受賄。要這麼說，那就不是魔鬼的本色。送禮一定是很有花招的，看起來很合理的，否則對方就不容易上當了。</p>\n<p>有的給老婆送錢，有的往煙盒裡塞錢，這在現在都已經老土了，過時了。花樣翻新，不斷地出新招，出你意想不到的新招，這是魔鬼的特點。很多人剛被送禮的時候，自己甚至都不知道。事後知道了，又猶豫不決，這是出問題的關鍵。假如你態度堅決，就是不收，首先申明，這就是基本原則，沒有可以商談的，魔鬼會拿你沒辦法。猶豫不決多半就完了，魔鬼最善於利用這種半推半就的心理。千萬不要抱僥倖的心理，有了一次，一定會有下一次。這次接受了，那等於下次你就更容易被騙。魔鬼的特點是，你進，它就退；你退，它就進。沒有說這次示弱，下次它就不欺負你的，這樣的魔鬼不存在。假如第一次非常不幸，收下了，那麼以後怎麼辦？越早放下越好，早一次拒絕，就多添一分抵抗的能力。越是再次示弱，你就越容易完蛋。有的人抱怨：不是我不想放，是的確放不下啊。“人在江湖，身不由己。”說這話的人，就是死得最快的人。因為你已經幾乎被魔鬼控制了。態度不堅定，說明你自己其實還不想真正放下，這最容易被魔鬼利用。只要你想放下，任何時候都可以。沒有不可以的，也沒有來不及的。只有那些每天都在後悔，又從來不採取果斷措施的人，才是不可救藥的。只要不能痛下決心，只要有一絲絲猶豫，馬上就會被利用了。（簡單解釋一句，上面有把魔鬼和送禮的人完全等同的地方，可以這麼說是因為，魔鬼雖然是我們自己內心的，但當自己沒有能力識別和拒絕魔鬼時，那相應的事實就會在現實中表現出來，這並不奇怪。但我們首先要處理的還是自己的內心。自己處理好了，就一定不會為外界的誘惑所動，不管它有多麼大的誘惑力。拒絕外界的誘惑，其實也等於在跟自己的內心鬥爭。）</p>\n<p>拒絕誘惑，態度堅定，令狐沖在這方面做出的努力特別值得表揚：</p>\n<p>盈盈道：“爹爹，他的手臂怎麼了？”任我行笑道：“你別心息！乖女婿給爹爹驅除寒毒，秦山老兒自當設法治好他手臂。”將他招往一旁，將如何運氣、如何通脈的法門說了，待聽他複述一遍，記憶無誤，又道：“你助我驅除寒毒，我教你通暢經脈，咱倆仍是兩不虧欠。要令左臂經脈復原，須得七日時光，可不能躁進。”令狐沖應道：“是。”任我行招招手，叫向問天和盈盈過來，說道：“衝幾，那日在孤山梅莊，我邀你入我日月神教，當時你一口拒卻。今日情勢已大不相同，老失舊事重提，這一次，你再不會推三阻四了罷？”令狐沖躊躇未答，任我行又道：“你習了我的吸星大法之後，他日後患無窮，體內異種真氣發作之時，當真是求生不能，求死不得。老夫說過的話，決無反悔，你若不入本教，縱然盈盈嫁你，我也不能傳你化解之道。就算我女兒怪我一世，我也是這一句話。我們眼前大事，是去向東方不敗算賬，你是不是隨我們同去？”令狐沖道：“教主莫怪，晚輩決計不入日月神教。”這兩句話朗朗說來，斬釘截鐵，絕無轉圜餘地。</p>\n<p>任我行這個人的誘惑其實更難識別，因為他本身是個心胸很寬廣的人，表現出來很開闊，很豁達，決不是嫉恨小事的庸俗之輩。你會感覺，他勸你人，也就是說一下而已，也沒太把你看在眼裡，決計不入，他也不會因此而跟你為難。因為他本人還不願意做這種低三下四求人的事呢。他是個政治性非常強的人，想用你，但也不屑於跟你折騰。所以他會反覆地提起，讓你人教，但似乎對此並不十分在意。不入算了，但我也要跟你劃清界限，說過的話不能不算。不人的話，消除“吸星大法”後患的方法絕對不教你，就是做了女婿，也一樣不教。這種做法，反而更容易打動人。因為你低三下四地求對方的話，對方反而很容易識別你的圖謀，會對你持看不起的態度。雙方都很要強，會有一種感召力，對方某種程度上會挺佩服你。似乎入不入教也就是為他自己考慮而已。幸好令狐沖偏偏是個將生死置之度外的人，不受人脅迫，所以他會做得特別好。不入、就是不入，沒有商量的餘地。</p>\n</div>"},{"title":"第二十七章　報應","content":"<div>\n<p>第二十七章　報應</p>\n<p>故事梗概</p>\n<p>令狐沖上恆山接任掌門，希望越少人參加越好。打發弟子下山傳訊，居喪期內，不行掌門人就任大典。令狐沖看了恆山弟子演練劍法，想起當日在山洞裡也學得幾招，便即教給諸位。不戒和尚來訪，還帶了田伯光，田伯光已被不戒逼迫做了和尚，還把下面割了半截，為的是加入恆山派之後，沒辦法胡來。大群人喧譁，祖千秋等各路英雄也都到了。東方不敗遣人送了重禮，前來道賀。</p>\n<p>嵩山派故伎重演，拿了盟主的令旗，列舉諸多理由，阻撓令狐沖接任掌門。任盈盈，藍鳳凰等人先後趕到，盈盈使用障眼法，搶走嵩山令旗，樂厚中了藍鳳凰劇毒，被逼向令狐沖求情。方證，沖虛親自前來，有事相商。</p>\n<p>心理分析</p>\n<p>民間一般都對報應說頗為熟悉，但基本上都已經被庸俗化了。很多人認為，今天扶老太太過馬路，明天走路就可能踩到100塊錢，這就是善報；今天揀了100塊錢，沒有交給警察叔叔，明天可能丟手機，這就是惡報。但是也出現了一些他們解釋不了的怪現象，比如說有的人蠻橫不講理，自私自利，心狠手辣，卻總活得好好的；而有的人特別善良，天天做好事，結果不到50歲便與世長辭了。於是就有了新的解釋方法，說不是不報，時候未到；時候一到，立即就報。</p>\n<p>在網上看到一個帖子，列舉了一些善惡報應的事實：</p>\n<p>如有一個人，她在特別困難時，本人無飯吃，無房住，孩子無錢上學，丈夫的飯碗也丟了，在這種情況下，有一個老人出來幫助她安排工作，並且借房給她家住，有了飯吃，有房住，孩子上了學，她不但不感謝老人的救命之恩，反而黑了良心，貪汙老人的錢，結果蒼天有眼，讓她跌斷手，看你還貪不貪！又有一人，多年來，他有困難，其朋友總是無私幫助他，但他總覺得一年給一兩萬元太少，心有貪念，起了黑心，有一天他一手拿著其朋友給的錢，一手就要害其朋友，相害未成，又對朋友進行敲詐錢財。當朋友看出他良心壞，就警告說：“你這樣做，定遭惡報。”結果不僅家中兇災未平，第二天本人突然腿斷痛得要命，後又突生奇病。還有一人，他找到一個如花似玉的對象，對象遺憾地說：“你什麼都好，就是多了一個80多歲的老母親。”他聽後，回家就磨了一把鋒利的刀，並寫了一張紙條：“母親，不是兒子不孝，你老人家80多歲了，該上天享福了。”然後把刀和紙條藏起來。奇怪的是那是四月天氣，這一天萬里無雲，下午5點左右，突然烏雲蓋頂下起傾盆大雨，接著就是雷鳴閃電，一個炸雷把這個企圖殺害老母的不孝之子打得七竅流血而喪命。其老母痛失其子後，收其遺物，發現枕下面有利刀和紙條，才知其子遭雷打是報應。因此，忘恩負義之人，極易遭兇速報。上面講的做了壞事，遭兇速報的事例。現在講做了好事得福速報的事例。某市有一個叫張秀花的老太太，早年喪夫，後兒女相繼都去世了，孤身一人，怕今後生活無著落，就想自殺了事，免得活著受罪。後經左右鄰居勸說才未輕生。她為自己在老年不痛苦，就燒香拜佛，天天口唸《三世因果經》，經常做好事，做善事。1975年春，她在外面散步，看到路上一個不省人事的中年婦女昏倒了，就叫了一輛架子車將人送到醫院搶救。病人脫險後，醫生告知病人：“你的命是老大娘救的，這兩天她一直守護在你的跟前。”病人聽後感動得抱著張大娘大哭，感謝她的救命之恩。後來病人出院時，張大娘把自己僅有的一點積蓄為病人付了醫藥費，不留姓名就走了。（《因果報應的形式》）</p>\n<p>上邊這些例子特別說明問題，因為全都不符合因果報應。跌斷手可能的確是報應，但跟黑良心貪汙老人的錢沒有關係；突然腿斷，突生奇病，這樣的事實本身有些讓人懷疑，即使是真的，那也不是由於貪念，不是由於敲詐；雷鳴閃電，有時候會擊打惡人，但也經常擊打那些樸實善良的農民。雷鳴閃電很少預知人的惡念，及時加以阻止。後面舉的這個善報的例子，也不是很妥。張老太太也能福報的話，梁武帝應該已經成佛了，事實上並沒有，佛教的高僧也說他沒有福德，頂多算得上一點功德而已。</p>\n<p>不過我倒能從上面的例子看出一些相反的報應。第一個例子裡面，老人不斷地幫助那個女人，安排工作，給她房住，讓孩子上學，結果那個女的反過來貪汙老人的錢，這是老人的報應。第二個例子，朋友不斷地資助他錢，他反過來敲詐陷害，朋友遭了報應。最後一個例子，此人經常做好事，但是曾經試圖自殺，說明心理問題已經很嚴重，以後的經歷裡面我找不到解決心理問題的證據，倒是可以推測，她的心理問題在加重，至少是不可能變好的。</p>\n<p>似乎該得的報應沒得到，不該得的倒是得到了。生活中見到的例子也多半如此，為什麼會這樣？原因何在？</p>\n<p>報應特別講究真心，如果不是出於真心的話，做再多的善事也沒用。真心說來容易，實際上非常困難，一般人都認為自己行善是出於真心的，並不圖什麼回報。其實大部分都只是表面如此，細分下來就會發現，基本都不是真心。真心就是樂意，我樂意如此，沒有別的。很多人行善，表面上是樂意，為了別人好，其實是出於某種期望，比如說期望自己通過行善來積累福報。這樣行善的話，雖然做的都是好事，但最後多半會有惡報。因為你在做善事的同時，給別人帶來的是傷害。上面的第一個例子，老人幫助那個女人，假如不是出於真心的話，他不會讓女人心裡感覺舒服。沒有詳細的資料證實老人為了什麼，這樣的目的非常多，比如說，可能通過幫助別人能證明自己有愛心，能給人關照；可能希望這個女人將來給自己養老；可能通過幫助比自己困難的人能找到某種優越感，覺得自己活的比較踏實，可以施捨生活不如自己的人。不管是什麼，總之只要有某種目的，那個女人就不會因為受到幫助而感動，反而會覺得很難受，覺得別人幫助自己，不是真心對我好，只是把我當難民施捨。這種時候，老人的行善，其實就是在作惡。因此後來得到報應，被這個女人黑了良心貪汙，也是應該的。從後來女人的反應來看，前邊的猜測，老人幫助別人的心理，最後一種可能性比較大。因為女人貪汙，潛意識的反應等於說，你不是喜歡施捨嗎？那我就儘量讓你施捨好了，一次讓你施個夠！</p>\n<p>第二個例子也是同樣的道理。最後一個例子，張老太太天天做好事，其實是為了緩解恐懼。她覺得活著挺受罪，所以希望通過做點好事，來獲得內心的安慰。她喪夫，兒女相繼去世，自己孤身一人，曾經想過自殺，心理問題已經很嚴重。通過做好事來緩解，但這不可能真正解決問題，只能暫時緩解。這個人特別容易出問題。這就是“好人沒好報”的道理。似乎好心就不一定得好報。</p>\n<p>意象對話心理諮詢研究發現，其實好心是有好報的，作惡也有相應的惡報。只不過報應不是按照我們平常理解的方式，今天揀到錢包，明天就倒大黴；不是現在做點好事，將來就有回報；也不是令狐沖所說“一見尼姑，逢賭必輸”，見到尼姑就沒好報。真正的報應就發生在我們行善或者作惡的瞬間。一分不多，一秒不少，就發生在當時當刻。我在前面的文章裡，已經舉了人格的例子，介紹過“害人害己”的道理，其實就是報應，這裡不再贅述。但在小說的本章節裡，有個特別標準的因果報應，就是田伯光，所以現在用他來說。</p>\n<p>田伯光續道：“我到華山來邀你大駕，卻給你打得一敗塗地，只道這番再也性命難保，不料太師父故心不下，親自帶同小師太上華山找你，又給了我解藥，我聽你的勸，從此不再做採花姦淫的勾當。不過田伯光天生好色，女人是少不了的，反正身邊金銀有的是，零找蕩婦淫娃、娼妓歌女，絲毫不是難事。半個目前，太師父又找到了我，說你做了恆山派掌門，卻給人家背後譏笑，江湖上的名聲不大好聽，他老人家愛屋及烏，愛女及婿……”令狐沖皺眉道：“田兄，這等無聊的話，以後可再也不能出口。”田伯光道：“是，是。我只不過轉述太師父的話而已。他說他老人家要投入恆山派，叫我跟著一起來，第一步他要代女收徒。我不肯答應，他老人家揮拳就打，我打是打不過，逃又逃不了，只好拜師。”說到這裡，愁眉苦臉，神色甚是難看。令狐沖道：“就算拜師，也不一定須做和尚。少林派不也有許多俗家弟子？”田伯光搖頭道：“太師父是另有道理的。他說：‘你這人太也好色，入了恆山派，師伯師叔們都是美貌尼姑，那可大大不妥。須得斬草除根，方為上策。’他出手將我點倒，拉下我的褲子，提起刀來，就這麼喀的一下，將我那活兒斬去了半截。”</p>\n<p>拆解子人格的時候發現，一個人在作惡的同時，一定在他的內心有相應的兩個子人格，一個是欺負別人的，另一個就是那個被欺負的。比如說田伯光，他是個採花大盜，被他強姦的民女不計其數。在他強姦別人的時候，一定在他內心有兩個相應的子人格。一個是正在施暴的他，另一個就是被強姦的女性。每強姦一次，意味著自己的那個女性子人格被強姦一次，絲毫不差，這個心理過程恰好就發生在他作惡的時候。等於說，強姦別人的同時，在心理上自己也被強姦了。</p>\n<p>子人格的認同還有一個特點，就是我們潛意識既可能認同是那個強者，也可能認同那個弱者。當認同強者的時候，田伯光表現出來就是強姦別人。但這種認同不是永遠不變的。假如一直認同強者的話，會一直是強姦別人，但是有一天轉變成認同弱者了，在現實中表現出來，就會被強姦，這就是現實層面的報應，嚴格對應，一點不錯。有的人會說，那我一直認同強者不就沒事了？不是這樣。潛意識的認同是我們沒法自己控制的。一直認同強者不變化，相應的報應也沒有在現實中表現，這樣的例子幾乎沒有。因為那個弱者往往也是我們的心結所在，每強姦一次，兩個子人格的力量都會加強，弱者可能加強更快。當它力量增強到一定時候，控制不了，我們不自覺地要向她認同。極少數的，活著的時候一直沒有表現出現實的報應，可能就是佛教所說的，來世再報。心理問題是永遠伴隨，不會自動消解的。一旦有機會就報，所以說，不是不報，時候未到。</p>\n<p>田伯光不斷強姦別人，我們可以推測，他早晚有一天會被人強姦。這真的不是開玩笑，害人害己，傷害別人一定最終傷的都是自己。害別人，自身心裡也不會很舒服。田伯光轉向認同那個被強姦的女性子人格的時候，現實的表現就是他被大和尚割了。另外一種形式的強姦而已。這一故事情節特別符合人的心理，生活中也都是這樣。當轉向認同那個被強姦的女性子人格時，相應的性格特點也會有所變化，變得有些像女人。這並不奇怪。每個男人身上都多少有些女性的側面，特別絕妙。田伯光在被割之後，還的確就是有點母性。怕羞，說話客氣，奉承。當年那個跟令狐沖斗酒，比劍，豪氣沖天的好漢；那個號稱“萬里獨行”，四處作惡，天不怕地不怕的田伯光，一下子就不見了。</p>\n</div>"},{"title":"第二十八章　小人專權","content":"<div>\n<p>第二十八章　小人專權</p>\n<p>故事梗概</p>\n<p>方證和沖虛向令狐沖揭穿左冷禪的陰謀：第一步，當上五嶽劍派盟主；第二步，將五派合併歸一，自任掌門；第三步，蠶食崑崙、峨嵋、崆峒、青城諸派，一一將之合併；第四步，向魔教啟釁，率領少林、武當諸派，一舉將魔教滅了。江湖上血雨腥風，在所難免。三人身負重任，需得阻止左冷禪。嵩山將於三月十五日，聚集各派，推選掌門。看來並派之事，已成定局。三人商量對策，只有令狐沖出面，與左冷禪爭奪掌門，否則恆山、華山早晚大禍臨頭，被左冷禪宰割。令狐沖只能答應努力，屆時方證、沖虛也會出面主持大局。</p>\n<p>賈布等魔教徒已在身後佈下埋伏，要三人割下手臂，束手就擒。否則毒水齊發，三人武功再高也難以逃生。盈盈現身，破了埋伏，救出三人，收服上官雲，賈布被方證擊落深谷。安排好恆山事務，令狐沖便陪同盈盈上黑木崖，任我行，向問天半路出現。聽說教中專權，東方不敗的男寵楊蓮亭，任意屠戮功臣，若不是限於教中嚴規，早就有人造反了。上官雲綁了令狐沖，餘人扮作上官雲的下屬，一同上黑木崖。街上傳來馬蹄聲，教中元老童百熊被抓獲，果然是倒行逆施。前天任我行找過童百熊，童百熊對東方不敗忠心耿耿，至死不渝，眼下就被楊蓮亭抓走。</p>\n<p>心理分析</p>\n<p>看到2005年的一條新聞信息，上海一家藝術館展出了為秦檜夫婦塑造的站像，為什麼要讓秦檜站起來？站像的製作者是這樣解釋的：秦檜夫婦的跪像是過去人權和女權被侵害被壓迫的表現，人觸犯法律，自然有司法機關追究責任，但誰也無權逼人下跪，或者死後塑個跪像什麼的，這都是侵犯人權的表現。</p>\n<p>首先排開個人的心理問題，來看社會環境，就會發現，歷朝歷代，上到國家機關，下到鄉村合作社，從行政部分到企事業單位，到處都有小人，無處不在。這也是蠻合理的，之所以存在，是因為我們有讓它存在的大環境。上面這個例子特別可恨，它的象徵意義非常明白，簡單明瞭，象徵著小人重新在人們心目中獲得地位，它又站起來了。過去給它塑造跪像，說明我們還沒有出賣自己的良知，做人最起碼的良心還沒有被矇昧，讓它跪下，唾棄它，意味著我們對小人的痛恨和不接受，是一種基本的態度，這樁公案獲得普遍認可，跟人權沒有任何關係。現在站起來了，牽強附會地套上個人權的幌子，並不意味著我們真能給它人權，只意味著我們最基本的不接受態度被模糊了。</p>\n<p>瞭解秦檜的故事，首先會看到，他特別被宋高宗接受。他對大臣們說：“秦檜比誰都忠。有了他，我高興得晚上也睡不著覺呢。”宮廷裡的政治鬥爭太黑暗，很多時候還要加上外族入侵帶來的恐慌，當皇帝的人處在這種環境，一定會缺乏安全感。只有極少數例外，是那些天生就大度自信的人。這一點一般人也很容易理解。所以，經常有個人在身邊安慰，說些很動聽的話，心裡肯定要踏實些。即使不是那麼踏實，也多少能獲得一些安慰。除了那些大度自信的少數人，願意不斷接受批評，聽取反對者的聲音，多數皇帝是沒有這個耐心和勇氣的，畢竟被人批評和反對是一件讓人很不痛快的事情，會感覺挺不舒服，正常人都這樣。誰都願意聽取那些支持和讚美自己的話，這可能是人身上普遍存在的一種傾向。有的人不願意承認，自己就喜歡別人批評和反對。說這話的人，多半是因為被我的話觸動，不太願意接受，才立即作出反應。仔細分辨的話，這不是他/她的第一感受。剛聽到我的話，一般都是不太舒服的。自己喜歡別人的批評和反對，這是理智的反應，不是感受。相反，聽到別人恭維的話，從感受上更容易感覺舒服些，容易接受，雖然明知道不是真的。就像一個女孩問你，她是不是世界上最美的，你最好說是，說不是就大禍臨頭了，馬上跟你翻臉。所以一個男人，太男人了往往不太討女人喜歡，討女人喜歡的是那些會說好聽話的男生。男人其實也是一樣的道理，只不過不是喜歡誇自己美，喜歡誇自己有力量、能幹，等等。換湯不換藥，都是喜歡好聽的。</p>\n<p>說好聽的話、恭維、拍馬屁，這正是小人的拿手項。所以這些人在上司面前特別受寵，很能討人歡心。這跟是非真假沒有關係，再假的假話，聽多了都會誤以為是真的。有人愛說，那就有人愛聽。小人愛拍馬屁，也不完全是出於個人的問題。沒人聽，社會也都不接受，那就沒人說了。</p>\n<p>但就個人而言，他們自身人格上也的確是有很大問題的。個人具體的問題是不一樣的，要具體才能分析，不能一概而論，但有一些基本的特點是比較共性、比較普遍的。比如，第一，自卑；第二，討好；第三，嫉妒；第四，不安全感。</p>\n<p>一、自卑</p>\n<p>正常人都會自卑，有一定的自卑並不奇怪，每個人都會有。但當它成為我們的情結，佔的分量太重時，就會成為一種障礙。不承認自己的不足，而只是拼命追求補償。可能先天就有些不足，又把過多的精力用於獲得補償，所以跟身邊的人相比，他們沒什麼才能，沒什麼遠見，沒有辦法不自卑。就像一個人先天口吃，通過刻苦的訓練，他也有可能成為一流的演說家，但這能解決自卑，能讓他感到滿足嗎？演說是一流了，可是跟正常人交往可能還有困難呀。解決的辦法是，首先要承認自卑，承認自己不足，這才有可能進步。只要意識到了，即使不可能進步，也沒有關係。因為它讓你有可能去發掘自己擅長的東西。人不是隻有演說才是才能，也不是除了演說就沒法生存。那樣的話，不搞演說的，不全都餓死了嗎？真正去發掘的話，每個人都會有自己獨特的地方。比如說，它可以成為我們人際交往的才能。但假如只是出於自卑的補償，奉承就為了提高地位，那麼你就永遠陷在奉承上了，因為即使地位真提高了，你也不可能滿足，那不是你真正需要的。僅僅用於自身，追求補償，受害的只是自己，那也還好。要是權力場上出現這種人，長期忍辱為的就是有一天出人頭地，那麼有一天真的獲得權力了，就會禍國殃民。好不容易熬出頭，過去不如人，現在手中掌握了權力，怎能不炫耀一下呢？他一炫耀，無數的受害者遭殃。自卑的人內心是非常容易受傷害的，儘管他從來不表現出來。有了權力以後，發洩出來，別人要遭禍害；不發洩出來，別人也要遭禍害，因為他可以把你完完全全控制起來。像楊蓮亭這樣的人，絕對不允許你說話，生活在他身邊，你甚至隨便笑上一笑，他都可能要你的命。</p>\n<p>二、討好</p>\n<p>討好、拍馬屁，這些是小人比較擅長做的事情。對於個人，討好倒不至於導致多嚴重的心理問題，就是喪失尊嚴而已，會活得比較沒有尊嚴。習慣了的話，會期望別人以同樣的方式對待自己。某高校一個學生跟老師吵架，本院一個搞學生工作的老師負責處理這件事。老師說：“你不知道人家是老師嗎？怎麼能跟老師吵架呢你？”學生說：“他是老師他都罵我，我是學生怎麼就不能罵他？”老師說：“你怎麼能這樣跟老師（她自己）說話？”老師的潛臺詞就是，你是學生，我是老師（雖然只是個搞學生工作的，但也是個老師啊），你怎麼能用平等的口氣跟我說話呢！你應該用學生的口氣啊！這也是一個挺普遍的問題，老師也好，學生也好，這不都是人嗎？怎麼就不能用平等的口氣呢？但是這個老師會這麼認為，她會認為自己好歹也是個老師了呀。</p>\n<p>討好最大的受害者，往往不是他本人，而是被討好的對象。可以用任我行的例子來說。上官雲道：“教主令旨英明，算無遺策，燭照天下，造福萬民，戰無不勝，攻無不克。屬下謹奉令旨，忠心為主，萬死不辭。”任我行心下暗自嘀咕：“江湖上多說‘雕俠’上官雲武功既高，為人又極耿直，怎地說起話來滿口諛詞，陳腔濫調，直似個不知廉恥的小人？難道江湖上傳聞多誤，他只是浪得虛名？”不由得皺起了眉頭。任我行初次聽到這樣的話，覺得很肉麻，很難聽。可是閱讀小說的後面部分，就會看到，任我行做了教主以後，聽多了也就喜歡上了，還特別愛聽。所以小人當道是件很麻煩的事情，奉承之詞不但掩蓋事實真相，而且被恭維的人特別容易膨脹。</p>\n<p>三、嫉妒</p>\n<p>嫉妒是一種很常見的防禦方式。有人編了一個小故事特別好。三個人翻圍牆，第一個跳下去了，聽到“撲通”一聲，第二個就在圍牆上問：“怎麼樣，沒事吧？”下邊回答：“沒事，跳吧。”第二個跳下去了，又是“撲通”一聲。趕緊告訴下一位：“下邊沒事，放心跳吧。”第三個“撲通”一聲跳下去了。這才明白，下邊是個糞坑。第一人受害，心有不平，要把別人拉下水。第二個又受害了，但還是要把人拉下水。自己受到不公平待遇，別人過得比自己好，因此而心生嫉妒，這沒有問題。但是採取的方式是把別人拉下水，這是不健康的。所以嫉妒本身其實並沒有問題，但是因此而害人就有問題。這還只是跳個糞坑，假如第一個受害者就是個權力很大，生殺於奪的要人，後果就非常恐怖。任何一個玩弄權術的人，他本身也是權術的犧牲品。自己也挺受害的，等啊等，就為了獲得權力。現在終於攬到權力了，怎麼能允許有人比我更受寵？怎麼能允許別人地位比我高？怎麼能允許別人比我活得好？很多功臣就是這麼被屠殺的。</p>\n<p>四、不安全惑</p>\n<p>任我行精神勃勃，意氣風發，說道：“這些日子來，我和向兄弟聯絡教中舊人，竟出乎意料的容易。十個中倒有八個不勝之喜，均說東方不敗近年來倒行逆施，已近於眾叛親離的地步。尤其那楊蓮亭，本來不過是神教中一個無名小卒，只因巴結上東方不敗，大權在手，作威作福，將教中不少功臣斥革的斥革，害死的害死。若不是限於教中嚴規，早已有人起來造反了。”</p>\n<p>楊蓮亭殺人會有各種不同的理由，比如別人蓄意造反，比如為了效忠教主，等等。最終其實都是一個理由，消除不安全因素。因為被殺的這些人，可能危及自己，危及全教的穩定。消除不安全因素，最徹底，最可靠的辦法，就是殺光。皇族爭權，經常出現把整個家族殺光的事情，就是這個原因。所以這是危害最大、最恐怖的一個心理問題。楊蓮亭主要殺的是功臣，要麼殺害，要麼斥革，最終會達到的一個目標就是，保證沒有反抗的可能性。一個國家也好，一個組織也好，對功臣的殘害屠戮到了這種程度，那麼這個國家、這個組織，基本上可以宣告垮臺了。</p>\n</div>"},{"title":"第二十九章　繡花針","content":"<div>\n<p>第二十九章　繡花針</p>\n<p>故事梗概</p>\n<p>楊蓮亭逼迫童百熊認罪，童百熊眼看威震江湖數百年的日月神教毀於一旦，心有不甘，希望東方兄弟說句話。這東方不敗卻死活不肯吱聲，童百熊起了疑心，想要看個究竟。任我行等人乘機發難，活捉東方不敗，原來是個假貨。</p>\n<p>有侍者報告東方不敗並沒有死，楊蓮亭帶路，找到東方不敗。東方不敗一看楊蓮亭受傷，撲到楊蓮亭身旁，臉上一副愛憐無限的神情，似一個賢淑的妻子服侍丈夫一般。身影晃動，童百熊張了大口倒地。任我行看得明白，東方不敗已練成《葵花寶典》上的高深武學，不過也因此而變得不男不女。因為寶典註明：“欲練神功，揮刀自宮。”任我行當年把寶典傳給東方不敗，為的就是這個。四人力鬥東方不敗，絲毫碰不到他一點衣衫，上官雲眼睛被刺瞎，其餘三人也都中了他的繡花針。盈盈揮劍往楊蓮亭身上亂斬，東方不敗甚是關切，陡然撲向盈盈，便在此時，令狐沖和任我行兩把長劍都插入東方不敗後心。</p>\n<p>任我行奪回教主之位，大堂之上盡是“文成武德，文武全才”之類的口號，令狐沖聽了說不出的厭惡。任我行重提入教的事，並且威脅令狐沖習練“吸星大法”的危害，不入教絕對不傳授化解的方法。入教的話，將來這教主的位子，早晚是他的。令狐沖再次拒絕。嵩山大事未了，別了盈盈，令狐沖騎馬出了日月教。</p>\n<p>心理分析</p>\n<p>武器也是夢中非常常見的象徵物。人有攻擊本能，本能是人人共有的，並不是只有少數人才有。每個人攻擊採用的方式是不一樣的，各有特色。但也有一些基本的規律，這些規律可以從使用的武器看出來。不同的人使用不同的武器，武器不是隨便亂使用的，一定跟使用的這個人的特點有很大關係。比如說張飛，你要讓他使繡花針就不大容易，自己用起來痛苦，我們看他用也會很痛苦。</p>\n<p>有人覺得自己的職業跟武器沒有關係，自己從來沒有使用過武器，也並不打算使用，所以自己沒有攻擊性，也看不出特點。其實也不是這樣的，每個人特定的時候都會有攻擊性，攻擊方式的特點，會在夢中，在意象裡以武器的形式表現出來。瞭解各種武器的特點，就可以瞭解自己攻擊方式的特點。</p>\n<p>刀、劍是最常見的攻擊物，它們都代表非常直接的攻擊。不過相比之下，刀其實更直接，更強調力度，而劍是雙刃的，力度沒有刀那麼猛，更加柔和一些，但它更靈活，更強調技巧。田伯光這個人非常坦率，力度也很猛，所以他使用的是刀；令狐沖比他更狡猾，天資很高，學技術快，更靈活，所以使用的是劍。</p>\n<p>板斧、鐵錘之類是很笨重的工具，力量極大，傷人極重，但卻是一種很笨拙的力量，適合李逵這種特別有力，但是反應不夠靈敏的人使用。如果在鐵錘的頂端裝上齒狀物，那就象徵有力而又兇殘的攻擊。光滑，不帶利刃，諸如木棒禪杖之類，都象徵比較善良，比較仁慈的工具，所以武松，魯智深等人，其實心地都挺善良的，不是那麼兇殘。</p>\n<p>槍也常在夢中出現，象徵的是遠距離攻擊，不是那麼直接，殺傷力又極強，一般象徵來訪者內心對敵人很恐懼，沒有勇氣接近，更不敢正面對打，所以希望放個冷槍，直接把對方殺死。殺死對手是為了緩解自己內心的恐懼。飛機、大炮、坦克等屬於比較現代化的攻擊武器，它們更多地帶有集體性，個人夢中比較少使用。這些東西的出現，代表的是人類對力量的幻想，現代人自身力量跟原始人相比，顯然沒有那麼強大，但是站在大炮、坦克這樣的現代化武器面前，會有特別強大的力量感，也會有幻想力量的滿足感，這種滿足是帶有自卑的補償作用的，越是站在航空母艦這樣空前強大的武器面前，人其實越會感覺到自身的渺小。</p>\n<p>也像刀劍一樣有鋒刃，但卻是彎狀的物體，比如鐮刀。這種攻擊物特別有意思，諮詢中發現都是被動攻擊的人特別喜歡使用這類武器。被動攻擊就是通過攻擊自身來攻擊對方的行為方式，比如有的人，跟人吵架，既不罵對方，也不打對方，而是打自己洩氣，一邊抽自己嘴巴，一邊嘴上唸叨：“你他媽笨！窩囊，沒出息！打不過別人，受人欺負！”說一句，就抽自己一嘴巴，他其實不完全是在傷害自己，還傷害對方，因為他打自己嘴巴，會讓對方心裡特別難受，會感覺到愧疚等，所以他打自己也相當於在打別人，這就是被動攻擊。使用的武器特別具有這個特點，都是繞了彎的攻擊。</p>\n<p>像刀劍一樣有利刃，但是比較短的，比如匕首之類，象徵的是隱藏的攻擊。因為匕首本身就經常是被隱藏起來的，只在偷襲的剎那間使將出來，殺傷力倒是不小，可以只傷肌膚，但也可以致命。這種人心靈也不是那麼開放，他的攻擊若有若無，你不知道他什麼時候會對你下毒手，不小心防範，就要吃大虧。如果比匕首更細、更隱藏，那就是繡花針了。它本身的象徵意義很容易理解，跟匕首是一個道理，就是更細，更尖銳，隱藏得更深而已。使用繡花針的人，心會非常細，細膩到了像女人的程度，因為繡花針本身就多用於女性，只在用於攻擊的時候當作武器。不但心細，有心機，還隱藏得特別特別深，不表達自己的情感，不開放內心，隱藏得特別好，一般人根本看不出來。東方不敗使用的武器就是繡花針，而且我們可以看到，東方不敗這個人的確很心細、很有心機，城府特別深，從來不透露，很少有人能識破他的心計。</p>\n<p>上面說的是比較籠統的特點，那麼具體到東方不敗這個人身上，他為什麼會使用繡花針？繡花針具體代表他一種什麼樣的心理？</p>\n<p>任我行緩緩拔出長劍，說道：“東方不敗，恭喜你練成了《葵花寶典》上的武功。”東方不敗道：“任教主，這部《葵花寶典》是你傳給我的。我一直念著你的好處。”</p>\n<p>東方不敗嘆了口氣，道：“任教主，你待我的種種好處，我永遠記得。我在日月神教，本來只是風雷堂長老座下一名副香主，你破格提拔，連年升我的職，甚至連本教至寶《葵花寶典》也傳了給我，指定我將來接替你為本教教主。此恩此德，東方不敗永不敢忘。”</p>\n<p>只聽東方不敗又道：“初時我一心一意只想做日月神教教主，想什麼千秋萬載，一統江湖，於是處心積慮地謀你的位，剪除你的羽翼。向兄弟，我這番計謀，可瞞不過你。日月神教之中，除了任教主和我東方不敗之外，要算你是個人才了。”向問天手握軟鞭，屏息凝氣，竟不敢分心答話。東方不敗嘆了口氣，說道：“我初當教主，那可意氣風發了，說什麼文成武德，中興聖教，當真是不要臉的胡吹法螺。直到後來修習《葵花寶典》，才慢慢悟到了人生妙諦。其後勤修內功，數年之後，終於明白了天人化生、萬物滋長的要道。”</p>\n<p>任我行伸手到東方不敗衣衫袋中，摸出一本薄薄的舊冊頁，隨手一翻，其中密密麻麻地寫滿了字。他握在手中揚了揚，說道：“這本冊子，便是《葵花寶典》了，上面註明‘欲練神功，引刀自宮’，老夫可不會沒了腦子，去幹這等傻子，哈哈，哈哈……”隨即沉吟道：“可是寶典上所載的武功實在厲害，任何學武之人，一見之後決不能不動心。那時候幸好我已學得‘吸星大法’，否則跟著去練這寶典上的害人功夫，卻也難說。”他在東方不敗屍身上又踢了一腳，笑道：“饒你奸詐似鬼，也猜不透老夫傳你《葵花寶典》的用意。你野心勃勃，意存跋扈，難道老夫瞧不出來嗎？哈哈，哈哈！”令狐沖心中一寒：“原來任教主以《葵花寶典》傳他，當初便就設懷善意。兩人爾虞我詐，各懷心計。”見任我行右自中不絕流出鮮血，張嘴狂笑，顯得十分地面目猙獰，心中更感到一陣驚怖。任我行伸手到東方不敗胯下一摸，果然他的兩枚睪丸已然割去。</p>\n<p>原本人的攻擊性，其實都應該是非常直接的，就像原始人，感到很憤怒，可以直接就跟對方搏鬥，甚至殺死。但是現實中顯然不可能得到這麼直接的表達，所以攻擊會受到壓抑。受到壓抑的攻擊並不是就自動消失了，而是會轉化成別的，比如說可以轉化成不是那麼直接的攻擊，可以辱罵。受到壓抑而轉化，這就是為什麼有的人攻擊會變得婉轉，隱藏。受的壓抑越嚴重，那麼隱藏也就會越深。這種壓抑主要在童年開始形成，以後會繼續延續相應的模式。繼續受到壓抑的話，會繼續隱藏，藏得越來越深。不知道東方不敗的童年是什麼樣，但我們知道他有相當長時間是生活在任我行身邊的。任我行是個非常權威、非常專斷、非常蠻橫的人，分析發現，權威的人都特別缺情感。不難理解，東方不敗長期生活在任我行手下，一定是很感壓抑的。這跟表面上的陽光沒有關係，接連被提拔，但這跟情感上的壓抑不是一回事，生活在權威的入手下就會很受壓抑，不管他對你多好。更何況我們知道任我行對東方不敗好，那也不是真好。東方不敗有一句話說得特別真實，當世其實只有楊蓮亭一人待他好，只有在這種變態的愛情裡，他才能感受到有人對他好。</p>\n<p>任我行對東方不敗的這種壓抑，我們稱為精神上的閹割。所以實際上，在他揮刀自宮以前，靈魂上早已開始被人閹割。是另外一種形式的閹割而已，在心理意義上，跟生殖器的閹割沒有本質上的區別。</p>\n<p>經驗發現，那些靈魂上受到嚴重閹割的人，比如從小被父親嚴格管束，嚴格控制的男孩，以後特別容易成為父親的樣子，很權威，很有權力，儘管他自身總是對此堅決否認，死活不認為自己權威。但在旁人看來，很容易就發現，嘴上經常喊著要獨立的人，他們本身就很權威，很有權力。只因為權威是無意識的，所以他自己始終發現不了。</p>\n<p>被閹割的孩子成為父親的樣子，東方不敗處心積慮，最終取代任我行而做了教主，這兩個過程非常類似。東方不敗從任我行那兒奪得了寶座，雄心壯志的想要幹一番大事業，但最終一定會迷失，因為這其實不是他個人真正想要的。只不過受到嚴重壓抑，所以希望通過獲得無上的權力來補償。但我們知道補償不是有效的途徑，所以東方不敗在真正奪取寶座以後，還是會感到迷失。</p>\n<p>經驗還發現，精神上被父親嚴重閹割的小男孩，成人之後依然有過重的女性氣質。壓抑過分嚴重的話，甚至一眼看上去就特別不像個男人。因為顯然，父親對孩子的閹割，壓抑的是男性氣質。每個人身上都既有男性氣質，又有女性氣質，男性氣質受到壓抑，就會更多地彰顯女子氣。這種男孩，我們可以說他在性別問題上多少有些迷失自我。</p>\n<p>東方不敗，這個自認為棋高一招的人，直到最後一招，依然被任我行玩弄於股掌。利用他對權力的熱愛，利用他的雄心壯志，對他做了一次最完整、最徹底的閹割。說到底，東方不敗是個被任我行徹底閹割了的人，不但一直受到壓抑，而且最終迷失性別。所以他使用繡花針是非常合理的，可以用做高度隱藏的攻擊武器，閒來無事還可以用於繡花。</p>\n</div>"},{"title":"第三十章　窩裡鬥","content":"<div>\n<p>第三十章　窩裡鬥</p>\n<p>故事梗概</p>\n<p>令狐沖帶同女弟子前赴嵩山，不戒和尚、田伯光、桃谷六仙也都跟了來。從儀琳口中，令狐沖得知，小師妹已經跟林平之成婚。縱聲大笑，發足狂奔，大醉之後，伏案而睡。嵩山弟子引路，被十餘名瞎子攔路，令狐沖認出是被自己刺瞎眼睛的十五人。幸虧不戒力大，提起嵩山弟子就扔，兩名嵩山弟子慘死。</p>\n<p>左冷禪親自迎接，方證、沖虛、天門、莫大、岳不群夫婦等先後到來。岳不群出奇地對令狐沖好，言語間有重將他收歸門下的意思。左冷禪用殺費彬一事，堵住莫大嘴巴。然後“徵求”泰山派意見，泰山派出現內鬥，持堅決反對並派意見的天門道人不幸犧牲。剩下恆山和華山，令狐沖唯師父馬首是瞻，一切聽師父的。岳不群發揮了長篇高論，最終的意見是同意並派，出入預料。令狐沖醒悟，原來師父要我重歸門下，指的是五嶽合併之後，自然成為一家。令狐沖說過的話也不能反悔，並派之事已定，至於掌門一席由誰來出任，桃谷六仙倒是當仁不讓。以往說話纏夾不清的桃谷六仙，今天搞起破壞來有條有理，倒似有高人指點。</p>\n<p>心理分析</p>\n<p>非常可惜，對付左冷禪的鬥爭還沒開始，泰山派內部倒自己先打起來了。雙方各有理由，爭鬥激烈。不管是被左冷禪收買也好，逼迫也好，總之內部鬥爭比對外激烈。</p>\n<p>中國人特別講禮貌，注重道德規範，理想的狀況就是見面的時候，每個人都很有禮貌，彬彬有禮。那麼，為什麼這麼重道德的國度裡也會有明爭暗鬥呢？</p>\n<p>“仁者愛人”，“愛人如己”，這些都是極高的道德理想，真能做到，當然讓人欣慰。但在普通人都還做不到的情況下，把它定為標準，就可能成為虛偽，僅僅是一種表面現象，起到的作用只是壓抑個人真實的情感。比較遺憾，孔子沒能跟父親生活，那樣的話，他就不至於把父親過度美化，出現理想父親的形象。因為一起生活才能體驗到，跟父親之間的感情並不純粹只有愛，除了愛還有其他的情感衝突，甚至是激烈的衝突，多少總有些地方不盡如人意，不是那麼理想。父子尚且如此，何況外人？</p>\n<p>像愛自己一樣地愛別人，那前提條件是知道怎麼愛自己。恰恰是很重要的這一點被人忽略了，一個不知道怎麼愛自己的人，是不可能愛別人的。因為他會按照自己的方式，誤以為是愛別人，其實剛好不是。比如說，我可能誤以為，忍氣吞聲，不跟人計較，這就是愛別人的表現。這種做法特別害人。害人又害己。</p>\n<p>碰到過一個家庭，母親為了孩子忍受煎熬，日子過得極為艱難，把孩子當做命根子，寧可自己忍受所有的痛苦，也要拼命培養孩手，為的就是將來有一天孩子出人頭地。不僅忍受痛苦，不斷付出，而且把孩子當成掌上珠，處處忍讓，自己心裡難受，就是不願意孩子受到傷害。後來求助諮詢師了，問題非常嚴重，沒辦法處理，母親不斷抱怨孩子，說自己都能為孩子付出那麼多，為什麼孩子就不能為自己考慮一下？</p>\n<p>這是非常常見的一類心理問題，這位母親受到這樣的待遇，有這樣的回報，特別活該。活該如此。母親不知道尊重自己，一味地為孩子付出，短時間之內一般不會表現出來，時間久了之後，問題就會暴露，最直接的後果就是，她會期望別人以同樣的方式回報自己。當得不到期望的回報時，就會把責任歸到對方身上。這不是活該是什麼？如果你是真心為了孩子，就應該尊重自己。可以為孩子付出，但不能成為獲得回報的理由，你可以期望，但沒有理由不允許對方不回報。你付出是你願意，人家願不願意回報，要由別人自己決定。如果你付出就是為了獲得回報，那你其實不是真心對孩子好。自己這麼自私，孩子對你自私當然是應該的。這種問題在諮詢中還不好解決，因為母親會堅決認為自己的做法是對的，沒有任何問題，不需要改變。沒有改變動機的心理問題是不太可能解決的，諮詢師不可能代替來訪者作出改變。</p>\n<p>不表達自己的需求，一味忍氣吞聲，它的害處還表現在其他很多地方。就像上面這個家庭，如果形成一種風氣，整個家庭都忍氣吞聲，誰也不表達自己的需求，不表達自己的情感，就會出現很嚴重的後果。因為所有沒有得到表達的情緒，都不會自動消失。暫時可以壓抑下去，時間長了就會自動爆發出來。</p>\n<p>爆發出來以後，整個家庭上空會佈滿陰雲，空氣很不順暢，這裡爭那裡鬥，誰也說不清楚究竟什麼地方出了問題。看起來都是些雞毛蒜皮的小事，但就是會鬧得破天荒。</p>\n<p>跟美國人相比，中國人普遍不善於表達自己的情緒。有了事情，不到迫不得已，死活不肯拿到檯面上來說，寧可自己憋著。很多人有這樣的理解，覺得表達了沒用，所以就不表達了。的確有時候表達了，事情也不會因此而改變，所以感覺表達沒有用。其實不是這樣，表達的作用不在於改變，而在於就是要表達。沒有經過表達的情緒，會一直壓在我們內心，而一旦把它表達出來，分清楚了，一般幾分鐘，幾個小時，最多不超過兩天，情緒自然就沒有了。有的人擔心表達出來會傷害別人，後果更嚴重。我們說的表達，並不是非要打上一架，吵上一通，才叫表達，相反，很多情況下像吵打這樣單純的宣洩是根本起不到效果的，真正起效果的是宣洩之後的理解，反思。通常情況下，只要說出來就好了。說出來永遠比憋在心裡要好。用泰山派內鬥的例子來說。</p>\n<p>玉璣子叫道：“天門座下諸弟子，此事與你們無關，大家拋下兵刃，過來歸順，那便概不追究，否則嚴懲不貸。”建除道人大聲道：“你若能對祖師爺的鐵劍立下重誓，決不讓祖師爺當年辛苦締造的秦山派在江湖中除名，那麼大家擁你為本派掌門，原也不妨。但若你一當掌門，立即將本派出賣給嵩山派，那可是本派的千古罪人，你就死了，也無面目去見祖師爺。”玉音子道：你後生小子，憑什麼跟我們‘玉’字輩的前人說話？五派合併，嵩山派還不是一樣的除名？五嶽派這‘五嶽’二字，就包括秦山在內，又有什麼不好了？神天門道人道：你們暗中搗鬼，都給左冷禪收買了。哼，哼！要殺我可以，要我答應歸降套山，那是萬萬不能。玉班子道：“你們不服掌門人的鐵劍號令，小心煩刻間身敗名裂，死無葬身之地。”天門道人道：“忠於泰山派的弟子們，今日咱們死戰到底，血濺嵩山。”衝站在他其周的群弟子齊聲呼道：“死戰到底，決不投降。”他們人數雖少，但個個臉上現出堅毅之色。玉璣子倘若揮眾圍攻，一時之間未必能將他們盡數殺了。封禪臺旁聚集了數千位英雄好僅，少林派方證大師、武當派沖虛道人這些前輩離人，也決不能讓他們以眾欺寡，幹這屠殺同門的慘事。玉璣子、玉磬子、玉音子等數人面面相覷，一時拿不定主意。</p>\n<p>泰山派玉字輩的師叔們，那麼容易被左冷禪收買，他們可能過去就對天門道人有不滿，否則也不至於願意幫助外人對付自己人。玉璣子認為天門不肯合併是因為捨不得掌門人的位子，這極有可能就是他自己的想法，對掌門人之位比較感興趣。天門剛拿出掌門信物，玉璣子不顧輩分，上前就搶。幾個玉字輩的師叔，合夥當眾搶掌門人之位，倒也有趣得緊。</p>\n<p>經驗發現，假如玉字輩的幾位師叔對掌門人之位不滿的話，仔細分析之後，他們往往不見得真想自己做掌門，僅僅就是有些不滿而已。這樣的不滿可能是覺得天門沒資格，可能是對前任掌門挑選繼承人有不滿，總之不管是什麼不滿，只要表達出來，真正弄清楚自己的不滿是什麼，問題也就解決了。即使是對天門不滿，當面表達也不妨，對方其實希望你如此，更不願意看到的情況是大家都憋在心裡，導致臉色或者其他的表現卻讓人不好看。多數人都擔心，這樣的表達天門不願意聽到。諮詢發現人的確不是這樣的，內心裡他寧可聽到，憋著才讓人難受。有時候是出於別的考慮，比如說，再怎麼表達，掌門之位也還是他天門，說了也沒用。的確，說了也未必會改變事實，但是能解決衝突。表達出來以後，真正清楚了自己的不滿是什麼，一般人這時候會發現自己的不滿本來就是挺荒唐的，問題自然解決了。更何況，你怎麼知道不會有用，萬一它就是改變了呢？《大話西遊》裡唐僧有一句話說得特別好，特別符合心理諮詢，“想要你就說嘛，不說我怎麼知道你想要呢”？真正說出來了，雙方互相都坦白了，沒有什麼不可以解決的；即使不能改變，坦白了也比不坦白好，總不至於背地裡幹出這等卑鄙的勾當，出賣自己人。</p>\n<p>假如他們也不是過去就有不滿，只是一時間被左冷禪脅迫，那其實也應該對自己人公開。比如家人被左冷禪控制，那麼公開了他可以威脅你，不公開照樣威脅你。不公開等於主動放棄支持的力量。公開的話，可以讓人死也瞑目，知道自己為什麼被害。背地裡坑害就很讓人難受，不明所以。再者，假如都是些血性的漢子站在自己一邊，不屈服的話，左冷禪反而不敢真的怎麼樣。即使真的怎麼樣了，意義也不一樣。打不過但是不怕你，跟主動放棄抵抗，坑害自己人，是完全不同的兩碼事。天門道人群弟子的做法就特別可敬，人少，力量也不足，但就是不投降。</p>\n</div>"},{"title":"第三十一章　兩次彈劍","content":"<div>\n<p>第三十一章　兩次彈劍</p>\n<p>故事梗概</p>\n<p>推舉五嶽掌門人，桃谷六仙胡攪蠻纏，覺得方證大師是最佳人選。有人反駁，但也糾纏不清，令狐沖四處張望，果然有人在背後指點桃谷六仙，這人正是盈盈。桃根仙改口推舉令狐沖。桃花仙建議左冷禪，不服的話可以跟令狐沖比劍。眾人贊成比劍奪帥，誰勝了誰做掌門。</p>\n<p>泰山派再次出現內證，玉璣子殘廢，玉音子、玉磬子都想爭奪掌門之位，沒法決定誰代表本派出場。林平之出言不遜，蔑視兩位不能領略泰山劍法精要，兩人憤怒之下，想要領教幾手泰山派武功。出其不意，嶽靈珊出場，以泰山劍法擊敗玉音子、玉磬子。接著又以衡山劍法，力鬥莫大先生，手段有些無恥，畢竟最終還是贏了。</p>\n<p>令狐沖上前，以恆山劍法迎戰嶽靈珊。以令狐沖劍法，自是數招之間就能擊敗師妹，但令狐沖本意不在於此，跟師妹比劍，為的就是逗她開心。六招之後，嶽靈珊所學恆山劍法已經全部使完。兩人逐漸用起了當年獨創的一些劍法，這些劍法從來沒有在江湖上流傳過，眾人也看不明白。令狐沖越玩越有興致，心中柔情無限。林平之冷笑一聲，嶽靈珊劍法陡變，毫不容情。令狐沖腦中混亂，中指一彈，嶽靈珊長劍脫手，直衝上天。長劍落地，令狐沖往劍尖上一湊，長劍從他左肩後直插了進去。</p>\n<p>心理分析</p>\n<p>令狐沖有過兩次，都是在比劍的時候，把師妹的長劍彈飛了。而且每次彈飛之後，總是心情複雜，矛盾。也說不清楚自己怎麼會有這樣的反應，尤其第二次，就是嵩山的這一次，很明顯地就是個無意識動作，只覺頭腦中一片混亂，然後無意中就把劍彈飛了，飛出之後才反應到：“糟糕！”這種無意識動作的反應背後，一定有某種心理因素在作怪。這兩次彈劍，我們可以從中看出令狐沖和嶽靈珊的主要情感衝突所在。先把這兩次彈劍對照一下。</p>\n<p>第一次：</p>\n<p>令狐沖素知小師妹十分要強好勝，料想她跟林平之拆招，這套新練的劍法自然使來得心應手，招招都佔上風，此人武功低微，確是最好的對手，當下鬱悶之情立去，笑道：“那麼讓我來給你過幾招，瞧瞧你的‘玉女劍十九式’練得怎樣了。”嶽靈珊大喜，笑道：“好極了，我今天……今天上崖來就是想……”含羞一笑，拔出了長劍。令狐沖道：“你今天上崖來，便是要將新學的創法試給我看，好，出手罷！”嶽靈珊笑道：“大師哥，你劍法一直強過我，可是等我練成了這路‘玉女劍十九式’，就不會受你欺侮了。”令狐沖道：“我幾時欺侮過你了？當真冤枉好人。”嶽靈珊長劍一立，道：“你還不拔劍？”令狐沖笑道：“且不忙！”左手擺個劍訣，右掌迭地竄出，說道：“這是青城派的松風劍法，這一招叫做‘松濤如留’！”以掌作劍，向嶽靈珊肩頭刺了過去。嶽靈珊斜身退步，揮劍往他手掌上格去，叫道：“小心了！”令狐沖笑道：“不用容氣，我擋不住時自會拔劍。”嶽靈珊嗔道“你竟敢用空手鬥我的‘玉女劍十九武？”令狐沖笑道：“現下你還沒練成。練成之後，我空手便不能了。”嶽靈珊這些日子中苦練“玉女劍十九式”，自覺劍術大進，縱與江湖上一流高手相比，也已不輸於人，是以十幾日不上崖，用意便是要不洩露了風聲，好得一鳴驚人，讓令狐沖大為佩服，不料他竟十分輕視，只以一雙肉掌來接自己的“玉女劍十九式”，當下臉孔一板，說道：“我劍下要是傷了你，你可莫怪，也不能跟爹爹媽媽說。”令狐沖笑道：“這個自然，你盡力施展，倘若劍底留情，便顯不出真實本領。”說著左掌突然呼的一聲劈了出去，喝道：“小心了！”嶽靈珊吃了一驚，叫道：“怎……怎麼？你左手也是劍？”令狐沖剛才這一掌倘若劈得實了，嶽靈珊肩頭已然受傷，他回力不發，笑道：青城派有些人使雙劍。’嶽靈珊道：“對！我曾兄到有些青城弟子佩帶雙劍，這可忘了。看招！”回了一劍。令狐沖兄她這一劍來勢飄忽，似是“玉女劍”的上乘招數，讚道：“這一劍很好，就是還不夠快。”嶽靈珊道：“還不夠快？再快，可割下你的膀子啦。”令狐沖笑道：“你倒割割看。”右手成劍，削向她左臂。嶽靈珊心下著惱，運劍如風，將這數日來所練的“玉女劍十九式”一式式使出來。這一十九式劍法，她記到的還只九式，而這九式之中真正能用的不過六式，但單是這六式劍法，已然頗具威力，劍鋒所指之處，真使令狐沖不能過分逼近。令狐沖繞著她真子游鬥，每逢向前搶攻，總是給她以凌厲的劍招逼了出來，有一次向後息躍，背心竟在一塊凸出的山石上重重撞了一下。嶽靈珊甚是得意，笑道：“還不拔劍？”令狐沖笑道：“再等一會兒。”引著她將“玉女劍”一招招地使將出來，又鬥片刻，眼見她翻來覆去，所能使的只是六式，心下已是瞭然，突然間一個踏步上前，右掌劈出，喝道：“松風劍的煞手，小心了。”掌如甚是沉重。嶽靈珊見他手掌向自己頭頂劈到，急忙舉劍上撩。這一招正在令狐沖的意中，左手疾伸而前，中指彈出，噹的一聲，彈在長劍的劍刃之上。嶽靈珊虎口劇痛，把捏不定，長劍脫手飛出，滴溜溜地向山谷中直墮下去。嶽靈珊臉色蒼白，呆呆地瞪著令狐沖，一言不發，上齦牙齒緊緊地咬住下唇。令狐沖叫聲“啊喲！”急忙衝到崖邊，那劍早已落入了下面千丈深谷。</p>\n<p>第二次：</p>\n<p>只見他二人在半空中輕身飄開，俱是嘴角含笑，姿態神情，便似裹在一團和煦的春風之中。兩人挺劍再上，隨即又鬥在一起。二人在華山創制這套劍法時，師兄妹間情投意臺，互相依戀，因之劍招之中，也是好玩的成分多，而兇殺的意味少。此刻二人對劍，不知不覺之間，都回想到從前的情景，出劍轉慢，眉梢眼角，漸漸流露出昔日青梅竹馬的柔情。這與其說是“比劍”，不如說是“舞劍”，而“舞劍”兩字，又不如“劍舞”之妥帖，這“劍舞”卻又不是娛賓，而是為了自娛。突然間人叢中“嘿”的一聲，有人冷笑。嶽靈珊一驚，聽得出是丈夫林平之的聲音，心中一寒：“我和大師哥如此打法，那可不對。”長劍一圈，自下而上，斜斜撩出一劍，勢勁力疾，姿勢美妙已極，卻是華山派“玉女劍十九式”中的一式。林平之那一聲冷笑，令狐沖也聽見了，眼見嶽靈珊立即變招，來劍毫不容情，再不像適才使衝靈劍法那樣充滿了纏綿之意。他胸口一酸，種種往事，霎時間都湧向心頭，想起自己被師父罰去思過崖面壁思過，小師妹每日給自己送飯，一日大雪，二人竟在山洞共處一宵；又想起小師妹生病，二人相別日久，各懷相思之苦，但便在此時，不知如何，林平之竟討得了她的歡心，自此之後，兩人之間隔膜日深一日；又想起那日小師妹學得師孃所授的“玉女劍十九式”後，來崖上與自己試招，自己心中酸苦，出手竟不容讓……這許許多多念頭，都是一瞬之間在他腦海中電閃而過，便在此時，嶽靈珊長劍已撩到他胸前。令狐冷腦中混亂，左手中指彈出，鋒的一聲輕響，正好彈在她長劍之上。嶽靈珊把捏不住，長劍脫手飛出，直射上天。</p>\n<p>令狐沖自己的反思，認為這兩次彈劍可能都跟林平之有關。第一次，師妹使出“玉女劍十九式”之前，令狐沖得知在山下的時候，是小林子給師妹喂招，師妹多日不上崖，問陸大有，陸大有神色古怪，含糊其辭。顯然有小林子陪伴，師妹快活得很。師妹自己也說起她經常要小林子陪自己玩耍。知道師妹病了一場，但是上崖時神采奕奕，令狐沖怎能不起疑？最後用青城派的功夫對付師妹，青城派正是林平之的死冤家。自己可能有意跟林平之作對。第二次比劍，師妹已經成了別人的妻子，兩人正玩得興起，又因林平之一聲咳嗽而終端，師妹態度突變。令狐沖怎能不惱火？</p>\n<p>嫉妒肯定是有的，不過那只是比較表層的原因。令狐沖兩次把師妹的劍彈飛，其實還有一個更深層的心理原因，是對師妹要強好勝的不接受。第一次比劍之前特別提到，令狐沖素知師妹要強好勝，可見令狐沖對師妹這個特點的瞭解也不是一天兩天，他早就開始注意到了。提到要過招的時候，嶽靈珊的反應是大喜，並且承認自己今天上崖來，就是想要把新學的劍法試演試演。嶽靈珊當時的另外一句話特別重要，說大師哥劍法一直強過我，等我練成這套劍法，就不用再受你欺侮。後半句可能有開玩笑的成分，但前半句是很真實的，嶽靈珊其實挺不願意大師哥劍法比自己強。自己苦練“玉女十九式”，為的就是一鳴驚人，也讓令狐沖折服，等到使出來也不能把他怎麼樣時，心下甚是著惱。硬是把令狐沖逼退，這才有些得意。第二次比劍，又是在嶽靈珊使出“玉女十九式”的時候，令狐沖把她的劍彈飛。</p>\n<p>對比之前的反應，在師妹沒有以劍招相逼的時候，令狐沖對師妹一直是充滿柔情的。尤其是第二次彈劍之前，很長的一段時間以內，有大量的描寫反應令狐沖當時的心情，他一直心中柔情無限。只在師妹以劍招相逼，毫不容情時，他才把師妹的劍彈飛。可以看出，令狐沖其實更願意接受小師妹柔情的一面，並不接受師妹氣勢逼人的地方。他願意哄小師妹開心，也多半在她傷心難過的時候，不會在師妹要強好勝的時候。</p>\n<p>“在令狐沖失戀”的章節裡，我們分析過，其實嶽靈珊也希望令狐沖乖順，聽自己的話，由自己使喚。令狐沖這個人，什麼都不在乎，連命都不在乎，也並不好勝，但卻偏偏有些要強，你要他乖乖地聽你的話，求他還行，命令是絕對不行的。嶽靈珊那麼要強好勝的人，說話咄咄逼人，到處是命令的口氣。要她低聲下氣地求人那也是千難萬難。</p>\n<p>生活中大家會有這樣的經驗，兩個特別聰明的異性不適合在一起，兩個事業心過強的人不適合，兩個太好勝的人不適合，兩個太要強的人也不適合。筆者還真見過這樣的案例，兩個極其聰明的人結了婚，後來離了。兩人都太聰明，認識以後又都互相佩服，因此而走到一起，後來離婚，是因為處久了發現，兩人之間沒有感情，有的只是佩服。同樣的道理，兩個太要強好勝的人在一起，就都搞競爭去了，兩個要強的人要互相接受對方的要強是非常困難的，除非有其中一方主動示弱，以後放棄競爭。</p>\n<p>假如兩個人身上，要強都只是個小問題，或許通過長期的溝通可以處理。但如果都在性格中佔了很大成分，或者就是主導性格，那可就麻煩了。短時期內可以表現得很聽對方的話，時間長了就特別困難。兩個人相處，尤其是夫妻之間，起作用的一定是感情，而不是競爭或者服從。只有感情才可能持續不斷，競爭關係不可能維持長久。說句對不起令狐沖的話，幸好小師妹沒有嫁給他，否則的話這兩人相處還真不是那麼容易。倘若小師妹真嫁給他，他恐怕未必能接受師妹的要強，從他兩次無意識彈劍動作就可以看出一些。</p>\n</div>"},{"title":"第三十二章　理智化","content":"<div>\n<p>第三十二章　理智化</p>\n<p>故事梗概</p>\n<p>左冷禪與嶽靈珊比劍，嶽靈珊事先約定，只要能在左師伯面前使上十三招，就算自己贏了，左冷禪心想，能讓你使上三招，姓左的已經面目無光了，怎容你使上十三招？嶽靈珊出劍，使的都是嵩山精妙劍法，卻又連左冷禪都沒見過。左冷禪看得入迷，十三招已過。左冷禪使出絕世神功，嶽靈珊劍刃寸斷，折成數十截掉在地下。勝負難定，但眾位英雄看得明白，顯然是左冷禪功夫高明得多。</p>\n<p>左冷禪登臺受任掌門，嶽靈珊認為左冷禪劍法不能勝過爹爹。岳不群經過一番謙虛，登臺比劍。眼看岳不群敗陣，左冷禪手心中了一針，詭秘之極。劍法一變，兩人劍招路子極為相似，劍法既快又奇。盈盈和令狐沖同時想到一個人：東方不敗。兩人所使的，正是當日東方不敗用的功夫。左冷禪一聲長叫，雙眼已被刺瞎。左冷禪長劍一抖，自中震斷，仰天大笑，飛身下臺。</p>\n<p>岳不群不再推辭，坐上掌門席位，安頓五嶽各派事務，走到令狐沖面前，第一次和顏悅色地叫“衝兒”，邀請他一同回華山，跟師孃聚聚。令狐沖感到莫名的恐懼，不敢再回華山。</p>\n<p>心理分析</p>\n<p>精神分析心理學有一個很重要的概念，叫理智化。理智化是一種防禦機制，通過思考一些非常高深的大道理，來回避真實的情感，這就是理智化。理智化普遍存在於一類人群，是知識分子。用得過多，就會成為心理障礙。莎士比亞作品裡有一個理智化的典型例子：哈姆萊特。哈姆萊特在想到復仇的問題時，猶豫不決，因為他覺得，復仇不僅僅是個人的問題，而是整個國家、整個社會的問題。通過思考國家、社會的大問題，來回避個人情感，這就是典型的理智化。</p>\n<p>生活中的例子不會像哈姆萊特表現那麼典型，但也還是非常常見，挺容易識別。比如說，他們都有一些共同的特點，愛探討高深的問題，愛講道理，很少涉及私人情感問題。迫不得已，非要談到的時候，也能擺出一些堂而皇之的大道理，作為回答。你問他：“你戀愛嗎？”他可能回答：“人都是有追求的，人生的終極目標，是超越現實，擺脫現實的困擾，達到‘道’的境界，冥冥之中感受宇宙中生命本源的力量，那才是人生最高級的享受和追求。至於戀愛問題嘛，那不過是人生的一小部分，不是我們追求的全部，不能把它當成人生唯一的追求目標。”你再問他：“你吃飯嗎？”他會回答：“吃飯乃是人生最基本的需求，不吃飯怎麼行呢？不吃飯的人不就餓死了嗎？餓死了的人，死是完全沒有價值的，人怎麼會去做這種沒有價值的犧牲呢？”</p>\n<p>有人馬上會想到一個人物，《大話西遊》裡的唐僧。經典臺詞之一：“悟空你也真調皮呀！我叫你不要亂扔東西，亂扔東西是不對的。哎呀！我話沒說完你怎麼把棍子扔掉了？月光寶盒是寶物，亂扔它會汙染環境，砸到小朋友怎麼辦？就算砸不到小朋友砸到花花草草也不好嘛！”一聽就想抽他嘴巴，但是又拿他沒辦法，因為他的確沒說錯。這也是理智化的一個特點，他的話明明很讓人憤怒，但又挑不出錯誤，只能讓你鬱悶。唐僧到處是這樣的經典臺詞，也難怪孫悟空痛苦無比。有人願意用自殺來避免聽他囉唆，也是可以理解的。</p>\n<p>一些長輩說話的時候也有這個特點，愛擺出一副教育人的姿態：“我們現在來談談關於孩子早戀的問題，你們這些年輕的孩子，都太幼稚，沒有經歷過生活的磨難，不知道幸福來之不易。不懂得把握青春，好好學習，將來做一番努力，當大有作為。年紀輕輕怎麼就去考慮那些成年人的問題呢？事業有成，找個對象是很容易的事情，現在浪費青春，不好好把握，將來一事無成，那還談什麼成家立業？”相信不少早戀的朋友都遭受過這種受教育的痛苦，因為有這個毛病的前輩，大有人在，實在不止一個兩個。</p>\n<p>乍一看，理智化的人所說的這些道理，似乎都對。事實上也的確都對，那為什麼還那麼遭人反感？為什麼要說他們是病態的，不健康的？問題在哪？有什麼害處？</p>\n<p>害處就在於，說這些道理的時候，道理本身會矇蔽我們真實的感受。相應的感受得不到表達，而只是通過想一個道理，道理想明白了，感受也就被壓下去了。習慣於此，我們就會不自覺地用道理來壓抑感受。壓抑太多，心理問題也就出現了。理智的人壓抑情感比較徹底，什麼樣的情感都可以通過想道理來壓抑，但相對來說，理智的人壓抑最多的是憤怒。所以我們會發現，那些平日裡特別理智，從來不動怒，特別講道理的人，偶爾發怒的時候會暴怒，憤怒起來非常強烈，特別恐怖。另外一點，由於他本身壓抑憤怒很多，所以他跟你講道理的時候，背後是經常帶憤怒的，但他自己會把憤怒隱藏，然後給你講大道理。情緒只能在表面上隱藏，實際上是藏不住的，你能感覺到他的憤怒，所以聽他說話你也會憤怒。只是說不上來為什麼憤怒，所以會感覺很難受，又想憤怒，又覺得無從表達，因為他的話都是對的，沒有什麼漏洞可以挑。</p>\n<p>以上面長輩的談話來說，他一定對你早戀有不滿，背後的情緒可能是憤怒，也可能是擔心，或者什麼別的，總之會有一個情緒。但理智的人不願意承認，他會把這個情緒隱藏，要擺出很理智的樣子，只跟你說道理。假如他隱藏的是憤怒，那麼你聽他說話的時候也會憤怒，這其實是最正常的反應。但假如你想從他談話的內容來找問題，那是找不到的。因為他的問題根本不在這兒。所以會讓你非常痛苦，明明知道很難受，就是說不清楚為什麼難受。想挑毛病，又找不出什麼毛病。</p>\n<p>內心情感壓抑多的人，都特別容易受到傷害。所以越是理智的人，越容易被別人的話傷到，然後不願意承認，繼續用想道理來壓抑。壓抑更多了，那就又更容易受傷害。所以往往是那些什麼事都直說的人，不太容易受到傷害。受到傷害的時候當場直說，事情過了也就完事了。理智的人表面上不說，似乎不難受，其實不是的，往往越是理智的人，越是小心眼，什麼小事情都能傷到。</p>\n<p>舉個例子，一個宿舍吃西瓜，剛好是那個理智的人沒吃到。假如換做是一個情感表達比較直接的人，當場就會有反應：“你們這樣做沒有考慮到我，對我不公平，讓我很難受。”說完之後，這事當場就可以直接解決。而一個理智的人，就會滿不在乎，然後跟自己說：“個人的品德，道德修養是有差距的，分西瓜不能考慮到我，他們考慮問題的全面性還有待提高啊。”可以看出，這些話裡完全沒有涉及他的個人感受。但這事顯然不會讓他心裡舒服。其實他心裡是難受的，但不承認，也就那麼壓抑過去了。這樣的小事不斷積累，積累，積累越多，他就越不願意承認，心裡也就越難受。</p>\n<p>那有沒有人是真的不難受呢？也倒是有。心理諮詢研究中發現一個特別有意思的現象，任何一類心理問題，都有兩個相應的極端，一種是特別健康的，一種是特別病態的。這兩個極端單從表面上看的話，非常相似，特別不容易區分。就像上邊吃西瓜的例子，一個大解脫的，特別健康的人，的確能看到個人修養差距，沒分到西瓜也是快樂的，而且是真心的快樂。這個理智的人，從表面上看，他似乎也有很高境界的修養。其實區別是有的，區別在於，前者的感受是真實的，後者是虛假的。他那麼說不是因為真的感受到，而只是因為覺得應該那樣。</p>\n<p>岳不群的例子最能說明問題，每次發言都是長篇大論，很理智，很像一個道德修養極高的真君子，但仔細分辨你就會發現，那些話並不是他真心體悟到的，只是為了表現正人君子的作風而故意造作的。這種情況有一個巨大的危險，就是那兩個極端的差異，裝得越像，越難以區分，說明病態的程度越深。因為如果不是真實的話，越像健康的人，心理問題越嚴重，也就是越病態。岳不群就隱藏得特別好，一般人很難從他的行為本身挑出什麼毛病。但是搞心理諮詢的人應該很早以前就可以從中捕捉到很多不健康的信息。比如說岳不群這個人很容易動怒，但是怒氣只在臉上稍微一顯現，立即就被他壓下去了。金庸的這個描寫極為準確，正是理智而又不健康的人最常見的表現。他不是沒有怒氣，是壓抑太深，隱藏太好，不容易被人察覺。</p>\n<p>前面作了分析，越是這麼理智的人，守得越嚴，也越容易受到傷害。我們知道華山上下，最忌諱提到的一個詞語就是“偽君子”，對一個真正健康的人來說，提就提了，心裡不會難受，也不用迴避。就是對一個普通人來說，比如令狐沖，別人罵他“偽君子”的話，他多半不會很在乎，因為我本來就不是君子。反而是裝得特別像君子的人，內心才會特別在乎。因為那是他內心最容易傷痛，防守最嚴密的地方，特別不希望被人觸碰到。</p>\n<p>岳不群突然表現出卑鄙的地方，就會讓很多人難以理解：</p>\n<p>岳不群矮著身子，向外飛了出去。左冷禪左手掌心中但覺一陣疼痛，舉手一看，只見掌心中已刺了一個小孔，隱隱有黑血滲出。他又驚又怒，罵道：“好奸賊，不要臉！”心想岳不群在掌中暗藏毒針，冷不防在自己掌心中刺了一針，滲出鮮血既現黑色，自是針上煨毒，想不到此人號稱“君子劍”，行事卻如此卑鄙。</p>\n<p>非常理智的人，內心太容易受傷害，所以千萬不要被表面現象騙過，以為他們大度，不在乎。表面上裝得越像，防得越嚴，恰好說明心眼越小，因為越容易受傷。岳不群已經是一個特殊的極端，一般人要發現他的問題，非常困難。因為他已經隱藏得太好，藏得太深。但從心理分析的眼光來看，顯然能發現他的問題已經非常嚴重。這就不難理解，為什麼最黑暗、最卑鄙的勾當反而是這個號稱“君子”的人乾的。</p>\n</div>"},{"title":"第三十三章　失明","content":"<div>\n<p>第三十三章　失明</p>\n<p>故事梗概</p>\n<p>恆山派當晚便在封禪臺過夜，聽到餘滄海的聲音，林平之約了他到這兒索還血債。林平之出怪招拿住對方要穴，令狐沖和盈盈又是同時想到一個人：東方不敗。林平之使的招數，跟東方不敗是同一路子。</p>\n<p>第二日下峰，在一家茶館遇上青城派，林平之和嶽靈珊跟到，林平之快如閃電般刺死一名青城派弟子，策馬馳去。中夜，兩乘馬奔來，又是林平之夫婦。林平之嘴裡喊著：“辟邪劍法，第二招，第三招。”青城四名弟子，把劍插入自己小腹，另外兩名，互相把劍刺入對方胸膛。馬蹄聲響，夫婦倆又縱馬馳來，青城派改變策略，六名弟子圍攻嶽靈珊，想逼林平之分心，哪知林平之只顧復仇，完全不在乎妻子死活，盈盈出手相救。</p>\n<p>木高峰擒住嶽靈珊，飯店相遇。林平之殺死餘滄海，一劍刺中木高峰駝背，黑水激射而出，竟是劇毒，林平之雙目失明。林平之自嘲，這雙眼睛也不是今天才瞎的。岳不群派女兒去福州，便是圖謀林家劍譜。收養林平之，招為女婿，也都是為了劍譜。林平之和嶽靈珊，有夫妻之名而無夫妻之實，為了修煉辟邪劍法，林平之早已揮刀自宮，成了不男不女之身。</p>\n<p>心理分析</p>\n<p>諮詢中會碰到一類比較特殊的案例，是突發性的生理反應。甚至很多時候能讓諮詢師感覺到這種生理反應是“裝”的，但你仔細觀察的話，來訪者也的確沒有假裝，他/她的生理反應是絕對真實的。比如有的人突然說自己癱瘓了，然後手腳不能動了。來訪者並不是有意跟你開玩笑，通過醫學檢測就會發現，他/她的確出現癱瘓了。但經過心理分析處理之後，癱瘓又會戲劇性恢復健康。</p>\n<p>我們的一個同事，某天下午要開記者招待會，回答一些相關的問題。以前也沒有接觸過這樣的事情，這是初次面對記者，初次面對這麼多臨場的提問。他提前十多分鐘到了會場，之後突然發現自己嗓子啞了，真的啞得很厲害，幾乎說不出話來，喝了很多水也沒有效果。當時有一個高級諮詢師在場，諮詢師告訴他：“你有些緊張，但是沒關係，雖然嗓子啞了，招待會還是照常。五分鐘後，你的嗓子就會恢復正常。”果然五分鐘後，他又正常說話了。這裡嗓子啞就是個潛意識反應，其實他是不想面對招待會，試圖通過嗓子啞來逃避。諮詢師的話等於告訴他，你其實是因為緊張，緊張可以理解，但是會議還是逃不了的。所以他的嗓子又會玩笑般地恢復正常。</p>\n<p>筆者有一次，正在教室裡聽課，那天的主題是“鬼”。我試著看了一下自己的“鬼”，頭髮髒亂，戴個眼鏡，穿灰白的衣服和褲子，神情特別抑鬱，整個人像被朦朧的灰色遮蓋著，就像剛喝過酒的樣子，頹廢邋遢。我當時一看就覺得挺不舒服，就不看了。回到宿舍它又不斷地在腦海裡冒出來，這一看，我馬上開始狂吐，斷斷續續吐了兩個小時。宿友們都很奇怪，我那天在食堂吃的東西，跟往常一樣，沒有道理嘔吐。後來發現，我自己的確有那麼一個側面，有時候抑鬱邋遢。而我對自己的這個側面又很不接受，嘔吐剛好是不接納的表現。</p>\n<p>如果讀者朋友沒有能親自體會這種感受，也不用因此而感到遺憾，其實很多人都有過的，只是不記得了。回憶一下夢，會發現很多人都在夢中有過失明，夢裡自己突然眼睛瞎了，什麼都看不見，這種感受並不舒服，又不知道還會不會復明，只有突然從夢中醒來，才會長長地鬆一口氣，幸虧只是個夢。</p>\n<p>有的來訪者，經常一驚一乍，有時候突然宣佈自己失明，然後就真的失明瞭。眼睛根本沒有經歷什麼重大的災難，似乎只是來訪者希望它失明，然後它就失明瞭。去醫院做檢查，他/她的視網膜，或者別的什麼地方還真出了點問題，的確看不見東西了。這種病還有一個非常奇怪的特點，醫學上沒有辦法治療。即使已經有了治療技術，並且主治的醫生非常有把握，結果也往往治不了。通過心理分析就會發現，這類病人都在失明的時候遇到比較大的創傷，而眼前的創傷事件是他/她特別不願意面對的。</p>\n<p>在給來訪者做意象的時候，來訪者在意象中也多半瞎眼了。除了這種來訪者，就一般人而言，也基本上都會出現類似的情況，經常有人說：“我看不見，什麼都看不見。”“我的眼睛睜不開。”“有一層薄膜矇住了我的眼睛。”“我眼前是一張大屏幕，擋住了，我什麼都看不見。”“我眼睛很疼，不能再看了，絕對不能再看了。”“我的眼前就是一片紅色，其他的什麼都沒有。紅色遮住我的眼睛了，什麼都看不見。”</p>\n<p>如果繼續用心傾聽，就會知道，來訪者說上面話的時候，背後還有一句潛臺詞是暫時沒有說的：“我不想看。”經過諮詢師的堅持，不讓來訪者放棄，那麼很快就會恢復正常，有的人快，有的人慢。看對方不想看的程度有多嚴重，特別嚴重的情況，來訪者無論如何看不見，那就可能真的永遠看不見。</p>\n<p>現實中的大多數病例而言，失明不會帶有那麼明顯的戲劇性，但是經過仔細分析的話，也都能找出相應的心理原因，人不會隨便就失明的。即使是生理性的損傷，也同樣會有相應的心理原因，因為為什麼選擇那個特定的時間失明，是今年的某一天而不是其他的時間，這就不完全是偶然的。潛意識希望失明，生理的損傷只不過是一個過程，結果都是要失明的。不管是不是戲劇性的，不管有沒有外界的客觀原因，不管有沒有真實的損傷，失明都有一個最基本的心理原因：碰到了不願意面對的事情，我不想看，不忍心看。所以就失明瞭，失明就可以看不見了。</p>\n<p>分析林平之的心理，會發現他的失明也並不是偶然，他甚至自己也清楚，瞎眼也不是今天的事情，從出手阻止別人調戲“良家婦女”那一刻起，自己就已經瞎眼了。</p>\n<p>林平之縱聲大笑，側身退開。他大仇得報，狂喜之餘，未免不夠謹慎，兩步退到了木離峰身邊。木高峰駝劍狂揮而來，林平之豎劍擋開，突然間雙腿一緊，已被木高峰牢牢抱住。林平之吃了一驚，眼見四下裡數十名青城弟子撲將上來，雙腿力掙，卻掙不脫木高峰手臂猶似鐵圈般的緊箍，當即挺劍向他背上駝峰直刺下去。波的一聲響，駝峰中一股黑水激射而出，腥臭難當。這一下變生不測，林平之雙足急登，欲待躍頭閃避，卻忘了雙腿已被木高峰抱住，登時滿臉都被臭水噴中，只痛得大叫起來。這些臭水竟是劇毒之物。原來木離峰駝背之中，竟然暗藏毒水皮囊。林平之左手擋住了臉，閉著雙眼，揮劍在木高峰身上亂砍亂斬。</p>\n<p>林平之冷笑道：“我說話不要臉？到底是誰不要臉了？”手指草棚之外，說道：“這姓餘的矮子、姓木的駝子，他們想得我林家的辟邪劍法，便出手硬奪，害死我父親母親，雖然兇狠毒辣，也不失為江湖上惡漢光明磊落的行徑，哪像……哪像……”回身指向嶽靈珊，續道：“哪像你的父親君子劍岳不群，卻以卑鄙奸猾的手段，來謀取我家的劍譜。”嶽靈珊正扶著土牆，慢慢站起，聽他這麼說，身子一顫，復又坐倒，顫聲道：“哪……哪有此事？”林平之冷笑道：“無恥賤人！你父女倆串謀好了，引我上鉤。華山派掌門的嶽大小姐，下嫁我這窮途末路、無家可歸的小子，那為了什麼？還不是為了我林家的辟邪劍譜。劍譜既已騙到了手，還要我姓林的幹什麼？”嶽靈珊“啊”的一聲，哭了出來，哭道：“你……冤枉好人，我若有此意，教我……教我天誅地滅。”林平之道：“你們暗中設下奸計，我初時矇在鼓裡，毫不明白。此刻我雙眼盲了，反而更加看得清清楚楚。你父女倆若非有此存心，為什麼……為什麼……”</p>\n<p>林平之站定了腳步，大聲道：“你要怎樣？若不是我瞎了眼，受了傷，你便要殺我，是不是？我一雙眼睛又不是今天才瞎的。”嶽靈珊道：“原來你當初識得我，跟我要好，就是瞎了眼睛。”勒住韁繩，騾車停了下來。</p>\n<p>林平之這個人物，也實在是一大悲劇，父母雙亡，他之所以忍辱偷生，只有一個目的，就是要替父母報仇雪恨。他為此而付出了常人難以想象的代價，寄人籬下，只圖活命。修煉辟邪劍法，揮刀自宮，自己成了不男不女之身，為掩人耳目，娶了個妻子，有夫妻之名而無夫妻之實。岳不群盜走劍譜，林平之是劍譜真正的傳入，那麼岳不群肯定要殺他滅口。他娶了岳不群的女兒，整天跟她在一起，就可以用她做擋箭牌，暫時自保。</p>\n<p>一個人如果只為了某個目標而堅強地活著，別無它求，可以將其他所有的欲求徹底壓抑，那麼突然有一天目標實現了，那也就意味著精神支柱坍塌，整個人的心靈特別容易在這種時候崩潰，因為已經失去支撐點了。林平之大仇報了，他活著唯一的目標實現了。在這之前，起碼活著是有理由的，他可以為了那個目標而頑強拼搏，現在掙扎的理由失去了。剩下的是什麼？沒法過正常的夫妻生活，也沒法過正常人的生活。落得個不男不女之身，誰都知道這是特別傷人尊嚴的一件事情。而對於林平之來說，還有更大的麻煩。過去岳不群之所以留了活口，並不是考慮到女兒的終身，岳不群沒那麼仁慈，暫時沒殺死林平之，是因為還不知道他練了辟邪劍法。現在林平之殺了餘滄海等人，岳不群馬上就會知道，知道他也練了辟邪劍法，肯定要立即滅口。</p>\n<p>大仇得報的事實，對林平之來說，其實很殘忍。既有報仇雪恨巨大的興奮，又有面對現實的痛苦。這一切太過於殘酷，接下來的事實沒有辦法面對，不忍目睹。所以選擇這個時刻失明，最合理不過。</p>\n</div>"},{"title":"第三十四章　辟邪劍譜","content":"<div>\n<p>第三十四章　辟邪劍譜</p>\n<p>故事梗概</p>\n<p>青城派弟子點了火把追趕林平之夫婦，想趁二人失明受傷之際，拼死一擊。一直躲在車頂的勞德諾，出手把青城弟子殺散，原是奉了左冷禪之命，前來護送。左冷禪中岳不群之計，練了假辟邪劍法，岳不群以真對假，才操了勝算，從他手中奪取五嶽掌門一席。此刻隱居嵩山西峰，連同壞了雙目的十來人，成立辟邪劍門。邀林平之加入做掌門，傳授真正的辟邪劍法，將來共報大仇。為向左冷禪表明心跡，林平之當場殺害嶽靈珊。</p>\n<p>盈盈和令狐沖一起給嶽靈珊守墳，嶽夫人被魔教徒抓獲，設計引岳不群上鉤，挖了大坑，在坑裡撒上迷魂藥。突然聽到盈盈的叫聲，被岳不群追趕，盈盈讓令狐沖快逃，師父要殺他。盈盈揭穿了岳不群自宮的秘密，岳不群提劍砍下，令狐沖搶身而出。鬥到兩百餘回合，令狐沖從師父劍法中找到破綻，一劍對方腋下，但又忍手不殺。令狐沖拋下手中長劍，回頭看盈盈，岳不群長劍電閃般砍落，正好失足掉入坑中。</p>\n<p>嶽夫人萬念俱灰，給令狐沖包紮了傷口，匕首插心臟自殺。令狐沖不願意殺師父，盈盈給岳不群服了“三尸腦神丹”，岳不群驚恐萬分。將嶽夫人遺體在嶽靈珊墓旁葬了，令狐沖又大哭一場。打算到恆山一行，把掌門之位傳給儀清，此後心無掛礙，便可和盈盈浪跡天涯，擇地隱居。</p>\n<p>心理分析</p>\n<p>嶽靈珊被殺，嶽夫人自殺，都跟辟邪劍譜有很大關係。嶽靈珊臨死還託付令狐沖照顧丈夫，怕林平之孤苦伶仃，人人都欺侮於他。林平之家破人亡，禍起辟邪劍譜，為替父母報仇雪恨，這才一心鑽研辟邪劍法。岳不群修習辟邪劍法，害死女兒，害死夫人，害死華山八師弟，還差點害死令狐沖，至此已經幾乎泯滅人性，這一切都是由於辟邪劍譜，所有的禍端最終都是起源於辟邪劍譜，似乎辟邪劍譜是所有災難和禍害的來源。</p>\n<p>其實，所有的禍端在人不在物。辟邪劍譜只是一個象徵，一個閹割象徵，練這門劍法的人，首先要自宮。這是身體上的閹割，身體上的閹割在古代比較常見，為了權力，為了地位，也有的人為了生存，願意摧殘自己的身體，作為代價，去做太監。很多人誤以為，閹割這種現象，已經隨著太監文化的消失而被取消。其實，閹割不僅是身體上的，它也是心靈上的，只要有願意閹割的人存在，它就不會消失。現代社會依然有大量的人群，願意主動選擇閹割，閹割自己的靈魂。</p>\n<p>這裡所說的閹割，跟現在所謂的變性，身體上的閹割，不是一回事。只要願意閹割，在任何情況下都可以。人對自己心靈的閹割，不見得就比身體上的閹割更高尚。心理學研究發現，有些人其實是生錯了性別的。每個人心理上都不是單一性別的，男人身上有女性的一面，女人身上也有男性的一面。有的人生錯了性別，是指生理性別和心理性別的不符合。比如很多男同性戀中扮演女性的一方，心理分析發現這個人從生下來那天開始，就沒有做過真正的男人，他的心理一直就完全是女性的。這樣的人，變性對他來說，未必是件壞事。當然，筆者這麼說，絕對不是要提倡更多數的人去做變性手術，只對少數生錯了性別的人適合。如果有人沒有生錯性別，也偏要去割上一刀，那就是作踐自己的身體，也摧殘自己的心靈。</p>\n<p>非常有意思，在左冷禪眼睛被刺瞎以後，去嵩山西峰成立了一個門派，叫辟邪劍門，一個人受害，兩個人受害，緊接著受害人群逐漸擴大。左冷禪受了假辟邪劍譜之害，不是好自為之，是繼續去尋求真的辟邪劍譜，即使知道是火坑，也還是有人願意往火坑裡跳。這個門派，很有把辟邪劍法發揚光大的氣勢。</p>\n<p>勞德諾又道：“我恩師壞了雙眼，此時隱居嵩山西峰。西峰上另有十來位壞了雙目之人，都是給岳不群與令狐沖害的。林兄弟隨我去見我恩師，你是福州林家辟邪劍門的唯一傳人，便是辟邪劍門的掌門，我恩師自當以禮相待，好生相敬。你雙目能夠治癒，那是最好，否則和我恩師隱居在一起，共謀報此大仇，豈不甚妙？”</p>\n<p>不僅僅是小說裡有這麼多人願意為辟邪劍譜拋頭顱灑熱血，現實生活中，閹割主題的夢依然普遍存在人們的夢境裡。夢裡被手術，被刀劃，被針刺，被截肢，這些都是很常見的閹割主題的夢，但也都還可以理解，可以接受，因為這是被動的。如果有人在夢裡就願意隨便用刀劃自己的身體，用針扎自己的大腿，用刀砍下自己的肢體，那就跟岳不群等人的行為沒有多大差別了。</p>\n<p>辟邪劍法乃是太監所創，而且第一關就很損人，傷害人格尊嚴，按理應被世人所不齒。事實卻又剛好相反，很讓世人痴迷。表面看來，原因都在於習武之人對高深武學的好奇和上進心所迫，但是仔細分析就可以看出，那只是一個非常表層的原因。理解了閹割心理的普遍性，就可以知道為什麼會被那麼多人歡迎。修習辟邪劍法的，有岳不群、勞德諾，把他們的故事放在一起，很容易看出，他們修習劍法，其實都另有原因所在，有更深層的心理動機，並不只是為了滿足好奇心。他們對自己心靈的閹割，也不是從修習劍法那天開始的，事實上很早以前就已經開始閹割，割身體只是其中的一個過程。到達割身體的病態程度，他們的心理病態一定不是突然的，不會是一天兩天的事情。</p>\n<p>岳不群：圖謀辟邪劍譜，讓女兒下福州。收養林平之，招為女婿。盜走辟邪劍譜，嫁禍令狐沖。襲擊林平之，殺死華山八師弟。少林寺比劍，有意輸給令狐沖，掩人耳目。假裝不知道勞德諾身份，篡改辟邪劍譜，故意讓他偷走，好讓左冷禪修習假的辟邪劍法，自己在背後穩操勝券。岳不群做這一切，背後都有一個目的，要坐上五嶽掌門席位。只不過左冷禪是明著做，岳不群是背地裡玩陰招，最後也如願以償。少林寺那次比劍很特別，岳不群故意把自己的腿折斷了。熟悉解夢的人知道，折斷腿，這跟動刀割生殖器，很有異曲同工之妙，都是一個意思，是傷自己身體的閹割主題。岳不群用心良苦，做這麼精心的設計去做掌門，背後起作用的是權力動機，他的問題可歸結為：為了權力泯滅人性，這種閹割在中國歷史上最為常見，最有代表性。</p>\n<p>左冷禪：已經貴為嵩山掌門的他不感到滿足，他有四步大的計劃，前面的章節裡提過，大概就是合併五嶽，吞噬周邊勢力，蠶食少林武當，最後率領少林武當，把魔教挑了，一併剷除。他為此而做了不懈的努力，諸如殘殺恆山女弟子，試圖一舉把恆山消滅，又在少林山下大舉埋伏，打算殲滅由令狐沖率領上山的天下各路英雄。最後都為了一個目的，成就他個人的霸業。這樣的人物我們也可以在歷史上數出不少，他們雄心勃勃，一心建立前所未有的偉業。看起來都是要做五嶽掌門，但他的這類問題跟岳不群還是有區別的，他為的是霸業，雄圖大略，而不僅僅是對權力感興趣。他閹割的是良心，為了霸業，可以讓擋道的無數人作出流血犧牲，在江湖上製造血雨腥風。</p>\n<p>林平之：這是別人棋局裡一名無辜的受害者，父母被人殺害，為報父母大仇，忍辱偷生。為了活命，又把自己的妻子推向深淵，娶岳不群的女兒只是用她做個擋箭牌，順便還可以掩人耳目。修煉辟邪劍法只是為了替父母報仇雪恨，他閹割的是做人的尊嚴。很多無辜的受害者都願意做這樣的選擇，歷史上很大一部分太監，如果可以，他們也不願意隨便作踐自己的身體，出賣靈魂。迫於無奈，才會出賣尊嚴，降低最基本的人格尊嚴標準，苟且偷生。</p>\n<p>勞德諾：他是受了師命，到岳不群門下做臥底，觀察岳不群的舉動，瞭解他的武功進展。沒想到反被岳不群利用，偷走假辟邪劍譜，害得師父所有宏偉的計劃全部泡湯。因為自己的閃失，心存內疚，願意練好辟邪劍法，替師父報此大仇。他閹割的是個體的獨立性，似乎生來就只能為左冷禪效命，不管他老人家的雄才大略有沒有發揮在適當的地方，從一開始，勞德諾這個人就沒有自己的立場，沒有選對人，沒有選好效命的對象。</p>\n<p>剩下那十來個盲人，修煉辟邪劍法也都有自己的目的，為了將來能找令狐沖報仇。顯然對於修煉辟邪劍法的人來說，劍法本身都不是他們最終的目的，都只是通過修煉辟邪劍法來達到其他的目的。這個劍法本身就挺邪門的，願意選擇它，願意閹割自己的，也都不是出於什麼健康的心態，他們的心理問題由來已久，閹割過程早在修煉以前就開始。</p>\n<p>關於閹割的心理問題怎麼處理，這才是最麻煩的事情，因為這不完全是一個心理學的問題。筆者曾經就這個問題請教過朱建軍老師：“如果做太監可以延年益壽，那又何嘗不可以？”朱老師的回答是：“這是個人選擇的問題，我沒有權利干涉別人做這樣的選擇，我只能說，如果是我，我自己不願意做這樣的選擇，不願意就是不願意。”</p>\n</div>"},{"title":"第三十五章　一家三口","content":"<div>\n<p>第三十五章　一家三口</p>\n<p>故事梗概</p>\n<p>盈盈給令狐沖化了裝，扮成懸空寺的聾啞僕婦，令狐沖獨自上見性峰，盈盈在附近遊山玩水。到了見性峰，聽到兵刃聲響，儀和儀清正在安排儀琳抓緊練劍。儀琳劍法不長進，頭腦裡整天想著令狐沖。兩位師姊替她著急，希望她刻苦練劍，殺死岳不群，替定閒定逸兩位師太報仇，好接任恆山掌門。令狐沖細細想來，當日在少林寺中，的確只有師父能用針刺死兩位師太。</p>\n<p>院裡樹上被吊了八人，額頭刺了字：“陰謀已敗，小心狗命！”十餘人被點穴道，旁邊寫了幾個字，又是“陰謀已敗，小心狗命！”樹上又吊了兩人，是不戒和田伯光，身上掛了帶子，不戒帶子上寫著：“天下第一負心薄倖、好色無厭之徒。”田伯光寫的是：“天下第一大膽妄為、辦事不力之人。”</p>\n<p>令狐沖被儀琳拉走，傾訴心聲，顯是把令狐沖當做聾啞婆婆了。不戒差點上吊自殺，是因為那條帶子，上面的話是不戒的老婆，儀琳的媽媽當年對不戒說的。不戒誇獎一少婦長得好看，老婆因此吃醋，離家出走，留了個條，寫的就是那八個字。</p>\n<p>聾啞婆婆抓住令狐沖，給他剃了光頭，逼他選擇，要麼做太監，誰都娶不了；要麼做和尚，娶兩個，儀琳和盈盈。原來聾啞婆婆就是儀琳的媽媽，在懸空寺隱居，不戒連關外的尼姑庵都找遍了也沒找到她。盈盈也被她抓了來。儀琳聽說令狐沖要娶自己，並不感到高興，而是堅決不同意，她知道令狐沖愛的是任大小姐。儀琳走後，婆婆也跟了出去。</p>\n<p>心理分析</p>\n<p>和尚爹爹</p>\n<p>不戒和尚一家人都很有特色，說話做事非常古怪。這一家三口人的組成上就十分古怪，父親是和尚，母親是尼姑，和尚娶尼姑，生個女兒還是尼姑。做了爹爹的和尚，絲毫不像個父親的樣子，他一出場，總是讓人又好笑又好氣。他的行為方式完完全全不像成年人，倒像個孩子，幼稚得有些天真。你會覺得他非常可愛，但完全不顧後果的做法，又讓人擔心，也讓人心寒。</p>\n<p>成年人其實都多少會保留一些孩子氣，甚至在精神分析諮詢師的眼中，成年人的行為方式基本停留在童年階段，因為正常人身上都可以明顯找到童年情感的影響。成年人身上保留孩子氣，並不是一件壞事，有時候反而特別好，因為時不時透露一點孩子氣的成年人，會讓人感覺到特別可愛，像個孩子一樣討人喜歡。</p>\n<p>有的成年人不接受自己幼稚的地方，那僅僅是跟自己過不去，可能戀人欣賞的正是那一點點幼稚，周圍人也一般都會比較喜歡。但這也僅是就少許的孩子氣而言，如果某方面的孩子氣成為一個癥結，成天撒嬌和耍脾氣，使性子，就未必能讓人接受。人的心理年齡絕對不跟生理年齡成正比，有的人活到老也還就是一孩子。</p>\n<p>但也分兩種不同的情況，正常情況下，人到老年，心理都會迴歸童年，所以我們會看到，老年人最接近小孩子，特別容易傷感，容易掉眼淚，容易像小孩子一樣耍脾氣。這樣的迴歸是健康的，那是在經歷心理的成熟階段之後，又再次返璞歸真。另外一種情況看起來非常相似，是不戒和尚一類，實際上這兩種情況是非常不一樣的，後一種情況，他不是迴歸，是從來就沒長大過。從心理年齡上，我們可以說他從來就只是一個孩子，沒有跨入過成年，更不可能再進入老年階段了。</p>\n<p>筆者遇到過一個成年男人，他不相信成年人身上會有孩子氣，排著胸脯說：“我自己就沒有。”說這句話的時候，拍著胸脯說話的那種感覺，就特別像一個孩子，非常有自豪感。很多時候都是這樣，一個人固執地認為自己沒有孩子氣，他/她當時的那股倔強、固執之氣，在旁人看來，能很清晰地感覺到，背後起作用的，正是一股孩子氣。一個平時認為自己很堅強，很成熟的人，到了諮詢小組上也往往哭得稀里嘩啦，甚至又哭又鬧。不管我們承不承認，成年人身上都多少會有一些孩子氣，有一些不成熟的地方。這可能也是精神分析學說能夠立足的一個關鍵，儘管不斷受到批評，它也還是存在，並沒有因為受到攻擊而崩潰，相反，它在心理諮詢中至今依然佔有非常重要的地位。</p>\n<p>在看到不戒和尚幼稚的表現，一般人會有些難以接受，不能接受他的思維方式，也不能理解他古怪的行事方式。但如果清楚了他心理年齡所處的階段，就會發現，他說話和做事的方式都非常符合年齡特點，並不是有意作怪。</p>\n<p>不戒和尚的心理年齡，筆者個人感覺，它可能大概停留在幼兒階段：</p>\n<p>儀琳又道：爹爹嘆了口氣，說道：‘你娘本來是個尼姑：你是知道的了。我一見到你娘，就愛得她發狂，說什麼要娶她為妻。你娘說：“阿彌陀佛，起這種念頭，也不怕菩薩嗔怪。”我說：“菩薩要怪，就只怪我一人。”你娘說：“你是俗家人，娶妻生子，理所當然。我身入空門，六根請淨，再動凡心，菩薩自然要責怪了，可怎會怪到你？我一想不錯，是我決意要娶你娘，可不是你娘一心想嫁我。倘若讓菩薩怪上了她，累她死後在地獄中受苦，我如何對得住她？因此我去做了和尚。菩薩自然先怪我，就算下地獄，咱們夫妻也是一塊兒去。’”</p>\n<p>幼兒是完全不具備獨立性的，沒有辦法獨立生存，只能依靠別人來餵養，所以它有一個特點，只能向別人要，想要就要，沒有任何顧慮。但是向別人要的那個力量是挺足的，肚子餓了它可以哭啊鬧啊的，無論用的是什麼方法，一定是要到了才能停止。它不對自己的哭鬧承擔任何後果，也不用考慮要的方式是否恰當，反正想要就是要，無論如何也要要到了才行。要東西的那個勁是很強，很執著的，要不到決不罷休。不戒和尚的做法有些讓成年人難以理解，他要愛的這個勁就挺足的。在成年人看來，愛上尼姑這事本來就挺麻煩的，但對於不戒和尚來說，他不用考慮成年人這一套，有什麼不可以的，我愛，所以我就要娶她為妻，是尼姑沒關係，只要是我愛的，尼姑也可以。你怕菩薩怪罪，那也沒關係，讓菩薩怪罪我好了。我是俗家人，菩薩不會怪罪我，那也還是沒關係，我做和尚不就行了。反正最終有一個目的要達到，那就是娶你為妻。只要能娶你為妻，做什麼樣的犧牲都可以。甚至對不戒而言，根本就談不上是犧牲，因為他還不具備犧牲的能力，不具備可以犧牲的東西，什麼東西對他來說都還是沒有價值的，不存在犧牲，做什麼都可以，能娶你為妻就行。</p>\n<p>我要，所以就要。沒有什麼要的理由，並不是說因為某個東西對我來說實在太重要了，所以非要到不可，要不到的話損失太大了。幼兒還沒有這麼多考慮，反正我想要，所以就要，就是想要而已。不戒和尚也不是說，考慮到我愛她，她也愛我，很難得，所以自己做點犧牲也是值得的，哪怕是讓我出家也可以。不是這樣，他就是覺得，我要娶她為妻，所以就要娶，說什麼都要娶，這就是小孩能折騰的那股勁。成年人其實挺缺這種能折騰的勁，因為要考慮得失，諸多因素加以綜合考慮，有所取捨，患得患失，沒有精力去整天這麼瞎折騰。</p>\n<p>當然，心理年齡具體是多少歲，每個人的感覺可能會有些差異，筆者的看法也並不就是絕對的定論。但有一點可以確定，不戒和尚的心理年齡肯定是比較小的，再大幾歲也大不到哪去。一般說來，小孩思維都有一個特點，就是單一性，單向性，小孩的思維不會像成年人一樣轉彎，所以有時候會覺得不戒和尚那個大腦是直著長的，轉不過彎來，單純得有些幼稚可笑。</p>\n<p>儀琳道：爹爹說：事情也真不巧，那時候有個美貌少婦，騎了馬經過門口，看見我大和尚抱了個女娃娃，覺得有些奇怪，向咱們瞧了幾眼，讚道：“好美的女娃娃！”我心中一樂，說道：“你也美得很啊。”那少婦向我瞪了一眼，問道：“你這女娃娃是哪裡偷來的？”我說：“什麼偷不偷的？是我和尚自己生的。”那少婦忽然大發脾氣，罵道：“我好好問你，你幾次三番向我取笑，可不是活得不耐煩了？”我說：“取什麼笑？難道和尚不是人，就不會生孩子？你不信，我就生給你看。哪知道那女人兇得很，從背上拔出劍來，便向我刺來，那不是太不講道理嗎？’”</p>\n<p>這倆人交流起來會比較困難，大和尚覺得，長得美就誇你一句，心中就那麼覺得，所以就誇你一句沒什麼不好。也的確，人家大和尚沒有一句是假話，說的全都是真的。但對方不太容易接受，因為太容易產生調情的嫌疑，大和尚亂生女兒這件事也蠻古怪的，很讓人好奇。</p>\n<p>直到老婆吃醋走了以後，不戒還老老實實地承認，自己確實有問題，既然娶了老婆，就不能誇別的女人長得俊。自己不但心中贊，口中也贊，那不就是負心薄倖、好色無厭麼。傻得可愛！為了尋找妻子，不戒找遍了天下所有的尼姑庵，後來連蒙古、西藏、關外、西域，最偏僻的地方都找過了，人家這股傻勁用的真是地方，特別讓人感動。</p>\n<p>小孩子單純，可愛，能折騰，這些都沒有什麼不好。但是，如果一個成年人的心理年齡始終保持在幼年階段，從來沒有長大，擁有成年人的力量，使用的卻是小孩子的思維，完全按照小孩子的方式行事，有時候是有很大危險的。</p>\n<p>田伯光道：“是，是。我只不過轉述太師父的話而已。他說他老人家要投入恆山派，叫我跟著一起來，第一步他要代女收徒。我不肯答應，他老人家揮拳就打，我打是打不過。逃又逃不了，只好拜師。”說到這裡，愁眉苦臉，神色甚是難看。令狐沖道：“就算拜師，也不一定須做和尚。少林派不也有許多俗家弟子？”田伯光搖頭道：“太師父是另有道理的。他說：‘你這人太也好色，入了恆山派，師伯師叔們都是美貌尼姑，那可大大不妥。須得斬草除根，方為上策。’他出手將我點倒，拉下我的褲子，提起刀來，就這麼喀的一下，將我那話兒斬去了半截。”令狐沖一驚，“啊”的一聲，搖了搖頭，雖覺此事甚慘，但想田伯光一生所害的良家婦女太多，那也是應得之報應。田伯光也搖了搖頭，說道：當時我便暈了過去。待得醒轉，太師父己給我敷上了金創藥，包好傷口，命我養了幾日傷。跟著便遏我剃度，做了和尚，給我取個法名，叫做‘不可不戒’。他說：‘我已斬了你那話兒，你已幹不得采花壞事，本來也不用做和尚。我叫你做和尚，取個“不可不戒”的法名，以便眾所周知，那是為了恆山派的名聲。本來嘛，做和尚的人，跟尼姑們混在一起，大大不妥，但打明招牌“不可不戒，就不要緊了。’”</p>\n<p>對於不戒和尚這樣武功力量比一般的成年人還要強數倍的人物，如果用小孩子的方式行事，後果尤其可怕。這種後果主要是針對他人，針對身邊人而言的。他自己倒無所謂，天不怕地不怕，對他來說，又沒有什麼後果可言，自己覺得是什麼樣，所以就是什麼樣了。不是什麼樣我也可以讓它扭轉，想是什麼樣就是什麼樣，理所當然。成年人會覺得很容易。哪根筋扭住了，把它糾正不就可以了嗎？成年人是這樣，但小孩是不行的，他還就是扭不過那根筋來。比如不戒和尚覺得田伯光上恆山，恆山美貌尼姑不夠安全，這是沒有問題的。但是下一步，成年人的方式會去考慮可以接受的解決方式，而不戒不用，他有一個更為簡單有效的辦法：把田伯光閹了。他覺得是這樣，所以就做了。我們也只能發揮慈悲心，對田伯光表示深切的同情。</p>\n</div>"},{"title":"第三十六章　尼姑媽媽","content":"<div>\n<p>第三十六章　尼姑媽媽</p>\n<p>金庸對這個人物形象的把握，實在準確之極，心理特徵跟相應的外貌高度符合，剛見到她的時候，令狐沖第一感覺覺得她太像鬼了，簡直就是個鬼，完全不像活人。如果讀者朋友想要知道生活中真實的白衣女鬼長什麼樣子，不妨仔細看一下金庸對這個人物的描寫：</p>\n<p>也不知坐了多少時候，無意中向溪水望了一眼，不覺吃了一驚，只見水中兩個倒影並肩坐在石上。他只道眼花，又道是水波晃動之故，定睛一看，明明是兩個倒影。霎時間背上出了一陣冷汗，全其僵了，又怎敢回頭？從溪水中的影子看來，那人在身後不過二尺，只需一出手立時便制了自己死命，但他竟嚇得呆了，不知向前縱出。這人無聲無息來到其後，自己全無知覺，武功之高，難以想象，登時便起了個念頭：“鬼！”想到是鬼，心頭更湧起一股涼意，呆了半晌，才又向溪水中瞧去。溪水流動，那月下倒影朦朦朧朧的看不清楚，但見兩個影子一模一樣，都是穿著寬襟大袖的女子衣衫，頭上梳髻，也是殊無分別，竟然便是自己的化身。令狐沖更加驚駭惶怖，似乎嚇得連心也停止了跳動，突然之間，也不知從哪裡來的一股勇氣，猛地裡轉過頭來，和那“鬼魅”面面相對。這一看清楚，不禁倒抽了一口涼氣，眼見這人是個中年女子，認得便是懸空寺中那個又聾又啞的僕婦，但她如何來到身後，自己渾不覺察，實在奇怪之極。他懼意大消，訝異之情卻絲毫不減，說道：“啞婆婆，原來……原來是你，這可……這可嚇了我一大跳。”但聽得自己的聲音發顫，又甚是嘶啞。只見那啞婆婆頭髻上橫插一根荊釵，穿一件談灰色布衫，竟和自己打扮全然相同。他定了定神，強笑道：“你別見怪。任大小姐記性真好，記得你穿戴的模樣，給我這一喬裝改扮，便和你是雙胞姊妹一般了。”他見啞婆婆神色木然，既無怒意，亦無喜色，不知心中在想些什麼，尋思：“這人古怪得緊，我扮成她的模樣，給她看見了，這地方不宜多耽。”當即站起身來，向啞婆婆一揖，說道：“夜深了，就此別過。”轉身向來路走去。只走出七八步，突見迎面站著一人，攔住了去路，便是那個啞婆婆，卻不知她使什麼身法，這等無影無蹤、無聲無息地閃了過來。東方不敗在對敵時身形猶如電閃，快速無倫，但總尚有形跡可尋，這個婆婆卻便如是突然間從地下湧出來一般。她身法雖不及東方不敗的迅捷，但如此無聲無息，實不似活人。</p>\n<p>鬼是什麼東西？為什麼聾啞婆婆，這個尼姑媽媽會成為這麼奇怪的樣子？</p>\n<p>鬼是情緒的化身，我們內心產生了相應的情緒，這種情緒可以用某種圖像來表達，那些圖像就是我們所謂的鬼。所以鬼其實也不完全是我們想象中那麼可怕，儘管有時候的確很嚇人。鬼也的確存在，並不是沒有鬼，只不過它也並不是現實的一種物質存在，它存在於我們心裡，其實就是自身的情緒而已。</p>\n<p>鬼有不同的種類，它們基本的情緒基調是不同的，所以給人的感覺也不一樣，但總的說來都有些嚇人，有時候是非常嚇人。比如厲鬼和白衣女鬼，它們代表的情緒就是不一樣的，厲鬼是憤怒情緒的化身，白衣女鬼是抑鬱情緒的化身。如果一個人看到厲鬼，說明自己壓抑的憤怒情緒比較多；如果看到的是白衣女鬼，那麼壓抑的就是抑鬱情緒。</p>\n<p>這兩種鬼，基本的外貌特徵也是不同的。厲鬼看上去比較兇惡，可能穿黑顏色的衣服，面目猙獰恐怖，牙齒比較長，甚至是撩牙。身上肉不多，有的根本就沒有肉，只是套了外衣的一個空殼，有的裡邊就是幾根骨頭。多半還會有一個特點，牙齒上沾了一點血。白衣女鬼的感覺不是這樣，它總是穿一身白衣服，多為連衣裙，直接把整個身體蓋住，頭髮比較長，臉色慘白，一點血色都沒有，甚至臉上就根本沒有肉，只是白骨頭，像骷髏。還有一個最明顯的感覺是輕，輕飄飄的，走路不著地，幾乎就是飄在空中的，輕飄飄地來，但不太會輕飄飄地去，因為你看到它的話，說明抑鬱情緒纏身，不是那麼容易擺脫的，所以它來了就不走，不想看你也得看。</p>\n<p>一個人看見鬼，必然是有情緒原因的，不會隨便看到。即使看見的人的確很像鬼，自己才被捲進去的，那也會跟自己的情緒有關係，因為你看到的，感覺到的，細分起來的話，還是會有差別的，並不是所有的細節都完全一致。自己內心有一個形象，所以才會跟真實的有一定差異。而內心的這個形象，就是情緒的化身。以令狐沖為例，他看到的聾啞婆婆的確很像鬼，但他當時會感覺到害怕，這就跟他自己有關係。可以把聾啞婆婆看做令狐沖的一個子人格，一個意象，也就是說現在令狐沖見鬼了。為什麼令狐沖會在這個時間見鬼，如果注意到他現在的情緒的話，其實也蠻合理的。小師妹剛死，師孃又自殺，想到自己所崇拜的師父，竟是個卑鄙無恥的偽君子，令狐沖心灰意冷。此次上恆山就是想對恆山派有個交代，將掌門人之位讓出，然後就浪跡江湖，不想再面對眼前所看到的一切。萬念俱灰，冷漠，想要放棄，這些正是抑鬱情緒的常見表現。所以令狐沖在這種時候見到白衣女鬼也不奇怪。</p>\n<p>就聾啞婆婆本人，她也的確很像鬼。如果一個人的抑鬱情緒過分嚴重，我們會發現這個人本身就特別像鬼。男性也會這樣，但女性更為常見。諮詢室有時候會見到極度抑鬱的女性，她穿一身白衣服，長頭髮，低著頭，特別沒有精神，一副快死了的樣子，說話沒有力氣，聲音小，輕而且語速緩慢，特別嚴重的情況下，她說話會學鬼叫，坐她身邊就全身發涼，讓人心寒。</p>\n<p>抑鬱情緒通常也就是跟死亡聯繫在一起的，所以嚴重抑鬱的人都特別想要自殺，看上去也感覺她要死的樣子，像個活死人。聾啞婆婆因為一點小事吃醋，可以裝聾賣啞，隱居多年，不說一句話，連舌頭都變得不靈便，剛開口說話像小孩學講話一樣困難，其抑鬱的程度可想而知。關閉感覺通道，封閉情感，這也等於是心靈上的自殺。現實生活中還的確有這種人，只是採取的方式不一樣而已，有的人可以多年不跟家人說上一句話，整天悶著，該吃飯吃飯，該睡覺睡覺，自己活自己的。</p>\n<p>居然能做到幾年不說一句活，也沒有被憋死，不得不佩服這種人。為什麼有人能做到這一點？為什麼聾啞婆婆一生氣能把不戒和尚折磨得那麼慘？找了多年找不到，什麼苦頭都吃過了，還是心甘情願被她折磨？這可能也跟他們的心理年齡有很大關係。</p>\n<p>如果做一個推斷的話，筆者覺得聾啞婆婆的心理年齡可能在兩歲左右。我們知道一歲的小孩是完全沒有獨立性的，而兩歲是小孩開始具有獨立性的年齡，能一定程度控制自己的行為，有控制性，能控制自己，也能主動控制別人。心理年齡停留在這個階段的小孩，長大了特別堅強，特別剛烈。她可以嚴格控制自己的行為，比如說早上6點起床，看書到12點，然後吃飯，睡覺，繼續工作，晚上7點吃飯，吃完飯不看電視繼續工作，9點準時睡覺。她可以每天如此，決不放縱自己，而且很準時，規定了是6點，那就絕對不會睡到6點1分，時間一到，立即起床。</p>\n<p>可以看到，從心理年齡上說，她比1歲的孩子要成熟，特別能管理自己。而1歲的小孩比較鬆散，不具備管理自己的能力，只具備被人管的能力。被誰管？兩歲的孩子最適合充當這一角色。控制與被控制的角色，不單是靠力量來決定的，有的小孩個頭小，但他往那一站，別的小孩都只有被使喚的份，比他大很多的孩子都得聽他的話。不戒和尚的心理年齡還小一些，剛好碰到聾啞婆婆這麼剛烈的人，所以他還的確只有被控制的份。跟田伯光在一起，他可以把田伯光製得服服帖帖，但在老婆面前，他就只能被制。玩的招數是很多的，並不是只有通過命令才行，比如聾啞婆婆，只要躲起來，一躲數十年，這就能把不戒整得很慘。</p>\n<p>兩人的行為都很古怪，不戒把田伯光閹了，聾啞婆婆也差點把令狐沖閹了，他們自己看來並不起眼的一個做法，會讓別人感到非常恐怖。雖然都是類似的行為，但兩人行為背後所反映出來的感覺是有區別的，有各自心理年齡的特色。不戒是為了恆山女尼的安全，覺得應該把他閹了，所以就閹了；聾啞婆婆是覺得，你必須聽我的安排，答應娶儀琳為妻，否則把你閹了。</p>\n</div>"},{"title":"第三十七章　尼姑儀琳","content":"<div>\n<p>第三十七章　尼姑儀琳</p>\n<p>口欲期（0—1歲）過度不滿足的孩子，可能形成兩種比較特殊的人格。一種是攻擊型的，對這個世界感到不滿，對所有的一切都不滿，嘴上整天都在表達自己的不滿；另一種是可憐型的，得不到滿足，那我乾脆就什麼都不要了，我放棄。這種人特別沒有動力，沒有進取，不跟人競爭。像個乞丐一樣，而且是比較可憐的乞丐，別人給多少，我就吃多少，別人不給那我也就不要了，更不會想到說，別人不給的時候，我主動去爭取一點。在別人不給的情況下，他/她寧願自己就那麼餓死，但這種餓死的情況還比較特殊，因為有的乞丐餓死，是因為有骨氣，不吃嗟來之食，所以寧可餓死也不願意要；可憐型的人不是這樣，他/她就是沒有那個要的動力，他/她永遠會覺得，別人不給自己，人家也是有理由的，是我自己不好，別人不給是應該的。可憐型的人會永遠把原因歸到自己身上，所有沒做好的地方，都是自己的錯，都是自己做得不夠好。</p>\n<p>在戀愛方面，這種人也會表現得極度純潔無私，從來沒有任何自己個人的要求，永遠是一味的付出，只要對方好就行，自己所做的一切，都只是為了讓對方好。沒有考慮過從對方那兒獲得什麼，也根本不抱任何希望，沒想過要讓對方喜歡自己。假如對方還有任何不滿意的地方，那也一定是我還做得不夠好，根本不可能是對方的原因。</p>\n<p>聽起來非常理想，儀琳就蠻符合這種人格的基本特點。在3個月的時侯，也就是不到1歲的時候，媽媽就離開了。以後為了尋找儀琳的媽媽，被不戒和尚帶著四處奔波，後來恆山師太定逸見到了，覺得可憐，才讓不戒把她寄養恆山。3個月就被母親拋棄，口欲期顯然不可能滿足。到哪兒別人都覺得她可憐，身邊人都挺同情她。對令狐沖一往情深，因此而害了相思病，卻又從來不指望從令狐沖那兒獲得什麼，就是衷心地為令狐沖祈禱而已。</p>\n<p>儀琳幽幽地道：“啞婆婆，我常跟你說，我日裡想著令狐大哥，夜裡想著令狐大哥，做夢也總是做著他。我想到他為了救我，全不顧自己性命；想到他受傷之後，我抱了他奔逃；想到他跟我說笑，要我說故事給他聽，想到在衡山縣那個什麼群玉院中，我……我……跟他睡在一張床上，蓋了同一條被子。啞婆婆，我明知你聽不見，因此跟你說這些話也不害臊。我要是不說，整天憋在心裡，可真要發瘋了。我跟像說一會話，輕輕叫著令狐大哥的名字，心裡就有幾天舒報。”她頓了一頓，輕輕叫道：“令狐大哥，令狐大哥！”這兩聲叫喚情致纏綿，當真是蘊藏刻骨相思之意，令狐沖不由得身子一震。他早知道這小師妹對自己極好，卻想不到她小小心靈中包藏著的深情，竟如此驚心動魄，心道：“她待我這等情意，令狐沖今生如何報答得來？”儀琳輕輕嘆息，說道：“啞婆婆，爹爹不明白我，儀和、儀請師姊她們也不明白我。我想念令狐大哥，只是忘不了他，我明知道這是不應該的。我是身入空門的女尼，怎可對一個男人念念不忘的日思夜想，何況他還是本門的掌門人？我日日求觀音菩薩救我，請菩薩保佑我忘了令狐大哥。今兒早晨唸經，念著救苦救難觀世音菩薩的名字，我心中又在求菩薩，請菩薩保佑令狐大哥無災無難，逢凶化吉，保佑他和任家大小姐結成美滿良緣，白頭偕老，一生一世都快快活活。我忽然想，為什麼我求菩薩這樣，求菩薩那樣，菩薩聽著也該煩了。從今而後，我只求菩薩保佑令狐大哥一世快樂逍遙。他最喜歡快樂逍遙，無拘無束，但盼任大小姐將來不要管著他才好。”她出了一會神，輕聲念道：“南無救苦救難觀世音菩薩，南無救苦救難觀世音菩薩。”</p>\n<p>多麼單純，多麼讓人感動啊！很多男的會把這樣的女性當成理想，有個人對自己這麼好，多難得呀！其實儀琳這樣的人格是很病態的，沒有嘗試過的覺得很理想；嘗試過的，想擺脫都困難。</p>\n<p>舉個例子，我現在請客，請宿舍的三個人吃飯，我真心地請客，只希望別人爽快地答應就OK了。結果是，兩個人爽快答應了，另一個很真誠地告訴我：“你們吃就行了，沒有關係的，真的不用考慮我。”他也不是故意推辭，就是真心地覺得他自己不用被考慮，省得麻煩我。而其實我是希望他直接就在考慮範圍的，並不希望他忽視自己。結果他還是這麼做了，結果並沒有讓我覺得舒服，他倒是希望不要麻煩我，而事實上他的不麻煩會讓我感到更加麻煩。一次，兩次，三次，每次都是這樣，不斷重複，他會讓周圍人感覺很難受，本來就應該考慮他的地方，他就是不讓你考慮，似乎他永遠不需要在別人考慮的範圍。</p>\n<p>這只是非常非常小的一個例子，事實上他的這種模式還會做得更過分。他衷心地為大家祝願，真心地為大家考慮，不斷地為別人付出，這本身就會讓人感覺挺不舒服，因為你會覺得欠他很多，不是你願意欠，是他就讓你欠了。等到你想要回報他一下吧，他還不讓你回報，因為他有一個界限，他為別人付出是應該的，他為別人做點什麼永遠是應該的，但別人不能為他做什麼，不能因為他而勞別人的神，然後你就會覺得欠他的越來越多。而你覺得欠他的這種感覺，都是他自己造成的。</p>\n<p>跟可憐型的人生活在一起，你就是會覺得欠他很多，而且會越來越多。令狐沖的感受比較深，他會覺得自己欠儀琳太多，今生都難以回報。事實上也不容易回報，因為你不可能回報，她只會不斷地讓你欠她。正常情況下，人都是不願意欠別人太多的，有的人希望如此，但一旦真的如此，自己其實會挺不安的。人都應該有自己的欲求，人與人的交往也應該是平等的交往，要有自己的需求才正常。</p>\n<p>可憐型的人，這種行為模式對自身的健康也是很不利的。完全沒有自己需求的人，會特別缺乏生活的動力。既然得不到，我就什麼都不要了，這不是犧牲精神，這是不健康的心態。沒有生活的動力，又什麼煩惱都自己憋在心裡，這種人特別容易早死。金庸先生描寫儀琳，從不戒的口中可以得知，如果儀琳老見不到令狐沖的話，恐怕要死了，這可不是小說的誇張描述，可憐型的人的確缺乏生命力，容易早死，心中又總是太多煩惱。</p>\n<p>令狐沖忍不住想問：“你小小年紀，為什麼有這許多煩惱？”但終於沒出聲。依琳輕聲道：“啞婆婆，你真好，我常常拉著你來，向你訴說我的心事，你從來不覺厭煩，總是耐心地等著，讓我愛說多少，便說多少。我本來不該這樣煩你，但你待我真好，便像我自己親生的娘一般。我沒有娘，倘若我有個媽媽，我敢不敢向她這樣說呢？”令狐沖聽到她說是傾訴自己心事，覺得不妥，心想：“她要說什麼心事？我騙她吐露內心秘密，可太也對不住她，還是快走的為是。”當即站起身來。儀琳拉住了他袖子，說道：“啞婆婆，你……你要走了嗎？”聲音中充滿失望之情。令狐沖向她望了一眼，只見她神色悽楚，眼光中流露出懇求之意，不由得心下軟了，尋思：“小師妹形容憔悴，滿腹心事，倘著無處傾訴，老是悶在心裡，早晚要生重病。我且聽她說說，只要她始終不知是我，也不會害羞。”當下又緩緩坐了下來。儀琳伸手摟住他脖子，說道：“啞婆婆，你真好，就配我多坐一會幾。你不知道我心中可有多悶。”</p>\n<p>心中煩惱太多，又好不容易逮住機會，可以傾訴一番的話，她就會不斷地說，說很多，而且有一個特點，這種人傾訴起來沒完沒了。傾訴也是心理調節可以用的一種小方法，對於一般人而言，是不是跟人傾訴一下，也會有些效果，但對於儀琳這樣的人，傾訴能起到的作用是極其細微的，細微到幾乎沒有作用的地步。因為她僅僅是找個人說說話而已，不斷地說，說，說，沒有多少感情色彩，也沒有反思，光是說，這樣的作用效果是非常小的。先不考慮是否早死，單是每天抓住你傾訴，就很折磨人。一說一大通，而她也就是說說而已，也就聾啞婆婆還受得了。</p>\n</div>"},{"title":"第三十八章　岳不群攬權","content":"<div>\n<p>第三十八章　岳不群攬權</p>\n<p>故事梗概</p>\n<p>令狐沖和盈盈被吊在懸空寺，遊迅等人上來，奉了岳不群之命，抓恆山派弟子，事成之後，傳授辟邪劍法。令狐沖情急生智，告訴眾人劍譜在自己身上，為搶劍譜，眾人自相殘殺。有人伸手入懷來取，被令狐沖“吸星大法”粘住。利用吸來的內力衝開穴道，問清來由，放走桐柏雙奇，盈盈出手殺死遊迅。</p>\n<p>往黑木崖趕，途中遇上藍鳳凰，才得知尼姑們是被擒到華山去了，並非黑木崖。飯鋪中看到衡山弟子也在匆匆往華山趕。上了華山，空無一人，找到思過崖去，才發現二百餘人，正在專心演習石壁上的武功。</p>\n<p>一塊數萬斤重的大石掉在洞口，把洞門牢牢堵死。地道口只容一人，顯是被人攔死，鑽出去的都成了無頭屍。有人踩滅了火把，山洞裡一陣大恐慌，所有人兵刃亂舞，慘叫聲不絕。玉鍾子大聲叫停，停止舞動兵刃，齊心合力才行。左冷禪下令動手，七八人從地道口殺出，是辟邪劍門的一眾瞎子。黑暗中他們反而成了明眼人，沒有光線，令狐沖的“獨孤九劍”也完全失效。盈盈舞動白骨，借來絲絲光線，令狐沖才砍傷林平之，殺死左冷禪等人，實在兇險之極。</p>\n<p>心理分析</p>\n<p>可能有人注意到這樣一個現象，有些政治人物，並不會因為掌握了大權而感到心安，恰恰相反，地位越高越不滿足，還要進一步獨攬大權。大權在手，還是不安，要拼命鞏固個人勢力，生怕有一天會從高處跌落。像岳不群這樣的人，想做五嶽掌門，已經做上了，按理應該安心做他的掌門就好了，貴為五嶽掌門，地位也不低了，為何還要不擇手段，擒獲恆山尼姑，消滅各派勢力，繼續攬取權力？</p>\n<p>政治人物有兩類，一類是真正的政治家，’這種人自信心比較足，心裡有底，不害怕失去權力，也隨時放得下，比如歷史上了不起的政治家華盛頓。另外一種是政治人物，僅僅是政客而已，他們玩弄權勢，為的也就是個人勢力。他們自信心特別不足，比一般人還不如，拼命獲取權力，獲取至高無上的權力，其實是帶有補償性的，越是自身力量不足，越希望通過至高無上的權力來獲得補償，不管最終權力多高，內心自信永遠是不足的。地位越高，越沒有安全感，比如臭名昭著的希特勒。</p>\n<p>岳不群顯然屬於第二類人群，不用跟優秀的政治家相比，單是在任我行面前，岳不群都屬於抬不了頭的人物，根本沒把他放在眼裡。江湖前輩敬重華山的寧女俠，卻寧肯沒有聽過岳不群的名頭，這也不是沒有理由的。</p>\n<p>我們知道，當一個人內心的自信不足，而企圖通過從外界獲得補償時，後果是非常危險的，因為外界的補償永遠不可能解決內心的自卑，最基本的路子都走錯了。舉個例子，我現在覺得自己頭腦特別笨，沒有班上的同學反應快，沒有那麼靈敏，然後我就想，那我考第一不就證明我比他們聰明瞭嗎？通過不懈的努力，我還真就考了第一，因為大家知道，這一點顯然是可以做到的，“笨鳥先飛”嘛。但是得了第一之後，我一定會覺得彆扭，不是自己想象的那樣，雖然考第一了，但我還是比別人笨。那好，我就爭取考全校第一，後來真考了全校第一，按道理我該滿足了。其實不是，因為考了全校第一之後，我比別人笨就還是比別人笨，頭腦沒有別人聰明，這個事實不會因為考第一而改變。那好，我繼續努力，拿全校最高的獎學金。後來拿了，可我還是沒有別人聰明。終於最後我發現了，考第一，拿獎學金，都不能證明我比別人聰明，要變得比別人聰明，唯一有效的辦法，是把別人都變傻。</p>\n<p>當然，僅僅是想想而已的話，也沒有什麼嚴重後果，但是，假如這是個權力競爭的過程，道理一樣，後果顯然就很嚴重。我身世不如別人好，所以我要地位比別人高，那樣就可以證明我身世優於別人。地位高了，又發現不是那麼回事，因為我身世還是不如別人的。我武功不如別人好，沒別人活得光彩，那我做了掌門就可以稱霸武林了。稱霸武林之後，又發現不如自己想象那麼完美，因為還是有人可以超過我，會威脅到我。那麼其實最簡單、最有效的辦法是什麼？把可能威脅到我的，全部殺光，那不就安全了嗎！岳不群正在做的就是這一步，逐步剷除可能的威脅勢力，把自己武功練到最高，最好天下無敵，把不聽話的殺掉，把可能不聽話的也都消滅，自己的地位不就穩固了嗎！</p>\n<p>心理學上認為，一個人的現在，他的行為方式，多少會受個人經歷影響。想要了解一個人，我們應該要了解他的過去。華山“氣宗”與“劍宗”的內部爭鬥，由來已久。岳不群這個人當年能做上華山掌門，手段可能也就不是那麼光彩。</p>\n<p>岳不群道：“成兄，你們‘劍宗’一支，二十五年前早已離開本門，自認不再是華山派弟子，何以今日又來生事？倘若你們自認功夫了得，不妨自立門戶，在武林中揚眉吐氣，將華山派壓了下來，嶽某自也佩服。今日這等囉嗦不清，除了徒傷和氣，更有何益？”成不憂大聲道：“嶽師兄，在下和你無冤無仇，原本不必傷這和氣。只是你霸佔華山派掌門之位，卻教眾弟子練氣不練劍，以致我華山派聲名日衰，你終究卸不了重責。成某既是華山弟子，終不能袖手旁觀，置之不理。再說，當年‘氣宗’排擠‘劍宗’，所使的手段實在不明不白，殊不光明正大，我‘劍宗’弟子沒一個服氣。我們已隱忍了二十五年，今日該得好好算一算這筆賬了。”岳不群道：“本門氣宗劍宗之爭，由來己久。當日兩宗玉女峰上比劍，勝敗既決，是非亦分。事隔二十五年，三位再來舊事重提，復有何益？”成不忱道：當日比劍勝敗如何，又有誰來見？我們三個都是‘劍宗’弟子，就一個也沒見。總而言之，你這掌門之位得來不清不楚。</p>\n<p>沖虛道：“當年武林中傳說，華山兩宗火併之時，風老前輩剛好在江南娶親，得訊之後趕回華山，劍宗好手已然傷亡殆盡，一敗塗地。否則以他劍法之精，倘若會與鬥劍，氣宗無論如何不能佔到上風。風老前輩隨即發覺，江南娶親云云，原來是一場大騙局，他那岳丈暗中受了華山氣宗之託，買了個妓女來冒充小姐，將他羈絆在江南。風老前輩重回江南嶽家，他的假岳丈全家早已逃得不知去向。江湖上都說，風老前輩惱怒旅愧，就此自刎而死。”</p>\n<p>我們在作心理分析的時候，發現即使是一個民族，一個宗派，一個支系，也經常可以看做一個個體，只不過是一個放大了的個體，因為這個個體跟同類的其他個體相比，會有自身一些共同的特殊性，那些最基本的特殊性，是整個團體共有的，又會影響到它的每一個成員。比如說，中華民族看做一個個體的話，它的性格，跟日本民族，跟西方的一些民族相比較，都會有不同，有自己比較特殊的地方。同樣，我們也可以把華山派看做一個個體，它的歷史就是這個個體的經歷，這樣一看就會發現，華山從“氣宗”與“劍宗”爭鬥的原因上，就是很不光彩的，因為爭鬥的原因，是從偷學別人的武功家數開始的。這樣的行為，普通的江湖俠客都清楚，特別為人所不齒，更何況是一代武學宗師級的人物去做這樣的事情。</p>\n<p>通過長期的分析實踐，我們不得不相信一個最基本的原則，所有沒得到解決的心理問題，一定不會自動消失，只會暫時處於潛伏狀態，一旦尋找到機會，就再次表現。一個民族的心理問題也是一樣，老在一個問題上解決不了，這個民族就會反覆被這個問題所困擾，不同的只是，有時候換了下形式而已。</p>\n<p>特別有意思的是，華山派曾經因為打不過而把魔教十長老囚于山洞困死。當然那次卑鄙的行為也有其他正派中人參與，但事情由華山而起，而且囚禁的山洞是在華山。歷史總是會出現驚人的相似，讓你不得不感嘆，那簡直就是老路的重複，因為今天、岳不群又把大批人群困於華山，而且是同一個洞裡。而且都死傷慘重，所不同的只是，被困的人不同，上次完全沒有活口，這次奇蹟般地活下兩個。雖然有細微的不同，但總的問題是一樣的，為達目的，不擇手段。岳不群很好地傳承了這個“優良傳統”。</p>\n</div>"},{"title":"第三十九章　嗅覺","content":"<div>\n<p>第三十九章　嗅覺</p>\n<p>故事梗概</p>\n<p>令狐沖和盈盈出山洞，突然被岳不群的漁網網住。岳不群去抓令狐沖的手，被他隔著漁網吸走內力，儀琳從背後一劍，刺穿岳不群前胸。勞德諾出現，被儀琳砍斷琵琶骨，飛也似的逃走。不戒夫婦也來了，儀琳和眾師姊被岳不群擒上華山，不戒夫婦剛救出儀琳。田伯光嗅覺何等靈敏，一聞就知道哪有女人，被岳不群囚禁在石洞裡的尼姑們，多虧了田伯光好鼻子，才被找到。</p>\n<p>任我行圍攻五嶽劍派，魔教傾巢而出，大有一舉拿下五嶽的聲勢。令狐沖跟隨盈盈上朝陽峰拜見，任我行聽說左冷禪，岳不群等人已死，大感失望。不能親眼看到左冷禪這樣的對手在面前下跪，實是生平一大遺憾。</p>\n<p>令狐沖體內異種真氣發作，任我行再提入教之事，稱呼令狐沖為副教主。令狐沖對“千秋萬載，一統江湖”等肉麻之詞感到噁心，當場拒絕入教。任我行大怒，讓令狐沖回恆山做準備，一個月之內定來攻取，恆山上下，雞犬不留。而實際上，任我行心裡正在盤算挑武當，攻少林，小小五嶽，如今又人才凋零，早已不在話下。讓令狐沖做準備，不過是個計策，聲東擊西。</p>\n<p>心理分析</p>\n<p>從神經症患者身上，我們可以看到，人顯然會有各種特殊的天賦。這些異常的稟賦，是一般人不具備的，沒有好壞之分，關鍵看你把它運用在什麼地方。用得好，就是特殊的才能，用得不好，就成為導致心理不健康的重要因素。超級理智化的人，可以成為優秀的知識分子。強迫思維的人，邏輯縝密，嚴謹慎重，還可能博學多識。一個英雄主義的人，可能創造輝煌燦爛的個人成就，一個天生的王者，可能成為傑出的領袖。各種人格問題，也未必是壞事，往往具備一些出眾的才能，比如說，自戀型的人是一流的演員，邊緣型的人具有過人的藝術氣質。但它們同時也都有相應的壞處。理智化的人就特別招人討厭，整天說些別人聽不懂的大道理，囉裡囉唆，像唐僧一樣；強迫思維的人，可能只會思維，正常的吃飯睡覺都不行；英雄主義的人容易受重傷，或者大病；天生的王者可能成為獨裁的專制統治者；自戀的人陷於自我欣賞中，照鏡子照到死；邊緣型的人沒有職業，吸毒，亂交，然後就死了。</p>\n<p>每一類神經症患者，都是一種幸運，同時又是一種不幸。慶幸的是，你有異常的天賦，不幸的是，你可能只有異常的天賦。有一些異常的稟賦，有心理問題的傾向，但是又還沒有患上嚴重的心理疾病，這可能是很多人比較理想的狀態。比如有些直覺型的人，整天沉浸在自己的夢境中，對未來有準確的預知，是很好的先知。其實人還有一些天賦，是後天逐漸被掩蓋，逐漸退步了的，比如嗅覺。人在嬰幼兒的時候，嗅覺可能比視覺更發達，因為那時候還不會看東西。有科學研究表明，嬰幼兒辨認母親，辨認母乳，靠的就是嗅覺，一聞就知道是不是母親，從氣味就可以辨別是不是母乳，那時候他並不認識母親，也不需要嚐了味道才知道是不是母乳。有個老師觀察他的孩子，發現小傢伙總是通過聞味道來進行辨別，一聞衣服就知道，這是爸爸的味道，這是媽媽的味道。更奇的是，某次鄰居家小孩給了他一件衣服，媽媽給他換衣服的時候，他說：“這是佳佳的味道。”佳佳就是他們鄰居家孩子。跟視覺相比，嗅覺是一種更本能的認知方式，人都具備。只是在後天成長過程中，我們習慣於用眼睛來認識世界，視覺發達了，嗅覺才退步的。</p>\n<p>但也不是每個人都如此，少數人一直保留了這一特長，他們在成長的過程中，從來就不習慣於用眼睛去識別事物。筆者認識一個怪人，習慣於用鼻子辨別方向。沒去過的一個地方，是地下室，筆者跟她從房間出來，兩人都暫時忘記了走哪邊。我在回想方位，她不是回想，也不是看標記，是用鼻子聞，左邊聞一下，右邊聞一下，然後告訴我走左邊。事實證明她是對的。生活中她也習慣於用鼻子，她告訴我，有時候朋友走到身邊，根本就懶得抬頭去看，聞一下就知道是誰了。</p>\n<p>在田伯光身上，我們也看到了這樣少數的特例。只不過他可能不是用鼻子認識世界，他鼻子雖然特別靈，但是用的範圍相對比較狹窄，僅限於識別女人。這樣的稟賦，你也很難說它是好是壞，用於尋花問柳，姦淫婦女，當然很罪惡，但是田伯光改邪歸正，用來尋找被囚禁的恆山尼姑，就是一件大大的好事，沒有他還不行。</p>\n<p>令狐沖道：“然則你何以得知，倒要請教。”田伯光神色忸怩，微笑道：“這事說來不雅，不說也罷。”令狐沖更加好奇了，不聞不快，笑道：“你我都是江湖上的浮浪子弟，又有什麼雅了？快說出來聽聽。”田伯光道：“在下說了出來，令狐掌門請勿見責。”令狐沖笑道：“你救了恆山派的眾位師姊師妹，多謝你還來不及，豈有見怪之理？”田伯光低聲道：“不瞞你說，在下一向有個壞牌氣，你是知道的了。自從太師父剃光了我頭，給我取個法名叫做‘不可不戒’之後，那色戒自是不能再犯……”令狐沖想到不戒和尚懲戒他的古怪法子，不由臉露微笑。田伯光知道他心中在想什麼，臉上一紅，續道：“但我從前學到的本事，卻沒忘記，不論相隔多遠，只要有女子聚居之處，在下……在下便覺察得到。”令狐沖大奇，問道：“那是什麼法子？”田伯光道：“我也不知是什麼法子，好像能夠聞到女人身上的氣息，與男人不同。”令狐沖哈哈大笑，道：“據說有些高僧有天眼通、天耳通，田兄居然有‘天鼻通’。”田伯光道：“慚愧，慚愧！”令狐沖笑道：“田兄這本事，原是多做壞事，歷練而得，想不到今日用來救我恆山派的弟子。”</p>\n<p>田伯光突然停步，道：“這左近似乎又有恆山派弟子。”他用力嗅了幾嗅，向山坡下的草叢走去，低頭尋找，過了一會，一聲歡呼，手指地下，叫道：“在這裡了！”他所指處堆著十餘塊大石，每一塊都有二三百斤重，當即搬開了一塊。不戒和令狐沖過去相助，片刻間將十幾塊大石都搬開了，底下是塊青石板。三人合力將石板掀起，露出一個洞來，裡面躺著幾個尼姑，果然都是恆山派弟子。儀清和儀敏忙跳下洞去，將同門扶了出來，扶出幾人後，裡面還有，每一個都已奄奄一息。眾人忙將被囚的恆山弟子拉出，只見儀和、鄭萼、秦娟等均在其內，這地洞中竟藏了三十餘人，再過得一兩天，非盡數死在其內不可。</p>\n<p>嗅覺是一種更本能的反應，在現實生活中只有少數人能做到，但在心靈層面，其實每個人都有這種本事的。通過訓練，每個人都可以做到。加以利用，在心理諮詢中發揮作用的話，不失為一種好方法，特別好用。</p>\n<p>朱建軍老師專門在意象對話的課上講過嗅覺的練習和運用。每個人都有自己特殊的味道，剛洗過澡最好，因為那時候可以有效排除其他的異味，比較接近這個人本來的味道。沒有洗澡的話，需要堅持，多聞一陣，適應了身體上的異味，然後才會聞到本來的味道。比如狐臭味，或者身上用了香水的味道，那都不是本來的味道。排除干擾以後，憑味道就可以判斷一個人的健康狀況。一個比較健康的人，和一個疾病比較嚴重的人，相比較的話，前者的味道聞起來顯然要舒服得多。</p>\n<p>其實生活中對人，我們也經常有嗅覺反應的，只是自己沒有意識到而已。擠公交車的時候，汗味大家都有，汗味當然不好聞，但一站到有的人身邊就會特別難聞，很多時候不是對汗味的排斥，是這個人的味道就讓人特別難受。所以在他身邊站不住，特別想移開。顯然也不是因為長相，根本就還沒看到他的長相，是背對的，衣服還挺漂亮，但味道就是很難受。</p>\n<p>水平比較高的諮詢師，不但可以通過氣味判斷一個人心理問題的嚴重程度，還可以辨別心理問題的類型，不同類型的心理問題，基本的氣味類型也是不一樣的。除了諮詢師本人的辨別，嗅覺還可以用來對付一類來訪者，特別有效，而用其他辦法又特別難對付。這是蔡晨瑞老師最近在實踐中新嘗試的一個方法，大家一致認為很好用。</p>\n<p>他去戒毒所給人做心理諮詢，發現一個困難，很多人特別排斥，來做諮詢也是被迫如此而已，自己不太願意來，也特別不願意面對問題。他給人做意象，有人看到一個人形，長得特別奇怪，一張嘴奇大無比，幾乎整個頭部就一張嘴。脖子特別細，細得難以咽東西。身體特別瘦，幾乎是皮包骨。衣服穿得很邋遢，髒爛。躺在地上不想動。看到這樣一個子人格，來訪者顯然不會很舒服，但是當諮詢師問他感受的時候，他滿口拒絕：“沒有感覺，就是沒感覺，什麼感覺都沒有。”“你再仔細看一下，多少總會有點感覺，不可能對他完全沒感覺。”看了看說，就是沒感覺。我們知道，這時候比較麻煩，來訪者的問題就在於沒感覺，往往心理問題非常嚴重的時候，人會完全沒感覺，越嚴重越可能沒感覺。那麼諮詢師要做的就是幫他找回感覺，能找一點算一點，儘管這個過程會很痛苦，因為他特別不願意面對。其實不是沒感覺，是感覺太不舒服，不願意面對。諮詢師只要幫他面對，找到哪怕一點點對來訪者都是很有好處的。蔡晨瑞突發奇想：“沒感覺也沒關係，那你上去聞聞，看它是什麼味道。”這一聞味道，來訪者馬上說很噁心，想嘔吐，感覺立即就出來了。</p>\n<p>諮詢中還會碰到另外一類問題，是特別特別小的時候出現的。比如說剛出生階段帶來的問題，這種問題來訪者多半是沒有意象的，因為他還沒有學會用意象來表徵，只知道有一個很難受的感受，但還不會描述，說不出來怎麼難受。這種時候其實也挺適合讓他用味道來描述，因為小孩子沒有圖像，但嗅覺總是有的。</p>\n</div>"},{"title":"第四十章　幸好會死","content":"<div>\n<p>第四十章　幸好會死</p>\n<p>故事梗概</p>\n<p>方證大師上恆山，跟令狐沖商量抵禦魔教圍攻。方證假託風清揚之名，給令狐沖傳授了《易筋經》內功心法，用以化解體內異種真氣。沖虛獻策，製作帶有機關彈簧的太師椅，椅子腳下裝有藥引，通到一堆火藥之中。到時候任我行往上一坐，就會引發兩萬斤炸藥爆炸。各派高手全力抵禦，鬥到分際，沿長繩縋入深谷，任我行大獲全勝，必然得意地坐上寶椅。</p>\n<p>號角嗚嗚，鼓聲咚咚，日月教果然是以堂堂之陣，大舉前來攻山。令狐沖體內真氣發作，痛得抱著肚皮，在地上打滾。魔教十六名轎伕，抬了一頂藍呢大轎，直入觀音堂，任教主要與令狐沖單獨會面。任教主出庵，手下給方證等人
