<script>

const chapters = [{"title":"自序","content":"<div>\n<p>自序</p>\n<p>關於偽君子</p>\n<p>人有時候很奇怪，瞭解一個人不用瞭解他的全部，只需憑藉隻言片語，憑藉簡單的行為動作，甚至憑長相，也能判斷一個人的精神修養。尤其是精神分析的心理諮詢師，他們一定會高度贊同，因為他們經過長期複雜的訓練，特別善於從別人的外貌長相、簡單的話語、簡單的動作，甚至簡單的一個眼神，來把握對方的內心。這種把握往往非常可靠，因為諮詢師所把握的不是對方的語言本身，也不是動作本身，更不是外貌本身，而把握的是這些東西背後的情感動機。一個人的語言動作等都可以騙人，但語言動作背後的情感動機是騙不了人的。比如一個人站在臺上，面紅耳赤，聲音發顫，兩條腿不停地亂動，拿著演講稿的雙手也在不自覺地顫抖，但是嘴上告訴你：“我不緊張！真的，我一點都不緊張……”這種話，你多半不願意相信。諮詢師在這種情況下，寧肯持保留意見，採取懷疑的態度，不輕易相信對方的話語。</p>\n<p>念高中的時候，經常留意到一些意見，是關於對金庸先生的評價。國內的一個挺有名的文學獎項，忘了叫什麼名字，金庸先生連年被提名，大眾支持率極高，但就是每年都過不了專家這關，連年被專家拒之門外。我很為他們負責任的評審態度所感動，當時也特別贊同專家的做法，覺得“金庸”這麼庸俗的作品，怎麼能進文學這種嚴肅的圈子？說這種話的時候，我因為文學兩個字的高尚和神聖而感到有些自豪，有一句潛臺詞：“那些喜歡金庸作品的庸俗的大眾，你們懂什麼文學？”潛臺詞說得再明白一點：“我本人其實是懂文學的。”</p>\n<p>非常幸運，我後來學了心理學，而且不是國內的主流心理學，是心理諮詢。要做心理諮詢，首先必須提高自己的健康度，也就是自己要不斷接受諮詢，參加自我成長小組。精神分析的小組有一個好處，就是在這裡所有人的缺點都被暴露無遺。每個人的眼光都特別凌厲，而且小組裡的人都比較真誠，他會誠實地說出你的問題和缺點，儘管這往往讓人挺難堪。一個人要承認和麵對自己的脆弱，需要很大的勇氣，並不是隨便就能做到的，在眾人面前承認自己有問題，這一點首先就會讓人挺難受。</p>\n<p>當有人指出，我那個自以為是的人格非常招人討厭時，我起初不願意承認。第一反應是：“你懂什麼？頭腦裡很亂，我怎麼可能自以為是？我這麼實在的人？”經過長期的成長，小組的好處體現出來了，因為群眾的眼睛往往是雪亮的。如果小組裡十個人，就一個人咬定你，說你自以為是，那多半是他自己的問題。如果十個裡有九個都這麼說，你就不得不有所反省，可能這十個人都有毛病，但出現這種可能的幾率是非常小的，幾乎小到零；因為小組裡都是些很厲害的人物，更何況這種小問題，跟正常的心理諮詢相比，非常簡單，還不至於一下子同時難倒十個諮詢師。</p>\n<p>當我能沉下來體會，已經是一個很大的進步，要處理問題，首先得發現問題，不知道自己有問題，這個問題就會一直伴隨我。其實問題很簡單，我這個招人討厭的人格側面，自以為是不是它最大的特點，它最大的特點是理智。自以為是地說“你懂什麼”，那只是受到傷害的時候，我防禦的一個方式而已。你不懂暗含的意思是，我沒有你說的問題。當這樣想的時候，可以尋得一點自我安慰。別人指出的時候，我為什麼會受傷害？正是因為我內心深處確實有這個問題，只不過由於無意識的防禦，當時連我自己也不知道。理智的人很容易招人討厭，但他自己並不知道。理智的人特別善於講道理，講得頭頭是道，而且不帶情感色彩。當一個人把自己的情感動機隱藏在背後，而說一些很冠冕堂皇的大道理，會讓人很難受。</p>\n<p>把自己的問題處理了，自己的健康度有所提高，回頭再去看別人的問題，就會一目瞭然，過去看不見的問題，現在變得異常清晰。精神分析心理諮詢師的培訓，其實就是這麼個過程，不斷地解決自己的問題，自己越健康，越容易發現別人的問題。自己從來不參與體會，不處理自己的問題，卻想成為諮詢師，這在我們看來是不可能的，我們從來不承認這種人可以做諮詢師，第一，沒有體驗過的人不可能真正理解。第二，自己不健康的人沒法給別人做諮詢，你有多健康，你就最多隻能把對方帶到相應的健康度；你的問題比來訪者還嚴重，想給對方帶來健康是不可能的。</p>\n<p>回到剛才的話題，理智的人招人討厭但是自己不知道，有一些體會之後，現在回頭去看，我能更清晰地理解，為什麼那些專家會一再地把金庸拒之門外，而絲毫不能接受讀者的意見。那些專家拒絕金庸一定會有他們的理由，而且乍看會非常有道理，甚至讓你感到無法反駁。仔細體會專家的話就會發現，他們說話多半不帶感覺，他們的情感動機是被深藏的。這就是他們的心理問題所在。但我這樣說，決不是要讓專家都感情用事，讓評審失去客觀標準，這恰恰是筆者最不願意看到的結果。我要表達的是，針對那些過於理智的人，應該適當調動自己的感覺，合理調動自己的感情，而不是堂而皇之地用一個合理的理由來回避情感，完全不帶入的感情色彩，這樣的標準未必就是客觀的。我相信在那些排斥金庸的人中，背地裡抱著金庸的書狂啃的，大有人在，至少筆者當時就是一個。</p>\n<p>在沒學心理學的時候，讀到岳不群前面部分的表現，以為他是一個正人君子；如果是現在讀到同樣的故事，我更願意持保留意見，熟悉榮格心理學的人不難理解，一個人表現得過於理智，經常說些冠冕堂皇的大道理而不帶感情色彩，這種表現是很不正常的。岳不群這個人，一看就知道他不會是什麼好東西。他後來的表現完全印證了這一點。所以，心理分析的諮詢師從有限的外在表現來把握一個人的內心世界，不是沒有道理的。岳不群的表現，跟心理學理論假設的高度一致，可能出於巧合，也可能出於一些別的原因，但我更願意相信，這都是出於對人性的洞察。</p>\n</div>"},{"title":"緒論","content":"<div>\n<p>緒論</p>\n<p>人生就是一齣戲</p>\n<p>意象對話心理學有一種分析人物的方法，就是把人物拆散，每個人有很多不同的側面，研究發現可以把這些不同的側面一個一個地拆開來，每一個側面是一個子人格，這樣再來看人物性格的時候，會變得異常清晰。舉個例子，李逢這個人物肯定不止一方面的性格特點，比如說他既有非常執拗的一面，但同時又有非常善良、很愛母親的一面，用意象把這兩方面拆開之後，他的性格特點會更加鮮明。做過大量意象的研究人員會有這樣的經驗，拆開的子人格的特點，經常與大家對這個人的感覺是非常一致的，比如有一個女性，大家一看到就她就覺得她特別像一隻小蜜蜂的話，這種情況下給她做意象分解，她的子人格里肯定有一隻小蜜蜂。</p>\n<p>意象對話的進一步研究表明，子人格之間的關係與我們現實生活中的人際關係，是高度對應的。比如說，你的意象裡有一個李逵，還有一個高逮（意象裡的人物不是完全按照原來的作品，也不是按照合理的邏輯出現的），李連特別討厭高逮，一看見就特別想踢他，那麼在現實生活中，假如你遇到一個像高速的人，就會真的特別想踢他，儘管你跟這個像高速的人可能根本互不相識。這就是為什麼我們有時候見到一個人就特別討厭他她，無緣無故，就是討厭。而這種時候，你如果能自我反省一下，看看這個想踢高逮的人，就會發現，你自己此時此刻特別像李逵。同樣的道理，如果你在意象裡特別喜歡一個人，那麼在生活中碰到跟他/她很像的人，也會不自覺地喜歡。</p>\n<p>心理學上有一點非常基本的常識，真正跟自己無關的角色，決不是你討厭的人，你之所以討厭，是因為你跟他/她關係大著呢，因為你的潛意識裡非常喜歡他/她，只不過你自己不知道罷了。就像一個青春期的男孩，如果他不斷地跟你提，他特別特別討厭某個女生，簡直一看到生氣，恨不得她馬上在他眼前消失，那麼這種時候，你最好不要輕易相信這傢伙的話，儘管他有時候表現出來的情緒可能真的很討厭。不喜歡一個人，是覺得自己跟她沒關係，而不是特別討厭她。</p>\n<p>意象裡的人物，也同樣是分輕重的。意象裡我們會有非常多的子人格，但不是每個子人格都能跟我們自身發生關係。真正跟我們關係特別重要的有兩類，一類是我們最喜歡的，一類是我們最討厭的。正是由於內心子人格的關係與外部現實人際關係的高度對應，我們不得不相信，好多時候，現實是被註定了的，喜歡一個人，還是討厭一個人，經常不是自己說了算；能跟什麼樣的人相處，沒法跟什麼樣的人相處，跟什麼樣的人能暫時相處，但最終會分開，這都不是個人能控制的。</p>\n<p>筆者有一個學妹，交朋友先看星座，不符合標準的不交，這種做法，在心理學家看來，其實蠻有道理，有的人沒法交往，不行就是不行。當然，這涉及星座學與性格的問題，筆者不是星座學的專家，沒有專門的研究，但從經驗觀察，筆者寧願相信星座，這並不僅僅因為筆者個人的性格特點就與星座說完全符合，從理論上說，月亮都能影響到地球上的潮汐，誰能保證星座、季節轉換、晝夜更替等規律不會影響到個人的成長和性格的形成呢？當然，根據星座選擇交往，有的時候也會有一定的問題，那就是弗洛伊德心理學所說的移情，比如曾經交過一個巨蟹座的朋友，後來吵翻了，從此以後見了巨蟹座的人就討厭，決不交往，這就要謹慎，這種情況多半是移情，你把對過去那個人的討厭，轉移到現在巨蟹座的人身上，看到巨蟹座的人就不順眼。如果確定自己沒有移情，那可能跟巨蟹座的人還就是難以相處，像命運一樣被註定。文學家喜歡說一句話，“人生如同一齣戲”，這句話在意象對話心理學上有非常好的理論依據做支持。人生就是一齣戲，這出戏的劇本早就在我們內心裡寫好了，戲劇的主人公是自己，也就是子人格里佔據中心地位的那個人。生活中會有不同的人跟我們發生關係，發生關係的就是子人格里比較重要的那部分，包括討厭的和喜歡的；生活中還要遇到大量角色，是匆匆的過客，不跟我們發生什麼關係，這就是意象裡偶爾出現，又匆匆消失，既不喜歡，也不招人討厭的那些角色，多他/她不多，少他/她也不少。世界上還有更多的人，是我們這輩子都不會相遇的，事實上，人的潛意識裡也有大量這樣的角色，他們處於潛伏狀，但並非沒有。處於潛伏狀的子人格也是這樣，也許有一天他/她就出現了，只不過可能這一天屬於來世。</p>\n<p>實際上，不僅僅子人格之間的關係在內心裡有腳本，每個子人格能做什麼，其實也是在劇本里寫好了的，假如你主導的子人格是隻小蜜蜂，現實生活中絕對不會像李逵一樣去戰場拼殺。在一個心結沒有解決的時候，生活當中一定會不斷碰到這個結，“李逵”不斷碰到“高逑”，而且始終糾纏不清。當然，有這個結在現實層面不一定就是件壞事，假如“李逵”是處於真正的義憤，那“高逑”這種混蛋本來就該踢，但是，現代人身上，真正的義憤極為罕見，通過心理分析發現，大部分所謂的義憤，都只是表面上的，其實是移情，也就是出於某個心結。正因為劇本里的心結如此嚴格地決定現實，所以說人生就是一齣戲，這是非常有道理的，人生就是自己潛意識寫好的一部戲。也正因為劇本非常嚴格地決定現實，似乎很難改變，以至於很多人相信這就是所謂的命運，不可跟命運抗爭，其實所謂的命運，就是自己潛意識裡的劇本，寫這個劇本的不是上帝，也不是某種神秘的自然力量，就是自己而已。</p>\n<p>既然劇本是自己寫的，那是不是自己就可以隨便修改自己的劇本呢？也不是。前面提到，劇本決定現實非常嚴格，是因為潛意識的決定力量很強，所以一般情況下是不可以改變的。而潛意識的決定力量之所以非常強，很大程度上是因為不自知。有些人特別喜歡宣稱自己非常瞭解自己，經過大量心理分析的經驗，筆者不再輕易相信這樣的話，對潛意識的自知是非常困難的，宣稱自己很自知，多數情況下，這本身就是潛意識的一種阻抗，它恰恰說明你還特別不瞭解自己。當真正有自知後，潛意識的劇本，要修改不是不可能。“李逵”的例子裡，當“李逵”真正弄明白自己為什麼討厭“高逑”時，往往連他自己也會覺得這種討厭幼稚得可笑，很多情況下只因童年的某一次帶有創傷性的經歷，以後這股情感力量就痼著在那了，直到此刻真正明白了，才恍然大悟。而在明白這一點之後，問題自然得到解決。這就是為什麼弗洛伊德那麼重視童年經驗的研究，而且發現大量的神經症，僅僅在做到自知以後，其症狀就戲劇性地消失了。現在心理諮詢的經驗表明，對於大部分案例，弗洛伊德的方法是符合實際的。但也有很多案例達不到這樣的效果，因為有些人在明白了自己的問題之後，暫時還是沒有能力處理，還需要以後逐步領悟，逐步接納，逐步成長，才能最終解決問題。在我們看來，自知其實只走出了第一步，以後還有挺長，挺艱難的一段路要走，面對自己的傷痛本身就不是一件讓人感到舒服的事情，有時候會非常痛苦。所以，雖然劇本是自己寫的，但要修改劇本並不容易。在非常少見的情況下，修改劇本還有一種方法，就是強行扭轉，當你此刻的力量大於過去的決定力量時，要扭轉也是有可能的。但這種方法特別有害，而且不能根本解決問題，所以很不提倡用。</p>\n<p>修改劇本很困難，多數時候我們都活在既定的劇本里。由於劇本跟生活特別對應，劇本里的角色跟生活裡的人物高度一致，所以我們也可以反過來，通過認識生活中的人物，來了解內心子人格以及子人格之間的關係。比如說你在生活中特別討厭一個人，那意味著你可能有一個跟他/她相似的子人格，你最討厭這個人身上的什麼特點，這意味著你自己的子人格身上有這個特點，儘管你可能極不願承認。</p>\n<p>用這個方法，我們可以直接把生活看成一齣戲，自己是主人公，身邊所有人都是自己的子人格，只不過這些子人格里也有輕重之分。我們會在生活中碰到很多人，但跟自己有重要關係的，實際上也不外乎那麼幾個，多到幾十個，一般不超過六七十。這一點也總在文學作品中體現，當我們用這種方法研究文學作品中的人物時，就可以把主人公當成中心人物，其他人物都是主人公的子人格，就是說，作品中出現的每個人物，其實都是主人公性格的一部分；一部作品就是主人公心靈成長的一個過程，其中有些側面跟主人公關係密切，而很多側面未必跟主人公發生非常直接的關係。成長過程中，對有些側面的處理恰當，那麼主人公的這些側面就會往健康的方向成長；處理不當，不能解決心結，則這個側面永遠是不完善的。</p>\n<p>本書就用這種方法，對《笑傲江湖》的人物，逐一作心理分析。令狐沖是主人公，全書就是令狐沖心靈成長的一個劇本，劇裡出現的每個人物，都是令狐沖的子人格，是他的一部分。而看待每個子人格的時候，又會發現子人格本身也往往不止一個側面，子人格的成長，也是不同側面的成長。這時候又可以把子人格當成中心人物，子人格的不同側面，又再當子人格來處理。</p>\n</div>"},{"title":"第一章　居安思危","content":"<div>\n<p>第一章　居安思危</p>\n<p>故事梗概</p>\n<p>“福威鏢局”少鏢頭林平之行獵，風光無限。左肩上停著一頭獵鷹，腰懸寶劍，揹負長弓，潑刺刺縱馬疾馳。餘滄海的兒子在肆酒調戲良家婦女，林平之路見不平，跟姓餘的一路人打起來，但又打不過，情急之下誤把匕首插入對方小腹，姓餘的一命嗚呼。林平之由此惹下大禍，福威鏢局的人接連被殺，而對方使的又都是他林家的辟邪劍法，無人能敵，瀕臨滅門的危險。</p>\n<p>心理分析</p>\n<p>可能是受科學思維的影響，現代人不太容易相信那些不能證實的規律，當然，並不是神秘的規律都可信，但僅僅因為“不科學”就否定那些顯而易見的規律，這種做法是很傻的。舉個非常簡單的例子，你童年時候被某種類似蛇的東西咬了一口，以後一輩子怕蛇，怕得要命，提到蛇就膽戰心驚，毛骨悚然，怕得要命，但事實上那個當年咬你一口的，根本不是蛇，只是長得像蛇。那麼顯然，你怕蛇受到那次童年經驗的影響，但是，童年經驗是否對現在生活有影響，並沒有實證科學可以支持這一結論。弗洛伊德的研究，也就是因此而猛受攻擊，說他不科學。我相信那些攻擊他的人，其實在生活中也會時不時發現一些不可迴避的事實，比如童年經驗有時的確會影響到現在的生活，再比如，夢有時候會對我們的生活有某種意義，儘管可能自己並不特別明確夢的意義，但至少會覺得有點意義，不像那些實證科學家所認為的，夢毫無意義。</p>\n<p>從產生時間上說，科學的產生遠遠要晚於那些偉大哲人對世界的探索，東方人在這方面作了特殊貢獻。如果不能被科學證實的就不可靠，那麼在科學產生以前，人類對世界的探索幾乎沒有必要，也沒有意義，因為所有的探索都可能是不可靠的。這沒法解釋儒家、道家等優秀的文化能在中國存活上千年，至今依然對中國人產生巨大影響。相反，在那些偉大的哲人看來，科學能起到的作用，是非常非常有限的。而且科學有它自身的問題，比如科學沒法接受它不能證明的事實，而隨著事實的積累，科學只能修改它的結論，逐步擴大自己的接受範圍，這裡面存在一個嚴重的問題，在它不能接受的時候，事實是不是就不科學了呢？而科學所接受的東西，是不是就真的科學呢？舉個很簡單的例子，在“日心說”產生以前，“地心說”就是科學。對於“日心說”產生以前的科學家而言，“地心說”是實實在在的科學，毫無疑問。然而在我們今天看來，“地心說”顯然不科學。但是，在那些偉大的哲人看來，比如釋迦牟尼，比如老子，在他們看來，地球當然不可能是宇宙的中心，這是最基本的常識。</p>\n<p>然而他們的貢獻不僅僅是對宇宙的探索，包括那些儒家的聖賢，他們對人心探索的深度，足以讓今天的科學心理學感到尷尬，因為始終無法超越。現代心理諮詢能快速有效地對神經症這種非常淺層次的心理問題進行治療，但在處理了神經症這種淺層的心理問題，心理健康度進一步提高之後，想要繼續提高心理健康度，一定要面臨處理一些最最基本的人生哲學問題，諸如：我是誰？我從哪裡來，到哪裡去？我能做什麼？我的價值是什麼？現代心理學界，那些號稱高級諮詢師的人，自身多半未能處理這些問題。我在別的地方有論述，一個沒有處理自己心理問題的人，是沒法給別人做相應的心理諮詢的。正是這個原因，心理諮詢面對的高層心理問題跟哲學是一致的，所以早期的佛教特別像心理諮詢，很多人有生理上的疾病，或者對人生的某些問題感到困惑，就到釋迦牟尼那兒請教，釋迦牟尼給解答一下，問題就解決了。而現代心理諮詢發現，心理的健康顯然會影響到身體的健康，所以有一部分生理上的疾病，在處理了心理問題之後，疾病也就相應地好轉，這在心理諮詢中非常常見。因此，釋迦牟尼能給人處理一些生理上的疾病，也不稀奇，這只不過是一個簡單的心理諮詢。</p>\n<p>在對人心的探索方面，中國的聖賢向來有卓越的貢獻。遺憾的是，任何一種方法，都一定會有它的弊端，因為在聖賢使用那些方法的時候，也就是當作一個工具而已，並不是最終目的。但不使用工具又不可能，而後世不瞭解聖人思想，但卻又自認為了解的人，往往特別善於把原來的思想和方法進行扭曲，貽害後人。中國古人對人心及自然規律的探索，其貢獻遠遠不限於儒家。古人所瞭解的一些規律，在現代諮詢中依然非常有意義。從古代的一些詞彙，比如“否極泰來”，比如“樂極生悲”，比如“物極必反”等判斷，這些詞彙表述的可能是同一種規律，我沒有一個很好的名詞來給這種規律命名，暫時叫它“能量的兩極更替”規律。自然界可能有一些非常基本的規律，如同四季的更替變化一樣，沒有什麼原因，本來就是那樣而已。這些基本的規律，四季的更替是其中一個，弗洛伊德所說的“性”是一個（只不過弗洛伊德所說的“性”並不僅指一般意義上的性過程，而是指緊張的釋放模式，也就是能量不斷聚集，聚集，達到高潮，之後突然的宣洩而帶來巨大的快感），還有，就是前邊所說的“能量的兩極更替”，可能也是其中的一個。意象對話心理諮詢技術的創始人，朱建軍老師專門講過這個規律。一個好的諮詢師，一定會在諮詢中碰到自己沒法解決的難題，因為每一個諮詢案件都是全新的，每個人的心理問題都跟別人不一樣，諮詢師決不會碰到兩個完全相同的心理問題，即使碰到類似的，處理也會非常不一樣，這也是心理諮詢的一大特點。假如某個諮詢師，宣稱他發明了一種心理諮詢的方法，是萬能的，碰到什麼人，都用這一招，一用就靈，那說明這個諮詢師是個非常爛的諮詢師。那些試圖以不變應萬變的人，其實背後都有一種恐懼，是對新的變化的恐懼，害怕新的變化超出自己的控制範圍，所以才試圖用一個控制一切的辦法，迴避新的變化。</p>\n<p>在碰到自己沒法解決的難題時，心理諮詢的新手跟高手有一個區別，新手會急於尋求解決的辦法，背後的心理原因是著急，擔心自己沒有能力給來訪者解決問題。這時候奇怪的現象發生了，適得其反，急於尋求解決的，往往找不到解決辦法，即使找到了，也不妥當，因為此刻所需要做的，也就不是尋求解決。有經驗的諮詢師，這時候就不會那麼著急，知道自己暫時找不到解決的辦法，也會往解決的方面努力，但是不著急，雖然暫時不能解決，但心裡有底，我相信早晚總能解決。奇蹟出現了，就是這種情況，能最終找到滿意的解決辦法，因為說到底，任何心理問題的解決，理想的情況，要靠來訪者本人，而不是諮詢師，諮詢師永遠不可能替代來訪者完成。</p>\n<p>第二種情況下，諮詢是怎麼發生效果的？碰到難題，諮詢進入僵持階段，這本是諮詢過程中的一個正常反應。進入這一階段，諮詢的雙方所要做的，其實就是堅持，堅持渡過這個難關，問題自然解決，因為諮詢進入這一階段意味著，諮詢已經進入最困難的階段，只要堅持度過這一階段，問題會不攻自破，緊跟著一定進入一種可喜的狀態。這種時候努力尋求解決的辦法，恰恰不是處理問題的辦法。所以諮詢師發現自己不知道該做什麼，並不一定說明諮詢師無能，可能相反，值得恭喜，諮詢進入最困難的階段，說明緊跟著，下一個階段就要到來。相反的，諮詢一直進行得非常順利，來訪者的每一個問題，你都能給他/她想出解決的辦法，處理起來遊刃有餘，這是不太正常的反應，假如這種情況真出現了，那諮詢師應該心裡有數，可能一個非常不順心的階段即將到來。</p>\n<p>以上這個規律，諮詢中是這樣，生活中其實也一樣。古人有一個專門的詞彙用得特別好，“居安思危”。如果最近都過得特別順，順的都似乎不那麼正常，做什麼都順，事事順心，那麼應該心裡清楚，可能一個非常不順的階段就要到來。這麼說，並不是要讓順心的時候都緊張兮兮，謹小慎微，而只是說，應該心裡有數。假如因此而緊張兮兮，那就說明是另一個心理問題了，你太擔心不順心事情的發生。相反的情況，如果進入一個特別不順的階段，事事不順心，特別困難，那麼，也不用太著急，只要心裡有底，順心的階段可能就要來了。</p>\n<p>林平之這個人，家境相當好，他一直活得很風光，正是在他最風光的時候，險遭滅門之災，這決不是什麼怪事。他林家鏢局，在武林中又備受尊崇，鏢局幾乎不出事，若是有心人，恐怕早該有所警惕。</p>\n</div>"},{"title":"第二章　受辱","content":"<div>\n<p>第二章　受辱</p>\n<p>故事梗概</p>\n<p>酒肆被人調戲的賣酒醜女，救了林平之。林平之記掛父母，不肯獨自逃生。眼見爹媽被人縛在馬背上牽走，卻又連叫一聲都不敢。為了搭救父母，忍辱偷生，屢屢受氣，甚至因為乞討而被農家婦女百般羞辱，林平之一再忍耐。一路乞食，趕往福威鏢局以外的其他鏢局，各分局其實都已被青城派佔領剷平，餘滄海原是精心策劃剷除福威鏢局的。本有機會殺死兩個青城派弟子報仇的林平之卻在猶豫中放棄，認為非大丈夫所為。茶館聆聽到江湖要聞，劉正風金盆洗手。洗手的原因，眾說紛紜。有人議論衡山派中的門戶之爭，莫大先生現身，露了一手驚人絕技，緩緩走出茶館。</p>\n<p>心理分析</p>\n<p>重創之下，林平之一再受到侮辱，這個故事情節，對於林平之心理的變化，甚至於後來心理變態、性格極度扭曲，具有非常關鍵的作用。先回顧一些他受辱的細節。</p>\n<p>酒肆有人調戲婦女，林平之路見不平，被人罵“兔兒爺”，就跟今天北京話罵人“不是個爺們”、“娘娘腔”差不多，堂堂福威鏢局的林少鏢頭，怎能受得了這口氣，與人動手之後，林平之嬌氣漸挫。領口被人抓住，便要他磕頭，對方臂上加勁，將林平之的頭直壓下去，越壓越低，額頭幾欲觸及地面。</p>\n<p>林平之被救，心中記掛父母，不肯獨自逃生，眼見父母被人縛在馬背上，張口欲叫“娘！爹！”卻立時硬生生地縮住。</p>\n<p>下面一個細節描寫實在太精彩，而且對林平之的心理影響一定非常之大，筆者忍不住全文引述。這個細節是林平之向一農家婦女乞食。為搭救父母，又身無分文，解決不了吃飯的問題，只能去乞討，運氣不好，第一次就碰了一鼻子灰。</p>\n<p>行出數里，來到一個小村莊，他走向一戶人家，囁囁嚅嚅的乞討食物。他一生衣來伸手，飯來張口，哪裡曾向旁人乞求過什麼？只說得三句話，己漲紅了臉。那農家的農婦剛和丈夫慪氣，給漢字打了一頓，滿肚子正沒好氣，聽得林平之乞食，開口便罵了他個狗血淋頭，提起掃帚，喝道：“你這小賊，鬼鬼祟祟的不是好人。老孃不見了一隻母雞，定是你愉去吃了，還想來偷雞摸狗。老孃便有米飯，也不施捨給你這下流坯子。你偷了我家的雞，害得我家那天殺的大發牌氣，揍得老孃周身都是烏青……”那農婦罵一句，林平之退一步。那農婦罵得興起，提起掃帚向林平之臉上拍來。林平之大怒，斜身一閃，舉掌便欲向她擊去，陡然動念：“我求食不遂，卻去毆打這鄉下蠢婦，豈不笑話？”硬生生將這一掌收轉，豈知用力大了，收掌不易，一個踉蹌，左腳踹上了一堆牛糞，腳下一滑，仰天便倒。那農婦哈哈大笑，罵道：“小毛賊，教你跌一個好的！”一掃帶拍在他頭上，再在他身上吐了口唾沫，這才轉身回屋。林平之受此羞辱，憤懣難言，掙扎著爬起，臉上手上都是牛龔。正狼狽間，那農婦從屋中出來，拿著四支煮熟的玉米棒子，交在他手裡，笑罵：“小鬼頭，這就吃吧！老天爺生了你這樣一張俊臉蛋，比人家新媳婦還要好看，偏就是不學好，好吃懶做，有個屁用？”林平之六怒，便要將玉米棒子摔出。那農婦笑道：“好，你摔，你摔！你有種不怕餓死，就把玉米棒子摔掉，死你這小賊。”林平之心想：“要救爹爹媽碼，報此大仇，重振福威鏢局，今後須得百忍千忍，再艱難恥辱的事，也當咬緊牙關，狠狠忍住。給這鄉下女人羞辱一番，又算得什麼？”便道：“多謝你了！”張口便往玉米棒子咬去。那農婦笑道：“我料你不肯摔。”轉身走開，自言自語：“這小鬼餓得這樣厲害，我那隻雞看來不是他偷的。唉，我家這天殺的，能有他一半好脾氣，也就好了。”</p>\n<p>還有一個細節要提，林平之在窗下偷聽青城派兩個弟子的對話：“突然喀的一聲，窗格推開。林平之吃了一驚，只道被他們發現了行跡，待要奔逃，突然間豁喇一聲，一盆熱水兜頭潑下，他險些驚呼出聲，跟著眼前一黑，房內熄了燈火。林平之驚魂未定，只覺一條條水流從臉上淋下，臭烘烘的，才知是姓吉的將洗腳水從窗中潑將出來，淋了他一身。”</p>\n<p>似乎非常巧合，人在倒黴的時候，喝水都會塞牙。喝水會塞牙，可能有點誇張，但人在倒黴的時候，什麼倒黴的事都會上身，這是有心理學原因的。心理分析很重視這樣一些巧合事件的分析，大量的案例表明，這樣的巧合是有潛意識原因的。當人的潛意識希望自己倒黴的時候，什麼倒黴的事都會碰上，表面上看很巧合，實際上每一步都不巧合，潛意識早做了安排。甚至已經有心理分析的案例表明，即使是交通事故這樣看上去特別意外的事件，都會有潛意識的原因。真正的意外，並沒有心理原因，過馬路發生交通事故，不幸地被捲入，這樣的事情反而非常罕見。多數情況下，這個人的潛意識就是想出事故。看起來很可笑，居然有人內心想倒黴，願意出事故，願意去死？其實真的不奇怪，潛意識想要實現一個願望的時候，非常執著，以至於往往意識裡非常不想，謹小慎微，細心防範，最後也還是意外地發生了。潛意識實現它的願望，一定是會獲得相應的好處的，所以才那麼執著。比如說交通事故，常見的潛意識動機：想休息，不想工作；想獲得親人的關愛，照顧等。意外死亡，也多半有心理原因，對於重性抑鬱症患者來說，活著是一件極其痛苦、極其受罪的事，死亡是很好的解脫方式，所以他們整天都在尋求死亡的機會，有人想死，這並不是什麼過於古怪的事。潛意識的力量為什麼那麼大，以至於小心防範，還是防不勝防？弗洛伊德稱這個現象為強迫性重複，我經常用一個更通俗易懂的詞來說明，叫做“滾雪球”。比如說你4歲的時候，一次肚子疼，不用上學，潛意識由此嚐到了甜頭，以後不想上學就肚子疼。由於這一過程是潛意識的，你不能因此而用道德的眼光來譴責孩子的這種行為，因為他自己也不知道，只是你會發現這個奇怪的規律，他不想上學就肚子疼。而且，值得注意的是，他肚子疼是絕對真實地疼，並不是有意騙你。這樣的過程每重複一次，潛意識的力量就會增加一部分，越來越強。越強越容易重複。而且以後形式會逐步多樣化，比如肚子疼變成頭疼，或者別的什麼地方犯病；不想上學也會變成不想工作等。</p>\n<p>根據這樣的經驗判斷，林平之突然遇上這麼倒黴的事，而且一連串都這麼倒黴透頂，那多半有潛意識原因。遺憾的是，小說提供的有關林平之生活經驗的材料太少，不足以分析清楚林平之此時的潛意識動機，但可以猜測他有潛意識原因，比如說他可能希望證明，為了父母，他的遭遇多麼悲慘。但僅只限於猜測而已。</p>\n<p>精神分析的初學者，以及外行，都經常犯一個錯誤，初學者喜歡賣弄，不管對方能不能接受，經常一口咬定別人有潛意識的問題，搞得別人很難受；外行以潛意識的動機為恥，錯誤地以為潛意識動機是很見不得人的事。其實都是一個問題，就是把潛意識層面的問題和現實層面混淆，不注意區分，把潛意識的動機拿到行為層面來評判和理解。這兩者是不同層面的問題，分屬於心理的不同深度，一定要注意區分。比如上邊的例子，假如林平之的確存在以上的潛意識動機，我們不能說這種動機好與不好，只能說對他而言，這是一個心理問題，是一種心理現實，不管你承不承認，他都存在。但對於林平之人品的評判，是現實層面的問題，即使有心理問題，他在行為層面的表現，是為了救父母，而忍受奇恥大辱，這依然是非常高尚的品質。</p>\n<p>林平之過慣了衣來伸手、飯來張口的生活，突然有這樣的遭遇，對他的衝擊一定是非常大的，這個不難理解，也很讓人同情，但他對此採取的應對方式是否妥當，筆者倒認為可以商榷。</p>\n<p>有一件事必須提一下：那姓吉的倒了洗腳水後沒將窗格閂上。林平之心想：“報仇雪恨，正是良機！”右手拔出腰間長劍，左手輕輕拉起窗格，輕跨入房，放下窗格。月光從窗紙中透將進來，只見兩邊床上各睡著一人。一人朝裡而臥，頭髮微禿，另一人仰天睡著，頦下生著一叢如亂茅草般的短鬚。床前的桌上放精五個包裹，兩柄長劍。林平之提起長劍，心想：“一劍一個，獄如探囊取物一般。”正要向那仰天睡著的漢字預中砍去，心下又想：我此刻偷偷摸摸地殺此二人，豈是英雄好僅的行徑？他日我練成了家傳武功，再來誅滅青城群賊，方是大丈夫所為。’當下慢慢將五個包裹提去放在靠窗的桌上，輕輕推開留格，跨了出來。</p>\n<p>專門提這個細節，是因為它涉及一個重要的問題，對付小人是否也要用大丈夫行為？這不是個專門的心理學問題，涉及太多方面的評判，筆者是搞心理學的，只能從心理的角度，提出自己的看法。對於餘滄海的這兩個弟子，暫時的容忍等於縱容，該殺不殺，反而不是大丈夫。排開這兩個弟子不說，很多卑鄙無恥行為的最初形成，其實都跟縱容有關，因為很多小人的無恥行為，最初都是帶有試探性的，比如說歷史上的屠殺，屠殺者最初是比較忌憚的，一旦發現沒有抵抗，就會變得沒有顧忌。所以，對付小人，不能用大丈夫行為，尤其不能縱容。</p>\n<p>鏢局的人接連被害，人心惶惶，從林平之的表現來看，他決不是貪生怕死之輩，他的性格里有非常高傲的一面。長期的心理分析發現，心理的兩個極端特點總是成對出現，比如外在表現過分自信，則意味著這個人內心裡深度自卑。意象對話子人格的分解經驗也支持這一結論，比如一個人某一個子人格表現得過分高傲的話，他就一定有另外一個相應的子人格，是很卑賤的。不過一般人很難發現，因為主人公一定經常壓抑這個子人格，這個子人格只在很少的時候出現，林平之在向農家婦乞討的時候就表現得很卑賤，儘管這樣說可能對林平之不是很公平，因為他有現實的理由，為了將來救父母。但我們在分析性格的時候，只看具體的行為表現，不看他現實的理由，因為所有的心理問題，都會在現實層面找到非常完美的藉口。在遭受巨大的羞辱時，會很難選擇，究竟是為了尊嚴而選擇死，還是為了更遠大的目標而忍辱偷生？從心理分析的角度講，要根據自己的忍耐力做抉擇。假如你確實能承受巨大的恥辱而保證不變節，將來可以實現更遠大的目標，選擇活下去沒有錯，比如一些具有偉大人格、心理力量非常強大的人，選擇活下去，而且堅持到底不變節，不但無可非議，而且讓人高度敬佩。但是，具有這樣心理力量的人，非常罕見，並不是一般人能做到的。假如不能保證自己不變節，那麼寧可選擇死，選擇有尊嚴地死去。為了尊嚴，“好死不如賴活著”這種說法嚴重不成立。</p>\n<p>對於林平之這樣一個人格本來就不完善，甚至是存在很大問題的人，其實不太適合走第一條路。假如能處理好他那個會犯賤的子人格，人都有求生的本能，選擇生沒有任何問題，但在面對尊嚴問題，這麼重大的人生選擇時，就不得不慎重。從後來林平之一再的變節，我們可以看出，他做了不該有的選擇。而後來的變節，早已在人格缺陷裡埋下伏筆。</p>\n</div>"},{"title":"第三章　小尼姑，大淫賊","content":"<div>\n<p>第三章　小尼姑，大淫賊</p>\n<p>故事梗概</p>\n<p>華山二弟子勞德諾給眾師弟師妹詳細分析青城派與林家福威鏢局之間的過節，理清來龍去脈，餘滄海的師父長青子，曾栽在林震南的祖父林遠圖的手下，餘滄海找福威鏢局復仇，表面上合情合理，但事實上，餘滄海的目標是完全佔領福威鏢局，奪取林家的辟邪劍譜，讓青城劍法在武林中無人能敵。</p>\n<p>傳聞令狐沖與惡徒田伯光為伍，挾持恆山弟子儀琳，在回雁樓飲酒。田伯光號稱萬里獨行，刀法高超而又色膽包天，四處劫淫婦女。天松道人和他天門道兄的弟子遲百城上衡陽回雁樓喝酒，遲百城不能忍受田伯光在酒樓放肆，上前動手，被田伯光殺了。天松道人跟田伯光鬥了數百回合，也在胸口，給田伯光砍了一刀。</p>\n<p>天門道人的徒弟來報，衡陽城外，發現一具屍體，是餘滄海四大弟子之一的羅人傑。屍體小腹上插著一柄長劍，那口劍是令狐沖的。劍自死者小腹插入，斜刺而上。一柄三尺長劍，留在體外的不足一尺，顯然劍尖已插到了死者的咽喉。</p>\n<p>小尼姑儀琳講述真相，儀琳被田伯光劫持到山洞裡，令狐沖出手相救，但武功不及田伯光，拼死相救，儀琳暫得脫身，但隨即又被田伯光捉住，帶上回雁樓。受了重傷，滿身是血的令狐沖又跟來。田伯光贊令狐沖：“好漢子！”令狐沖回敬：好刀法！</p>\n<p>心理分析</p>\n<p>大淫賊和小尼姑是一對。這句話絲毫沒有詆譭佛教和尚、沙彌以及善男信女的意思，儘管聽起來有些大不敬。佛教向來以嚴守清規戒律聞名，筆者內心裡對那些不吃肉的人，由衷地敬佩。而且我們知道那些高僧為什麼能超越世俗的性。其實不一定是出家人，就是在家居士，甚至一般普通人，有時候也會面臨同樣的問題，比如婚後的男人在老婆懷孕階段，不能解決性的需求，就是個挺麻煩的問題，但也總不能以這個作為外遇的藉口。佛教的修煉方法裡，就有一些跟意象對話的象徵意義完全符合，而且在意象對話看來，本身就是非常好，也非常直接的方法，比如燒香，在意象裡點一根香，想象自己的腹部有一大團能量，集中注意力觀察點燃的香，想象煙香嫋嫋。然後性能量就能得到非常直接的提升。當然，在現實裡點香也一樣可以。這個方法想出來，最早可能就是為了解決性的問題。有人推測，在初期佛教，其實很多人明顯知道這個想象帶有性意味，但是，也許出於隱諱，也許是別的原因，後來就大多數人都不知道了。不過知不知道它的象徵意義不是特別重要，只要你認真按照既定的方法修煉，就能起到作用。甚至有的時候，在不知道的情況下，效果反而更好。但是，朱建軍老師特別強調，在做佛教的修煉時，一定是戒、定、慧三者一起，或者說同步。假如只修慧，而不修戒和定，情況可能還稍微好點；假如只修戒和定，而沒有相應的智慧來解決疑惑，那對修煉者本人是非常有害的，因為戒和定可能被你變成巨大的壓抑。舉個最簡單的例子，街上碰到個潑婦，無緣無故對你破口大罵，假如你真的已經修到聖賢的境界，能看破罵你的人為什麼罵你，知道她的業力有限，能看清你們之間是哪輩子結下的恩怨，是如何造下的業，所以對於她罵你這件事也不是特別在乎，能一笑置之，那麼這樣的人格魅力當然值得稱謂；但是假如你還沒修到這樣的境界，卻非要給自己找個理由：我是信佛的，信佛的怎麼能罵人呢？！她罵我是她的心結，我應該同情她，當然不能跟她吵。心裡十分難受，卻要強顏歡笑，告訴自己不在乎，這對修煉者本人是非常有害的，儘管他/她在行為上表現得非常善良，其實是自己騙自己。</p>\n<p>處理性的問題，也是完全一樣的道理。我相信對於剛人佛門的大部分弟子而言，性的問題不可能立即得到處理，性需求問題會經常困擾他們。所以能有一些好的處理辦法，是非常有效的。不能有效處理而只是強行壓抑，會造成不良後果。巨大的性壓抑一定會產生相應的心理問題，就是在心理分析中非常常見的情況，一個性道德感極強的子人格和一個性放縱的子人格，總是成對出現，他們是很好的一對，時刻伴隨出現，特別困擾人。</p>\n<p>有人批評弗洛伊德，說他是泛性論者，又說他提倡性放縱。建議這樣的人，如果你只是精神分析的外行，出於業餘興趣瞭解精神分析心理學，那麼可以用心閱讀一兩本弗洛伊德的書，假如你真的用心閱讀過他的書，然後再做評論，我相信你得不出這樣的結論。如果自認為是精神分析的內行還得出這樣的結論，則有些不可理喻，這是難以讓人諒解的基礎性錯誤，就像內行的歷史學家對中國的專制歷史持“封建社會”一說，讓人沒法理解。</p>\n<p>弗洛伊德不提倡性壓抑是真的，但是，不提倡性壓抑，不等於提倡性放縱。不壓抑性和性放縱，完全是兩碼事。不壓抑性是承認自己有性需求，並且在適當的情況下滿足該需求，反對以過強的性道德感來限制對性的欲求，對性的幻想等，反對誤以為有性的需求就是罪惡的、有性的慾望就很可怕並要極力迴避的觀念。性放縱則是另外一回事。性放縱者決不是順應和滿足自己的性需求，而是以性的滿足來回避內心的某種痛苦。比如有的人對愛沒感覺，情感淡漠，就會以巨大的性快感來回避這種麻木不仁的感覺。不斷地追求性快感，追求性刺激，但是內心越來越空虛，越空虛就越是隻能通過性來追求刺激，這是嚴重的心理問題，弗洛伊德不會去提倡。有一點心理分析經驗的人都能明顯地看出來，這是另外一種形式的壓抑，恰恰是弗洛伊德所反對的情況。</p>\n<p>舉個例子，一個人本來心裡有性慾望，但是提到性就覺得噁心，拼命迴避，甚至身邊有人提到性，他/她都覺得骯髒，避而遠之，這是性壓抑。另外一個人說：“性是人世間唯一美好的東西，除了性，人活著還有什麼快樂呢？”那麼顯然，這是性放縱。因為除了性，他/她已經找不到生活的樂趣。正常的對待性的態度是，承認自己有欲求，適當的情況下可以滿足它，但是，性也僅僅是人生活的一部分，不是全部，除了性，生活中同樣還有很多美好的東西。</p>\n<p>提倡不壓抑性，那是不是就贊成田伯光，肆無忌憚，隨處滿足自己的慾望？也不是。這是對自己性本能的過度放縱。人具有社會性，也就要有對自己本能的約束，也就是弗洛伊德所說的，自我對本我的約束。過度放縱自己的本能慾望，不能建立自我的約束力，也是明顯的心理問題。</p>\n<p>不贊成田伯光式的放縱，但也不提倡小尼姑儀琳式的過度約束。過度約束，過於單純，儀琳式的冰清玉潔，後果就是會非常巧合地遇上田伯光這樣的大淫賊。金庸小說裡有一個最典型的例子，是《神鵰俠侶》裡面的小龍女，從小生活在古墓裡，不懂人世常情，對男女情事更是一概拒絕，純潔如同冰雪一般，一塵不染，外貌又如同天女下凡，美得罕見。小說裡有一個讓人無比鬱悶，又無比遺憾的細節，就是，小龍女一出古墓，馬上被人迷姦。筆者也對小龍女的不幸遭遇深感同情，但是，從心理分析的角度看，小龍女被人迷姦，這樣的事實再正常不過了。過度的性純潔，心理問題上最直接的結果，就是導致性不潔。這是心理諮詢中非常常見，也非常有意思的一種現象。</p>\n<p>為什麼小尼姑和大淫賊這樣的子人格，總是成對出現？當一個人壓抑她的性慾望時，一定是和相應的性慾望同時出現的。沒有慾望就不用壓抑。正因為出現了慾望，才需要壓抑。壓抑下去的慾望不等於不存在。每一次壓抑其實都是這一過程的重複。壓抑越多，等於慾望也就越強烈。但這一過程是無意識的，所以小尼姑並不知道她自己有慾望強烈的一面。把壓抑和被壓抑的這兩個側面分開，就是兩個不同的子人格。當小尼姑對壓抑的那個子人格認同更多的時候，表現是非常純真。當潛意識對那個被壓抑的子人格認同更多時，就往往會在現實層面發生難以預測的巧合，比如被大淫賊劫持。</p>\n<p>儀琳續道：“這惡人伸手抓住我衣襟，說道：‘你不上樓去陪我喝酒，我就扯爛你的衣服。’我沒法子，只好跟他上去。這惡人叫了些酒菜，他也真壞，我說吃素，他偏偏叫的都是牛肉、豬肉、雞鴨、魚蝦這些葷菜。他說我如不吃，他要撕爛我衣服。師父，我說什麼也不肯吃，佛門戒食葷肉，弟子決不能犯戒。”</p>\n<p>在現實的層面上，你不得不同情她，因為不陪人喝酒，小尼姑就要被人撕衣服。小尼姑的壓抑不止是性方面的，還有酒肉之類，小說裡最後的結果，儀琳保持了清白，而且很堅定，始終沒有吃肉喝酒，但對小尼姑而言，有被淫賊劫持這樣的奇遇，已經是件非常有意思的事。假如田伯光真撕她衣服，儀琳因此不得已而破了戒，甚至故事出現儀琳被玷汙這樣的情節，其實都是非常有可能的。從心理分析的角度看，出現這樣的不幸，並不奇怪。</p>\n</div>"},{"title":"第四章　田伯光的好漢氣概","content":"<div>\n<p>第四章　田伯光的好漢氣概</p>\n<p>故事梗概</p>\n<p>為救儀琳，令狐沖在回雁樓和田伯光喝酒，鄰桌的青年男子遲百城，泰山派弟子，不能忍受淫賊田伯光大言不慚，挺劍向田伯光刺去，瞬間胸口中刀倒下。天松道人出劍疾攻，田伯光不起身，擋了二三十招。令狐沖拔劍疾刺，田伯光起身：“令狐兄，我當你是朋友，你出兵刃攻我，我如仍然坐著不動，那就是瞧你不起。我武功雖比你高，心中卻敬你為人，因此不論勝敗，都須起身招架。對付這牛……牛鼻……卻又不同。”田伯光刀法疾快，天松道人又是胸口中刀，按住胸口，衝下樓梯。</p>\n<p>令狐沖自知打不過田伯光，便設計跟田伯光坐著打，規矩是，誰的屁股先離開椅子，誰就算輸，目的是讓儀琳趁他們打鬥的時候離開。偏偏儀琳死活不肯走，怕令狐沖被害。令狐沖被打倒，田伯光一起身才知上了當，原來令狐沖雖被打倒，屁股卻始終沒有離開椅子。田伯光將單刀往刀鞘裡一插，大踏步下了酒樓。</p>\n<p>羅人傑神色無禮，令狐沖重傷之餘打他不過，被他一劍插入胸膛。令狐沖馬上以《辟邪簡譜》的秘招為計，騙他接近，一柄長劍從羅人傑的小腹之中刺入。</p>\n<p>儀琳講述完回雁樓驚心動魄的打鬥，人群中多出一個約莫十三四歲年紀的女童，穿一身翠綠衣衫，皮膚雪白，一張臉蛋清秀可愛。又是哭又是鬧，卻把餘滄海碰得一鼻子灰，接連受辱。眾人滿腹疑團解不開，好笑又好氣，也不知這女童什麼來歷。</p>\n<p>心理分析</p>\n<p>每個人的子人格都絕對不止一個，參加意象對話督導小組的人，對這一點的感受尤其明顯。新手比較不容易發現，但對於一個意象對話的心理諮詢師，發現別人不同子人格的能力是非常強的。只有能敏銳地發現來訪者正在使用的子人格，才有利於幫助對方發現和了解自己。因為來訪者總是誤以為自己非常瞭解自己，其實剛好相反，時刻知道自己在幹什麼的人，極為罕見。一般人對自己大多數的子人格並不瞭解。而這些子人格的發現恰恰是最有用的，因為人都喜歡瞭解自己表現好的地方，而不太樂意承認自己表現不佳的地方。對心理健康而言，真正有用的發現，是發現那些被壓抑的子人格，因為不發現的話，它對你的影響是無意識的，常常出了問題不知道為什麼，而且無意識的影響力量是非常大的。發現並不一定就能解決問題，但它是解決問題的開始，至少，發現以後，它對你的無意識影響會減弱。</p>\n<p>比如一個人，平時話不多，參加了某一個比賽，在剛才的競賽中表現很差，比賽一結束，馬上拉著一個人聊天，話變得特別多，多得讓人反感。假如被拉住聊天的人是諮詢師，可能比較敏感地知道這個人在幹什麼。因為跟平常情況相比，這個人此時此刻明顯換了一個子人格在說話，這個說話的子人格究竟想幹什麼，暫時可能不是特別清楚，但可以猜測，他也許想對剛才的表現做出解釋。似乎很簡單，但如果你此刻問他知不知道自己在幹什麼，就會發現，真正清楚的人並不多，即使有的人知道，也需要猶豫一下，考慮要不要說，也有的人猶豫是因為還沒看清，需要反觀一下，才清楚自己在幹什麼。</p>\n<p>假如這個人能承受的話，諮詢師這時候點撥他/她一下是有好處的，儘管會覺得有些不光彩。之所以不斷跟人解釋，是因為他/她不願意面對自己的情緒，因為沒表現好而帶來的情緒，可能是悲哀，傷心，或者別的，反正是負性情緒。諮詢師幫他面對了一次，那麼下次碰到類似的情況，他/她就更容易知道自己在幹什麼。不至於正在幹一件招人反感的事情，自己還不知道。如果這個人被點撥之後，突然變得特別乖，特別可愛，什麼話都不說，那麼適當的話，可以再讓他/她看一下，現在又在幹什麼了，裝可愛？裝乖？</p>\n<p>就這麼瞬間，已經出現至少兩個子人格。所以一個比較自知的人會發現，自己絕對不止一個子人格，什麼樣的場合，出現什麼樣的子人格，其實都是很有規律的。以上是用於心理諮詢，所以會相對比較殘忍，專門找別人不願意面對的子人格。如果我們不是在做諮詢，而是在評價一個人，這也是非常有用的一點常識。</p>\n<p>在前面對田伯光的瞭解中，我們可以留意到，他可能有一個非常好色的子人格，見到儀琳這樣的小尼姑也起邪念；可能還有另外一個子人格，是放縱自己本能的，隨心所欲的。因為不止他田伯光，其實很多人見了儀琳這麼可愛的女孩子，都可能產生邪念，這並不奇怪。但是，一般人這種時候會有另外一個子人格出現，控制自己的慾望，邪念歸邪念，付不付諸行動又是另一碼事。但是田伯光則不一樣，他可能出現另外一個子人格，放縱自己的本能慾望，想要就去搶。田伯光每次幹壞事，應該不是那個好色的子人格獨立完成的，因為好色的人不少，也不止他田伯光一個。但是別人就可以管住自己，而田伯光不行。只有在這兩個子人格結合的情況下，加上他武功高強，才會顯得有些肆無忌憚。</p>\n<p>這樣的子人格，當然不是要提倡的。但是，評價一個人不能只憑他的某一個側面就完全作出結論。結論並不是最重要的，儘可能多地展示他的各個側面，這才有用。田伯光身上，其實還有非常講義氣的一面，這是很值得肯定的品質。</p>\n<p>“突然間只見令狐大哥身子一晃，連人帶掩倒下地來，又見他雙手撐地，慢慢爬了開去，那隻椅子壓在他身上。他受傷甚重，一時掙扎著站不起來。田伯光甚是得意，笑道：‘坐著打天下第二，爬精打天下第幾？’說著站起身來。令狐大哥也是哈哈一笑，說道：‘你輸了！’田伯光笑道：‘你輸的如此狼狽，還說是我輸了？’令狐大哥伏在地下，向道：‘咱們先前怎麼說來？’田伯光道：‘咱們約定坐著打，是誰先站起身來，屁股離了椅子……便……便……便……’他連說了三個‘便’字，再也說不下去，左手指著令狐大哥。原來這時他才醒悟已上了當。他已經站起，令狐大哥可兀自未曾起立，屁股也未離開椅子，模樣雖然狼狽，依著約定的言語，卻算是勝了。”眾人聽到這裡，忍不住拍手大笑，連聲叫好。只餘滄海哼了一聲，道：“這無賴小子，跟田伯光這淫賊去耍流氓手段，豈不丟了名門正派的臉面？”定逸怒道：“什麼流氓手段？大丈夫鬥智不鬥力。可沒兄你青城派中有這等見義勇為的少年英俠？”她聽儀琳述說令狐沖奮不顧真，保全了恆山派的顏面，心下實是好生感激，先前怨怪令狐沖之意，早就丟到了九霄雲外。餘滄海又哼了一聲，道：“好一個爬在地下的少年英俠！”定逸厲聲道：“你青城派……”劉正風怕他二人又起衝突，忙打斷話頭，向儀琳道：“賢侄，田伯光認不認輸？”儀琳道：“田伯光怔怔地站著，一時拿不定主意。令狐大哥叫道：恆山派的小師妹，你下來罷，恭喜你新收了一位高足啊！原來我在屋頂窺探，他早就知道了。田伯光這人雖惡，說過了的話倒不抵賴，那時他本可上前一刀將令狐大哥殺了，回頭再來對付我，但他卻六聲叫道：‘小尼姑，我跟你說，下次你再敢兄我，我一刀便將你殺了。’教本來就不願收這惡人做徒弟，他這麼說，我正是求之不得。田伯光說了這句話，將單刀往刀鞘裡一插，大路步下了酒樓。”</p>\n<p>這是儀琳給眾人講述的發生在回雁樓的事，假如田伯光只是一個十惡不赦的大惡人，此刻完全可以殺死令狐沖，再殺死儀琳，根本不用去管什麼約定，也不用考慮什麼輸贏。他並沒有完全遵守約定拜小尼姑為師，但也還沒有出格。也許正是因為他身上有英雄好漢的這個側面，才會敬重令狐沖是條漢子，連續多次沒有殺掉令狐沖。</p>\n</div>"},{"title":"第五章　人以群分","content":"<div>\n<p>第五章　人以群分</p>\n<p>故事梗概</p>\n<p>令狐沖創口癒合，和儀琳在瀑布旁看螢火蟲，對著流星許願。聽到劉正風和曲洋演奏《笑傲江湖》曲，嵩山派費彬出現，殺死曲非煙，那個又哭又鬧的綠衫女童，曲洋的孫女，想要再殺令狐沖，劉正風一群人滅口。瀟湘夜雨莫大先生到來，及時殺死費彬，收劍遠去。曲洋把《笑傲江湖》曲交給令狐沖，請他保存，流傳後世。曲洋和劉正風兩人雙手相握，齊聲長笑，絕脈自盡。</p>\n<p>廟宇裡，木高峰脅迫林震南夫婦交出《辟邪劍譜》，令狐沖設法把木高峰引開，林震南夫婦已然身受重傷，臨終之際，把劍譜的秘密託付給令狐沖，讓他轉告林平之。天將黎明，岳不群及眾弟子也來到廟宇，令狐沖跟隨師父回華山。岳不群責罰令狐沖，此番下山，大損華山聲譽，面壁一年，作為懲罰。</p>\n<p>心理分析</p>\n<p>人和人交往是一件很複雜的事情，有些人相信理智可以完全控制情感，憑著理智就可以決定自己的人際交往。這在我們看來太過於弱智和簡單化，人的情感決不是那麼容易控制的。理智其實只在部分情況下能控制情感，很多時候是沒法控制的，至少，你沒法控制那些你自己不知道的情感。比如說，你和一個朋友突然合不來了，有些時候你根本不知道為什麼，也沒有理由，沒有徵兆，也沒發生什麼明顯的衝突，反正就是合不來了。這種時候，你試圖通過理智的方式加以挽回，那多半是徒勞的，因為這種不冷不熱的關係一定不是你能控制的。即使真的挽回了，也會覺得相處特別沒勁。當然，假如通過一番新的磨合，可能能重新很好地相處，但你並不知道為什麼，你也不知道究竟是什麼東西起了作用。</p>\n<p>搞心理諮詢的人，通過分析，多半能找出其中的原因，知道真正的衝突在哪兒。沒有諮詢師的幫助，自己一般說來很難知道，儘管很多人對這一點十分之自信，後來的分析發現過去所認為的自知，也不過是騙自己而已。在不知道為什麼的情況下，極力壓抑自己的情感，是沒有好處的。壓抑的情感，總有暴發的時候，只是自己往往不知道罷了。而且也往往不大願意知道，因為知道了是一件蠻讓人難受的事情。比如一個很理智、很喜歡學術、甚至帶那麼一點憤世嫉俗、或者整天談論遠大理想的人，多數情況下，周圍人會很討厭他/她，但他/她自己不知道。不知道別人討厭自己，知道了也不知道為什麼。有時候知道了別人討厭自己，但會輕蔑地一笑：“這有什麼，我才不在乎這些庸俗。”說這話的時候，其實心裡蠻難受。</p>\n<p>夫妻配偶之間的關係也一樣，生活中很多人有這樣的經驗，兩個非常聰明的人不容易相處。剛開始相互都很欽佩，不自覺地就走一塊兒去了，但是時間久了就會發現相互之間沒感情。因為兩個只用大腦不動情感的人，關係的支撐靠的是欽佩，佩服，而不是真正男女之間的感情。佩服的東西接觸久了也就沒新意了，這是必然的。在一般人心目中會覺得那些具有偉大人格魅力的人非常了不起，覺得離自己特別遙遠，心中充滿崇敬，但當你生活在他/她身邊，每天晚上睡一張床，看到赤條條、擁有所有普通人的一切正常欲求的他/她時，那種崇高的敬意一定會慢慢減弱。而一對夫妻是要在一起生活數十年，甚至上百年的，不是一天兩天，所以單靠欽佩之情支撐的夫妻關係是不大靠得住的。</p>\n<p>人與人交往的過程中，顯然，情感起著決定性的作用，而不是理智就能控制的。具體什麼樣的情感與什麼樣的情感結合，倒似乎沒有什麼絕對匹配的原則。但有一點值得注意，就是病態的結合跟健康的結合，往往兩者在表面上非常相似，所以很難區分，多數時候能把自己都欺騙過去。比如健康的戀愛，相互之間會有巨大的吸引力，這種吸引力大得能讓人不顧一切，不被任何現實的因素阻撓，包括工作變遷、兩地分居等。而有一種病態的戀愛，不是真愛，是由於雙方一個共同的情結，比如受虐狂與施虐狂，兩人也會愛得死去活來，甚至可以放棄生命。</p>\n<p>不僅男女之間的情感如此，一般的人際交往也是這樣。帶有目的性的交住不太可能維持長久，只有那種純粹的友誼，日久才能見真情。但要區分是否帶有目的性，是不是純粹的友誼，也是很困難的。真心的朋友可以肝膽相照，但是有些病態的朋友也可以把心掏出來給對方看，也可以為朋友賣力，賣命。有一個大概的區分方向，比如朋友落難，我現在想救他，如果我就是想救，沒有任何原因，這是真心；如果我救朋友是有原因的，比如考慮到朋友曾經救過我，不救的話對不起別人，或者覺得這樣於情理上說不過去，那麼這就不是真心。</p>\n<p>區分起來很困難，但從上面這些例子不難看出，“物以類聚，人以群分”這種說法是有道理的。真正不帶情結的交往極為罕見，所以暫且不提。對於大多數人而言，情結的互相吸引和排斥，決定了你能與什麼樣的人交往，不能與什麼樣的人交往。相應的情結會決定這個人對你特別有吸引力，或者讓你感覺特別排斥。這跟長相多半沒多大關係，有時候一個人長得很好，但你就是討厭他/她。另一個人長得不怎麼樣，但對你就是有吸引力。</p>\n<p>但情結的吸引和排斥，並不一定是相似的就吸引，相反的就排斥。比如一個有權威情結的人，跟另外一個權威的人就很難相處。也不是相反的就一定排斥，相似的就一定吸引。前面舉過一個例子，受虐狂和施虐狂就不互相排斥。不過排斥和吸引也不是沒有規律的，一定是相應的情結互相吸引和排斥。</p>\n<p>比如一個權威情結的人，碰到一個恰好需要權威感的人，他們之間就很容易配合。一個特別有母性的女孩，跟一個母性情感缺乏的人，會情投意合。排斥的情況也一樣，一個對權威有情結的人，恰好碰上一個很權威的人，那可能見了就煩，儘管這是初次相識，人家也沒得罪你，但你就是討厭他/她，似乎毫沒理由。一個從來就被母愛控制，難以擺脫而痛苦萬分的男孩，就不太會喜歡一個很有母性的女孩。有時也不一定因為缺乏而吸引，比如長期被母愛控制，擺脫不了這個情結的男孩，也會找一個很母性的女孩，重複與母親之間的情結。但是顯然，吸引他的也還是這個相應的情結。</p>\n<p>這種情結上的吸引，不能用道德感、價值觀，或者人品問題來判斷。小說中劉正風與師兄莫大的關係，體現得非常明顯。劉正風威望很高，並非貪圖名利的小人，師兄莫大受人尊敬，也是江湖好漢敬佩的前輩高人，但他倆就是合不來。</p>\n<p>曲詳嘆道：“劉賢弟，你曾說你師兄弟不和，沒想到他在你臨危之際，出手相救。”劉正風道：“我師哥行為古怪，教人好生難料。我和他不睦，決不是為了什麼貧富之見，只是說什麼也性子不投。”曲洋搖了搖頭，說越：“他劍法如此之精。但所奏胡琴一味悽苦，引入下淚，未免大也俗氣，脫不了市井的味兒。”劉正風道：“是啊，師哥奏琴往而不復，曲調又是儘量往哀傷的路上走。好詩好詞講究樂而不淫，哀而不傷，好曲子何嘗不是如此？我一聽到他的胡琴，就想避而遠之。”</p>\n<p>劉正風可謂一語正中要害，他師兄弟不和，決不是因為貧富之見，而是性子不投。劉正風與曲洋的交情，小說裡提供的資料，還不足以確定，究竟是真正的超脫世俗，還是由於某一個情結的互相吸引。因為雖然兩人都超凡脫俗，只因為對音樂的愛好而成為至交，但這不足以說明是真正的超脫。比如某些病態的地下搖滾樂團，也顯得超脫世俗，但他們對音樂的共同愛好，其實是因為某一個共同情結，比如都有自殺的衝動。但莫大這個人，一定有一個沒解開的心結。他的音樂悽苦、引人淚下，對這種音樂的愛好，一定是因為他個人內心的感情基調便即如此。大度健康的人也可能喜歡哀婉的情調，但不會永遠喜歡，而且只喜歡這一種。一個人沉迷於這種情調，一定說明他還有相應的心理問題沒有解決。劉正風的評價其實非常到位，好詩好詞講究樂而不淫，哀而不傷，好曲子何嘗不是如此？但筆者這麼說，絲毫沒有貶低莫大先生人格的意思。事實上我一直特別佩服莫大這個人，因為我總覺得這個人挺有魯迅的風格，感情基調低，冷而寒，在曲洋這樣的人看來不免俗氣，脫不了市井味，但不脫市井味，並不說明他世俗，魯迅其實挺不接受世俗的。對世俗的不接受，是因為他對人性有極為深刻的洞察。這種人非常可敬，但往往對他敬而遠之，因為他眼光銳利，又不太合群。劉正風不是一個斤斤計較，沒有寬容心的人，但莫大這個人的確不是很好相處。而且莫大的音樂過於哀傷，一個情感基調不那麼悲涼的人，不容易接受，聽了一定不太舒服。劉正風的感覺特別對，一聽到他的胡琴，就想避而遠之。</p>\n</div>"},{"title":"第六章　令狐沖失戀","content":"<div>\n<p>第六章　令狐沖失戀</p>\n<p>故事梗概</p>\n<p>令狐沖面壁，小師妹嶽靈珊每天搶著送菜送飯，也從不忘記帶一小葫蘆酒，那是大師哥的最愛。兩人一見面聊得沒完沒了，每天有師妹相陪，因此令狐沖雖在危崖獨居，倒也不感寂寞。</p>\n<p>兩月後的一天，開始下雪，嶽靈珊在上崖的路上摔了一跤，把飯籃掉山谷裡去了。左額上還撞破了老大一塊，像個小雞蛋般高高腫起，鮮血直流。當晚沒法回去，便在山洞裡睡了，夢到自己在瀑布旁一把將林平之推下去。第二天說起自己的夢，嶽靈珊言語間不斷提到林平之，罵他不中用，練劍不長進，偏生用功得緊，日練夜練，教人瞧得生氣。</p>\n<p>當日黃昏，高根明送飯上來，說道嶽靈珊受了風寒，發燒不退，臥病在床。嶽靈珊這場病生了十幾天，到得她又再上崖，卻是二十餘日之後了。令狐沖記掛師妹，不思茶飯，到得見面，已瘦得極為厲害。下崖分別時，師妹眼神含情脈脈，難捨難分，纏綿良久，才最終離去。令狐沖歡喜無比。</p>\n<p>過了二十餘日，嶽靈珊才提了一籃粽子上崖，提到林平之，已改口叫“小林子”，說小林子陪自己採蘑菇，自己教小林子練劍，小林子倒也不笨，學得很快。只是要強，勤懇練劍，日夜不停。旁人要練三個月的劍法，他只半個月便學會了。總要拉小林子陪自己玩，他卻不肯爽快答應。令狐沖一口粽子在嘴裡，竟然無法下嚥……</p>\n<p>又盼得十餘日，才把師妹盼上山來。談的都是練劍，小林子給自己喂著。嶽靈珊想要在師哥面前展示一下新練的“玉女劍十九式”，令狐沖用青城派的松風劍法，以掌做劍，無意中把師妹的劍震飛，墜下山谷。</p>\n<p>又過了十八日，師妹才和陸大有一起上崖。下崖時，山坳後面飄來師妹清亮的歌聲，曲調甚是歡快流暢。原來是福建山歌，是小林子教的。以後見面多屬不愉快，而師妹下山總唱歡快曲子。</p>\n<p>從陸大有口中，確知一眾師弟師妹都在可憐自己，都知道小師妹不跟自己好了，陸大有還試圖設法幫自己挽回。令狐沖大病一場，這場病直生了一個多月。期間師妹來過三次，第二次見令狐沖神智已復，十分欣喜。第三次令狐沖已能坐起身來。自這次探病之後，她便絕足不來。</p>\n<p>心理分析</p>\n<p>弗洛伊德總結了很多種防禦機制，後來他的女兒安娜又做了補充和發展，雖然並不完備。我們今天的實踐中發現還有很多常用的防禦機制是他們沒有總結到的，這也有可能是文化差異，某些方式是中國人愛用而他們歐洲人並不常用的，但他們所總結到的，幾乎都非常經典，尤其像“投射”這樣的防禦機制。今天的精神分析實踐依然證實，它極為常見，用得非常普遍，幾乎每個人每天都在大量使用。</p>\n<p>他們所總結的防禦機制中，有一種叫做“反向形成的，使用頻率也很高。它的表現形式，大概就是，一個人表現出來的情感，與他/她內心真實的情感，極端相反。有時候能讓你明顯感覺到很假，有時候不容易感覺到，因為他/她可能表現得極為真實，連他/她自己都被騙過了。有時候上了年紀的母親會使用這種防禦機制，比如說某位母親，見了鄰居家的孩子，表現得特別親密，親切地抱抱，摟在懷裡撫摩，嘴上一邊親吻，一邊還絮絮叨叨說個不停：兒啊，你真是討人喜歡，大媽好喜歡你，見了你就像見了親生兒子一樣，你要是過繼給我做兒子我都不嫌多，一樣喜歡，一樣疼你……”其實這位母親心裡很討厭這個孩子。當然，有這樣的表現，並不一定就是假的，區別就在於，如果是真的，你會感覺到她真的很喜歡你，她的親密讓你感覺到很舒服；但是，如果她是使用防禦機制，就會讓你感覺特別不舒服，儘管表現得很喜歡你，總讓你感覺有個地方不對勁，很彆扭，很難受。</p>\n<p>兩種極端的情感，以討厭和喜歡，愛和恨最為常見。這種防禦機制，使用最多的，其實是青春期孩子。它的起源，最早主要也就是青春期開始使用。因為這個時期，是人的發展過程中，情感矛盾衝突最明顯，整合最重要的時期。常常有一個上了中學的男孩，回家在父母面前說他如何如何討厭班上某個女生，長得又醜，又不會打扮，簡直難看死了，還招人討厭，見了面就讓人心煩，沒一點好……當然，女孩也一樣。這種時候，你最好不要輕易相信他們的話，他/她在激烈討厭一個異性的同時，可能恰好說明，他/她內心裡愛上這個人了。不愛她/他，又何必老提起她/他？班上也不是所有人都討厭，為什麼偏偏你那麼討厭人家？又為什麼你不討厭別人，偏要討厭她/他？</p>\n<p>沒有得到處理的心理問題，不會隨著年齡的增長而自動消失，它會一直伴隨你，適當的時候就表現一下。所以人在成年以後，也有時候會用青春期的方式，並不奇怪。只要不成為影響正常生活的障礙，偶爾用一下也不是什麼大不了的事。但知道要比不知道好，不知道的情況下使用太多，就可能影響正常生活。</p>\n<p>熟悉了這種防禦機制，再來看嶽靈珊跟林平之的關係，就會很容易理解，嶽靈珊對林平之的愛，早在她大罵林平之不中用，不長進的時候，已經開始了。白天罵他，睡著了也罵，連說夢話都要揍林平之這小子。</p>\n<p>令狐沖笑小師妹，說她是“日有所思，夜有所夢”。“日有所思，夜有所夢”，這種說法有道理嗎？通過大量夢例的分析實踐，我們發現，“日有所思”的東西，在一些情況下的確就可能在夢中出現，但也不是所有的夢都這樣。而且，當“日有所思”的東西出現在夢中時，它所代表的意義，多半已經不是日間所想的意思。</p>\n<p>比如嶽靈珊做的那個夢，筆者顯然不可能去給真實的嶽靈珊解夢，但根據她的表現，可以有一些推斷，她夢中的林平之，可能不代表現實中的林平之，而是另有含義。夢中在瀑布旁邊，嶽靈珊把林平之推下去。把人往深淵裡推下去，可以肯定她對這個人，心理上是不接受的。再來看她不接受的林平之到底是什麼樣？夢中，嶽靈珊要求林平之陪她去瀑布中練劍，林平之不肯，嶽靈珊才騙他到瀑布旁邊，一把推下去。精神分析的諮詢師一定對劍的象徵意義非常熟悉，雖然在每個夢裡具體意思不一樣，但有一些特點是基本的，比如說劍肯定是陽性的，不太可能是陰性。可以代表男性，也可以代表男性的性。瀑布、水、深淵，一般代表女性，也可以是女性的性。到瀑布中練劍，這個象徵意義是非常明顯的，劍舞來舞去，而且是在瀑布中，這是個絕好的性愛過程的象徵，正可謂水乳交融。為什麼嶽靈珊的潛意識會有這樣的想法，似乎挺奇怪。看看做夢之前，嶽靈珊和令狐沖在山洞中的情感表現，也就不會覺得很奇怪了。嶽靈珊緊緊握住他的雙手，心中柔情無限，低低叫了聲“大師哥”。令狐沖想張臂將她摟入懷中，卻是不敢。兩人四目交投，你望著我，我望著你，一動也不動，大雪繼續飄下，逐漸，逐漸，似乎將兩人堆成了兩個雪人。</p>\n<p>嶽靈珊之所以把林平之推下去，是因為他不順從自己的意願，不陪自己去瀑布中“練劍”。自從收了個小師弟，嶽靈珊挺為這件事得意，可以看出，嶽靈珊不是一個很柔情的女性，希望她的男性能像個師弟一樣服從自己的意願。當對方拒絕服從時，寧願採取比較極端的方式，把他推下深淵。在個人層面看來，把這個男性當做她的一個子人格，採取的方式意味著，她可能把這個子人格強行壓抑下去。在現實層面看來，她可能採取極端的方式，排斥這樣的男性。因此，被她推下深淵的，與其說是林平之，不如說是令狐沖，是令狐沖這樣一個不可能服從她意願的男性。</p>\n<p>林平之是令狐沖的一個子人格，他們有的地方很相像，嶽靈珊概括得很到位。一方面，他倆都很有俠氣；另一方面，他倆都很有傲氣，都驕傲得很。但是，這顯然不是真正能吸引嶽靈珊的地方，真正吸引她的，是林平之身上有而令狐沖沒有，也不可能有的東西，就是像個小師弟一樣服從自己的意願。</p>\n<p>這次上山的時候，很巧，嶽靈珊摔了一跤，這正是我們心理分析特別值得注意的細節。摔跤可以有兩個明顯的好處，第一，可以讓令狐沖心疼自己：第二，受點傷就不用再給令狐沖送飯。這段時間跟林平之練劍，嘴上罵得很厲害，不斷罵林平之，但潛意識可能已經意識到自己對林平之的愛，因此，在現實層面，她還是很樂意給師哥送飯，但潛意識未必真的樂意，這個時候摔跤正是心裡情感矛盾衝突的體現。這不過是個小小的開始。</p>\n<p>但緊接著，嶽靈珊大病一場，病了十幾天。這時候情感已經暴發。精神分析的諮詢師，從她夢中的細節，把林平之推下深淵，已經可以預料到，她最近多半會以一種比較極端的方式，懲罰一下自己，要麼出點意外，要麼大病一場。嶽靈珊採取了第二種方式。大病之後，她可能以一個新的面孔出現，因為那個不聽話的子人格，已經被她強行壓抑下去。短時期內也許還會表現出對令狐沖情感的纏綿，但病好之後，對另一個人的感情一定會一發不可收拾。</p>\n<p>對於林平之這個人格側面一，令狐沖有的，多半是嫉妒。覺得林平之比自己俊美十倍，沒法跟人比，自己又是個孤兒，林平之雖然現在遭了殃，但人家身世畢竟比自己好得多。這樣的態度，這個側面顯然沒有得到很好的處理。在沒能處理這個問題的情況下，要挽回與嶽靈珊的戀情是不可能的。林平之這個側面在令狐沖身上有很重要的地位，但他其實到最後也一直沒能解決這個問題，也沒能挽回師妹的愛。</p>\n<p>在心理分析的人看來，早在嶽靈珊把“林平之”推下深淵的時候，他們感情的破裂已經有明顯的徵兆。令狐沖失戀，幾乎已經是註定的事情，剩下的只是時間長短的問題。令狐沖失戀，遭受感情的重創，大病一場也是生活中非常常見的應對方式。生重病也有好處，既可以暫時迴避面對，又可以獲得別人的關愛。期間師妹就曾三次來探病，令狐沖感到非常欣喜。</p>\n</div>"},{"title":"第七章　打不過也不跑","content":"<div>\n<p>第七章　打不過也不跑</p>\n<p>故事梗概</p>\n<p>岳不群夫婦上崖看望令狐沖，嶽夫人檢驗令狐沖劍法，全力以攻，一劍使得性發，收手不住，差點要了令狐沖的命。令狐沖為了救命，情急之下使出一招，是石壁上偷學的招數，制住嶽夫人。岳不群驚怒，大談華山派劍宗與氣宗的分裂、內訌、自相殘殺，藉以教育令狐沖好好練氣，以免走上劍宗的邪路。</p>\n<p>故人來訪，竟是“萬里獨行”，作惡多端的田伯光。擔來兩壇一百三十年的陳酒，要和令狐沖喝個痛快。喝過三大碗，見面之誼已盡，想要領教田伯光快刀，但又深知自己不是對手，令狐沖腳底抹油，溜煙逃跑。田伯光更快，令狐沖只奔出數丈，田伯光已攔在面前。</p>\n<p>田伯光表明自己的意思，只是要請令狐沖去見儀琳，並無惡意，但是無論如何必須去。令狐沖可殺不可辱，大不了送上性命，就是不被人脅迫。田伯光也不願意硬逼，便和令狐沖打賭，只要能接快刀三十招，田伯光立即走人。倘若三十招都接不下，令狐沖便跟田伯光下山。令狐沖拔劍便攻，沒想到才接了五招，劍已脫手，只能耍無賴，自己沒說過輸了就下山。山洞裡偷學，出來接了十八招；再次偷學，接了二十一招。令狐沖動了殺念，招招直取對方性命，還是奈何不了田伯光。絞盡腦汁也無勝算，只是跟田伯光胡謅。騙田伯光說山洞裡有前輩高人風太師叔指點，弄巧成拙，忽聽得身後有人冷冷地道：“倘若我當真指點幾招，難道還收拾不下這小子？”</p>\n<p>心理分析</p>\n<p>在一般人看來，比武打鬥，武藝強弱決定勝負，武功高強的勝，武藝低微的，技不如人，當然只有輸的份。生活中跟人吵打也是一樣，體格強健，能吵能打的就厲害，身體脆弱，個頭較小就要被人欺負。但通過心理學的觀察和分析，筆者覺得事實上不是這樣，至少不完全是這樣。當然，筆者這麼說，並不是要提倡在生活中跟人吵打，也不是要教人怎麼吵架，怎麼打架，而只是想描述一種事實。</p>\n<p>跟人吵打，其實更多的是一種心理力量的比拼，而不光是武力的較量。生活中非常常見，一個瘦小的小個頭把一個大塊頭治得服服帖帖，並且絕對不是因為小個頭練過什麼神功，或是秘籍。他就是讓人畏懼，這種畏懼，只要他往那兒一站，氣勢自然就有，不是靠打出來的。真要打起來，他倒的確沒有還手之力。而一個體格強健的大個頭反而會膽小怕事，讓旁觀者覺得莫名其妙，這麼高大威猛的一個人，竟被面前的一個小孩欺負，他其實只要一出手，輕而易舉就可以把對方提在手裡，隨便搖晃。</p>\n<p>這樣奇怪的場面，真正起了作用的，其實是背後的情緒。一般說來，一個內心壓抑憤怒過多的人，容易帶有強烈的攻擊性，這種攻擊性不是故意表現的，是一種自然的透露，即使沒接觸過的人，往他身邊一站，也能自然地感覺受到威脅。而一個恐懼情緒佔了主導的人，就是容易害怕，沒跟人吵上，自己內心先開始怕了。一個比較健康的人，不是有力量，是有面對的勇氣，我不跟人吵，但如果吵上門來了，我也不怕。可能打不過對方，但我就是不怕。</p>\n<p>有些情況例外，就是內心壓抑情緒過度的。比如一個內心極度恐懼的人，也會表現得讓人膽怯，因為他可能二話不說，衝上去就要砍死對方，但這樣的人，內心起作用的，還是恐懼，他離自殺已經不遠了。即使不是自殺，潛意識也會尋找一個合適的場合，然後這人就被殺了。因為恐懼過度，活著已經極度痛苦，他們會覺得還不如死了好。</p>\n<p>遇上吵打，真正重要的是勇氣，不是武力。只要你有勇氣耗下去，即使永遠打不過對方，也總會有辦法。有人說，我當然有面對的勇氣，但眼前的情況顯然除了武力沒有任何可以解決的辦法。然後提出一個兩難選擇，說，現在怎麼可以不當機立斷？說這話的人顯然沒有面對的勇氣，要求當機立斷，是因為著急，兩難選擇，是設死衚衕，往死衚衕裡鑽，要給自己的當機立斷找到合適的藉口。可以看出來，正在發生作用的，不是勇氣，是著急。真正有勇氣面對的人，其實也不是已經胸有成竹，自己也沒有解決的辦法，但是不急。不急於立即找到解決的辦法，但相信自己總會有辦法。</p>\n<p>在做意象對話的時候，面對是一個非常基本，也非常重要的原則。曾經有一個號稱自己學過意象對話的諮詢師，給別人做意象，還把過程在網上發了個帖。大概內容就是說，來訪者看到一群骯髒的小蟲子，要往自己身上爬，感覺很噁心，很難受。諮詢師說那試試把它們踩死吧？踩了一陣，來訪者說越踩越多，踩不掉。然後問有沒有躲避的地方？來訪者說有，於是躲到房子裡，把門緊鎖，還是不行。又問有沒有掃帚什麼的。</p>\n<p>這個諮詢師，很好地把自己的心理問題傳染給了對方，顯然是一個沒學過意象對話的人。按照我們的標準，一眼就可以看出，他本人的心理問題還很嚴重，暫時不適合給別人做諮詢。可能又是一個看了意象對話的書就認為自己學過意象對話的人。這種人最可怕，意象對話目前最讓人擔心的狀況，就是這些人。學過意象對話的人，都會有一點最基本的常識，即意象對話決不是看書就能學的，看書就是了解一下而已。要學意象對話，唯一的方法，就是參加意象對話的督導，接受“珍珠”，或者更高級的意象對話諮詢師的督導。不接受督導，是絕對不可能得到認可的。因為國內很多考了國家諮詢師資格證的人，來參加督導，剛來的時候以為自己是諮詢師，高人一等。接受一段督導才發現自己真的還不會做諮詢，水平太過於有限，諮詢不是考個證就可以做的。這樣的情況在小組裡太常見了。但是，沒得到認可的一些人，看了書就以為自己會了，拿去給別人做，我們又沒法做到完全阻止，因為別人是背地裡做的。這種情況挺麻煩，就像上面捉到的這個例子。</p>\n<p>根據文章中提供的一些資料，朱建軍老師推斷，上面意象中的蟲子可能是性象徵，做這個意象的是位女性，這個意象應該跟性的不潔感有關，蟲子象徵著男性的精子，這位女性感到噁心，難受，是對性的態度。諮詢師由於自身有問題，把自己的防禦方式教給來訪者。踩死是壓抑，躲到房裡是隔離。經過一輪壓抑和隔離，當然不能解決，所以蟲子還會進來，關是關不住的。即使能暫時關住，也絕對不是解決問題的方法。只有先幫助來訪者面對，才可能找到解決的辦法。但要看具體情況，如果來訪者實在過於難受，還沒到能面對的時機，強行面對反而有壞處，那麼需要想辦法暫時緩解。但不管怎麼樣，來訪者要面對一定是難受的，如果還能行，諮詢師就要幫助來訪者稍微使點勁，讓她試著面對。不能來訪者一說難受就讓她逃避。暫時的緩解，也絕對不能把自己的防禦方式加給來訪者。具體的做法，要麼直接先讓來訪者面對，要麼問問她的感受，要麼引導她去了解這些蟲子所象徵的意義。反正不能讓她踩死，不能讓她馬上就跑，更不能關起門來防護。只要有勇氣面對了，總會有辦法解決。</p>\n<p>小說中令狐沖最早的應對方式就是跑，面對強敵，跑是沒有用的。假設能暫時跑開，也就是能保命而已，下次見面還是怕對方的。更何況碰上強敵，逃跑也沒那麼容易，否則田伯光就不會那麼大大方方地來訪了。令狐沖其實挺佩服田伯光這個人，雖然作惡多端，但磊落豪邁，也不失男兒本色。假如令狐沖幸運地跑了，而且背地裡練了一套很高的功夫，能打過田伯光，那樣也未必能解決這個心結。以後碰到類似田伯光的人，這個心結還會困擾。</p>\n<p>意象中更是如此，現實中逃避一個人相對容易，意象中卻是非常困難的。因為意象中的人可以隨時隨地，以任何面孔出現，現在逃避了，下次換個面孔又出現了。一味逃跑，永遠解決不了問題，這個問題永遠困擾你。</p>\n<p>令狐沖也不是立即就能打過田伯光，連續多次失敗，但有一個非常關鍵的因素起了作用，就是他心裡有底。雖然打不過你，但我相信會打過你的。甚至認輸也可以，敗得心服口服，但還是相信能打過你的。如果令狐沖某次打敗之後就開始逃避，放棄，那就完了，以後永遠都打不過田伯光。最終出現高人指點，這在心理的象徵意義上，並不是什麼奇蹟，也不是什麼值得奇怪的事情，意象對話中這種事情很正常。只不過出現的不是別人，是你自己的另一部分，風清揚是一個子人格的化身，這個人身上有智慧老人的影子。前提是，要有勇氣面對，要心裡有底，奇蹟才會發生。現實中也一樣，只有真正面對了，有勇氣耗下去，才可能有人出來指點。但大多數情況下，耗到一定時候，根本不用任何人指點，你自然就能解決。</p>\n</div>"},{"title":"第八章　沒有固定的招","content":"<div>\n<p>第八章　沒有固定的招</p>\n<p>故事梗概</p>\n<p>經過風清揚指點，令狐沖僥倖點了田伯光的穴，暫時有工夫琢磨擺脫糾纏的辦法。第一次，風清揚教他把華山的三四十招融會貫通，然後跟田伯光打，鬥得兩次，田伯光兩次被點穴，令狐沖大概領悟了“順其自然，行乎其不得不行，止乎其不得不止”的意思。</p>\n<p>再比，田伯光出狠招，一刀砍中令狐沖大腿，一刀在他左臂上劃了一道口子。好在天色已晚，風清揚決定在一夜間教令狐沖三招，資質好，悟性高的話，或許勉強可以在這一晚領悟三招的要點。這三招出自“獨孤九劍”。一晚上不可能全學，但令狐沖記憶力驚人，可以先讓他把“獨孤九劍”的總訣背下來，只學三招，應付田伯光是足夠了。</p>\n<p>田伯光接連慘敗，拋下單刀，承認自己永遠不是對手了。田伯光走後，令狐沖請求風前輩傳授“獨孤九劍”，風清揚盡數講解之後，在後山隱沒，不允許令狐沖再跟人提起。</p>\n<p>陸大有氣急敗壞上崖，說華山出事，封不平等人想要逼迫岳不群讓位，因為本派掌門，原是岳不群的師父篡奪，現在要了結二十多年的舊賬。師門有難，令狐沖飛奔下崖。路上遇見“桃谷六仙”，正在尋找自己，也都跟了令狐沖，先去見師父師孃。</p>\n<p>心理分析</p>\n<p>意象對話心理諮詢，跟練武特別像，初學者有這樣的體會，高手過招更能明顯地體會到，諮詢中細微的地方，招招都像在跟來訪者比武。如同博弈，棋錯一招，滿盤皆輸。如何能把諮詢做得如同行雲流水，來去自如，不受任何方法的限制，卻不是件容易的事情。</p>\n<p>很多外地的優秀諮詢師，慕名而來，在北京租了房，想要接受意象對話心理諮詢培訓，希望像參加其他培訓一樣，定期訓練，掌握一套技術，拿回去運用。也挺勤奮，每週末參加督導小組，接受督導，一參加就是一兩年，最後痛苦萬分，感慨自己啥都沒學到，很讓人難受。這時候意象對話的高級諮詢師才恭喜他/她終於取得了進步，因為對於那些想學技術的人，學不到技術就是件好事。倒不是意象對話故弄玄虛，是因為事實上的確是那樣，意象對話沒有什麼固定的方法。</p>\n<p>練武的人都知道，打鬥的過程跟訓練是很不一樣的。沒有一種情況下，可以讓你按照訓練的動作，一招一式地打出來，除非你的對手是個白痴，站著不打，或者是木偶，形同虛設。哪怕像木偶一般沒有變化，你都很難完全按照所學，一招一式地打，更何況我們面對的都是活人，具體情況千變萬化，根本不可能按照所學的招式打。</p>\n<p>心理諮詢也一樣，試圖通過學一套完整的方法，然後到處適用，碰上什麼樣的來訪者，都不去管來訪者，而只是諮詢師按照自己的方法完美地展示，那麼這個諮詢一定是失敗的。因為這頂多算一個展示，不算諮詢。諮詢師處理的是心理諮詢的方法，不是來訪者的問題。一般說來，這個諮詢師還有自己的問題沒有處理，比如說可能太期望完美，也可能害怕來訪者的問題；沒有信心。所以才希望用一套完美的方法，管他什麼來訪者，演示完自己的方法就行。筆者剛學心理諮詢的時候，就犯過一個比較弱智的錯誤，因為感覺解夢這種工作，難度太大，似乎沒有什麼固定的路子和方法可尋，所以下決心認真閱讀弗洛伊德的作品，仔細分辨每一樣東西在夢中的象徵意義，以為只要記熟了基本的象徵意義，解夢就方便得多了。比如“劍”象徵什麼，“花瓶”象徵什麼，我都心裡有數。甚至“劍”還有一些什麼象徵意義，我都熟悉地記下來。這樣就以為會解夢了。後來到實踐中，才發現完全用不上。書中所寫的經典夢例從來沒在我的實踐中出現過。即使偶爾出現了一些常見的象徵物，也完全不是我自己理解的意義。我經常很有把握地說自己知道這個夢的意思，仔細分析之後，我的意見都被否定了。為什麼會出現這種問題？因為我太期望按照自己的方法去解夢，我想用自己熟悉的路子去套對方，而不是根據眼前的夢做分析。</p>\n<p>同樣是一把劍，在一千個人的夢中出現，就有一千種不同的象徵意義，試圖通過以往的經驗，來套新的夢，一定要出問題，因為至少說明，你對眼前的夢沒有體會，只不過熟悉一些常見的象徵。即使是同一個人，兩次夢中出現劍，也往往有不同的意義。同一個夢中出現兩把劍，也多半各有各的象徵。有時候象徵性，有時候象徵攻擊，有時候或許就是一把劍而已。不可能由此而得出結論，劍在夢中出現就象徵性，象徵攻擊，或者只是一把劍，新的夢出現，就一定有新的意義，因為它還完全可能象徵別的，沒法列出一個規範的表格，羅列劍可能出現的所有意義，像個數據庫一樣，以後解夢只需查表就行。即使新的夢依然出現性象徵，劍象徵性，那麼它所代表的新的問題，跟經驗中代表的，也是很不一樣的，畢竟每個人的心理世界都是極其複雜的，每個人的心理經驗都不可能跟別人一樣。針對個人，兩次出現劍，代表的問題也一定不會完全一樣，心理內容是在不斷變化的。近期兩次出現，也可能一次偏向心理內容的呈現，下一次已經更深入地體現夢者對待性的態度，都要靠具體的分析，不能下個統一的結論，以後每次出現都適合。而且很多情況下，同一個象徵意義，可以在不同的層面做出解釋，由此得出的結論不一樣，但是都對。因為人的心理內容有不同的層次，你可以在潛意識的層面有一種解釋，也可以在集體潛意識的層面有不同的解釋，主要看哪個更適合於來訪者目前的情況。如果分析出劍象徵性，就立即由此得出結論，這個夢就象徵性，毫無疑問，那麼可能前功盡棄，真正對來訪者有用的東西還沒找到。</p>\n<p>既是如此的千變萬化，沒有套路可循，那我們心理諮詢是不是就可以什麼都不學，只瞭解實際情況就夠了？其實也不行。因為有一些基本的大方向是絕對不能走錯的，這樣的方向沒有套路，也沒有成規，但你必須有感覺，要有感覺就必須不斷練習，才能保證你自然而然的不會走錯方向。一個完全外行的人，從來沒有接受過培訓，顯然不能直接去做諮詢師。雖然沒有什麼是一定的，劍可能象徵任何意義，但你不能說，那好辦，以後解夢的時候，我可以任意選擇，想選什麼就選什麼，隨便說這個夢中的劍就象徵大樹，反正象徵大樹也有我的理由，不是瞎說。雖然也許有這種可能，但這種方法一定是錯的，因為劍的象徵意義不固定，不等於說眼前這個夢就沒有固定的意義。你必須有很好的感覺，才能保證從不確定的意義中找出固定的意義。如果基本方向錯了，那麼永遠也不可能走對。比如說劍的象徵意義，有很多種，但在代表性的時候，一定代表比較陽性的性，不太可能代表陰性的性，你非要反其道而行之，把劍說成是陰性的象徵，那就會離真實的意義越來越遠。</p>\n<p>假如令狐沖領悟了“順其自然”的原則，能把華山劍法融會貫通，風清揚就告訴他：“OK！你以後什麼都不用練了，只要順其自然，想怎麼打就怎麼打，反正沒有什麼固定的招。”那令狐沖就完了，他一定不會成為武林中的高手。上乘的武功修為是有的，永無止境的，而且你必須去練，但又不能被所修煉的東西限制，這才是高手的境界。順其自然地用招，絕對不是亂打一氣，怎麼打都行。高手跟普通打手的區別，往往只在於一些非常非常細微的細節是否能準確把握，而不在於招式的花樣離奇。要準確把握細節，不練是不行的。不但要練，而且要勤練，經常練。</p>\n<p>意象對話沒有什麼固定的方法，不是說我們不用練習，恰好相反，意象對話的高級諮詢師都在勤練，每週末參加督導，颳風下雨都不間斷，甚至連一些新手都為他們的精神感動，感嘆自己也不容易這樣堅持，生活中畢竟會有很多繁雜的事情困擾，要每週堅持，排除干擾，的確不是很容易做到的。忽視方法的應用，但從來不忽視方法的訓練。朱建軍老師反而要不斷講解一些基本的方法，反覆訓練，只是強調運用的時候不能拘泥於方法。如果為了強調沒有方法而拒絕使用方法，那就違反初衷了。有一些不屬於精神分析路子的方法，只要好用，順手就用上了，那有為何不用？比如戒菸，長期的心理分析，效果可能不如行為主義的方法來的快，那當然就用行為主義的方法了。</p>\n<p>上面舉的那個外地諮詢師的困擾，其實很多剛參加意象對話督導小組的人都有，就是來了之後很茫然，不知道自己在學什麼，似乎也沒東西可學，想學技術的念頭又老是放不下。其實對這樣的新手，要教一些技術，也是有的，不是沒得可教。但是我們不願意，因為他/她此刻真正需要解決的問題是，為什麼那麼想學技術？這個問題不解決，帶著問題去給別人做諮詢是有害的。比如說他想學技術，背後的動機是想炫耀，那麼如果你真的教了一套技術，就上了他的套，他回去可以跟同事炫耀，自己又學了一套新技術，這倒不可怕。可怕的是，沒解決問題的話，他會把這個問題帶到心理諮詢中去，無意識地在來訪者面前擺弄，顯得自己心理諮詢技術很高，一旦有了這樣的炫耀，整個諮詢就完了。</p>\n<p>所以對於這樣的人，不是我們不教，是真的不能讓他學。首先要做的是解決他自己的問題。只為學技術而學技術，常常導致的後果就是諮詢師不帶感覺地做諮詢，只會用技術。一個自認為是諮詢師的人，來參加督導，要進步，往往比一個新手更困難。因為他始終放不下諮詢師的身份，不處理這個問題，對諮詢是特別有害的，所以首先要做的是引導他放下諮詢師的架子，找自身的感受。哪天突然發現自己沒進步，沒學到東西，感到很難過，那就說明他進步了，因為終於找到自己的感受了，雖然這種感覺不是那麼讓人舒服。</p>\n</div>"},{"title":"第九章　強迫思維","content":"<div>\n<p>第九章　強迫思維</p>\n<p>故事梗概</p>\n<p>令狐沖胡攪蠻纏，用石壁上所學武功，以一柄破掃帚打敗了成不憂。成不憂惱羞成怒，一掌擊在令狐沖胸口，口中鮮血狂噴。突然間人影閃動，桃谷六仙活生生把成不憂撕成四塊。救了令狐沖就走，瞬息之間已不見蹤影。六人以內功給令狐沖療傷，每人在令狐沖體內輸了一道真氣，爭來爭去，每個人都有自己的治療思路，又每個人都在按照自己的想法進行，六道真氣在令狐沖體內亂衝亂撞，肝、膽、腎、肺、心、脾、胃、大腸、小腸、膀胱、心包、三焦、五臟六腑，到處成了六兄弟真力激盪之所，內功比拼之場。</p>\n<p>令狐沖計騙桃谷六仙送自己回華山，嶽夫人陡然刺了桃實仙一劍，嶽夫人瞬間被人提起，差點撕成四塊。夫婦以為此次遇上勁敵，商議暫時迴避，順便上嵩山，找左盟主評理，對封不平等人篡奪華山掌門之事求個公道。</p>\n<p>嶽靈珊偷了父親的《紫霞秘籍》，留給令狐沖，讓陸大有給大師哥念，通過修習紫霞內功來療傷。令狐沖不願被人誤認偷練神功，點了陸大有穴道，門閂作柺杖，支撐著走了出去。《紫霞秘籍》留在陸大有身上。</p>\n<p>心理分析</p>\n<p>正常人有時候也會思考一些比較奇怪的問題，比如“我從哪裡來？我怎麼是人而不是別的？我為什麼要學習？我怎麼會躺在床上？睡覺為了什麼？”偶爾碰到這樣一個人，我們不會覺得特別奇怪，頂多覺得這個人有點古怪，或者覺得他/她喜歡思考而已，還可以接受。但是，如果比較極端，一個人的生活完全被這些問題取代，只能思考這樣一些問題，沒法工作，沒法正常生活，整天被這些問題困擾，那他/她多半隻能進諮詢室了。</p>\n<p>這是心理諮詢中比較常見的一類心理問題，來訪者的思考打不住，不停地在思考問題，而所思考的，又是一些似乎弱智，但又讓人為難，不好回答的問題。比如：“我為什麼要吃飯？飯為什麼可以用來吃？為什麼飯要用嘴來吃？嘴又是個什麼東西？它為什麼要長在鼻子底下？那麼鼻子呢？我為什麼要長鼻子？我為什麼要用鼻子來呼吸？呼吸又是為了什麼？人都要呼吸嗎？呼吸什麼東西？空氣吸進去幹什麼……”</p>\n<p>我們管這種人叫強迫思維。提起強迫思維，諮詢師多半都心裡清楚是一種什麼樣的人，但要諮詢師清楚地描寫一個人，說清楚強迫思維到底什麼樣，多半諮詢師都會感到吃力。這方面要感謝文學家，尤其是金庸這樣了不起的文學家，很多極端的人格特點，心理學家心裡知道是什麼樣，但要用文學的筆墨描繪，就極為困難。金庸這樣天才的文學家，他本人可能完全不知道我們需要的那些極端的人格特點是什麼樣，但憑著他自身文學的敏銳性，描述出來的人格特點，還就跟我們的經驗和理論都高度符合。其實筆者覺得，真正天才的文學家，跟普通的寫手相比，差別也就在這兒。偉大的文學家不需要過多的思考，憑自己的感覺就能寫出人性深層那些具有高度普遍性的人格特點，這樣的文學家比如莎士比亞等；那些普通的作家，思考太多，用理論框架去套人物的性格特點，反而寫不出特別優秀的作品，這樣的人比如後現代主義作家。越是能觸及人性深處的作品，也就越吸引讀者，它的受眾面特別廣泛，甚至可能是全球性的，而且不受時代性的限制；而那些經過思考加工出來的作品，最多隻能寫出一個時代的人共同的心結，它所吸引的讀者也就會非常有限，頂多風火一時，時代變了，作品也就過時了。</p>\n<p>金庸作品裡有太多太多符合心理學特點的人物，羅列出來這篇文章的篇幅就要被佔完了，所以這裡省略不提，可以肯定的是，幾乎每一個典型的人物，都夠心理學專業的人做一篇博士論文加以研究。比如說，桃谷六仙就是強迫思維極好的例子。如果有人不知道強迫思維的人是什麼樣，但又想知道，建議你，看看桃谷六仙就夠了。</p>\n<p>桃花仙見令狐沖睜開眼睛，喜道：“醒啦，醒啦，這小子死不了啦。”桃實仙道：“當然死不了，給人輕輕地打上一掌，怎麼會死？”桃花仙道：“你倒說得稀鬆平常，這一掌打在你身上，自然傷不了你，但打在這小子身上，或許便打死了他。”桃實仙道：“他明明沒死，你怎麼說打死了他？”桃花仙道：“我不是說一定死，我是說：或許會死。”桃實仙道：“他既然話轉，就不能再說‘或許會死’。”桃花仙道：“我說都說了，你待怎祥？”桃式仙道：“那就證明你眼光不對，也可說你根本沒有眼光。”桃花仙道：“你既有眼光，知道他決計死不了，剛才又為什麼唉聲嘆氣，滿臉愁容？”桃實仙道：“第一，我剛才唉聲嘆氣，不是擔心他死，是擔心小尼姑見了他這等模樣之後，為他擔心。第二，咱們打賭贏了小尼姑，說好要到華山來請令狐沖去見她，現下請了這麼一個半死不話的令狐沖去，只怕小尼姑不答應。”桃花仙道：“你既然知他一定不會死，就可以告訴小尼姑不用擔心，小尼姑既然不擔心，你又擔心些什麼？”桃實仙道：“第一，我叫小尼姑不擔心，她未必就聽我話，就算她聽了我話，假裝不擔心，其實還是在擔心。第二，這小子雖然死不了，這傷勢著實不輕，說不定難好，那麼我自然也有點擔心。”</p>\n<p>小說中一旦桃谷六仙出場，通篇充斥這樣的辯論。酷愛沒完沒了的辯論，這還正好就是強迫思維最大的特點。多數情況下，這種辯論近乎無聊和沒有意義，也不是辯論能帶給他們樂趣，就是愛辯論而已，甚至沒有辦法不辯論。如同條件反射，你每說一句話，他們的第一反應不是要聽明白你表達的意思，而是說“不”，他們是永遠說不的人，無論你說什麼，他們都要反駁，而且絕對可以反駁。因為當一個人非要給你挑刺的時候，你不可能說出正確的話來，隨便你怎麼說，他們都可以反駁。一點都不誇張，強迫思維的人能從雞蛋裡挑出骨頭來。比如你說雞蛋裡顯然沒有骨頭，他可以立即反駁：“雞不是從雞蛋裡來的嗎？雞沒有骨頭嗎？既然雞有骨頭，雞又是從雞蛋裡來的，雞蛋裡沒有骨頭的話，雞骨頭是從哪裡來的？”</p>\n<p>雖然多數情況下，這種辯論很無聊，讓你感覺是在有意挑刺，但在很多時候，他們的反駁是非常有道理的，強迫思維的人，也不一定都思考那些無聊而弱智的問題。朱建軍老師曾經在諮詢中碰到一個來訪者，朱老師給他做精神分析治療，他說：“我知道，你現在在給我做精神分析，但精神分析理論是有問題的。很多心理學家曾經批評過精神分析，它不嚴謹，不科學。真正的科學理論應該是可以證偽的，而精神分析不能被證偽。”朱老師說那我改用行為療法，他又說：“行為療法恐怕沒有效果，因為行為療法太簡單化，沒有深入到人的潛意識，治標不治本。”這麼精準的評價，足以讓一個普通的心理學碩士汗顏。</p>\n<p>千萬不要試圖說服一個強迫思維的人，也不要去跟他辯論，因為他們一定是最優秀的辯手，辯論的水平超出一常人，否則他就不是強迫思維了。想要說服他就是一個錯誤，因為他辯論的目的不在於說服或者被說服。強迫思維的人會讓諮詢師特別頭疼，因為你沒法說服他，而在很多情況下他懂的又比你還多。</p>\n<p>讀者也許覺得奇怪，強迫思維的人這麼善於思考，那不挺好嗎？為什麼還要認為他們是病態的？就他自身而言，思考是迴避情感，迴避現實的一種方式，並不是出與好奇心和求知慾。當思考取代了生活，導致不能正常生活，內心當然是痛苦的，否則就不用向諮詢師求助了。有求治動機，又不肯跟諮詢師配合，似乎很矛盾，其實他們跟諮詢師的辯論，並不是有意識地要否定諮詢師的做法，只是忍不住地要辯論，要給人挑刺。假如再碰上個水平有限的諮詢師，解決不了問題，求治者內心的痛苦不難理解。就他對周圍人的影響來說，有時候也是挺可怕的，他們的想法嚴重脫離現實，自己沉溺於古怪的想法不說，他會無意中把自己古怪的想法付諸行動。假如有一個強迫思維的人，認為原子彈不可能對人造成傷害，非要試驗一下，被試驗的人就會很遭殃；假如一個人認為熊貓的眼睛可以用硫酸清洗的話，不幸撞上了的大熊貓就會被連帶眼珠子一起，洗得精光。</p>\n<p>小說中的桃谷六仙，有一種很殘忍的殺人方式，稍不留神就會被他們撕成四塊，讓人難以理解，見了別人的肝臟腸肚，難道他們就不覺得難受？從心理學的角度來看，他們有這樣的表現就再準確不過了。因為強迫思維的人，除了會思考之外，是找不到感覺、幾乎體驗不到什麼情感的。由於他們古怪的想法本就沒什麼現實感可言，所以在做事的時候，也不太可能還去考慮什麼後果。所以有時候會發現，他們的想法幼稚而單純，甚至單純得可愛，但不顧後果的做法也會挺可怕。在救令狐沖的時候，他們各自的想法，理論上說都是有自己道理的，但是六道真氣輸入之後，差點沒要了令狐沖的命。就他們的生活，我們不難想象，桃谷六仙要適應生活一定是有困難的，金庸先生沒有用過多的筆墨去描寫桃谷六仙的家庭生活，但我們可以猜測，假如老媽肚子餓得快要死了，他們又正好陷入某個問題的爭論而糾纏不清，這時候，他們不會有興趣去關心媽媽的肚子。就他們自身而言，整天爭論，不上班，沒有固定的工資收入，溫飽肯定有問題。但他們可能為要不要上班的問題爭論好幾年，並因此而錯過所有上班的時間，那時候，還沒開始上班提前就餓死了。</p>\n<p>對於強迫思維的人，心理諮詢師要做的，就是讓他能適應正常生活，而不是絕對限制思考。出於諮詢的需要，可能暫時阻止他思考，但不是讓他永遠也別思考。在不影響正常生活的情況下，能多思考是件好事，前面讀者的疑惑其實是對的，我們也同意，但前提是，思考不應成為適應生活的障礙。能夠健康生活的話，強迫思維的人一定是我們社會巨大的精神財富，因為他不斷給你挑刺，和你抬槓，使你不得不對其中欠合理的成分給予考慮，進行反思。</p>\n</div>"},{"title":"第十章　選擇風流","content":"<div>\n<p>第十章　選擇風流</p>\n<p>故事梗概</p>\n<p>令狐沖拄了門閂，行得半里有餘，遇上受傷的田伯光，原來桃谷六仙夾雜不清，打聽一個人的下落，田兄誤以為問的是風清揚，又曾在崖上答應不提風清揚下落，死活不肯說出，被桃谷六仙痛加折磨，還點了幾處穴道。上崖之前被儀琳的父親不戒和尚逼迫服藥，身中劇毒，限他一個月內找到令狐沖，思過崖一行就是為了請令狐沖下山。</p>\n<p>嵩山派狄修出現，要羞辱令狐沖一番，儀琳到來，狄修伸手要點儀琳穴道，被不戒凌空提起，四肢軟垂，一動不動，死活未知。不戒給令狐沖療傷，在他體內又輸入兩道真氣，硬生生把桃谷六仙的六道真氣壓了下去。</p>\n<p>岳不群和嶽靈珊父女趕回，問起《紫霞秘籍》，令狐沖不敢相瞞，老實交代。找回小屋，陸大有早已遇害，《紫霞秘籍》離奇失蹤。</p>\n<p>十五名蒙了面的高手，圍攻岳不群全家，都是衝著林家的《辟邪劍譜》而來。人多勢眾，華山斗敵不過。令狐沖使出思過崖所練劍法，勉強能克敵，但要取勝，倒也困難。眾人齊上，想要把令狐沖亂刀分屍。令狐沖以迅捷無倫的手法，瞬間刺瞎十五人眼睛，蒙面人驚慌逃走。</p>\n<p>心理分析</p>\n<p>前面已經做過分析，田伯光這個人至少有三個性格側面是非常明顯的，一方面豪邁磊落，很有江湖好漢氣概，另一方面是好色，還有一方面，是對自己本能的放縱，缺乏自我約束，姦淫擄掠，無惡不作，這才是他真正的心理癥結所在，好色其實不是問題，只要運用得當，好色反而是好男人本色。所以他真正需要處理的問題，是對自己本能的放縱，而不是好色。他行事豪邁磊落的一面，在本章又有了很好的體現。</p>\n<p>田伯光續道：“那點穴之人又問：‘喂，那人究競在哪裡？你如不說，我永遠不給你解穴，叫你有展難放，脹不可當。’我心裡想，這六個怪物武功如此高強，來到華山，自不會是找尋泛泛之輩。令狐兄，尊師嶽先生夫婦其時不在山上，就算已經回山，自是在正氣堂中居住，一找便著。我思來想去，六怪所要找尋的，定是你太師叔風老前輩了。”令狐沖心中一震，忙問：“你說了沒有？”田伯光大是不悅，悻然道：“呸，你當我是什麼人了？田某既已答應過你，決不洩漏風老前輩的行蹤，難道我堂堂男幾，說話如同故屁嗎？”令狐沖道：“是，是，小弟失言，田兄莫怪。”田伯光道：“你如再瞧我不起，咱們一刀兩斷，從今而後，誰也別當誰是朋友。”令狐沖默然，心想：“你是武林中眾所不齒的採花淫賊，誰又將你當朋友了？只是你數次可以殺我而沒下手，總算我欠了你的情。”黑暗之中，田伯光瞧不兄他臉色，知道他已然默諾，續道：“那六怪不住問我，我大聲道：‘我知道這人的所在，可是偏偏不說；這華山山嶺連綿，峰巒洞谷，不計其數，我倘若不說，你們一輩子也休想找得到他。’那六怪大怒，對我痛加折磨，我從此就給他們來個不理不睬。令狐兄，這六怪的武功怪異非常，你快去稟告風老前輩，他老人家劍法雖高，卻也須得提防才是。”田伯光輕描談寫地說一句“六怪對我痛加折磨”，令狐沖卻知道這“痛加折磨”四字之中，不知包括了多少毒辣苦刑，多少難以形容的煎熬。六怪對自己是一番好意的治傷，自己此刻尚在真受其酷，他們逼迫田伯光說話，則手段之厲害，可想而知，心下好生過意不去，說道：“你寧死不洩漏我風太師叔的行藏，真乃天下信人。”</p>\n<p>田伯光如此義氣，足以使很多自稱道德家的人汗死。田伯光是令狐沖最重要的子人格之一，他身上的很多特點，令狐沖身上也有，比如他們都行事豪邁磊落，比如他們都是非常有骨氣的漢子，等等。令狐沖吃過桃谷六仙的苦，那是桃谷六仙無意中乾的好事，本意是為了救令狐沖，只是方法不當，六道真氣才差點沒把令狐沖整死。前文做過分析，強迫思維的六仙，除了會思考和辯論之外，對情感體驗是沒什麼感覺的，輕而易舉就把人撕成四塊，接下來是對撕四塊、還是八塊辯論不休，並不覺得把人撕碎是什麼讓人難受的事情。不難理解，這樣的人整起人來，一定可以讓你過足癮，爽到死也不算過。所以令狐沖特別能理解田伯光，被六仙“痛加折磨”，一定不輕鬆，可能不僅僅是一般的皮肉之苦。田伯光僅僅是因為對自己有過承諾，不再提起風清揚的下落，就寧肯被“痛加折磨”，也死活不說，這不是普通的江湖好漢能做到的。</p>\n<p>我們在意象對話心理分析中不斷髮現，“害人害己”這種說法是完全站得住腳的。比如說某個母親，老打她的孩子，我們在子人格的分解過程中就會發現，她有兩個子人格的對立是非常明顯的，一個是母親，多半也就是她目前的自己，另一個就是被打的小孩，在意象中跟在現實中一樣，意象中的母親也是，見了那個孩子就要打。每當她在現實中打孩子的時候，其實就是這兩個子人格在作怪。就是說，當她在現實中打孩子的同時，就是在打自己內心的那個孩子，絲毫不差，完全同時，打孩子就是在打自己。如果不解決這個心結，她會不斷打孩子，不斷傷害自己，打得越厲害，對自己的傷害也越打，以後見了孩子也就越要打。因為母親在打孩子的時候，傷的是自己，所以她自己內心其實很難受的。生活中有人會誤以為，打人是很痛快的，只有被打才難受。其實不是這樣，打人的時候，自己內心是很痛苦的。打過孩子的母親肯定都會有這樣的體會，打了孩子自己心裡更難受，如果可以的話，哪個母親沒事會喜歡打自己孩子呀？很多情況下是這樣：母親打孩子，孩子沒哭，自己先哭了。</p>\n<p>一般情況下的衝突也一樣，在跟人吵架，打架，或者做任何傷害別人事情的同時，都一定傷了自己。跟人吵架，同時你內心的兩個子人格也在吵，罵的一方固然爽快，但心裡也會難受的，被罵的一方就不用說了，當然難受，不管哪一方的難受，最終都是自己的難受，傷的其實都是自己。田伯光是個四處作惡的傢伙，他作的惡不止姦淫擄掠，就以姦淫良家婦女為例，他強姦了一個良家婦女，就意味著他同時一定傷害了自己內心相應的那個子人格，無論哪個子人格受到傷害，最終傷害的都是自己。</p>\n<p>對子人格的認同還有一個非常基本的原則，就是主導人格對子人格的認同是會變化的。以田伯光為例，他目前比較認同的是那個能姦淫婦女的子人格，但並不永遠都是這樣的，假如他一直認同這個子人格，就會表現為他會不斷地強姦作惡。如果發生變化，他開始認同那個被強姦的子人格，就會出現意外的變化，找個機會，他會反過來被人強姦。後來的事實完全印證了這一點，我們以後再作詳細分析，這裡要強調的只是，田伯光作惡一定會傷害自己的內心。作惡越多，傷害越大。作惡太多，他內心是很痛苦的。</p>\n<p>田伯光道：“田某縱橫江湖，生平無一知己，與令狐兄一齊死在這裡，倒也開心。”</p>\n<p>對於田伯光這樣一個頗具有好漢氣概，縱橫江湖，而又作惡多端的人，能否遇到一個知己是很重要的。這就是為什麼，令狐沖感覺有些為難的一次握手，對他會那麼的重要。</p>\n<p>田伯光伸出手去，說道：“令狐兄，咱們握一握手再死。”令狐沖不禁遲疑，田伯光此言，明是要與自己結成生死之交，但他是個聲名狼藉的採花大盜，自己是名門高徒，如何可以和他結交？當日在思過崖上數次勝他而不殺，還可說是報他數度不殺之德，到今日再和他一起廝混，未免也太說不過去，言念及此，一隻右手伸了一半，便伸不過去。田伯光還道他受傷實在太重，連手臂也難以動彈，大聲到：“令狐兄，田伯光交上了你這個明友。你倘若傷重先死，田某決不獨活。”令狐沖聽他說得誠摯，心中一凜，尋思：“這人倒很夠明友。”當即伸出手去，握住他右手。</p>\n<p>很多人錯誤地以為，來訪者找到諮詢師，就是希望從諮詢師那兒尋求幫助，諮詢師一定要認真地想辦法，努力幫助來訪者解決問題，消除困擾。其實不是這樣的，很多時候，來訪者需要的，不是你做了多少努力，而只是希望得到理解和支持。哪怕是一個簡單的握手、擁抱，或是幾句簡單的理解來訪者的話，都會發生奇蹟般的效果。因為來訪者常常需要的，也就是有個人能理解自己，這時候真心的理解能給對方極大的支持，有了支持，相當於給來訪者增添了心理力量，問題自然就會得到解決。</p>\n<p>令狐沖此刻的握手不是十分的真心，但田伯光不知道。即使他能感覺到令狐沖的情緒，心裡清楚令狐沖不是十分真心，有猶豫，但一個握手，對他這樣一個無惡不作，臭名昭著的淫賊，已經太過於難得、這個握手，對田伯光的心理健康，起到了極為重要的作用。因為這對田伯光來說，天下之大，還有一個可以被稱為知己的人能理解他，不是全世界的人都對自己唾棄。後來田伯光遭到報應，就是想作惡也沒法作了。但筆者不認為那是心理健康的正當手段，而且如同行為療法，治標不治本，根本的心理問題不解決，真想作惡的話一定可以有別的辦法。從根本上處理問題，心理健康的話，你讓他去作惡他也不會去。</p>\n<p>田伯光道：“令狐兄，你和小師太一定有些言語要說，我去了，咱們後會有期。”說著一拱手，轉身走向下山的大路。令狐沖道：“田兄且慢。”田伯光道：“怎麼？”令狐沖倒：“田兄，令狐沖數次承你手下留情，交了你這朋友，有一件事我可要良言相勸。你若不改，咱們這朋友可做不長。”田伯光笑道：“你不說我也知道，你勸我從此不可再幹姦淫良家婦女的勾當。好，田某聽你的話，天下蕩婦淫娃，所在多多，田某貪花好色，也不必定要去逼迫良家婦女，傷人性命。哈哈，令狐兄，衡山群玉院中的風光，不是妙得緊麼？”</p>\n<p>心理諮詢中一個非常基本的原則就是真誠，哪怕你對來訪者不接受，真誠地告訴他也比假裝接受要好，因為對方其實是能感受到你不真誠的。來訪者會有一個疑惑，你的話不可靠，也不知道你哪句是真的。真誠地告訴對方你不接受，但不要批評對方做得對不對，這種時候，對方一般都願意有所反思，或者有所改進。令狐沖的態度很明確，你要是本性難改，我們朋友做不長。其實田伯光的進步，令狐沖做的兩件事在其中起了關鍵作用。一次是握手，一次就是這兒，明確自己的立場。諮詢中這還的確能起到很好的作用。</p>\n<p>選擇風流，對田伯光來說這就是進步。非要給他定個很高的道德標準，“以後要禮貌待人，見到女性要斯文，不能魯莽，不許再碰女性……”這就像要求他“過馬路先扶老太太”，明顯不可能。明知道不可能還給別人規定一個過高的道德標準，這種道德就會成為虛偽。</p>\n</div>"},{"title":"第十一章　君子多疑","content":"<div>\n<p>第十一章　君子多疑</p>\n<p>故事梗概</p>\n<p>令狐沖一劍刺瞎十五個蒙面高手的眼睛，師父冷冷地改口稱自己“令狐大俠”。問起這些劍法的來歷，令狐沖不願吐露風清揚行蹤，師父懷疑自己是在做戲。十五人中就有嵩山派的高手，那原計劃的嵩山之行自是不能再去了，改道上河南拜訪林平之的外公，金刀無敵王元霸。</p>\n<p>令狐沖醋意橫生，心想此去河南，小師妹肯定要在林家和林平之完婚，眾人啟程後，自己與隊伍的距離越來越遠。勞德諾快步回來照應，卻原來是師父派來暗中監視自己的。到了王元霸家，令狐沖處處跟人牴觸，被人灌醉，吐了一桌。跟王家人起衝突，被逼問《辟邪劍譜》下落，從他身上搜出《笑傲江湖》譜子，沒人能夠識別，誤以為便是《辟邪劍譜》，東城請綠竹翁辨認，才水落石出。</p>\n<p>綠竹翁的婆婆特別關照令狐沖，彈曲給他療傷，令狐沖跟著“婆婆”學了《清心普善咒》入門，以便自行慢慢調理。</p>\n<p>心理分析</p>\n<p>心理問題總是很折磨人，因為它折磨你，而你往往不知道為什麼，甚至不知道自己正在受折磨，只有當以旁觀者的眼光來看，或者自己醒悟到以後，才清醒地發現，自己糊里糊塗地被折磨了多年卻並不知道。</p>\n<p>它不光折磨自己，還讓身邊的人受罪，但又很難說清楚哪兒出了問題。舉一個簡單的小例子，我交了女朋友半年，每天見面，都是我去她樓下找她，天天如此。後來有一陣我生病，女朋友每天來見我，我心裡總有那麼一點不大舒服，特別希望是我去找她，不是她來找我。一起在校園裡逛逛，分別的時候，女朋友多次要求送我，而我雖然病痛，總覺得不合適，非要堅持我送她回宿舍。很多次之後，女朋友開始生氣，為什麼我這麼固執，只允許我送她，不能讓她送我？為這個問題起爭執之後，我們都向對方坦白自己內心的想法。我發現，女朋友其實是真心願意送我，並不是因為我生病，或者因為我送她太多而回送，沒有任何原因，她就是願意。那我為什麼還是那麼固執？這就肯定是我自己的問題。經過反省，其實我自己有一個擔心，擔心別人說我不是個好男人，不能悉心照顧女朋友。假如有人看到女朋友送我的話，我擔心別人笑話我，不但不送女朋友，還讓女朋友送我，像個男人嗎？</p>\n<p>讀者可能覺得，這不挺好的嗎？男的堅持送女朋友，多好啊，怎麼還是心理問題呢？問題就在這兒，正常情況下多送一下女朋友，表示我對她的關心，的確很好。但當它成為一個心結不能觸碰時，就會很麻煩。表現就是，不送女朋友我自己就難受，而這個難受其實是沒有必要的。健康的關懷，能送就送，不能送就算了，我用不著為這個而難受。而另一方面，我這樣很折磨女朋友，女朋友本來樂意送我，我卻總是毫沒來由地拒絕，搞得女朋友莫名其妙，似乎送她還做錯了。假如女朋友是因為內疚而回送，我拒絕能讓她舒服，那我的做法是對的，但女朋友本來就是樂意，我拒絕會讓她難過，那麼我固執的拒絕顯然有問題。</p>\n<p>其他任何心理問題，也都是一樣，總在無形中折磨人。所有的心理問題，正常人身上能多少找到一些表現，但當它不成為心結時，往往表現為很好、很優秀的品質，而一旦成為一個不可觸碰的情結，就會讓人很難受。尤其是當它跟看似優秀的品質結合，以這種品質作為遮掩，掩蓋真實問題時，還特別難發現。</p>\n<p>比如君子，一個人身上有一點君子作風，當然是件很好的事情，但它也容易成為一個人的心結。一個人永遠要做君子，無時無刻不考慮到自己的君子形象時，顯然，它會很累人，把我們大量的生命力浪費在一個虛幻而不切實際的名號上，因為太希望保持君子形象，所以每做一個決定，都要考慮到，是不是符合君子作風。這就像對待一個秘密，公開永遠比隱藏輕鬆得多。公開只需要一句話，隱藏卻需要不斷地撒謊，為了掩蓋新的謊言，又需要再編更新的謊言，這樣不斷地編下去，沒完沒了。</p>\n<p>當它成為我們的心結而不是真實品質時，我們其實不會因此而提高自己的道德修養，相反，這種作風會成為一種非常虛偽而不實在的東西。一個真正的君子，一個健康的君子，一定不會每天保持君子作風，該是什麼樣就是什麼樣，君子的品質是一種自然的流露，不是靠自己有意識地去保持形象。每做一件事情，大量的精力不是用於解決問題，而浪費在考慮其做法是否與自己的形象符合，因為這個念頭會不斷伴隨，伴隨你做每一個決定，伴隨你說每一句話。</p>\n<p>周圍人也會很難受，比如岳不群之流，如果我們期望他言簡意賅地表明自己的立場，就會發現幾乎不可能，因為他關注的重點跟我們不一樣，他關注的是自己的君子形象，怎麼說才符合君子的作風，周全、詳細而又有獨到之處。而其實我們期望的也就是他表個態，一句話表明自己的立場就足夠了，那些鋪張浪費的論述完全屬於多餘，我們根本沒耐心去聽，也沒興趣關心，但他就是要那麼做。</p>\n<p>我們在實踐中發現，理智的人特別容易壓抑憤怒，憤怒壓得多的人，會比較容易動怒，很多時候是不自覺地動怒。情緒會傳染人，所以當一個超級理智的人在發表自己大段的演說時，很容易讓他的周圍人憤怒，但又說不清楚怒從哪來，因為他大段的演說，顯然說得有道理，但就是讓人厭煩、憤怒。這是因為，他說話的時候，背後其實是有憤怒情緒的，只是他自己誤以為說得很理智、不帶情緒，實際上只不過他的憤怒被隱藏得比較深，他自己沒有察覺，一般人雖然不能察覺，但情緒的傳染是不用察覺的，他背後隱藏的憤怒會傳染你，所以你在聽他說話的時候，會不自覺地惱火，憤怒。</p>\n<p>看到他們理智的樣子，很多人就誤以為，理智的人很堅強，剛好相反，理智的人內心是很脆弱的。表面上不管多大的挫折，他們都不動情感，而內心他們是很容易受傷的。一般人普通的一句話，都會傷到他們，但表面上又不動聲色。這樣的所謂“正人君子”，其實內心是非常多疑的，比如同學正常的聊天，沒有針對性，一個理智的“君子”很容易在心裡覺得別人是針對自己的，挺容易受傷害，但立即會有一個反應，裝出很理智的樣子對自己說：“咳，怎麼能跟這種人一般見識！”然後就會錯誤地以為自己沒有動怒，沒有受傷，而實際上心裡是很難過的。</p>\n<p>內心裡有很多懷疑，但為了保持理智，保持君子作風，表面又死活不肯承認，就像隱藏秘密，他本人肯定要花費大量生命力，而被懷疑的人，也會很不舒服。以令狐沖的例子來看：</p>\n<p>眾人啟程後，令狐沖跟隨在後，神困力乏，越走越慢，和眾人相距也越來越遠。行到中午時分，他坐在路邊一塊石上喘氣，卻見勞德諾快步回來，道：“大師哥，你身子怎樣？走得很累罷？我等等你。”令狐沖道：“好，有勞你了。”勞德諾道：“師孃已在前邊鎮上僱了一輛大車，這就來接你。”令狐沖心中感到一陣暖意：“師父雖然對我起疑，師母仍然待我極好。”過不多時，一輛大車由騾子拉著馳來。令狐沖上了大車，勞德諾在一旁相陪。這日晚上，投店住宿，勞德諾便和他同房，如此一連兩日，勞德諾竟和他寸步不離。令狐沖見他顧念同門義氣，照料自己有病之真，頗為感激，心想：“勞師弟是帶藝投師；年紀比我大得多，平時跟我話也不多說幾句，想不到我此番遭難，他竟如此盡心待我，當真是路遙知馬力，日久見人心。別的師弟們見師父對我神色不善，便不敢來跟我多說話。”第三日晚上，他正在炕上閤眼養神，忽聽得小師弟舒奇在房門口輕聲說話：“二師哥，師父向你，今日大師哥有什麼異動？”勞德諾噓的一聲，低聲道：“別作聲，出去！”只聽了這兩句話，令狐沖心下已是一片冰涼，才知師父對自己的疑忌實已非同小可，竟然派了勞德諾在暗中監視自己。只聽得舒奇躡手躡腳地走了開去。勞德諾來到炕前，察看他是否真的睡著。令狐沖心下大怒，登時便欲跳起真來，直斥其非，但轉念一想：“此事跟他有什麼相干？他是奉了師命辦事，怎能違抗？”當下強忍怒氣，假裝睡熟。勞德諾輕步走出房去。令狐沖知他必是去向師父稟報自己的動靜，暗自冷笑：我又沒做絲毫虧心之事，你們就有十個、一百個對我日夜監視，令狐沖光明磊落，又有何懼？’胸中憤激，牽動了內息，只感氣血翻通，極是難受，伏在枕上只大聲喘息，隔了好半天，這才漸漸平靜。坐起身來，披衣穿鞋，心道：“師父既已不當我弟子看待，便似防賊一般提防，我留在華山派中還有什麼意味，不如一走了之。將來師父明白我也罷，不明白也罷，一切由他去了。”便在此時，只聽得窗外有人低聲說道：“伏著別動！”另一人低聲道：“好像大師哥起真下地。”這二人說話聲音極低，但這時夜闌人靜，令狐沖耳音又好，竟聽得請請楚楚，認出是兩名年輕師弟，顯是伏在院子之中，防備自己逃走。令狐沖雙手握拳，只捏得骨節格格直響，心道：“我此刻倘若一走，反而顯得做賊心虛，好，好！我偏不走，任憑你們如何對付我便了。”突然大叫：“店小二，店小二，拿酒來。”叫了好一會，店小二才答應了送上酒來。令狐沖喝了個酩酊大醉，不省人事。次日早晨由勞德諾扶入大車，還兀自叫道：“拿酒來，我還要喝！”</p>\n<p>如果可以，令狐沖肯定寧可師父當面坦白，坦白比不坦白，心裡會好受很多。一個很簡單，但是生活中很多人都被誤導的道理，坦白的好處，永遠大於不坦白。背地裡的懷疑絕對比當面對質更讓人難受。但是生活中很多人都以為，當面坦白很傷人，說什麼也不能這麼做。</p>\n<p>舉個例子，宿舍舍友都在懷疑某個同學偷了東西，這個同學回到宿舍就看人臉色，看別人偷偷議論，但是不清楚究竟議論什麼，不管是不是真偷，也不管他/她知不知道大家在懷疑自己，大家坦白了，對他/她的傷害都會小一些。即使是真偷，內心裡他/她其實也希望別人公開懷疑，因為公開之前，除了偷東西的愧疚，他/她還必須承受更多的心理負擔，要去猜測別人是不是懷疑自己，不知道別人心裡怎麼想，對未知東西的猜測帶來的不安，一定大於確定的東西引起的不安。而在公開之後，至少自己可以明確地知道，自己偷東西這件事已經被人知道，這時候心理壓力反而減小。不斷地去猜測別人怎麼想，猜測別人是不是懷疑自己，這是一件非常讓人痛苦的事情。假如不是真偷，那他/她顯然期望自己能有個辯白的機會，平白無故被人懷疑很吃虧。假如不知道是不是懷疑自己，那當然想知道，想知道而別人又不願意說，沒法知道，會增加自己的不安。即使心裡清楚別人懷疑的是自己，其實還是希望別人親口說出來的，因為親口說出來之後才真正明確，沒親口說出的時候，總是要忍不住去猜想不同的可能性，越猜越不確定，就越要猜。</p>\n<p>其他任何情況下，也都一樣，公開比不公開要好。對於那些超級理智的、很想做“正人君子”的岳不群之流的人，解決他們心理問題最好的辦法，也就是讓他們逐步開放自己的內心，正常地表達自己內心的感受，不要過多地用很理智的方式，去壓抑內心的感受，迴避內心受到的傷害。內心多疑，卻又死活不肯承認，這不是什麼好品質，也不是真正的君子作風。</p>\n</div>"},{"title":"第十二章　殺人名醫","content":"<div>\n<p>第十二章　殺人名醫</p>\n<p>心理分析</p>\n<p>岳不群及家人前去拜訪岳飛廟，背地裡聽到桃谷六仙說話，有人把桃實仙的胸膛剖開，又縫合，敷點藥，伸掌在桃實仙頭頂“百會穴”上重重一擊，桃實仙就被救活了。這個人就是被稱為“殺人名醫”的平一指，平一指醫術高得驚人，但有個怪毛病，醫一人，殺一人；殺一人，也就醫一人。決不多醫，也不會少醫。</p>\n<p>平一指親自找上門來，要給令狐沖醫治，卻奇怪地發現他體內八道真氣，驅不出、化不掉、降不服、壓不住，平一指行醫多年，從來沒有遇過這等怪事，枉費他醫術高明，對令狐沖的怪病卻也無能為力。</p>\n<p>十多名大漢前來送禮，送的都是精緻點心，燻雞火腿，更有人參、鹿茸、燕窩、銀耳一類珍貴滋補的藥材，還有金錠銀錠，令狐沖自己也摸不著頭腦。緊接著八名漢子送來美酒，都是“極品貢酒”、“紹興狀元紅”之類珍貴的美酒。書生祖千秋與令狐沖論杯，開懷暢飲。把八顆起死回生的“續命八丸”，混在酒裡，給令狐沖喝了。一個肉球人趕來尋找自己的“續命八丸”，被桃谷四仙抓住手腳，隨即又從桃谷四仙手中滑走。</p>\n<p>心理分析</p>\n<p>本書前面的章節討論過魔鬼的特點，魔鬼並不是我們很多人所想象的樣子，面目漆黑，一身黑袍，一看就特別邪惡。魔鬼要都長這樣，這麼容易識別，那它就沒資格做魔鬼了。魔鬼是個高度聰明的傢伙，它有非常強的控制慾，試圖把一切可能的區域都攬入自己的控制範圍。為了達到這個目的，它不擇手段，可以以任何面目，在任何場合，任何時刻隨時出現，它特別善於偽裝，所以識別起來非常困難。它可以偽裝成“上帝”，控制那些想成為上帝的人，我們看上去覺得他們很有上帝的風度，會誤以為他們是真的上帝，就連他們自己也會誤以為自己就是上帝，其實是在替魔鬼作惡。魔鬼可以偽裝成善良的人，可以偽裝成為謙虛的人，可以偽裝成愛思考的人，可以偽裝成善辯論的人……總之，魔鬼可以偽裝進入一切有可能的區域，攻其不備，人類心靈哪兒脆弱，它就攻擊哪兒；哪兒有漏洞，它就會乘虛而入。當一個人太過於想做好人，魔鬼就會乘機控制他，生活中就會顯得這個人特別好，好得不可思議，但是仔細辨別就會發現，他不是真的對你好，他之所以對你好，是因為，假如不對你好的話，他自己難受，因此他對你好是在滿足他自己對你好的需要。被控制之後，他的問題就在於，太想對別人好，沒有辦法不對別人好，這樣的人，看起來似乎挺好的呀，生活中不就需要好人嗎？第一，這種人對別人好是在傷害自己，所以特別容易得癌症；第二，由於他對你好是為了滿足自己的需要而不是真的對你好，那當你不能滿足他的需要時，很難想象他會做出什麼。即使沒有做什麼驚天動地的事，你不需要別人對你好，偏偏有個人纏著要對你好，想擺脫都擺脫不了，你說累人不累人？</p>\n<p>魔鬼是導致人類心理不健康的最基本的因素之一，試圖打敗，或者徹底地消滅魔鬼，那都是徒勞，因為它本身就是一種存在，稀鬆平常，僅僅把它當做一種無關的存在，恰恰是最好的對付魔鬼的方法。當你試圖去消滅它時，說明你內心有對它的恐懼，消滅它的同時，可能恰好中了魔道。</p>\n<p>要能把它當做一種普通的存在，首先必須能識別，不能識別的話，控制了你，你自己也沒法知道那就是魔鬼。而對魔鬼的識別，又是一件非常困難的事情，所以有必要反覆講述魔鬼的特點，深入瞭解它的特性，才有可能根據這些特性去識別它。識別魔鬼是一輩子的事，所以心理要健康，也要做不懈的努力。有一種特別愚蠢的辦法，給心理健康定個標準，向著這個標準不斷努力，有一天終於達到了，然後對自己說：“好，從現在開始，我的心理健康了！”說出這種話，這個人基本上完了。就像一個小學生，從來沒得過100分，特別期待，學習很努力，很勤奮，有一天終於得了100分，然後就想：“我都得滿分了，那不就代表我什麼都會了嗎？還有什麼可學？”顯然很滑稽，因為現在得100分，不代表以後要學的東西你也全都懂。因為這次得100分，以後就不再學習，那這個小學生肯定完蛋了。試圖追求一個固定的目標，達到以後，以逸待勞，永遠不用再做努力，這也是魔鬼最基本的特點，是魔鬼常使的招，因為它對人的誘惑力的確挺大，誰不想以逸待勞，以不變應萬變？</p>\n<p>盡一切可能，不放棄任何努力，不斷擴大自己的控制範圍，這是魔鬼的本性。當一個人被魔鬼控制以後，有時候他/她的行為，表面上正常，實際上有點反常；而有時候，他/她的行為看上去就可能覺得有些古怪，或者反常。比如小說裡的“殺人名醫”平一指，外號就很古怪，醫生是救人的，怎麼名醫還殺人呢？一看就知道這的確是個名醫，名得讓人心寒。</p>\n<p>一個人醫術很高，又很想顯示自己醫術的醫生，就挺容易被魔鬼利用，他救人不是為了救人性命，而是為了顯示自己醫術高明。為了顯示自己醫術高明，越是高難度的疾病越感興趣。這樣行醫，一定有很多危險，再高明的醫生也不可能解決所有難題，假如碰上高難度的疾病，一個太想大顯身手的醫生，可能願意以生命為代價，想破頭皮，想到死也要想出解決的辦法，這還只是他自身的危險。假如遇上那些過於普通的疾病，名醫不感興趣呢？是放棄醫治，還是為了尋求醫治而先加重疾病？這樣的病人多半要倒大黴。</p>\n<p>平一指給自己定了個很古怪的遊戲規則，下面是嶽夫人介紹平一指的一段話：</p>\n<p>這位平老先生，是武林中的一個怪……一位奇人，醫道高明之極，當真是妙手回春，據說不論多麼重的疾病傷勢，只要他答應醫治，便決沒治不好的。不過他有個古怪脾氣。他說世上人多人少，老天爺和閻羅王心中自然有數。如果他醫好許多人的傷病，死的人少了，難免話人太多而死人太少，對不起閻羅王。日後他自己死了之後，就算閻羅王不加理會，判官小鬼定要和他為難，只怕在陰間日子很不好過。因此他立下誓願，只要救活了一個人，便須殺一個人來抵數。又如他殺了一人，必定要救活一個人來補數。他在他醫寓中掛著一幅大中堂，寫明：“醫一人，殺一人。殺一人，醫一人。醫人殺人一樣多，蝕本生意決不做。”他說這麼一來，老天爺不會怪他殺傷人命，閻羅王也不會怨他搶了陰世地府的生意。</p>\n<p>看起來非常合理，為了不讓老天爺怪罪自己，也不讓閻羅王埋怨自己，所以才這麼做，自己也是迫於無奈，並不是有意要這麼做。仔細分辨就會發現未必符合事實，憑什麼說人世間不能活人多而死人少？誰說的？老天爺和閻羅王曾經告訴你嗎？平一指又為什麼知道自己死後必定下陰曹地府？萬一因為救人太多有福報而上天堂呢？閻羅王和判官小鬼怎麼跟自己為難？非要按照這個遊戲規則行醫，醫一人，殺一人；殺一人，醫一人，這倒恐怕真要下地獄，真有閻羅王和判官小鬼找自己算賬。</p>\n<p>特別巧，我們在督導小組上也遇到過一個非常類似的例子。某來訪者出現三個子人格：待救的病人，自己，還有一個黑衣人。自己剛好想要救那個病人，但是黑衣人說：“你可以救她，但是你必須死。”象徵意義上，待救的病人，是來訪者出現心結，暫時缺乏生命力的一個側面；自己就是目前的自己，是自己現在的狀態；黑衣人就是魔鬼。黑衣人說自己可以救病人，但是自己必須死，聽起來蠻有道理，但憑什麼這麼說？這不過是你黑衣人定的規則，你愛定規則，想定多少定多少，愛怎麼定就怎麼定，你可以定，但我不用遵守。我要救人就救，你黑衣人定你的規則去吧，滾蛋！在這個例子中，黑衣人其實就是利用了來訪者想解決問題，但又有點猶豫不決的心理，嚇唬一下，來訪者很容易退縮，遵守規則，進入魔鬼的控制範圍。真救了，你黑衣人也不能把我怎麼樣，頂多把我殺了，那也不過是意象中殺死，又不是真的能把來訪者殺死。幹嗎要聽他的？救了病人，大家都活好好的，皆大歡喜，多好！</p>\n<p>平一指的例子也是一樣，規則是他定的，一旦進入遊戲，按照他的規則行事，你就會進入他的控制範圍。我們在前邊的文章中做過分析，對付魔鬼最好的辦法，就是不理他，管他什麼遊戲規則，我才不上你套呢。</p>\n<p>令狐沖道：“平前輩，聽說你給人治病救命，有個規矩，救話之後，要那人去代你殺一人。”平一指道：“不錯，確是有這規矩。”令狐沖道：“晚輩不願替你殺人，因此你也不用給我治病。”平一指聽了這話，“哈”的一聲，又自頭至腳地向令狐沖打量了一番，似乎在察看一件稀奇古怪的物事一般，隔了半晌，才道：“第一，你的病很重，我治不好。第二，就算治好了，自有人答應給我殺人，不用你親自出手。”</p>\n<p>平一指越：“令狐兄弟，你體內有八道異種真氣，驅不出、化不掉、降不服、壓不住，是以為難。我受人之託，給你治病，不是我不肯盡力，實在你的病因與真氣有關，非針灸藥石所能奏效，在下行醫以來，從未遇到過這等病象，無能為力，十分慚愧。”說著從懷中取出一個瓷瓶，倒出十粒硃紅色的丸藥，說道：“這十粒‘鎮心理氣丸’，多含名貴藥材，制煉不易，你每十天服食一粒，可延百日之命。”令狐沖雙手接過，說道：“多謝。”平一指轉過身來，正欲上岸，忽然又回頭道：“瓶裡還有兩粒，索性都給了你罷。”令狐沖不接，說道：“前輩如此珍視，這藥丸自有奇效，不如留著救人。晚輩多話十日八日，於人於己，都沒什麼好處。”平一指側頭又瞧了令狐沖一會，說道“生死酯之度外，確是大丈夫本色。怪不得，怪不得！唉，可惜，可惜！慚愧，慚愧！”</p>\n<p>當你真心地、完全發自內心地不理睬魔鬼的遊戲規則時，魔鬼的確會拿你沒辦法，甚至會反過來，樂意為你效勞。平一指就是這樣，像令狐沖這樣能把生死置之度外的人，的確罕見。平一指態度的轉變，以及對令狐沖的惋借，多半是真心的。現實生活中碰到這樣的情況，你不理睬魔鬼的手段，它反過來對你表示友好，表示佩服和羨慕時，卻值得警惕，因為極有可能是新的招。不小心的話，可能又會中圈套。</p>\n</div>"},{"title":"第十三章　血液象徵","content":"<div>\n<p>第十三章　血液象徵</p>\n<p>故事梗概</p>\n<p>嶽靈珊和林平之背地裡說令狐沖壞話，被人劫走。留下血書，約岳不群在五霸岡交還女兒。桃谷六仙中計，被人從船上引開，昏迷中的令狐沖被肉球人抓走。肉球人姓老，單名一個“爺”字，字“頭子”，“黃河老祖”中的所謂“老”，“祖”就是祖千秋。祖千秋偷了老爺的“續命八丸”，給令狐沖服下。“續命八丸”本是老爺用來救女兒性命的，現在老爺抓來令狐沖，想取他的血液，給女兒喝下，用令狐沖服的“續命八丸”給女兒治病。</p>\n<p>祖千秋對著老頭子耳語幾句，老頭子立即罵自己該死，向令狐沖納頭便拜，連連叩頭，血液是決計不敢要了。令狐沖滿腹疑團，不知道這二位衝著誰的面子，對自己如此恭敬。想要追問，二老也死活不敢回答。他騙來繩索，將二人雙手反背牢牢縛住，沒有內力，只能倒轉尖刀，用刀柄在二人的環跳、天柱、少海等處穴道中用力敲擊，封住了二人的穴道。走入那少女房中，少女一副病入膏肓的樣子。令狐沖割開自己腕脈，接了一大碗，逼迫那少女喝下。心想可能不夠，當下再割右手腕脈，放了大半碗鮮血，又去喂那姑娘。</p>\n<p>令狐沖迷迷糊糊之中，掛念嶽靈珊的安危，老頭子等人得知後，不多時有兩乘轎子抬來，裡面坐的正是嶽靈珊和林平之。根據嶽靈珊的描述，可以推斷，劫走她們的是所謂“漠北雙熊”。漠北雙熊有個愛好，比較喜歡吃鏢局子保鏢的肉。</p>\n<p>心理分析</p>\n<p>血液是一種很重要的象徵物，意象中挺常見，瞭解血液的象徵意義，可以通過吸血鬼的傳說，比較容易理解。</p>\n<p>吸血鬼最早的起源據稱是《聖經》中的該隱。根據《聖經》記載，亞當和夏娃被逐出伊甸園之後來到荒野，並且生了許多孩子。其中該隱是老大，同時也是世上第三位人類。他是個農夫，和牧羊人弟弟共同生活。有次兩人照例向上帝獻祭，由於弟弟畜牧之便，奉上的是豐盛的肉食，該隱的青菜、蘿蔔便招來上帝不滿。該隱憤而謀殺了弟弟，翌日上帝問該隱他弟弟哪裡去了，他詭稱不知。上帝怒道：“狡賴！你弟弟的冤魂向我哭訴你的暴行，所以你得接受我的懲罰！”該隱於是向上帝求饒，但是上帝說：“不，我不會殺你，而且我知道你以後一定會被人唾棄。所以我給你一個與眾不同的記號，這樣你就會讓別人知道你不該被殺……只是儘量折磨你罷了。”</p>\n<p>在意象中殺死一個人，多半意味著失去這一部分的生命力，殺死一個子人格，表明跟這個子人格割斷了情感聯繫。情感嚴重缺乏，這是吸血鬼最基本的特徵。一般來說，大部分吸血鬼通常吸食人類的血液，但是也有部分吸血鬼以吸食動物甚至其他吸血鬼的血維生。總的說來，吸血鬼都是通過吸食血液維生，吸食血液，從而獲得生命力，所以血液其實是生命力的象徵。但血液通常還有另外一層意義，就是象徵情感。因為在生命的本源處，情感其實就是和生命力聯繫在一起的。所以象徵生命力和象徵情感，其實是一回事。吸血鬼沒有心跳和脈搏，也沒有呼吸，沒有體溫，而且永生不老。同時，他們有自己的思想，會思考，會交談，也會四處走動，甚至還會受傷和死亡。簡單地說，吸血鬼就是沒有情感，沒有生命力。他們的力量很大，但那是另外一回事，其力量不是跟情感聯繫在一起的生命力。一個只會思考，完全沒有情感，沒有生命力的人，內心是陰暗的，不可能活得很陽光。所以吸血鬼只能在夜間活動，害怕白天，害怕陽光，不能見光。如果一個吸血鬼打算令一個人變成吸血鬼，必須將自己的血液給予對方。被吸食者接受吸食者的血液，兩種血液融合才有可能變成吸血鬼。從別人那兒吸取血液，是從別人那兒獲得情感，血液跟被吸食者的血液混合，象徵著被吸食者受到了吸血鬼情感缺乏的傳染，因此自身也會變成吸血鬼，即變成情感的缺乏者。搞心理諮詢的都知道，處理人的情感問題，有一個非常基本的原則，如果一個人情感缺乏，不解決自己的心理問題，而一味地想從別人身上獲取情感，是不可能真正解決問題的，最多能暫時緩解。不能解決問題，一個傳染一個，會不停地傳染下去，所以吸血鬼沒法消滅。有一個似乎有用，但是很愚蠢的辦法，可以用木樁釘住吸血鬼的心臟，這象徵著使用了錯誤的辦法，暫時把心理問題強行壓抑，所以只能暫時起到壓制的作用，並不能消滅吸血鬼。吸血鬼問題的解決，有待情感的滋潤和自身內心生命力的復活，決不是木樁就能釘住的，也不是互相吸食就能滿足的。互相吸食只會不斷地增加傳染源，感染更多的人。</p>\n<p>解釋到這裡，聰明的讀者已經不難理解，為什麼吸血鬼的傳說廣泛流傳於西方社會，而不是東方國家。西方社會向來注重理性傳統，一個表現過於理性的人，一定是壓抑情感的，所以理性主義的背後一定有情感的缺乏。特別有意思，有著基督教傳統，特別講究大愛，講究像上帝一樣愛所有人的社會，恰恰是個缺乏情感的社會。因為對上帝的愛，與其說是愛，不如說是信。愛上帝是沒有理由的，你只允許愛，不允許問為什麼，愛上帝就對了，愛上帝就是真理，沒有為什麼。這樣的愛導致愛的缺乏，也是可以理解的。看美國的大片會有一個明顯的感覺，主人公肌肉發達，特別強調力量美，這種力量其實跟吸血鬼的力量有異曲同工之妙，過於理性的人都會喜歡幻想自己力大無比，這種幻想的背後恰恰是因為生命力的缺乏。西方的機器人技術一定比我們發達得多，因為機器人剛好就是完全沒有情感的人。</p>\n<p>如果一個來訪者在意象中出現機器人，一定意味著這個人超級理性，嚴重壓抑情感。在中國，我們的實踐經驗是，這樣的人群，以知識分子最多。因為這群人是最理性的。我們心理諮詢並不反對理性，只是反對過多地用理性去壓抑情感，這對人的健康特別不利。由於這樣的人又總是固執地認為自己是對的，所以這類心理問題特別棘手，產生的問題很嚴重、很麻煩，又很不好解決。比如說西方社會就挺難解決吸血鬼的問題。</p>\n<p>假如真出現了情感缺乏的問題，可以試著用愛，用情感去滋潤。表現在意象中，常見的就是用血液。有時候用眼淚也是有效的。甚至在意象中，很多時候眼淚跟血液就是一回事。在我們碰到的來訪者中，曾經遇到過一段意象，地上有骷髏，她自己站在旁邊流淚。這時候諮詢師讓她把眼淚滴到骷髏上，結果就發生了明顯的效果。眼淚滴下去之後，自己就變成血液，流到骷髏上。這個處理對來訪者的健康是有積極意義的。骷髏是死去的子人格，某個子人格死去，象徵著來訪者某個人格側面失去了生命力。當它復活之後，來訪者整個生命狀態會變得更好。多數情況下會好很多，因為那個死去的子人格，往往也是我們主要的心理問題所在。重要的問題解決了，生命力當然會有較大的恢復。眼淚本身就是情感的象徵，只不過比血液稍微消極一些，眼淚變成血液，是個挺好的轉變。血液再流到骷髏上，象徵著用積極的情感，去滋潤生命的另一部分，是被忽略的部分。這跟吸血鬼吸血是很不一樣的。被吸血是被動的，給予關懷是主動的給予，差別就在這兒。還有一個很重要的地方，給予的愛是不是真心給予，假如不是真心，那麼即使是主動的給予也沒有用。如果是發自內心的，那就一定有用。因為死去的子人格，需要的也就是有人關愛，有人支持。往往需要有人支持，才能解決問題，才能復活，因為它自己的力量多半不太夠，否則也不那麼容易死去。</p>\n<p>現在來理解令狐沖放血救少女的故事情節就容易了。令狐沖掀開棉帷，走進房去，只見她兀自坐著，靠在枕墊之上，半睡半醒，雙目微睜。令狐沖走近兩步，見她臉上肌膚便如透明一般，淡黃的肌肉下現出一條條青筋，似乎可見到血管中血液隱隱流動。房中寂靜無聲，風息全無，好像她體內鮮血正在一滴滴地凝結成膏，她呼出來的氣息，呼出一口便少了一口。令狐沖心道：“這姑娘本來可活，卻給我誤服丹藥而害了她。我反正是要死了，多活幾天，少活幾天，又有什麼分別？”取過一隻瓷碗放在几上，伸出左腕，右手舉刀在腕脈上橫斬一刀，鮮血泉湧，流入碗中。他見老頭子先前取來的那盆熱水仍在冒氣，當即放下尖刀，右手抓些熱水淋在傷口上，使得鮮血不致迅速凝結。頃刻間，鮮血已注滿了大半碗。那少女迷迷糊糊中聞到一陣血腥氣，睜開眼來，突然見到令狐沖手腕上鮮血直淋，一驚之下，大叫了一聲。令狐沖見碗中鮮血將滿，端到那姑娘床前，就在她嘴邊，柔聲道：“快喝了，血中含有靈藥，能治你的病。”那姑娘道：“我……我怕，我不喝。”令狐沖流了一碗血後，只覺腦中空蕩蕩地，四肢軟弱無力，心想：“她害怕不喝，這血豈不是白流了？”左手抓過尖刀，喝道：“你不聽話，我便一刀殺了你。”將尖刀刀尖直抵到她喉頭。那姑娘怕了起來，只得張嘴將一碗鮮血一口口地都喝了下去，幾次煩惡欲嘔，看到令狐沖的尖刀閃閃發光，竟嚇得不敢作嘔。令狐沖見她喝乾了一碗血，自己腕上傷口鮮血漸漸凝結，心想：“我服了老頭子的‘續命八丸’，從血液裡進入這姑娘腹內的，只怕還不到十分之一，待我大解小解之後，不免所失更多，須得儘早再喂她幾碗鮮血，直到我不能動彈為止。”當下再割右手腕脈，放了大半碗鮮血，又去喂那姑娘姑娘皺起了眉頭，求道：“你……你別迫我，我真的不行了。”令狐沖道：“不行也得行，快喝，快。”那姑娘勉強喝了幾口，喘了一會兒氣，說道：“你……你為什麼這樣？你這樣做，好傷自己身子。”令狐沖苦笑道：“我傷身子打什麼緊，我只要你好。”在心理諮詢中發現，有時候心理的疾病和生理的疾病，界限並不是我們想象的那麼清楚。一個人心理狀態過差，也可能以生理疾病的形式表現出來。當然一個人生理上的病過重，心理狀態也不大可能好。令狐沖是個例外。通過對少女的描述，一副病入膏肓的樣子，再看看他的家庭環境，可以判斷，少女的心理可能不是很健康。至少可以明顯感覺到，少女已經嚴重缺乏生命力。令狐沖是可以不救這位姑娘的，沒人能逼他。從他剛進門心裡想的那句話，可以看出，他救少女其實也並不是因為自己內疚，所以非救不可。只是自己多活幾天少活幾天無所謂，所以就救了，這就是真心，沒有目的，沒有需要，救一下而已。這正是他救人可能發生效果的關鍵。藥物是不是真能發生效果，那不是我們所關心的。我們只關心心理層面的救治。真心地用自己的鮮血去救一個人，這在心理方面是一定會有效的。不管後來藥物有沒有發生效果，有一點可以肯定，令狐沖的這次救人，一定可以使這位姑娘的生命力有所恢復，生命狀態可能變好，至少以後會活得再稍微陽光些。</p>\n</div>"},{"title":"第十四章　注血無效","content":"<div>\n<p>第十四章　注血無效</p>\n<p>故事梗概</p>\n<p>五毒教教主藍鳳凰來訪，帶了四個苗女進船。四個苗女各自捲起衣袖，露出雪白的手臂，跟著又捲起褲管，直至膝蓋以上。之後，藍鳳凰也慢慢捲起了褲管。四名苗女將水蛭放在自己赤裸的臂上腿上，藍鳳凰也一樣。藍鳳凰輕輕揭開蓋在令狐沖身上的棉被，從自己手臂上拔下一隻吸滿了八九成鮮血的水蛭，放上令狐沖頸中的血管。那水蛭咬住了他血管，又再吮吸。藍鳳凰在水蛭身上灑了一些白色粉末。四名苗女解開令狐沖衣襟，捲起他衣袖褲管，將自己身上的水蛭一隻只拔下，轉放在他胸腹臂腿各處血管上。片刻之間，兩百餘隻水蛭盡已附著在令狐沖身上。藍鳳凰不斷挑取藥粉，在每隻水蛭身上分別灑上少許，水蛭漸漸縮小。原來她們所行的是轉血之法，以水蛭為媒介，將她們五人身上的鮮血轉入令孤衝血管。隨後還把“五寶花蜜酒”給令狐沖喝了。</p>\n<p>飯店裡，江湖各路人馬聚集，圍攻餘滄海，逼他交出《辟邪劍譜》。誰也弄不清楚劍譜下落，爭得熱火朝天。一聽說令狐沖在場，眾人都是大驚，生怕自己禮數不周。司馬島主親自前來，迎接令狐公子去五霸岡上和群雄相見。</p>\n<p>心理分析</p>\n<p>為什麼令狐沖的血可以救少女，藍鳳凰的血就不能救令狐沖？不都是血嗎？令狐沖是真心的，真誠的，藍鳳凰也是很真誠的呀，為什麼這兩者會有差異？</p>\n<p>心理諮詢是一個讓人敬而遠之的圈子，很多人有這樣的誤解，以為心理諮詢是一個病態人群聚集的圈子。還有更大的誤會，有人總是把心理疾病和低能，弱智等詞彙聯繫起來。事實上剛好相反，有些有心理問題的人，常常在某一方面表現出超乎常人的天賦。比如有的人智商指數遠高於常人，思維超級發達；有的人感覺特別敏銳，能夠非常靈敏而準確地感受到別人的情緒，甚至是極為細微的，一般人都沒法感受到的情緒。而這恰好是作為諮詢師最基本的素質，最優秀的天賦之一。像我這樣思維型的人，可能經過多年的訓練還達不到他們的正常水平。</p>\n<p>外行人挺難理解諮詢界的一個現象，很多諮詢師曾經是心理疾病患者。明白了怎麼回事的話，這其實一點都不奇怪。以上面這位來訪者為例，他之所以出心理問題，恰恰是因為感覺太敏銳，經常能感受到別人的情緒，但又沒經過專業訓練，不知道該怎麼處理。結果感受的情緒太多，全都積累在自己身上，自己成了別人情緒的一個大醬缸，多種情緒夾雜在一起，他就會出現心理問題。經過一段時間的諮詢，把自己的問題解決了，那麼他的感受性就可以成為諮詢師最好的天賦，加以利用，再參加一段時間的督導訓練，他就可以成為很好的諮詢師，絕對比那些正規院校畢業的心理學博士，或者考了國家諮詢師證的諮詢師，要優秀得多。再者，去做心理諮詢的來訪者，也不全是那麼病態的。甚至其中的很大一部分，他們的健康程度比一般人還要高，只是出現了暫時的心理困擾，就去解決一下。所以問題解決之後，再經過一段訓練，完全可以成為很好的諮詢師。</p>\n<p>心理健康並沒有一個絕對的標準，健康的人還可以更健康，更健康的人也還可以更健康。參加督導小組的很多人，他們的健康度已經超過常人很多，只是為了生活更幸福，更快樂，活得更舒展，才繼續參加督導。所以他們做了諮詢師，真的不是什麼怪事。</p>\n<p>但是有一個前提，要做諮詢師，首先必須解決自己的問題。不觸碰自己的傷痛，只想學一門技術，或者憑著一張證件就做諮詢，那在我們看來是不可能的事情。拿了國家諮詢師的證件，然後來參加我們的督導，才發現自己還完全不會做諮詢，這樣的例子太常見了。</p>\n<p>為什麼不解決自己的問題的人，一定不能做諮詢師？</p>\n<p>情緒對人的傳染是無意識的，一個自身有心理問題的人，一定會把自己的心理問題，無意識地帶到諮詢中去，而他自己多半不知道。坐在一個心理很健康的人身邊，我們自然會感覺到非常舒服；而坐在一個心理很不健康的人身邊，怎麼著都會覺得不舒服。有時候也說不清楚怎麼難受，反正就是難受。比如說坐在一個病人身邊，一看就極度病態，要死不活的樣子，那你自然會感覺挺難受。這就是無意識的影響。有人自信能做到避免自身問題帶來的影響，我不信。你本人抑鬱得整天想自殺，那別人只要坐到你身邊就會感覺不舒服了，不是你想避免就能做到的。</p>\n<p>具體的諮詢過程中，諮詢師心理問題嚴重的話，也會不斷地影響諮詢。比如某個號稱學過意象對話的諮詢師，在給來訪者做意象，來訪者說他看到一個惡鬼，特別恐怖，長了很長的牙齒，牙上還有血，恐怖得受不了。諮詢師馬上說：“那你趕快跑啊。”這個諮詢師就很好地把自己的心理問題傳達給了來訪者。一個健康的諮詢師不會輕易就讓來訪者跑開，來訪者都還沒說要跑，諮詢師先開口了！在這種時候，來訪者的恐懼會傳染諮詢師，諮詢師感到恐懼不奇怪。但一個健康的諮詢師就能頂住，不會把自己的應對方式教給來訪者。而一個自己有問題的人，在不知道該怎麼做的情況下，就會不自覺地讓來訪者使用自己的方式，而這種方式恰恰是不健康的。有人會說，那我以後凡是碰到可以逃避的地方，都不讓來訪者逃，那不就對了？也不是這樣。假如你本來就恐懼，卻要在那兒硬撐著，來訪者其實是能感覺到你內心的恐懼的，這會讓來訪者覺得你這個諮詢師不可靠，因為弄不清楚你什麼時候是真的。基本的信任都沒有，諮詢也就快宣告失敗了。</p>\n<p>心理問題之所以影響諮詢，是因為雖然影響到了，諮詢師自己卻也不知道。比如一位女性來訪者，在諮詢室看到白衣女鬼，嚇得臉色蒼白，馬上讓諮詢師把空調溫度調高一點。諮詢師如果真的站起來調溫度，那就中圈套了。一個有問題的諮詢師，這種時候中了圈套自己還不知道。因為來訪者之所以要求調溫度，是因為覺得冷。而此時此地的冷，顯然是看到白衣女鬼之後的恐懼反應。來訪者想要回避，所以找到一個相關的東西，用調節物理溫度來回避心理溫度，你當真去調溫度，諮詢就跑題了。</p>\n<p>所以說，諮詢師的健康度達到什麼樣的水平，他就一定只能把來訪者帶到相應的水平。可能會少，但是一點都不會多，不可能多。即使他心裡那麼想，很願意把來訪者往健康的方向帶，事實上他也特別努力地這麼做了，但就是做不到，心有餘而力不足。</p>\n<p>我們在前文分析令狐沖救少女的時候，特別強調，他的方法所以發生效果，能讓少女恢復生命力，有一點非常重要，就是真心，真誠。其實還有另外一點非常重要，就是令狐沖的健康度比那位少女要高。進了病房，一看就知道，那位少女已經非常病態，心理狀態好不了。而令狐沖雖然身受內傷，但那是生理上的傷。不影響他的心理健康，受傷很重，但他從心理上不是特別在乎，所以心理狀態其實遠比那位少女要好得多。令狐沖這個人，主要的人格魅力也就在這兒，不是特別在乎生死，知道自己活不長了，大不了一死，順便還可以救人。能夠對生死這等不在乎的情況是非常罕見的。有的人說不怕死，那只是嘴上說。真正面對生死抉擇的時候，還是會毫不猶豫地選擇苟且。令狐沖是真的不太在乎，一個真能放得開，真能不在乎生死的人，反而會是一個特別有生命力，特別頑強，特別具有人格魅力的人。而這樣一個健康的人，去救病重的少女，當然有用。</p>\n<p>但是，藍鳳凰的情況不太一樣。跟令狐沖相比，藍鳳凰還算不上特別健康，特別有生命力。筆者這麼說，絕對無意詆譭藍鳳凰的人格。就她自身來說，她的健康度已經非常高，本書中人物心理健康度排序，藍鳳凰可以比較靠前。跟岳不群之流相比，她已經健康了太多太多。這在她跟岳不群對話時已經可以看出。藍鳳凰開朗，外向，張揚，而且一起的幾個苗女都很開放，不像岳不群，非要裝出一副“正人君子”的樣子。顯然比岳不群討人喜歡得多。順便提一句，一個人的魅力一定不是僅憑外表，而更多的是性格魅力的散發，一個健康的人，一定比一個病態的更顯魅力。藍鳳凰身上的魅力，可能有民族或者地域性的特徵。比如說，內地人去了西藏都會感覺特別爽，因為那兒的民風跟內地有非常大的差異。內地人比較收斂、內向，而西藏人特別外向，特別張揚，特別舒展。當然是張揚的更有魅力，有些人看起來比較內向，但也非常有魅力，那也一定有一種內在的張揚，不過張揚的方式不一樣而已。</p>\n<p>藍鳳凰雖然也非常健康，但跟令狐沖相比，頂多也就一個層次的，不像令狐沖和少女之間的對比那麼明顯。同一層次的人要有很明顯的健康影響是不大可能的。當藍鳳凰的健康度不夠高，而要去影響令狐沖時，一定也會把她自認為對的因素帶入。帶毒的血液，帶毒的美酒，象徵著既健康而又存在危險的影響因素。在藍鳳凰看來是會有效的，實際的結果，也的確有點效，雖然很輕微，但令狐沖也還是甦醒了，多少有些恢復。不過因此而帶入的毒素，也把令狐沖害得不輕。</p>\n</div>"},{"title":"第十五章　女孩的心思你別猜","content":"<div>\n<p>第十五章　女孩的心思你別猜</p>\n<p>故事梗概</p>\n<p>五霸岡上，令狐沖受到眾人殷勤的款待，平一指再次上門為令狐沖把脈，發現令狐沖又是失血，又是大補，體內還新增了藍鳳凰的奇毒，不可救藥。平一指百思不得其解，幾個時辰之間，一頭烏髮變得雪白，狂噴鮮血而死。</p>\n<p>所有人的態度瞬間驟變，沒人敢承認自己在岡上見過令狐沖。棚中響起婆婆熟悉的琴音，少林和崑崙派高手上岡除魔，硬闖草棚，令狐沖上前阻攔。少林派兩名高手一傷一走，崑崙派姓譚的中毒身亡。</p>\n<p>婆婆要求令狐沖護送，幾名漢子無意中見到婆婆容貌，立即刺瞎自己的眼睛，被婆婆發配到荒涼的蟠龍島。少林高僧方生等人趕來，婆婆出手狠毒，連殺四人，但也中了方生一掌。令狐沖出劍，方生認得是風清揚獨孤九劍傳人，不願為難，只勸令狐沖上少林求治內傷。</p>\n<p>令狐沖繼續護送，通過水中倒影，認出婆婆是十七八歲的美貌姑娘。原來她叫盈盈，容貌秀麗絕倫。令狐沖言語輕薄，盈盈半推半就，柔情無限。烤上一頓青蛙，兩人就地睡了一晚。</p>\n<p>聽到計無施等人聲音，談論五霸岡豪宴之事，江湖英雄猜知盈盈對令狐沖有意，為了逢迎盈盈，才聚眾岡上，宴請令狐沖。豈知盈盈得知後大怒，開了殺戒，幾乎掃平五霸岡，剩餘少數活口也被髮配荒島。盈盈現身，計無施驚慌發誓，遠赴西域，再也不回中原。偏偏盈盈改了主意，不要他們走，要他們完成一個任務，到江湖上四處傳言，見到令狐沖就殺。</p>\n<p>心理分析</p>\n<p>令狐沖一定想不明白，眼前這個貌美如花的姑娘，怎地性情如此刁蠻橫，行事古怪而又不講理。</p>\n<p>剛上大學的時候，一幫哥們聚在一起聊天，很多人都有一個關於戀愛的理想，就是要找一個清純的小女生，從零開始，相處到老，覺得這樣的愛情才是完美的，完美的愛情不能容忍絲毫的瑕疵。等到四年之後，即將畢業的今天，再聚到一塊聊天，多數人已經有過一次，兩次，或者更多次的戀愛經驗，又都感嘆：“戀愛千萬別找清純的少女，要找就找個有點戀愛經驗的。找了清純的小女生，第一點太累人，她會把你累死；第二點，太任性，特別難相處。”</p>\n<p>電視劇、言情小說，通常都會有一個精彩的結局，打動觀眾的心，那就是男女主人公完美的結合。結合之後的下文呢？沒有了。筆者並不是對這個問題有特殊的好奇，也並非要批評作者理想主義的傾向，事實上小說還就只能這麼寫，只能是情感的誇張表現，小說家都像心理學家那麼現實，作品也就沒人看了。而我想要說明的只是一個事實，完美的結合之後，路途會更加遙遠，相處的過程才真正漫長和艱辛。</p>\n<p>從一個人的世界變成兩個人的世界，一定意味著雙方的心靈都要增加一重負擔，那就是對方的情緒。積極的情緒不用說，可以分享；但沒法迴避的是，有積極的情緒，也就一定有消極的情緒。長期的相處過程中會發現，我們很多人低估了自己情緒的感受能力，戀人之間，往往對方一點點非常細膩，非常細微的情緒，我們自己都是能夠感受到的。哪怕對方僅僅表現為無意中的一句話，一個簡單的眼神，一個普通的動作，我們都能感覺到背後的情緒，不管是憤怒，喜悅，悲傷，快樂，還是傷感，或者別的，都一樣能感受到。這跟天賦沒有關係，任何人都能感受到，只不過很多時候有無意識的迴避，很多人就以為自己沒能感受到。其實在內心深處，還是感受到了的。經常是生活中不起眼的一些小事件，都可能引起雙方的爭執，或者不愉快，比如說電視渙臺、購買衣服，等等。</p>\n<p>種種小事引起的不愉快加在一起，就會變成很大的精神壓力。而如果是有戀愛經驗的人，或許能更多地避免一些，所以壓力會小一些，沒那麼累人。然而，跟清純少女戀愛的困難，決不僅只這樣小的不愉快，更大的一股壓力來自於任性。</p>\n<p>以上是男生的評價，針對女生說的。男同胞們不用因此而感到自豪，其實，男生在初戀的時候也有同樣的任性，並不是女生的專利。這種普遍的任性來自於什麼地方，筆者目前還沒有確鑿的心理學依據可以說明，只是猜測，多半跟青春期內心情感矛盾的激烈衝突有關。比如又有強烈的戀愛衝動，又激烈地反對，極不願意承認。最終矛盾整合比較好，青春期度過順利，以後內心衝突就不是那麼明顯。整合不太好，這種內心衝突就會延續。任何沒有得到處理的心理問題都不會自動消失，伴隨年齡的不斷增加，這個問題會潛伏起來，俟機展現，一旦找到機會又會表現出來。</p>\n<p>心理學家的觀察和研究發現，正常的戀人或者夫妻相處，都會首先經歷兩個非常關鍵的時期，一個是甜蜜期，一個是混亂期。甜蜜期大概持續一年左右，之後進入混亂期，混亂期是個讓人很不愉快的時期，經常處於大吵大鬧中。但是又必須經歷，順利度過之後，相處才能穩定，而且能逐步找回相處的甜蜜。一年以內，雙方衝突也是有所體現的，只不過甜蜜遮掩了衝突，互相的容忍可能使衝突暫時緩解；一年之後，雙方基本的情結都爆發出來，迴避決不是解決的辦法，必然要經歷吵鬧，尋找到解決的辦法，才能恢復感情的甜蜜。</p>\n<p>千萬不要妄想戀愛如同想象中一樣甜蜜，永遠沒有衝突。沒經歷過混亂期的夫妻或者戀人，後來都宣告結束，或者就是湊合在一起，但是特別沒意思。還有一種情況，一輩子維持在甜蜜期，但經過仔細分辨會發現，這種甜蜜也就是表面上而已，生活比那些選擇分手更沒意思。</p>\n<p>有過戀愛經驗，有過吵鬧才知道，戀愛根本不需要想象的完美，因為吵鬧也是一種享受，也是一種愛的表達。只有纏綿的戀愛反而是特別沒勁的。吵鬧之後，雙方一般都會對自己的問題有所反省，能改的改，不能改的，至少清楚自己有這樣或者那樣的問題。很多時候，衝突其實來自於對自己的無知。在不知道自己有問題的情況下，已經傷害了別人。有所改變，或者更加自知以後，顯然相處會變得更加容易。所以上面男生的評價，戀愛不找清純的少女，也不是隨便亂髮表的感嘆，因為的確會很累，初戀的人也的確會比較任性，內心的情感衝突會比較複雜。</p>\n<p>想戀愛又極力否定，不願意承認，害怕另人猜透自己的心思，刁蠻任性。我們在任盈盈身上看到了比較極端的例子。顯然她心裡喜歡令狐沖，地球人都知道。當別人為此而宴請令狐沖時，她又表現得很不近人情，幾乎殺死所有參與的人。我相信在任盈盈內心深處是會有感動的，因為有人能理解她的內心，知道她的秘密。但她一定也會很惱火，該知道的人還不知道。這麼隆重的宴請，搞得所有人都知道，任盈盈肯定要生氣，因為這是一件很丟臉的事情。雖然內心裡會感動，但會表現得很生氣，這正是最普遍的心理衝突的反應，內心裡有多喜歡，外在表現就會有多憤怒。有過暗戀經驗的人，都會特別能理解任盈盈此刻的心情，理解她複雜的內心衝突。初戀的人一般都會犯一個低級的錯誤，以為自己喜歡別人，別人就應該知道。你不說，別人怎麼會知道呢？</p>\n<p>知道了人家女孩子的心思，然後去猜測，怎麼做能迎合，就像五霸岡上眾位英雄所做的一樣，這也是一種挺犯傻的表現。因為她本人內心是衝突的，你怎麼做都不可能對。宴請了令狐沖，她可以說：“哪裡輪到你自作聰明瞭？誰要你宴請了？”不宴請令狐沖，她也可以有話說：“都沒人理解我！”令狐沖的表現要比眾位英雄更合理。</p>\n<p>任盈盈眼見他越走越遠，追了上來，叫道：“喂，你別走！”令狐沖道：“令狐沖跟姑娘在一起，只有累你，還是獨自去了的好。”盈盈道：“你……你……”咬著嘴唇，心頭煩亂之極，見他始終不肯停步，又奔近幾步，說道：“令狐沖，你是要迫我親口說了出來，這才快意，是不是？”令狐沖奇道：“什麼啊？我可不懂了。”盈盈又咬了咬口唇，說道：“我叫祖千秋他們傳言，是要你……要你永遠在我身邊，不離開我一步。”說了這句話後，真子發顫，站立不穩。令狐沖大是驚奇，道：“你……你要我陪伴？”盈盈道：“不錯！祖千秋他們把話傳出之後，你只有暗在我身邊，才能保全性命。沒想到你這不顧死話的小子，竟一點不怕，那不是……那不是反而害了你麼？”令狐沖心下感激，尋思：“原來你當真是對我好，但對著那些僅子，卻又死也不認。”轉身走到她其前，伸手握住她雙手，入掌冰涼，只覺她兩隻掌心都是冷汗，低聲到：“你何苦如此？”盈盈道：“我怕。”令狐沖道：“怕什麼？”盈盈道：“怕你這傻子子不聽我話，當真要去江湖涉險，只怕過不了明天，便死在那些不值一文錢的臭傢伙手下。”令狐沖嘆道：“那些人都是血性漢子，對你又是極好，你為什麼對他們如此輕賤？”盈盈道：“他們在背後笑我，又想殺你，還不是該死的臭漢字？”令狐沖忍不住失笑，道：“是你叫他們殺我的，怎能怪他們了？再說，他們也沒在背後笑你。你聽計無施、老頭子、祖千秋三人談到你時，語氣何等恭謹？哪裡有絲毫笑話你了？”盈盈道：“他們口裡沒笑，肚子裡在笑。”令狐沖覺得這姑娘蠻不講理，無法跟她辯駁，只得道：“好，你不許我走，我便在這裡倍你便是。唉，給人家斬成十七八塊，滋味恐怕也不大好受。”盈盈聽他答允不走，登時心花怒放，答道：“什麼滋味不大好受？簡直是難受之極。”</p>\n<p>比較好的處理辦法，首先是理解。理解她目前的心理狀態是怎麼回事。理解了，能順從的地方順從，不能順從的地方可以明確自己的態度。明確自己的態度不等於反對，阻止別人。很多家長因為擔心孩子早戀影響學習，鬧到學校也要堅決阻止。結果不會是別的，一定會適得其反。明確自己的態度而不阻止，對方反倒更多地會反思自己的行為。</p>\n<p>理解了，知道青春期心理就這樣，所以一味順從，也不是辦法。因為一味地順從意味著其實你不理解她。任盈盈此刻內心一定不願意令狐沖對她完全言聽計從。令狐沖並不理解任盈盈什麼心理特點，但他的表現是對的，自己要走，所以走，不用非得符合你任盈盈的口味。假如令狐沖此刻完全聽從任盈盈的，任盈盈其實不會覺得他好，反而會在心裡挺看不起他，就像看不起對自己言聽計從的各路英雄。令狐沖不堅持走，任盈盈不會表達自己的內心，不說出來，令狐沖當然不會知道。不用去猜測，不必言聽計從，但是多理解，可能的情況下多順從，像令狐沖一樣，這可能是對付初戀情人的任性，相對比較好的辦法。</p>\n</div>"},{"title":"第十六章　絕路","content":"<div>\n<p>第十六章　絕路</p>\n<p>故事梗概</p>\n<p>令狐沖模模糊糊醒來的時候，已身處少林寺。三個月來，每天有方生大師以內力助他療傷，性命暫且保住。想通過（易筋經）秘術，化去內息異氣。拜訪方證大師，才得知，自己早已被逐出師門，天下雖大，竟無容身之處。</p>\n<p>不願意託庇求生，拜別方證、方生，走出少林寺。正邪雙方一起，幾百人圍攻向問天。魔教追拿他們教下叛徒，正派卻是替命喪向問天手下的朋友們復仇。向問天雙手之間還繫著一根鐵鏈，令狐沖路見不平，拔刀相助。先斷了青城派弟子三隻手掌。魔教教眾十餘人，也都是手腕吃了令狐沖一劍。長劍挑出，將魔教中一勇悍的婦人制服。泰山派天乙道人來攻，使出泰山派劍法的精要所在，令狐沖破解之後，天乙道人竟被嚇暈。門下五名青年道人挺劍來攻，又是手腕中劍。嵩山派前輩樂厚雙掌拍到，兩手穿在令狐沖劍上，但令狐沖也因中掌被困，向問天救起令狐沖便走。眾人追上，但也奈何不了向問天。兩人意氣相投，肝膽相照，結為兄弟。</p>\n<p>心理分析</p>\n<p>經常碰到有的人，意象中有乞丐或者孤兒之類的子人格，這些子人格的特點是自卑、脆弱、悲慘、可憐等。總之不是很自信的子人格，心理力量比較小。當來訪者的子人格中出現孤兒，而來訪者又認同於這個子人格時，表現在現實層面，來訪者會特別慘，特別可憐，讓人同情。我們說心理問題之所以影響人，主要是因為我們不知道，在不知道的情況下，就已經被心理問題影響，而且在現實層面還會有非常合理的理由，這是最麻煩的。它讓我們更加難以意識到自己有問題，不知道為什麼會出問題。</p>\n<p>令狐沖就有一個子人格是孤兒，因為他從小就是岳不群夫婦收養，他是沒有家的，只把岳不群夫婦看做養父養母。這是令狐沖的一個心結。任何一個心結，在沒有得到解決之前，所有的補償，都不可能替補，不能從根本上消除。令狐沖已經身為華山大弟子，武功高於所有的師弟師妹，又得師父愛戴，師孃疼愛，按道理說令狐沖已經該知足，該感到愉快了。事實上不是這樣的。自己是一孤兒的這一心結不解決，那有關身世的事，令狐沖永遠是感到自卑的，無論他武功多好，地位多高，師父師孃如何關愛，都無法彌補，因為所有的彌補都只是表層上的，不觸及內心深處。表面上的彌補越多，只會越多地增加內心深處的自卑，沒法滿足。這就是為什麼，令狐沖會因為林平之長得比自己帥，身世比自己好而感到自卑。儘管此時林平之不過是自己的小師弟，而且正處在家破人亡的悲慘境地。他的處境可能比令狐沖要悲慘得多，但這不影響令狐沖內心的自卑。</p>\n<p>令狐沖一直在受這個子人格影響，儘管他自己並不知道。存存心結的子人格，一般處於潛伏狀態，不經常出現，等到適當的時候，生活中碰到相關的事件，觸動這一情結，它就會及時表現出來。比如說孤兒的子人格，當生活中受到刺激，是跟孤兒的情結相關的，孤兒就會表現出來，甚至佔據主導人格的地位，讓來訪者的命運特別悲慘，處處受難，到處被困。令狐沖身上，最直接的影響，在林平之出現以後，逐步表現出來。林平之的身世，令狐沖沒法比，緊接著奪走了自己心愛的小師妹。令狐沖被拋棄了，孤兒最基本的心結當然就是被拋棄。被師妹拋棄，跟被父母拋棄，略有不同，但主題都是被拋棄，比較容易鉤起一個人的情結。師父師孃雖然疼愛自己，但畢竟是長輩，只有小師妹，才是令狐沖真正的感情依託。現在失去了，這是最致命的打擊。</p>\n<p>就在上一章節裡，令狐沖和盈盈在澗畔捉青蛙過夜的時候，還做了一個夢，是跟林平之和小師妹有關的。</p>\n<p>令狐沖在睡夢之中，忽覺正和嶽靈珊在瀑布中練劍，突然多了一人，卻是林平之，跟著便和林平之鬥劍。但手上沒半點力氣，拼命想使獨孤九劍，偏偏一招也想不起來，林平之一劍又一劍地刺在自己心口、腹上、頭上、肩上，又見嶽靈珊在哈哈大笑。他又驚又怒，大叫：“小師妹，小師妹！”叫了幾聲，便驚醒過來，聽到一個溫柔的聲音道：“你夢見小師妹了？她對你怎樣？”令狐沖兀自心中酸苦，說道：“有人要殺我，小師妹不睞我，還……還笑呢！”</p>\n<p>這個夢的意思非常直白，瀑布中練劍的細節，我們在前面的章節已經詳細分析過，顯然跟情愛有關。夢的意思之所以特別直接，因為小師妹在夢中的態度非常直接，可以理解為，在令狐沖潛意識深處認為，小師妹不但把自己拋棄了，而且在被劍刺的時候，小師妹不睬自己，反倒哈哈大笑。可見拋棄得夠徹底。在令狐沖眼中，林平之當然屬於正派人士，因此夢中的意思，與其說是被林平之刺，不如說是被他心目中的正派人物刺。這代表了他跟正派人物之間擺脫不了的糾葛，這種糾葛以後還會體現。夢中被刀劍之類的東西砍刺，是常見的閹割恐懼。他可能有過這樣一個恐懼情結，是跟父親，或者跟岳不群，或者說是跟正派人物之間的。他跟林平之鬥劍，是跟他心目中的正派人物鬥劍。結局是，他用不上勁，傷痕累累。這種正派人物對他的傷害，後來也不斷出現。</p>\n<p>令狐沖失戀之後，命運變得極富戲劇性，而又極度悲慘。所有人的初衷都是好的，都為了救令狐沖，但都特別緻命，差點沒把他害死。受傷之後，桃谷六仙為了救他，給他輸了六道真氣。不戒和尚為了救他，又給輸了兩道真氣，強行把桃谷六仙輸的六道壓了下去。但也就是暫時壓下去而已。從此以後八道真氣互相沖撞，把令狐沖整得死去活來。假如僅此而已，憑平一指這樣高明的醫術，還最終想出了挽救的辦法。偏偏非常不幸，祖千秋為了討好，又給令狐沖服了大補的珍貴藥材，令狐沖恰恰不適合大補。藍鳳凰傾慕令狐沖，給他輸了帶毒的血液，還喝下帶有劇毒的美酒。所有這些東西，都是極其罕見的名貴藥材，一般人想見都見不上，更不用說服用。令狐沖福氣大，什麼名貴的都遇上了，但都是跟藥理相沖突的。這害得平一指想到狂噴鮮血死亡，也沒有想出治療的辦法。至此，令狐沖的內傷不可救藥。最後的期限裡如果不喝酒，不動情，可能多活幾天。偏偏酒是令狐沖的至愛，不喝酒生活完全沒意義。最要命的是不動情，失去了最心愛的人，如何能不動心？</p>\n<p>有些哲學家喜歡把心理和生理完全分開，以為人的心理和生理是兩個相互獨立的世界，並行不悖。這在我們心理學家看來，顯然是不可能的。人的心理一定會影響到生理，最簡單的例子，一個心理非常健康的人很少得病，而一個人心理非常不健康的人，一副病態的樣子，病懨懨，見面就似乎能聞到腐屍的味道，那這個人一定是多病的，甚至是疾病纏身，陽光都見不了。一個人的情感壓抑過於厲害，他/她就會以生理的疾病表現出來，這種事情太普遍了。我們所有的心理分析經驗都可以證實，一個人在心理層面，潛意識裡有某種心理問題，它就會在現實層面出現相應的影響。令狐沖的命運變得那麼悲慘，而且是接二連三地撞上怪事，這在我們看來並不是偶然的。悲慘的命運不會隨便上身，偶爾上身，也不可能接連不斷，碰上的全是怪事，出入預料的怪事。如果一個人在生活中接連碰到倒黴事，而且不間斷，那麼我們通過心理分析，一定會發現一個相應的情結存在。纏繞他/她的，不是上天，或者某種不可抗拒的自然力，而是自身的一個情結。令狐沖不斷地身受內傷，這可能不是一個偶然的戲劇，而跟他可憐的子人格有關係。在這個心結得不到解決的時候，命運會玩笑般地纏繞他。孤兒有多可憐，命運就有多悲慘。孤兒可憐到無藥可救的話，這個玩笑就開大了。</p>\n<p>找出相應的那個情結之後，該怎麼辦？</p>\n<p>多數人在這種時候愛犯一個錯誤，錯誤就是急於去做點什麼，而現在正好是什麼都不用做的時候。心理問題只怕不知道，真正知道了以後，很多情況下，什麼都不用去做，自然會好。急於去做點什麼，可能恰好說明自知還不夠。因為另一個問題正在困擾你，困擾你的問題就是太急於去做點什麼。</p>\n<p>在治療原則上，這一點是意象對話和森田療法非常一致的地方。就比如我現在突然受傷，手被砍掉了一隻，我能急於去做什麼呢？我每天圍繞這隻手想了很多辦法，想破頭皮，無論怎麼苦苦思索；無論我因此做了多麼積極的努力，我的手也不會因此而長出來，再想它也只能這樣了。朱建軍老師有一個很好的例子，手破了，正在長疤，心急的人急於把疤給它掀掉；有經驗的人是讓它自己長。顯然，急於掀疤適得其反，不可能因此而加速長好，反倒是需要再長一次，直到自己癒合為止。</p>\n<p>很多神經症也是同樣的道理。急於解決一個問題，所以反覆想，不斷想，想這個問題到底怎麼解決。問題並不會因此而加速變好。相反，有些神經症病人，真正困擾他/她的問題變成了，忍不住要去想，甚至想解決的辦法取代了生活，來訪者什麼都做不了，只能整天不斷地想自己的問題怎麼辦。絲毫沒有誇張，有的人真的只能想這個問題，因此沒法正常生活。顯然，這種情況下，最好的治療辦法就是能讓他/她不去想。能做到不去想，問題自然解決。</p>\n<p>我的一個很有名的老師，是諮詢界的名醫，碰到這類病人會用一個比較狠的招。病人整天擔心她的手臂痠麻，肯定有治不了的大問題。去了很多醫院，做過很多檢查，又都查不出任何問題。來訪者說她什麼也做不了，超市買了十斤米，提到樓下就放著，不敢提，生怕把手臂提出毛病來。我老師告訴她，讓它麻去吧，下次直接提上去，死不了。死了我負責。下次真提上去了，人也沒死，手也沒壞，活得好好的，問題也沒了。</p>\n<p>可惜非常遺憾的是，這一原則被國內很多諮詢師用濫了，也用爛了。他們本身並不瞭解這一原則起作用的關鍵所在，簡單而錯誤地理解為，只要讓來訪者不去管就行了。這樣的諮詢師，往往很認真地做下一些筆記，或者教條，可以稱之為“語錄”，也有人美其名曰“治療原則”。來訪者來了以後，按條目進行，給來訪者講道理，比如說治療原則一，勸來訪者“順其自然”，不要去想自己有沒有問題，有什麼問題，都不要去管，不想它就沒事了。原則之二，“為所當為”，該幹什麼幹什麼去，多到戶外走走，多做點運動。這樣的做法顯然不會有效。叫他別想，他就能做到不想，那他就用不著來諮詢室找你了。這樣弱智的辦法你以為他自己不知道？太低估來訪者智力水平了。關鍵在於，他也不願意去想，但是忍不住要想，沒有辦法，所以才會形成困擾。再者，如果運動都能解決心理問題，諮詢公司就可以大關門了，與其做諮詢，還不如提倡全民健身運動。</p>\n<p>以上原則之所以有效，不在於對來訪者進行勸說，而在於幫助來訪者意識到，問題已經沒法改變，被逼上絕路了，想也沒用，再想也就那樣了。就像手斷了，你再想，它也就那樣，想也長不出一隻完整的手來。一旦來訪者自己真的意識到這一點，自動放棄，不再去管它了，問題也就自動解決。但關鍵是被逼上絕路，想辦法，幫他意識到，想是沒有用的，這是諮詢師要做的。勸說是達不到效果的。像上邊例子中的諮詢師，逼她去提十斤米，等於告訴她，你手有問題就有吧，想也沒用，也沒人同情你，讓她去嘗試，一旦做到了，就發現原來也沒啥問題（注：前提是，她在醫院做過醫學檢查，確實沒有問題）。</p>\n<p>令狐沖的例子，本章的一個細節，對他心結的處理起到了極為重要的作用，那就是被華山岳不群逐出師門。</p>\n<p>令狐沖隱隱感到大事不妙，雙手發顫，抽出信紙，看了一遍，真難相信世上竟有此事，又看了一遍，頓覺天旋地轉，咕咚一聲，摔倒在地。待得醒轉，只見身在方生大師懷中，令狐沖支撐著站起，忍不住放聲大哭。方生向道：“少俠何故悲傷？難道尊師有甚不測麼？”令狐沖將書函遞過，哽咽道：“大師請看。”方生接了過來，只見信上寫道：“華山派掌門岳不群頓首，書呈少林派掌門大師座前：猥以不德，執掌華山門戶。久疏向候，乃闋請音。頃以敝派逆徒令狐沖，稟性頑劣，屢犯門規，比來更結交妖孽，與匪人為伍。不群無能，雖加嚴訓痛懲，迄無顯效。為維繫武林正氣，正派請譽，茲將逆徒令狐沖逐出本派門戶。自今而後，該逆徒非復敝派弟子，若再有勾結淫邪、為禍江湖之舉，祈我正派諸友共誅之。臨書惶愧，言不盡意，析大師諒之。”方生看後，也大出意料，想不出什麼言語來安慰令狐沖，當下將書信交還方證，兄令狐沖淚流滿臉，嘆道：“少俠，你與黑木崖上的人交往，原是不該。”方證道：“諸家正派掌門人想必都已接到尊師此信，傳諭門下。你就算真上無傷，只需出得此門，江湖之上，步步荊棘，諸凡正派門下弟子，無不以你為敵。”令狐沖一怔，想起在那山澗之旁，盈盈也說過這麼一番話。此刻不但旁門左道之士要殺自己，而正派門下也是人人以己為敵，當真天下雖大，卻無容身之所；又想起師恩深重，師父師孃於自己向來便如父母一般，不僅有傳藝之德，更兼有養育之恩，不料自己任性妄為，竟給逐出師門，料想師父寫這些書信時，心中傷痛恐怕更在自己之上。一時又是傷心，又是慚愧，恨不得一頭便即撞死。他淚眼模糊中，只見方證、方生二僧臉上均有憐憫之色，忽然想起劉正風要金盆洗手，退出武林，只因結交了魔教長老曲洋，終於命喪嵩山派之手，可兄正邪不兩立，連劉正風如此藝高勢大之人，尚且不免，何況自己這樣一個孤立無援、卑不足道的少年？更何況五霸岡上群邪聚會，鬧出這樣大的事來？方證緩緩地道：“苦海無邊，回頭是岸。縱是十惡不赦的奸人，只需心存悔悟，佛門亦是來者不拒。你年紀尚輕，一時失足，誤交匪人，難道就此便無自新之路？你與華山派的關聯已然一刀兩斷，今後在我少林門下，痛改前非，再世為人，武林之中，諒來也不見得有什麼人能與你為難。”他這幾句話說得輕描談寫，卻自有一股威嚴氣象。令狐沖心想：此時我已無路可走，倘若託庇於少林派門下，不但能學到神妙內功，救得性命，而且以少林派的威名，江湖上確是無人敢向方證大師的弟子生事。</p>\n<p>在此之前，令狐沖雖然有孤兒情結，但情結並沒有完全顯現。他也知道自己有時候挺自卑，但問題沒有完全暴露。命運很悲慘，孤兒情結對他有很大影響，但其影響更多地屬於無意識。至此，情結已經完全暴露，令狐沖被逼上絕路了。這兒之所以大段引述原文，因為這幾段話從不同的側面很好地描述出，他現在處境到底有多悲慘，還零零散散反映令狐沖內心欲絕的悲痛，這種處境和他的悲痛，對於他心結的處理有極其重要的作用。</p>\n<p>過去被小師妹拋棄，又身受內傷，也還就僅限於私人情感。現在到極致了，不但被師父師孃拋棄，還被天下人拋棄。不但被正派中人拋棄，還連旁門左道之人都要殺自己。如果說過去自卑的令狐沖只是一個心結的話，那麼現在的他，成了一個真正意義上的，完完全全的孤兒。天下雖大，真的沒有他令狐沖容身的地方。</p>\n<p>令狐沖面臨一個很重大的選擇，方證、方生勸他留在少林修行，也不是完全不行，但未必是很好的辦法。人心理的成長，沒有場所的問題，哪兒都可以，什麼樣的災難與痛苦，都是機會，所有的磨難，都可能讓人成長。把少林寺當成避難所，從此以後不涉足武林，未必有用。尤其對於令狐沖這樣生性放蕩而又天賦很高的人，可能不太適合靜修，他更適合一些比較快速有效的，隨處領悟的成長方法。</p>\n<p>但便在此時，胸中一股倔強之氣，勃然而興，心道：“大丈夫不能自立於天地之間，靦顏向別派託庇求生，算什麼英雄好僅？江湖上千千萬萬人要殺我，就讓他們來殺好了。師父不要我，將我逐出了華山派，我便獨來獨往，卻又怎地？”言念及此，不由得熱血上通，口中乾渴，只想喝他幾十碗烈酒，什麼生死門派，盡數置之腦後，霎時之間，連心中一直念念不忘的嶽靈珊，也變得如同陌路人一般。</p>\n<p>令狐沖採取的面對方式，也不是那麼理想。因為顯然，他的面對方式還是帶有很大壓抑的。他在用非常倔強的，將生死置之度外的一個子人格，來應對現實，以此來壓抑和迴避那個被拋棄的孤兒。比較理想的狀況是，承認自己被拋棄的事實，但也用不著因此而逼自己獨來獨往。對嶽靈珊態度的改變，也是帶有壓抑的。他正在用冷漠來回避對嶽靈珊的愛。真正的面對，愛就愛唄，本來就愛，也用不著冷漠。</p>\n<p>正因為此刻仍然有壓抑，心結還沒能處理好，所以剛出了少林寺就會碰到廝殺，傷了很多人，包括正派的，也有魔教中人。這正好符合他用來壓抑的子人格的特點，管他正派邪派，要殺我就來殺好了，大丈夫何必託庇求生？當然現實層面上，他傷人有別的理由，是路見不平，拔刀相助，並非有意。這是常見的心理問題的表現方式，並不奇怪。在他個人的心理層面，出少林之後會跟各路人馬激烈爭鬥，是有心理原因的。被傷的人都有一個特點，是別人找上門來，不是他主動生事，因為他內心裡所認同的就是天下人要殺他，不是他要殺天下人。</p>\n<p>不是那麼理想，但對於他個人的健康而言，會比過去好多了。因為過去的影響都是無意識的，現在被逼上絕路了，無論承不承認，你令狐沖被天下人拋棄，已經成為事實。不想面對它也已經是事實。任何一個心理問題，都是數年，或者數十年積累的結果，不可能在瞬間立即從根本上解決。令狐沖的孤兒情結也不可能爆發出來就立即解決。但會比無意識的影響更好。短時期內，令狐沖還會一定程度糾纏於這個情結，或許還會有一段時間比較悲慘，但會逐漸好起來。至少，不會再像過去，莫名其妙，接連不斷地受內傷，多災多難。</p>\n</div>"},{"title":"第十七章　玩物","content":"<div>\n<p>第十七章　玩物</p>\n<p>故事梗概</p>\n<p>向問天帶令狐沖去見一個脾氣古怪的人，說是能治他的內傷。到得梅莊，令狐沖信口說出，畫中帶劍，是很高明的劍術。丹青生得意之作有人賞識，因此而接見了兩人。又看出丹青生是喝酒行家，丹青生號稱好酒、好畫、好劍三絕，又以酒為首。當下邀令狐沖喝上三百杯。有極品紹興女兒紅，當世也是首屈一指的，西域吐魯番的葡萄酒。據說吐魯番葡萄酒，運送中一旦顛簸就會出現酸味。丹青生的葡萄酒卻沒有酸味。是西域劍豪送了丹青生十桶三蒸三釀的一百二十年吐魯番美酒，用五匹大宛良馬馱到杭州，然後丹青生依法再加—蒸—釀，十桶美酒，釀成一桶。這美酒歷關山萬里而不酸，酒味陳中有新，新中有陳。令狐沖提議冰鎮來喝。</p>\n<p>丹青生請來二哥黑白子製冰，二哥愛棋，如丹青生愛酒。向問天給黑白子擺一失傳的棋局：劉仲甫的《嘔血譜》。黑白子只瞧得額頭汗水涔涔而下。向問天又打開一幅圖，“北宋範中立溪山行旅圖”。還有一幅書法，唐朝張旭的《率意帖》，這是三莊主禿筆翁的性命寶貝。</p>\n<p>向問天要求打一個賭，只要梅莊之中，有人勝得過令狐沖的劍法，這些東西盡數奉送。另外，還給他們大哥帶來《廣陵散》琴譜。輪番比劍，令狐沖巧勝三兄弟。</p>\n<p>心理分析</p>\n<p>聽過很多關於“竹林七賢”的故事，比如說酣歌縱酒，有的人一醉六十天。違背禮法，阮籍母親過世，他不但堅持下完棋，而且還吃肉喝酒。兵家女有才色，未嫁而死，阮籍不識其父兄，徑往哭之，盡哀而還。鄰家少婦頗有美色，阮籍曾經喝醉了就倒臥少婦身旁。有更離奇的，比如說，劉伶乘車，隨身帶一酒壺，一邊走一邊喝，僕人帶了掘挖工具，緊隨車後，什麼時候喝死了，就地埋之。阮咸喝酒要用手捧，豬群來飲，阮咸就與豬共飲。還有一些故事特別驚世駭俗，比如說有的人不穿衣服，赤身裸體，說是以天地房屋之類，作為床被衣服。這些故事大概是在唸初中的時候聽到的，當時就特別佩服“竹林七賢”，佩服他們挑戰世俗的勇氣。</p>\n<p>念高中的時候，讀到普魯斯特的《追憶似水年華》，覺得小說寫的真有創意，順便了解了一點作者的個人傳記，據說他把自己關在一個黑屋子裡，十五年不見客，還不見陽光，每天把窗簾拉得嚴嚴實實。十五年後，一部轟動文壇的作品誕生了，那就是《追憶似水年華》。讀完之後高度佩服作者的寫作精神，立志以他為榜樣，將來閉門寫作，用一輩子的精力，寫一部驚世駭俗的作品。</p>\n<p>通過幾年的心理分析，我發現自己其實是有巨大壓抑的。而這類壓抑不止我一個人有，中國的知識分子大部分都有，幾乎可以說是通病。這種通病的起源，恰好主要也就是在魏晉南北朝。當酒還僅僅是一種高尚的精神追求時，品點酒，當做一種精神修養，陶冶情操，並沒有什麼壞處，精神壓力大的時候喝點酒，暫時緩解壓力，也還不是什麼壞事，甚至可以說是很好的事情，正常人都會有精神追求，也都有時候需要緩解壓力。但是，當酒成為一種麻痺精神的工具，藉以迴避情感，逃避現實，整天沉迷於醉酒時，它就不是什麼好事。一定意味著主人公內心有某種沒法面對的消極情緒，需要回避。而回避一定不是處理消極情緒的好方法。特別是當這種迴避以某種崇高的精神追求作為掩飾時，它會讓我們誤以為自己的追求真的很崇高，造成更大的壓抑，對健康特別不利。如果給這樣的知識分子做意象對話，拆解子人格，會發現有一個“神仙”，或者“世外高人”之類的子人格。它們不食人間煙火，過著清淨幽雅的田園生活。更庸俗一點的，手裡還提個酒壺，四處漂泊，醉酒為樂。有這樣的子人格，不是說就不好。這些子人格多半會有它超脫世俗的一面，而且通常還有過人的智慧，它可以讓我們有高的精神追求，不拘泥世俗，還可以在很多時候給我們智慧的啟發，顯然對健康生活有利。關鍵在於，這個子人格多半是假的。如果是神仙，多半是假神仙。如果是世外高人，那也是假的世外，假的高人。真正健康的神仙，或者世外高人，我們在心理分析中至今沒有遇到過。可能遇到最高境界的，也就半真半假而已。</p>\n<p>歷史上也極為罕見，老子肯定是一個，莊子也能算一個。就筆者瞭解的範圍，暫時還沒有發現。如果這個子人格是假的，它並不能真的讓我們的生活超脫世俗，只能從表面上，讓我們看起來與眾不同，其實內心是壓抑的，痛苦的。比如說，對於莊子這樣大解脫的人，妻子死了，他高興，那是真的高興，你找不到任何造作的嫌疑；阮籍的母親死了，他照樣下棋，照樣吃肉喝酒，表面看來跟莊子特別像，因為對人死好像都滿不在乎，但區別就在於，阮籍心裡未必真的很舒服。如果本來境界還沒到，母親死了自己心裡難受才正常，只因為要以莊子為榜樣，所以裝得不在乎，那這就是壓抑。壓抑一定不會讓我們因此而變得更加解脫，只會給自己積累更多的消極情緒。真正的解脫，一定是通過智慧的啟迪，而不是通過壓抑就能做到。</p>\n<p>當人把所有的生命力壓抑，轉而專注到一個旁枝末節的細微處時，的確可以在這個領域表現出過人之處，有時候還表現出超常的創造性。剛上大學時，看到認知心理學的一些研究論文，特別佩服，居然有人可以把論文寫成這樣，讓我一個字也看不懂。而一個顯微鏡才能發現的小課題，有人居然能研究一輩子。幾年之後我就開始改觀，很多論文裡研究的成果，當我真正讀懂了以後，排開那些非正常人能懂的專業術語，整篇論文表述了一個簡單的常識，只要是個智商超過75分的人，不用任何研究就可以知道結論。</p>\n<p>想起清朝人特別愛玩的那個什麼鼻菸壺之類，小菸袋極為精巧，圖案極為花哨，剛一看讓人驚歎，首先想到的一個詞語就是鬼斧神工，很難相信那是人做的。再仔細看歷史就會發現清朝人活得特別猥瑣。中國人身上那種大度的氣概，舒展的生活基本上找不到了，精神面貌被壓抑得變形。</p>\n<p>梅莊四莊主，一看都生活得極為高尚幽雅，美酒是精心釀製的極品；研究的棋局，都是近乎不可破解的奇招，一般的他不感興趣；玩賞的字畫，都是失傳已久的珍品；老大玩音樂，也已經到了極高的境界，非常人所能及。但閱讀後面的章節，就會發現四位莊主的生活一點都不舒心，完全不是表面上那麼高雅。像被人幽禁，精神上受到巨大的摧殘。</p>\n</div>"},{"title":"第十八章　天生的王者","content":"<div>\n<p>第十八章　天生的王者</p>\n<p>故事梗概</p>\n<p>梅莊大莊主黃鐘公跟令狐沖比劍，用的是“七絃無形劍”的上乘內力，偏偏令狐沖內力已失，黃鐘公的內力對令狐沖就毫無作用。</p>\n<p>梅莊之中沒有劍法勝得過令狐沖的，但又垂涎向問天手中寶物，無奈之下決定請關在牢底的任先生出馬。這正好是向問天精心策劃比劍的真正目的，讓令狐沖在比劍的時候把一個紙團遞給任先生，紙團中有一枚硬物。四莊主想用激將法激任先生出手比劍，任先生一聽便知，完全識破四莊主的伎倆。但詳細詢問之後，發現比劍的確實是一位值得較量的高手，而且是風清揚“獨孤九劍”的傳入，所以要領教領教。收到令狐沖手中的紙團，任先生激動得身子微微發顫。拆解數十招，令狐沖依然得心應手。任先生突然一聲石破天驚的狂嘯，把令狐沖震暈，昏倒在地。</p>\n<p>心理分析</p>\n<p>王者是集體無意識的一個原型，人所共有的。如果有的人是王者原型佔據人格主導，或者說王者的心理力量非常強大，那他就會成為天生的王者。這是一種先天的氣質，是內在氣質自然的外現，多半不是靠後天刻意的訓練就能模仿到的。天生的王者慷慨、大度、驕傲、自信、專橫，有時還帶點殘暴，極具領導風範。李世民就是最典型的，天生的王者。</p>\n<p>如果用一種動物來代表王者原型，最符合的就是獅子。獅子跟老虎相比，力量都很大，也都很率性，但獅子還具有一些特點，是老虎不具備的。比如說獅子很合群，老虎就做不到這一點。這種性格上的特點還真不是人為的就能任意改變，筆者就是一老虎型的人，喜歡安靜，沒事喜歡自己待著，有時候自己心裡也很羨慕別人能很隨意地玩到一起，自己也特別期望能自在地跟人交往，玩耍，但還就是做不到。只要往那一站，別人馬上就能感覺到你是個安靜的人，不適合酒吧等熱鬧的場合。在一起玩著的時候，你就是有意放開來玩，別人也會感覺不大對勁。獅子型的人這方面就有獨特的天賦，只要他一到場就自然有一種開朗、豁達、坦率的氣氛，是喝酒的最佳對象。</p>\n<p>獅子有很強的領導能力，老虎也有很強大的力量，但老虎就不會領著一群小老虎到處跑，獅子才能團結起來，走到哪兒都是一群一群的。可能是因為自身力量就很強大，加上高度的自信，獅子天生就有很強的容忍性，不太容易像小型動物一樣嫉妒。王者也一樣，能容忍異己，儘管有時候極端憤怒，但多半能自己剋制。有一件很著名的事情：</p>\n<p>魏徵常對唐太宗的一些不當的行為和政策，直截了當地當面指出，併力勸他改正，唐太宗對他頗為敬畏，常稱他是“忠諫之臣”。但有時在一些小事上魏徵也不放過，讓唐太宗常覺得面子上過不去。一次，唐大宗興致突發，帶了一大群護衛近臣，要去郊外狩獵。正待出宮門時，迎面遇上了魏徵，魏徵問明瞭情況，當即對唐太宗進言道：“眼下時值仲春，萬物萌生，禽獸哺幼，不宜狩獵，還請陛下返宮。”唐太宗當時興趣正濃，心想：“我一個富擁天下的堂堂天子，好不容易抽時間出去消遣一次，就是打些哺幼的禽獸又怎麼樣呢？”於是請魏徵讓到一旁，自己仍堅持這一次出遊。魏徵卻不肯妥協，站在路中堅決攔住唐太宗的去路，唐太宗怒不可遏，下馬氣沖沖地返回宮中，左右的人見了都替魏徵捏一把汗。</p>\n<p>唐太宗回宮見到了長孫皇后，猶自義憤填膺地說：“一定要殺掉魏徵這個老頑固，才能一洩我心頭之恨！”長孫皇后柔聲問明瞭原由也不說什麼，只悄悄地回到內室穿戴上禮服，然後面容莊重地來到唐太宗面前，叩首即拜，口中直稱：“恭祝陛下！”她這一舉措弄得唐太宗滿頭霧水，不知她葫蘆裡賣的什麼藥，因而吃驚地問：“何事如此慎重？”長孫皇后一本正經地回答：“妾聞主明才有臣直，今魏徵直，由此可見陛下明，妾故恭祝陛下。”唐太宗聽了心中一怔，覺得皇后說得甚是在理，於是滿天陰雲隨之而消。魏徵也就得以保住了他的地位和性命。</p>\n<p>從性格特點上分析，這件事情發生在李世民身上一點都不奇怪，身邊有那麼多敢於直言的忠臣，會有衝突，但李世民能容忍，還能化解，這就是王者風範。也只有他這樣的人，才能在自己門下招攬那麼多賢臣，忠心耿耿。其實王者除了上面提到的這些素質，還有一項非常重要的天賦，那就是對人心的洞察。聽我的老師，一位歷史學家分析，李世民在多次重大戰役中，行的都是險招，讓人難以理解。但事實證明他每次都是對的。大凡優秀的領袖，或者軍事天才，一定對人心有極強的洞察能力，從非常非常細微的線索就能做出極準確的判斷，甚至很多時候沒有任何線索，但就是能判斷，而且是準確的判斷。</p>\n<p>任我行這個人對人心也有極好的洞察力，他一句話道破岳不群的假面具，對嶽夫人的評價也很到位，不僅限於這些，他對別人心理活動也是瞭如指掌。</p>\n<p>黃鐘公道：“先前我們只道當今之世，劍法之高，自以任先生為第一，豈知大謬不然。今日有一人來到梅莊，我們四兄弟固然不是他的敵手，任先生的劍法和他一比，那也是有如小巫見大巫了。”令狐沖心道：“原來他是以言語相激，要那人和我比劍。”那人哈哈大笑，說道：“你們四個狗雜種鬥不過人家，便激他來和我比劍，想我替你們四個混蛋料理這個強敵，是不是？哈哈，打的倒是如意算盤，只可惜我十多年不動劍，劍法早已忘得乾乾淨淨了。操你奶奶的王八恙子，夾著尾巴快給我滾吧。”令狐沖心下駭然：“此人機智無比，料事如神，一聽黃鐘公之言，便已算到。”禿筆翁道：“大哥，任先生決不是此人的敵手。那人說梅莊之中無人勝得過他，這句話原是不錯的。咱們不用跟任先生多說了。”那姓任的喝道：“你邀請有什麼用？姓任的難道還能為你們這四個小雜種辦事？”秀筆翁道：“此人劍法得自華山派風請揚老先生的真傳。大哥，聽說任先生當年縱橫江湖，天不怕，地不怕，就只怕風老先生一個人。任先生有個外號，叫什麼‘望風而逃’。這個‘風’字，使是指風清揚老先生而言，這話可真？”那姓任的哇哇大叫，罵道：“放屁，放屁，臭不可當。”丹青生道：“三哥錯了。”禿筆翁道：“怎地錯了？”丹青生道：“你說錯了一個字。任先生的外號不是叫‘望風而逃’，而是叫‘聞風而逃’。你想，任先生如果望見了風老先生，二人相距已不甚遠，風老先生還容得他逃走嗎？只有一聽到風老先生的名字，立即拔足便奔，急急如喪家之犬……”禿筆翁接口道：“忙忙似漏網之魚！”丹青生道：“這才得保首領，直至今日啊。”那姓任的不怒反笑，說道：“四個臭混蛋給人家逼得走投無路，無可奈何，這才想到來求老夫出手。操你奶奶，老失要是中了你們的詭計，那也不姓任了。”</p>\n<p>心理學家，尤其是精神分析心理學家，的確會對人的心理有很深的洞察，比較清楚別人內心的心理活動，多數時候知道的不是別人怎麼想，是知道別人內心的潛意識動機，知道行為背後的情緒反應，但也有一些時候，可能知道別人的想法，只是比較少見。境界更高的，像老子，孔子這樣一些聖賢，對人心有更深的洞察，即使完全知道別人的內心，也並不奇怪。但是，同樣是對人心的洞察，聖賢和王者還是有區別的。</p>\n<p>區別在於包容性的問題。這裡說的包容性，跟上面說的容忍性，不是一回事。容忍性是一種能力，包容性是一種品質。我們心理學在鍛鍊洞察力的同時，特別注重的一個東西就是包容性。洞察力加強了，一定要有相應的包容性同步。光有洞察力，沒有相應的包容性，就會走偏。輕者讓人畏懼，覺得你的眼光太有穿透力，能看穿別人，眼神比較恐怖；重者，以看穿別人的內心為樂，自認為高明，加以利用，那就成為邪教了。一個修為比較高的人，不會以看穿別人為樂趣，因為那不是最終目的，不是我們感興趣的。增強洞察力只是為了更準確地找出心理問題，以便做正確的處理。修為高的人能洞察你，但不會讓你感到畏懼，不會覺得被人看穿，相反，他/她能給你提供安全感，增加支持，覺得有人能理解你。</p>\n<p>比如一個人得了癌症，沒見過的人覺得可怕，敬而遠之，那麼這種時候知道別人的病症是有害的。換了一個癌症病專家，每天接觸的都是癌症病人，碰到的時候他就不會覺得有多可怕，自然用不著疏遠，這就會給病人提供一股支持的力量，有人不但熟悉自己的病症，而且不覺得可怕，多少能讓病人看到些希望。所有的心理問題也都是這個道理。沒見過的，看到別人有心理問題就覺得很恐怖；而我們整天做的都是這個，見多了，不覺得有什麼奇怪。正常人身上我們也能輕鬆地發現一些心理問題，但我們不會覺得可怕，正常人身上帶一點小問題，就像正常人都會高興，都會悲傷一樣正常，能夠接受，不用疏遠，這就是所謂的包容性。包容性到了，你不會用發現別人的問題來炫耀，更不會歪加利用。</p>\n<p>任我行是個挺特別的人，武術天分奇高，我們上邊談論的王者的天賦，他幾乎都有。驕傲，自信，大度，慷慨，專橫，殘暴。只不過自信得比較過分，說自負更妥當。但一定程度的自負，恰好也是一個王者不能缺的素質。雖然專斷，但他其實也有合群的一面，很豁達，對朋友，對英雄好漢，有他很豪邁的一面，否則就不會有那麼多人忠心耿耿了。不過能讓他看得起的人，確實不多。還有一項很重要的天賦，就是對人心的洞察，連東方不敗那樣的人，都被他輕鬆玩弄於手心。因此可以說，任我行是個特別具有領導天賦的人，是個天生的王者，能人所不能。但我們知道他並不是一個一流的領導，關鍵就在於包容性的問題。他有統治者的專斷和蠻橫，有王者的自信和大度，卻沒有聖賢的包容性，生活在他身邊，高度缺乏安全感。有天生的王者風範，有對人心深刻的洞察，卻沒有相應的包容性，沒有聖賢的道德修為，這可能也就是為什麼，李世民只能做一個優秀的政治家、軍事家，一個天才的王者，卻不能算是完人。</p>\n</div>"},{"title":"第十九章　地牢裡","content":"<div>\n<p>第十九章　地牢裡</p>\n<p>故事梗概</p>\n<p>令狐沖醒過來，發現自己被困在地牢裡，每天有一個聾啞人送飯，說不上話，弄不清楚怎麼被困，只是胡思亂想。摸到床上鐵板刻滿了字跡，密密麻麻。是任我行刻下的“吸星大法”，無意中試練，竟能化解體內真氣，依法修習。黑白子把自己當成是任先生，前來求取大法秘訣，只要答應傳授秘訣，就能放自己出去。</p>\n<p>真氣已化去六七成，黑白子又來以酒肉換取秘訣，接木盤的瞬間被令狐沖抓住，吸星大法吸走了黑白子的內力。用力一拉，整個身子都從方孔中鑽了進來。令狐沖因此找到脫身的辦法，換上黑白子的衣服，從方孔中鑽了出去。</p>\n<p>走出地道，黃鐘公、禿筆翁、丹青生三人正圍在周圍。令狐沖一個虛招把人晃開，發足狂奔，奔到一處無人的山野，離城已遠。</p>\n<p>心理分析</p>\n<p>真誠的反思本身能起到一些心理治療的效果，對心理健康是非常有利的。基督教有一種常見的修煉辦法，就是定時到教堂進行懺悔，這是一種很有效的辦法。其實對著誰懺悔不是最重要的，最終起到作用的，是對自己的懺悔。不是教父給了你神的力量，是你對自己開放了內心，加強了面對的心理力量。</p>\n<p>所有的心理問題，最終要解決的，都是對自己造成的影響。即使顯然是別人對自己造成了傷害，最終要處理的也還是自己。既定的事實是沒法改變的，但它印在我們心靈上的痕跡是可以改變的。這種改變不是塗抹，而是通過再次的面對，把消極情緒宣洩之後，真正弄明白了造成傷害的原因，開悟了，傷痕就會自動消除。</p>\n<p>最徹底的處理是完全弄明白，相當於得到智慧之光的啟迪，完全解決問題。也有一些處理，不是那麼徹底，但的確能起到一定的效果，處理生活中的一些簡單問題時，還是可以用的。經常用一下，對我們的心理健康有好處，至少，它一定不會有壞處。比如說懺悔。有很多常見的小問題，它之所以困擾我們，是因為我們缺乏面對的勇氣。隨便舉個例子來說，小的時候，有一次，我偷姐姐的100塊錢。以後就一直特別害怕，特別擔心，擔心有一天姐姐知道了，不知道會有多嚴重的後果。所以我小心謹慎，凡是提到相關的話題，我立即避開。自己也特別迴避這件事，每次回想到的時候，馬上就去想另一件事，換個主題，特別不願意回想，像隱藏一個見不得人的秘密，小心翼翼地把它保護起來，根本不敢碰到。這樣做顯然很累人，特別耗費心理能量。</p>\n<p>保護了多年，終於受不了了，最後下定決心，向姐姐坦白，才知道姐姐對這件事情毫不在乎，根本沒放在心上，她說，當時那100塊錢就是給我準備的，後來看我拿了，以為我知道是給我的禮物，所以也就沒管了。</p>\n<p>很顯然，這個心理問題並不在於事件本身，而在於我自己的一點小小的誤會，可惜我把這個誤會獨自承擔，忍受了多年。就我本身，心理問題也是雙重的，既有羞愧，又有對羞愧的擔心。本來後者是次要的，後來我把它複雜化了，反而是次要的東西成了主要的困擾。它跟姐姐是否會怪罪已經沒有很直接的關係，姐姐要怪罪，我會擔心；即使不怪罪，我也會擔心。所以問題成了我自己的擔心，而這個擔心是多餘的。我首先要解決這個擔心，才有
